questions:
  - id: speech-html-semantics-001
    level: junior
    tags: [semantics, accessibility]
    question: |
      Зачем нужна семантическая вёрстка?
    answer: |
      Семантическая вёрстка — это выбор тегов по смыслу, а не по внешнему виду: `<button>` для действия, `<a>`
      для перехода, `<nav>` для навигации, `<main>` для основного содержимого, `<article>` для
      самостоятельного блока, заголовки `<h1>`–`<h6>` по уровням. Выглядеть всё это может как угодно —
      оформление делает CSS.

      Главная причина — доступность. Скринридеры строят по тегам карту страницы: пользователь может
      перепрыгнуть к навигации, к основному содержимому, пройтись по заголовкам. `<button>` из коробки
      получает фокус с клавиатуры, нажимается Enter и пробелом и объявляется как кнопка. Если сделать кнопку
      из `<div onClick>`, всё это придётся воспроизводить вручную через `tabindex`, `role` и обработчики
      клавиш, и обычно что-то забывают.

      Вторая причина — поисковики и другие роботы: им проще понять структуру страницы и выделить главное.
      Третья — поддержка кода: по `<header>`, `<aside>` и `<footer>` сразу видно, что где, в отличие от
      десятка вложенных `<div>`. И бонус — встроенное поведение: `<form>` отправляется по Enter, если в ней
      есть кнопка отправки, `<details>` раскрывается без JavaScript, `<dialog>` даёт модальное окно с фокусом
      и закрытием по Esc.
    points:
      - Теги по смыслу, а не по внешнему виду
      - Доступность — карта страницы для скринридеров, клавиатура
      - Нативные элементы дают поведение бесплатно, div — нет
      - Поисковики лучше понимают структуру
      - Код легче читать; встроенное поведение form, details, dialog
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/Semantics#semantics_in_html
    source: own
