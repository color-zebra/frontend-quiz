topic: css
subtopic: cascade
questions:
  - id: speech-css-cascade-001
    level: middle
    tags: [cascade, specificity, layers, inheritance]
    question: |
      Как браузер решает, какое правило CSS применить к элементу?
    answer: |
      Если к элементу подходят несколько объявлений одного свойства, браузер выбирает одно по алгоритму
      каскада. Критерии идут по очереди, и следующий смотрится, только если по предыдущему ничья.

      Первый — происхождение и важность. Есть стили браузера, пользователя и автора сайта. Обычные стили
      автора сильнее браузерных, а с `!important` порядок переворачивается. Дальше инлайн-стили в атрибуте
      `style` сильнее стилей из таблиц. Потом каскадные слои `@layer`: стили вне слоёв сильнее любых слоёв, а
      между слоями побеждает объявленный позже. Это удобный способ поставить сброс и библиотеки «ниже» своих
      стилей без борьбы специфичностей.

      Затем специфичность селектора — тройка: id, классы с атрибутами и псевдоклассами, типы с
      псевдоэлементами. Один id сильнее любого числа классов. `:is()` и `:not()` берут самый специфичный
      аргумент, а `:where()` всегда даёт ноль. И если всё равно ничья, побеждает правило, которое объявлено
      позже.

      Если же объявлений нет вовсе, работает наследование: `color`, `font` и другие текстовые свойства берутся
      у родителя, остальные получают начальное значение. Управлять этим помогают `inherit`, `initial`, `unset`
      и `revert`.
    points:
      - Каскад сравнивает критерии по очереди до первого различия
      - Происхождение и !important, затем инлайн-стили, затем слои @layer
      - Специфичность — id, классы, типы; :where() даёт ноль
      - При полной ничьей побеждает правило, объявленное позже
      - Без объявлений — наследование или начальное значение
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/Cascade
      - https://developer.mozilla.org/en-US/docs/Web/CSS/Specificity
    source: own
