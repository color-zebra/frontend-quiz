questions:
  - id: speech-react-context-001
    level: middle
    tags: [context, state-management]
    question: |
      Когда стоит использовать контекст, а когда — стейт-менеджер?
    answer: |
      Контекст — это способ доставки данных, а не хранилище. Он решает проблему пропсов, которые приходится
      протаскивать через десяток уровней. Хранит данные по-прежнему `useState` или `useReducer` где-то
      наверху, а контекст лишь делает их доступными глубже.

      Он отлично подходит для редко меняющихся глобальных вещей: тема, язык, текущий пользователь, настройки,
      зависимости вроде клиента API. Проблемы начинаются с частыми изменениями. Любое изменение `value`
      рендерит всех потребителей, даже если им нужна одна маленькая часть объекта, и `memo` от этого не
      спасает. Можно делить контекст на несколько и мемоизировать `value`, но на большом приложении это
      становится ручной работой.

      Стейт-менеджер — Redux Toolkit, Zustand, Jotai — нужен, когда состояние большое, часто меняется и его
      читают многие компоненты. Там есть подписка на часть состояния через селекторы: компонент рендерится,
      только если изменились его данные. Плюс инструменты отладки, middleware, понятная структура для команды.

      И отдельно: данные с сервера обычно хранят не там и не там, а в библиотеках вроде TanStack Query или RTK
      Query — они берут на себя кэш, повторные запросы и инвалидацию.
    points:
      - Контекст доставляет данные, хранит их useState или useReducer
      - Подходит для редко меняющихся данных — тема, язык, пользователь
      - Изменение value рендерит всех потребителей, memo не спасает
      - Стейт-менеджер — подписка через селекторы, отладка, структура
      - Серверные данные — в TanStack Query или RTK Query
    links:
      - https://react.dev/learn/passing-data-deeply-with-context#before-you-use-context
    source: own
