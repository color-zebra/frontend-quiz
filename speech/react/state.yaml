questions:
  - id: speech-react-state-001
    level: junior
    tags: [snapshot, batching, functional-update]
    question: |
      Почему после `setState` значение в той же функции остаётся старым?
    answer: |
      Потому что состояние в React — это снимок конкретного рендера. Каждый рендер — отдельный вызов функции
      компонента, и `useState` возвращает значение для этого вызова. Внутри него `count` — обычная константа,
      и обработчики, созданные в этом рендере, видят именно её.

      Вызов `setCount(count + 1)` не меняет переменную. Он ставит обновление в очередь и просит React
      отрендерить компонент заново. React дождётся конца обработчика, объединит все обновления в один рендер —
      это батчинг, — и уже в новом вызове компонента `useState` вернёт новое значение.

      Отсюда два практических следствия. Если вызвать `setCount(count + 1)` три раза, получится плюс один, а
      не три: все три вызова посчитаны от одного снимка. Для таких случаев есть функциональное обновление
      `setCount((c) => c + 1)` — React применит функции по очереди к актуальному значению. А если новое
      значение нужно сразу, например чтобы отправить его на сервер, его кладут в локальную переменную: `const
      next = count + 1; setCount(next); save(next)`.
    points:
      - Состояние — снимок рендера, внутри рендера это константа
      - Сеттер ставит обновление в очередь, а не меняет переменную
      - Батчинг — несколько обновлений, один рендер
      - Функциональное обновление считает от актуального значения
      - Нужное сразу значение кладут в локальную переменную
    links:
      - https://react.dev/learn/state-as-a-snapshot
      - https://react.dev/learn/queueing-a-series-of-state-updates
    source: own
