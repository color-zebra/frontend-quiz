questions:
  - id: speech-react-effects-001
    level: middle
    tags: [useEffect, cleanup, dependencies]
    question: |
      Расскажи о жизненном цикле эффекта и функции очистки.
    code: |
      useEffect(() => {
        const connection = createConnection(roomId);
        connection.connect();
        return () => connection.disconnect();
      }, [roomId]);
    codeLang: jsx
    answer: |
      Эффект нужен, чтобы синхронизировать компонент с чем-то вне React: подключиться к чату, подписаться на
      событие, запустить таймер. Удобнее думать не о «жизненном цикле компонента», а о двух действиях: начать
      синхронизацию и остановить её.

      Эффект запускается после того, как React применил изменения к DOM, — обычно уже после отрисовки кадра.
      Функция, которую эффект вернул, — очистка. React вызывает её в двух случаях: перед следующим запуском
      эффекта, со старыми значениями, и при размонтировании компонента.

      Когда эффект перезапускается, решает массив зависимостей. Без массива — после каждого рендера. Пустой
      массив — один раз после монтирования. Со значениями — когда хоть одно изменилось. В примере при смене
      `roomId` React сначала отключит старое соединение, потом подключит новое. В зависимостях должно быть
      всё, что эффект читает из пропсов и состояния, — это проверяет линтер.

      В разработке со StrictMode React при монтировании прогоняет цикл «эффект — очистка — эффект». Это
      проверка, что очистка полностью отменяет эффект. Если из-за этого что-то ломается, значит, очистки не
      хватает.
    points:
      - Эффект — синхронизация с внешней системой
      - Запуск — после коммита и отрисовки
      - Очистка — перед повторным запуском и при размонтировании
      - Зависимости определяют перезапуски, их проверяет линтер
      - StrictMode в разработке проверяет очистку двойным циклом
    links:
      - https://react.dev/learn/lifecycle-of-reactive-effects
      - https://react.dev/reference/react/useEffect
    source: own
