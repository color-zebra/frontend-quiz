questions:
  - id: speech-react-keys-001
    level: junior
    tags: [key, index-key]
    question: |
      Зачем React нужны ключи и чем плох индекс массива в роли ключа?
    answer: |
      Когда список меняется, React должен понять, какой элемент нового списка соответствует какому из старого.
      Без подсказки он сопоставляет по порядку: первый с первым, второй со вторым. Ключ — это подсказка:
      элементы с одинаковым `key` считаются одним и тем же элементом, и React сохраняет у него состояние и
      DOM-узел, просто переставляет или обновляет.

      Индекс плох тем, что он привязан к позиции, а не к данным. Пока список статичный, разницы нет. Но если
      удалить первый элемент, бывший второй получает индекс 0 и для React становится «первым» — с его
      состоянием. Введённый в поле текст, отмеченная галочка, раскрытый блок оказываются не у того элемента. А
      при вставке в начало React не вставит один новый узел, а обновит содержимое каждого элемента и
      смонтирует новый в конце списка.

      Хороший ключ — стабильный идентификатор из данных: `id` из базы, slug, UUID, созданный при добавлении.
      Уникальным он должен быть только среди соседей. И ключ полезен не только в списках: если сменить `key` у
      компонента, React создаст его заново, — так удобно сбрасывать состояние формы при смене пользователя.
    points:
      - Ключ сопоставляет элементы между рендерами
      - Тот же ключ — сохраняются состояние и DOM
      - Индекс привязан к позиции, при вставке и удалении состояние уезжает
      - Ключ — стабильный id из данных, уникальный среди соседей
      - Смена key у компонента сбрасывает его состояние
    links:
      - https://react.dev/learn/rendering-lists#keeping-list-items-in-order-with-key
    source: own
