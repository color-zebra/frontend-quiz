questions:
  - id: speech-react-memo-001
    level: middle
    tags: [memo, useMemo, useCallback]
    question: |
      Когда мемоизация в React бесполезна или даже вредна?
    answer: |
      Мемоизация не бесплатна: на каждом рендере React сравнивает зависимости или пропсы и хранит прошлые
      значения в памяти. Если сам рендер дешёвый, это сравнение может стоить столько же, сколько он, а код
      становится сложнее.

      Чаще всего она бесполезна, когда цепочка не замкнута. `useCallback` для функции, которую передают в
      обычный компонент без `memo`, ничего не даёт: ребёнок всё равно отрендерится вместе с родителем. И
      наоборот, `memo` у ребёнка не поможет, если родитель каждый раз передаёт новый объект `{ ... }` или
      стрелку `() => ...` в пропсах. Ещё один случай — `memo` у компонента, который читает часто меняющийся
      контекст: контекст обходит `memo`.

      Вредна она, когда скрывает ошибки или мешает. Неправильные зависимости `useMemo` дают устаревшие
      значения, которые трудно отловить. А мемоизация «на всякий случай» везде загромождает код.

      Мой подход: сначала писать без мемоизации, а при проблеме с производительностью — смотреть профайлер и
      начинать с архитектуры: опустить состояние ниже, передавать тяжёлые части через `children`. А в проектах
      с React Compiler ручная мемоизация чаще всего не нужна вовсе: компилятор делает её сам.
    points:
      - Мемоизация стоит сравнений и памяти
      - useCallback без memo-получателя ничего не даёт
      - memo ломают новые объекты и функции в пропсах и контекст
      - Неверные зависимости дают устаревшие значения
      - Сначала профайлер и архитектура, React Compiler делает это сам
    links:
      - https://react.dev/reference/react/memo#should-you-add-memo-everywhere
      - https://react.dev/reference/react/useMemo#should-you-add-usememo-everywhere
    source: own
