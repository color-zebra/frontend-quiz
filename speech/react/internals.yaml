  - id: speech-react-internals-001
    level: middle
    tags: [fiber]
    question: |
      Что такое Fiber и зачем его ввели?
    answer: |
      Fiber — это архитектура ядра React, на которую перешли в React 16. До неё рендер был рекурсивным: React
      вызывал компоненты сверху вниз и не мог остановиться, пока не обойдёт всё поддерево. Если обновление
      было большим, оно занимало десятки миллисекунд, и всё это время браузер не обрабатывал ввод и не рисовал
      кадры — интерфейс подвисал.

      Fiber разбил работу на маленькие единицы — по одной на элемент дерева. Каждая единица описывается
      Fiber-узлом: в нём тип компонента, пропсы, состояние хуков, ссылки на родителя, ребёнка и соседа. Дерево
      обходится не рекурсией, а циклом по этим ссылкам, поэтому React может остановиться, запомнить текущий
      узел, отдать управление браузеру и продолжить позже. Или выбросить работу и начать заново, если пришло
      что-то срочнее. Важная оговорка: в React 16 эту возможность только заложили, а рендер по-прежнему шёл
      целиком. Уступать браузеру React начал с конкурентных возможностей React 18.

      Чтобы это было безопасно, React держит две версии дерева: текущую, которая на экране, и черновую, над
      которой работает. Пока черновик не готов, пользователь видит целый старый интерфейс. Когда готов —
      коммит одним проходом применяет изменения к DOM.

      На этой основе построено всё современное: приоритеты обновлений, переходы, `useDeferredValue`, Suspense,
      выборочная гидратация, `<Activity>`.
    points:
      - Старый рендер был рекурсивным и непрерываемым
      - Fiber делит работу на единицы, по одной на элемент дерева
      - Обход по ссылкам можно приостановить, продолжить или выбросить
      - Две версии дерева — текущая и черновая, коммит одним проходом
      - Основа для приоритетов, переходов, Suspense
    links:
      - https://github.com/acdlite/react-fiber-architecture
    source: own

  - id: speech-react-internals-002
    level: senior
    tags: [fiber, bailout, state]
    question: |
      Что хранит Fiber-узел и как React понимает, какую часть дерева можно не перерисовывать?
    answer: |
      Fiber-узел — внутренняя запись React об одном элементе на экране. В нём тип и ключ, текущие пропсы,
      состояние хуков в порядке вызова, очередь ещё не применённых обновлений, ссылки на родителя, первого
      ребёнка и соседа, для DOM-элементов — ссылка на настоящий узел, и пометки, что сделать в коммите. В
      отличие от элемента React, который создаётся заново при каждом рендере, Fiber-узел живёт, пока компонент
      на экране. Поэтому состояние и «живёт» в нём, а не в функции компонента.

      Чтобы не перерисовывать лишнее, React при обходе проверяет узел: изменились ли пропсы, есть ли у него
      обновления состояния, поменялся ли прочитанный контекст. Если нет — компонент не вызывается. Если и у
      потомков нет обновлений, React пропускает всё поддерево целиком, а иначе спускается прямо к потомку, где
      есть работа. Это называют bailout.

      Важная тонкость: пропсы сравниваются по ссылке. При рендере родителя элементы детей создаются заново, и
      ссылки новые, поэтому дети рендерятся. `memo` добавляет поверхностное сравнение пропсов. А приём с
      `children` работает и без `memo`: элемент создан выше, при рендере обёртки это тот же объект, и React
      пропускает его поддерево.
    points:
      - Узел хранит тип, пропсы, хуки, обновления, связи, DOM-ссылку, пометки
      - Fiber-узел живёт между рендерами, элемент — одноразовый
      - Bailout — нет изменений пропсов, состояния и контекста
      - Пропсы сравниваются по ссылке; memo — поверхностно
      - children созданы выше и не меняются — поддерево пропускается
    links:
      - https://github.com/acdlite/react-fiber-architecture#structure-of-a-fiber
      - https://react.dev/reference/react/memo
    source: own

  - id: speech-react-internals-003
    level: middle
    tags: [reconciliation, key]
    question: |
      Как React понимает, что изменилось: reconciliation и ключи.
    answer: |
      После рендера у React есть новое дерево элементов и то, что он отрисовал в прошлый раз. Найти между ними
      минимальную разницу честно — задача порядка n в кубе, это слишком дорого. Поэтому React сравнивает
      деревья за один проход, опираясь на две эвристики.

      Первая — тип элемента. Если на том же месте тот же тип, React считает это тем же элементом: обновляет
      пропсы, сохраняет состояние и DOM-узел, идёт к детям. Если тип другой — `<div>` стал `<section>` или
      `Counter` стал `Timer`, — React не ищет сходства, а уничтожает старое поддерево целиком и создаёт новое.
      Отсюда ловушка: компонент, объявленный внутри другого, на каждом рендере новый тип, и его состояние
      постоянно сбрасывается.

      Вторая — ключи. Детей списка React сопоставляет по `key`, а без ключей — по порядку. Ключ говорит: «это
      тот же элемент, даже если он переехал». Поэтому, если список меняется, ключ должен быть стабильным id из
      данных, а не индексом.

      В итоге состояние компонента определяется тремя вещами: позицией в дереве, типом и ключом. Пока они те
      же — состояние сохраняется, что-то изменилось — компонент создаётся заново.
    points:
      - Честное сравнение деревьев слишком дорогое, React делает один проход
      - Тот же тип — обновление, другой тип — пересоздание поддерева
      - Дети списка сопоставляются по key, без ключей — по порядку
      - Вложенное объявление компонента — новый тип на каждом рендере
      - Состояние определяют позиция, тип и ключ
    links:
      - https://legacy.reactjs.org/docs/reconciliation.html
      - https://react.dev/learn/preserving-and-resetting-state
    source: own

  - id: speech-react-internals-004
    level: senior
    tags: [concurrent, priorities]
    question: |
      Что такое конкурентный рендер и как React расставляет приоритеты обновлений?
    answer: |
      Конкурентный рендер — это не многопоточность. JavaScript страницы по-прежнему выполняется в одном
      потоке. Конкурентность значит, что React может держать в работе несколько обновлений, приостанавливать
      рендер и переключаться между ними. Это возможно благодаря Fiber: работа идёт маленькими порциями, между
      ними React проверяет, не пора ли уступить браузеру, и продолжает новой задачей, чтобы браузер успел
      обработать ввод и нарисовать кадр.

      У каждого обновления есть приоритет. Самые срочные — дискретные действия пользователя: клик, ввод,
      нажатие клавиши. Их React рендерит сразу и до конца. Обычные обновления из таймеров и ответов сервера —
      средний приоритет. Переходы через `startTransition` и отложенные значения `useDeferredValue` — несрочные
      и прерываемые. Если во время несрочного рендера пришёл ввод, React отложит несрочную работу, обработает
      ввод, а потом начнёт несрочный рендер заново с актуальными данными. Чтобы несрочное не откладывалось
      вечно, у обновлений есть срок ожидания: просроченная работа становится срочной.

      Прерывать можно только фазу рендера. Коммит — изменение DOM — всегда синхронный и целиком, иначе экран
      показал бы половину обновления. Поэтому компоненты должны быть чистыми: их рендер React может повторить
      или выбросить.
    points:
      - Не многопоточность, а прерываемость и переключение
      - Работа порциями, продолжение новой задачей
      - Приоритеты — ввод срочный, переходы и deferred несрочные
      - Несрочный рендер прерывается и начинается заново; защита от голодания
      - Прерывается только рендер, коммит неделим; компоненты чистые
    links:
      - https://react.dev/blog/2022/03/29/react-v18#what-is-concurrent-react
      - https://react.dev/reference/react/useTransition
    source: own

  - id: speech-react-internals-005
    level: middle
    tags: [Suspense]
    question: |
      Как работает Suspense?
    answer: |
      Suspense переносит заботу о загрузке из компонента в дерево. Компонент пишет код так, будто данные уже
      есть: `const user = use(userPromise)` или просто рендерит `lazy`-компонент. Если данных или кода ещё
      нет, компонент «приостанавливается» — сообщает React, что не готов. React поднимается вверх до ближайшей
      границы `<Suspense>` и показывает её `fallback` вместо всего поддерева. Когда ресурс готов, React
      рендерит приостановленный компонент заново, с начала.

      Из этого следуют практические вещи. Где поставить границу — дизайнерское решение: одна граница вокруг
      страницы покажет один спиннер, несколько — загрузят части независимо. Ресурс должен быть стабильным:
      если создавать новый промис на каждом рендере, компонент будет приостанавливаться бесконечно, поэтому
      промисы берут из кэша, серверного компонента или библиотеки данных. Если данные уже в кэше, заглушка не
      появляется вовсе.

      Suspense дружит с переходами: если обновление в `startTransition`, React не прячет уже показанный
      контент за fallback, а оставляет старый экран, пока новый не готов. А на сервере Suspense даёт потоковый
      рендеринг: HTML отправляется частями, и каждая граница гидратируется отдельно.
    points:
      - Компонент приостанавливается, если данных или кода нет
      - Показывается fallback ближайшей границы Suspense
      - По готовности компонент рендерится заново с начала
      - Ресурс должен быть стабильным — новый промис на каждый рендер ломает загрузку
      - Переходы сохраняют старый экран; на сервере — стриминг и независимая гидратация
    links:
      - https://react.dev/reference/react/Suspense
    source: own
