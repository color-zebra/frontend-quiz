topic: react
subtopic: concurrent
questions:
  - id: speech-react-concurrent-001
    level: middle
    tags: [useTransition, useDeferredValue]
    question: |
      Когда нужен `useTransition`, а когда `useDeferredValue`?
    answer: |
      Оба решают одну задачу: тяжёлое обновление не должно тормозить ввод. Например, поле поиска и под ним
      список из тысяч элементов. Оба делают часть рендера несрочной: React сначала быстро обновит поле, а
      тяжёлый список отрендерит в фоне и бросит эту работу, если пользователь продолжает печатать.

      Разница в том, чем ты владеешь. `useTransition` — когда у тебя есть вызов сеттера: оборачиваешь его в
      `startTransition(() => setTab(next))`, и получаешь `isPending`, чтобы показать индикатор. Это хорошо
      подходит для переключения вкладок, навигации, фильтров, а в React 19 — и для асинхронных действий.

      `useDeferredValue` — когда у тебя есть только значение, например оно пришло пропсом из чужого
      компонента: `const deferred = useDeferredValue(query)`. Компонент рендерится дважды: сначала срочно со
      старым `deferred`, потом в фоне с новым. Тяжёлую часть оборачивают в `memo` и передают ей `deferred`.

      Чего они не делают: не ускоряют сам рендер и не сокращают число сетевых запросов. Для запросов
      по-прежнему нужен debounce. И нельзя оборачивать в переход само значение поля ввода — поле должно
      обновляться сразу.
    points:
      - Оба делают часть рендера несрочной и прерываемой
      - useTransition — когда владеешь сеттером, даёт isPending
      - useDeferredValue — когда владеешь только значением, два рендера
      - Тяжёлую часть оборачивают в memo
      - Не заменяют debounce для запросов; поле ввода — срочное
    links:
      - https://react.dev/reference/react/useTransition
      - https://react.dev/reference/react/useDeferredValue
    source: own
