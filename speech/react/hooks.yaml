questions:
  - id: speech-react-hooks-001
    level: junior
    tags: [rules-of-hooks]
    question: |
      Почему хуки нельзя вызывать в условиях и циклах?
    answer: |
      Потому что React узнаёт хуки по порядку вызова. У хука нет имени или ключа: `useState(0)` не говорит,
      какое это состояние. Для каждого экземпляра компонента React хранит список ячеек, и при рендере первый
      вызов хука получает первую ячейку, второй — вторую и так далее.

      Если вызвать хук внутри `if`, в одном рендере он будет, а в другом — нет. Тогда все хуки после него
      сдвинутся: `useState` для email получит ячейку, где лежало имя, а эффект — чужой массив зависимостей.
      React заметит, что число хуков изменилось, и выдаст ошибку, а в худших случаях данные тихо перепутаются.

      Отсюда два правила: хуки вызывают только на верхнем уровне компонента или кастомного хука и только из
      функций React. Если хук нужен по условию, условие переносят внутрь: `useEffect(() => { if (!enabled)
      return; ... }, [enabled])`, или выносят условную часть в отдельный компонент. Правила проверяет линтер
      `eslint-plugin-react-hooks`. Исключение — `use`: его можно вызывать в условиях, он устроен иначе.
    points:
      - React различает хуки по порядку вызова
      - Состояние лежит в ячейках, выдаваемых по очереди
      - Условный хук сдвигает все следующие ячейки
      - Хуки только на верхнем уровне, условие — внутрь хука
      - Проверяет eslint-plugin-react-hooks; use — исключение
    links:
      - https://react.dev/reference/rules/rules-of-hooks
    source: own
