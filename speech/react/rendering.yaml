topic: react
subtopic: rendering
questions:
  - id: speech-react-rendering-001
    level: junior
    tags: [render, reconciliation, commit]
    question: |
      Расскажи, как React обновляет интерфейс: рендер, сравнение, коммит.
    answer: |
      Обновление начинается с триггера: изменилось состояние компонента, отрендерился родитель или поменялся
      контекст, который компонент читает. При первом показе триггер — сам монтаж приложения.

      Дальше фаза рендера. React вызывает функции компонентов, и каждая возвращает дерево элементов — описание
      того, что должно быть на экране. Это чистые вычисления: в DOM пока ничего не меняется. Затем React
      сравнивает новое дерево с прошлым. Это reconciliation: тот же тип на том же месте — обновить пропсы,
      другой тип — пересоздать поддерево, в списках элементы сопоставляются по `key`.

      Потом коммит: React применяет к DOM только найденные различия, одним проходом. Сразу после изменения
      DOM, до отрисовки, выполняются `useLayoutEffect`, затем браузер рисует кадр, и обычно после этого —
      `useEffect`.

      Важный вывод: ре-рендер компонента — это ещё не изменение DOM. Если компонент вернул то же самое,
      страница не трогается, и лишний рендер стоит только времени на вызов функции. Поэтому оптимизировать
      рендеры имеет смысл, только когда они реально дорогие.
    points:
      - Триггеры — состояние, рендер родителя, контекст
      - Рендер — вызов компонентов, чистое вычисление нового дерева
      - Reconciliation — сравнение с прошлым деревом по типу и key
      - Коммит — применение различий к DOM, затем эффекты
      - Ре-рендер не равен изменению DOM
    links:
      - https://react.dev/learn/render-and-commit
    source: own
