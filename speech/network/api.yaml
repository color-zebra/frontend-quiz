questions:
  - id: speech-network-api-001
    level: middle
    tags: [rest, graphql, websocket]
    question: |
      Сравни REST, GraphQL и WebSocket — когда что выбрать?
    answer: |
      REST — подход, где API строится вокруг ресурсов и стандартных методов HTTP: `GET /users/42`, `POST
      /orders`. Он простой, понятный всем, хорошо кэшируется средствами HTTP и CDN. Минусы — клиент получает
      ровно то, что решил отдать сервер: иногда лишние поля, иногда приходится делать несколько запросов,
      чтобы собрать один экран. Это хороший выбор по умолчанию для большинства приложений и публичных API.

      GraphQL — один эндпоинт и язык запросов: клиент сам описывает, какие поля и связи ему нужны, и получает
      их одним ответом. Это удобно, когда разные клиенты (веб, мобильное приложение) нуждаются в разных срезах
      данных и когда экраны собирают данные из многих сущностей. Цена — сложнее сервер, кэширование и защита
      от тяжёлых запросов, обычно нужна клиентская библиотека вроде Apollo или urql.

      WebSocket — не про форму данных, а про транспорт: постоянное двустороннее соединение, по которому сервер
      может сам присылать сообщения. Нужен для чатов, совместного редактирования, игр, котировок — когда
      данные идут в реальном времени в обе стороны. Если обновления идут только от сервера к клиенту, часто
      хватает более простых Server-Sent Events.

      На практике их комбинируют: REST или GraphQL для обычных данных и WebSocket для живых обновлений.
    points:
      - REST — ресурсы и методы HTTP, просто, кэшируется
      - Минусы REST — лишние данные или много запросов
      - GraphQL — клиент выбирает поля, один эндпоинт, сложнее кэш и сервер
      - WebSocket — постоянное двустороннее соединение для реального времени
      - Только сервер → клиент — достаточно SSE; на практике комбинируют
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/REST
      - https://graphql.org/learn/
      - https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API
