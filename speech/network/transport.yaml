questions:
  - id: speech-network-transport-001
    level: middle
    tags: [http2, http3, quic]
    question: |
      Чем HTTP/2 и HTTP/3 лучше HTTP/1.1?
    answer: |
      Главная проблема HTTP/1.1 — одно соединение обслуживает один запрос за раз. Чтобы грузить параллельно,
      браузеры открывают до шести соединений на домен, а разработчики придумывали обходы: склейку файлов,
      спрайты, раздачу с нескольких доменов. Заголовки при этом передаются текстом и повторяются в каждом
      запросе.

      HTTP/2 решает это мультиплексированием: по одному TCP-соединению параллельно идут многие запросы и
      ответы, разбитые на кадры. Протокол бинарный, заголовки сжимаются (HPACK) и не повторяются целиком.
      Склейка файлов и шардирование доменов стали не нужны, а иногда и вредны.

      Но у HTTP/2 осталась блокировка на уровне TCP: если потерялся один пакет, TCP задерживает все потоки,
      пока пакет не перешлют, — head-of-line blocking. HTTP/3 переходит на QUIC поверх UDP: потоки независимы,
      потеря пакета тормозит только свой поток. Установка соединения быстрее — транспорт и TLS 1.3
      договариваются за одно рукопожатие, а при повторном визите можно отправлять данные сразу. И соединение
      переживает смену сети, например переход с Wi-Fi на мобильный интернет. Особенно заметен выигрыш на
      нестабильных мобильных сетях.
    points:
      - HTTP/1.1 — один запрос за раз на соединение, обходы вроде склейки
      - HTTP/2 — мультиплексирование, бинарный формат, сжатие заголовков
      - У HTTP/2 осталась блокировка TCP при потере пакета
      - HTTP/3 — QUIC поверх UDP, независимые потоки
      - Быстрая установка с TLS 1.3, переживает смену сети
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/HTTP_2
      - https://developer.mozilla.org/en-US/docs/Glossary/HTTP_3
    source: own
