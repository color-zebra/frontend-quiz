questions:
  - id: speech-network-security-001
    level: middle
    tags: [xss, csrf, csp]
    question: |
      Что такое XSS и CSRF и как от них защищаются?
    answer: |
      XSS (межсайтовый скриптинг) — когда злоумышленнику удаётся выполнить свой JavaScript на вашей странице.
      Например, в комментарии оставили `<img src=x onerror="...">`, а сайт вставил его в HTML как есть. Скрипт
      работает с правами сайта: читает данные страницы, `localStorage`, делает запросы от имени пользователя.

      Защита от XSS: экранировать пользовательские данные при выводе. React делает это сам для текста в JSX, а
      опасные места — `dangerouslySetInnerHTML` и `innerHTML` — обходят защиту, и HTML перед вставкой чистят
      библиотекой вроде DOMPurify. Дополнительные слои: заголовок Content-Security-Policy, который запрещает
      инлайн-скрипты и чужие источники, проверка схемы URL в ссылках (React 19 сам блокирует `javascript:`, но
      при работе с DOM напрямую это делают вручную), и флаг `HttpOnly` у сессионной cookie, чтобы её нельзя
      было украсть скриптом.

      CSRF (подделка межсайтового запроса) — другой сайт заставляет браузер пользователя отправить запрос на
      ваш сайт, например скрытой формой с `POST /transfer`. Браузер приложит cookies, и сервер решит, что
      действие сделал сам пользователь. Злоумышленник ответ не прочитает, но действие выполнится.

      Защита от CSRF: cookie с `SameSite=Lax` или `Strict`, чтобы она не уходила с чужих сайтов; CSRF-токен в
      форме, который чужой сайт не знает; проверка заголовков `Origin` и `Referer`; и правило, что `GET`
      ничего не меняет. Разница в одной фразе: XSS — чужой код на вашей странице, CSRF — чужая страница делает
      запрос к вашему серверу.
    points:
      - XSS — чужой скрипт выполняется на вашей странице
      - Экранирование, осторожность с innerHTML, DOMPurify, CSP, HttpOnly
      - CSRF — чужой сайт отправляет запрос с cookies пользователя
      - SameSite, CSRF-токен, проверка Origin, GET без изменений
      - XSS — код на вашей странице, CSRF — запрос с чужой
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Security/Attacks/XSS
      - https://developer.mozilla.org/en-US/docs/Web/Security/Attacks/CSRF
    source: own
