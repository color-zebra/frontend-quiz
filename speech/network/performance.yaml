questions:
  - id: speech-network-performance-001
    level: middle
    tags: [core-web-vitals, lcp, inp, cls]
    question: |
      Расскажи про Core Web Vitals: что это за метрики, как их измерять и как улучшать.
    answer: |
      Core Web Vitals — три метрики пользовательского опыта, которые продвигает Google:
      - LCP — когда отрисовался самый крупный элемент первого экрана, обычно главная картинка или заголовок;
        хорошо — до 2,5 секунды;
      - INP — насколько быстро страница откликается на действия: от клика, касания или нажатия клавиши до кадра с
        видимой реакцией, по одному из самых медленных взаимодействий за визит; хорошо — до 200 мс;
      - CLS — оценка самой большой серии неожиданных сдвигов вёрстки; хорошо — до 0,1.

      Оценка идёт по 75-му перцентилю реальных визитов. В 2024 году INP заменил FID, который мерил только задержку
      первого клика.

      Измеряют двумя способами. Полевые данные — с реальных пользователей: отчёт CrUX, Search Console, PageSpeed
      Insights или свой сбор через библиотеку `web-vitals` с отправкой в аналитику. Лабораторные — Lighthouse и
      вкладка Performance в DevTools: удобно для отладки, но реальных кликов там нет, поэтому INP в лаборатории
      заменяет TBT. Решения принимают по полевым данным, а причину ищут в лаборатории.

      Улучшают каждую по-своему:
      - LCP — быстрый ответ сервера, главная картинка без `loading="lazy"` и с `fetchpriority="high"`, меньше
        блокирующих CSS и скриптов;
      - INP — разгрузить основной поток, в котором браузер выполняет и JavaScript, и отрисовку: дробить долгие
        задачи, сначала показывать реакцию, а тяжёлое откладывать, выносить вычисления в Web Worker, а в React
        помечать тяжёлый рендер несрочным через `startTransition`;
      - CLS — задавать размеры картинкам и `aspect-ratio`, резервировать место под рекламу и баннеры, не
        анимировать `top` и `left`.
    points:
      - LCP до 2,5 с, INP до 200 мс, CLS до 0,1, по 75-му перцентилю
      - INP заменил FID в 2024 году — учитывает все взаимодействия и отрисовку
      - Поле (CrUX, web-vitals) против лаборатории (Lighthouse, где вместо INP — TBT)
      - LCP — сервер и главная картинка; INP — долгие задачи; CLS — размеры и резерв места
    links:
      - https://web.dev/articles/vitals
      - https://web.dev/articles/lab-and-field-data-differences
