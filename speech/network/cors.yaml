questions:
  - id: speech-network-cors-001
    level: middle
    tags: [cors, preflight, same-origin]
    question: |
      Что такое CORS, зачем он нужен и что такое preflight-запрос?
    answer: |
      В браузере действует политика одинакового происхождения (same-origin policy): скрипт со страницы
      `https://shop.com` не может читать ответы с другого происхождения — другой схемы, домена или порта.
      Иначе любой сайт мог бы от имени пользователя, с его cookies, читать почту или банковский кабинет в
      соседней вкладке. CORS — механизм, которым сервер разрешает браузеру ослабить это правило для конкретных
      источников.

      Работает это через заголовки. Браузер добавляет к запросу `Origin`, а сервер отвечает
      `Access-Control-Allow-Origin` с этим origin или `*`. Списка там быть не может, поэтому сервер сверяет
      пришедший `Origin` со своим списком, возвращает его же и добавляет `Vary: Origin`. Если разрешения нет,
      запрос может даже дойти до сервера и выполниться, но браузер не отдаст ответ скрипту. Для запросов с
      cookies сервер должен дополнительно ответить `Access-Control-Allow-Credentials: true` и указать
      конкретный origin вместо `*`.

      Preflight — предварительный запрос `OPTIONS`, который браузер отправляет перед «непростыми» запросами: с
      методами вроде `PUT` и `DELETE`, с заголовком `Content-Type: application/json` или собственными
      заголовками вроде `Authorization`. Браузер спрашивает, можно ли такое, и только после разрешения
      отправляет настоящий запрос. Результат можно закэшировать заголовком `Access-Control-Max-Age`.

      Важно: CORS защищает пользователя в браузере, а не сервер. `curl` или другой сервер его не соблюдают,
      поэтому авторизацию и защиту от CSRF всё равно делают на сервере.
    points:
      - Same-origin policy запрещает читать ответы чужого происхождения
      - CORS — сервер разрешает конкретным источникам через заголовки
      - Origin в запросе, Access-Control-Allow-Origin в ответе
      - С cookies — Allow-Credentials и конкретный origin вместо *
      - Preflight OPTIONS перед непростыми запросами; CORS не защищает сервер
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS
    source: own
