questions:
  - id: speech-network-http-001
    level: middle
    tags: [dns, tcp, tls, rendering]
    question: |
      Что происходит, когда вводишь адрес в браузере и нажимаешь Enter?
    answer: |
      Сначала браузер разбирает ввод: это адрес или поисковый запрос. Если адрес, он проверяет, нет ли
      готового ответа: сначала у Service Worker, если он есть, затем в HTTP-кэше. Если нет, нужно найти
      сервер: DNS превращает доменное имя в IP-адрес, проходя по кэшам браузера, системы и DNS-серверов
      провайдера.

      Затем устанавливается соединение. Для HTTP/1.1 и HTTP/2 это TCP с рукопожатием, затем TLS-рукопожатие
      для HTTPS: стороны согласуют шифрование, и браузер проверяет сертификат сервера. HTTP/3 работает поверх
      QUIC на UDP и объединяет установку соединения и шифрования, поэтому быстрее. После этого браузер
      отправляет HTTP-запрос `GET` с заголовками и cookies, сервер отвечает статусом, заголовками и HTML.

      Дальше рендеринг. Браузер разбирает HTML в DOM, по пути находит CSS, скрипты, картинки и запрашивает их.
      CSS превращается в CSSOM, вместе они дают дерево отрисовки, затем раскладка (расчёт размеров и позиций),
      отрисовка и композитинг слоёв. Скрипты без `defer` и `async` останавливают разбор HTML, а CSS блокирует
      отрисовку. Когда разобран весь документ, срабатывает `DOMContentLoaded`, когда загружены все ресурсы —
      `load`.
    points:
      - Кэш и Service Worker, затем DNS — имя в IP
      - TCP и TLS-рукопожатие; HTTP/3 — QUIC поверх UDP
      - HTTP-запрос и ответ с HTML
      - DOM, CSSOM, раскладка, отрисовка, композитинг
      - Блокирующие скрипты и CSS; DOMContentLoaded и load
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Performance/Guides/How_browsers_work
    source: own

  - id: speech-network-http-002
    level: junior
    tags: [methods, idempotency]
    question: |
      Чем отличаются методы GET, POST, PUT, PATCH, DELETE и что такое идемпотентность?
    answer: |
      Метод говорит серверу, что сделать с ресурсом. `GET` — получить данные, без изменений на сервере, тело
      запроса у него не принято. `POST` — создать ресурс или выполнить действие, например оформить заказ.
      `PUT` — заменить ресурс целиком тем, что прислали. `PATCH` — изменить часть ресурса, например только имя
      пользователя. `DELETE` — удалить.

      Идемпотентность — свойство: повторить один и тот же запрос несколько раз — то же самое, что выполнить
      его один раз, по итоговому состоянию на сервере. `GET`, `PUT` и `DELETE` идемпотентны: второй `PUT` с
      теми же данными ничего не поменяет, второй `DELETE` удалит уже удалённое. `POST` не идемпотентен: два
      одинаковых `POST` создадут два заказа. `PATCH` идемпотентен не всегда — например, «увеличить счётчик на
      один» им не является.

      Ещё есть понятие безопасных методов — тех, что ничего не меняют: `GET`, `HEAD`, `OPTIONS`. Это важно на
      практике: безопасные и идемпотентные запросы браузеры, прокси и библиотеки могут спокойно повторять при
      сбое сети, а неидемпотентный `POST` повторять опасно — для него придумывают ключи идемпотентности.
    points:
      - GET — чтение, POST — создание или действие
      - PUT — замена целиком, PATCH — частичное изменение, DELETE — удаление
      - Идемпотентность — повтор даёт то же состояние
      - GET, PUT, DELETE идемпотентны, POST — нет, PATCH — не всегда
      - Безопасные методы ничего не меняют; повтор POST опасен
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Methods
      - https://developer.mozilla.org/en-US/docs/Glossary/Idempotent
    source: own
