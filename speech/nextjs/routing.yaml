questions:
  - id: speech-nextjs-routing-001
    level: junior
    tags: [app-router, page, layout, loading, error]
    question: |
      Как устроен App Router: файлы `page`, `layout`, `loading`, `error`?
    answer: |
      В App Router маршруты задаются папками внутри `app`: папка `app/blog/[slug]` даёт адрес `/blog/hello`,
      где `slug` — динамический параметр. А что показывать на маршруте, определяют специальные файлы в папке.

      `page.tsx` делает сегмент доступным по адресу и содержит его уникальное содержимое. Без `page` папка —
      просто часть пути или место для компонентов. `layout.tsx` — общая обёртка для сегмента и всех вложенных:
      шапка, меню, боковая панель. Важно, что при переходах между страницами layout не перерендеривается и
      сохраняет состояние. Корневой `app/layout.tsx` обязателен, в нём `<html>` и `<body>`.

      `loading.tsx` — заглушка, которую Next.js автоматически оборачивает вокруг страницы как границу
      Suspense: пока страница загружает данные, пользователь видит скелетон, а навигация остаётся мгновенной.
      `error.tsx` — граница ошибок для сегмента: при ошибке рендера показывается этот компонент, а остальная
      часть приложения, например layout, продолжает работать. Он клиентский и получает функцию для повторной
      попытки.

      Есть и другие файлы: `not-found.tsx` для 404, `template.tsx` — как layout, но пересоздаётся при каждом
      переходе, `route.ts` — API-эндпоинт. А папки в скобках вроде `(marketing)` группируют маршруты, не влияя
      на адрес.
    points:
      - Маршруты — папки в app, динамические сегменты в квадратных скобках
      - page — содержимое и доступность по адресу
      - layout — общая обёртка, сохраняет состояние при переходах
      - loading — автоматическая граница Suspense со скелетоном
      - error — граница ошибок сегмента; ещё not-found, template, route, группы
    links:
      - https://nextjs.org/docs/app/getting-started/layouts-and-pages
      - https://nextjs.org/docs/app/api-reference/file-conventions
    source: own
