questions:
  - id: speech-nextjs-rendering-001
    level: middle
    tags: [ssr, ssg, isr, streaming, ppr]
    question: |
      Сравни SSR, SSG, ISR и стриминг.
    answer: |
      Это разные ответы на вопрос, когда строится HTML. SSG — статическая генерация: страница рендерится один
      раз при сборке и отдаётся всем как готовый файл, часто с CDN. Это быстрее всего, подходит для
      документации, лендингов, блога. SSR — рендер на каждый запрос: страница всегда свежая и может зависеть
      от пользователя, cookies, заголовков, но каждый запрос тратит время сервера.

      ISR — компромисс: страница статическая, но может обновляться. Через заданное время или по сигналу
      ревалидации Next.js перестраивает её в фоне, а пока отдаёт старую версию. Так каталог товаров остаётся
      быстрым, но не устаревает на недели.

      Стриминг решает другую задачу — не «когда», а «как отдавать». Вместо того чтобы ждать всю страницу,
      сервер сразу шлёт оболочку, а медленные части досылает по мере готовности. В App Router это границы
      `<Suspense>` и файл `loading.tsx`: пользователь видит макет и заглушки, а не белый экран.

      В App Router выбор во многом автоматический. Если страница не читает данных запроса (`cookies()`,
      `headers()`, `searchParams`), она статическая, иначе динамическая. А с Cache Components в Next.js 16 эти
      режимы смешиваются на одной странице: статическая оболочка пре-рендерится, кэшированные через `'use
      cache'` части становятся её частью, а динамические места стримятся на запрос — это частичный
      пре-рендеринг.
    points:
      - SSG — при сборке, быстрее всего, для неизменного контента
      - SSR — на каждый запрос, свежо и персонально, нагружает сервер
      - ISR — статика с фоновым обновлением по времени или сигналу
      - Стриминг — оболочка сразу, медленные части по готовности через Suspense
      - В App Router режим выводится из используемых API; Cache Components смешивают режимы
    links:
      - https://nextjs.org/docs/app/getting-started/caching#prerendering
      - https://nextjs.org/docs/app/guides/incremental-static-regeneration
    source: own
