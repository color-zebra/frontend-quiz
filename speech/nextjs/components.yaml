questions:
  - id: speech-nextjs-components-001
    level: middle
    tags: [server-components, client-components, use-client]
    question: |
      Чем серверный компонент отличается от клиентского и когда нужен `'use client'`?
    answer: |
      В App Router все компоненты по умолчанию серверные. Они выполняются только на сервере: при сборке или на
      запрос. Их код не попадает в браузерный бандл, поэтому они могут быть `async`, ходить в базу напрямую,
      читать секреты и использовать тяжёлые библиотеки, вроде подсветки кода, без цены для пользователя. Но у
      них нет состояния, эффектов и обработчиков событий: `useState`, `useEffect`, `onClick` недоступны.

      Клиентские компоненты — привычные React-компоненты: они рендерятся на сервере в HTML, а потом
      гидрируются в браузере и становятся интерактивными. Директива `'use client'` в начале файла объявляет
      границу: этот модуль и всё, что он импортирует, попадает в клиентский бандл. Нужна она, когда компоненту
      нужны состояние, эффекты, обработчики, браузерные API вроде `window` и `localStorage` или хуки сторонних
      библиотек.

      Практика — держать клиентскую часть как можно меньше и ниже по дереву: страница серверная, а
      интерактивная кнопка — отдельный клиентский компонент. Пропсы через границу должны сериализоваться:
      строки, числа, объекты, промисы, но не обычные функции и не экземпляры классов. А серверные компоненты
      можно передавать внутрь клиентских через `children` — так модалка на клиенте может показывать серверную
      корзину.
    points:
      - По умолчанию компоненты серверные, их код не идёт в бандл
      - Серверные могут быть async, ходить в базу, но без состояния и событий
      - use client объявляет границу — модуль и его импорты в бандле
      - Нужен для состояния, эффектов, обработчиков, браузерных API
      - Пропсы через границу сериализуемые; серверные компоненты — через children
    links:
      - https://nextjs.org/docs/app/getting-started/server-and-client-components
    source: own
