questions:
  - id: speech-javascript-event-loop-001
    level: middle
    tags: [event-loop, microtasks, macrotasks]
    question: |
      Объясни, как работает event loop, на примере `setTimeout` и промиса.
    code: |
      setTimeout(() => console.log('timeout'));
      queueMicrotask(() => console.log('micro'));
      console.log('sync');
    codeLang: js
    answer: |
      JavaScript в браузере выполняет код в одном потоке, и у потока один стек вызовов. Всё асинхронное —
      таймеры, сеть, события — обслуживает сам браузер, а когда результат готов, ставит колбэк в очередь.
      Event loop — цикл, который берёт колбэки из очередей и выполняет их, когда стек пуст.

      Очередей две главные. Задачи (macrotasks): основной скрипт, таймеры, события, сообщения. Микрозадачи:
      колбэки `then`, продолжения после `await`, `queueMicrotask`. Правило одно: взять одну задачу, выполнить
      её до конца, затем выполнить все микрозадачи, включая новые, и только потом при необходимости нарисовать
      кадр и взять следующую задачу.

      В примере основной скрипт — первая задача. Он регистрирует таймер (браузер поставит его колбэк в очередь
      задач), ставит функцию в очередь микрозадач и печатает `sync`. Скрипт закончился — выполняются
      микрозадачи, печатается `micro`. Потом следующая задача — таймер, печатается `timeout`. С промисом было
      бы так же: `Promise.resolve().then(fn)` ставит `fn` в ту же очередь микрозадач, поэтому промис обгоняет
      таймер, хотя таймер зарегистрирован раньше.

      Практические выводы: `setTimeout(fn, 0)` — не «сразу», а «после текущей работы»; долгий синхронный код и
      бесконечные микрозадачи вешают страницу, потому что браузер не может ни обработать клик, ни нарисовать
      кадр.
    points:
      - Один поток и один стек; асинхронностью занимается браузер
      - Очередь задач — скрипт, таймеры, события; очередь микрозадач — then, await, queueMicrotask
      - После каждой задачи выполняются все микрозадачи, затем возможна отрисовка
      - Пример выводит sync, micro, timeout — микрозадача обгоняет таймер
      - Долгий код и бесконечные микрозадачи блокируют отрисовку и ввод
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Execution_model
      - https://jakearchibald.com/2015/tasks-microtasks-queues-and-schedules/
    source: own
