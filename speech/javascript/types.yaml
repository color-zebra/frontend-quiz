questions:
  - id: speech-javascript-types-001
    level: junior
    tags: [primitive, reference]
    question: |
      Расскажи о типах данных в JavaScript. Чем примитивы отличаются от объектов?
    answer: |
      В JavaScript восемь типов: семь примитивных — `string`, `number`, `bigint`, `boolean`, `undefined`,
      `symbol`, `null` — и `object`. Массивы, функции, даты, `Map` и всё остальное — разновидности объектов.

      Примитив — неизменяемое значение без собственных свойств. Когда я присваиваю примитив другой переменной
      или передаю в функцию, копируется само значение: `let b = a; b = 2` не трогает `a`. Строку нельзя
      поменять «на месте», методы вроде `toUpperCase` возвращают новую строку. А методы у примитивов работают
      за счёт автоупаковки: движок на время оборачивает значение в `String` или `Number`.

      Объект — изменяемая структура, и переменная хранит ссылку на него. Присваивание копирует ссылку, поэтому
      `const copy = user; copy.name = 'Боря'` меняет и `user`. По той же причине `===` сравнивает объекты по
      ссылке: `{} === {}` — `false`. Копию верхнего уровня даёт spread, полную независимую —
      `structuredClone`.

      Из подвохов: `typeof null` возвращает `"object"` — историческая ошибка, а массив проверяют через
      `Array.isArray`.
    points:
      - Семь примитивных типов плюс object; массивы и функции — объекты
      - Примитивы неизменяемы и копируются по значению
      - Объектная переменная хранит ссылку, копирование копирует ссылку
      - '`===` сравнивает объекты по ссылке, а не по содержимому'
      - Методы у примитивов — через временные объекты-обёртки
      - Подвохи typeof — null даёт "object", для массивов нужен Array.isArray
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Data_structures
      - https://developer.mozilla.org/en-US/docs/Glossary/Primitive
    source: own

  - id: speech-javascript-types-002
    level: middle
    tags: [loose-equality, coercion]
    question: |
      Объясни, как работает нестрогое равенство `==` и почему его обычно избегают.
    answer: |
      `==` сравнивает с приведением типов, и у него есть свой алгоритм. Если типы одинаковые, он работает как
      `===`. `null` и `undefined` равны друг другу и больше ничему — даже нулю. Если сравниваются строка и
      число, строка превращается в число. Boolean всегда сначала превращается в число: `true` в 1, `false` в
      0. А объект при сравнении с примитивом приводится к примитиву через `valueOf` или `toString`.

      По отдельности правила разумные, но вместе дают неочевидные результаты. `[] == false` — `true`: `false`
      становится 0, пустой массив — пустой строкой, а она — нулём. При этом `if ([])` выполняется, потому что
      логический контекст — другое правило. `"true" == true` — `false`, потому что `true` стало единицей, а
      строка `"true"` — `NaN`.

      Поэтому в командах обычно включают ESLint-правило `eqeqeq` и пишут `===`: результат предсказуем, а
      приведение, если нужно, делают явно через `Number()` или `String()`. Единственное популярное исключение
      — `value == null`, короткая проверка «`null` или `undefined`».
    points:
      - При одинаковых типах == ведёт себя как ===
      - null и undefined равны только друг другу
      - Строка с числом сравнивается как числа, boolean превращается в число
      - Объект приводится к примитиву через valueOf / toString
      - Пример сюрприза — [] == false истинно, хотя [] в if истинен
      - На практике === и eqeqeq; исключение — value == null
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Equality
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Equality_comparisons_and_sameness
    source: own
