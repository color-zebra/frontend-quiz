questions:
  - id: speech-javascript-closures-001
    level: junior
    tags: [definition, use-cases]
    question: |
      Объясни, что такое замыкание, и приведи пример из практики.
    answer: |
      Замыкание — это функция вместе с окружением, в котором она была создана. Когда функция объявляется
      внутри другой, она запоминает ссылку на переменные внешней функции и может пользоваться ими, даже когда
      внешняя функция уже завершилась. Окружение живёт, пока на него ссылается хоть одна функция.

      Простой пример — счётчик: `function makeCounter() { let count = 0; return () => ++count; }`. Каждый
      вызов `makeCounter` создаёт свою переменную `count`, поэтому два счётчика независимы. А добраться до
      `count` снаружи нельзя — это настоящие приватные данные.

      Из практики: `debounce` хранит в замыкании id таймера, чтобы каждый новый вызов отменял предыдущий;
      мемоизация держит кэш результатов; фабрики вроде `createApiClient(baseUrl)` возвращают функции, которые
      помнят настройки. В React каждый обработчик внутри компонента — замыкание над пропсами и состоянием
      своего рендера.

      Важная деталь: замыкание хранит ссылку на переменную, а не снимок значения. Если переменную изменить,
      функция при следующем вызове увидит новое значение.
    points:
      - Функция плюс окружение, в котором она создана
      - Внешние переменные доступны после завершения внешней функции
      - Каждый вызов внешней функции создаёт новое окружение
      - Хранится ссылка на переменную, а не снимок значения
      - Примеры — приватные данные, debounce, мемоизация, фабрики функций
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures
    source: own

  - id: speech-javascript-closures-002
    level: middle
    tags: [stale-closure, react]
    question: |
      Как связаны замыкания и «устаревшее» состояние в React?
    code: |
      useEffect(() => {
        const id = setInterval(() => setCount(count + 1), 1000);
        return () => clearInterval(id);
      }, []);
    codeLang: jsx
    answer: |
      Компонент — это функция, и каждый рендер — новый её вызов со своими переменными. Значение `count` в
      одном рендере — обычная константа этого вызова. Любой колбэк, созданный в рендере, замыкает именно эти
      значения.

      В примере эффект выполнился один раз, при первом рендере, потому что зависимости пустые. Колбэк
      интервала замкнул `count` первого рендера, то есть 0. Каждую секунду он вызывает `setCount(0 + 1)`, и
      счётчик застревает на единице. Это и есть устаревшее замыкание, stale closure: новые значения появились
      в новых рендерах, а колбэк смотрит на старый.

      Лечится по-разному. Можно использовать функциональное обновление `setCount((c) => c + 1)` — React сам
      передаст актуальное значение, и замыкание больше не нужно. Можно честно указать `count` в зависимостях,
      тогда эффект будет пересоздавать интервал при каждом изменении. Если нужно читать свежее значение без
      перезапуска эффекта, его кладут в `useRef`. Линтер `react-hooks/exhaustive-deps` подсвечивает такие
      места.
    points:
      - Каждый рендер — новый вызов функции со своими переменными
      - Колбэк замыкает значения рендера, в котором создан
      - Эффект с пустыми зависимостями видит только первый рендер
      - Функциональное обновление получает актуальное значение
      - Другие решения — честные зависимости или useRef
    links:
      - https://react.dev/reference/react/useState#updating-state-based-on-the-previous-state
      - https://react.dev/learn/lifecycle-of-reactive-effects
    source: own
