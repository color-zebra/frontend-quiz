questions:
  - id: speech-javascript-this-001
    level: middle
    tags: [rules, arrow-functions, bind]
    question: |
      Как в JavaScript определяется `this`?
    answer: |
      У обычной функции `this` определяется не местом объявления, а тем, как её вызвали. Правил четыре, и они
      идут по приоритету.

      Если функция вызвана через `new`, `this` — новый объект, созданный для неё. Если её привязали через
      `bind`, `this` зафиксирован навсегда, и перебить его может только `new`. Если вызвали через `call` или
      `apply`, `this` — первый аргумент. Если вызвали как метод, `user.getName()`, `this` — объект перед
      последней точкой. И если просто `getName()` — в строгом режиме `undefined`, в нестрогом глобальный
      объект.

      Отсюда главная ловушка: `const fn = user.getName` или `setTimeout(user.getName)` передаёт функцию без
      объекта, и `this` теряется. Лечится через `bind`, обёртку `() => user.getName()` или поле-стрелку в
      классе.

      Стрелочные функции живут по другим правилам: своего `this` у них нет, они берут его из окружения, где
      созданы, и ни `call`, ни `bind` этого не меняют. Поэтому стрелки удобны для колбэков внутри методов, но
      не годятся как методы объектов. Ещё один частный случай — обработчик `addEventListener`, записанный
      обычной функцией: браузер вызывает его с `this`, равным элементу.
    points:
      - this обычной функции зависит от способа вызова
      - Приоритет — new, bind, call/apply, вызов как метода, обычный вызов
      - Обычный вызов — undefined в строгом режиме, глобальный объект в нестрогом
      - Метод, переданный колбэком, теряет this; лечат bind или обёрткой
      - Стрелка берёт this из окружения, call и bind его не меняют
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/this
    source: own
