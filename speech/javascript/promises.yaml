questions:
  - id: speech-javascript-promises-001
    level: junior
    tags: [states, chaining]
    question: |
      Расскажи, что такое промис и как работает цепочка `.then`.
    answer: |
      Промис — объект, который представляет результат асинхронной операции, ещё не готовый в момент вызова. У
      него три состояния: pending — ожидание, fulfilled — выполнен со значением, rejected — отклонён с
      ошибкой. Переход из ожидания происходит один раз и навсегда, а все подписчики, даже поздние, получают
      один и тот же результат.

      Подписываются через `then`, `catch` и `finally`, и их колбэки всегда вызываются асинхронно, в
      микрозадаче, даже если промис уже выполнен. Главное — каждый `then` возвращает новый промис. Если колбэк
      вернул значение, новый промис выполнится этим значением; если бросил ошибку — отклонится; если вернул
      промис — дождётся его. Поэтому асинхронные шаги пишутся плоской цепочкой: `fetch(url).then((r) =>
      r.json()).then(render)`.

      Ошибка в любом звене пропускает успешные обработчики и идёт до ближайшего `catch`, как в `try/catch`.
      После `catch` цепочка снова на успешной ветке, если ошибку не пробросили через `throw`. Частые ошибки:
      забыть `return` внутри `then` — тогда цепочка не ждёт вложенный запрос, и не повесить `catch` в конце —
      тогда получится unhandled rejection.
    points:
      - Три состояния, переход из pending один раз
      - Колбэки then вызываются асинхронно, в микрозадаче
      - then возвращает новый промис; возвращённый промис разворачивается
      - Ошибка проходит по цепочке до ближайшего catch
      - Забытый return и отсутствие catch — частые баги
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Using_promises
    source: own

  - id: speech-javascript-promises-002
    level: middle
    tags: [promise-all, allSettled, race, any]
    question: |
      Сравни `Promise.all`, `Promise.allSettled`, `Promise.race` и `Promise.any`. Когда какой выбрать?
    answer: |
      Все четыре принимают набор промисов и возвращают один промис, отличаются условием завершения.

      `Promise.all` выполняется массивом значений в исходном порядке, когда выполнились все, и отклоняется
      первой же ошибкой. Беру его, когда без любого из результатов дальше идти нельзя: например, грузить
      пользователя и настройки страницы параллельно.

      `Promise.allSettled` ждёт всех и никогда не отклоняется из-за ошибок: результат — массив объектов со
      `status` и `value` или `reason`. Подходит, когда операции независимы и нужен отчёт: отправить десять
      писем и показать, какие не ушли.

      `Promise.race` повторяет исход первого завершившегося — успех или ошибку. Классическое применение —
      таймаут: гонка между запросом и промисом, который отклоняется через N миллисекунд.

      `Promise.any` ждёт первого успеха, ошибки пропускает, а если отклонились все — отдаёт `AggregateError`.
      Подходит для резервных источников: взять ответ самого быстрого из нескольких зеркал.

      Важно, что ни один из них не отменяет оставшиеся операции: запросы продолжают идти. Для отмены нужен
      `AbortController`, а для таймаута запроса удобнее `AbortSignal.timeout(ms)`.
    points:
      - all — все успешны или первая ошибка, порядок исходный
      - allSettled — ждёт всех, отчёт по каждому, не отклоняется
      - race — первый завершившийся, хоть с ошибкой; применение — таймаут
      - any — первый успех, при всех ошибках AggregateError
      - Никто не отменяет остальные операции — нужен AbortController
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise#promise_concurrency
    source: own
