questions:
  - id: speech-javascript-async-await-001
    level: middle
    tags: [async, await, promises]
    question: |
      Как работает `async/await` и чем он отличается от цепочки `.then`?
    answer: |
      `async/await` — синтаксис поверх промисов, а не новый механизм. Функция с `async` всегда возвращает
      промис: `return` его выполняет, `throw` отклоняет. Внутри неё можно писать `await` перед промисом:
      функция приостанавливается, отдаёт управление, а когда промис выполнится, продолжает работу с того же
      места. Её продолжение идёт в очередь микрозадач, так же как колбэк `then`. Поток при этом не блокируется
      — ждёт только эта функция.

      Главное отличие от `.then` — читаемость. Последовательные шаги пишутся сверху вниз, как синхронный код,
      промежуточные значения лежат в обычных переменных, а не передаются по цепочке. Ошибки ловятся обычным
      `try/catch`, условия и циклы с асинхронными шагами пишутся естественно, без вложенных колбэков.

      Подвохов несколько. Два `await` подряд выполняют независимые запросы последовательно — для
      параллельности нужен `Promise.all`. Методы массивов не ждут async-колбэки: `forEach` игнорирует
      возвращённые промисы, а `filter` считает промис истинным. Для фильтра сначала ждут `Promise.all`, а для
      последовательной обработки берут `for...of` с `await`. Вызов async-функции без `await` теряет её ошибку.
      И внутри `try` нужно писать `return await`, иначе `catch` не поймает отклонение.
    points:
      - async-функция всегда возвращает промис; return выполняет, throw отклоняет
      - await приостанавливает только функцию, продолжение — в микрозадаче
      - Это синтаксис над промисами, код читается как синхронный, ошибки — через try/catch
      - Два await подряд — последовательно; параллельно — Promise.all
      - Методы массивов не ждут async-колбэки
      - Забытый await теряет ошибку; в try — return await
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function
      - https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Async_JS/Promises#async_and_await
