topic: typescript
subtopic: runtime
questions:
  - id: speech-typescript-runtime-001
    level: middle
    tags: [type-erasure]
    question: |
      Что остаётся от TypeScript после компиляции?
    answer: |
      Почти ничего. TypeScript — это JavaScript плюс типы, и типы стираются: аннотации, `interface`, `type`,
      дженерики, `as`, модификаторы `readonly` и `private` исчезают, остаётся обычный JS. Компилятор проверяет
      код заранее, а в рантайме никаких проверок нет.

      Отсюда практические следствия. Нельзя проверить интерфейс через `instanceof` — его просто не существует.
      `as number` ничего не преобразует, это только обещание компилятору. И главное: данные, которые приходят
      снаружи — ответ сервера, `localStorage`, `JSON.parse`, — типы не защищают. Если сервер прислал не то,
      код упадёт в рантайме, хотя всё скомпилировалось. Такие данные проверяют вручную или схемами вроде zod,
      а уже потом доверяют типам.

      Исключения — конструкции с рантайм-смыслом: `enum`, `namespace`, свойства-параметры в конструкторе
      класса и старые декораторы. Они порождают код. Сейчас их всё чаще избегают: Node умеет запускать TS,
      просто вырезая типы, и для таких сценариев есть флаг `erasableSyntaxOnly`.
    points:
      - Типы стираются, в рантайме проверок нет
      - Интерфейс нельзя проверить через instanceof
      - as не преобразует значение
      - Внешние данные проверяют в рантайме (схемы)
      - Код порождают enum, namespace, parameter properties
    links:
      - https://www.typescriptlang.org/docs/handbook/2/basic-types.html#erased-types
    source: own

  - id: speech-typescript-runtime-002
    level: middle
    tags: [enum, union, as-const]
    question: |
      Почему многие отказываются от `enum`?
    answer: |
      `enum` — одна из немногих конструкций TypeScript, которая не стирается, а превращается в
      JavaScript-объект. В остальном TS — это «JS плюс типы», а `enum` из этой модели выпадает: добавляет код
      в бандл и не работает там, где TypeScript запускают простым вырезанием типов, например в Node с type
      stripping.

      Есть и неудобства в поведении. У числового `enum` есть обратное отображение — объект содержит и имена, и
      числа, поэтому `Object.keys` даёт вдвое больше ключей, чем ожидаешь. Строковый `enum` номинален:
      функция, принимающая `Color`, не примет строку `'RED'`, даже если это ровно значение `Color.Red`, —
      приходится везде импортировать сам `enum`.

      Альтернативы проще. Если значения нужны только в типах — union литералов `'light' | 'dark'`. Если нужен
      и объект в рантайме, например для перебора или выпадающего списка, — объект `as const` и тип из него:
      `type Theme = (typeof THEMES)[keyof typeof THEMES]`. Это обычный JavaScript, который понимают все
      инструменты.
    points:
      - enum порождает JS-код, union стирается
      - Не работает при простом вырезании типов (erasableSyntaxOnly)
      - Числовой enum — обратное отображение и лишние ключи
      - Строковый enum не принимает строковый литерал
      - Альтернативы — union литералов и объект as const
    links:
      - https://www.typescriptlang.org/docs/handbook/enums.html#objects-vs-enums
    source: own
