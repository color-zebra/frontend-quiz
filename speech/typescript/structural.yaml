questions:
  - id: speech-typescript-structural-001
    level: junior
    tags: [structural-typing]
    question: |
      Что значит «структурная типизация» в TypeScript?
    answer: |
      Это значит, что TypeScript сравнивает типы по форме, а не по имени. Если у значения есть все свойства,
      которые требует тип, и они подходящих типов, значение этому типу подходит. Неважно, как тип называется и
      каким классом создан объект. Например, экземпляр класса `Vector` с полями `x` и `y` можно передать в
      функцию, которая ждёт `interface Point { x: number; y: number }`, без всякого `implements`.

      Противоположность — номинальная типизация в Java или C#: там класс подходит под интерфейс, только если
      явно его реализует, а два класса с одинаковыми полями — разные типы. Структурный подход естественен для
      JavaScript, где объекты чаще создают литералами, чем классами.

      У него есть следствия. Лишние свойства обычно не мешают — исключение только для свежих объектных
      литералов, там срабатывает проверка лишних свойств. И два «разных по смыслу» типа одной формы не
      различаются: `UserId` и `OrderId`, оба `string`, легко перепутать. Для этого придумали бренды — `type
      UserId = string & { __brand: 'UserId' }`.
    points:
      - Совместимость — по набору свойств, а не по имени
      - Класс подходит под интерфейс без implements
      - Номинальная типизация (Java, C#) — наоборот
      - Лишние свойства разрешены, кроме свежих литералов
      - Одинаковые по форме типы не различаются — бренды
    links:
      - https://www.typescriptlang.org/docs/handbook/type-compatibility.html
    source: own
