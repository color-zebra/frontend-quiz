questions:
  - id: speech-typescript-basics-001
    level: middle
    tags: [any, unknown]
    question: |
      Чем `unknown` отличается от `any`?
    answer: |
      Оба типа принимают любое значение, разница в том, что потом с этим значением можно делать. `any`
      полностью выключает проверку: можно вызвать любой метод, прочитать любое свойство, передать куда угодно,
      и компилятор промолчит. Хуже того, `any` распространяется: результат `anyValue.foo.bar()` снова `any`, и
      незаметно «заражает» соседний код.

      `unknown` — безопасный вариант. Присвоить в него можно что угодно, а вот использовать нельзя, пока не
      докажешь компилятору, что там: `typeof value === 'string'`, `instanceof`, проверка через type guard или
      схему вроде zod. Присвоить `unknown` в переменную конкретного типа без проверки тоже нельзя.

      На практике я ставлю `unknown` везде, где данные приходят «снаружи» и форма не гарантирована: результат
      `JSON.parse`, ответ API, переменная в `catch` (в `strict` она и так `unknown`). А `any` допустим разве
      что при миграции с JavaScript или в типах сторонних библиотек, и такие места лучше помечать и постепенно
      убирать.
    points:
      - Оба принимают любое значение
      - any отключает проверки и распространяется по коду
      - unknown требует сузить тип перед использованием
      - unknown нельзя присвоить конкретному типу без проверки
      - unknown — для внешних данных и catch, any — только временно
    links:
      - https://www.typescriptlang.org/docs/handbook/2/functions.html#unknown
    source: own
