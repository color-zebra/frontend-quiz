# Проверка базы, сборка questions.json и приложения, выкладка на GitHub Pages.
# Если в базе ошибка, pnpm build завершается с ошибкой и деплой не идёт — на сайте остаётся прошлая версия.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Свои наборы и примеры в сайт не входят — их правки сайт не пересобирают. Исключение — каталог готовых
    # наборов custom-sets/catalog.yaml: он собирается в приложение. Правка самого набора из каталога сайт не
    # пересобирает — число вопросов в карточке обновится со следующим деплоем (или запусти его вручную).
    # Порядок строк важен: следующая строка перекрывает предыдущие.
    # Если в пуше есть и другие файлы, деплой пойдёт как обычно.
    paths:
      - "**"
      - "!custom-sets/**"
      - "!examples/**"
      - "custom-sets/catalog.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только один деплой; новый пуш дожидается текущего, а не обрывает его.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Версию pnpm берёт из packageManager в package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: Проверить базу и собрать questions.json
        run: pnpm build

      - name: Собрать приложение
        run: pnpm -F frontend-quiz-app build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
