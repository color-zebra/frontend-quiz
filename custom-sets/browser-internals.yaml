      - text: 'Закрыть DevTools и снять снимок кучи из встроенного диспетчера задач Chrome'
        why: 'Диспетчер задач показывает только числа памяти, снимков он не делает.'
      - text: 'Заменить console.log на console.dir — он не держит выведенные объекты'
        why: 'console.dir тоже выводит объект для раскрытия и держит его так же.'
      - text: 'Перед снимком нажать Collect garbage, чтобы консоль отпустила объекты'
        why: 'Ссылки из консоли — настоящие ссылки, сборка мусора их не тронет. К тому же снимок и так начинается со сборки.'
    explanation: |
      Отладка сама может удерживать объекты: консоль хранит ссылки на всё, что выводили или вычисляли, чтобы это можно
      было раскрыть. В снимке кучи такие объекты отмечает фильтр Objects retained by the DevTools console. Перед
      поиском утечки консоль очищают, а логи с объектами убирают из сценария.
    links:
      - https://developer.chrome.com/docs/devtools/memory-problems/heap-snapshots

