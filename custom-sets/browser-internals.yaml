      около 30. Что сделать в первую очередь?
    options:
      - text: 'Показывать сразу меньше строк: первые 100 и подгрузку по прокрутке'
        correct: true
        why: 'Показ — это стили, раскладка и отрисовка того, что вставили. Три тысячи строк дорого раскладывать, а видны тридцать. Меньше элементов — короче показ.'
      - text: 'Ускорить обработчик: перенести формирование строк в Web Worker'
        why: 'Обработка и так 20 мс. Воркер не умеет вставлять в DOM, а 425 мс уходят на раскладку уже вставленного.'
      - text: 'Добавить на кнопку debounce в 300 мс, чтобы не было двойных нажатий'
        why: 'Debounce уменьшает число запусков, но один запуск остаётся таким же долгим. Вдобавок к задержке добавятся 300 мс ожидания.'
      - text: 'Найти и убрать фоновые таймеры, которые мешают нажатию на кнопку'
        why: 'Ожидание ввода всего 5 мс: фон здесь не виноват.'
    explanation: |
      Сначала смотрят, какая часть задержки большая. Здесь — показ результата: обработчик быстрый, но вставил так
      много, что стили и раскладка заняли 425 мс. Лечат объёмом: показывают столько, сколько нужно человеку, а остальное
      подгружают по прокрутке или виртуализируют. Помогают и `content-visibility`, и отказ от чтения геометрии сразу
      после вставки.
    links:
      - https://web.dev/articles/optimize-inp

