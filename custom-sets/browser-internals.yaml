      - text: 'Переписать, но только порядок свойств: остальное на скорость не влияет'
        why: '`delete` и условные поля тоже влияют. Но главное — здесь нечего ускорять: сводка и так занимает 3 мс.'
      - text: 'Перенести сводку в Web Worker, чтобы V8 оптимизировал её отдельно'
