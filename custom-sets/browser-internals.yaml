    level: junior
    question: |
      Онлайн-школа собирает INP у учеников. Известно, что медленные нажатия бывают на странице урока, но непонятно,
      чей код в этот момент выполняется: свой, плеера или чата. Какой API браузера отвечает на вопрос «какие скрипты
      работали в долгом кадре»?
    options:
      - text: 'Long Animation Frames: у кадра есть список скриптов'
        correct: true
        why: 'Записи LoAF описывают кадры, задержанные больше чем на 50 мс, и перечисляют скрипты: что их вызвало, из какого файла, какая функция, сколько длились.'
      - text: 'User Timing: performance.mark сам отмечает каждый скрипт страницы'
        why: 'User Timing ставит только те отметки, которые вы расставили сами. О чужих скриптах он ничего не знает.'
      - text: 'Navigation Timing: время загрузки страницы по этапам'
        why: 'Он описывает загрузку документа — от запроса до события load. О кадрах после загрузки и скриптах в них не говорит.'
      - text: 'Long Tasks: у долгой задачи есть файл и функция'
        why: 'Long Tasks сообщает о задачах длиннее 50 мс, но почти не говорит, чей код в них выполнялся. Поэтому его и дополнили LoAF.'
    explanation: |
      Long Animation Frames API (Chrome 123+) — записи о долгих кадрах со списком скриптов: `invoker`, `sourceURL`,
      `sourceFunctionName`, `duration`, `forcedStyleAndLayoutDuration`. Его получают через `PerformanceObserver`
      с типом `long-animation-frame`, а библиотека web-vitals в сборке с атрибуцией прикладывает такие записи
      к медленному взаимодействию.
    links:
      - https://developer.chrome.com/docs/web-platform/long-animation-frames

