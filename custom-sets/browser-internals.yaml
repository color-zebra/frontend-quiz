      моменту давно загружена. Разработчик хочет записать профиль. Как записать так, чтобы причина была видна?
    options:
      - text: 'Инкогнито, замедление процессора 4×, Record, выбор папки, секунда ожидания, Stop'
        correct: true
        why: 'Нужна работа уже открытой страницы, поэтому Record, а не запись загрузки. Короткая запись одного действия в условиях, похожих на людей, даёт чистый профиль.'
      - text: 'Record and reload, затем сразу выбрать папку и остановить запись через минуту'
        why: 'Запись загрузки перемешает загрузку и выбор папки, а минута записи утопит нужное действие в лишнем.'
      - text: 'Обычное окно с расширениями, без замедления, записать полчаса работы с почтой'
        why: 'Расширения попадут в профиль, без замедления проблема может не проявиться, а полчаса записи невозможно прочитать.'
      - text: 'Запустить Lighthouse на странице «Входящих» и открыть трассировку его отчёта'
        why: 'Lighthouse в обычном режиме меряет загрузку страницы и не выбирает папку. Нужного действия в его записи не будет.'
    explanation: |
      Хорошая запись — короткая, одно действие, в похожих на реальные условиях. Record (Ctrl+E) записывает работу
      открытой страницы, Record and reload — загрузку. Инкогнито убирает код расширений, замедление процессора
      приближает компьютер разработчика к компьютерам людей. Чем меньше лишнего в записи, тем быстрее находится причина.
    links:
      - https://developer.chrome.com/docs/devtools/performance

  - id: brw-028
    topic: 'Скорость: найти и починить'
    subtopic: Вкладка Performance
    level: senior
    question: |
      В конструкторе отчётов построение диаграммы занимало одну долгую задачу на 700 мс. Её разбили на куски с
      `scheduler.yield()`. Новая запись: красных долгих задач нет, а Scripting в Summary по-прежнему около 700 мс.
      Как оценить результат?
    options:
      - text: 'Отклик починен; если нужно и строить быстрее — сокращать саму работу'
        correct: true
        why: 'Разбиение не уменьшает работу, а даёт браузеру обрабатывать ввод и рисовать кадры между кусками. Это лечит заморозку, а не время построения.'
      - text: 'Ничего не изменилось: те же 700 мс работы, значит, правка бесполезна'
        why: 'Для человека изменилось главное: страница больше не замерзает, ввод и кадры проходят. Общее время работы разбиение и не обещало уменьшить.'
      - text: 'Стало хуже: накладные расходы на уступки съели выигрыш, лучше вернуть одну задачу'
        why: 'Уступки действительно стоят немного времени, поэтому их делают раз в ~50 мс, а не после каждой мелочи. Но выигрыш в отзывчивости важнее.'
      - text: 'Нужно проверить на записи загрузки: разбиение работает только при Record and reload'
        why: 'Разбиение работает в любой момент жизни страницы. Сравнивают ту же запись того же сценария, что и до правки.'
    explanation: |
      Сравнение «до» и «после» отвечает на вопрос, который решала правка. Разбиение на части с уступками браузеру
      убирает долгие задачи: между кусками проходят ввод и кадры, страница живая. Общее время работы при этом
      почти не меняется. Если важна и скорость построения, нужен другой способ — сократить работу или перенести её
      в Web Worker.
    links:
      - https://web.dev/articles/optimize-long-tasks

  - id: brw-029
    topic: 'Скорость: найти и починить'
    subtopic: Медленные взаимодействия
    level: junior
    question: |
      В текстовом редакторе обработчик кнопки «Жирный» работает 5 мс. Но иногда нажатие отзывается через 300 мс:
      профиль показывает, что в этот момент шла задача автосохранения на 290 мс, а обработчик ждал её конца.
      К какой части задержки относятся эти 290 мс?
    options:
      - text: 'К ожиданию ввода'
        correct: true
        why: 'Ожидание ввода — время от нажатия до начала обработчиков. Обработчик не мог начаться, пока поток был занят автосохранением.'
      - text: 'К обработке'
        why: 'Обработка — время работы обработчиков этого взаимодействия. Здесь они работали 5 мс.'
      - text: 'К показу результата'
        why: 'Показ — время от конца обработчиков до кадра. Автосохранение шло до обработчика, а не после него.'
      - text: 'Ни к одной из трёх'
        why: 'Задержка меряется от действия человека до кадра, и всё, что заняло поток в это время, входит в одну из трёх частей.'
    explanation: |
      Задержку взаимодействия раскладывают на ожидание ввода, обработку и показ результата. Большое ожидание значит,
      что в момент нажатия поток был занят чем-то другим, — здесь автосохранением. Лечат не обработчик кнопки,
      а фон: автосохранение разбивают на части, запускают реже или переносят тяжёлую часть с основного потока.
    links:
      - https://web.dev/articles/optimize-inp

  - id: brw-030
    topic: 'Скорость: найти и починить'
