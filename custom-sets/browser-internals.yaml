        why: 'Семь разных наборов полей — семь скрытых классов: место чтения в area видит больше четырёх форм, и кэш мегаморфный. С одинаковым набором полей у всех фигур один скрытый класс, и чтение снова мономорфное.'
      - text: 'Ничего не менять: кэш мономорфный, свойство width у всех называется одинаково'
        why: 'Кэш запоминает не имя свойства, а скрытый класс объекта и смещение в нём. У фигур разной формы width лежит в разных местах.'
      - text: 'Ничего не менять: полиморфный кэш в V8 работает с любым числом классов'
        why: 'Полиморфный кэш в V8 держит до четырёх классов. Семь разных наборов полей — семь скрытых классов, это уже мегаморфный случай, и чтение идёт медленным общим путём.'
      - text: 'Удалять через delete поля, которые не нужны фигуре, чтобы объекты стали похожими'
        why: '`delete` переводит объект в медленный режим словаря — станет только хуже. Похожими объекты делает одинаковое создание, а не удаление.'
    explanation: |
      Скрытый класс зависит от набора свойств и порядка их добавления, а не от того, какой это вид фигуры. Если поля
      добавляются по условию, одна сущность получает много форм, и встроенный кэш в горячем месте становится мегаморфным. Лечат созданием
      объектов одинаково: одна фабрика или класс, все поля сразу, в одном порядке, отсутствующие — `null`
      или значение по умолчанию. Выигрыш заметен только в горячем коде, поэтому начинают с профиля.
    links:
      - https://mathiasbynens.be/notes/shapes-ics

