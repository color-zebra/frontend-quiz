  - id: brw-053
    topic: Движок
    subtopic: Как V8 выполняет код
    level: junior
    question: |
      Функция расчёта стоимости доставки тысячи раз получала числа, и V8 оптимизировал её. Потом в неё пришла
      строка `"150"`. Что сделает движок?
    options:
      - text: 'Выбросит оптимизированный код и вернётся к байт-коду — это деоптимизация'
        correct: true
        why: 'Оптимизированный код построен на ставке «здесь всегда числа». Проверка ставки срабатывает, и V8 продолжает выполнение в интерпретаторе.'
      - text: 'Выбросит ошибку TypeError: тип аргумента не совпал с оптимизированным'
        why: 'JavaScript не проверяет типы аргументов, и оптимизация не меняет поведение кода. Результат будет тем же, что и без неё.'
      - text: 'Молча приведёт строку к числу, чтобы не терять оптимизацию'
        why: 'Движок не меняет смысл программы. Если код складывает строку и число, получится склейка строк, как и положено по языку.'
      - text: 'Перекомпилирует функцию в TurboFan заново, не возвращаясь к интерпретатору'
        why: 'Сначала происходит возврат к байт-коду. Подняться по уровням снова функция может позже, уже с учётом новых типов.'
    explanation: |
      Оптимизирующие компиляторы V8 — Maglev и TurboFan — делают спекулятивный код по обратной связи о типах, которую
      собрал интерпретатор Ignition. Если ставка не сыграла, срабатывает деоптимизация: выполнение продолжается
      в байт-коде, поведение программы не меняется. Разовая деоптимизация незаметна, постоянные — тратят время
      на компиляцию впустую.
    links:
      - https://v8.dev/blog/maglev

  - id: brw-054
    topic: Движок
    subtopic: Как V8 выполняет код
    level: middle
    multiple: true
    question: |
      Какие пары объектов получат в V8 один и тот же скрытый класс?
    options:
      - text: '`{ city: "Тула", zip: "300000" }` и `{ city: "Омск", zip: "644000" }`'
        correct: true
        why: 'Те же свойства в том же порядке, разные только значения. Скрытый класс хранит имена и порядок свойств, а не значения.'
      - text: '`{ city: "Тула", zip: "300000" }` и `{ zip: "644000", city: "Омск" }`'
        why: 'Те же свойства, но в другом порядке. Порядок добавления важен: это разные скрытые классы.'
      - text: '`new Point(1, 2)` и `new Point(5, 7)`, где конструктор ставит x, потом y'
        correct: true
        why: 'Конструктор добавляет свойства в одном и том же порядке для всех экземпляров — классы и фабрики дают одну форму сами.'
      - text: '`{ city: "Тула" }` и такой же объект, которому потом добавили `zip`'
        why: 'Добавление свойства после создания переводит второй объект в новый скрытый класс.'
    explanation: |
      Скрытый класс (в V8 — Map, в литературе — shape) описывает, какие у объекта свойства, в каком порядке и где
      каждое лежит. Объекты с одинаковым набором свойств, добавленных в одном порядке, делят один класс, и обращение
      к свойствам у них быстрое. Поэтому объекты одной сущности создают одинаково — классом, фабрикой или литералом
      со всеми полями сразу.
    links:
      - https://mathiasbynens.be/notes/shapes-ics

