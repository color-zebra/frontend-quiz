      - text: 'Картинка лежит внутри файла main.js и скачивается вместе с ним'
        why: 'Это отдельный запрос со своей строкой в таблице. main.js только попросил его выполнить.'
      - text: 'Браузер нашёл картинку при разборе HTML страницы в строке 42'
        why: 'Если бы картинку нашёл разбор HTML, инициатором была бы страница, например `index.html:42`, а не скрипт.'
      - text: 'main.js:42 — номер строки, где картинка впервые показана на экране'
        why: 'Initiator говорит, откуда пришёл запрос, а не где показан результат. О показе говорят LCP и кадры записи.'
    explanation: |
      Колонка Initiator в водопаде показывает, кто вызвал запрос: разбор HTML (строка разметки), скрипт или стиль.
      Если главную картинку вызвал скрипт, браузер не мог начать её загрузку раньше, чем скрипт скачается
      и выполнится. Это растит задержку начала загрузки в LCP. Лечение — поставить картинку в HTML или объявить
      её через `<link rel="preload">`.
    links:
      - https://developer.chrome.com/docs/devtools/network/reference

  - id: brw-036
    topic: 'Скорость: найти и починить'
    subtopic: Загрузка страницы
    level: middle
    question: |
      У страницы фильма в онлайн-кинотеатре LCP — постер — 3,2 секунды. Разбивка: время до первого байта 0,4 с,
      задержка начала загрузки 0,1 с, загрузка постера 2,6 с, задержка отрисовки 0,1 с. Постер — PNG на 3 МБ,
      показывается в 400 px. Что сделать?
    options:
      - text: 'Уменьшить файл постера: современный формат и размер под экран'
        correct: true
        why: 'Большая часть — загрузка самого файла. Три мегабайта для картинки шириной 400 px — лишнее: сжатый файл нужного размера качается в разы быстрее.'
      - text: 'Поставить постеру fetchpriority="high", чтобы он загрузился раньше'
        why: 'Задержка начала загрузки уже 0,1 с: браузер берётся за постер почти сразу. Приоритет не уменьшит три мегабайта.'
      - text: 'Перенести скрипты в конец страницы, чтобы они не мешали отрисовке'
        why: 'Задержка отрисовки — 0,1 с, скрипты почти не мешают. Время уходит на скачивание файла.'
      - text: 'Ускорить ответ сервера: кэшировать HTML страницы фильма'
        why: 'Время до первого байта 0,4 с — нормальное. Даже если довести его до нуля, LCP останется около 2,8 с.'
    explanation: |
      LCP с картинкой раскладывают на четыре части и смотрят, какая выбивается. Ориентир web.dev: время до первого
      байта и загрузка — примерно по 40 %, обе задержки — около нуля. Здесь задержки маленькие, а загрузка — 80 %
      всего времени, значит, лечат размер файла: формат AVIF или WebP, размер под реальную ширину, `srcset`
      и `sizes` (курс 3, урок «Картинки и видео»).
    links:
      - https://web.dev/articles/optimize-lcp

  - id: brw-037
    topic: 'Скорость: найти и починить'
    subtopic: Загрузка страницы
    level: middle
    question: |
      На сайте кулинарных рецептов главное фото рецепта скачивается к 1,2 секунды, а на экране появляется только
      к 2,5. Разбивка LCP: задержка отрисовки 1,3 с. В записи между этими моментами основной поток занят
      выполнением большого бандла приложения, подключённого обычным `<script>` в `<head>`. Что поможет?
    options:
      - text: 'Подключать бандл с defer и разбить, чтобы при загрузке выполнялось меньше'
        correct: true
        why: 'Задержка отрисовки — время, когда картинка уже есть, но кадр с ней не рисуется. Здесь поток занят скриптом: меньше и позже выполнять — значит раньше нарисовать.'
      - text: 'Поставить картинке fetchpriority="high", чтобы её отрисовали раньше'
        why: 'Картинка уже скачалась к 1,2 секунды. Приоритет загрузки не поможет кадру, который ждёт основной поток.'
      - text: 'Сжать картинку вдвое, чтобы она скачивалась и рисовалась быстрее'
        why: 'Ускорит загрузку, но картинка и сейчас ждёт не сети, а основного потока. Задержка отрисовки останется.'
      - text: 'Добавить картинке loading="lazy", чтобы она не мешала скрипту'
        why: 'Ленивая загрузка отложит картинку ещё больше. Главной картинке её не ставят никогда.'
    explanation: |
      Задержка отрисовки — от окончания загрузки главной картинки до её появления на экране. Обычно её создают
      блокирующие стили, синхронные скрипты или долгие задачи на основном потоке. `defer` снимает блокировку разбора,
      а разбиение кода уменьшает, сколько выполнять при загрузке. Здесь виноват скрипт, поэтому трогать картинку
      бесполезно.
    links:
      - https://web.dev/articles/optimize-lcp

  - id: brw-038
    topic: 'Скорость: найти и починить'
    subtopic: Загрузка страницы
    level: middle
    question: |
      В `<head>` блога подключены `vendor.js` и `app.js` обычными тегами `<script src>`. `app.js` использует функции
      из `vendor.js`, а оба работают с DOM страницы. Insights называет оба файла блокирующими. Какие атрибуты
      поставить?
    options:
      - text: 'defer обоим: качаются параллельно и выполняются по порядку'
        correct: true
        why: '`defer` не останавливает разбор HTML и сохраняет порядок выполнения скриптов. app.js выполнится после vendor.js, и DOM к этому моменту будет готов.'
      - text: 'async обоим: качаются параллельно и выполняются как можно раньше'
        why: '`async` не гарантирует порядок: app.js может выполниться раньше vendor.js и упасть. К тому же DOM в этот момент может быть не разобран.'
      - text: 'async у vendor.js и defer у app.js, чтобы библиотека успела первой'
        why: 'Скрипт с async может выполниться и раньше, и позже defer-скрипта. Гарантии, что vendor.js будет первым, нет.'
      - text: 'Оставить без атрибутов, но добавить link rel="preload" для обоих файлов'
        why: 'Срочная загрузка начнёт скачивание раньше, но обычный скрипт всё равно остановит разбор HTML, пока выполняется. Блокировка останется.'
    explanation: |
      Обычный скрипт в `<head>` останавливает разбор страницы. `defer` — качать параллельно, выполнить после разбора
      в порядке подключения: подходит для кода приложения, которому нужен DOM и порядок. `async` — выполнить, как
      только скачался, в любом порядке: подходит для независимых скриптов вроде счётчика. Скрипты `type="module"`
      по умолчанию ведут себя как `defer`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/script

  - id: brw-039
    topic: 'Скорость: найти и починить'
    subtopic: Загрузка страницы
    level: senior
    question: |
      На лендинге авиакомпании главный элемент — фон-фотография в первом экране. Она задана в CSS через
      `background-image`, переделать её в `<img>` дизайнеры пока не дают. LCP request discovery в Insights пишет,
      что картинку нельзя найти в HTML. Что сделать?
    options:
      - text: 'Объявить фото в <head> через link rel="preload" с fetchpriority="high"'
        correct: true
        why: 'Срочная загрузка объявляет картинку прямо в HTML: браузер начнёт её качать сразу, не дожидаясь CSS. Высокий приоритет не даст ей встать в очередь за другими.'
      - text: 'Добавить link rel="prefetch" для фотографии, чтобы браузер скачал её заранее'
        why: '`prefetch` — предзагрузка для будущих переходов, с низким приоритетом. Для картинки текущей страницы он не годится.'
      - text: 'Поставить fetchpriority="high" всем картинкам на странице лендинга'
        why: 'Фон из CSS всё равно будет найден только после загрузки стилей, а высокий приоритет у всех картинок перестаёт что-либо значить.'
      - text: 'Перенести правило с background-image в отдельный файл стилей'
        why: 'Браузер найдёт картинку не раньше, чем скачает этот файл. Отдельный файл — ещё один запрос и та же задержка.'
    explanation: |
      Картинку, которую браузер узнаёт только из CSS или скрипта, можно объявить заранее: `<link rel="preload"
      as="image" href="…" fetchpriority="high">`. Это срочная загрузка для текущей страницы, в отличие от `prefetch` —
      предзагрузки для будущих переходов. Лучший вариант — всё же `<img>` в HTML: его находит сканер разметки,
      и он лучше работает с `srcset`.
    links:
      - https://web.dev/articles/optimize-lcp

  - id: brw-040
    topic: 'Скорость: найти и починить'
    subtopic: Загрузка страницы
    level: senior
    question: |
      В админке интернет-магазина Coverage показывает: из бандла на 900 КБ при загрузке и открытии списка заказов
      выполнилось 30 %. Коллега предлагает удалить из бандла весь серый код. Что ответить?
    options:
      - text: 'Серое не выполнилось за эту запись: редкий код выносят и грузят позже'
        correct: true
        why: 'Coverage знает только о действиях за время записи. Редкие экраны и диалоги будут серыми, но они нужны — их выносят в отдельные части и догружают позже.'
      - text: 'Удалять: серый код за запись не выполнился, значит, он мёртвый'
        why: 'Мёртвым код можно назвать, только если он не выполняется ни при каком сценарии. Coverage видел один сценарий — загрузку и список заказов.'
      - text: 'Ничего не делать: 900 КБ для внутренней админки — нормальный размер'
        why: 'Для внутреннего инструмента это бывает приемлемо, но 70 % невыполненного при загрузке — явный кандидат на разбиение, которое ускорит старт.'
      - text: 'Включить сжатие: Coverage считает байты до сжатия, по сети их меньше'
        why: 'Сжатие уменьшит передачу, но не время разбора и выполнения кода. И вопрос не о размере, а о том, что делать с серым кодом.'
    explanation: |
      Coverage показывает, какой код выполнился с начала записи: зелёное — выполненное, серое — нет. Это хороший
      повод разбить бандл: то, что нужно при загрузке, оставить, остальное грузить по требованию — по маршрутам
      и по действиям. Но серое не значит «ненужное»: код редких действий выполнится позже. Перед удалением проверяют
      всеми сценариями, а надёжнее — выносят и догружают.
    links:
      - https://developer.chrome.com/docs/devtools/coverage

  # ===================== Память =====================
  - id: brw-041
    topic: Память
    subtopic: Как браузер управляет памятью
    level: junior
    question: |
      Когда сборщик мусора в браузере может освободить память объекта?
    options:
      - text: 'Когда до объекта нельзя добраться ни от одного корня'
        correct: true
        why: 'Сборщик работает по достижимости: проходит от корней — глобального объекта, выполняющихся функций, документа, ждущих таймеров — и освобождает всё, до чего не дотянулся.'
      - text: 'Когда функция, в которой создан объект, закончила выполняться'
        why: 'Если объект вернули, сохранили в массив или замкнули в обработчике, он переживёт функцию. Важно, есть ли на него ссылки, а не где его создали.'
      - text: 'Когда переменной, где лежал объект, присвоили null'
        why: 'Это убирает одну ссылку. Если на объект ссылается что-то ещё, он останется жить.'
      - text: 'Когда объект не использовался дольше пяти минут'
        why: 'Сборщик не смотрит, как давно объектом пользовались. Нетронутый неделю, но достижимый объект живёт; недостижимый уходит при ближайшей сборке.'
    explanation: |
      Сборщик мусора освобождает объекты, недостижимые от корней: `window`, локальных переменных выполняющихся функций,
      документа с деревом DOM и ждущих таймеров. Отсюда главное правило про утечки: объект
      остаётся в памяти, пока на него ведёт хоть одна цепочка ссылок, даже если он давно не нужен.
    links:
      - https://developer.mozilla.org/ru/docs/Web/JavaScript/Guide/Memory_management

  - id: brw-042
    topic: Память
    subtopic: Как браузер управляет памятью
    level: middle
    question: |
      В редакторе диаграмм при перетаскивании фигур график JS heap в записи Performance идёт пилой: от 20 до 60 МБ
      и обратно, снова и снова. После «Collect garbage» в конце записи — 21 МБ, как в начале. Что это значит?
    options:
      - text: 'Утечки нет: это временные объекты, которые сборщик убирает'
        correct: true
        why: 'Пила, которая после сборки возвращается к исходному уровню, — нормальная жизнь страницы: временные объекты создаются и убираются.'
      - text: 'Это утечка: память растёт до 60 МБ при каждом перетаскивании'
        why: 'Утечка — это рост, который не уходит после сборки. Здесь после сборки снова 21 МБ.'
      - text: 'Сборщик мусора сломан и запускается слишком часто'
        why: 'Сборщик запускается тогда, когда молодое поколение заполняется. Частые сборки говорят о большом числе временных объектов, а не о поломке.'
      - text: 'Нужно снять снимок кучи и найти, кто держит 40 МБ'
        why: 'Ничего не держится: после сборки память вернулась. Снимок кучи пригодится, когда уровень растёт лестницей.'
    explanation: |
      Пила и лестница — два разных рисунка. Пила: память растёт от временных объектов и падает после сборки —
      это норма. Лестница: каждая итерация действия добавляет ступеньку, и после сборки уровень не возвращается — это
      утечка. Пила тоже бывает проблемой, если сборки часто прерывают кадры, но лечат её уменьшением числа временных
      объектов, а не поиском удерживающих ссылок.
    links:
      - https://developer.chrome.com/docs/devtools/memory-problems

  - id: brw-043
    topic: Память
    subtopic: Как браузер управляет памятью
    level: middle
    question: |
      В чате компонент списка сообщений при появлении делает
      `window.addEventListener("resize", () => this.layout())`, а при удалении —
      `window.removeEventListener("resize", () => this.layout())`. После часа работы в памяти десятки старых списков.
      В чём ошибка?
    options:
      - text: 'removeEventListener получает новую функцию, и снимать ему нечего'
        correct: true
        why: 'Каждая стрелочная функция — новый объект. Снять можно только ту же самую функцию, что передали при подписке; обработчик остаётся и держит компонент.'
      - text: 'Обработчики на window нельзя снять, пока страница открыта'
        why: 'Можно, если передать ту же функцию или подписаться с `signal` от `AbortController` и вызвать `abort()`.'
      - text: 'Стрелочные функции не замыкают this, поэтому компонент не освобождается'
        why: 'Наоборот, стрелочная функция берёт `this` снаружи — она и держит компонент. Но беда в том, что её не сняли.'
      - text: 'Событие resize срабатывает слишком часто и создаёт копии компонента'
        why: 'Частота события не создаёт компонентов. Копии остаются, потому что каждый старый компонент держит его неснятый обработчик.'
    explanation: |
      `removeEventListener` снимает обработчик, только если передать ту же самую функцию, что и при подписке.
      Сохраните её в поле или подписывайтесь с `{ signal }` от `AbortController` и при удалении вызывайте `abort()`:
      он снимет все подписки разом. Неснятый обработчик на `window` — одна из самых частых утечек в одностраничных приложениях:
      `window` — корень, обработчик замыкает компонент, компонент держит свой DOM.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/EventTarget/removeEventListener

  - id: brw-044
    topic: Память
    subtopic: Как браузер управляет памятью
    level: middle
    question: |
      В конструкторе анкет к каждому полю формы привязаны настройки проверки: `const rules = new Map();
      rules.set(inputElement, config);`. Поля часто удаляют и добавляют. Снимок памяти показывает, что удалённые поля
      живут дальше. Что изменить?
    options:
      - text: 'Заменить Map на WeakMap: запись не будет держать удалённое поле'
        correct: true
        why: '`WeakMap` держит ключ слабо: когда до поля нельзя добраться иначе, чем через эту запись, сборщик забирает и поле, и его настройки.'
      - text: 'Заменить Map на обычный объект, где ключом служит id каждого поля'
        why: 'Ключ-строка не держит элемент, но записи с настройками будут копиться вечно, пока их не удалят руками.'
      - text: 'Хранить в Map не сам элемент поля, а WeakRef на него'
        why: 'Элемент освободится, но запись в Map с конфигом останется навсегда. Это сложнее и хуже, чем WeakMap, который убирает запись целиком.'
      - text: 'Вызывать при удалении поля inputElement.remove() ещё раз'
        why: 'Повторное удаление ничего не даёт. Элемент держит ссылка из Map, а не документ.'
    explanation: |
      Обычный `Map` держит ключи сильно: элемент, удалённый со страницы, живёт, пока запись не удалят. `WeakMap`
      держит ключ слабо: нет других ссылок — запись исчезает вместе с объектом. Это стандартный способ прикрепить
      данные к DOM-узлу или чужому объекту. Ограничения: ключи только объекты, перебрать содержимое нельзя.
    links:
      - https://developer.mozilla.org/ru/docs/Web/JavaScript/Reference/Global_Objects/WeakMap

  - id: brw-045
    topic: Память
    subtopic: Как браузер управляет памятью
    level: senior
    question: |
      В веб-картах тайлы кэшируются в `Map`, где ключ — строка вида `"z12/x2391/y1277"`, а значение — декодированная
      картинка. За день прокрутки карты вкладка вырастает до двух гигабайт. Коллега предлагает заменить `Map`
      на `WeakMap`. Что предпочтительнее?
    options:
      - text: 'Ограничить кэш: держать 300 последних тайлов, старые вытеснять'
        correct: true
        why: 'Кэш, в который только добавляют, растёт бесконечно. Ограничение по числу записей с вытеснением давно не нужных держит память в рамках и сохраняет пользу кэша.'
      - text: 'Заменить Map на WeakMap — тайлы будут освобождаться сами'
        why: 'Ключи `WeakMap` могут быть только объектами, строку не передать. А если завести объекты-ключи, их никто не держит, и кэш опустеет при первой же сборке.'
      - text: 'Обернуть каждую картинку в WeakRef, чтобы сборщик забирал их при нехватке памяти'
        why: 'Сборщик заберёт картинки, когда захочет, — может, сразу. Кэш станет непредсказуемым, а записи с пустыми ссылками всё равно будут копиться.'
      - text: 'Вызывать сборку мусора вручную через кнопку раз в минуту, пока карта открыта'
        why: 'Кнопка Collect garbage есть только в DevTools. И сборка не поможет: все тайлы достижимы через Map.'
    explanation: |
      Кэш без ограничения — классическая утечка: каждая запись достижима через `Map`, и сборщик честно её держит.
      Лечат политикой вытеснения: ограничить число записей или общий размер и выбрасывать давно не нужные
      (так называемый LRU — least recently used). `WeakMap` здесь не подходит: ключи — строки, а смысл кэша —
      держать значения, даже когда на них больше никто не ссылается; слабый ключ выбросил бы их при первой сборке.
    links:
      - https://developer.mozilla.org/ru/docs/Web/JavaScript/Guide/Memory_management

  - id: brw-046
    topic: Память
    subtopic: Как браузер управляет памятью
    level: senior
    question: |
      В CRM после каждого открытия карточки клиента в Performance monitor число DOM Nodes вырастает примерно на 5000
      и не падает даже после сборки мусора, а JS heap size почти не меняется. Разработчик делает вывод: «куча
      не растёт — значит, утечки нет». Прав ли он?
    options:
      - text: 'Нет: узлы живут в памяти движка отрисовки, а не в куче JS'
        correct: true
        why: 'В куче JavaScript лежат лишь обёртки узлов, поэтому её счётчик рост почти не показывает. Рост узлов, который не уходит после сборки, — признак утечки отсоединённых элементов.'
      - text: 'Да: утечка в JavaScript видна прежде всего по счётчику JS heap size'
        why: 'Счётчик кучи JavaScript показывает не всю память страницы. Удерживаемые DOM-деревья растят прежде всего число узлов и общую память вкладки.'
      - text: 'Да: счётчик DOM Nodes учитывает только узлы, которые сейчас на странице'
        why: 'Если бы так было, счётчик не рос бы: на странице узлов не прибавляется. Он учитывает и отсоединённые узлы, которые кто-то держит, — поэтому рост и тревожный.'
      - text: 'Нет, но только потому, что сборщик ещё не дошёл до старого поколения'
        why: 'Сборка мусора уже была, а узлы не уменьшились. Значит, до них по-прежнему дотягиваются ссылки.'
    explanation: |
      По одному графику JS heap утечку DOM легко проглядеть. Если число узлов растёт с каждым повтором действия
      и не падает после сборки, а на странице их больше не становится, — значит, в памяти копятся отсоединённые
      элементы. Это частый случай: удалённая со страницы таблица, на которую остался обработчик или ссылка
      в массиве. Следующий шаг — снимок кучи и фильтр Detached.
    links:
      - https://developer.chrome.com/docs/devtools/memory-problems

  - id: brw-047
    topic: Память
    subtopic: Поиск утечек
    level: junior
    question: |
      В снимке кучи у объекта `PhotoViewer` две колонки размера: Shallow size — 120 байт, Retained size — 48 МБ.
      Какая из них показывает, сколько памяти освободится, если `PhotoViewer` исчезнет?
    options:
      - text: 'Retained size: объект вместе со всем, что живо только благодаря ему'
        correct: true
        why: 'Удерживаемый размер — сам объект плюс всё, до чего нельзя добраться иначе, чем через него. Здесь это, скорее всего, загруженные фотографии.'
      - text: 'Shallow size: память самого объекта, без того, на что он ссылается'
        why: 'Это только сам объект — 120 байт. Фотографии, на которые он ссылается, в него не входят, хотя освободятся вместе с ним.'
      - text: 'Обе одинаково: Retained — это Shallow, пересчитанный с учётом сжатия'
        why: 'Сжатие тут ни при чём. Колонки отвечают на разные вопросы: сколько весит объект и сколько он держит.'
      - text: 'Ни одна: это показывает только колонка Distance'
        why: 'Distance — число шагов от ближайшего корня. О размерах она ничего не говорит.'
    explanation: |
      Shallow size — собственный размер объекта, Retained size — удерживаемый: всё, что освободится вместе с ним.
      При поиске утечек сортируют по Retained size: маленький объект-обёртка часто держит мегабайты данных
      или DOM-дерево.
    links:
      - https://developer.chrome.com/docs/devtools/memory-problems/heap-snapshots

  - id: brw-048
    topic: Память
    subtopic: Поиск утечек
    level: middle
    question: |
      В трекере задач окно редактирования задачи открыли и закрыли десять раз между двумя снимками кучи. В виде
      Comparison у класса `TaskEditor`: # New — 10, # Deleted — 0. Что это значит?
    options:
      - text: 'Все десять закрытых окон в памяти — их что-то держит'
        correct: true
        why: 'Создано десять экземпляров, не удалено ни одного, хотя окна закрыты. Следующий шаг — открыть любой из них и прочитать Retainers.'
      - text: 'Всё в порядке: сборщик мусора просто ещё не успел их собрать'
        why: 'Перед каждым снимком браузер запускает сборку мусора. Если объекты в снимке, они удерживаются.'
      - text: 'Окна переиспользуются: один объект учитывается десять раз'
        why: '# New считает новые объекты с разными идентификаторами. Десять новых — десять разных экземпляров.'
      - text: 'Утечка есть, но в DOM: класс TaskEditor здесь ни при чём'
        why: 'TaskEditor — объект JavaScript, и десять живых экземпляров — именно он. DOM окон, скорее всего, держится через него.'
    explanation: |
      Вид Comparison показывает разницу между двумя снимками: сколько объектов каждого класса появилось и исчезло.
      Если после N закрытий осталось N экземпляров, утечка почти доказана. Дальше выбирают один экземпляр и читают
      его Retainers: цепочка до корня покажет, какую ссылку забыли убрать.
    links:
      - https://developer.chrome.com/docs/devtools/memory-problems/heap-snapshots

  - id: brw-049
    topic: Память
    subtopic: Поиск утечек
    level: middle
    question: |
      В каталоге интернет-магазина фильтр по классу Detached показывает сотни `Detached <div>`. У одного из них Retainers:
      `[37] in Array @5120` → `cardsCache in ProductList @4410` → `productList in Window`. Где ошибка?
    options:
      - text: 'В массиве cardsCache: в нём остаются карточки, убранные со страницы'
        correct: true
        why: 'Цепочка читается от элемента к корню: карточку держит 37-й элемент массива, массив — поле cardsCache, список — глобальная переменная. Убирать нужно ссылку из массива.'
      - text: 'В самом элементе div: его нужно ещё раз удалить со страницы через remove()'
        why: 'Элемент уже отсоединён — его нет в документе. Держит его не страница, а массив.'
      - text: 'В объекте Window: глобальная переменная productList и есть утечка'
        why: 'Список товаров нужен странице, и держать его в глобальной переменной — не ошибка. Лишняя ссылка — в массиве cardsCache, где остаются убранные карточки.'
      - text: 'В обработчике прокрутки каталога: он вызывается слишком часто и создаёт лишние карточки'
        why: 'Частота создания сама ничего не держит: созданные карточки ушли бы при сборке. Их держит массив cardsCache — это и показывает цепочка в Retainers.'
    explanation: |
      Retainers читают от выбранного объекта вверх, к корню. Каждая строка — кто ссылается на предыдущий объект
      и в каком поле. Обычно чинить нужно звено, где ссылка лишняя: здесь массив, в который карточки кладут, но
      из которого не убирают. Варианты — чистить кэш при перерисовке, ограничить его или хранить данные карточек,
      а не сами элементы.
    links:
      - https://developer.chrome.com/docs/devtools/memory-problems/heap-snapshots

