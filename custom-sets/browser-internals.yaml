    level: junior
    question: |
      Пользователи веб-мессенджера пишут: «утром всё летает, к вечеру интерфейс вязнет, после перезагрузки вкладки
      снова нормально». На какие причины в первую очередь указывает такой симптом?
    options:
      - text: 'На то, что копится в странице: утечку памяти или фоновую работу'
        correct: true
        why: 'Ухудшение со временем и помощь перезагрузки значат, что что-то накапливается в самой вкладке. Это утечка или таймеры и подписки, которые множатся.'
      - text: 'На медленную загрузку: тяжёлые скрипты и картинки первого экрана'
        why: 'Загрузка одинакова утром и вечером, а перезагрузка её бы не ускорила. Жалоба на то, что происходит после неё.'
      - text: 'На медленный сервер: к вечеру растёт нагрузка и ответы приходят позже'
        why: 'Перезагрузка вкладки не разгрузила бы сервер. То, что она помогает, указывает на причину внутри страницы.'
      - text: 'На медленный обработчик одной из кнопок в интерфейсе мессенджера'
        why: 'Медленный обработчик был бы медленным и утром. Здесь важна зависимость от времени работы.'
    explanation: |
      Уточнение симптома сужает поиск. «Хуже со временем» и «перезагрузка помогает» указывают на накопление внутри
      страницы: утечку памяти или фоновые задачи, которых становится всё больше — таймеры, подписки, наблюдатели,
      которые не останавливают. Дальше проверяют обе гипотезы: Performance monitor и снимки памяти для утечки, запись
      без действий для фоновой работы.
    links:
      - https://developer.chrome.com/docs/devtools/memory-problems

  - id: brw-071
    topic: Итог
    subtopic: Разбор дашборда
    level: middle
    question: |
      В трекере задач к вечеру нажатия иногда отвечают через секунду. Разработчик имитировал несколько часов работы
      и записал 10 секунд в Performance, ничего не нажимая. В записи — регулярные пачки долгих задач, а внутри них
      колбэки таймеров. Какой следующий шаг?
    options:
      - text: 'В Bottom-up найти функцию и посчитать, сколько её копий работает'
        correct: true
        why: 'Запись без действий показала фоновую работу. Bottom-up назовёт функцию и файл, а число одинаковых задач в пачке подскажет, что таймеры множатся.'
      - text: 'Записать ещё раз, но уже нажимая кнопки, чтобы поймать медленное нажатие'
        why: 'Медленное нажатие — следствие: оно ждёт фоновые задачи. Их уже видно, нужно понять, чьи они.'
      - text: 'Включить замедление сети, чтобы проверить, не тормозят ли запросы'
        why: 'В записи долгие задачи на основном потоке, а не ожидание сети. Замедление сети ничего не прояснит.'
      - text: 'Сразу заменить во всём проекте каждый setInterval на setTimeout'
        why: 'Это правка вслепую. Сначала нужно найти, какой именно таймер и почему он работает лишний раз.'
    explanation: |
      Запись без действий — способ увидеть фоновую работу: таймеры, опросы, обновления, которые идут сами. Если в ней
      пачки одинаковых задач, Bottom-up покажет функцию и строку, а число задач в пачке — сколько копий таймера живёт.
      Дальше — проверка памятью: `queryObjects` и снимки кучи покажут, кто держит эти таймеры.
    links:
      - https://developer.chrome.com/docs/devtools/performance

