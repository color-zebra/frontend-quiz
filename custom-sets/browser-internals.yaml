# Свой набор с уроками: Браузер изнутри — event loop и кадр, конвейер отрисовки, принудительная раскладка,
# вкладка Performance, медленные взаимодействия, загрузка, память и утечки, движок V8, отладка, данные пользователей.
# Формат — как у любого стороннего набора (см. examples/README.md). В сборку приложения не входит.
# Уроки перечисляют свои вопросы полем questions; номера вопросов не менять — к ним привязан прогресс людей.
# Скриншоты DevTools сняты в Chrome 155 с демо-страниц app/public/demos/browser. План — plans/browser-course.md.
title: Браузер изнутри
features: [computer]
lessons:
  - id: brw-intro
    topic: Введение
    subtopic: Как искать причину тормозов
    title: Почему «тормозит» — не диагноз
    questions: [brw-001, brw-002, brw-078, brw-003, brw-004]
    body: |
      ## Какую проблему решаем

      «Пульс» — внутренний дашборд продаж сети магазинов товаров для дома. Им пользуются около трёхсот
      региональных менеджеров. Наверху фильтры: период, регион, статус заказа. Ниже три вкладки: «Обзор»
      с карточками и графиками, «Заказы» с таблицей последних двух тысяч заказов и «Клиенты». Написан дашборд на обычном
      JavaScript, без фреймворка, и за пару лет оброс функциями.

      В поддержку приходят жалобы, и все звучат почти одинаково: «Пульс тормозит». Если прочитать их внимательно,
      окажется, что люди жалуются на разное:
      - «утром открываю — пять секунд смотрю на пустой экран»;
      - «выбираю регион — и почти секунду ничего не происходит»;
      - «таблица дёргается, когда данные обновляются»;
      - «к концу дня вкладка съедает гигабайт памяти, ноутбук гудит».

      Это четыре разные болезни с разными причинами и разными лекарствами. Слово «тормозит» похоже на «болит»
      у врача: с него разговор начинается, но лечить по нему нельзя. Разработчик, который в ответ на «тормозит»
      сразу берётся что-то оптимизировать, часто чинит не то: ускоряет загрузку, когда жалуются на фильтр,
      или переписывает фильтр, когда виновата утечка памяти.

      Этот курс о том, как браузер превращает код в картинку на экране, откуда при этом берутся тормоза и утечки
      и как найти их причину инструментами браузера, а не догадками. Первый урок раскладывает жалобы по полочкам
      и даёт порядок работы, которым мы будем пользоваться весь курс.

      ## Четыре симптома

      Каждой жалобе соответствует свой механизм в браузере, свой инструмент и свой урок курса.

      - **Долго открывается.** Браузер ждёт сеть, скачивает и выполняет скрипты, прежде чем показать главное.
        - Где смотреть: вкладки Network и Performance с записью загрузки.
        - Метрика: LCP — время до отрисовки самого крупного элемента экрана.
        - Урок: «Загрузка страницы».
      - **Медленно отвечает.** Человек нажал, а реакция приходит с задержкой, потому что основной поток занят.
        - Где смотреть: вкладка Performance, дорожка Interactions.
        - Метрика: INP — время от нажатия до следующей отрисовки.
        - Уроки: «Event loop и кадр», «Медленные взаимодействия».
      - **Дёргается.** Прокрутка и анимации идут рывками: браузер не успевает рисовать кадры.
        - Где смотреть: вкладки Rendering и Performance, дорожка Frames.
        - Уроки: «Конвейер отрисовки», «Принудительная раскладка».
      - **Течёт память.** Чем дольше открыта вкладка, тем больше памяти она занимает. Сначала всё медленнее,
        потом Chrome может показать вместо страницы ошибку «Опаньки…» с кодом Out of Memory.
        - Где смотреть: вкладка Memory, диспетчер задач Chrome.
        - Уроки: «Как браузер управляет памятью», «Охота на утечку».

      Метрики LCP и INP подробно разобраны в курсе «Системный дизайн: доставка и качество», в уроке «Как измерить
      скорость». Здесь важно одно: каждая из них измеряет свой симптом, и плохое значение одной ничего не говорит
      о другой.

      Напомним и одно понятие из прошлых курсов, без которого дальше не обойтись. У страницы один **основной поток**
      (main thread): на нём по очереди выполняется ваш JavaScript, обрабатываются нажатия и рисуются кадры.
      **Долгая задача** (long task) — работа, которая занимает основной поток дольше 50 мс без перерыва. Пока она
      идёт, страница не отвечает. Почему это так, подробно — в следующем уроке.

      ## Цикл работы: измерить, найти, починить, проверить

      Поиск тормозов — это не угадывание, а цикл из четырёх шагов.

      1. **Измерить.** Превратить жалобу в число и сценарий, который можно повторить: «выбор региона на вкладке
         „Заказы“ занимает 820 мс на ноутбуке менеджера». Без числа нельзя понять, стало ли лучше.
      2. **Найти.** Записать работу браузера во время сценария и найти, на что уходит время: на какую функцию,
         какой этап отрисовки, какой запрос. Это и есть главная работа, и ей посвящена большая часть курса.
      3. **Починить.** Изменить именно то, что нашли, по одному изменению за раз. Если поменять пять вещей сразу,
         не узнать, какая помогла, а какая навредила.
      4. **Проверить.** Повторить тот же сценарий в тех же условиях и сравнить числа «до» и «после». Потом
         посмотреть, что изменилось у реальных людей.

      Шаг «найти» соблазнительно пропустить: кажется, что причина и так очевидна. Опыт говорит обратное: время
      почти всегда уходит не туда, куда думал автор кода. Мы увидим это не раз.

      ## Лаборатория и реальные люди

      Измерять можно в двух местах. **Лабораторный замер** — то, что вы делаете у себя в DevTools: один компьютер,
      одна сеть, повторяемые условия и подробная разбивка до строки кода. **Данные реальных пользователей** (field
      data, RUM) — замеры из браузеров настоящих людей, со всеми их старыми ноутбуками и медленными сетями. Курс 3
      сравнивает их подробно. Коротко: данные людей говорят, есть ли проблема и насколько она велика, а лаборатория
      помогает найти причину. Как собирать данные людей так, чтобы они подсказывали причину, — урок «Скорость
      у реальных людей» в конце курса.

      ## Как воспроизвести медленный компьютер у себя

      Главная ловушка лаборатории — мощный компьютер разработчика. У менеджеров «Пульса» ноутбуки на четыре-пять лет
      старше. Задача, которая у разработчика занимает 90 мс, у них может занимать 400–600 мс. Разработчик смотрит
      в профиль, видит 90 мс и решает, что проблемы нет.

      Поэтому в Chrome есть **замедление** (throttling). В панели Performance есть шестерёнка Capture settings,
      а в ней два списка.
      - **CPU** — замедление процессора. Варианты в Chrome 155: «4× slowdown – recommended» (в четыре раза
        медленнее), 6× и 20×. Есть и откалиброванные варианты Low-tier mobile и Mid-tier mobile. Их нужно один раз
        настроить кнопкой Calibrate…: Chrome измерит ваш компьютер и подберёт замедление так, чтобы получился слабый
        или средний телефон.
      - **Network** — замедление сети: Fast 4G, Slow 4G, 3G и Offline. Тот же список есть и в панели Network.

      Замедление процессора нужно, когда жалоба на работу в браузере: фильтр, прокрутку, отчёт. Замедление сети —
      когда жалоба на загрузку. Включать сеть 3G, чтобы найти медленный фильтр, бесполезно: фильтр работает
      с данными, которые уже скачаны.

      Есть и вторая ловушка — расширения браузера. Блокировщики рекламы, переводчики и менеджеры паролей выполняют
      свой код на странице, и он попадает в профиль. Поэтому записывают в окне инкогнито, где расширения по умолчанию
      выключены, или в отдельном профиле Chrome без расширений.

      ## Пример целиком: жалоба на фильтр

      Пройдём цикл на одной жалобе «Пульса», пока не вдаваясь в инструменты, — им посвящены следующие уроки.

      1. **Уточнить симптом.** Менеджер пишет «тормозит». Спрашиваем: когда именно? Оказывается, при выборе региона
         на вкладке «Заказы», с утра так же, как вечером, и на любом регионе. Значит, это не память: она бы копилась
         к вечеру. И не загрузка: страница уже открыта. Это медленный ответ на действие.
      2. **Измерить.** Разработчик открывает «Пульс» в инкогнито, включает замедление процессора в 4 раза и записывает
         в Performance выбор региона. Задержка — около 800 мс. У самого разработчика без замедления было 180 мс,
         поэтому он и не замечал проблему.
      3. **Найти.** В записи видно, что почти всё время занимает одна функция в обработчике выбора. Как это читать,
         разберём в уроках «Читаем вкладку Performance» и «Медленные взаимодействия».
      4. **Починить.** Исправляем найденную функцию, и только её.
      5. **Проверить.** Тот же сценарий, то же замедление, тот же регион: 140 мс. Через неделю смотрим данные
         пользователей: доля медленных выборов региона упала.

      ## Варианты подхода и их цена

      - **Сразу оптимизировать «всё подозрительное».**
        - Плюс: не нужно разбираться в инструментах.
        - Цена: время уходит на то, что не болит, а настоящая причина остаётся; код усложняется без пользы.
      - **Запустить автоматический аудит (Lighthouse) и исправить подсказки.**
        - Плюс: быстро, хороший список типовых проблем загрузки.
        - Цена: в обычном режиме Lighthouse проверяет загрузку одной страницы в лаборатории. О фильтре, который
          тормозит на ноутбуке менеджера, и об утечке памяти за рабочий день он ничего не скажет.
      - **Цикл «измерить → найти → починить → проверить».**
        - Плюс: чините то, что болит, и знаете, что починили.
        - Цена: нужно уметь читать инструменты и тратить время на воспроизведение.

      ## Типичные ошибки

      - **Чинить по слову «тормозит».** Не уточнив симптом, легко лечить загрузку, когда болит память.
      - **Мерить на своём компьютере без замедления.** Профиль показывает 90 мс, а у людей — полсекунды.
      - **Записывать с расширениями.** В профиль попадает чужой код, и его принимают за свой.
      - **Менять несколько вещей сразу.** Непонятно, что помогло, а что сделало хуже.
      - **Не проверять после починки.** «Должно стать быстрее» — не результат: нужен тот же замер в тех же условиях.

      ## Как спрашивают на интервью

      - «Пользователи жалуются, что приложение тормозит. С чего начнёте?» — ждут уточнение симптома, измерение
        и только потом поиск причины в инструментах.
      - «Почему у вас всё быстро, а у пользователей медленно?» — ждут разницу в железе и сети, замедление
        в DevTools и данные реальных пользователей.
      - «Как вы убедились, что оптимизация помогла?» — ждут повтор того же сценария в тех же условиях и сравнение
        чисел до и после.

      ## Коротко

      - «Тормозит» — не диагноз. За этим словом обычно один из четырёх симптомов: долго открывается, медленно
        отвечает, дёргается или течёт память. У каждого свой механизм, свой инструмент и своё лекарство.
      - Работают циклом: измерить, найти, починить, проверить. Шаг «найти» не пропускают: время почти всегда уходит
        не туда, куда думает автор кода.
      - Чинят по одному изменению за раз и проверяют тем же сценарием в тех же условиях, иначе неизвестно, что
        помогло.
      - Мощный компьютер разработчика прячет проблемы. Для работы в браузере включают замедление процессора
        (4× и сильнее), для загрузки — замедление сети.
      - Профиль записывают без расширений, например в окне инкогнито: их код тоже попадает в запись.
      - Лабораторный замер помогает найти причину, а данные реальных пользователей показывают, есть ли проблема
        и помогла ли починка.

      ## Источники

      - [Performance features reference — Chrome DevTools](https://developer.chrome.com/docs/devtools/performance/reference)
      - [Analyze runtime performance — Chrome DevTools](https://developer.chrome.com/docs/devtools/performance)

  - id: brw-event-loop
    topic: Как браузер рисует
    subtopic: Event loop и кадр
    title: Event loop и кадр
    computer: true
    questions: [brw-005, brw-006, brw-007, brw-008, brw-009, brw-010]
    body: |
      ## Какую проблему решаем

      На вкладке «Обзор» в «Пульсе» есть кнопка «Построить отчёт»: выручка, число заказов и медианный чек по каждому
      из 42 регионов за квартал. Менеджер нажимает её, и происходят странные вещи.
      - Надпись «Строим…», которую код ставит первой строкой обработчика, так и не появляется. Почти через секунду сразу
        появляется «Готово».
      - Секундомер в углу, который обновляется таймером раз в 50 мс, замирает на всё это время.
      - Менеджер начинает печатать в поле поиска — буквы не появляются, а потом выскакивают все разом.
      - При этом кружок-индикатор загрузки, нарисованный CSS-анимацией, продолжает крутиться как ни в чём не бывало.

      Почему код поставил надпись, а её не видно? Почему один индикатор замер, а другой крутится? Чтобы ответить,
      нужно понять, как браузер решает, что делать дальше: выполнять ваш код, обрабатывать нажатие или рисовать
      кадр. Этот механизм называется event loop.

      ## Задачи, очередь и цикл событий

      Почти всё, что делает браузер на основном потоке, оформлено как **задача** (task) — кусок работы, который
      выполняется от начала до конца, без перерывов. Задачи бывают такие:
      - обработать событие: клик, нажатие клавиши, прокрутку;
      - вызвать колбэк таймера `setTimeout` или `setInterval`;
      - обработать ответ сети: колбэки `XMLHttpRequest`;
      - доставить сообщение `postMessage` из другого окна или воркера;
      - разобрать очередной кусок HTML, выполнить скрипт из тега `<script>`.

      Задачи ждут в **очередях задач** (task queues). Их несколько: например, у ввода пользователя своя очередь,
      у таймеров своя. Браузер сам решает, из какой очереди взять следующую, и обычно отдаёт предпочтение вводу.

      **Цикл событий** (event loop) — это бесконечный цикл, который крутит основной поток. Его упрощённый оборот
      по спецификации HTML выглядит так.

      ![Один оборот цикла событий: взять одну задачу из очереди; выполнить все микрозадачи до конца, включая новые; если пора рисовать кадр — выполнить колбэки requestAnimationFrame, пересчитать стили, раскладку, отрисовать и собрать кадр; затем снова взять задачу](images/brw-event-loop.png "Пока идёт задача или микрозадачи, кадр не рисуется")

      1. Взять **одну** задачу из какой-нибудь очереди и выполнить её до конца.
      2. Выполнить все **микрозадачи**, которые накопились, — о них ниже.
      3. Если пора рисовать новый кадр, обновить картинку на экране: вызвать колбэки `requestAnimationFrame`,
         пересчитать стили, раскладку, отрисовать.
      4. Вернуться к шагу 1.

      **Кадр** (frame) — одно обновление картинки на экране. Экран с частотой 60 Гц показывает новую картинку
      60 раз в секунду, то есть раз в 16,7 мс. Браузер старается подготовить кадр к каждому такому моменту, если
      на экране что-то изменилось. Если ничего не менялось, кадр можно пропустить.

      Главное следствие: **кадр рисуется только между задачами**. Пока задача выполняется, браузер не может
      ни нарисовать изменения, ни обработать новый клик: они ждут своей очереди. Это и есть долгая задача
      из прошлого урока: всё, что длиннее 50 мс, человек начинает замечать как задержку.

      ## Микрозадачи

      **Микрозадача** (microtask) — маленький кусок работы, который должен выполниться сразу после текущего кода,
      до следующей задачи. Микрозадачи ставят:
      - обработчики промисов: колбэки `then`, `catch`, `finally` и продолжение функции после `await`;
      - `queueMicrotask(fn)`;
      - `MutationObserver` — уведомления об изменениях DOM.

      Правило у микрозадач жёстче, чем у задач: после каждой задачи браузер выполняет **всю очередь микрозадач
      до конца**, включая те, что добавились по ходу. Если микрозадача ставит новую микрозадачу, та выполнится
      в этом же заходе.

      Отсюда разница, которая удивляет многих. Цикл на `setTimeout`, который ставит себя снова и снова, страницу
      не вешает: между его задачами браузер успевает рисовать кадры и обрабатывать клики. А цикл на промисах,
      где каждый `then` ставит следующий, не отдаёт управление никогда: очередь микрозадач не пустеет, кадр
      не рисуется, вкладка висит намертво.

      ## В каком порядке это выполнится

      Классический вопрос с интервью.

      ```js
      console.log("1");
      setTimeout(() => console.log("timeout"), 0);
      Promise.resolve().then(() => console.log("micro"));
      requestAnimationFrame(() => console.log("raf"));
      console.log("2");
      ```

      - Сначала весь синхронный код: `1`, `2`. Это одна задача — выполнение скрипта.
      - Сразу после неё — микрозадачи: `micro`.
      - Дальше `timeout` и `raf`, но **их порядок не гарантирован**. Таймер — отдельная задача, а колбэк
        `requestAnimationFrame` вызывается перед ближайшим кадром. Если кадр подошёл раньше, чем браузер взял
        задачу таймера, первым будет `raf`. Чаще первым оказывается `timeout`, но полагаться на это нельзя.

      Ещё две детали о таймерах. Ноль в `setTimeout(fn, 0)` значит «как можно скорее», а не «мгновенно»: колбэк
      встанет в очередь и дождётся своей задачи. По спецификации HTML, если таймеры вложены друг в друга глубже
      пяти уровней, задержка становится не меньше 4 мс. А в фоновых вкладках Chrome сильно замедляет таймеры
      и останавливает `requestAnimationFrame` вовсе: кадры для невидимой вкладки никому не нужны.

      ## requestAnimationFrame против setTimeout

      `requestAnimationFrame(fn)` просит вызвать `fn` прямо перед следующим кадром. Поэтому анимацию, которую
      двигает JavaScript, делают на нём.
      - **На `requestAnimationFrame`** код выполняется ровно один раз на кадр, в правильный момент — перед
        пересчётом стилей и раскладки. При экране 120 Гц колбэк вызывается 120 раз в секунду, при 60 Гц — 60.
      - **На `setTimeout(fn, 16)`** таймер живёт своей жизнью. Иногда он срабатывает дважды между кадрами, и одна
        из работ пропадает зря. Иногда ни разу, и кадр показывает старую картинку. Глаз видит это как рывки.

      Колбэк получает время кадра. Положение анимации считают от прошедшего времени, а не от числа вызовов: тогда
      скорость одинакова и при 60, и при 120 Гц.

      Но `requestAnimationFrame` не ускоряет саму работу. Если колбэк считает 80 мс, кадр всё равно опоздает.

      ## Пример целиком: почему «Строим…» не видно

      Обработчик кнопки «Построить отчёт» устроен так.

      ```js
      button.addEventListener("click", () => {
        status.textContent = "Строим…";   // DOM изменился, но кадр ещё не нарисован
        const rows = buildReport();        // ~900 мс без перерыва на ноутбуке менеджера
        renderReport(rows);
        status.textContent = "Готово";
      });
      ```

      Пройдём по циклу событий.
      1. Клик — это задача. Браузер начинает выполнять обработчик.
      2. Первая строка меняет текст в DOM. Изменение записано, но рисовать его браузер будет только в шаге
         «обновить кадр», а до него ещё далеко.
      3. `buildReport` считает около 900 мс. Всё это время идёт одна задача. Тики секундомера, буквы в поле поиска,
         новые кадры ждут в очередях.
      4. Обработчик ставит «Готово» и заканчивается. Только теперь браузер рисует кадр, и в нём уже «Готово».
         Надпись «Строим…» существовала в DOM почти секунду, но ни разу не попала на экран.
      5. Потом выполняются накопившиеся задачи: тики секундомера, ввод букв. Буквы появляются все разом.

      А кружок крутится потому, что его анимацию ведёт не основной поток. Как это устроено, расскажет следующий урок.

      ## Как чинить: варианты и их цена

      Способы разгрузить основной поток подробно разобраны в курсе «Системный дизайн: реальное время и большие
      списки», в уроке «Тяжёлая работа без зависаний». Там четыре способа: сделать меньше работы, разбить её
      на части и уступать браузеру, унести в Web Worker или на сервер. Здесь посмотрим, как они работают
      на нашем отчёте.

      - **Сделать меньше работы.** `buildReport` для каждого из 42 регионов и каждого из 90 дней заново перебирает
        все 40 000 заказов квартала. Это около 150 миллионов проверок. Если один раз пройти по заказам и разложить
        их по региону и дню, отчёт строится за миллисекунды вместо 900. На демо-странице заказов вдвое меньше,
        а компьютер быстрый: там было около полусекунды, а стало 4 мс. Самый сильный способ, если он возможен. Цена — нужно понять,
        какая работа лишняя, а иногда поменять структуру данных.
      - **Разбить на части и уступать браузеру.** Если работу не сократить, её режут на куски короче 50 мс,
        а между кусками отдают управление: `await scheduler.yield()` в Chrome и Firefox или
        `await new Promise((r) => setTimeout(r, 0))` там, где его нет. Между кусками браузер рисует кадры
        и обрабатывает ввод. Общее время то же, но страница живая. Цена — промежуточное состояние на экране
        и вопрос, что делать, если человек нажмёт ещё раз, пока работа идёт. `await Promise.resolve()` для этого
        **не подходит**: это микрозадача, и кадр между ней и кодом не нарисуется.
      - **Сначала показать, потом считать.** Если работу пока нельзя ни сократить, ни разбить, но нужно, чтобы
        «Строим…» появилось, тяжёлую часть откладывают до следующего кадра: `requestAnimationFrame(() =>
        setTimeout(work, 0))`. Колбэк `requestAnimationFrame` выполнится перед кадром, а таймер внутри него — уже после
        того, как кадр нарисован. web.dev советует этот приём как способ, который работает во всех браузерах. Цена —
        заморозка никуда не делась, а готовый отчёт появится на один кадр позже. Зато кадр с надписью рисуется сразу,
        и человек видит, что нажатие принято; задержка отклика на нажатие (урок «Медленные взаимодействия») при этом
        заканчивается на этом кадре.

      ## Попробуй сам

      Демо-страница «Отчёт по регионам»:
      [color-zebra.github.io/frontend-quiz/demos/browser/report.html](https://color-zebra.github.io/frontend-quiz/demos/browser/report.html).
      Открой её на компьютере в Chrome. Нажми «Построить отчёт» в режиме «Как было» и попробуй печатать. Потом
      переключи на «По частям» и «Без лишней работы» и сравни. Как увидеть всё это в профиле, расскажет урок
      «Читаем вкладку Performance».

      ## Типичные ошибки

      - **Ждать, что изменение DOM сразу видно на экране.** Оно появится только в ближайшем кадре после конца задачи.
      - **Уступать браузеру через `await Promise.resolve()` или `queueMicrotask`.** Это микрозадача: кадр не успеет
        нарисоваться, ввод не обработается.
      - **Делать цикл ожидания на промисах.** Бесконечная цепочка микрозадач вешает вкладку сильнее, чем бесконечный
        цикл на таймерах.
      - **Двигать анимацию `setTimeout(fn, 16)`.** Таймер не совпадает с кадрами, отсюда пропуски и рывки.
      - **Полагаться на порядок `setTimeout` и `requestAnimationFrame`.** Он зависит от того, когда подойдёт кадр.

      ## Как спрашивают на интервью

      - «Что выведет этот код?» — с `setTimeout`, `Promise.then` и `console.log`. Ждут: синхронный код, потом все
        микрозадачи, потом задачи.
      - «Чем микрозадача отличается от задачи?» — ждут: микрозадачи выполняются все сразу после текущей задачи,
        до кадра; задачи — по одной, между ними возможен кадр.
      - «Почему страница зависает, если долго считать в обработчике клика?» — ждут: кадр и ввод ждут конца задачи.
      - «Зачем нужен `requestAnimationFrame`?» — ждут: вызов один раз перед каждым кадром.

      ## Коротко

      - Основной поток крутит цикл событий: берёт одну задачу, выполняет все микрозадачи и, если пора, рисует кадр.
        Кадр рисуется только между задачами.
      - Задачи — это события, таймеры, ответы сети, разбор HTML. Пока одна выполняется, ни ввод, ни отрисовка
        не происходят: долгая задача замораживает страницу.
      - Микрозадачи — обработчики промисов, продолжение после `await`, `queueMicrotask`. Очередь микрозадач
        выполняется целиком, поэтому бесконечная цепочка промисов вешает вкладку намертво.
      - Изменение DOM попадает на экран только в ближайшем кадре. Если сразу за ним идёт долгая работа, промежуточное
        состояние вроде «Строим…» человек не увидит.
      - `requestAnimationFrame` вызывает код один раз перед каждым кадром, поэтому анимации на JavaScript делают
        на нём, а не на `setTimeout`. Порядок `setTimeout(fn, 0)` и `requestAnimationFrame` не гарантирован.
      - Из способов разгрузки сначала пробуют сократить работу. Если нельзя — разбивают её и уступают браузеру
        задачей (`scheduler.yield()` или `setTimeout`), а не микрозадачей.

      ## Источники

      - [Цикл событий: микрозадачи и макрозадачи — learn.javascript.ru](https://learn.javascript.ru/event-loop)
      - [HTML Standard: Event loops](https://html.spec.whatwg.org/multipage/webappapis.html#event-loops)
      - [Optimize Interaction to Next Paint — web.dev](https://web.dev/articles/optimize-inp)

  - id: brw-pipeline
    topic: Как браузер рисует
    subtopic: Конвейер отрисовки
    title: Конвейер отрисовки
    computer: true
    questions: [brw-011, brw-012, brw-013, brw-014, brw-015, brw-016]
    body: |
      ## Какую проблему решаем

      На «Обзоре» в «Пульсе» четыре карточки: выручка, заказы, средний чек, возвраты. Когда данные обновляются,
      число в карточке не меняется скачком, а «прокручивается» к новому значению, как в старом табло, а полоска под
      ним плавно растёт до доли от плана. Задумано красиво, но на ноутбуках менеджеров анимация идёт рывками, особенно
      если в этот момент дашборд что-то считает.

      В прошлом уроке была загадка: пока отчёт строился почти секунду и основной поток стоял, кружок-индикатор
      продолжал крутиться. Значит, есть анимации, которым занятый основной поток не мешает. Почему одним мешает,
      а другим нет, и как сделать, чтобы карточки анимировались так же гладко, как кружок?

      Чтобы ответить, разберём, что браузер делает в шаге «обновить кадр» из прошлого урока.

      ## Этапы конвейера

      Путь от HTML и CSS до пикселей называют **конвейером отрисовки** (rendering pipeline). Сначала браузер
      разбирает HTML в дерево элементов — **DOM**, а CSS — в набор правил, **CSSOM**. Дальше на каждый кадр,
      в котором что-то изменилось, работают этапы конвейера.

      1. **Стили** (style, в DevTools — Recalculate Style). Для каждого элемента браузер находит подходящие правила
         CSS и вычисляет итоговые значения свойств: какой цвет, какой шрифт, какая ширина задана.
      2. **Раскладка** (layout). Браузер считает геометрию: где стоит каждый блок и какого он размера. Ширина
         абзаца зависит от ширины родителя, высота — от числа строк текста, место следующего блока — от высоты
         предыдущего. Поэтому изменение одного элемента часто заставляет пересчитать соседей и родителей. В Firefox
         и в старых текстах этот этап называют **reflow**.
      3. **Отрисовка** (paint). Браузер составляет список команд рисования: «залить прямоугольник этим цветом»,
         «нарисовать текст здесь», «нарисовать тень». Потом эти команды превращаются в пиксели — это называют
         растеризацией, и в Chrome она идёт не на основном потоке. Отрисовку ещё называют **repaint**.
      4. **Композиция** (composite). Страница нарисована не одним листом, а несколькими **слоями** (layers), как
         прозрачные плёнки в аппликации. Композиция собирает слои в итоговую картинку кадра: в каком порядке
         наложить, где сдвинуть, насколько сделать прозрачным.

      Важная деталь: композицией в Chrome занимается отдельный поток — **компоновщик** (compositor thread). Ему
      не нужен основной поток, чтобы сдвинуть уже нарисованный слой или сделать его прозрачнее. Поэтому браузер
      прокручивает страницу и проигрывает некоторые анимации, даже когда основной поток занят.
      Оговорка про прокрутку: если на элементе страницы есть обработчик `wheel`, `touchstart` или `touchmove` без
      `{ passive: true }`, он может отменить прокрутку, и компоновщику приходится ждать основной поток. Такие элементы
      подсвечивает галочка Scrolling performance issues во вкладке Rendering. На `window`, `document` и `body` Chrome
      сам считает такие обработчики пассивными, если явно не указано `passive: false`.

      ## Что запускает каждый этап

      Каждое изменение запускает конвейер не с начала, а с того этапа, который оно затрагивает. От этого и зависит
      цена.

      ![Схема: свойства width, top, font-size, display запускают стили, раскладку, отрисовку и композицию; color, background, box-shadow — стили, отрисовку и композицию без раскладки; transform и opacity — только композицию у элемента со своим слоем](images/brw-pipeline.png "Чем раньше этап, с которого начинается работа, тем дороже изменение")

      - **Свойства геометрии**: `width`, `height`, `top`, `left`, `margin`, `padding`, `font-size`, `display`.
        Меняют размеры и места, поэтому запускают всё: стили, раскладку, отрисовку, композицию. Самые дорогие.
      - **Свойства вида**: `color`, `background`, `box-shadow`, `visibility`. Геометрия не меняется, раскладка
        не нужна, но элемент придётся перерисовать.
      - **`transform` и `opacity`**. Если у элемента свой слой, компоновщик сдвигает, масштабирует, поворачивает
        и делает его прозрачнее без раскладки и отрисовки. web.dev подчёркивает: сегодня таких свойств только два.

      Оговорка про `transform`. Если менять его из JavaScript в каждом кадре, основной поток всё равно нужен:
      выполнить код и пересчитать стили. Раскладки и отрисовки не будет, но занятый поток задержит и такую анимацию.
      Полностью без основного потока работают **CSS-анимации и переходы** (`animation`, `transition`) этих двух
      свойств: браузер передаёт их компоновщику целиком. Кружок в отчёте крутится именно так — CSS-анимацией
      `transform: rotate`.

      ## Слои и их цена

      Браузер сам выносит на отдельный слой элементы, которым это выгодно: видео, `canvas`, элементы с CSS-анимацией
      `transform` или `opacity`, с 3D-преобразованиями. Попросить об этом можно свойством **`will-change`**:
      `will-change: transform` говорит браузеру «скоро я буду это анимировать, подготовь слой заранее».

      Слои не бесплатны. Каждый слой — это картинка в памяти видеокарты: примерно ширина × высота × 4 байта.
      Слой размером с экран ноутбука 1920 × 1080 — около 8 МБ. Сотня карточек, каждой из которых «на всякий случай»
      дали `will-change: transform`, — сотня слоёв, лишняя память и работа компоновщика. web.dev прямо советует
      не выносить элементы на слои без нужды. Хорошая практика — ставить `will-change` незадолго до анимации
      и снимать после, а не держать на всём подряд.

      ## Инструменты: вкладка Rendering и панель Layers

      **Rendering** — вкладка DevTools, которая подсвечивает работу конвейера прямо на странице. Открыть её:
      меню «⋮» → More tools → Rendering или меню команд Ctrl+Shift+P → «Show Rendering». Главные галочки:
      - **Paint flashing** — вспыхивает зелёным всё, что браузер перерисовал;
      - **Layer borders** — показывает границы слоёв оранжевыми и оливковыми рамками;
      - **Layout Shift Regions** — подсвечивает фиолетовым области, которые сдвинулись (сдвиги вёрстки);
      - **Frame Rendering Stats** — плашка с частотой кадров и числом пропущенных кадров;
      - **Scrolling performance issues** — подсвечивает элементы с обработчиками, которые могут тормозить прокрутку.

      **Layers** (More tools → Layers) показывает все слои страницы в объёме, их размер, память и причину, по которой
      браузер вынес элемент на слой (Compositing reasons). Туда заглядывают, когда подозревают, что слоёв слишком
      много.

      ## Пример целиком: карточки «Пульса»

      Анимация чисел устроена так: в карточке лента из 21 числа от старого значения к новому, и JavaScript в каждом
      кадре сдвигает её свойством `top`, а полоске меняет `width`.

      ```js
      function frame(now) {
        const t = Math.min(1, (now - start) / 900);
        strip.style.top = -t * 20 * 34 + "px";   // геометрия: раскладка и отрисовка в каждом кадре
        bar.style.width = share(t) * 100 + "%";
        if (t < 1) requestAnimationFrame(frame);
      }
      ```

      Включаем Paint flashing и запускаем обновление. Числа и полоски вспыхивают зелёным в каждом кадре: браузер
      каждый раз пересчитывает раскладку карточек и заново их рисует.

      ![Paint flashing при анимации через top и width: числа и полоски во всех четырёх карточках залиты зелёным — браузер перерисовывает их в каждом кадре](images/brw-paint-top.png "Как было: top и width")

      Переделаем на `transform`: ленту сдвигаем `translateY`, полоску — `scaleX`, а саму анимацию описываем CSS-переходом
      `transition: transform 0.9s`. JavaScript только ставит конечное значение, дальше работает компоновщик.

      ![Paint flashing и Layer borders при анимации через transform: зелёных вспышек нет, вокруг лент с числами видны оранжевые рамки отдельных слоёв, числа на середине прокрутки](images/brw-paint-transform.png "Исправлено: transform, анимацию ведёт компоновщик")

      Зелёных вспышек нет, а вокруг лент с числами видны рамки слоёв: браузер вынес их на отдельные слои
      и двигает целиком. Если теперь включить на демо-странице «Нагрузить основной поток», анимация на `top`
      дёргается, а на `transform` идёт гладко — как кружок в отчёте.

      ## Варианты и их цена

      - **Анимировать свойства геометрии** (`top`, `width`, `height`).
        - Плюс: проще всего написать.
        - Цена: раскладка и отрисовка в каждом кадре; занятый основной поток превращает анимацию в слайд-шоу.
      - **CSS-анимация `transform` и `opacity`.**
        - Плюс: работает на компоновщике, гладко даже при занятом основном потоке.
        - Цена: так можно сдвинуть, повернуть, растянуть и сделать прозрачнее, но не изменить настоящий размер
          блока: `scaleX` растягивает картинку, текст внутри тоже растянется, и соседи не подвинутся.
      - **`transform` из JavaScript в каждом кадре.**
        - Плюс: полный контроль над движением, например за пальцем.
        - Цена: без раскладки и отрисовки, но зависит от основного потока.
      - **`will-change` на всё подряд.**
        - Плюс: анимации стартуют без задержки на создание слоя.
        - Цена: память под каждый слой и работа компоновщика; на слабых устройствах может стать хуже.

      ## Попробуй сам

      Демо «Карточки с числами»:
      [color-zebra.github.io/frontend-quiz/demos/browser/cards.html](https://color-zebra.github.io/frontend-quiz/demos/browser/cards.html).
      Включи в Rendering галочки Paint flashing и Layer borders, сравни режимы «Как было» и «transform» и попробуй
      «Нагрузить основной поток».

      ## Типичные ошибки

      - **Анимировать `top`, `left`, `width`, `height`.** Каждый кадр — раскладка и отрисовка.
      - **Считать, что `transform` из JavaScript бесплатен.** Раскладки нет, но код и стили — на основном потоке.
      - **Ставить `will-change` на сотни элементов.** Память видеокарты кончается, а выигрыша нет.
      - **Растягивать `scale` то, что должно менять настоящий размер.** Текст исказится, соседи не подвинутся.
      - **Забывать про дорогую отрисовку.** Большие размытые тени и фильтры вроде `filter: blur()` на крупных
        областях делают каждую перерисовку медленной.

      ## Как спрашивают на интервью

      - «Что происходит между изменением DOM и пикселями на экране?» — ждут этапы: стили, раскладка, отрисовка,
        композиция.
      - «Почему `transform` дешевле, чем `top`?» — ждут: `top` запускает раскладку и отрисовку, `transform` у элемента
        на своём слое — только композицию, причём на отдельном потоке.
      - «Что такое reflow и repaint?» — ждут: пересчёт геометрии и перерисовка; reflow дороже и обычно тянет за собой
        repaint.
      - «Зачем нужен `will-change` и почему его нельзя ставить везде?» — ждут: заранее создаёт слой, но каждый слой
        стоит памяти.

      ## Коротко

      - Конвейер отрисовки: стили → раскладка → отрисовка → композиция. Изменение запускает его с того этапа,
        который затрагивает, и чем раньше этап, тем дороже.
      - Свойства геометрии (`width`, `top`, `font-size`) запускают всё, свойства вида (`color`, `background`) —
        отрисовку без раскладки, а `transform` и `opacity` у элемента со своим слоем — только композицию.
      - Композицию в Chrome делает отдельный поток — компоновщик. CSS-анимации и переходы `transform` и `opacity`
        идут на нём и остаются гладкими, даже когда основной поток занят.
      - `transform` из JavaScript в каждом кадре обходится без раскладки и отрисовки, но всё равно ждёт основной поток.
      - Слой — картинка в памяти видеокарты. `will-change` создаёт слой заранее; ставят его точечно, а не на всё
        подряд.
      - Увидеть работу конвейера помогает вкладка Rendering: Paint flashing показывает перерисовку, Layer borders —
        слои. Причины слоёв — в панели Layers.

      ## Источники

      - [Rendering performance — web.dev](https://web.dev/articles/rendering-performance)
      - [Stick to compositor-only properties and manage layer count — web.dev](https://web.dev/articles/stick-to-compositor-only-properties-and-manage-layer-count)
      - [Discover issues with rendering performance — Chrome DevTools](https://developer.chrome.com/docs/devtools/rendering/performance)

  - id: brw-layout
    topic: Как браузер рисует
    subtopic: Принудительная раскладка
    title: Принудительная раскладка
    computer: true
    questions: [brw-017, brw-018, brw-019, brw-020, brw-021, brw-022]
    body: |
      ## Какую проблему решаем

      На вкладке «Заказы» в «Пульсе» таблица на две тысячи строк. Первая колонка с номером заказа закреплена: при
      прокрутке вбок она остаётся на месте. Когда-то закрепление сделали просто: колонка — это отдельная маленькая
      таблица слева, а всё остальное — большая таблица справа. В правой таблице есть колонка «Комментарий», текст
      в ней переносится, и строки получаются разной высоты. Чтобы строки слева и справа совпадали, скрипт после
      каждого обновления подгоняет высоту каждой левой строки под правую.

      Данные обновляются раз в 30 секунд, и в эти моменты таблица на секунду-полторы замирает. Прокрутка встаёт,
      клики не проходят. На демо-странице с полутора тысячами строк обновление занимает 1,6 секунды на быстром
      компьютере. При этом сам код подгонки — три строчки в цикле.

      Почему три строчки работают полторы секунды? Потому что каждая итерация цикла заставляет браузер заново
      считать раскладку всей страницы.

      ## Браузер ленится — и это хорошо

      Из прошлого урока: раскладка — этап, на котором браузер считает размеры и положение каждого блока. Обычно он
      делает её один раз на кадр. Когда код меняет стили — `el.style.height = "40px"`, — браузер ничего не пересчитывает
      сразу, а только помечает раскладку как **устаревшую**. Десять изменений подряд — по-прежнему одна раскладка,
      в ближайшем кадре.

      Но код может спросить о геометрии: «какая у элемента высота?». Если раскладка устарела, честно ответить можно,
      только пересчитав её прямо сейчас, посреди вашего JavaScript. Это и есть **принудительная раскладка** (forced
      synchronous layout, в DevTools — forced reflow): код заставил браузер посчитать раскладку немедленно, а не
      в кадре.

      Принудительную раскладку вызывают чтения геометрии и всего, что от неё зависит:
      - размеры и положение: `offsetWidth`, `offsetHeight`, `offsetTop`, `clientWidth`, `clientHeight`,
        `getBoundingClientRect()`;
      - прокрутка: `scrollTop`, `scrollHeight`, `scrollIntoView()`;
      - вычисленные стили: `getComputedStyle(el)` и чтение из него значений, зависящих от раскладки;
      - `innerText` — ему нужно знать, как текст разбит на строки;
      - `focus()` — браузеру нужно понять, куда прокрутить.

      Полный список собрал Пол Айриш, инженер команды Chrome, — ссылка внизу урока. Одно такое чтение — нормально:
      браузер посчитает раскладку раз, и в кадре ему уже не придётся. Беда начинается, когда чтения и записи
      **чередуются**.

      ## Layout thrashing

      Код подгонки высоты строк выглядит безобидно.

      ```js
      const left = document.querySelectorAll(".left tbody tr");
      const right = document.querySelectorAll(".right tbody tr");
      for (let i = 0; i < right.length; i++) {
        left[i].style.height = right[i].offsetHeight + "px";
      }
      ```

      Пройдём по итерациям.
      1. Первая итерация читает `offsetHeight`. Таблицу только что вставили, раскладка устарела — браузер считает
         её. Потом запись `style.height` снова делает раскладку устаревшей.
      2. Вторая итерация читает `offsetHeight` следующей строки — раскладка устарела, браузер считает её снова.
         И снова запись.
      3. И так полторы тысячи раз.

      Это называют **layout thrashing** — «пробуксовка раскладки»: чтение и запись геометрии вперемешку в цикле, из-за
      которых раскладка считается на каждой итерации. Каждый пересчёт здесь занимает около миллисекунды, а итераций
      полторы тысячи.

      ## Как это выглядит в профиле

      Запишем обновление таблицы во вкладке Performance (как это делать, подробно — в уроке «Читаем вкладку
      Performance») и приблизим участок в середине задачи.

      ![Профиль обновления таблицы: окно 88 мс внутри задачи длиной 2,2 секунды; под строками Event: click и Function call — сплошной частокол фиолетовых блоков Layout, у каждого красный уголок](images/brw-layout-thrash.png "Частокол: 88 мс из середины одной долгой задачи")

      Под вызовом функции идёт частокол узких фиолетовых блоков — это блоки Layout, при достаточном приближении
      на них видна подпись. Над ними сиреневые полосы — функции `refresh` и `syncRowHeights` из `table.js`: блоки
      функций Chrome красит своим цветом для каждого файла, и легко спутать их с раскладкой. Красный уголок у блока
      Layout — предупреждение. Если нажать на один блок, во вкладке Summary появится объяснение.

      Задача в записи длится 2,2 секунды, хотя на странице обновление занимало 1,6: запись сама немного замедляет
      страницу. Поэтому сравнивают записи между собой, а не с числом на странице.

      ![Выбран один блок Layout: предупреждение «Forced reflow is a likely performance bottleneck», длительность 1,19 мс, Nodes that need layout 9 of 26773, Layout root #document, в Function stack — syncRowHeights в table.js, строка 37](images/brw-layout-forced.png "Summary для одного блока Layout")

      - **Warning: Forced reflow is a likely performance bottleneck** — раскладку заставил посчитать ваш код.
      - **Duration 1.19 ms** — один пересчёт стоит миллисекунду; умножаем на полторы тысячи.
      - **Nodes that need layout 9 of 26773** — устарели всего девять узлов из 26 тысяч, но корень раскладки — весь
        документ (`#document`), и браузеру приходится его обходить.
      - **Function stack: syncRowHeights @ table.js:37** — строка кода, которая вызвала раскладку. Ссылка открывает
        её в панели Sources.

      В боковой панели Insights у записи с такой проблемой есть пункт **Forced reflow**: там собраны функции, которые
      чаще всего вызывали принудительную раскладку, и сколько времени она заняла.

      ## Как чинить

      - **Сначала все чтения, потом все записи.** Прочитать высоты всех правых строк в массив, потом в отдельном
        цикле записать их левым. Раскладка посчитается один раз — при первом чтении. На демо — 110 мс вместо 1,6 с.
        ```js
        const heights = Array.from(right, (row) => row.offsetHeight); // одна раскладка
        heights.forEach((h, i) => { left[i].style.height = h + "px"; }); // только записи
        ```
      - **Не читать геометрию вовсе.** Часто то, что делает скрипт, умеет CSS. Закреплённую колонку даёт
        `position: sticky` у первой ячейки обычной таблицы: подгонять нечего, на демо обновление занимает 18 мс.
      - **Отложить записи до кадра.** Если чтения и записи живут в разных модулях и их не собрать в два цикла,
        записи откладывают в `requestAnimationFrame`, а чтения делают сразу. На этой идее построена небольшая
        библиотека fastdom: она копит чтения и записи и выполняет их пачками.
      - **Получать размеры без вопроса.** `ResizeObserver` сообщает новые размеры элемента, когда браузер их уже
        посчитал в кадре, и не заставляет считать раскладку посреди кода. Им заменяют чтение `offsetWidth`
        в обработчике `resize`.
      - **Уменьшить, что пересчитывается.** Свойство `contain: layout` обещает браузеру, что содержимое элемента
        не влияет на раскладку снаружи, и пересчёт можно ограничить им. `content-visibility: auto` идёт дальше:
        браузер пропускает раскладку и отрисовку содержимого, пока элемент за пределами экрана. При этом содержимое
        доступно поиску по странице и экранному чтецу. К нему добавляют `contain-intrinsic-size: auto 500px` —
        примерный размер, иначе невидимые блоки схлопнутся и полоса прокрутки будет прыгать. `content-visibility`
        работает во всех основных браузерах с сентября 2024 года.

      ## Сдвиги вёрстки — родственная беда

      Раскладка, которая поменялась уже после того, как человек увидел страницу, сдвигает то, что он читает или
      собирается нажать. Это **сдвиги вёрстки** (layout shifts), их меряет метрика CLS — она разобрана в курсе 3.
      Найти их помогает галочка **Layout Shift Regions** во вкладке Rendering: сдвинутые области вспыхивают
      фиолетовым. В записи Performance сдвиги видны на дорожке Layout shifts, а причины — в пункте Insights
      «Layout shift culprits».

      ## Попробуй сам

      Демо «Таблица заказов»:
      [color-zebra.github.io/frontend-quiz/demos/browser/table.html](https://color-zebra.github.io/frontend-quiz/demos/browser/table.html).
      Запиши обновление в режиме «Как было», найди частокол Layout и предупреждение Forced reflow, потом сравни
      с двумя исправленными режимами.

      ## Варианты и их цена

      - **Чтения и записи двумя пачками.**
        - Плюс: маленькая правка, раскладка один раз.
        - Цена: нужно, чтобы весь код был в одном месте; в большом приложении чтения прячутся в чужих функциях.
      - **Отказаться от чтения в пользу CSS** (`sticky`, `grid`, `flex`).
        - Плюс: нет ни кода, ни раскладок вне кадра.
        - Цена: не всё выражается в CSS; иногда нужно переделать вёрстку.
      - **ResizeObserver вместо чтения в обработчике.**
        - Плюс: размеры приходят готовыми.
        - Цена: асинхронно — значение приходит к кадру, а не в момент вызова.
      - **`content-visibility` и `contain`.**
        - Плюс: пересчёт ограничен частью страницы, невидимое не считается.
        - Цена: нужно задавать примерный размер, иначе прыгает полоса прокрутки.

      ## Типичные ошибки

      - **Читать геометрию сразу после записи в цикле.** Классический layout thrashing.
      - **Думать, что `getBoundingClientRect` дешевле `offsetHeight`.** Оба требуют свежей раскладки.
      - **Оборачивать каждую итерацию в отдельный `requestAnimationFrame`.** Все колбэки выполнятся перед одним кадром
        подряд, и чтения с записями снова перемешаются.
      - **Лечить JavaScript-ом то, что умеет CSS.** Подгонка высот, выравнивание колонок, закрепление — задачи вёрстки.
      - **Бояться любого чтения.** Одно чтение после изменения — одна раскладка; беда только в чередовании.

      ## Как спрашивают на интервью

      - «Что такое reflow и что его вызывает?» — ждут: пересчёт раскладки; изменения геометрии и чтение размеров после
        изменений.
      - «Что такое layout thrashing и как его избежать?» — ждут: чередование чтения и записи в цикле; читать пачкой,
        потом писать пачкой.
      - «Как найти принудительную раскладку?» — ждут: Performance, фиолетовые блоки Layout с красным уголком,
        Forced reflow и стек вызова.

      ## Коротко

      - После изменения стилей браузер не пересчитывает раскладку сразу, а помечает её устаревшей и считает один раз
        в кадре.
      - Чтение `offsetHeight`, `getBoundingClientRect()`, `scrollTop`, `innerText` или зависящих от раскладки
        значений `getComputedStyle` при устаревшей раскладке заставляет посчитать её немедленно — это принудительная раскладка. Одно такое
        чтение — не беда.
      - Layout thrashing — чтения и записи вперемешку в цикле: раскладка считается на каждой итерации, и три строчки
        кода занимают секунды.
      - В профиле это частокол фиолетовых блоков Layout с красными уголками; Summary показывает «Forced reflow»
        и строку кода, а Insights собирает такие места в пункт Forced reflow.
      - Чинят так: сначала все чтения, потом все записи; или вовсе обходятся CSS. Размеры без вопросов даёт
        `ResizeObserver`.
      - `contain: layout` ограничивает пересчёт раскладки элементом, а `content-visibility: auto` вдобавок пропускает
        раскладку и отрисовку того, что за экраном.

      ## Источники

      - [What forces layout / reflow — Paul Irish](https://gist.github.com/paulirish/5d52fb081b3570c81e3a)
      - [Avoid large, complex layouts and layout thrashing — web.dev](https://web.dev/articles/avoid-large-complex-layouts-and-layout-thrashing)
      - [content-visibility — MDN](https://developer.mozilla.org/en-US/docs/Web/CSS/content-visibility)

  - id: brw-performance-panel
    topic: 'Скорость: найти и починить'
    subtopic: Вкладка Performance
    title: Читаем вкладку Performance
    computer: true
    questions: [brw-023, brw-024, brw-077, brw-026, brw-027, brw-028]
    body: |
      ## Какую проблему решаем

      Мы уже знаем, что «Построить отчёт» в «Пульсе» замораживает страницу почти на секунду: это одна долгая задача.
      Но отчёт — это сотни строк кода: группировка, подсчёт медиан, сортировка, вставка таблицы. Где именно уходит
      время? Можно расставить по коду `console.time` и гадать дальше, но есть способ лучше: записать, что делал
      браузер, и прочитать запись.

      Для этого есть вкладка **Performance**. Новичка она пугает: десятки цветных полос, дорожки, цифры. Этот урок —
      карта: что на ней где, как записать профиль, который что-то показывает, и как за несколько нажатий дойти
      от долгой задачи до строки кода.

      На скриншотах этого курса демо-страницы открыты по короткому адресу `dashboard.example`, чтобы в профиле были
      видны имена файлов, а не длинные пути. Если открыть те же страницы с сайта курса, адрес будет другим,
      а всё остальное — таким же.

      ## Как записать профиль, который что-то показывает

      **Профиль** (profile, trace) — запись всего, что делал браузер за отрезок времени: задачи, вызовы функций,
      этапы отрисовки, запросы, кадры.

      1. **Подготовить условия.** Окно инкогнито, чтобы расширения не попали в запись. В шестерёнке Capture
         settings — замедление процессора (обычно 4×) для работы в браузере или сети — для загрузки. Об этом
         был первый урок.
      2. **Выбрать вид записи.**
         - **Record** (Ctrl+E) — запись работы уже открытой страницы: нажатия, прокрутка, фильтры.
         - **Record and reload** (Ctrl+Shift+E) — перезагрузить страницу и записать загрузку целиком.
      3. **Записывать коротко.** Начать запись, сделать одно действие — например, нажать «Построить отчёт», — подождать
         секунду и остановить. Запись на минуту огромна, а нужное в ней теряется.
      4. **Дополнительно.** Галочка Screenshots сохраняет кадры экрана по ходу записи — видно, что человек видел
         в каждый момент. Галочка Memory добавляет графики памяти — о них в уроке про память.

      До записи панель показывает экран **Live metrics**: значения LCP, INP и CLS этой страницы прямо сейчас, пока вы
      с ней работаете, и список последних взаимодействий с их длительностью. Это удобный быстрый замер: нажали
      фильтр — увидели 820 мс.

      ## Карта панели

      Так выглядит запись нажатия «Построить отчёт», приближенная к долгой задаче.

      ![Панель Performance: сверху обзор с графиком загрузки процессора и полосой кадров экрана, ниже дорожки Frames, Timings с отметкой «Отчёт по регионам», Interactions с нажатием Pointer, Main — пламенный график Task, Event: click, Function call, buildReport, ordersFor; внизу вкладки Summary, Bottom-up, Call tree, Event log и итог по категориям: Scripting 576 мс, Rendering 11 мс](images/brw-perf-overview.png "Запись «Построить отчёт»: одна долгая задача")

      Сверху вниз.
      - **Обзор** (Timeline overview). График загрузки процессора (CPU) по категориям, полоса сети (NET), кадры
        экрана. Красная полоска над графиком отмечает долгие задачи. На обзоре выделяют мышью участок, чтобы
        приблизить его.
      - **Frames** — кадры: сколько длился каждый. Кадр 576,7 мс — это и есть заморозка.
      - **Timings** — отметки, которые поставил ваш код через `performance.mark` и `performance.measure`. Демо
        ставит отметку «Отчёт по регионам». Об этих отметках — урок «Скорость у реальных людей».
      - **Interactions** — нажатия, клавиши и касания и сколько ждал ответа человек. Подробно — следующий урок.
      - **Layout shifts** — сдвиги вёрстки.
      - **Main** — основной поток. Главная дорожка, о ней ниже.
      - Ниже бывают **Network**, **GPU**, **Thread pool** — сеть, видеокарта и вспомогательные потоки.

      Внизу — вкладки с подробностями о выделенном: **Summary**, **Bottom-up**, **Call tree**, **Event log**. Слева —
      боковая панель **Insights** с готовыми подсказками; её можно спрятать кнопкой в углу, как на скриншотах.

      Перемещаться по записи удобно с клавиатуры: W и S приближают и отдаляют, A и D сдвигают влево и вправо.
      Выделенный на обзоре участок становится «хлебной крошкой» наверху, по ней можно вернуться назад.

      ## Категории работы и цвета

      Вся работа основного потока делится на **категории**, и итог по ним для выделенного участка показывает вкладка
      Summary:
      - **Scripting** — выполнение JavaScript, его разбор и компиляция;
      - **Rendering** — пересчёт стилей и раскладка;
      - **Painting** — отрисовка и растеризация;
      - **Loading** — загрузка и разбор HTML;
      - **System** — работа браузера, которую он не отнёс к другим категориям.

      На записи отчёта: Scripting 576 мс, Rendering 11 мс. Значит, лечить надо JavaScript, а не вёрстку.

      С цветами блоков на пламенном графике есть ловушка. Служебные блоки браузера окрашены по категории: Task —
      серый, Event: click и Function call — жёлтые, Layout и Recalculate Style — фиолетовые, Paint — зелёный, Parse
      HTML — синий. А **блоки ваших функций** Chrome красит своим цветом для каждого файла, чтобы файлы было легко
      различать. На скриншоте функции из `report.js` светло-зелёные, но это JavaScript, а не отрисовка; в уроке
      «Принудительная раскладка» функции из `table.js` сиреневые, почти как Layout. Поэтому категорию читают
      по подписи блока и по Summary, а не по цвету функции.

      ## Пламенный график

      Дорожка Main — **пламенный график** (flame chart). По горизонтали — время, по вертикали — глубина вызовов:
      сверху тот, кто вызвал, под ним тот, кого вызвали. Ширина блока — сколько длился вызов.

      На записи отчёта сверху вниз:
      - **Task** — задача из цикла событий. Она заштрихована красным, а в углу красный треугольник: это долгая
        задача, заштрихована часть сверх 50 мс.
      - **Event: click** — внутри задачи браузер обрабатывает клик.
      - **Function call** — вызов вашего обработчика.
      - **(anonymous)** — сам обработчик, у него нет имени.
      - **buildReport**, под ним **ordersFor** — ваши функции.

      Блоки функций JavaScript получаются так: профилировщик много раз в миллисекунду записывает, какая функция
      сейчас выполняется. Это **выборочный** профилировщик (sampling profiler). Поэтому один долгий вызов иногда
      распадается на несколько блоков, как `buildReport` на скриншоте, а очень короткие вызовы могут не попасть
      ни в одну выборку.

      ## От задачи до строки кода

      Нажмём на блок `buildReport`.

      ![Выбран блок buildReport: в Summary Duration 122,83 мс, Source report.js:41:21, Origin dashboard.example, в Function stack — buildReport @ report.js:41:21 и (anonymous) @ report.js:90:60](images/brw-perf-function.png "Summary для одного вызова: сколько длился и где в коде")

      Summary показывает длительность этого блока и **Source** — ссылку на строку, где объявлена функция.
      Ссылка открывает файл в панели Sources. Function stack — кто кого вызвал.

      Но смотреть блоки по одному долго. Удобнее посчитать, на что ушло время за весь участок.

      ## Собственное и полное время: Bottom-up и Call tree

      У каждой функции два времени.
      - **Полное время** (total time) — сколько длился вызов вместе со всем, что он вызвал.
      - **Собственное время** (self time) — сколько выполнялся код самой функции, без вызванных из неё.

      У `buildReport` полное время — почти всё, а собственное — доли миллисекунды: сама она только вызывает других.
      Чтобы найти, где процессор на самом деле горит, нужно собственное время.

      ![Вкладка Bottom-up: строки отсортированы по Self time: ordersFor — 420 мс собственного времени, 71,3 %; (anonymous) report.js:16 — 141 мс, 23,9 %; Layout — 8,6 мс; Evaluate script — 7,7 мс](images/brw-perf-bottomup.png "Bottom-up: на что ушло собственное время за весь участок")

      - **Bottom-up** — функции, отсортированные по собственному времени: внизу стека, где работа делается на самом
        деле. Сразу видно: 420 мс — `ordersFor`, ещё 141 мс — анонимная функция в `report.js:16`. Это колбэк фильтра
        внутри `ordersFor`. Если раскрыть строку, видно, кто вызывал эту функцию.
      - **Call tree** — то же время, но сверху вниз, от корня: задача → клик → обработчик → `buildReport` → … Удобно,
        чтобы понять, через какой путь вызовов пришли к дорогому месту.
      - **Event log** — все события по порядку времени. Полезно, когда важна последовательность.

      Диагноз: время уходит в `ordersFor`, который на каждый регион и день перебирает все заказы. Лечение мы уже
      знаем из урока «Event loop и кадр» — группировка за один проход.

      ## Сравнить «до» и «после»

      После правки записываем тот же сценарий в тех же условиях. Отчёт в режиме «Без лишней работы» укладывается
      в 4 мс, долгой задачи нет. В режиме «По частям» вместо одной красной задачи — ряд коротких, общее время
      Scripting почти то же, но страница отвечает.

      Записи можно сохранить в файл кнопкой Save trace (стрелка вниз) и открыть позже кнопкой Load trace — например,
      приложить «до» и «после» к задаче. На записи можно оставлять пометки — вкладка Annotations рядом с Insights.

      ## Подсказки Insights

      Боковая панель Insights разбирает запись сама: «INP breakdown» раскладывает медленное нажатие на части,
      «LCP breakdown» — загрузку главного элемента, «Forced reflow» находит принудительные раскладки, «3rd parties»
      показывает, сколько времени заняли чужие скрипты. Это хороший первый взгляд, но список пунктов и их названия
      меняются от версии к версии Chrome. Опирайтесь на понятия — задача, раскладка, собственное время, — тогда
      новый интерфейс не собьёт.

      Там же есть таблица **1st / 3rd party**: сколько времени основного потока заняли ваш сайт и чужие домены.
      Галочка **Dim 3rd parties** приглушает в записи чужие скрипты, чтобы свои было лучше видно.

      ## Попробуй сам

      Демо «Отчёт по регионам»:
      [color-zebra.github.io/frontend-quiz/demos/browser/report.html](https://color-zebra.github.io/frontend-quiz/demos/browser/report.html).
      Запиши «Построить отчёт» в трёх режимах. В каждом найди долгую задачу, открой Bottom-up и проверь, какая функция
      съела больше всего собственного времени.

      ## Варианты и их цена

      - **console.time вокруг подозрительных мест.**
        - Плюс: просто, работает где угодно.
        - Цена: меряет только то, что вы заранее заподозрили; отрисовку и раскладку не видно.
      - **Live metrics.**
        - Плюс: мгновенный замер без записи.
        - Цена: показывает, что медленно, но не почему.
      - **Запись Performance.**
        - Плюс: видно всё: функции, раскладку, отрисовку, сеть, кадры.
        - Цена: нужно уметь читать; запись сама немного замедляет страницу.
      - **Insights.**
        - Плюс: готовый разбор типовых проблем.
        - Цена: только типовые; интерфейс меняется.

      ## Типичные ошибки

      - **Записывать минуту действий.** Нужное теряется; одна запись — одно действие.
      - **Смотреть на полное время вместо собственного.** Верхние функции всегда «дорогие», хотя сами ничего не делают.
      - **Верить, что каждый блок — один вызов.** Профилировщик выборочный: блоки дробятся, короткие вызовы пропадают.
      - **Сравнивать записи в разных условиях.** «До» с замедлением и «после» без него ничего не доказывают.
      - **Читать только Insights.** Если проблема нетиповая, подсказки промолчат.

      ## Как спрашивают на интервью

      - «Как найти, какая функция тормозит страницу?» — ждут: запись Performance, долгая задача, Bottom-up по
        собственному времени, переход к строке кода.
      - «Чем self time отличается от total time?» — ждут: без вызванных функций и с ними.
      - «Как понять, на что ушло время: на JavaScript или на вёрстку?» — ждут: Summary по категориям Scripting,
        Rendering, Painting; блоки Layout и Recalculate Style в записи.

      ## Коротко

      - Запись делают коротко и в нужных условиях: инкогнито, замедление процессора или сети, одно действие. Record —
        для работы страницы, Record and reload — для загрузки.
      - Дорожка Main — пламенный график основного потока: по горизонтали время, сверху вниз — кто кого вызвал. Долгая
        задача заштрихована красным с треугольником в углу.
      - Вид работы показывает Summary по категориям: Scripting — JavaScript, Rendering — стили и раскладка, Painting —
        отрисовка. Служебные блоки окрашены по категории, а блоки функций — цветом файла,
        поэтому категорию функции по цвету не определяют.
      - Полное время включает вызванные функции, собственное — нет. Где процессор на самом деле горит, показывает
        Bottom-up по собственному времени; путь вызовов — Call tree.
      - Профилировщик выборочный: один вызов может распасться на несколько блоков, а очень короткие вызовы не попасть
        в запись.
      - Починку проверяют записью того же сценария в тех же условиях. Insights — хороший первый взгляд, но понятия
        надёжнее интерфейса, который меняется.

      ## Источники

      - [Analyze runtime performance — Chrome DevTools](https://developer.chrome.com/docs/devtools/performance)
      - [Performance features reference — Chrome DevTools](https://developer.chrome.com/docs/devtools/performance/reference)

  - id: brw-interactions
    topic: 'Скорость: найти и починить'
    subtopic: Медленные взаимодействия
    title: Медленные взаимодействия
    computer: true
    questions: [brw-029, brw-030, brw-031, brw-032, brw-033, brw-034]
    body: |
      ## Какую проблему решаем

      Самая частая жалоба на «Пульс»: «выбираю регион — и почти секунду ничего не происходит». На ноутбуке менеджера
      между выбором в списке и обновлённой таблицей проходит 820 мс. Метрика INP у дашборда в данных пользователей
      красная.

      Из урока «Event loop и кадр» мы знаем общий ответ: основной поток чем-то занят. Но «чем-то» бывает очень разным.
      Иногда виноват сам обработчик выбора, иногда — чужой таймер, который случайно совпал с нажатием, иногда —
      вставка тысячи строк, которую браузер долго раскладывает. Лечение во всех трёх случаях разное. Этот урок
      учит раскладывать задержку на части и по ним понимать, что чинить.

      ## Взаимодействие и его задержка

      **Взаимодействие** (interaction) — одно действие человека: нажатие мышью, касание экрана или нажатие клавиши.
      Браузер при этом рассылает несколько событий: для клика — `pointerdown`, `pointerup`, `click`; для клавиши —
      `keydown`, `keyup`, а в поле ещё `input` или `change`. Прокрутка и наведение мыши взаимодействиями для INP не
      считаются.

      **Задержка взаимодействия** — время от действия человека до следующего кадра, в котором видна реакция. Метрика
      **INP** (Interaction to Next Paint) берёт одно из самых медленных взаимодействий за всё время на странице;
      хорошо — до 200 мс, плохо — больше 500 мс. Подробно о метрике — курс 3, урок «Как измерить скорость».

      ## Три части задержки

      web.dev раскладывает задержку взаимодействия на три части.

      1. **Ожидание ввода** (input delay) — от действия человека до начала обработчиков. Обработчик не может начаться,
         пока основной поток занят другой задачей: таймером, чужим скриптом, отрисовкой.
      2. **Обработка** (processing duration) — сколько выполняются обработчики событий этого взаимодействия.
      3. **Показ результата** (presentation delay) — от конца обработчиков до кадра с результатом: пересчёт стилей,
         раскладка, отрисовка того, что обработчики изменили, и другая работа перед кадром.

      Каждая часть указывает на своего виновника.
      - **Большое ожидание** — виноват не ваш обработчик, а то, что выполнялось в момент нажатия. Ищут задачи,
        которые идут по таймеру или в чужих скриптах, и делают их короче или реже.
      - **Большая обработка** — виноват код обработчика. Сокращают работу или откладывают её несрочную часть
        на после кадра.
      - **Большой показ** — виновато то, сколько вы поменяли на странице. Меньше элементов, проще раскладка, никаких
        принудительных раскладок.

      ## Где это видно

      В записи Performance есть дорожка **Interactions**: каждое взаимодействие — полоса от действия до кадра. Если
      взаимодействие дольше 200 мс, часть сверх этого заштрихована, а в углу красный треугольник. Нажмите на полосу —
      Summary покажет все три части.

      ![Запись выбора региона: на дорожке Interactions полоса Keyboard; в Main — Event: keydown, Event: change, applyFilter, renderRows; в Summary — предупреждение Long interaction, Duration 509,90 мс, Input delay 0 ms, Processing duration 482 ms, Presentation delay 28 ms](images/brw-inp-phases.png "Одно взаимодействие и его три части")

      На демо-странице регион выбран клавишей, поэтому взаимодействие называется Keyboard. Видно, как одно нажатие
      вызывает `keydown`, внутри него `change`, а дальше — наш обработчик `applyFilter`. Почти вся задержка —
      обработка: 482 мс из 510.

      Ещё два места.
      - **Live metrics** — экран, который панель Performance показывает до записи. Там список последних взаимодействий
        с длительностью. Удобно, чтобы быстро найти медленное, ничего не записывая.
      - **Insights → INP breakdown** — та же разбивка на три части для самого медленного взаимодействия записи.

      ## Пример целиком: фильтр «Регион»

      На ноутбуке менеджера, то есть с замедлением процессора 4×, выбор региона раскладывается так: ожидание 40 мс,
      обработка 610 мс, показ 170 мс. Разберём все три части.

      **Обработка, 610 мс.** Bottom-up показывает, что почти всё собственное время у функции `customerTotal`. Её
      вызывают для каждой строки таблицы, чтобы показать колонку «Всего у клиента», и каждый вызов перебирает все
      40 000 заказов квартала. Около 950 строк региона × 40 000 заказов — почти 40 миллионов проверок на одно нажатие.
      Лечение — посчитать суммы по клиентам один раз, за один проход, и брать готовые. Обработка падает до десятков
      миллисекунд.

      **Показ, 170 мс.** Таблица региона — около 950 строк по десять колонок, и после вставки браузер их все стилизует
      и раскладывает. Человек на экране видит 20 строк. Показываем первые 100 и кнопку «Показать ещё» — показ сократился
      в разы. Для действительно длинных списков есть виртуализация, о ней курс 4, урок «Виртуализация».

      **Ожидание, 40 мс.** Раз в секунду дашборд по таймеру заново готовит подсказки для графика — 40 мс работы на
      ноутбуке менеджера. Если нажатие попало на этот момент, обработчик ждёт. Подсказки не меняются от секунды
      к секунде: готовим их один раз и обновляем, только когда пришли новые данные.

      После трёх правок выбор региона на том же ноутбуке занимает 140 мс.

      ## Как ещё сократить каждую часть

      - **Сначала показать отклик, потом считать.** Если обработчик должен и обновить кнопку, и сделать тяжёлую работу,
        обновите кнопку, уступите браузеру (`await scheduler.yield()` или `setTimeout`) и только потом считайте.
        INP заканчивается на кадре, в котором видна реакция, поэтому кадр с нажатой кнопкой закрывает взаимодействие.
        Работа после уступки — уже отдельная задача.
      - **Убрать работу из обработчика совсем.** Отправку аналитики, запись в localStorage, пересчёт рекомендаций
        откладывают: человеку не нужно ждать их, чтобы увидеть результат нажатия.
      - **Приглушить частые события.** Для поиска по мере ввода — debounce, для движения мыши — throttle по кадрам.
        Подробно — курс 4, «Тяжёлая работа без зависаний». Но debounce не делает один запуск короче: если поиск
        рисует результаты 400 мс, следующая буква, напечатанная в это время, будет ждать.
      - **Унести тяжёлое с основного потока.** Расчёт без DOM — в Web Worker (тот же урок курса 4).
      - **Разгрузить момент нажатия.** Фоновые таймеры, чужие виджеты, аналитику делают короче и запускают реже.
        Несрочные фоновые задачи можно планировать с низким приоритетом: `scheduler.postTask(fn, { priority:
        "background" })` или `requestIdleCallback(fn)`. По caniuse на октябрь 2026 года оба есть в Chrome и Firefox
        и нет в Safari, поэтому нужен запасной вариант — обычный `setTimeout`.

      ## Попробуй сам

      Демо «Фильтр по региону»:
      [color-zebra.github.io/frontend-quiz/demos/browser/filter.html](https://color-zebra.github.io/frontend-quiz/demos/browser/filter.html).
      Выбери регион в режиме «Как было», найди взаимодействие на дорожке Interactions и посмотри три части. Потом
      включи «Исправлено» и сравни. Блок «Что увидела бы аналитика» на странице показывает те же три части — о нём
      урок «Скорость у реальных людей».

      ## Варианты и их цена

      - **Сократить работу обработчика.**
        - Плюс: лечит причину, выигрыш обычно самый большой.
        - Цена: нужно найти, что лишнее, и иногда переписать структуру данных.
      - **Показать отклик, остальное — после уступки.**
        - Плюс: маленькая правка, человек сразу видит реакцию.
        - Цена: работа никуда не делась; если человек нажмёт снова, она помешает следующему взаимодействию.
      - **Показывать меньше элементов.**
        - Плюс: меньше стилей и раскладки, короче показ.
        - Цена: нужна пагинация, «Показать ещё» или виртуализация.
      - **Разгрузить фон.**
        - Плюс: меньше случайных ожиданий у всех взаимодействий сразу.
        - Цена: надо договариваться с владельцами чужих скриптов и таймеров.

      ## Типичные ошибки

      - **Чинить обработчик, когда большое ожидание.** Ваш код быстрый, виноват соседний таймер или виджет.
      - **Думать, что debounce лечит INP.** Он уменьшает число запусков, но не длину одного.
      - **Делать тяжёлую работу до визуального отклика.** Кнопка «нажалась» только после расчёта.
      - **Вставлять в DOM тысячи строк.** Обработчик быстрый, а показ результата — сотни миллисекунд.
      - **Мерить на быстром компьютере.** У разработчика 180 мс, у менеджеров — 820.

      ## Как спрашивают на интервью

      - «Из чего складывается INP?» — ждут три части: ожидание ввода, обработку, показ результата.
      - «Обработчик клика быстрый, а INP плохой. Почему?» — ждут: ожидание из-за других задач или долгий показ
        из-за большого обновления DOM.
      - «Как ускорить реакцию на нажатие, если работа обязательна?» — ждут: сначала визуальный отклик, потом уступить
        браузеру и доделать работу; разбить или унести в воркер.

      ## Коротко

      - Взаимодействие — нажатие, касание или клавиша; прокрутка и наведение не считаются. INP берёт одно из самых
        медленных взаимодействий: хорошо до 200 мс, плохо больше 500.
      - Задержка складывается из трёх частей: ожидание ввода, обработка, показ результата. Каждая указывает на своего
        виновника.
      - Большое ожидание — основной поток в момент нажатия занят чужой задачей: таймером, виджетом. Чинят фон, а не
        обработчик.
      - Большая обработка — дорогой код обработчика: сокращают работу, а несрочное откладывают на после кадра
        с откликом.
      - Большой показ — слишком большое обновление страницы: показывают меньше элементов и избегают принудительной
        раскладки.
      - Найти медленное взаимодействие помогают дорожка Interactions и Live metrics, разбивку на части — Summary
        и Insights → INP breakdown.

      ## Источники

      - [Optimize Interaction to Next Paint — web.dev](https://web.dev/articles/optimize-inp)
      - [Interaction to Next Paint (INP) — web.dev](https://web.dev/articles/inp)

  - id: brw-loading
    topic: 'Скорость: найти и починить'
    subtopic: Загрузка страницы
    title: Загрузка страницы
    computer: true
    questions: [brw-035, brw-036, brw-037, brw-038, brw-039, brw-040]
    body: |
      ## Какую проблему решаем

      Первая жалоба на «Пульс» из вводного урока: «утром открываю — пять секунд смотрю на пустой экран». Главное
      на «Обзоре» — большой график выручки по дням. В данных пользователей LCP — время до отрисовки самого крупного
      элемента экрана — 4,8 секунды на 75-м процентиле. Хорошим считается LCP до 2,5 секунды.

      Курс «Системный дизайн: доставка и качество» уже объяснял, что грузить сразу, а что потом, зачем нужен
      `fetchpriority` и как разбивать код на части. Этот урок о другом: как по записи загрузки понять, **куда именно**
      ушли 4,8 секунды, и выбрать из этих приёмов нужный, а не все подряд.

      ## Водопад во вкладке Network

      Вкладка **Network** показывает все запросы страницы. Колонка **Waterfall** — «водопад»: у каждого запроса
      полоса, где он начался и сколько шёл. Запросы, которые ждут друг друга, выстраиваются лесенкой.

      Колонки, которые нужны для разбора загрузки:
      - **Initiator** — кто вызвал запрос: разбор HTML (`load.html:8` — строка разметки), скрипт (`app.js:7`) или
        стиль (`styles.css:2`). Это главная колонка: по ней видно, кто кого ждёт.
      - **Priority** — приоритет, с которым браузер грузит ресурс: Highest, High, Medium, Low, Lowest. По умолчанию
        колонка скрыта: правый клик по заголовку таблицы → Priority. Там же включается Waterfall, если её нет.
      - **Time** — сколько длился запрос.

      Ещё два приёма. Если навести мышь на строку с зажатым Shift, DevTools подсветит зелёным тех, кто вызвал этот
      запрос, и красным тех, кого вызвал он. Если навести на полосу водопада, появится разбивка времени запроса:
      очередь (Queueing, Stalled), установка соединения (DNS Lookup, Initial connection), ожидание ответа сервера
      (Waiting — от отправки запроса до первого байта ответа: путь по сети туда и обратно плюс работа сервера) и скачивание (Content Download). Время до первого байта страницы, о котором
      пойдёт речь ниже, шире Waiting: в него входят ещё перенаправления и установка соединения. Синяя вертикальная линия
      в водопаде — событие `DOMContentLoaded`, красная — `load`.

      ## Что блокирует отрисовку

      Браузер не может показать страницу, пока не получил всё, без чего она нарисуется неправильно. Такие ресурсы
      называют **блокирующими отрисовку** (render-blocking). Правила курс 3 разобрал в уроке «Что грузить сразу,
      а что потом»; напомним коротко:
      - **стили в `<head>`** блокируют отрисовку — без них страница нарисуется голой и потом перепрыгнет;
      - **обычный `<script src>` в `<head>`** останавливает разбор HTML, пока не скачается и не выполнится. `defer`
        снимает блокировку и сохраняет порядок скриптов, `async` выполняет скрипт сразу по готовности в любом
        порядке, `type="module"` по умолчанию ведёт себя как `defer`.

      Новое здесь — как это выглядит в инструментах. Если стиль подключает другой через `@import`, браузер узнаёт
      о втором, только скачав первый: в водопаде это лесенка, где у второго файла инициатор — первый файл, и ожидание
      удваивается.

      В записи Performance с перезагрузкой (Record and reload) в подробностях запроса на дорожке Network указано,
      блокирует ли он отрисовку (Render blocking), а пункт Insights **Render-blocking requests** собирает такие
      запросы списком с оценкой выигрыша.

      ## Из чего складывается LCP

      Если главный элемент — картинка, web.dev раскладывает LCP на четыре части.

      ![Полоса LCP из четырёх частей: время до первого байта — около 40 %, задержка начала загрузки — меньше 10 %, загрузка картинки — около 40 %, задержка отрисовки — меньше 10 %](images/brw-lcp-parts.png "Части LCP и ориентиры их долей по web.dev")

      1. **Время до первого байта** (TTFB) — от начала перехода до первого байта HTML: сервер, сеть, перенаправления.
      2. **Задержка начала загрузки** (resource load delay) — от первого байта HTML до того, как браузер начал грузить
         главную картинку. Это время, пока браузер о ней не знал или не спешил.
      3. **Загрузка картинки** (resource load duration) — сколько качалась сама картинка.
      4. **Задержка отрисовки** (element render delay) — от конца загрузки картинки до её появления на экране:
         браузер ждёт стили, выполняет скрипты, основной поток занят.

      web.dev даёт ориентир: время до первого байта и загрузка — примерно по 40 %, а обе задержки — меньше 10 % каждая
      и в идеале около нуля. Если задержки большие, проблема не в сети и не в размере картинки, а в том, как страница
      устроена. В записи Performance эту разбивку показывает пункт Insights **LCP breakdown**, а **LCP request
      discovery** проверяет, можно ли найти главную картинку прямо в HTML, нет ли у неё `loading="lazy"` и стоит ли
      высокий приоритет.

      ## Пример целиком: утро менеджера

      Записываем загрузку «Обзора» с замедлением сети и процессора. LCP — 4,8 секунды:
      - время до первого байта — 0,6 с;
      - задержка начала загрузки — 2,3 с;
      - загрузка картинки — 1,2 с;
      - задержка отрисовки — 0,7 с.

      Задержка начала загрузки — почти половина, хотя должна быть около нуля. Почему браузер так поздно взялся
      за картинку? Смотрим водопад демо-страницы с тем же устройством.

      ![Вкладка Network: колонки Name, Initiator, Time, Priority, Waterfall; load.html, demo.css, styles.css, vendor.js на 915 мс, app.js, fonts.css с инициатором styles.css:2 и sales.png с инициатором app.js:7, которая начинается последней, после синей линии DOMContentLoaded](images/brw-network-waterfall.png "Водопад загрузки: картинку вызвал скрипт, и поэтому она начинается последней")

      Колонка Initiator всё объясняет.
      - `sales.png` вызвал `app.js:7`. Картинки нет в HTML: её вставляет скрипт, когда страница разобрана. Значит,
        браузер не может узнать о ней, пока не скачает и не выполнит `app.js`. А `app.js` ждёт `vendor.js`.
      - `vendor.js` — библиотека графиков на 135 КБ — подключена в `<head>` без `defer` и блокирует разбор страницы,
        а при старте ещё и выполняется около 180 мс.
      - `fonts.css` вызван из `styles.css:2` — это цепочка `@import`.

      Правки по частям LCP:
      - **Задержка начала загрузки.** Картинку ставим прямо в HTML: `<img src="sales.png" fetchpriority="high">`.
        Браузер находит её ещё при разборе HTML — этим занят отдельный сканер разметки (preload scanner),
        который просматривает разметку вперёд, — и загрузка начинается сразу. Если главную картинку
        невозможно указать в HTML — например, это фон из CSS, — её объявляют срочной загрузкой (курс 3):
        `<link rel="preload" as="image" href="…" fetchpriority="high">`. Было 2,3 с, стало около 0,1.
      - **Задержка отрисовки.** Обоим скриптам — `defer`: разбор не останавливается, а инициализация библиотеки
        больше не стоит между картинкой и кадром. Было 0,7 с, стало около 0,3.
      - **Цепочка стилей.** `fonts.css` подключаем вторым `<link>` прямо в HTML вместо `@import`: оба файла грузятся
        параллельно.

      Итог: 0,6 + 0,1 + 1,2 + 0,3 = 2,2 секунды. Время до первого байта и загрузку картинки мы не трогали: если нужно
      ещё быстрее, дальше — сервер и размер картинки (форматы и `srcset` — курс 3, урок «Картинки и видео»).

      ## Coverage: сколько загруженного кода выполнилось

      `vendor.js` весит 135 КБ, хотя дашборду нужен один линейный график из двухсот видов. Проверить, сколько кода
      пропадает зря, помогает вкладка **Coverage**: меню «⋮» → More tools → Coverage или меню команд → «Show Coverage».
      Кнопка перезагрузки в панели перезагружает страницу и следит, какой код выполняется, пока вы с ней работаете.

      Для каждого файла Coverage показывает размер (Total Bytes), неиспользованные байты (Unused Bytes) и полоску:
      зелёное — выполненное, серое — нет. Если открыть файл в Sources, неиспользованные строки отмечены серыми
      полосками у номеров строк. Для `vendor.js` почти вся полоска серая.

      Что с этим делать — курс 3, урок «Что грузить сразу, а что потом»: разбивка кода, загрузка по требованию,
      импорт только нужной части библиотеки. Одна оговорка: Coverage видит только то, что вы сделали за запись.
      Код, который нужен при редком действии, будет серым, но выбрасывать его нельзя — его загружают позже.

      ## Попробуй сам

      Демо «Загрузка страницы»:
      [color-zebra.github.io/frontend-quiz/demos/browser/load.html](https://color-zebra.github.io/frontend-quiz/demos/browser/load.html)
      и исправленная версия `load-fixed.html` рядом. Включи в Network замедление Slow 4G, обнови страницу, найди
      в колонке Initiator, кто вызвал картинку. В Performance нажми Record and reload и открой Insights → LCP
      breakdown. Сравни с исправленной версией и загляни в Coverage.

      ## Варианты и их цена

      - **Поставить главную картинку в HTML с `fetchpriority="high"`.**
        - Плюс: браузер находит её сразу, задержка начала загрузки уходит.
        - Цена: картинка должна быть известна сервером при отдаче HTML.
      - **`<link rel="preload">` для картинки, которую не найти в HTML.**
        - Плюс: тот же эффект для фона из CSS или картинки, которую выбирает скрипт.
        - Цена: срочная загрузка забирает сеть у других ресурсов; если картинка не понадобится, трафик пропал.
      - **`defer` для скриптов.**
        - Плюс: разбор и отрисовка не ждут скрипты.
        - Цена: код, который должен выполниться до разбора страницы, придётся вынести отдельно.
      - **Разбить большой скрипт.**
        - Плюс: меньше качать и выполнять при загрузке.
        - Цена: сложнее сборка, редкий код догружается позже.

      ## Типичные ошибки

      - **Вставлять главную картинку скриптом.** Браузер узнаёт о ней последней.
      - **Ставить главной картинке `loading="lazy"`.** Ленивая загрузка откладывает её до раскладки.
      - **Ставить `fetchpriority="high"` всему подряд.** Если высокий приоритет у пяти картинок, он ничего не значит.
      - **Подключать стили через `@import`.** Цепочка удваивает ожидание.
      - **Удалять «серый» код по Coverage без раздумий.** Он может понадобиться при действии, которого не было в записи.

      ## Как спрашивают на интервью

      - «LCP плохой. Как найдёте причину?» — ждут: разбивка на четыре части и поиск самой большой; водопад
        и Initiator.
      - «Что блокирует отрисовку и как это убрать?» — ждут: стили и синхронные скрипты в `<head>`, `defer`, `async`,
        отказ от `@import`.
      - «Как ускорить загрузку главной картинки?» — ждут: картинка в HTML, `fetchpriority="high"`, никакого
        `loading="lazy"`, при необходимости `preload`.

      ## Коротко

      - Водопад во вкладке Network показывает, кто кого ждёт. Главная колонка — Initiator: разбор HTML, скрипт или
        стиль, вызвавший запрос. Колонку Priority включают правым кликом по заголовку.
      - Стили в `<head>` и обычные скрипты без `defer` блокируют отрисовку. `@import` в CSS создаёт цепочку,
        `defer` снимает блокировку скрипта.
      - LCP с картинкой складывается из четырёх частей: время до первого байта, задержка начала загрузки, загрузка,
        задержка отрисовки. Обе задержки должны быть близки к нулю.
      - Большая задержка начала загрузки обычно значит, что браузер узнал о картинке поздно. Лечение — картинка
        в HTML с `fetchpriority="high"` или `preload`, и никакого `loading="lazy"` у главной картинки.
      - Разбивку LCP показывают Insights → LCP breakdown и LCP request discovery в записи Record and reload.
      - Coverage показывает, сколько загруженного кода выполнилось: серое не выполнялось. Но редкий код тоже бывает
        нужен — его не выбрасывают, а грузят позже.

      ## Источники

      - [Optimize Largest Contentful Paint — web.dev](https://web.dev/articles/optimize-lcp)
      - [Network features reference — Chrome DevTools](https://developer.chrome.com/docs/devtools/network/reference)
      - [Find unused JavaScript and CSS code with the Coverage panel — Chrome DevTools](https://developer.chrome.com/docs/devtools/coverage)

  - id: brw-memory
    topic: Память
    subtopic: Как браузер управляет памятью
    title: Как браузер управляет памятью
    computer: true
    questions: [brw-041, brw-042, brw-043, brw-044, brw-045, brw-046]
    body: |
      ## Какую проблему решаем

      Последняя жалоба из вводного урока: «к концу дня вкладка съедает гигабайт памяти, ноутбук гудит». Утром «Пульс»
      занимает около 150 МБ, к обеду — около 700, к вечеру — больше гигабайта. Всё постепенно становится медленнее,
      а у пары менеджеров вкладка иногда падает: вместо дашборда Chrome показывает «Опаньки…» с кодом Out of Memory.

      Никто в коде не пишет «выдели гигабайт». В JavaScript память вообще не освобождают руками — этим занимается
      браузер. Как же она утекает? Этот урок объясняет, как браузер решает, что память можно освободить, почему иногда
      не может, и как заметить утечку до того, как в неё начнут копать. А как найти виноватую строчку, расскажет
      следующий урок.

      ## Куча и сборщик мусора

      Объекты JavaScript — массивы, функции, ответы сервера — живут в **куче** (heap): области памяти, которую движок
      JavaScript раздаёт под новые объекты. DOM-узлы — элементы страницы — живут в памяти движка отрисовки, но связаны
      с JavaScript: у каждого узла, до которого дотянулся код, есть объект-обёртка в куче.

      Освобождает память **сборщик мусора** (garbage collector, GC). Он работает по правилу **достижимости**: объект
      жив, пока до него можно добраться по ссылкам от **корней**. Корни — это то, что заведомо нужно:
      - глобальный объект `window` и всё, что на нём висит;
      - локальные переменные функций, которые сейчас выполняются;
      - документ и всё дерево DOM, прикреплённое к нему;
      - работа, которую браузер обещал выполнить позже: ждущие таймеры с их колбэками.

      Обработчики событий живут, пока жив объект, на котором они висят. Обработчик на `window` или `document` живёт
      до закрытия страницы, потому что эти объекты — корни. А обработчик на удалённом элементе, на который больше
      никто не ссылается, сборщик заберёт вместе с элементом: снимать его перед удалением не обязательно.
      `MutationObserver` устроен похоже: он живёт, пока жив узел, за которым следит, или пока на него ссылается ваш
      код. Наблюдатель за `document.body` и всё, что замкнул его колбэк, живут до закрытия страницы.

      Сборщик проходит от корней по всем ссылкам и помечает, до чего дотянулся. Всё непомеченное — мусор, его память
      освобождается. Поэтому дело не в том, есть ли у объекта «имя» или «вышла ли функция»: объект живёт, пока хоть
      одна цепочка ссылок ведёт к нему от корня.

      ## Поколения

      Большинство объектов умирают молодыми: временный массив внутри функции, строка для склейки, объект события.
      Сборщики пользуются этим наблюдением — его называют гипотезой поколений.
      - **Молодое поколение** — новые объекты. Его проверяют часто, и это быстро: живых там мало.
      - **Старое поколение** — объекты, пережившие несколько сборок. Его проверяют реже, сборка дольше.

      Большую часть работы современный сборщик делает параллельно и в фоновых потоках, но короткие паузы основного
      потока остаются. В записи Performance они видны как блоки Minor GC и Major GC. Как это устроено в V8, обзорно —
      урок «Как V8 выполняет код». Здесь важно следствие: если страница создаёт много мусора, сборки идут чаще
      и отнимают время у кадров, даже без всякой утечки.

      ## Утечка — это забытая ссылка

      Слово «утечка» в JavaScript вводит в заблуждение: память не теряется, её держат. **Утечка памяти** (memory leak) —
      когда ошибка в коде заставляет страницу со временем занимать всё больше памяти. Почти всегда это объект, который
      уже не нужен, но до которого всё ещё дотягивается ссылка от корня.

      Отличайте утечку от двух похожих вещей.
      - **Раздутая память** (memory bloat) — страница занимает больше, чем нужно, но не растёт: например, держит
        в памяти все 40 000 заказов квартала, хотя показывает сто. Это расточительно, но это не утечка.
      - **Много мусора** — память пилой растёт и падает после каждой сборки. Это нормальная жизнь страницы; плохо,
        только если сборки начинают мешать кадрам.

      ## Где обычно забывают ссылку

      - **Обработчики на `window` и `document`.** Компонент повесил обработчик `resize`, а при удалении не снял.
        Обработчик — функция, она замыкает компонент, компонент держит свой DOM. Одна из самых частых утечек в одностраничных
        приложениях.
      - **Таймеры.** `setInterval` работает, пока его не остановят, и держит всё, что замкнул его колбэк.
      - **Наблюдатели и подписки.** Наблюдатель за долгоживущим узлом вроде `document.body` и подписка на общую шину
        событий приложения держат свои колбэки, пока не вызван `disconnect` или отписка.
      - **Кэши без ограничения.** `Map` «для скорости», куда только добавляют и никогда не удаляют.
      - **Отсоединённые DOM-узлы.** Элемент удалили со страницы, но на него осталась ссылка в массиве или переменной.
        Такой элемент называют **отсоединённым** (detached): в документе его нет, а память он держит вместе со всем
        поддеревом.
      - **Глобальные переменные.** Всё, что записано в `window`, живёт до закрытия страницы.
      - **Объекты, выведенные в консоль.** Консоль держит ссылки на объекты, которые вы
        вывели через `console.log` или вычислили в ней, чтобы их можно было раскрыть. Очистка консоли их отпускает.

      ## Слабые ссылки

      В JavaScript есть структуры, которые ссылаются на объект, но не мешают сборщику его забрать.
      - **`WeakMap` и `WeakSet`.** Ключ хранится «слабо»: если до объекта-ключа больше нельзя добраться, запись
        исчезает сама. Удобно, чтобы прикрепить данные к DOM-узлу или чужому объекту: удалили узел — данные ушли
        вместе с ним. Ключи — только объекты: строку ключом `WeakMap` не сделать.
      - **`WeakRef`** — слабая ссылка на один объект. `ref.deref()` возвращает объект или `undefined`, если его уже
        собрали.
      - **`FinalizationRegistry`** — просит вызвать колбэк после того, как объект собран.

      Когда именно сборщик заберёт объект и вызовет ли колбэк вообще, не гарантируется. MDN прямо советует обходиться
      без `WeakRef` и `FinalizationRegistry`, где это возможно. Основная защита от утечек — не слабые ссылки,
      а аккуратная уборка: снимать обработчики, останавливать таймеры, отключать наблюдатели. Удобный способ —
      **`AbortController`**: передать его `signal` всем подпискам компонента и при удалении вызвать один `abort()`.

      ```js
      const subscriptions = new AbortController();
      window.addEventListener("resize", onResize, { signal: subscriptions.signal });
      document.addEventListener("keydown", onKey, { signal: subscriptions.signal });
      // при уходе с вкладки — снять всё разом
      subscriptions.abort();
      ```

      ## Как заметить утечку

      Прежде чем искать утечку в снимках памяти, её стоит увидеть и убедиться, что это она, а не просто тяжёлая
      страница.

      - **Диспетчер задач Chrome** — Shift+Esc или меню «⋮» → More tools → Task manager. Колонка Memory footprint —
        сколько памяти у системы занимает вкладка; колонку JavaScript memory включают правым кликом по заголовку.
        Если число растёт и не падает, пока вы повторяете одно и то же действие, — есть повод копать.
      - **Performance monitor** — в DevTools: More tools → Performance monitor. Живые графики: загрузка процессора,
        JS heap size, число DOM-узлов (DOM Nodes), число обработчиков событий (JS event listeners), раскладок
        и пересчётов стилей в секунду. Удобно держать открытым, пока работаете со страницей.
      - **Галочка Memory в записи Performance.** Запись с графиками памяти. Кнопка **Collect garbage** (метла)
        принудительно запускает сборку мусора; её нажимают в начале и в конце записи, чтобы сравнивать
        «чистые» значения.

      Как читать графики:
      - **Пила** — растёт и после сборки возвращается к прежнему уровню. Это мусор, и он убирается. Норма.
      - **Лестница** — каждая итерация действия добавляет ступеньку, и после сборки уровень не возвращается. Это
        признак утечки.

      ## Пример целиком: вкладка «Заказы»

      Менеджер за день много раз переходит между «Обзором» и «Заказами». Записываем на демо-странице с галочкой Memory:
      сборка мусора, четыре раза по двадцать переключений, снова сборка.

      ![Запись Performance с графиками памяти: JS heap пилой, а Nodes растут ступенями от 99 до 3 042 180 и Listeners от 4 до 97; после сборки мусора в конце Nodes и Listeners не падают](images/brw-memory-counters.png "Узлы и обработчики растут лестницей и не возвращаются")

      - **Nodes** — число DOM-узлов: от 99 до трёх миллионов. Каждое открытие «Заказов» добавляет около 38 000 узлов —
        это таблица на 2000 строк по девять ячеек с текстом. Таблицу убрали со страницы, а узлы остались.
      - **Listeners** — число обработчиков: растёт примерно на один с каждым открытием.
      - **JS heap** — пила: растёт при построении таблицы и падает после сборки. По нему одному утечку легко
        проглядеть: DOM-узлы — объекты движка отрисовки, и счётчик кучи JavaScript показывает их не целиком.
      - После «Collect garbage» в конце записи узлы и обработчики не уменьшились. Значит, их кто-то держит.

      В «Пульсе» каждое открытие «Заказов» прибавляет около 6 МБ. Двести переходов за рабочий день — больше гигабайта.
      Кто держит таблицы, найдём в следующем уроке.

      ## Попробуй сам

      Демо «Вкладки»:
      [color-zebra.github.io/frontend-quiz/demos/browser/leak.html](https://color-zebra.github.io/frontend-quiz/demos/browser/leak.html).
      Открой Performance monitor, несколько раз нажми «Переключить 20 раз» и смотри на DOM Nodes и JS event listeners.
      Потом переключись на «Исправлено», обнови страницу и повтори.

      ## Варианты и их цена

      - **Аккуратно убирать за собой** (снимать обработчики, останавливать таймеры, отключать наблюдатели).
        - Плюс: надёжно и предсказуемо.
        - Цена: дисциплина; удобнее с `AbortController` или механизмом уборки во фреймворке.
      - **`WeakMap` для данных, привязанных к объектам.**
        - Плюс: данные уходят вместе с объектом сами.
        - Цена: ключи — только объекты, перебрать содержимое нельзя.
      - **Ограниченный кэш** (по числу записей или времени жизни).
        - Плюс: память не растёт бесконечно.
        - Цена: нужно выбрать размер и правило вытеснения.
      - **`WeakRef` и `FinalizationRegistry`.**
        - Плюс: редкие задачи вроде кэша, который не мешает сборке.
        - Цена: момент сборки не гарантирован; логику на них строить нельзя.

      ## Типичные ошибки

      - **Убрать элемент со страницы и считать, что память свободна.** Если на него есть ссылка, он остался.
      - **Снимать обработчик новой стрелочной функцией.** `removeEventListener` снимает только ту же самую функцию.
      - **Смотреть только на JS heap.** Утечка DOM лучше видна по числу узлов и обработчиков.
      - **Принимать пилу за утечку.** Если после сборки уровень вернулся, это просто мусор.
      - **Лечить утечку `WeakRef`.** Правильнее убрать лишнюю ссылку.

      ## Как спрашивают на интервью

      - «Как работает сборщик мусора в JavaScript?» — ждут достижимость от корней и пометку; плюсом будут поколения.
      - «Откуда берутся утечки памяти во фронтенде?» — ждут забытые обработчики, таймеры, наблюдатели, кэши,
        отсоединённые узлы.
      - «Чем `WeakMap` отличается от `Map`?» — ждут: ключ не мешает сборке, ключи только объекты, нет перебора.
      - «Как понять, что утечка есть?» — ждут: повторить действие, сборка мусора, рост лестницей в Performance
        monitor или записи с Memory.

      ## Коротко

      - Сборщик мусора освобождает объекты, до которых нельзя добраться по ссылкам от корней: глобального объекта,
        выполняющихся функций, документа и ждущих таймеров.
      - Утечка в JavaScript — не потерянная, а удерживаемая память: ненужный объект, на который осталась ссылка
        от корня. Раздутая, но не растущая память — не утечка.
      - Утечку почти всегда создаёт подписка или хранилище, которое пережило компонент: обработчик на `window`, таймер,
        кэш без предела. Ищут, что компонент завёл и не убрал.
      - `WeakMap` и `WeakSet` держат ключи слабо — данные уходят вместе с объектом; ключи только объекты.
        `WeakRef` и `FinalizationRegistry` не дают гарантий момента сборки.
      - Главная защита — уборка: снимать обработчики, останавливать таймеры, отключать наблюдатели. Удобно
        собрать подписки на одном `AbortController`.
      - Заметить утечку помогают диспетчер задач Chrome, Performance monitor и запись с галочкой Memory: пила
        после сборки — норма, лестница, которая не падает, — утечка. Следите за DOM-узлами и обработчиками,
        а не только за JS heap.

      ## Источники

      - [Управление памятью — MDN](https://developer.mozilla.org/ru/docs/Web/JavaScript/Guide/Memory_management)
      - [Fix memory problems — Chrome DevTools](https://developer.chrome.com/docs/devtools/memory-problems)
      - [WeakRef — MDN](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/WeakRef)

  - id: brw-leaks
    topic: Память
    subtopic: Поиск утечек
    title: Охота на утечку
    computer: true
    questions: [brw-047, brw-048, brw-049, brw-050, brw-075, brw-052]
    body: |
      ## Какую проблему решаем

      Прошлый урок закончился диагнозом: каждое открытие вкладки «Заказы» оставляет в памяти около 38 000 DOM-узлов
      и один обработчик событий, а сборка мусора их не забирает. Значит, на старые таблицы ведёт ссылка от какого-то
      корня. Но откуда? В «Пульсе» десятки модулей, и проверять каждый глазами — долго и ненадёжно.

      Вкладка **Memory** умеет сфотографировать все объекты в памяти и показать для любого из них цепочку ссылок,
      которая не даёт ему умереть. Этот урок — как пользоваться снимками, чтобы за несколько минут дойти от «память
      растёт» до строки кода.

      ## Снимок кучи

      **Снимок кучи** (heap snapshot) — фотография всех объектов страницы в момент съёмки: что это за объекты, сколько
      весят и кто на кого ссылается. В Chrome он включает и объекты JavaScript, и DOM-узлы.

      Как снять: Memory → **Heap snapshot** → Take snapshot. Перед каждым снимком браузер сам запускает сборку мусора,
      поэтому в снимок попадает только то, что действительно удерживается.

      В панели Memory есть и другие виды записи, о них ниже: **Allocations on timeline**, **Allocation sampling**
      и **Detached elements**.

      ## Как читать снимок

      Вид по умолчанию — **Summary**: объекты сгруппированы по конструктору, то есть по классу или виду объекта.
      Колонки:
      - **Constructor** — имя класса и число экземпляров: `OrdersTable ×20`.
      - **Distance** — сколько шагов по ссылкам от ближайшего корня.
      - **Shallow size** — **собственный размер**: сколько весит сам объект без того, на что он ссылается.
      - **Retained size** — **удерживаемый размер**: сколько памяти освободится, если этот объект исчезнет, — он сам
        плюс всё, что живо только благодаря ему.

      Для поиска утечек главная колонка — Retained size. Объект-обёртка может весить сотню байт, а удерживать мегабайты.
      Число после `@` — идентификатор объекта в снимке; по нему один и тот же объект узнают в разных снимках.

      Другие виды в выпадающем списке: **Comparison** — разница между двумя снимками: сколько объектов каждого
      класса появилось (# New), исчезло (# Deleted) и на сколько изменился размер; **Containment** — дерево от корней;
      **Statistics** — круговая диаграмма по видам памяти.

      ## Пример целиком: кто держит таблицы

      На демо-странице «Вкладки»: снимок 1 сразу после загрузки, потом «Переключить 20 раз», потом снимок 2. Первый
      весит 1,6 МБ, второй — 76,9 МБ. Открываем второй, сортировка по Retained size.

      ![Снимок кучи, вид Summary: всего 800 тысяч объектов, 76,9 МБ; среди строк OrdersTable ×20, Detached <tr> ×40 020, Detached <td> ×360 000, Detached Text ×360 180, EventListener ×58; у OrdersTable удерживаемый размер 74 337 kB, 97 %](images/brw-heap-summary.png "Второй снимок: 20 таблиц и сотни тысяч отсоединённых узлов")

      Наверху таблицы окажутся не ваши классы, а `Function`, `Window` и внутренние объекты браузера с именами
      `blink::…` и `V8…`. У них огромный удерживаемый размер, потому что через них проходят цепочки ко всему, что
      держит страница: окно держит обработчики, обработчики — функции, функции — замыкания. Это звенья цепочки,
      а не виновники. Свои классы ищут ниже по списку или вводят имя в поле Filter by class.

      - **OrdersTable ×20** — двадцать экземпляров нашего класса таблицы, хотя на странице сейчас нет ни одной.
        Вместе они удерживают 74 МБ — 97 % всей кучи.
      - **`Detached <tr>` ×40 020**, **`Detached <td>` ×360 000** — отсоединённые строки и ячейки. Слово
        Detached DevTools ставит перед DOM-узлами, которых нет в документе.
      - **EventListener ×58** — обработчики событий. Подозрительно много для страницы с тремя вкладками.

      Раскрываем `OrdersTable` и выбираем один экземпляр. Внизу появляется панель **Retainers** — цепочка удержания:
      кто ссылается на этот объект, кто ссылается на того, и так до корня.

      ![Выбран экземпляр OrdersTable с удерживаемым размером 3 717 kB; в Retainers: this in system / Context → context in () из tabs.js:15 → V8EventListener → EventListener → blink::RegisteredEventListener → дальше к окну](images/brw-heap-retainers.png "Цепочка удержания: таблицу держит замыкание обработчика")

      Читаем сверху вниз — от таблицы к корню:
      1. `this in system / Context` — таблица сохранена как `this` в **контексте замыкания**: так в снимке выглядят
         переменные, которые функция захватила снаружи.
      2. `context in () tabs.js:15` — это замыкание принадлежит безымянной функции из `tabs.js`, строка 15.
      3. `V8EventListener`, `EventListener`, `RegisteredEventListener` — функция зарегистрирована как обработчик события.
      4. Дальше цепочка уходит к окну: обработчик висит на `window`.

      Открываем `tabs.js:15`: `this.onResize = () => this.fitColumns();` и подписка
      `window.addEventListener("resize", this.onResize)`. При уходе с вкладки таблицу убирают со страницы, но обработчик
      с окна не снимают. Окно — корень, оно держит обработчик, обработчик через `this` держит таблицу со всеми её
      строками. Каждая таблица — 3,7 МБ.

      Исправление — снимать подписку при уходе с вкладки. Удобнее всего через `AbortController` из прошлого урока:
      `{ signal: this.subscriptions.signal }` при подписке и `this.subscriptions.abort()` в `destroy()`. Проверяем
      тем же способом: два снимка, двадцать переключений — в снимке 2 нет ни одного `OrdersTable`, а размер такой же,
      как в первом.

      ## Фильтры: быстрый путь к подозрительному

      Над таблицей Summary есть поле **Filter by class** и выпадающий список.
      - В поле можно ввести **Detached** — останутся только отсоединённые DOM-узлы.
      - **Objects retained by detached nodes** — объекты, которые держатся только потому, что на них ссылается
        отсоединённый узел.
      - **Objects retained by the DevTools console** — объекты, которые держит консоль: всё, что вы выводили через
        `console.log` или вычисляли в ней. Так можно отличить настоящую утечку от следов собственной отладки.
      - **Objects allocated between Snapshot 1 and Snapshot 2** — объекты, созданные между двумя снимками.
      - **Duplicated strings** — одинаковые строки, которые хранятся несколько раз.

      ## Приём трёх снимков

      Два снимка иногда врут. Первое открытие вкладки законно создаёт то, что живёт дальше: загружает модуль, заполняет
      кэш, строит справочник. В сравнении это выглядит как «утечка», хотя это нормально. Отделить разовое от
      повторяющегося помогает **приём трёх снимков**, который описала команда Gmail.

      ![Приём трёх снимков: снимок 1 после прогрева; действие N раз; снимок 2; ещё N раз; снимок 3; в снимке 3 фильтр Objects allocated between Snapshot 1 and 2 — выжившие объекты из середины, кандидаты в утечку](images/brw-three-snapshots.png "Выжившие из первой серии — кандидаты в утечку")

      1. **Прогреть.** Сделать действие один-два раза, чтобы создалось всё разовое.
      2. **Снимок 1.**
      3. **Повторить действие N раз** — например, десять раз открыть и закрыть «Заказы».
      4. **Снимок 2.**
      5. **Ещё N раз.**
      6. **Снимок 3.** В нём выбрать фильтр **Objects allocated between Snapshot 1 and Snapshot 2**.

      Объекты, созданные в первой серии, к третьему снимку должны были умереть: вкладку закрыли, и не раз. Те, что
      выжили, — кандидаты в утечку. А если ещё и число их кратно N — например, 10 таблиц после 10 открытий, — диагноз
      почти готов.

      ## Другие инструменты Memory

      - **Allocations on timeline** — запись выделений памяти во времени. Синие полосы — память, выделенная в этот
        момент и ещё живая в конце записи; серые — уже собранная. Выделите синюю полосу — список внизу покажет, какие
        объекты созданы в этот момент и до сих пор живы. Галочка Allocation stack traces добавляет, где в коде они
        созданы, ценой замедления.
      - **Allocation sampling** — выборочная запись выделений памяти с маленькими накладными расходами. Показывает,
        какие функции создали объекты, которые **ещё живы к концу записи**; по умолчанию в виде Heavy (Bottom Up) —
        сначала функции, создавшие больше всего. Помогает понять, кто создаёт то, что держится в памяти, — и при
        утечке, и при раздутой памяти. Объекты, которые успели создать и выбросить, в Chrome сюда не попадают
        (в Microsoft Edge для этого есть отдельные галочки).
      - **Detached elements** — список отсоединённых элементов, которые держит JavaScript, с числом узлов в каждом
        дереве. Самый короткий путь, если подозрение именно на DOM.
      - **`queryObjects(OrdersTable)`** в консоли — вернёт массив всех живых экземпляров класса. Быстрая проверка без
        снимка: переключились двадцать раз — `queryObjects(OrdersTable)` показывает массив из двадцати.

      Отдельная болезнь — **частые сборки мусора**, когда держится мало, а создаётся много. Снимки её не покажут: в них
      только то, что живо. Замечают её по пиле: в диспетчере задач Chrome или на графике JS heap в записи Performance
      с галочкой Memory; в той же записи много блоков Minor GC. Какие функции сорят, показывает **Allocations on
      timeline** с галочкой Allocation stack traces. Серые полосы на её шкале — память, которую выделили и уже собрали,
      а вид **Allocation** в выпадающем списке перечисляет функции и для каждой — сколько объектов она создала всего
      (Count, Size) и сколько из них живо (Live count, Live size). Функция, у которой Count огромный, а Live count почти
      ноль, и есть источник мусора: обычно она создаёт массивы и объекты в цикле, склеивает строки или копирует данные.

      Совет: давайте классам и функциям имена. В снимке `OrdersTable` найти легко, а сотни безымянных `Object`
      и `(anonymous)` — нет. В минифицированной сборке имена превращаются в `a`, `b`, `c`, поэтому утечку удобнее
      воспроизводить в сборке для разработки.

      ## Попробуй сам

      Демо «Вкладки»:
      [color-zebra.github.io/frontend-quiz/demos/browser/leak.html](https://color-zebra.github.io/frontend-quiz/demos/browser/leak.html).
      Сними снимок, нажми «Переключить 20 раз», сними второй, найди `OrdersTable` и его цепочку удержания. Потом
      проверь приёмом трёх снимков и `queryObjects(OrdersTable)`. Затем включи «Исправлено», обнови страницу и убедись,
      что таблиц в памяти не остаётся.

      ## Варианты и их цена

      - **Два снимка и Comparison.**
        - Плюс: быстро, видно, что прибавилось.
        - Цена: разовые кэши выглядят как утечка.
      - **Три снимка.**
        - Плюс: отделяет разовое от повторяющегося.
        - Цена: дольше; снимки больших страниц тяжёлые.
      - **Allocations on timeline.**
        - Плюс: видно, в какой момент создано то, что выжило, и где в коде.
        - Цена: сильнее замедляет страницу, запись большая.
      - **Detached elements и `queryObjects`.**
        - Плюс: самый быстрый ответ на узкий вопрос.
        - Цена: только отсоединённые узлы или только один класс.

      ## Типичные ошибки

      - **Смотреть на Shallow size.** Обёртка весит байты, а держит мегабайты: смотрят Retained size.
      - **Делать вывод по двум снимкам без прогрева.** Разовые кэши примут за утечку.
      - **Забывать про консоль.** Всё, что вы выводили в консоль, держится, пока её не очистят.
      - **Чинить «объект», а не цепочку.** Удалять надо ссылку, найденную в Retainers, — обычно обработчик, таймер или
        элемент массива.
      - **Не проверять после правки.** Утечка лечится, только когда новый снимок это показал.

      ## Как спрашивают на интервью

      - «Как найдёте утечку памяти в SPA?» — ждут: повторить действие, Performance monitor или запись с Memory, снимки
        кучи, Comparison, Retainers, исправить ссылку и проверить снимком.
      - «Чем shallow size отличается от retained size?» — ждут: свой размер против памяти, которая освободится вместе
        с объектом.
      - «Что такое detached DOM node?» — ждут: удалён из документа, но держится ссылкой из JavaScript.

      ## Коротко

      - Снимок кучи — фотография всех объектов и ссылок между ними; перед снимком браузер сам собирает мусор, поэтому
        в нём только удерживаемое.
      - Summary группирует объекты по конструктору. Главная колонка для утечек — Retained size: сколько освободится
        вместе с объектом. Shallow size — только сам объект.
      - Retainers показывает цепочку удержания от объекта к корню. Убирают звено, где ссылка лишняя, — чаще всего
        обработчик, таймер или элемент массива, а не сам корень.
      - Слово Detached помечает DOM-узлы, которых нет в документе, но которые держит JavaScript; фильтр Detached
        и профиль Detached elements находят их быстро.
      - Приём трёх снимков отделяет разовые кэши от утечки: объекты, созданные между первым и вторым снимком и живые
        в третьем, — кандидаты.
      - Частые сборки мусора снимки не покажут: какие функции сорят, видно в Allocations on timeline со стеками
        выделений — у них большой Count и почти нулевой Live count.

      ## Источники

      - [Record heap snapshots — Chrome DevTools](https://developer.chrome.com/docs/devtools/memory-problems/heap-snapshots)
      - [Fix memory problems — Chrome DevTools](https://developer.chrome.com/docs/devtools/memory-problems)

  - id: brw-engine
    topic: Движок
    subtopic: Как V8 выполняет код
    title: Как V8 выполняет код
    questions: [brw-053, brw-054, brw-055, brw-076, brw-057]
    body: |
      ## Какую проблему решаем

      До сих пор мы смотрели на браузер снаружи: задачи, кадры, раскладка, память. Но есть и уровень ниже — сам
      движок JavaScript, который превращает ваш код в команды процессора. На собеседованиях senior-разработчику
      нередко задают вопросы вроде «как V8 выполняет код», «что такое скрытые классы» или «почему одна и та же функция
      бывает то быстрой, то медленной».

      Для повседневной работы это скорее эрудиция: почти всегда выигрыш дают меньше работы, меньше DOM и правильный
      алгоритм, а не подстройка под движок. Но несколько выводов из устройства движка полезны и на практике. Этот урок —
      обзор: как код проходит через V8, на что движок делает ставку и когда эта ставка проигрывает.

      ## Действующие лица

      **V8** — движок JavaScript в Chrome, Edge и Node.js. В Firefox свой движок — SpiderMonkey, в Safari —
      JavaScriptCore. Детали у них разные, но основные идеи этого урока общие: несколько уровней компиляции,
      скрытые классы, кэши обращений к свойствам, сборщик мусора с поколениями.

      ## Путь кода через V8

      ![Путь кода через V8: исходный код; разбор, функции разбираются лениво при первом вызове; Ignition — байт-код и сбор данных о типах; Sparkplug — быстрый машинный код без догадок; Maglev — оптимизация «достаточно хорошо, быстро»; TurboFan — пиковая оптимизация на догадках о типах; пунктиром — деоптимизация назад к байт-коду](images/brw-v8.png "Чем горячее функция, тем выше уровень")

      1. **Разбор** (parsing). Текст скрипта превращается в дерево программы. Разбирать всё сразу дорого, поэтому
         V8 делает это **лениво**: тела функций, которые ещё не вызывались, только быстро проверяются на ошибки
         синтаксиса, а полностью разбираются при первом вызове. В профиле время разбора и компиляции видно как
         блоки Compile Script и Compile Code: у большого бандла это десятки и сотни миллисекунд при загрузке.
      2. **Ignition** — интерпретатор. Он переводит функцию в **байт-код** — компактные команды для виртуальной машины
         V8 — и выполняет их. По ходу Ignition записывает **обратную связь** (feedback): какие типы и какие формы
         объектов встречаются в каждой операции.
      3. **Sparkplug** — базовый компилятор, появился в 2021 году. Почти мгновенно переводит байт-код в машинный код,
         без догадок и оптимизаций. Код становится быстрее интерпретатора, а компиляция почти ничего не стоит.
      4. **Maglev** — быстрый оптимизирующий компилятор, в Chrome с версии 117 на компьютерах (2023 год). По словам
         команды V8, он делает «достаточно хороший код достаточно быстро»: компилирует примерно в 10 раз медленнее
         Sparkplug и в 10 раз быстрее TurboFan.
      5. **TurboFan** — оптимизирующий компилятор для самых горячих функций. Дольше всех компилирует, зато даёт
         самый быстрый код.

      Функция поднимается по уровням, когда становится «горячей» — вызывается часто или крутит длинные циклы.
      Холодный код так и остаётся в интерпретаторе, и это правильно: компилировать его дороже, чем выполнить.

      ## Ставка на типы и деоптимизация

      Оптимизирующие компиляторы делают **спекулятивный** код: они смотрят на обратную связь и делают ставку.
      «В этой функции `a + b` всегда складывались два целых числа — сгенерирую машинное сложение целых и проверку,
      что это так». Пока ставка верна, код летает.

      Если однажды в функцию придёт строка вместо числа, проверка сработает, и V8 выбросит оптимизированный код
      и вернётся к байт-коду. Это **деоптимизация** (deoptimization). Потом функция может снова подняться
      по уровням — уже с учётом новых типов. Разовая деоптимизация незаметна; функция, которая оптимизируется
      и сбрасывается снова и снова, тратит время впустую.

      ## Скрытые классы

      У объекта в JavaScript можно в любой момент добавить или удалить свойство. Если бы движок хранил каждый объект
      как словарь «имя → значение», каждое обращение к `order.price` было бы поиском по словарю. Вместо этого V8
      заводит **скрытые классы** (hidden classes; в V8 их называют Maps, в литературе — shapes): описание того, какие
      у объекта свойства, в каком порядке и где каждое лежит.

      - Объекты с одинаковым набором свойств, добавленных **в одном порядке**, делят один скрытый класс.
      - `{ x: 1, y: 2 }` и `{ y: 2, x: 1 }` — разные скрытые классы: порядок важен.
      - Добавление свойства потом, после создания, переводит объект в новый скрытый класс.
      - `delete` свойства часто переводит объект в медленный режим словаря.

      ## Встроенные кэши

      В каждом месте кода, где читается свойство, V8 держит **встроенный кэш** (inline cache, IC): «в прошлый раз здесь
      был объект такого скрытого класса, а `price` лежало вот по такому смещению». Если пришёл объект того же класса,
      значение берётся сразу, без поиска.

      - **Мономорфный** кэш — в этом месте всегда один скрытый класс. Самый быстрый случай.
      - **Полиморфный** — несколько классов, в V8 до четырёх. Чуть медленнее: нужно проверить каждый.
      - **Мегаморфный** — больше четырёх. Кэш сдаётся, и каждое обращение идёт медленным общим путём.

      ## Пример целиком: заказы разной формы

      В «Пульсе» заказы приходят из трёх систем, и код приводит их к общему виду. Исторически это делалось так.

      ```js
      function normalize(raw) {
        const order = { id: raw.id };
        if (raw.discount) order.discount = raw.discount;   // есть не у всех
        order.price = raw.price;
        if (raw.promo) order.promo = raw.promo;             // и это тоже
        order.qty = raw.qty;
        return order;
      }
      ```

      В зависимости от того, есть ли скидка и промокод, получаются четыре разных скрытых класса: свойства добавляются
      в разном порядке и разном составе. Функция подсчёта выручки, которая обходит 40 000 заказов и читает
      `order.price * order.qty`, видит в одном месте кода четыре формы — кэш полиморфный. Добавим ещё пару
      необязательных полей — и он станет мегаморфным.

      Правка — создавать все заказы одинаково, сразу со всеми полями.

      ```js
      function normalize(raw) {
        return { id: raw.id, price: raw.price, qty: raw.qty, discount: raw.discount ?? 0, promo: raw.promo ?? null };
      }
      ```

      Честная оговорка: такой выигрыш заметен только в горячем коде, который выполняется миллионы раз, и бывает
      от нескольких процентов до нескольких раз. Оптимизировать под движок функцию, которая вызывается раз в минуту,
      бессмысленно. Сначала профиль, потом правка.

      ## Массивы

      У массивов в V8 тоже есть виды элементов (elements kinds). Массив только из целых чисел хранится компактнее
      и обрабатывается быстрее, чем массив из чисел вперемешку со строками. Массив без «дыр» быстрее массива с дырами:
      `new Array(1000)` создаёт массив из тысячи пустых мест, и V8 помечает его как дырявый навсегда. Практический
      вывод простой: держать в массиве значения одного типа и заполнять его подряд.

      ## Сборщик мусора V8

      Сборщик мусора V8 называется **Orinoco** и устроен по поколениям, о которых говорил урок «Как браузер управляет
      памятью».
      - **Молодое поколение** собирает **Scavenger** — малая сборка (Minor GC). Живые объекты копируются в свободную
        половину области; пережившие две сборки переходят в старое поколение. Работа делится между несколькими
        потоками.
      - **Старое поколение** собирает Mark-Compact — большая сборка (Major GC): пометка живого, уборка, уплотнение.
        Пометка идёт параллельно с JavaScript в фоновых потоках, а на основном потоке остаются короткие паузы.
      - Часть работы Chrome запускает в **свободное время** — например, когда до следующего кадра остался запас.

      В профиле эти паузы видны как блоки Minor GC и Major GC. Если их много, страница создаёт слишком много временных
      объектов. Какие функции сорят, показывает запись Allocations on timeline со стеками выделений (урок «Охота
      на утечку»).

      ## Варианты и их цена

      - **Писать так, как удобно, и не думать о движке.**
        - Плюс: проще читать и менять код; для холодного кода — правильный выбор.
        - Цена: в горячих местах можно потерять в разы, если формы объектов и типы скачут.
      - **Подстроить горячий код под движок** — одинаковая форма объектов, один тип в массиве, без `delete`.
        - Плюс: заметный выигрыш там, где код выполняется миллионы раз.
        - Цена: нужен профиль, чтобы найти такие места; правила неочевидны тем, кто будет читать код.
      - **Переписать самую горячую часть на WebAssembly.**
        - Плюс: предсказуемая скорость без ставок на типы.
        - Цена: другой язык, сборка и стоимость передачи данных между JavaScript и WebAssembly; оправдано для тяжёлых
          вычислений вроде обработки видео, а не для обычного интерфейса.

      ## Что из этого следует на практике

      - **Создавайте объекты одной формы одинаково:** все свойства сразу, в одном порядке, необязательные — со значением
        по умолчанию. Классы и функции-фабрики делают это сами.
      - **Не удаляйте свойства через `delete`** в горячем коде: лучше присвоить `undefined` или `null`.
      - **Не смешивайте типы** в одной переменной, одном аргументе, одном массиве в горячем коде.
      - **Меньше кода при загрузке** — меньше разбирать и компилировать: разбиение кода помогает и здесь.
      - **Сначала профиль.** Подстройка под движок — последнее средство после алгоритма, объёма работы и DOM.

      ## Типичные ошибки

      - **Оптимизировать под движок без профиля.** Выигрыш есть только в горячем коде.
      - **Добавлять свойства объектам по условию в разном порядке.** Одна сущность получает несколько скрытых классов.
      - **Удалять свойства через `delete` в горячих объектах.** Объект переходит в медленный режим.
      - **Считать, что движок «всегда оптимизирует».** Он делает ставку на типы, и ставка может проиграть.
      - **Переносить советы про V8 на все браузеры буквально.** Идеи общие, детали в SpiderMonkey и JavaScriptCore другие.

      ## Как спрашивают на интервью

      - «Как V8 выполняет JavaScript?» — ждут: разбор, байт-код и интерпретатор, оптимизирующие компиляторы
        для горячего кода, деоптимизация.
      - «Что такое скрытые классы и inline caches?» — ждут: общее описание формы объекта и запоминание формы
        в месте обращения; мономорфный и мегаморфный случай.
      - «Почему порядок добавления свойств влияет на скорость?» — ждут: разный порядок — разные скрытые классы,
        кэш в месте обращения перестаёт быть мономорфным.

      ## Коротко

      - V8 разбирает код лениво: тела функций полностью разбираются при первом вызове. Большой бандл стоит времени
        на разбор и компиляцию.
      - Код сначала выполняет интерпретатор Ignition и собирает данные о типах; горячие функции компилируют Sparkplug,
        Maglev и TurboFan — чем выше уровень, тем дольше компиляция и быстрее код.
      - Оптимизированный код построен на ставке на типы. Если ставка не сыграла, происходит деоптимизация — возврат
        к байт-коду.
      - Объекты с одинаковыми свойствами, добавленными в одном порядке, делят скрытый класс. Встроенный кэш в месте
        обращения быстрее всего, когда видит один класс, и сдаётся, когда их больше четырёх.
      - Практический вывод: создавать объекты одной сущности одинаково, не удалять свойства через `delete`, не мешать
        типы в горячем коде — и делать это только там, где профиль показал горячее место.
      - Сборщик Orinoco собирает молодое поколение часто и параллельно, старое — реже и в основном в фоне; в профиле
        это блоки Minor GC и Major GC.

      ## Источники

      - [JavaScript engine fundamentals: Shapes and Inline Caches — Mathias Bynens, Benedikt Meurer](https://mathiasbynens.be/notes/shapes-ics)
      - [Maglev — V8’s fastest optimizing JIT — v8.dev](https://v8.dev/blog/maglev)
      - [Trash talk: the Orinoco garbage collector — v8.dev](https://v8.dev/blog/trash-talk)

  - id: brw-debugging
    topic: Отладка
    subtopic: Логи и точки останова
    title: Логи или точки останова
    computer: true
    questions: [brw-058, brw-059, brw-060, brw-061, brw-062, brw-063]
    body: |
      ## Какую проблему решаем

      В «Пульсе» три загадки, и все три не про скорость.
      - Новость об акции появляется на «Обзоре» и через три секунды исчезает сама. В коде новостей нет ни одной
        строчки, которая бы её удаляла.
      - По кнопке «Обновить» во вкладке Network видно два одинаковых запроса за заказами вместо одного.
      - «Экспорт в CSV» иногда ничего не делает: ни файла, ни ошибки в консоли.

      Большинство разработчиков в такой ситуации расставляют по коду `console.log` и перезагружают страницу, пока
      не повезёт. Иногда это лучший путь. Но во всех трёх загадках главный вопрос — «кто это сделал?», а куда ставить
      лог, неизвестно: виновный код может быть где угодно, даже в чужом файле. Этот урок о том, когда логи
      действительно лучше, когда точки останова экономят часы и какие инструменты есть между ними.

      ## Честное сравнение

      **Точка останова** (breakpoint) — место или условие, при котором отладчик останавливает выполнение кода. Пока
      код стоит, видно всё: значения всех переменных, цепочку вызовов, можно шагать по строкам.

      **Логи лучше, когда:**
      - **события частые.** Движение мыши, прокрутка, ввод текста — остановка на каждом событии ломает сам сценарий:
        перетаскивание оборвётся, жест не закончится;
      - **ошибка зависит от времени или фокуса.** Остановка меняет тайминги, и гонка запросов перестаёт
        воспроизводиться. Переключение в DevTools забирает фокус у страницы: срабатывает `blur`, закрываются
        выпадающие меню;
      - **нужна история, а не мгновение.** «В каком порядке пришли эти пять ответов» видно в логе одним взглядом,
        а точкой останова — только по одному;
      - **это не ваш компьютер.** У пользователей отладчика нет: только логи и мониторинг ошибок (курс 3, «Что
        происходит у пользователей»);
      - **стек забит фреймворком.** В приложении на React или Angular остановка показывает десятки кадров кода
        фреймворка, и пробираться через них долго. Лог в своём коде говорит ровно то, что нужно. Отчасти это лечит
        список игнорирования — о нём ниже.

      **Точки останова НАМНОГО лучше, когда:**
      - **вопрос «кто?», а куда ставить лог — неизвестно.** Кто удалил элемент, кто поменял класс, кто отправил
        запрос, кто поймал клик. Отладчик остановится в момент события, где бы ни был код;
      - **исключение проглочено.** Пустой `catch` или промис без обработки — в логах ничего нет, а отладчик умеет
        останавливаться на любом выброшенном исключении;
      - **код чужой или собранный.** В библиотеку или чужой виджет лог не допишешь, а точку поставишь;
      - **нужно всё состояние сразу.** Вместо десяти логов «а что в этой переменной» — одна остановка и панель Scope;
      - **логика ветвится непонятно.** Пошаговое выполнение показывает, по какой ветке на самом деле пошёл код.

      ## Виды точек останова

      Все они — в панели **Sources** (справа) или в **Elements**.
      - **На строке кода** — нажать на номер строки. Отладчик остановится перед её выполнением.
      - **Условная** (conditional) — правый клик по номеру строки → Add conditional breakpoint. Остановится, только если
        выражение истинно: `order.id === 100017` среди пяти тысяч строк.
      - **Точка логирования** (logpoint) — правый клик → Add logpoint. Выводит выражение в консоль, не останавливаясь.
        Это лог, который не нужно дописывать в код, пересобирать и потом не забыть удалить.
      - **На изменение DOM** — в Elements правый клик по узлу → Break on: Subtree modifications (изменились дети),
        Attribute modifications (изменились атрибуты), Node removal (узел удалили).
      - **На запросы** — XHR/fetch Breakpoints: остановка, когда адрес запроса содержит заданную строку.
      - **На события** — Event Listener Breakpoints: остановка в любом обработчике выбранного события, например
        `click` или `keydown`, или таймера.
      - **На исключения** — галочки Pause on uncaught exceptions (на непойманных) и Pause on caught exceptions (и на
        пойманных тоже).
      - **На вызов функции** — `debug(имяФункции)` в консоли: остановка при каждом её вызове.

      ## Что делать после остановки

      Когда отладчик остановился, страница замирает, а в Sources подсвечена строка, которая выполнится следующей.
      Кнопки над правой колонкой Sources управляют дальнейшим выполнением.
      - **Resume** (F8) — продолжить до следующей остановки.
      - **Step over** (F10) — выполнить текущую строку целиком, не заходя внутрь функций, которые она вызывает.
      - **Step into** (F11) — зайти внутрь вызова на этой строке. Именно здесь отладчик «проваливается» в код
        библиотек и фреймворка; список игнорирования, о котором ниже, это убирает.
      - **Step out** (Shift+F11) — дойти до конца текущей функции и вернуться туда, откуда её вызвали.

      Справа — панели состояния.
      - **Scope** — все переменные в момент остановки: локальные (Local), захваченные замыканием (Closure)
        и глобальные (Global).
      - **Watch** — выражения, которые вы добавили сами: они пересчитываются на каждом шаге.
      - **Call Stack** — цепочка вызовов, которая привела сюда; нажатие на строку стека показывает переменные того
        места.

      Все эти панели видны на скриншоте в примере ниже.

      ## Асинхронный стек

      Панель **Call Stack** показывает цепочку вызовов, которая привела к остановке. Обычный стек обрывается на границе
      асинхронности: колбэк таймера «вызвал» сам браузер. DevTools склеивает такие стеки: под колбэком видна строка
      `setTimeout`, `Promise.then` или `await`, а под ней — код, который этот таймер или промис запустил. Поэтому
      из остановки внутри колбэка можно дойти до того, кто всё начал.

      ## Список игнорирования

      **Список игнорирования** (ignore list) — файлы, которые отладчик не показывает и через которые не шагает:
      их кадры прячутся в Call Stack и в стеках ошибок в консоли, а пошаговое выполнение их пропускает. По умолчанию
      туда попадает всё из `/node_modules/`. Кроме того, если карта исходников помечает файлы полем `ignoreList`,
      DevTools добавляет их сами — так делают Angular CLI с версии 14.1 и сборки на Vite с соответствующей настройкой.
      Свои правила добавляют в Settings → Ignore list или правым кликом по файлу → Add script to ignore list. Это и есть
      ответ на «стек забит фреймворком»: остаются только ваши функции.

      ## Карты исходников и локальная подмена

      **Карта исходников** (source map) — файл, который связывает собранный и минифицированный код с исходным. Если
      сборка их выпускает, Sources показывает ваши исходные файлы, а точки останова ставятся прямо в них. В продакшене
      карты часто не отдают браузеру, а загружают в систему мониторинга ошибок — тогда стеки ошибок от пользователей
      читаемы, а исходники не выложены всем.

      **Локальная подмена** (Local overrides) — Sources → Overrides: выбрать папку на диске, поправить файл в Sources,
      и при перезагрузке DevTools отдаст вашу версию вместо той, что пришла с сервера. Так проверяют исправление прямо
      на рабочем сайте, не выкатывая его. Подменять можно и заголовки ответа.

      ## Консоль — не только log

      - **`$0`** — элемент, выбранный в Elements; `$1`–`$4` — выбранные до него. **`$_`** — результат последнего
        выражения.
      - **`monitorEvents($0, "click")`** — выводить в консоль все клики по элементу; `unmonitorEvents` — перестать.
      - **`getEventListeners($0)`** — все обработчики, повешенные на элемент.
      - **`copy(obj)`** — скопировать объект в буфер обмена.
      - **`console.table(rows)`** — массив объектов таблицей.
      - **`console.trace()`** — вывести стек вызовов в этом месте, не останавливаясь.

      И одна ловушка логов. `console.log(cart)` выводит не снимок объекта, а ссылку на него. Свёрнутая строка-превью
      показывает значения на момент лога, а раскрытый объект — на момент **первого раскрытия**. Если объект успели
      изменить, они не совпадут. Об этом предупреждает значок «i» рядом с раскрытым объектом. Если важно состояние
      в момент лога, выводите копию: `console.log(structuredClone(cart))` или нужные поля.

      ## Пример целиком: три загадки

      **Кто удаляет новость.** Лог ставить некуда: неизвестно, кто её трогает. В Elements на списке новостей — Break on →
      Subtree modifications, перезагрузка. Через три секунды отладчик останавливается в `widget.js`, в функции
      `cleanupPromos`, а асинхронный стек показывает, что её запустил `setTimeout` при старте виджета чата. Виджет
      убирает свои рекламные плашки по классу `.promo` — и заодно нашу новость с тем же классом.

      **Кто грузит заказы дважды.** XHR/fetch Breakpoints → строка `orders.json`, нажимаем «Обновить».

      ![Отладчик остановлен на fetch в loadOrders, orders.js:6: Paused on XHR or fetch, адрес с reason=event; в Call Stack — loadOrders orders.js:6, (anonymous) orders.js:20, setTimeout, (anonymous) orders.js:20, (anonymous) orders.js:14; внизу XHR/fetch breakpoints: URL contains "orders.json"](images/brw-debug-fetch.png "Вторая остановка: асинхронный стек ведёт к событию orders:refresh")

      Первая остановка — прямой вызов из обработчика кнопки. Вторая — интереснее: `loadOrders` вызван из колбэка
      `setTimeout` в строке 20, а тот запущен обработчиком события `orders:refresh`, которое кнопка отправляет
      в строке 14. Подписчика добавила другая команда: «при обновлении — перезагрузить заказы». Он не знает, что
      кнопка уже загрузила их сама. Чинят договорённостью: один владелец загрузки, остальные получают данные
      из события.

      **Почему экспорт молчит.** Включаем Pause on caught exceptions и снова жмём «Экспорт». Отладчик останавливается
      в `export.js` на `o.date.slice(0, 10)`: TypeError, потому что у одного заказа дата `null`. Исключение ловит пустой
      `catch` с комментарием «потом разберёмся». Чинят и данные, и `catch`: ошибку нужно хотя бы показать человеку
      и отправить в мониторинг.

      **А где логи лучше.** Четвёртая жалоба: «если быстро печатать в поиске, фильтр иногда сбрасывается на старый
      запрос». Точка останова в обработчике ответа меняет тайминги, и ошибка пропадает. Точка логирования
      `"ответ", query, performance.now()` показывает: ответы на «моск» и «москва» иногда приходят в обратном порядке,
      и старый перезаписывает новый. Это гонка запросов из курса «Системный дизайн: данные и надёжность», урок «Гонки
      запросов».

      ## Попробуй сам

      Демо «Три загадки»:
      [color-zebra.github.io/frontend-quiz/demos/browser/debug.html](https://color-zebra.github.io/frontend-quiz/demos/browser/debug.html).
      Найди виновника каждой загадки точками останова: на изменение DOM, на запрос и на пойманное исключение.

      ## Варианты и их цена

      - **`console.log` в коде.**
        - Плюс: история событий, не меняет тайминги, работает где угодно.
        - Цена: нужно знать, куда ставить; правка кода, пересборка, риск забыть лог в коммите.
      - **Точка логирования.**
        - Плюс: лог без правки кода.
        - Цена: живёт только в вашем браузере, её не передать коллеге.
      - **Точка останова на строке или условная.**
        - Плюс: всё состояние в момент остановки, пошаговое выполнение.
        - Цена: останавливает мир — меняет тайминги и фокус.
      - **Точки на события, DOM, запросы, исключения.**
        - Плюс: отвечают на «кто это сделал», даже если код неизвестен.
        - Цена: в большом приложении могут срабатывать слишком часто — сужайте условием или списком игнорирования.

      ## Типичные ошибки

      - **Гадать, куда поставить лог, когда вопрос «кто?».** Точка на DOM, запрос или событие найдёт виновника сразу.
      - **Останавливать отладчиком частые события и жесты.** Сценарий ломается; здесь нужны логи или точки логирования.
      - **Доверять раскрытому в консоли объекту.** Он показывает состояние на момент первого раскрытия, а не лога.
      - **Пробираться через кадры фреймворка в стеке.** Их прячет список игнорирования.
      - **Оставлять пустой `catch`.** Ошибка исчезает из логов, а найти её помогает только Pause on caught exceptions.

      ## Как спрашивают на интервью

      - «Как найдёте, кто удаляет элемент со страницы?» — ждут: точка останова Break on → Node removal или
        Subtree modifications.
      - «Когда вы используете логи, а когда отладчик?» — ждут честное сравнение: частые события и тайминги — логи;
        «кто?», проглоченные ошибки, чужой код — точки останова.
      - «Что такое source maps и зачем они?» — ждут: связь собранного кода с исходным для отладки и стеков ошибок.

      ## Коротко

      - Логи лучше для частых событий, ошибок, зависящих от времени и фокуса, истории событий и продакшена: точка
        останова меняет тайминги и забирает фокус. Лог без правки кода даёт точка логирования.
      - Точки останова намного лучше, когда вопрос «кто это сделал?», а куда ставить лог, неизвестно, когда исключение
        проглочено и когда код чужой.
      - Когда неизвестно, где виновный код, точку ставят не на строку, а на событие: изменение DOM, запрос, исключение.
        Отладчик сам остановится в нужном месте.
      - После остановки шагают кнопками Step over и Step into и смотрят переменные в Scope.
      - Call Stack склеивает асинхронные цепочки, а список игнорирования прячет кадры фреймворков и библиотек —
        по умолчанию всё из `/node_modules/`.
      - Раскрытый в консоли объект показывает состояние на момент первого раскрытия, а не лога; для снимка выводите
        копию.

      ## Источники

      - [Pause your code with breakpoints — Chrome DevTools](https://developer.chrome.com/docs/devtools/javascript/breakpoints)
      - [Ignore List — Chrome DevTools](https://developer.chrome.com/docs/devtools/settings/ignore-list)
      - [Console Utilities API reference — Chrome DevTools](https://developer.chrome.com/docs/devtools/console/utilities)

  - id: brw-field
    topic: Данные пользователей
    subtopic: Скорость у реальных людей
    title: Скорость у реальных людей
    computer: true
    questions: [brw-064, brw-065, brw-066, brw-067, brw-068, brw-069]
    body: |
      ## Какую проблему решаем

      В «Пульсе» уже собирают данные реальных пользователей: каждая сессия отправляет на сервер LCP, INP и CLS.
      Недавно 75-й процентиль INP у менеджеров вырос до 640 мс. Разработчик открывает дашборд у себя, записывает
      профиль, нажимает всё подряд — и ничего медленного не находит: самые медленные нажатия — 90 мс.

      Это частая ситуация. Число «INP плохой» говорит, что проблема есть, но не говорит, где она. Какое нажатие
      медленное? Какая из трёх частей задержки? Какой скрипт? Пока данные отвечают только «плохо», разработчик гадает.
      Этот урок о том, как собирать данные, которые подсказывают причину, и как по ним воспроизвести проблему
      в лаборатории.

      ## Лаборатория и поле

      Курс 3 в уроке «Как измерить скорость» уже сравнивал лабораторный замер и данные реальных пользователей (field
      data, RUM). Напомним главное: лаборатория повторяема и подробна, но это одно устройство и одна сеть; данные людей
      показывают правду, но шумят и хуже объясняют причину.

      Открытый источник данных людей — **Chrome UX Report** (CrUX): Google публикует LCP, INP и CLS по сайтам. Но в него
      попадают только публично доступные и достаточно посещаемые страницы. Внутреннего дашборда за логином там, скорее
      всего, нет, поэтому данные нужно собирать самим.

      ## PerformanceObserver: подписка на замеры браузера

      Браузер сам замеряет многое: загрузку ресурсов, отрисовку, взаимодействия, долгие кадры. Получить эти замеры
      можно через **`PerformanceObserver`** — подписку на записи определённого типа.

      ```js
      new PerformanceObserver((list) => {
        for (const entry of list.getEntries()) console.log(entry);
      }).observe({ type: "event", buffered: true, durationThreshold: 16 });
      ```

      `buffered: true` просит отдать и то, что браузер записал до подписки. Полезные типы записей:
      - `event` — Event Timing, задержки взаимодействий;
      - `long-animation-frame` — долгие кадры с виноватыми скриптами;
      - `largest-contentful-paint`, `layout-shift` — замеры LCP и сдвигов вёрстки;
      - `mark`, `measure` — ваши собственные отметки;
      - `resource`, `navigation` — время загрузки ресурсов и самой страницы.

      ## Event Timing: три части задержки у человека

      **Event Timing** — записи о событиях взаимодействий. У каждой записи:
      - `startTime` — момент действия человека;
      - `processingStart` и `processingEnd` — начало и конец обработчиков;
      - `duration` — от действия до следующего кадра, округлено до 8 мс;
      - `interactionId` — общий номер всех событий одного взаимодействия;
      - `target` — элемент, на котором оно случилось.

      Отсюда три части задержки из урока «Медленные взаимодействия»: ожидание — `processingStart − startTime`,
      обработка — `processingEnd − processingStart`, показ — остальное до `startTime + duration`. По умолчанию браузер
      отдаёт только события длиннее 104 мс; порог можно снизить до 16 мс параметром `durationThreshold`. Event Timing
      работает во всех основных браузерах с декабря 2025 года.

      ## Long Animation Frames: кто виноват

      Знать, что обработка была долгой, мало — нужно знать, чей код. Это отвечает **Long Animation Frames API** (LoAF):
      записи о кадрах, обновление которых задержалось больше чем на 50 мс. У кадра есть список `scripts`, и у каждого
      скрипта:
      - `invoker` и `invokerType` — что его запустило: обработчик события, таймер, промис;
      - `sourceURL`, `sourceFunctionName` — файл и функция;
      - `duration` — сколько выполнялся;
      - `forcedStyleAndLayoutDuration` — сколько из этого заняли принудительные пересчёты стилей и раскладки.

      LoAF появился в Chrome 123 и есть в других браузерах на Chromium — Edge, Opera; в Firefox и Safari его нет. Старый Long Tasks API тоже сообщает о задачах длиннее
      50 мс, но почти ничего не говорит о том, чей код в них выполнялся.

      ## User Timing: свои отметки

      Браузер не знает, что для вас важно «отчёт построен» или «таблица перерисована». Это отмечают сами:

      ```js
      performance.mark("report-start");
      buildReport();
      performance.measure("Отчёт по регионам", "report-start");
      ```

      Такие отметки видны в лаборатории — на дорожке Timings в записи Performance, как «Отчёт по регионам» на скриншотах
      урока «Читаем вкладку Performance», — и доступны в поле через `PerformanceObserver` с типом `measure`. Одна
      и та же отметка связывает данные людей с профилем.

      ## Библиотека web-vitals с атрибуцией

      Писать всё это самому не обязательно. Библиотека **web-vitals** от команды Chrome считает LCP, INP и CLS так же,
      как CrUX, а её сборка с **атрибуцией** — `import { onINP, onLCP } from "web-vitals/attribution"` — добавляет
      объяснение.
      - У INP: `interactionTarget` — селектор элемента, `inputDelay`, `processingDuration`, `presentationDelay` — три
        части задержки, `loadState` — на каком этапе загрузки было взаимодействие, `longAnimationFrameEntries` — записи
        LoAF за это время.
      - У LCP: `target` — главный элемент, `timeToFirstByte`, `resourceLoadDelay`, `resourceLoadDuration`,
        `elementRenderDelay` — четыре части из урока «Загрузка страницы».

      Данные отправляют, когда страница скрывается, через `navigator.sendBeacon` или `fetch` с `keepalive` — как это
      делать и чего нельзя отправлять, разобрано в курсе 3, уроке «Что происходит у пользователей».

      ## Пример целиком: 640 мс, которых нет у разработчика

      В «Пульс» добавляют атрибуцию INP. Через неделю у самых медленных взаимодействий менеджеров видна картина:
      - `interactionTarget`: `button#compare` — кнопка «Сравнить с прошлым кварталом»;
      - `processingDuration` — основная часть, около 500 мс; ожидание и показ небольшие;
      - в `longAnimationFrameEntries` главный скрипт — `compareQuarters` из `compare.js`, `invokerType` — обработчик
        клика;
      - `loadState`: `complete` — страница давно загружена.

      Теперь ясно, что воспроизводить: сравнение кварталов. Но у разработчика оно занимает 90 мс. Разница — не только
      в процессоре. У разработчика тестовая база на 2 000 заказов, а в рабочей — 40 000 за квартал. Профиль
      с замедлением процессора 6× и копией настоящих объёмов показывает ту же картину: для каждого заказа текущего
      квартала функция ищет заказы того же клиента в прошлом квартале перебором всего списка. Работа растёт как
      квадрат числа заказов: в 20 раз больше заказов — в 400 раз больше проверок.

      Исправление — один раз разложить заказы прошлого квартала по клиентам в `Map` и брать готовые. Через неделю
      после выкатки 75-й процентиль INP у менеджеров — 180 мс. Цикл замкнулся: поле нашло проблему, лаборатория —
      причину, поле подтвердило починку.

      Уроки из этой истории:
      - **воспроизводить надо не только железо, но и данные:** объём, длину списков, «тяжёлых» пользователей;
      - **атрибуция экономит недели:** без неё «INP 640 мс» не говорит, куда смотреть;
      - **замер в поле — проверка починки:** лабораторное «стало быстрее» подтверждают данными людей.

      ## Попробуй сам

      Демо «Фильтр по региону»:
      [color-zebra.github.io/frontend-quiz/demos/browser/filter.html](https://color-zebra.github.io/frontend-quiz/demos/browser/filter.html).
      Блок «Что увидела бы аналитика» на странице показывает данные Event Timing и LoAF для последнего взаимодействия —
      то, что отправила бы библиотека с атрибуцией. Код — в файле `vitals.js`, его можно открыть в Sources.

      ## Варианты и их цена

      - **Только CrUX.**
        - Плюс: ничего не нужно делать.
        - Цена: только публичные и посещаемые страницы, сводные числа без причин, данные за 28 дней.
      - **web-vitals без атрибуции.**
        - Плюс: свои числа по всем страницам, маленькая библиотека.
        - Цена: видно, что плохо, но не почему.
      - **web-vitals с атрибуцией и LoAF.**
        - Плюс: элемент, часть задержки и виноватый скрипт.
        - Цена: больше данных на отправку и хранение; LoAF только в браузерах на Chromium.
      - **Свои отметки User Timing.**
        - Плюс: меряют то, что важно продукту, и связывают поле с профилем.
        - Цена: их надо расставить и поддерживать.

      ## Типичные ошибки

      - **Собирать только итоговые числа.** «INP плохой» без элемента и частей задержки не говорит, что чинить.
      - **Воспроизводить на своих данных.** Проблема часто в объёме, которого нет у разработчика.
      - **Считать, что CrUX видит любой сайт.** Внутренние и малопосещаемые страницы туда не попадают.
      - **Ждать LoAF во всех браузерах.** Он есть только в браузерах на Chromium; атрибуция скриптов будет не у всех.
      - **Не проверять починку в поле.** Лаборатория говорит «быстрее», но решают данные людей.

      ## Как спрашивают на интервью

      - «Как собирать производительность у реальных пользователей?» — ждут: `PerformanceObserver`, web-vitals,
        отправка при скрытии страницы, процентили.
      - «INP в поле плохой, а у вас всё быстро. Что делать?» — ждут: атрибуция — элемент, части задержки, скрипт;
        воспроизведение с замедлением и реальными объёмами данных.
      - «Что такое Long Animation Frames?» — ждут: замер долгих кадров с указанием, какие скрипты в них работали.

      ## Коротко

      - Данные людей говорят, есть ли проблема; чтобы они подсказывали и причину, собирают атрибуцию: какой элемент,
        какая часть задержки, какой скрипт.
      - CrUX включает только публичные и достаточно посещаемые страницы; для внутренних приложений данные собирают
        сами.
      - `PerformanceObserver` подписывается на замеры браузера: Event Timing даёт три части задержки взаимодействия,
        LoAF — долгие кадры и скрипты в них, User Timing — ваши отметки.
      - LoAF есть только в браузерах на Chromium (Chrome с версии 123), Event Timing — во всех основных браузерах,
        поэтому пустой список скриптов в Safari и Firefox не значит, что тормозов нет.
      - Библиотека web-vitals в сборке с атрибуцией отдаёт для INP элемент, три части задержки и записи LoAF, для LCP —
        главный элемент и четыре части.
      - Воспроизводя проблему из поля, повторяют не только слабое железо, но и реальные объёмы данных, а починку
        подтверждают снова данными людей.

      ## Источники

      - [Long Animation Frames API — Chrome for Developers](https://developer.chrome.com/docs/web-platform/long-animation-frames)
      - [web-vitals — GitHub](https://github.com/GoogleChrome/web-vitals)
      - [PerformanceEventTiming — MDN](https://developer.mozilla.org/en-US/docs/Web/API/PerformanceEventTiming)

  - id: brw-case
    topic: Итог
    subtopic: Разбор дашборда
    title: 'Разбор: дашборд от жалобы до исправления'
    computer: true
    questions: [brw-070, brw-071, brw-072, brw-073, brw-074]
    body: |
      ## Жалоба

      Через месяц после выпуска версии 3.2 «Пульса» поддержка получает новую волну писем: «к обеду дашборд начинает
      тормозить». Утром всё нормально. После обеда нажатия иногда отвечают через секунду, иногда сразу, ноутбук шумит
      вентилятором. Перезагрузка страницы помогает — до следующего обеда.

      В этом уроке пройдём всё расследование целиком, тем порядком, которому учил курс: уточнить симптом, посмотреть
      данные людей, воспроизвести в лаборатории, найти причину, починить и проверить. Новых механизмов здесь нет: на
      каждом шаге — ссылка на урок, где он объяснён.

      ## Уточняем симптом

      Первый урок курса: «тормозит» — не диагноз. Три уточнения из писем уже многое говорят.
      - **Не на конкретном действии, а «иногда».** Значит, медленный не обработчик какой-то кнопки: тот был бы медленным
        всегда.
      - **Становится хуже со временем.** Что-то копится: память или фоновая работа.
      - **Перезагрузка помогает.** То, что копится, живёт внутри страницы, а не на сервере.

      Под подозрением две вещи из курса: утечка памяти (урок «Как браузер управляет памятью») и фоновые задачи, которые
      мешают нажатиям, — большое ожидание ввода (урок «Медленные взаимодействия»).

      ## Что говорят данные людей

      В «Пульсе» уже собирают INP с атрибуцией (урок «Скорость у реальных людей»). Разобьём данные по тому, сколько
      времени страница была открыта к моменту взаимодействия:
      - сессии до часа — 75-й процентиль INP 150 мс;
      - сессии дольше трёх часов — 900 мс.

      В медленных взаимодействиях долгих сессий почти всё время — `inputDelay`, ожидание ввода. Обработка и показ
      небольшие. А в записях Long Animation Frames раз за разом встречается одна функция — `refreshOrders` из `live.js`,
      вызванная таймером. Кнопки ни при чём: в момент нажатия поток занят обновлением заказов.

      ## Воспроизводим в лаборатории

      Чтобы не ждать до обеда, имитируем полдня работы: много раз открываем и закрываем вкладку «Заказы». У менеджера
      к обеду таких переходов под сотню; на демо-странице хватит двенадцати — для этого есть кнопка «Поработать
      полдня». Потом,
      ничего не трогая, записываем 8 секунд в Performance (урок «Читаем вкладку Performance»). В «Пульсе» заказы
      обновляются раз в 30 секунд, в демо — раз в 3, чтобы не ждать.

      ![Запись восьми секунд без действий: раз в три секунды на основном потоке пачка из двенадцати долгих задач с красными уголками; в Bottom-up — Parse HTML 1 467 мс, 66,5 %, orderRowHtml из data.js, refreshOrders из live.js с полным временем 95,1 %, а также C++ GC и Major GC](images/brw-case-idle.png "Страницу никто не трогает, а основной поток трудится")

      Человек ничего не делает, а основной поток раз в три секунды занят пачкой из двенадцати задач подряд. Каждая —
      долгая. Bottom-up: 95 % времени уходит в `refreshOrders`, а внутри — в разбор HTML (Parse HTML), который
      `innerHTML` запускает для таблицы на тысячи строк. Видны и блоки сборки мусора: каждая перерисовка создаёт
      и выбрасывает тысячи узлов.

      Двенадцать задач в пачке — ровно столько раз мы открывали «Заказы». Похоже, каждое открытие запускает своё обновление,
      и закрытие вкладки его не останавливает.

      ## Подтверждаем через память

      Одного профиля мало: проверим гипотезу вторым инструментом (урок «Охота на утечку»).
      - В консоли `queryObjects(OrdersView)` — массив из двенадцати объектов, хотя вкладка «Заказы» закрыта.
      - Снимок кучи: `OrdersView ×12`. Цепочка удержания у любого из них ведёт через замыкание к колбэку таймера,
        а таймеры — корень: браузер обещал их вызывать.

      Значит, это и утечка памяти, и источник фоновой работы одновременно.

      ## Находим строку

      Ссылка `live.js:23` в Bottom-up открывает метод `refreshOrders`. Если раскрыть его строку, видно, кто его
      вызывает: колбэк таймера, заведённый в конструкторе.

      ```js
      class OrdersView {
        constructor(container) {
          this.root = document.createElement("div");
          container.append(this.root);
          this.refreshOrders();
          this.timer = setInterval(() => this.refreshOrders(), REFRESH_MS);
        }
        refreshOrders() { /* перерисовать всю таблицу через innerHTML */ }
        destroy() { clearInterval(this.timer); this.root.remove(); }
      }

      // при уходе с вкладки:
      view.root.remove(); // ← а не view.destroy()
      ```

      Метод `destroy()` написан правильно, но при уходе с вкладки его не вызывают: код просто убирает таблицу
      со страницы. Таймер продолжает тикать, колбэк держит `this`, а `this` держит таблицу. Каждое открытие «Заказов»
      добавляет ещё один вечный таймер, и каждый перерисовывает невидимую таблицу. К обеду их под сотню, к вечеру —
      две сотни.

      ## Чиним

      1. **Вызывать `destroy()` при уходе с вкладки.** Минимальная правка, которая убирает и утечку, и фоновую работу.
      2. **Не обновлять то, что не видно.** Одно обновление на приложение, а не на каждый экземпляр вкладки; таблица
         обновляется, только если её видно, и не обновляется, пока вкладка браузера скрыта. Когда вкладку свернули
         или переключили, `document.visibilityState` становится `hidden`, и браузер присылает событие
         `visibilitychange`: по нему обновления останавливают и запускают снова.
      3. **Сделать одно обновление дешевле.** Перерисовывать не всю таблицу на две тысячи строк, а только изменившиеся
         строки, и показывать первые сто (урок «Медленные взаимодействия»).

      Первая правка лечит причину, вторая и третья — уменьшают цену, если похожая ошибка повторится.

      ## Проверяем

      - **Лаборатория.** «Поработать полдня» в исправленной версии, 8 секунд записи без действий: долгих задач нет.
        `queryObjects(OrdersView)` — пустой массив. Тот же сценарий, те же условия, что и до правки.
      - **Данные людей.** Через неделю после выкатки 75-й процентиль INP у сессий дольше трёх часов — 160 мс, почти как
        у коротких. Память вкладки к вечеру держится около 200 МБ.

      ## Что ещё могло быть и почему отбросили

      Хорошее расследование не только находит причину, но и объясняет, почему не другие.
      - **Медленный обработчик кнопки.** Тогда в данных выросла бы обработка, а не ожидание, и тормозило бы всегда,
        а не к обеду.
      - **Утечка обработчиков, как в уроке «Охота на утечку».** Память росла бы, но процессор раз в 30 секунд был бы
        свободен: обработчик `resize` вызывается только при изменении окна.
      - **Сборка мусора.** Блоки GC в записи есть, но их доля мала; они — следствие лишних перерисовок, а не причина.
      - **Медленная сеть или сервер.** Перезагрузка страницы не лечила бы проблему, и в записи были бы ожидания
        запросов, а не долгие задачи.

      ## Попробуй сам

      Демо «К обеду тормозит»:
      [color-zebra.github.io/frontend-quiz/demos/browser/live.html](https://color-zebra.github.io/frontend-quiz/demos/browser/live.html).
      Попечатай в поле, нажми «Поработать полдня», попечатай снова. Запиши восемь секунд без действий, найди
      `refreshOrders`, проверь `queryObjects(OrdersView)` в консоли. Потом переключи на «Исправлено», обнови страницу
      и повтори.

      ## Типичные ошибки расследования

      - **Сразу чинить первое подозрение.** Без данных людей легко ускорить кнопку, которая и так быстрая.
      - **Записывать профиль только во время нажатия.** Фоновая работа видна в записи без действий.
      - **Не воспроизводить «время».** Проблемы, которые копятся, не видны на свежей странице: нужно сымитировать часы
        работы.
      - **Верить одному инструменту.** Профиль процессора показал таймеры, снимок памяти подтвердил, что их держат.
      - **Не проверять в поле.** Лаборатория говорит «починили», решают данные людей.

      ## Как спрашивают на интервью

      - «Приложение тормозит через несколько часов работы, перезагрузка помогает. Ваши действия?» — ждут: гипотезы
        «утечка» и «копящаяся фоновая работа», данные по длине сессии, воспроизведение «времени», запись без действий,
        снимки памяти, уборка таймеров и подписок.
      - «Как убедиться, что исправление помогло?» — ждут: тот же сценарий в лаборатории и данные людей после выкатки.

      ## Коротко

      - Порядок расследования один для любой жалобы: уточнить симптом, посмотреть данные людей, воспроизвести,
        найти причину, починить, проверить в лаборатории и в поле.
      - «Хуже со временем, перезагрузка помогает» указывает на то, что копится внутри страницы: утечку памяти
        или фоновую работу.
      - Данные людей, разбитые по длине сессии, и атрибуция INP показали главное: большое ожидание ввода и таймер
        `refreshOrders` в долгих кадрах.
      - Копящиеся проблемы воспроизводят, имитируя часы работы, а фоновую работу ищут записью без действий.
      - Гипотезу подтверждают вторым инструментом: профиль показал лишние таймеры, снимок памяти и `queryObjects` —
        что их держат.
      - Таймеры, обработчики и подписки компонента останавливают при его удалении; невидимое не обновляют.

      ## Источники

      - [Analyze runtime performance — Chrome DevTools](https://developer.chrome.com/docs/devtools/performance)
      - [Fix memory problems — Chrome DevTools](https://developer.chrome.com/docs/devtools/memory-problems)

questions:
  # ===================== Введение =====================
  - id: brw-001
    topic: Введение
    subtopic: Как искать причину тормозов
    level: junior
    question: |
      Пользователи веб-почты жалуются: длинная переписка открывается быстро, но при прокрутке страница идёт
      рывками, текст подпрыгивает. К какому из четырёх симптомов относится эта жалоба?
    options:
      - text: 'Дёргается: браузер не успевает рисовать кадры при прокрутке'
        correct: true
        why: 'Рывки при прокрутке и анимации — признак того, что кадры рисуются слишком долго. Искать причину будем в конвейере отрисовки и раскладке.'
      - text: 'Долго открывается: браузер ждёт сеть и скрипты перед показом'
        why: 'По условию переписка открывается быстро. Загрузка здесь ни при чём, жалоба на то, что происходит уже после неё.'
      - text: 'Медленно отвечает: нажатие ждёт, пока освободится поток'
        why: 'Медленный ответ — это задержка после нажатия, клика или клавиши. Прокрутка — другой случай: жалоба на рывки, а не на ожидание реакции.'
      - text: 'Течёт память: вкладка занимает всё больше места со временем'
        why: 'Утечка проявляется постепенно: чем дольше открыта вкладка, тем хуже. Здесь рывки сразу, при первой же прокрутке.'
    explanation: |
      Жалобу «тормозит» сначала относят к одному из четырёх симптомов. Долго открывается — загрузка, смотрят Network
      и запись загрузки. Медленно отвечает — долгие задачи в основном потоке, смотрят дорожку Interactions. Дёргается
      — браузер не успевает готовить кадры, смотрят Rendering и дорожку Frames. Течёт память — смотрят Memory.
      Рывки при прокрутке относятся к третьему симптому.
    links:
      - https://developer.chrome.com/docs/devtools/performance/reference

  - id: brw-002
    topic: Введение
    subtopic: Как искать причину тормозов
    level: middle
    question: |
      В CRM поиск по клиентам фильтрует уже загруженный список. Разработчик на новом ноутбуке записывает профиль
      поиска: 90 мс, всё быстро. Менеджеры на офисных компьютерах пятилетней давности пишут, что после каждой буквы
      поле «замирает». Что разработчику сделать в лаборатории первым?
    options:
      - text: 'Включить замедление процессора в 4–6 раз и записать поиск снова'
        correct: true
        why: 'Поиск работает с данными, которые уже в браузере, — упирается он в процессор. Замедление процессора приближает компьютер разработчика к компьютеру менеджера, и долгая работа станет видна в профиле.'
      - text: 'Включить замедление сети Slow 4G и записать поиск снова'
        why: 'Список уже загружен, поиск не ходит в сеть. Медленная сеть изменит загрузку страницы, но не время фильтрации.'
      - text: 'Записать профиль без изменений ещё пять раз и усреднить'
        why: 'Усреднение уберёт случайный шум, но 90 мс останутся 90 мс: мощный процессор по-прежнему прячет проблему.'
      - text: 'Записать Record and reload с замедлением сети 3G и процессора 4×'
        why: 'Это запись загрузки, а жалоба — на поиск по уже загруженному списку. Перезагрузка и медленная сеть перемешают нужное действие с загрузкой.'
    explanation: |
      Мощный компьютер разработчика прячет проблемы: задача, которая у него занимает 90 мс, на медленном процессоре
      займёт 400–600. Поэтому в панели Performance есть Capture settings: замедление процессора (4×, 6×, 20×
      и откалиброванные Low-tier и Mid-tier mobile) и замедление сети. Процессор замедляют, когда жалоба на работу
      в браузере, сеть — когда на загрузку.
    links:
      - https://developer.chrome.com/docs/devtools/performance/reference

  - id: brw-078
    topic: Введение
    subtopic: Как искать причину тормозов
    level: middle
    question: |
      Жители пригородов жалуются, что сайт городской библиотеки открывается секунд по десять. В городе на тех же
      телефонах всё быстро, а в пригородах ловит только мобильный интернет.
      У разработчика на офисном интернете страница загружается за секунду. Что включить в DevTools, чтобы увидеть
      проблему у себя?
    options:
      - text: 'Замедление сети — например, Slow 4G — и записать загрузку страницы'
        correct: true
        why: 'Жалоба — на загрузку, и разница между пригородом и городом — в сети. Замедление сети приближает офисный интернет к мобильному, и ожидание запросов станет видно в водопаде и записи.'
      - text: 'Замедление процессора 6× и записать загрузку страницы'
        why: 'Процессор у жителей пригородов не хуже, чем у горожан. Разница в сети, и замедление процессора её не воспроизведёт.'
      - text: 'Замедление процессора 4× и записать работу уже открытой страницы каталога'
        why: 'Жалоба на открытие, а не на работу после загрузки. Запись открытой страницы не покажет, чего ждёт загрузка.'
      - text: 'Ничего не замедлять, а записать загрузку пять раз подряд и усреднить'
        why: 'Усреднение уберёт шум, но офисная сеть останется быстрой: проблема так и не проявится.'
    explanation: |
      Замедление выбирают по симптому. Жалоба на загрузку и разница между людьми по сети — замедление сети (Fast 4G,
      Slow 4G, 3G) и запись загрузки (Record and reload) или водопад в Network. Жалоба на работу в браузере — замедление
      процессора и запись нужного действия. Это контрастная пара: одинаковый вопрос «почему у меня быстро», разные
      ответы.
    links:
      - https://developer.chrome.com/docs/devtools/performance/reference

  - id: brw-003
    topic: Введение
    subtopic: Как искать причину тормозов
    level: middle
    question: |
      В онлайн-редакторе презентаций долго открывалась вкладка «Шаблоны». Разработчик нашёл в профиле медленную
      функцию и переписал её. На своём компьютере, без замедления и с открытыми расширениями, он один раз открыл
      вкладку — «вроде стало быстрее». Чего не хватает, чтобы считать починку проверенной?
    options:
      - text: 'Повторить тот же сценарий в тех же условиях, что и замер «до», и сравнить'
        correct: true
        why: 'Сравнивать можно только одинаковые замеры: тот же сценарий, то же замедление, без расширений. Тогда разница в числах говорит о правке, а не о случайности.'
      - text: 'Прогнать автоматический аудит страницы и добиться в нём ста баллов из ста'
        why: 'Аудит проверяет загрузку страницы по своему списку правил. Он не повторяет сценарий открытия вкладки и ничего не скажет, стала ли быстрее именно она.'
      - text: 'Попросить коллегу на другом компьютере открыть вкладку и оценить скорость'
        why: 'Ощущение «стало быстрее» — не измерение: оно не даёт числа и зависит от компьютера и ожиданий.'
      - text: 'Добавить вокруг функции console.time и убедиться, что она ускорилась'
        why: 'Это покажет время одной функции, но не всей вкладки. Время может переехать в другое место — например, в отрисовку, — и человек не увидит разницы.'
    explanation: |
      Цикл работы — измерить, найти, починить, проверить. Проверка — это тот же сценарий в тех же условиях, что и
      замер «до»: то же замедление процессора, те же данные, без расширений. Только тогда разница в числах относится
      к правке. После лаборатории смотрят данные реальных пользователей: стало ли лучше у людей.
    links:
      - https://developer.chrome.com/docs/devtools/performance

  - id: brw-004
    topic: Введение
    subtopic: Как искать причину тормозов
    level: senior
    question: |
      После выпуска новой версии сервиса бронирования переговорок в поддержку пришло: «всё стало тормозить».
      Команда хочет действовать сразу. Какой первый шаг даст больше всего пользы?
    options:
      - text: 'Выяснить, когда тормозит: при открытии, после нажатия, при прокрутке или со временем'
        correct: true
        why: 'От ответа зависит, куда смотреть: загрузка, долгие задачи, кадры или память. Без этого любой следующий шаг — догадка.'
      - text: 'Записать в Performance загрузку главной страницы с замедлением сети и процессора в 4 раза'
        why: 'Полезный замер, если тормозит открытие. Но если жалуются на нажатия или на память к концу дня, запись загрузки причину не покажет.'
      - text: 'Снять снимок памяти вкладки после часа работы и найти в нём, какие объекты выросли'
        why: 'Подходит для утечки, а о ней из жалобы ничего не известно. Если тормозит открытие, снимок памяти потратит время впустую.'
      - text: 'Прогнать Lighthouse на главной странице и по порядку исправить все его замечания'
        why: 'Lighthouse в обычном режиме проверяет загрузку одной страницы. Медленные нажатия, рывки и утечки в его отчёт не попадут.'
    explanation: |
      «Тормозит» — не диагноз. Сначала уточняют симптом: долго открывается, медленно отвечает на действие, дёргается
      или становится хуже со временем. От этого зависит инструмент: Network и запись загрузки, дорожка Interactions,
      Rendering и Frames или Memory. Каждый из неправильных вариантов здесь — хороший инструмент, но для одного
      симптома, а симптом ещё неизвестен.
    links:
      - https://developer.chrome.com/docs/devtools/performance/reference

  # ===================== Как браузер рисует =====================
  - id: brw-005
    topic: Как браузер рисует
    subtopic: Event loop и кадр
    level: junior
    question: |
      В интернет-магазине по кнопке «Сравнить» обработчик клика первой строкой показывает надпись «Сравниваем…»,
      а потом синхронно сравнивает характеристики 300 товаров — около 400 мс. В конце надпись меняется
      на «Готово». Люди говорят, что надписи «Сравниваем…» никогда не видели. Почему?
    options:
      - text: 'Кадр рисуется только после конца задачи, а к тому моменту в DOM уже «Готово»'
        correct: true
        why: 'Изменение DOM попадает на экран в ближайшем кадре, а кадр не нарисуется, пока идёт обработчик клика. Когда он закончился, текст уже другой.'
      - text: 'Браузер объединяет два изменения одного элемента и применяет только последнее'
        why: 'Никакого объединения нет: в DOM были оба значения по очереди. Просто между ними не было кадра, который мог бы показать первое.'
      - text: 'Надпись появилась, но держалась меньше одного кадра — глаз её не замечает'
        why: 'Наоборот, в DOM надпись провисела 400 мс — это 24 кадра при 60 Гц. Её не нарисовали ни разу, потому что всё это время шла одна задача.'
      - text: 'Обработчик клика выполняется в фоновом потоке, и DOM обновится позже'
        why: 'Обработчики событий выполняются на основном потоке, том же, где рисуются кадры. Поэтому кадр и ждёт конца обработчика.'
    explanation: |
      Цикл событий берёт одну задачу, выполняет её до конца, потом микрозадачи, и только потом, если пора, рисует
      кадр. Клик — это одна задача. Пока она идёт 400 мс, ни одного кадра не будет. Чтобы надпись успели увидеть,
      тяжёлую работу откладывают до следующего кадра — например, `requestAnimationFrame(() => setTimeout(work, 0))`,
      — или вовсе убирают с основного потока.
    links:
      - https://html.spec.whatwg.org/multipage/webappapis.html#event-loops

  - id: brw-006
    topic: Как браузер рисует
    subtopic: Event loop и кадр
    level: middle
    question: |
      Что из этого можно утверждать наверняка про порядок вывода?

      ```js
      setTimeout(() => console.log("timeout"), 0);
      requestAnimationFrame(() => console.log("raf"));
      Promise.resolve().then(() => console.log("micro"));
      console.log("sync");
      ```
    options:
      - text: '«sync», потом «micro»; порядок «timeout» и «raf» зависит от кадра'
        correct: true
        why: 'Синхронный код идёт первым, микрозадачи — сразу после него. А таймер и колбэк перед кадром — разные механизмы, и кто первый, зависит от того, когда подойдёт кадр.'
      - text: '«sync», «micro», «timeout», «raf» — таймер с нулём опережает кадр'
        why: 'Так бывает чаще всего, но не всегда: если кадр подошёл раньше, чем браузер взял задачу таймера, первым выведется «raf».'
      - text: '«sync», «raf», «micro», «timeout» — подготовка кадра важнее промисов'
        why: 'Микрозадачи выполняются сразу после текущего кода, до любой следующей задачи и до кадра. «micro» не может оказаться после «raf».'
      - text: '«timeout», «raf», «micro», «sync» — в порядке, в каком всё записано'
        why: 'Колбэки не выполняются в момент записи: они ставятся в очереди. Синхронный `console.log` выполняется раньше любого из них.'
    explanation: |
      Скрипт — одна задача, поэтому весь его синхронный код идёт первым. Сразу после задачи выполняется вся очередь
      микрозадач — обработчики промисов. Таймер — отдельная задача, а `requestAnimationFrame` вызывается перед
      ближайшим кадром. Какое из этих событий наступит раньше, зависит от того, где в 16,7 мс кадра оказался скрипт.
      Код, который рассчитывает на определённый порядок таймера и кадра, ненадёжен.
    links:
      - https://learn.javascript.ru/event-loop

  - id: brw-007
    topic: Как браузер рисует
    subtopic: Event loop и кадр
    level: middle
    question: |
      В чате код ждёт, пока соседний модуль поставит флаг готовности. Первая версия проверяла флаг так:
      `const check = () => ready ? start() : Promise.resolve().then(check);`. Вкладка намертво зависла: не рисуется,
      не отвечает на клики. Вторая версия с `setTimeout(check, 0)` вместо промиса работает, хоть и неэлегантно.
      В чём разница?
    options:
      - text: 'Очередь микрозадач выполняется до конца, и цепочка промисов не пускает к задачам и кадрам'
        correct: true
        why: 'Каждый `then` ставит новую микрозадачу, а браузер выполняет их все, прежде чем взять следующую задачу. Соседний модуль, который должен поставить флаг, так и не получит управления.'
      - text: 'У промисов более высокий приоритет, и браузер на это время отключает обработку кликов и кадров'
        why: 'Браузер ничего не отключает. Дело в правиле очереди: микрозадачи выполняются все до одной, а новые постоянно добавляются.'
      - text: 'Промисы выполняются в отдельном потоке, который забирает весь процессор'
        why: 'Обработчики промисов выполняются на том же основном потоке. Именно поэтому они и мешают кадрам и вводу.'
      - text: '`Promise.resolve()` создаёт новый объект на каждой проверке, и вкладку душит сборка мусора'
        why: 'Объекты действительно создаются, но сборщик мусора с ними справится. Зависание объясняется порядком выполнения, а не памятью.'
    explanation: |
      После каждой задачи браузер выполняет всю очередь микрозадач, включая те, что добавились по ходу. Цепочка
      промисов, где каждый ставит следующий, не кончается никогда: до задач, ввода и кадров дело не доходит. Цикл
      на `setTimeout` ставит задачи, а между задачами браузер успевает и рисовать, и выполнять чужой код. Правильнее
      вовсе не опрашивать флаг, а получить уведомление: событие или промис, который соседний модуль разрешит сам.
    links:
      - https://learn.javascript.ru/event-loop

  - id: brw-008
    topic: Как браузер рисует
    subtopic: Event loop и кадр
    level: middle
    question: |
      На карте магазинов маркер плавно едет к выбранной точке. Сдвиг считается в функции, которую вызывают через
      `setInterval(step, 16)`. На мониторе 60 Гц движение заметно подрагивает, а на ноутбуке со 120 Гц выглядит
      ещё хуже. Что изменить?
    options:
      - text: 'Вызывать step через requestAnimationFrame и считать сдвиг от прошедшего времени'
        correct: true
        why: '`requestAnimationFrame` вызывает код один раз перед каждым кадром при любой частоте экрана. Сдвиг от прошедшего времени держит скорость одинаковой при 60 и 120 Гц.'
      - text: 'Уменьшить интервал до 8 мс, чтобы таймер успевал на каждый кадр при 120 Гц'
        why: 'Таймер по-прежнему не привязан к кадрам: часть вызовов придётся на один кадр, часть пропадёт. Работы станет вдвое больше, а рывки останутся.'
      - text: 'Перенести расчёт сдвига в Web Worker, чтобы он не мешал основному потоку'
        why: 'Расчёт сдвига крошечный, дело не в нагрузке. Воркер не знает о кадрах, а двигать маркер в DOM всё равно придётся на основном потоке.'
      - text: 'Заменить setInterval на цепочку промисов, чтобы шаги шли без задержек'
        why: 'Цепочка микрозадач не отдаёт управление вовсе, и кадры не нарисуются. Карта зависнет.'
    explanation: |
      Таймер живёт своей жизнью и не знает о кадрах: иногда срабатывает дважды между кадрами, иногда ни разу, и глаз
      видит рывки. `requestAnimationFrame(fn)` вызывает `fn` ровно перед следующим кадром, сколько бы их ни было
      в секунду. Колбэк получает текущее время, и положение считают от него, а не от числа вызовов. Простые
      перемещения ещё лучше отдать CSS-анимации `transform` — об этом следующий урок.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/Window/requestAnimationFrame

  - id: brw-009
    topic: Как браузер рисует
    subtopic: Event loop и кадр
    level: senior
    question: |
      В онлайн-видеоредакторе кнопка «Подготовить превью» запускает синхронный расчёт на 300 мс. Перенести его
      в воркер или разбить пока нельзя — это отдельная большая задача. Сейчас нужно только одно: чтобы надпись
      «Готовим превью…» появилась на экране до заморозки. Как запустить расчёт после того, как надпись поставлена?
    options:
      - text: '`requestAnimationFrame(() => setTimeout(prepare, 0))`'
        correct: true
        why: 'Колбэк `requestAnimationFrame` выполнится перед ближайшим кадром, а таймер внутри него — после того, как этот кадр с надписью нарисован.'
      - text: '`setTimeout(prepare, 0)` сразу после надписи'
        why: 'Таймер может сработать раньше ближайшего кадра: браузер не обязан рисовать между двумя задачами. Иногда надпись будет видна, иногда нет.'
      - text: '`await Promise.resolve(); prepare();` после надписи'
        why: 'Продолжение после `await` — микрозадача. Она выполнится до кадра, и надпись по-прежнему не появится.'
      - text: '`requestAnimationFrame(prepare)` сразу после надписи'
        why: 'Колбэк выполнится перед кадром, но ещё до отрисовки. Расчёт займёт 300 мс внутри подготовки кадра, и надпись покажется только вместе с результатом.'
    explanation: |
      Кадр рисуется после колбэков `requestAnimationFrame`. Значит, работа, запущенная таймером из такого колбэка,
      начнётся уже после того, как кадр с надписью отрисован. web.dev называет этот приём способом, который работает
      во всех браузерах. Он не убирает заморозку — 300 мс страница всё равно не отвечает, — но человек видит, что
      нажатие принято. Настоящее лечение — разбить работу или убрать её с основного потока.
    links:
      - https://web.dev/articles/optimize-inp

  - id: brw-010
    topic: Как браузер рисует
    subtopic: Event loop и кадр
    level: junior
    question: |
      Отчёт по регионам в «Пульсе» строится почти секунду: для каждого из 42 регионов и 90 дней функция заново перебирает
      все 40 000 заказов квартала фильтром. Страница на это время замирает. Какой способ здесь сильнее всего?
    options:
      - text: 'Один раз разложить заказы по региону и дню и считать по готовым группам'
        correct: true
        why: 'Около 150 миллионов проверок превращаются в 40 тысяч: отчёт строится за единицы миллисекунд. Лучший способ разгрузить поток — не делать лишней работы.'
      - text: 'Разбить построение на куски по региону и между кусками вызывать scheduler.yield()'
        why: 'Страница перестанет замирать, но отчёт по-прежнему будет строиться почти секунду, а на слабых ноутбуках дольше. Разбиение нужно, когда работу нельзя сократить, а здесь можно.'
      - text: 'Перенести построение отчёта в Web Worker и передать ему все 40 000 заказов'
        why: 'Основной поток освободится, но почти секунда лишней работы останется, плюс копирование заказов в воркер. Сначала стоит убрать квадратичный перебор.'
      - text: 'Добавить на кнопку debounce в 300 мс, чтобы отчёт не строился по двойному клику'
        why: 'Debounce уменьшает число запусков, но один запуск остаётся таким же долгим. Жалоба — на заморозку при каждом построении.'
    explanation: |
      Есть четыре способа разгрузить основной поток: сделать меньше работы, разбить её и уступать браузеру, унести
      в Web Worker или на сервер. Подробно они разобраны в курсе 4, в уроке «Тяжёлая работа без зависаний». Первым
      проверяют, нельзя ли сократить работу: вложенный перебор — частая причина долгих задач, и группировка за один
      проход убирает её целиком. Разбиение и воркер берут, когда сократить нечего.
    links:
      - https://web.dev/articles/optimize-long-tasks

  - id: brw-011
    topic: Как браузер рисует
    subtopic: Конвейер отрисовки
    level: junior
    question: |
      В онлайн-банке по кнопке «Переводы» сбоку выезжает панель шириной 320 px. Сейчас анимация меняет `left`
      от −320 до 0 и на телефонах идёт рывками. Что анимировать вместо `left`, чтобы движение было гладким?
    options:
      - text: '`transform: translateX()` — сдвиг делает компоновщик'
        correct: true
        why: '`transform` у элемента со своим слоем меняет только композицию: раскладки и отрисовки нет, а CSS-переход идёт на отдельном потоке.'
      - text: '`margin-left` — меняется только отступ, а не положение панели'
        why: 'Отступ — тоже геометрия: браузер в каждом кадре пересчитывает раскладку и перерисовывает панель, как и с `left`.'
      - text: '`width` от 0 до 320 px — панель будто бы вырастает'
        why: 'Ширина — самое дорогое свойство: меняется раскладка панели и её содержимого, текст переносится заново в каждом кадре.'
      - text: '`width` у обёртки с overflow: hidden — панель открывается шторкой'
        why: 'Ширина обёртки — свойство геометрии: раскладка и отрисовка обёртки и её соседей в каждом кадре, как и с `left`. Содержимое панели не переносится, но легче от этого не становится.'
    explanation: |
      Конвейер отрисовки: стили → раскладка → отрисовка → композиция. Свойства геометрии (`left`, `margin`, `width`)
      запускают его целиком. `transform` и `opacity` у элемента со своим слоем требуют только композиции, а CSS-переход
      этих свойств браузер передаёт компоновщику — отдельному потоку. Поэтому выезжающие панели и всплывающие окна
      анимируют `transform`.
    links:
      - https://web.dev/articles/stick-to-compositor-only-properties-and-manage-layer-count

  - id: brw-012
    topic: Как браузер рисует
    subtopic: Конвейер отрисовки
    level: middle
    question: |
      В табличном редакторе при наведении на строку у неё появляется тень: CSS меняет `box-shadow`. Разработчик
      включил Paint flashing и видит, что при наведении строка вспыхивает зелёным. Какие этапы конвейера запускает
      это изменение?
    options:
      - text: 'Стили, отрисовку, композицию — без раскладки'
        correct: true
        why: 'Тень не меняет размеры и положение строки, поэтому раскладка не нужна. Но вид строки изменился, и её надо перерисовать.'
      - text: 'Все четыре: стили, раскладку, отрисовку, композицию'
        why: 'Раскладку запускают свойства геометрии: ширина, отступы, положение. Тень не сдвигает ни строку, ни соседей.'
      - text: 'Только композицию — так же, как у transform'
        why: 'Только композицию требуют `transform` и `opacity` у элемента со своим слоем. Тень меняет пиксели, а значит, нужна отрисовка — её и показывает зелёная вспышка.'
      - text: 'Только отрисовку — стили не пересчитываются'
        why: 'Сначала браузер должен вычислить новые стили строки: правило с `:hover` стало подходить. Без этого он не узнает, что рисовать.'
    explanation: |
      Каждое изменение запускает конвейер с того этапа, который затрагивает. Свойства вида — `color`, `background`,
      `box-shadow` — меняют пиксели, но не геометрию: стили пересчитываются, раскладка пропускается, элемент
      перерисовывается. Paint flashing во вкладке Rendering подсвечивает именно перерисовку. Одна строка — дёшево,
      а вот большая размытая тень на всю таблицу в каждом кадре анимации может стать заметной.
    links:
      - https://developer.chrome.com/docs/devtools/rendering/performance

  - id: brw-013
    topic: Как браузер рисует
    subtopic: Конвейер отрисовки
    level: middle
    question: |
      В музыкальном сервисе при загрузке плейлиста основной поток занят разбором ответа около 300 мс. В это время
      кружок-загрузчик (CSS-анимация `transform: rotate`) крутится плавно, а полоска прогресса (CSS-переход `width`)
      замирает и потом прыгает. Почему так?
    options:
      - text: 'Вращение ведёт компоновщик, а ширине нужна раскладка на основном потоке'
        correct: true
        why: 'CSS-анимацию `transform` браузер целиком передаёт компоновщику. Переход `width` требует раскладки и отрисовки в каждом кадре, а их делает занятый основной поток.'
      - text: 'Анимации `animation` браузер выполняет раньше, чем переходы `transition`'
        why: 'Дело не в виде анимации, а в свойстве. CSS-переход `transform` тоже шёл бы гладко, а `animation` по `width` замирал бы так же.'
      - text: 'Кружок меньше полоски, и браузер успевает перерисовать его между задачами'
        why: 'Размер тут ни при чём: при занятом основном потоке ни раскладка, ни отрисовка не происходят совсем. Кружок не перерисовывается, его слой просто поворачивает компоновщик.'
      - text: 'Полоску рисует видеокарта, а она в это время занята разбором ответа'
        why: 'Разбор ответа идёт на процессоре, в основном потоке. А с видеокартой работает как раз компоновщик, который и крутит кружок.'
    explanation: |
      В Chrome композицию выполняет отдельный поток — компоновщик. CSS-анимации и переходы `transform` и `opacity`
      он проигрывает сам, без основного потока. Всё, что требует стилей, раскладки или отрисовки, ждёт основной поток.
      Полоску прогресса можно сделать гладкой, анимируя `transform: scaleX()` у её заливки.
    links:
      - https://web.dev/articles/rendering-performance

  - id: brw-014
    topic: Как браузер рисует
    subtopic: Конвейер отрисовки
    level: middle
    question: |
      В фотогалерее на 400 карточек кто-то когда-то добавил всем карточкам `will-change: transform` «для скорости».
      На телефонах галерея стала прокручиваться хуже, а память вкладки выросла. При наведении карточка немного
      увеличивается. Что сделать?
    options:
      - text: 'Убрать will-change у всех и ставить его только анимируемой карточке'
        correct: true
        why: 'Каждый слой — картинка в памяти видеокарты. 400 слоёв дают лишнюю память и работу компоновщику, а анимируется одна карточка за раз.'
      - text: 'Заменить will-change на transform: translateZ(0), который работает быстрее'
        why: 'Это старый способ сделать то же самое — вынести элемент на слой. Слоёв останется 400, проблема никуда не денется.'
      - text: 'Добавить will-change ещё и родителю галереи, чтобы слои объединились'
        why: 'Слой у родителя не отменяет слоёв у карточек: их станет 401.'
      - text: 'Ничего не трогать: слои ускоряют прокрутку, рост памяти — нормальная цена'
        why: 'Для 400 картинок цена оказалась выше пользы: условие говорит, что прокрутка стала хуже. web.dev прямо советует не выносить элементы на слои без нужды.'
    explanation: |
      `will-change: transform` заранее выносит элемент на отдельный слой, чтобы анимация `transform` стартовала без
      задержки. Но слой — это текстура в памяти видеокарты, примерно ширина × высота × 4 байта, и компоновщику
      приходится управлять каждым. Поэтому `will-change` ставят точечно: на элемент, который вот-вот будет
      анимироваться, и снимают после. Число слоёв и причины их появления видны в панели Layers.
    links:
      - https://web.dev/articles/stick-to-compositor-only-properties-and-manage-layer-count

  - id: brw-015
    topic: Как браузер рисует
    subtopic: Конвейер отрисовки
    level: senior
    question: |
      На канбан-доске карточку перетаскивают пальцем: обработчик `pointermove` ставит ей `transform: translate()`.
      Пока карточку тащат, доска на каждое движение заново считает подсветку колонок — около 40 мс работы. Карточка
      заметно отстаёт от пальца. Какое рассуждение верное?
    options:
      - text: 'Код обработчика и стили всё равно на основном потоке — убрать 40 мс с каждого движения'
        correct: true
        why: '`transform`, который ставит JavaScript, требует основного потока: выполнить обработчик и пересчитать стили. Если каждое движение занято 40 мс другой работой, карточка будет отставать.'
      - text: 'transform выполняется на компоновщике, значит, тормозит не JavaScript, а сеть или сервер'
        why: 'На компоновщике идут только CSS-анимации и переходы. Значение из JavaScript ставит основной поток, а он занят подсветкой колонок; сеть здесь не участвует.'
      - text: 'Двигать карточку свойствами left и top — их браузер обновляет без задержки'
        why: '`left` и `top` добавят раскладку и отрисовку в каждом кадре — карточка станет отставать ещё сильнее.'
      - text: 'Дать will-change: transform всем карточкам доски, чтобы ускорить композицию'
        why: 'Композиция здесь не узкое место: задержка — на основном потоке. Сотни лишних слоёв только добавят памяти.'
    explanation: |
      Без основного потока работают только CSS-анимации и переходы `transform` и `opacity`: их ведёт компоновщик.
      Когда `transform` меняет JavaScript, раскладки и отрисовки нет, но код и пересчёт стилей идут на основном
      потоке. Перетаскивание за пальцем без JavaScript не сделать, поэтому лечат другое: подсветку колонок считают
      не на каждое движение, а не чаще раза в кадр и проще — например, по заранее известным границам колонок.
    links:
      - https://web.dev/articles/rendering-performance

  - id: brw-016
    topic: Как браузер рисует
    subtopic: Конвейер отрисовки
    level: senior
    question: |
      Полоску загрузки файла в облачном хранилище перевели с анимации `width` на `transform: scaleX()` — стало гладко.
      Но надпись «45 %», которая стоит внутри полоски, теперь растягивается и сжимается вместе с ней. Как сохранить
      и гладкость, и нормальный текст, не добавляя работы основному потоку в каждом кадре?
    options:
      - text: 'Масштабировать только пустую заливку, а надпись держать рядом, вне scale'
        correct: true
        why: '`scaleX` растягивает всю картинку элемента вместе с содержимым. Если масштабируется пустая заливка, а текст лежит в соседнем элементе, анимация остаётся на компоновщике, а текст не искажается.'
      - text: 'Вернуть анимацию width, но поставить полоске will-change: width заранее'
        why: '`will-change` помогает только свойствам, которые умеет компоновщик. Ширина по-прежнему требует раскладки и отрисовки в каждом кадре.'
      - text: 'Компенсировать масштаб: давать надписи обратный scaleX в каждом кадре из JavaScript'
        why: 'Текст выпрямится, но условие запрещает работу основного потока в каждом кадре, а здесь она нужна. Разделить заливку и текст проще и дешевле.'
      - text: 'Анимировать max-width полоски вместо width — оно не трогает соседей'
        why: '`max-width` — такое же свойство геометрии, как `width`: раскладка и отрисовка в каждом кадре вернутся. Компоновщику отдают только `transform` и `opacity`.'
    explanation: |
      `transform` двигает и растягивает уже нарисованную картинку слоя, поэтому настоящий размер блока не меняется:
      текст внутри растянется, соседи не подвинутся. Типовое решение — анимировать отдельный элемент-заливку, у которого
      нет содержимого, а текст и другие детали держать в элементах, которые не масштабируются. Так анимация остаётся
      дешёвой и гладкой.
    links:
      - https://web.dev/articles/stick-to-compositor-only-properties-and-manage-layer-count

  - id: brw-017
    topic: Как браузер рисует
    subtopic: Принудительная раскладка
    level: junior
    question: |
      В какой строке браузер будет вынужден посчитать раскладку немедленно, посреди выполнения кода?

      ```js
      const box = document.querySelector(".tooltip");
      box.textContent = "Скидка 15 % до пятницы";   // строка 2
      box.classList.add("visible");                 // строка 3
      const height = box.offsetHeight;              // строка 4
      box.style.top = anchorTop - height + "px";    // строка 5
      ```
    options:
      - text: 'В строке 4: чтение высоты после изменений требует свежей раскладки'
        correct: true
        why: 'Строки 2 и 3 сделали раскладку устаревшей. Чтобы ответить на `offsetHeight`, браузер должен посчитать её сразу, не дожидаясь кадра.'
      - text: 'В строке 2: изменение текста сразу пересчитывает раскладку'
        why: 'Запись только помечает раскладку устаревшей. Пересчёт случится, когда кто-то спросит о геометрии или придёт время кадра.'
      - text: 'В строке 5: запись top заставляет браузер разложить страницу'
        why: 'Это тоже запись: она снова делает раскладку устаревшей, но не считает её. Посчитают в ближайшем кадре.'
      - text: 'Ни в одной: раскладка считается в ближайшем кадре, а не посреди кода'
        why: 'Так было бы, если бы код ничего не читал. Чтение геометрии при устаревшей раскладке заставляет посчитать её немедленно.'
    explanation: |
      Браузер ленится: после изменения стилей он помечает раскладку устаревшей и пересчитывает её один раз в кадре.
      Но если код читает геометрию — `offsetHeight`, `getBoundingClientRect()`, `scrollTop`, — а раскладка устарела,
      её приходится считать прямо сейчас. Это принудительная раскладка. Одна, как здесь, — не беда: для подсказки
      это нормальный код.
    links:
      - https://gist.github.com/paulirish/5d52fb081b3570c81e3a

  - id: brw-018
    topic: Как браузер рисует
    subtopic: Принудительная раскладка
    level: middle
    question: |
      В каталоге интернет-магазина 240 карточек товаров. Чтобы в каждом ряду кнопки «В корзину» стояли на одной линии,
      скрипт выравнивает высоту блока описания:

      ```js
      const rowHeight = {};
      for (const card of cards) {
        card.desc.style.height = "auto";   // сбросить прошлую высоту
        rowHeight[card.row] = Math.max(rowHeight[card.row] ?? 0, card.desc.offsetHeight);
      }
      for (const card of cards) card.desc.style.height = rowHeight[card.row] + "px";
      ```

      Профиль показывает 240 фиолетовых блоков Layout с красными уголками. Вёрстку пока менять нельзя. Что поможет?
    options:
      - text: 'Разделить первый цикл на два: сначала сбросить высоты всем, потом прочитать все'
        correct: true
        why: 'Сейчас в первом цикле запись и чтение чередуются. Если все сбросы идут до всех чтений, раскладка считается один раз — при первом чтении. 240 пересчётов превращаются в один.'
      - text: 'Обернуть тело первого цикла в requestAnimationFrame, чтобы карточки считались в кадре'
        why: 'Все 240 колбэков выполнятся подряд перед одним кадром, и чтения с записями так же перемешаются. Пересчётов меньше не станет.'
      - text: 'Заменить offsetHeight на getBoundingClientRect().height — он работает быстрее'
        why: 'Оба способа требуют свежей раскладки. Красных уголков будет ровно столько же.'
      - text: 'Обрабатывать каждую карточку в отдельном setTimeout, чтобы не было долгой задачи'
        why: 'Каждая задача так же запишет и прочитает, и раскладка будет считаться 240 раз. Общая работа не уменьшится, а растянется на много кадров с прыгающей вёрсткой.'
    explanation: |
      Layout thrashing — чтения и записи геометрии вперемешку в цикле: каждая запись делает раскладку устаревшей,
      а следующее чтение заставляет её пересчитать. Лечат порядком: сначала все записи, которые нужны до измерения,
      потом все чтения, потом все записи. Ещё лучше — отдать выравнивание CSS: в сетке `grid` кнопку прижимают
      к низу карточки без скриптов, и читать ничего не нужно.
    links:
      - https://web.dev/articles/avoid-large-complex-layouts-and-layout-thrashing

  - id: brw-019
    topic: Как браузер рисует
    subtopic: Принудительная раскладка
    level: middle
    question: |
      В профиле медленного открытия модального окна в CRM есть фиолетовый блок Layout на 30 мс с красным уголком.
      В Summary: «Forced reflow is a likely performance bottleneck» и Function stack с `positionModal @ modal.js:58`.
      Что это значит?
    options:
      - text: 'modal.js:58 прочитал геометрию, и раскладка посчиталась прямо внутри кода'
        correct: true
        why: 'Красный уголок и «Forced reflow» означают, что раскладку заставил посчитать JavaScript, а не обычный кадр. Function stack указывает строку, которая её вызвала.'
      - text: 'Браузер посчитал раскладку в обычном кадре, а modal.js:58 просто выполнялся рядом'
        why: 'Раскладка в кадре не помечается предупреждением и не имеет стека JavaScript. Стек есть именно потому, что раскладку вызвал код.'
      - text: 'modal.js:58 пересчитал стили, а блок Layout лишь подписан его стеком'
        why: 'Пересчёт стилей — отдельный блок Recalculate Style. Предупреждение Forced reflow относится именно к раскладке, которую вызвал этот код.'
      - text: 'modal.js:58 изменил стили, и браузер посчитал раскладку в ближайшем кадре'
        why: 'Так было бы без предупреждения: запись только помечает раскладку устаревшей. «Forced reflow» значит, что строка не писала, а читала геометрию при устаревшей раскладке.'
    explanation: |
      Фиолетовым DevTools красят стили и раскладку. Красный уголок у блока Layout и предупреждение «Forced reflow»
      означают принудительную раскладку: JavaScript прочитал геометрию, когда раскладка была устаревшей. В Summary
      есть Function stack со ссылкой на строку. Дальше смотрят, что делает эта строка: часто это лишнее чтение,
      которое можно сделать раньше изменений или заменить CSS.
    links:
      - https://developer.chrome.com/docs/devtools/performance/reference

  - id: brw-020
    topic: Как браузер рисует
    subtopic: Принудительная раскладка
    level: middle
    question: |
      В торговом терминале график перерисовывается при изменении размера окна. Обработчик `resize` читает
      `container.getBoundingClientRect()` и меняет размеры холста. При перетаскивании края окна профиль показывает
      десятки принудительных раскладок в секунду. Как получать размер контейнера без них?
    options:
      - text: 'Подписаться на ResizeObserver: размер приходит уже посчитанным в кадре'
        correct: true
        why: '`ResizeObserver` вызывает колбэк в кадре, после раскладки, и передаёт готовые размеры. Читать геометрию самому не нужно.'
      - text: 'Читать clientWidth вместо getBoundingClientRect — ему раскладка не нужна'
        why: '`clientWidth` — тоже геометрия и при устаревшей раскладке так же заставляет её посчитать.'
      - text: 'Читать размер в setInterval раз в 100 мс вместо обработчика resize'
        why: 'Раскладок станет меньше, но каждая по-прежнему принудительная, а график будет отставать от окна и опрашивать размер даже без изменений.'
      - text: 'Брать размер окна из window.innerWidth и вычислять ширину контейнера формулой'
        why: 'Это хрупко: формула разъедется с вёрсткой при любом изменении отступов, сайдбаров или шрифтов.'
    explanation: |
      `ResizeObserver` придуман для этой задачи: он следит за размером элемента — не только окна — и вызывает колбэк
      в кадре, когда раскладка уже посчитана, передавая готовые размеры. Принудительной раскладки нет, и колбэк
      вызывается только при настоящем изменении размера. Перерисовку графика при этом всё равно стоит ограничить
      частотой кадров.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/ResizeObserver

  - id: brw-021
    topic: Как браузер рисует
    subtopic: Принудительная раскладка
    level: senior
    question: |
      Страница справочника по API — одна длинная статья из 300 разделов с таблицами и примерами кода. Открывается
      медленно: в профиле первая раскладка занимает 900 мс. Читателям важно искать по странице через Ctrl+F
      и переходить по якорям на любой раздел. Что предпочтительнее при этих ограничениях?
    options:
      - text: 'content-visibility: auto у разделов — невидимые не раскладываются'
        correct: true
        why: 'Браузер пропускает раскладку и отрисовку разделов за пределами экрана, но их текст остаётся доступен поиску по странице, якорям и экранным чтецам.'
      - text: 'Виртуализация: держать в DOM только разделы, которые сейчас на экране'
        why: 'Раскладка станет дешёвой, но Ctrl+F не найдёт текст разделов, которых нет в DOM, а переход по якорю на невидимый раздел потребует своей логики.'
      - text: 'display: none у разделов за экраном и включать их при прокрутке до них'
        why: 'Скрытое через `display: none` поиск по странице не находит, и якорь на такой раздел не сработает.'
      - text: 'will-change: transform на всех разделах, чтобы каждый получил свой слой'
        why: 'Слои ускоряют композицию, а время уходит на раскладку. 300 слоёв добавят только памяти.'
    explanation: |
      `content-visibility: auto` включает сдерживание раскладки, стиля и отрисовки и пропускает содержимое элемента,
      пока он не нужен на экране. В отличие от скрытия и виртуализации, текст остаётся в документе: его находит поиск,
      к нему ведут якоря, его читает экранный чтец. Нужен `contain-intrinsic-size: auto <примерная высота>`, иначе
      невидимые разделы схлопнутся и полоса прокрутки будет прыгать. Поддерживается всеми основными браузерами
      с сентября 2024 года.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/content-visibility

  - id: brw-022
    topic: Как браузер рисует
    subtopic: Принудительная раскладка
    level: senior
    question: |
      В трекере задач при открытии выпадающего меню код вставляет меню, читает его `getBoundingClientRect()` и решает,
      открыть его вниз или вверх. Профиль открытия: одна принудительная раскладка на 0,4 мс, вся задача — 6 мс.
      Коллега предлагает переписать позиционирование, чтобы «убрать forced reflow». Как поступить?
    options:
      - text: 'Оставить как есть: одна раскладка на 0,4 мс — нормальная цена за точное положение'
        correct: true
        why: 'Плоха не принудительная раскладка сама по себе, а её повторение в цикле. Одно чтение после вставки — одна раскладка, которую браузер иначе сделал бы в кадре.'
      - text: 'Переписать на ResizeObserver, чтобы ни одной принудительной раскладки не осталось'
        why: 'Размер придёт только к кадру, и меню успеет показаться не в том месте. Усложнение ради 0,4 мс, которых человек не заметит.'
      - text: 'Перенести расчёт положения меню в Web Worker, чтобы не занимать поток'
        why: 'В воркере нет доступа к DOM и раскладке: размер меню там не узнать.'
      - text: 'Читать размер меню до его вставки в документ, чтобы не было раскладки'
        why: 'У элемента вне документа нет раскладки, его размеры равны нулю. Положение посчитается неверно.'
    explanation: |
      Принудительная раскладка — не грех, а инструмент. Одно чтение геометрии после изменений стоит одной раскладки,
      которую браузер всё равно сделал бы в кадре. Проблема — layout thrashing, когда чтения и записи чередуются
      и раскладка считается сотни раз. Здесь задача короткая, человек ничего не заметит, и правильное решение —
      ничего не трогать.
    links:
      - https://gist.github.com/paulirish/5d52fb081b3570c81e3a

