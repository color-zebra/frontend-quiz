  - id: brw-073
    topic: Итог
    subtopic: Разбор дашборда
    level: senior
    question: |
      В CRM нашли причину: каждый раз, когда открывают карточку сделки, компонент запускает `setInterval` для обновления
      статуса, а при закрытии карточки его не останавливает. Таймер держит компонент со всем его DOM. Какое исправление
      лечит причину?
    options:
      - text: 'Останавливать таймер при закрытии карточки через clearInterval'
        correct: true
        why: 'Таймер — корень для сборщика: пока он жив, жив и компонент. Остановка таймера при удалении убирает и лишнюю работу, и удержание памяти.'
      - text: 'Увеличить интервал обновления статуса сделки с 10 до 60 секунд'
        why: 'Таймеры по-прежнему будут множиться и держать компоненты — просто медленнее начнёт тормозить.'
      - text: 'Перенести обновление статуса сделок в отдельный Web Worker'
        why: 'Основному потоку станет легче, но воркер будет копить те же вечные интервалы, а компоненты в памяти останутся.'
      - text: 'Заменить setInterval на рекурсивный setTimeout в компоненте'
        why: 'Если цепочку не останавливать при закрытии, она живёт так же вечно, как интервал. Меняется форма, а не причина.'
    explanation: |
      Таймеры, обработчики, подписки и наблюдатели компонента останавливают, когда компонент удаляют. Иначе они
      продолжают работать и держат через замыкание всё, что компонент создал. Удобный способ — собрать уборку в одном
      месте: метод `destroy`, функция очистки эффекта во фреймворке или `AbortController` для подписок. Дополнительно
      невидимое не обновляют вовсе.
    links:
      - https://developer.mozilla.org/ru/docs/Web/JavaScript/Guide/Memory_management

