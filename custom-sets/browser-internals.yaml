  - id: brw-067
    topic: Данные пользователей
    subtopic: Скорость у реальных людей
    level: middle
    question: |
      В конструкторе сайтов построение превью страницы обёрнуто в `performance.mark("preview-start")`
      и `performance.measure("preview", "preview-start")`. Что это даёт команде?
    options:
      - text: 'Отметку видно в профиле на дорожке Timings, и её можно собирать у людей'
        correct: true
        why: 'User Timing — свои отметки. В лаборатории они рисуются в записи Performance, а в поле приходят записями типа `measure`, и одна метрика связывает оба мира.'
      - text: 'Браузер начинает выполнять код между отметками с повышенным приоритетом'
        why: 'Отметки ничего не меняют в выполнении: это только замер времени.'
      - text: 'Код между отметками автоматически попадает в записи Long Animation Frames'
        why: 'LoAF записывает долгие кадры независимо от отметок. Отметка помогает найти нужный момент в данных, но не создаёт записей LoAF.'
      - text: 'Отметки отправляются в Chrome UX Report как дополнительная метрика сайта'
        why: 'CrUX собирает только свои стандартные метрики. Отметки User Timing вы отправляете сами.'
    explanation: |
      User Timing — `performance.mark` и `performance.measure` — меряет то, что важно продукту, а не браузеру:
      «превью готово», «отчёт построен». Отметки видны в записи Performance на дорожке Timings, а в браузерах людей
      их получают через `PerformanceObserver` с типом `measure` и отправляют вместе с другими метриками.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Performance/measure

  - id: brw-068
    topic: Данные пользователей
    subtopic: Скорость у реальных людей
    level: senior
    question: |
      Новостной сайт отправляет INP с атрибуцией web-vitals. Аналитик замечает: у пользователей Chrome почти
      у каждого медленного взаимодействия есть список виноватых скриптов, а у пользователей Safari и Firefox
      этот список всегда пустой. Он делает вывод, что в Safari и Firefox скрипты сайта не тормозят. Что не так?
    options:
      - text: 'Пустой список значит, что браузер не поддерживает LoAF, а не что долгих кадров не было'
        correct: true
        why: 'Список скриптов берётся из Long Animation Frames, а этот API есть только в браузерах на Chromium, например в Chrome. В других браузерах атрибуции скриптов просто нет.'
      - text: 'Ничего: в Safari и Firefox JavaScript выполняется в отдельном потоке и не мешает кадрам'
        why: 'Во всех браузерах JavaScript страницы выполняется на основном потоке. Задержки там тоже бывают.'
      - text: 'Нужно включить в web-vitals режим совместимости, и список появится'
        why: 'Такого режима нет: библиотека не может получить данные, которые браузер не отдаёт.'
      - text: 'Вывод верен, если INP в Safari и Firefox тоже хороший'
        why: 'Хороший INP — отдельный факт, его и надо смотреть. Пустой список скриптов сам по себе ничего не доказывает.'
    explanation: |
      Атрибуция зависит от того, что умеет браузер. Event Timing есть во всех основных браузерах, поэтому три части
      задержки видны везде. Long Animation Frames — только в браузерах на Chromium, поэтому список скриптов будет только у его
      пользователей. Разбирая данные, сравнивают метрики по браузерам, а причины ищут там, где атрибуция есть,
      и проверяют в лаборатории.
    links:
      - https://developer.chrome.com/docs/web-platform/long-animation-frames

  - id: brw-069
    topic: Данные пользователей
    subtopic: Скорость у реальных людей
    level: senior
    question: |
      В CRM атрибуция показывает: медленный поиск по клиентам — `processingDuration` около 700 мс — почти всегда
      у менеджеров крупных филиалов, где по 30 000 клиентов. Разработчик на тестовом стенде со 300 клиентами
      и замедлением процессора 4× видит 40 мс. Как воспроизвести проблему?
    options:
      - text: 'Загрузить на стенд объём данных крупного филиала и повторить замер'
        correct: true
        why: 'Атрибуция прямо указывает на зависимость от объёма. Если работа растёт с числом клиентов быстрее, чем линейно, 300 записей проблему спрячут при любом процессоре.'
      - text: 'Включить замедление процессора 20× вместо 4× и повторить замер'
        why: 'Это растянет 40 мс до двухсот, но не воспроизведёт настоящую причину: работа зависит от объёма данных, а не только от процессора.'
      - text: 'Включить ещё и замедление сети Slow 4G и повторить замер'
        why: 'Обработка — работа на основном потоке после того, как данные уже есть. Сеть на неё не влияет.'
      - text: 'Считать, что у менеджеров медленные компьютеры, и закрыть задачу'
        why: 'Атрибуция связывает задержку с размером филиала, а не с устройством. Это проблема кода, а не железа.'
    explanation: |
      Данные людей подсказывают, какие условия нужно воспроизвести. Это не только слабое железо и сеть, но и данные:
      размеры списков, «тяжёлые» аккаунты, длинные истории. Особенно опасны алгоритмы, где работа растёт как квадрат
      объёма: на тестовых данных они незаметны. После починки проверяют в лаборатории на реальных объёмах и подтверждают
      данными людей.
    links:
      - https://github.com/GoogleChrome/web-vitals

