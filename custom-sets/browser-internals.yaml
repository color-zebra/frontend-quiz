  - id: brw-023
    topic: 'Скорость: найти и починить'
    subtopic: Вкладка Performance
    level: junior
    question: |
      На новостном сайте кнопка «Показать комментарии» отвечает с задержкой. В записи Performance под нажатием —
      долгая задача на 400 мс. Summary для неё: Scripting 370 мс, Rendering 20 мс, Painting 4 мс. Что это говорит
      о причине?
    options:
      - text: 'Почти всё время уходит на выполнение JavaScript'
        correct: true
        why: 'Scripting — категория выполнения, разбора и компиляции JavaScript. 370 мс из 400 — значит, искать надо в коде обработчика и том, что он вызывает.'
      - text: 'Почти всё время уходит на пересчёт стилей и раскладку'
        why: 'Стили и раскладка — категория Rendering, а её здесь всего 20 мс.'
      - text: 'Почти всё время уходит на отрисовку пикселей'
        why: 'Отрисовка — категория Painting: 4 мс. Она здесь почти ничего не стоит.'
      - text: 'Почти всё время уходит на ожидание ответа сервера'
        why: 'Ожидание сети не занимает основной поток и в Summary не попадает: запросы видны на дорожке Network.'
    explanation: |
      Summary раскладывает работу основного потока на категории: Scripting — JavaScript, Rendering — стили
      и раскладка, Painting — отрисовка, Loading — загрузка и разбор HTML. С этого начинают: если почти всё —
      Scripting, смотрят функции в Bottom-up; если Rendering — вёрстку и чтение геометрии. По цвету блоков функций
      категорию не определить: Chrome красит их своим цветом для каждого файла.
    links:
      - https://developer.chrome.com/docs/devtools/performance/reference

  - id: brw-024
    topic: 'Скорость: найти и починить'
    subtopic: Вкладка Performance
    level: middle
    question: |
      В записи открытия ленты фотографий Bottom-up показывает: `renderFeed` — total time 610 мс, self time 4 мс;
      `formatDate` — total time 430 мс, self time 425 мс; `renderCard` — total time 590 мс, self time 30 мс.
      С какой функции начать разбираться?
    options:
      - text: 'С formatDate: у неё почти всё время собственное'
        correct: true
        why: 'Собственное время — работа самой функции. 425 мс внутри formatDate — это и есть место, где процессор горит.'
      - text: 'С renderFeed: у неё больше всех полное время'
        why: 'Полное время у верхней функции всегда большое — в него входят все вызванные. Сама renderFeed работает 4 мс.'
      - text: 'С renderCard: она вызывается для каждой карточки'
        why: 'Полное время у неё большое, потому что она вызывает formatDate. Собственных 30 мс мало по сравнению с 425.'
      - text: 'Со всех трёх одинаково: время делится между ними'
        why: 'Время не делится поровну: полное время вложенных функций повторяется в родителях. Важно собственное время.'
    explanation: |
      Полное время (total) включает всё, что функция вызвала, собственное (self) — только её код. Верхние функции
      всегда выглядят дорогими по полному времени, хотя сами почти ничего не делают. Вкладка Bottom-up сортирует
      по собственному времени и сразу показывает, где работа делается на самом деле. Раскрыв строку formatDate,
      можно увидеть, кто её вызывает и сколько раз.
    links:
      - https://developer.chrome.com/docs/devtools/performance/reference

  - id: brw-077
    topic: 'Скорость: найти и починить'
    subtopic: Вкладка Performance
    level: middle
    question: |
      Система складского учёта при открытии сама загружает накладные, проверяет остатки и строит поиск по товарам.
      В записи открытия функция `parseRow` съедает 300 мс собственного времени, а вызывают её все три части: загрузка
      накладных, проверка остатков и построение поиска. Как узнать, через какую из них ушло больше всего времени?
    options:
      - text: 'В Bottom-up раскрыть строку parseRow и посмотреть, кто её вызывал'
        correct: true
        why: 'Bottom-up идёт от дорогой функции вверх: раскрытая строка показывает, через какие вызовы к ней пришли и сколько времени пришлось на каждый путь.'
      - text: 'В Event log отсортировать все события записи по длительности'
        why: 'Event log — хронологический список событий. Он покажет длинные события, но не соберёт, откуда вызывали parseRow.'
      - text: 'В Summary выбрать всю запись и сравнить доли Scripting и Rendering'
        why: 'Summary покажет, что время уходит на JavaScript, но не разложит его по путям вызова.'
      - text: 'В Network найти запрос, после которого начинается parseRow'
        why: 'Сеть подскажет, когда пришли данные, но не какой код их разбирает и откуда он вызван.'
    explanation: |
      Bottom-up начинает с функций, где тратится собственное время, и при раскрытии показывает, кто их вызывал.
      Call tree идёт в обратную сторону — от задачи вниз по вызовам. Если дорогая функция вызывается из нескольких
      мест, Bottom-up быстрее всего ответит, какой путь вызовов виноват.
    links:
      - https://developer.chrome.com/docs/devtools/performance/reference

  - id: brw-026
    topic: 'Скорость: найти и починить'
    subtopic: Вкладка Performance
    level: middle
    question: |
      В записи импорта контактов Bottom-up показывает у `validateEmail` 200 мс собственного времени. Но на пламенном
      графике разработчик её почти не видит: только редкие узкие блоки. Почему так бывает?
    options:
      - text: 'Её вызывают тысячи раз по доле миллисекунды, а Bottom-up всё суммирует'
        correct: true
        why: 'На пламенном графике каждый вызов — отдельный блок, и короткие почти не видны или не попали в выборку. Bottom-up складывает время всех вызовов вместе.'
      - text: 'Bottom-up считает время с замедлением процессора, а пламенный график — без'
        why: 'Обе вкладки показывают одну и ту же запись в одних и тех же условиях. Разница — в том, что одна суммирует, а другая рисует каждый вызов.'
      - text: 'validateEmail выполняется в Web Worker, и в Main её не видно'
        why: 'Код воркера показывается на своей дорожке и в Bottom-up основного потока не попал бы. Здесь функция работает в основном потоке.'
      - text: 'Пламенный график показывает только функции, которые дольше 50 мс'
        why: 'Порог 50 мс относится к долгим задачам. Пламенный график показывает функции любой длины, если они попали в выборку.'
    explanation: |
      Профилировщик выборочный: много раз в миллисекунду записывает, какая функция выполняется. Долгий вызов даёт
      широкий блок, а тысячи коротких вызовов — тысячи узких полосок, многие из которых не видны. Bottom-up и Call
      tree суммируют время по функции и показывают её настоящий вклад. Поэтому искать дорогое удобнее по таблицам,
      а пламенный график смотреть для порядка событий.
    links:
      - https://developer.chrome.com/docs/devtools/performance

  - id: brw-027
