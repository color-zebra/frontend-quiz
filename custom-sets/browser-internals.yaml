        why: 'Справочник законно создаётся один раз и живёт дальше. Если прогреть страницу, он попадёт в первый снимок, а в сравнении останется только то, что копится с каждым открытием.'
      - text: 'Чтобы сборщик мусора успел перейти в режим старого поколения'
        why: 'Сборщик сам решает, когда собирать поколения, а перед снимком браузер запускает сборку принудительно. Прогрев нужен не ему.'
      - text: 'Чтобы DevTools успели загрузить исходники и показать имена классов'
        why: 'Имена классов берутся из самих объектов в памяти. Прогрев нужен, чтобы отделить разовое от повторяющегося.'
      - text: 'Чтобы снимок кучи получился меньше и открылся в DevTools быстрее'
        why: 'Прогрев снимок не уменьшает — наоборот, справочник в него попадёт. Смысл в чистоте сравнения.'
