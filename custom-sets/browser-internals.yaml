      Objects allocated between Snapshot 1 and Snapshot 2 показывает объекты из первой серии, которые пережили вторую.
      Разовые кэши создаются при прогреве и в этот список не попадают, а повторяющаяся утечка — попадает.
    links:
      - https://developer.chrome.com/docs/devtools/memory-problems/heap-snapshots

  - id: brw-075
    topic: Память
    subtopic: Поиск утечек
    level: senior
    question: |
      В ленте соцсети при быстрой прокрутке видны паузы. Утечки нет: после сборки мусора память возвращается
      к исходной. Но график JS heap в записи Performance — частая пила, и блоков Minor GC много. Как в Chrome найти,
      какой код создаёт так много временных объектов?
    options:
      - text: 'Записать Allocations on timeline со стеками: большой Count, малый Live count'
        correct: true
        why: 'Вид Allocation этой записи считает для каждой функции и все созданные объекты, и ещё живые. Много созданных и почти ни одного живого — это и есть источник мусора.'
      - text: 'Снять два снимка кучи и в Comparison найти, каких объектов прибавилось'
        why: 'Снимок делается после сборки мусора, и временные объекты в него не попадут. Comparison покажет почти пустую разницу.'
      - text: 'Записать Allocation sampling и смотреть функции в виде Heavy'
        why: 'В Chrome этот профиль показывает функции, создавшие объекты, которые ещё живы к концу записи. Временные объекты к тому моменту уже собраны.'
      - text: 'Записать профиль Detached elements и найти узлы, которые лента не отпустила'
        why: 'Отсоединённые узлы — про удержание, а здесь память возвращается. Вопрос в том, кто создаёт много мусора.'
    explanation: |
      Утечка и «много мусора» — разные болезни. Утечку ищут снимками и Retainers: кто держит. Частые сборки мусора
      замечают по пиле на графике памяти, а виновные функции находят записью Allocations on timeline с галочкой
      Allocation stack traces: её вид Allocation показывает Count — сколько функция создала всего — и Live count —
      сколько из этого живо. Типичные находки — новые массивы и объекты на каждое событие прокрутки, склейка строк
      в цикле, лишние копии данных.
    links:
      - https://developer.chrome.com/docs/devtools/memory-problems

  - id: brw-052
    topic: Память
    subtopic: Поиск утечек
    level: senior
    question: |
      Разработчик видеоплатформы искал утечку плеера: по ходу дела выводил в консоль объекты `player` и смотрел их.
      В снимке кучи старые плееры живы, но цепочки удержания ведут к консоли, а не к коду приложения. Как не принять
