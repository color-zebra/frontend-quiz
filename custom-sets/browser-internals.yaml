    question: |
      В CRM импорт обрабатывает в цикле 5000 контактов, и у одного из них — с id 48213 — телефон сохраняется
      неправильно. Разработчик хочет посмотреть все переменные в момент обработки именно этого контакта и пройти
      по шагам. Что поставить?
    options:
      - text: 'Условную точку останова: contact.id === 48213'
