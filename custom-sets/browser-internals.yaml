  - id: brw-058
    topic: Отладка
    subtopic: Логи и точки останова
    level: junior
    question: |
      В онлайн-кинотеатре у кнопки «Смотреть» иногда сам собой появляется класс `disabled`, и она перестаёт
      нажиматься. Кто его ставит — неизвестно: проект большой. Какая точка останова найдёт виновника быстрее всего?
    options:
      - text: 'В Elements: Break on → Attribute modifications'
        correct: true
        why: 'Отладчик остановится в момент изменения атрибута class — прямо в коде, который его меняет, где бы этот код ни лежал.'
      - text: 'В Elements на кнопке: Break on → Node removal'
        why: 'Эта точка сработает, когда кнопку удалят из документа. Здесь кнопка остаётся, меняется её атрибут.'
      - text: 'XHR/fetch Breakpoints со строкой «disabled» в адресе'
        why: 'Точка на запросы срабатывает по адресу запроса. Класс ставит код на странице, а не адрес запроса.'
      - text: 'Event Listener Breakpoints → Mouse → click на странице'
        why: 'Остановит в обработчиках клика. Но класс появляется сам, без клика, — эта точка его не поймает.'
    explanation: |
      Точки останова на изменение DOM ставят в Elements: правый клик по узлу → Break on. Subtree modifications —
      изменились дети, Attribute modifications — атрибуты, Node removal — узел удалили. Они отвечают на вопрос «кто
      это сделал?», когда неизвестно, куда ставить лог. Асинхронный стек в Call Stack покажет и то, что этот код
      запустило.
    links:
      - https://developer.chrome.com/docs/devtools/javascript/breakpoints

  - id: brw-059
    topic: Отладка
    subtopic: Логи и точки останова
    level: middle
    question: |
      На онлайн-доске при перетаскивании стикера он иногда «прыгает» на 20 пикселей в сторону. Обработчик `pointermove`
      срабатывает десятки раз в секунду, и прыжок случается на случайном шаге. Как отлаживать?
    options:
      - text: 'Точкой логирования выводить координаты и время каждого события pointermove'
        correct: true
        why: 'Лог не останавливает жест и показывает историю: какие координаты пришли перед прыжком. Точка логирования не требует правки кода.'
      - text: 'Точкой останова на строке в обработчике pointermove и шагать по событиям'
        why: 'Остановка на первом же событии оборвёт перетаскивание: пока вы смотрите в отладчик, жеста уже нет. До прыжка дело не дойдёт.'
      - text: 'Event Listener Breakpoints → Pointer → pointermove на всей доске'
        why: 'Это та же остановка на каждом событии, только во всех обработчиках сразу. Жест сломается так же.'
      - text: 'Pause on uncaught exceptions — прыжок наверняка вызван ошибкой'
        why: 'Ни из чего не следует, что есть исключение. Скорее всего, неверно считается координата, и это видно только по истории значений.'
    explanation: |
      Частые события и жесты — случай, где логи лучше точек останова: остановка ломает сам сценарий, а ошибка видна
      только в последовательности значений. Точка логирования (правый клик по номеру строки → Add logpoint) выводит
      выражение в консоль, не останавливая код и не требуя правки и пересборки. Когда по логу станет ясно, на каком
      шаге ломается, можно поставить условную точку останова на этот случай.
    links:
      - https://developer.chrome.com/docs/devtools/javascript/breakpoints

  - id: brw-060
    topic: Отладка
    subtopic: Логи и точки останова
    level: middle
    question: |
      В интернет-банке кнопка «Скачать выписку» иногда ничего не делает: ни файла, ни ошибок в консоли, ни упавших
      запросов. В коде скачивания есть `try { … } catch (e) {}`. Как найти, что ломается?
    options:
      - text: 'Включить «Pause on caught exceptions» и нажать кнопку снова'
        correct: true
        why: 'Отладчик остановится на исключении, даже если его потом поймает пустой catch. Будет видно и строку, и ошибку, и значения переменных.'
      - text: 'Включить «Pause on uncaught exceptions» и нажать кнопку снова'
        why: 'Ошибку ловит catch, значит, она не «непойманная». Эта галочка её пропустит.'
      - text: 'Поставить XHR/fetch Breakpoint на адрес запроса выписки'
        why: 'Запросы проходят без ошибок. Если исключение до запроса или после ответа, точка на запросе его не покажет.'
      - text: 'Посмотреть в консоли все сообщения с фильтром уровня Errors'
        why: 'Пустой catch не пишет в консоль ничего — там пусто, поэтому загадка и возникла.'
    explanation: |
      Проглоченные исключения — пустой `catch` или промис без обработки — не оставляют следов в логах. Pause on caught
      exceptions останавливает отладчик на любом выброшенном исключении, в том числе пойманном. Найдя причину, стоит
      починить и `catch`: показать человеку, что скачать не удалось, и отправить ошибку в мониторинг.
    links:
      - https://developer.chrome.com/docs/devtools/javascript/breakpoints

  - id: brw-061
    topic: Отладка
    subtopic: Логи и точки останова
    level: middle
    question: |
      В приложении на Angular разработчик остановился в своём обработчике отправки формы. Call Stack — сорок кадров,
      из них тридцать пять из кода фреймворка и библиотек в `node_modules`, и при пошаговом выполнении он то и дело
      проваливается в них. Что поможет?
    options:
      - text: 'Включить список игнорирования для кадров node_modules'
        correct: true
        why: 'Список игнорирования прячет кадры библиотек в Call Stack и в стеках ошибок и не даёт шагать внутрь них. node_modules в нём по умолчанию, Angular CLI с 14.1 помечает свои файлы сам.'
      - text: 'Отключить source maps, чтобы весь фреймворк показывался одним файлом'
        why: 'Без карт исходников пропадёт и ваш код — останется собранный бандл. Кадров фреймворка меньше не станет.'
      - text: 'Заменить точку останова на console.trace() в обработчике отправки формы'
        why: 'console.trace выведет тот же стек со всеми кадрами фреймворка — разве что без пошагового выполнения.'
      - text: 'Включить «Pause on caught exceptions», чтобы отладчик пропускал чужой код'
        why: 'Эта галочка останавливает на исключениях и чужой код не скрывает — наоборот, может добавить остановок внутри фреймворка.'
    explanation: |
      Список игнорирования (ignore list) — файлы, которые отладчик не показывает и через которые не шагает: кадры
      прячутся в Call Stack и в стеках консоли. По умолчанию туда входит `/node_modules/`, а сборщики и фреймворки
      могут помечать свои файлы полем `ignoreList` в картах исходников. Свои правила добавляют в Settings → Ignore list.
    links:
      - https://developer.chrome.com/docs/devtools/settings/ignore-list

  - id: brw-062
    topic: Отладка
    subtopic: Логи и точки останова
    level: senior
    question: |
      В планировщике поездок разработчик ищет, почему у маршрута неверная сумма. Он пишет `console.log(trip)` сразу
      после добавления отеля, а через пару секунд раскрывает объект в консоли: там уже скидка за пакет, которая
      по логике ещё не должна была примениться. Он делает вывод, что скидка считается раньше времени. Что не так
      с выводом?
    options:
      - text: 'Раскрытый объект показывает состояние на момент раскрытия, а не вызова console.log'
        correct: true
        why: 'console.log выводит ссылку на объект. При первом раскрытии Chrome читает его в этот момент, а скидку могли применить уже после лога. Копия через structuredClone фиксирует состояние в момент вывода.'
      - text: 'Ничего: консоль сохраняет точный снимок объекта на момент вызова console.log'
        why: 'Снимок сохраняется только для строки-превью. Содержимое раскрытого объекта читается в момент раскрытия, рядом есть значок «i» с подсказкой.'
      - text: 'Лог попадает в консоль асинхронно и отстаёт от кода'
        why: 'Сообщение появляется сразу. Дело не в задержке вывода, а в том, что раскрывается живой объект.'
      - text: 'Нужно было использовать console.table — он показывает состояние на момент вызова'
        why: 'console.table — способ показать массив таблицей, а не средство от живых ссылок. Главное — вывести копию данных.'
    explanation: |
      `console.log(obj)` выводит ссылку на объект. Строка-превью отражает момент вызова, но раскрытое содержимое Chrome
      читает в момент раскрытия, и если объект успели изменить, вы увидите новое состояние. Это частая ловушка отладки
      логами. Если важен момент, выводят копию — `structuredClone(obj)`, `JSON.stringify(obj)` — или нужные поля,
      либо ставят точку останова и смотрят значения в Scope.
    links:
      - https://developer.chrome.com/docs/devtools/console/utilities

