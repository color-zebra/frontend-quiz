  - id: brw-032
    topic: 'Скорость: найти и починить'
    subtopic: Медленные взаимодействия
    level: middle
    question: |
      В интернет-магазине обработчик кнопки «В избранное» сначала красит сердечко, потом синхронно отправляет
      аналитику и пересчитывает блок рекомендаций — всего 250 мс. Сердечко краснеет только через четверть секунды.
      Рекомендации нужны, но не мгновенно. Как поправить обработчик?
    options:
      - text: 'Покрасить сердечко, уступить браузеру задачей (scheduler.yield), потом остальное'
        correct: true
        why: 'Кадр с красным сердечком нарисуется сразу, и взаимодействие на нём закончится. Аналитика и рекомендации выполнятся в следующих задачах.'
      - text: 'Покрасить сердечко, сделать await Promise.resolve(), потом остальное'
        why: 'Продолжение после `await` — микрозадача, и кадр между ней и покраской не нарисуется. Сердечко по-прежнему покраснеет через 250 мс.'
      - text: 'Перенести покраску сердечка в самый конец обработчика, после пересчёта рекомендаций'
        why: 'Порядок внутри одной задачи ничего не меняет: кадр всё равно будет после всей задачи, то есть через 250 мс.'
      - text: 'Поставить покраску сердечка в requestAnimationFrame, остальное оставить как есть'
        why: 'Колбэк выполнится перед ближайшим кадром, но кадр не наступит, пока не закончится обработчик со всеми 250 мс работы.'
    explanation: |
      INP заканчивается на кадре, в котором видна реакция на нажатие. Поэтому обязательную, но не срочную работу
      отделяют от визуального отклика: обновили интерфейс — уступили браузеру задачей (`scheduler.yield()`
      или `setTimeout`) — доделали остальное. Уступка через микрозадачу не работает: кадр между микрозадачами
      не рисуется.
    links:
      - https://web.dev/articles/optimize-inp

  - id: brw-033
    topic: 'Скорость: найти и починить'
    subtopic: Медленные взаимодействия
    level: senior
    question: |
      На сайте онлайн-школы INP у части уроков плохой. В записях все обработчики быстрые, показ короткий, а ожидание
      ввода — 150–300 мс. Каждые несколько секунд на основном потоке идёт долгая задача виджета чата поддержки
      с чужого домена. Чат открывают меньше 2 % учеников. Что предпочтительнее?
    options:
      - text: 'Загружать виджет чата только по нажатию кнопки «Поддержка»'
        correct: true
        why: 'Ожидание создаёт чужой скрипт, который работает у всех, хотя нужен двум процентам. Если не загружать его заранее, долгих задач в момент нажатий не будет.'
      - text: 'Переписать обработчики на страницах уроков, чтобы они выполнялись быстрее'
        why: 'Обработчики уже быстрые. Большая часть задержки — ожидание, пока закончится задача виджета.'
      - text: 'Обернуть обработчики уроков в debounce, чтобы реже попадать на виджет'
        why: 'Debounce добавит задержку к каждому нажатию и не уберёт долгие задачи виджета.'
      - text: 'Разбить обработчики уроков на части через scheduler.yield()'
        why: 'Обработчики и так короткие. Ожидание создаёт чужая задача виджета, и разбиение своего кода её не уберёт.'
    explanation: |
      Большое ожидание ввода значит, что поток занят в момент нажатия. Частые виновники — чужие скрипты: виджеты,
      аналитика, реклама. Таблица «1st / 3rd party» в записи Performance показывает их долю. Лучшее лечение —
      не выполнять чужой код, пока он не нужен: загружать по требованию, позже или реже. Если без виджета нельзя,
      договариваются с его владельцем.
    links:
      - https://web.dev/articles/optimize-inp

  - id: brw-034
    topic: 'Скорость: найти и починить'
    subtopic: Медленные взаимодействия
    level: senior
    question: |
      В справочнике лекарств поиск по мере ввода сделан с debounce 300 мс: через 300 мс после последней буквы
      фильтр перебирает список и рисует результаты — 350 мс работы. INP плохой, и в записях самые медленные
      взаимодействия — нажатия клавиш с ожиданием ввода около 300 мс. Почему debounce не спас?
    options:
      - text: 'Отрисовка результатов — долгая задача, и буква в это время ждёт её конца'
        correct: true
        why: 'Debounce уменьшил число запусков, но каждый запуск по-прежнему 350 мс. Человек продолжает печатать, и следующее нажатие клавиши ждёт, пока задача закончится.'
      - text: 'Debounce сам по себе добавляет 300 мс к каждому нажатию клавиши в поле'
        why: 'Задержка debounce — пауза перед запуском поиска, но обработчик нажатия отрабатывает сразу. INP меряет от нажатия до кадра с буквой в поле.'
      - text: 'INP считает все отложенные задачи частью взаимодействия, которое их запустило'
        why: 'INP заканчивается на ближайшем кадре после обработчиков. Отложенная задача портит не своё, а следующее взаимодействие — через ожидание.'
      - text: 'Таймер debounce выполняется с наивысшим приоритетом и вытесняет ввод'
        why: 'Таймеры не вытесняют ввод — обычно браузер даже предпочитает ввод. Беда в длине задачи, которая уже началась.'
    explanation: |
      Debounce и throttle отвечают на вопрос «как часто», а не «как долго». Если один запуск поиска — долгая задача,
      она рано или поздно совпадёт со следующим нажатием, и это нажатие получит большое ожидание. Лечат длину
      запуска: сокращают работу, рисуют меньше результатов, разбивают на части или переносят фильтрацию в воркер.
    links:
      - https://web.dev/articles/optimize-inp

