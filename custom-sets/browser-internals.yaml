      - text: 'Обычную точку останова и нажимать «продолжить» до нужного'
        why: 'До 48213-го контакта могут быть тысячи остановок. Работает, но это часы вместо секунд.'
      - text: 'Точку логирования, выводящую contact для каждой итерации'
        why: 'Лог покажет данные, но не даст пройти по шагам и посмотреть все переменные. Здесь нужна именно остановка в одном месте.'
      - text: 'Event Listener Breakpoints → Script → Script First Statement'
        why: 'Остановит на первой строке каждого скрипта при загрузке. К циклу импорта это не приближает.'
    explanation: |
      Условная точка останова (правый клик по номеру строки → Add conditional breakpoint) останавливает код, только
      если выражение истинно. Это лучший инструмент, когда ошибка проявляется в одном случае из тысяч и нужно всё
      состояние в этот момент: Scope, Call Stack, пошаговое выполнение. Точка логирования хороша для истории,
      условная точка — для одного точного момента.
    links:
      - https://developer.chrome.com/docs/devtools/javascript/breakpoints

