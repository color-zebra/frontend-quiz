        why: '`processingStart − startTime` = 180 мс: всё это время обработчик ждал, пока освободится поток. Обработка — 50 мс, показ — около 74.'
      - text: 'Обработка — 230 мс'
        why: 'Обработка — `processingEnd − processingStart`, то есть 50 мс. 230 — это время от действия до конца обработчиков.'
      - text: 'Показ результата — 304 мс'
        why: '304 мс — вся задержка, `duration`. Показ — только остаток после обработчиков: 1304 − 1230 = 74 мс.'
      - text: 'Все три части примерно равны'
        why: 'Части легко посчитать из полей: 180, 50 и 74 мс. Ожидание явно больше остальных.'
    explanation: |
      Из записи Event Timing три части задержки считаются так: ожидание — `processingStart − startTime`, обработка —
      `processingEnd − processingStart`, показ — от `processingEnd` до `startTime + duration`. Здесь большое ожидание:
      в момент клика поток был занят другой задачей. Искать надо не в обработчике покупки, а в том, что шло рядом, —
      это подскажут записи LoAF.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/PerformanceEventTiming

