        why: 'Сейчас сделки получают разные скрытые классы — в зависимости от того, были ли поля. Одинаковая форма делает обращения в цикле мономорфными.'
      - text: 'Удалять ненужные поля через delete после подсчёта, чтобы объекты были легче'
        why: '`delete` часто переводит объект в медленный режим словаря — станет только хуже.'
      - text: 'Заменить объекты сделок на Map с ключами-строками вместо свойств'
        why: 'Обращение к Map — поиск по ключу; объекты одной формы с кэшированным смещением в горячем цикле обычно быстрее.'
      - text: 'Обернуть цикл подсчёта в try/catch, чтобы V8 не мешал оптимизации'
        why: 'try/catch давно не мешает оптимизации в V8 и к форме объектов отношения не имеет.'
    explanation: |
      Если свойства добавляются по условию, одна сущность получает несколько скрытых классов, и место в коде, где
      читается свойство, видит разные формы. Встроенный кэш становится полиморфным, а при больших различиях —
      мегаморфным, и чтение замедляется. Правка простая: создавать объект сразу со всеми полями в одном порядке.
      Такую подстройку делают только в горячем коде, найденном профилем.
    links:
      - https://mathiasbynens.be/notes/shapes-ics

