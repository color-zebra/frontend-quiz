title: 'Системный дизайн: большие приложения'
lessons:
  - id: sda-intro
    topic: Введение
    subtopic: Много команд, одно приложение
    title: Когда приложение делают много команд
    body: |
      ## Какую проблему решаем

      В первых пяти курсах сервис доставки рос, но одно оставалось неизменным: мы проектировали так, будто всё
      приложение делает одна команда. Она знает весь код, сама решает, когда выпускаться, и сама чинит то, что
      сломала.

      Прошло два года. Сервис работает в 12 городах России и в Дубае, а веб-приложения делают около 60 фронтендеров
      в восьми командах. Жалобы теперь звучат иначе:

      - **команда «Корзина и оформление»:** «Мы выкатили исправление оплаты, а через час его откатили вместе
        со всем остальным: у команды каталога сломался фильтр. Наше исправление ни при чём»;
      - **команда «Каталог и меню»:** «Шапку с маленькой корзиной правят все три команды. Вчера кто-то поменял её
        отступы, и у нас поехала вёрстка»;
      - **команда «Кабинет ресторана»:** «Половина кабинета написана в 2016 году на AngularJS. Поддержка этой
        библиотеки закончилась в 2022 году, а остановить кабинет и переписать нельзя: им каждый день работают
        1 200 ресторанов»;
      - **разработчик мобильного приложения:** «Бэкенд переименовал поле статуса заказа, и у тех, кто не обновил
        приложение, экран заказа пустой»;
      - **руководитель разработки:** «Все команды говорят, что старый клиент API мешает. Переписывать его — три
        месяца. Как понять, стоит ли?»;
      - **дежурный в пятницу вечером:** «Сервис рекомендаций стал отвечать по 10 секунд, и из-за него перестал
        открываться весь каталог ресторанов».

      Ни одна из этих проблем не решается внутри одного компонента или одного запроса. Это проблемы масштаба:
      много людей, много лет, много частей, и какая-то из них всегда сломана. Об этом курс.

      ## Что меняется, когда команд много

      **Команда** здесь — группа из пяти–девяти человек, у которой есть своя часть продукта и свой список задач.
      Пока команда одна, договориться легко: все сидят рядом и видят весь код. Когда команд восемь, появляются
      четыре новых вида трудностей.

      1. **Команды мешают друг другу.** Общая сборка, общая выкатка, общие файлы: изменение одной команды ломает
         или задерживает работу другой.
      2. **У общего нет хозяина.** Шапку, вход, клиент API, дизайн-систему используют все, а отвечает за них
         непонятно кто — или все сразу, что то же самое.
      3. **Старое нельзя остановить.** Приложение живёт годами, и переписывать его приходится на ходу, пока им
         пользуются.
      4. **Что-то всегда сломано.** Частей так много, что в любой момент какая-нибудь из них работает плохо.
         Приложение должно переживать это, а не падать целиком.

      Кроме того, на масштабе почти всегда приходится чем-то жертвовать: быстрее, дешевле, свежее и надёжнее
      одновременно не получается. Нужно уметь выбирать, что важнее, и объяснять почему.

      ## Что будет в курсе

      **Архитектура большого приложения** — как разделить приложение между командами.
      - Границы между командами: почему архитектура повторяет устройство команд и как провести границы так, чтобы
        команды меньше ждали друг друга.
      - Модульный монолит или микрофронтенды: одно приложение с жёсткими границами внутри или части, которые
        выпускаются отдельно; какие бывают микрофронтенды и чего они стоят.
      - Контракты между командами: что обещают друг другу оболочка и модули и что делать, когда чужой модуль упал.

      **Эволюция архитектуры** — как развивать приложение, не останавливая его.
      - Постепенная миграция: как переехать со старого кода на новый по частям.
      - Эволюция контрактов и данных: как изменить API, который читают десять потребителей.
      - Технический долг как решение: когда долг брать, когда отдавать и как обосновать это числами.

      **Архитектура под ограничениями** — как приложение ведёт себя, когда тяжело.
      - Когда требования спорят: что жертвовать и что нельзя нарушить ни ради чего.
      - Отказы и деградация: как отказ одной части не роняет всё приложение.
      - Где узкое место: как от жалобы «стало медленно» дойти до решения, которое даст больше всего.

      ## Как курс опирается на прошлые

      Здесь не будет заново объяснено то, что уже разобрано подробно. Если урок опирается на прошлый материал,
      он напоминает его одной-двумя фразами и называет урок.

      - Как делить систему на модули, что такое публичный интерфейс и порты с адаптерами — курс 1, уроки «Как делить
        систему на части» и «Зависимости и публичный интерфейс модуля». Здесь те же границы проводят между командами.
      - Как сравнивать решения, ADR и усложнение по сигналу — курс 1, «Как сравнивать решения» и «Риски и развитие
        решения».
      - Плавная деградация экрана — курс 1, «Загрузка, пустота, ошибка и всё между ними». Повторы, тайм-ауты
        и лавина повторов — курс 2, «Когда и как повторять».
      - Метрики скорости, приём «расширить и сузить», флаги функций и наблюдаемость — курс «Доставка и качество».
      - Версии формата данных на устройстве — курс «Синхронизация и офлайн».

      ## Что нового в сервисе доставки

      Восемь команд фронтенда:

      - **«Каталог и меню», «Корзина и оформление», «Отслеживание и чат»** — вместе делают веб-приложение покупателя;
      - **«Кабинет ресторана»** — кабинет, где рестораны принимают заказы и правят меню;
      - **«Поддержка»** — кабинет операторов поддержки и окно чата с поддержкой;
      - **«Курьер»** — приложение курьера;
      - **«Платформа»** — сборка и выкатка, вход, клиент API, флаги функций, сбор ошибок и метрик;
      - **«Дизайн-система»** — общие компоненты, цвета, шрифты и иконки.

      Отдельно от них живут мобильные приложения покупателя для iOS и Android, которые делают свои команды.

      В курсе встретятся и новые истории: переезд кабинета ресторана со старого кода, смена поля статуса заказа,
      старый клиент API, распродажа «Чёрная пятница», сбой сервиса рекомендаций в пятницу вечером и жалоба
      «приложение стало медленным».

      ## Типичные ошибки

      - **Решать организационную проблему только технологией.** Команды мешают друг другу из-за общей выкатки
        и общих файлов, а не из-за фреймворка. Новый фреймворк без новых границ оставит те же споры.
      - **Переписывать всё разом.** Пока пишется новая версия, старая продолжает меняться, и новая не догоняет её
        годами. А переключение в один день ставит под удар всех пользователей сразу.
      - **Строить «как у больших» заранее.** Микрофронтенды и платформенная команда для четырёх разработчиков
        стоят дороже, чем приносят, — это преждевременное усложнение из курса 1.
      - **Проектировать только для дня, когда всё работает.** На масштабе какой-то сервис отказывает почти всегда.

      ## Как спрашивают на интервью

      - «Над фронтендом работают 50 человек, и релизы постоянно ломают друг другу. Как бы вы перестроили
        архитектуру?» — разговор о границах команд, модульном монолите и микрофронтендах.
      - «У нас легаси на AngularJS. Как переехать на React, не останавливая продукт?» — постепенная миграция.
      - «Один из сервисов отвечает очень медленно. Что увидит пользователь и как это ограничить?» — отказы
        и деградация.

      ## Коротко

      - Курс о решениях, которые появляются, когда приложение делают много команд много лет и какая-то его часть
        всегда работает плохо.
      - Первая часть — как разделить приложение между командами, вторая — как развивать его, не останавливая,
        третья — как оно ведёт себя под нагрузкой, при отказах и когда стало медленным.
      - Многие проблемы масштаба организационные: команды мешают друг другу через общую выкатку и общие файлы,
        поэтому решение начинают с границ и владельцев, а не с выбора технологии.
      - Курс опирается на границы модулей, сравнение решений и ADR из курса 1, повторы из курса 2, выкатку
        и метрики из курса «Доставка и качество» и напоминает их одной-двумя фразами.

      ## Источники

      - [Conway's Law — Martin Fowler](https://martinfowler.com/bliki/ConwaysLaw.html)
      - [Micro Frontends — Cam Jackson, martinfowler.com](https://martinfowler.com/articles/micro-frontends.html)

  - id: sda-domains
    topic: Архитектура большого приложения
    subtopic: Границы доменов и масштаб команд
    title: Границы между командами
    body: |
      ## Какую проблему решаем

      Когда фронтендеров в сервисе доставки стало больше двадцати, их разделили на команды по слоям. Команда
      «Интерфейс» делала компоненты и экраны, команда «Данные» — запросы к API, кэш и состояние, команда «Качество» —
      сквозные тесты. Казалось логичным: каждый занят тем, в чём силён.

      Первая же большая задача — «повторить прошлый заказ» — показала цену. Команда «Интерфейс» нарисовала кнопку
      и ждала, пока «Данные» сделают запрос. «Данные» ждали, пока бэкенд согласует контракт. «Качество» ждали
      обе команды. Каждая передача работы — неделя в чужой очереди задач, и задача на две недели заняла два месяца.
      Хуже того, за результат не отвечал никто: каждая команда сделала свою часть.

      Вторая беда — шапка с маленькой корзиной. Ею пользуются все экраны, и правят её все: каталог добавил
      туда поиск, оформление — счётчик корзины, отслеживание — значок активного заказа. Хозяина у шапки нет,
      поэтому каждое изменение ломает чужое, и никто не может сказать «нет».

      Урок о том, как провести границы между командами так, чтобы обычная задача не требовала пяти передач
      и чтобы у каждой общей части был хозяин.

      ## Закон Конвея

      В 1968 году программист Мелвин Конвей сформулировал наблюдение, которое теперь называют **законом Конвея**
      (Conway's law): организация, которая проектирует систему, получает систему, устройство которой копирует
      устройство общения внутри организации.

      Проще говоря, архитектура повторяет то, как разговаривают команды. Внутри команды договориться легко — люди
      рядом, общаются каждый день, и код у них получается тесно связанным. Между командами общаться труднее,
      поэтому там, где граница между командами, со временем появляется граница в коде: отдельный модуль, отдельный
      API, отдельный пакет. Мартин Фаулер в статье о законе Конвея отмечает: если команды разделены по слоям,
      каждая функция требует плотной совместной работы этих слоёв — то есть постоянных передач работы.

      Из закона следуют два практических вывода:

      - **Границу в коде, которая не совпадает с границей команд, трудно удержать.** Если один модуль правят три
        команды, он превращается в общую свалку; если одна команда отвечает за пять несвязанных модулей, они
        срастаются.
      - **Устройство команд можно менять ради архитектуры.** Это называют **обратным манёвром Конвея** (inverse
        Conway maneuver): сначала решают, какие части системы должны развиваться независимо, а потом собирают
        вокруг них команды. Фаулер предупреждает, что манёвр не всесилен: новая оргструктура не распутает старый
        код сама, поэтому команды и код меняют вместе и небольшими шагами.

      ## Граница по предметной области, а не по слоям

      В курсе 1, в уроке «Как делить систему на части», модули верхнего уровня делили по предметным областям,
      а слои держали внутри каждого модуля, потому что модуль — то, что меняется вместе. С командами то же самое:
      **команда отвечает за предметную область целиком** — от экрана до запросов и тестов.

      Хорошую границу проверяют обычными задачами из списка. Возьмите десять последних задач и посчитайте, сколько
      команд пришлось задействовать в каждой. Если большинство задач делает одна команда, граница удачная.
      Если почти каждая задача проходит через три команды, граница проведена поперёк изменений.

      Деление по слоям, по виду работы («команда компонентов», «команда API») и по технологии («команда React»)
      почти всегда режет задачи поперёк. Деление по предметной области — каталог, оформление, отслеживание —
      режет их вдоль.

      ## Техническое и организационное масштабирование

      На масштабе есть две разные задачи, и их легко спутать.

      - **Техническое масштабирование:** код и инструменты не тормозят. Сборка идёт минуты, а не час, тесты
        не падают случайно, редактор не зависает на большом проекте. Это решают инструментами: сборка и тесты
        только по затронутым модулям, кэш сборки, разбиение тестов.
      - **Организационное масштабирование:** команды не ждут друг друга. Каждая может сделать свою задачу, выпустить
        её и откатить, не согласовывая это с остальными. Это решают границами, владельцами и контрактами.

      Медленную сборку не вылечить перераспределением команд, а общую выкатку не вылечить быстрой сборкой. Сначала
      определите, какая из двух задач перед вами.

      ## Типы команд

      Книга «Team Topologies» Мэтью Скелтона и Мануэля Паиша (2019) описывает четыре основных типа команд. Их
      названия часто звучат на собеседованиях.

      - **Команда потока** (stream-aligned team) — отвечает за поток работы в своей предметной области от начала
        до конца: «Корзина и оформление», «Каталог и меню». Таких команд большинство.
      - **Платформенная команда** (platform team) — делает внутренний продукт, который ускоряет команды потока:
        сборку и выкатку, вход, клиент API, сбор ошибок.
      - **Команда-помощник** (enabling team) — на время приходит в другие команды, помогает освоить новое
        и уходит. Например, помогает всем командам перейти на новый способ тестирования.
      - **Команда сложной подсистемы** (complicated-subsystem team) — держит часть, где нужна редкая экспертиза:
        движок карт, расчёт маршрута, видеоплеер.

      Там же описаны три способа взаимодействия: **совместная работа** на ограниченное время, чтобы вместе что-то
      выяснить; **«X как услуга»** (X-as-a-Service), когда одна команда пользуется результатом другой, не вникая
      в устройство; **содействие** (facilitating), когда одна команда учит другую.

      Важное понятие книги — **когнитивная нагрузка команды**: сколько всего команда должна держать в голове.
      Если на команду сваливают всё новые обязанности и ничего не забирают, она начинает принимать плохие решения
      и работать медленно. Граница нужна ещё и для того, чтобы у каждой команды был посильный кусок.

      ## Кто владеет общим

      Шапка, вход, клиент API, дизайн-система, общие модели данных — то, чем пользуются все. У каждой такой части
      должен быть **владелец**: команда, которая решает, как часть меняется, отвечает за её качество и может сказать
      «нет». Владелец не обязан писать весь код сам. Есть три рабочих способа владеть общим:

      - **Владелец делает сам, остальные просят.** Подходит для частей, где ошибка дорога: вход, оплата.
        Цена — очередь просьб к владельцу.
      - **Правят все, владелец проверяет.** Любая команда может предложить изменение, но слить его можно только
        после проверки владельца. Подходит для дизайн-системы и общих компонентов. Цена — владелец тратит время
        на проверку чужих изменений.
      - **Общая рамка и места для команд.** Владелец делает рамку и правила, а внутри рамки у каждой команды своё
        место. Так устроена шапка: подробнее — в уроке «Контракты между командами».

      Не работает четвёртый способ — «общее, значит ничьё». Тогда правят все, а отвечает никто.

      Владельца записывают туда, где его увидят инструменты. На GitHub это файл **CODEOWNERS**: в нём пути в репозитории
      сопоставлены с командами. Когда изменение затрагивает эти файлы, GitHub сам просит проверку у владельца,
      а правило защиты ветки «Require review from Code Owners» не даёт слить изменение без его одобрения. Если один
      путь подходит под несколько строк, действует последняя.

      ## Пример целиком: восемь команд сервиса доставки

      После неудачи с командами по слоям фронтенд разделили по предметным областям.

      - **Команды потока:** «Каталог и меню», «Корзина и оформление», «Отслеживание и чат» — в приложении покупателя;
        «Кабинет ресторана», «Поддержка» и «Курьер» — каждая в своём приложении.
      - **Платформенные команды:** «Платформа» — сборка и выкатка, вход, клиент API, флаги, наблюдаемость и оболочка
        приложения покупателя; «Дизайн-система» — компоненты, цвета, шрифты, иконки.

      ![Карта владения: приложение покупателя с тремя командами потока внутри и оболочкой платформы вокруг них; рядом кабинет ресторана, кабинет поддержки и приложение курьера, у каждого своя команда; внизу общие части с владельцами — дизайн-система, вход, клиент API, сборка и выкатка; стрелки «пользуется как услугой» идут от команд к общим частям](images/sda-domains.png "Карта владения: у каждой части одна команда-хозяин")

      Карта владения общими частями:

      - **Шапка приложения покупателя:** рамку делает «Платформа», маленькую корзину в шапке — «Корзина
        и оформление», поиск — «Каталог и меню».
      - **Вход и сессия:** «Платформа», делает сама; остальные просят.
      - **Клиент API:** «Платформа»; правят все, «Платформа» проверяет.
      - **Компоненты и иконки:** «Дизайн-система»; правят все, она проверяет.
      - **Общие модели данных** (заказ, ресторан): схемой API владеет бэкенд, описанием моделей в клиенте API
        на фронтенде — «Платформа»; правят все, «Платформа» проверяет. Пока это описание неполное: у старого
        клиента API нет типов ответов — к этому вернёмся в уроке «Технический долг как решение».
      - **Окно чата с поддержкой:** «Поддержка», хотя показывают его три приложения.

      Проверка по задаче «повторить прошлый заказ»: теперь её целиком делает «Корзина и оформление» — кнопка, запрос,
      тесты, выкатка. Остальным командам она не нужна. В CODEOWNERS каждая папка приложения покупателя записана
      за своей командой, а папка оболочки — за «Платформой».

      ## Варианты и их цена

      - **По слоям или виду работы**
        - Подходит: маленький продукт, где всё равно все делают всё.
        - Цена: каждая задача проходит через несколько команд, за результат не отвечает никто.
      - **По предметным областям**
        - Подходит: почти всегда, когда команд больше двух-трёх.
        - Цена: общее делят между командами, нужны владельцы и правила для общих частей.
      - **По приложениям или платформам** (веб, iOS, Android)
        - Подходит: приложения почти не пересекаются по функциям.
        - Цена: одна функция на трёх платформах — три команды и три графика.
      - **Платформенная команда для общего**
        - Подходит: общих частей много, и командам потока некогда их держать.
        - Цена: платформа может стать узким местом, если каждое изменение идёт через неё.

      ## Типичные ошибки

      - **Делить команды по слоям.** Каждая задача — несколько передач работы и несколько очередей.
      - **Общее без хозяина.** Шапку и общие компоненты правят все, ломают друг другу и не могут сказать «нет».
      - **Рисовать границы в коде без изменения команд.** По закону Конвея граница, которую никто не охраняет,
        зарастёт.
      - **Лечить медленную сборку перестановкой команд** — или общую выкатку быстрыми машинами. Это разные задачи.
      - **Делать платформу воротами.** Если без платформенной команды нельзя поменять даже настройку, все
        команды ждут её.

      ## Как спрашивают на интервью

      - «Как бы вы разделили фронтенд маркетплейса между пятью командами?» — ждут деление по предметным областям,
        проверку обычными задачами и владельцев общих частей.
      - «Что такое закон Конвея и как он влияет на архитектуру?» — ждут формулировку и вывод: границы команд
        и границы кода должны совпадать.
      - «Кто у вас отвечает за дизайн-систему и как другие команды её меняют?» — ждут владельца и правило
        изменений.

      ## Коротко

      - Закон Конвея: устройство системы копирует устройство общения в организации. Граница в коде, которая
        не совпадает с границей команд, со временем зарастает, а обратный манёвр Конвея меняет команды ради нужной
        архитектуры — вместе с кодом и небольшими шагами.
      - Команда отвечает за предметную область целиком, от экрана до тестов. Деление по слоям и виду работы режет
        задачи поперёк и превращает каждую в цепочку передач.
      - Хорошую границу проверяют обычными задачами: если большинство задач делает одна команда, граница удачная.
      - Техническое масштабирование — чтобы код и инструменты не тормозили, организационное — чтобы команды
        не ждали друг друга. Это разные задачи с разными решениями.
      - В «Team Topologies» четыре типа команд: команды потока, платформенная, команда-помощник и команда сложной
        подсистемы. Границу проводят ещё и так, чтобы когнитивная нагрузка каждой команды была посильной.
      - У каждой общей части есть владелец, который решает, как она меняется. Владельцев записывают в CODEOWNERS,
        чтобы проверку владельца просил сам GitHub.

      ## Источники

      - [Conway's Law — Martin Fowler](https://martinfowler.com/bliki/ConwaysLaw.html)
      - [Key Concepts — Team Topologies](https://teamtopologies.com/key-concepts)
      - [About code owners — GitHub Docs](https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-code-owners)

  - id: sda-microfrontends
    topic: Архитектура большого приложения
    subtopic: Модульный монолит или микрофронтенды
    title: Модульный монолит или микрофронтенды
    body: |
      ## Какую проблему решаем

      Команды сервиса доставки разделили по предметным областям, но приложение покупателя по-прежнему одно: один
      репозиторий, одна сборка на 40 минут, одна выкатка на три команды. Если изменение каталога приходится откатить,
      вместе с ним откатывается исправление оплаты.

      На встрече звучит предложение: «Давайте сделаем микрофронтенды. Пусть у каждой команды будет своё приложение,
      и страница ресторана соберётся из трёх: меню от каталога, корзина в шапке от оформления, значок заказа
      от отслеживания». Звучит убедительно, но у этого решения есть цена, которую на встрече никто не назвал.

      В то же время у команды «Поддержка» задача другого рода: окно чата с поддержкой нужно показывать в трёх
      приложениях — у покупателя, в кабинете ресторана и у курьера. У трёх приложений свои графики выкатки,
      а исправление в чате должно доходить до всех трёх в тот же день.

      Урок о том, чем модульный монолит отличается от микрофронтендов, какие бывают микрофронтенды и как понять,
      какой из двух случаев перед вами.

      ## Понятия

      - **Модульный монолит** (modular monolith) — одно приложение с одной сборкой и одной выкаткой, но с жёсткими
        границами внутри. У каждого модуля есть владелец и публичный интерфейс (курс 1, «Зависимости и публичный
        интерфейс модуля»), а правила импортов проверяет линтер: модуль каталога не может импортировать
        внутренности модуля оформления. Такие правила дают, например, правило `enforce-module-boundaries` в Nx
        и плагин `eslint-plugin-boundaries`.
      - **Микрофронтенд** (micro frontend) — по определению Кэма Джексона из статьи на сайте Мартина Фаулера,
        архитектурный стиль, в котором независимо выпускаемые фронтенд-приложения собираются в одно целое.
        Главное слово — **независимо выпускаемые**: у каждой части своя сборка, своя выкатка и свой откат.
      - **Оболочка** (shell) — приложение, которое собирает микрофронтенды на странице: решает, какой
        из них показать, передаёт им общие данные вроде токена и языка.

      Модульный монолит и микрофронтенды делят приложение по одним и тем же границам. Разница в одном: в монолите
      части выходят вместе, а микрофронтенды — каждый сам по себе.

      ## Где проходит разрез

      Микрофронтенды можно отделять двумя способами.

      - **По страницам.** Каждой команде принадлежат свои адреса целиком: `/` — приложение покупателя,
        `/restaurant` — кабинет ресторана. Между частями переходят по ссылке, на странице одновременно живёт одна
        часть. Это самый простой и самый надёжный вид микрофронтендов.
      - **Внутри страницы.** На одном экране сразу несколько частей разных команд: меню, корзина в шапке, окно
        чата. Здесь нужна оболочка, которая их собирает, и договорённости о том, как части делят экран, адрес
        и данные.

      Второй способ гибче, но почти все трудности микрофронтендов — именно у него.

      ## Как собирают микрофронтенды

      Самый простой способ — **отдельные приложения по ссылкам**, о нём раздел выше: каждое приложение на своих
      адресах, переход — обычная навигация. Ничего общего во время работы нет, зато переход между частями —
      загрузка новой страницы, а общие шапку и вход повторяют в каждом приложении через пакеты.

      Когда части нужно собрать в одну страницу, способов больше. Кэм Джексон в статье «Micro Frontends» разбирает
      пять, и различаются они тем, где и когда происходит сборка.

      - **При сборке** (build-time integration)
        - Как: каждая часть — npm-пакет, оболочка подключает их как зависимости.
        - Плюсы: один бандл, общие библиотеки не дублируются.
        - Минусы: чтобы выпустить изменение одной части, пересобирают и выкатывают всё. Независимой выкатки нет,
          поэтому Джексон этот способ для микрофронтендов настойчиво не советует. По сути это модульный монолит,
          разложенный по пакетам.
      - **На сервере** (server-side composition)
        - Как: сервер собирает HTML страницы из фрагментов, которые отдают серверы разных команд, например через
          SSI или ESI на CDN.
        - Плюсы: быстрый первый показ, страница видна поисковикам, технологии частей могут быть любыми.
        - Минусы: нужна серверная инфраструктура; если фрагмент медленный, ждёт вся страница; интерактивность
          частей всё равно оживает в браузере.
      - **В браузере через iframe**
        - Как: каждая часть — отдельная страница во фрейме.
        - Плюсы: самая сильная изоляция — стили, глобальные переменные и ошибки не протекают; подходит для чужого
          кода, которому вы не доверяете.
        - Минусы: трудно с адресом и ссылками на конкретное место, с размером фрейма под содержимое,
          с доступностью; каждый фрейм грузит свои библиотеки.
      - **В браузере через JavaScript**
        - Как: оболочка загружает скрипт части, а тот отдаёт функцию вроде `mount(element)`, которая рисует часть
          в переданный элемент. Так работают single-spa и Module Federation.
        - Плюсы: самый гибкий способ, части выкатываются независимо; Джексон выбирает его по умолчанию.
        - Минусы: части живут в одной странице и могут мешать друг другу стилями и глобальным состоянием; нужно
          решать, как делить общие библиотеки.
      - **В браузере через Web Components**
        - Как: каждая часть регистрирует свой HTML-элемент, например `<support-chat>`, а оболочка просто вставляет
          его в разметку.
        - Плюсы: контракт описан стандартом браузера; Shadow DOM изолирует стили.
        - Минусы: всё то же, что у способа через JavaScript, плюс свои сложности с отрисовкой на сервере
          и передачей сложных данных в элемент.

      **Module Federation** — механизм сборщика (начинался в webpack 5), который позволяет одному приложению
      загружать модули другого во время работы и делить с ним общие библиотеки, например одну копию React
      на всех. Это реализация способа «через JavaScript». Как он устроен изнутри — общие зависимости, версии,
      рантайм, — разобрано в отдельном наборе «Микрофронтенды» в каталоге.

      ## Где микрофронтенды болят

      Джексон прямо называет цену микрофронтендов, а опыт команд добавляет к ней ещё несколько пунктов.

      - **Размер.** Части, собранные отдельно, часто тащат по своей копии React и других библиотек. Если же
        библиотеки делить, части снова связаны: обновить React приходится всем вместе.
      - **Версии общих зависимостей.** Одна часть на React 18, другая на React 19 — либо две копии на странице,
        либо договорённость о версии, то есть снова общий график.
      - **Адрес.** Кто владеет адресной строкой: оболочка или часть? Как части узнают о переходах и не ломают
        кнопку «Назад»? Обычно адресной строкой владеет оболочка: по первой части пути она решает, какую часть
        показать, а часть управляет только своим хвостом пути и узнаёт о переходах от оболочки.
      - **Вход и сессия.** Токен должен быть один на страницу. Обычно им владеет оболочка и передаёт частям.
      - **Общее состояние.** Если части читают и пишут общее хранилище, они снова связаны, только незаметно.
        Джексон советует общаться минимально: события, данные от оболочки, адрес.
      - **Единый вид.** Части на разных версиях дизайн-системы показывают разные кнопки на одном экране.
      - **Эксплуатация.** Больше репозиториев, сборок, выкаток, мониторинга; разработка части отдельно отличается
        от того, как она работает на настоящей странице.

      ## Когда микрофронтенды оправданы

      Микрофронтенды дают одно — **независимую выкатку частей**. Значит, они оправданы, когда независимая выкатка
      нужна и иначе её не получить:

      - **одна часть показывается в нескольких приложениях** с разными графиками выкатки — как окно чата;
      - **много команд на одной странице,** и ни флаги, ни проверки по затронутым модулям не избавили их от общего
        графика;
      - **постепенная миграция:** новое приложение растёт рядом со старым и забирает адрес за адресом
        (урок «Постепенная миграция»);
      - **части на разных технологиях,** и переписать их невозможно.

      Не оправданы они ради размера бандла (размер уменьшает разбиение кода из курса «Доставка и качество»,
      а микрофронтенды его обычно увеличивают), для одной-двух команд и «потому что так делают большие» — это
      предполагаемая функция из курса 1, «Как сравнивать решения».

      Многие трудности общей выкатки решаются и в монолите: флаги функций отделяют выкатку кода от включения
      функции, а откат одной функции флагом не трогает чужие изменения (курс «Доставка и качество», «Проверки
      и выкатка»).

      ![Слева модульный монолит: три модуля с владельцами и разрешёнными стрелками импортов, одна сборка и одна выкатка, откат функции — флагом. Справа микрофронтенды: оболочка и три части, у каждой своя сборка и своя выкатка; между частями только события и данные от оболочки](images/sda-microfrontends.png "Модульный монолит выходит целиком, микрофронтенды — по частям")

      ## Пример целиком: что разделит сервис доставки

      Команда разобрала предложение по частям.

      1. **Приложение покупателя остаётся модульным монолитом.** На одной странице ресторана работают все три
         команды, и разрезать её значит грузить три копии React на телефоне при бюджете 170 КБ JavaScript и делить
         адрес, корзину и вход между тремя частями. Настоящая жалоба — общий откат — решается иначе: каждая новая
         функция выходит за флагом и откатывается флагом, а сборка проверяет только затронутые модули, и вместо
         40 минут идёт около 12. Границы модулей проверяет линтер, владельцев — CODEOWNERS.
      2. **Отдельные приложения по адресам остаются как есть.** Покупатель, кабинет ресторана, кабинет поддержки
         и курьер — разные приложения со своими командами и выкатками. Общее между ними — пакеты дизайн-системы
         и входа.
      3. **Окно чата с поддержкой становится микрофронтендом.** Его делает одна команда, показывают три приложения,
         а исправление должно доходить до всех в тот же день. Приложения загружают скрипт чата во время работы
         и вызывают его `mount`. Контракт между ними — в следующем уроке.
      4. **Кабинет ресторана переезжает по адресам.** Новые разделы на React живут рядом со старыми на AngularJS
         за общим входом — урок «Постепенная миграция».

      Решение записали в ADR с условием пересмотра: «если флаги и проверки по затронутым модулям не уберут
      общие откаты за три месяца, вернуться к вопросу о разделении страницы ресторана».

      ## Варианты и их цена

      - **Монолит без границ**
        - Подходит: одна небольшая команда.
        - Цена: с ростом команд модули срастаются, и любое изменение задевает всех.
      - **Модульный монолит**
        - Подходит: несколько команд, общая страница, одна технология.
        - Цена: одна сборка и одна выкатка; независимость дают флаги и дисциплина границ.
      - **Микрофронтенды по страницам**
        - Подходит: части почти не пересекаются на экране.
        - Цена: общее (шапку, вход) повторяют пакетами; переход между частями — новая загрузка.
      - **Микрофронтенды внутри страницы**
        - Подходит: часть нужна в нескольких приложениях или командам на одном экране нужна независимая выкатка.
        - Цена: размер, версии общих библиотек, адрес, сессия, эксплуатация.

      ## Типичные ошибки

      - **Микрофронтенды ради размера бандла.** Отдельно собранные части обычно весят больше, а не меньше.
      - **Микрофронтенды для двух команд.** Цена эксплуатации есть всегда, а выигрыш — только при настоящей
        потребности в независимой выкатке.
      - **Общее хранилище состояния между частями.** Связь между частями остаётся, только её не видно в коде.
      - **Сборка из npm-пакетов под видом микрофронтендов.** Выкатка всё равно общая.
      - **Монолит без проверяемых границ.** «Мы договорились не импортировать чужое» без линтера держится
        до первого срочного исправления.

      ## Как спрашивают на интервью

      - «Когда вы бы выбрали микрофронтенды, а когда — нет?» — ждут: ради независимой выкатки, с ценой; не ради
        размера и не для маленькой команды.
      - «Какие способы собрать микрофронтенды на странице вы знаете?» — ждут сборку на сервере, iframe, JavaScript,
        Web Components и почему сборка из пакетов не даёт независимости.
      - «Как микрофронтенды делят React и что будет, если версии разные?» — ждут дубли или общий график и ссылку
        на механизм вроде Module Federation.

      ## Коротко

      - Модульный монолит и микрофронтенды делят приложение по одним границам. В монолите части выходят вместе,
        а микрофронтенды выпускаются независимо — это их единственное настоящее преимущество.
      - Разрез по страницам самый простой: у каждой команды свои адреса. Разрез внутри страницы гибче, но почти все
        трудности микрофронтендов именно у него.
      - Собрать части можно на сервере, в браузере через iframe, через JavaScript-функцию `mount` или через
        Web Components. Сборка из npm-пакетов не даёт независимой выкатки и по сути остаётся монолитом.
      - Цена микрофронтендов: дубли библиотек и размер, версии общих зависимостей, адрес, сессия, общее
        состояние, единый вид и эксплуатация.
      - Микрофронтенды оправданы, когда часть живёт в нескольких приложениях, когда командам на одной странице нужна
        независимая выкатка и иначе её не получить, при постепенной миграции. Ради размера бандла и для одной-двух
        команд они не оправданы.
      - Общий откат в монолите часто лечат флагами функций и проверками по затронутым модулям, а границы модулей
        проверяет линтер, а не договорённость.

      ## Источники

      - [Micro Frontends — Cam Jackson, martinfowler.com](https://martinfowler.com/articles/micro-frontends.html)
      - [Shared — Module Federation](https://module-federation.io/configure/shared.html)

  - id: sda-platform
    topic: Архитектура большого приложения
    subtopic: Общие контракты платформы
    title: Контракты между командами
    body: |
      ## Какую проблему решаем

      Окно чата с поддержкой стало микрофронтендом: команда «Поддержка» выкатывает его сама, а три приложения
      загружают его скрипт во время работы. За первый месяц случилось четыре происшествия.

      1. Чат добавил в свои стили правило для `body`, и во всём приложении курьера изменился шрифт.
      2. Кабинет ресторана открыл чат без номера заказа. Чат упал при отрисовке, и вместе с ним погас весь кабинет:
         белый экран у 1 200 ресторанов.
      3. Команда «Поддержка» переименовала параметр `lang` в `locale`. Два приложения из трёх ещё передавали
         `lang`, и у них чат заговорил по-английски.
      4. Ошибки чата попадали в отчёты команды кабинета ресторана: они происходили на её страницах. Команда
         неделю искала у себя ошибку, которой у неё не было.

      Ни одна из ошибок не была сложной. Все они случились потому, что никто не записал, что оболочка обещает чату,
      что чат обещает оболочке и кто отвечает, когда обещание нарушено. Урок о контрактах между командами.

      ## Понятия

      - **Контракт между командами** — то, что одна часть открыто обещает другой: какие данные передаются, какие
        события бывают, чего часть не делает, что происходит при сбое. Это тот же публичный интерфейс из курса 1,
        «Зависимости и публичный интерфейс модуля», только по ту сторону контракта теперь другая команда со своим
        графиком.
      - **Оболочка** (shell) — часть, которая собирает приложение и даёт модулям место на экране и общие данные.
        В приложении покупателя оболочку делает команда «Платформа».
      - **Точка расширения** (слот, extension point) — место в оболочке, куда другая команда подключает свою часть:
        «маленькая корзина в шапке», «окно чата».
      - **Обратная совместимость** — новая версия части работает с теми, кто написан под старую.

      ## Что обещают друг другу оболочка и модуль

      Контракт двусторонний. Его пишут списком, кладут рядом с кодом и проверяют тестами.

      **Оболочка обещает модулю:**
      - элемент, в который модуль рисует, и момент, когда его можно убрать;
      - общие данные: токен входа, язык, тему, текущий адрес — модуль не достаёт их сам;
      - сбор ошибок и метрик, куда модуль пишет, указывая себя;
      - что поймает сбой модуля и не даст ему уронить страницу.

      **Модуль обещает оболочке:**
      - рисовать только в свой элемент и убирать за собой всё — обработчики, таймеры, соединения — при `unmount`;
      - не трогать глобальное: стили `body` и `html`, глобальные переменные, чужие ключи в хранилищах браузера;
      - сообщать о важном событиями в описанном формате, а не лезть в чужое состояние;
      - укладываться в бюджет: размер скрипта, время запуска;
      - ловить свои ошибки и не бросать их наружу.

      ## Как не выпускаться одновременно

      Смысл независимой выкатки в том, что части меняются в разное время. Значит, каждая новая версия должна
      работать с теми, кто ещё не обновился. Для этого есть три средства.

      **Версии по semver.** Семантическое версионирование (semver) записывает версию тремя числами:
      `МАЖОРНАЯ.МИНОРНАЯ.ПАТЧ`. Патч — исправление ошибки, совместимое со старыми потребителями, минорная — новое
      с обратной совместимостью, мажорная — изменение, которое ломает старых потребителей. Потребитель пакета указывает диапазон, например `^4.2.0`:
      «любая 4.x не ниже 4.2.0». Так он получает исправления сам, а ломающие изменения — только когда сам решит
      перейти на 5.

      **Мажорная версия в адресе модуля.** Модуль, который грузят во время работы, публикуют по адресу
      с мажорной версией: `/chat/v2/entry.js`. По этому адресу всегда лежит последняя 2.x — исправления доходят
      до всех приложений сразу. Для этого сам `entry.js` отдают с коротким сроком кэша или `no-cache`, как
      страницу-вход в курсе «Доставка и качество», а куски, которые он подгружает, — с хэшем в имени. Ломающее
      изменение выходит как `/chat/v3/` рядом со старым. Приложения
      переходят на v3, когда готовы, а v2 убирают, когда её больше никто не загружает. Это тот же приём
      «добавить рядом, перевести, удалить» из курса 1 — подробнее о нём в уроке «Эволюция контрактов и данных».

      **Контракты со стороны потребителя.** В курсе «Доставка и качество», в уроке «Проверки и выкатка», этот
      приём уже был для API: клиент записывает, что он шлёт и что читает, а сервер проверяет эти ожидания в своей
      сборке (например, инструментом Pact). С модулем, который грузят во время работы, он становится обязательным.
      Когда выходит новая версия чата, сборки трёх приложений не запускаются вовсе: у них ничего не менялось.
      Их собственные тесты так и останутся зелёными, а сломаются приложения сразу у людей. Поэтому ожидания
      потребителей — «я вызываю `mount` с `locale` и жду события `chat:unread` с числом» — прогоняют в сборке
      поставщика, чата, до его выкатки.

      ## Когда чужой модуль упал

      Сбой модуля — нормальная ситуация, к которой оболочка готова заранее. Нужно решить три вещи.

      **Изоляция.** В React вокруг каждого слота ставят **границу ошибок** (error boundary): компонент, который
      ловит ошибку при отрисовке своих потомков и показывает запасной вид вместо них. Без неё, как сказано
      в документации React, неперехваченная ошибка отрисовки снимает со страницы всё дерево компонентов — это и был
      белый экран кабинета. Граница ловит не всё: ошибки в обработчиках событий, в асинхронном коде (таймеры,
      промисы) и в самой границе она пропускает — список есть в [старой документации React](https://legacy.reactjs.org/docs/error-boundaries.html#introducing-error-boundaries).
      Поэтому модуль ловит свои ошибки сам, а оболочка дополнительно слушает глобальные события `error`
      и `unhandledrejection`.

      **Запасное поведение.** Что показать вместо модуля, решают заранее, как в курсе 1 для второстепенного блока:
      спрятать, показать строку с действием или последние известные данные. Для чата — кнопка «Связаться
      с поддержкой по телефону». То же — если скрипт модуля не загрузился: у загрузки есть тайм-аут, после него
      оболочка показывает запасной вид.

      **Кому прилетает сбой.** Каждая ошибка в отчёте подписана модулем, версией и командой-владельцем, которые
      оболочка берёт из того, какой модуль она загрузила и по какому адресу лежит скрипт. Тогда предупреждение
      о росте ошибок чата приходит команде «Поддержка», а не команде страницы, где ошибка случилась. Остальной
      контекст — версия приложения, страница, флаги — как в уроке «Что происходит у пользователей» курса
      «Доставка и качество».

      ## Пример целиком: контракт окна чата

      Команды «Поддержка» и «Платформа» записали контракт и положили его рядом с кодом чата:

      ```ts
      // /chat/v2/entry.js — последняя 2.x
      export function mount(element: HTMLElement, props: {
        token: string;          // токен входа от оболочки
        locale: 'ru' | 'en' | 'ar';
        theme: 'light' | 'dark';
        orderId?: string;       // без заказа чат открывается общим
      }): { unmount(): void };

      // события на element: 'chat:unread' — { count: number }
      ```

      Число непрочитанных на кнопке «Поддержка», пока чат ещё не загружен, оболочка берёт из общего API
      уведомлений, а `chat:unread` обновляет его, пока чат открыт.

      И правила к нему:

      - чат не меняет глобальные стили — его стили только внутри его элемента;
      - свой React внутри чата: так чат не зависит от версии React у трёх приложений, а цена — около 45 КБ сверху,
        поэтому чат грузится только по нажатию кнопки «Поддержка»;
      - весь скрипт чата вместе со своим React — не больше 90 КБ сжатого JavaScript;
      - чат ловит свои ошибки и пишет их с пометкой «модуль: chat, команда: Поддержка»;
      - каждое приложение держит вокруг чата границу ошибок и тайм-аут загрузки 5 секунд, после которых показывает
        кнопку «Связаться по телефону»;
      - каждое из трёх приложений записало свои ожидания, и сборка чата прогоняет их перед выкаткой.

      Переименование `lang` в `locale` по этим правилам — ломающее изменение. Его надо было выпустить
      как v3 или принимать оба имени до тех пор, пока все приложения не перейдут на новое.

      Маленькая корзина в шапке приложения покупателя устроена так же, только внутри модульного монолита: оболочка
      даёт слот `header.cart`, команда «Корзина и оформление» подключает туда свой компонент через публичный
      интерфейс своего модуля, а слот обёрнут границей ошибок. Шапку как рамку меняет только «Платформа», содержимое
      слота — только «Корзина и оформление».

      ## Варианты и их цена

      - **Общий пакет с semver**
        - Подходит: части собираются вместе, обновлять можно в своём темпе.
        - Цена: исправление доходит, только когда потребитель обновится и выкатится.
      - **Модуль во время работы, мажорная версия в адресе**
        - Подходит: исправления должны доходить до всех сразу.
        - Цена: каждая 2.x обязана быть совместимой; нужны контракты со стороны потребителя.
      - **Модуль во время работы, всегда последняя версия**
        - Подходит: почти никогда.
        - Цена: ломающее изменение попадает ко всем без предупреждения.
      - **Точная версия у каждого потребителя**
        - Подходит: потребителю важна полная предсказуемость.
        - Цена: исправления ошибок и уязвимостей не доходят, пока потребитель не обновит версию сам.

      ## Типичные ошибки

      - **Контракт «в голове».** Никто не записал, какие параметры обязательны, — и каждое приложение передаёт своё.
      - **Модуль меняет глобальное.** Одно правило для `body` меняет вид всех страниц хозяина.
      - **Нет границы ошибок вокруг чужого модуля.** Его сбой снимает всю страницу.
      - **Ломающее изменение в патче или минорной версии.** Потребители получают его сами, не зная об этом.
      - **Ошибки модуля приходят хозяину страницы.** Чинить их некому: владелец модуля их не видит.

      ## Как спрашивают на интервью

      - «Вы встраиваете в своё приложение модуль другой команды. Что должно быть в контракте?» — ждут
        двусторонний список: данные от оболочки, обязательства модуля, события, поведение при сбое.
      - «Модуль другой команды упал при отрисовке. Что увидит пользователь?» — ждут границу ошибок, запасной вид
        и то, что граница ловит не всё.
      - «Как выпустить ломающее изменение общего модуля, не заставляя всех обновиться в один день?» — ждут
        мажорную версию рядом со старой и ожидания потребителей в сборке поставщика.

      ## Коротко

      - Контракт между командами — двусторонний: оболочка даёт модулю место, общие данные и защиту от сбоя,
        а модуль рисует только в своём элементе, убирает за собой, не трогает глобальное и сообщает о важном
        событиями.
      - Независимая выкатка требует обратной совместимости. По semver ломающее изменение — только в мажорной
        версии, а потребитель пакета указывает диапазон вроде `^4.2.0` и сам решает, когда переходить на следующую.
      - Модуль, который грузят во время работы, публикуют с мажорной версией в адресе: исправления доходят до всех
        сразу, а ломающее изменение выходит новой версией рядом со старой. Сам вход отдают с коротким сроком кэша.
      - Когда выходит модуль, который грузят во время работы, сборки потребителей не запускаются. Поэтому ожидания
        потребителей (контракты со стороны потребителя) прогоняют в сборке поставщика до выкатки.
      - Вокруг чужого модуля ставят границу ошибок с запасным видом и тайм-аут загрузки. Граница не ловит ошибки
        в обработчиках событий и асинхронном коде, поэтому модуль ловит свои ошибки сам.
      - Ошибки подписывают модулем, версией и командой-владельцем, чтобы предупреждение приходило тем, кто может
        их исправить.

      ## Источники

      - [Семантическое версионирование 2.0.0](https://semver.org/lang/ru/)
      - [Component: перехват ошибок отрисовки границей ошибок — React](https://ru.react.dev/reference/react/Component#catching-rendering-errors-with-an-error-boundary)
      - [How Pact works — Pact Docs](https://docs.pact.io/getting_started/how_pact_works)

  - id: sda-migration
    topic: Эволюция архитектуры
    subtopic: Постепенная миграция
    title: Постепенная миграция
    body: |
      ## Какую проблему решаем

      Кабинет ресторана — самое старое приложение компании. Его начали писать в 2016 году на AngularJS, а в январе
      2022 года поддержка этой библиотеки официально закончилась: исправлений ошибок и уязвимостей больше не будет.
      Нанять людей, готовых работать на AngularJS, всё труднее, а новые функции даются всё дороже.

      Первая попытка выглядела разумно. Небольшая команда начала писать новый кабинет на React «с нуля, за полгода»,
      а старый тем временем продолжал жить. За девять месяцев в старый кабинет внесли около 40 изменений: новые
      правила для чеков, зоны доставки, Дубай. Новый кабинет каждый раз приходилось догонять, к релизу он так
      и не подошёл, и проект остановили. Девять месяцев работы не дошли ни до одного ресторана.

      Урок о том, как переехать со старого кода на новый по частям: чтобы польза появлялась сразу, риск был
      маленьким, а переезд когда-нибудь заканчивался.

      ## Понятия

      - **Миграция** — переезд работающей системы со старой архитектуры или технологии на новую.
      - **Большой переезд** (big bang, или stop-the-world cutover) — пишут новую систему целиком и в один день
        переключают всех. Именно так провалилась первая попытка.
      - **Душитель** (strangler fig application) — приём постепенной замены: новая система растёт рядом со старой
        и забирает у неё функцию за функцией, пока старая не станет не нужна. Мартин Фаулер назвал его
        по фикусу-душителю, которого видел в лесах Квинсленда: фикус прорастает на дереве-хозяине, оплетает его и со временем
        стоит сам. Аналогия ломается в одном: дерево ничего не решает, а в миграции порядок, скорость и момент
        удаления старого выбирает команда.
      - **Шов** (seam) — место, где систему можно разрезать и направить часть работы в новый код, не трогая
        остальное. Для фронтенда самый удобный шов — адрес страницы.
      - **Переходная архитектура** (transitional architecture) — временный код, который нужен только пока старое
        и новое живут вместе, например правила маршрутизации между ними. Его удаляют, когда миграция закончена.
      - **Параллельный запуск** (parallel run) — старый и новый код считают одно и то же, результаты сравнивают,
        а людям пока показывают старый. Так проверяют новое на настоящих данных без риска.

      ## Почему большой переезд почти всегда проваливается

      Фаулер объясняет это так. Замена целиком идёт долго, а люди не могут ждать новых функций годами, поэтому
      старая система продолжает меняться, и новая гонится за движущейся целью. Точно описать, что делает старая
      система, очень трудно. К тому же многое из того, что она делает, давно никому не нужно, и переписывать это —
      потерянное время.

      Отсюда ловушка, которую авторы «Patterns of Legacy Displacement» называют **«точно как было»** (feature
      parity): обещание сделать новую систему, которая умеет ровно всё то же, что старая, только на новой технологии.
      Звучит безопасно, но требует переписать и то, чем никто не пользуется, и заканчивается большим переездом.
      Перед переносом функции сначала измеряют, пользуются ли ею.

      ## Как переезжает фронтенд по частям

      **Общий вход.** Перед обоими приложениями стоит прокси — например, на CDN или веб-сервере. Он смотрит на адрес
      и отправляет `/restaurant/reports` в новое приложение, а `/restaurant/menu` — пока в старое. Для ресторана это
      один кабинет по одному адресу.

      **Общая сессия.** Оба приложения на одном домене, поэтому cookie сессии видят оба, и войти нужно один раз.

      **Переходы между старым и новым.** Внутри одного приложения переходы мгновенные, а между старым и новым
      разделом — полная загрузка страницы. Это цена переходного периода, и её стоит учесть в порядке переезда:
      разделы, между которыми люди постоянно ходят, лучше переносить вместе.

      **Общий вид.** Шапку и меню разделов делают одинаковыми в обоих приложениях. Иногда новый компонент встраивают
      в старое приложение, обернув его в Web Component, — тогда шапку не приходится писать дважды.

      **Общие данные и их формат.** Оба приложения работают с одним API и видят одни данные. Главное правило
      переходного периода: **пока возможен откат, новое приложение пишет данные в формате, который понимает
      старое.** Например, новое меню хочет хранить добавки к блюду списком объектов, а старое читает их строкой
      через запятую. Пока возможен откат, новое пишет строку: иначе откат на старый раздел встретит данные,
      которые старый код не прочитает. Формат меняют
      отдельным шагом, приёмом «добавить рядом, перевести, удалить», — урок «Эволюция контрактов и данных».

      Внутри кода тот же подход называют **ветвлением через абстракцию** (branch by abstraction; Пол Хаммант,
      описано у Фаулера): старую реализацию закрывают интерфейсом, переводят вызовы на интерфейс, рядом пишут новую
      реализацию, переключают и удаляют старую. Так меняют, например, библиотеку или клиент API, не останавливая
      выкатку.

      ## Порядок, откат и конец

      **Порядок.** Первым разделом берут такой, где ошибка стоит недорого, но польза заметна, — на нём команда
      отлаживает сам процесс переезда. Самое нагруженное и рискованное переносят последним, когда процесс уже
      проверен. Противоположный подход — начать с самого ценного — даёт пользу раньше, но учиться приходится
      на самом опасном.

      **Выкатка по шагам.** Каждый перенесённый раздел включают сначала части ресторанов: прокси отправляет
      в новое приложение 5 % ресторанов, потом 25 %, потом всех — как выкатку по шагам из курса «Доставка
      и качество», «Проверки и выкатка».

      **Точка отката.** Для каждого раздела есть способ за минуты вернуть людей в старый код: переключатель
      маршрута в прокси. Старый код раздела удаляют не сразу после переезда, а когда выполнен критерий окончания.

      **Критерий окончания.** Его записывают заранее: например, «старым разделом не открывали две недели подряд —
      удаляем маршрут в прокси и старый код». У миграции есть владелец и срок. Без этого переходная архитектура
      становится постоянной: две системы, два набора ошибок, двойная цена любого изменения.

      ![Прокси на входе кабинета ресторана: адреса отчётов и сотрудников уже идут в новое приложение на React, меню, стоп-лист, настройки и заказы пока идут в старое на AngularJS; общая сессия в cookie; под схемой — порядок переезда по месяцам и точка отката для каждого раздела](images/sda-migration.png "Душитель: новое забирает раздел за разделом")

      ## Пример целиком: кабинет ресторана

      В кабинете шесть разделов: заказы, меню, стоп-лист, отчёты, сотрудники, настройки. Пользуются им 1 200
      ресторанов. Вторая попытка переезда шла так.

      1. **Шов и общий вход.** Команда поставила прокси перед кабинетом и научила его направлять разделы в новое
         приложение по адресу и по номеру ресторана. Новое приложение на React — с той же шапкой и тем же входом.
      2. **Отчёты — первыми.** Они только читают данные, ошибка в них не сорвёт ни одного заказа, а ресторанам новые
         отчёты нужны давно. Две недели шёл параллельный запуск: новые отчёты считались рядом со старыми, суммы
         сравнивались каждую ночь, а рестораны видели старые. Нашли три расхождения: округление возвратов
         и два случая, когда смену ресторана в Дубае относили не к тому дню из-за часового пояса. После исправления
         отчёты включили 5 % ресторанов, потом всем.
      3. **Сотрудники, потом меню со стоп-листом.** Меню и стоп-лист перенесли вместе: менеджеры постоянно
         переходят между ними, и полная загрузка страницы на каждом переходе раздражала бы.
      4. **Настройки.** При подсчёте оказалось, что печатью накладных в формате 2016 года пользуются 3 ресторана
         из 1 200. Её не переносили: с этими ресторанами договорились о новом формате.
      5. **Заказы — последними.** Это самый нагруженный раздел, в пятницу вечером в нём сидят все рестораны сразу.
         Его выкатывали дольше всех, начиная с 1 % ресторанов, а переключатель отката держали наготове месяц.
      6. **Конец.** Через год и два месяца старым кабинетом две недели не пользовался никто. Маршрут в прокси
         и старый код удалили, AngularJS ушёл из зависимостей.

      Польза появлялась по ходу: новые отчёты рестораны получили через два месяца, а не через полтора года.

      ## Варианты и их цена

      - **Большой переезд**
        - Подходит: маленькая система, которую можно переписать быстрее, чем она изменится.
        - Цена: польза только в конце; погоня за старой системой; один рискованный день переключения.
      - **Душитель по адресам**
        - Подходит: приложение делится на разделы с разными адресами.
        - Цена: прокси и переходная архитектура; полная загрузка между старым и новым; два приложения на время
          переезда.
      - **Новое внутри старого**
        - Как: новые компоненты встраивают в старое приложение, например через Web Components.
        - Подходит: разделы не делятся по адресам, а меняются по частям экрана.
        - Цена: две библиотеки на одной странице, тяжелее и сложнее отлаживать.
      - **Ветвление через абстракцию**
        - Подходит: заменить библиотеку или слой внутри кода.
        - Цена: интерфейс, который поначалу кажется лишним, и временно две реализации.

      ## Типичные ошибки

      - **Переписать всё и переключить разом.** Новая система не догоняет старую, а польза откладывается до конца.
      - **Переносить всё «как было».** Половина старых функций никому не нужна, и переписывать её — потерянное время.
      - **Менять формат данных посреди миграции.** Откат на старый раздел ломается: старый код не читает новые данные.
      - **Нет критерия окончания.** Миграция застревает на 90 %, и две системы живут годами.
      - **Начинать с самого рискованного раздела.** На нём же приходится учиться самому процессу переезда.

      ## Как спрашивают на интервью

      - «Как перевести большое приложение с AngularJS на React, не останавливая разработку?» — ждут душитель, шов
        по адресам, порядок разделов и точки отката.
      - «Почему переписать с нуля — плохая идея?» — ждут погоню за движущейся целью, ловушку «как было» и риск
        одного дня переключения.
      - «Как понять, что миграция закончена?» — ждут заранее записанный критерий, владельца и удаление
        переходного кода.

      ## Коротко

      - Большой переезд — переписать целиком и переключить в один день — почти всегда проваливается: старая система
        продолжает меняться, новая её догоняет, а польза откладывается до конца.
      - Душитель (strangler fig): новое растёт рядом со старым и забирает функцию за функцией через шов. Для фронтенда
        удобный шов — адрес: прокси на входе отправляет каждый раздел в старое или новое приложение.
      - Перед переносом функции проверяют, пользуются ли ею: обещание «точно как было» заставляет переписывать
        ненужное и ведёт к большому переезду.
      - Пока возможен откат, новое пишет данные в формате, который понимает старое; формат меняют отдельным шагом.
      - Первым переносят раздел, где ошибка стоит недорого, а польза заметна; самое рискованное — последним,
        с выкаткой по шагам и переключателем отката.
      - Параллельный запуск проверяет новое на настоящих данных: оба считают, результаты сравнивают, людям
        показывают старое.
      - Критерий окончания, владелец и срок записывают заранее, иначе переходная архитектура становится
        постоянной и две системы живут годами.

      ## Источники

      - [Strangler Fig Application — Martin Fowler](https://martinfowler.com/bliki/StranglerFigApplication.html)
      - [Patterns of Legacy Displacement — Ian Cartwright, Rob Horn, James Lewis](https://martinfowler.com/articles/patterns-legacy-displacement/)
      - [Branch By Abstraction — Martin Fowler](https://martinfowler.com/bliki/BranchByAbstraction.html)

  - id: sda-contracts
    topic: Эволюция архитектуры
    subtopic: Эволюция контрактов и данных
    title: Эволюция контрактов и данных
    body: |
      ## Какую проблему решаем

      Статус заказа в API — строка `status` со значениями `created`, `paid`, `cooking`, `on_the_way`, `delivered`,
      `cancelled`. Бэкенду понадобилось хранить, с какого момента заказ в этом статусе и почему его отменили.
      Он заменил строку объектом `state: { code, since, reason }` и сделал всё по правилу из курса «Доставка
      и качество», урок «Кэш файлов и выкатка новой версии»: «расширить и сузить». Неделю сервер отдавал оба поля,
      все веб-приложения перешли на `state`, по заголовку `X-App-Version` было видно, что старых вкладок
      не осталось, — и `status` удалили.

      На следующий день начались жалобы. У покупателей со старыми версиями мобильного приложения экран заказа стал пустым:
      эти версии ищут `status`, а его больше нет. Таких покупателей 4 % — у них приложение не обновлялось больше
      полугода. Ещё через неделю выяснилось, что сломалась ночная выгрузка заказов для партнёров: её делали
      два года назад, и о ней никто не вспомнил.

      Правило «неделя и версия веб-клиента» рассчитано на открытые вкладки, которые закрываются за часы и дни.
      На масштабе потребители живут месяцами, часть из них вы не контролируете, а о некоторых даже не знаете.
      Урок о том, во что превращается приём «расширить и сузить» в этих условиях.

      ## Понятия

      - **Потребитель контракта** — любой, кто читает или вызывает API: другие команды, мобильные приложения,
        партнёры, ночные выгрузки, старые вкладки браузера.
      - **Ломающее изменение** — изменение, после которого старый потребитель работает неправильно. Очевидные:
        удалить или переименовать поле, поменять его тип, сделать необязательное поле запроса обязательным.
        Неочевидные: поменять смысл без смены формы (рубли стали копейками — курс 1) и добавить новое значение
        в перечисление, если потребитель не готов к незнакомым значениям.
      - **Устаревшее** (deprecated) — часть контракта, которая ещё работает, но скоро будет удалена; потребителям
        пора переходить.
      - **Параллельное изменение** (parallel change, или expand and contract) — смена контракта в три фазы:
        расширить (добавить новое рядом со старым), перевести потребителей, сузить (удалить старое). Это тот же
        приём «добавить рядом, перевести, удалить» из курса 1 и «расширить и сузить» из курса «Доставка
        и качество». Описал его Данило Сато на сайте Мартина Фаулера.
      - **Терпимый читатель** (tolerant reader) — потребитель, который берёт из ответа только нужные ему поля
        и не падает на незнакомом. Фаулер выводит этот совет из правила Постела: строго к тому, что отправляешь,
        терпимо к тому, что принимаешь.

      ## Что добавляет масштаб

      Пока потребители — свои открытые вкладки, «расширить и сузить» занимает около недели: столько живут вкладки.
      На масштабе каждая
      фаза растягивается.

      - **Потребителей много и у них свои графики.** Пять команд переходят на новое поле, когда дойдут до этой
        задачи, а не в день выкатки бэкенда.
      - **Часть потребителей вы не обновляете.** Мобильное приложение живёт у людей месяцами: кто-то отключил
        автообновление, у кого-то старый телефон. Веб-клиент обычно обновляется при следующем открытии, а открытые
        вкладки и PWA — за часы или дни (курс «Доставка и качество»). Мобильный — когда захочет человек.
      - **О части потребителей вы не знаете.** Выгрузка для партнёров, скрипт аналитика, интеграция, которую
        сделали три года назад. Узнать о них можно только измерением.
      - **У данных тоже есть потребители.** Записи в базе, данные на устройствах (курс «Синхронизация и офлайн»,
        урок «Синхронизация после долгого офлайна»), события в очередях и журналах читает код разных версий.

      Поэтому «сузить» на масштабе — не шаг, а процесс.

      ## Как удаляют старое

      1. **Добавить новое рядом.** `state` появляется, а `status` остаётся и продолжает заполняться.
      2. **Пометить старое устаревшим.** В GraphQL для этого есть директива `@deprecated(reason: "…")`: по спецификации
         устаревшее поле по-прежнему можно запрашивать, а инструменты показывают его зачёркнутым и предупреждают.
         В описании REST API по OpenAPI у поля или метода ставят `deprecated: true`. Когда устаревает ресурс целиком,
         например `/v1/orders`, есть и заголовки ответа: `Deprecation` (RFC 9745) говорит, что ресурс устарел или
         устареет с такой-то даты, а `Sunset` (RFC 8594) — когда он перестанет отвечать. Сам по себе `Deprecation`
         поведение не меняет: ресурс работает как раньше.
      3. **Измерить, кто ещё пользуется.** Каждый клиент сообщает своё имя и версию в заголовке запроса — как версия
         приложения в курсе «Доставка и качество», урок «Кэш файлов и выкатка новой версии». Сервер считает,
         сколько запросов ещё читают старое и от кого они. В GraphQL удобно считать по полям: какие клиенты
         запрашивают `status`.
      4. **Сообщить владельцам и дать срок.** По измерению видно, к кому идти. Владельцу каждого потребителя
         называют дату удаления и объясняют, на что переходить.
      5. **Закрыть старые версии мобильных приложений.** Для версий, которые никогда не перейдут на новое,
         назначают **минимальную поддерживаемую версию**: ниже неё приложение показывает экран «Обновите
         приложение». Это тот же ответ «клиент устарел» из курса «Доставка и качество», только для приложения
         из магазина. Решение продуктовое: оно отрезает часть людей, поэтому порог выбирают по измерению.
      6. **Удалить,** когда использование упало до согласованного порога и срок прошёл.

      ## Новое значение — тоже изменение контракта

      Через месяц после `state` понадобился новый статус: «передан другому курьеру», `handed_over`. Казалось бы,
      ничего не удаляют — только добавляют. Но в iOS-приложении статус описан перечислением, и стандартный разбор
      JSON в Swift бросает ошибку на незнакомом значении — падает разбор всего ответа, а не одного поля.

      Защищаются с двух сторон:

      - **Потребитель — терпимый читатель.** У перечисления есть ветка «неизвестное значение», и экран показывает
        что-то разумное: «Статус обновился, потяните вниз». Незнакомые поля потребитель игнорирует. Это делают
        до того, как понадобится новое значение, — иначе старые версии останутся хрупкими навсегда.
      - **Поставщик не меняет словарь старого поля.** Новое значение появляется только в `state.code`, а старый
        `status` для этого заказа продолжает отдавать `on_the_way`. Старые потребители видят знакомое значение,
        новые — точное.

      ## Способы развивать API

      - **Только добавлять** (additive-only). Поля не удаляют и не меняют, только добавляют новые и помечают
        устаревшие. Так принято развивать GraphQL-схемы. Цена — схема обрастает старым, и рано или поздно
        его всё равно приходится убирать описанным выше процессом.
      - **Версии API** (`/v1/orders`, `/v2/orders`). Ломающее изменение выходит новой версией, старая живёт
        рядом. Цена — сервер поддерживает обе версии, а исправления приходится делать дважды. Поэтому новую
        версию выпускают редко и для больших изменений.
      - **Контракты со стороны потребителя** (курс «Доставка и качество», урок «Проверки и выкатка») ловят ломающее изменение в сборке
        поставщика — но только у тех потребителей, которые записали свои ожидания. Ночную выгрузку, о которой
        все забыли, найдёт только измерение.

      **Большой разовый переезд** — договориться со всеми и переключить в один день — на масштабе почти никогда
      не получается: всегда найдётся потребитель, который не успел или о котором не знали. Последовательная
      совместимая смена дольше, но на каждом шаге всё работает.

      ## Пример целиком: от `status` к `state`

      После истории с пустыми экранами бэкенд вернул `status`, и смену провели заново.

      1. **Неделя 0.** В ответе заказа оба поля: `status` и `state`. В схеме GraphQL и в описании OpenAPI `status`
         помечен устаревшим с пояснением «Используйте state.code» и датой удаления.
      2. **Недели 1–4.** Пять веб-потребителей — покупатель, кабинет ресторана, кабинет поддержки, курьер
         и выгрузка для партнёров — переходят на `state`. Выгрузку нашли по измерению: запросы с именем клиента
         `partner-export`.
      3. **Недели 3–6. Данные на устройствах.** PWA курьера хранит заказы смены в IndexedDB, и в старых записях
         есть только `status` (курс «Синхронизация и офлайн», урок «Данные живут на устройстве»). Новая версия
         при чтении понимает обе формы: если `state` нет, строит его из `status`. Пока в другой вкладке может
         работать старая версия, новая пишет в хранилище оба поля. Можно было поднять номер версии базы и перенести
         все записи разом, как в курсе «Синхронизация и офлайн». Но хранилища и индексы не менялись, так что новый
         номер не обязателен, а его смена заставила бы старую вкладку закрыть базу посреди смены курьера. Поэтому
         новая версия, прочитав старую запись, дописывает в неё `state`, не убирая `status`. Цена выбора — какое-то
         время в базе лежат записи двух видов, и читающий код понимает оба.
      4. **Месяц 2.** В мобильных приложениях вышли версии, которые читают `state` и терпимо относятся
         к незнакомым значениям. Только после этого появился `handed_over` — и только в `state.code`.
      5. **Месяц 6.** `status` читают 0,3 % запросов, все — от версий, которые старше той, что станет минимальной.
         Минимальную версию подняли, и ниже неё приложение просит обновиться.
      6. **Месяц 7.** `status` удалили из ответа. Дату удаления команды знали с недели 0.

      ## Варианты и их цена

      - **Переименовать и выкатить**
        - Подходит: один потребитель, который выходит одновременно с поставщиком.
        - Цена: ломает всех, кто не успел обновиться.
      - **Параллельное изменение с измерением**
        - Подходит: почти всегда на масштабе.
        - Цена: месяцы двух полей, учёт клиентов, переговоры с владельцами.
      - **Новая версия API**
        - Подходит: много ломающих изменений сразу.
        - Цена: две версии на сервере, исправления дважды.
      - **Минимальная версия приложения**
        - Подходит: последние старые клиенты, которые сами не обновятся.
        - Цена: часть людей должна обновиться, прежде чем продолжит пользоваться продуктом.

      ## Типичные ошибки

      - **Удалять поле, потому что «наши клиенты уже обновлены».** Мобильные версии и забытые выгрузки так
        не считают.
      - **Удалять без измерения.** О части потребителей узнают только после поломки.
      - **Считать добавление значения безопасным.** Строгий потребитель падает на незнакомом значении.
      - **Менять словарь старого поля.** Новое значение в старом поле ломает тех, ради кого старое поле оставили.
      - **Помечать устаревшим без срока.** Никто не переходит, и через год у схемы два поля навсегда.

      ## Как спрашивают на интервью

      - «Как переименовать поле в API, которым пользуются мобильные приложения?» — ждут параллельное изменение,
        пометку, измерение и минимальную версию.
      - «Добавить значение в перечисление — это ломающее изменение?» — ждут: да, для строгих потребителей; терпимый
        читатель и старое поле со старым словарём.
      - «Версии API или эволюция без версий — что выберете?» — ждут цену каждого варианта.

      ## Коротко

      - На масштабе у контракта много потребителей со своими графиками: другие команды, мобильные приложения,
        которые живут месяцами, партнёры и забытые выгрузки. Поэтому удаление старого — процесс, а не шаг.
      - Параллельное изменение (расширить, перевести, сузить): новое добавляют рядом, старое помечают устаревшим —
        `@deprecated` в GraphQL, `deprecated` в OpenAPI, заголовок `Deprecation` для ресурса целиком, — и оно
        продолжает работать.
      - Кто ещё пользуется старым, узнают измерением: клиенты сообщают имя и версию, сервер считает запросы.
        Владельцам дают срок, а последние старые мобильные версии закрывают минимальной поддерживаемой версией.
      - Новое значение в перечислении ломает строгого потребителя. Потребители заранее становятся терпимыми
        читателями, а новое значение появляется только в новом поле, старое сохраняет старый словарь.
      - Версии API позволяют выпустить много ломающих изменений сразу, но сервер держит обе версии. Только
        добавлять проще, но схема обрастает старым.
      - Данные, сохранённые на устройстве, тоже потребитель контракта: новая версия читает старые записи, а пока
        может работать старая версия, пишет и старое поле.
      - Контракты со стороны потребителя ловят поломку у тех потребителей, кто записал ожидания, а забытых находит только
        измерение.

      ## Источники

      - [Parallel Change — Danilo Sato, martinfowler.com](https://martinfowler.com/bliki/ParallelChange.html)
      - [Tolerant Reader — Martin Fowler](https://martinfowler.com/bliki/TolerantReader.html)
      - [RFC 9745: The Deprecation HTTP Response Header Field](https://www.rfc-editor.org/rfc/rfc9745.html)

  - id: sda-tech-debt
    topic: Эволюция архитектуры
    subtopic: Технический долг как решение
    title: Технический долг как решение
    body: |
      ## Какую проблему решаем

      Клиентом API `api-core` пользуются все восемь команд. Его написали четыре года назад, когда команда была одна:
      у него свой кэш, свои повторы — три попытки на каждый запрос, — и нет типов ответов. Каждый новый вызов API
      требует около дня ручной работы: описать запрос, разобрать ответ, проверить ошибки.

      Год назад команды попросили «квартал на рефакторинг». Руководитель разработки отказал: «Что мы получим?»
      Ответить было нечего, кроме «станет лучше». Теперь все снова говорят, что `api-core` мешает, а руководитель
      задаёт тот же вопрос: переписывать его три месяца — стоит ли?

      Урок о том, как говорить о техническом долге на языке решений: когда его брать, когда отдавать, как
      обосновать вложение числами и как записать решение, чтобы его пересмотрели вовремя.

      ## Понятия

      - **Технический долг** (technical debt) — недостатки в коде и архитектуре, из-за которых каждое следующее
        изменение обходится дороже, чем могло бы. Метафору придумал Уорд Каннингем в 1992 году.
      - **Основной долг** (principal) — сколько стоит исправить недостаток: переписать модуль, распутать связи.
      - **Проценты** (interest) — сколько лишнего труда недостаток добавляет к каждому изменению. Пример Фаулера:
        функция в чистом коде заняла бы четыре дня, а в запутанном занимает шесть — два лишних дня и есть проценты.
      - **Горячая точка** (hotspot) — место в коде, которое одновременно часто меняют и трудно менять. Адам Торнхилл
        в книге «Your Code as a Crime Scene» предлагает находить их по истории системы контроля версий: какие
        файлы меняются чаще всего и насколько они сложны.

      Метафора долга хорошо объясняет главное: долг можно брать осознанно, но за него платят. Ломается она в одном
      месте, и Фаулер прямо об этом пишет: по настоящему долгу проценты капают со временем, а по техническому —
      только когда вы трогаете этот код. Запутанный модуль, который никто не меняет, процентов не берёт.

      ## Квадрант долга

      Фаулер делит долг по двум вопросам: знали ли вы, что берёте долг, и разумно ли это было.

      - **Безрассудный и осознанный:** «Нам некогда делать как следует». Команда знает, как правильно, но решает
        сделать быстро и грязно, не оценив, во что это обойдётся.
      - **Разумный и осознанный:** «Выпускаем сейчас, разберёмся с последствиями потом». Команда понимает, что
        берёт долг, и сравнивает выгоду раннего выпуска с ценой расплаты.
      - **Безрассудный и неосознанный:** «Что такое границы модулей?» Команда не знает, как сделать хорошо,
        и не видит, что копит долг.
      - **Разумный и неосознанный:** «Теперь мы понимаем, как надо было сделать». Даже сильная команда узнаёт
        правильное устройство системы, только пожив с ней. Фаулер считает такой долг неизбежным.

      Квадрант помогает не стыдить, а различать. Разумный осознанный долг — нормальный инструмент: он покупает
      скорость там, где она важнее. Безрассудный — повод учиться. Неосознанный разумный — повод пересмотреть
      архитектуру, когда вы поняли больше.

      ## Когда брать долг

      Долг берут осознанно, когда ранний выпуск стоит дороже будущих процентов, и записывают:

      - что именно сделали упрощённо;
      - сколько это будет стоить, если оставить;
      - кто владелец и когда вернутся к решению.

      Пример: акцию к открытию сервиса в Дубае за три недели сделали без общего механизма скидок, отдельной веткой
      кода в оформлении. Это разумный осознанный долг: акция идёт одну неделю, а общий механизм занял бы два
      месяца. Владелец — «Корзина и оформление», срок пересмотра — следующая акция.

      ## Когда отдавать долг

      Отдавать долг стоит там, где высоки проценты: в коде, который часто меняют. Отсюда правило, которое советует
      Фаулер, — отдавать долг постепенно, в первую очередь там, где идёт работа, а запутанный, но стабильный код
      можно не трогать.

      Где проценты высоки, видно по сигналам:

      - **время изменения:** сколько дней уходит на типовую задачу в этой части кода;
      - **доля неудачных изменений:** сколько выкаток в этой части откатили или срочно исправляли;
      - **инциденты:** сколько сбоев у пользователей связано с этой частью;
      - **кто трогает:** сколько команд меняют этот код и как часто — горячие точки по истории репозитория;
      - **цена новичка:** сколько времени новый человек осваивает эту часть.

      Для всей системы доставки изменений есть признанный набор метрик — **метрики DORA** (исследовательская
      программа DevOps Research and Assessment). Сейчас их пять, в двух группах:

      - **пропускная способность:** время от коммита до работы у людей, частота выкаток, время восстановления после
        неудачной выкатки;
      - **стабильность:** доля выкаток, которые пришлось срочно исправлять или откатывать, и доля незапланированных
        выкаток из-за сбоев.

      DORA предупреждает: метрики — чтобы команда видела свой прогресс со временем, а не цель с планом и не способ
      сравнивать команды между собой. Как только число становится целью, его начинают подгонять.

      ## Как обосновать вложение

      Обоснование — не «станет лучше», а сравнение двух сумм: сколько стоят проценты, если ничего не делать,
      и сколько стоит основной долг вместе с переездом. К этому добавляют риск: что сломается, пока переделывают.

      Способы отдать долг различаются риском:

      - **переписать разом** — большой переезд из прошлого урока, с теми же опасностями;
      - **заменять постепенно** — новое рядом со старым, ветвлением через абстракцию (урок «Постепенная миграция»);
      - **при каждом касании** — кто меняет модуль, заодно переводит его на новое;
      - **постоянная доля времени** — команда заранее договаривается, какую часть каждого цикла отдаёт на долг.

      Решение записывают в ADR — короткий документ о решении из курса 1, «Риски и развитие решения». Для долга
      в нём особенно важно **условие пересмотра**: наблюдаемое событие, после которого к решению возвращаются.
      Без него решение «пока не трогаем» живёт вечно.

      ## Пример целиком: `api-core`

      В этот раз команда «Платформа» пришла с числами за полгода:

      - новый вызов API — около дня ручной работы; команды добавляют примерно 24 вызова в месяц, значит, около
        24 человеко-дней в месяц уходит на одно только описание запросов;
      - 9 из 31 инцидента фронтенда связаны с `api-core`: двойные повторы (три попытки клиента, умноженные
        на повторы BFF, — курс 2, «Когда и как повторять»), устаревший кэш, неразобранные ошибки;
      - его правят 6 команд, и 40 % изменений в нём приходилось откатывать или срочно исправлять.

      Варианты:

      1. **Переписать `api-core` целиком за три месяца** — восемь команд ждут, переезд одним днём.
      2. **Новый клиент рядом:** типы ответов генерируются из схемы API, повторы — по правилам курса 2. Два человека
         за шесть недель — около 60 человеко-дней. Новый вызов в нём описывается часа за два. Все новые вызовы —
         только через новый клиент, старые переводят, когда команда трогает модуль.
      3. **Ничего не делать** — проценты около 24 человеко-дней в месяц плюс инциденты.

      Выбрали второй. Экономия только на описании запросов — около 18 человеко-дней в месяц (24 вызова, на каждом
      сберегается три четверти дня), так что 60 вложенных дней окупаются примерно за три-четыре месяца, даже
      не считая инцидентов. При этом ничего не останавливается, и замена проходит по частям. ADR записали так:

      - **Контекст:** `api-core` — горячая точка: 6 команд, 40 % неудачных изменений, 9 из 31 инцидента.
      - **Решение:** новый клиент рядом; новые вызовы только через него; старые — при касании; линтер запрещает
        новые импорты `api-core`.
      - **Альтернативы:** переписать целиком за три месяца — отклонено: восемь команд ждут, а переключение одним
        днём рискованно; ничего не делать — отклонено: около 24 человеко-дней в месяц и инциденты.
      - **Последствия:** полгода два клиента; «Платформа» владеет обоими.
      - **Условие пересмотра:** если через полгода через `api-core` идёт больше трети вызовов — выделить время
        и перевести остаток целенаправленно.

      ## Варианты и их цена

      - **Жить с долгом**
        - Подходит: код стабилен, его почти не трогают.
        - Цена: проценты при каждом касании; со временем знающих людей всё меньше.
      - **Отдавать при касании**
        - Подходит: долг размазан по коду, который всё равно меняют.
        - Цена: медленно; редко трогаемые места остаются старыми.
      - **Заменять постепенно**
        - Подходит: горячая точка, которой пользуются многие.
        - Цена: два решения на время замены; нужен критерий окончания.
      - **Переписать разом**
        - Подходит: небольшая часть, которую можно заменить быстрее, чем она изменится.
        - Цена: польза только в конце; риск одного дня переключения.

      ## Типичные ошибки

      - **Просить время на рефакторинг без чисел.** «Станет лучше» не сравнить с новыми функциями.
      - **Отдавать долг там, где проценты низкие.** Красиво переписанный модуль, который никто не трогает, ничего
        не экономит.
      - **Брать долг молча.** Через год никто не помнит, что упрощение было временным.
      - **Делать метрики целью.** Частота выкаток растёт, а работа не ускоряется: выкатки просто стали мельче.
      - **ADR без условия пересмотра.** Решение «пока не трогаем» живёт вечно.

      ## Как спрашивают на интервью

      - «Как вы убедите руководство выделить время на рефакторинг?» — ждут проценты и основной долг в числах,
        сигналы и постепенную замену.
      - «Какой технический долг допустим?» — ждут квадрант Фаулера и разумный осознанный долг с записью.
      - «Какие метрики покажут, что архитектура мешает доставке?» — ждут метрики DORA и сигналы по горячим точкам.

      ## Коротко

      - Технический долг — недостатки, из-за которых каждое изменение дороже. Основной долг — цена исправления,
        проценты — лишний труд при каждом изменении, и платят их, только когда трогают этот код.
      - Квадрант Фаулера делит долг на осознанный и неосознанный, разумный и безрассудный. Разумный осознанный долг —
        нормальный инструмент, если записано, что упростили, во что это обойдётся и кто вернётся к решению.
      - Отдавать долг выгодно там, где проценты высоки: в горячих точках, которые часто меняют и трудно менять.
        Стабильный запутанный код можно не трогать.
      - Вложение обосновывают сравнением процентов за период с ценой исправления и риском, а сигналы берут
        из времени изменений, доли неудачных выкаток, инцидентов и истории репозитория.
      - Метрики DORA — пять показателей доставки изменений в двух группах, пропускная способность и стабильность.
        Это способ видеть свой прогресс, а не цель и не рейтинг команд.
      - Горячую точку, которой пользуются многие, обычно заменяют постепенно, а не переписывают разом. Решение
        записывают в ADR с условием пересмотра.

      ## Источники

      - [Technical Debt — Martin Fowler](https://martinfowler.com/bliki/TechnicalDebt.html)
      - [Technical Debt Quadrant — Martin Fowler](https://martinfowler.com/bliki/TechnicalDebtQuadrant.html)
      - [DORA's software delivery performance metrics — dora.dev](https://dora.dev/guides/dora-metrics-four-keys/)

  - id: sda-tradeoffs
    topic: Архитектура под ограничениями
    subtopic: Конфликтующие атрибуты качества
    title: Когда требования спорят
    body: |
      ## Какую проблему решаем

      В «Чёрную пятницу» сервис доставки продаёт 1 000 пицц «Маргарита» за полцены в 15 ресторанах, и трафик
      вечером в пять раз выше обычного пика. Маркетинг перечисляет пожелания:

      - меню открывается мгновенно у всех;
      - на карточке пиццы точный остаток: «Осталось 37»;
      - рекомендации персональные, как всегда;
      - новых серверов не покупать: акция на один вечер;
      - ни одной ошибки при оплате.

      В прошлом году попробовали выполнить всё сразу. Ради точного остатка меню стали отдавать не из CDN, а прямо
      с сервера, при каждом открытии. В 19:05 сервер меню не выдержал, и 40 минут никто не мог оформить заказ:
      ни акционную пиццу, ни обычную.

      Все пожелания по отдельности разумны. Вместе они невыполнимы. Урок о том, как это увидеть заранее, что
      можно пожертвовать и чего нельзя нарушать ни ради чего.

      ## Понятия

      В курсе 1, в уроке «Как превратить „быстро“ в цифры», уже было главное правило: когда качества спорят,
      приоритет задаёт заказчик, а архитектор показывает цену каждого варианта. Здесь — как найти места, где
      качества спорят, и как договориться о решении.

      - **Атрибут качества** — насколько хорошо система делает своё: быстро, надёжно, свежо, дёшево, просто
        (курс 1).
      - **Точка чувствительности** (sensitivity point) — решение или параметр, от которого сильно зависит одно
        качество. Например, срок свежести меню в CDN: от него зависит нагрузка на сервер.
      - **Точка компромисса** (tradeoff point) — точка чувствительности сразу для нескольких качеств, причём тянут
        они в разные стороны. Тот же срок свежести: чем он длиннее, тем быстрее меню и меньше нагрузка, но тем
        старее остаток. Оба понятия взяты из метода ATAM (Architecture Tradeoff Analysis Method) Института
        программной инженерии Университета Карнеги — Меллона, который оценивает архитектуру по сценариям качества.
      - **Инвариант** — то, что должно оставаться верным всегда (курс 1, «Риски и развитие решения»). Ради
        скорости или цены инвариант не нарушают.
      - **Невозможная комбинация** — набор гарантий, который нельзя выполнить одновременно, как бы хорошо
        ни работала команда.

      ## Невозможные комбинации

      Некоторые пары и тройки качеств несовместимы по самому устройству системы. Их полезно узнавать сразу,
      чтобы не тратить время на поиск решения, которого нет.

      - **Работа без сети и строгая согласованность.** Действие, которое разрешено только по последнему
        подтверждённому состоянию, требует ответа сервера — без сети его не выполнить (курс «Синхронизация
        и офлайн»).
      - **Точная свежесть, ответ из кэша и малая нагрузка.** Кэш потому и снимает нагрузку, что отдаёт копию,
        а копия хоть немного устарела. Хотите точность — каждый запрос идёт к источнику.
      - **Запас на пятикратный пик и никаких новых затрат.** Мощность либо есть заранее, либо её нет; от
        экономии остаётся только уменьшить работу на запрос.
      - **Персональное и общее для всех.** Ответ, разный для каждого человека, не положишь в общий кэш CDN.

      Если в требованиях невозможная комбинация, честный ответ — не «постараемся», а выбор: что из этого важнее,
      или как изменить обещание продукта, чтобы противоречие исчезло.

      ## Как договориться

      1. **Записать сценарии с числами.** Не «быстро», а «меню открывается за 2,5 секунды на 75-м процентиле
         при пятикратном трафике» (курс 1).
      2. **Найти точки компромисса.** Какие решения влияют на несколько сценариев сразу: срок свежести кэша, где
         проверяется остаток, что считается заранее, что отключается при нагрузке.
      3. **Назвать инварианты.** Их немного, обычно это деньги, однократность действий, доступ к чужим данным
         и закон. Их не обменивают на скорость. Инварианты проверяет сервер в самом действии — при оформлении,
         оплате, бронировании, — а не экран по кэшу.
      4. **Для остального выбрать приоритет** вместе с заказчиком и записать, чем платим.
      5. **Изменить обещание там, где это дешевле всего.** Часто противоречие исчезает, если экран обещает
         чуть меньше: «осталось около 300» вместо «осталось 37».

      Последний шаг — самый недооценённый. Требование звучит как «точный остаток», но людям нужен не точный
      остаток, а уверенность, что пиццу ещё можно купить и что их не обманут. Это обещание можно выполнить
      дешевле.

      ## Пример целиком: «Чёрная пятница»

      Команда разобрала пожелания по сценариям.

      **Точки компромисса.**
      - Срок свежести меню и каталога в CDN: быстрее и легче для сервера против свежести остатка.
      - Где проверять остаток: на каждом открытии меню (точно, но дорого) или при оформлении (дёшево, но экран
        может показать пиццу, которая уже кончилась).
      - Рекомендации: персональные ответы нельзя кэшировать на CDN, и в пик они дают заметную долю нагрузки.

      **Инварианты.**
      - не продать больше 1 000 акционных пицц;
      - не списать больше суммы, которую человек видел перед оплатой;
      - не создать двойной заказ;
      - не показать человеку чужой заказ.

      **Решения.**
      1. Меню и каталог отдаются из CDN со сроком свежести 60 секунд — так в пик сервер меню получает в десятки раз
         меньше запросов. Каталог по-прежнему рисует SSR, но на этот вечер CDN держит готовую страницу для каждого
         адреса 60 секунд: это возможно, потому что персональные рекомендации выключены (решение 4).
      2. Остаток акции на экране — примерный: «Осталось около 300», «Осталось мало», «Закончилась». Он обновляется
         раз в 60 секунд вместе с меню.
      3. Точный остаток проверяет сервер при оформлении, одной операцией «забронировать пиццу», которая не даёт
         продать 1 001-ю. Если пицца закончилась, человек видит это до оплаты, с предложением заменить её обычной
         «Маргаритой».
      4. Рекомендации на вечер выключены флагом-рубильником (курс «Доставка и качество», «Проверки и выкатка»):
         вместо них — блок «Акции вечера», одинаковый для всех и закэшированный на CDN.
      5. Оформление и оплата — без кэша и без упрощений: здесь живут инварианты.
      6. За неделю — нагрузочный тест с пятикратным трафиком, чтобы проверить, что решения 1–4 действительно
         снимают нагрузку.

      Чем заплатили, записали явно: остаток на экране может отставать на минуту; часть людей узнает, что акция
      закончилась, только на оформлении; рекомендаций вечером нет. Маркетинг согласился, потому что видел
      альтернативу — прошлогодние 40 минут без заказов.

      ## Варианты и их цена

      - **Обещать всё сразу**
        - Подходит: никогда, если в требованиях невозможная комбинация.
        - Цена: система падает в самый важный момент, и страдают все сценарии сразу.
      - **Приоритет по сценарию**
        - Подходит: почти всегда.
        - Цена: часть пожеланий выполняется хуже, и это надо объяснить заказчику.
      - **Изменить обещание продукта**
        - Подходит: точность или мгновенность не нужны людям в той мере, в какой их записали.
        - Цена: переговоры с продуктом; новый текст на экране.
      - **Купить мощность**
        - Подходит: пик предсказуем, а уменьшить работу на запрос нельзя.
        - Цена: деньги, и ничего не меняется в устройстве — следующий пик опять упрётся в предел.

      ## Типичные ошибки

      - **Не замечать невозможную комбинацию.** Команда неделями ищет решение, которого нет.
      - **Жертвовать инвариантом ради скорости.** Продать 1 100 пицц из 1 000 быстрее, но потом извиняться перед
        сотней людей.
      - **Говорить «постараемся».** Заказчик слышит «да», а в пик получает «нет».
      - **Решать в одиночку.** Что важнее — свежесть или скорость — решает продукт; архитектор показывает цену.
      - **Не проверять решение нагрузкой.** Кэш, который «должен снять нагрузку», проверяют до пика, а не в пик.

      ## Как спрашивают на интервью

      - «Что вы сделаете, если требуют показывать точный остаток товара при миллионе посетителей?» — ждут точку
        компромисса, примерный остаток на экране и точную проверку на сервере.
      - «Какие требования к системе нельзя выполнить одновременно?» — ждут невозможные комбинации и предложение
        изменить обещание.
      - «Чем вы не пожертвуете ни при какой нагрузке?» — ждут инварианты: деньги, однократность, чужие данные.

      ## Коротко

      - Когда качества спорят, приоритет задаёт заказчик, а архитектор показывает цену каждого варианта
        и находит места, где качества тянут в разные стороны.
      - Точка чувствительности — решение, от которого сильно зависит одно качество; точка компромисса — такое
        решение для нескольких качеств сразу, как срок свежести кэша. Оба понятия взяты из метода ATAM.
      - Некоторые гарантии несовместимы по устройству системы: работа без сети и строгая согласованность, точная
        свежесть и ответ из кэша, персональный ответ и общий кэш. Тут нужен выбор, а не «постараемся».
      - Инварианты — деньги, однократность действий, доступ к чужим данным, закон — не обменивают на скорость
        и цену. Их проверяет сервер в самом действии.
      - Часто противоречие исчезает, если экран обещает чуть меньше: примерный остаток на экране и точная
        проверка при оформлении.
      - Решения записывают вместе с тем, чем за них заплатили, и проверяют нагрузочным тестом до пика.

      ## Источники

      - [ATAM: Method for Architecture Evaluation (CMU/SEI-2000-TR-004) — Software Engineering Institute](https://www.sei.cmu.edu/library/atam-method-for-architecture-evaluation/)
      - [Performance Efficiency tradeoffs — Microsoft Azure Well-Architected Framework](https://learn.microsoft.com/en-us/azure/well-architected/performance-efficiency/tradeoffs)

  - id: sda-degradation
    topic: Архитектура под ограничениями
    subtopic: Отказы и деградация
    title: Отказы и деградация
    body: |
      ## Какую проблему решаем

      Пятница, 19:30, самый загруженный час недели. Сервис рекомендаций, который подбирает блок «Вам может
      понравиться», начинает отвечать по 10 секунд вместо обычных 80 миллисекунд. Это второстепенный блок, без
      него можно спокойно заказать ужин. Но через пять минут перестаёт открываться весь каталог ресторанов.

      Как это вышло. Каталог отрисовывается на сервере (SSR, курс «Доставка и качество»), и сервер отрисовки
      ждёт ответа рекомендаций, прежде чем отдать страницу, — с тайм-аутом 30 секунд. Каждый запрос каталога
      теперь держит соединение к бэкенду по 10 секунд вместо долей секунды. Соединения у сервера отрисовки
      кончаются, и новые запросы каталога встают в очередь — даже те, которым рекомендации не нужны. Люди видят
      белую страницу и обновляют её, добавляя ещё запросов. К 19:40 каталог не открывается ни у кого.

      Один медленный второстепенный сервис уронил главный экран. Урок о том, как устроить приложение, чтобы отказ
      одной части оставался отказом одной части.

      ## Понятия

      - **Частичный отказ** — сломалась одна часть системы, а остальные работают. На масштабе это обычное состояние:
        какая-то часть отказывает почти всегда.
      - **Каскадный сбой** (cascading failure) — сбой, который разрастается сам: отказ одной части повышает
        нагрузку на другие, и они тоже отказывают. Так его определяет книга Google о надёжности сервисов (SRE Book).
      - **Плавная деградация** (graceful degradation) — система продолжает работать в урезанном виде, когда часть
        отказала. В курсе 1, в уроке «Загрузка, пустота, ошибка и всё между ними», это решали для экрана: что
        главное, что делать при сбое каждого блока, сколько ждать. Здесь — для всей цепочки запросов.
      - **Предохранитель** (circuit breaker) — обёртка вокруг вызова сервиса, которая после серии отказов
        на время перестаёт его вызывать и сразу возвращает запасной ответ. В курсе 2, в уроке «Когда и как
        повторять», он был только назван.
      - **Перегородка** (bulkhead) — раздельные ресурсы для разных зависимостей, чтобы сбой одной не забрал
        ресурсы у остальных.
      - **Отбрасывание нагрузки** (load shedding) — при перегрузке сервис быстро отказывает в части запросов,
        чтобы успеть обслужить остальные.

      ## Медленный хуже упавшего

      Сервис, который быстро отвечает ошибкой, почти безопасен: запрос завершился, соединение свободно, экран
      показывает запасной вид. Медленный сервис опаснее: каждый запрос к нему держит соединение, память и место
      в очереди. Книга SRE называет это истощением ресурсов: медленные ответы копят незавершённую работу, пока
      ресурсов не перестаёт хватать на всё.

      Отсюда первое правило: **у каждого вызова есть тайм-аут по его важности.** Не один на всё приложение,
      а свой: рекомендации, которые никто не ждёт, — сотни миллисекунд; оплата, которую человек ждёт, — секунды.
      Ещё лучше — **крайний срок** (deadline) на весь запрос: если страницу нужно отдать за секунду, каждый
      следующий вызов получает только оставшееся время, а не свои полные 30 секунд.

      Второе правило: **второстепенное не ждут на главном пути.** Страницу отдают без блока, который не успел,
      а блок дорисовывают позже или прячут. В браузере то же самое. В курсе 2, в уроке «Когда и что загружать»,
      `Promise.all` разбирали для ошибок: упал один запрос — пропал весь результат. С медленным запросом то же самое:
      экран ждёт самый медленный, поэтому независимые блоки грузят отдельно.

      ## Предохранитель

      Предохранитель описал Майкл Нигард в книге «Release It!», а Мартин Фаулер — в статье «Circuit Breaker».
      У него три состояния.

      - **Замкнут** (closed) — обычная работа: вызовы идут к сервису, предохранитель считает отказы и опоздания.
        Если их стало слишком много, он размыкается.
      - **Разомкнут** (open) — вызовы к сервису не идут вовсе: предохранитель сразу возвращает ошибку, и вызывающий
        показывает запасной вид. Сервис получает передышку, а вызывающий не тратит ресурсы на ожидание.
      - **Полуоткрыт** (half-open) — через заданное время предохранитель пропускает пробный вызов. Удался —
        замыкается и работа идёт как обычно. Не удался — снова размыкается и ждёт.

      Что нужно решить, ставя предохранитель:

      - **что считать отказом:** тайм-ауты и ошибки сервера — да; ответ «не найдено» или отказ по неверным
        данным — нет, это нормальный ответ;
      - **порог:** обычно долю неудачных вызовов за окно времени при минимальном числе вызовов, чтобы два случайных
        отказа ночью не разомкнули его;
      - **что показать, пока он разомкнут:** спрятать блок, показать последние известные данные или одинаковый для
        всех запасной ответ;
      - **наблюдение:** каждую смену состояния записывают, о размыкании предупреждают владельца сервиса, а дежурному
        оставляют ручной переключатель.

      **Где его ставить.** Лучше всего — там, где видны запросы многих людей: в сервере отрисовки или в BFF (курс 1,
      «Контракт API глазами фронтенда»). Там он быстро набирает статистику и разом защищает сервис от всего
      трафика. В браузере предохранитель видит только одного человека, но и он полезен — например, чтобы
      фоновый опрос не долбил упавший сервис каждые несколько секунд из каждой открытой вкладки.

      ![Три состояния предохранителя: «замкнут» — вызовы идут к сервису, отказы считаются; при доле отказов больше половины за 10 секунд — переход в «разомкнут», вызовов нет, сразу запасной ответ; через 30 секунд — «полуоткрыт», один пробный вызов; удачный ведёт обратно в «замкнут», неудачный — снова в «разомкнут»](images/sda-degradation.png "Предохранитель: замкнут, разомкнут, полуоткрыт")

      ## Перегородки и отбрасывание нагрузки

      **Перегородка** названа по переборкам в корпусе корабля: если пробит один отсек, вода заполняет только его,
      и корабль не тонет. Так это объясняет документация Microsoft о шаблоне Bulkhead. В программе отсеки — это
      раздельные ресурсы: свой пул соединений или свой предел одновременных запросов для каждой зависимости.
      Медленные рекомендации займут только свой пул, а запросы меню пойдут через свой. Когда отсек заполнен, новый
      вызов не ждёт в очереди, а сразу считается неудачным — иначе ожидание вернётся. Аналогия ломается в том,
      что программные отсеки делят процессор и память одной машины: перегородка ограничивает ожидание, но не делает
      части полностью независимыми.

      **Отбрасывание нагрузки.** Когда сервер перегружен, лучше быстро отказать части запросов, чем медленно
      обслуживать все. Книга SRE предлагает помечать запросы **важностью** (criticality): от тех, отказ которых
      сразу видят люди, до тех, которые можно отложить или потерять. При перегрузке первыми отбрасывают наименее
      важные. Для сервиса доставки порядок такой: оформление и оплата — важнее всего; каталог и меню — важны;
      рекомендации, аналитика, предзагрузка — можно отбросить.

      Фронтенд в этом участвует с двух сторон. Он помечает свои запросы важностью — например, заголовком, — чтобы
      сервер знал, что отбрасывать. И он правильно ведёт себя, получив быстрый отказ: ответ 503 с `Retry-After`
      уважает, как в курсе 2, второстепенное не повторяет вовсе, а повторяет только на одном уровне цепочки —
      иначе повторы перемножаются и превращают перегрузку в лавину.

      Наконец, запасные пути ломаются чаще всего, потому что ими почти не пользуются. Книга SRE советует
      регулярно проверять их на настоящих серверах: например, держать небольшую часть серверов близко к перегрузке.
      Для сервиса доставки это может быть так: раз в неделю выключать рекомендации на части трафика и смотреть,
      что показывает каталог.

      ## Пример целиком: пятница после исправлений

      Через месяц сервис рекомендаций снова начал отвечать по 10 секунд, в тот же час. Теперь всё было устроено
      иначе.

      1. **19:30:00.** Сервер отрисовки каталога зовёт рекомендации с тайм-аутом 300 мс, через отдельный пул
         на 20 одновременных запросов; если все 20 заняты, вызов сразу считается неудачным. Через 300 мс он отдаёт
         каталог без блока «Вам может понравиться».
      2. **19:30:10.** За 10 секунд больше половины из как минимум 20 вызовов рекомендаций опоздали —
         предохранитель размыкается. Сервер отрисовки больше не ждёт и 300 мс: блока просто нет, каталог
         открывается так же быстро, как обычно.
      3. **19:30:11.** Команда рекомендаций получает предупреждение «предохранитель разомкнут».
      4. **19:30:40.** Прошло 30 секунд — пробный вызов. Он не уложился в 300 мс — снова разомкнут. Так повторяется,
         пока сервис не оживёт.
      5. **В браузере.** Блок «Добавить к заказу?» в корзине грузится отдельным запросом и обёрнут границей ошибок.
         Его запрос помечен как второстепенный, и при отказе блок просто не появляется.
      6. **20:05.** Сервис починили, пробный вызов удался, предохранитель замкнулся, блок вернулся.

      За 35 минут каталог замедлился только в первые 10 секунд и не больше чем на 0,3 секунды. Покупатели
      не видели рекомендаций — и не заметили этого.

      ## Варианты и их цена

      - **Ждать сколько угодно**
        - Подходит: никогда для второстепенного.
        - Цена: медленный сервис забирает ресурсы и роняет всё.
      - **Тайм-аут по важности**
        - Подходит: всегда, это минимум.
        - Цена: каждый вызов всё равно ждёт до тайм-аута.
      - **Тайм-аут и предохранитель**
        - Подходит: зависимость, которая отказывает сериями.
        - Цена: пороги и запасной ответ нужно настроить и проверять.
      - **Перегородки**
        - Подходит: несколько зависимостей с разной важностью.
        - Цена: ресурсы делятся, и в обычное время часть их простаивает.
      - **Отбрасывание по важности**
        - Подходит: сервер может быть перегружен целиком.
        - Цена: нужна разметка запросов и согласие продукта, что отбрасывать первым.

      ## Типичные ошибки

      - **Ждать второстепенное на главном пути.** Блок рекомендаций держит весь каталог.
      - **Один тайм-аут на всё.** 30 секунд для рекомендаций — то же, что никакого тайм-аута.
      - **`Promise.all` для независимых блоков.** Один медленный запрос задерживает весь экран.
      - **Повторять на каждом уровне.** Перегрузка умножается на число уровней.
      - **Считать отказом любой ответ.** Предохранитель размыкается на «не найдено», и рабочий сервис перестаёт
        вызываться.
      - **Не проверять запасные пути.** В день сбоя оказывается, что каталог без рекомендаций падает с ошибкой.

      ## Как спрашивают на интервью

      - «Сервис рекомендаций стал отвечать 10 секунд. Что увидит пользователь вашей страницы?» — ждут тайм-аут,
        второстепенное вне главного пути, запасной вид.
      - «Объясните, как работает circuit breaker» — ждут три состояния, порог, запасной ответ и где его ставить.
      - «Как не допустить каскадного сбоя?» — ждут тайм-ауты с крайним сроком, перегородки, отбрасывание
        по важности и повторы на одном уровне.

      ## Коротко

      - Медленный сервис опаснее упавшего: каждый запрос к нему держит соединения и память, и из-за этого
        отказ второстепенной части перерастает в каскадный сбой всей системы.
      - У каждого вызова свой тайм-аут по важности, а у всего запроса — крайний срок, из которого каждый следующий
        вызов получает только оставшееся время.
      - Второстепенное не ждут на главном пути: страницу отдают без блока, который не успел, а независимые блоки
        грузят так, чтобы медленный не держал остальные.
      - Предохранитель после серии отказов размыкается и сразу отдаёт запасной ответ, а через время пропускает пробный
        вызов. Отказом считают тайм-ауты и ошибки сервера, а не обычные ответы вроде «не найдено».
      - Предохранитель лучше всего работает там, где видны запросы многих людей, — в сервере отрисовки или BFF;
        в браузере он видит одного человека, но не даёт фоновым запросам долбить упавший сервис.
      - Перегородки дают каждой зависимости свои ресурсы, чтобы медленная не забрала их у остальных.
      - При перегрузке быстро отказывают наименее важным запросам. Фронтенд помечает важность, уважает `Retry-After`,
        не повторяет второстепенное и повторяет только на одном уровне.
      - Запасные пути регулярно проверяют в работе: ими почти не пользуются, и поэтому они ломаются первыми.

      ## Источники

      - [Circuit Breaker — Martin Fowler](https://martinfowler.com/bliki/CircuitBreaker.html)
      - [Addressing Cascading Failures — Google SRE Book](https://sre.google/sre-book/addressing-cascading-failures/)
      - [Handling Overload — Google SRE Book](https://sre.google/sre-book/handling-overload/)

  - id: sda-bottleneck
    topic: Архитектура под ограничениями
    subtopic: Поиск узкого места
    title: Где узкое место
    body: |
      ## Какую проблему решаем

      За два года жалоба «приложение стало медленным» звучала всё чаще, и данные реальных пользователей её
      подтверждали. У телефонов на 75-м процентиле LCP каталога ресторанов вырос с 2,3 до 3,6 секунды, а INP
      страницы ресторана — со 180 до 420 миллисекунд. Оба значения вышли за пороги «хорошо»: 2,5 секунды
      и 200 миллисекунд (курс «Доставка и качество», «Как измерить скорость»).

      На встрече каждая команда предложила своё: «Переписать на новый фреймворк», «Купить серверы мощнее»,
      «Разрезать на микрофронтенды», «Сжать картинки ещё сильнее». Каждое предложение стоит от недели до полугода
      работы. Если выбрать по громкости голоса, можно потратить квартал и ускорить то, что и так было быстрым.

      Урок о том, как от жалобы дойти до изменения, которое даст больше всего: найти, где на самом деле теряется
      время, сравнить варианты по эффекту и цене и понять, когда пора менять саму архитектуру.

      ## Понятия

      - **Узкое место** (bottleneck) — часть системы, которая ограничивает целое. Ускорение любой другой части
        почти ничего не даёт, пока узкое место на месте.
      - **Разложение метрики** — деление одного числа на отрезки, каждый из которых зависит от своей части системы.
        LCP раскладывают на время до первого байта, задержку загрузки ресурса, его загрузку и задержку отрисовки;
        INP — на задержку ввода, работу обработчиков и задержку показа (курс «Доставка и качество»).
      - **`Server-Timing`** — заголовок ответа, в котором сервер сообщает, на что ушло время, например
        `Server-Timing: db;dur=53, ssr;dur=47`. Браузер отдаёт эти числа странице в `PerformanceServerTiming`,
        и их можно собирать вместе с RUM.
      - **Long Animation Frames** (LoAF) — API браузера, которое сообщает о кадрах дольше 50 мс и о том, какие
        скрипты их заняли: адрес скрипта, функция, длительность. Есть в Chrome с версии 123; в Firefox и Safari его
        нет, поэтому данные будут только от браузеров на Chromium. Более старое API Long Tasks тоже сообщает
        о задачах дольше 50 мс, но почти не говорит, чьи они: обычно указан только фрейм, а не скрипт.

      ## Шаг 1: найти, где теряется время

      Сначала отвечают на вопрос: **браузер, сеть или сервер?** Ответ дают данные реальных пользователей,
      разложенные на отрезки, а не лабораторный замер на ноутбуке разработчика.

      - **Большое время до первого байта** — ждали сервер или сеть до него. `Server-Timing` показывает, что делал
        сервер: ждал базу, вызывал другие сервисы, рисовал страницу. Если сервер работал недолго, а первый байт
        пришёл поздно, время ушло в сети: далёкий сервер, перенаправления, установка соединения.
      - **Большая загрузка ресурса** — тяжёлая картинка или шрифт, медленная сеть у людей. Это вопрос
        ассетов и CDN.
      - **Большая задержка загрузки или отрисовки** — браузер поздно узнал о главном элементе или был занят
        скриптами. Это вопрос порядка загрузки и основного потока.
      - **Большой INP** — основной поток занят. LoAF показывает, какие скрипты занимали кадры, в которые пришлось
        нажатие: свой код, библиотека или скрипт партнёра.

      Отдельно смотрят, **у кого** медленно: телефоны или компьютеры, какие страны, какие страницы. Медленно
      может быть не у всех, и тогда решение нужно не для всех.

      ## Шаг 2: сравнить изменения по эффекту и цене

      Когда известно, где теряется время, у каждого предложения можно оценить три вещи:

      - **эффект:** насколько улучшится метрика. Он ограничен долей того отрезка, который ускоряют: если загрузка
        картинки занимает 0,4 секунды из 3,6, никакое сжатие не сэкономит больше 0,4 секунды. Это частный случай
        закона Амдала: общий выигрыш ограничен долей той части, которую ускоряют;
      - **охват:** у какой доли людей или открытий это сработает;
      - **цена:** работа, риск и то, что придётся поддерживать потом.

      Сравнение не требует точности до процента. Достаточно грубой оценки «эффект × охват против цены», чтобы
      увидеть, что одно изменение даёт секунду за неделю, а другое — десятую долю секунды за полгода.

      После изменения эффект **проверяют тем же измерением**: тот же процентиль, те же устройства, данные
      реальных пользователей. Ожидание — ещё не результат.

      ## Шаг 3: когда менять архитектуру

      Часто узкое место убирает локальное изменение. Но иногда медленно становится из-за роста, и тогда меняется
      само устройство приложения. Расти может разное:

      - **данные:** в меню было 40 блюд, стало 400 — отрисовка всего списка при фильтре стала долгой задачей,
        и нужна виртуализация (курс «Реальное время и большие списки»);
      - **сценарии:** новые страны, языки, способы оплаты — код и переводы, которые нужны не всем, раздувают
        первую загрузку;
      - **команды:** восемь команд добавляют код в одно приложение, и бюджет JavaScript на первый экран тихо
        нарушается — у бюджета нужен владелец и доля каждой команды, которую проверяет сборка.

      Когда пора менять архитектуру, решают по сигналу, как в курсе 1, «Риски и развитие решения»: заранее
      записанный порог с запасом, чтобы переделку начать раньше, чем нарушится граница «хорошо»: например, «LCP
      на 75-м процентиле у телефонов выше 2,3 секунды две недели подряд» при пороге 2,5 секунды.

      ## Пример целиком: от жалобы к решению

      **LCP каталога.** RUM разложил 3,6 секунды так: время до первого байта — 1,6 секунды, загрузка картинки
      главного баннера — 0,4, остальное — задержки загрузки и отрисовки. `Server-Timing` показал, что сервер
      отрисовки по очереди ждёт четыре запроса — список ресторанов, время доставки, акции и баннер — примерно
      по 350 мс каждый. Все четыре зависят только от адреса доставки, который уже есть в запросе, и друг друга
      не ждут — по очереди они идут просто потому, что так их когда-то написали. Рекомендации после истории
      из урока «Отказы и деградация» уже идут параллельно и ждут не больше 300 мс.
      Сеть тут ни при чём.

      Варианты:

      1. **Вызывать четыре запроса параллельно.** Ожидание сократится примерно с 1,4 до 0,35 секунды — около
         секунды для всех открытий каталога. Цена — неделя работы.
      2. **Сжать баннер ещё сильнее.** Не больше 0,4 секунды даже в идеале, а реально около 0,15. Цена — день.
      3. **Мощнее серверы.** Сервер почти не считает, он ждёт ответов. Ожидание не сократится, а платить придётся
         каждый месяц.
      4. **Новый фреймворк.** Полгода работы, а узкое место — порядок запросов — останется, пока его
         не исправят.

      Сделали первый и второй. Через две недели LCP у телефонов на 75-м процентиле — 2,4 секунды.

      **INP страницы ресторана.** LoAF показал два виновника в кадрах, где люди нажимали фильтр «Острое»:
      скрипт рекламного партнёра занимал до 180 мс, а перерисовка всего меню из 400 блюд — около 150 мс.
      Скрипт партнёра при каждом обновлении блока строил его разом, за один долгий кадр. Партнёр по договорённости
      разбил эту работу на части короче 50 мс, а сам скрипт стали запускать после первой отрисовки, когда основной
      поток свободен. Меню виртуализировали. INP — 190 мс.

      **Что поменяли в устройстве.** Бюджет JavaScript на первый экран разделили между командами, и сборка
      проверяет долю каждой. В ADR записали условие пересмотра. Сейчас LCP 2,4 секунды, и до границы 2,5 осталась
      одна десятая — запаса почти нет. Поэтому порог поставили на 2,45 секунды две недели подряд: любой заметный
      рост — сигнал снова раскладывать и искать узкое место.

      ## Варианты и их цена

      - **Ускорить сервер или порядок запросов**
        - Подходит: большое время до первого байта, по `Server-Timing` сервер ждёт.
        - Цена: изменения на сервере отрисовки или BFF, договорённость с бэкендом.
      - **Ассеты и CDN**
        - Подходит: большая загрузка ресурса.
        - Цена: обычно невысокая; эффект ограничен долей загрузки.
      - **Основной поток**
        - Подходит: большой INP или задержка отрисовки.
        - Цена: дробление задач, виртуализация, переговоры о чужих скриптах.
      - **Изменение архитектуры**
        - Подходит: узкое место создаёт само устройство — рост данных, сценариев, команд.
        - Цена: месяцы; оправдано только сигналом и порогом.

      ## Типичные ошибки

      - **Оптимизировать, не измерив.** Неделя на сжатие картинок, когда время теряется на сервере.
      - **Мерить в лаборатории вместо реальных пользователей.** Ноутбук разработчика с быстрым интернетом
        не показывает, что происходит у людей на телефонах.
      - **Ускорять часть с маленькой долей.** Выигрыш не может быть больше этой доли.
      - **Покупать мощность против ожидания.** Сервер, который ждёт ответов, не ускорится на новых машинах.
      - **Не проверять эффект после изменения.** Ожидание принимают за результат.
      - **Забывать, чьи это данные.** LoAF есть только в Chromium, и выводы о Safari из него делать нельзя.

      ## Как спрашивают на интервью

      - «Пользователи жалуются, что приложение медленное. С чего начнёте?» — ждут данные реальных пользователей,
        разложение метрики и вопрос «браузер, сеть или сервер».
      - «Как выбрать, какую из пяти оптимизаций делать первой?» — ждут эффект, ограниченный долей отрезка, охват
        и цену.
      - «Как изменится архитектура, если данных станет в десять раз больше?» — ждут конкретные узкие места
        и сигнал, по которому начинать переделку.

      ## Коротко

      - Узкое место — часть, которая ограничивает целое: пока оно на месте, ускорение остальных частей почти ничего
        не даёт.
      - Сначала выясняют, браузер, сеть или сервер, по данным реальных пользователей, разложенным на отрезки: LCP —
        на время до первого байта, задержку загрузки, загрузку и задержку отрисовки, INP — на задержку ввода,
        обработчики и показ.
      - `Server-Timing` показывает, на что сервер потратил время до первого байта, а Long Animation Frames — какие
        скрипты занимали долгие кадры. LoAF есть только в браузерах на Chromium.
      - Изменения сравнивают по эффекту, охвату и цене. Эффект не больше доли того отрезка, который ускоряют,
        поэтому сначала берут самый большой отрезок.
      - Эффект проверяют тем же измерением после изменения: тот же процентиль, те же устройства.
      - При росте данных, сценариев и команд узким местом становится само устройство приложения. Менять его
        начинают по заранее записанному сигналу и порогу, с запасом.

      ## Что вы теперь умеете

      - Проводить границы между командами по предметным областям и назначать владельцев общих частей.
      - Выбирать между модульным монолитом и микрофронтендами и знать виды микрофронтендов и их цену.
      - Писать контракт между оболочкой и модулем, выпускать ломающие изменения рядом со старыми и изолировать
        сбой чужого модуля.
      - Переезжать со старого кода на новый по частям, с точками отката и критерием окончания.
      - Менять контракт API, которым пользуются десятки потребителей, и находить забытых потребителей измерением.
      - Обосновывать вложение в технический долг числами и записывать решение с условием пересмотра.
      - Разбирать спорящие требования: точки компромисса, невозможные комбинации, инварианты.
      - Не давать отказу одной части уронить всё: тайм-ауты, предохранители, перегородки, отбрасывание нагрузки.
      - Находить узкое место по измерениям и выбирать изменение по эффекту и цене.

      ## Что дальше

      Это последний курс теории. Следующий — «Практика»: архитектурные интервью и кейсы целиком. Там не будет
      новых механизмов: нужно взять незнакомую задачу, уточнить требования, предложить схему, разобрать
      критические сценарии и защитить решение через ограничения, инварианты и альтернативы. Пригодится всё —
      от требований и границ модулей из курса 1 до границ команд и отказов из этого.

      ## Источники

      - [Optimize Largest Contentful Paint — web.dev](https://web.dev/articles/optimize-lcp)
      - [Long Animation Frames API — Chrome for Developers](https://developer.chrome.com/docs/web-platform/long-animation-frames)
      - [Server-Timing — MDN](https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Server-Timing)

questions:
  - id: sda-intro-001
    topic: Введение
    subtopic: Много команд, одно приложение
    level: junior
    question: |
      В соцсети сервис подсказок «Возможно, вы знакомы» начал отвечать по 15 секунд, и вместе с ним перестала
      открываться вся лента: она ждёт подсказки, прежде чем показать посты. Сам сервис чинит другая команда.
      К какой части курса относится вопрос «как сделать, чтобы лента открывалась и без подсказок»?
    options:
      - text: 'Архитектура большого приложения'
        why: 'Эта часть о том, как разделить приложение между командами. Здесь вопрос не в границах команд, а в том, как приложение переживает отказ одной части.'
      - text: 'Эволюция архитектуры'
        why: 'Эта часть о том, как менять приложение со временем: миграции, контракты, долг. Здесь ничего не меняют — один сервис сломался прямо сейчас.'
      - text: 'Архитектура под ограничениями'
        correct: true
        why: 'Один сервис работает плохо, и надо, чтобы остальное приложение не падало вместе с ним. Это урок «Отказы и деградация» из третьей части курса.'
      - text: 'Ни к какой: это задача команды сервиса подсказок'
        why: 'Сервис починят, но на масштабе какая-то часть отказывает почти всегда. Как лента переживает такой отказ, решают при её проектировании.'
    explanation: |
      Курс состоит из трёх частей: как разделить приложение между командами, как развивать его, не останавливая,
      и как оно ведёт себя под нагрузкой и при отказах. Медленный сервис, который роняет всю страницу, — пример
      частичного отказа. Приложение проектируют так, чтобы второстепенная часть могла отказать, а главное
      продолжало работать.
    links:
      - https://sre.google/sre-book/addressing-cascading-failures/

  - id: sda-intro-002
    topic: Введение
    subtopic: Много команд, одно приложение
    level: middle
    question: |
      В онлайн-кинотеатре фронтенд делают пять команд в одном репозитории, а выкатка у них общая. Если ошибку
      одной команды приходится откатывать, вместе с ней откатываются изменения остальных четырёх. Техлид предлагает
      перевести приложение с Vue на React, «потому что на React проще нанимать». Почему этот шаг не решит
      жалобу команд?
    options:
      - text: 'Команды мешают друг другу медленной сборкой, а смена фреймворка её не ускорит'
        why: 'Жалоба не на время сборки, а на то, что чужая ошибка откатывает их работу. Быстрая сборка этого не изменит.'
      - text: 'Команды мешают друг другу общей выкаткой, а не фреймворком, на котором написан код'
        correct: true
        why: 'Откат задевает всех, потому что выкатка одна на пять команд. На React она останется такой же общей, если не поменять границы и способ выкатки.'
      - text: 'Откаты вызваны нестабильными тестами, а смена фреймворка их не починит'
        why: 'Откатывают из-за ошибки одной команды, а не из-за случайно упавших тестов. Задевает всех то, что выкатка у пяти команд одна.'
      - text: 'После переезда на React выкатки станут реже, и каждая заденет ещё больше изменений'
        why: 'Частота выкаток не зависит от фреймворка: её задают сборка, проверки и договорённости команд.'
    explanation: |
      Многие проблемы масштаба организационные. Команды мешают друг другу через общую выкатку, общие файлы
      и общие части без владельца. Смена технологии без новых границ оставляет те же споры. Решение начинают
      с того, где провести границы между командами и как каждой выпускать своё, не задевая остальных.
    links:
      - https://martinfowler.com/bliki/ConwaysLaw.html

  - id: sda-intro-003
    topic: Введение
    subtopic: Много команд, одно приложение
    level: senior
    question: |
      В страховой компании личный кабинет клиента написан восемь лет назад. Им каждый день пользуются 300 тысяч
      человек: оформляют полисы и заявляют о страховых случаях. Новый руководитель предлагает заморозить кабинет
      на полтора года и написать новый с нуля. Какие проблемы этого плана разбирает курс?
    multiple: true
    options:
      - text: 'Пока пишут новый кабинет, старый всё равно приходится менять'
        correct: true
        why: 'Законы, тарифы и продукт меняются, и замороженный кабинет за полтора года отстанет. Новая версия будет догонять уходящую цель — урок «Постепенная миграция».'
      - text: 'Переезд одним днём ставит под удар всех клиентов сразу'
        correct: true
        why: 'При переключении всех 300 тысяч человек разом любая ошибка нового кабинета бьёт по каждому, и откатиться на старый трудно. Постепенный переезд меняет раздел за разделом.'
      - text: 'Новый кабинет на новой технологии сам решит, кто владеет общими частями'
        why: 'Технология не назначает владельцев. Без новых границ и хозяев общего новый кабинет унаследует те же споры, что и старый.'
      - text: 'Старый кабинет нельзя открыть в современном браузере'
        why: 'Ничего в условии на это не указывает: кабинетом каждый день пользуются, значит он открывается.'
      - text: 'Полтора года без новых функций — это решение о долге и цене, которое надо обосновать'
        correct: true
        why: 'Заморозка — плата за переписывание. Насколько она оправдана, решают сигналами и числами — урок «Технический долг как решение».'
    explanation: |
      Переписать всё с нуля и переключиться одним днём — самый рискованный путь. Старая система продолжает
      меняться, новая её не догоняет, а переключение ставит под удар всех сразу. Курс разбирает другой путь:
      новое растёт рядом со старым и забирает раздел за разделом, а вложение в переписывание обосновывают числами
      и записывают с условием пересмотра.
    links:
      - https://martinfowler.com/bliki/StranglerFigApplication.html

  - id: sda-domains-001
    topic: Архитектура большого приложения
    subtopic: Границы доменов и масштаб команд
    level: junior
    question: |
      На маркетплейсе фронтенд делают три команды: «Поиск», «Карточка товара» и «Оформление». Компания решает
      поручить отзывы покупателей не новой команде, а «Карточке товара», потому что отзывы показываются
      в карточке. Что по закону Конвея, скорее всего, произойдёт с кодом отзывов?
    options:
      - text: 'Он срастётся с кодом карточки и будет меняться вместе с ней'
        correct: true
        why: 'Внутри одной команды договориться легко, и код у неё получается тесно связанным. Отзывы станут частью карточки, а не отдельным модулем со своим API.'
      - text: 'Он станет отдельным модулем с собственным API, через который его читает карточка'
        why: 'Отдельный модуль с явным API обычно появляется на границе между командами. Внутри одной команды такая граница не нужна никому, и её никто не держит.'
      - text: 'Он разделится на три части, по одной на каждую команду'
        why: 'Отзывы поручили одной команде. Другие команды их не трогают, поэтому делить код не на что.'
      - text: 'Ничего определённого: устройство кода не зависит от команд'
        why: 'Закон Конвея говорит как раз об обратном: устройство системы копирует устройство общения в организации.'
    explanation: |
      Закон Конвея (1968): система повторяет устройство общения в организации, которая её делает. Внутри команды
      общаются плотно, и код срастается; между командами общаться труднее, и там появляются отдельные модули
      и API. Поэтому границы команд выбирают так, как хотят видеть границы в коде.
    links:
      - https://martinfowler.com/bliki/ConwaysLaw.html

  - id: sda-domains-002
    topic: Архитектура большого приложения
    subtopic: Границы доменов и масштаб команд
    level: middle
    question: |
      В онлайн-банке фронтенд разделён на команды «Экраны», «Интеграция с API» и «Автотесты». Задачу «перевод
      по номеру телефона» делали девять недель, хотя работы в ней было на три. Каждая команда сделала свою часть
      вовремя, а остальное время задача лежала в очередях соседей. Какое изменение лучше всего сократит такие
      задержки?
    options:
      - text: 'Собрать команды по продуктам: «Переводы», «Карты», «Вклады», у каждой — экраны, запросы и тесты'
        correct: true
        why: 'Задача целиком попадает в одну команду, и передачи работы исчезают. За результат тоже отвечает одна команда.'
      - text: 'Оставить три команды по слоям, но завести общую доску задач и каждый день собирать все три команды вместе'
        why: 'Очереди станут виднее, но передачи останутся: каждая задача всё так же проходит через три команды.'
      - text: 'Разделить «Экраны» на команды по видам компонентов — формы, таблицы, графики, — чтобы каждая работала быстрее'
        why: 'Это ещё одно деление по виду работы. Перевод по номеру телефона затронет формы и таблицы — и задача пойдёт через ещё большее число команд.'
      - text: 'Отдать автотесты разработчикам, а команды «Экраны» и «Интеграция» оставить как есть'
        why: 'Одна передача пропадёт, но главная — между экранами и запросами — останется. Задача всё равно ждёт соседнюю команду.'
    explanation: |
      Деление по слоям и виду работы режет задачи поперёк: каждая новая функция требует нескольких команд, и время
      уходит на ожидание. Деление по предметной области режет их вдоль: команда отвечает за свою часть продукта
      целиком, от экрана до тестов. Проверка простая: сколько команд задействовано в обычной задаче.
    links:
      - https://martinfowler.com/bliki/ConwaysLaw.html
      - https://teamtopologies.com/key-concepts

  - id: sda-domains-003
    topic: Архитектура большого приложения
    subtopic: Границы доменов и масштаб команд
    level: middle
    question: |
      В SaaS-CRM компонент выбора даты лежит в папке `shared/` и используется на 40 экранах. Его правят шесть
      команд: каждая под свой случай. За месяц три правки сломали чужие экраны, а последняя команда, которой нужен
      был новый формат, просто скопировала компонент к себе. В компании есть команда дизайн-системы, которая ведёт
      общие компоненты. Как лучше поступить?
    options:
      - text: 'Запретить любые правки компонента, пока его не перепишут под все случаи разом'
        why: 'Командам нужны изменения, и запрет только ускорит копирование. Вопрос «кто решает, как компонент меняется» так и останется без ответа.'
      - text: 'Разрешить каждой команде держать свою копию компонента и править её как удобно'
        why: 'Ломать друг друга перестанут, но 40 экранов получат шесть разных выборов даты. Исправлять ошибку и менять вид придётся шесть раз.'
      - text: 'Отдать компонент дизайн-системе: правки предлагают все, сливают после её проверки'
        correct: true
        why: 'У общей части появляется владелец, который отвечает за совместимость и может отказать. Проверку можно закрепить в CODEOWNERS, чтобы GitHub сам её просил.'
      - text: 'Каждую правку проверять на общей встрече всех шести команд и принимать голосованием'
        why: 'Шесть команд на каждую правку — это дорого и медленно, а отвечать за итог по-прежнему некому.'
    explanation: |
      Общее без хозяина правят все и ломают друг другу. У каждой общей части должен быть владелец, который решает,
      как она меняется. Для компонентов хорошо работает способ «правят все, владелец проверяет»: команды не ждут,
      пока владелец сделает за них, а совместимость охраняет один человек или команда.
    links:
      - https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-code-owners

  - id: sda-domains-004
    topic: Архитектура большого приложения
    subtopic: Границы доменов и масштаб команд
    level: senior
    question: |
      У сервиса такси фронтенд в одном репозитории, его делают пять команд по предметным областям, и каждая
      выкатывает свои изменения сама — флагами, независимо от других. Жалоба другая: сборка с тестами идёт 50 минут,
      а пятая часть прогонов падает из-за нестабильных тестов, и их перезапускают. Архитектор предлагает разрезать
      приложение на микрофронтенды. Что предпочтительнее при этих условиях?
    options:
      - text: 'Разрезать приложение на микрофронтенды по командам, чтобы у каждой команды была своя сборка'
        why: 'Сборки станут меньше, но команды уже выпускаются независимо, а цена микрофронтендов — новые контракты, дубли библиотек, сложность. Это решение организационной задачи, которой здесь нет.'
      - text: 'Проверять только затронутые модули, включить кэш сборки и починить нестабильные тесты'
        correct: true
        why: 'Жалоба техническая: инструменты тормозят. Её решают инструментами, а границы команд и выкатка уже в порядке.'
      - text: 'Объединить пять команд в три, чтобы общую сборку запускали реже и тесты падали реже'
        why: 'Число запусков сборки зависит от числа изменений, а не от числа команд. Сборка останется 50-минутной, а команды получат лишнюю когнитивную нагрузку.'
      - text: 'Перейти на одну общую выкатку в день, вечером, чтобы долгая сборка запускалась один раз'
        why: 'Команды потеряют независимую выкатку, которая у них уже работает, а каждое изменение будет ждать вечера.'
    explanation: |
      Техническое и организационное масштабирование — разные задачи. Если команды уже не ждут друг друга, а тормозят
      сборка и тесты, помогают инструменты: проверки только по затронутым модулям, кэш сборки, починка нестабильных
      тестов. Перестановка команд или микрофронтенды лечат другое — общую выкатку и споры за общие файлы.
    links:
      - https://martinfowler.com/articles/micro-frontends.html

  - id: sda-domains-005
    topic: Архитектура большого приложения
    subtopic: Границы доменов и масштаб команд
    level: senior
    question: |
      На портале госуслуг платформенная команда из шести человек держит сборку, вход и настройки окружений для
      девяти команд потока. Любую настройку — новый адрес API, переменную окружения, правило кэша — меняет только
      она, по заявке. Очередь заявок — три недели, и команды потока ждут её чаще, чем друг друга. Какие изменения
      уберут ожидание по заявкам, а не только на время сократят очередь?
    multiple: true
    options:
      - text: 'Сделать настройки самообслуживанием: команда меняет их сама по документации, а платформа задаёт правила и проверки'
        correct: true
        why: 'Платформа становится услугой, которой пользуются без заявки. Команды потока перестают ждать, а платформа охраняет правила проверками, а не ручной работой.'
      - text: 'Добавить в платформенную команду ещё шесть человек, чтобы разбирать заявки вдвое быстрее'
        why: 'Очередь станет короче, но каждое изменение по-прежнему идёт через одну команду. С ростом числа команд потока очередь вернётся.'
      - text: 'Для перехода на самообслуживание на время дать командам потока помощника, который научит их новым правилам'
        correct: true
        why: 'Это работа команды-помощника: прийти, научить и уйти. Без неё самообслуживание часто буксует — команды не знают, как пользоваться новыми возможностями.'
      - text: 'Отменить платформенную команду и раздать её обязанности — сборку, вход, окружения — командам потока'
        why: 'Каждая из девяти команд получит кусок сборки и входа и потеряет фокус на своём продукте. Это рост когнитивной нагрузки, а общие части снова останутся без хозяина.'
    explanation: |
      Платформенная команда ускоряет команды потока, только если ею пользуются как услугой, без очереди. Когда
      каждое изменение идёт через неё по заявке, она превращается в ворота и узкое место. Платформа задаёт правила
      и автоматические проверки, а команды сами делают то, что им нужно. Переход часто сопровождает команда-помощник.
    links:
      - https://teamtopologies.com/key-concepts

  - id: sda-microfrontends-001
    topic: Архитектура большого приложения
    subtopic: Модульный монолит или микрофронтенды
    level: junior
    question: |
      Новостное издание переписало сайт из модульного монолита в микрофронтенды: лента, статья и комментарии
      теперь отдельные приложения, которые собирает оболочка. Что они получили такого, чего у модульного
      монолита с теми же границами модулей не было?
    options:
      - text: 'Границы между лентой, статьёй и комментариями'
        why: 'Границы были и в модульном монолите: публичные интерфейсы и правила импортов. Микрофронтенды делят приложение по тем же границам.'
      - text: 'Отдельную выкатку и откат для каждой из частей'
        correct: true
        why: 'Это главное отличие микрофронтендов: каждую часть собирают, выкатывают и откатывают сама по себе, не трогая остальные.'
      - text: 'Меньший объём JavaScript на странице статьи'
        why: 'Обычно наоборот: отдельно собранные части тащат свои копии библиотек. Объём уменьшает разбиение кода, а не микрофронтенды.'
      - text: 'Владельцев у каждой части вместо общего кода'
        why: 'Владельцев назначают и в монолите — например, в CODEOWNERS. Это вопрос организации, а не способа сборки.'
    explanation: |
      Модульный монолит и микрофронтенды могут делить приложение по одним и тем же границам и с теми же владельцами.
      Разница в выкатке: монолит выходит целиком, а микрофронтенды — каждый независимо. Поэтому микрофронтенды
      оправданы там, где нужна именно независимая выкатка, а остальная их цена — размер, версии, эксплуатация —
      за неё и платится.
    links:
      - https://martinfowler.com/articles/micro-frontends.html

  - id: sda-microfrontends-002
    topic: Архитектура большого приложения
    subtopic: Модульный монолит или микрофронтенды
    level: middle
    question: |
      В интернет-магазине электроники четыре команды оформили свои части — каталог, карточку, отзывы, корзину — как
      npm-пакеты, а оболочка подключает их зависимостями в `package.json`. Команда отзывов жалуется: чтобы выпустить
      исправление опечатки, ей приходится ждать, пока оболочку пересоберут и выкатят вместе со свежими версиями
      остальных пакетов. Почему так?
    options:
      - text: 'Пакеты связаны при сборке оболочки, поэтому любой выпуск — общая выкатка всей страницы'
        correct: true
        why: 'Код пакета попадает в бандл оболочки только при её сборке. Пока оболочку не пересобрали, новая версия отзывов до людей не дойдёт.'
      - text: 'Команды не договорились о версиях React, и пакет отзывов не устанавливается с остальными'
        why: 'Версии зависимостей — отдельная трудность, но в условии пакет ставится. Жалоба в том, что выпуск ждёт общей сборки.'
      - text: 'npm кэширует пакеты, и новая версия отзывов приходит к людям только через сутки'
        why: 'npm участвует только в сборке, к браузерам людей он отношения не имеет. Новая версия ждёт не кэша, а пересборки оболочки.'
      - text: 'У команды отзывов нет прав на выкатку оболочки, это решается доступами'
        why: 'Даже с доступами пришлось бы пересобирать и выкатывать всю страницу с чужими изменениями. Дело в способе сборки, а не в правах.'
    explanation: |
      Сборка из пакетов (build-time integration) даёт один бандл без дублей библиотек, но лишает частей независимой
      выкатки: чтобы выпустить одну, пересобирают и выкатывают всё. Кэм Джексон поэтому настойчиво не советует этот
      способ для микрофронтендов. По сути это модульный монолит, разложенный по пакетам. Независимую выкатку дают
      способы сборки во время работы: на сервере или в браузере.
    links:
      - https://martinfowler.com/articles/micro-frontends.html

  - id: sda-microfrontends-003
    topic: Архитектура большого приложения
    subtopic: Модульный монолит или микрофронтенды
    level: middle
    question: |
      Сервис бронирования путешествий показывает на шаге оплаты форму банка-партнёра: банк сам её выпускает
      и обновляет, когда хочет, а код банка сервис не проверяет. Форма не должна видеть данные страницы, а стили
      и ошибки формы не должны задевать страницу. Как встроить форму?
    options:
      - text: 'Загрузить скрипт банка в страницу и вызвать его функцию `mount` в контейнер'
        why: 'Скрипт банка окажется в той же странице: он сможет читать её данные и глобальные переменные, а его стили и ошибки протекут наружу.'
      - text: 'Подключить форму банка npm-пакетом и обновлять его при каждой выкатке сервиса'
        why: 'Код банка всё равно выполнится внутри страницы, а обновления банка будут ждать выкатки сервиса — банк выпускает форму сам.'
      - text: 'Показать форму во фрейме `iframe`, который открывает страницу банка с его домена'
        correct: true
        why: 'Фрейм с другого домена изолирует данные, стили и ошибки, а банк обновляет страницу формы, когда хочет. Неудобства фрейма — размер, адрес — здесь терпимы.'
      - text: 'Оформить форму банка как Web Component и вставить этот элемент в разметку страницы оплаты'
        why: 'Shadow DOM изолирует стили, но код элемента работает в той же странице и видит её данные. Для чужого непроверенного кода этого мало.'
    explanation: |
      Из способов собрать части в браузере самую сильную изоляцию даёт iframe: у фрейма с другого домена свои
      глобальные переменные, стили и ошибки, и он не читает данные страницы. Поэтому его выбирают для чужого кода,
      которому не доверяют, — платёжных форм, виджетов партнёров. Цена — неудобный адрес, размер под содержимое,
      доступность и лишние загрузки, поэтому для своих частей iframe обычно не берут.
    links:
      - https://martinfowler.com/articles/micro-frontends.html

  - id: sda-microfrontends-004
    topic: Архитектура большого приложения
    subtopic: Модульный монолит или микрофронтенды
    level: senior
    question: |
      Сайт конструктора сайтов делают две команды в одном репозитории. Страница редактора грузит 900 КБ
      сжатого JavaScript, и на слабых ноутбуках открывается 9 секунд. Выкатки команд друг другу не мешают.
      Ведущий разработчик предлагает разрезать редактор на три микрофронтенда, «чтобы каждый грузил только своё».
      Что предпочтительнее?
    options:
      - text: 'Разрезать редактор на три микрофронтенда в браузере, по одному на каждую панель'
        why: 'Отдельно собранные части обычно тащат свои копии библиотек, и объём растёт. Независимая выкатка, единственное, что дают микрофронтенды, двум командам здесь не нужна.'
      - text: 'Разрезать на три микрофронтенда, но делить React и общие библиотеки между ними'
        why: 'Дублей будет меньше, но объём всё равно не уменьшится сам: грузится тот же код. А общие библиотеки связывают графики обновлений частей.'
      - text: 'Перенести редактор во фрейм, чтобы его скрипты не мешали загрузке остальной страницы'
        why: 'Фрейм не уменьшит объём: те же 900 КБ загрузятся внутри него, плюс собственные копии библиотек.'
      - text: 'Оставить одно приложение и вынести редкие панели и тяжёлые модули в отложенные куски'
        correct: true
        why: 'Объём первого экрана уменьшает разбиение кода: в первую загрузку идёт только нужное для открытия редактора. Это не требует новой архитектуры.'
    explanation: |
      Микрофронтенды не уменьшают размер приложения — чаще увеличивают. Размер первого экрана уменьшает разбиение
      кода: маршруты и тяжёлые модули, которые нужны не сразу, грузятся отдельными кусками (курс «Доставка
      и качество», «Что грузить сразу, а что потом»). Микрофронтенды оправданы, когда нужна независимая выкатка,
      а у двух команд, которые друг другу не мешают, этой потребности нет.
    links:
      - https://martinfowler.com/articles/micro-frontends.html
      - https://web.dev/articles/reduce-javascript-payloads-with-code-splitting

  - id: sda-microfrontends-005
    topic: Архитектура большого приложения
    subtopic: Модульный монолит или микрофронтенды
    level: senior
    question: |
      На маркетплейсе страница товара собрана из микрофронтендов в браузере: карточка, отзывы и корзина в шапке —
      у разных команд. Чтобы корзина в шапке узнала о добавленном товаре, карточка пишет прямо в хранилище состояния
      корзины, а отзывы читают оттуда же, купил ли человек товар. Теперь любое изменение формы этого хранилища
      ломает две чужие части, и команды снова выкатываются вместе. Что предпочтительнее?
    options:
      - text: 'Описать общее хранилище типами в общем пакете и обновлять пакет у всех частей одновременно'
        why: 'Поломки станут заметнее при сборке, но обновлять пакет всем одновременно — это и есть общая выкатка, от которой уходили.'
      - text: 'Корзина владеет своими данными, карточка шлёт событие «добавлен», отзывы спрашивают сервер'
        correct: true
        why: 'Каждая часть хранит своё, а общаются они минимально: событием и через сервер. Корзина может менять устройство своего состояния, не задевая соседей.'
      - text: 'Каждая часть хранит свою копию корзины и раз в секунду сама сверяет её с сервером'
        why: 'Связь через общее хранилище пропадёт, но появятся лишние запросы и расхождения: шапка и карточка будут показывать разное число товаров до сверки.'
      - text: 'Слить карточку, отзывы и корзину в один микрофронтенд, который делает одна команда'
        why: 'Хранилище перестанет быть общим, но три предметные области окажутся у одной команды. Её нагрузка вырастет, а остальные две команды потеряют свою часть.'
    explanation: |
      Общее хранилище состояния — скрытая связь между микрофронтендами: части снова зависят от устройства чужих
      данных и снова выходят вместе. Кэм Джексон советует общаться минимально: события, данные от оболочки, адрес.
      Каждая часть владеет своими данными и сообщает о важном событием, а то, что нужно знать надёжно, например
      была ли покупка, берёт у сервера.
    links:
      - https://martinfowler.com/articles/micro-frontends.html

  - id: sda-platform-001
    topic: Архитектура большого приложения
    subtopic: Общие контракты платформы
    level: junior
    question: |
      В SaaS-CRM дизайн-система выходит пакетом версии 4.2.1. Команда убирает у кнопки параметр `size` и заменяет
      его новым параметром `density`: кто передаёт `size`, после обновления получит ошибку типов. Какой номер
      версии по semver нужен для этого выпуска?
    options:
      - text: '4.2.2'
        why: 'Патч — исправление ошибки, совместимое со старыми потребителями. Удаление параметра ломает тех, кто его передаёт.'
      - text: '4.3.0'
        why: 'Минорная версия — новое с обратной совместимостью. Добавить `density` можно в минорной, а убрать `size` — уже нет.'
      - text: '5.0.0'
        correct: true
        why: 'Изменение ломает старых потребителей, значит нужна новая мажорная версия. Потребители с диапазоном `^4.2.0` её не получат, пока сами не перейдут.'
      - text: '4.2.1-next'
        why: 'Суффикс помечает предварительную версию 4.2.1, а не ломающее изменение. Потребителям нужен явный сигнал — новая мажорная версия.'
    explanation: |
      Semver записывает версию как МАЖОРНАЯ.МИНОРНАЯ.ПАТЧ. Патч исправляет, минорная добавляет совместимо, мажорная
      ломает старых потребителей. Диапазон вроде `^4.2.0` принимает любые 4.x, поэтому ломающее изменение в 4.x
      попало бы ко всем без предупреждения. Удобный путь — в 4.3.0 добавить `density` рядом с `size`, а в 5.0.0
      убрать `size`.
    links:
      - https://semver.org/lang/ru/

  - id: sda-platform-002
    topic: Архитектура большого приложения
    subtopic: Общие контракты платформы
    level: middle
    question: |
      В стриминговом сервисе на главной странице пять полок от разных команд. Полка «Продолжить просмотр»
      упала при отрисовке на фильме без обложки, и у всех, у кого такой фильм в истории, главная стала белой.
      Страница написана на React. Какое изменение в оболочке защитит главную от таких сбоев любой полки?
    options:
      - text: 'Обернуть в `try/catch` код, который монтирует полки, и при ошибке просто не показывать упавшую полку'
        why: 'Ошибка случилась не при монтировании, а при отрисовке данных позже. React бросает её внутри своего цикла отрисовки, и внешний `try/catch` её не поймает.'
      - text: 'Поставить вокруг каждой полки границу ошибок с запасным видом, ошибку записывать на команду полки'
        correct: true
        why: 'Граница ошибок ловит сбой отрисовки потомков и показывает запасной вид вместо них. Остальные полки работают, а ошибка уходит владельцу полки.'
      - text: 'Перезагружать страницу при любой ошибке отрисовки, чтобы человек сразу увидел свежие данные'
        why: 'Фильм без обложки никуда не денется, и страница упадёт снова — человек окажется в бесконечной перезагрузке.'
      - text: 'Проверять каждую выкатку полки сквозными тестами всей главной страницы до выхода к людям'
        why: 'Тесты полезны, но фильм без обложки они могли не найти. Защита от сбоя должна работать, когда тест пропустил ошибку.'
    explanation: |
      Без границы ошибок неперехваченная ошибка отрисовки снимает со страницы всё дерево React. Граница ошибок вокруг
      каждого слота превращает сбой одной части в запасной вид на её месте: спрятать, строка с действием или старые
      данные. Ошибку записывают с модулем и командой-владельцем, чтобы её увидели те, кто может исправить.
    links:
      - https://ru.react.dev/reference/react/Component#catching-rendering-errors-with-an-error-boundary

  - id: sda-platform-003
    topic: Архитектура большого приложения
    subtopic: Общие контракты платформы
    level: middle
    question: |
      В соцсети виджет «Истории» делает одна команда, а показывают его четыре приложения: они грузят его во время
      работы по адресу `/stories/latest/entry.js`. Команда поменяла формат параметров `mount`, выкатила — и три
      приложения из четырёх сломались в ту же минуту. При этом мелкие исправления виджета должны и дальше доходить
      до всех приложений сразу. Как публиковать виджет?
    options:
      - text: 'По адресу с мажорной версией, `/stories/v2/`; ломающее изменение — как `/stories/v3/` рядом'
        correct: true
        why: 'Исправления внутри 2.x доходят до всех сразу, а ломающее изменение ждёт, пока каждое приложение само перейдёт на v3. Старая версия живёт, пока её кто-то грузит.'
      - text: 'По адресу с точной версией, например `/stories/2.4.1/`, чтобы каждое приложение обновлялось само'
        why: 'Ломающее изменение больше не дойдёт само, но и исправления тоже: каждое приложение будет сидеть на своей точной версии, пока не обновится вручную.'
      - text: 'По прежнему адресу `latest`, но предупреждать о ломающих изменениях за неделю в общем чате'
        why: 'Предупреждение не меняет того, что выкатка доходит до всех сразу. Кто не успел за неделю, сломается в ту же минуту.'
      - text: 'Перейти на npm-пакет виджета и встраивать его в сборку каждого приложения'
        why: 'Ломающее изменение перестанет доходить само, но исправления будут ждать выкатки каждого из четырёх приложений. А нужно, чтобы они доходили сразу.'
    explanation: |
      Модуль, который грузят во время работы, публикуют с мажорной версией в адресе. По `/v2/` всегда лежит последняя
      2.x, совместимая со всеми, кто написан под v2, поэтому исправления доходят без участия потребителей. Ломающее
      изменение выходит как v3 рядом, потребители переходят в своём темпе, а v2 убирают, когда её больше никто
      не загружает.
    links:
      - https://semver.org/lang/ru/

  - id: sda-platform-004
    topic: Архитектура большого приложения
    subtopic: Общие контракты платформы
    level: senior
    question: |
      На портале госуслуг модуль «Запись к врачу» другой команды обёрнут границей ошибок. Отчёт об ошибках
      показывает: за неделю модуль бросил 2 000 ошибок в обработчиках нажатий и в промисах загрузки слотов.
      Граница их не показала, а все ошибки пришли команде страницы «Здоровье», которая модуль не писала.
      Что из этого верно и что стоит сделать?
    multiple: true
    options:
      - text: 'Граница ошибок не ловит ошибки в обработчиках событий и в асинхронном коде, поэтому модуль должен ловить их сам'
        correct: true
        why: 'Так и есть: граница ловит только ошибки отрисовки потомков. Ошибки нажатий и промисов модуль перехватывает сам, показывает человеку и записывает.'
      - text: 'Оболочка должна подписывать ошибки модулем и командой-владельцем, чтобы их получала команда «Записи к врачу»'
        correct: true
        why: 'Ошибка случается на странице «Здоровье», но исправить её может только владелец модуля. Подпись в отчёте направляет предупреждение тем, кто может исправить.'
      - text: 'Граница ошибок неправильно настроена: правильная граница ловит и ошибки в обработчиках нажатий'
        why: 'Никакая настройка этого не даёт: по документации React граница не ловит ошибки в обработчиках событий и асинхронном коде.'
      - text: 'Оболочка должна слушать глобальные `error` и `unhandledrejection`, чтобы не пропустить то, что модуль не поймал'
        correct: true
        why: 'Это страховка на случай, когда модуль забыл перехватить ошибку. Без неё такие ошибки пропадут из отчётов.'
      - text: 'Перенести модуль во фрейм, тогда граница ошибок начнёт ловить его обработчики нажатий'
        why: 'Фрейм изолирует модуль, но граница ошибок React ошибок внутри фрейма не ловит вовсе, а владелец модуля так и не начнёт их получать.'
    explanation: |
      Граница ошибок изолирует сбой отрисовки, но не ловит ошибки в обработчиках событий, асинхронном коде и в самой
      границе. Поэтому модуль ловит свои ошибки сам, а оболочка подстраховывает глобальными событиями. В отчёте
      каждую ошибку подписывают модулем, версией и командой-владельцем: иначе предупреждения получает хозяин
      страницы, который исправить их не может.
    links:
      - https://legacy.reactjs.org/docs/error-boundaries.html
      - https://ru.react.dev/reference/react/Component#catching-rendering-errors-with-an-error-boundary

  - id: sda-platform-006
    topic: Архитектура большого приложения
    subtopic: Общие контракты платформы
    level: senior
    question: |
      В складской системе виджет «Остатки» делает одна команда и публикует по адресу `/stock/v1/entry.js`; три
      приложения склада грузят его во время работы, и исправления должны доходить до всех сразу. Каждое приложение
      держит в своей сборке тест, который монтирует виджет и ждёт событие `stock:low`. Команда виджета считала
      это событие внутренним, переименовала его в версии 1.4 и выкатила — все три приложения сломались у людей,
      хотя их тесты зелёные. Как узнавать о таких поломках до выкатки виджета?
    options:
      - text: 'Добавить в тесты каждого приложения больше проверок событий виджета'
        why: 'Когда выходит виджет, сборки приложений не запускаются: у них ничего не менялось. Сколько бы проверок там ни было, они не сработают вовремя.'
      - text: 'Прогонять ожидания трёх приложений в сборке виджета до его выкатки'
        correct: true
        why: 'Это контракты со стороны потребителя: сборка виджета упадёт на переименовании события раньше, чем изменение дойдёт до людей.'
      - text: 'Каждую ночь гонять тесты приложений против свежей версии виджета'
        why: 'Виджет выкатили днём, и приложения сломались сразу. Ночной прогон найдёт поломку, когда люди уже с ней столкнулись.'
      - text: 'Публиковать виджет по точной версии, чтобы приложения обновлялись сами'
        why: 'Поломка перестанет приходить сама, но и исправления тоже — а по условию они должны доходить до всех сразу.'
    explanation: |
      Модуль, который грузят во время работы, выходит без сборки потребителей, поэтому их собственные тесты не видят
      его изменений. Ожидания потребителей прогоняют в сборке поставщика — это контракты со стороны потребителя
      из курса «Доставка и качество», применённые к модулю. Так поставщик узнаёт, что считал «внутренним» то,
      чем пользуются другие.
    links:
      - https://docs.pact.io/getting_started/how_pact_works

  - id: sda-migration-001
    topic: Эволюция архитектуры
    subtopic: Постепенная миграция
    level: junior
    question: |
      Платформа онлайн-обучения переезжает со старого приложения на jQuery на новое на Vue. Перед обоими стоит
      прокси: раздел «Расписание» уже открывается из нового приложения, «Домашние задания» и «Оценки» — пока
      из старого. Каждый месяц команда переносит ещё один раздел. Как называется этот приём?
    options:
      - text: 'Большой переезд'
        why: 'Большой переезд — написать новое целиком и переключить всех в один день. Здесь разделы переходят по одному, а старое и новое работают вместе.'
      - text: 'Параллельный запуск'
        why: 'При параллельном запуске старый и новый код делают одно и то же, а результаты сравнивают. Здесь каждый раздел работает только в одном приложении.'
      - text: 'Душитель'
        correct: true
        why: 'Новое приложение растёт рядом со старым и забирает разделы через шов — адрес страницы, пока старое не станет не нужно.'
      - text: 'Ветвление через абстракцию'
        why: 'Ветвление через абстракцию меняет реализацию внутри кода за общим интерфейсом. Здесь разрезают по адресам между двумя приложениями.'
    explanation: |
      Душитель (strangler fig application, Мартин Фаулер) — приём постепенной замены: новая система растёт рядом
      со старой и забирает функцию за функцией. Для фронтенда удобный шов — адрес: прокси на входе решает, какое
      приложение откроет раздел. Польза появляется после каждого переноса, а не в конце.
    links:
      - https://martinfowler.com/bliki/StranglerFigApplication.html

  - id: sda-migration-002
    topic: Эволюция архитектуры
    subtopic: Постепенная миграция
    level: middle
    question: |
      Страховая компания переносит личный кабинет на новый код приёмом «душитель». Разделы: «Оплата полиса» —
      деньги и самый большой поток; «Страховой случай» — сложная форма с документами; «Справочник офисов» — список
      адресов, который клиенты просят переделать уже два года. Команда ещё не переносила ни одного раздела. С чего
      начать?
    options:
      - text: 'С оплаты полиса: в ней больше всего людей, и польза будет самой большой'
        why: 'Польза большая, но и цена ошибки тоже: деньги клиентов. Учиться процессу переезда на самом опасном разделе — лишний риск.'
      - text: 'Со страхового случая: это самая сложная форма, лучше разобраться с ней сразу'
        why: 'Сложная форма с документами — плохое место, чтобы впервые налаживать прокси, общую сессию и откат. Ошибки процесса наложатся на ошибки формы.'
      - text: 'Со справочника офисов: ошибка в нём недорога, а польза заметна'
        correct: true
        why: 'Первым берут раздел, где можно спокойно отладить сам процесс переезда, и при этом клиенты сразу получат то, о чём давно просят.'
      - text: 'Со всех трёх сразу, чтобы переезд закончился быстрее'
        why: 'Это большой переезд по частям: три раздела, три набора ошибок одновременно и ни одного проверенного процесса.'
    explanation: |
      Первый перенесённый раздел учит команду самому переезду: прокси, общая сессия, выкатка по шагам, откат.
      Поэтому его выбирают так, чтобы ошибка стоила недорого, а польза была заметна. Самое нагруженное и рискованное
      переносят последним, когда процесс уже проверен. Начать с самого ценного тоже можно, но тогда учиться
      придётся на самом опасном.
    links:
      - https://martinfowler.com/articles/patterns-legacy-displacement/

  - id: sda-migration-003
    topic: Эволюция архитектуры
    subtopic: Постепенная миграция
    level: middle
    question: |
      В онлайн-банке переписали экран «Выписка за месяц»: суммы, кешбэк и комиссии теперь считает новый код.
      Старые правила расчёта копились восемь лет и описаны не полностью. Клиенты сверяют выписку с бухгалтерией,
      и неверная сумма вызовет волну обращений. Как проверить новый расчёт, прежде чем показать его клиентам?
    options:
      - text: 'Включить новую выписку 5 % клиентов и по числу обращений решить, включать ли остальным'
        why: 'Выкатка по шагам ограничит ущерб, но ошибку найдут сами клиенты — именно этого и хотят избежать.'
      - text: 'Считать выписку старым и новым кодом сразу, сверять суммы, клиентам показывать старую'
        correct: true
        why: 'Это параллельный запуск: новое проверяется на настоящих данных всех клиентов, а клиенты видят проверенный результат. Расхождения разбирают до переключения.'
      - text: 'Написать тесты по описанию старых правил и включить новую выписку, когда они пройдут'
        why: 'Описание неполное, и тесты проверят только то, что в нём есть. Правила, которые знает лишь старый код, останутся непроверенными.'
      - text: 'Сделать переключатель, чтобы каждый клиент мог сам выбрать старую или новую выписку'
        why: 'Клиент не знает, какая из выписок верна, и ошибку всё равно найдёт он сам. К тому же две версии на выбор запутают людей.'
    explanation: |
      Параллельный запуск (parallel run): старый и новый код считают одно и то же на настоящих данных, результаты
      сравнивают, а людям пока показывают старое. Он особенно полезен, когда старые правила описаны не полностью:
      расхождения покажут, чего не знало описание. После того как расхождения разобраны, новое включают
      по шагам.
    links:
      - https://martinfowler.com/articles/patterns-legacy-displacement/

  - id: sda-migration-004
    topic: Эволюция архитектуры
    subtopic: Постепенная миграция
    level: senior
    question: |
      В сервисе такси раздел «Мои адреса» перенесли в новое приложение. Новый код сохраняет адрес объектом
      `{ street, house, entrance }`, а старый хранил одной строкой. Через неделю в новом разделе нашли ошибку
      и переключили людей обратно на старый — и у всех, кто за неделю добавил адрес, раздел упал: старый код
      не умеет читать объект. Какое правило нарушили?
    options:
      - text: 'Переносить раздел нужно было только после параллельного запуска старого и нового'
        why: 'Параллельный запуск проверяет вычисления. Здесь беда в другом: откат встретил данные, которые старый код не прочитает.'
      - text: 'Откатываться можно только целым приложением, а не одним перенесённым разделом'
        why: 'Откат раздела переключателем — нормальная точка отката. Он не сработал из-за формата данных, а не из-за того, что откатили один раздел.'
      - text: 'Пока возможен откат, новое должно писать данные в формате, понятном старому'
        correct: true
        why: 'Тогда откат возвращает людей к коду, который читает всё, что записано. Новый формат вводят отдельным шагом: сначала оба кода понимают оба формата, потом переходят.'
      - text: 'Старый код раздела нужно было удалить сразу после переноса, чтобы не путаться'
        why: 'Тогда откатиться было бы некуда вовсе. Старый код удаляют, когда выполнен критерий окончания, а не сразу.'
    explanation: |
      Точка отката работает, только если старый код может прочитать всё, что успел записать новый. Поэтому
      на время, пока откат возможен, формат данных не меняют. Смену формата делают отдельно приёмом
      «добавить рядом, перевести, удалить»: сначала оба приложения понимают оба формата, и только потом новый
      начинают писать.
    links:
      - https://martinfowler.com/bliki/ParallelChange.html

  - id: sda-migration-005
    topic: Эволюция архитектуры
    subtopic: Постепенная миграция
    level: senior
    question: |
      Платформа онлайн-обучения уже два года переезжает на новое приложение. 90 % разделов перенесены, но старое
      приложение по-прежнему работает: в нём остались «Экспорт в SCORM», «Старый редактор тестов» и «Отчёт
      для минобра». «Экспорт в SCORM» за полгода открывали 4 школы из 900. Любое изменение общей шапки и входа
      делают дважды. Что поможет довести переезд до конца?
    multiple: true
    options:
      - text: 'Измерить, кто пользуется каждым из трёх разделов, и с редкими пользователями договориться о замене'
        correct: true
        why: 'Часто последние разделы держатся на нескольких клиентах. Переносить их «как было» может быть дороже, чем договориться об ином способе.'
      - text: 'Записать критерий окончания и срок и назначить владельца переезда'
        correct: true
        why: 'Без критерия, срока и владельца переходная архитектура становится постоянной. Здесь это уже случилось: две системы живут два года.'
      - text: 'Перенести три раздела в новое приложение точно как было, чтобы не спорить с пользователями'
        why: 'Это ловушка «точно как было»: экспорт в SCORM нужен 4 школам из 900, и переписывать его целиком может быть дороже, чем договориться.'
      - text: 'Отложить решение о трёх разделах до следующего года, когда команда освободится от новых функций'
        why: 'Без владельца и срока переходная архитектура становится постоянной — именно это здесь уже случилось.'
    explanation: |
      Миграции чаще всего застревают на последних процентах: остаются редкие и запутанные функции. Помогают
      заранее записанный критерий окончания, срок и владелец, а также проверка, кто на самом деле пользуется
      оставшимся. Обещание «точно как было» заставляет переносить то, без чего можно обойтись. Пока переходная
      архитектура жива, каждое общее изменение стоит вдвое.
    links:
      - https://martinfowler.com/articles/patterns-legacy-displacement/
      - https://martinfowler.com/bliki/StranglerFigApplication.html

  - id: sda-contracts-001
    topic: Эволюция архитектуры
    subtopic: Эволюция контрактов и данных
    level: junior
    question: |
      Новостное издание отдаёт статьи через GraphQL. В схеме поле `author: String` пометили
      `@deprecated(reason: "Используйте authors")` и добавили рядом список `authors`. Приложение партнёра, которое
      ещё запрашивает `author`, обновится только через месяц. Что оно получит, запросив `author` завтра?
    options:
      - text: 'Ошибку запроса: устаревшие поля сервер не отдаёт'
        why: 'Тогда пометка ничем не отличалась бы от удаления. По спецификации GraphQL устаревшее поле по-прежнему можно запрашивать, чтобы не сломать старых клиентов.'
      - text: 'Значение поля — так же, как и до пометки устаревшим'
        correct: true
        why: 'Пометка предупреждает разработчиков через инструменты и документацию, но поле работает. Удаляют его отдельным шагом, когда клиенты перейдут.'
      - text: 'Пустое значение `null` вместо имени автора'
        why: 'Пометка не меняет данных. Если бы поле отдавало `null`, это было бы молчаливое ломающее изменение.'
      - text: 'Значение, но только для партнёров со старым ключом'
        why: 'Пометка относится к схеме целиком, а не к отдельным клиентам. Поле работает для всех, пока его не удалили.'
    explanation: |
      Пометка «устаревшее» — вторая фаза параллельного изменения: новое уже есть, старое работает, но скоро будет
      удалено. В GraphQL это директива `@deprecated`, в OpenAPI — `deprecated: true`. Инструменты показывают
      такие поля зачёркнутыми и предупреждают разработчиков, а удаляют поле, только когда измерение покажет,
      что им больше не пользуются.
    links:
      - https://spec.graphql.org/October2021/#sec-Field-Deprecation

  - id: sda-contracts-002
    topic: Эволюция архитектуры
    subtopic: Эволюция контрактов и данных
    level: middle
    question: |
      Стриминговый сервис добавил тариф «Семейный»: поле `plan` в ответе профиля теперь может быть `family`.
      Веб-клиент показал тариф нормально, а Android-приложение падает при открытии профиля: оно разбирает `plan`
      строгим перечислением и не знает нового значения. Старые версии приложения есть у 6 % людей. По возможностям
      семейный тариф совпадает с `premium`, отличаются только цена и число профилей. Какое
      решение на стороне API лучше всего защитит эти версии?
    options:
      - text: 'Отдавать `family` в новом поле `planCode`, а в старом `plan` для него — `premium`'
        correct: true
        why: 'Старое поле сохраняет старый словарь, и старые версии видят знакомое значение. Новые версии читают точное значение из нового поля.'
      - text: 'Оставить `family` в `plan` и попросить людей обновить приложение через push-уведомление'
        why: 'Обновятся не все и не сразу, а до этого у 6 % людей профиль будет падать. Уведомление не делает старые версии терпимыми.'
      - text: 'Отдавать `plan` строкой с префиксом, например `x-family`, чтобы старые версии его пропускали'
        why: 'Строгое перечисление не знает и `x-family`: для него это такое же незнакомое значение, и разбор упадёт так же.'
      - text: 'Убрать поле `plan` из ответа профиля для всех, у кого подключён семейный тариф'
        why: 'Если старая версия ждёт обязательное поле, она упадёт и на его отсутствии. Это ещё одно ломающее изменение.'
    explanation: |
      Новое значение перечисления — изменение контракта: строгий потребитель падает на незнакомом значении.
      Защищаются с двух сторон. Потребители заранее становятся терпимыми читателями: у перечисления есть ветка
      «неизвестное». Поставщик не меняет словарь старого поля, а новое значение кладёт в новое поле — так
      старые версии продолжают видеть знакомое.
    links:
      - https://martinfowler.com/bliki/TolerantReader.html

  - id: sda-contracts-003
    topic: Эволюция архитектуры
    subtopic: Эволюция контрактов и данных
    level: middle
    question: |
      Сервис бронирования путешествий хочет удалить из ответа поиска поле `price` (строка вида `"12 500 ₽"`):
      рядом уже два месяца есть `priceMinor` с валютой. Все известные фронтенд-команды говорят, что перешли.
      Но API открыт и для партнёров, и полного списка тех, кто его вызывает, нет. Что сделать перед удалением?
    options:
      - text: 'Удалить поле: все известные команды перешли, а остальным давно пора было перейти'
        why: 'Неизвестные потребители сломаются молча, и узнают о них только по жалобам после удаления.'
      - text: 'Держать оба поля всегда, раз нельзя заранее узнать всех потребителей открытого API'
        why: 'Узнать можно — измерением. А «всегда» значит, что схема будет обрастать старым с каждым таким изменением.'
      - text: 'Выпустить новую версию API без `price` и оставить старую, пока партнёры сами не перейдут'
        why: 'Две версии сервера ради одного поля — дорого, а момент, когда старую можно убрать, всё равно придётся узнавать измерением.'
      - text: 'Попросить клиентов присылать имя и версию в заголовке и посчитать, кто читает `price`'
        correct: true
        why: 'Измерение находит потребителей, о которых никто не помнит. Дальше — владельцам срок, а удаление, когда использование упадёт до согласованного порога.'
    explanation: |
      На масштабе о части потребителей не знает никто: партнёры, старые выгрузки, скрипты. Перед удалением
      их находят измерением: каждый клиент сообщает имя и версию, сервер считает запросы к старому полю.
      По этим числам идут к владельцам, называют дату удаления и удаляют, когда использование упало
      до согласованного порога.
    links:
      - https://martinfowler.com/bliki/ParallelChange.html

  - id: sda-contracts-004
    topic: Эволюция архитектуры
    subtopic: Эволюция контрактов и данных
    level: senior
    question: |
      Интернет-магазин электроники восемь месяцев назад заменил поле `delivery` объектом `shipping` и пометил
      старое устаревшим. Все веб-клиенты и свежие версии мобильных приложений перешли. Старое поле теперь читают
      только версии мобильного приложения старше восьми месяцев — у 2 % покупателей. Поддержка `delivery` мешает
      менять расчёт доставки. Что предпочтительнее?
    options:
      - text: 'Держать `delivery`, пока его читает хотя бы один запрос хотя бы одного клиента'
        why: 'Часть людей не обновится никогда, и поле останется навсегда, а с ним и помеха в расчёте доставки.'
      - text: 'Удалить `delivery` без предупреждения: 2 % покупателей — это немного'
        why: 'У этих 2 % покупателей экран доставки сломается без объяснения, и они не поймут, что надо обновиться.'
      - text: 'Поднять минимальную версию приложения: ниже неё оно просит обновиться, потом удалить поле'
        correct: true
        why: 'Решение для клиентов, которые сами не обновятся: люди видят понятный экран «Обновите приложение», а не сломанный заказ. Порог выбран по измерению.'
      - text: 'Выпустить API версии 2 без `delivery`, а старые версии приложения оставить на версии 1 навсегда'
        why: 'Помеха останется: сервер продолжит считать доставку и для версии 1. Две версии API ради одного поля — двойная поддержка.'
    explanation: |
      Последние старые мобильные версии сами не перейдут на новое поле. Для них назначают минимальную
      поддерживаемую версию: ниже неё приложение показывает экран «Обновите приложение». Это продуктовое решение:
      оно отрезает часть людей, поэтому порог выбирают по измерению и после того, как свежие версии давно
      умеют новое.
    links:
      - https://martinfowler.com/bliki/ParallelChange.html

  - id: sda-contracts-005
    topic: Эволюция архитектуры
    subtopic: Эволюция контрактов и данных
    level: senior
    question: |
      В SaaS-CRM у API сделок десяток потребителей, и не все из них терпимые читатели. Часть разбирает ответы
      по старым описаниям: незнакомые поля пропускает, но перечисления знает только по описанию, а запросы шлёт
      ровно такие, как было описано. Команда API собирается выпустить несколько изменений. Какие из них сломают
      таких потребителей?
    multiple: true
    options:
      - text: 'Добавить в ответ сделки новое необязательное поле `source`'
        why: 'Незнакомые поля эти потребители пропускают, так что новое поле в ответе их не заденет. Это обычное совместимое расширение.'
      - text: 'Добавить в поле `stage` новое значение `negotiation`'
        correct: true
        why: 'Строгий потребитель разбирает `stage` перечислением и падает на незнакомом значении. Добавление значения — изменение словаря поля.'
      - text: 'Сделать необязательный параметр запроса `currency` обязательным'
        correct: true
        why: 'Старые потребители его не передают, и их запросы начнут получать ошибку. Требования к запросу можно только ослаблять.'
      - text: 'Передавать сумму `amount` в копейках вместо рублей, оставив поле числом'
        correct: true
        why: 'Форма не изменилась, и ни один разбор не упадёт — но все потребители начнут показывать суммы в сто раз больше. Смена смысла без смены формы — самое опасное ломающее изменение.'
      - text: 'Добавить новый метод `POST /deals/{id}/archive`'
        why: 'Новый метод никого не задевает: старые потребители его просто не вызывают.'
    explanation: |
      Ломающее изменение — то, после которого старый потребитель работает неправильно. Очевидные: удалить,
      переименовать, поменять тип, ужесточить требования к запросу. Неочевидные: новое значение перечисления для
      строгих читателей и смена смысла без смены формы. Добавить поле в ответ или новый метод обычно безопасно —
      этим и пользуется параллельное изменение.
    links:
      - https://martinfowler.com/bliki/TolerantReader.html
      - https://martinfowler.com/bliki/ParallelChange.html

  - id: sda-tech-debt-001
    topic: Эволюция архитектуры
    subtopic: Технический долг как решение
    level: junior
    question: |
      Новостное издание делает спецпроект к выборам: он нужен через две недели и проживёт месяц. Команда знает,
      как правильно встроить его в общую систему публикаций, но это займёт два месяца. Она делает спецпроект
      отдельной страницей с копией части кода, записывает это решение и назначает дату, когда страницу удалят.
      К какой части квадранта Фаулера относится этот долг?
    options:
      - text: 'Безрассудный и осознанный'
        why: 'Безрассудный осознанный долг — когда экономят, хотя выгода раннего выпуска не стоит будущей цены. Здесь выгода раннего выпуска очевидна: через два месяца спецпроект уже никому не нужен.'
      - text: 'Разумный и осознанный'
        correct: true
        why: 'Команда знает, что берёт долг, сравнила выгоду раннего выпуска с ценой и записала решение со сроком. Это нормальный инструмент.'
      - text: 'Безрассудный и неосознанный'
        why: 'Неосознанный долг берут, не понимая, что делают. Здесь команда знает правильный путь и выбирает другой намеренно.'
      - text: 'Разумный и неосознанный'
        why: 'Это долг, который замечают позже: «теперь понятно, как надо было». Здесь команда видит его с самого начала.'
    explanation: |
      Квадрант Фаулера делит долг по двум вопросам: знали ли вы, что берёте долг, и разумно ли это было. Разумный
      осознанный долг покупает скорость там, где она важнее: команда понимает, что упрощает, во что это обойдётся,
      и записывает, когда вернётся к решению. Безрассудный долг — экономия, которая обойдётся дороже.
    links:
      - https://martinfowler.com/bliki/TechnicalDebtQuadrant.html

  - id: sda-tech-debt-002
    topic: Эволюция архитектуры
    subtopic: Технический долг как решение
    level: middle
    question: |
      В стриминговом сервисе два запутанных модуля. Настройки плеера написаны пять лет назад, кода в них много
      и он неприятный, но последние два года его не трогали. Модуль рекомендаций поменьше, его меняют каждую
      неделю две команды, и треть выкаток с ним приходится срочно исправлять. Времени хватает на один модуль.
      С какого начать?
    options:
      - text: 'С настроек плеера: кода больше и он старше, значит и долга в нём больше'
        why: 'Основной долг там, может, и больше, но процентов он не берёт: модуль не трогают. Переписанные настройки ничего не сэкономят.'
      - text: 'С рекомендаций: в них постоянно работают, и каждая правка там дороже'
        correct: true
        why: 'Проценты по долгу платят при каждом изменении. Рекомендации меняют каждую неделю, и треть выкаток срочно исправляют — именно здесь долг стоит дороже всего.'
      - text: 'С того модуля, который проще переписать, чтобы быстрее показать руководству результат'
        why: 'Быстрый результат в модуле с низкими процентами почти ничего не экономит. Выбирают по тому, сколько долг стоит каждый месяц.'
      - text: 'Ни с какого: рефакторинг без новых функций руководство не одобрит'
        why: 'Одобрит, если показать числа: сколько стоят проценты и во что обойдётся исправление. Отказ без расчёта оставляет треть выкаток неудачными.'
    explanation: |
      Проценты по техническому долгу — лишний труд при каждом изменении. Их платят, только когда трогают код,
      поэтому стабильный запутанный модуль можно не трогать, а отдавать долг стоит в горячих точках: там, где часто
      меняют и трудно менять. Фаулер советует отдавать долг постепенно, в первую очередь там, где идёт работа.
    links:
      - https://martinfowler.com/bliki/TechnicalDebt.html

  - id: sda-tech-debt-003
    topic: Эволюция архитектуры
    subtopic: Технический долг как решение
    level: middle
    question: |
      В страховой компании модуль расчёта тарифа на фронтенде мешает всем: команды просят месяц, чтобы его
      переделать. Директор по продукту спрашивает, что компания получит вместо месяца новых функций. Какой ответ
      сильнее всего?
    options:
      - text: 'Показать отчёт анализатора кода: сложность модуля в три раза выше нормы, а код многократно дублируется'
        why: 'Сложность — признак, но не цена. Директор не сможет сравнить «сложность выше нормы» с месяцем новых функций.'
      - text: 'Сослаться на опыт конкурентов: они переписали расчёт тарифа и довольны'
        why: 'Чужой опыт не говорит, сколько стоит ваш модуль. Это довод «как у всех», а не расчёт.'
      - text: 'Посчитать лишние дни в месяц на правки модуля и число сбоев и сравнить с ценой переделки'
        correct: true
        why: 'Это сравнение процентов с основным долгом: директор видит, когда месяц окупится. Такой довод можно проверить и пересчитать.'
      - text: 'Пообещать, что после переделки модуля все команды будут работать с ним вдвое быстрее'
        why: 'Обещание без расчёта нечем проверить, и через месяц его не с чем сравнить. Доверие к следующей просьбе упадёт.'
    explanation: |
      Вложение в архитектуру обосновывают сравнением двух сумм: сколько стоят проценты за период, если ничего
      не делать, и сколько стоит исправление вместе с риском. Сигналы берут из работы: время типовой задачи,
      доля неудачных выкаток, инциденты, история репозитория. Тогда «станет лучше» превращается в число,
      которое можно сравнить с новыми функциями.
    links:
      - https://martinfowler.com/bliki/TechnicalDebt.html

  - id: sda-tech-debt-004
    topic: Эволюция архитектуры
    subtopic: Технический долг как решение
    level: senior
    question: |
      В компании складской логистики руководство ввело план: каждая команда фронтенда выкатывается не меньше
      десяти раз в день, а раз в месяц команды ранжируют по частоте выкаток. Через квартал частота выросла
      вчетверо, а время, за которое задача доходит до складов, не изменилось. Что пошло не так?
    options:
      - text: 'Частота выкаток — неверная метрика: в DORA её нет, и мерить нужно другое'
        why: 'Есть: частота выкаток — одна из пяти метрик DORA. Беда не в метрике, а в том, как ею распорядились.'
      - text: 'Метрику сделали целью и рейтингом, и команды стали дробить ту же работу на мелкие выкатки'
        correct: true
        why: 'DORA предупреждает: метрики — чтобы видеть свой прогресс со временем, а не план и не способ сравнивать команды. Цель подгоняют, и число растёт без пользы.'
      - text: 'Частота выкаток и время до складов связаны слабо, поэтому каждой метрике нужна своя цель'
        why: 'Связь сломала как раз цель: работу дробили ради плана. Новая цель для другой метрики даст новую подгонку.'
      - text: 'Время до складов не меняется, потому что смотрят среднее, а надо 75-й процентиль'
        why: 'Процентиль не объясняет, почему вчетверо больше выкаток ничего не ускорили: та же работа просто разбита на мелкие части.'
    explanation: |
      Метрики DORA — пять показателей доставки изменений: время от коммита до работы у людей, частота выкаток,
      время восстановления, доля неудачных выкаток и доля незапланированных выкаток из-за сбоев. Они нужны, чтобы
      команда видела свой прогресс и находила узкие места. Как только метрику превращают в план или рейтинг, её
      начинают подгонять, и она перестаёт что-либо показывать.
    links:
      - https://dora.dev/guides/dora-metrics-four-keys/

  - id: sda-tech-debt-005
    topic: Эволюция архитектуры
    subtopic: Технический долг как решение
    level: senior
    question: |
      В конструкторе сайтов собирают данные, чтобы решить, где отдавать технический долг. Про модуль шаблонов
      известно несколько фактов. Какие из них говорят, что проценты по долгу в нём высоки?
    multiple: true
    options:
      - text: 'Модуль меняют четыре команды почти каждую неделю'
        correct: true
        why: 'Проценты платят при каждом изменении. Частые правки многими командами делают модуль горячей точкой.'
      - text: 'В модуле 12 000 строк кода'
        why: 'Размер сам по себе ничего не стоит: если большой модуль не трогают, процентов он не берёт.'
      - text: 'Треть выкаток с изменениями модуля откатывали или срочно исправляли'
        correct: true
        why: 'Это прямая цена: каждое изменение в модуле с большой вероятностью требует ещё работы.'
      - text: 'Модуль написан пять лет назад и с тех пор не переписывался'
        why: 'Возраст тоже не цена. Старый код, который работает и не меняется, может спокойно жить дальше.'
      - text: 'В модуле используют старый способ описания типов, которого нет в новых модулях'
        why: 'Это отличие в стиле. Оно мешает, только если модуль часто трогают — а об этом говорят другие факты.'
    explanation: |
      Проценты по долгу видны по работе, а не по коду: как часто модуль меняют, сколько команд в нём работает, сколько
      изменений неудачны, сколько времени уходит на типовую задачу. Размер, возраст и стиль — признаки, которые
      становятся ценой, только если модуль трогают. Горячие точки ищут по истории репозитория: что меняется чаще
      всего и при этом трудно меняется.
    links:
      - https://martinfowler.com/bliki/TechnicalDebt.html

  - id: sda-tradeoffs-001
    topic: Архитектура под ограничениями
    subtopic: Конфликтующие атрибуты качества
    level: junior
    question: |
      На сайте бронирования отелей список свободных номеров кэшируется на CDN. Чем дольше срок свежести, тем быстрее
      открывается поиск и тем меньше нагрузка на сервер, но тем чаще человек видит номер, который уже заняли.
      Как в методе ATAM называют такой параметр?
    options:
      - text: 'Инвариант'
        why: 'Инвариант — то, что должно оставаться верным всегда, например «один номер не продают дважды». Срок свежести — параметр, который выбирают.'
      - text: 'Точка компромисса'
        correct: true
        why: 'От срока свежести сильно зависят сразу несколько качеств — скорость, нагрузка и свежесть, — и тянут они в разные стороны.'
      - text: 'Точка чувствительности только для скорости'
        why: 'Если бы срок влиял только на скорость, это была бы точка чувствительности. Здесь он влияет и на свежесть, причём в обратную сторону.'
      - text: 'Невозможная комбинация'
        why: 'Невозможная комбинация — набор гарантий, который нельзя выполнить вместе. Срок свежести — не гарантия, а параметр, которым выбирают баланс.'
    explanation: |
      В ATAM точка чувствительности — решение, от которого сильно зависит одно качество, а точка компромисса —
      такое решение для нескольких качеств сразу, когда они тянут в разные стороны. Срок свежести кэша — классическая
      точка компромисса: его выбирают вместе с заказчиком, понимая, чем платят.
    links:
      - https://www.sei.cmu.edu/library/architecture-tradeoff-analysis-method-collection/

  - id: sda-tradeoffs-002
    topic: Архитектура под ограничениями
    subtopic: Конфликтующие атрибуты качества
    level: middle
    question: |
      Интернет-магазин электроники продаёт 500 смартфонов по акции, на страницу ждут миллион человек за час.
      Маркетинг хочет точный остаток на карточке: «Осталось 12». Страница отдаётся из CDN, и без него сервер
      каталога не выдержит пика. Продать больше 500 смартфонов нельзя. Что предпочтительнее?
    options:
      - text: 'Отдавать карточку товара мимо CDN, прямо с сервера, чтобы остаток всегда был точным'
        why: 'Точно, но миллион запросов за час уйдёт прямо на сервер каталога, а он без CDN не выдержит. Упадёт продажа целиком.'
      - text: 'Показывать примерный остаток из кэша, а точный проверять сервером при оформлении'
        correct: true
        why: 'Экран обещает чуть меньше, и противоречие исчезает: нагрузку держит CDN, а инвариант «не больше 500» охраняет проверка в самом действии.'
      - text: 'Обновлять точный остаток на карточке, отдельно опрашивая сервер из браузера каждую секунду'
        why: 'Миллион открытых карточек — это сотни тысяч запросов в секунду к серверу. Нагрузка выйдет даже больше, чем без CDN.'
      - text: 'Показывать остаток из кэша как точный, а продажи сверх 500 смартфонов потом отменять'
        why: 'Кэш не даёт точного остатка, а лишние продажи нарушают инвариант. Отмена после оплаты — это обещание, которое сервис нарушил.'
    explanation: |
      Точная свежесть, ответ из кэша и малая нагрузка — невозможная комбинация. Выход — изменить обещание: экран
      показывает примерный остаток, а инвариант «не продать больше, чем есть» проверяет сервер в самом действии,
      при оформлении. Человек, которому не хватило, узнаёт об этом до оплаты.
    links:
      - https://learn.microsoft.com/en-us/azure/well-architected/performance-efficiency/tradeoffs

  - id: sda-tradeoffs-003
    topic: Архитектура под ограничениями
    subtopic: Конфликтующие атрибуты качества
    level: middle
    question: |
      Онлайн-банк хочет, чтобы перевод другому человеку работал в метро без сети и чтобы приложение сразу
      гарантировало: «Деньги отправлены, баланс 4 200 ₽». Списание и проверку остатка делает только сервер.
      Как лучше ответить на это требование?
    options:
      - text: 'Сделать перевод оптимистичным: показать «отправлено», а при ошибке потом откатить'
        why: 'Человек получит гарантию, которой нет: перевод может не пройти, и «отправлено» окажется неправдой о деньгах.'
      - text: 'Хранить баланс на устройстве и списывать перевод локально, сверяя с сервером позже'
        why: 'Баланс на устройстве устарел: за время без сети могли пройти другие списания. Гарантия опять ложная.'
      - text: 'Назвать противоречие: без сети перевод можно принять к отправке, но не гарантировать'
        correct: true
        why: 'Строгая гарантия требует ответа сервера, а без сети его нет. Честный выход — изменить обещание: «Перевод отправится, когда появится связь».'
      - text: 'Пообещать, что команда постарается к релизу сделать и работу без сети, и гарантию'
        why: 'Это невозможная комбинация, и «постараемся» только отложит отказ до релиза. Заказчик услышит «да», а получит «нет».'
    explanation: |
      Работа без сети и строгая согласованность несовместимы: действие, которое разрешено только по последнему
      подтверждённому состоянию, требует ответа сервера. Это честная задача на невозможность: правильный ответ —
      назвать противоречие и изменить обещание продукта, а не делать вид, что его нет.
    links:
      - https://learn.microsoft.com/en-us/azure/well-architected/performance-efficiency/tradeoffs

  - id: sda-tradeoffs-004
    topic: Архитектура под ограничениями
    subtopic: Конфликтующие атрибуты качества
    level: senior
    question: |
      Сервис такси готовится к новогодней ночи: заказов в шесть раз больше обычного пика. Команда собрала идеи,
      чем облегчить нагрузку. Что из этого можно сделать?
    multiple: true
    options:
      - text: 'Обновлять положение машин на карте пассажира раз в 10 секунд вместо 2'
        correct: true
        why: 'Это свежесть картинки, а не инвариант. Пассажир увидит машину чуть позже, зато сервер получит впятеро меньше запросов.'
      - text: 'Списывать оплату по цене, сохранённой на телефоне при заказе, без пересчёта на сервере'
        why: 'Цена — деньги, а это инвариант. Цену с телефона можно подделать: сервер списывает ту, что сам записал в заказ.'
      - text: 'Убрать с главного экрана персональные подсказки адресов на эту ночь'
        correct: true
        why: 'Подсказки второстепенны: пассажир введёт адрес сам. Это не инвариант, а персональные ответы как раз дорого обходятся в пик.'
      - text: 'Отдавать экран «Моя поездка» из общего кэша CDN со сроком 10 секунд'
        why: 'Ответ персональный: общий кэш может отдать его чужому человеку, а доступ к чужим данным — инвариант.'
    explanation: |
      В пик жертвуют тем, что не входит в инварианты: свежестью картинки, второстепенными блоками, персональными
      ответами. Инварианты — деньги, однократность действий, доступ к чужим данным, закон — не обменивают на скорость.
      Их проверяет сервер в самом действии, и при любой нагрузке эта проверка остаётся.
    links:
      - https://learn.microsoft.com/en-us/azure/well-architected/performance-efficiency/tradeoffs

  - id: sda-tradeoffs-005
    topic: Архитектура под ограничениями
    subtopic: Конфликтующие атрибуты качества
    level: senior
    question: |
      На портале госуслуг запись в первый класс открывается раз в год в 00:00, и в первый час трафик в 50 раз выше
      обычного. Остальное время года нагрузка обычная. Список школ меняется раз в год, а одно место нельзя отдать
      двум детям. Денег сверх обычного месячного бюджета на инфраструктуру нет. Какие решения подходят?
    multiple: true
    options:
      - text: 'Отдавать список школ и описания из CDN, а место бронировать одной проверяемой операцией на сервере'
        correct: true
        why: 'Список почти не меняется и спокойно кэшируется, снимая основную нагрузку. Инвариант «одно место — один ребёнок» охраняет серверная операция.'
      - text: 'Показывать число свободных мест примерно, обновляя его раз в минуту'
        correct: true
        why: 'Экран обещает чуть меньше: «мест мало» вместо точного числа. Точность проверит бронирование, а запросы за счётчиком не лягут на сервер.'
      - text: 'Купить серверы под 50-кратный трафик и держать их весь год, чтобы точно хватило'
        why: 'Такие серверы выйдут далеко за обычный месячный бюджет, а 364 дня из 365 будут простаивать. Работу на запрос можно уменьшить дешевле.'
      - text: 'Показывать на кнопке «Записаться» число мест из кэша CDN и записывать по нему, не проверяя место на сервере'
        why: 'Кэш отстаёт, и два ребёнка получат одно место. Инвариант проверяет сервер в самом действии.'
    explanation: |
      Когда пик предсказуем и короток, сначала уменьшают работу на запрос: то, что почти не меняется, отдают
      из кэша, а экран обещает чуть меньше точности. Инвариант при этом проверяет сервер в самом действии. Покупка
      мощности — тоже вариант, но дорогой и ничего не меняющий в устройстве системы.
    links:
      - https://learn.microsoft.com/en-us/azure/well-architected/performance-efficiency/tradeoffs

  - id: sda-degradation-001
    topic: Архитектура под ограничениями
    subtopic: Отказы и деградация
    level: junior
    question: |
      На маркетплейсе BFF вызывает сервис отзывов через предохранитель. Сервис отзывов упал, за минуту накопились
      сотни отказов, и предохранитель разомкнулся. Покупатель открывает карточку товара. Что происходит с вызовом
      отзывов?
    options:
      - text: 'Вызов идёт к сервису отзывов, а BFF ждёт его до тайм-аута'
        why: 'Так работает замкнутый предохранитель. Разомкнутый как раз не пускает вызовы к сервису, чтобы никто не ждал.'
      - text: 'Вызова нет: BFF сразу получает ошибку и отдаёт карточку без отзывов'
        correct: true
        why: 'Разомкнутый предохранитель не тратит ресурсы на заведомо неудачный вызов и сразу возвращает ошибку, а вызывающий показывает запасной вид.'
      - text: 'Вызов уходит, но с пробной пометкой, и его результат решает, замкнуться ли'
        why: 'Пробный вызов делает полуоткрытый предохранитель, и только один, когда истекло время ожидания. Не каждый запрос покупателя.'
      - text: 'BFF повторяет вызов три раза подряд, пока сервис не ответит'
        why: 'Повторы к упавшему сервису только добавляют ему нагрузки. Предохранитель нужен как раз, чтобы перестать его вызывать.'
    explanation: |
      У предохранителя три состояния. Замкнут — вызовы идут, отказы считаются. Разомкнут — вызовов нет, сразу ошибка
      и запасной ответ, а сервис получает передышку. Полуоткрыт — через заданное время один пробный вызов: удался —
      замыкается, не удался — снова размыкается.
    links:
      - https://martinfowler.com/bliki/CircuitBreaker.html

  - id: sda-degradation-006
    topic: Архитектура под ограничениями
    subtopic: Отказы и деградация
    level: middle
    question: |
      Сервер отрисовки страницы профиля в соцсети ходит ко всем сервисам через общий пул на 200 соединений. Сервис
      «Похожие люди» отвечает по 8 секунд, тайм-аут у вызова — 2 секунды. В вечерний пик его вызовы занимают почти
      весь пул, и запросы постов и шапки профиля ждут свободного соединения. Что изменить?
    options:
      - text: 'Поднять тайм-аут «Похожих людей» до 8 секунд, чтобы вызовы успевали завершиться'
        why: 'Каждый вызов будет держать соединение вчетверо дольше, и пул займётся ещё быстрее.'
      - text: 'Дать «Похожим людям» свой предел в 20 соединений, при занятом — профиль без блока'
        correct: true
        why: 'Это перегородка: медленный сервис занимает только свой отсек, а посты и шапка идут через остальные соединения. Заполненный отсек не ставит вызов в очередь, а сразу отказывает.'
      - text: 'Повторять вызов «Похожих людей» один раз после тайм-аута, чтобы блок появлялся чаще'
        why: 'Повтор займёт соединение ещё на 2 секунды и добавит нагрузки медленному сервису.'
      - text: 'Поставить предохранитель на вызовы постов и шапки профиля, чтобы они не ждали'
        why: 'Посты и шапка здоровы, они просто ждут соединения. Предохранитель на них начнёт отказывать в главном.'
    explanation: |
      Перегородка (bulkhead) даёт каждой зависимости свои ресурсы: свой пул или свой предел одновременных вызовов.
      Медленная зависимость занимает только свой отсек, а когда он заполнен, новый вызов сразу считается неудачным,
      а не ждёт в очереди. Название — от переборок в корпусе корабля, где пробоина заполняет водой только один отсек.
      Перегородка защищает соседей, но не саму страницу: второстепенному блоку ещё нужен короткий тайм-аут
      по важности — сотни миллисекунд, а не 2 секунды.
    links:
      - https://learn.microsoft.com/en-us/azure/architecture/patterns/bulkhead

  - id: sda-degradation-003
    topic: Архитектура под ограничениями
    subtopic: Отказы и деградация
    level: middle
    question: |
      Сайт поиска работы отрисовывает страницу вакансии на сервере и должен отдать её за 1 секунду. Сервер по очереди
      вызывает три сервиса: саму вакансию (без неё страница не нужна), похожие вакансии и статистику зарплат.
      У всех трёх вызовов тайм-аут 30 секунд. Как лучше задать ожидание?
    options:
      - text: 'Оставить 30 секунд у всех трёх вызовов, но повторять каждый вызов при тайм-ауте'
        why: 'Страница и так ждёт до 90 секунд, а повторы удлинят ожидание и добавят нагрузки медленным сервисам.'
      - text: 'Поставить всем трём вызовам одинаковый короткий тайм-аут — по 300 мс на каждый'
        why: 'Второстепенным это подходит, но вакансия может законно отвечать дольше 300 мс — тогда страница не откроется без главного.'
      - text: 'Крайний срок 1 с: второстепенным по 200 мс, вакансии до 600 мс, всем — не больше остатка'
        correct: true
        why: 'Каждый вызов получает не свои полные 30 секунд, а свою долю секунды и не больше того, что осталось. Второстепенные ограничены коротко, главное ждёт дольше.'
      - text: 'Убрать тайм-ауты совсем и отдавать страницу только тогда, когда ответят все три сервиса'
        why: 'Без предела ожидания один медленный сервис держит соединения и роняет всю отрисовку — это путь к каскадному сбою.'
    explanation: |
      Тайм-аут выбирают по важности вызова, а у всего запроса задают крайний срок: каждый следующий вызов получает
      только оставшееся время. Так страница укладывается в свой бюджет, главное ждёт дольше второстепенного,
      а медленная зависимость не держит ресурсы дольше, чем нужно.
    links:
      - https://sre.google/sre-book/addressing-cascading-failures/

  - id: sda-degradation-004
    topic: Архитектура под ограничениями
    subtopic: Отказы и деградация
    level: senior
    question: |
      На сайте объявлений о недвижимости BFF вызывает сервис объявлений через предохранитель: разомкнуться, если
      за 10 секунд больше половины ответов — не 200. По утрам много людей открывает старые ссылки на снятые
      объявления, сервис отвечает на них 404, и предохранитель размыкается — после этого не открываются и живые
      объявления. Что исправить?
    options:
      - text: 'Поднять порог размыкания с половины до 90 % неудачных ответов за окно'
        why: 'Утром доля 404 может дойти и до 90 %, и предохранитель снова разомкнётся. Беда не в пороге, а в том, что считается отказом.'
      - text: 'Считать отказом только тайм-ауты и ошибки сервера, а 404 — нормальным ответом'
        correct: true
        why: '404 на снятое объявление — нормальный ответ: сервис работает и сказал правду. Предохранитель должен реагировать на признаки болезни сервиса, а не на содержание ответов.'
      - text: 'Убрать предохранитель совсем, раз он мешает людям открывать живые объявления'
        why: 'Тогда при настоящем сбое сервиса BFF будет ждать каждый вызов до тайм-аута, и медленный сервис утянет за собой остальное.'
      - text: 'Перенести предохранитель в браузер, чтобы каждый человек размыкал свой'
        why: 'В браузере ошибка та же: человек, открывший старую ссылку, разомкнёт свой предохранитель и не откроет живое объявление.'
    explanation: |
      Предохранитель считает отказы, поэтому важно, что считать отказом. Тайм-ауты, обрывы и ошибки сервера говорят,
      что сервису плохо. Ответы вроде 404 или отказа по неверным данным — нормальная работа: сервис ответил
      по существу. Если считать их отказами, предохранитель отключает здоровый сервис.
    links:
      - https://martinfowler.com/bliki/CircuitBreaker.html

  - id: sda-degradation-005
    topic: Архитектура под ограничениями
    subtopic: Отказы и деградация
    level: senior
    question: |
      У авиакомпании в первые минуты онлайн-регистрации на популярный рейс сервер перегружен и начинает быстро
      отвечать 503 с `Retry-After: 5` на часть запросов. Страница регистрации шлёт три вида запросов: выбор места
      и посадочный талон, подсказки «Добавить багаж» и аналитику. Как должна вести себя страница?
    multiple: true
    options:
      - text: 'Помечать запросы важностью, чтобы сервер первыми отбрасывал подсказки и аналитику'
        correct: true
        why: 'Сервер, который знает важность, при перегрузке отказывает второстепенному и успевает обслужить регистрацию.'
      - text: 'Повторять выбор места не раньше, чем через указанные в `Retry-After` 5 секунд, с разбросом'
        correct: true
        why: 'Сервер прямо сказал, сколько ждать. Ранние повторы только добавят ему нагрузки, а разброс не даст всем вернуться одновременно.'
      - text: 'Не повторять подсказки и аналитику после 503, а просто не показывать подсказку'
        correct: true
        why: 'Второстепенное в перегрузку не повторяют: без подсказки о багаже регистрация проходит, а лишние повторы мешают главному.'
      - text: 'Повторять каждый запрос сразу три раза, чтобы хоть один успел до перегрузки'
        why: 'Мгновенные повторы втрое умножают нагрузку на перегруженный сервер и превращают перегрузку в лавину.'
      - text: 'Повторять и в браузере, и в BFF, чтобы точно дойти до сервера'
        why: 'Повторы на нескольких уровнях перемножаются. Повторяет только один уровень цепочки.'
    explanation: |
      При перегрузке сервер быстро отбрасывает наименее важные запросы. Фронтенд помогает с двух сторон: помечает
      важность запросов и правильно ведёт себя после быстрого отказа — уважает `Retry-After`, не повторяет
      второстепенное и повторяет только на одном уровне. Иначе повторы превращают перегрузку в каскадный сбой.
    links:
      - https://sre.google/sre-book/handling-overload/

  - id: sda-bottleneck-001
    topic: Архитектура под ограничениями
    subtopic: Поиск узкого места
    level: junior
    question: |
      На платформе онлайн-обучения LCP страницы урока у телефонов — 4,0 секунды. Данные реальных пользователей
      разложили его так: время до первого байта — 0,5 с, задержка загрузки — 0,2 с, загрузка обложки видео — 3,0 с,
      задержка отрисовки — 0,3 с. Команда хочет ускорить сервер вдвое. Сколько это сэкономит в лучшем случае?
    options:
      - text: 'Около 2 секунд — половину LCP'
        why: 'Сервер отвечает только за время до первого байта — 0,5 с. Ускорить вдвое можно только этот отрезок, а не всю метрику.'
      - text: 'Около 0,25 секунды — половину времени до первого байта'
        correct: true
        why: 'Половина от 0,5 секунды до первого байта. Выигрыш не может быть больше доли той части, которую ускоряют, а узкое место здесь — загрузка обложки, 3 секунды.'
      - text: 'Около 1,5 секунды — половину времени загрузки обложки видео'
        why: 'Обложку грузит CDN, а не сервер приложения. Ускорение сервера её загрузку не изменит.'
      - text: 'Нисколько: скорость сервера на LCP страницы вообще не влияет'
        why: 'Влияет через время до первого байта. Но здесь этот отрезок маленький, поэтому и выигрыш маленький.'
    explanation: |
      Узкое место — часть, которая ограничивает целое. Эффект изменения не больше доли того отрезка, который ускоряют:
      это частный случай закона Амдала. Здесь три секунды из четырёх уходят на загрузку обложки, и начинать нужно
      с неё — размер, формат, CDN, — а не с сервера.
    links:
      - https://web.dev/articles/optimize-lcp

  - id: sda-bottleneck-002
    topic: Архитектура под ограничениями
    subtopic: Поиск узкого места
    level: middle
    question: |
      У новостного сайта время до первого байта у читателей из Владивостока — 2,1 секунды, из Москвы — 0,3. Заголовок
      `Server-Timing` в обоих случаях показывает, что сервер готовил страницу 120 мс. Сервер стоит в Москве,
      страницы отдаются без CDN. Где узкое место?
    options:
      - text: 'В базе данных: её запросы медленные у дальних читателей'
        why: 'Время работы сервера, включая базу, одинаковое — 120 мс. Значит, сервер не тратит на дальних читателей больше времени.'
      - text: 'В сети на пути между дальним читателем и сервером в Москве'
        correct: true
        why: 'Сервер работает одинаково быстро, а первый байт приходит поздно только к дальним читателям. Время уходит в пути: расстояние, установка соединения. Тут помогает CDN рядом с читателями.'
      - text: 'В браузере: у дальних читателей телефоны слабее, а JavaScript тяжёлый'
        why: 'Время до первого байта браузер не тратит: он ещё ничего не получил. JavaScript влияет на отрезки после первого байта.'
      - text: 'В сервере приложения: ему не хватает мощности'
        why: 'Тогда `Server-Timing` показал бы, что страница готовится дольше. Он показывает одинаковые 120 мс.'
    explanation: |
      Время до первого байта складывается из пути по сети и работы сервера. `Server-Timing` показывает, что делал
      сервер; если сервер работал быстро, а первый байт пришёл поздно, время ушло в сети: расстояние, перенаправления,
      установка соединения. Сначала отвечают на вопрос «браузер, сеть или сервер», и только потом выбирают изменение.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Server-Timing

  - id: sda-bottleneck-003
    topic: Архитектура под ограничениями
    subtopic: Поиск узкого места
    level: middle
    question: |
      У калькулятора страховой компании INP на 75-м процентиле — 500 мс, хотя на ноутбуке разработчика каждое нажатие
      отвечает быстро. На странице свой код, чат-бот партнёра и два счётчика аналитики. Нужно узнать, какие скрипты
      занимают основной поток у реальных пользователей в момент нажатий. Что выбрать?
    options:
      - text: 'Записать профиль производительности в DevTools на ноутбуке разработчика'
        why: 'Профиль подробный, но это одно быстрое устройство без настоящих людей: на нём медленных нажатий как раз и нет.'
      - text: 'Собирать в RUM записи Long Animation Frames о скриптах в кадрах с нажатиями'
        correct: true
        why: 'LoAF сообщает у реальных пользователей адрес и длительность каждого скрипта в долгом кадре — свой код это, чат-бот или аналитика. Данные будут только из браузеров на Chromium.'
      - text: 'Собирать в RUM записи Long Tasks API обо всех задачах основного потока дольше 50 мс'
        why: 'Long Tasks покажет, что долгие задачи есть, но почти не скажет, чьи они: обычно указан только фрейм, а не скрипт.'
      - text: 'Смотреть в RUM среднее INP по всем страницам сайта за последнюю неделю'
        why: 'Среднее не говорит ни где медленно, ни почему, а порог INP проверяют по 75-му процентилю.'
    explanation: |
      Long Animation Frames — API, которое сообщает о кадрах дольше 50 мс и о скриптах, которые их заняли: адрес,
      функция, длительность. Собранное в RUM, оно показывает виновников медленных нажатий у реальных пользователей,
      включая чужие скрипты. Ограничение — только браузеры на Chromium (с Chrome 123); выводы о Safari из этих данных
      не делают.
    links:
      - https://developer.chrome.com/docs/web-platform/long-animation-frames

  - id: sda-bottleneck-004
    topic: Архитектура под ограничениями
    subtopic: Поиск узкого места
    level: senior
    question: |
      Дашборд складской системы на компьютерах кладовщиков открывается с LCP 4,0 секунды. Главный элемент — схема
      склада картинкой (`<img>`), адрес которой приходит в ответе API. Разложение: время до первого байта — 0,6 с;
      задержка загрузки — 1,9 с: адрес картинки браузер узнаёт только после загрузки всего JavaScript и запроса
      к API; загрузка картинки — 0,4 с; задержка отрисовки — 1,1 с. Какое изменение даст больше всего за меньшую
      цену?
    options:
      - text: 'Перевести серверы на более мощные машины — время до первого байта сократится до 0,4 с'
        why: 'Экономия — 0,2 секунды, а платить придётся каждый месяц. Время до первого байта здесь не узкое место.'
      - text: 'Отдавать `<img>` схемы прямо в HTML с `fetchpriority="high"` — около двух недель работы'
        correct: true
        why: 'Это бьёт в самый большой отрезок — 1,9 секунды задержки загрузки: браузер узнаёт о картинке сразу из HTML, а не после всего JavaScript. Стоит недорого.'
      - text: 'Сжать картинку схемы, чтобы её загрузка заняла 0,2 с вместо 0,4 — один день работы'
        why: 'Дёшево, но выигрыш — 0,2 секунды: загрузка картинки — маленький отрезок.'
      - text: 'Разрезать дашборд на отдельные микрофронтенды по виджетам — около полугода работы'
        why: 'Полгода без ясного эффекта: задержка загрузки останется, пока адрес картинки появляется только после скриптов.'
    explanation: |
      Изменения сравнивают по эффекту, охвату и цене, а эффект не больше доли того отрезка, который ускоряют.
      Поэтому начинают с самого большого отрезка. Здесь это задержка загрузки: браузер поздно узнаёт о картинке
      главного элемента. Сам `<img>` в HTML браузер находит сразу, а `fetchpriority="high"` ставит картинку впереди
      остальных загрузок (курс «Доставка и качество», урок «Картинки и видео»). Важно, чтобы в HTML был именно
      элемент: если его по-прежнему рисует JavaScript, ранняя загрузка переложит время в задержку отрисовки.
    links:
      - https://web.dev/articles/optimize-lcp

  - id: sda-bottleneck-005
    topic: Архитектура под ограничениями
    subtopic: Поиск узкого места
    level: senior
    question: |
      Фитнес-приложение за год выросло: тренировок в каталоге стало в десять раз больше, появились три страны и две
      новые команды. Команда записывает в ADR, по какому сигналу начинать переделку архитектуры каталога. Какие
      условия подходят?
    multiple: true
    options:
      - text: 'INP каталога на 75-м процентиле у телефонов выше 180 мс три недели подряд'
        correct: true
        why: 'Наблюдаемый порог по признанной метрике и нужному процентилю, с запасом до границы 200 мс и с длительностью, которая отсекает случайность.'
      - text: 'Когда кто-нибудь из команды скажет на встрече, что каталог стал тормозить'
        why: 'Это не наблюдаемый порог: ощущение одного человека на быстром ноутбуке не говорит, что происходит у людей.'
      - text: 'Когда выйдет новая мажорная версия фреймворка, на котором написан каталог'
        why: 'Выход версии не говорит ничего о скорости каталога. Это довод «новое и модное», а не сигнал.'
      - text: 'Среднее LCP каталога по всем устройствам за любой день выше 2 секунд'
        why: 'Среднее прячет медленных пользователей, а один день — случайный всплеск. Порог LCP проверяют по 75-му процентилю.'
    explanation: |
      Когда пора менять архитектуру, решают по сигналу: заранее записанному наблюдаемому порогу. Он опирается
      на данные реальных пользователей, признанную метрику и процентиль и держится достаточно долго, чтобы отсечь
      случайность. Переделку начинают с запасом — до того, как порог нарушен надолго.
    links:
      - https://web.dev/articles/optimize-lcp
