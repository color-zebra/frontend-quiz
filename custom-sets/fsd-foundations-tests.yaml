title: 'FSD Foundations — тесты'
kind: 'test'
questions:
  - id: 'fsd-f-f1-1-001'
    level: 'junior'
    question: 'Проектируется поиск товаров. Какое утверждение описывает поведение системы, оставляя выбор реализации открытым?'
    options:
      - text: 'Покупатель находит товар по названию и категории'
        correct: true
        why: 'Названы действие и результат покупателя; способ хранения и загрузки ещё можно выбирать.'
      - text: 'Результаты поиска хранятся в общем Redux store'
        why: 'Это решение о хранении, пригодность которого зависит от сценария и срока жизни данных.'
      - text: 'Поисковый запрос отправляется через GraphQL API'
        why: 'Назван способ взаимодействия, но не пользовательская потребность, которую он удовлетворяет.'
      - text: 'Поисковая строка выделяется в отдельный компонент'
        why: 'Граница компонента относится к реализации интерфейса, а не к требуемому результату.'
    explanation: "Требование задаёт нужное поведение, решение — способ его обеспечить. Пользовательский сценарий\nпоказывает, кто действует, с какими входами и каким результатом. Технология может быть настоящим\nвнешним ограничением, но тогда нужно явно назвать его источник. Иначе преждевременный выбор\nинструмента незаметно исключает подходящие альтернативы.\n"
    topic: 'F1. Problem framing'
    subtopic: 'F1.1 Requirements discovery'
    links:
      - 'https://docs.arc42.org/section-1/'
  - id: 'fsd-f-f1-1-002'
    level: 'middle'
    question: 'Заказчик предлагает SPA для публичного каталога. Пользовательский поиск понятен, но требования к первоначальному документу ещё не установлены. Какой вопрос нужно задать до выбора способа доставки этого документа?'
    options:
      - text: 'Какой клиентский кеш быстрее повторно открывает уже просмотренную карточку?'
        why: 'Повторное открытие не выясняет, какие потребители должны получить содержимое при первоначальном запросе.'
      - text: 'Нужны ли индексация карточек и превью ссылок, и что умеют их потребители?'
        correct: true
        why: 'Это определяет ожидаемую доступность содержимого для внешних потребителей и может изменить доставку первоначального документа.'
      - text: 'Какие параметры имеет библиотека маршрутизации будущего SPA?'
        why: 'Это выбор реализации до подтверждения требования к потребителям первоначального документа.'
      - text: 'Как долго хранить последний фильтр в личных настройках?'
        why: 'Срок жизни пользовательского выбора важен, но не определяет содержимое документа для индексации и превью.'
    explanation: 'Технологическое предложение ещё не устанавливает требования ко всем потребителям системы. Помимо человека в браузере ими могут быть поисковые роботы и сервисы превью, возможности которых нужно выяснить. На уровне постановки задачи важен договор о доступном содержимом и метаданных, а не ранний выбор конкретной стратегии рендеринга. Нельзя предполагать одинаковую поддержку исполнения JavaScript всеми внешними потребителями.'
    topic: 'F1. Problem framing'
    subtopic: 'F1.1 Requirements discovery'
    links:
      - 'https://docs.arc42.org/section-1/'
  - id: 'fsd-f-f1-1-003'
    level: 'middle'
    question: 'Внутренний редактор заявок: поля, API и формат ошибок согласованы, справочник содержит 40 записей, формат аудита задан. Какое ещё неизвестное сильнее всего изменит модель сохранения?'
    options:
      - text: 'Нужно ли кешировать справочник между открытиями формы'
        why: 'Для малого справочника это обратимая оптимизация чтения, не определяющая корректность сохранения заявки.'
      - text: 'Как группировать согласованные ошибки полей на экране'
        why: 'Это значимый UX-вопрос, но формат ошибок уже задан и не меняет наличие конфликтующих записей.'
      - text: 'Могут ли несколько людей одновременно менять заявку'
        correct: true
        why: 'Это меняет требования к конфликтам и серверному контракту сохранения, а не только отображение формы.'
      - text: 'В каком порядке показывать уже определённые записи аудита'
        why: 'Порядок представления важен для удобства, но формат и получение аудита уже согласованы.'
    explanation: "Ценность уточнения определяется решениями, которые изменятся после ответа. Совместное редактирование\nможет изменить модель сохранения, хотя внешний вид формы останется прежним. На старте не требуется\nвыяснить все детали: нужно найти условия с высокой ценой ошибки. Приоритет вопросов зависит от\nпродукта, а не от постоянного списка технологий.\n"
    topic: 'F1. Problem framing'
    subtopic: 'F1.1 Requirements discovery'
    links:
      - 'https://docs.arc42.org/section-1/'
  - id: 'fsd-f-f1-1-004'
    level: 'middle'
    question: 'Покупатель создаёт возврат, поддержка запрашивает уточнение, покупатель прикладывает фото. В модели есть только создание возврата. Что необходимо добавить для полноты этого сценария?'
    options:
      - text: 'Роль поддержки, запрос уточнения и передачу вложения'
        correct: true
        why: 'Иначе потеряны участник, входящее действие и данные, без которых возврат не проходит полный путь.'
      - text: 'Настройки оформления и персонализацию экрана возврата'
        why: 'Они не закрывают пропущенный обмен между покупателем и поддержкой.'
      - text: 'Список библиотек загрузки файлов и модальных окон'
        why: 'Инструменты не описывают, кто запрашивает данные и кому приходит результат.'
      - text: 'Выбор серверной базы для хранения всех фотографий'
        why: 'Это деталь решения, которая не заменяет описание участников и границы обмена.'
    explanation: "Для выбранного сценария фиксируют инициатора, действие, входы и наблюдаемый выход. Вторичный\nпользователь может существенно менять архитектуру, даже если основной экран предназначен покупателю.\nФото является новым входом процесса, а уточнение — результатом работы поддержки. Полнота сценария\nне означает включение всех возможных функций продукта.\n"
    topic: 'F1. Problem framing'
    subtopic: 'F1.1 Requirements discovery'
    links:
      - 'https://docs.arc42.org/section-1/'
  - id: 'fsd-f-f1-1-005'
    level: 'senior'
    multiple: true
    question: 'Проектируется аналитический дашборд. Аналитик смотрит метрики внешнего поставщика, администратор назначает наборы показателей. Какие уточнения нужны для описания основного сценария и границ?'
    options:
      - text: 'Кто назначает доступные аналитику показатели и откуда приходит назначение?'
        why: 'Это устанавливает вторичного участника и вход, влияющий на основной путь.'
        correct: true
      - text: 'Какую задержку внешних метрик допускает аналитик и как узнаёт об их возрасте?'
        why: 'Это определяет пользовательское ожидание от входных данных и значимость внешней зависимости.'
        correct: true
      - text: 'Как разделить таблицу на компоненты выбранной UI-библиотеки?'
        why: 'Внутренняя реализация не устанавливает роли и внешний договор.'
      - text: 'Какой кеш библиотеки подключить до уточнения периода обновления?'
        why: 'Без требуемой свежести сначала выбирается средство, а не выясняется сценарий.'
      - text: 'Какой результат нужен аналитику, если выбранная метрика отсутствует?'
        correct: true
        why: 'Это уточняет наблюдаемый исход основного пути и отличает отсутствие данных от технического выбора виджета.'
    explanation: 'Контекст показывает пользователей, соседние системы и смысл обмениваемых данных. Вторичная роль может формировать обязательный вход основного сценария, даже если сама не смотрит дашборд. Допустимый возраст метрик влияет на архитектуру, а не только на подпись времени. Не нужно выбирать кеш или компоненты до выяснения этих условий.'
    topic: 'F1. Problem framing'
    subtopic: 'F1.1 Requirements discovery'
    links:
      - 'https://docs.arc42.org/section-1/'
  - id: 'fsd-f-f1-2-001'
    level: 'junior'
    question: 'Требуется «быстрый каталог». Профиль телефона, сеть и объём данных согласованы. Какое уточнение задаёт проверяемый пользовательский результат?'
    options:
      - text: 'Каталог использует последнюю версию фреймворка'
        why: 'Версия инструмента не определяет скорость, которую увидит человек.'
      - text: 'Число компонентов каталога сведено к минимуму'
        why: 'Количество компонентов не измеряет задержку и не обязательно является узким местом.'
      - text: 'В 95% поисков выдача появляется за 800 мс'
        correct: true
        why: 'Заданы начало, наблюдаемый результат, порог и доля замеров для известной среды.'
      - text: 'API отвечает быстрее предыдущей версии каталога'
        why: 'Нет конкретного порога, а время API не включает обработку и показ результата клиентом.'
    explanation: "Измеримое качество связывают со сценарием и средой. Процентиль позволяет видеть хвост задержек,\nкоторый среднее может скрыть. Значение 800 мс здесь — цель примера, а не норматив для любого\nприложения. Для воспроизводимой приёмки также согласуют начало измерения, выборку и способ учёта\nошибок и незавершённых попыток.\n"
    topic: 'F1. Problem framing'
    subtopic: 'F1.2 Quality & constraints'
    links:
      - 'https://docs.arc42.org/section-2/'
      - 'https://docs.arc42.org/section-10/'
  - id: 'fsd-f-f1-2-002'
    level: 'middle'
    question: 'Для дашборда требуется «надёжная загрузка». Главный риск — отказ необязательной рекламной панели не должен мешать чтению уже полученных метрик. Какой критерий отвечает этому риску?'
    options:
      - text: 'При отказе панели метрики остаются видимы, а ошибка относится к панели'
        why: 'Это наблюдаемое поведение заданного отказа, непосредственно защищающее основной результат.'
        correct: true
      - text: 'Весь дашборд доступен после успешного ответа всех сервисов'
        why: 'Общий барьер делает необязательную панель причиной недоступности метрик.'
      - text: 'Каждый запрос панели имеет отдельный try/catch'
        why: 'Конструкция кода не определяет, сохранятся ли метрики на экране.'
      - text: 'Панель повторно загружается, пока общий экран остаётся в loading'
        why: 'Повтор может быть полезен, но блокировка метрик нарушает заданный результат.'
    explanation: 'Надёжность уточняют через отказ и результат, который нужно сохранить. Здесь важна независимость основного чтения от необязательного блока, а не обещание отсутствия сетевых ошибок. Критерий проверяют наблюдением работы экрана при отказе конкретной зависимости. Если части должны быть атомарно согласованы, требования будут другими; это не универсальный рецепт делить любой экран.'
    topic: 'F1. Problem framing'
    subtopic: 'F1.2 Quality & constraints'
    links:
      - 'https://docs.arc42.org/section-2/'
      - 'https://docs.arc42.org/section-10/'
  - id: 'fsd-f-f1-2-003'
    level: 'middle'
    question: 'Встраиваемый виджет: срок и бюджет релиза согласованы, данные малы и укладываются в память. Какое новое ограничение меняет допустимую схему исполнения и сетевой интеграции, а не только объём работ или оформление?'
    options:
      - text: 'Виджет нужен в iframe, его документ имеет CSP с запретом inline и заданным connect-src'
        correct: true
        why: 'Среда ограничивает исполнение и разрешённые сетевые назначения; нужно согласовать размещение ресурсов и API в этих рамках.'
      - text: 'К релизу нужны переводы трёх уже спроектированных статичных подписей'
        why: 'В данной постановке это объём локализации текста, а не изменение среды выполнения или доступных соединений.'
      - text: 'Цвета виджета должны браться из согласованного набора CSS-переменных'
        why: 'Это реальное требование оформления, но оно не меняет заданную модель исполнения и обмена.'
      - text: 'Демонстрация переносится на день в пределах утверждённого срока'
        why: 'Бизнес-календарь важен для планирования, однако здесь не вводит нового технического ограничения интеграции.'
    explanation: 'Нужно отделять бизнес-рамки поставки, ресурсы устройства и ограничения среды выполнения. В этом случае объём и срок уже учтены, а iframe и политика самого документа виджета сужают допустимые способы исполнения и сетевого обмена. CSP документа родителя не следует автоматически считать политикой всех скриптов чужого iframe: выясняют фактический договор встраивания и заголовки. Техническое ограничение не отменяет бизнес-рамок, но может сделать выбранную интеграцию недопустимой.'
    links:
      - 'https://docs.arc42.org/section-2/'
      - 'https://docs.arc42.org/section-10/'
      - 'https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP'
    topic: 'F1. Problem framing'
    subtopic: 'F1.2 Quality & constraints'
  - id: 'fsd-f-f1-2-004'
    level: 'middle'
    question: 'Панель остатков допускает отставание до минуты; частое обновление по мобильной сети дорого. При доступной сети API позволяет получать текущее состояние в этом бюджете. Какой вывод обоснован?'
    options:
      - text: 'Кешировать остаток на пять минут, чтобы снизить трафик'
        why: 'Пять минут превышают согласованное минутное отставание, даже при быстром показе кеша.'
      - text: 'Считать постоянный канал обязательным из-за требования актуальности'
        why: 'Минутный допуск сам по себе не требует постоянного соединения; подходящий периодический обмен допустим.'
      - text: 'Поставить таймер ровно на минуту без учёта времени запроса'
        why: 'Изменение сразу после чтения может обнаружиться позже минуты с учётом следующего запроса.'
      - text: 'Периодическое обновление допустимо; постоянный канал не обязателен'
        correct: true
        why: 'Минутный допуск позволяет подобрать период проверки с запасом на запрос; более частый канал не следует из требования.'
    explanation: 'Допустимое отставание позволяет выбирать частоту и способ обновления, учитывая трафик и сложность. Период должен оставлять запас на задержку запроса: ровно минутный таймер сам по себе не доказывает минутную свежесть. Постоянный канал может быть полезен по другим условиям, но из данного допуска не обязателен. Поведение при offline и невозможности выдержать бюджет согласуют отдельно.'
    topic: 'F1. Problem framing'
    subtopic: 'F1.2 Quality & constraints'
    links:
      - 'https://docs.arc42.org/section-2/'
      - 'https://docs.arc42.org/section-10/'
  - id: 'fsd-f-f1-2-005'
    level: 'senior'
    question: 'Редактор обязан восстановить весь ввод после закрытия браузера offline. Документы запрещено сохранять на устройстве; сервер недоступен. Как поступить с требованиями?'
    options:
      - text: 'Записать документы локально под названием технического кеша'
        why: 'Переименование не меняет факт хранения и не снимает запрет.'
      - text: 'Согласовать изменение запрета или гарантии восстановления'
        correct: true
        why: 'После закрытия ввод должен где-то сохраниться; текущие условия исключают доступные места.'
      - text: 'Оставить ввод в памяти и обещать восстановление после запуска'
        why: 'Память завершённой вкладки не обеспечивает такое восстановление.'
      - text: 'Повторять отправку при закрытии до подтверждения сервера'
        why: 'Без сети отправка невозможна, а время жизни страницы не контролируется приложением.'
    explanation: "Иногда архитектурная работа выявляет несовместимость гарантий. Восстановление после завершения\nтребует сохранённой копии, а сервер и устройство в условии исключены. Можно обсуждать разрешённое\nзащищённое локальное хранение или сокращение offline-сценария. Это изменения требований,\nкоторые принимает их владелец; библиотека не устраняет логическое противоречие.\n"
    topic: 'F1. Problem framing'
    subtopic: 'F1.2 Quality & constraints'
    links:
      - 'https://docs.arc42.org/section-2/'
      - 'https://docs.arc42.org/section-10/'
  - id: 'fsd-f-f1-2-006'
    level: 'senior'
    question: 'Каталог вырастет с 10 тысяч до миллиона товаров. Нагрузка и профиль устройства согласованы. Какой критерий проверяет масштабируемость пользовательского поиска?'
    options:
      - text: 'База данных вмещает миллион строк без изменения схемы'
        why: 'Ёмкость базы не определяет задержку выдачи, объём ответа или работу клиента.'
      - text: 'Время поиска измерено на нынешних десяти тысячах товаров'
        why: 'Текущее измерение не показывает поведение при ожидаемом росте.'
      - text: 'Используется библиотека с заявленной поддержкой больших списков'
        why: 'Название инструмента не подтверждает выполнение требований всей системой.'
      - text: 'При росте объёма первая выдача укладывается в заданные задержку и трафик'
        correct: true
        why: 'Критерий связывает рост данных с сохранением наблюдаемого результата при заданных условиях.'
    explanation: 'Масштабируемость описывает, как система сохраняет нужные качества при росте определённой нагрузки или объёма. Нужно назвать ось роста, сценарий и допустимые затраты. Миллион товаров на сервере не означает передачу миллиона строк на телефон: границы загрузки тоже часть решения. Такой критерий не доказывает масштабируемость при любом числе пользователей; другой рост проверяют отдельно.'
    topic: 'F1. Problem framing'
    subtopic: 'F1.2 Quality & constraints'
    links:
      - 'https://docs.arc42.org/section-2/'
      - 'https://docs.arc42.org/section-10/'
  - id: 'fsd-f-f1-3-001'
    level: 'junior'
    question: 'За две недели нужно проверить, смогут ли сотрудники находить документы по названию. Обязательны вход и проверка прав; API поиска готов. Что разумно включить в MVP?'
    options:
      - text: 'Поиск, доступ к разрешённому документу; рекомендации отложить'
        correct: true
        why: 'Сохраняется целый проверяемый путь пользователя и обязательная граница доступа.'
      - text: 'Вход и просмотр документов; поиск временно заменить ручным списком'
        why: 'Это законченный путь просмотра, но он не проверяет заданную гипотезу поиска по названию.'
      - text: 'Поиск и рекомендации; открытие найденного документа оставить на следующий релиз'
        why: 'Без доступа к результату не проверяется полезность основного пути сотрудника.'
      - text: 'Поиск всех метаданных без ограничения доступа; защищать только скачивание'
        why: 'Условие требует проверки прав; видимость метаданных тоже может входить в защищаемый контекст.'
    explanation: "MVP ограничивает объём ради проверки конкретной ценности, но сохраняет сквозной сценарий.\nОтложенные функции перечисляют явно, иначе участники по-разному понимают готовность.\nОбязательные требования безопасности и другие инварианты не становятся факультативными\nиз-за короткого срока. Иногда такой срок требует пересмотреть сам объём проверяемой гипотезы.\n"
    topic: 'F1. Problem framing'
    subtopic: 'F1.3 Scope & prioritization'
    links:
      - 'https://docs.arc42.org/section-3/'
      - 'https://docs.arc42.org/section-11/'
  - id: 'fsd-f-f1-3-002'
    level: 'middle'
    question: 'Для MVP редактора согласовали только одного редактора документа. Как зафиксировать отсутствие совместной работы, чтобы не выдать предположение за вечную гарантию?'
    options:
      - text: 'Записать единственного редактора как проверенный факт поведения аудитории'
        why: 'Это согласованная граница MVP, а не доказательство отсутствия будущей совместной работы.'
      - text: 'Записать совместную работу как обещанную функцию ближайшего релиза'
        why: 'Функция отложена; такая запись изменит договорённый scope без решения владельца.'
      - text: 'Записать границу MVP и последствия добавления второго редактора'
        correct: true
        why: 'Понятно, что исключено сейчас и какие требования к конфликтам придётся пересмотреть.'
      - text: 'Заложить полноценный merge-протокол в оценку обязательного MVP'
        why: 'Это расширяет обязательную реализацию за пределы согласованного режима вместо фиксации условия пересмотра.'
    explanation: "Scope описывает выбранные границы, а допущение — условие, истинность которого может быть неизвестна.\nСогласованное исключение функции не следует маскировать под свойство предметной области.\nДостаточно записать границу и точку пересмотра, не реализуя будущую систему заранее.\nЭто позволяет уменьшить объём без потери понимания цены будущего расширения.\n"
    topic: 'F1. Problem framing'
    subtopic: 'F1.3 Scope & prioritization'
    links:
      - 'https://docs.arc42.org/section-3/'
      - 'https://docs.arc42.org/section-11/'
  - id: 'fsd-f-f1-3-003'
    level: 'middle'
    question: 'API ленты ещё не описан. Разработчик говорит: «У поставщика точно есть непрерывный архив событий за год». На этом хотят построить восстановление пропущенных данных. Как продолжить обсуждение?'
    options:
      - text: 'Принять годовой архив за факт, поскольку история нужна продукту'
        why: 'Желание потребителя не создаёт гарантию поставщика и срок хранения данных.'
      - text: 'Записать допущение, цену ошибки и вопрос владельцу контракта'
        why: 'Гарантия становится проверяемой неизвестной, а не скрытым основанием решения.'
        correct: true
      - text: 'Считать отсутствие описания доказательством отсутствия архива'
        why: 'Неизвестность не подтверждает противоположное свойство; нужен источник ответа.'
      - text: 'Проверить наличие одного старого события и обещать полный архив'
        why: 'Единичный пример не доказывает непрерывность, срок и доступность всех событий.'
    explanation: 'Факт опирается на источник, допущение принимается для продолжения работы, открытый вопрос ждёт ответа. Здесь ошибка может сделать восстановление истории невозможным, поэтому контракт проверяют до дорогой зависимости от него. Рабочую схему можно продолжать с оговоркой, но нельзя обещать архив на основании потребности интерфейса. Важны полнота и срок гарантии, а не наличие одного удачного примера.'
    topic: 'F1. Problem framing'
    subtopic: 'F1.3 Scope & prioritization'
    links:
      - 'https://docs.arc42.org/section-3/'
      - 'https://docs.arc42.org/section-11/'
  - id: 'fsd-f-f1-3-004'
    level: 'middle'
    question: 'Нужно обработать пользовательское видео. Через неделю выбирают клиентскую или серверную обработку; максимальные размер и длительность файлов ещё неизвестны. Плеер готов, цвета согласованы, API списка стабилен. Какую неизвестную проверить раньше?'
    options:
      - text: 'Запас скорости открытия уже укладывающегося в бюджет плеера'
        why: 'Это полезная оптимизация, но пока не определяет, сможет ли выбранный способ обработки принять реальные входы.'
      - text: 'Правила кеширования малого стабильного списка медиа'
        why: 'Они обратимы и не закрывают риск выбора неподходящей среды обработки.'
      - text: 'Реальный диапазон размеров и длительности загружаемого видео'
        why: 'Диапазон может изменить место обработки, память и сценарий ожидания, то есть цену поздней переделки.'
        correct: true
      - text: 'Формат карточки видео на второстепенном экране'
        why: 'Он не определяет достижимость основного процесса обработки.'
    explanation: 'Неизвестные приоритизируют по последствиям ошибки и цене позднего изменения. Входной диапазон может изменить архитектуру обработки, тогда как оптимизация малого списка имеет более локальную цену. Реальные образцы и согласованный предел помогают выбрать допустимое решение до его детальной реализации. Это качественная оценка риска, а не требование получить точные вероятности без данных.'
    topic: 'F1. Problem framing'
    subtopic: 'F1.3 Scope & prioritization'
    links:
      - 'https://docs.arc42.org/section-3/'
      - 'https://docs.arc42.org/section-11/'
  - id: 'fsd-f-f1-3-005'
    level: 'senior'
    question: 'Неизвестен максимальный размер импортируемого файла. Оценка в 5 МБ не подтверждена, а возможные 2 ГБ меняют способ обработки. Как поступить до детального проектирования?'
    options:
      - text: 'Принять 5 МБ как рабочий предел без согласования с владельцем данных'
        why: 'Техническая оценка не устанавливает допустимый продуктовый предел и может исключить реальные входы.'
      - text: 'Начать потоковую обработку под 2 ГБ, затем собирать реальные примеры'
        why: 'Вероятность большого входа ещё не выяснена; дорогой выбор предшествует дешёвой проверке.'
      - text: 'Спроектировать все экраны под малые файлы и проверить диапазон перед выпуском'
        why: 'Размер влияет на сценарий и обработку, поэтому поздняя проверка создаёт дорогую переделку.'
      - text: 'Проверить диапазон на реальных примерах и обозначить временный предел'
        correct: true
        why: 'Так уменьшают значимую неопределённость и продолжают работу с явно ограниченным обещанием.'
    explanation: "Допущение полезно, когда позволяет продвинуться и остаётся видимым. При большом разбросе входов\nриск проверяют дешёвым экспериментом или образцами данных до дорогой реализации.\nВременный предел должен быть согласован, а не спрятан в коде. Тест нескольких файлов не доказывает\nпредел для всей аудитории: он служит входом для подтверждения требований.\n"
    topic: 'F1. Problem framing'
    subtopic: 'F1.3 Scope & prioritization'
    links:
      - 'https://docs.arc42.org/section-3/'
      - 'https://docs.arc42.org/section-11/'
  - id: 'fsd-f-f1-4-001'
    level: 'junior'
    question: 'Кандидат согласовал требования каталога, показал подсистемы и клиентскую модель. Затем подробно выбирает компоненты, не обсуждая ID, ошибки и продолжение ответа API. Какой шаг нужен перед этой детализацией?'
    options:
      - text: 'Согласовать API-договор и пройти критический путь с его исходами'
        correct: true
        why: 'Нужно проверить, что модель может выполнить сценарий на реальном контракте, прежде чем закреплять детали UI.'
      - text: 'Детализировать компоненты и считать API прямой сериализацией клиентской модели'
        why: 'Не установлено, что сервер принимает и возвращает эту форму и обеспечивает нужные исходы.'
      - text: 'Выбрать SDK по совпадению типов с моделью, а ошибки согласовать позже'
        why: 'Совпадение типов не доказывает необходимые гарантии и поведение при отказах.'
      - text: 'Перейти к сравнению масштабирования, считая контракт технической деталью'
        why: 'Отсутствующие поля, идентичность или ошибки могут изменить саму реализуемость критического пути.'
    explanation: 'План интервью связывает требования, ответственность, данные, API и критические пользовательские исходы. Если договор обмена не обсуждён, подробная модель клиента может опереться на отсутствующие серверные возможности. Контракты входят в работу с данными и потоками, а не возникают автоматически из выбора SDK. После проверки пути можно углублять нужные детали и объяснять компромиссы.'
    topic: 'F1. Problem framing'
    subtopic: 'F1.4 Interview framing'
    links:
      - 'https://docs.arc42.org/section-1/'
      - 'https://docs.arc42.org/section-4/'
  - id: 'fsd-f-f1-4-002'
    level: 'middle'
    question: 'Из 40 минут интервью прошло 15. Кандидат подробно перечислял фильтры, но ещё не показал общую схему. Интервьюер просит обсудить отказ API. Что разумнее сделать?'
    options:
      - text: 'Закончить описание каждого фильтра, затем переходить к отказам'
        why: 'Это расходует оставшееся время на детали и оставляет главный риск без обсуждения.'
      - text: 'Кратко показать путь данных и на нём разобрать запрошенный отказ'
        correct: true
        why: 'Схема даёт контекст, после чего можно адресно показать поведение в критическом сценарии.'
      - text: 'Пропустить схему и перечислить названия библиотек обработки ошибок'
        why: 'Названия не показывают, как отказ влияет на данные и действия пользователя.'
      - text: 'Начать ответ заново с полного сбора всех требований'
        why: 'Перезапуск теряет уже согласованный контекст; достаточно уточнить затронутые условия.'
    explanation: "Время распределяют по риску и цели обсуждения, а не поровну между всеми деталями.\nКороткая схема позволяет переключить глубину без потери общей модели. Можно явно назвать,\nкакие второстепенные пункты будут пропущены. Важно отреагировать на направление интервьюера,\nсохранив связь между требованиями, данными и наблюдаемым исходом.\n"
    topic: 'F1. Problem framing'
    subtopic: 'F1.4 Interview framing'
    links:
      - 'https://docs.arc42.org/section-1/'
      - 'https://docs.arc42.org/section-4/'
  - id: 'fsd-f-f1-4-003'
    level: 'middle'
    question: 'Осталось пять минут интервью о дашборде. Права и контракты чтения согласованы, бюджет загрузки выполнен. Главный ещё не разобранный риск — отказ одного поставщика метрик. Что обсудить?'
    options:
      - text: 'Дополнительные роли вне согласованной модели'
        why: 'Они не закрывают оставшийся обязательный сценарий отказа.'
      - text: 'Предзагрузку второстепенных экранов ради будущего ускорения'
        why: 'Бюджет выполнен; эта оптимизация менее приоритетна, чем поведение основного экрана при отказе.'
      - text: 'Какие блоки останутся полезны и как человек увидит отказ и восстановится'
        why: 'Это проверяет текущую схему относительно ещё не закрытого важнейшего риска.'
        correct: true
      - text: 'Подробную типизацию каждого поля уже согласованного ответа'
        why: 'Детализация не объяснит, что произойдёт при недоступности поставщика.'
    explanation: 'Время распределяют по неразобранным рискам, а не по числу компонентов. При готовой общей схеме полезнее провести критический путь до пользовательского исхода, чем добавить ещё технические названия. Здесь нужно определить область отказа, сохраняемую полезность и восстановление. Пропущенные второстепенные детали обозначают явно, не выдавая их за доказанно корректные.'
    topic: 'F1. Problem framing'
    subtopic: 'F1.4 Interview framing'
    links:
      - 'https://docs.arc42.org/section-1/'
      - 'https://docs.arc42.org/section-4/'
  - id: 'fsd-f-f1-4-004'
    level: 'middle'
    question: 'Нагрузка не дана. Кандидат предполагает до 1000 элементов и выбирает загрузку коллекции целиком. Как представить решение без ложной точности?'
    options:
      - text: 'Считать 1000 проверенным пределом на основе рабочей оценки'
        why: 'Оценка не является измеренной границей работоспособности на целевых устройствах.'
      - text: 'Показать решение на тысяче элементов, не раскрывая, откуда взялась оценка'
        why: 'Слушатель не сможет отличить внешний факт от допущения, влияющего на выбор.'
      - text: 'Измерить быстрый пример на ноутбуке и объявить такой же предел телефону'
        why: 'Смена среды без проверки не позволяет перенести гарантию клиентской производительности.'
      - text: 'Назвать 1000 допущением, обозначить предел и проверку на данных'
        correct: true
        why: 'Слушатель видит основание выбора и способ понять, когда оно перестаёт выполняться.'
    explanation: "Честное архитектурное объяснение отделяет измеренный факт от рабочей оценки. Предполагаемый размер\nможет оправдать простой первый вариант, но не является доказательством производительности.\nНазванная проверка связывает решение с наблюдением, а условие пересмотра ограничивает обещание.\nНеизвестность не требует молчания: нужно явно показать её влияние.\n"
    topic: 'F1. Problem framing'
    subtopic: 'F1.4 Interview framing'
    links:
      - 'https://docs.arc42.org/section-1/'
      - 'https://docs.arc42.org/section-4/'
  - id: 'fsd-f-f1-4-005'
    level: 'senior'
    question: 'Посреди интервью о самостоятельном аналитическом приложении добавили требование встраивания в чужой сайт: документ iframe имеет ограниченный connect-src и не может обращаться к прежнему API. Как адаптировать обсуждение?'
    options:
      - text: 'Оставить прежний сетевой путь, поскольку логика графиков не изменилась'
        why: 'Новое ограничение делает этот путь недопустимым независимо от корректности вычислений.'
      - text: 'Назвать изменившуюся рамку и пересмотреть размещение и путь обмена'
        why: 'Выделяется затронутая часть схемы; допустимые домены и гарантии интеграции требуют уточнения.'
        correct: true
      - text: 'Начать проектирование графиков заново без старых требований'
        why: 'Встраивание не отменяет согласованные сценарии и данные, поэтому полный перезапуск не обоснован.'
      - text: 'Перейти на другую библиотеку UI до обсуждения договора с партнёром'
        why: 'Библиотека не снимает запрет сетевого назначения; причина лежит на другой границе.'
    explanation: 'Новая информация должна менять конкретные допущения, а не весь ответ без разбора. Здесь изменились допустимые сетевые направления и среда развёртывания, поэтому нужно пересмотреть интеграционный путь, сохранив остальную модель. Если условий партнёра недостаточно, формулируют открытый вопрос и допустимые варианты. Нельзя приписывать новой библиотеке способность обходить политику документа.'
    topic: 'F1. Problem framing'
    subtopic: 'F1.4 Interview framing'
    links:
      - 'https://docs.arc42.org/section-1/'
      - 'https://docs.arc42.org/section-4/'
  - id: 'fsd-f-f2-1-001'
    level: 'junior'
    question: 'Покупка доступна со страницы товара и из быстрого заказа. Какие границы лучше показывают ответственность, общую для двух интерфейсов?'
    options:
      - text: 'Два модуля экранов с собственными копиями процесса покупки'
        why: 'Повторно используемая бизнес-операция остаётся продублированной между представлениями.'
      - text: 'Представления, модуль сценария оформления, правила заказа и доступ к API'
        correct: true
        why: 'Можно менять отображение отдельно от последовательности покупки и технического обмена.'
      - text: 'Общий UI покупок и отдельные обработчики правил на каждом экране'
        why: 'Совместная разметка не выделяет владельца общего процесса и правил оформления.'
      - text: 'Общий HTTP-клиент и независимые цепочки оформления в экранах'
        why: 'Переиспользуется транспорт, но общая ответственность оформления не получила границы.'
    explanation: 'Модуль сценария (use case) — часть приложения, которая координирует выполнение пользовательского действия и возвращает исход. Это не сама история пользователя из F1. Два представления могут запускать один модуль оформления: правила выражают допустимый заказ, а адаптер API отвечает за технический обмен. Границы здесь логические и для малого приложения не требуют отдельных пакетов.'
    topic: 'F2. System decomposition'
    subtopic: 'F2.1 Responsibilities & boundaries'
    links:
      - 'https://docs.arc42.org/section-5/'
  - id: 'fsd-f-f2-1-002'
    level: 'middle'
    question: 'Форма вычисляет доступность доставки, отправляет заказ и рисует ошибки. Что выделить, чтобы второй экран мог использовать тот же процесс?'
    options:
      - text: 'Общая форма ввода с отдельной отправкой на каждом экране'
        why: 'Она делит поля, но не общий процесс, необходимый второму экрану.'
      - text: 'Общий адаптер API с предварительными правилами внутри двух обработчиков'
        why: 'Сетевой обмен общий, но координация и проверки по-прежнему расходятся.'
      - text: 'Общий модуль оформления: проверки, отправка и различимые исходы'
        correct: true
        why: 'Координация и доменные предварительные проверки отделяются от способа ввода и отображения.'
      - text: 'Общий обработчик, принимающий setter и ссылки на поля первого экрана'
        why: 'Процесс связан с первым представлением и не имеет независимого результата для второго.'
    explanation: 'Общий процесс оформления отделяют от способа ввода и показа результата. Модуль возвращает осмысленные исходы, а каждый экран выбирает их представление. Общий HTTP-клиент не заменяет такую координацию, а обёртка с setter первого экрана сохраняет зависимость от его устройства. Выделение оправдано реальным вторым потребителем, а не желанием заранее абстрагировать каждый обработчик.'
    topic: 'F2. System decomposition'
    subtopic: 'F2.1 Responsibilities & boundaries'
    links:
      - 'https://docs.arc42.org/section-5/'
  - id: 'fsd-f-f2-1-003'
    level: 'middle'
    question: 'Небольшой экран настроек обслуживает одна команда. Каждый input, валидатор и преобразование вынесены в отдельный пакет; изменение одного поля требует шести согласованных релизов. Что пересмотреть?'
    options:
      - text: 'Объединить тесно меняющиеся части в согласованный модуль настройки'
        correct: true
        why: 'Границы начинают отражать совместный жизненный цикл изменений и снижают координационную цену.'
      - text: 'Вынести каждую дополнительную проверку в новый пакет'
        why: 'Это усиливает уже наблюдаемую фрагментацию без новой независимой ответственности.'
      - text: 'Заменить проверку полей общим глобальным mutable объектом'
        why: 'Уменьшение числа пакетов не требует неявного совместного владения и скрытых изменений.'
      - text: 'Оставить релизы раздельными, но скрыть их за общим названием'
        why: 'Название не уменьшает фактическую связанность и необходимость координации.'
    explanation: "Модульность оценивают по локальности изменений и понятности контрактов. Слишком мелкие части\nувеличивают число границ, через которые проходит одна правка. Если части почти всегда меняются\nвместе, их самостоятельный выпуск может не приносить пользы. Объединение не означает отказ\nот внутренних функций или тестов: речь о подходящей архитектурной гранулярности.\n"
    topic: 'F2. System decomposition'
    subtopic: 'F2.1 Responsibilities & boundaries'
    links:
      - 'https://docs.arc42.org/section-5/'
  - id: 'fsd-f-f2-1-004'
    level: 'senior'
    question: 'Разделы «Оплата» и «Профиль» содержат одинаковые поля адреса, но правила и сроки изменений различаются. Общий компонент разросся флагами поведения каждого домена. Какой следующий шаг обоснован?'
    options:
      - text: 'Объединить доменные правила, поскольку набор полей одинаков'
        why: 'Визуальное сходство не доказывает совпадение ответственности и правил изменения.'
      - text: 'Запретить любые общие примитивы между двумя разделами'
        why: 'Разные доменные правила не мешают совместно использовать нейтральные элементы ввода.'
      - text: 'Добавить флаг на каждую новую разницу в доменной логике'
        why: 'Без оценки границ это продолжает смешение причин изменения и усложняет контракт.'
      - text: 'Разделить доменные модули сценариев, переиспользуя устойчивые UI-примитивы'
        correct: true
        why: 'Граница следует разным правилам, а общая визуальная механика остаётся общей там, где это выгодно.'
    explanation: "Повторение формы не обязательно означает одну доменную сущность. Адрес доставки и адрес профиля\nмогут иметь разные проверки, владельцев и жизненный цикл. Переиспользование полезно на уровне\nсовпадающего контракта, а не только разметки. Иногда небольшое дублирование дешевле общей\nабстракции, которую каждый модуль сценария вынужден обходить флагами.\n"
    topic: 'F2. System decomposition'
    subtopic: 'F2.1 Responsibilities & boundaries'
    links:
      - 'https://docs.arc42.org/section-5/'
  - id: 'fsd-f-f2-1-005'
    level: 'middle'
    multiple: true
    question: 'После смены поставщика API пришлось менять правила скидок и разметку итоговой суммы, хотя бизнес-условия не изменились. Какие наблюдения указывают на проблему границ?'
    options:
      - text: 'Правило скидки напрямую читает имена полей ответа поставщика'
        correct: true
        why: 'Формат внешнего обмена проник в доменное решение и создаёт техническую причину менять правило.'
      - text: 'Экран отображает доменный результат через локальное форматирование'
        why: 'Это ожидаемая ответственность представления, если формат обмена скрыт за моделью.'
      - text: 'Разметка определяет бизнес-ошибку по строке сетевого сообщения'
        correct: true
        why: 'Технический текст стал неявным контрактом поведения, поэтому смена поставщика ломает UI.'
      - text: 'Адаптер преобразует ответ API в согласованную модель заказа'
        why: 'Это как раз изолирует внешнее представление при неизменном доменном контракте.'
      - text: 'Технический клиент передаёт данные адаптеру, который сохраняет прежнюю модель заказа'
        why: 'Преобразование остаётся на технической границе и не требует знания wire-format от правил или разметки.'
    explanation: "Цена смены внешней системы показывает, где протекли её детали. Если доменные условия прежние,\nизменение только wire-format должно по возможности локализоваться у границы обмена.\nПолной независимости нет: новый смысл или новая гарантия API могут потребовать изменения модуля сценария.\nЗдесь важна разница между техническим переименованием и настоящим изменением бизнес-контракта.\n"
    topic: 'F2. System decomposition'
    subtopic: 'F2.1 Responsibilities & boundaries'
    links:
      - 'https://docs.arc42.org/section-5/'
  - id: 'fsd-f-f2-2-001'
    level: 'middle'
    question: 'Логика оформления должна работать с двумя поставщиками, выбираемыми при запуске приложения. Тесты логики не должны знать об SDK. Как организовать зависимости без изменения правил оформления при выборе поставщика?'
    options:
      - text: 'Контракт операции в модуле сценария, SDK в адаптере'
        correct: true
        why: 'Инверсия зависимостей / ports & adapters: логика зависит от контракта операции, а нужный адаптер подставляется при сборке приложения или в тесте.'
      - text: 'Доменная модель наследуется от класса ответа конкретного SDK'
        why: 'Зависимость от поставщика распространяется внутрь и усложняет замену и тестирование.'
      - text: 'SDK получает право напрямую менять состояние всех экранов'
        why: 'Транспорт становится владельцем UI-последствий и увеличивает число неявных связей.'
      - text: 'Импортировать один адаптер в логику и глобально подменять его SDK в тестах'
        why: 'Здесь тест знает об SDK, а фиксированный импорт не предоставляет требуемую точку выбора двух реализаций при запуске.'
    explanation: "Контракт формулируют со стороны потребности модуля сценария: например, создать заказ и получить исход.\nАдаптер реализует эту возможность через конкретный SDK, а сборка приложения связывает стороны.\nТак направление исходных зависимостей не обязано повторять направление сетевого вызова.\nАбстракция не нужна на каждый вызов, но здесь её оправдывают явные требования замены и тестирования.\nЭтот приём называют инверсией зависимостей; в ports & adapters нужный приложению контракт является портом, а конкретный SDK подключается через адаптер."
    topic: 'F2. System decomposition'
    subtopic: 'F2.2 Dependencies & contracts'
    links:
      - 'https://docs.arc42.org/section-5/'
      - 'https://docs.arc42.org/section-8/'
  - id: 'fsd-f-f2-2-002'
    level: 'middle'
    question: 'Экран вызывает создание экспорта. Сервис может принять задачу, отклонить параметры или отказать в доступе. Какой публичный контракт лучше поддерживает разные представления?'
    options:
      - text: 'Метод получает setter спиннера и ссылку на DOM-контейнер'
        why: 'Модуль сценария связан с конкретным отображением и должен знать внутреннее устройство экрана.'
      - text: 'Метод возвращает только строку локализованного уведомления'
        why: 'Из текста неудобно надёжно восстановить тип исхода, идентификатор задачи и возможное продолжение.'
      - text: 'Параметры на входе, тип исхода и данные на выходе'
        correct: true
        why: 'Смысл результата доступен разным UI; каждый сам выбирает сообщение и навигацию.'
      - text: 'Метод возвращает внутренний response SDK для анализа каждым экраном'
        why: 'Потребители становятся зависимы от технических деталей и повторяют интерпретацию результата.'
    explanation: "Публичный интерфейс должен выражать возможности и результаты подсистемы. Различимые исходы\nпозволяют экрану корректно выбрать действие, не разбирая человеческий текст. Принятая задача\nотличается от готового файла, поэтому её идентификатор и статус имеют значение. Внутренние\nдетали транспорта можно оставить внутри, если они не являются частью требуемой гарантии.\n"
    topic: 'F2. System decomposition'
    subtopic: 'F2.2 Dependencies & contracts'
    links:
      - 'https://docs.arc42.org/section-5/'
      - 'https://docs.arc42.org/section-8/'
  - id: 'fsd-f-f2-2-003'
    level: 'junior'
    question: 'Модуль поиска обещает поиск по фильтру и типизированные результаты. Внутри он заменил HTTP-клиент, сохранив поведение и публичные типы. Что должны учитывать потребители?'
    options:
      - text: 'Обновить HTTP-клиент на экранах вместе с модулем поиска'
        why: 'При неизменном публичном поведении это лишняя техническая зависимость потребителей.'
      - text: 'Использовать прежний интерфейс и проверять обещанное поведение поиска'
        correct: true
        why: 'Контракт сохраняет нужные потребителю свойства и скрывает внутреннюю реализацию.'
      - text: 'Возвращать из поиска response нового клиента для экономии преобразований'
        why: 'Так меняется публичный контракт, хотя замена объявлена внутренней.'
      - text: 'Проверять в потребительских тестах вызовы методов нового клиента'
        why: 'Тесты связываются с внутренним механизмом вместо сохранённых обещаний поиска.'
    explanation: "Деталь реализации может изменяться независимо, пока сохраняется наблюдаемый контракт.\nОн включает не только сигнатуру: значимы смысл результата, ошибки и обещанные свойства поведения.\nСохранение имён методов само по себе совместимости не доказывает. Поэтому потребительские проверки\nсосредоточены на обещаниях, а не на внутренних вызовах выбранного HTTP-клиента.\n"
    topic: 'F2. System decomposition'
    subtopic: 'F2.2 Dependencies & contracts'
    links:
      - 'https://docs.arc42.org/section-5/'
      - 'https://docs.arc42.org/section-8/'
  - id: 'fsd-f-f2-2-004'
    level: 'senior'
    question: 'Модуль A импортирует внутренний mutable store модуля B, чтобы быстро менять его поля. Теперь B не может изменить структуру store без правок A. Как уменьшить связанность?'
    options:
      - text: 'Сделать поля store публичными и документировать их для A'
        why: 'Это закрепляет зависимость от внутренней структуры, из-за которой уже дорогая замена.'
      - text: 'Передавать A полную копию структуры B и возвращать её после редактирования'
        why: 'Форма внутренних данных по-прежнему входит в договор между модулями.'
      - text: 'Ввести общий setter по строковому пути к полю store B'
        why: 'Техническая обёртка сохраняет знание A о полях и допустимых мутациях B.'
      - text: 'Операции B и чтение через публичный контракт'
        correct: true
        why: 'B сохраняет владение изменениями, а A зависит от возможностей, а не устройства хранения.'
    explanation: "Прямой доступ к mutable структуре делает её форму и правила изменения частью скрытого контракта.\nПубличные операции позволяют владельцу сохранить инварианты и менять внутреннее представление.\nИнтерфейс не должен просто зеркалировать каждое поле store: тогда связь сохранится под другим именем.\nНужны осмысленные для потребителя действия и достаточное представление результата.\n"
    topic: 'F2. System decomposition'
    subtopic: 'F2.2 Dependencies & contracts'
    links:
      - 'https://docs.arc42.org/section-5/'
      - 'https://docs.arc42.org/section-8/'
  - id: 'fsd-f-f2-2-005'
    level: 'senior'
    question: 'Контракт saveDraft раньше подтверждал сохранение на сервере. Реализация стала возвращать успех сразу после помещения в очередь вкладки, тип ответа прежний. Совместимо ли это изменение для индикатора «Сохранено»?'
    options:
      - text: 'Да, потому что имя метода и форма ответа не изменились'
        why: 'Совместимость включает смысл подтверждения, который здесь стал слабее.'
      - text: 'Да, если клиент использует тот же транспорт и сериализатор'
        why: 'Транспорт не восстанавливает утраченную гарантию серверного сохранения.'
      - text: 'Нет, нужно различить принятие в очередь и серверное сохранение'
        correct: true
        why: 'Иначе индикатор обещает пользователю более сильную сохранность, чем реально обеспечено.'
      - text: 'Нет, любое внутреннее изменение требует нового экрана'
        why: 'Проблема в изменившейся семантике; её можно выразить в контракте без обязательной замены всего UI.'
    explanation: "Контракт содержит наблюдаемые гарантии, а не только типы данных. Очередь и подтверждённое\nсерверное сохранение — разные исходы операции. Если потребитель использовал прежнее обещание,\nмолчаливое ослабление является несовместимостью. Нужно сохранить прежнюю гарантию либо явно\nизменить договор и согласовать отображение промежуточного состояния.\n"
    topic: 'F2. System decomposition'
    subtopic: 'F2.2 Dependencies & contracts'
    links:
      - 'https://docs.arc42.org/section-5/'
      - 'https://docs.arc42.org/section-8/'
  - id: 'fsd-f-f2-3-001'
    level: 'junior'
    question: 'Пользователь подтверждает заказ, сервер возвращает его номер. Какая цепочка показывает причинный путь от действия до результата?'
    options:
      - text: 'Клик → модуль сценария оформления → API → результат → обновление представления'
        correct: true
        why: 'Видны инициатор, координатор операции, внешняя граница и обратный путь результата.'
      - text: 'Клик → обновление уведомления → завершение модуля сценария без анализа API'
        why: 'Уведомление ещё не доказывает серверный исход и скрывает важную границу.'
      - text: 'API → уведомление → клик → создание запроса оформления'
        why: 'Порядок не соответствует причинности именно заданного пользовательского действия.'
      - text: 'Клик → запись номера заказа в UI → запрос серверу за подтверждением'
        why: 'До ответа неизвестен серверный номер; эта цепочка выдаёт предполагаемый исход за результат.'
    explanation: "Поток показывает, кто инициирует действие и через какие ответственности проходит результат.\nВажно нарисовать обратную ветвь, иначе неясно, откуда UI узнаёт успех или отказ. Реализация может\nиспользовать функции, события или другое средство координации. Схема фиксирует причинность,\nа не обязательный набор классов или синхронный способ исполнения.\n"
    topic: 'F2. System decomposition'
    subtopic: 'F2.3 Data-flow mapping'
    links:
      - 'https://docs.arc42.org/section-6/'
  - id: 'fsd-f-f2-3-002'
    level: 'middle'
    question: 'Строка инициирует изменение количества. Итог читает сумму корзины, значок — общее количество, соседний счётчик — только избранное. Кто должен получить результат изменения корзины?'
    options:
      - text: 'Строка и итог; значок — при следующем открытии корзины'
        why: 'Счётчик количества зависит от этой команды сейчас, а не только при навигации.'
      - text: 'Итог и значок; строка сохраняет введённое без результата команды'
        why: 'Строке нужен подтверждённый исход, в том числе корректировка или отказ.'
      - text: 'Строка получает исход, итог и значок — новые данные корзины'
        correct: true
        why: 'Выбраны инициатор и два потребителя изменившихся данных, а независимый счётчик исключён.'
      - text: 'Строка и избранное; итог и значок остаются привязаны к старому снимку'
        why: 'Избранное независимо, а два зависимых представления не получат актуальный результат.'
    explanation: "У одного действия могут быть несколько наблюдателей. Полезно отдельно отметить, кто принимает\nкоманду и какие представления зависят от результата. Это ещё не выбирает библиотеку состояния.\nПеречень участников помогает проверить, что изменение не осталось локальным случайно и что\nнет нескольких независимых трактовок одной операции.\n"
    topic: 'F2. System decomposition'
    subtopic: 'F2.3 Data-flow mapping'
    links:
      - 'https://docs.arc42.org/section-6/'
  - id: 'fsd-f-f2-3-003'
    level: 'middle'
    question: 'Панель громкости пишет в модель плеера. Подписчик модели обновляет панель так, что её обработчик снова посылает команду изменения; регулировка иногда выполняется дважды. Какой первый шаг помогает найти причину?'
    options:
      - text: 'Добавить задержку повторной команды, сохранив прежние связи'
        why: 'Задержка может уменьшить частоту, но не объяснит, почему отражение результата становится новой командой.'
      - text: 'Нарисовать события и записи, выделив инициатора и обратный цикл'
        why: 'Так различаются действие человека и отражение значения, из которого ошибочно возникает повтор.'
        correct: true
      - text: 'Считать каждое обновление панели новым пользовательским намерением'
        why: 'Это закрепит неверную причинность, поскольку часть обновлений создана самой подпиской.'
      - text: 'Перенести панель и модель в один файл без изменения потока'
        why: 'Совместное размещение кода не меняет цикл событий во время исполнения.'
    explanation: 'Поведенческий цикл возможен и без циклических импортов. Отмечая команды, записи и вызванные ими уведомления, можно найти лишнего инициатора. Результат изменения должен отражаться в UI без неоговорённого повторного действия. После установления причинности выбирают конкретное исправление координации, а не маскируют симптом случайными таймерами.'
    topic: 'F2. System decomposition'
    subtopic: 'F2.3 Data-flow mapping'
    links:
      - 'https://docs.arc42.org/section-6/'
  - id: 'fsd-f-f2-3-004'
    level: 'senior'
    question: 'Загрузка карточки иногда отправляет аналитику подтверждённой покупки. Эффект встроен в преобразование ответа, общее с checkout. Что изменить, сохранив семантику подтверждённой покупки?'
    options:
      - text: 'Перенести отправку покупки в обработку подтверждённого сценария покупки'
        correct: true
        why: 'Побочный эффект получает явную причину и больше не запускается из повторного использования преобразования.'
      - text: 'Отправлять покупку при клике, до подтверждения результата операции'
        why: 'Клик фиксирует намерение; если продукт измеряет подтверждённую покупку, отказ не должен считаться успехом.'
      - text: 'Отправлять покупку при появлении товара в общем хранилище'
        why: 'Товар может появиться из чтения ранее существующих данных, а не новой покупки.'
      - text: 'Отправлять покупку из общего обработчика успешных POST'
        why: 'POST обслуживает разные операции; транспортный успех без контекста не определяет покупку.'
    explanation: "Скрытый побочный эффект делает повторное использование функции опасным для сценариев.\nПреобразование данных желательно отделять от действий с внешним миром. Событие покупки\nдолжно соответствовать определённой продуктом точке успеха, а не факту загрузки сущности.\nЯвное расположение эффекта делает поток понятнее, но само по себе не доказывает отсутствие дубликатов.\n"
    topic: 'F2. System decomposition'
    subtopic: 'F2.3 Data-flow mapping'
    links:
      - 'https://docs.arc42.org/section-6/'
  - id: 'fsd-f-f2-4-001'
    level: 'junior'
    question: 'Нужно согласовать с владельцем продукта, кто использует портал и с какими внешними системами он обменивается данными. Какая схема подходит первой?'
    options:
      - text: 'Последовательность внутренних вызовов обработчика формы'
        why: 'Она отвечает на вопрос о конкретном взаимодействии, но не даёт обзор участников и границ.'
      - text: 'Контекст портала с пользователями и внешними системами'
        correct: true
        why: 'Нужный уровень показывает систему как целое и её окружение без лишних внутренних деталей.'
      - text: 'Граф импортов всех компонентов пользовательского интерфейса'
        why: 'Импорты показывают техническую структуру, а не окружение и цель обмена.'
      - text: 'Модель полей одной серверной сущности портала'
        why: 'Поля полезны для данных, но не раскрывают внешние системы и роли.'
    explanation: "Уровень схемы выбирают по вопросу аудитории. Контекст показывает границу системы и её соседей,\nструктура — внутренние ответственности, последовательность — взаимодействие в конкретном сценарии.\nОдин вид не заменяет все остальные. Обзорная схема полезна именно тем, что оставляет детали\nза пределами обсуждаемого уровня.\nВ C4 различают контекст системы, контейнеры и компоненты; контейнер здесь означает исполняемое приложение или хранилище, а компонент C4 не обязан совпадать с React-компонентом. Поток данных или последовательность выбирают для другого вопроса и не следует объявлять их отдельными уровнями C4."
    topic: 'F2. System decomposition'
    subtopic: 'F2.4 Diagrams & evolution'
    links:
      - 'https://c4model.com/diagrams/system-context'
      - 'https://c4model.com/diagrams/dynamic'
  - id: 'fsd-f-f2-4-002'
    level: 'middle'
    question: 'В структурной схеме поиска есть экран, обработка запроса и API. Неясно, где ответ преобразуется в модель выдачи и как отказ возвращается пользователю. Что добавить для обсуждения этого риска?'
    options:
      - text: 'Дерево визуальных компонентов карточки результата'
        why: 'Оно не объясняет путь запроса, преобразование данных и ветвь отказа.'
      - text: 'Контекст с теми же внешними системами без новых взаимодействий'
        why: 'Контекст полезен для окружения, но не отвечает на вопрос об обработке одного поиска.'
      - text: 'Последовательность запроса, преобразования ответа и показа известного исхода'
        why: 'Так видны участники, порядок и место обработки отказа выбранного сценария.'
        correct: true
      - text: 'Полную схему серверных таблиц, не показывая обработку ответа клиентом'
        why: 'Детали хранения не раскрывают отсутствующую ветвь клиентского взаимодействия.'
    explanation: 'Структурная схема показывает ответственности, а последовательность раскрывает один важный путь между ними. Для рассматриваемого риска нужны вызов API, преобразование результата и обратная ветвь отказа. Не требуется детализировать все обработчики или серверные таблицы. Схема полезна, если отвечает на поставленный вопрос и делает ответственность каждого взаимодействия видимой.'
    topic: 'F2. System decomposition'
    subtopic: 'F2.4 Diagrams & evolution'
    links:
      - 'https://c4model.com/diagrams/system-context'
      - 'https://c4model.com/diagrams/dynamic'
  - id: 'fsd-f-f2-4-003'
    level: 'middle'
    multiple: true
    question: 'На схеме редактирования есть клиентская видимость кнопки и панель. Какие варианты дополнения целиком раскрывают и окончательную проверку права изменения, и подтверждённый исход записи?'
    options:
      - text: 'Сервис проверки права и обмен командой записи с подтверждённым исходом'
        correct: true
        why: 'Показаны оба отсутствующих аспекта: место окончательного решения и путь результата пользователю.'
      - text: 'Сервис проверки права и отправка команды без обратного результата'
        why: 'Проверка показана, но источник подтверждённого исхода для клиента всё ещё отсутствует.'
      - text: 'Проверка видимости кнопки и локальное сообщение об отправке запроса'
        why: 'UI-проверка не является окончательным решением, а отправка не подтверждает запись.'
      - text: 'Панель форматирования и таблицы сервера без пути проверки и ответа'
        why: 'Хранилище и UI-структура не раскрывают требуемые взаимодействия и ответственность.'
    explanation: "Отбор элементов определяется целью схемы. Деталь значима, если без неё меняется понимание\nответственности, гарантии или риска выбранного сценария. Необязательно показывать каждый узел\nреализации. При этом минимализм не оправдывает удаление внешней зависимости, от которой\nзависит корректность операции.\n"
    topic: 'F2. System decomposition'
    subtopic: 'F2.4 Diagrams & evolution'
    links:
      - 'https://c4model.com/diagrams/system-context'
      - 'https://c4model.com/diagrams/dynamic'
  - id: 'fsd-f-f2-4-004'
    level: 'middle'
    question: 'Два изменения: локальный формат даты за стабильным интерфейсом и смена опубликованных ID документов в ссылках и черновиках. Что лучше объясняет разницу их обратимости?'
    options:
      - text: 'Оба одинаково локальны, поскольку меняется одна точка преобразования'
        why: 'Локальность кода не учитывает уже опубликованные ссылки и сохранённые записи.'
      - text: 'Формат даты локален; смена ID требует учёта долговечных связей'
        correct: true
        why: 'Цена определяется распространением контракта и данных, а не только объёмом текущей правки.'
      - text: 'ID проще заменить, поскольку его тип string остаётся прежним'
        why: 'Тип не сохраняет соответствие старых и новых значений в существующих ссылках.'
      - text: 'Достаточно нового адаптера в памяти, чтобы стоимость замены совпала'
        why: 'Адаптер текущего клиента не мигрирует данные и интеграции вне этого запуска.'
    explanation: "Обратимость зависит от распространения решения и срока жизни его последствий. Формат даты за стабильным интерфейсом обычно локален и не кодирует внешние связи, а идентичность документа переживает релизы и устройства.\nЭто не делает формат неизменным навсегда. Важно заранее видеть потребителей и цену перехода,\nчтобы уделить дорогому решению больше проверки.\n"
    topic: 'F2. System decomposition'
    subtopic: 'F2.4 Diagrams & evolution'
    links:
      - 'https://c4model.com/diagrams/system-context'
      - 'https://c4model.com/diagrams/dynamic'
  - id: 'fsd-f-f2-4-005'
    level: 'senior'
    question: 'Данные локального медиаиндекса скрыты за интерфейсом хранилища. Когда замена его представления особенно перестаёт быть чисто локальной правкой?'
    options:
      - text: 'В тестах адаптера используется отдельное хранилище в памяти'
        why: 'Тестовая подстановка облегчает замену кода и сама не создаёт обязательств реальным потребителям.'
      - text: 'Адаптер выбирается в точке сборки по конфигурации'
        why: 'Локализованный выбор не говорит о долговечных зависимостях формата.'
      - text: 'Формат индекса уже сохраняется у пользователей и читается внешними плагинами'
        why: 'Появились данные и потребители, которым нужна совместимость либо миграция.'
        correct: true
      - text: 'UI получает осмысленный результат вместо внутреннего ответа драйвера'
        why: 'Это полезная техническая граница, но не доказательство высокой цены изменения.'
    explanation: 'Интерфейс изолирует исходные зависимости, но не устраняет долговечные данные и внешние договоры. Смена формата индекса может потребовать преобразования уже записанных файлов и учёта старых плагинов. Поэтому обратимость оценивают по потребителям и сроку жизни последствий, а не по возможности подставить новый класс. Такие границы стоит показать на схеме.'
    topic: 'F2. System decomposition'
    subtopic: 'F2.4 Diagrams & evolution'
    links:
      - 'https://c4model.com/diagrams/system-context'
      - 'https://c4model.com/diagrams/dynamic'
  - id: 'fsd-f-f2-4-006'
    level: 'middle'
    question: 'Команда хочет понять, кто отвечает за поиск, фильтры и доступ к API, и какие модули зависят друг от друга. Порядок одного запроса пока не обсуждается. Какой вид схемы выбрать?'
    options:
      - text: 'Структура ответственностей и зависимостей'
        correct: true
        why: 'Она отвечает на вопрос о разбиении системы и связях между её частями.'
      - text: 'Последовательность вызовов одного успешного поиска'
        why: 'Она покажет конкретный проход, но не заменит общую структуру ответственности.'
      - text: 'Контекст пользователей и соседних внешних систем'
        why: 'На этом уровне внутренние модули ещё не раскрываются.'
      - text: 'Диаграмма переходов состояния одной кнопки'
        why: 'Она объясняет поведение локального элемента, а не структуру подсистем.'
    explanation: 'Структурный вид показывает части системы, их ответственность и зависимости. Динамический вид показывает взаимодействия выбранного сценария. Эти виды дополняют друг друга, но не взаимозаменяемы. Детализировать стоит те границы, которые помогают ответить на поставленный вопрос.'
    topic: 'F2. System decomposition'
    subtopic: 'F2.4 Diagrams & evolution'
    links:
      - 'https://c4model.com/diagrams/system-context'
      - 'https://c4model.com/diagrams/dynamic'
  - id: 'fsd-f-f2-4-007'
    level: 'middle'
    question: 'Нужно проследить, откуда персональные данные поступают, где преобразуются и в какие хранилища и внешние сервисы уходят. Точный порядок вызовов не является вопросом. Что выбрать?'
    options:
      - text: 'Контекст с внешними участниками и подписями их ролей'
        why: 'Он полезен для окружения, но не показывает внутренние места обработки и хранения.'
      - text: 'Структура модулей и направления их исходных зависимостей'
        why: 'Импорты не определяют маршруты конкретных данных во время исполнения.'
      - text: 'Потоки от источников через обработку к получателям'
        correct: true
        why: 'Так видны именно путь данных и места их обработки независимо от детализации временного порядка.'
      - text: 'Последовательность одного запроса с точным порядком вызовов'
        why: 'Временной проход одного запроса не заменяет обзор всех требуемых маршрутов обработки и хранения.'
    explanation: 'Data-flow отвечает на вопрос о движении и преобразовании информации. Последовательность акцентирует взаимодействия во времени, а структура — ответственность частей. Для анализа данных важно показать хранилища и внешних получателей, не ограничиваясь импортами кода. Нотация вторична, если смысл стрелок и границы подписаны явно.'
    topic: 'F2. System decomposition'
    subtopic: 'F2.4 Diagrams & evolution'
    links:
      - 'https://c4model.com/diagrams/system-context'
      - 'https://c4model.com/diagrams/dynamic'
  - id: 'fsd-f-f3-1-001'
    level: 'junior'
    question: 'У каталога есть серверная цена, фильтр в ссылке, открытая подсказка и сохранённый черновик. Как описать их архитектурные свойства?'
    options:
      - text: 'Цена — локальная из-за кеша; фильтр — URL; подсказка — временная; черновик — сохраняемый'
        why: 'Кеш меняет место копии, но не владельца подтверждённой цены.'
      - text: 'Цена — серверная; фильтр — URL; подсказка — временная; черновик — сохраняемый'
        correct: true
        why: 'Классификация выделяет происхождение, представление в навигации и требуемую долговечность.'
      - text: 'Цена — серверная; фильтр — локальная настройка отправителя; подсказка — UI; черновик — сохраняемый'
        why: 'Фильтр задан как часть ссылки: личная настройка не описывает этот навигационный договор.'
      - text: 'Цена — серверная; фильтр — URL; подсказка и черновик имеют общий временный срок'
        why: 'Сохранённый черновик имеет другую долговечность, чем открытая подсказка.'
    explanation: "Это несколько осей классификации, а не строго непересекающиеся корзины. Копия серверной цены\nможет сохраняться локально, оставаясь копией серверных данных. URL описывает навигационный\nконтракт, persisted — требуемый срок жизни, ephemeral — временность. При выборе модели важно\nспрашивать одновременно, кто решает истинное значение и когда оно должно исчезнуть.\n"
    topic: 'F3. State architecture'
    subtopic: 'F3.1 State classification'
    links:
      - 'https://react.dev/learn/managing-state'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/History_API'
  - id: 'fsd-f-f3-1-002'
    level: 'middle'
    question: 'Фильтр каталога должен открываться у коллеги по скопированной ссылке. Не содержит секретов. Какой источник восстановления фильтра нужен при открытии ссылки?'
    options:
      - text: 'Фильтр в памяти отправителя; адрес содержит только путь каталога'
        why: 'Память отправителя не передаётся получателю, поэтому адрес не восстанавливает выбор.'
      - text: 'Фильтр в localStorage; при открытии адреса читается личная настройка получателя'
        why: 'Настройка получателя может отличаться от присланного поиска.'
      - text: 'Параметры URL с определёнными значениями по умолчанию'
        correct: true
        why: 'Получатель получает нужные параметры вместе с адресом и может восстановить выбор.'
      - text: 'Последний поиск профиля отправителя без версии в ссылке'
        why: 'Профиль меняется и не задаёт переносимое конкретное состояние присланного поиска.'
    explanation: "Требование шаринга определяет место представления состояния. URL позволяет восстановить выбор\nнезависимо от устройства отправителя. Нужно определить кодирование, значения по умолчанию\nи обработку неизвестных параметров. Чувствительные значения нельзя автоматически переносить\nв адрес только потому, что это удобно для навигации.\n"
    topic: 'F3. State architecture'
    subtopic: 'F3.1 State classification'
    links:
      - 'https://react.dev/learn/managing-state'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/History_API'
  - id: 'fsd-f-f3-1-003'
    level: 'middle'
    question: 'Состояние открытой подсказки нужно только текущему экрану. Оно должно исчезнуть при уходе; нет восстановления и шаринга. Какой scope оправдан этими требованиями?'
    options:
      - text: 'Постоянная запись в профиле пользователя на сервере'
        why: 'Добавляет сеть и долговечность для состояния, которое по условию должно исчезнуть.'
      - text: 'Локальное состояние текущего представления'
        correct: true
        why: 'Срок жизни и доступность совпадают с реальной потребностью, без дополнительной синхронизации.'
      - text: 'Общий URL-параметр каждой ссылки приложения'
        why: 'В условии нет навигационного смысла; состояние подсказки становится лишней частью публичного адреса.'
      - text: 'Persisted store для всех вкладок данного пользователя'
        why: 'Общий и долговременный scope шире нужного и создаёт необходимость очистки и согласования.'
    explanation: "Область хранения выбирают по потребителям и сроку жизни, а не по привычке к глобальному store.\nЛокальное состояние легче уничтожить вместе с экраном и труднее случайно использовать в другом\nсценарии. Это не запрет общего хранения: если подсказка является шагом общего обучения,\nтребования будут другими. В данном условии такой причины нет.\n"
    topic: 'F3. State architecture'
    subtopic: 'F3.1 State classification'
    links:
      - 'https://react.dev/learn/managing-state'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/History_API'
  - id: 'fsd-f-f3-1-004'
    level: 'senior'
    question: 'Выбранный актив в дашборде независимо записывают таблица, график и общий store. Каждая копия уведомляет остальные и имеет право назначать итоговый выбор. Какой основной расход создаёт такая модель?'
    options:
      - text: 'Выбор компактной сериализации ID как основной задачи согласования'
        why: 'Сериализация влияет на формат передачи, но не разрешает конкурирующих владельцев одного выбора.'
      - text: 'Объединение файлов виджетов для устранения разных источников'
        why: 'Общее расположение не отменяет независимых прав записи во время работы.'
      - text: 'Увеличение периода обмена значениями между прежними копиями'
        why: 'Это меняет частоту, но не приоритет изменений и смысл обратных уведомлений.'
      - text: 'Правила приоритета изменений и согласования копий без циклов'
        why: 'Именно несколько независимых путей принятия решения создают обязанность разрешать расхождения.'
        correct: true
    explanation: 'Цена копий зависит не только от объёма памяти, но и от числа независимых путей записи. Одному выбранному активу нужна ясная семантика изменения и отражения результата. Если какой-то виджет редактирует предварительный выбор, это отдельный смысл с явным применением. Не следует симметрично синхронизировать разные значения, не выяснив их владельцев и роли.'
    topic: 'F3. State architecture'
    subtopic: 'F3.1 State classification'
    links:
      - 'https://react.dev/learn/managing-state'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/History_API'
  - id: 'fsd-f-f3-1-005'
    level: 'senior'
    question: 'Плеер хранит отдельно текущую позицию воспроизведения и положение указателя при наведении для предпросмотра кадра. Это назвали ошибочным дублированием времени. Какое возражение обоснованно?'
    options:
      - text: 'Предпросмотр и воспроизведение имеют разные смыслы и переход выбора позиции'
        why: 'Наведение может показывать другой кадр без изменения текущего просмотра; применение позиции является отдельным действием.'
        correct: true
      - text: 'Одинаковый тип числа позволяет синхронизировать обе позиции при каждом движении мыши'
        why: 'Тип не означает совпадение смысла: такая связь изменит просмотр уже при наведении.'
      - text: 'Общий store сам определяет, какое из двух времён должно победить'
        why: 'Место хранения не задаёт продуктовую семантику просмотра и выбора.'
      - text: 'Разные названия переменных освобождают от определения поведения клика'
        why: 'Имена помогают различению, но переход от предпросмотра к воспроизведению всё равно нужен.'
    explanation: 'Нужно отличать случайные копии одной истины от состояний с разным назначением. Предпросмотр намеренно расходится с текущим воспроизведением и не является его второй канонической копией. Следует определить владельцев, потребителей и событие применения выбранной позиции. Решение не сводится к правилу избегать любых похожих чисел в модели.'
    topic: 'F3. State architecture'
    subtopic: 'F3.1 State classification'
    links:
      - 'https://react.dev/learn/managing-state'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/History_API'
  - id: 'fsd-f-f3-2-001'
    level: 'junior'
    question: 'Устройство публикует калиброванную температуру через API. График хранит копию и округляет значение, а панель рассчитывает прогноз. Кто authoritative source именно опубликованного калиброванного измерения?'
    options:
      - text: 'Локальная округлённая точка последнего показанного графика'
        why: 'Преобразование отображения не даёт полномочий определять исходное измерение.'
      - text: 'Прогноз панели, если он получен позднее измерения'
        why: 'Позднее вычисление другого значения не меняет происхождения измеренного факта.'
      - text: 'Согласованный поток измерений устройства через API'
        why: 'По условию он публикует калиброванное измерение, а остальные значения — копии или расчёты.'
        correct: true
      - text: 'Клиентский кеш, который доступен всем виджетам'
        why: 'Общая доступность копии не делает её источником исходного измерения.'
    explanation: 'Authoritative source определяют для конкретного значения и смысла. У измерения, округлённого представления и прогноза разные роли; более позднее время расчёта не передаёт владение исходным фактом. Кеш может быть общим местом чтения подтверждённых данных, оставаясь копией. Это правило полномочий, а не требование перенести любое состояние UI на сервер.'
    topic: 'F3. State architecture'
    subtopic: 'F3.2 Ownership & source of truth'
    links:
      - 'https://react.dev/learn/sharing-state-between-components'
  - id: 'fsd-f-f3-2-002'
    level: 'middle'
    question: 'Сервер возвращает заказы. Клиент строит их отсортированный список и число просроченных. Что является canonical state для этих двух представлений при отсутствии локального редактирования?'
    options:
      - text: 'Отсортированные копии заказов становятся независимыми владельцами статуса'
        why: 'Форма отображения не даёт права определять подтверждённые значения сущностей.'
      - text: 'Заказы — исходная модель, список и счётчик — производные'
        correct: true
        why: 'Разные представления вычисляются из одной согласованной модели исходных данных.'
      - text: 'Число просроченных и список ID заменяют данные заказов'
        why: 'Агрегат и идентификаторы не содержат полей, нужных для восстановления заказов и их представлений.'
      - text: 'Открытая карточка является исходной моделью, остальные заказы — её производные'
        why: 'Карточка содержит одну сущность и не определяет всю коллекцию подтверждённых заказов.'
    explanation: 'Canonical state содержит исходные подтверждённые данные заказов. Сортировка и счётчик строятся из них; для числа просроченных нужны также правило просрочки и опорное время. Кеш или вычисленный список можно сохранять ради скорости, но их зависимость от входов остаётся явной. Сервер при этом определяет подтверждённые заказы: «одна истина» означает полномочия и правила обновления, а не одну физическую копию.'
    topic: 'F3. State architecture'
    subtopic: 'F3.2 Ownership & source of truth'
    links:
      - 'https://react.dev/learn/sharing-state-between-components'
  - id: 'fsd-f-f3-2-003'
    level: 'middle'
    question: 'Применённый фильтр отдельно меняют URL и store; каждый подписчик переписывает другого. Как уменьшить конфликт владельцев, сохранив шаринг и browser back?'
    options:
      - text: 'Применённый фильтр из URL, зависимые представления из него'
        correct: true
        why: 'Навигационный контракт становится единым основанием для поиска и отражается в зависимых представлениях.'
      - text: 'Оставить двух владельцев и объявить последнюю запись правильной'
        why: 'Не определены причинность и реакция на back; цикл синхронизации может сохраниться.'
      - text: 'Хранить фильтр только в памяти и игнорировать входящую ссылку'
        why: 'Так нарушаются требования шаринга и восстановления по истории.'
      - text: 'Добавить третью независимую копию для разрешения разногласий'
        why: 'Без правила владения новая копия усложняет ту же проблему.'
    explanation: "Выбор владельца привязан к требованиям. В этой схеме URL определяет применённый поиск,\nпоэтому чтение адреса становится входом для остальных представлений. Пользовательское изменение\nсоздаёт явное навигационное действие, а не симметричные записи всех копий. Черновик панели\nможет оставаться отдельным, если его применение не маскируется под ту же истину.\n"
    topic: 'F3. State architecture'
    subtopic: 'F3.2 Ownership & source of truth'
    links:
      - 'https://react.dev/learn/sharing-state-between-components'
  - id: 'fsd-f-f3-2-004'
    level: 'senior'
    question: 'Два виджета меняют локальный состав одной корзины до оформления. Сервер проверяет заказ при отправке, а локальные виджеты иногда расходятся. Как определить владение сейчас?'
    options:
      - text: 'Назвать сервер владельцем и не координировать локальную корзину'
        why: 'Серверная проверка заказа не согласует ещё не отправленный локальный выбор.'
      - text: 'Передать право окончательного изменения каждому виджету отдельно'
        why: 'Это сохраняет конкурирующих владельцев одной локальной сущности.'
      - text: 'Две самостоятельные копии с синхронизацией после каждого изменения'
        why: 'Без общего владельца и правил приоритета такая синхронизация сохраняет конфликт решений при несовпадающих изменениях.'
      - text: 'Один владелец корзины, серверный исход заказа отдельно'
        correct: true
        why: 'Разделены локальная истина пользовательского выбора и окончательная серверная гарантия оформления.'
    explanation: "Владение нужно задавать для конкретной сущности и фазы работы. Локальная корзина может иметь\nодного клиентского координатора, хотя сервер остаётся владельцем подтверждённого заказа.\nКоманды двух виджетов проходят через него, а представления получают результат.\nПеренос всего на сервер не является обязательным следствием принципа single source of truth.\n"
    topic: 'F3. State architecture'
    subtopic: 'F3.2 Ownership & source of truth'
    links:
      - 'https://react.dev/learn/sharing-state-between-components'
  - id: 'fsd-f-f3-2-005'
    level: 'senior'
    question: 'Кеш карточки и список заказов содержат копии одного статуса. У них разные сроки загрузки. Что требуется, чтобы не объявлять каждую копию независимой истиной?'
    options:
      - text: 'Выровнять TTL кешей, сохранив независимое изменение статуса'
        why: 'Одинаковый срок не назначает владельца и не определяет реакцию на записи.'
      - text: 'Назначить владельца статуса и согласовать обновление обеих копий'
        correct: true
        why: 'Кеш становится представлением подтверждённых данных, а не конкурентным источником решений.'
      - text: 'Считать более поздний рендер доказательством более нового серверного статуса'
        why: 'Показ может использовать старый ответ; время отображения не является версией сущности.'
      - text: 'Обновлять локальную карточку, а список пересобирать при очередном входе'
        why: 'Без согласованной политики это оставляет копии с независимыми решениями и неясной свежестью.'
    explanation: "Single source of truth — правило полномочий и зависимостей, а не запрет кеширования.\nКопии могут временно расходиться, если продукт допускает это и умеет показать соответствующий\nстатус. Требования к свежести и обновлению нужно сформулировать явно. Конкретные механизмы\nсогласования будут зависеть от контракта и сценария, а не только от выбранного store.\n"
    topic: 'F3. State architecture'
    subtopic: 'F3.2 Ownership & source of truth'
    links:
      - 'https://react.dev/learn/sharing-state-between-components'
  - id: 'fsd-f-f3-3-001'
    level: 'junior'
    question: 'Итог выбранных позиций полностью определяется их количеством и ценой; вычисление дешёвое, ручного переопределения итога нет. Как хранить данные?'
    options:
      - text: 'Хранить позиции, получать итог вычислением при чтении'
        correct: true
        why: 'Не возникает отдельного независимо изменяемого значения, которое может разойтись с исходными данными.'
      - text: 'Независимо менять позиции и итог в каждом обработчике'
        why: 'Каждый путь изменения должен помнить обновление итога, что создаёт риск рассинхронизации.'
      - text: 'Хранить только итог и восстанавливать позиции при открытии'
        why: 'Агрегат теряет детализацию и не позволяет восстановить выбранные товары и количества.'
      - text: 'Передавать вычисление серверу при каждом раскрытии списка'
        why: 'В условии локальных данных достаточно; сеть добавляет зависимость без требуемой гарантии.'
    explanation: "Производное значение не требует самостоятельного владения, если полностью определяется исходными\nданными. Это уменьшает число инвариантов, которые поддерживают обработчики. Если вычисление дорого,\nвозможен кеш с явной зависимостью, а если итог является зафиксированным историческим снимком,\nэто уже другая сущность. Условия задачи исключают оба этих отличающихся случая.\n"
    topic: 'F3. State architecture'
    subtopic: 'F3.3 Derived state & identity'
    links:
      - 'https://react.dev/learn/choosing-the-state-structure'
  - id: 'fsd-f-f3-3-002'
    level: 'senior'
    question: 'Пользователь сформировал отчёт, который должен сохранять сумму на дату формирования, даже когда текущие цены изменятся. Стоит ли каждый раз вычислять сохранённую сумму из актуальных цен?'
    options:
      - text: 'Да, пересчитать по новым ценам, чтобы отчёт соответствовал текущему каталогу'
        why: 'Требуется историческая сумма, а такая политика подменяет момент времени отчёта.'
      - text: 'Да, кешировать пересчитанную сумму вместе с последними ценами'
        why: 'Кеш ускоряет расчёт, но не восстанавливает исторические входы и исходную сумму.'
      - text: 'Нет, сохранить исторический снимок или результат с версией'
        correct: true
        why: 'Так сумма относится к моменту формирования, а не пересчитывается по другой версии исходных данных.'
      - text: 'Нет, сохранить ссылки на товары и получать их текущие цены при открытии'
        why: 'ID товара без версии цены не даёт воспроизводимость суммы на дату формирования.'
    explanation: "Правило не хранить лишнее состояние относится к значениям, производным от текущей канонической модели.\nИсторический снимок имеет иной срок жизни и смысл. Для воспроизводимости может потребоваться\nверсия входов или зафиксированный результат, в зависимости от требований аудита. Нельзя\nавтоматически считать историческую сумму тем же значением, что текущий предварительный итог.\n"
    topic: 'F3. State architecture'
    subtopic: 'F3.3 Derived state & identity'
    links:
      - 'https://react.dev/learn/choosing-the-state-structure'
  - id: 'fsd-f-f3-3-003'
    level: 'middle'
    question: 'В таблице выбран заказ на третьей строке. После сортировки третья строка соответствует другому заказу. Как хранить выбор, если он должен следовать за сущностью?'
    options:
      - text: 'Номер строки в текущем визуальном порядке'
        why: 'Позиция меняется при сортировке и не определяет прежний заказ.'
      - text: 'Стабильный идентификатор выбранного заказа'
        correct: true
        why: 'Выбор остаётся связан с сущностью независимо от порядка её отображения.'
      - text: 'Текст суммы заказа как единственный идентификатор'
        why: 'У разных заказов может быть одна сумма; это значение изменяемо и не обязано быть уникальным.'
      - text: 'Снимок полей заказа без устойчивого ID между загрузками'
        why: 'Значения могут измениться или совпасть у разных заказов; нужен договор идентичности для повторного сопоставления.'
    explanation: "Идентичность сущности не равна её позиции в коллекции. Выбор, редактирование и ссылки обычно\nдолжны опираться на стабильный ID, если продукт говорит о конкретном заказе. Позиционный выбор\nтоже возможен, но имеет другой смысл. Отдельно определяют поведение, если выбранная сущность\nудалена или больше не входит в текущий фильтр.\n"
    topic: 'F3. State architecture'
    subtopic: 'F3.3 Derived state & identity'
    links:
      - 'https://react.dev/learn/choosing-the-state-structure'
  - id: 'fsd-f-f3-3-004'
    level: 'middle'
    question: 'Один клиент показан в заказах, поиске и карточке. Его контакт часто обновляется независимо, а все представления должны читать общую модель клиента. Какое представление упрощает такие изменения?'
    options:
      - text: 'Полная копия клиента внутри каждой строки каждого списка'
        why: 'Независимое изменение требует найти и обновить все копии одной сущности.'
      - text: 'Отдельный текст контакта в каждом компоненте без общей идентичности'
        why: 'Теряется связь представлений с одним клиентом и возможность согласованно обновлять его.'
      - text: 'Вложенные копии клиента с обновлением только открытого представления'
        why: 'Другие потребители продолжат читать прежние контакты, хотя в условии нужна общая модель клиента.'
      - text: 'Клиенты по ID; заказы и списки ссылаются на эти ID'
        correct: true
        why: 'Общая сущность обновляется в одном каноническом месте, а представления используют ссылки.'
    explanation: "Нормализованная модель полезна, когда сущность повторяется и изменяется независимо в нескольких\nпредставлениях. Она уменьшает число копий, но добавляет разрешение ссылок и работу с отсутствующими\nсущностями. Для маленького неизменяемого дерева вложенность может быть проще. Выбор определяется\nоперациями, а не правилом нормализовать любые JSON-данные.\n"
    topic: 'F3. State architecture'
    subtopic: 'F3.3 Derived state & identity'
    links:
      - 'https://react.dev/learn/choosing-the-state-structure'
  - id: 'fsd-f-f3-3-005'
    level: 'senior'
    question: 'Сервер возвращает неизменяемый снимок разделов отчёта. Разделы не используются отдельно, редактирование запрещено. Нужна ли нормализация только ради архитектурной правильности?'
    options:
      - text: 'Нет, хранить снимок деревом, пока его разделы читаются целиком'
        correct: true
        why: 'При отсутствии независимых обновлений дополнительные таблицы и ссылки могут не дать пользы.'
      - text: 'Да, хранить разделы в таблице ради независимых правок'
        why: 'Независимое редактирование запрещено и не является причиной добавлять этот контракт сейчас.'
      - text: 'Да, завести отдельный кеш каждого раздела ради частичного обновления'
        why: 'Снимок неизменяем и части не используются отдельно: появляется лишняя координация без требуемого сценария.'
      - text: 'Нет, использовать номер строки как постоянную идентичность раздела'
        why: 'Допустимость вложенности не доказывает пригодность позиции для стабильных ссылок на раздел.'
    explanation: "Форма данных должна поддерживать реальные операции. Неизменяемый снимок читается целиком и\nможет естественно оставаться деревом. При появлении независимого редактирования или повторного\nиспользования частей выбор стоит пересмотреть. Нормализация и идентичность связаны, но не равны:\nстабильные ID могут быть полезны и во вложенной структуре.\n"
    topic: 'F3. State architecture'
    subtopic: 'F3.3 Derived state & identity'
    links:
      - 'https://react.dev/learn/choosing-the-state-structure'
  - id: 'fsd-f-f3-4-007'
    level: 'senior'
    question: 'На телефоне пользователь редактирует личный черновик и переходит в другое приложение. При возврате после возможной выгрузки страницы ввод нужно восстановить. Разрешено локальное хранение; серверный черновик пока не предусмотрен. Какую политику выбрать?'
    options:
      - text: 'Сохранять ввод в разрешённое хранилище по мере работы и при hidden'
        correct: true
        why: 'Сохранённая копия позволяет восстановиться после выгрузки; переход в hidden используют как важную дополнительную точку записи.'
      - text: 'Оставлять ввод в памяти store до следующего события focus'
        why: 'После выгрузки память потеряна; focus уже не сможет извлечь несохранённые данные прежнего запуска.'
      - text: 'Записывать весь ввод в обработчике beforeunload'
        why: 'При мобильном переключении и последующем завершении процесса это событие может не прийти; полагаться на него поздно.'
      - text: 'Сохранять ввод таймером после нескольких минут пребывания в фоне'
        why: 'Фоновая страница может быть заморожена или выгружена до таймера, поэтому выбранная точка записи ненадёжна.'
    explanation: 'Переход в другое приложение может перевести страницу в hidden. Затем браузер способен приостановить выполнение или выгрузить её, и при возврате понадобится восстановление. Поэтому полезно сохранять изменения заранее и при скрытии, проверяя успех записи, а не ждать финального события закрытия. Такая политика снижает риск, но не обещает сохранность при любой аварии, отказе хранилища или его очистке; допустимые гарантии согласуют с продуктом.'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/History_API'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Window/sessionStorage'
      - 'https://developer.chrome.com/docs/web-platform/page-lifecycle-api'
    topic: 'F3. State architecture'
    subtopic: 'F3.4 Lifetime & navigation'
  - id: 'fsd-f-f3-4-002'
    level: 'middle'
    question: 'Черновик должен открываться на другом устройстве после входа, но пока записывается в sessionStorage первого. Какое изменение адресно обеспечивает недостающую доступность?'
    options:
      - text: 'Перенести данные в общий store первого устройства'
        why: 'Общая память внутри одного клиента не передаёт ввод второму устройству.'
      - text: 'Записать данные в localStorage первого устройства с ключом пользователя'
        why: 'Ключ владельца полезен локально, но не создаёт межустройственного обмена.'
      - text: 'Добавить доступный пользователю удалённый источник черновика и его загрузку'
        correct: true
        why: 'Нужны сохранение вне одного браузера и получение данных на другом устройстве с проверкой доступа.'
      - text: 'Использовать IndexedDB и Background Sync без API хранения черновика'
        why: 'Локальная база и планирование повторных запросов сами не создают удалённый источник нужных данных.'
    explanation: "Срок жизни и область доступности проверяют отдельно. sessionStorage относится к контексту вкладки,\nlocalStorage — к локальному браузерному хранилищу соответствующего origin. Ни одно само по себе\nне обеспечивает доступ со второго устройства. Для обещания также нужны идентичность владельца,\nпроверка доступа и поведение, если удалённый черновик недоступен.\n"
    topic: 'F3. State architecture'
    subtopic: 'F3.4 Lifetime & navigation'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/History_API'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Window/sessionStorage'
  - id: 'fsd-f-f3-4-003'
    level: 'middle'
    question: 'После изменения поискового фильтра browser Back должен вернуть предыдущую выдачу по прежнему фильтру. Какой навигационный договор нужен?'
    options:
      - text: 'Заменять текущую запись URL при каждом применении фильтра'
        why: 'Предыдущее применение не станет отдельной записью, к которой сможет вернуться Back.'
      - text: 'Добавлять шаги истории, но при Back брать фильтр из store'
        why: 'Адрес и показанный выбор разойдутся, если store не восстановлен из выбранной записи.'
      - text: 'Помнить прежний фильтр локально, не меняя историю'
        why: 'Локальная память сама не определяет семантику кнопки Back браузера.'
      - text: 'Создавать шаги истории и при Back читать фильтр из адреса'
        correct: true
        why: 'Переход браузера становится входом сценария, а не случайным побочным эффектом UI.'
    explanation: "Нужно определить, какое изменение является шагом истории. Применение нового фильтра может\nсоздавать запись, тогда как техническая нормализация адреса может заменять текущую.\nПри возврате приложение восстанавливает нужный фильтр и данные по договору. История не обязана\nсодержать каждое нажатие клавиши: это продуктовый выбор, а не требование API.\n"
    topic: 'F3. State architecture'
    subtopic: 'F3.4 Lifetime & navigation'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/History_API'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Window/sessionStorage'
  - id: 'fsd-f-f3-4-004'
    level: 'middle'
    question: 'Пользователь изменил адрес в черновике профиля, но ещё не нажал «Сохранить». В соседнем блоке показывается подтверждённый адрес доставки. Как избежать ложного подтверждения?'
    options:
      - text: 'Сразу заменить подтверждённый адрес значением любого ввода'
        why: 'Так неотправленный черновик выдаётся за принятое сервером изменение.'
      - text: 'Разделять черновик и подтверждённые сервером данные профиля'
        correct: true
        why: 'У двух значений разные статусы и точки перехода; сохранение согласует их явно.'
      - text: 'Удалять введённый адрес при каждом чтении профиля с сервера'
        why: 'Это защищает вид подтверждённых данных ценой потери ещё не применённой работы.'
      - text: 'Считать ввод подтверждённым, если он пережил refresh локально'
        why: 'Локальная сохранность не равна серверному принятию адреса.'
    explanation: "Persisted draft не становится серверной истиной из-за долговечности. В модели нужны явные\nпереходы применения, отмены и получения подтверждения. Серверное обновление при открытом\nчерновике требует определённой политики, а не молчаливого стирания полей. Сложные протоколы\nконфликтов здесь не выбираются; сначала различают две сущности и их гарантии.\n"
    topic: 'F3. State architecture'
    subtopic: 'F3.4 Lifetime & navigation'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/History_API'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Window/sessionStorage'
  - id: 'fsd-f-f3-4-005'
    level: 'senior'
    question: 'Локальный черновик принадлежит пользователю A. После выхода на том же устройстве входит B. Требуется не показывать чужой черновик. Что обязательно учесть в восстановлении?'
    options:
      - text: 'Владельца записи и очистку либо разделение при выходе'
        correct: true
        why: 'Пережившая навигацию запись не должна автоматически становиться данными следующего пользователя.'
      - text: 'Использовать общий ключ документа и очищать запись раз в сутки'
        why: 'Суточный срок не исключает автоматического показа ввода A пользователю B до очистки.'
      - text: 'Различать записи по документу и считать текущий вход разрешением на любой черновик'
        why: 'Право на документ не означает право автоматически получить чужой локальный ввод.'
      - text: 'Читать общий черновик при открытии формы, скрывая список черновиков'
        why: 'Скрытый список не препятствует автоматическому восстановлению на форме.'
    explanation: 'Долговременное состояние переживает экран и смену пользователя. Ключ с владельцем предотвращает автоматическое восстановление чужого черновика, но не изолирует данные от человека с доступом к тому же профилю браузера и DevTools. Для чувствительных данных нужна соответствующая политика очистки, включая истечение сессии, либо запрет локального хранения; нельзя полагаться только на кнопку выхода. Само хранилище не знает бизнес-смысла входа и выхода, а выбранный ключ не является защитной границей.'
    topic: 'F3. State architecture'
    subtopic: 'F3.4 Lifetime & navigation'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/History_API'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Window/sessionStorage'
  - id: 'fsd-f-f3-4-006'
    level: 'senior'
    question: 'Две независимо открытые вкладки одного origin редактируют разные версии личного черновика одного документа. Каждая должна восстановить только свой ввод после refresh; закрытие вкладки не входит в гарантию. Хранение разрешено и доступно. Какой вариант прямо соответствует требованию?'
    options:
      - text: 'localStorage с ключом по ID документа без идентичности вкладки'
        why: 'Обе вкладки редактируют один документ, поэтому такой ключ объединит две разные версии черновика.'
      - text: 'sessionStorage вкладки с восстановлением после refresh'
        correct: true
        why: 'Область хранения привязана к контексту вкладки и переживает её refresh при заданной доступности.'
      - text: 'BroadcastChannel между вкладками без записи состояния в хранилище'
        why: 'Обмен сообщениями не обеспечивает сохранённую копию для нового запуска после refresh.'
      - text: 'Один серверный черновик профиля без идентичности вкладок'
        why: 'Одна общая запись не различает два независимых черновика.'
    explanation: 'Переключение вкладки обычно не перезапускает приложение. Однако браузер может заморозить фоновую страницу или выгрузить её; после выгрузки возврат потребует загрузки заново. Для независимого восстановления важна область хранения: sessionStorage разделён по origin и контекстам вкладок; окно с opener может получить начальную копию. Нужные данные сохраняют заранее и при переходе страницы в hidden, а не рассчитывают на unload. Доступность записи и успешное восстановление проверяют отдельно: одно событие не гарантирует завершения любой асинхронной работы.'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/History_API'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Window/sessionStorage'
      - 'https://developer.chrome.com/docs/web-platform/page-lifecycle-api'
    topic: 'F3. State architecture'
    subtopic: 'F3.4 Lifetime & navigation'
  - id: 'fsd-f-f3-5-001'
    level: 'junior'
    question: 'Для одной попытки отправки состояния «ещё не отправляли», «ожидаем ответ», «успех», «отказ» взаимоисключающие. Как выразить этот инвариант без независимых противоречащих флагов?'
    options:
      - text: 'Хранить один статус попытки и допустимые переходы по событиям'
        correct: true
        why: 'Модель прямо ограничивает взаимоисключающие состояния и причины их смены.'
      - text: 'Два флага отправки и успеха обновлять в разных обработчиках'
        why: 'Два независимых пути не кодируют заданную взаимную исключительность; забытая запись даёт противоречие.'
      - text: 'Хранить статус спиннера, а успех выводить из того, что спиннер исчез'
        why: 'Спиннер исчезает и до начала, и при отказе, поэтому не определяет четыре исхода.'
      - text: 'Хранить результат последнего запроса без состояния ещё не начатой попытки'
        why: 'Модель не выражает все заданные фазы и смешивает отсутствие попытки с её исходом.'
    explanation: "Явная модель описывает состояния, события и разрешённые переходы. Она делает невозможные\nсочетания заметными и упрощает проверку сценария. Не требуется специальная библиотека:\nнебольшой набор переходов можно выразить обычными структурами. Важно выбрать правильную\nобласть состояния: одна попытка и весь документ могут иметь разные жизненные циклы.\nДля операций с внешним эффектом может понадобиться и неизвестный исход: перечисленный в условии набор не является универсальным для всех операций."
    topic: 'F3. State architecture'
    subtopic: 'F3.5 Workflow modeling'
    links:
      - 'https://stately.ai/docs/state-machines-and-statecharts'
  - id: 'fsd-f-f3-5-002'
    level: 'middle'
    question: 'Форма в editing получила submit с пустым обязательным полем. По требованиям переход в submitting разрешён лишь после локальной проверки. Как должна отреагировать модель до сетевой команды?'
    options:
      - text: 'Перейти в submitting, затем вернуть editing после локальной проверки'
        why: 'Сначала выполнен переход, который условие запрещает для такого входа.'
      - text: 'Остаться в editing и сообщить об ошибке, не запуская отправку'
        correct: true
        why: 'Guard запрещает недопустимый переход; обратная связь не требует начать сетевую операцию.'
      - text: 'Отправить команду, а заполненность проверить по серверному ответу'
        why: 'Серверная проверка важна, но не заменяет заданное условием локальное ограничение перехода.'
      - text: 'Перейти в submitting без команды и ожидать нового submit'
        why: 'Модель объявляет отправку при недопустимом входе и смешивает её с ожиданием исправления.'
    explanation: 'Guard — условие, разрешающее переход при событии. Непройденный guard оставляет модель вне submitting; сообщение об ошибке является отдельной реакцией. Переход и UI-эффект нельзя отождествлять. Ранняя клиентская проверка улучшает UX, а сервер продолжает обеспечивать собственные обязательные правила.'
    topic: 'F3. State architecture'
    subtopic: 'F3.5 Workflow modeling'
    links:
      - 'https://stately.ai/docs/state-machines-and-statecharts'
  - id: 'fsd-f-f3-5-003'
    level: 'senior'
    question: 'Файл уже загружен, но пользователь продолжает редактировать подпись. Из этого заключили, что один enum должен запретить сочетание uploaded и editing. Что проверить?'
    options:
      - text: 'Относятся ли эти статусы к разным независимым аспектам workflow'
        correct: true
        why: 'Загрузка файла и редактирование подписи могут происходить одновременно и не быть противоречием.'
      - text: 'Можно ли скрыть подпись, чтобы сохранить один статус'
        why: 'Ограничение интерфейса ради удобства модели не обосновано требованиями.'
      - text: 'Нужно ли считать файл незагруженным при каждом изменении подписи'
        why: 'Это смешивает две операции без установленной причинной зависимости.'
      - text: 'Можно ли считать любую пару true ошибкой архитектуры'
        why: 'Независимые аспекты могут законно иметь собственные активные состояния.'
    explanation: "State machine полезна, когда отражает реальные ограничения, а не навязывает ложную взаимную\nисключительность. Иногда нужны несколько координируемых состояний или иерархия. Важно\nназвать инварианты между ними, например запрет публикации до завершения загрузки.\nОдин гигантский enum для всех независимых комбинаций тоже может ухудшить модель.\nДля независимых одновременно активных аспектов используют параллельные (ортогональные) состояния; их общие инварианты всё равно задаются явно."
    topic: 'F3. State architecture'
    subtopic: 'F3.5 Workflow modeling'
    links:
      - 'https://stately.ai/docs/state-machines-and-statecharts'
  - id: 'fsd-f-f3-5-004'
    level: 'middle'
    question: 'Локальный обработчик сообщил, что преобразование изображения завершено и результат доступен. После этого сломался показ уведомления о готовности. Какое состояние следует сохранить?'
    options:
      - text: 'Перевести преобразование в failed и повторить обработку исходника'
        why: 'Сбой уведомления не отменяет уже готовый результат преобразования.'
      - text: 'Считать обработку незавершённой до успешного закрытия уведомления'
        why: 'UI-эффект станет ложным источником истины об операции, которая завершилась отдельно.'
      - text: 'Оставить преобразование успешным и восстановить показ результата'
        why: 'Факт выполнения и отображение этого факта имеют разные состояния и пути исправления.'
        correct: true
      - text: 'Удалить результат и вернуть экран в исходное состояние'
        why: 'Это теряет известный полезный результат по причине, не связанной с его содержимым.'
    explanation: 'Состояние операции определяется её контрактом и фактическим результатом, а не успешностью всех визуальных эффектов. Резервный показ может восстановить доступ к готовому изображению без повторной обработки. Такое разделение работает и для локальной операции, без серверной записи или неизвестного сетевого исхода. Модель должна сохранять известные факты и различать причину сбоя.'
    topic: 'F3. State architecture'
    subtopic: 'F3.5 Workflow modeling'
    links:
      - 'https://stately.ai/docs/state-machines-and-statecharts'
  - id: 'fsd-f-f3-5-005'
    level: 'senior'
    question: 'После отправки деньги могли быть списаны, но ответ потерян. У формы только success и failed. Какую проблему нужно отразить в модели до выбора способа повтора?'
    options:
      - text: 'Потеря ответа означает доказанный отказ операции'
        why: 'Клиент не получил подтверждение, но серверный эффект мог уже произойти.'
      - text: 'Нужен различимый неопределённый исход и путь выяснения результата'
        correct: true
        why: 'Неизвестность нельзя честно отобразить как подтверждённый отказ или успех.'
      - text: 'Достаточно показать success, если запрос был отправлен'
        why: 'Отправка не доказывает принятие и выполнение сервером.'
      - text: 'После timeout автоматически поставить failed и открыть новую отправку'
        why: 'Это превращает отсутствие ответа в доказанный отказ и может разрешить повтор уже выполненной операции.'
    explanation: "Модель состояний должна различать отсутствие знания и известный отрицательный результат.\nДля важной записи это влияет на доступные действия пользователя: слепой повтор может быть опасен.\nНа уровне Foundations достаточно установить состояние и необходимый контракт выяснения исхода.\nКонкретный протокол безопасного повтора требует отдельных гарантий, которые нельзя выдумывать в UI.\n"
    topic: 'F3. State architecture'
    subtopic: 'F3.5 Workflow modeling'
    links:
      - 'https://stately.ai/docs/state-machines-and-statecharts'
  - id: 'fsd-f-f4-1-001'
    level: 'junior'
    question: 'Просмотр заявки читает её статус; «Отправить на согласование» меняет бизнес-состояние; раскрытие деталей меняет только UI. Как правильно различить действия?'
    options:
      - text: 'Просмотр и отправка — чтение статуса; раскрытие — локальное действие'
        why: 'Наличие статуса в ответе отправки не отменяет бизнес-изменение заявки.'
      - text: 'Чтение ресурса, команда изменения, локальная реакция представления'
        correct: true
        why: 'Различаются получение данных, бизнес-действие и временное отображение.'
      - text: 'Просмотр — чтение, отправка и раскрытие — команды серверного состояния'
        why: 'Раскрытие меняет UI, а не указанное в условии серверное бизнес-состояние.'
      - text: 'Просмотр и раскрытие — локальный UI; отправка — команда'
        why: 'Просмотр по условию получает серверный статус и включает операцию чтения ресурса.'
    explanation: "Действия классифицируют по смыслу эффекта, а не по странице или виду ответа. Чтение получает\nпредставление ресурса, команда просит изменить состояние, локальная реакция меняет представление\nбез такого требования к серверу. Это разделение помогает выбрать подтверждение и обработку ошибок.\nОно не требует отдельной сложной архитектуры CQRS для небольшой формы.\n"
    topic: 'F4. Data flow & API design'
    subtopic: 'F4.1 Read/write workflows'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html#section-9.2.1'
      - 'https://docs.arc42.org/section-6/'
  - id: 'fsd-f-f4-1-002'
    level: 'middle'
    question: 'Клиентская форма проверяет размер скидки и отправляет его на сервер. Скидка ограничена ролью пользователя и текущими условиями договора. Где должна находиться окончательная проверка?'
    options:
      - text: 'В клиентской форме, если пользователь вошёл в систему'
        why: 'Вход не делает переданные клиентом значения доверенными и не защищает от другого клиента.'
      - text: 'В общем store, доступном всем компонентам приложения'
        why: 'Доступность состояния не даёт полномочий обеспечивать серверные бизнес-правила.'
      - text: 'На сервере при обработке команды с проверкой актуального контекста'
        correct: true
        why: 'Именно владелец защищаемого состояния должен проверить допустимость перед фиксацией.'
      - text: 'В скрытии полей скидки, без повторной проверки команды'
        why: 'Скрытие ограничивает интерфейс, но не запрещает отправить запрос вне этой формы.'
    explanation: "Клиентские ограничения дают раннюю обратную связь, но не определяют допустимость серверного изменения.\nКонтракт должен явно задавать, кто проверяет роль, правило и актуальные данные. Иначе frontend\nначнёт обещать гарантию, которой не владеет. Детали auth-протокола здесь не нужны: важна граница\nответственности между удобством ввода и обязательной серверной проверкой.\n"
    topic: 'F4. Data flow & API design'
    subtopic: 'F4.1 Read/write workflows'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html#section-9.2.1'
      - 'https://docs.arc42.org/section-6/'
  - id: 'fsd-f-f4-1-003'
    level: 'middle'
    question: 'Пользователь выбрал видео для платной обработки. Требуется проверить поддерживаемый формат до платной команды, показать выбранные параметры и запускать обработку лишь после подтверждения. Какая последовательность подходит?'
    options:
      - text: 'Отправить на обработку при выборе файла, затем запросить подтверждение'
        why: 'Платное действие началось до обязательного подтверждения пользователя.'
      - text: 'Запросить подтверждение, отправить команду, затем проверить формат'
        why: 'Известное ограничение входа проверяется позже шага, перед которым оно должно быть соблюдено.'
      - text: 'Проверить формат и автоматически запустить согласованные по умолчанию параметры'
        why: 'Проверка выполнена, но выбор файла всё ещё не является требуемым подтверждением запуска.'
      - text: 'Проверить формат, показать параметры, принять подтверждение и отправить команду'
        why: 'Соблюдены границы локальной обратной связи, намерения человека и сетевого действия.'
        correct: true
    explanation: 'Последовательность определяется продуктовым договором: какие данные можно проверить заранее и когда человек принимает последствия команды. Быстрая локальная проверка не означает автоматический запуск платной работы. Показ параметров и подтверждение являются частью сценария, а не случайной последовательностью экранов. Серверный контракт отдельно определяет принятие обработки и её результат.'
    topic: 'F4. Data flow & API design'
    subtopic: 'F4.1 Read/write workflows'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html#section-9.2.1'
      - 'https://docs.arc42.org/section-6/'
  - id: 'fsd-f-f4-1-004'
    level: 'senior'
    question: 'Сервис подсчёта предварительной стоимости не меняет заказ, а команда «Оформить» фиксирует его. Возврат со страницы оформления повторно запускает загрузку. Какое разделение защищает смысл сценария?'
    options:
      - text: 'Загрузку и предварительный расчёт отделить от явной команды оформления'
        correct: true
        why: 'Повторное чтение экрана не должно автоматически повторять бизнес-действие пользователя.'
      - text: 'Разместить создание заказа в общей функции загрузки экрана'
        why: 'Возврат, запускающий чтение, станет неявной повторной бизнес-командой.'
      - text: 'Считать расчёт стоимости созданием заказа и повторять его при навигации'
        why: 'Контракт предварительной оценки не фиксирует заказ, поэтому смешение меняет смысл операции.'
      - text: 'Восстанавливать оформление по флагу посещения экрана, не по результату команды'
        why: 'Факт посещения не определяет, была ли команда запущена и какой результат подтверждён.'
    explanation: "Чтение и команда могут возвращать похожие данные, но отличаются эффектом и намерением пользователя.\nПовторное открытие экрана должно выполнять согласованный сценарий чтения, а не незаметно\nсоздавать заказ. Нужны явные границы запуска операции. Выбор HTTP-метода поддерживает контракт,\nно само название метода не исправляет ошибочную бизнес-семантику реализации.\n"
    topic: 'F4. Data flow & API design'
    subtopic: 'F4.1 Read/write workflows'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html#section-9.2.1'
      - 'https://docs.arc42.org/section-6/'
  - id: 'fsd-f-f4-1-005'
    level: 'senior'
    question: 'Создание заявки требует загрузить файл и затем сохранить ссылку на него. Файловый сервис подтвердил загрузку, API заявки ещё не ответил. Что можно обещать пользователю в этот момент?'
    options:
      - text: 'Заявка создана; загрузка файла является подтверждением всех её шагов'
        why: 'Сервис файла не подтверждает сохранение заявки и связи с ним.'
      - text: 'Подтверждена загрузка файла; создание заявки ещё ожидает ответа'
        correct: true
        why: 'Промежуточный результат отражает фактические границы двух систем.'
      - text: 'Операция целиком ожидает; подтверждённый ID файла можно отбросить'
        why: 'Теряется известный промежуточный результат, полезный для восстановления второго шага.'
      - text: 'Заявка отклонена; повторить создание с новой загрузкой файла'
        why: 'Ответ заявки ещё не получен, а файл уже загружен: такая политика придумывает отказ и повторяет успешный шаг.'
    explanation: "Составной workflow может иметь несколько отдельных результатов. Для пользователя нужно\nопределить, какой из них означает завершение задачи. Нельзя приписывать общей клиентской функции\nсерверную атомарность. На этом уровне достаточно обнаружить промежуточные исходы и запросить\nнужные гарантии; сложные схемы компенсации относятся к последующим курсам.\n"
    topic: 'F4. Data flow & API design'
    subtopic: 'F4.1 Read/write workflows'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html#section-9.2.1'
      - 'https://docs.arc42.org/section-6/'
  - id: 'fsd-f-f4-1-006'
    level: 'senior'
    question: 'Редактор медиаклипа хранит expanded, выбранные границы фрагмента и локальный URL предпросмотра. API рендера принимает ID исходника и границы, а возвращает ID результата. Как провести границу команды?'
    options:
      - text: 'Отправить весь объект UI вместе с expanded и локальным URL'
        why: 'Локальные детали не входят в согласованный серверный контракт и не адресуют доступный серверу исходник.'
      - text: 'Отправить URL предпросмотра вместо ID исходника'
        why: 'Локальный адрес клиента не является согласованным идентификатором медиаресурса API.'
      - text: 'Передать ID исходника и границы; ID результата принять из ответа'
        correct: true
        why: 'Вход команды отделён от UI-модели и от идентичности произведённого результата.'
      - text: 'Использовать ID исходника как ID результата до завершения рендера'
        why: 'Это разные сущности; контракт возвращает идентификатор результата отдельно.'
    explanation: 'Клиентская модель содержит отображение, пользовательский выбор и данные предпросмотра. API-команда передаёт только согласованные входы, а ответ описывает новый результат. Эти объекты не обязаны иметь одну форму. Преобразование у границы позволяет менять UI без включения его случайных деталей в контракт и не смешивать входную сущность с результатом.'
    topic: 'F4. Data flow & API design'
    subtopic: 'F4.1 Read/write workflows'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html#section-9.2.1'
      - 'https://docs.arc42.org/section-6/'
  - id: 'fsd-f-f4-2-001'
    level: 'middle'
    question: 'Таблица допускает открыть и изменить конкретную заявку. Ответ списка содержит только название и статус; названия могут совпадать. Чего принципиально не хватает?'
    options:
      - text: 'Стабильного идентификатора заявки для последующих операций'
        correct: true
        why: 'Название и позиция не дают надёжного способа указать ту же сущность при чтении и изменении.'
      - text: 'Уникального номера строки внутри текущей страницы'
        why: 'После сортировки или другой страницы позиция не адресует ту же сущность.'
      - text: 'Комбинации названия и статуса как адреса изменения'
        why: 'Оба поля могут совпадать или изменяться; по условию их недостаточно для устойчивой идентичности.'
      - text: 'Локального UUID, заново назначаемого строке при каждой загрузке'
        why: 'Сервер не знает этот новый ID; он не связывает последующую команду с нужной заявкой.'
    explanation: "Контракт начинается с операций, которые должен выполнить потребитель. Для открытия и изменения\nнужны идентичность и достаточные данные, а не только красивые подписи. Поля не добавляют\nнаугад: каждое связано со сценарием. Стабильный ID не решает автоматически доступ и актуальность,\nно без него трудно корректно адресовать сущность.\n"
    topic: 'F4. Data flow & API design'
    subtopic: 'F4.2 API contract design'
    links:
      - 'https://learn.microsoft.com/en-us/azure/architecture/patterns/backends-for-frontends'
      - 'https://www.rfc-editor.org/rfc/rfc9110.html'
  - id: 'fsd-f-f4-2-002'
    level: 'middle'
    question: 'Список возвращает до 20 записей. Сервер иногда возвращает меньше 20 даже при наличии продолжения. Какой контракт нужен кнопке «Ещё»?'
    options:
      - text: 'Считать неполную страницу окончанием выдачи'
        why: 'Это прямо противоречит заданному поведению сервера и потеряет доступные записи.'
      - text: 'Запрашивать одну и ту же страницу до получения 20 записей'
        why: 'Так не определяются позиция продолжения и критерий завершения.'
      - text: 'Явный признак продолжения и данные для следующего запроса'
        correct: true
        why: 'Клиент получает договорённый способ продолжить без угадывания по длине ответа.'
      - text: 'Скрывать кнопку после ошибки следующего запроса как в конце выдачи'
        why: 'Ошибка запроса не подтверждает исчерпание выдачи. Контракт должен различать отказ следующей загрузки и отсутствие продолжения.'
    explanation: "Признак продолжения является частью API-контракта, если длина массива не даёт нужной гарантии.\nЭто может быть cursor, next URL или иной согласованный маркер. Здесь не выбирается конкретный\nалгоритм пагинации; важно не выдумать отсутствующий договор. Отдельно описывают пустой результат,\nконец выдачи и ошибку следующей загрузки.\n"
    topic: 'F4. Data flow & API design'
    subtopic: 'F4.2 API contract design'
    links:
      - 'https://learn.microsoft.com/en-us/azure/architecture/patterns/backends-for-frontends'
      - 'https://www.rfc-editor.org/rfc/rfc9110.html'
  - id: 'fsd-f-f4-2-003'
    level: 'middle'
    question: 'Форма должна показать ошибки у соответствующих полей и отдельно отказ в доступе. API возвращает только произвольное локализованное сообщение. Что запросить у владельца контракта?'
    options:
      - text: 'Неизменность текста сообщения для разбора подстроками'
        why: 'Человеческий текст остаётся хрупким машинным интерфейсом и затрудняет локализацию.'
      - text: 'Различимые коды исходов и привязку ошибок к полям'
        correct: true
        why: 'Клиент сможет выбрать поведение независимо от формулировки сообщения.'
      - text: 'Один общий код успеха даже для отказа в доступе'
        why: 'Без дополнительной различимой семантики это скрывает требуемые разные исходы.'
      - text: 'Отправку клиентом текста ожидаемой ошибки вместе с полями'
        why: 'Так клиент не получает подтверждённую причину серверного отказа и не может сам её назначить.'
    explanation: "UI должен различать те ошибки, для которых нужны разные действия пользователя.\nСтруктурированная ошибка может содержать код, поле и безопасные параметры сообщения.\nПодробности внутреннего сбоя не обязательно раскрывать клиенту. Контракт описывает достаточную\nсемантику, а не обязан передавать всё диагностическое содержимое серверных логов.\n"
    topic: 'F4. Data flow & API design'
    subtopic: 'F4.2 API contract design'
    links:
      - 'https://learn.microsoft.com/en-us/azure/architecture/patterns/backends-for-frontends'
      - 'https://www.rfc-editor.org/rfc/rfc9110.html'
  - id: 'fsd-f-f4-2-004'
    level: 'senior'
    question: 'Общий API нужен нескольким клиентам. На мобильном измерены лишний трафик и дорогая композиция трёх ответов. Команда может поддерживать агрегацию на сервере, сохраняя общие правила. Что адресно устраняет установленную причину?'
    options:
      - text: 'Сократить общий ответ под мобильный экран и обновить остальных клиентов следом'
        why: 'Разные потребители уже используют общий договор; оптимизация одного не оправдывает его ломку.'
      - text: 'Оставить три больших ответа и распараллелить клиентские преобразования'
        why: 'Это может ускорить вычисление, но не устраняет измеренную цену лишнего трафика.'
      - text: 'Собрать экранный ответ с собственной копией правил расчёта и доступа'
        why: 'Копии правил добавят риск расхождения вместо использования согласованных владельцев правил.'
      - text: 'Добавить компактную агрегацию поверх сохранённых общих контрактов'
        correct: true
        why: 'При заданных условиях уменьшаются лишние ответы и клиентская оркестрация без ломки других потребителей.'
    explanation: 'Экранный endpoint может собрать нужные данные и сократить передачу, сохраняя общие контракты и владельцев бизнес-правил. Цена — серверная поддержка отдельного потребительского договора и его эволюции. Здесь её оправдывает измеренное узкое место и разрешённая ответственность команды. Если выигрыша нет либо потребности всех клиентов совпадают, отдельный контракт может не окупиться. Такой клиентский серверный слой часто называют Backend for Frontend (BFF); он не означает копирование бизнес-правил или разметки каждого экрана.'
    topic: 'F4. Data flow & API design'
    subtopic: 'F4.2 API contract design'
    links:
      - 'https://learn.microsoft.com/en-us/azure/architecture/patterns/backends-for-frontends'
      - 'https://www.rfc-editor.org/rfc/rfc9110.html'
  - id: 'fsd-f-f4-2-005'
    level: 'senior'
    question: 'На один билет претендуют два пользователя. Клиент отключает кнопку, когда локально видит нулевой остаток. Что ещё нужно для гарантии «билет не продан дважды»?'
    options:
      - text: 'Серверное согласованное принятие решения о продаже билета'
        correct: true
        why: 'Только общий владелец ресурса может обеспечить инвариант между конкурентными клиентами.'
      - text: 'Перед отправкой проверить остаток отдельным чтением из каждого клиента'
        why: 'Между чтением и продажей другой клиент может купить билет; проверка не закрепляет решение.'
      - text: 'Заблокировать повторную отправку в каждой вкладке после клика'
        why: 'Это предотвращает часть локальных повторов, но не конкуренцию двух пользователей.'
      - text: 'Доставлять остаток push-обновлениями до выполнения продажи'
        why: 'Свежая копия не заменяет согласованного решения о конкурентных командах на сервере.'
    explanation: "Чтение остатка и решение о продаже — разные операции. Даже свежее чтение не резервирует ресурс\nи не защищает от чужой команды между чтением и записью. Контракт backend должен задавать\nинвариант принятия операции и различимый исход для проигравшего клиента. Конкретный механизм\nреализации на сервере здесь не требуется выбирать, но его гарантию нужно запросить явно.\n"
    topic: 'F4. Data flow & API design'
    subtopic: 'F4.2 API contract design'
    links:
      - 'https://learn.microsoft.com/en-us/azure/architecture/patterns/backends-for-frontends'
      - 'https://www.rfc-editor.org/rfc/rfc9110.html'
  - id: 'fsd-f-f4-2-006'
    level: 'senior'
    question: 'Создание экспорта возвращает 202 и ID задачи. UI обещает «файл готов». Какой вывод следует из имеющегося контракта?'
    options:
      - text: 'Любой успешный HTTP-статус доказывает готовность конечного файла'
        why: 'Класс статуса сам по себе не означает завершение всей бизнес-задачи.'
      - text: 'Принятие задачи нужно отличить от готовности и согласовать получение результата'
        correct: true
        why: '202 означает принятие к обработке, а не завершённое выполнение; нужен дальнейший путь сценария.'
      - text: 'ID задачи можно считать URL готового файла без уточнения'
        why: 'Идентификатор не задаёт автоматически адрес скачивания и доступность результата.'
      - text: 'Принятая задача обязана завершиться до следующего чтения клиента'
        why: 'Такой временной гарантии из ответа нет.'
    explanation: "Контракт должен связывать HTTP-исход с бизнес-смыслом операции. Для асинхронной задачи нужны\nсостояния, получение результата и обработка отказа после принятия. Принятие не гарантирует\nбудущий успех. Сначала фиксируют необходимые обещания, затем выбирают способ ожидания;\nконкретный polling или поток событий не следует из одного статуса 202.\n"
    links:
      - 'https://learn.microsoft.com/en-us/azure/architecture/patterns/backends-for-frontends'
      - 'https://www.rfc-editor.org/rfc/rfc9110.html'
      - 'https://www.rfc-editor.org/rfc/rfc9110.html#section-15.3.3'
    topic: 'F4. Data flow & API design'
    subtopic: 'F4.2 API contract design'
  - id: 'fsd-f-f4-2-007'
    level: 'senior'
    question: 'Три клиента читают одинаковые данные товара из стабильного API. Бюджеты загрузки выполнены. Команда предлагает endpoint под каждый макет: сервер будет возвращать порядок блоков и CSS-классы, менять его придётся при каждой перестановке UI. Что предпочтительнее сейчас?'
    options:
      - text: 'Оставить общий контракт данных и строить композицию экранов на клиентах'
        correct: true
        why: 'При одинаковых потребностях и выполненных бюджетах это сохраняет устойчивый договор без зависимости от каждой перестановки разметки.'
      - text: 'Ввести отдельный endpoint каждого макета ради независимости клиентского JSX'
        why: 'Независимость разметки заменяется зависимостью от нового серверного релиза для её изменения без измеримого выигрыша загрузки.'
      - text: 'Добавить общий ответ, содержащий все CSS-классы и порядок блоков трёх клиентов'
        why: 'Общий адрес не устраняет утечку деталей представлений в контракт данных и связывает их эволюцию.'
      - text: 'Добавить BFF, копирующий прежний ответ и поддерживающий версии каждого макета'
        why: 'При заданных данных нет задачи агрегации или экономии передачи, оправдывающей дополнительную ответственность и версии представления.'
    explanation: 'Backend for Frontend (BFF) полезен, когда адаптирует данные и взаимодействия к реальным потребностям клиента. Он не требует переносить в серверный контракт CSS-классы и каждую перестановку разметки. Здесь потребности в данных совпадают и бюджеты выполнены, поэтому новые endpoint добавят связанность без установленной пользы. Если появятся разные данные, дорогое объединение сервисов или иная серверная ответственность, решение стоит пересмотреть по новым условиям.'
    links:
      - 'https://learn.microsoft.com/en-us/azure/architecture/patterns/backends-for-frontends'
      - 'https://www.rfc-editor.org/rfc/rfc9110.html'
    topic: 'F4. Data flow & API design'
    subtopic: 'F4.2 API contract design'
  - id: 'fsd-f-f4-3-001'
    level: 'junior'
    question: 'Сравни две ситуации: первый запрос каталога ещё выполняется; завершившийся запрос вернул пустой список. Почему эти состояния стоит различать?'
    options:
      - text: 'Оставить для обоих состояние loading до получения первого элемента'
        why: 'Пустой успех не завершится в такой модели и не даст пользователю изменить поиск.'
      - text: 'Ожидание не знает результата, пустой успех позволяет менять критерии поиска'
        correct: true
        why: 'У состояний разные знания о данных и полезные следующие действия пользователя.'
      - text: 'Использовать пустой экран для обоих, без состояния ожидающего запроса'
        why: 'Так пользователь не различит незавершённое чтение и известное отсутствие результатов.'
      - text: 'Повторять успешный пустой поиск как временный сетевой отказ'
        why: 'Известный пустой результат не является признаком отказа и требует другого действия.'
    explanation: "Loading описывает незавершённое получение результата, empty — известный успешный результат\nбез элементов. Ошибка и устаревшие данные являются ещё другими ситуациями.\nРазличение нужно не ради большего числа спиннеров, а ради подходящего действия пользователя.\nПустой массив без статуса загрузки не всегда позволяет восстановить эту семантику.\n"
    topic: 'F4. Data flow & API design'
    subtopic: 'F4.3 Data lifecycle & UI outcomes'
    links:
      - 'https://docs.arc42.org/section-6/'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API/Using_Fetch'
  - id: 'fsd-f-f4-3-002'
    level: 'middle'
    question: 'Старые новости уже показаны. Фоновое обновление упало; продукт разрешает читать прежнюю ленту с отметкой устаревания. Какой исход соответствует требованиям?'
    options:
      - text: 'Оставить ленту и тихо повторять запрос без признака устаревания'
        why: 'Полезные данные сохраняются, но требуемая отметка устаревания скрыта от пользователя.'
      - text: 'Показать время последней попытки как время актуальности данных'
        why: 'Неудачная попытка не обновила данные; её время создаёт ложное впечатление свежести.'
      - text: 'Оставить ленту, отметить неудачное обновление и дать повторить'
        correct: true
        why: 'Сохраняется разрешённая полезность старых данных, но их статус не скрывается.'
      - text: 'Заменить ленту блокирующим экраном ожидания следующей попытки'
        why: 'По условию чтение старой ленты разрешено; блокировка уничтожает эту полезность.'
    explanation: "Наличие данных и состояние последней попытки обновления — разные аспекты модели.\nРазрешённая деградация позволяет сохранить полезность, не изображая свежие данные.\nДля других доменов показ старого может быть запрещён; это зависит от цены устаревания.\nВажно явно указать статус и доступное восстановление, а не угадывать политику по типу ошибки.\n"
    topic: 'F4. Data flow & API design'
    subtopic: 'F4.3 Data lifecycle & UI outcomes'
    links:
      - 'https://docs.arc42.org/section-6/'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API/Using_Fetch'
  - id: 'fsd-f-f4-3-003'
    level: 'middle'
    question: 'Профиль загружен, независимый блок рекомендаций недоступен. По требованиям профиль остаётся полезным сам по себе. Как организовать исход экрана?'
    options:
      - text: 'Объединить запросы в одну обязательную загрузку и ждать восстановления обоих'
        why: 'Условие допускает независимую полезность профиля; общий барьер без основания расширяет отказ.'
      - text: 'Показать профиль и локальный отказ блока рекомендаций'
        correct: true
        why: 'Граница отказа совпадает с независимой функцией и не уничтожает основной результат.'
      - text: 'Показывать профиль как загружающийся, пока рекомендации не получены'
        why: 'Известный успех профиля скрывается из-за необязательного блока.'
      - text: 'Подменить отказ рекомендаций успешной пустой выдачей'
        why: 'Отсутствие рекомендаций и невозможность получить их имеют разный смысл для пользователя.'
    explanation: "Частичный успех означает, что полезные независимые части могут иметь разные исходы.\nГраницы загрузки и отказа должны следовать требованиям, а не форме общего компонента.\nЕсли данные атомарно необходимы вместе, политика была бы другой. Здесь независимость задана,\nпоэтому блокирование всего экрана является необоснованным усилением отказа.\n"
    topic: 'F4. Data flow & API design'
    subtopic: 'F4.3 Data lifecycle & UI outcomes'
    links:
      - 'https://docs.arc42.org/section-6/'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API/Using_Fetch'
  - id: 'fsd-f-f4-3-004'
    level: 'senior'
    question: 'API подтвердил создание заказа и вернул его ID. Следующий запрос деталей заказа упал. Какой пользовательский исход корректен?'
    options:
      - text: 'Считать попытку оформления неуспешной до полного открытия карточки'
        why: 'Подтверждённое создание имеет собственный известный исход, не зависящий от следующего чтения.'
      - text: 'Выполнить создание повторно, чтобы получить ответ с готовыми деталями'
        why: 'Это повторяет уже успешную команду и может создать вторую сущность.'
      - text: 'Показать обычный экран недоступной карточки без факта создания и ID'
        why: 'Теряется важное подтверждение пользовательского действия и опора для его восстановления.'
      - text: 'Заказ создан; детали недоступны, можно повторить их загрузку'
        correct: true
        why: 'Разделены известный успех команды и последующий сбой получения представления.'
    explanation: "Восстановление должно повторять неудавшийся шаг, если исход предыдущего известен.\nСохранённый ID связывает дальнейшее чтение с подтверждённым результатом.\nОшибка загрузки карточки не является ошибкой создания. Если подтверждения создания не было,\nмодель была бы другой; нельзя переносить вывод этого сценария на неопределённый исход команды.\n"
    topic: 'F4. Data flow & API design'
    subtopic: 'F4.3 Data lifecycle & UI outcomes'
    links:
      - 'https://docs.arc42.org/section-6/'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API/Using_Fetch'
  - id: 'fsd-f-f4-3-005'
    level: 'middle'
    question: 'Сервис обработки медиа вернул известный отказ: выбранный профиль кодирования несовместим с файлом. Исходник доступен, остальные параметры допустимы. Пользователь должен исправить выбор без повторной загрузки. Что требуется от UI?'
    options:
      - text: 'Сохранить исходник и параметры; дать исправить профиль'
        why: 'Путь исправления соответствует причине отказа и сохраняет уже выполненную подготовку.'
        correct: true
      - text: 'Сбросить исходник и начать повторный выбор всех параметров'
        why: 'Это теряет полезную подготовку, хотя контракт отверг только профиль.'
      - text: 'Повторить ту же обработку после задержки с прежним профилем'
        why: 'Ожидание не исправляет известную несовместимость входов.'
      - text: 'Закрыть экран обработки до нового импорта исходника'
        why: 'Пользователь лишается предусмотренного адресного исправления и должен повторять успешные шаги.'
    explanation: 'Восстановление выбирают по известной причине отказа. Ошибка параметра обработки требует изменить этот параметр, а не повторять весь импорт. Уже подготовленные данные остаются доступными в пределах разрешённых сроков и хранения. Если исход команды неизвестен, нужен другой договор восстановления; здесь контракт явно сообщает непринятие обработки.'
    topic: 'F4. Data flow & API design'
    subtopic: 'F4.3 Data lifecycle & UI outcomes'
    links:
      - 'https://docs.arc42.org/section-6/'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API/Using_Fetch'
  - id: 'fsd-f-f4-3-006'
    level: 'senior'
    multiple: true
    question: 'Массовое сохранение неатомарно. Сервер сообщил исход каждой из десяти записей: семь приняты, три отклонены из-за исправимых полей. Какие действия соответствуют этому результату?'
    options:
      - text: 'Сохранить подтверждённые успехи семи записей'
        correct: true
        why: 'Они уже приняты сервером; отказ других строк не отменяет эти результаты.'
      - text: 'Повторить все десять команд как одну полностью неуспешную попытку'
        why: 'Это игнорирует известные успехи и без оснований повторяет уже принятые операции.'
      - text: 'Показать три адресных отказа и после исправления отправить только их'
        correct: true
        why: 'Восстановление связано с конкретными неуспешными входами, а не с уже завершённой частью.'
      - text: 'Показать общий успех и скрыть три ошибки ради целостного экрана'
        why: 'Пользователь получит ложное обещание сохранения всех записей.'
      - text: 'Оставить значения трёх отклонённых строк доступными для исправления'
        correct: true
        why: 'Известные ошибки требуют изменить эти входы, а не повторно собирать всю принятую часть пакета.'
      - text: 'Считать три отклонённых строки ожидающими и повторить их без правок'
        why: 'Контракт сообщает исправимые ошибки полей, поэтому ожидание не заменяет изменение входов.'
    explanation: 'Частичный исход может находиться внутри одной массовой операции, а не только между независимыми блоками экрана. Если контракт сообщает результат каждой записи, UI должен сохранить эту гранулярность. Подтверждённые успехи остаются успехами, известные отказы имеют адресный путь исправления. Вопрос задаёт неатомарный контракт: если backend обещает атомарность пакета, модель исхода будет другой.'
    topic: 'F4. Data flow & API design'
    subtopic: 'F4.3 Data lifecycle & UI outcomes'
    links:
      - 'https://docs.arc42.org/section-6/'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API/Using_Fetch'
  - id: 'fsd-f-f5-1-001'
    level: 'middle'
    question: 'Небольшой read-only справочник загружается одним запросом, бюджет памяти выполнен, шаринг фильтра не нужен. Предлагают сложный общий слой состояния из-за его популярности. Какого обоснования не хватает?'
    options:
      - text: 'Связи сложности с конкретной потребностью и измеримым выигрышем'
        correct: true
        why: 'Без неё новое решение добавляет стоимость, но не демонстрирует улучшения для данного сценария.'
      - text: 'Обзора поддержки библиотеки без оценки текущего сценария'
        why: 'Поддержка важна как один критерий, но сама не доказывает пользу нового архитектурного слоя.'
      - text: 'Плана переноса всего локального UI в новый persisted store'
        why: 'Так расширяется объём миграции, но не объясняется, какой текущий пользовательский результат улучшится.'
      - text: 'Списка будущих потребителей, не подтверждённых владельцем продукта'
        why: 'Гипотетическое переиспользование может быть допущением, но не заменяет оценки его вероятности и цены.'
    explanation: "Сравнение начинается с критериев продукта и ограничений, а не с количества функций инструмента.\nПоддержка и опыт команды тоже имеют значение, но обсуждаются как конкретные расходы и риски.\nПростое решение может быть достаточным до появления новой потребности. Более сложный слой\nстановится обоснованным, если решает реальную проблему с приемлемой ценой внедрения и поддержки.\n"
    topic: 'F5. Architecture decisions'
    subtopic: 'F5.1 Alternatives & trade-offs'
    links:
      - 'https://docs.arc42.org/section-9/'
      - 'https://docs.arc42.org/section-4/'
  - id: 'fsd-f-f5-1-002'
    level: 'senior'
    question: 'Медиагалерея использует готовые миниатюры CDN, все клиенты получают нужные размеры и укладываются в бюджет. Свой сервис генерации потребует инфраструктуру; новых форматов и особых преобразований не требуется. Что выбрать сейчас?'
    options:
      - text: 'Внедрить свой сервис ради возможных форматов будущей версии'
        why: 'Неустановленные потребности не оправдывают текущую цену отдельного обслуживания.'
      - text: 'Генерировать миниатюры в каждом клиенте из полноразмерного исходника'
        why: 'Это добавит передачу и вычисление без выигрыша относительно уже подходящих ресурсов CDN.'
      - text: 'Использовать готовые миниатюры; сервис рассмотреть при неподдержанном требовании'
        why: 'Текущий вариант достаточен, а условие пересмотра связывает будущую цену с реальной потребностью.'
        correct: true
      - text: 'Поддерживать обе системы генерации параллельно до появления потребителей'
        why: 'Добавляются два источника результата и операционная нагрузка без сформулированной пользы.'
    explanation: 'Выбор достаточного решения должен быть конкретным. Здесь готовый сервис выполняет текущие требования, поэтому отдельная инфраструктура не даёт установленного выигрыша. Цена собственного решения включает разработку и поддержку, а условием пересмотра могут стать неподдержанные форматы, требования к преобразованиям или изменение бюджета. Это не универсальное предпочтение CDN: вывод опирается на условия задачи.'
    topic: 'F5. Architecture decisions'
    subtopic: 'F5.1 Alternatives & trade-offs'
    links:
      - 'https://docs.arc42.org/section-9/'
      - 'https://docs.arc42.org/section-4/'
  - id: 'fsd-f-f5-1-003'
    level: 'middle'
    question: 'Для первого релиза выбран один запрос всего малого справочника. Какое описание решения позволяет оценить выигрыш, цену и пересмотр?'
    options:
      - text: 'Меньше запросов; размер ответа постоянен; пересмотр при росте числа экранов'
        why: 'Число запросов уменьшается, но размер полного ответа растёт вместе со справочником. Число экранов само по себе не показывает, укладывается ли загрузка в бюджет.'
      - text: 'Проще загрузка; больше начальный ответ; пересмотр при выходе объёма за бюджет'
        correct: true
        why: 'Указаны выигрыш, издержка и проверяемая граница, а не вечная оценка подхода.'
      - text: 'Меньше запросов; данные свежи до закрытия вкладки; пересмотр по объёму'
        why: 'Загрузка полной коллекции не гарантирует её свежесть: владелец может изменить данные, пока вкладка открыта. Объём не заменяет критерий актуальности.'
      - text: 'Проще загрузка; больше начальный ответ; пересмотр при смене библиотеки'
        why: 'Выигрыш и цена названы, но смена библиотеки сама по себе не означает, что подход нарушил требования. Пересмотр нужно связать с наблюдаемым критерием продукта.'
    explanation: "Обоснование включает контекст и последствия, а не только название выбранного механизма.\nПересмотр связывают с изменением объёма, задержки, свежести или других критериев продукта.\nЭто не обязательно точная универсальная числовая граница: важен воспроизводимый способ\nзаметить нарушение. Согласованный бюджет помогает не усложнять систему заранее.\n"
    topic: 'F5. Architecture decisions'
    subtopic: 'F5.1 Alternatives & trade-offs'
    links:
      - 'https://docs.arc42.org/section-9/'
      - 'https://docs.arc42.org/section-4/'
  - id: 'fsd-f-f5-1-004'
    level: 'middle'
    question: 'Один экран и один потребитель правил. Чтобы добавить поле, команда строит плагинную платформу с независимыми релизами. Подтверждённой потребности расширения другими командами нет. Что проверить прежде всего?'
    options:
      - text: 'Соответствует ли цена платформы реальным требованиям независимости изменений'
        correct: true
        why: 'Сложность оправдывается нужным сценарием, а не возможностью когда-нибудь применить его.'
      - text: 'Сначала опубликовать универсальный контракт, потом искать потребителей'
        why: 'Публичные обязательства возникнут до подтверждения нужной вариативности и цены поддержки.'
      - text: 'Выделить независимые релизы только ради одной новой формы'
        why: 'Один локальный сценарий не доказывает потребности в независимой поставке и её инфраструктуре.'
      - text: 'Перенести правила в удалённые плагины для возможных будущих команд'
        why: 'Будущие потребители не подтверждены, а распределённые границы уже увеличивают стоимость и риски.'
    explanation: "Преждевременная универсализация создаёт контракты, которые придётся поддерживать без текущей пользы.\nИногда расширяемость действительно является требованием, и тогда её стоимость оправдана.\nНужны конкретные потребители, независимые изменения и ограничения поставки. Для текущего scope\nлокальная граница модуля может сохранить возможность эволюции без полноценной платформы.\n"
    topic: 'F5. Architecture decisions'
    subtopic: 'F5.1 Alternatives & trade-offs'
    links:
      - 'https://docs.arc42.org/section-9/'
      - 'https://docs.arc42.org/section-4/'
  - id: 'fsd-f-f5-1-005'
    level: 'senior'
    question: 'После исследования выяснилось: два экрана используют общие изменяемые сущности, расходятся данные, исправление каждого бага требует синхронизации копий. Почему общий слой модели теперь может быть оправдан?'
    options:
      - text: 'Потому что общая модель сделает клиентские данные окончательной серверной истиной'
        why: 'Упорядоченное локальное владение не передаёт клиенту полномочия серверного контракта.'
      - text: 'Потому что сначала нужен новый слой, а затем можно исследовать причины багов'
        why: 'Наблюдаемые симптомы требуют связи с конкретным механизмом; слой без такой связи может не устранить причину.'
      - text: 'Потому что он адресует наблюдаемую цену дублируемых владельцев'
        correct: true
        why: 'Появилась конкретная проблема, с которой можно сравнить стоимость нового слоя и альтернатив.'
      - text: 'Потому что нужно перенести туда также все несвязанные UI-черновики'
        why: 'Проблема общих сущностей не означает общую область жизни для независимых состояний интерфейса.'
    explanation: "Оправданное усложнение отвечает на уже выявленную проблему или подтверждённое требование.\nОбщая модель может уменьшить число независимых путей записи и стоимость согласования.\nЭто не означает перенести в неё всё состояние приложения. Нужно сравнить выигрыш с ценой\nмиграции, новым контрактом и пределами тех гарантий, которыми клиент действительно владеет.\n"
    topic: 'F5. Architecture decisions'
    subtopic: 'F5.1 Alternatives & trade-offs'
    links:
      - 'https://docs.arc42.org/section-9/'
      - 'https://docs.arc42.org/section-4/'
  - id: 'fsd-f-f5-1-006'
    level: 'senior'
    multiple: true
    question: 'Дизайн поиска A проще и делает больше обращений; B уменьшает их, но добавляет хранение и правила свежести. Какие планы сравнения учитывают и пользовательские требования, и цену обоих решений?'
    options:
      - text: 'Проверить оба на общих сценариях, бюджетах и затратах поддержки'
        correct: true
        why: 'Есть единая пользовательская основа сравнения и цена выполнения обязательств каждого дизайна.'
      - text: 'Сравнить число запросов обоих при одном объёме данных'
        why: 'Одинаковый объём полезен, но пропущены свежесть, задержка и дополнительные обязанности хранения.'
      - text: 'Сопоставить только задержку холодного старта обоих на одном устройстве'
        why: 'Это узкий сценарий; он не охватывает повторное чтение, свежесть и поддержку.'
      - text: 'Сравнить B с кешем и A без сети на разных пользовательских сценариях'
        why: 'Разные условия не позволяют приписать различия архитектурному решению.'
      - text: 'Сравнить бюджеты обоих и исключить миграцию из расчёта стоимости'
        why: 'Из оценки исчезает значимая цена внедрения, поэтому план не учитывает требуемые затраты обоих вариантов.'
    explanation: "Альтернативы редко сравниваются по единственной метрике. Полезно зафиксировать критерии,\nинварианты и цену поддержки, затем показать, какой обмен выгоден при текущих условиях.\nПри другой цене старых данных предпочтение может измениться. Выбор не обязан доказывать\nуниверсальную победу одного подхода; достаточно обоснования в согласованном контексте.\n"
    topic: 'F5. Architecture decisions'
    subtopic: 'F5.1 Alternatives & trade-offs'
    links:
      - 'https://docs.arc42.org/section-9/'
      - 'https://docs.arc42.org/section-4/'
  - id: 'fsd-f-f5-2-001'
    level: 'middle'
    question: 'Главная неизвестная — помещается ли реальная таблица в бюджет памяти и отклика на слабом телефоне. Что даст наиболее прямую проверку до полной реализации?'
    options:
      - text: 'Прототип с репрезентативным объёмом и измерением на целевом классе устройств'
        correct: true
        why: 'Эксперимент проверяет именно неизвестную гипотезу в существенных для неё условиях.'
      - text: 'Демонстрация пяти строк на рабочей станции разработчика'
        why: 'Среда и объём не соответствуют риску, поэтому успешный результат мало говорит о целевом сценарии.'
      - text: 'Переписывание всех экранов до получения первых измерений'
        why: 'Дорогая работа выполняется до выяснения, нужна ли такая архитектурная инвестиция.'
      - text: 'Выбор инструмента по обещанию высокой производительности в описании'
        why: 'Общее заявление не доказывает выполнение бюджета на реальных данных продукта.'
    explanation: "Рискованная гипотеза должна иметь наблюдаемый критерий опровержения. Прототип изолирует\nсущественную часть работы и использует реалистичные данные и среду. Он не обязан выглядеть\nкак готовый продукт. Успешный эксперимент снижает конкретную неопределённость, но не доказывает\nкачество всех сценариев, безопасность и устойчивость будущей реализации.\n"
    topic: 'F5. Architecture decisions'
    subtopic: 'F5.2 Risks & justification'
    links:
      - 'https://docs.arc42.org/section-11/'
      - 'https://docs.arc42.org/section-9/'
  - id: 'fsd-f-f5-2-002'
    level: 'senior'
    question: 'Прототип с 500 строками быстр, но ожидаемый диапазон — от 500 до 50 тысяч, а измеряли только время первого ответа сервера. Какой вывод обоснован?'
    options:
      - text: 'Перенести бюджет серверного ответа на весь UI и принять верхний диапазон'
        why: 'Клиентская обработка и большой объём не измерены, поэтому вывод шире данных.'
      - text: 'Отклонить текущую модель и начать миграцию по одному неполному тесту'
        why: 'Недостающие измерения не доказывают, что решение не выполнит пользовательский бюджет.'
      - text: 'Подтверждена узкая часть гипотезы; нужны клиентские измерения и большие входы'
        correct: true
        why: 'Вывод остаётся в границах собранных данных и показывает, что ещё требуется проверить.'
      - text: 'Повторить серверный тест много раз на тех же 500 строках'
        why: 'Это улучшит статистику узкой метрики, но не охватит большие входы и клиентскую работу.'
    explanation: "Эксперимент полезен, только если его вывод не шире условий проверки. Быстрый серверный ответ\nне гарантирует быстрый UI, а малый вход не доказывает поведение большого. Следующий шаг\nдолжен адресовать оставшуюся неизвестность. Не нужно автоматически переходить к сложнейшему\nдизайну: сначала выясняют, где действительно нарушается согласованный критерий.\n"
    topic: 'F5. Architecture decisions'
    subtopic: 'F5.2 Risks & justification'
    links:
      - 'https://docs.arc42.org/section-11/'
      - 'https://docs.arc42.org/section-9/'
  - id: 'fsd-f-f5-2-003'
    level: 'middle'
    question: 'Сейчас сервис использует одна команда и один экран. Ожидают рост, но сроки и новые потребители не подтверждены. Какой план эволюции обоснован?'
    options:
      - text: 'Выпустить публичные плагины заранее, чтобы новым командам было куда подключаться'
        why: 'Неподтверждённые потребители ещё не задают нужную вариативность, а контракт уже придётся поддерживать.'
      - text: 'Выделить ясные границы сейчас и проверяемые сигналы усложнения позже'
        correct: true
        why: 'Сохраняется возможность развития без реализации всех гипотетических требований.'
      - text: 'Сохранить общую изменяемую структуру вместо границ до появления второго экрана'
        why: 'Небольшой scope не отменяет потребности понимать ответственность за нынешние изменения.'
      - text: 'Объявить текущую структуру долгосрочным стандартом без критериев наблюдения'
        why: 'Без сигналов пересмотра легко пропустить момент, когда новые требования изменят цену решения.'
    explanation: "Эволюционный дизайн оставляет понятные границы и наблюдаемые поводы для изменения.\nОн не означает ни заранее строить максимальную платформу, ни запрещать будущие вложения.\nСигналом может стать независимый потребитель, повторяемая цена координации или нарушение бюджета.\nРеальные долговечные данные и опубликованные контракты всё равно требуют внимания с первого релиза.\n"
    topic: 'F5. Architecture decisions'
    subtopic: 'F5.2 Risks & justification'
    links:
      - 'https://docs.arc42.org/section-11/'
      - 'https://docs.arc42.org/section-9/'
  - id: 'fsd-f-f5-2-004'
    level: 'senior'
    question: 'Команда ускорила монтажную шкалу: вычислений стало меньше. Обязательный инвариант — порядок выбранных клипов и длительность итогового видео не меняются; бюджет отклика задан. Что добавить к защите решения?'
    options:
      - text: 'Проверку порядка и длительности на тех же проектах вместе с откликом'
        why: 'Выигрыш производительности допустим среди решений, сохраняющих обязательный смысл результата.'
        correct: true
      - text: 'Сравнение числа вычислений без проверки пользовательского результата'
        why: 'Метрика механизма может улучшиться ценой нарушения инварианта.'
      - text: 'Проверку длительности без сопоставления порядка клипов'
        why: 'Одинаковая сумма длительностей не доказывает сохранение последовательности монтажа.'
      - text: 'Замер одного короткого проекта вместо проверки согласованных сценариев'
        why: 'Он не обосновывает бюджет и инварианты на нужном диапазоне данных.'
    explanation: 'Инварианты ограничивают множество допустимых оптимизаций. Меньше вычислений полезно, если сохраняются порядок, длительность и другие обязательные свойства результата. В защите нужно связать измеренный выигрыш с теми же входами и критическими сценариями. При расширении поддерживаемого диапазона проектных данных могут понадобиться новые измерения и пересмотр решения.'
    topic: 'F5. Architecture decisions'
    subtopic: 'F5.2 Risks & justification'
    links:
      - 'https://docs.arc42.org/section-11/'
      - 'https://docs.arc42.org/section-9/'
  - id: 'fsd-f-f5-2-005'
    level: 'senior'
    question: 'Локальные черновики приняли для одного устройства. Теперь нужен переход между устройствами. Как защитить прежнее решение и предложить развитие без ложной универсальности?'
    options:
      - text: 'Показать прежние условия и пересмотреть хранение под новую доступность'
        correct: true
        why: 'Новая гарантия объясняет изменение, не отрицая обоснованность решения в прежнем scope.'
      - text: 'Оставить личный localStorage и восстанавливать его после входа на втором устройстве'
        why: 'Одинаковая учётная запись сама не переносит содержимое первого браузера.'
      - text: 'Начать удалённое хранение с пустого состояния, не обрабатывая старые записи'
        why: 'Эволюция лишит уже существующих черновиков их пользователей без согласованной политики.'
      - text: 'Редактировать локальную и серверную копии независимо, не определив применение'
        why: 'Так доступность добавляется вместе с конфликтом владельцев, который не разрешён новой моделью.'
    explanation: "История решения помогает отличить оправданное изменение от беспричинной замены.\nНовый сценарий меняет область доступности данных, поэтому локальный контракт нужно расширить\nили заменить. При этом учитывают существующие черновики и пользовательские обещания.\nПодробный протокол синхронизации здесь не требуется: нужно установить направление эволюции и цену.\n"
    topic: 'F5. Architecture decisions'
    subtopic: 'F5.2 Risks & justification'
    links:
      - 'https://docs.arc42.org/section-11/'
      - 'https://docs.arc42.org/section-9/'
  - id: 'fsd-f-f5-2-006'
    level: 'senior'
    question: 'Завтра публикуют постоянные URL документов для внешних интеграций. Неизвестно, стабильны ли ID поставщика между выгрузками; проверка договора займёт два часа. Рост нагрузки в десять раз в ближайший год маловероятен, оформление локально обратимо. Какую проверку провести первой?'
    options:
      - text: 'Проверить договор о стабильности ID до публикации внешних ссылок'
        correct: true
        why: 'Ошибка закрепится в долговечных внешних контрактах; короткая проверка предотвращает дорогую позднюю смену идентичности.'
      - text: 'Проверить запас под десятикратную нагрузку до проверки ID'
        why: 'Отдалённый маловероятный риск вытесняет дешёвую проверку близкого дорогого решения.'
      - text: 'Согласовать меню интеграций до проверки идентичности документов'
        why: 'Меню обратимо, а внешние ссылки скоро закрепят потенциально неверное допущение.'
      - text: 'Сравнить ID внутри одной выгрузки и принять межвыгрузочную стабильность'
        why: 'Один снимок проверяет иной аспект и не доказывает долгоживущую гарантию поставщика.'
    explanation: 'Риск приоритизируют по вероятности ошибки, последствиям, близости дорогого решения и стоимости проверки. Здесь публикация постоянных ссылок быстро распространит неподтверждённое допущение наружу. Нужны контракт поставщика и подходящая проверка истории выгрузок; пара совпадений в одном снимке не доказывает гарантию. Спекулятивную нагрузку не игнорируют навсегда, но она не должна вытеснять дешёвую проверку ближайшего труднообратимого решения.'
    topic: 'F5. Architecture decisions'
    subtopic: 'F5.2 Risks & justification'
    links:
      - 'https://docs.arc42.org/section-11/'
