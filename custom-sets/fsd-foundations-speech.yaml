title: 'FSD Foundations — устные'
kind: 'speech'
questions:
  - id: 'speech-fsd-f-f1-1-001'
    level: 'middle'
    question: 'Поручили «сделать поиск корпоративных документов на React». Проведи начало архитектурного обсуждения: вопросы, участники, входы и выходы; какие решения пока отложишь? Вторая часть, для итогового повторения после F5: Наметь границы подсистем, владельцев состояния и контракт поиска; назови один компромисс и критерий его пересмотра.'
    answer: "Выясню, кто ищет документы: сотрудники, внешние клиенты, администраторы. Для основного пользователя\nзапишу путь: запрос, уточнение фильтров, выдача, открытие документа. Входы — запрос, фильтры,\nконтекст доступа; выходы — доступные результаты и переход к документу. Отдельно уточню, кто\nпубликует документы и когда новые материалы должны становиться доступными поиску.\n\nПриоритет отдам вопросам, меняющим архитектуру: размер выдачи, задержка, слабая сеть, чувствительность\nдокументов и возможность делиться поиском. Например, скрытие карточки не заменяет серверную проверку\nправа на документ. Конкретный контракт доступа согласуем с владельцем API. Для долгих операций\nспрошу, должен ли пользователь возвращаться к результату после ухода.\n\nReact уже задан как ограничение, но библиотеку состояния, транспорт и кеш пока выбирать рано.\nЕсли ответа нет, запишу допущение и решение, которое придётся пересмотреть при его опровержении.\nНе превращаю разговор в полный опросник: сначала подтверждаю основной сценарий, затем уточняю\nнеизвестные с высокой ценой ошибки. Результат — общая модель задачи, а не перечень инструментов.\n\nПосле согласования требований разделю представление запроса, управление применённым поиском и доступ к API. Для несекретного поиска с шарингом URL может задавать применённые параметры, временный ввод остаётся в редакторе, подтверждённые документы — данными сервера. В контракте нужны ID, достаточные поля выдачи, продолжение и различимые исходы. Если экран один и данные малы, простой путь загрузки дешевле общего слоя; при новых потребителях или выходе за бюджет решение пересмотрю.\n"
    points:
      - 'Основные и вторичные пользователи'
      - 'Сценарий, входы и выходы системы'
      - 'Архитектурно значимые вопросы'
      - 'Разделение требования, ограничения и реализации'
      - 'Границы подсистем и владельцы выбранных состояний'
      - 'Необходимый API-договор и цена выбранного решения'
    topic: 'F1. Problem framing'
    subtopic: 'F1.1 Requirements discovery'
    links:
      - 'https://docs.arc42.org/section-1/'
  - id: 'speech-fsd-f-f1-2-001'
    level: 'senior'
    question: 'От мобильного каталога требуют мгновенную загрузку, всегда актуальные цены и минимум трафика. Преврати пожелания в требования и объясни конфликт без преждевременного выбора технологии.'
    answer: "Разделю сценарии: первое открытие, поиск, просмотр карточки, подтверждение покупки. Для каждого\nуточню устройство, сеть, объём данных и границы измерения задержки. Согласую порог и долю успешных\nизмерений вместе с правилами учёта ошибок. Порог определяет продукт, а не название фреймворка.\n\nУточню актуальность цены: нужна ли серверная проверка перед покупкой, допустима ли старая цена\nс отметкой времени, что доступно без сети. Локальная копия не узнаёт серверные изменения сама.\nМеньше запросов может означать большее отставание; предзагрузка уменьшает ожидание ценой лишнего\nтрафика. Постоянное обновление тоже имеет сетевую и эксплуатационную стоимость.\n\nОтдельно уточню доступность интерфейса как качество: возможность пройти поиск и покупку клавиатурой, понятный фокус после обновления и доступное чтение результата вспомогательными технологиями. Эти наблюдаемые критерии влияют на выбор UI-паттернов, а не откладываются до косметической правки. Выделю ограничения срока и бюджета, памяти телефона, сети и доступного API. Возможно, просмотр\nдопускает помеченные старые данные, а покупка требует подтверждения цены сервером. Это пример\nсогласуемого договора, не универсальное правило торговли. Если требуется свежесть при полном\noffline, покажу несовместимость и предложу ограничить функциональность либо изменить обещание.\nИтогом будут проверяемые сценарии и явные приоритеты, по которым затем сравнивают решения.\n"
    points:
      - 'Метрики вместе со средой и пользовательским действием'
      - 'Отдельные требования свежести для разных сценариев'
      - 'Бизнес, устройство и API как источники ограничений'
      - 'Явный компромисс и поведение при offline'
      - 'Наблюдаемые критерии доступности интерфейса'
    topic: 'F1. Problem framing'
    subtopic: 'F1.2 Quality & constraints'
    links:
      - 'https://docs.arc42.org/section-2/'
      - 'https://docs.arc42.org/section-10/'
  - id: 'speech-fsd-f-f1-3-001'
    level: 'senior'
    question: 'За месяц нужно выпустить редактор заявок. Хотят offline, совместную работу, вложения и восстановление черновика. Приоритет — безопасно подготовить и отправить заявку. Предложи границу MVP и порядок проверки неизвестных.'
    answer: "Начну со сквозного результата: уполномоченный сотрудник заполняет, проверяет, отправляет заявку\nи понимает, принята ли она. Выясню обязательные вложения и правила хранения чувствительных данных.\nScope предложу как один согласованный режим редактирования с необходимыми полями и подтверждением\nотправки; совместную работу и полноценный offline отложу, если владелец подтвердит допустимость.\nЕсли вложение обязательно для юридически значимой заявки, исключать его ради срока нельзя.\n\nРазделю факты, допущения и вопросы. «Один редактор» может быть согласованным ограничением MVP,\nа «сервер обнаруживает повторную отправку» пока только допущением. Для последнего назову риск\nи способ проверки контракта. Не обещаю восстановление после закрытия, пока не разрешено и не\nопределено хранение черновика. Если оно запрещено, обсудим изменение гарантии или сценария.\n\nРаньше внешнего вида проверю хранение, семантику отправки и возможные конфликты: их опровержение\nдорого меняет архитектуру. Затем проверю размеры вложений и ограничения API. Запишу отложенные\nфункции и условия пересмотра границ, не реализуя всю будущую систему. MVP должен проверять ценность\nи оставаться честным перед пользователем, а не представлять собой половину каждого экрана.\n"
    points:
      - 'Целостный обязательный путь подготовки и отправки'
      - 'Явно исключённые функции и условия их возвращения'
      - 'Факты отдельно от допущений и открытых вопросов'
      - 'Приоритет по цене ошибки и ограничениям хранения'
    topic: 'F1. Problem framing'
    subtopic: 'F1.3 Scope & prioritization'
    links:
      - 'https://docs.arc42.org/section-3/'
      - 'https://docs.arc42.org/section-11/'
  - id: 'speech-fsd-f-f1-4-001'
    level: 'middle'
    question: 'На 35-минутном интервью нужно спроектировать личный кабинет. Предложи план ответа. На середине разговора добавили обязательное восстановление незаконченной заявки после перезапуска: как перестроишь обсуждение?'
    answer: "Первые несколько минут использую для основного пользователя, сценария и ограничений. Согласую,\nчто кабинет делает в выбранном scope, какие данные чувствительны и какой исход считается успехом.\nЗатем покажу общую схему ответственности, модель данных и путь ключевого действия. Большую часть\nоставшегося времени потрачу на критические сценарии и отказы, в конце назову компромиссы и риски.\nЭто ориентир, а не фиксированная поминутная формула: направление интервьюера важнее расписания.\n\nНовое требование восстановить заявку меняет срок жизни ввода. Явно скажу, что прежнее решение\nпредполагало живую вкладку. Уточню, разрешено ли хранение на устройстве, нужна ли доступность\nна другом устройстве и что гарантирует сервер. Сравню локальный и серверный черновик по этим\nусловиям, не объявляя один способ универсальным. Если условия несовместимы, покажу конфликт.\n\nСкорректирую на схеме владельца черновика и сценарий открытия, затем проверю отказ сохранения\nи отличие черновика от отправленной заявки. Не перерисовываю не затронутые части и не трачу\nостаток времени на перечисление компонентов. Честно отделю допущения от подтверждённых гарантий\nи обозначу, что ещё нужно проверить после обсуждения.\n"
    points:
      - 'План от требований к схеме, данным и критическим сценариям'
      - 'Гибкая глубина вместо жёсткого расписания'
      - 'Явный пересмотр прежнего допущения'
      - 'Условия хранения и честные границы обещаний'
    topic: 'F1. Problem framing'
    subtopic: 'F1.4 Interview framing'
    links:
      - 'https://docs.arc42.org/section-4/'
  - id: 'speech-fsd-f-f2-1-001'
    level: 'senior'
    question: 'Каталог поддерживает обычную и быструю покупку. Оба экрана копируют проверки, запросы и обработку ошибок. Предложи границы ответственности и объясни, где остановишь выделение модулей. Вторая часть, для итогового повторения после F5: Очерти MVP, владельцев корзины и подтверждённого заказа, минимальный API-контракт и условие усложнения общей модели.'
    answer: "Выделю представления двух способов покупки, общий модуль сценария оформления, модель правил заказа\nи доступ к API. Представление собирает ввод и показывает исход. Модуль сценария координирует шаги,\nправила выражают допустимые сочетания данных, адаптер переводит модель в контракт сервера.\nСервер остаётся владельцем окончательной допустимости и фиксации заказа.\n\nКонтракт модуля сценария сформулирую через вход заказа и различимые результаты, а не через состояние\nконкретной модалки. Не буду заставлять быстрый заказ пользоваться всей разметкой обычного.\nОдинаковые примитивы ввода можно переиспользовать отдельно; разные доменные правила не следует\nобъединять только из-за внешнего сходства полей.\n\nСначала это могут быть части одного feature-модуля. Пакеты и независимые релизы оправданы, когда\nесть реальная независимость изменений и владельцев. Если обычная правка требует синхронного\nредактирования многих контрактов, гранулярность пересмотрю. При этом не обещаю, что любая смена API\nзатронет только адаптер: изменение смысла операции закономерно меняет и модуль сценария. Цель — изолировать\nслучайные технические детали, сохранив видимой бизнес-связность.\n\nMVP должен дать законченный путь выбора и покупки без необязательной персонализации. Один клиентский владелец принимает команды локальной корзины, а подтверждённый заказ определяется договором API. Запрос оформления содержит согласованные входы; ответ различает созданный заказ, известные ошибки и отсутствие известного результата. Общую модель выделю ради двух потребителей общей операции, но не ради одинаковой разметки: её цена — дополнительный контракт и координация. Если потребители разойдутся по правилам, разделю процессы, сохранив устойчивые UI-примитивы.\n"
    points:
      - 'Границы по ответственности, не по кнопкам и экранам'
      - 'Представление, модуль сценария, правила и технический обмен'
      - 'Предварительная проверка не заменяет серверную'
      - 'Гранулярность по совместным и независимым изменениям'
      - 'Законченный MVP и разные владельцы корзины и заказа'
      - 'API-исходы и проверяемое условие пересмотра границ'
    topic: 'F2. System decomposition'
    subtopic: 'F2.1 Responsibilities & boundaries'
    links:
      - 'https://docs.arc42.org/section-5/'
  - id: 'speech-fsd-f-f2-2-001'
    level: 'senior'
    question: 'Два экрана создают экспорт через SDK поставщика. Нужно заменить SDK и тестировать модуль сценария без сети. Опиши контракт и зависимости; что нельзя скрыть как несущественную деталь?'
    answer: "Определю необходимую возможность: создать экспорт по параметрам и получить различимый исход.\nВход не содержит DOM и setter конкретного экрана. Результат различает отказ в доступе, ошибки\nпараметров и принятую задачу с идентификатором. Готовый файл не обещается, если сервер пока лишь\nпринял задачу. Представления сами решают, где показать ошибку и куда перейти.\n\nМодуль сценария зависит от этого контракта; конкретный адаптер реализует его через SDK. В точке сборки\nприложения подставляется адаптер, в тесте — контролируемая реализация с теми же обещаниями.\nОтвет SDK переводится у границы, поэтому смена имён его полей не требует менять два экрана.\nПри этом абстракция не должна обещать гарантию, которой новый поставщик не обеспечивает.\n\nК контракту относятся смысл подтверждения, значимые ошибки и доступность дальнейшего получения\nрезультата. Замена подтверждённого серверного сохранения на запись в очередь вкладки не становится\nсовместимой из-за прежних типов. Её потребуется явно согласовать. Не создаю универсальный интерфейс\nвсех поставщиков заранее: описываю необходимую задаче возможность и проверяю её реальными сценариями.\n"
    points:
      - 'Контракт выражает потребность, а не внутренности SDK'
      - 'Сборка связывает модуль сценария и технический адаптер'
      - 'Результаты различимы без анализа локализованного текста'
      - 'Совместимость включает гарантии, а не только сигнатуру'
    topic: 'F2. System decomposition'
    subtopic: 'F2.2 Dependencies & contracts'
    links:
      - 'https://docs.arc42.org/section-5/'
      - 'https://docs.arc42.org/section-8/'
  - id: 'speech-fsd-f-f2-3-001'
    level: 'middle'
    question: 'После изменения количества в корзине итог обновляется дважды, значок иногда отстаёт, аналитика покупки отправляется при чтении товара. Как восстановишь модель потока и найдёшь границы исправления?'
    answer: "Начну с одного конкретного действия: пользователь меняет количество. Покажу инициатора, команду,\nвладельца изменения, вызов API и путь результата в представления строки, итога и значка. Для\nкаждого ребра отмечу, что передаётся: команда, данные или уведомление. Уточню, в какой точке\nпродукт считает изменение принятым; локальное действие не всегда равно серверному успеху.\n\nЗатем нанесу все дополнительные записи и подписки. Повторный итог может происходить из двух\nкоординаторов или цикла, где отображение запускает новую команду. Отстающий значок может читать\nдругой поток либо не получать результат. Это гипотезы, которые проверю трассировкой сценария,\nа не выводы только по внешнему симптому.\n\nАналитику покупки вынесу из преобразования ответа к явно определённому исходу покупки.\nПреобразование останется без такого побочного эффекта. Не нужно сразу менять библиотеку состояния:\nсначала устанавливаются ответственность и причинность. Схема должна показать не только успешный\nответ API, но и отказ, иначе обработка результата снова разойдётся между участниками.\n"
    points:
      - 'Цепочка от команды до обратного обновления'
      - 'Все зависимые представления и смысл сообщений'
      - 'Циклы и дублирующие инициаторы как проверяемые гипотезы'
      - 'Побочные эффекты в явной точке соответствующего сценария'
    topic: 'F2. System decomposition'
    subtopic: 'F2.3 Data-flow mapping'
    links:
      - 'https://docs.arc42.org/section-6/'
  - id: 'speech-fsd-f-f2-4-001'
    level: 'senior'
    question: 'Нужно показать архитектуру редактора руководителю продукта и разработчикам. Есть API документов и внешний файловый сервис. Какие схемы подготовишь, что на них оставишь и какие решения отметишь как дорогие для изменения? Вторая часть, для итогового повторения после F5: Согласуй MVP редактора, владельцев документа и локального ввода, необходимые API-исходы и одну альтернативу с ценой выбора.'
    answer: "Для общего согласования покажу контекст: редактор как система, роли пользователей, API документов\nи файловый сервис, смысл входов и выходов. Если граница рассматриваемой системы включает backend,\nявно обозначу это; уровень контекста должен быть согласован. Не стану смешивать этот обзор\nс полным деревом UI-компонентов.\n\nРазработчикам добавлю внутренние ответственности и один важный путь: открытие документа,\nредактирование, загрузка вложения, сохранение связи документа с файлом, обработка отказа.\nПоследовательность показывает порядок и владельцев результатов. На ней станет видно, что\nуспешная загрузка файла ещё не означает сохранения документа. Детали всех обработчиков\nне нужны, если они не меняют гарантии рассматриваемого сценария.\n\nКак дорогие решения отмечу идентичность документов, долговечный формат черновиков и опубликованные\nконтракты интеграций. Локальную визуальную композицию менять обычно проще. Наличие интерфейса\nадаптера уменьшает связанность кода, но не отменяет миграцию уже сохранённых данных. Схемы\nдолжны помочь увидеть такие обязательства, а не обещать, что каждый прямоугольник легко заменить.\n\nИтоговый синтез после F5. Для MVP выберу подтверждённый основной путь редактирования и сохранения с обязательными вложениями; совместные изменения могут быть явно отложены. На схеме различу локальный ввод и серверный документ, а в контракте — загрузку файла и известный исход записи документа с его ID. После успеха записи сбой показа не отменяет операцию. Для разрешённого восстановления текущей работы сравню локальную и серверную модель по нужной доступности и цене поддержки; выбор не следует из красивой схемы. Новое межустройственное требование изменит критерии и потребует пересмотра соответствующей границы, а не полного перепроектирования всех частей.\n"
    points:
      - 'Контекст для участников и внешних границ'
      - 'Структура и последовательность для разных вопросов'
      - 'Значимые данные и отказы без полного дерева реализации'
      - 'Долговечные контракты и данные как источник цены изменений'
      - 'Scope и владение данными согласованы со схемой'
      - 'Контракты, альтернативы и условия изменения решения'
