  - id: 'speech-fsd-f-f4-2-001'
    level: 'senior'
    question: 'Спроектируй минимальный контракт списка заявок с редактированием и асинхронным экспортом. Какие поля, ошибки и гарантии запросишь; когда рассмотрел бы endpoint под экран?'
    answer: "Для списка нужны стабильные ID, данные отображения и явный договор продолжения. Для изменения —\nадресуемая сущность, допустимые входы и различимые результаты. Ошибки должны давать клиенту\nвозможность отделить исправление полей от отказа в доступе и неизвестного результата. Человеческий\nтекст не должен быть единственным способом определить исход.\n\nЭкспорт разделю на принятие задачи и получение готового результата. Нужны ID, доступный путь\nпроверки состояния или иной согласованный способ получения результата, поведение при отказе\nи правила доступа к файлу. Ответ о принятии не позволяет показать готовность. Не буду обещать\nсрок завершения, которого сервис не предоставляет.\n\nНа сервере должны проверяться доступ, бизнес-допустимость и инварианты изменения. Клиент не\nобеспечивает их скрытой кнопкой или свежим чтением перед записью. Endpoint под экран рассмотрю,\nесли композиция универсальных ответов даёт измеримый лишний трафик или сложность. Сравню это\nс ценой нового контракта и поддержки разных клиентов. Набор полей должен следовать сценариям,\nа не копировать все данные базы или все детали конкретной разметки.\n"
    points:
      - 'Идентичность, необходимые поля и продолжение списка'
      - 'Структурированные различимые исходы'
      - 'Принятие задачи отдельно от готовности результата'
      - 'Серверные инварианты и цена специализированного контракта'
    topic: 'F4. Data flow & API design'
