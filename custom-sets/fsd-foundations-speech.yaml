      - 'https://docs.arc42.org/section-4/'
  - id: 'speech-fsd-f-f5-2-001'
    level: 'senior'
    question: 'Нужно выбрать модель большой таблицы, но реальный объём и устройства неизвестны. Составь план снижения риска и защиты решения: гипотеза, эксперимент, ограничения вывода и сигнал эволюции.'
    answer: "Сначала уточню ось роста: число сущностей на сервере, передаваемый объём, одновременно видимые\nстроки или стоимость вычисления. Это разные возможные узкие места. Согласую пользовательский\nбюджет, профиль устройств и сети. Не буду заранее считать любую медленную таблицу проблемой DOM.\n\nДля наиболее рискованной гипотезы сделаю узкий прототип на репрезентативных данных, включая\nожидаемый верхний диапазон и важные действия: открытие, фильтр, выбор и возврат. Измерю путь\nдо пользовательского результата, а не только время API. Успешный замер на одном устройстве\nограничивает вывод этой средой; он не доказывает все будущие нагрузки и отказы.\n\nСравню достаточные альтернативы по выигрышу, цене внедрения и риску поздней смены. Сейчас оставлю\nясные границы данных и представления, но не построю все механизмы масштабирования заранее.\nНазову инварианты выбора и редактирования, которые нельзя нарушить ради скорости. Решение\nобъясню через проверенные условия и оставшиеся неизвестные. Сигналом пересмотра станет\nнаблюдаемое нарушение бюджета или подтверждённый новый сценарий, с которым прежняя модель не справляется.\n"
    points:
      - 'Разные оси роста и возможные узкие места'
      - 'Эксперимент проверяет конкретную гипотезу'
      - 'Вывод ограничен данными и средой измерения'
      - 'Инварианты, цена выбора и наблюдаемый сигнал пересмотра'
    topic: 'F5. Architecture decisions'
    subtopic: 'F5.2 Risks & justification'
