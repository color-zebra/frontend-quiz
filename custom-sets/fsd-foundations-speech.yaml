  - id: 'speech-fsd-f-f3-5-001'
    level: 'senior'
    question: 'Спроектируй состояния отправки заявки с вложением. Файл может быть загружен, пока подпись ещё редактируют; заявку принимают сервером, а ответ иногда теряется. Как отделишь переходы операции от её отображения?'
    answer: "Разделю редактируемую заявку, загрузку вложения и попытку отправки. Для загрузки определю состояния\nожидания, выполнения, готовности и отказа; для подписи — собственный редактируемый ввод. Uploaded\nи editing могут сочетаться. Инвариант публикации сформулирую явно: необходимые вложения готовы,\nобязательные поля допустимы. Клиентская проверка улучшает UX, но сервер тоже проверяет свои правила.\n\nДля попытки отправки задам события submit, подтверждение, известный отказ и отсутствие известного\nрезультата. Переход в success происходит по договорённому подтверждению, а не по клику.\nЕсли ответ потерян после возможной серверной записи, выделю неопределённый исход и потребность\nвыяснить результат через контракт. Не буду превращать timeout в доказанный отказ или обещать\nбезопасный повтор без подтверждённых гарантий.\n\nОтображение выводится из модели: спиннер, объяснение, допустимые действия. Сбой уведомления\nпосле подтверждения не меняет успех заявки и не должен повторно создавать её. Сохранённый\nчерновик тоже не равен отправленной заявке. Для небольшой формы хватит обычного явного набора\nпереходов; библиотека имеет смысл, если сложность модели и инструментальная польза оправдывают её.\n"
    points:
      - 'Независимые аспекты и инварианты между ними'
      - 'События, условия и переходы'
      - 'Неопределённый исход отдельно от известного отказа'
      - 'UI-эффект не определяет серверный результат'
    topic: 'F3. State architecture'
    subtopic: 'F3.5 Workflow modeling'
    links:
      - 'https://stately.ai/docs/state-machines-and-statecharts'
  - id: 'speech-fsd-f-f4-1-001'
    level: 'senior'
    question: 'Форма заявки загружает справочники, показывает предварительную стоимость, принимает файл и отправляет заявку. Раздели чтение, локальные действия и команды, опиши порядок и границы серверных гарантий.'
    answer: "Загрузка справочников — чтение. Изменение ввода и раскрытие секций — локальные действия.\nПредварительная стоимость является оценкой по своему контракту; она не означает созданную заявку.\nЗагрузка файла и создание заявки — отдельные команды, если сервер не предоставляет общий контракт.\nПовторное открытие формы не должно автоматически запускать создание заявки.\n\nПорядок выберу по требованиям: пользователь вводит данные, получает раннюю обратную связь,\nзагружает обязательный файл, подтверждает отправку. В модели сохраню идентификатор загруженного\nфайла и отдельно исход создания заявки. Пока вторая операция не подтверждена, нельзя писать\n«заявка создана». Если по продукту файл можно загружать позже, возможен другой порядок;\nэто требует согласованного контракта и понятного промежуточного результата.\n\nСервер проверяет доступ, бизнес-допустимость и связь заявки с допустимым файлом. Клиентские проверки\nпомогают UX, но не гарантируют корректность сохранённого состояния. При известном отказе оставлю\nввод и путь исправления, при неизвестном исходе не стану изображать доказанный отказ. Общая функция\nна клиенте не превращает две команды в транзакцию: нужную гарантию должен предоставить владелец API.\n"
    points:
      - 'Чтение, локальный ввод и команды имеют разный смысл'
      - 'Предварительный расчёт не равен оформлению'
      - 'Успех файла не подтверждает создание заявки'
      - 'Окончательные проверки и гарантии принадлежат серверу'
