  - id: 'speech-fsd-f-f3-3-001'
    level: 'senior'
    question: 'В кабинете есть заказы с общими клиентами, сортируемая таблица с выбором и исторические отчёты. Предложи модель: что хранить, что вычислять, как выбирать запись и где нормализация полезна.'
    answer: "Текущие заказы и клиенты имеют стабильные ID. Если контакт клиента часто меняется и читается\nиз нескольких мест, выделю каноническую таблицу клиентов и ссылки из заказов. Для выбранного\nзаказа сохраню ID, а не номер строки; сортировку и фильтрацию представлю как операции построения\nсписка. Определю, что делать, если выбранный ID удалён или не виден после фильтра.\n\nДешёвый текущий итог и счётчики вычислю из канонической модели. Если результат кешируется ради\nскорости, его зависимость от входов останется явной. Исторический отчёт — другое требование:\nего сумма должна относиться к моменту формирования, поэтому сохраню нужный снимок или версию\nвходов, а не пересчитаю по сегодняшним ценам.\n\nНеизменяемые разделы одного отчёта можно оставить вложенными, если их не редактируют и не\nпереиспользуют независимо. Нормализация требует разрешения ссылок и обработки неполных данных;\nэто оправдано не для любого дерева. Модель выберу по операциям и срокам жизни, чтобы избежать\nкак обновления множества случайных копий, так и ненужной инфраструктуры для простого снимка.\n"
    points:
      - 'Выбор по ID переживает сортировку'
      - 'Текущие агрегаты производны, исторический снимок имеет иной смысл'
      - 'Нормализация для общих независимо изменяемых сущностей'
      - 'Цена ссылок и допустимость простой вложенности'
    topic: 'F3. State architecture'
    subtopic: 'F3.3 Derived state & identity'
