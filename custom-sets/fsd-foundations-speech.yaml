  - id: 'speech-fsd-f-f5-1-001'
    level: 'senior'
    question: 'Для небольшого справочника доступны простая загрузка целиком и общий слой кеша с дополнительными правилами. Защити оба варианта при разных требованиях и объясни условие пересмотра выбранного решения.'
    answer: "Сначала зафиксирую объём, частоту изменений, потребителей, сеть и допустимую свежесть. Если данные\nмалы, читаются одним экраном, а бюджет первой загрузки выполнен, простой вариант даёт меньшую цену\nреализации и меньше состояний. Его цена — начальный ответ и возможные повторные запросы. Проверю,\nчто при этом сохраняются требуемые актуальность и поведение отказов.\n\nЕсли несколько экранов читают общие изменяемые сущности и измерена стоимость повторной загрузки\nили рассогласования, общий слой может дать пользу. Его цена — память, правила обновления,\nотладка и миграция потребителей. Он не устраняет автоматически серверные конфликты и не должен\nзахватывать все локальные UI-состояния.\n\nСравнение проведу на одинаковых сценариях, а не на списке возможностей библиотек. Выберу достаточный\nвариант с приемлемой ценой риска, назову альтернативу и условие пересмотра: рост объёма, новый\nнезависимый потребитель, нарушение бюджета или иные требования свежести. Не обещаю будущую\nуниверсальность. Более простой дизайн может быть осознанным решением, а не недостатком опыта;\nболее сложный — оправданным ответом на новые данные, а не самоцелью.\n"
    points:
      - 'Общие критерии и сценарии сравнения'
      - 'Выигрыш, цена и границы каждого варианта'
      - 'Сложность связана с подтверждённой потребностью'
      - 'Условие пересмотра вместо универсального победителя'
