      - 'https://docs.arc42.org/section-9/'
  - id: 'speech-fsd-f-f5-2-002'
    level: 'senior'
    question: 'Итоговая защита: заявка подтверждена сервером, карточка после этого не загрузилась. Одновременно требуют ускорить экран и обещать восстановление на другом устройстве. Защити границы текущего решения и план изменения, не обещая неподтверждённых гарантий.'
    answer: "Сохраню известный факт: заявка создана и имеет ID. Ошибка чтения карточки не переводит операцию в failed и не разрешает слепо повторить создание. Покажу подтверждённый результат и возможность восстановить чтение. Модель операции и её представление остаются раздельными.\n\nУскорение обсужу как измеримый сценарий: начало ожидания, профиль сети и полезный результат. Нельзя улучшать метрику, скрывая настоящий статус. Для восстановления уже созданной заявки на другом устройстве может хватить серверного списка и чтения по подтверждённому ID с проверкой доступа. Для продолжения ещё не отправленного ввода нужен отдельный доступный пользователю серверный черновик либо иной согласованный перенос. Второе добавляет хранение, правила жизни и ошибки, поэтому не внедряю его ради задачи, которую решает первое.\n\nПроверю существующие контракты: если save означал подтверждение сервера, нельзя молча заменить его локальной очередью и оставить прежний статус. Новые возможности и поведение при недоступности согласую отдельно. Пересмотрю затронутые данные и шаги, сохранив инвариант не создавать дубликаты из-за сбоя представления. Защита покажет прежний контекст, новые условия, альтернативы и цену изменения; точный протокол реализации останется отдельной работой после подтверждения требований."
    points:
      - 'Успех команды отделён от сбоя последующего чтения'
      - 'Скорость не оправдывает ложный статус'
      - 'Межустройственная доступность требует соответствующего источника'
      - 'Семантика контракта и инварианты сохраняются при эволюции'
    topic: 'F5. Architecture decisions'
    subtopic: 'F5.2 Risks & justification'
    links:
