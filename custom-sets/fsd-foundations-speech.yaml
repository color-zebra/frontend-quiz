  - id: 'speech-fsd-f-f3-1-001'
    level: 'middle'
    question: 'В аналитическом кабинете есть серверные результаты, фильтр для обмена ссылкой, ещё не применённые изменения фильтра, раскрытая подсказка и черновик комментария. Предложи классификацию и scope хранения. Вторая часть, для итогового повторения после F5: Покажи путь применения фильтра через подсистемы, необходимый API-договор и компромисс хранения результатов.'
    answer: "Серверные результаты остаются серверными данными, даже если их копия находится в памяти клиента.\nПрименённый несекретный фильтр представлю в URL, поскольку он должен восстановиться у получателя\nссылки. Значения по умолчанию и разбор адреса станут частью навигационного контракта.\n\nНеприменённый фильтр принадлежит редактору фильтра и может отличаться от URL до нажатия «Применить».\nЭто осмысленный черновик, а не ещё один независимый владелец применённого поиска. Раскрытая\nподсказка останется локальной, если не требуется продолжать обучение после ухода с экрана.\nДля комментария отдельно уточню восстановление после refresh и закрытия, чувствительность и доступность\nна других устройствах. Только после этого выберу память, допустимое локальное или серверное хранение.\n\nДля каждого значения запишу владельца, потребителей и момент уничтожения. Долговечность и происхождение\nявляются разными осями: локально сохранённый ответ сервера не превращается в новую истину.\nИзбегу зеркалирования каждого поля между URL, store и панелью. Где расхождение намеренно, определю\nприменение и отмену; где это одна истина, оставлю представления зависимыми от выбранного владельца.\n\nНажатие применения переводит редактируемый выбор в согласованные параметры поиска, затем модуль координации вызывает адаптер API и передаёт известный исход представлению. Для разделяемой ссылки учту восстановление URL и историю. Контракт сообщает ID записей, нужные поля, продолжение и различимые ошибки; пустая выдача не равна отказу. Хранение результатов между открытиями уменьшает повторную работу, но требует правил возраста и обновления. Выбор зависит от допустимой свежести и измеренных затрат, а пересмотр — от новых потребителей или бюджета.\n"
    points:
      - 'Происхождение, навигация и долговечность как разные оси'
      - 'Применённый фильтр отдельно от ещё не применённого'
      - 'Scope по потребителям и сроку жизни'
      - 'Явная цена синхронизации копий'
      - 'Путь применения через подсистемы и API'
      - 'Компромисс повторной загрузки, хранения и свежести'
    topic: 'F3. State architecture'
    subtopic: 'F3.1 State classification'
