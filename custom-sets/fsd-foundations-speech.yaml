  - id: 'speech-fsd-f-f3-2-001'
    level: 'senior'
    question: 'Два виджета редактируют корзину, список и карточка копируют серверный статус заказа, а итоговая сумма предварительно считается клиентом. Где здесь single source of truth и какие копии допустимы?'
    answer: "Не буду назначать один источник сразу для всех данных приложения. Для ещё не оформленной локальной\nкорзины выберу одного клиентского владельца, который принимает команды обоих виджетов. Строки,\nзначок и предварительная сумма — представления этого выбора. Сервер остаётся владельцем\nподтверждённого заказа и его окончательной суммы, если это его договорённая ответственность.\n\nКопии серверного статуса в списке и карточке допустимы как кеши или представления. Нужно определить\nих происхождение, допустимую свежесть и реакцию на подтверждённое изменение. Последняя отрисованная\nкопия не обязательно новее. Наличие данных в глобальном store не даёт им права переопределять сервер.\n\nЕсли предварительная сумма расходится с подтверждением, интерфейс должен честно показать результат\nсервера и объяснить изменение в рамках продукта. Не стану строить симметричную синхронизацию между\nкаждым виджетом. Команды идут владельцу, представления получают результат. Это не исключает\nотдельных черновиков, если они явно названы черновиками и имеют переход применения. Принцип\nуменьшает число конфликтующих решений, а не требует физически хранить каждое значение ровно один раз.\n"
    points:
      - 'Владение отдельно для локального выбора и подтверждённого заказа'
      - 'Производные представления и кеши не равны независимым истинам'
      - 'Единый путь изменения одной сущности'
      - 'Статус предварительного и подтверждённого результата'
