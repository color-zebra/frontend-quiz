  - id: 'speech-fsd-f-f5-1-002'
    level: 'senior'
    question: 'Итоговый кейс: каталог с шарингом поиска и созданием заявки. Срок короткий, API готов, совместная работа отложена. Сравни локальное и общее управление состоянием, очерти MVP и покажи владельцев без привязки к библиотеке.'
    answer: "MVP проведёт пользователя от поиска доступного товара до понятного исхода создания заявки.\nОставлю обязательные проверки и вложения, если без них результат непригоден, а совместную работу\nисключу явно. Уточню бюджеты и допустимость локального черновика; короткий срок не отменяет\nограничений данных и доступа.\n\nРазделю представления, сценарий создания и адаптер готового API. Применённый несекретный поиск\nпредставлю в URL ради шаринга. Локальный черновик заявки принадлежит её редактору до отправки, подтверждённая\nзаявка — серверной модели. Счётчики и представления вычисляются из согласованных владельцев,\nа не живут как самостоятельные истины каждого экрана.\n\nЕсли один экран использует малые данные, локальное управление может быть достаточным и дешевле.\nЕсли общая сущность нужна нескольким представлениям и наблюдается цена согласования, выделю\nобщий слой модели и явные команды. Не перенесу туда автоматически подсказки и раскрытые панели.\nЦена общего слоя — новый контракт и миграция; цена локального — возможная координация при расширении.\nПроверю отказ сохранения и не буду выдавать локальный черновик за серверный успех. Условием\nпересмотра станут новые потребители или измеримое нарушение требований, а не популярность инструмента.\n"
    points:
      - 'MVP как законченный пользовательский путь'
      - 'Границы UI, сценария и доступа к API'
      - 'Разные владельцы URL, черновика и серверной заявки'
      - 'Сравнение локального и общего подходов по конкретной цене'
    topic: 'F5. Architecture decisions'
    subtopic: 'F5.1 Alternatives & trade-offs'
