  - id: 'speech-fsd-f-f3-4-001'
    level: 'senior'
    question: 'В кабинете фильтр должен переживать Back и обмен ссылкой, комментарий — refresh, а серверный профиль — оставаться подтверждённым до сохранения. Опиши жизненные циклы и проверь требования смены пользователя и устройства.'
    answer: "Применённый несекретный фильтр представлю в URL. Согласую, какие действия создают записи истории, а какие заменяют текущую; при Back/Forward восстановлю фильтр по адресу. Редактирование ещё не применённого фильтра может быть локальным и не обязано создавать шаг после каждой буквы.\n\nДля комментария refresh означает явную запись и восстановление, если хранение разрешено. Уточню, нужна ли сохранность в пределах вкладки, после её закрытия или на другом устройстве. Два независимо открытых окна могут иметь разные черновики: для области вкладки при доступном хранении подходит sessionStorage с записью и восстановлением; общий ключ localStorage не различает такие черновики. При уходе в другое приложение память может быть выгружена, поэтому не откладываю сохранение до закрытия. Межустройственная доступность требует источника вне одного браузера и соответствующего контракта.\n\nРедактируемый профиль держу как черновик отдельно от подтверждённых данных. Применение проходит через явное действие; переживший refresh ввод ещё не считается серверным успехом. При смене пользователя проверю владельца записи и политику очистки или разделения, чтобы не восстановить автоматически чужую работу. Для каждого состояния получатся собственные ответы о владельце, сроке жизни и доступности; выбранное хранилище не отменяет ошибок доступа и ограничений сохранности."
    points:
      - 'URL и история как договор применённого фильтра'
      - 'Refresh, закрытие и другое устройство — разные гарантии'
      - 'Черновик отдельно от подтверждённой модели'
      - 'Владелец и очистка при смене пользователя'
    topic: 'F3. State architecture'
