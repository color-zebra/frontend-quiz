  - id: 'speech-fsd-f-f4-3-001'
    level: 'senior'
    question: 'Для кабинета опиши поведение при пустом первом списке, отказе обновления старых данных, падении независимого блока и ошибке чтения деталей после подтверждённого создания заявки. Где нельзя использовать один общий экран ошибки?'
    answer: "Первый поиск до ответа находится в ожидании; успешный пустой результат означает отсутствие\nподходящих записей и может предложить изменить критерии. Сетевая ошибка не должна выдавать\nсообщение «ничего не найдено». Если старые данные разрешены продуктом, после отказа обновления\nсохраню их, обозначу актуальность и дам повторить запрос. В домене с запретом старых данных\nнужен другой исход, который следует согласовать отдельно.\n\nНезависимый второстепенный блок получит собственную границу отказа, если основной экран остаётся\nполезным без него. Не буду распространять его неуспех на профиль или весь кабинет только\nпотому, что всё нарисовано одним компонентом. Одновременно не буду показывать вымышленные данные\nкак успешный ответ.\n\nПосле подтверждённого создания сохраню ID и факт успеха. Падение чтения деталей требует повторить\nчтение, а не создавать заявку заново. При неизвестном исходе самой команды нужен иной путь\nвыяснения результата. Таким образом, общая визуальная оболочка ошибки может переиспользоваться,\nно решения о данных и следующих действиях определяются конкретным workflow. Сохранность ввода\nи честность статуса важнее одинакового текста для всех исключений.\n"
    points:
      - 'Loading, empty, stale и error различаются по знанию результата'
      - 'Независимая функция имеет подходящую границу отказа'
      - 'Известный успех команды не отменяется ошибкой последующего чтения'
      - 'Восстановление повторяет нужный шаг и сохраняет работу'
