title: 'Системный дизайн: реальное время и большие списки'
lessons:
  - id: sdl-intro
    topic: Введение
    subtopic: Большие и живые данные
    title: Когда данных много и они живые
    body: |
      ## Какую проблему решаем

      В двух первых курсах мы спроектировали сервис доставки еды: выяснили требования, разделили клиент на части,
      решили, кто владеет какими данными, и научили клиент жить в ненадёжной сети — с кэшем, повторами и конфликтами.
      Почти везде данные были небольшими и менялись тогда, когда человек сам что-то делал: открыл меню, добавил блюдо,
      нажал «Оформить».

      Теперь сервис вырос, и жалобы звучат иначе:

      - **оператор поддержки:** «Открываю таблицу всех заказов за месяц — браузер думает минуту, а потом вкладка
        падает»;
      - **менеджер сети пиццерий:** «Печатаю в поиске по меню, а буквы появляются с задержкой, как будто клавиатура
        залипла»;
      - **старший смены поддержки:** «Отметил „выбрать все“ опоздавшие заказы и назначил их одному оператору,
        а назначились только первые 50»;
      - **покупатель:** «Курьер на карте полторы минуты стоит на месте, а потом прыгает на километр вперёд»;
      - **повар:** «Утром на доске заказов висели вчерашние, а новый заказ мы пропустили — звука не было»;
      - **бэкенд-разработчик:** «Если экран отслеживания будет обновляться каждые пять секунд, сервер получит
        4000 запросов в секунду только на статусы».

      Это не ошибки в логике корзины или заказа. Здесь две новые трудности, о которых курс.

      ## Две новые трудности

      **Данных слишком много.** Их нельзя просто загрузить и нарисовать: миллион строк не пролезет по сети за разумное
      время, не поместится в память телефона, а 50 000 строк таблицы в документе страницы сделают каждое нажатие
      медленным. Нужно решать, что загружать, что держать, что рисовать и где считать.

      **Данные меняются сами.** Новый заказ появляется на доске ресторана без нажатия повара, курьер едет, собеседник
      пишет в чат. Клиенту нужно узнавать об изменениях от сервера, переживать обрывы связи, не применять одно событие
      дважды и не пропускать события, пока связи не было.

      Эти трудности часто встречаются вместе. Карта всех курьеров города — это и много данных (2000 точек), и живые
      данные (каждая точка меняется раз в пять секунд). Поэтому они в одном курсе.

      ## Что будет в курсе

      **Интерфейс на больших объёмах** — что делать, когда данных больше, чем помещается.
      - Когда данных слишком много: четыре разных предела — сеть, память, документ страницы и вычисления — и где
        фильтровать и считать: на сервере или в браузере.
      - Виртуализация: как показать 50 000 строк, держа в документе только видимые.
      - Тяжёлая работа без зависаний: как считать и рисовать много, не замораживая нажатия.
      - Выделение в больших списках: что значит «выбрать всё», когда загружено 50 строк из 1840.

      **Системы реального времени** — как узнавать об изменениях от сервера.
      - Как доставлять живые данные: опрос, длинный опрос, события от сервера (SSE) и WebSocket — и почему
        «реальное время» не всегда значит WebSocket.
      - Соединение: обрывы и возвраты — тоннель, сон телефона, перезапуск сервера.
      - События: дубли и порядок — что делать, если одно событие пришло дважды или не в том порядке.
      - Снимок и догоняющие события: как совместить загрузку списка и поток изменений и не потерять ни одного.
      - Чат и статусы присутствия: отправка до ответа сервера, «печатает», «прочитано».
      - Уведомления: внутри приложения, счётчик непрочитанного и push-уведомления, когда вкладка закрыта.

      Сначала идут большие объёмы, потом реальное время: урок о чате и статусах опирается на урок о тяжёлой работе —
      при сотнях событий в секунду экран обновляют пакетом раз в кадр.

      ## Как курс опирается на прошлые

      Здесь не будет заново объяснено то, что уже разобрано подробно. Если урок опирается на прошлый материал,
      он напоминает его одной-двумя фразами и называет урок.

      - Паузы между повторами, случайный разброс и лимит попыток — курс 2, «Когда и как повторять». Здесь — как
        переподключаться к серверу событий.
      - Ключ идемпотентности — курс 2, «Повторы без двойных списаний». Здесь — отправка сообщений в чат.
      - Push как способ держать кэш свежим — курс 2, «Когда данные устаревают». Здесь — как этот push доставить.
      - Оптимистичное изменение и временный идентификатор — курс 2, «Оптимистичные обновления». Здесь — сообщения
        в чате.
      - Пагинация по курсору — курс 2, «Пагинация живых списков». Здесь — списки, в которых десятки тысяч строк.
      - Номер версии и отказ от устаревшего ответа — курс 2, «Гонки запросов». Здесь — события, пришедшие не по порядку.

      Курс «Доставка и качество» для этого курса не обязателен. Там, где нужно его понятие — метрика отклика INP
      и Service Worker, — урок объяснит его сам в нужном объёме и сошлётся на подробности.

      ## Что нового в сервисе доставки

      Сквозной пример тот же. В этом курсе в нём появятся:

      - **кабинет поддержки** с таблицей всех заказов города за месяц — около 1,2 миллиона строк — с фильтрами
        и массовыми действиями;
      - **кабинет сети из 12 пиццерий:** история заказов за три месяца, около 50 000 строк, поиск по меню и график
        выручки;
      - **статус заказа без опроса:** в курсе 1 его опрашивали раз в 30 секунд, теперь его вместе с точкой курьера
        на карте присылает сервер;
      - **доска заказов в кабинете ресторана,** на которую новые заказы приходят сами и со звуком;
      - **чат** покупателя с курьером и поддержкой;
      - **уведомление «Курьер подъехал»,** даже если вкладка закрыта.

      ## Типичные ошибки

      - **Проверять на маленьких данных.** На ноутбуке разработчика в таблице 200 тестовых заказов, и всё летает.
        У поддержки их миллион, и всё падает.
      - **Лечить не тот предел.** Таблица тормозит, команда ускоряет запрос к серверу, а дело в том, что в документе
        страницы 50 000 строк.
      - **Считать, что «реальное время» — это всегда WebSocket.** Часто хватает событий от сервера или даже редкого
        опроса, а WebSocket тянет за собой больше работы на сервере.
      - **Думать только о счастливом пути.** Пока соединение есть и события приходят по одному, всё работает. Ломается
        при обрыве, повторе и перезапуске сервера.

      ## Как спрашивают на интервью

      - «Спроектируйте таблицу с миллионом строк, фильтрами и выбором строк» — разговор о том, что делать на сервере,
        а что в браузере, о виртуализации и о «выбрать всё».
      - «Спроектируйте ленту или чат с живыми обновлениями» — транспорт, обрывы, дубли, догоняющие события.
      - На собеседовании по плану RADIO эти темы появляются в шагах «модель данных» (Data model), «интерфейс»
        (Interface — API между клиентом и сервером) и «оптимизации» (Optimizations).

      ## Коротко

      - Курс о двух трудностях: данных бывает слишком много, чтобы просто загрузить и нарисовать их, и они меняются
        сами, без действий человека.
      - Первая часть — о больших объёмах: что упирается в сеть, память, документ страницы или вычисления, и чем лечить
        каждый из этих пределов.
      - Вторая часть — о реальном времени: как сервер сообщает об изменениях, как пережить обрыв и не применить одно
        событие дважды.
      - Курс опирается на курсы 1 и 2 и напоминает их одной-двумя фразами; курс «Доставка и качество» для него
        не обязателен.

      ## Источники

      - [Virtualize large lists with react-window — web.dev](https://web.dev/articles/virtualize-long-lists-react-window)
      - [Использование событий, отправленных сервером — MDN](https://developer.mozilla.org/ru/docs/Web/API/Server-sent_events/Using_server-sent_events)

  - id: sdl-datasets
    topic: Интерфейс на больших объёмах
    subtopic: Большие наборы данных и их разбиение
    title: Когда данных слишком много
    body: |
      ## Какую проблему решаем

      Поддержке сервиса доставки нужна таблица всех заказов города: найти опоздавшие, посмотреть заказы одного
      ресторана, разобраться с жалобой. За месяц в городе около 1,2 миллиона заказов.

      Первая версия таблицы сделана так же, как список ресторанов в курсе 1: клиент запрашивает все заказы за месяц,
      кладёт их в состояние и рисует. На тестовом стенде с 200 заказами всё работало. У поддержки вкладка думала
      минуту и падала: браузеру не хватило памяти.

      Команда сделала вторую версию: «загружаем не месяц, а неделю — около 280 000 заказов». Вкладка перестала падать,
      но каждая смена сортировки замораживает её на две секунды, а прокрутка дёргается. Потом третью: «неделя, но
      рисуем только 5000 строк». Прокрутка стала плавной, но открывается таблица всё ещё 40 секунд.

      Каждый раз команда лечила одну беду и натыкалась на следующую. Дело в том, что у больших данных не один предел,
      а четыре, и каждый лечится своим способом.

      ## Четыре предела

      **Сеть: сколько можно передать.** Заказ со всеми полями — около 1 КБ в JSON, значит, месяц заказов — больше
      гигабайта. Сжатие уменьшит его в несколько раз, но и сотни мегабайт по мобильной сети идут минутами. Этот предел
      виден во вкладке Network инструментов разработчика: долгий запрос с огромным ответом.

      **Память: сколько можно держать.** Пришедший JSON браузер разбирает в объекты JavaScript, а они занимают
      в памяти сопоставимо с текстом или больше: у каждого объекта и строки есть служебные поля. Память вкладки
      ограничена, и на телефоне сильнее, чем на компьютере. Когда её не хватает, браузер закрывает вкладку. Этот
      предел виден во вкладке Memory: снимок кучи (heap — область памяти с объектами JavaScript) показывает, сколько
      весят данные, а размер кучи растёт и не падает.

      **Документ страницы: сколько можно нарисовать.** Каждая строка таблицы — это десяток узлов DOM (DOM — дерево
      элементов страницы): строка, восемь ячеек, кнопка. 280 000 строк — миллионы узлов. web.dev пишет, что Lighthouse
      начинает предупреждать уже после 800 узлов и считает размер чрезмерным после 1400. Большой документ медленно
      строится и медленно обновляется: любое изменение, которое меняет вёрстку, заставляет браузер пересчитывать
      стили и раскладку для множества узлов. Этот предел виден во вкладке Performance: долгие отрезки Recalculate
      Style и Layout.

      **Вычисления: сколько можно посчитать.** Отсортировать, отфильтровать, сгруппировать сотни тысяч строк — это
      работа JavaScript в **основном потоке** (main thread), том же, который обрабатывает нажатия и рисует страницу.
      Пока идёт сортировка, страница не отвечает. Этот предел тоже виден в Performance: долгие отрезки Scripting.

      Обычно упирается что-то одно, и лечение у каждого своё:

      - **сеть** — не передавать лишнего: фильтровать и считать на сервере, отдавать страницами и только нужные поля;
      - **память** — не держать лишнего: хранить окно из нескольких страниц и выбрасывать давно не нужное;
      - **документ** — не рисовать лишнего: показывать страницами или держать в DOM только видимые строки
        (это виртуализация, следующий урок);
      - **вычисления** — не считать лишнего или считать в другом месте: на сервере, в фоновом потоке, по частям
        (урок «Тяжёлая работа без зависаний»).

      Виртуализация не спасёт, если вкладка падает от памяти, а фильтр на сервере не поможет, если тормозит перерисовка
      трёх тысяч строк, уже лежащих в браузере. Поэтому сначала находят, какой предел упёрся, и только потом выбирают
      лекарство.

      ## Где фильтровать, сортировать и считать

      Главное архитектурное решение для большого списка — где живут фильтр, сортировка и итоги: в браузере или
      на сервере.

      **В браузере** — когда все нужные данные уже здесь и их немного: сотни, иногда несколько тысяч строк. Тогда
      фильтр и сортировка срабатывают мгновенно, без запроса и без индикатора загрузки, и работают даже без сети.
      Меню ресторана на 300 блюд фильтруют в браузере: загрузить его целиком дёшево, а ждать сервер на каждую букву
      поиска — нет.

      **На сервере** — когда данных так много, что их нельзя или незачем передавать целиком. Сервер фильтрует
      и сортирует по индексам базы данных и отдаёт одну страницу результата. Таблицу заказов за месяц — 1,2 миллиона
      строк — сортируют только на сервере.

      Где граница? Точного числа нет: она зависит от размера строки, устройства и того, как часто данные меняются.
      Решают по трём вопросам.

      1. **Сколько данных и все ли они уже на клиенте?** Если клиенту всё равно нужен весь набор, например чтобы
         показать его целиком, считать на месте дешевле. Если на клиенте только страница из тысяч, считать в браузере
         нечего.
      2. **Как часто данные меняются?** Справочник ресторанов меняется редко, его можно загрузить и фильтровать
         на месте. Заказы меняются каждую секунду, и копия в браузере быстро устаревает.
      3. **Что видит человек?** Если на экране итог «опоздало 1840 заказов» или «самые дорогие заказы за месяц», он
         должен быть посчитан по всем данным, а не по загруженной части.

      ### Если страницы отдаёт сервер, сортирует тоже он

      Самая частая ошибка — смешать два мира. Таблица загружает с сервера первые 50 заказов, а сортировку по сумме
      делает в браузере, потому что «так быстрее». Человек нажимает «по сумме, по убыванию» и видит самые дорогие
      заказы среди первых 50 загруженных, а не самые дорогие за месяц. Ошибки не видно, данные выглядят правдоподобно.

      Правило: если набор разбит на страницы на сервере, фильтр, сортировка и итоги тоже считаются на сервере.
      Сортировать в браузере можно только то, что загружено целиком.

      ### Итоги и графики

      Итоги («всего 1840 заказов, средняя задержка 22 минуты»), группировки и графики по большому набору считает
      сервер: он отдаёт уже посчитанные числа, а не строки для подсчёта. Это называют **агрегацией на сервере**
      (server-side aggregation). Для графика выручки за три месяца клиенту нужны 90 точек по дням, а не 50 000
      заказов.

      Точное число строк по сложному фильтру базе бывает дорого посчитать. Многие интерфейсы показывают точное
      число до какого-то порога и «больше 10 000» сверх него. Это честно: человеку, который смотрит на 40 000 строк,
      точная цифра редко нужна.

      ## Частичная загрузка

      Раз весь набор не передать, клиент загружает его частями — страницами. Курс 2 в уроке «Пагинация живых списков»
      разобрал, почему для меняющегося списка лучше курсор, чем номер страницы: новые заказы появляются каждую секунду,
      и номера страниц поплывут. Здесь добавляется ещё два решения.

      **Только нужные поля.** Строке таблицы нужно восемь полей: номер, время, ресторан, статус, сумма, опоздание,
      курьер, оператор. Остальное — адрес, состав заказа, история статусов — нужно только в карточке заказа, которую
      открывают по нажатию. Если список отдаёт урезанные строки (около 300 байт вместо килобайта), страница из 50 строк
      весит около 15 КБ. Цена — второй запрос при открытии карточки. Обычно её платят охотно: карточку открывают
      для немногих строк.

      **Только нужное окно.** Оператор прокрутил таблицу на 200 страниц вниз. Держать все 10 000 строк в памяти
      незачем: вернуться к первой странице он может, но редко. Поэтому клиент хранит окно — например, последние
      20 страниц, — а страницы за его пределами выбрасывает. Если человек вернётся, их загрузят заново. В TanStack
      Query для бесконечных списков для этого есть опция `maxPages`: кэш хранит не больше заданного числа страниц,
      а выброшенные перезапрашивает, когда к ним вернутся. Документация показывает её вместе с загрузкой в обе стороны:
      выброшенные сверху страницы нужно уметь загрузить снова, поэтому нужен курсор и на предыдущую страницу. Цена — повторный запрос при возврате и забота о позиции
      прокрутки, когда строки сверху исчезают.

      ## Выбрасывание из памяти

      Выбрасывать нужно не только страницы одного списка. За смену оператор поддержки открывает сотню разных фильтров:
      заказы ресторана, заказы курьера, опоздавшие за вчера. Каждый — отдельная запись кэша, и если их не удалять,
      вкладка за восемь часов съедает всю память.

      Клиентский кэш решает это **сроком хранения** (курс 2, «Как устроен клиентский кэш»): запись, которую никто
      на экране не использует, удаляется через заданное время. В TanStack Query это `gcTime`, по умолчанию пять
      минут. Такое удаление называют **вытеснением из кэша** (cache eviction). Для большого кабинета, открытого весь
      день, полезно проверить, что срок хранения конечный и что в памяти не остаются ссылки на старые данные
      из других мест: из глобального хранилища, замыканий, подписок.

      ## Пример целиком: таблица заказов в кабинете поддержки

      **Что известно.** 1,2 миллиона заказов за месяц, тысячи новых каждый час. 30 операторов работают с таблицей
      весь день на обычных ноутбуках. Им нужны фильтры по дате, статусу, ресторану и опозданию, сортировка по любой
      колонке, итоги по фильтру и выгрузка в файл.

      **Решение.**

      1. **Фильтр, сортировка и итоги — на сервере.** Запрос
         `GET /support/orders?date=2026-10-20&lateMin=15&sort=-total&limit=50` возвращает первую страницу, курсор
         следующей и итоги: «1840 заказов, средняя задержка 22 минуты». Фильтр и сортировка лежат в адресе
         страницы (курс 1, «Что переживает перезагрузку»), чтобы ссылкой можно было поделиться с коллегой.
      2. **В строке — только восемь полей таблицы.** Страница из 50 строк весит около 15 КБ. Карточка заказа
         загружается отдельно, когда оператор её открывает.
      3. **В памяти — окно из 20 страниц,** то есть до 1000 строк. Ушедшие страницы выбрасываются и загружаются
         снова, если к ним вернуться.
      4. **В документе — только видимые строки.** Даже тысяча строк по десятку узлов — это 10 000 узлов, поэтому
         таблица рисует только то, что на экране. Как это устроено, — в уроке «Виртуализация».
      5. **Выгрузку в файл делает сервер.** Человек нажимает «Выгрузить» — сервер готовит файл по тому же фильтру
         и присылает ссылку, когда закончит. Собирать в браузере файл на 40 000 строк значит сначала загрузить их все.
      6. **Список ресторанов в фильтре — в браузере.** Ресторанов 3000, их названия весят около 100 КБ и меняются
         редко. Список загружается один раз, а поиск по нему идёт на месте, без запроса на каждую букву.

      **Как это выглядит.** Оператор открывает «вчера, опоздание больше 15 минут». Через 300 миллисекунд видит первые
      50 строк и итог «1840 заказов». Сортирует по сумме — уходит новый запрос, и самые дорогие опоздавшие заказы
      за весь вчерашний день наверху. В фильтре ресторана печатает «пиц» — 40 пиццерий находятся мгновенно, без
      сети.

      ## Варианты и их цена

      - **Всё в браузере**
        - Подходит: сотни или немногие тысячи строк, меняются редко.
        - Плюсы: мгновенный отклик, работает без сети.
        - Цена: весь набор нужно загрузить и держать; копия устаревает.
      - **Сервер фильтрует, сортирует и отдаёт страницы**
        - Подходит: десятки тысяч строк и больше, данные часто меняются.
        - Плюсы: объём не ограничен, итоги точные.
        - Цена: запрос на каждую смену фильтра и сортировки, задержка сети.
      - **Сервер сужает, браузер досчитывает**
        - Подходит: фильтр сервера оставляет немного строк, клиент загружает их целиком, а человек много сортирует.
        - Плюсы: сортировки внутри небольшого результата мгновенные.
        - Цена: два режима работы и порог, при котором один сменяется другим.
      - **Готовые итоги с сервера**
        - Подходит: графики, суммы, группировки.
        - Плюсы: клиент получает десятки точек вместо тысяч строк.
        - Цена: на сервере нужен отдельный запрос или заранее посчитанная таблица.

      ## Типичные ошибки

      - **Сортировать в браузере страницу, загруженную с сервера.** Человек видит «самые дорогие» среди 50 загруженных
        строк и принимает решения по неверным данным.
      - **Считать итог по загруженным строкам.** «Всего 50 заказов», хотя под фильтр подходит 1840.
      - **Тянуть в список все поля.** Список тяжелеет в три-четыре раза ради данных, которые увидят в одной строке
        из сотни.
      - **Никогда ничего не выбрасывать.** Кабинет, открытый весь день, медленно съедает память и к вечеру падает.
      - **Лечить не тот предел.** Включить виртуализацию, когда вкладка падает от памяти, или ускорять сервер, когда
        тормозит перерисовка. Сначала смотрят инструменты разработчика.
      - **Унести на сервер то, что дешевле посчитать на месте.** Поиск по 300 блюдам меню запросом на каждую букву —
        лишняя задержка и нагрузка.

      ## Как спрашивают на интервью

      - «Спроектируйте таблицу с миллионом строк, фильтрами и сортировкой» — ждут, что фильтр, сортировка и итоги
        уйдут на сервер, список придёт страницами с нужными полями, а в документе будут только видимые строки.
      - «Где сортировать — на клиенте или на сервере?» — ждут критериев: объём, все ли данные на клиенте, частота
        изменений, нужен ли результат по всему набору.
      - «Страница тормозит на большом списке. Что будете делать?» — ждут, что сначала найдут предел: сеть, память,
        документ или вычисления.

      ## Коротко

      - У больших данных четыре предела — сеть, память, документ страницы и вычисления; упирается обычно один,
        и у каждого своё лечение, поэтому сначала его находят в инструментах разработчика.
      - Сотни строк, которые уже загружены целиком и редко меняются, фильтруют и сортируют в браузере: это мгновенно
        и не требует сети.
      - Десятки тысяч строк и больше фильтрует, сортирует и отдаёт страницами сервер.
      - Если страницы отдаёт сервер, сортировка, фильтр и итоги тоже на сервере: сортировка загруженной страницы
        в браузере даёт правдоподобный, но неверный результат.
      - Итоги и графики по большому набору считает сервер и отдаёт готовые числа, а не строки для подсчёта.
      - Список отдаёт только поля строки, а подробности грузятся при открытии записи.
      - Клиент хранит окно из нескольких страниц и выбрасывает остальное, а записи кэша без пользы удаляет по сроку
        хранения: иначе кабинет, открытый весь день, съедает память.

      ## Источники

      - [DOM size and interactivity — web.dev](https://web.dev/articles/dom-size-and-interactivity)
      - [Infinite Queries: limit the number of pages — TanStack Query](https://tanstack.com/query/latest/docs/framework/react/guides/infinite-queries#what-if-i-want-to-limit-the-number-of-pages)

  - id: sdl-virtualization
    topic: Интерфейс на больших объёмах
    subtopic: Виртуализация
    title: Виртуализация
    body: |
      ## Какую проблему решаем

      В кабинете сети из 12 пиццерий есть история заказов за три месяца — около 50 000 строк. Менеджер прокручивает
      её, ищет странные заказы, открывает карточки. Данные приходят с сервера страницами, как решили в прошлом уроке,
      но за полчаса работы менеджер прокручивает несколько тысяч строк, и все они остаются на странице.

      Каждая строка — около десятка узлов DOM. Пять тысяч строк — пятьдесят тысяч узлов. Прокрутка начинает дёргаться,
      а нажатие на фильтр отзывается через полсекунды: любое изменение заставляет браузер пересчитывать стили
      и раскладку огромного документа. Это предел документа страницы из прошлого урока.

      На экране при этом помещается строк двадцать. Остальные тысячи браузер держит и пересчитывает зря.

      ## Что такое виртуализация

      **Виртуализация** (virtualization, или windowing — «окно») — приём, при котором в документе есть только строки,
      видимые сейчас, и немного соседних. Когда человек прокручивает список, ушедшие строки удаляются из DOM,
      а появившиеся добавляются. Полоса прокрутки при этом ведёт себя так, будто в списке все 50 000 строк.

      Как это устроено:

      - **контейнер прокрутки** — элемент с фиксированной высотой и `overflow: auto`, внутри которого человек
        прокручивает список;
      - **внутренний элемент полной высоты** — пустой блок высотой «число строк × высота строки», например
        50 000 × 40 px = 2 000 000 px. Он нужен, чтобы полоса прокрутки была правильной длины;
      - **окно видимых строк** — по текущей прокрутке библиотека вычисляет, какие строки сейчас на экране,
        и рисует только их, сдвигая на нужное место (через `transform` или абсолютное позиционирование);
      - **запас** (overscan) — несколько строк сверху и снизу за краем экрана. Без запаса при быстрой прокрутке
        на мгновение мелькает пустота: новые строки ещё не нарисованы. С запасом они готовы заранее.

      ![Слева — весь список из 50 000 строк высотой 2 000 000 пикселей, в нём выделено окно экрана на строках 1201–1220. Справа — что лежит в документе: три строки запаса сверху, двадцать видимых строк, три строки запаса снизу, а выше и ниже — пустое место, которое занимает внутренний элемент полной высоты](images/sdl-virtualization.png "В документе — только видимые строки и запас")

      Получается, что в документе всегда 20–30 строк, сколько бы их ни было в списке. Прокрутка плавная, а нажатия
      быстрые, потому что документ маленький.

      Виртуализацию редко пишут сами. Популярные библиотеки — TanStack Virtual (без готовой вёрстки, только расчёт
      окна) и react-window. Запас в TanStack Virtual задаётся опцией `overscan`, по умолчанию это одна строка; для
      быстрой прокрутки её обычно увеличивают до нескольких.

      ## Когда виртуализация нужна, а когда нет

      Виртуализация не бесплатна: она ломает часть привычного поведения страницы (об этом ниже). Поэтому сначала
      проверяют, нельзя ли обойтись проще.

      - **Список небольшой и редко меняется.** Меню ресторана — до 300 блюд. Это несколько тысяч узлов: больше,
        чем советует Lighthouse, но меню рисуется один раз, почти не меняется, и нажатия в нём не тормозят. Замер
        на телефоне среднего уровня это подтверждает. Зато у меню есть требования, которые виртуализация сломала бы:
        страницу ресторана находят поисковики (курс «Доставка и качество», урок «Где собирать страницу»), и все блюда
        должны быть в HTML, а покупатель ищет блюдо поиском по странице браузера. Меню виртуализировать не нужно.
      - **Человеку удобнее страницы.** Если задача — найти и обработать несколько строк, номера страниц или кнопка
        «Показать ещё» с понятным концом (курс 2, «Пагинация живых списков») часто лучше бесконечной ленты:
        в документе одна страница, а человек знает, где он.
      - **Ускорить отрисовку невидимого, но оставить его в документе.** CSS-свойство `content-visibility: auto`
        говорит браузеру не рисовать блоки за пределами экрана, пока к ним не прокрутили. Элементы остаются в DOM,
        поэтому их находит поиск по странице и видит экранный чтец. web.dev приводит пример, где начальная
        отрисовка ускорилась с 232 до 30 мс. Чтобы невидимый блок не схлопнулся до нулевой высоты, ему задают
        примерный размер свойством `contain-intrinsic-size`. Узлы при этом никуда не деваются: память и работа
        с самими узлами остаются, поэтому для десятков тысяч строк этого мало.
      - **Тысячи строк, которые человек прокручивает подряд,** — история заказов, лента почты, журнал событий.
        Здесь виртуализация нужна.

      Решают по замеру: если прокрутка и нажатия в длинном списке укладываются в бюджет на телефоне среднего уровня,
      виртуализация не нужна, сколько бы предупреждений ни показывал Lighthouse.

      ## Строки разной высоты

      Проще всего, когда все строки одной высоты: тогда положение строки 1201 — это 1200 × 40 px, и считать нечего.
      Но в истории заказов есть строки с комментарием покупателя в две-три строки текста, а в почте письма
      с вложениями выше остальных.

      Тогда библиотека работает с **оценкой**: сначала считает каждую строку примерной высоты, а когда строка
      нарисована, измеряет настоящую и пересчитывает положения. В TanStack Virtual оценку даёт функция
      `estimateSize`, а измерение — `measureElement`. Документация советует брать оценку ближе к наибольшей
      возможной высоте.

      Цена — **прыжки прокрутки.** Если человек прокручивает вверх, а строки над ним оказались выше оценки,
      содержимое сдвигается под пальцем. Библиотеки умеют поправлять позицию прокрутки, когда строка выше экрана
      оказалась другой высоты, но полностью рывки это не убирает, особенно при прокрутке вверх: чем дальше оценка
      от правды, тем они заметнее. Чем более похожи строки по высоте, тем спокойнее список: например, длинный
      комментарий можно обрезать до двух строк с «Ещё».

      ## Восстановление прокрутки

      Менеджер прокрутил историю до строки 1200, открыл карточку заказа и нажал «Назад». Обычный список браузер
      вернул бы на место сам (курс 2, «Пагинация живых списков»). Виртуальный — нет: в момент возврата в документе
      ещё нет ни строк, ни внутреннего элемента полной высоты, и прокручивать браузеру некуда.

      Поэтому позицию восстанавливают сами:
      - перед уходом сохраняют, какая строка была первой видимой, лучше по её id, а не по смещению в пикселях;
      - при возврате прокручивают к этой строке: в TanStack Virtual — `scrollToIndex`. Если высоты строк разные,
        можно сохранить и уже измеренные высоты, чтобы позиция совпала точно. Документация описывает это как
        `initialMeasurementsCache` вместе с `initialOffset`, а для данных, которые изменились, советует
        `scrollToIndex`.

      Почему по id, а не по номеру: пока человек смотрел карточку, в начало истории могли добавиться новые заказы.
      Номер 1200 тогда укажет на другой заказ. По той же причине ключ строки — её id: по умолчанию TanStack Virtual
      использует номер строки, и документация советует заменить его на уникальный id через `getItemKey`.

      ## Поиск по странице

      Ctrl+F ищет только в документе. Строки, которых сейчас нет в DOM, браузер не найдёт: менеджер ищет заказ
      «М-48213», а поиск говорит «не найдено», хотя заказ есть в истории ниже.

      Что с этим делают:
      - дают свой поиск или фильтр над списком, который ищет по всем данным — на клиенте или на сервере;
      - если нужен именно поиск браузера, выбирают не виртуализацию, а `content-visibility: auto` или страницы.

      ## Доступность

      Виртуальный список ломает две вещи, на которые опирается экранный чтец.

      **Сколько всего строк.** Чтец считает строки в документе и скажет «таблица, 26 строк» вместо 50 000. Таблице
      сообщают настоящий размер атрибутом `aria-rowcount="50000"`, а каждой строке — её номер в полном наборе
      атрибутом `aria-rowindex="1201"`. Если общее число неизвестно, MDN советует `aria-rowcount="-1"`. Для
      обычного списка или ленты то же делают `aria-setsize` и `aria-posinset`.

      **Фокус.** Человек с клавиатуры встал на строку и прокрутил список колёсиком. Строка ушла за край, библиотека
      удалила её из DOM — и фокус пропал вместе с ней, улетев в начало страницы. Поэтому строку, на которой стоит
      фокус, держат в документе, даже когда она не видна. В TanStack Virtual для этого есть опция `rangeExtractor`:
      она позволяет добавить к окну нужные строки. Кроме того, перемещение стрелками по строкам делают так, чтобы
      новая строка сначала прокручивалась в окно, а потом получала фокус.

      ## Где виртуализация начинает мешать

      Сложная таблица с редактированием — самый трудный случай.

      - **Ячейка в режиме правки.** Человек правит сумму в строке, прокручивает таблицу, строка уходит из DOM вместе
        с полем ввода и недописанным значением. Состояние правки нужно хранить вне строки, в состоянии таблицы,
        или не давать строке исчезнуть, пока правка не закончена.
      - **Ширина колонок.** Если колонки подстраиваются под содержимое, ширина считается только по видимым строкам
        и меняется при прокрутке: таблица «пляшет». Ширину задают заранее.
      - **Переход Tab к следующей ячейке.** Следующей строки может не быть в DOM, и браузер перескочит
        на кнопку под таблицей. Переходы делают сами: сначала прокрутить, потом поставить фокус.
      - **Закреплённые колонки и строки,** печать и копирование выделенного диапазона тоже требуют отдельной работы.

      Если таблице нужно почти всё это сразу, проще и надёжнее бывает уменьшить объём на экране: страницы по 50–100
      строк с серверной сортировкой, а виртуализацию оставить спискам для чтения.

      ## Пример целиком: история заказов сети

      **Что известно.** 50 000 строк за три месяца, сервер отдаёт страницы по 50 строк и знает общее число.
      Строки в основном одной высоты, у некоторых комментарий. Менеджеры открывают карточки и возвращаются назад,
      ищут по номеру заказа, работают в основном мышью, но таблица должна быть доступна с клавиатуры.

      **Решение.**

      1. **Виртуализация с известным числом строк.** Сервер вернул «всего 50 000», поэтому внутренний элемент сразу
         нужной высоты, и полосу прокрутки можно потянуть в середину. Строки, которые ещё не загружены, показываются
         заглушками, а их страница запрашивается, как только заглушка попадает в окно.
      2. **Запас — пять строк** сверху и снизу: при быстрой прокрутке пустоты не видно.
      3. **Высота строки — 40 px,** комментарий обрезается до одной строки с «Ещё». Оценка почти всегда совпадает
         с правдой, прыжков нет.
      4. **Ключ строки — номер заказа,** позиция при уходе сохраняется по номеру первой видимой строки
         и восстанавливается через `scrollToIndex`.
      5. **Поиск по номеру заказа — свой,** над таблицей, запросом к серверу. Ctrl+F таблица не обещает.
      6. **Доступность:** `aria-rowcount="50000"`, `aria-rowindex` у строк, строка с фокусом остаётся в документе,
         стрелки сначала прокручивают, потом переводят фокус.
      7. **В памяти — окно страниц** из прошлого урока: далёкие страницы выбрасываются и загружаются снова, когда
         к ним возвращаются.

      Меню ресторана при этом остаётся обычным списком: 300 блюд, все в HTML, поиск по странице работает.

      ## Варианты и их цена

      - **Обычный список целиком**
        - Подходит: сотни строк, которые редко меняются.
        - Цена: на больших объёмах — тяжёлый документ.
      - **Страницы или «Показать ещё»**
        - Подходит: найти и обработать несколько строк.
        - Цена: человек не прокручивает всё подряд, переход между страницами.
      - **`content-visibility: auto`**
        - Подходит: длинная страница, где важны поиск по странице и доступность.
        - Цена: узлы остаются в документе и в памяти; для десятков тысяч строк мало.
      - **Виртуализация**
        - Подходит: тысячи строк, которые прокручивают подряд.
        - Цена: свой поиск, восстановление прокрутки, работа над фокусом и доступностью, сложности с правкой ячеек.

      ## Типичные ошибки

      - **Виртуализировать всё подряд.** Список из 300 строк теряет поиск по странице и HTML для поисковиков,
        а скорость не выигрывает.
      - **Нулевой запас.** При быстрой прокрутке мелькают пустые места.
      - **Номер строки вместо id в ключе.** После добавления строк в начало React путает строки: поле правки или
        раскрытая карточка «переезжают» на чужую запись.
      - **Восстанавливать позицию по пикселям.** Высоты строк ещё не измерены или над строкой добавились новые —
        человек возвращается не туда.
      - **Забыть о фокусе.** Строка с фокусом исчезает из DOM, и человек с клавиатуры оказывается в начале страницы.
      - **Обещать Ctrl+F.** В виртуальном списке поиск браузера находит только видимое.

      ## Как спрашивают на интервью

      - «В ленте десятки тысяч элементов, прокрутка тормозит. Что будете делать?» — ждут виртуализацию с запасом,
        ключами по id и пониманием, что она ломает.
      - «Когда виртуализация не нужна?» — ждут замер, страницы, `content-visibility` и требования вроде поиска
        по странице или HTML для поисковиков.
      - «Как сделать виртуальный список доступным?» — ждут `aria-rowcount` и `aria-rowindex` или `aria-setsize`
        и `aria-posinset`, и строку с фокусом, которая не исчезает.

      ## Коротко

      - Виртуализация держит в документе только видимые строки и небольшой запас (overscan), а внутренний элемент
        полной высоты сохраняет правильную полосу прокрутки; поэтому документ маленький при любом размере списка.
      - Она нужна, когда тысячи строк прокручивают подряд; для сотен редко меняющихся строк, страниц или
        `content-visibility: auto` её цена обычно не окупается — решают по замеру.
      - При строках разной высоты библиотека работает с оценкой и измерением; чем ближе оценка к правде, тем меньше
        прыжков прокрутки.
      - Позицию при возврате восстанавливают сами, по id первой видимой строки, а ключом строки делают её id,
        а не номер.
      - Поиск по странице браузера видит только то, что в документе, поэтому виртуальному списку нужен свой поиск.
      - Для доступности таблице сообщают настоящее число строк и номер каждой (`aria-rowcount`, `aria-rowindex`),
        а строку с фокусом не удаляют из документа.
      - В таблице с правкой ячеек виртуализация мешает — пропадают поля ввода, пляшут колонки, ломается Tab, —
        и там часто проще показывать страницы.

      ## Источники

      - [Virtualize large lists with react-window — web.dev](https://web.dev/articles/virtualize-long-lists-react-window)
      - [Virtualizer API — TanStack Virtual](https://tanstack.com/virtual/latest/docs/api/virtualizer)
      - [content-visibility: the new CSS property that boosts your rendering performance — web.dev](https://web.dev/articles/content-visibility)

  - id: sdl-scheduling
    topic: Интерфейс на больших объёмах
    subtopic: Планирование тяжёлой работы
    title: Тяжёлая работа без зависаний
    body: |
      ## Какую проблему решаем

      В кабинете сети из 12 пиццерий есть поиск по меню всей сети — 3600 позиций. Менеджер печатает «пеп», чтобы
      найти все пепперони и поменять цену. Буквы появляются в поле с задержкой: напечатал три, а видит одну, потом
      сразу три. Как будто клавиатура залипла.

      На той же странице график выручки по дням за три месяца: 12 линий, по одной на пиццерию. Когда менеджер ведёт
      мышью по графику, подсказка с суммой отстаёт от курсора и дёргается.

      А когда ресторан загружает новый прайс-лист из файла, вкладка на две секунды перестаёт отвечать совсем.

      Данных при этом немного, и все они уже в браузере: меню, точки графика, файл прайс-листа. Проблема в том,
      сколько работы браузер делает в ответ на каждое действие человека — и когда.

      ## Почему долгая работа портит отклик

      У страницы один **основной поток** (main thread). На нём выполняется ваш JavaScript, обрабатываются нажатия
      и клавиши, пересчитываются стили и раскладка и рисуется кадр. Всё по очереди: пока выполняется одно, остальное
      ждёт.

      **Долгая задача** (long task) — работа, которая занимает основной поток дольше 50 миллисекунд без перерыва.
      Если человек нажал клавишу посреди такой задачи, нажатие ждёт её конца, и только потом браузер его обработает
      и нарисует букву.

      Как быстро страница отвечает на действия, измеряет метрика **INP** (Interaction to Next Paint, «от взаимодействия
      до следующей отрисовки»): сколько проходит от нажатия, касания или клавиши до кадра, в котором видна реакция.
      Она смотрит на все действия человека на странице и берёт одно из самых медленных. Хорошим считается INP
      до 200 мс, плохим — больше 500 мс. Задержка складывается из трёх частей: ожидание, пока поток освободится,
      работа ваших обработчиков и отрисовка нового кадра. Подробно о метрике — в курсе «Доставка и качество»,
      в уроке «Как измерить скорость».

      Отсюда главное: чтобы страница отвечала быстро, основной поток не должен быть занят долго. Это можно сделать
      четырьмя способами.

      ## Четыре способа

      ### Сделать меньше работы

      Самый сильный способ — не делать лишнего. Поиск по меню находит 400 позиций с «пеп», и страница рисует все 400
      карточек с фото. На экране помещается восемь. Если рисовать первые 50 и кнопку «Показать ещё 350» или
      виртуализировать список (прошлый урок), работы станет в разы меньше.

      Другие формы того же: не пересчитывать то, что не изменилось (мемоизация — `useMemo`, `React.memo`), не рисовать
      график точнее, чем позволяет экран, не перерисовывать весь график ради подсказки, не обновлять весь список,
      когда изменилась одна строка.

      ### Разбить на части и уступать браузеру

      Если работу нельзя сократить, её делят на куски короче 50 мс, и между кусками основной поток **уступают
      браузеру** (yield to the main thread): он успевает обработать нажатия и нарисовать кадр, а потом работа
      продолжается.

      ```js
      for (const chunk of chunks) {
        process(chunk);
        await scheduler.yield(); // дать браузеру обработать ввод и нарисовать кадр
      }
      ```

      `scheduler.yield()` ставит продолжение вашей работы в очередь раньше других обычных задач, поэтому она
      не застревает за чужими скриптами. По данным web.dev, на момент написания он есть в Chrome и Edge с версии 129
      и в Firefox с 142, а в Safari его нет, поэтому нужен запасной вариант: `await new Promise((r) => setTimeout(r, 0))`.
      Он тоже уступает поток, но продолжение встаёт в конец очереди. web.dev советует уступать не после каждой
      мелочи, а когда с прошлой уступки прошло около 50 мс: каждая уступка тоже стоит времени.

      Цена: вся работа занимает чуть дольше, и пока она идёт, данные на экране промежуточные. Нужно показать прогресс
      и решить, что будет, если человек тем временем снова что-то нажал.

      ### Унести в фоновый поток

      **Web Worker** — скрипт, который работает в отдельном потоке, параллельно основному. Он может считать сколько
      угодно, и страница не замрёт. Основной поток и воркер обмениваются сообщениями (`postMessage`).

      Ограничения:
      - у воркера нет доступа к DOM: он считает, но не рисует;
      - данные в сообщении копируются, и копирование большого объёма тоже занимает время. Некоторые объекты, например
        `ArrayBuffer`, можно передать без копирования — их называют передаваемыми (transferable);
      - код нужно разделить: что считается в воркере, что рисуется на странице.

      Воркер хорош для чистых вычислений над данными: разбор файла, поиск по большому индексу, обработка картинки.

      ### Перенести на сервер

      Если вычисление требует данных, которых нет в браузере, или слишком тяжело для телефона, его делает сервер
      и отдаёт результат. Агрегацию графиков по миллионам строк мы так и решили в уроке «Когда данных слишком много».
      Цена — сеть: результат придёт не мгновенно и не без связи.

      ## Как часто и что первым: это разные задачи

      Есть два приёма, которые часто путают с перечисленными.

      **Debounce и throttle** отвечают на вопрос **как часто** запускать работу.
      - **Debounce** («подавление дребезга») — выполнить работу, когда событий не было заданное время. Человек печатает
        «пепперони», и поиск запускается один раз, через 300 мс после последней буквы. Подробно — курс 2, урок «Лишние
        и одинаковые запросы».
      - **Throttle** («дросселирование») — выполнять не чаще заданного интервала, пока события идут. Движение мыши
        по графику даёт сотни событий в секунду, а подсказку перерисовывают не чаще раза в кадр. Для этого удобен
        `requestAnimationFrame`: он вызывает функцию перед следующей отрисовкой, примерно 60 раз в секунду.

      Оба приёма уменьшают число запусков, но не делают один запуск короче. Если отрисовка 400 карточек длится
      300 мс, debounce просто перенесёт эти 300 мс заморозки на момент, когда человек перестал печатать, — и ещё
      добавит задержку в 300 мс, даже на быстром компьютере.

      **Приоритет обновления** отвечает на вопрос **что отрисовать первым**. В React для этого есть
      `startTransition` и хук `useTransition`: обновление внутри них помечено как несрочное. Буква в поле ввода
      — срочное обновление, оно рисуется сразу. Список результатов — несрочное: React рисует его в фоне и, если
      человек напечатал ещё букву, бросает начатую отрисовку и начинает заново с новым запросом. То же для одного
      значения делает хук `useDeferredValue`: он возвращает «отстающую» копию значения, по которой рисуется тяжёлая
      часть. Документация React подчёркивает, что тяжёлую часть при этом нужно обернуть в `memo`: иначе она всё
      равно перерисуется при каждой букве, и выигрыша не будет.

      У приоритета три оговорки.
      - Полем ввода через переход управлять нельзя: значение поля обновляют обычным, срочным обновлением, а через
        переход или `useDeferredValue` — только то, что от него зависит.
      - React может прервать фоновую отрисовку между компонентами, но не посреди работы одного из них. Если одна
        функция внутри компонента считает 400 мс подряд, её он не прервёт: такую работу сначала сокращают или
        выносят.
      - Прерывается только работа React — вызов ваших компонентов. Применение готового результата к DOM и пересчёт
        стилей и раскладки браузер делает одним куском. Если запись Performance показывает, что время уходит
        на Recalculate Style и Layout, переход не поможет: нужно уменьшать документ — меньше строк или виртуализация.

      Итак, debounce и throttle — про частоту, переход — про порядок, а четыре способа выше — про объём работы
      и место, где она выполняется. Часто их сочетают.

      ## Сначала договориться, что такое «удалось»

      Оптимизация без цели превращается в бесконечную подгонку. До начала работы записывают три вещи.

      1. **Бюджет скорости** (performance budget) — какое число считаем хорошим. Например: «INP на странице поиска —
         не больше 200 мс, задачи во время ввода — не длиннее 50 мс».
      2. **План замера** — на чём и как меряем. В лаборатории: запись Performance в инструментах разработчика
         при замедлении процессора в 4 раза (настройка CPU throttling), сценарий «напечатать „пепперони“ по букве».
         У реальных людей: INP с их устройств, например через библиотеку web-vitals, которая отправляет метрики
         на ваш сервер.
      3. **Критерий успеха** — что должно получиться: «75-й процентиль INP страницы поиска у реальных менеджеров
         за неделю — ниже 200 мс». 75-й процентиль — значение, которое не превышают три четверти замеров: так
         смотрят на типичный медленный случай, а не на лучший. Среднее для этого не годится: множество быстрых
         действий скроет те медленные, на которые жалуются.

      Без этого легко «оптимизировать» то, что не болело, — например, ускорить фильтрацию с 4 до 1 мс, когда
      300 мс уходят на отрисовку.

      ## Пример целиком: кабинет сети

      **Замер.** На ноутбуке менеджера с замедлением в 4 раза: фильтрация 3600 позиций — 4 мс, отрисовка 400
      карточек — 280 мс на каждую букву, из них 230 мс — работа компонентов React и 50 мс — пересчёт раскладки.
      Наведение на график: пересчёт ближайшей точки — 2 мс, а затем перерисовка всего графика — 12 линий по 90 точек,
      оси и подписи — 120 мс на каждое движение мыши, хотя изменилась только подсказка. Разбор прайс-листа
      на 3600 строк с проверкой каждой — 1,8 секунды одной задачей.

      **Бюджет и критерий.** INP поиска и графика — до 200 мс у 75 % реальных замеров; ни одной задачи длиннее
      50 мс во время ввода в лабораторном сценарии.

      **Решение.**

      1. **Поиск: меньше работы и приоритет.** Показываем первые 50 найденных позиций и кнопку «Показать ещё»:
         работа компонентов и раскладка уменьшаются в восемь раз. Поле ввода обновляется сразу, а список, обёрнутый
         в `memo`, рисуется по значению из `useDeferredValue`: если менеджер печатает быстро, промежуточные списки
         не дорисовываются. Debounce не нужен: запросов к серверу нет, а ждать 300 мс после каждой паузы незачем.
      2. **График: меньше работы и частота.** Линии и оси рисуются один раз и при движении мыши не меняются.
         Подсказка — отдельный маленький компонент поверх графика, и только он перерисовывается при движении мыши,
         не чаще раза в кадр через `requestAnimationFrame`.
      3. **Прайс-лист: фоновый поток.** Разбор и проверка файла уходят в Web Worker: он получает текст файла
         и возвращает список строк и ошибок. Основной поток показывает прогресс и остаётся отзывчивым. Если бы
         воркер был неудобен, подошло бы разбиение на части с `scheduler.yield()`.

      **Проверка.** После изменений повторяем тот же лабораторный сценарий и через неделю смотрим INP реальных
      менеджеров. Критерий выполнен — работа закончена; нет — ищем следующее самое долгое место.

      ## Варианты и их цена

      - **Сделать меньше работы**
        - Когда: почти всегда первым делом.
        - Цена: иногда меняется интерфейс («Показать ещё», подсказка отдельным слоем поверх графика).
      - **Разбить на части и уступать**
        - Когда: работу нельзя сократить, и ей нужен DOM или данные страницы.
        - Цена: общая работа чуть дольше, промежуточное состояние на экране.
      - **Web Worker**
        - Когда: тяжёлые вычисления без DOM.
        - Цена: копирование данных, раздельный код, нет доступа к DOM.
      - **На сервер**
        - Когда: нужны данные, которых нет в браузере, или вычисление слишком тяжело для телефона.
        - Цена: задержка сети, не работает без связи.
      - **Debounce или throttle**
        - Когда: событий слишком много, а реагировать на каждое незачем.
        - Цена: задержка реакции; длительность одного запуска не меняется.
      - **Приоритет обновления**
        - Когда: срочное (ввод) и тяжёлое несрочное (результаты) обновляются вместе.
        - Цена: на экране ненадолго старые результаты; не помогает против одной долгой функции.

      ## Типичные ошибки

      - **Лечить отрисовку через debounce.** Заморозка остаётся той же длины, а к ней добавляется ожидание.
      - **Оборачивать в переход значение поля ввода.** React этого не позволяет: поле должно обновляться срочно.
      - **Ждать, что переход прервёт одну долгую функцию или раскладку.** React прерывает отрисовку между
        компонентами, а не 400 мс подсчёта в одном вызове и не пересчёт стилей огромного документа.
      - **Нести в воркер то, что упирается в DOM.** Отрисовку 400 карточек воркер не возьмёт: у него нет DOM.
      - **Оптимизировать без замера.** Ускорили то, что занимало 4 мс, а 280 мс отрисовки остались.
      - **Мерить на быстром компьютере разработчика.** Без замедления процессора долгих задач не видно.

      ## Как спрашивают на интервью

      - «Поиск по большому списку тормозит при вводе. Что будете делать?» — ждут замер, сокращение отрисовки,
        `useDeferredValue` или `startTransition` и понимание, что debounce здесь лечит не то.
      - «Чем debounce отличается от throttle?» — ждут разницу «после паузы» и «не чаще раза в интервал» и пример
        для каждого.
      - «Когда стоит использовать Web Worker?» — ждут тяжёлые вычисления без DOM и цену копирования данных.
      - «Как вы поймёте, что оптимизация удалась?» — ждут бюджет, план замера и критерий до начала работы.

      ## Коротко

      - Долгая задача — работа в основном потоке дольше 50 мс; пока она идёт, нажатие ждёт, поэтому растёт INP,
        хороший порог которого — 200 мс.
      - Тяжёлую работу сначала сокращают, затем разбивают на части с уступкой браузеру, уносят в Web Worker, если
        ей не нужен DOM, или переносят на сервер, если нужны его данные.
      - Debounce и throttle меняют, как часто запускается работа, но не делают один запуск короче: против долгой
        отрисовки они не помогают.
      - Приоритет обновления (`startTransition`, `useDeferredValue`) решает, что рисовать первым: поле ввода
        обновляется сразу, тяжёлый список — в фоне и с прерыванием.
      - Переход прерывает только работу React между компонентами: он не управляет полем ввода и не помогает против
        одной долгой функции и долгого пересчёта раскладки — долгую функцию сокращают или выносят, а долгую раскладку
        лечат уменьшением документа.
      - До оптимизации записывают бюджет, план замера на медленном устройстве и критерий успеха по данным реальных
        людей.

      ## Источники

      - [Optimize long tasks — web.dev](https://web.dev/articles/optimize-long-tasks)
      - [useTransition — React](https://ru.react.dev/reference/react/useTransition)
      - [Использование Web Workers — MDN](https://developer.mozilla.org/ru/docs/Web/API/Web_Workers_API/Using_web_workers)

  - id: sdl-selection
    topic: Интерфейс на больших объёмах
    subtopic: Выбор и правка в больших списках
    title: Выделение в больших списках
    body: |
      ## Какую проблему решаем

      Утром старший смены поддержки разбирает вчерашние опоздания. Фильтр «вчера, опоздание больше 15 минут» —
      1840 заказов. Все их нужно назначить одному оператору, который обзвонит рестораны.

      Старший нажимает галочку в заголовке таблицы, выбирает «Назначить: Ирина» и видит «Готово». Через час Ирина
      говорит, что у неё 50 заказов, а не 1840.

      Что произошло: таблица загружает строки страницами по 50 (урок «Когда данных слишком много»). Галочка
      в заголовке отметила загруженные строки, а запрос ушёл со списком из 50 номеров. Остальные 1790 заказов
      клиент никогда не видел, и отметить их ему было нечем.

      Наивное исправление — загрузить все 1840 строк, чтобы отметить их. Для 1840 это ещё терпимо, но фильтр «весь
      месяц» даст сотни тысяч строк, и мы вернёмся ко всем пределам прошлых уроков. Нужна другая модель выбора.

      ## Видимое или всё по фильтру

      Когда загружена часть списка, «выбрать всё» может значить две разные вещи:

      - **выбрать видимое** — строки, загруженные или показанные на текущей странице;
      - **выбрать всё по фильтру** — все записи, которые подходят под текущий фильтр, сколько бы их ни было
        и сколько бы ни было загружено.

      Обе нужны, и человек должен понимать, какую он выбрал. Распространённое решение: галочка в заголовке выбирает
      видимое, а над таблицей появляется плашка «Выбраны 50 на этой странице. Выбрать все 1840 по фильтру?». Так
      делают, например, в Gmail, а дизайн-система PatternFly описывает меню массового выбора с пунктами «Ничего»,
      «Страницу» и «Всё» и требует, чтобы счётчик выбранного показывал число по всем страницам, а не только по текущей.

      ## Модель «всё по фильтру, кроме этих»

      Выбор по фильтру нельзя хранить списком номеров: клиент их не знает. Его хранят как правило.

      ```ts
      type Selection =
        | { mode: 'ids'; ids: Set<string> }                          // отмечены конкретные строки
        | { mode: 'filter'; filter: Filter; except: Set<string> };   // всё по фильтру, кроме этих
      ```

      - **Режим «отмеченные строки»** — человек ставит галочки по одной. Клиент хранит номера, их немного.
      - **Режим «всё по фильтру, кроме этих»** — человек нажал «Выбрать все 1840», а потом снял галочки с трёх
        заказов, которые уже разобраны. Клиент хранит фильтр и три исключения, а не 1837 номеров.

      Галочка у строки вычисляется: в первом режиме строка отмечена, если её номер в наборе; во втором — если её
      номера нет в исключениях. Счётчик тоже вычисляется: «выбрано 1837» — это итог по фильтру от сервера минус
      исключения.

      На сервер уходит то же правило, а не номера:

      ```http
      POST /support/orders/bulk-assign
      {
        "filter": { "date": "2026-10-20", "lateMin": 15 },
        "except": ["M-1021", "M-1187", "M-1342"],
        "operatorId": "op-17",
        "expectedCount": 1837,
        "operationId": "b3f1…"
      }
      ```

      Сервер сам выбирает заказы по фильтру — той же логикой, что и для списка, — и назначает их. `operationId`
      защищает от двойного выполнения при повторе (курс 2, «Повторы без двойных списаний»). Зачем `expectedCount`,
      станет ясно ниже.

      ![Сверху — неверный путь: галочка в заголовке отмечает 50 загруженных строк, и на сервер уходит 50 номеров. Ниже — верный: состояние выбора хранит фильтр «вчера, опоздание больше 15 минут» и три исключения, счётчик показывает 1840 − 3 = 1837; на сервер уходят фильтр, исключения и ожидаемое число 1837; сервер сам выбирает заказы и отвечает «назначено 1835, пропущено 2: уже закрыты»](images/sdl-selection.png "Выбор по фильтру уходит на сервер правилом, а не списком номеров")

      ## Если фильтр или выборка изменились

      Правило выбора по фильтру ссылается на фильтр. Отсюда два трудных случая.

      ### Человек сменил фильтр

      Старший выбрал «все 1840 опоздавших за вчера», а потом сузил фильтр до одного ресторана. Что теперь выбрано?
      Возможны два ответа: «все по новому фильтру» или «пересечение старого выбора с новым фильтром». Оба
      неочевидны, и человек легко нажмёт «Назначить», не заметив, что выбор поменялся.

      Простое и честное правило: **при смене фильтра выбор по фильтру сбрасывается**, и интерфейс говорит об этом.
      Выбор отдельных строк можно сохранить, но тогда счётчик показывает, сколько отмеченных строк сейчас скрыто
      фильтром: «Выбрано 12, из них 3 не видны при этом фильтре».

      ### Выборка изменилась, пока человек думал

      Старший нажал «Выбрать все 1840» в 9:05, а «Назначить» — в 9:12. За семь минут другой оператор закрыл два
      заказа из выборки, а для живых фильтров вроде «сегодня, опаздывают» под фильтр могли подойти новые заказы.
      Сервер применяет фильтр в момент выполнения, и результат может разойтись с тем, что видел человек.

      Что с этим делают:

      - **Ожидаемое число.** Клиент отправляет `expectedCount` — сколько видел человек. Если на сервере под правило
        подходит заметно больше (порог решает продукт), сервер не выполняет действие и отвечает «под фильтр теперь
        подходит 1912 заказов, а не 1837». Человек видит новое число и подтверждает заново.
      - **Граница по времени.** В правило добавляют «созданные не позже 9:05», чтобы новые записи не попали
        в действие, начатое раньше них. Для фильтра «вчера» граница уже есть в самом фильтре.
      - **Отчёт о результате.** Сервер отвечает, что сделал: «назначено 1835, пропущено 2: уже закрыты». Это
        **частичный успех** (курс 1, «Загрузка, пустота, ошибка и всё между ними»): человек должен увидеть и то, что не получилось, и почему.
      - **Предварительный подсчёт.** Для опасных действий — удаления, массовой рассылки — сначала спрашивают сервер,
        сколько записей затронет действие и какие, и только потом выполняют. Так устроен пример Google
        в правилах проектирования API (AIP-165, удаление по условию): без флага подтверждения метод возвращает
        число затронутых записей и выборку из них, а с флагом — удаляет.

      ### Действие над тысячами записей идёт долго

      Назначить 1840 заказов сервер может за секунды, а массово пересчитать или выгрузить — за минуты. Тогда
      сервер принимает задачу и возвращает её номер, а клиент показывает прогресс: «Назначаем: 600 из 1837».
      Это **асинхронная команда** (курс 1, «Чтение, запись и реакция интерфейса»). Если вкладку закрыли, задача
      продолжается на сервере, и результат можно увидеть позже.

      ## Правка строки, которая ушла

      Ещё одна трудность больших живых списков — строка, с которой человек работает, может исчезнуть.

      - **Строка ушла из окна.** В виртуальном списке строка, которую прокрутили, удаляется из документа вместе
        с полем ввода (урок «Виртуализация»). Незаконченную правку хранят в состоянии таблицы по id строки.
      - **Строка ушла из выборки.** Оператор пишет комментарий к заказу в фильтре «ожидают оператора». Другой
        оператор взял этот заказ, список обновился, и строка исчезла из выборки прямо под курсором вместе
        с недописанным комментарием. Правило: строка, с которой человек работает, не исчезает молча. Её оставляют
        на месте с пометкой «больше не подходит под фильтр», пока человек не закончит, а сохраняют правку по id
        заказа, а не по номеру строки на экране.
      - **Запись изменилась на сервере.** Пока оператор правил, кто-то изменил тот же заказ. Это конфликт версий
        из курса 2, урок «Версии и конфликты»: правку отправляют с номером версии, которую видел человек.

      ## Пример целиком: назначение опоздавших

      **Что известно.** Фильтр «вчера, опоздание больше 15 минут» — 1840 заказов, загружено 50. Операторы работают
      с таблицей одновременно, заказы закрываются в течение всего утра.

      **Решение.**

      1. Галочка в заголовке отмечает 50 загруженных строк. Появляется плашка: «Выбраны 50 на этой странице. Выбрать
         все 1840 по фильтру?»
      2. Старший нажимает «Выбрать все». Состояние выбора: фильтр плюс пустой набор исключений. Счётчик: «Выбрано
         1840».
      3. Старший снимает галочки с трёх заказов, которые уже разобрал сам. Счётчик: «Выбрано 1837». Исключения
         хранятся по номерам заказов.
      4. Нажатие «Назначить: Ирина» отправляет фильтр, исключения, `expectedCount: 1837` и `operationId`.
      5. Сервер применяет фильтр сам. Два заказа к этому моменту уже закрыты — он их пропускает и отвечает:
         «назначено 1835, пропущено 2: уже закрыты». Расхождение небольшое, поэтому действие выполнено без
         повторного подтверждения.
      6. Таблица перечитывает данные, выбор сбрасывается, а сообщение о результате остаётся на экране, пока его
         не закроют, со ссылкой «Показать пропущенные».
      7. Если бы старший сменил фильтр между шагами 3 и 4, выбор сбросился бы с сообщением «Фильтр изменился, выбор
         снят».

      ## Варианты и их цена

      - **Только видимое**
        - Подходит: действия над несколькими строками, которые человек видит.
        - Цена: «выбрать всё» тихо действует на часть данных, если человек не понял границу.
      - **Загрузить все номера и выбрать их**
        - Подходит: под фильтр подходят сотни записей, и нужно показывать каждую выбранную.
        - Цена: на больших выборках — все пределы прошлых уроков.
      - **Всё по фильтру, кроме этих**
        - Подходит: тысячи записей и действие по правилу.
        - Цена: сервер должен уметь действие по фильтру; нужно решить, что делать при смене фильтра и расхождении
          числа.
      - **Предварительный подсчёт перед действием**
        - Подходит: необратимые и массовые действия.
        - Цена: лишний шаг и запрос.

      ## Типичные ошибки

      - **«Выбрать всё» отмечает только загруженное, а говорит «всё».** Человек думает, что действует на весь
        фильтр, а сервер получает 50 номеров.
      - **Хранить выбор по фильтру списком номеров.** Чтобы его составить, приходится загрузить всю выборку.
      - **Считать «выбрано» по загруженным строкам.** Счётчик показывает 50 вместо 1840 или наоборот.
      - **Молча сохранять выбор по фильтру после смены фильтра.** Действие уходит на другой набор записей, чем
        думает человек.
      - **Не сообщать о частичном результате.** «Готово», хотя часть записей пропущена.
      - **Убирать строку из-под курсора.** Обновление списка уносит строку вместе с недописанной правкой.

      ## Как спрашивают на интервью

      - «В таблице миллион строк, загружено 50. Как работает „выбрать всё“?» — ждут два смысла, плашку с выбором
        по фильтру, модель «фильтр плюс исключения» и действие по фильтру на сервере.
      - «Что будет, если, пока человек думал, под фильтр подошли новые записи?» — ждут ожидаемое число, границу
        по времени и отчёт о частичном успехе.
      - «Как спроектировать массовое удаление?» — ждут предварительный подсчёт, подтверждение и долгую задачу
        с прогрессом.

      ## Коротко

      - Когда загружена часть списка, «выбрать всё» значит либо видимое, либо всё по фильтру; интерфейс должен
        различать эти случаи и показывать, какой выбран.
      - Выбор по фильтру хранят правилом «фильтр плюс исключения», а не списком номеров, и так же отправляют
        на сервер, который сам выбирает записи.
      - Счётчик выбранного — итог по фильтру от сервера минус исключения, а не число отмеченных загруженных строк.
      - При смене фильтра выбор по фильтру сбрасывают и говорят об этом, иначе действие уйдёт на другой набор.
      - Выборка может измениться к моменту действия, поэтому клиент отправляет ожидаемое число, а сервер отказывает
        при большом расхождении и сообщает о частичном успехе.
      - Опасные массовые действия начинают с предварительного подсчёта, а долгие выполняют на сервере задачей
        с прогрессом.
      - Строка, с которой человек работает, не исчезает молча при обновлении, а правку сохраняют по id записи.

      ## Источники

      - [Bulk selection — PatternFly](https://www.patternfly.org/patterns/bulk-selection/)
      - [AIP-165: Criteria-based delete — Google API Improvement Proposals](https://google.aip.dev/165)

  - id: sdl-transport
    topic: Системы реального времени
    subtopic: Выбор транспорта
    title: Как доставлять живые данные
    body: |
      ## Какую проблему решаем

      В курсе 1 статус заказа на экране отслеживания обновлялся опросом раз в 30 секунд: требование было «новый
      статус — в пределах минуты». В пик открыто 20 000 экранов, это около 670 запросов в секунду. В курсе 2, в уроке
      «Когда данные устаревают», мы оговорили, что push понадобится, если статус нужно будет показывать за секунды.

      Этот момент настал. Продукт добавляет точку курьера на карте и уведомление «Курьер подъехал», и оба должны
      появляться за секунды. Приложение курьера отправляет координаты раз в 5 секунд. Первая мысль — опрашивать
      раз в 5 секунд. Это 20 000 / 5 = 4000 запросов в секунду, и большинство из них ответит «ничего не изменилось».

      Вторая мысль — «нужен WebSocket». Возможно. Но кроме WebSocket есть ещё три способа доставлять живые данные,
      и у каждого своя цена. В этом уроке разберём все четыре и выберем для каждой живой части сервиса свой.

      ## Четыре транспорта

      **Транспорт** здесь — способ, которым изменения на сервере попадают в браузер. Сравнивать их удобно по четырём
      вопросам: кто начинает передачу, с какой задержкой клиент узнаёт об изменении, сколько это стоит серверу
      и как транспорт проходит через прокси и балансировщики.

      ![Четыре временные шкалы по 30 секунд, на каждой статус меняется на 12-й секунде. Опрос раз в 10 секунд: запросы на 0, 10, 20 и 30-й секундах, клиент узнаёт об изменении на 20-й. Длинный опрос: запрос висит на сервере, сервер отвечает на 12-й секунде, клиент сразу отправляет новый запрос. SSE: одно соединение открыто с нулевой секунды, сервер присылает событие на 12-й. WebSocket: одно соединение, сервер присылает событие на 12-й, а клиент отправляет своё на 18-й по тому же соединению](images/sdl-transport.png "Четыре способа узнать об изменении на 12-й секунде")

      ### Опрос

      **Опрос** (polling) — клиент сам спрашивает сервер через равные промежутки: «что нового?» Обычные HTTP-запросы,
      ничего особенного на сервере не нужно.

      - **Задержка:** до одного интервала. При опросе раз в 30 секунд изменение увидят в среднем через 15 секунд,
        в худшем — через 30.
      - **Нагрузка:** число открытых экранов, делённое на интервал, независимо от того, есть ли изменения.
      - **Прокси:** проходит везде — это обычные запросы.

      Опрос хорош, когда изменения редкие, а задержка в минуту никому не мешает. Или когда экранов немного.

      ### Длинный опрос

      **Длинный опрос** (long polling) — клиент отправляет запрос, а сервер не отвечает сразу, а держит его, пока
      не появится новое или не выйдет время ожидания, например 30 секунд. Получив ответ, клиент тут же отправляет
      следующий запрос. Приём описан в RFC 6202.

      - **Задержка:** почти сразу, но после каждого события клиент должен отправить новый запрос, и события, пришедшие
        в этот момент, сервер должен для него сохранить.
      - **Нагрузка:** на сервере висит по запросу на экран; каждое событие стоит полного HTTP-запроса с заголовками
        и проверкой входа.
      - **Прокси:** обычные HTTP-запросы, но долгие; прокси и балансировщики с коротким тайм-аутом их обрывают.

      Сегодня длинный опрос чаще встречается как запасной путь, когда постоянное соединение не держится.

      ### События от сервера (SSE)

      **SSE** (Server-Sent Events, «события, отправленные сервером») — клиент открывает одно HTTP-соединение,
      а сервер присылает по нему события, когда они появляются. Соединение не закрывается. В браузере для этого есть
      встроенный объект `EventSource`.

      ```js
      const source = new EventSource('/orders/o-42/live');
      source.addEventListener('status', (e) => setStatus(JSON.parse(e.data)));
      source.addEventListener('courier', (e) => setCourier(JSON.parse(e.data)));
      ```

      По сети события выглядят как простой текст: строки `event:`, `data:` и `id:`, разделённые пустой строкой.

      - **Направление:** только от сервера к клиенту. Клиент пишет на сервер обычными запросами.
      - **Задержка:** сразу, без нового запроса на каждое событие.
      - **Нагрузка:** одно открытое соединение на экран; событие — несколько десятков или сотен байт.
      - **Встроенное переподключение:** при обрыве `EventSource` сам подключается снова, а сервер может задать паузу
        полем `retry:`. Если у событий были номера (`id:`), браузер при переподключении отправит последний полученный
        в заголовке `Last-Event-ID`, и сервер сможет дослать пропущенное. Подробнее — в уроке «Снимок и догоняющие
        события».
      - **Прокси:** это обычный HTTP-ответ, поэтому SSE проходит там же, где обычные запросы. Две оговорки.
        Некоторые прокси копят ответ и отдают его кусками — события приходят пачками с опозданием; у nginx, например,
        такое накопление отключают заголовком ответа `X-Accel-Buffering: no`. Чужой прокси так не настроить, но
        накопление можно заметить: если сервер кладёт в служебный сигнал «я жив» своё время, клиент видит, что
        сигналы, отправленные с разницей в 15 секунд, приходят по нескольку почти одновременно или с промежутками
        в десятки секунд. Время сервера в соседних сигналах сравнивают между собой и с промежутками их прихода, а не
        с часами устройства: часы устройства и сервера могут расходиться на минуты. А прокси, которые обрывают молчащие
        соединения, обходят пустыми строками-комментариями (строка, которая начинается с двоеточия): спецификация
        советует присылать их примерно раз в 15 секунд. Странице такие строки не видны — браузер их выбрасывает,
        поэтому для проверки связи со стороны клиента нужен настоящий пинг-событие; о нём — в следующем уроке.
      - **Ограничения:** по HTTP/1.1 браузер держит не больше шести соединений на один сайт на все вкладки сразу,
        и седьмая вкладка с SSE будет ждать. По HTTP/2 соединения делят одно подключение, и предел — около ста
        одновременных потоков. Поэтому SSE отдают по HTTP/2. Кроме того, `EventSource` не умеет добавлять свои
        заголовки, например `Authorization`, — только куки. Как с этим жить, разберём в уроке «Соединение: обрывы
        и возвраты».

      ### WebSocket

      **WebSocket** — постоянное соединение, по которому обе стороны в любой момент отправляют друг другу сообщения.
      Оно начинается как HTTP-запрос с просьбой сменить протокол (upgrade), а дальше это уже не HTTP, а свой протокол
      поверх того же TCP-соединения.

      - **Направление:** в обе стороны по одному соединению.
      - **Задержка:** сразу, и для сообщений клиента тоже — без нового HTTP-запроса.
      - **Нагрузка:** одно соединение на экран; сообщения маленькие, без HTTP-заголовков.
      - **Что придётся сделать самим:** браузерный WebSocket не переподключается сам, не знает номеров сообщений
        и не досылает пропущенное. Всё это — переподключение, проверку, что соединение живо, повтор пропущенного —
        пишут сами или берут библиотеку.
      - **Прокси и балансировщики:** нужно разрешить смену протокола и долгие соединения. Некоторые корпоративные
        прокси такие соединения режут. Прокси, которые не расшифровывают трафик, не видят содержимого `wss://`
        и пропускают его чаще, чем незашифрованный `ws://`; прокси, которые расшифровывают трафик компании, могут
        резать и его. Поэтому библиотеки вроде Socket.IO умеют откатываться на длинный опрос.

      ## Сравнение

      - **Опрос**
        - Кто начинает: клиент, по расписанию.
        - Задержка: до интервала.
        - Цена: запросы на каждый экран, даже когда ничего не изменилось.
      - **Длинный опрос**
        - Кто начинает: клиент, но сервер отвечает, когда есть новое.
        - Задержка: почти сразу.
        - Цена: полный HTTP-запрос на каждое событие, обрывы на прокси с коротким тайм-аутом.
      - **SSE**
        - Кто начинает: сервер, по открытому соединению.
        - Задержка: сразу.
        - Цена: одно соединение на экран; только от сервера к клиенту; нужен HTTP/2.
      - **WebSocket**
        - Кто начинает: обе стороны.
        - Задержка: сразу в обе стороны.
        - Цена: переподключение, номера и повторы — самим; настройка прокси и балансировщиков.

      У SSE и WebSocket есть общая цена на сервере: событие о заказе должно попасть на тот сервер, где висит
      соединение покупателя. Если серверов десять, между ними нужна шина событий, чтобы каждый сервер получил события
      для своих соединений. Обычно её строят на **брокере сообщений** (message broker — например, Kafka, RabbitMQ
      или Redis) — отдельном сервере-посреднике: одни программы кладут в него сообщения, другие забирают. Брокер
      хранит сообщения, пока их не обработают (так устроен RabbitMQ), или заданный срок (так устроена Kafka), и умеет
      раздать одно сообщение многим получателям. При опросе шина не нужна: любой сервер читает статус из базы.

      ## «Реальное время» не значит «WebSocket»

      Выбирают не по слову «реальное время», а по сценарию.

      1. **Кто кому пишет?** Если данные идут только от сервера — статус, котировки, счёт матча, — хватит SSE.
         Если клиент тоже часто пишет и важна задержка его сообщений — чат с «печатает», игра, совместное
         редактирование, — нужен WebSocket.
      2. **Как часто меняется и какая задержка терпима?** Если изменения раз в несколько минут, а узнать о них
         можно через минуту, опрос проще всего, и держать открытые соединения незачем.
      3. **Сколько экранов?** Опрос раз в 5 секунд для тридцати экранов поддержки — пустяк. Для 20 000 экранов
         покупателей — 4000 запросов в секунду.
      4. **Что уже есть в инфраструктуре?** Прокси клиентов, балансировщики, умеет ли сервер держать соединения.

      ## Если постоянное соединение не держится

      У части людей SSE или WebSocket работать не будут: корпоративный прокси режет долгие соединения или копит
      ответ, старый балансировщик закрывает соединение через 60 секунд. Поэтому у живого экрана есть **запасной
      транспорт** (fallback). Если соединение не открывается, раз за разом умирает — например, три попытки подряд
      кончились тишиной дольше 45 секунд (как это замечают, разбирает следующий урок), — или служебные сигналы
      «я жив», отправленные сервером через равные промежутки, приходят пачками, клиент переходит на опрос и через
      несколько минут пробует постоянное соединение снова. Экран при этом продолжает работать, только медленнее.

      ## Пример целиком: живые части сервиса доставки

      - **Отслеживание у покупателя: статус и точка курьера — SSE.** Данные идут только от сервера. Статус меняется
        несколько раз за заказ, а точка курьера — раз в 5 секунд, пока заказ в пути. Сообщений о точке столько же,
        сколько было бы ответов опроса на этих заказах, но каждое — сотня байт по уже открытому соединению, без нового
        запроса, заголовков, проверки входа и обращения к базе. А пока заказ готовится, по соединению почти ничего
        не идёт, тогда как опрос раз в 5 секунд спрашивал бы впустую. Запасной транспорт — опрос раз в 30 секунд,
        как в курсе 1.
      - **Доска заказов в кабинете ресторана — SSE.** Новые заказы и отмены идут от сервера, а повар отвечает
        обычными запросами: «принял», «готово». Таких действий немного, и обычный запрос с ключом идемпотентности
        надёжнее.
      - **Чат покупателя с курьером и поддержкой — WebSocket.** Сообщения, «печатает» и «прочитано» идут в обе стороны
        часто и должны приходить сразу. Переподключение и повтор пропущенного придётся сделать самим — об этом
        следующие уроки.
      - **Координаты от курьера — обычный POST раз в 5 секунд.** 2000 курьеров на линии в пик — 400 запросов
        в секунду, это немного. Постоянное соединение ради этого не нужно, а при обрыве старые координаты не копятся:
        нужна только последняя.
      - **Счётчик «опаздывают сейчас» в кабинете поддержки — опрос раз в минуту.** Экранов три десятка, а точность
        до секунды никому не нужна.

      ## Типичные ошибки

      - **WebSocket для всего живого.** Статусу, который идёт только от сервера, хватает SSE, а с WebSocket
        приходится самим писать переподключение и повтор пропущенного.
      - **Частый опрос вместо постоянного соединения на тысячах экранов.** Тысячи пустых ответов в секунду
        и задержка до интервала.
      - **SSE по HTTP/1.1.** Седьмая вкладка того же сайта перестаёт получать события.
      - **Нет запасного пути.** У людей за корпоративным прокси экран застывает без единой ошибки.
      - **Забыть о серверах за балансировщиком.** Событие попало на один сервер, а соединение покупателя висит
        на другом.

      ## Как спрашивают на интервью

      - «Как доставлять обновления статуса заказа?» — ждут сравнения опроса, длинного опроса, SSE и WebSocket и выбора
        по направлению, частоте и числу клиентов.
      - «Когда SSE лучше WebSocket и наоборот?» — ждут направление связи, встроенное переподключение и `Last-Event-ID`
        у SSE, ограничение HTTP/1.1, двустороннюю связь у WebSocket.
      - «Что будет, если WebSocket не проходит через прокси?» — ждут запасной транспорт.

      ## Коротко

      - Опрос — клиент спрашивает по расписанию: проще всего и проходит везде, но задержка до интервала, а нагрузка
        растёт с числом экранов, даже когда ничего не меняется.
      - Длинный опрос держит запрос до появления нового: задержка маленькая, но каждое событие стоит полного
        HTTP-запроса; сегодня это чаще запасной путь.
      - SSE — события от сервера по одному HTTP-соединению: встроенное переподключение и `Last-Event-ID`, только
        в одну сторону, нужен HTTP/2 из-за предела в шесть соединений по HTTP/1.1.
      - WebSocket — сообщения в обе стороны по одному соединению; переподключение, номера и повтор пропущенного
        делают сами, а прокси и балансировщики нужно настроить.
      - Транспорт выбирают по сценарию — кто пишет, как часто, какая задержка терпима и сколько экранов, — а не
        по словам «реальное время».
      - Постоянному соединению нужен запасной путь, обычно опрос, на случай прокси и балансировщиков, которые его
        режут.

      ## Источники

      - [Использование событий, отправленных сервером — MDN](https://developer.mozilla.org/ru/docs/Web/API/Server-sent_events/Using_server-sent_events)
      - [WebSocket API — MDN](https://developer.mozilla.org/ru/docs/Web/API/WebSockets_API)
      - [RFC 6202: Known Issues and Best Practices for the Use of Long Polling and Streaming in Bidirectional HTTP](https://www.rfc-editor.org/rfc/rfc6202)

  - id: sdl-connection
    topic: Системы реального времени
    subtopic: Жизненный цикл соединения
    title: 'Соединение: обрывы и возвраты'
    body: |
      ## Какую проблему решаем

      Доска заказов в кабинете ресторана открыта на планшете на кухне весь день. Новые заказы приходят на неё сами,
      по SSE, со звуком. Ресторан закрывается в 23:00, планшет засыпает. В 9:00 повар включает экран: на доске
      висят вчерашние заказы, индикатор в углу горит зелёным «в сети». Первый утренний заказ приходит в 9:05,
      но ни звука, ни карточки нет. Ресторан узнаёт о нём, когда звонит поддержка.

      Что произошло: ночью Wi-Fi роутер перезагрузился, и соединение умерло. Но планшет спал и ничего об этом
      не узнал: никакой ошибки страница не получила. Утром страница по-прежнему считает соединение открытым и ждёт
      событий, которые никогда не придут.

      В прошлом уроке мы выбрали транспорты. Этот урок — о жизни соединения: как заметить, что оно умерло, как
      вернуться и что делать после возврата.

      ## Переподключение: что уже известно и что нового

      Как повторять неудавшееся, разобрано в курсе 2, в уроке «Когда и как повторять»: **экспоненциальная задержка**
      (пауза растёт с каждой попыткой), **случайный разброс** (каждый клиент ждёт случайную долю паузы, чтобы клиенты
      не пришли одной волной) и лимит. Для переподключения правила те же. В сервисе доставки — полный разброс,
      база 1 секунда, потолок 30 секунд. Потолок выше, чем у обычных запросов (там 8 секунд): за переподключением
      не ждёт человек с нажатой кнопкой. Вместо лимита попыток здесь потолок паузы: соединение должно рано или поздно
      вернуться, поэтому попытки идут, пока страница открыта, но не чаще раза в 30 секунд. А после нескольких неудач
      подряд экран честно показывает «нет связи» и переходит на запасной транспорт из прошлого урока.

      У постоянных соединений есть три особенности.

      **SSE переподключается сам, но не всегда.** `EventSource` после обрыва сети подключается снова сам, через паузу,
      которую сервер может задать полем `retry:`. Спецификация разрешает браузеру добавить к ней растущую паузу,
      но не требует этого, поэтому полагаться на разброс нельзя. А если сервер на переподключение ответит
      не 200 — например, 503 «перегружен» — `EventSource` сдаётся окончательно: по спецификации соединение
      считается проваленным, и повторов больше не будет. Поэтому обработчик ошибки проверяет `readyState`: если
      он `CLOSED`, приложение само создаёт новый `EventSource` по правилам экспоненциальной задержки с разбросом.

      **WebSocket не переподключается сам совсем.** Событие `close` приходит, и дальше всё — забота приложения.

      **Переподключаются тысячи сразу.** Обычный запрос падает у каждого в своё время. Постоянные соединения
      обрываются у всех одновременно — когда перезапускают сервер событий. Об этом ниже, в истории о выкатке.

      ## Как заметить, что соединение умерло

      Самое коварное — соединение, которое умерло молча. Телефон сменил Wi-Fi на мобильную сеть, роутер перезагрузился,
      промежуточное устройство в сети забыло о долгом соединении. Ни одна сторона не получила сигнала о закрытии,
      и браузер может минутами, а иногда и часами считать соединение открытым. Событие `error` или `close`
      не приходит, потому что браузер сам не знает, что связи нет.

      Лечится это **проверкой, что соединение живо** (heartbeat, «сердцебиение»):

      - сервер шлёт короткий служебный сигнал «я жив» (пинг) через равные промежутки, в сервисе доставки — раз
        в 15 секунд. Для SSE это отдельное событие `ping` с временем сервера в данных (`event: ping`,
        `data: {"t": …}`), для WebSocket — маленькое сообщение с тем же временем; по нему видно, с какими
        промежутками сервер слал пинги. Строка-комментарий из прошлого урока
        для этого не годится: браузер выбрасывает её при разборе потока и странице о ней не сообщает. Комментарий
        защищает соединение только от прокси, а событие `ping` делает и это, и даёт сигнал клиенту;
      - клиент засекает время последнего полученного сообщения — любого, события или пинга. Если тишина длится
        дольше трёх интервалов, 45 секунд, клиент считает соединение мёртвым, сам закрывает его и переподключается.

      Почему не использовать встроенный пинг WebSocket? В протоколе WebSocket (RFC 6455) есть служебные кадры ping
      и pong, и браузер отвечает на ping сервера сам. Это помогает серверу заметить мёртвых клиентов. Но из
      JavaScript в браузере эти кадры не видны и не отправляются, поэтому клиенту нужен свой пинг на уровне
      приложения.

      ## Вкладка в фоне и сон телефона

      Браузер экономит батарею на фоновых вкладках.

      - **Таймеры в фоне замедляются.** Chrome проверяет таймеры скрытой вкладки раз в секунду, а если вкладка
        скрыта дольше пяти минут, таймеры идут цепочкой и страница не издавала звуков последние 30 секунд — раз
        в минуту. Сторож «45 секунд тишины» в такой вкладке
        сработает с опозданием.
      - **Вкладку могут заморозить или выгрузить.** На телефоне браузер часто останавливает фоновую страницу
        целиком (курс 1, «Что переживает перезагрузку»), а устройство во сне не выполняет ничего.
      - **Кэш «назад-вперёд».** Некоторые браузеры не кладут в него страницу с открытым WebSocket. web.dev советует
        закрывать соединения в событии `pagehide` и открывать снова в `pageshow`.

      Поэтому возврат на страницу — главный момент проверки. Когда вкладка снова видна (событие `visibilitychange`
      с `document.visibilityState === 'visible'`), страница разморожена (в Chrome — событие `resume`) или вернулась сеть
      (событие `online`), клиент сразу смотрит, сколько прошло с последнего сообщения. Больше 45 секунд — соединение
      считается мёртвым и переподключается, не дожидаясь своего замедленного таймера.

      Держать ли соединение, пока вкладка скрыта, решают по экрану. Экран отслеживания, свёрнутый на десять минут,
      можно отключить: серверу легче, батарее тоже, а при возврате экран переподключится и перечитает данные. Доску
      заказов на кухне отключать нельзя: она нужна ради звука, даже если на неё никто не смотрит. По той же причине
      ей нельзя давать гаснуть экраном: погасший экран скрывает страницу, а там и до заморозки недалеко. Как держать
      экран включённым, разбирает урок «Уведомления».

      ## «Соединение есть» не значит «данные свежие»

      Соединение вернулось — но экран всё ещё показывает то, что было до обрыва. События, которые сервер разослал,
      пока связи не было, клиент не получил. Это уже отмечено в курсе 2, в уроке «Когда данные устаревают»: после
      переподключения данные нужно перепроверить. Как именно — догнать пропущенные события по номеру или перечитать
      данные целиком, — разбирает урок «Снимок и догоняющие события».

      Отсюда правило для интерфейса: индикатор «в сети» говорит о соединении, а не о данных. Человеку важнее знать,
      насколько свежо то, что он видит. Поэтому живые экраны показывают свежесть данных: «обновлено только что»,
      «обновлено 3 минуты назад», «нет связи, данные на 19:42».

      ### Курьер въехал в тоннель

      Обратная сторона той же беды. Покупатель смотрит на карту, соединение у него в порядке: пинги приходят каждые
      15 секунд. Но курьер въехал в тоннель, его приложение не может отправить координаты, и точка на карте
      покупателя замерла. Через полторы минуты курьер выезжает, приходит новая точка — и она прыгает на километр
      вперёд.

      Соединение живо, а данные несвежие. Поэтому у каждого события о курьере есть время, когда курьер в этой точке
      был. Если новой точки нет дольше 30 секунд, карта показывает «Нет связи с курьером, последнее место —
      1 минуту назад», а точку делает серой. Когда связь вернётся, точка перемещается плавно, а не прыжком.

      ## Токен истёк посреди соединения

      В курсе 2, в уроке «Сессия и обновление токена», токен доступа живёт 10 минут и обновляется по ответу `401`.
      С постоянным соединением так не получится: оно проверяет вход один раз, при открытии, а живёт часами.

      Первая трудность — как вообще передать токен. `EventSource` не умеет добавлять заголовки, а браузерный WebSocket
      не даёт задать `Authorization` при открытии. Распространённые способы:

      - **кука** — если поток идёт с того же сайта, браузер приложит куку сессии сам;
      - **одноразовый билет в адресе** — клиент обычным запросом с токеном получает билет на 30 секунд и открывает
        соединение по адресу с этим билетом. Билет одноразовый и короткий, потому что адреса попадают в журналы
        прокси и серверов;
      - **токен первым сообщением** — для WebSocket: соединение открывается, и клиент сразу отправляет токен, а сервер
        не шлёт данных до проверки;
      - **поток через `fetch`** — можно получить события через `fetch` и разбирать ответ самим: тогда заголовки
        доступны, но переподключение и `Last-Event-ID` нужно писать самим.

      Вторая трудность — что делать, когда токен истёк, а соединение открыто. Есть два честных варианта: сервер
      закрывает соединение, когда истекает срок токена, а клиент обновляет токен и переподключается; или клиент
      сам заранее присылает по WebSocket новый токен. Главное, чтобы соединение не жило дольше права на него.
      Если владелец ресторана уволил менеджера и завершил его сессии, сервер обязан закрыть и его потоки, иначе
      бывший сотрудник продолжит видеть заказы ресторана.

      ## Перезапуск сервера: 20 000 переподключений разом

      Вечер, 19:30, пик. Команда выкатывает новую версию сервера событий, и все его соединения рвутся одновременно:
      20 000 экранов отслеживания и доски ресторанов. `EventSource` переподключается через одну и ту же паузу —
      все клиенты приходят в одну секунду. Каждый после переподключения перечитывает данные, и база получает
      десятки тысяч запросов разом. Сервер отвечает 503, `EventSource` у части клиентов сдаётся, их экраны тихо
      застывают.

      Это **проблема громового стада** (thundering herd) из курса 2, только для соединений. Что помогает:

      - **разброс переподключения.** Для своего кода — экспоненциальная задержка с полным разбросом. Для
        `EventSource` сервер может выдать каждому клиенту свою случайную паузу полем `retry:`;
      - **плавное отключение.** Перед перезапуском сервер закрывает соединения не разом, а постепенно, например
        в течение минуты;
      - **дешёвый возврат.** Если клиент после переподключения догоняет пропущенное по номеру последнего события,
        а не перечитывает всё целиком, нагрузка на базу намного меньше (урок «Снимок и догоняющие события»);
      - **свой повтор после 503.** Клиент, у которого `EventSource` сдался, сам создаёт новое соединение с паузой.

      ## Пример целиком: доска заказов после ночи

      1. **Днём** сервер шлёт пинг раз в 15 секунд. Клиент помнит время последнего сообщения.
      2. **Ночью** роутер перезагрузился, соединение умерло молча. Планшет спит, таймеры не работают.
      3. **В 9:00** повар включает экран. Срабатывает `visibilitychange`: последнее сообщение было 10 часов назад,
         больше 45 секунд. Клиент закрывает старое соединение и открывает новое.
      4. **Пока соединение открывается,** доска показывает «Обновляем заказы…» поверх вчерашних карточек, а не зелёный
         индикатор.
      5. **После переподключения** клиент перечитывает доску целиком: события хранятся на сервере только час, а прошло
         десять (подробно — в уроке «Снимок и догоняющие события»). Вчерашние заказы уходят, утренний появляется
         со звуком.
      6. **Если экран не гас** и `visibilitychange` не пришло, мёртвое соединение найдёт сторож: через 45 секунд
         тишины после того, как таймеры снова пошли.

      ## Варианты и их цена

      - **Встроенное переподключение SSE**
        - Плюсы: ничего писать не нужно.
        - Цена: разброс не гарантирован; после ответа не 200 сдаётся окончательно.
      - **Своё переподключение с экспоненциальной задержкой и разбросом**
        - Плюсы: управляемо, не создаёт волну.
        - Цена: код и тесты.
      - **Пинг от сервера и сторож на клиенте**
        - Плюсы: замечает молча умершие соединения.
        - Цена: служебный трафик; в фоне сторож запаздывает.
      - **Проверка при возврате на вкладку**
        - Плюсы: быстро замечает сон и заморозку.
        - Цена: нужно подписаться на несколько событий и не открыть два соединения сразу.
      - **Закрывать соединение, пока вкладка скрыта**
        - Плюсы: меньше нагрузка на сервер и батарею.
        - Цена: при возврате переподключение и перечитывание; не подходит, если нужен звук.

      ## Типичные ошибки

      - **Верить индикатору «в сети».** Соединение может быть мёртвым без единой ошибки.
      - **Считать, что `EventSource` переподключится всегда.** После ответа 503 он сдаётся, и экран застывает.
      - **Переподключаться без разброса.** После перезапуска сервера клиенты приходят одной волной.
      - **После переподключения ничего не перечитывать.** События, пропущенные за обрыв, потеряны.
      - **Не показывать свежесть данных.** Застывшая точка курьера выглядит как курьер, который стоит на месте.
      - **Соединение живёт дольше права на него.** Сессию отозвали, а поток продолжает присылать данные.

      ## Как спрашивают на интервью

      - «Как обработать обрыв соединения в чате или дашборде?» — ждут экспоненциальную задержку с разбросом, пинг
        и сторож, проверку при возврате на вкладку и перечитывание после переподключения.
      - «Как понять, что WebSocket умер?» — ждут пинг на уровне приложения и объяснение, почему встроенного
        недостаточно.
      - «Что будет, если перезапустить сервер с 50 000 открытых соединений?» — ждут проблему громового стада
        и способы её погасить.
      - «Как передать токен в WebSocket и что делать, когда он истечёт?» — ждут куку, билет или первое сообщение
        и закрытие соединения вместе с правом на него.

      ## Коротко

      - Переподключение подчиняется правилам повторов из курса 2: экспоненциальная задержка, случайный разброс
        и потолок паузы.
      - SSE переподключается сам, но без гарантии разброса и сдаётся после ответа не 200 — тогда переподключает
        приложение; WebSocket не переподключается сам вовсе.
      - Соединение может умереть молча, без ошибки, поэтому сервер шлёт пинг, а клиент считает соединение мёртвым
        после нескольких интервалов тишины и переподключается сам.
      - Встроенные ping и pong WebSocket не видны JavaScript в браузере, поэтому клиенту нужен свой пинг на уровне
        приложения.
      - В фоне таймеры замедляются, а во сне не работают, поэтому при возврате на вкладку, разморозке и возврате
        сети клиент сразу проверяет, сколько прошло с последнего сообщения.
      - «Соединение есть» не значит «данные свежие»: после переподключения пропущенное догоняют или перечитывают,
        а экран показывает, насколько свежи данные.
      - Постоянное соединение проверяет вход один раз, поэтому оно должно закрываться, когда истекает токен
        или отзывают сессию.
      - Перезапуск сервера рвёт тысячи соединений разом; волну гасят разбросом, плавным отключением и дешёвым
        возвратом по номеру последнего события.

      ## Источники

      - [Page Visibility API — MDN](https://developer.mozilla.org/ru/docs/Web/API/Page_Visibility_API)
      - [Server-sent events: processing model — HTML Standard](https://html.spec.whatwg.org/multipage/server-sent-events.html#sse-processing-model)
      - [Heavy throttling of chained JS timers beginning in Chrome 88 — Chrome for Developers](https://developer.chrome.com/blog/timer-throttling-in-chrome-88)

  - id: sdl-events
    topic: Системы реального времени
    subtopic: Обработка событий
    title: 'События: дубли и порядок'
    body: |
      ## Какую проблему решаем

      Пятница, вечер. На доске заказов пиццерии появляется заказ 4812 со звуком. Через секунду — ещё раз: вторая
      карточка того же заказа и второй звук. Повар решает, что это два разных заказа, и ставит в печь две пиццы.

      Через полчаса другая беда. Повар нажал «Принял» у заказа 4830, и в ту же секунду покупатель его отменил.
      Карточка ушла с доски, а через пару секунд вернулась со статусом «готовится». Повар начинает готовить
      отменённый заказ.

      Ни сервер, ни клиент не «сломались». Брокер сообщений на сервере (посредник между программами, который хранит
      сообщения до подтверждения, — урок «Как доставлять живые данные») повторил событие «заказ 4812 оплачен», которое
      уже было отправлено: он не был уверен, что первая отправка дошла. А ответ на нажатие «Принял» — заказ в статусе
      «готовится» — задержался в сети и пришёл после события «4830 отменён». Клиент применял всё, что получал,
      по мере прихода.

      Это нормальное поведение распределённых систем: события иногда приходят дважды и иногда не по порядку.
      Клиент должен быть к этому готов.

      ## Что обещает источник событий

      Прежде чем писать обработку, выясняют, что обещает источник. Гарантии доставки называют так:

      - **не больше одного раза** (at-most-once) — событие либо придёт один раз, либо потеряется. Дублей не бывает,
        потери бывают. Так ведут себя события, которые никто не хранит и не повторяет: например, «собеседник печатает».
      - **хотя бы один раз** (at-least-once) — событие не потеряется, но может прийти несколько раз. Источник
        повторяет отправку, если не уверен, что она дошла. Так работает большинство брокеров сообщений и очередей:
        документация Amazon SQS прямо говорит, что изредка вы получите копию сообщения ещё раз, и просит делать
        обработку **идемпотентной** — такой, которой не вредит повторная обработка того же сообщения.
      - **ровно один раз** (exactly-once) — каждое событие ровно один раз. Внутри одной системы это достижимо
        транзакциями, но на пути от сервера через сеть в браузер — практически нет. На деле «ровно один раз»
        получают так: источник доставляет хотя бы один раз, а получатель отсеивает дубли.

      И отдельно — что обещано о **порядке**:

      - **общий порядок** — все события приходят в том порядке, в каком случились. Дорого и редко;
      - **порядок внутри одной сущности** — события одного заказа приходят по порядку, а события разных заказов
        могут перемешаться. Это частый компромисс: брокеры раскладывают события по ключу, например по номеру заказа;
      - **порядок не обещан** — события приходят как получится.

      Для фронтенда вывод простой: почти всегда приходится жить с «хотя бы один раз» и без обещаний о порядке
      между разными сущностями. Значит, клиент сам отсеивает дубли и сам защищается от старых событий.

      ## Три метки, которые помогают

      ### Номер события

      **Номер события** (event id) — уникальный идентификатор, который источник ставит каждому событию. Если событие
      пришло повторно, номер у него тот же. Клиент помнит номера недавно применённых событий и пропускает те, что уже
      видел. Это называют **отсевом дублей** (deduplication).

      Помнить все номера вечно нельзя, поэтому хранят ограниченное окно: последние тысячу номеров или номера
      за последний час. Окно должно быть больше, чем самая долгая задержка повтора у источника.

      ### Номер в потоке

      **Номер в потоке** (sequence number) — номер события, который растёт на единицу в пределах одного потока:
      1531, 1532, 1533. В сервисе доставки у каждого ресторана свой поток, и сервер нумерует его события по порядку.

      Он даёт клиенту больше, чем просто номер:
      - событие с номером не больше последнего применённого — дубль или старое, его пропускают;
      - если после 1532 пришло 1535 — значит, 1533 и 1534 потерялись. Это **разрыв**, и его нужно закрыть: догнать
        пропущенное или перечитать данные (урок «Снимок и догоняющие события»).

      Номер в потоке работает, только если источник обещает порядок внутри потока. Его же SSE передаёт в поле `id:`,
      а браузер при переподключении отправляет последний в `Last-Event-ID`.

      ### Версия сущности

      **Номер версии** сущности растёт при каждом изменении этой сущности: заказ создан — версия 1, оплачен —
      версия 2, готовится — 3, отменён — 4. Это та же версия, которую курс 2 использовал против старых ответов:
      в уроке «Кэш после изменения» ответ с версией старше той, что уже в кэше, отбрасывают.

      С событиями правило то же: данные о заказе применяют, только если их версия больше известной. Ответ
      «4830 готовится, версия 3», пришедший после события «4830 отменён, версия 4», будет отброшен. Дубль «4812
      оплачен, версия 2» тоже: версия 2 уже применена. Версия защищает от дублей и от перестановок сразу, откуда бы
      ни пришли данные — из потока, из ответа на свой запрос или из перечитанного списка. И она работает при любом
      порядке между разными заказами, потому что сравнивает данные только одного заказа.

      Отсюда важное следствие: заказ, который ушёл с доски, нельзя просто удалить из состояния. Клиент оставляет
      запись «4830 — отменён, версия 4» и только не рисует её. Такую запись называют **надгробием** (tombstone).
      Без неё опоздавший ответ «готовится, версия 3» не с чем будет сравнить, и заказ вернётся на доску. Надгробия
      хранят ограниченное время — дольше, чем может опоздать ответ или повтор события, например до конца смены.

      ### Что когда нужно

      - **Событие несёт состояние сущности** («заказ 4830 в статусе „отменён“, версия 4») — достаточно версии.
      - **Событие несёт действие,** у которого нет версии («в чат пришло сообщение», «кто-то поставил лайк») — нужен
        номер события и отсев дублей.
      - **Нужно знать, что ничего не пропущено** — нужен номер в потоке: только он показывает разрыв.

      ## Применять так, чтобы повтор ничего не испортил

      Даже с метками полезно устроить сами события так, чтобы повтор был безвреден.

      **Состояние, а не изменение.** Событие «статус заказа стал „готовится“, версия 3» можно применить дважды —
      результат тот же. Событие «прибавь единицу к счётчику новых заказов» при повторе даст неверный счётчик.
      Поэтому, где можно, событие несёт новое значение, а не разницу: «новых заказов: 7, версия 31».

      **Побочные действия — по переходу состояния, а не по приходу события.** Звук нового заказа звучит, когда
      на доске появляется заказ, которого там не было, а не на каждое событие «оплачен». Тогда дубль, отброшенный
      или нет, второго звука не вызовет.

      ## Подтверждение доставки — не то же, что «сохранено» или «прочитано»

      **Подтверждение** (acknowledgement, ack) — сигнал получателя «я получил». Но «получил» бывает разным, и важно
      понимать, какое именно.

      1. **Сервер принял запрос** — ответ 200 на отправку. Ещё не значит, что данные надёжно записаны, если сервер
         сначала кладёт их в очередь.
      2. **Сохранено** — запись в базе, переживёт перезапуск сервера.
      3. **Доставлено на устройство получателя** — событие дошло до его браузера или телефона.
      4. **Прочитано** — человек открыл и увидел.

      Каждый следующий уровень не следует из предыдущего. Заказ доставлен на планшет ресторана, но это не значит, что
      повар его видел: планшет мог лежать экраном вниз. Поэтому в сервисе доставки ресторан явно нажимает «Принял»,
      а если за три минуты нажатия нет, поддержка звонит в ресторан. В чатах та же разница видна как «одна галочка» —
      «две галочки» — «прочитано» (об этом урок «Чат и статусы присутствия»).

      ## Пример целиком: доска заказов ресторана

      Событие потока ресторана выглядит так:

      ```
      id: 1532
      event: order
      data: {"orderId": "4812", "version": 2, "status": "paid", "total": 1450, …}
      ```

      Клиент хранит заказы доски по номеру заказа вместе с версией и номер последнего применённого события потока.
      Номер в потоке приходит в поле `id:`, и в обработчике его читают из `e.lastEventId`.

      ```js
      function onStreamEvent(e) {
        const seq = Number(e.lastEventId);              // номер в потоке из поля id:
        if (seq <= lastSeq) return;                      // дубль или старое событие потока
        if (seq > lastSeq + 1) return resync();          // разрыв: что-то пропущено
        lastSeq = seq;
        applyOrder(JSON.parse(e.data));
      }

      function applyOrder(order) {                       // и для событий, и для ответов на запросы повара
        const known = board.get(order.orderId);
        if (known && known.version >= order.version) return;  // эта или более новая версия уже есть
        board.set(order.orderId, order);                 // ушедшие заказы тоже лежат здесь — по ним сравнивают версии
        if (!known && order.status === 'paid') playSound();  // звук — по появлению заказа
      }
      ```

      Как это разбирает обе истории:

      - **Повтор «4812 оплачен».** Брокер повторил событие с тем же номером 1532, а он уже применён — событие
        пропущено. Даже если бы номер был новым, версия 2 уже известна. Второй карточки и второго звука нет.
      - **Опоздавший ответ «4830 готовится».** Его версия 3 меньше известной версии 4 («отменён»). Ответ отброшен,
        отменённый заказ не возвращается.
      - **Разрыв.** Если после 1532 пришло 1535, клиент не гадает, что было в 1533 и 1534, а догоняет пропущенное.

      ## Варианты и их цена

      - **Номер события и отсев дублей**
        - Защищает: от повторов действий без версии.
        - Цена: окно запомненных номеров; от перестановок не защищает.
      - **Номер в потоке**
        - Защищает: от повторов и показывает разрывы.
        - Цена: нужен порядок внутри потока и нумерация на сервере.
      - **Версия сущности**
        - Защищает: от повторов и перестановок событий одной сущности.
        - Цена: каждое событие несёт полное состояние или хотя бы версию; для действий без версии не подходит.
      - **События-состояния вместо событий-изменений**
        - Защищает: повтор безвреден сам по себе.
        - Цена: события тяжелее; не всё удобно выражать состоянием.

      ## Типичные ошибки

      - **Верить, что событие придёт ровно один раз.** Дубль появится при первом же переподключении или повторе
        брокера.
      - **Применять данные в порядке прихода.** Опоздавшее старое событие или ответ воскрешает отменённый заказ.
      - **Удалять ушедшую запись вместе с версией.** Опоздавшему ответу не с чем сравниться, и заказ возвращается.
      - **Счётчики на «+1».** Каждый дубль сдвигает счётчик, и он расходится с правдой.
      - **Звук и уведомления на каждое событие.** Дубль звенит второй раз.
      - **Отсев по окну короче задержки повторов.** Источник повторил событие через час, а клиент помнит номера
        за 10 минут.
      - **Считать «доставлено» «прочитанным».** Ресторан получил заказ на планшет, но его никто не видел.

      ## Как спрашивают на интервью

      - «Что делать, если событие пришло дважды?» — ждут гарантии доставки, номер события или версию и идемпотентное
        применение.
      - «События пришли не по порядку. Как не показать старое состояние?» — ждут версию сущности.
      - «Чем „доставлено“ отличается от „прочитано“?» — ждут уровни подтверждения.

      ## Коротко

      - Источники событий обычно обещают «хотя бы один раз»: событие не потеряется, но может прийти повторно;
        «ровно один раз» на деле получают отсевом дублей у получателя.
      - Порядок чаще всего обещан в лучшем случае внутри одной сущности, поэтому клиент сам защищается от старых
        событий.
      - Версия сущности отбрасывает и дубли, и опоздавшие старые события одной сущности; для событий-действий без
        версии нужен номер события и отсев дублей.
      - Ушедшую запись не удаляют, а держат надгробием с версией, иначе опоздавший старый ответ вернёт её на экран.
      - Только номер в потоке показывает разрыв — что какие-то события пропущены и их нужно догнать.
      - События лучше нести состоянием («стало X, версия 7»), а не изменением («прибавь единицу»), а звук и уведомления
        привязывать к переходу состояния, а не к приходу события.
      - Подтверждение бывает разного уровня: принято сервером, сохранено, доставлено на устройство и прочитано —
        одно не следует из другого.

      ## Источники

      - [Amazon SQS at-least-once delivery — AWS](https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues-at-least-once-delivery.html)
      - [Использование событий, отправленных сервером: формат потока — MDN](https://developer.mozilla.org/ru/docs/Web/API/Server-sent_events/Using_server-sent_events#формат_потока_событий)

  - id: sdl-resync
    topic: Системы реального времени
    subtopic: Снимок и пересинхронизация
    title: Снимок и догоняющие события
    body: |
      ## Какую проблему решаем

      Доска заказов ресторана открывается в два шага: сначала загружается список текущих заказов, потом открывается
      поток событий, по которому приходят новые. Обычно всё работает. Но иногда заказ, оплаченный в момент открытия
      доски, не появляется на ней вовсе — пока повар не перезагрузит страницу.

      Вот как это происходит, по миллисекундам:

      1. 19:00:00.000 — клиент запрашивает список заказов. Сервер собирает его и отвечает.
      2. 19:00:00.400 — покупатель оплачивает заказ 4851. Сервер рассылает событие всем, кто подписан.
      3. 19:00:00.600 — клиент получил список и открывает поток. Событие о заказе 4851 уже разослано — без него.

      Заказ 4851 не попал ни в список (его собрали раньше оплаты), ни в поток (подписка открылась позже). Он
      провалился в **разрыв между снимком и подпиской**.

      Если поменять шаги местами — сначала поток, потом список, — появится другая беда: событие, пришедшее до списка,
      применится, а потом список, собранный чуть раньше этого события, затрёт его старыми данными.

      Тот же разрыв возникает после каждого обрыва связи: пока соединения не было, события шли без клиента.
      Урок о том, как совместить загрузку данных и поток изменений и не потерять ни одного события.

      ## Снимок и поток изменений

      Два понятия.

      - **Снимок** (snapshot) — состояние данных на определённый момент: список заказов доски, как он выглядел
        на сервере, когда его собирали.
      - **Поток изменений** — события о том, что изменилось после.

      Ключ к совмещению — **позиция в потоке**: снимок сообщает, на каком событии он собран. В сервисе доставки это
      номер в потоке ресторана из урока «События: дубли и порядок».

      ```http
      GET /restaurants/r-7/board
      → { "orders": [ … ], "position": 1532 }
      ```

      Ответ значит: «это доска со всеми событиями по 1532-е включительно». Подписка открывается с этой позиции,
      и сервер шлёт события с 1533-го:

      ```js
      const { orders, position } = await loadBoard();
      showBoard(orders);
      lastSeq = position;
      const source = new EventSource(`/restaurants/r-7/live?after=${position}`);
      ```

      Позицию передают в адресе, потому что при первом открытии `EventSource` не умеет отправить свой заголовок.
      При переподключениях браузер сам пришлёт последний номер в `Last-Event-ID`, а сервер возьмёт тот, что новее.

      Теперь событие о заказе 4851 (номер 1533) случилось после снимка, и сервер отдаст его подписке, даже если она
      открылась позже. Разрыва нет.

      ![Сверху — неверный порядок: снимок собран на событии 1532, событие 1533 «оплачен заказ 4851» происходит до того, как открылась подписка, и теряется. Снизу — верный: снимок отдаёт позицию 1532, подписка открывается «после 1532», и сервер присылает событие 1533 из своей истории](images/sdl-resync.png "Подписка начинается с позиции снимка")

      Это не придумка сервиса доставки, а распространённый приём. Так устроен, например, API Kubernetes: клиент
      запрашивает список и получает вместе с ним номер версии (`resourceVersion`), а потом подписывается
      на изменения начиная с этого номера.

      ### Если сервер не отдаёт позицию

      Бывает, что поток не нумерован и подписаться «с позиции» нельзя. Тогда делают наоборот:

      1. открывают подписку и складывают приходящие события в буфер, не применяя;
      2. загружают снимок;
      3. применяют из буфера только то, что новее снимка, сверяя версии каждой записи (урок «События: дубли и
         порядок»): если версия заказа в событии не больше, чем в снимке, событие уже учтено.

      Так тоже ничего не теряется, но нужны версии у каждой записи, а разрывы, случившиеся позже, клиент не увидит:
      для этого нужен номер в потоке.

      ## Три пути после обрыва

      После обрыва связи клиент знает свою позицию — номер последнего применённого события. Дальше три пути.

      ### Догнать

      **Догнать** (replay) — попросить у сервера события после своей позиции и применить их по порядку. SSE делает
      первый шаг сам: при переподключении браузер отправляет `Last-Event-ID`, и сервер досылает пропущенное.

      Это самый дешёвый путь: передаются только изменения. Но у него есть предел — сервер хранит историю ограниченное
      время. В сервисе доставки события потока ресторана хранятся час, а кластеры Kubernetes с хранилищем etcd 3
      по умолчанию хранят изменения за пять минут.

      ### Перечитать снимок

      **Перечитать снимок** (refetch) — загрузить данные заново, получить новую позицию и подписаться с неё.

      Это нужно, когда догнать нельзя или невыгодно:
      - **история уже стёрта.** Клиент просит события после 1532, а сервер их больше не хранит. Kubernetes в этом
        случае отвечает `410 Gone`, и документация требует от клиента очистить локальные данные, заново загрузить
        список и подписаться с новой позиции. Для SSE ответ с ошибкой не годится — `EventSource` сдастся, — поэтому
        сервер вместо истории присылает служебное событие «история недоступна, перечитайте»;
      - **пропущено слишком много.** Если за время обрыва случилось 20 000 событий, а сама доска — 40 заказов,
        перечитать доску дешевле, чем применять 20 000 событий. Решает это сервер: он видит разницу между позицией
        клиента и текущей и вместо 20 000 событий присылает то же служебное событие «перечитайте».

      Пока снимок загружается, события продолжают приходить. Их буферизуют и после снимка применяют только те, что
      новее его позиции.

      ### Полностью пересобрать

      **Полная пересинхронизация** — выбросить всё, что клиент знает об этих данных, включая то, что из них
      вычислено: счётчики, выбор, очереди звуков и уведомлений, кэши соседних экранов. И построить картину заново,
      как при первом открытии.

      Перечитанный снимок аккуратно сливается с тем, что есть на экране: открытая карточка остаётся открытой,
      прокрутка на месте. Полная пересинхронизация так не умеет и нужна, когда локальным данным больше нельзя
      доверять:
      - клиент нашёл противоречие, которое не объясняется пропуском событий: например, событие о заказе, которого
        нет ни на доске, ни в истории, с версией из середины;
      - сервер сменил формат данных или потерял историю целиком и сообщил новую «эпоху» потока;
      - клиент восстановил данные из хранилища на устройстве после перезапуска или обновления приложения,
        и неизвестно, на какой позиции они собраны.

      ### Как выбирать

      - **Обрыв короче истории сервера и событий немного** — догнать.
      - **История стёрта или событий больше, чем данных** — перечитать снимок. Долгий обрыв сам по себе — это
        перечитывание снимка, а не полная пересборка.
      - **Локальное состояние нельзя доверять** — полностью пересобрать.

      ## Пример целиком: на кухне пропал Wi-Fi на десять минут

      19:20, ужин. Роутер на кухне завис, доска десять минут без связи. Последнее применённое событие — 1532.

      1. Через 45 секунд тишины клиент понимает, что соединение умерло (урок «Соединение: обрывы и возвраты»),
         и показывает над доской «Нет связи, данные на 19:20». Попытки переподключения идут с растущей паузой.
      2. В 19:30 Wi-Fi вернулся. `EventSource` переподключается, браузер отправляет `Last-Event-ID: 1532`.
      3. Десять минут меньше часа истории, поэтому сервер досылает события 1533–1547: шесть новых заказов, четыре
         смены статуса, две отмены, три «курьер забрал».
      4. Клиент применяет их по порядку с проверкой версий. Две карточки уходят как отменённые, три — как забранные,
         шесть новых появляются.
      5. Звук — один, с надписью «6 новых заказов за время без связи», а не шесть звонков подряд. Для этого сервер,
         дослав пропущенное, присылает служебное событие «догнали». Пока его нет, клиент не играет звук на каждый
         новый заказ, а считает их, и после «догнали» звучит один раз.
      6. Надпись «Нет связи» сменяется на «Обновлено только что».

      А если бы планшет пролежал без связи всю ночь (история урока «Соединение: обрывы и возвраты»), сервер ответил
      бы служебным событием «история недоступна», и клиент перечитал бы доску целиком.

      ## Варианты и их цена

      - **Подписка с позиции снимка**
        - Плюсы: разрыва нет, ничего не буферизуется.
        - Цена: сервер нумерует поток и хранит историю.
      - **Буфер событий до снимка и сверка версий**
        - Плюсы: работает без позиций в потоке.
        - Цена: версии у каждой записи; разрывы потом не видны.
      - **Догнать**
        - Плюсы: дёшево — передаются только изменения.
        - Цена: работает, пока история сервера не стёрта.
      - **Перечитать снимок**
        - Плюсы: работает после любого обрыва.
        - Цена: загрузка всех данных; волна перечитываний после перезапуска сервера.
      - **Полностью пересобрать**
        - Плюсы: исправляет любое расхождение.
        - Цена: человек теряет открытые карточки, выбор и место на экране.

      ## Типичные ошибки

      - **Загрузить список, потом открыть поток — и ничего не связать.** События в промежутке пропадают.
      - **Открыть поток, загрузить список и применять всё подряд.** Старый список затирает свежие события.
      - **Считать, что сервер хранит историю вечно.** После ночи без связи клиент ждёт пропущенное, а его уже нет.
      - **Догонять, когда дешевле перечитать.** 20 000 событий ради доски из 40 заказов.
      - **Звонить на каждое догнанное событие.** После обрыва доска звенит шесть раз подряд.
      - **Пересобирать всё при каждом обрыве.** Человек теряет открытую карточку из-за секундного сбоя сети.

      ## Как спрашивают на интервью

      - «Как загрузить список и подписаться на изменения, не потеряв событие между ними?» — ждут позицию в снимке
        и подписку с неё или буфер со сверкой версий.
      - «Клиент был без сети час. Как он вернётся к актуальному состоянию?» — ждут три пути и критерии выбора.
      - «Что делать, если сервер больше не хранит пропущенные события?» — ждут перечитывание снимка по явному сигналу
        сервера.

      ## Коротко

      - Если загрузить снимок и открыть поток независимо, событие между ними потеряется, а в обратном порядке старый
        снимок затрёт свежие события.
      - Снимок должен сообщать позицию в потоке, на которой собран, а подписка — начинаться с этой позиции; так устроен,
        например, список и подписка в API Kubernetes.
      - Без позиций события до снимка буферизуют и после снимка применяют только то, что новее по версии записи.
      - После обрыва короче истории сервера пропущенное догоняют с номера последнего события — это дешевле всего.
      - Если история стёрта или событий больше, чем данных, перечитывают снимок по служебному сигналу сервера и снова
        подписываются с новой позиции.
      - Полную пересинхронизацию, которая сбрасывает и вычисленное из данных, оставляют для случаев, когда локальному
        состоянию нельзя доверять.

      ## Источники

      - [Kubernetes API Concepts: Efficient detection of changes — Kubernetes](https://kubernetes.io/docs/reference/using-api/api-concepts/#efficient-detection-of-changes)
      - [Server-sent events: Last-Event-ID — HTML Standard](https://html.spec.whatwg.org/multipage/server-sent-events.html#the-last-event-id-header)

  - id: sdl-realtime-ux
    topic: Системы реального времени
    subtopic: Реальное время глазами пользователя
    title: Чат и статусы присутствия
    body: |
      ## Какую проблему решаем

      Покупатель едет в лифте и пишет курьеру: «Код домофона 45К». Связь в лифте плохая. Первая версия чата
      показывала сообщение, только когда сервер его подтвердил, — и человек три секунды смотрел на пустой чат,
      нажал «Отправить» ещё раз, и курьер получил два одинаковых сообщения.

      Вторая версия показывала сообщение сразу. Теперь дублей не было, но начались другие странности:
      - ответ курьера «Буду через 5 минут» иногда оказывался в ленте выше вопроса, на который он отвечал;
      - надпись «Курьер печатает…» висела по десять минут после того, как курьер убрал телефон;
      - на карте у поддержки, где видны все курьеры города, точки двигались рывками, а вкладка тормозила.

      Чат и карта — это поток событий, который человек видит глазами. Урок о том, что добавляет реальное время
      к оптимистичному интерфейсу из курса 2 и как часто обновлять экран, когда событий много.

      ## Отправка до ответа сервера

      В курсе 2, в уроке «Оптимистичные обновления», мы показывали изменение сразу, не дожидаясь сервера, и давали
      ему **временный идентификатор**. Чат — тот же приём, но с особенностью: подтверждение приходит не только ответом
      на отправку, но и по потоку, вместе с сообщениями остальных участников.

      Как это устроено:

      1. Человек нажал «Отправить». Клиент сразу добавляет сообщение в ленту с временным id — в сервисе доставки
         это `clientId`, случайный UUID, — и пометкой «отправляется» (значок часов).
      2. Сообщение уходит на сервер по WebSocket вместе с `clientId`.
      3. Сервер сохраняет сообщение, даёт ему настоящий id и номер в чате и рассылает всем участникам, в том числе
         отправителю. В рассылке есть тот же `clientId`.
      4. Отправитель узнаёт по `clientId` своё сообщение и заменяет временное настоящим. Дубля нет, лента не мигает.

      В протоколе мессенджеров Matrix этот приём описан явно: показ своего сообщения сразу называется **локальным
      эхом** (local echo), а то же сообщение, пришедшее по потоку, — **удалённым эхом** (remote echo). Спецификация
      советует сопоставлять их по идентификатору транзакции, который клиент дал при отправке, иначе лента мигнёт
      или покажет сообщение дважды: удалённое эхо иногда приходит раньше ответа на отправку.

      **Повтор неудавшейся отправки.** Если подтверждения нет за 10 секунд или соединение оборвалось, сообщение
      помечается «Не отправлено» с кнопкой «Повторить». Повтор — и ручной, и автоматический после переподключения —
      идёт с тем же `clientId`. Он работает как **ключ идемпотентности** (курс 2, «Повторы без двойных списаний»):
      если первая попытка всё-таки дошла, сервер узнает повтор и не создаст второе сообщение.

      ## Порядок в ленте

      Порядок сообщений задаёт сервер — номером в чате, который он даёт при сохранении. Часы телефонов для этого
      не годятся: они расходятся, иногда на минуты.

      - Подтверждённые сообщения стоят по номеру от сервера.
      - Неподтверждённые свои — внизу ленты, в порядке отправки.
      - Когда своё сообщение подтвердилось, оно встаёт на место по номеру. Иногда это не самый низ: если курьер
        написал раньше, чем сервер получил ваше сообщение, его ответ окажется выше.

      Если отправлено несколько сообщений подряд, а соединение оборвалось, после переподключения неотправленные
      уходят заново по порядку, каждое со своим `clientId`.

      ## Статусы с разными гарантиями

      Кроме сообщений, в чате живут статусы. Их легко свалить в одну кучу, но гарантии у них разные.

      - **«В сети»** — **присутствие** (presence). Сервер выводит его из открытого соединения и пингов: нет пинга
        минуту — человек не в сети. Это приблизительная информация, которую можно терять. Честнее показывать
        «был в сети 5 минут назад», чем уверенное «не в сети».
      - **«Печатает»** — мимолётное событие с гарантией «не больше одного раза». Его не хранят и не повторяют.
        Клиент печатающего отправляет «печатаю» не чаще раза в три секунды, пока человек набирает текст.
        У получателя надпись живёт 5 секунд без обновления и гаснет сама. Потерялось событие — надпись мигнёт или
        не появится, и ничего страшного. Зато никогда не зависнет: срок действия у неё встроенный.
      - **«Доставлено»** — сообщение сохранено сервером (одна галочка) или дошло до устройства получателя (две
        галочки). Это подтверждения разного уровня из урока «События: дубли и порядок».
      - **«Прочитано»** — человек увидел сообщение. Его отправляют, когда сообщение действительно на экране
        и вкладка видна, а не когда оно пришло. Удобно хранить его как **метку «прочитано до»**: «прочитаны все
        сообщения по номер 128 включительно». Так устроены отметки о прочтении в Matrix: одна метка на участника
        вместо отметки на каждое сообщение. Метка только растёт, поэтому старая или повторная просто отбрасывается.

      Отсюда правило: сообщения и метки прочтения нельзя терять — они сохраняются на сервере и догоняются после
      обрыва. «Печатает» и «в сети» можно терять, но у них должен быть срок действия, иначе потеря превращается
      в вечное «печатает».

      ## Как часто обновлять экран

      В чате событий немного. Но на карте поддержки видны все курьеры города: в пик 2000 курьеров, каждый присылает
      координаты раз в 5 секунд — 400 событий в секунду на один экран. Если на каждое событие обновлять состояние
      и перерисовывать карту, основной поток не успевает, и всё тормозит (урок «Тяжёлая работа без зависаний»).

      Экран всё равно меняется не чаще раза в кадр — около 60 раз в секунду. Поэтому события копят и применяют
      **пакетом** (batching):

      ```js
      const pending = new Map();               // courierId → последняя точка
      let scheduled = false;
      function onCourierEvent(point) {
        pending.set(point.courierId, point);   // промежуточные точки затираются
        if (!scheduled) {
          scheduled = true;
          requestAnimationFrame(flush);
        }
      }
      function flush() {
        scheduled = false;
        updateMarkers([...pending.values()]);  // одно обновление на кадр
        pending.clear();
      }
      ```

      Здесь работают два приёма:
      - **пакетная обработка** — одно обновление состояния и одна перерисовка на кадр, а не на каждое событие;
      - **пропуск промежуточных состояний** — если за кадр от одного курьера пришло две точки, рисуется только
        последняя. Для координат и счётчиков промежуточные значения не нужны. Для сообщений чата — нужны все,
        их не пропускают.

      Ещё два решения уменьшают работу:
      - **рисовать только видимое** — курьеры за краем карты обновляются в данных, но не на экране;
      - **не рисовать в скрытой вкладке** — события применяются к данным, а перерисовка ждёт, пока вкладка снова
        станет видна.

      Для одной точки курьера у покупателя событий мало — раз в 5 секунд. Там задача обратная: чтобы точка
      не прыгала, её **плавно перемещают** между двумя последними положениями за эти 5 секунд.

      ## Пример целиком: чат покупателя с курьером

      1. Покупатель пишет «Код домофона 45К». Сообщение сразу в ленте, с часами. `clientId` — `c-7f3a…`.
      2. Связь в лифте пропала. Через 10 секунд подтверждения нет — у сообщения «Не отправлено, повторить».
      3. Лифт приехал, соединение вернулось. Клиент сам отправляет сообщение повторно с тем же `clientId`. Первая
         попытка, оказывается, дошла: сервер узнаёт `clientId` и не создаёт второе сообщение, а возвращает то же,
         с номером 41.
      4. Пока покупатель был в лифте, курьер написал «Подъезжаю» — номер 40. Клиент догнал его после переподключения.
         В ленте: «Подъезжаю» (40), потом «Код домофона 45К» (41).
      5. Курьер начинает печатать — у покупателя «Курьер печатает…». Курьер убрал телефон в карман — через
         5 секунд без обновления надпись гаснет.
      6. Курьер открыл чат — его клиент отправляет «прочитано до 41». У покупателя появляется «Прочитано».

      ## Варианты и их цена

      - **Показывать сообщение после ответа сервера**
        - Плюсы: никаких временных состояний.
        - Цена: на плохой связи чат кажется сломанным, человек жмёт «Отправить» снова.
      - **Локальное эхо с временным id**
        - Плюсы: мгновенный отклик.
        - Цена: сопоставление по `clientId`, статусы «отправляется» и «не отправлено», повтор с тем же id.
      - **Каждое событие — сразу на экран**
        - Плюсы: просто.
        - Цена: при сотнях событий в секунду — долгие задачи и рывки.
      - **Пакет раз в кадр с пропуском промежуточных**
        - Плюсы: одно обновление на кадр при любом потоке.
        - Цена: подходит только для данных, где важно последнее значение.

      ## Типичные ошибки

      - **Новый id при повторе отправки.** Сервер не узнает повтор, и курьер получит сообщение дважды.
      - **Сортировать ленту по часам телефона.** Сообщения с расходящихся устройств перемешиваются.
      - **«Печатает» без срока действия.** Потерянное «перестал печатать» оставляет надпись навсегда.
      - **«Прочитано» при получении.** Сообщение пришло на телефон в кармане, а отправитель видит «прочитано».
      - **Перерисовка на каждое событие.** 400 событий в секунду — 400 перерисовок вместо 60.
      - **Пропускать промежуточные сообщения чата.** Пропуск годится для координат, а не для сообщений.

      ## Как спрашивают на интервью

      - «Спроектируйте чат. Что видит человек, пока сообщение отправляется?» — ждут локальное эхо, временный id,
        сопоставление и повтор с тем же id.
      - «Как реализовать „печатает“ и „прочитано“?» — ждут разные гарантии: срок действия у «печатает», метку
        «прочитано до» и отправку по видимости.
      - «На карте тысячи движущихся точек. Как не тормозить?» — ждут пакет на кадр, пропуск промежуточных и отрисовку
        только видимого.

      ## Коротко

      - Своё сообщение показывают сразу с временным id и пометкой «отправляется», а затем узнают его в потоке по тому
        же id и заменяют настоящим; в Matrix это называют локальным и удалённым эхом.
      - Повтор неудавшейся отправки идёт с тем же временным id: он служит ключом идемпотентности, и сервер не создаёт
        дубль.
      - Порядок в ленте задаёт номер от сервера, а не часы телефона; неподтверждённые свои сообщения стоят внизу.
      - «В сети» и «печатает» можно терять, но у них должен быть срок действия; сообщения и метки прочтения терять
        нельзя.
      - «Прочитано» отправляют, когда сообщение действительно видно, и хранят меткой «прочитано до», которая только
        растёт.
      - Когда событий сотни в секунду, их применяют пакетом раз в кадр и пропускают промежуточные значения там, где
        важно только последнее, — для координат, но не для сообщений.

      ## Источники

      - [Local echo — Matrix Client-Server API](https://spec.matrix.org/latest/client-server-api/#local-echo)
      - [Receipts — Matrix Client-Server API](https://spec.matrix.org/latest/client-server-api/#receipts)
      - [requestAnimationFrame — MDN](https://developer.mozilla.org/ru/docs/Web/API/Window/requestAnimationFrame)

  - id: sdl-notifications
    topic: Системы реального времени
    subtopic: Уведомления
    title: Уведомления
    body: |
      ## Какую проблему решаем

      Курьер подъехал к дому. Покупатель давно закрыл вкладку с отслеживанием и смотрит сериал. Курьер звонит, но
      телефон на беззвучном. Через десять минут курьер уезжает к следующему заказу.

      Продукт хочет, чтобы в такой момент у покупателя на экране появилось «Курьер подъехал» — даже если сайт
      закрыт. Первая версия просила разрешение на уведомления сразу, при первом заходе на сайт. Большинство нажали
      «Блокировать» и больше этот вопрос не увидят.

      А в кабинете ресторана другая беда: новые заказы должны приходить со звуком, но после перезагрузки страницы
      звука нет — браузер его не пропускает.

      Урок о трёх видах уведомлений — внутри приложения, счётчик непрочитанного и push-уведомления, — и о том, как
      сделать, чтобы они доходили, не надоедали и не врали.

      ## Три вида уведомлений

      - **Уведомление в приложении** — сообщение внутри открытой страницы: всплывающая плашка, звук, значок
        у колокольчика. Работает, только пока страница открыта. Приходит по тому же каналу живых данных, что
        и остальное: SSE или WebSocket. Для экранного чтеца такие сообщения объявляют через живую область
        (`aria-live`, курс «Доставка и качество», урок «Доступность в архитектуре»).
      - **Счётчик непрочитанного** — число на значке: «3 новых сообщения». Должен совпадать на всех экранах
        и устройствах человека.
      - **Push-уведомление** — системное уведомление операционной системы, которое приходит, даже когда сайт
        закрыт. Это совсем другой механизм, разберём его подробно.

      ## Как push доходит до закрытой вкладки

      Если вкладка закрыта, на странице нет ни JavaScript, ни соединения. Поэтому push работает через три
      дополнительных участника.

      **Service Worker** — скрипт, который браузер регистрирует для сайта и запускает отдельно от страниц. Он живёт
      без открытых вкладок: браузер будит его, когда для сайта есть событие, например пришло push-сообщение, и снова
      усыпляет. Без Service Worker push не придёт в закрытую вкладку: его некому будет принять. Подробно о нём —
      в курсе «Доставка и качество», в уроке «Service Worker и обновления».

      **Служба push** (push service) — сервер разработчика браузера: у Chrome — свой, у Firefox — свой, у Safari —
      Apple. Сайт не может достучаться до браузера напрямую, поэтому отправляет сообщение в эту службу, а служба
      доставляет его на устройство.

      **Подписка** (push subscription) — адрес в службе push для конкретного браузера на конкретном устройстве
      и ключи шифрования. Её создаёт страница вызовом `registration.pushManager.subscribe()` и отправляет на свой
      сервер.

      Путь сообщения:

      1. Страница просит разрешение на уведомления, регистрирует Service Worker, создаёт подписку и отправляет её
         на сервер сервиса доставки.
      2. Курьер нажал «На месте». Сервер сервиса доставки отправляет зашифрованное сообщение на адрес подписки
         в службе push.
      3. Служба push доставляет сообщение на устройство. Браузер будит Service Worker событием `push`.
      4. Service Worker показывает системное уведомление вызовом `showNotification()`. Нажатие на уведомление
         приходит ему же событием `notificationclick`, и он открывает страницу отслеживания.

      В Chrome при подписке нужно пообещать параметром `userVisibleOnly: true`, что каждое push-сообщение покажет
      уведомление: молча будить сайт в фоне нельзя.

      ### Доставка не гарантирована

      Push — это «по возможности» (best-effort):
      - телефон выключен или без сети — служба push хранит сообщение ограниченное время. Этот срок хранения сервер
        задаёт при отправке заголовком `TTL`; если устройство не появилось в сети за этот срок, сообщение пропадёт.
        Это не срок свежести кэша из курса 2, хотя сокращение то же;
      - человек отключил уведомления в системе или в браузере;
      - подписка устарела: браузер переустановили, данные сайта очистили. Служба push ответит серверу, что адреса
        больше нет, и сервер должен удалить подписку;
      - на iPhone и iPad push работает начиная с iOS и iPadOS 16.4 и только для веб-приложений, добавленных на экран
        «Домой». В обычной вкладке Safari его нет.

      Поэтому push не может быть единственным каналом для важного. «Курьер подъехал» дублируется звонком курьера,
      а для покупателей без push — SMS, если это разрешено.

      ## Когда просить разрешение

      Разрешение на уведомления браузер спрашивает один раз. Если человек нажал «Блокировать», сайт больше не может
      спросить: вернуть разрешение можно только в настройках браузера, и почти никто этого не делает. Поэтому
      момент вопроса решает всё.

      - **Не при загрузке страницы.** web.dev называет это худшим, что можно сделать: человек ещё не понимает,
        зачем сайту уведомления, и блокирует.
      - **В контексте и после действия человека.** Спрашивают, когда польза очевидна: после оформления заказа,
        в момент «сообщить, когда курьер подъедет?».
      - **Сначала своё окно, потом браузерное.** Сайт показывает свою кнопку или плашку с объяснением, и только
        если человек согласился, вызывает `Notification.requestPermission()`. Отказ в своём окне ничего не стоит:
        спросить можно позже. Приём называют **двойным запросом** (double permission).
      - **По нажатию.** Safari на iPhone и iPad и Firefox показывают запрос разрешения только в ответ на действие
        человека, например нажатие кнопки.
      - **Дать выход.** Показать, где уведомления выключить. Иначе раздражённый человек заблокирует их навсегда.

      ## Счётчик, который сходится

      Счётчик непрочитанного живёт на нескольких экранах: значок в шапке, список чатов, вкладка на телефоне.
      Если каждый экран считает сам — «+1» на новое сообщение, «−1» на прочтение, — счётчики расходятся: дубль события
      даёт лишнюю единицу, прочтение на другом устройстве не доходит, и счётчик уходит в минус.

      Правило из урока «События: дубли и порядок»: событие несёт состояние, а не изменение.

      - **Источник истины — сервер.** Он считает непрочитанное по меткам «прочитано до» из прошлого урока.
      - **Событие несёт число с версией:** «непрочитанных: 3, версия 57». Клиент применяет его, только если версия
        больше известной. Дубль и опоздавшее событие ничего не портят.
      - **Прочтение на одном устройстве** отправляет метку на сервер, сервер пересчитывает и рассылает новое число
        всем устройствам человека.
      - **Оптимистично можно обнулить** счётчик открытого чата сразу, не дожидаясь сервера, — а потом принять число
        от сервера.

      ## Не уведомлять дважды

      Если у покупателя открыта вкладка с отслеживанием, он видит «Курьер подъехал» на странице. Если тут же придёт
      ещё и системное уведомление, это лишний шум. Проще всего решить это на сервере: он знает, открыто ли у человека
      живое соединение, и отправляет push, только если соединения нет или событие не прочитано через заданное время.
      Дублировать решение в Service Worker сложнее: в Chrome каждое push-сообщение должно показать уведомление.

      ## Звук в кабинете ресторана

      Браузеры не дают сайтам играть звук, пока человек с сайтом не взаимодействовал. В Chrome звук разрешён после
      нажатия или касания на сайте, а созданный до этого `AudioContext` (интерфейс Web Audio API) запускается
      в приостановленном состоянии, и его нужно возобновить вызовом `resume()` после нажатия. Это называют
      **политикой автовоспроизведения** (autoplay policy).

      Поэтому доска заказов открывается с кнопкой «Начать смену». Нажатие на неё включает звук на весь сеанс
      страницы. Если страница перезагрузилась, а кнопку ещё не нажали, над доской висит заметная плашка «Звук
      выключен — нажмите, чтобы включить», а новые заказы мигают.

      Звук играет, только пока страница работает. Если экран планшета погаснет, браузер скроет страницу и может
      её заморозить, и новый заказ пройдёт молча. Поэтому по нажатию «Начать смену» доска ещё и просит не гасить
      экран: [**Screen Wake Lock API**](https://developer.mozilla.org/en-US/docs/Web/API/Screen_Wake_Lock_API),
      вызов `navigator.wakeLock.request('screen')`. Работает он только по HTTPS,
      а блокировка снимается, когда страницу скрывают, — например, повар переключился на другую вкладку. Поэтому
      её запрашивают снова при возврате (событие `visibilitychange`). Система может и отказать — например,
      в режиме экономии энергии. Тогда планшет настраивают не засыпать, а пропущенный заказ страхует звонок
      поддержки через три минуты.

      ## Пример целиком

      **Покупатель.**
      1. После оформления первого заказа на экране отслеживания — плашка «Сообщить, когда курьер подъедет?»
         с кнопками «Да» и «Не сейчас».
      2. «Да» — и только теперь браузерный запрос разрешения. Разрешили — Service Worker создаёт подписку,
         клиент отправляет её на сервер.
      3. Курьер нажал «На месте». Если у покупателя открыто отслеживание, он видит плашку на странице. Если нет —
         сервер отправляет push со сроком хранения в службе push 5 минут (`TTL: 300`): позже это уведомление уже
         бесполезно.
      4. Нажатие на уведомление открывает страницу отслеживания.
      5. Если подписки нет — человек отказался или у него iPhone без приложения на экране «Домой», — сервер
         отправляет SMS.

      **Ресторан.**
      1. Повар нажимает «Начать смену» — звук включён, экран планшета не гаснет.
      2. Новый заказ приходит по SSE: карточка, звук, счётчик «Новые: 4» с версией от сервера.
      3. Если заказ не принят за три минуты, поддержка звонит в ресторан (урок «События: дубли и порядок»).

      ## Варианты и их цена

      - **Уведомление в приложении**
        - Когда: страница открыта.
        - Цена: почти ничего; не работает при закрытой вкладке.
      - **Push-уведомление**
        - Когда: важное событие, а сайт закрыт.
        - Цена: Service Worker, подписки на сервере, разрешение, которое легко потерять; доставка не гарантирована.
      - **SMS или звонок**
        - Когда: критичное событие, без которого процесс ломается.
        - Цена: деньги за каждое сообщение, нужен номер телефона.
      - **Счётчик по событиям «+1» и «−1»**
        - Цена: расходится и уходит в минус при первом дубле.
      - **Счётчик-состояние от сервера с версией**
        - Цена: сервер считает непрочитанное и рассылает число всем устройствам.

      ## Типичные ошибки

      - **Спрашивать разрешение при загрузке.** Большинство блокирует, и спросить снова уже нельзя.
      - **Push как единственный канал для критичного.** Часть сообщений не дойдёт, а на iPhone без экрана «Домой»
        push нет вовсе.
      - **Не удалять устаревшие подписки.** Сервер шлёт сообщения в пустоту.
      - **Счётчик «+1/−1» на клиенте.** Дубли и прочтение на другом устройстве уводят его в минус.
      - **Два уведомления на одно событие.** Плашка на странице и системное уведомление одновременно.
      - **Рассчитывать на звук без нажатия.** Браузер его не воспроизведёт, а повар не узнает о заказе.
      - **Дать экрану погаснуть.** Скрытую страницу браузер может заморозить, и доска замолчит.

      ## Как спрашивают на интервью

      - «Как отправить уведомление пользователю, если вкладка закрыта?» — ждут Service Worker, службу push, подписку
        и оговорку о недоставке.
      - «Когда просить разрешение на уведомления?» — ждут контекст, двойной запрос и необратимость блокировки.
      - «Как сделать счётчик непрочитанного, который совпадает на всех устройствах?» — ждут сервер как источник
        истины и число с версией вместо «+1».

      ## Коротко

      - Уведомление в приложении работает, пока страница открыта; push приходит и в закрытую вкладку, но требует
        Service Worker, разрешения и подписки в службе push.
      - Доставка push не гарантирована: устройство может быть без сети дольше, чем служба push хранит сообщение,
        подписка — устареть, а на iPhone push есть только у приложений на экране «Домой»; критичное дублируют другим
        каналом.
      - Отказ в разрешении почти необратим, поэтому спрашивают не при загрузке, а в контексте, после своего
        объяснения и в ответ на нажатие.
      - Счётчик непрочитанного считает сервер и присылает числом с версией; счёт «+1/−1» на клиенте расходится
        и уходит в минус.
      - Чтобы не уведомлять дважды, сервер отправляет push, только если у человека нет открытого живого соединения
        или событие долго не прочитано.
      - Звук браузер разрешает только после нажатия на сайте, поэтому экран со звуком начинается с явной кнопки;
        эта же кнопка просит не гасить экран (Screen Wake Lock), иначе скрытая страница замолчит.

      ## Что вы теперь умеете

      - Находить, какой предел упёрся у большого списка — сеть, память, документ или вычисления, — и решать, что
        считать на сервере, а что в браузере.
      - Решать, нужна ли виртуализация, и делать виртуальный список, который не теряет позицию, фокус и доступность.
      - Не замораживать страницу тяжёлой работой: сокращать её, разбивать, уносить в Web Worker и отличать частоту
        запусков от приоритета отрисовки.
      - Проектировать «выбрать всё» в частично загруженном списке и массовые действия по фильтру.
      - Выбирать транспорт живых данных по сценарию и переживать обрывы, сон устройства и перезапуск сервера.
      - Применять события так, чтобы дубли и перестановки ничего не портили, и не терять события между снимком
        и подпиской.
      - Проектировать чат, статусы присутствия и уведомления с честными гарантиями.

      ## Что дальше

      Следующий курс — «Синхронизация и офлайн». Здесь у каждых данных был один источник истины — сервер, а клиент
      догонял его по событиям. Там данные будут меняться в нескольких местах сразу: в нескольких вкладках одного
      человека, у нескольких людей в одном документе и на устройстве без сети. Пригодится всё из этого курса:
      номера событий и версии, снимок и догоняющие события, локальное эхо.

      ## Источники

      - [Push API — MDN](https://developer.mozilla.org/ru/docs/Web/API/Push_API)
      - [Permission UX — web.dev](https://web.dev/articles/push-notifications-permissions-ux)
      - [Web Push for Web Apps on iOS and iPadOS — WebKit](https://webkit.org/blog/13878/web-push-for-web-apps-on-ios-and-ipados/)

questions:
  - id: sdl-intro-001
    topic: Введение
    subtopic: Большие и живые данные
    level: junior
    question: |
      В дашборде аналитики интернет-магазина есть отчёт «Продажи за год». Когда человек меняет период, отчёт
      пересчитывает в браузере полмиллиона продаж, и вкладка на несколько секунд перестаёт отвечать на нажатия.
      Новые продажи в отчёт не приходят: он строится по данным на момент открытия. К какой части курса относится
      эта проблема?
    options:
      - text: 'Интерфейс на больших объёмах'
        correct: true
        why: 'Данных так много, что их обработка в браузере замораживает страницу. Где считать и как не блокировать нажатия, разбирают уроки этой части.'
      - text: 'Системы реального времени'
        why: 'Реальное время — это данные, которые меняются сами и приходят от сервера. Здесь отчёт строится по данным на момент открытия и ничего живого не получает.'
      - text: 'Обе части курса в равной мере'
        why: 'Вторая трудность курса — данные, которые меняются без действий человека. В отчёте таких нет, поэтому реальное время здесь ни при чём.'
      - text: 'Ни одна: это вопрос скорости сервера'
        why: 'Сервер здесь ни при чём: страница зависает, пока браузер сам пересчитывает полмиллиона продаж. Это предел вычислений на клиенте.'
    explanation: |
      Курс делится по двум трудностям. Если данных столько, что их нельзя просто загрузить, удержать, нарисовать
      или пересчитать, — это интерфейс на больших объёмах. Если данные меняются сами и клиент должен узнавать
      об этом от сервера — это системы реального времени. Здесь пересчёт полумиллиона строк в браузере упирается
      в вычисления, а живых данных нет.
    links:
      - https://web.dev/articles/dom-size-and-interactivity

  - id: sdl-intro-002
    topic: Введение
    subtopic: Большие и живые данные
    level: middle
    question: |
      Сайт спортивных результатов показывает счёт матча, который приходит от сервера сам. Болельщик закрыл крышку
      ноутбука в перерыве, через час открыл — значок «в эфире» горит, но счёт на экране тот, что был в перерыве.
      После перезагрузки страницы счёт правильный. Какой урок курса разбирает такую ситуацию?
    options:
      - text: 'Как доставлять живые данные: выбор между опросом, SSE и WebSocket'
        why: 'До сна счёт приходил исправно, значит, способ доставки работает. Сломалось то, что происходит после сна, а не выбор транспорта.'
      - text: 'Соединение: обрывы и возвраты'
        correct: true
        why: 'Пока ноутбук спал, соединения не было, и события о голах прошли мимо. Урок об обрывах разбирает, почему «соединение есть» не значит «данные свежие».'
      - text: 'Тяжёлая работа без зависаний'
        why: 'Страница не зависает, она показывает старые данные. Тяжёлые вычисления здесь ни при чём.'
      - text: 'Виртуализация длинных списков'
        why: 'На экране один счёт, а не длинный список. Проблема в пропущенных за время сна событиях.'
    explanation: |
      Пока устройство спит или связь пропала, сервер продолжает рассылать события, и клиент их не получает. После
      пробуждения соединение может восстановиться, и индикатор покажет «в эфире», но экран всё ещё отражает момент
      до обрыва. Как заметить обрыв и что делать после возврата, разбирает урок «Соединение: обрывы и возвраты»,
      а как догнать пропущенное — «Снимок и догоняющие события».
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/Server-sent_events/Using_server-sent_events

  - id: sdl-intro-003
    topic: Введение
    subtopic: Большие и живые данные
    level: senior
    multiple: true
    question: |
      Команда трекера задач собрала жалобы пользователей и делит их между двумя группами: одна займётся большими
      объёмами, другая — живыми обновлениями. Какие жалобы должна взять группа живых обновлений?
    options:
      - text: 'Коллега перенёс задачу в «Готово», а у меня она висит в «В работе», пока не обновлю страницу'
        correct: true
        why: 'Изменение сделал другой человек, и клиент должен узнать о нём от сервера. Это доставка живых данных.'
      - text: 'На доске 8000 задач, и перетаскивание карточки отстаёт от пальца на полсекунды'
        why: 'Здесь ничего не меняется само: каждое движение пальца тормозит, потому что карточек на странице слишком много. Это предел документа и вычислений.'
      - text: 'После обрыва Wi-Fi уведомление о новом комментарии пришло дважды'
        correct: true
        why: 'Повтор события после переподключения — классическая задача систем реального времени: одно событие нельзя применять дважды.'
      - text: 'Отметил «выбрать все» задачи с меткой «баг» и закрыл, а закрылись только видимые 50'
        why: 'Это модель выбора в частично загруженном списке: загружено 50 строк, а под фильтр подходит больше. Тема части о больших объёмах.'
      - text: 'Счётчик над колонкой показывает 7 задач, а карточек в ней 9 — коллеги добавили задачи, пока я смотрел'
        correct: true
        why: 'Карточки пришли живыми событиями, а счётчик за ними не успел. Согласованное обновление по событиям — тоже работа группы живых обновлений.'
    explanation: |
      Отличить одно от другого помогает вопрос: что изменилось без действия этого человека? Если ничего, а страница
      тормозит или выбирает не то, — это объём: слишком много строк, вычислений или узлов на странице. Если данные
      поменял кто-то другой или сервер, а клиент узнал об этом поздно, дважды или не до конца, — это реальное время.
      Многие системы сталкиваются с обеими трудностями сразу, но лечат их разными средствами.
    links:
      - https://web.dev/articles/virtualize-long-lists-react-window

  - id: sdl-datasets-001
    topic: Интерфейс на больших объёмах
    subtopic: Большие наборы данных и их разбиение
    level: junior
    question: |
      Журнал событий сервера хранит около двух миллионов записей. Таблица журнала получает их с сервера страницами
      по 100 записей, отсортированными по времени. Разработчик добавил кнопку «Сначала критичные», которая сортирует
      в браузере уже загруженные записи по уровню важности. Человек открыл журнал и сразу нажал эту кнопку. Что он
      увидит?
    options:
      - text: 'Самые критичные события за всё время хранения журнала'
        why: 'Браузер сортирует только то, что загрузил, — 100 записей. О критичных событиях на других страницах он не знает.'
      - text: 'Самые критичные среди 100 записей, загруженных в браузер'
        correct: true
        why: 'Сортировка в браузере видит только загруженную страницу. Человек получит правдоподобный, но неверный ответ на вопрос «что было самым критичным».'
      - text: 'Ошибку: браузер не может сортировать данные с сервера'
        why: 'Сортировка сработает без ошибок, и в этом опасность: результат выглядит правильным.'
      - text: 'Все два миллиона записей, загруженные заново по порядку важности'
        why: 'Кнопка ничего не запрашивает у сервера, она переставляет строки, которые уже есть в браузере.'
    explanation: |
      Если набор разбит на страницы на сервере, фильтр, сортировка и итоги тоже должны считаться на сервере: только
      он видит все данные. Сортировка загруженной страницы в браузере не падает и выглядит правдоподобно, поэтому
      ошибку замечают поздно. Правильно — передать сортировку в запросе, например `sort=-severity`, и получить
      с сервера первую страницу уже в нужном порядке.
    links:
      - https://google.aip.dev/132

  - id: sdl-datasets-002
    topic: Интерфейс на больших объёмах
    subtopic: Большие наборы данных и их разбиение
    level: middle
    question: |
      Биржевой терминал загружает при входе список из 3000 инструментов — около 1 МБ — и показывает его таблицей
      целиком. Поиск по названию фильтрует список в браузере, но на каждую букву ввод замирает на 300 мс. В записи
      Performance фильтрация занимает 4 мс, а почти всё остальное время уходит на Recalculate Style и Layout:
      таблица перестраивает тысячи строк. Что поможет?
    options:
      - text: 'Перенести поиск на сервер и запрашивать результат на каждую букву'
        why: 'Фильтрация занимает 4 мс, сервер её не ускорит, а сеть добавит задержку. Тормозит перерисовка таблицы, а не подсчёт.'
      - text: 'Держать в документе только видимые строки, а не все 3000 сразу'
        correct: true
        why: 'Упирается документ страницы: тысячи строк пересчитываются на каждую букву. Если в DOM только видимые строки, перерисовка станет маленькой.'
      - text: 'Включить сжатие ответа, чтобы список весил меньше мегабайта'
        why: 'Сжатие ускорит загрузку при входе, но тормозит не сеть: список уже в браузере, а ввод замирает на перерисовке.'
      - text: 'Унести фильтрацию в Web Worker, чтобы освободить основной поток'
        why: 'Фильтрация длится 4 мс, и выносить её некуда. Перерисовка документа остаётся в основном потоке, и ввод так и будет замирать.'
    explanation: |
      У больших данных четыре предела: сеть, память, документ страницы и вычисления. Лечение зависит от того, какой
      из них упёрся. Здесь подсказка в записи Performance: подсчёт быстрый, а долгие Recalculate Style и Layout
      говорят о слишком большом документе. Помогает рисовать меньше — показывать только видимые строки
      (виртуализация, следующий урок) или ограничить число строк в выдаче.
    links:
      - https://web.dev/articles/dom-size-and-interactivity

  - id: sdl-datasets-003
    topic: Интерфейс на больших объёмах
    subtopic: Большие наборы данных и их разбиение
    level: middle
    question: |
      В дашборде аналитики мобильного приложения нужен график «активные пользователи по дням за год» с разбивкой
      на 20 стран. Исходные данные — около 30 миллионов событий входа за год, они лежат в базе на сервере. Как
      получить данные для графика?
    options:
      - text: 'Загружать события страницами и складывать по дням в браузере'
        why: '30 миллионов событий — это гигабайты по сети и минуты подсчёта. Ради 7300 чисел передавать сырые события незачем.'
      - text: 'Загрузить события один раз и хранить на устройстве для следующих открытий'
        why: 'Хранение на устройстве не отменяет первую загрузку гигабайтов и подсчёт в браузере. Кроме того, копия устареет на следующий день.'
      - text: 'Запросить у сервера готовые числа: 365 дней по каждой из 20 стран'
        correct: true
        why: 'Сервер считает по всем данным рядом с базой и отдаёт около 7300 чисел — несколько десятков килобайт. Для графика больше и не нужно.'
      - text: 'Загрузить события в Web Worker, чтобы подсчёт не замораживал страницу'
        why: 'Worker спасёт основной поток, но не сеть и не память: гигабайты событий всё равно придётся передать и удержать.'
    explanation: |
      Итоги, группировки и графики по большому набору считает сервер и отдаёт готовые числа — это агрегация
      на сервере. Клиенту для графика нужно столько точек, сколько будет нарисовано, а не исходные строки. Подсчёт
      в браузере оправдан, только когда исходные данные уже здесь и их немного.

  - id: sdl-datasets-004
    topic: Интерфейс на больших объёмах
    subtopic: Большие наборы данных и их разбиение
    level: senior
    question: |
      В дашборде отдела продаж — таблица из 400 менеджеров с показателями за месяц, около 500 байт на строку.
      Данные пересчитываются раз в сутки, ночью. Руководители весь день сортируют и фильтруют таблицу по разным
      колонкам, десятки раз за сеанс. Запрос к серверу отвечает за 400 мс. Какое устройство таблицы
      предпочтительнее?
    options:
      - text: 'Загрузить все 400 строк одним запросом и сортировать их в браузере'
        correct: true
        why: 'Около 200 КБ данных, которые меняются раз в сутки, дешевле загрузить один раз. Сортировка 400 строк на месте мгновенна, а результат точный: в браузере весь набор.'
      - text: 'Отдавать с сервера по 50 строк и сортировать их в браузере'
        why: 'Сортировка страницы покажет порядок внутри 50 строк, а не по всем 400 менеджерам. Это правдоподобный, но неверный результат.'
      - text: 'Отдавать страницы по 50 строк, отсортированные на сервере по каждому клику'
        why: 'Результат будет верным, но каждая из десятков сортировок за сеанс будет ждать 400 мс. При 400 строках, которые меняются раз в сутки, эта задержка ничего не покупает.'
      - text: 'Сортировать на сервере и кэшировать в браузере каждый вариант сортировки'
        why: 'Кэш ускорит только повторные сортировки, а каждая новая комбинация колонок и фильтров всё равно ждёт сервер. Весь набор меньше, чем этот кэш.'
    explanation: |
      Где считать, решают по объёму, по тому, все ли данные уже на клиенте, и по частоте изменений. 400 строк
      по 500 байт — около 200 КБ, данные меняются раз в сутки, а сортируют их часто. Здесь простое решение лучше:
      загрузить всё и считать на месте. Серверная сортировка нужна там, где весь набор не передать — тысячи
      и миллионы строк.

  - id: sdl-datasets-005
    topic: Интерфейс на больших объёмах
    subtopic: Большие наборы данных и их разбиение
    level: senior
    multiple: true
    question: |
      Инженеры дежурной смены держат журнал событий открытым весь день. Таблица загружает события страницами
      при прокрутке, и за смену инженер открывает сотни разных фильтров. К вечеру вкладка занимает несколько
      гигабайт памяти и падает. В инструментах разработчика видно, что в куче лежат десятки тысяч старых записей
      журнала. Что поможет?
    options:
      - text: 'Хранить в кэше списка не больше нескольких десятков страниц, остальные выбрасывать'
        correct: true
        why: 'Окно ограничивает память одного списка. Если инженер вернётся к выброшенной странице, её загрузят снова.'
      - text: 'Задать конечный срок хранения для записей кэша, которых нет на экране'
        correct: true
        why: 'Каждый фильтр — отдельная запись кэша. Неиспользуемые записи удаляются по сроку хранения, иначе сотни фильтров копятся до вечера.'
      - text: 'Включить сжатие ответов сервера'
        why: 'Сжатие уменьшает то, что идёт по сети. Разобранные объекты в памяти браузера остаются того же размера.'
      - text: 'Увеличить срок свежести записей кэша, чтобы реже ходить на сервер'
        why: 'Срок свежести говорит, когда данные пора перепроверить, а не когда их удалять. Записи от этого из памяти не уйдут.'
      - text: 'Включить виртуализацию таблицы журнала'
        why: 'Виртуализация уменьшает документ, а не данные: десятки тысяч записей в куче останутся, и вкладка упадёт так же. Это лечение предела документа, а здесь упирается память.'
    explanation: |
      Это предел памяти. Лечат его тем, что не держат лишнего: ограничивают окно загруженных страниц и удаляют
      неиспользуемые записи кэша по сроку хранения (cache eviction, в TanStack Query — `gcTime`). Ещё следят, чтобы
      на старые данные не оставалось ссылок в других местах — в глобальном хранилище, подписках. Срок свежести
      и сжатие относятся к другим вещам: к свежести данных и к сети.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/guides/infinite-queries#what-if-i-want-to-limit-the-number-of-pages

  - id: sdl-virtualization-001
    topic: Интерфейс на больших объёмах
    subtopic: Виртуализация
    level: junior
    question: |
      В веб-почте папка «Входящие» содержит 40 000 писем, и список писем виртуализирован. Человек нажимает Ctrl+F,
      вводит «счёт за октябрь» и получает «не найдено», хотя такое письмо есть в папке, примерно на тысячу писем ниже.
      Почему браузер его не нашёл?
    options:
      - text: 'Поиск браузера не ищет по тексту внутри списков с прокруткой'
        why: 'Поиск по странице находит текст и внутри прокручиваемых блоков, если этот текст есть в документе. Дело не в прокрутке.'
      - text: 'Строки с этим письмом сейчас нет в документе страницы'
        correct: true
        why: 'Виртуальный список держит в DOM только видимые строки и небольшой запас. Письма ниже в документе отсутствуют, и поиску браузера нечего найти.'
      - text: 'Письмо ещё не загружено с сервера в память браузера'
        why: 'Даже если все 40 000 писем лежат в памяти, Ctrl+F ищет по документу, а не по данным JavaScript. Строки, которые не нарисованы, он не увидит.'
      - text: 'Поиск браузера отключается на страницах с большим числом узлов'
        why: 'Такого ограничения нет. Браузер ищет по всему документу, просто нужной строки в нём сейчас нет.'
    explanation: |
      Виртуализация держит в документе только видимые строки и запас (overscan). Поиск по странице браузера работает
      с документом, поэтому всё, что не нарисовано, для него не существует. Виртуальному списку нужен свой поиск
      по данным — на клиенте или на сервере. Если поиск браузера обязателен, выбирают страницы или
      `content-visibility: auto`: при нём невидимые элементы остаются в документе.
    links:
      - https://web.dev/articles/content-visibility

  - id: sdl-virtualization-002
    topic: Интерфейс на больших объёмах
    subtopic: Виртуализация
    level: middle
    question: |
      В ленте соцсети посты разной высоты, лента виртуализирована, а наверх постоянно добавляются новые посты.
      Перед переходом в пост приложение запоминает позицию прокрутки в пикселях, а при возврате прокручивает к ней.
      Люди жалуются, что после «Назад» оказываются на другом посте. Как восстанавливать позицию?
    options:
      - text: 'Увеличить запас строк, чтобы при возврате было что прокручивать'
        why: 'Запас убирает пустоту при быстрой прокрутке, но не делает пиксельную позицию верной: высоты постов над ней ещё не измерены, а сверху добавились новые.'
      - text: 'Включить history.scrollRestoration в значение auto'
        why: 'Браузер восстанавливает прокрутку сразу при возврате, а в этот момент в виртуальном списке ещё нет ни строк, ни элемента полной высоты, и прокручивать ему некуда.'
      - text: 'Запоминать id первого видимого поста и прокручивать к нему'
        correct: true
        why: 'id указывает на тот же пост, сколько бы новых ни добавилось сверху и какой бы высоты ни были посты. Библиотека прокрутит к нему, например через scrollToIndex.'
      - text: 'Запоминать номер первого видимого поста и прокручивать к нему'
        why: 'Номер сдвинется, когда сверху добавятся новые посты: номер 120 укажет уже на другой пост.'
    explanation: |
      Виртуальный список восстанавливают сами. Пиксели ненадёжны: высоты строк над позицией ещё не измерены, а сверху
      могли добавиться новые. Номер строки тоже сдвигается. Надёжнее запомнить id первой видимой строки и при
      возврате прокрутить к ней. По той же причине ключ строки в виртуальном списке — её id, а не номер.
    links:
      - https://tanstack.com/virtual/latest/docs/api/virtualizer

  - id: sdl-virtualization-003
    topic: Интерфейс на больших объёмах
    subtopic: Виртуализация
    level: middle
    question: |
      В справочнике курсов валют — таблица из 180 валют, обновляется раз в день. На телефоне среднего уровня она
      рисуется за 60 мс, прокрутка плавная. Пользователи часто ищут валюту поиском по странице браузера. Lighthouse
      предупреждает о большом документе, и разработчик предлагает виртуализировать таблицу. Как поступить?
    options:
      - text: 'Виртуализировать таблицу с запасом в десять строк сверху и снизу'
        why: 'Таблица и так рисуется быстро. Виртуализация уберёт строки из документа, и поиск по странице, которым люди пользуются, перестанет их находить.'
      - text: 'Виртуализировать и добавить свой поиск над таблицей'
        why: 'Свой поиск закроет потерю Ctrl+F, но всё это работа ради проблемы, которой нет: замер показывает, что таблица не тормозит.'
      - text: 'Оставить обычную таблицу: замер укладывается в бюджет'
        correct: true
        why: 'Решают по замеру, а не по предупреждению. 180 строк, которые редко меняются и быстро рисуются, не нужно виртуализировать, а поиск по странице продолжит работать.'
      - text: 'Разбить таблицу на страницы по 20 валют'
        why: 'Страницы уменьшат документ, но поиск по странице будет видеть только одну страницу из девяти. Платить этим незачем: таблица не тормозит.'
    explanation: |
      Виртуализация не бесплатна: она отнимает поиск по странице, требует своей работы с прокруткой, фокусом
      и доступностью. Её включают, когда тысячи строк прокручивают подряд и замер показывает тормоза. Предупреждение
      Lighthouse — повод измерить, а не готовое решение. Если в будущем понадобится ускорить отрисовку длинной
      страницы без потери поиска, есть `content-visibility: auto`.
    links:
      - https://web.dev/articles/dom-size-and-interactivity

  - id: sdl-virtualization-004
    topic: Интерфейс на больших объёмах
    subtopic: Виртуализация
    level: senior
    multiple: true
    question: |
      В виртуализированном списке писем на 40 000 строк две жалобы от людей с экранным чтецом. Первая: чтец говорит
      «список, 26 элементов». Вторая: человек выделяет письмо с клавиатуры, прокручивает список колёсиком мыши,
      и фокус вдруг оказывается в начале страницы. Что нужно сделать?
    options:
      - text: 'Указать у каждого элемента его номер и общий размер — aria-posinset и aria-setsize'
        correct: true
        why: 'Чтец считает элементы в документе, а там 26. Атрибуты сообщают настоящий размер списка и место каждого письма в нём.'
      - text: 'Объявлять через живую область номер каждого письма, которое появилось при прокрутке'
        why: 'Живая область будет без конца говорить при каждой прокрутке и мешать. Размер списка и положение элемента передают атрибутами, а не объявлениями.'
      - text: 'Держать строку с фокусом в документе, даже когда она ушла с экрана'
        correct: true
        why: 'Фокус пропадает, потому что библиотека удалила сфокусированную строку из DOM. Если добавить её к окну (например, через rangeExtractor), фокус останется на месте.'
      - text: 'Увеличить запас строк до ста сверху и снизу'
        why: 'Это отложит проблему фокуса на сто строк, но не решит её, а чтец всё равно назовёт неверный размер списка. Документ при этом вырастет.'
    explanation: |
      Экранный чтец опирается на документ. В виртуальном списке там 20–30 строк, поэтому настоящее число и положение
      сообщают атрибутами: у таблицы — `aria-rowcount` и `aria-rowindex`, у списка или ленты — `aria-setsize`
      и `aria-posinset`. Фокус теряется вместе с удалённой строкой, поэтому строку с фокусом не удаляют, а переходы
      стрелками делают так, чтобы строка сначала прокручивалась в окно, а потом получала фокус.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-rowcount

  - id: sdl-virtualization-005
    topic: Интерфейс на больших объёмах
    subtopic: Виртуализация
    level: senior
    question: |
      В таблице данных на 30 000 строк включена виртуализация, ячейки можно править прямо в таблице. Значение,
      которое человек вводит, хранится в состоянии компонента ячейки до нажатия Enter. Человек начал править сумму,
      прокрутил таблицу, чтобы свериться с другой строкой, вернулся — а введённое пропало. Как это исправить,
      сохранив виртуализацию?
    options:
      - text: 'Хранить незаконченную правку в состоянии таблицы по id строки, а не в ячейке'
        correct: true
        why: 'Строка ушла из окна, и React удалил компонент ячейки вместе с его состоянием. Если правка хранится выше, в состоянии таблицы, ячейка при возврате покажет её снова.'
      - text: 'Увеличить запас строк, чтобы строка с правкой дольше оставалась в документе'
        why: 'Это поможет, только если человек прокрутил недалеко. Стоит уйти на запас дальше — правка пропадёт так же.'
      - text: 'Использовать номер строки как ключ, чтобы React узнал ячейку при возврате'
        why: 'Ключ не сохраняет состояние удалённого компонента. А номер в качестве ключа ещё и перепутает строки, если данные сдвинутся.'
      - text: 'Отключать виртуализацию на время правки, чтобы все 30 000 строк были в документе'
        why: 'Добавить в документ все 30 000 строк в момент начала правки — это заморозка страницы на секунды. Это не «сохранив виртуализацию».'
    explanation: |
      Виртуальный список удаляет строки, ушедшие из окна, а вместе с ними и всё состояние их компонентов: поле ввода,
      недописанное значение, раскрытые подробности. В таблице с правкой такое состояние хранят вне строки — в состоянии
      таблицы по id строки — или добавляют строку с открытой правкой к окну, пока правка не закончена. Это одна
      из причин, почему сложные таблицы с правкой часто проще показывать страницами.
    links:
      - https://tanstack.com/virtual/latest/docs/api/virtualizer

  - id: sdl-scheduling-001
    topic: Интерфейс на больших объёмах
    subtopic: Планирование тяжёлой работы
    level: junior
    question: |
      В веб-приложении с картой города в углу экрана показаны координаты центра карты. Пока человек тащит карту
      пальцем, событие перемещения приходит больше ста раз в секунду, и каждое обновление координат перерисовывает
      панель и тормозит перетаскивание. Экран при этом обновляется 60 раз в секунду. Координаты должны меняться прямо
      во время перетаскивания. Какой приём подходит?
    options:
      - text: 'Debounce: обновить координаты через 200 мс после последнего события'
        why: 'Debounce сработает, только когда человек остановится. Пока карту тащат, координаты будут стоять на месте, а нужно, чтобы они менялись.'
      - text: 'Throttle: обновлять координаты не чаще раза в кадр'
        correct: true
        why: 'Throttle выполняет работу не чаще заданного интервала, пока события идут. Раз в кадр удобно делать через requestAnimationFrame.'
      - text: 'Перенести расчёт координат в Web Worker'
        why: 'Расчёт координат занимает доли миллисекунды. Проблема не в длительности, а в том, что его запускают сотни раз в секунду.'
      - text: 'Обновлять координаты через startTransition'
        why: 'Переход меняет приоритет отрисовки, но не число запусков. Обновлять координаты сто раз в секунду всё равно незачем.'
    explanation: |
      Debounce и throttle отвечают на вопрос «как часто». Debounce ждёт паузы в событиях и выполняет работу один раз
      после неё — подходит для поиска после ввода. Throttle выполняет работу не чаще заданного интервала, пока события
      идут, — подходит для прокрутки, движения мыши и перетаскивания. Для обновлений интерфейса естественный интервал —
      один кадр, его даёт `requestAnimationFrame`.
    links:
      - https://web.dev/articles/optimize-long-tasks

  - id: sdl-scheduling-002
    topic: Интерфейс на больших объёмах
    subtopic: Планирование тяжёлой работы
    level: middle
    question: |
      Онлайн-редактор фото работает в браузере и без сети. Фильтр «размытие» для снимка в 24 мегапикселя считается
      в JavaScript по массиву пикселей и занимает 900 мс одной функцией. Всё это время страница не отвечает, даже
      кнопка «Отмена» не нажимается. Что предпочтительнее?
    options:
      - text: 'Считать фильтр в Web Worker, передав пиксели без копирования'
        correct: true
        why: 'Фильтру не нужен DOM, только пиксели, поэтому его можно унести в фоновый поток. Буфер пикселей передают как transferable, чтобы не тратить время на копирование.'
      - text: 'Обернуть применение фильтра в startTransition'
        why: 'Переход помогает, когда React рисует много компонентов. Одну функцию, которая считает 900 мс, он не прервёт.'
      - text: 'Отправлять снимок на сервер и получать результат'
        why: 'Редактор должен работать без сети. Кроме того, отправка снимка на десятки мегабайт на каждое движение фильтра медленнее, чем подсчёт на месте.'
      - text: 'Разбить фильтр на куски по строкам пикселей с scheduler.yield() между ними'
        why: 'Страница станет отзывчивой, но вся работа займёт больше 900 мс: пиксели всё равно считаются в основном потоке и делят его с отрисовкой. Фильтру не нужен DOM, и в фоновом потоке он не займёт основной вовсе.'
    explanation: |
      Если работу нельзя сократить, её либо разбивают на части с уступкой браузеру, либо уносят в Web Worker.
      Воркер хорош для чистых вычислений без DOM: фильтры картинок, разбор файлов, поиск по индексу. Цена — обмен
      сообщениями и копирование данных; большие буферы вроде `ArrayBuffer` передают без копирования. Debounce
      и переход здесь не помогают: первый меняет частоту, второй — порядок отрисовки, а не длину одной задачи.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/Web_Workers_API/Using_web_workers

  - id: sdl-scheduling-003
    topic: Интерфейс на больших объёмах
    subtopic: Планирование тяжёлой работы
    level: middle
    question: |
      В дашборде продаж над таблицей из 600 строк есть поле фильтра, фильтр работает в браузере. Подсчёт занимает
      3 мс, а перерисовка таблицы — 250 мс на каждую букву. По записи Performance почти всё это время — работа
      компонентов React (Scripting), а пересчёт стилей и раскладки занимает 15 мс. Разработчик добавил debounce 400 мс, но люди жалуются:
      поле по-прежнему замирает, когда они делают паузу в наборе. Как исправить с помощью React?
    options:
      - text: 'Увеличить debounce до 800 мс, чтобы таблица перерисовывалась реже'
        why: 'Перерисовка станет реже, но каждая по-прежнему замораживает поле на 250 мс. А задержка результатов вырастет вдвое.'
      - text: 'Обновлять значение поля ввода внутри startTransition'
        why: 'Полем ввода через переход управлять нельзя: оно должно обновляться срочно. Через переход обновляют то, что зависит от значения поля.'
      - text: 'Рисовать таблицу в memo по значению из useDeferredValue'
        correct: true
        why: 'Поле обновляется сразу, а таблица рисуется по отстающему значению в фоне и прерывается новой буквой. Без memo таблица перерисуется и при старом значении, и выигрыша не будет.'
      - text: 'Заменить debounce на throttle: перерисовывать не чаще раза в 250 мс'
        why: 'Throttle тоже меняет только частоту. Каждая перерисовка по-прежнему занимает 250 мс и блокирует ввод.'
    explanation: |
      Debounce и throttle отвечают на вопрос «как часто», а не «как долго»: долгая отрисовка просто переезжает
      на другой момент. Приоритет обновления решает другую задачу — что рисовать первым. С `useDeferredValue` поле
      ввода обновляется срочно, а тяжёлая таблица — в фоне, и React бросает начатую отрисовку, если пришла новая
      буква. Это работает, потому что время уходит на компоненты React: долгий пересчёт раскладки переход не прервал
      бы. Ещё сильнее помогло бы сделать меньше работы: рисовать только видимые строки.
    links:
      - https://ru.react.dev/reference/react/useDeferredValue

  - id: sdl-scheduling-004
    topic: Интерфейс на больших объёмах
    subtopic: Планирование тяжёлой работы
    level: senior
    question: |
      Команда интернет-магазина месяц оптимизировала страницу каталога, на которую жалуются покупатели: «нажимаешь
      фильтр — и всё замирает». Теперь команда спорит, закончена ли работа. Какой критерий успеха стоило записать
      до начала оптимизации?
    options:
      - text: 'INP страницы на ноутбуке разработчика — ниже 200 мс в записи Performance'
        why: 'Быстрый ноутбук разработчика не показывает долгих задач, которые видят покупатели. Лабораторный замер делают с замедлением процессора, а успех проверяют на данных реальных людей.'
      - text: 'Среднее INP по всем замерам реальных покупателей — ниже 200 мс'
        why: 'Среднее скрывает медленный хвост: много быстрых действий перекроют те, на которых покупатели и жалуются.'
      - text: '75-й процентиль INP реальных покупателей за неделю — ниже 200 мс'
        correct: true
        why: 'Критерий опирается на данные людей, которые жалуются, смотрит на типичный медленный случай и назван заранее — по нему можно честно сказать, закончена ли работа.'
      - text: 'Ни одна функция фильтрации не работает дольше 50 мс'
        why: 'Это может быть частью лабораторного плана, но покупатели страдают не от функций, а от общего отклика. Фильтрация может быть быстрой, а отрисовка — долгой.'
    explanation: |
      До оптимизации записывают бюджет скорости, план замера и критерий успеха. Критерий — по данным реальных
      пользователей и по процентилю: 75-й процентиль показывает типичный медленный случай, а не лучший и не среднее.
      Лабораторный замер на медленном устройстве нужен, чтобы находить долгие задачи и проверять изменения,
      но решение «готово» принимают по тому, что видят люди.
    links:
      - https://web.dev/articles/inp

  - id: sdl-scheduling-005
    topic: Интерфейс на больших объёмах
    subtopic: Планирование тяжёлой работы
    level: senior
    multiple: true
    question: |
      На карте сервиса аренды самокатов 50 000 точек. Кластеры должны перестраиваться прямо во время сдвига, пока
      палец двигает карту. Сейчас приложение заново группирует точки в кластеры (300 мс) и перерисовывает все маркеры,
      включая те, что за краем экрана (200 мс), — и всё это одной задачей, во время которой карта не реагирует
      на палец. Какие меры помогают добиться, чтобы основной поток не был занят дольше 50 мс подряд?
    options:
      - text: 'Считать кластеры в Web Worker'
        correct: true
        why: 'Группировка точек — чистые вычисления без DOM. В фоновом потоке они не занимают основной.'
      - text: 'Рисовать только маркеры в видимой области карты'
        correct: true
        why: 'Это «сделать меньше работы»: маркеры за краем экрана человеку не видны, и рисовать их незачем.'
      - text: 'Запускать пересчёт через debounce 300 мс после окончания сдвига'
        why: 'По условию кластеры нужны во время сдвига, а debounce отложит пересчёт до его конца. И сам запуск всё равно займёт поток на полсекунды подряд.'
      - text: 'Делить группировку на куски с scheduler.yield() между ними'
        correct: true
        why: 'Куски короче 50 мс с уступкой браузеру дают ему обработать касания между ними. Общее время чуть вырастет, но карта будет отвечать.'
      - text: 'Пересчитывать кластеры не чаще раза в секунду с помощью throttle'
        why: 'Throttle меняет частоту запусков. Каждый запуск всё равно занимает поток на 500 мс подряд и блокирует касания.'
    explanation: |
      Есть четыре способа разгрузить основной поток: сделать меньше работы, разбить её на части с уступкой браузеру,
      унести в Web Worker и перенести на сервер. Они уменьшают то, сколько поток занят подряд. Debounce и throttle
      отвечают на другой вопрос — как часто запускать работу. Они полезны вместе с первыми — например, если бы
      кластеры можно было пересчитывать только после сдвига, — но долгую задачу не укорачивают.
    links:
      - https://web.dev/articles/optimize-long-tasks

  - id: sdl-selection-001
    topic: Интерфейс на больших объёмах
    subtopic: Выбор и правка в больших списках
    level: junior
    question: |
      В папке файлового хранилища 12 000 файлов, список загружает их по 100. Человек нажимает галочку в заголовке
      списка, и над ним появляется плашка: «Выбраны 100 файлов на этой странице. Выбрать все 12 000 в папке?» Зачем
      нужна эта плашка?
    options:
      - text: 'Чтобы загрузить остальные 11 900 файлов в список перед действием'
        why: 'Плашка не загружает файлы. Выбор всех хранится правилом «всё в папке», и действие по нему выполняет сервер.'
      - text: 'Чтобы показать, что выбрано только загруженное, и предложить всё'
        correct: true
        why: '«Выбрать всё» в частично загруженном списке значит либо видимое, либо всё по условию. Плашка показывает, какой выбор сделан, и предлагает второй.'
      - text: 'Чтобы предупредить, что действия над всеми 12 000 файлами сразу недоступны'
        why: 'Наоборот, плашка предлагает выбрать все 12 000. Действие по всем файлам выполнит сервер.'
      - text: 'Чтобы подтвердить удаление файлов до того, как оно начнётся'
        why: 'Плашка появляется при выборе, а не при действии. Подтверждение опасного действия — отдельный шаг.'
    explanation: |
      Когда загружена часть списка, есть два разных «выбрать всё»: видимое и всё по фильтру. Если интерфейс их
      не различает, человек думает, что действует на всё, а действие получает только загруженные строки.
      Распространённый приём — галочка в заголовке выбирает видимое, а плашка предлагает выбрать всё по фильтру
      и показывает общее число.
    links:
      - https://www.patternfly.org/patterns/bulk-selection/

  - id: sdl-selection-002
    topic: Интерфейс на больших объёмах
    subtopic: Выбор и правка в больших списках
    level: middle
    question: |
      В CRM фильтр «клиенты без звонка больше 30 дней» даёт 8000 клиентов, таблица загрузила 100. Менеджер нажал
      «Выбрать все 8000», снял галочки с пяти клиентов и выбрал «Назначить менеджера». Сервер умеет выполнять
      действие по тому же фильтру, что и список. Что клиент должен отправить?
    options:
      - text: 'Номера 95 загруженных клиентов, которые остались отмеченными'
        why: 'Сервер получит 95 клиентов вместо 7995. Остальных клиентов клиент не загружал и отметить не мог.'
      - text: 'Номера всех 7995 клиентов, загрузив их перед отправкой'
        why: 'Сработает, но клиент делает работу сервера: тянет 8000 номеров ради действия, которое сервер умеет выполнить по фильтру. На выборках в сотни тысяч это уже упрётся в сеть и память.'
      - text: 'Фильтр, пять исключённых номеров и ожидаемое число 7995'
        correct: true
        why: 'Выбор по фильтру хранится правилом «фильтр плюс исключения» и так же уходит на сервер. Ожидаемое число позволит серверу заметить, что выборка изменилась.'
      - text: 'Только фильтр: снятые галочки сервер узнает по истории действий'
        why: 'Сервер не знает, какие галочки менеджер снял в браузере. Без исключений действие заденет и эти пять клиентов.'
    explanation: |
      Выбор по фильтру нельзя хранить списком номеров: клиент их не знает. Его хранят как правило: фильтр и набор
      исключений. Галочка у строки и счётчик вычисляются из правила. На сервер уходит то же правило, и сервер сам
      выбирает записи; ожидаемое число и идентификатор операции защищают от расхождения выборки и двойного выполнения.
    links:
      - https://google.aip.dev/165

  - id: sdl-selection-003
    topic: Интерфейс на больших объёмах
    subtopic: Выбор и правка в больших списках
    level: middle
    question: |
      В веб-почте человек открыл фильтр «рассылки» — 3200 писем — нажал «Выбрать все 3200», а потом сузил фильтр
      до «рассылки за эту неделю», где 140 писем. Кнопка «Удалить» активна. Что должно стать с выбором?
    options:
      - text: 'Сохранить выбор всех 3200 рассылок, даже скрытых новым фильтром'
        why: 'Человек видит 140 писем и нажмёт «Удалить», не подозревая, что удалит 3200, большинство из которых сейчас не видно.'
      - text: 'Сбросить выбор и сообщить об этом рядом с таблицей'
        correct: true
        why: 'Выбор по фильтру ссылается на старый фильтр. Сброс с сообщением — простое правило, при котором действие никогда не уходит на набор, которого человек не видит.'
      - text: 'Молча выбрать все 140 писем по новому фильтру'
        why: 'Человек не выбирал эти письма явно и может не заметить, что выбор поменялся. Любое молчаливое преобразование выбора рискованно для действия вроде удаления.'
      - text: 'Сохранить выбор и показать «Выбрано 3200, из них 3060 не видны при этом фильтре»'
        why: 'Это честнее молчания, но такой счётчик годится для выбора отдельных строк: их человек отметил сам. Выбор по фильтру действует на всё, что под фильтр подходит, и «Удалить» уйдёт на 3060 невидимых писем.'
    explanation: |
      Выбор «всё по фильтру» действует на записи по правилу, а правило ссылается на фильтр. Когда фильтр меняется,
      любой «умный» пересчёт выбора неочевиден, и человек легко нажмёт действие, не заметив подмены. Честное правило —
      сбросить выбор по фильтру и сказать об этом. Выбор отдельных строк можно сохранить, но тогда счётчик должен
      показывать, сколько выбранных скрыто фильтром.
    links:
      - https://www.patternfly.org/patterns/bulk-selection/

  - id: sdl-selection-004
    topic: Интерфейс на больших объёмах
    subtopic: Выбор и правка в больших списках
    level: senior
    question: |
      В файловом хранилище администратор удаляет все файлы старше трёх лет в общей папке — около 12 000. Удаление
      необратимо, часть файлов может быть заблокирована другими пользователями, а удаление каждого файла на сервере
      занимает десятки миллисекунд. Администратор может закрыть вкладку, не дожидаясь конца. Как устроить действие?
    options:
      - text: 'Клиент загружает все номера по фильтру и удаляет их запросами по 100'
        why: 'Если вкладку закроют, удаление остановится на середине. Кроме того, клиенту придётся загрузить все 12 000 номеров.'
      - text: 'Один запрос с фильтром, сервер удаляет всё и отвечает, когда закончит'
        why: 'Удаление 12 000 файлов займёт минуты, и запрос, скорее всего, оборвётся по тайм-ауту с неизвестным исходом. Администратор не узнает, что удалилось.'
      - text: 'Сначала подсчёт с примерами, потом задача на сервере с прогрессом и отчётом'
        correct: true
        why: 'Подсчёт показывает, сколько и каких файлов затронет необратимое действие. Задача на сервере продолжится без вкладки, прогресс виден, а отчёт назовёт заблокированные файлы.'
      - text: 'Удалять по фильтру частями, пока администратор прокручивает и подгружает список'
        why: 'Удаление привязано к прокрутке: файлы, до которых администратор не прокрутил, останутся. А действие так и не станет одним понятным шагом.'
    explanation: |
      Массовое опасное действие начинают с предварительного подсчёта: сервер говорит, сколько записей затронет
      правило, и показывает примеры — так устроено удаление по условию в правилах Google API (AIP-165). Долгую
      работу выполняет сервер задачей с номером: клиент показывает прогресс, вкладку можно закрыть. Итог —
      частичный успех с перечнем того, что не получилось и почему.
    links:
      - https://google.aip.dev/165

  - id: sdl-selection-005
    topic: Интерфейс на больших объёмах
    subtopic: Выбор и правка в больших списках
    level: senior
    multiple: true
    question: |
      В CRM список сделок с фильтром «новые» обновляется сам, когда коллеги меняют сделки. Менеджер пишет длинную
      заметку прямо в строке сделки; заметка хранится в поле «Описание», и коллега, меняя сделку, тоже мог его
      переписать. В этот момент коллега переводит сделку в «в работе», список обновляется,
      строка исчезает — и заметка вместе с ней. Какие решения нужны?
    options:
      - text: 'Оставлять строку на месте с пометкой «больше не подходит под фильтр», пока правка не закончена'
        correct: true
        why: 'Строка, с которой человек работает, не должна исчезать молча. Пометка объясняет, что произошло, и даёт закончить правку.'
      - text: 'Отключить живое обновление списка для всех, пока кто-то правит строку'
        why: 'Одна правка замораживает список у всех менеджеров, и они работают с устаревшими данными.'
      - text: 'Хранить незаконченную заметку в состоянии списка по id сделки'
        correct: true
        why: 'Состояние строки пропадает вместе с ней. Если заметка хранится выше по id сделки, её можно показать снова и сохранить.'
      - text: 'Сохранять заметку по номеру строки, на которой стоял курсор'
        why: 'После обновления номера строк сдвигаются, и заметка ляжет в чужую сделку.'
      - text: 'Отправлять заметку с номером версии сделки, которую видел менеджер'
        correct: true
        why: 'Коллега уже изменил сделку. Версия позволит серверу заметить конфликт и не перезаписать молча чужое изменение.'
    explanation: |
      В живом списке строка может уйти из окна, из выборки или измениться на сервере, пока человек с ней работает.
      Правка не должна пропадать: строку оставляют с пометкой, состояние правки хранят по id записи, а не по месту
      на экране, и сохраняют с номером версии, как при любом конфликте записи (курс 2, «Версии и конфликты»).
    links:
      - https://www.patternfly.org/patterns/bulk-selection/

  - id: sdl-transport-001
    topic: Системы реального времени
    subtopic: Выбор транспорта
    level: junior
    question: |
      Какой из способов доставки живых данных в браузере сам переподключается после обрыва и при этом сообщает
      серверу номер последнего полученного события, чтобы тот мог дослать пропущенное?
    options:
      - text: 'Опрос через равные промежутки'
        why: 'При опросе нет постоянного соединения и нет номеров событий: клиент просто спрашивает текущее состояние.'
      - text: 'Длинный опрос'
        why: 'Каждый запрос длинного опроса — обычный HTTP-запрос. Номер последнего события клиент должен передавать сам, браузер этого не делает.'
      - text: 'События от сервера (SSE)'
        correct: true
        why: 'EventSource переподключается сам, а если у событий были номера (id), отправляет последний в заголовке Last-Event-ID.'
      - text: 'WebSocket'
        why: 'Браузерный WebSocket не переподключается сам и не знает номеров сообщений: всё это пишут сами или берут библиотеку.'
    explanation: |
      SSE — единственный из четырёх транспортов, у которого переподключение и номер последнего события встроены
      в браузер: `EventSource` подключается снова после обрыва, сервер может задать паузу полем `retry:`, а номер
      последнего события браузер отправляет в заголовке `Last-Event-ID`. У WebSocket всё это — забота приложения.
    links:
      - https://html.spec.whatwg.org/multipage/server-sent-events.html

  - id: sdl-transport-002
    topic: Системы реального времени
    subtopic: Выбор транспорта
    level: middle
    question: |
      В браузерной многопользовательской игре каждый игрок отправляет свои действия около десяти раз в секунду
      и столько же раз получает положение других игроков. Задержка в обе стороны должна быть как можно меньше.
      Какой транспорт подходит?
    options:
      - text: 'SSE для положения игроков и POST-запрос на каждое действие'
        why: 'Получать через SSE можно, но десять HTTP-запросов в секунду от каждого игрока — это заголовки, проверка входа и лишняя задержка на каждое действие.'
      - text: 'WebSocket: сообщения в обе стороны по одному соединению'
        correct: true
        why: 'Обе стороны пишут часто, и каждое сообщение должно уходить сразу. WebSocket даёт это без нового HTTP-запроса на сообщение.'
      - text: 'Длинный опрос, чтобы положение приходило сразу'
        why: 'После каждого ответа клиент отправляет новый запрос. При десяти событиях в секунду это почти непрерывный поток полных HTTP-запросов, а действия игрока всё равно идут отдельно.'
      - text: 'Опрос раз в 100 мс, а действия — POST-запросами'
        why: 'Задержка до 100 мс и двадцать HTTP-запросов в секунду от каждого игрока. Для частой двусторонней связи это самый дорогой вариант.'
    explanation: |
      Транспорт выбирают по тому, кто пишет и как часто. Если клиент тоже пишет часто и задержка его сообщений важна —
      игра, чат с «печатает», совместное редактирование, — нужен WebSocket. Цена — переподключение, номера сообщений
      и повтор пропущенного придётся делать самим, а прокси и балансировщики настроить на долгие соединения.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/WebSockets_API

  - id: sdl-transport-003
    topic: Системы реального времени
    subtopic: Выбор транспорта
    level: middle
    question: |
      Сайт спортивных результатов показывает счёт матча. Во время финала страницу держат открытой 60 000 человек.
      Счёт меняется несколько раз за матч, и болельщики хотят видеть гол за пару секунд. Зрители ничего не отправляют
      на сервер, только смотрят. Команда думает об опросе раз в 3 секунды. Что предпочтительнее?
    options:
      - text: 'Оставить опрос: это около 2000 запросов в секунду'
        why: '60 000 / 3 — это 20 000 запросов в секунду, а не 2000. И почти все они получат ответ «ничего не изменилось».'
      - text: 'Перейти на SSE: опрос дал бы около 20 000 пустых запросов в секунду'
        correct: true
        why: 'Данные идут только от сервера, меняются редко, а нужны быстро. SSE держит соединение и присылает событие, только когда счёт изменился.'
      - text: 'Перейти на WebSocket: «реальное время» требует двусторонней связи'
        why: 'Зрители ничего не отправляют. WebSocket сработает, но переподключение и досылку пропущенного придётся делать самим, а SSE даёт их готовыми.'
      - text: 'Опрашивать раз в минуту, чтобы снизить нагрузку до 1000 запросов в секунду'
        why: 'Нагрузка упадёт, но гол болельщик увидит через полминуты в среднем, а требование — пара секунд.'
    explanation: |
      Опрос стоит «число экранов / интервал» запросов в секунду независимо от того, есть ли изменения. При 60 000 экранов
      и требовании «за пару секунд» он даёт 20 000 почти пустых запросов в секунду. Когда данные идут только от сервера,
      меняются редко, а узнать о них нужно быстро, подходит SSE: одно соединение на экран и событие только при изменении.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/Server-sent_events/Using_server-sent_events

  - id: sdl-transport-004
    topic: Системы реального времени
    subtopic: Выбор транспорта
    level: senior
    question: |
      Биржевой терминал получает котировки по SSE. У большинства клиентов всё работает, но у нескольких банков
      котировки приходят пачками раз в полминуты или поток обрывается через минуту и не восстанавливается. Сеть этих
      банков идёт через их собственные прокси, настроить которые команда не может. Что предпочтительнее?
    options:
      - text: 'Перевести всех клиентов с SSE на WebSocket, чтобы обойти прокси'
        why: 'SSE идёт по HTTPS, и раз прокси банков копят его ответ, они расшифровывают трафик, а такие прокси могут резать и wss://. К тому же смена протокола для всех ломает то, что работало у большинства.'
      - text: 'Присылать в поток строку-комментарий каждые 15 секунд'
        why: 'Комментарии помогают против прокси, которые обрывают молчащие соединения, но прокси, который копит ответ, всё равно отдаст их пачкой. А клиент комментариев не видит вовсе: браузер их выбрасывает, так что ни обрыва, ни опоздания по ним не заметить.'
      - text: 'Добавить в ответ сервиса заголовок X-Accel-Buffering: no для всех клиентов'
        why: 'Этот заголовок отключает накопление в nginx на стороне сервиса. Прокси банков — чужие, и на них он не действует.'
      - text: 'Переходить на опрос, если сигналы «я жив» пропали или идут пачками'
        correct: true
        why: 'Обрыв виден по тишине, а накопление — по сигналам «я жив»: сервер отправил их с разницей в 15 секунд (это видно по времени сервера внутри), а пришли они пачкой. Часы устройства для этого не нужны. В обоих случаях клиент работает через опрос и позже снова пробует SSE.'
    explanation: |
      Постоянное соединение работает не у всех: корпоративные прокси копят ответ или режут долгие соединения, а настроить
      их нельзя. Поэтому живому экрану нужен запасной транспорт — обычно опрос или длинный опрос. Клиент замечает, что
      поток не работает: соединение раз за разом умирает или служебные сигналы, которые сервер отправил через равные
      промежутки (это видно по времени сервера внутри), приходят пачками. Тогда он переходит на запасной путь
      и периодически пробует вернуться.
    links:
      - https://www.rfc-editor.org/rfc/rfc6202

  - id: sdl-transport-005
    topic: Системы реального времени
    subtopic: Выбор транспорта
    level: senior
    multiple: true
    question: |
      Дашборд мониторинга серверов перевели с опроса на SSE. За балансировщиком работают восемь серверов приложения,
      поток отдаётся по HTTP/1.1. Пришли две жалобы. Первая: у инженеров, у которых открыто много вкладок дашборда,
      в части вкладок графики перестают обновляться. Вторая: многие события об авариях до клиентов не доходят
      вовсе, хотя соединение открыто. Какие изменения нужны?
    options:
      - text: 'Отдавать поток по HTTP/2'
        correct: true
        why: 'По HTTP/1.1 браузер держит не больше шести соединений на сайт на все вкладки, и седьмая ждёт. По HTTP/2 потоки делят одно подключение.'
      - text: 'Закрепить каждого клиента за одним сервером балансировщика'
        why: 'Клиент и так висит на одном сервере. Беда в том, что событие об аварии может появиться на другом из восьми, и закрепление его туда не доставит.'
      - text: 'Рассылать события между серверами через общую шину'
        correct: true
        why: 'Событие должно попасть на тот сервер, где висит соединение клиента. Шина событий раздаёт каждое событие всем серверам, и каждый отправит его своим клиентам.'
      - text: 'Уменьшить паузу переподключения в поле retry'
        why: 'Соединения не обрываются: они открыты, но в одном случае ждут очереди, а в другом не получают событий с чужих серверов. Пауза переподключения здесь ни при чём.'
    explanation: |
      У постоянных соединений своя цена на сервере и в браузере. По HTTP/1.1 браузер ограничивает число соединений
      на сайт, поэтому SSE отдают по HTTP/2. А когда серверов несколько, событие должно дойти до сервера, который держит
      соединение нужного клиента, — для этого между серверами нужна шина событий. При опросе этой проблемы не было:
      любой сервер читал данные из общей базы.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events

  - id: sdl-connection-001
    topic: Системы реального времени
    subtopic: Жизненный цикл соединения
    level: junior
    question: |
      Сервис видеозвонков держит с браузером WebSocket для служебных сообщений: кто вошёл в звонок, кто выключил
      микрофон. Разработчик спрашивает: «В протоколе WebSocket уже есть служебные кадры ping и pong. Зачем нам
      ещё своё сообщение „я жив“ раз в 15 секунд?» Что ответить?
    options:
      - text: 'В протоколе WebSocket таких кадров нет, их добавляют библиотеки'
        why: 'Кадры ping и pong есть в самом протоколе (RFC 6455). Дело в том, кому они доступны.'
      - text: 'JavaScript в браузере эти кадры не видит и отправить их не может'
        correct: true
        why: 'Браузер отвечает на ping сервера сам, и это помогает серверу. Но клиентский код не узнает о кадрах, поэтому для проверки со своей стороны ему нужно своё сообщение.'
      - text: 'Свои сообщения нужны, чтобы WebSocket передавал данные заметно быстрее'
        why: 'Пинг не ускоряет передачу. Он нужен, чтобы заметить соединение, которое умерло без сигнала о закрытии.'
      - text: 'Без своих сообщений браузер закроет WebSocket через минуту'
        why: 'Браузер сам не закрывает открытый WebSocket за молчание. Опасность обратная: соединение может умереть, а браузер продолжит считать его открытым.'
    explanation: |
      Соединение может умереть молча: сменилась сеть, перезагрузился роутер — и ни одна сторона не получила сигнала
      о закрытии. Поэтому нужна проверка, что соединение живо: сервер шлёт пинг через равные промежутки, а клиент
      считает соединение мёртвым после нескольких интервалов тишины. Кадры ping и pong протокола WebSocket не видны
      JavaScript в браузере, поэтому пинг делают сообщением приложения.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/WebSockets_API

  - id: sdl-connection-002
    topic: Системы реального времени
    subtopic: Жизненный цикл соединения
    level: middle
    question: |
      Табло вылетов в аэропорту — страница в браузере на большом экране — получает изменения по SSE через
      `EventSource`. Ночью сервер перезапускали, и минуту он отвечал на все запросы 503. После этого табло застыло
      и ожило только тогда, когда техник вручную перезагрузил страницу. Что исправить в клиенте?
    options:
      - text: 'Попросить сервер присылать меньшую паузу в поле retry:'
        why: 'Поле retry: задаёт паузу перед переподключением после обрыва. После ответа 503 EventSource не переподключается вовсе, и пауза не имеет значения.'
      - text: 'Перейти с SSE на WebSocket, чтобы переподключение после 503 было надёжнее'
        why: 'Браузерный WebSocket не переподключается сам совсем. Переподключение пришлось бы писать так же, только с нуля.'
      - text: 'Присылать с сервера пинг каждые 15 секунд'
        why: 'Пинг помогает заметить молча умершее соединение. Здесь клиент знает, что соединение закрыто: EventSource перешёл в состояние CLOSED.'
      - text: 'При readyState CLOSED самому открывать поток заново с растущей паузой'
        correct: true
        why: 'EventSource сам переподключается после обрыва сети, но после ответа не 200 сдаётся окончательно. Такой случай приложение обрабатывает само: экспоненциальная задержка, разброс, новая попытка.'
    explanation: |
      Встроенное переподключение `EventSource` работает при обрыве сети, но если сервер на переподключение ответил
      не 200 или не тем типом содержимого, соединение считается проваленным, и повторов больше не будет. Поэтому
      обработчик ошибки проверяет `readyState`: если он `CLOSED`, клиент сам создаёт новый `EventSource`
      по правилам экспоненциальной задержки со случайным разбросом.
    links:
      - https://html.spec.whatwg.org/multipage/server-sent-events.html#sse-processing-model

  - id: sdl-connection-003
    topic: Системы реального времени
    subtopic: Жизненный цикл соединения
    level: middle
    question: |
      Биржевой терминал получает котировки по WebSocket, сервер шлёт пинг раз в 15 секунд, а клиент считает соединение
      мёртвым после 45 секунд тишины — сторож на таймере. Трейдер закрыл крышку ноутбука на 20 минут. Открыв, он
      минуту смотрит на старые котировки с зелёным значком «в сети», пока сторож наконец не срабатывает. Сервер
      держит 200 000 таких соединений, и команда не хочет увеличивать служебный трафик. Как сократить эту минуту?
    options:
      - text: 'Присылать пинг раз в секунду, а сторож держать на трёх секундах'
        why: 'Минута сократится до секунд, но сервер будет слать в 15 раз больше пингов на 200 000 соединений — ровно то, чего условие не позволяет. Событие возврата даёт тот же результат бесплатно.'
      - text: 'При возврате на вкладку сразу смотреть время последнего сообщения'
        correct: true
        why: 'События visibilitychange и online приходят сразу после пробуждения. Клиент видит, что последнее сообщение было 20 минут назад, и переподключается, не дожидаясь таймера.'
      - text: 'Убрать сторож и переподключаться по событию close от WebSocket'
        why: 'Если соединение умерло молча, close может не прийти минутами. Именно поэтому нужен сторож, а не ожидание сигнала.'
      - text: 'Перезагружать страницу терминала целиком, когда ноутбук просыпается'
        why: 'Это сработает, но потеряет всё состояние терминала — открытые графики, недописанную заявку. Достаточно переподключиться и перечитать данные.'
    explanation: |
      Во сне устройство не выполняет ничего, а в фоне браузер замедляет таймеры, поэтому сторож на таймере
      срабатывает с опозданием. Возврат на страницу — главный момент проверки: по событиям `visibilitychange`,
      `online` (и `resume` в Chrome) клиент сразу сравнивает время последнего сообщения с порогом и переподключается.
      После этого пропущенное нужно догнать или перечитать: соединение вернулось, а данные ещё старые.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/Page_Visibility_API

  - id: sdl-connection-004
    topic: Системы реального времени
    subtopic: Жизненный цикл соединения
    level: senior
    question: |
      CRM компании получает обновления сделок по WebSocket. Токен доступа живёт 10 минут и проверяется, когда
      соединение открывается; соединение живёт весь рабочий день. Менеджера уволили, администратор завершил все его
      сессии — а в его открытой CRM до вечера продолжают появляться новые сделки и контакты клиентов.
      Как это исправить?
    options:
      - text: 'Сделать токен доступа короче, например на две минуты'
        why: 'Токен проверяется только при открытии. Соединение, открытое утром, проживёт день, каким бы коротким ни был токен.'
      - text: 'Передавать токен одноразовым билетом в адресе соединения'
        why: 'Билет решает, как передать токен при открытии, а не что делать с открытым соединением, когда право на него пропало.'
      - text: 'Обновлять токен на клиенте каждые 10 минут, не трогая открытое соединение'
        why: 'Клиент получит новый токен, но сервер по-прежнему не проверяет его у открытого соединения. А уволенный менеджер новый токен и вовсе не получит — и это ни на что не повлияет.'
      - text: 'Закрывать соединение на сервере при истечении токена и отзыве сессии'
        correct: true
        why: 'Соединение не должно жить дольше права на него. Клиент с действующей сессией обновит токен и переподключится, а уволенный менеджер переподключиться не сможет.'
    explanation: |
      Постоянное соединение проверяет вход один раз, при открытии, а живёт часами. Поэтому сервер связывает
      соединение с токеном и сессией: закрывает его, когда истекает срок токена или сессию отзывают. Клиент
      в обычном случае обновляет токен и переподключается, догоняя пропущенное. Другой вариант для WebSocket —
      клиент сам присылает новый токен до истечения старого, а сервер закрывает соединение, если его не получил.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/WebSockets_API

  - id: sdl-connection-005
    topic: Системы реального времени
    subtopic: Жизненный цикл соединения
    level: senior
    multiple: true
    question: |
      Платформа онлайн-обучения показывает 80 000 слушателей вебинара чат и опросы по WebSocket. После выкатки
      новой версии сервера все соединения рвутся разом, клиенты в ту же секунду переподключаются, и каждый
      заново загружает всю историю чата вебинара. Сервер и база захлёбываются на несколько минут. Что поможет?
    options:
      - text: 'Переподключаться с экспоненциальной задержкой и полным разбросом'
        correct: true
        why: 'Случайная пауза у каждого клиента растягивает волну переподключений во времени, вместо пика в одну секунду.'
      - text: 'Переподключаться всем через одну и ту же паузу в 5 секунд'
        why: 'Волна просто сдвинется на 5 секунд: все клиенты оборвались одновременно и придут снова одновременно.'
      - text: 'Перед перезапуском закрывать соединения постепенно в течение минуты'
        correct: true
        why: 'Плавное отключение само растягивает переподключения: клиенты отключаются в разное время и возвращаются в разное время.'
      - text: 'После переподключения догонять сообщения с номера последнего полученного'
        correct: true
        why: 'Догнать пропущенное за секунды обрыва дешевле, чем загружать всю историю. Нагрузка на базу падает в разы.'
      - text: 'Переподключаться сразу, без паузы, чтобы слушатели меньше ждали'
        why: 'Без паузы 80 000 клиентов приходят в одну секунду — это и есть проблема. Сервер ответит ошибками, и клиенты пойдут на новый круг.'
    explanation: |
      Постоянные соединения рвутся у всех одновременно, когда перезапускается сервер, — это проблема громового стада.
      Её гасят с трёх сторон: случайный разброс пауз на клиенте, постепенное отключение на сервере и дешёвый возврат —
      догонять пропущенное по номеру последнего события, а не перечитывать всё.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/WebSockets_API

  - id: sdl-events-001
    topic: Системы реального времени
    subtopic: Обработка событий
    level: junior
    question: |
      В онлайн-банке события о списаниях идут через очередь сообщений, которая обещает доставку «хотя бы один раз»
      (at-least-once). Приложение показывает ленту операций и добавляет в неё строку на каждое событие. Чего
      следует ждать от такой очереди?
    options:
      - text: 'Событие может потеряться, зато дублей не будет'
        why: 'Это гарантия «не больше одного раза». «Хотя бы один раз» обещает обратное: не потерять, но, возможно, повторить.'
      - text: 'Событие не потеряется, но иногда придёт повторно'
        correct: true
        why: 'Источник повторяет отправку, если не уверен, что она дошла. Поэтому обработка должна быть идемпотентной: повтор того же события не должен добавить вторую строку.'
      - text: 'Каждое событие придёт ровно один раз и по порядку'
        why: '«Ровно один раз» на пути через сеть практически недостижимо. Его получают сочетанием «хотя бы один раз» и отсева дублей у получателя.'
      - text: 'Событие придёт хотя бы один раз за сутки, если клиент был в сети'
        why: 'Гарантия говорит не о сроке, а о числе доставок: не меньше одной, иногда больше.'
    explanation: |
      Гарантии доставки: «не больше одного раза» — без дублей, но с потерями; «хотя бы один раз» — без потерь,
      но с дублями; «ровно один раз» на деле получают отсевом дублей у получателя. Большинство очередей и брокеров
      обещают «хотя бы один раз», и документация, например Amazon SQS, просит делать обработку идемпотентной.
      Для ленты операций это значит: отсеивать повтор по номеру события.
    links:
      - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues-at-least-once-delivery.html

  - id: sdl-events-002
    topic: Системы реального времени
    subtopic: Обработка событий
    level: middle
    question: |
      В трекере задач доска получает события вида «задача T-17 теперь в колонке „Готово“, версия 13». Иногда событие
      с версией 12 («задача T-17 в колонке „В работе“») приходит после события с версией 13, и задача прыгает назад.
      Как клиенту обрабатывать такие события?
    options:
      - text: 'Применять событие, только если его версия больше уже известной'
        correct: true
        why: 'Версия растёт с каждым изменением задачи. Событие с версией 12 после 13 — старое, и его отбрасывают, при любом порядке прихода.'
      - text: 'Применять события строго в порядке прихода'
        why: 'Именно так задача и прыгает назад: событие с версией 12 пришло позже и затёрло более новое состояние.'
      - text: 'Сравнивать время события по часам устройства и брать более позднее'
        why: 'Часы устройства и сервера расходятся, иногда на минуты. Порядок изменений надёжно показывает только метка, которую поставил сервер.'
      - text: 'Перечитывать всю доску с сервера после каждого пришедшего события'
        why: 'Порядок станет верным, но каждое событие превратится в загрузку всей доски. Ради этого не нужен поток событий.'
    explanation: |
      Номер версии сущности растёт при каждом её изменении. Если клиент применяет данные, только когда их версия
      больше известной, опоздавшие старые события и дубли отбрасываются сами — откуда бы ни пришли данные: из потока,
      из ответа на свой запрос или из перечитанного списка. Это то же правило, что и для старых ответов в курсе 2,
      в уроке «Кэш после изменения».
    links:
      - https://kubernetes.io/docs/reference/using-api/api-concepts/#resource-versions

  - id: sdl-events-003
    topic: Системы реального времени
    subtopic: Обработка событий
    level: middle
    question: |
      В онлайн-игре сервер шлёт событие «игрок получил 10 очков» с уникальным номером события. Брокер, через который
      идут события, может повторить событие в течение пяти минут. Сейчас клиент помнит номера событий за последние
      10 секунд и пропускает повторы, но счёт игроков всё равно иногда завышен. Что предпочтительнее?
    options:
      - text: 'Нести в событии новый счёт игрока с версией вместо прибавки'
        correct: true
        why: 'Событие-состояние «счёт 340, версия 58» безвредно при повторе: результат тот же, а более старая версия просто отбрасывается.'
      - text: 'Оставить прибавку и помнить номера событий за последние 10 секунд'
        why: 'Это текущее решение. Брокер повторяет до пяти минут спустя, и повтор, пришедший через минуту, окно уже не узнает.'
      - text: 'Оставить прибавку и сравнивать текст события с предыдущим'
        why: 'Два настоящих события «+10 очков» подряд выглядят одинаково. Такое сравнение выбросит законное событие.'
      - text: 'Оставить прибавку и раз в минуту перечитывать счёт с сервера'
        why: 'Счёт будет неверным до минуты после каждого дубля. Это лечит следствие, а не причину.'
    explanation: |
      Повтор безвреден, если событие несёт состояние, а не изменение: «стало X, версия 7» вместо «прибавь единицу».
      Если событие всё же несёт изменение, нужен отсев дублей по номеру события, и окно запомненных номеров должно быть
      дольше самой долгой задержки повтора у источника.
    links:
      - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues-at-least-once-delivery.html

  - id: sdl-events-004
    topic: Системы реального времени
    subtopic: Обработка событий
    level: senior
    question: |
      Банк отправляет клиентам важные уведомления: «Подозрительный вход в аккаунт». В журнале поддержки уведомление
      получает отметку «прочитано», как только служба push-уведомлений ответила банку «принято». Клиент, у которого
      украли деньги, говорит, что никакого уведомления не видел, а журнал показывает «прочитано». Как исправить
      журнал?
    options:
      - text: 'Ставить «прочитано», когда телефон показал уведомление'
        why: 'Показ — ещё не прочтение: уведомление могли смахнуть не глядя или не заметить под другими.'
      - text: 'Ставить «прочитано», когда уведомление доставлено на телефон клиента'
        why: 'Доставлено на устройство — ещё не увидено человеком. Это следующий уровень подтверждения, но не последний.'
      - text: 'Ставить «прочитано», только когда клиент открыл само уведомление'
        correct: true
        why: 'Отправлено, доставлено и прочитано — разные уровни подтверждения, и один не следует из другого. Прочтение видно только по тому, что клиент открыл уведомление или экран с ним.'
      - text: 'Ставить «прочитано», когда клиент в тот же день открыл приложение банка'
        why: 'Открыть приложение — не значит увидеть это предупреждение: оно могло уйти вниз ленты под другими событиями.'
    explanation: |
      Подтверждения бывают разного уровня: сервер или служба принял сообщение, оно сохранено, доставлено
      на устройство, прочитано человеком. Один уровень не следует из другого. Если процесс зависит от того, видел ли
      человек сообщение, нужна явная отметка о прочтении — открытие уведомления или нажатие кнопки, — а там, где это
      критично, ещё и запасной путь: звонок или письмо.
    links:
      - https://web.dev/articles/push-notifications-overview

  - id: sdl-events-005
    topic: Системы реального времени
    subtopic: Обработка событий
    level: senior
    multiple: true
    question: |
      Доска трекера задач получает события по SSE, у каждого — номер в потоке проекта, который сервер увеличивает
      на единицу. Кроме того, у каждой задачи есть номер версии, а свои изменения клиент отправляет обычными
      запросами и получает в ответ задачу целиком. Последним применено событие 880. Какие утверждения верны?
    options:
      - text: 'Если следом пришло событие 883, то 881 и 882 пропущены, и их нужно догнать'
        correct: true
        why: 'Номер в потоке растёт на единицу, поэтому скачок показывает разрыв. Это единственная из меток, которая видит, что события потеряны.'
      - text: 'Разрыв можно не закрывать: следующее событие о тех же задачах всё исправит'
        why: 'Следующего события о задаче может не быть часами. А пропущенное событие о новой задаче вообще никто не повторит.'
      - text: 'Номер в потоке защищает и от опоздавшего ответа на собственный запрос'
        why: 'Ответы на запросы идут не через поток, и номера в потоке у них нет. От опоздавшего ответа защищает версия задачи.'
      - text: 'Ответ на собственный запрос применяют, только если версия задачи в нём больше известной'
        correct: true
        why: 'Пока ответ шёл, по потоку могла прийти более новая версия. Сравнение версий не даст старому ответу её затереть.'
    explanation: |
      Номер в потоке отсеивает дубли и старые события потока и показывает разрывы, которые нужно закрыть. Версия
      сущности защищает от перестановок, откуда бы ни пришли данные, — в том числе от ответов на собственные
      запросы, которые идут мимо потока. Обычно нужны обе метки.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/Server-sent_events/Using_server-sent_events#формат_потока_событий

  - id: sdl-resync-001
    topic: Системы реального времени
    subtopic: Снимок и пересинхронизация
    level: junior
    question: |
      Лента соцсети загружается запросом `GET /feed`, а новые посты потом приходят по потоку событий. Ответ на запрос
      выглядит так: `{ "posts": [ … ], "position": 90210 }`. Зачем в ответе поле `position`?
    options:
      - text: 'Чтобы показать, сколько всего постов в ленте у человека'
        why: 'Позиция — не количество постов, а место в потоке событий, на котором собрана лента.'
      - text: 'Чтобы открыть подписку с этого места и не потерять события'
        correct: true
        why: 'Снимок собран по событие 90210 включительно. Подписка «после 90210» получит всё, что случилось позже, в том числе пока открывалось соединение.'
      - text: 'Чтобы прокрутка ленты вернулась на это место после перезагрузки страницы'
        why: 'Позиция прокрутки — дело клиента. Это поле связывает снимок с потоком событий.'
      - text: 'Чтобы сервер знал, какие посты человек уже прочитал'
        why: 'Прочитанное — отдельные данные. Поле описывает момент, на котором сервер собрал ответ.'
    explanation: |
      Если загрузить снимок и открыть поток независимо, событие между ними потеряется. Поэтому снимок сообщает свою
      позицию в потоке, а подписка открывается с неё: сервер пришлёт всё после этой позиции из своей истории. Так
      устроен, например, список и подписка в API Kubernetes с номером `resourceVersion`.
    links:
      - https://kubernetes.io/docs/reference/using-api/api-concepts/#efficient-detection-of-changes

  - id: sdl-resync-002
    topic: Системы реального времени
    subtopic: Снимок и пересинхронизация
    level: middle
    question: |
      Доска трекера задач получает изменения по WebSocket, но сервер не нумерует поток и подписаться «с позиции»
      нельзя. У каждой задачи есть номер версии. Чтобы не потерять изменения, клиент сначала открывает подписку,
      потом загружает доску. Пока доска грузилась, пришли три события. Что с ними делать?
    options:
      - text: 'Применить все три сразу, как пришли, а потом показать загруженную доску'
        why: 'Доска, загруженная позже, затрёт изменения из событий, если её собрали раньше них. Человек увидит старое состояние.'
      - text: 'Выбросить: загруженная доска уже содержит всё актуальное'
        why: 'Событие могло случиться после того, как сервер собрал доску. Если его выбросить, изменение потеряется.'
      - text: 'Сложить в буфер и после доски применить те, где версия задачи новее'
        correct: true
        why: 'Если версия задачи в событии больше, чем в доске, событие случилось позже снимка и его нужно применить. Иначе оно уже учтено.'
      - text: 'Перезагрузить доску ещё раз, чтобы она точно включила эти события'
        why: 'Пока грузится вторая доска, придут новые события, и вопрос повторится. Без сверки версий разрыв не закрыть.'
    explanation: |
      Когда сервер не отдаёт позицию в потоке, события, пришедшие до снимка, буферизуют. После загрузки снимка из буфера
      применяют только то, что новее по версии записи. Так ничего не теряется и старое не затирает новое. Цена — версии
      у каждой записи, а разрывы, случившиеся позже, без номера в потоке не видны.
    links:
      - https://kubernetes.io/docs/reference/using-api/api-concepts/#efficient-detection-of-changes

  - id: sdl-resync-006
    topic: Системы реального времени
    subtopic: Снимок и пересинхронизация
    level: middle
    question: |
      Биржевой терминал после долгого обрыва получил от сервера служебное событие «история недоступна,
      перечитайте» и загружает таблицу заявок заново. Поток событий при этом остаётся открытым. Ответ пришёл с позицией 5120, а пока он
      загружался, по потоку пришли события с номерами 5118, 5119, 5121 и 5122. Что сделать с этими событиями?
    options:
      - text: 'Применить все четыре сразу, как пришли, ещё до загруженной таблицы'
        why: 'Загруженная таблица потом затрёт 5121 и 5122 своими более старыми данными, а 5118 и 5119 и так в ней учтены.'
      - text: 'Выбросить все четыре: свежая таблица уже содержит всё актуальное'
        why: 'Таблица собрана по событие 5120 включительно. События 5121 и 5122 случились позже, и без них таблица сразу устареет.'
      - text: 'Сложить в буфер и после таблицы применить только 5121 и 5122'
        correct: true
        why: 'Позиция снимка 5120 говорит, что всё по 5120 включительно уже в таблице. Из буфера применяют только то, что новее позиции, и продолжают с 5122.'
      - text: 'Загрузить таблицу ещё раз, чтобы она включила и эти события'
        why: 'Пока грузится вторая таблица, придут новые события, и вопрос повторится. Позиция снимка позволяет закрыть разрыв без повторной загрузки.'
    explanation: |
      Пока снимок перечитывается, события продолжают приходить. Их буферизуют, а после загрузки снимка сравнивают
      с его позицией: то, что не новее позиции, уже учтено в снимке, а то, что новее, применяют по порядку. Это тот же
      приём, что и при первом открытии: снимок сообщает позицию, а поток продолжается с неё.
    links:
      - https://kubernetes.io/docs/reference/using-api/api-concepts/#efficient-detection-of-changes

  - id: sdl-resync-004
    topic: Системы реального времени
    subtopic: Снимок и пересинхронизация
    level: senior
    question: |
      Человек открыл ленту соцсети после трёх дней без сети. Сервер хранит историю событий ленты 24 часа и на
      переподключение с `Last-Event-ID` отвечает служебным событием «история недоступна». В ленте у человека
      открыт недописанный комментарий. Что сделать клиенту?
    options:
      - text: 'Слушать поток с текущего момента, пропущенное не трогать'
        why: 'Лента останется трёхдневной давности, и человек увидит только то, что случится после возврата.'
      - text: 'Повторять переподключение с тем же Last-Event-ID, пока история не найдётся'
        why: 'История за эти дни стёрта и не вернётся. Клиент будет бесконечно переподключаться без результата.'
      - text: 'Полностью пересобрать ленту: сбросить кэш, черновики и место прокрутки'
        why: 'Это обновит данные, но выбросит недописанный комментарий. Полная пересинхронизация нужна, когда локальному состоянию нельзя доверять, а здесь просто нет истории.'
      - text: 'Перечитать ленту, получить из неё новую позицию и подписаться с неё'
        correct: true
        why: 'Догнать нельзя — история стёрта. Свежий снимок с позицией даёт актуальную ленту и новую точку подписки, а черновик и прочее состояние экрана остаются.'
    explanation: |
      Догнать можно, пока сервер хранит историю. Если она стёрта, сервер должен сказать об этом явно: Kubernetes
      отвечает `410 Gone`, а для SSE удобнее служебное событие, потому что ответ с ошибкой остановит `EventSource`.
      Клиент перечитывает снимок, берёт из него новую позицию и подписывается с неё, аккуратно слив данные с тем,
      что открыто на экране.
    links:
      - https://kubernetes.io/docs/reference/using-api/api-concepts/#efficient-detection-of-changes

  - id: sdl-resync-005
    topic: Системы реального времени
    subtopic: Снимок и пересинхронизация
    level: senior
    multiple: true
    question: |
      Приложение кассира в магазине показывает остатки 200 товаров и получает изменения по потоку с номерами
      событий. Сервер хранит историю час. В каких случаях после переподключения правильнее перечитать снимок, чем
      догонять события?
    options:
      - text: 'Связи не было 5 секунд, пропущено 12 событий'
        why: 'Обрыв короткий, история есть, событий мало — дешевле догнать.'
      - text: 'Связи не было 40 минут, история есть, пропущено 30 событий'
        why: 'Обрыв короче часа истории, а 30 событий меньше, чем 200 строк. Догнать дешевле, чем перечитывать.'
      - text: 'Связи не было 20 минут, но за это время прошло 50 000 событий инвентаризации'
        correct: true
        why: 'Применять 50 000 событий ради 200 строк дороже, чем загрузить сами 200 строк. Когда событий больше, чем данных, перечитывают снимок.'
      - text: 'После переподключения одно событие пришло дважды'
        why: 'Дубль отсеивают по номеру или версии. Перечитывать из-за него все остатки незачем.'
    explanation: |
      Догонять выгодно, пока история сервера цела и пропущенных событий меньше, чем данных. Если история стёрта или
      событий набралось больше, чем весят сами данные, перечитывают снимок и подписываются с его позиции. Дубли
      и перестановки решаются на уровне событий, без перечитывания.
    links:
      - https://kubernetes.io/docs/reference/using-api/api-concepts/#efficient-detection-of-changes

  - id: sdl-realtime-ux-001
    topic: Системы реального времени
    subtopic: Реальное время глазами пользователя
    level: junior
    question: |
      В мессенджере сообщение сразу появляется в ленте с временным id и значком часов. Связь пропала, сообщение
      помечено «Не отправлено». Человек нажимает «Повторить». Почему повтор должен уйти с тем же временным id,
      а не с новым?
    options:
      - text: 'Чтобы сообщение встало в ленте на то же место, что и раньше'
        why: 'Место в ленте задаёт номер от сервера, а не временный id. Id нужен для другого.'
      - text: 'Чтобы сервер узнал повтор, если первая попытка всё-таки дошла'
        correct: true
        why: 'Временный id работает как ключ идемпотентности. Если первая отправка дошла, а ответ потерялся, сервер не создаст второе сообщение.'
      - text: 'Чтобы сервер мог восстановить текст, если клиент его потерял'
        why: 'Текст отправляется заново вместе с повтором. Сервер не хранит то, что до него не дошло.'
      - text: 'Чтобы получатель увидел, что сообщение отправлялось больше одного раза'
        why: 'Наоборот: цель в том, чтобы получатель увидел одно сообщение, а не два.'
    explanation: |
      Своё сообщение показывают сразу с временным id — это локальное эхо. Тот же id уходит на сервер и возвращается
      в рассылке, по нему клиент узнаёт своё сообщение и заменяет временное настоящим. При повторе id не меняют:
      он служит ключом идемпотентности, и если первая попытка дошла, сервер вернёт уже созданное сообщение вместо
      нового.
    links:
      - https://spec.matrix.org/latest/client-server-api/#local-echo

  - id: sdl-realtime-ux-002
    topic: Системы реального времени
    subtopic: Реальное время глазами пользователя
    level: middle
    question: |
      На совместной доске видны курсоры всех участников. В доске 20 человек, клиент каждого присылает положение
      курсора 30 раз в секунду — около 600 событий в секунду на экран. Каждое событие обновляет состояние и вызывает
      перерисовку, и доска тормозит. Курсоры должны двигаться плавно. Что предпочтительнее?
    options:
      - text: 'Обновлять курсор участника через debounce 500 мс после последнего события'
        why: 'Debounce сработает, только когда участник перестанет двигать мышь. Пока он двигает, курсор будет стоять, а потом прыгать.'
      - text: 'Копить события и раз в кадр рисовать последнее положение каждого курсора'
        correct: true
        why: 'Экран всё равно меняется не чаще раза в кадр. Одно обновление на кадр с последней точкой каждого участника — плавно и без лишней работы.'
      - text: 'Перенести обработку событий в Web Worker'
        why: 'Курсоры рисуются в DOM или на холсте основного потока. Воркер разберёт события, но 600 перерисовок в секунду останутся.'
      - text: 'Применять каждое событие внутри startTransition'
        why: 'Переход понизит приоритет, но обновлений останется 600 в секунду. Промежуточные положения курсора всё равно никто не увидит.'
    explanation: |
      Когда событий сотни в секунду, их применяют пакетом: копят и обновляют состояние раз в кадр через
      `requestAnimationFrame`. Для данных, где важно только последнее значение — координаты, счётчики, — промежуточные
      состояния пропускают. Это частный случай «сделать меньше работы» из урока о тяжёлой работе.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/Window/requestAnimationFrame

  - id: sdl-realtime-ux-003
    topic: Системы реального времени
    subtopic: Реальное время глазами пользователя
    level: middle
    question: |
      На совместной доске над стикером, который кто-то правит, показывается «Анна редактирует». Клиент Анны шлёт
      «начала редактировать» и «закончила». Анна закрыла крышку ноутбука посреди правки, и надпись висит у всех
      участников уже час. Как устроить такую надпись?
    options:
      - text: 'Доставлять «закончила» с гарантией «хотя бы один раз»'
        why: 'Ноутбук Анны уснул и ничего не отправил. Гарантия доставки не поможет событию, которое так и не было создано.'
      - text: 'Продлевать «редактирую» каждые несколько секунд, а без продления гасить'
        correct: true
        why: 'Надпись со сроком действия гаснет сама, если обновления перестали приходить, — по любой причине: закрыта вкладка, уснул ноутбук, потерялось событие.'
      - text: 'Раз в минуту опрашивать сервер, кто сейчас редактирует какие стикеры'
        why: 'Сервер знает то же, что и клиенты: «закончила» не пришло. Опрос вернёт ту же ошибку.'
      - text: 'Показывать надпись, пока каждый участник сам не перезагрузит страницу доски'
        why: 'Ошибка останется у всех, кто не перезагрузил страницу, и правка стикера будет выглядеть занятой.'
    explanation: |
      «Печатает», «редактирует», «в сети» — мимолётные статусы с гарантией «не больше одного раза»: их можно терять.
      Поэтому у них должен быть встроенный срок действия. Клиент продлевает статус, пока он актуален, а у получателей
      статус гаснет сам, если продление не пришло. Потеря события тогда даёт мигание, а не вечную надпись.
    links:
      - https://spec.matrix.org/latest/client-server-api/#typing-notifications

  - id: sdl-realtime-ux-004
    topic: Системы реального времени
    subtopic: Реальное время глазами пользователя
    level: senior
    question: |
      Биржевой терминал показывает плитки с текущей ценой 50 инструментов и ленту всех сделок по ним. События
      приходят по 300 в секунду, и каждое сразу перерисовывает экран — терминал тормозит. Трейдеру нужна плавная
      картинка, и в ленте сделок не должно пропадать ни одной сделки. Как обновлять экран?
    options:
      - text: 'Раз в кадр: в плитках — последняя цена, в ленту — все сделки за кадр'
        correct: true
        why: 'Для цены важно только последнее значение, и промежуточные можно пропустить. Для ленты важна каждая сделка, поэтому за кадр добавляются все пришедшие.'
      - text: 'Раз в кадр, и для плиток, и для ленты сделок — только последнее событие'
        why: 'Плитки будут верными, но лента потеряет сделки, пришедшие в один кадр. Пропуск промежуточных годится не для всех данных.'
      - text: 'Оставить как есть, но каждое обновление — в startTransition'
        why: '300 обновлений в секунду останутся. Переход меняет приоритет, а не число работы.'
      - text: 'Раз в секунду обновлять и плитки, и ленту сделок одним общим пакетом'
        why: 'Ничего не теряется, но цены будут дёргаться раз в секунду вместо плавного движения, а лента — прыгать на десятки строк.'
    explanation: |
      Пакетная обработка раз в кадр — общее правило для частых событий. Пропуск промежуточных состояний — нет:
      он годится для данных, где важно последнее значение (цена, координата, счётчик), и не годится для данных, где
      важно каждое событие (сделки, сообщения). В одном пакете может быть и то и другое.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/Window/requestAnimationFrame

  - id: sdl-realtime-ux-005
    topic: Системы реального времени
    subtopic: Реальное время глазами пользователя
    level: senior
    multiple: true
    question: |
      В совместном редакторе документов есть комментарии с отметками «прочитано», статус «в документе сейчас»
      у участников и надпись «печатает ответ». Команда пишет правила для этих статусов. Какие правила верны?
    options:
      - text: 'Отметку «прочитано» отправлять, когда комментарий виден на экране и вкладка активна'
        correct: true
        why: 'Прочитано — значит увидено. Комментарий, пришедший в фоновую вкладку, ещё никто не видел.'
      - text: 'Отметку «прочитано» доставлять с гарантией «не больше одного раза», как «печатает»'
        why: 'Отметку прочтения нельзя терять: потерянная отметка оставит комментарий непрочитанным навсегда и собьёт счётчик. Её сохраняют на сервере и догоняют после обрыва, а терять можно только мимолётные статусы.'
      - text: 'Доставлять «в документе сейчас» с гарантией «хотя бы один раз» и хранить историю'
        why: 'Присутствие — приблизительная мимолётная информация. Через минуту она устареет, и хранить и повторять её незачем.'
      - text: '«Печатает ответ» можно терять, если у надписи есть срок действия'
        correct: true
        why: 'Потеря мимолётного статуса безвредна, пока он гаснет сам. Без срока потерянное «перестал печатать» оставит надпись навсегда.'
      - text: 'Отметку «прочитано» ставить, когда комментарий пришёл на устройство участника'
        why: 'Пришёл — не значит увиден: вкладка может быть в фоне, а телефон — в кармане.'
    explanation: |
      У статусов разные гарантии. Сообщения и метки прочтения нельзя терять: они сохраняются на сервере и догоняются
      после обрыва. Отправляют отметку по видимости, а не по приходу; для ленты, которую читают по порядку, её удобно
      хранить как метку «прочитано до», которая только растёт. Присутствие и «печатает» можно терять, но им нужен срок
      действия.
    links:
      - https://spec.matrix.org/latest/client-server-api/#receipts

  - id: sdl-notifications-001
    topic: Системы реального времени
    subtopic: Уведомления
    level: junior
    question: |
      Платформа онлайн-обучения хочет напоминать «Вебинар начнётся через 10 минут», даже если у студента не открыт
      ни один её сайт. Без чего такое уведомление не придёт в закрытую вкладку?
    options:
      - text: 'Без WebSocket, который остаётся открытым после закрытия вкладки'
        why: 'Соединение принадлежит странице и закрывается вместе с ней. После закрытия вкладки принимать сообщения некому.'
      - text: 'Без таймера setTimeout на странице, заведённого на время вебинара'
        why: 'Таймер живёт, пока открыта страница. Закрыли вкладку — таймера нет.'
      - text: 'Без Service Worker и push-подписки в службе push'
        correct: true
        why: 'Сервер отправляет сообщение в службу push, она доставляет его на устройство, а браузер будит Service Worker, который и показывает уведомление.'
      - text: 'Без записи о вебинаре в localStorage браузера'
        why: 'localStorage — хранилище данных, а не способ получить сообщение. Без страницы его некому прочитать.'
    explanation: |
      Когда вкладка закрыта, на странице нет ни кода, ни соединения. Push-уведомление проходит иначе: сервер отправляет
      сообщение на адрес подписки в службе push разработчика браузера, служба доставляет его на устройство, а браузер
      будит Service Worker сайта — скрипт, который живёт отдельно от страниц. Тот показывает системное уведомление.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/Push_API

  - id: sdl-notifications-002
    topic: Системы реального времени
    subtopic: Уведомления
    level: middle
    question: |
      Соцсеть показывает браузерный запрос разрешения на уведомления сразу при открытии сайта. Большинство людей
      нажимают «Блокировать». Продукт хочет, чтобы уведомления о новых ответах на комментарии получало больше людей.
      Что предпочтительнее?
    options:
      - text: 'Спрашивать при загрузке, а тех, кто отказал, спросить снова через неделю'
        why: 'После «Блокировать» сайт больше не может спросить: вернуть разрешение можно только в настройках браузера.'
      - text: 'После первого комментария предложить своей кнопкой, по нажатию — запрос'
        correct: true
        why: 'Человек видит пользу в момент, когда она очевидна, и отказ в своей кнопке ничего не стоит. Браузерный запрос появляется только тем, кто уже согласился.'
      - text: 'Показывать браузерный запрос через 30 секунд после входа на сайт'
        why: 'Контекста по-прежнему нет, и запрос появляется не в ответ на действие человека. Safari и Firefox такой запрос и вовсе не покажут.'
      - text: 'Показывать браузерный запрос на экране входа, до того как откроется лента'
        why: 'В момент входа человек ещё не понимает, зачем уведомления, и блокирует их навсегда.'
    explanation: |
      Разрешение на уведомления браузер спрашивает один раз, и отказ почти необратим. Поэтому спрашивают в контексте,
      когда польза очевидна, после своего объяснения — это двойной запрос — и в ответ на нажатие человека.
    links:
      - https://web.dev/articles/push-notifications-permissions-ux

  - id: sdl-notifications-003
    topic: Системы реального времени
    subtopic: Уведомления
    level: middle
    question: |
      В веб-почте счётчик непрочитанных писем на каждом устройстве считается сам: новое письмо — «+1», открыл письмо —
      «−1». Человек читает почту на ноутбуке и телефоне, и у некоторых пользователей счётчик показывает «−2». Как
      устроить счётчик?
    options:
      - text: 'Не давать счётчику опускаться ниже нуля, сохранив «+1» и «−1»'
        why: 'Минус пропадёт, но счётчик всё равно разойдётся с правдой: дубли событий и прочтение на другом устройстве никуда не делись.'
      - text: 'Раз в минуту пересчитывать счётчик по списку писем, загруженному на это устройство'
        why: 'На устройстве загружена только часть писем, поэтому пересчёт по ней даст неверное число.'
      - text: 'Брать с сервера число непрочитанных с версией, применяя только более новое'
        correct: true
        why: 'Сервер — источник истины: он видит прочтение на любом устройстве. Событие-состояние с версией не боится дублей и опозданий.'
      - text: 'Синхронизировать «+1» и «−1» между устройствами через общий поток событий'
        why: 'Изменения по-прежнему применяются как разница, и дубль события сдвинет счётчик на всех устройствах сразу.'
    explanation: |
      Счётчик, который каждый экран считает сам по событиям «+1» и «−1», расходится при первом дубле или пропуске.
      Правильно, чтобы непрочитанное считал сервер по меткам прочтения и рассылал число с версией всем устройствам.
      Клиент применяет число, только если версия новее, и может оптимистично обнулить счётчик открытого письма.
    links:
      - https://spec.matrix.org/latest/client-server-api/#receipts

  - id: sdl-notifications-004
    topic: Системы реального времени
    subtopic: Уведомления
    level: senior
    question: |
      Платформа онлайн-обучения напоминает «Экзамен начнётся через 10 минут» только push-уведомлением. Опоздавшие
      на экзамен жалуются, что напоминания не было. Среди них студенты с iPhone, открывающие сайт в Safari, и те, чей
      ноутбук был выключен. Опоздание на экзамен стоит студенту пересдачи. Что предпочтительнее?
    options:
      - text: 'Повторять push по пять раз, пока служба не подтвердит доставку'
        why: 'Служба push подтверждает приём, а не показ. А на iPhone в обычной вкладке Safari push не придёт хоть с пятой попытки.'
      - text: 'Попросить студентов с iPhone разрешить уведомления в настройках Safari'
        why: 'В обычной вкладке Safari на iPhone push нет вовсе. Он работает только для веб-приложений, добавленных на экран «Домой».'
      - text: 'Отправлять push со сроком жизни в неделю, чтобы он дошёл наверняка'
        why: 'Ноутбук включат после экзамена, и напоминание придёт, когда оно уже бесполезно.'
      - text: 'Дублировать напоминание письмом или SMS: push не гарантирует доставку'
        correct: true
        why: 'Push — «по возможности»: устройство может быть выключено, уведомления — отключены, а на iPhone без экрана «Домой» их нет. Для события, без которого процесс ломается, нужен второй канал.'
    explanation: |
      Доставка push не гарантирована: служба хранит сообщение только в пределах срока жизни, человек может отключить
      уведомления, подписка — устареть, а на iPhone и iPad push есть только у веб-приложений на экране «Домой» начиная
      с iOS 16.4. Поэтому push не может быть единственным каналом для критичного события.
    links:
      - https://webkit.org/blog/13878/web-push-for-web-apps-on-ios-and-ipados/

  - id: sdl-notifications-005
    topic: Системы реального времени
    subtopic: Уведомления
    level: senior
    multiple: true
    question: |
      Веб-почта получает новые письма по WebSocket и вдобавок шлёт push-уведомления. Две жалобы. Первая: когда почта
      открыта, на каждое новое письмо появляются и плашка на странице, и системное уведомление. Вторая: после
      перезагрузки страницы сигнал о новом письме не звучит, пока человек что-нибудь не нажмёт. Какие решения
      устраняют эти жалобы?
    options:
      - text: 'Сервер шлёт push, только если у человека нет открытого соединения или письмо долго не прочитано'
        correct: true
        why: 'Сервер знает, открыта ли почта. Если открыта, хватит плашки на странице, а системное уведомление нужно, когда страницы нет.'
      - text: 'После загрузки показывать заметную плашку «Звук выключен — нажмите, чтобы включить»'
        correct: true
        why: 'Браузер разрешает звук только после взаимодействия с сайтом. Плашка честно говорит об этом и даёт включить звук одним нажатием.'
      - text: 'Создать AudioContext сразу при загрузке, чтобы звук был готов заранее'
        why: 'Созданный до нажатия AudioContext в Chrome стартует приостановленным. Звука не будет, пока его не возобновят после нажатия.'
      - text: 'Запрашивать разрешение на уведомления заново при каждом новом письме'
        why: 'Разрешение уже есть, а повторные запросы не убирают дубли и не включают звук.'
      - text: 'Удалять на сервере подписки, о которых служба push сообщила, что их больше нет'
        why: 'Это нужно делать, но к этим жалобам не относится: подписки рабочие, а уведомления дублируются и звук молчит.'
    explanation: |
      Чтобы не уведомлять дважды, решает сервер: он знает о живом соединении и шлёт push, только когда страницы нет
      или событие долго не прочитано. Звук подчиняется политике автовоспроизведения: до нажатия на сайте браузер его
      не воспроизведёт, поэтому экран со звуком начинается с явной кнопки или плашки.
    links:
      - https://developer.chrome.com/blog/autoplay
