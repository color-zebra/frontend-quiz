      - text: '`stopImmediatePropagation()` останавливает и всплытие, и остальные обработчики элемента'
        correct: true
        why: 'После него не сработают даже обработчики, повешенные на этот же элемент позже.'
      - text: '`stopPropagation()` заодно отменяет переход по ссылке и отправку формы'
        why: 'Всплытие и действие по умолчанию — разные вещи. Переход отменяет только `preventDefault()`.'
      - text: '`return false` в обработчике `addEventListener` отменяет действие браузера'
        why: '`return false` работает только в обработчиках-свойствах вроде `onclick`. В `addEventListener` он ничего не делает.'
    explanation: |
      Есть две независимые вещи: куда событие пойдёт дальше (всплытие) и что сделает браузер (действие по
      умолчанию). Первым управляют `stopPropagation` и `stopImmediatePropagation`, вторым `preventDefault`.
      Останавливать всплытие без серьёзной причины не стоит: это ломает делегирование и аналитику, которые
      слушают события наверху.
    links:
      - https://learn.javascript.ru/bubbling-and-capturing
      - https://learn.javascript.ru/default-browser-action

