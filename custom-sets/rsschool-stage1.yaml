      - text: 'В строгом режиме глобальному объекту, в нестрогом `undefined`'
        why: 'Наоборот: строгий режим оставляет `undefined`, а нестрогий подставляет глобальный объект.'
      - text: 'В строгом режиме `undefined`, в нестрогом глобальному объекту'
