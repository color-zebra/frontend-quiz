    options:
      - text: '`call` сразу вызывает функцию, аргументы идут через запятую'
        correct: true
        why: '`f.call(obj, 1, 2)` вызывает `f` с `this = obj` и аргументами 1 и 2.'
      - text: '`apply` сразу вызывает функцию, аргументы передаются массивом'
        correct: true
        why: '`f.apply(obj, [1, 2])` — то же самое, что `f.call(obj, 1, 2)`.'
      - text: '`bind` возвращает новую функцию и не вызывает исходную'
        correct: true
        why: 'Новая функция запомнит `this` и, если указаны, первые аргументы.'
      - text: '`bind` навсегда меняет `this` у исходной функции'
        why: 'Исходная функция не меняется, `bind` создаёт отдельную обёртку.'
      - text: '`call` и `apply` работают только с методами объектов'
        why: 'Их можно вызвать у любой обычной функции, это методы `Function.prototype`.'
    explanation: |
      Все три метода нужны, чтобы явно задать `this`. `call` и `apply` вызывают функцию прямо сейчас и
      отличаются только способом передачи аргументов. `bind` ничего не вызывает, а возвращает новую функцию с
      закреплённым `this`. Её можно передать как колбэк и вызвать позже.
    links:
      - https://learn.javascript.ru/call-apply-decorators
      - https://learn.javascript.ru/bind

  - id: rss1-045
    topic: JavaScript
    level: junior
    question: |
      Что выведет код?
    code: |
      function show() {
        console.log(this.firstName);
      }

      const a = { firstName: 'A' };
      const b = { firstName: 'B' };

      const bound = show.bind(a);
      bound.call(b);
      show.bind(a).bind(b)();
    codeLang: js
    options:
      - text: 'A, A'
        correct: true
        why: 'Привязанная функция игнорирует попытки поменять `this` и через `call`, и через повторный `bind`.'
      - text: 'B, B'
        why: '`this` привязанной функции уже закреплён, и `call` с повторным `bind` его не меняют.'
      - text: 'A, B'
        why: 'Второй `bind` оборачивает уже привязанную функцию, а та всё равно вызовет `show` с `a`.'
      - text: 'B, A'
        why: '`call` у привязанной функции не меняет её `this`.'
    explanation: |
      `bind` возвращает «обёртку», которая внутри всегда вызывает исходную функцию с запомненным `this`. Когда
      обёртку вызывают через `call` или снова оборачивают в `bind`, новый `this` получает только сама обёртка,
      а до `show` он не доходит. Поэтому `this` можно привязать один раз.
    links:
      - https://learn.javascript.ru/bind

