  # ===================== Хранилища =====================
  - id: rss1-103
    topic: JavaScript
    level: junior
    question: |
      Что верно про `localStorage`, `sessionStorage` и cookies?
    options:
      - text: '`localStorage` хранит данные без срока, пока их не удалят'
        correct: true
        why: 'Данные переживают закрытие вкладки и перезапуск браузера.'
      - text: '`sessionStorage` живёт, пока открыта вкладка, у каждой вкладки свой'
        correct: true
        why: 'Две вкладки с одним сайтом имеют разные `sessionStorage`, и при закрытии вкладки он очищается.'
      - text: 'Cookies сами отправляются на сервер с запросами к своему сайту'
        correct: true
        why: 'Браузер сам кладёт их в заголовок `Cookie` (с учётом `path`, `secure` и `samesite`). Поэтому в них держат, например, идентификатор сессии.'
      - text: '`localStorage` общий для всех сайтов в браузере'
        why: 'Хранилище привязано к источнику: протоколу, домену и порту. Чужие сайты его не видят.'
      - text: 'Объём `localStorage` такой же, как у cookie, около 4 КБ'
        why: 'Обычно около 5 МБ на источник, у cookie — около 4 КБ на штуку.'
    explanation: |
      Web Storage (`localStorage`, `sessionStorage`) — простое хранилище «ключ-строка» только для JavaScript на
      клиенте, на сервер оно само не уходит. Cookies меньше по объёму, зато автоматически ходят с запросами и
      могут быть недоступны скриптам (`HttpOnly`). Выбор зависит от того, нужен ли этот кусок данных серверу.
    links:
      - https://learn.javascript.ru/localstorage
      - https://learn.javascript.ru/cookie

