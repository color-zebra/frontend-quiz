        why: 'Второй элемент пропущен пустой позицией, а остаточный параметр собирает всё после третьего.'
    explanation: |
      Деструктуризация массива идёт по позициям. Пропустить элемент можно пустой позицией между запятыми, а
      собрать остаток в массив — через `...rest` в конце. Так же удобно менять значения местами: `[a, b] = [b, a]`.
    links:
      - https://learn.javascript.ru/destructuring-assignment

  - id: rss1-054
    topic: JavaScript
    level: junior
    question: |
      Какие вызовы бросят ошибку?
    code: |
      function createUser({ name, age = 18 }) {
        return `${name}, ${age}`;
      }
    codeLang: js
    options:
      - text: '`createUser({ name: ''Ann'' })`'
        why: 'Вернётся `"Ann, 18"`: возраст взят из значения по умолчанию.'
      - text: '`createUser({})`'
        why: 'Пустой объект можно деструктурировать, получится `"undefined, 18"`.'
      - text: '`createUser()`'
        correct: true
        why: 'Параметр равен `undefined`, а деструктурировать `undefined` нельзя: `TypeError`.'
      - text: '`createUser(null)`'
        correct: true
        why: 'Из `null` тоже нельзя достать свойства, это `TypeError`.'
      - text: '`createUser({ name: ''Bob'', age: null })`'
        why: 'Ошибки нет, просто вернётся `"Bob, null"`.'
    explanation: |
      Деструктуризация в параметрах — то же, что `const { name, age = 18 } = аргумент`. Если аргумента нет,
      деструктурировать нечего, и вызов падает. Обычно ставят значение по умолчанию для всего параметра:
      `function createUser({ name, age = 18 } = {})`. Тогда `createUser()` тоже сработает.
    links:
      - https://learn.javascript.ru/destructuring-assignment

  - id: rss1-055
    topic: JavaScript
    level: junior
    question: |
      Что выведет код?
    code: |
      const arr = ['a', 'b'];
      arr.extra = 'x';

      const keys = [];
      for (const key in arr) keys.push(key);

      const values = [];
      for (const value of arr) values.push(value);

      console.log(keys, values);
    codeLang: js
    options:
      - text: '[0, 1] [''a'', ''b'']'
        why: '`for..in` перебирает ключи-строки, а не числа, и захватывает добавленное свойство `extra`.'
      - text: '[''0'', ''1''] [''a'', ''b'', ''x'']'
        why: '`for..of` по массиву идёт только по элементам с индексами, свойство `extra` он не видит.'
      - text: '[''0'', ''1'', ''extra''] [''a'', ''b'']'
        correct: true
        why: '`for..in` перебирает все перечисляемые ключи объекта, а `for..of` только значения элементов массива.'
      - text: '[''a'', ''b'', ''x''] [''0'', ''1'', ''extra'']'
        why: 'Циклы перепутаны: значения даёт `for..of`, ключи — `for..in`.'
    explanation: |
      `for..in` создан для объектов: перебирает строковые ключи, включая унаследованные перечисляемые. Массив
      для него обычный объект с ключами `'0'`, `'1'` и любыми добавленными свойствами. `for..of` работает с
      перебираемыми объектами и у массива проходит только по элементам. Поэтому для массивов используют
      `for..of`.
    links:
      - https://learn.javascript.ru/array

  - id: rss1-056
    topic: JavaScript
    level: junior
    question: |
      Что произойдёт?
    code: |
      const user = { name: 'Ann', age: 30 };

      for (const value of user) {
        console.log(value);
      }
    codeLang: js
    options:
      - text: 'Выведется Ann и 30'
        why: 'Обычный объект нельзя перебирать через `for..of`, у него нет `Symbol.iterator`.'
      - text: 'Выведется name и age'
        why: 'Ключи перебирает `for..in`, а не `for..of`.'
      - text: 'TypeError'
        correct: true
        why: 'Простой объект не перебираемый: `user is not iterable`.'
      - text: 'Ничего: цикл не выполнится ни разу'
        why: 'Цикл не молчит: ещё до первой итерации бросается ошибка.'
    explanation: |
      `for..of` работает только с перебираемыми объектами: массивами, строками, `Map`, `Set` и любыми
      объектами с методом `Symbol.iterator`. У обычного объекта такого метода нет. Чтобы пройтись по нему,
      используют `Object.keys`, `Object.values` или `Object.entries`, они возвращают массивы.
    links:
      - https://learn.javascript.ru/iterable
      - https://learn.javascript.ru/keys-values-entries

