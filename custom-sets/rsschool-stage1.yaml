  - id: rss1-063
    topic: JavaScript
    level: junior
    question: |
      Какая реализация `deepFreeze` правильно замораживает объект вместе со всеми вложенными объектами?
    code: |
      // A
      function deepFreeze(o) {
        Object.values(o).forEach((v) => {
          if (typeof v === 'object' && v !== null) deepFreeze(v);
        });
        return Object.freeze(o);
      }

      // B
      function deepFreeze(o) {
        const copy = structuredClone(o);
        return Object.freeze(copy);
      }

      // C
      function deepFreeze(o) {
        for (const key in o) Object.freeze(o[key]);
        return o;
      }

      // D
      function deepFreeze(o) {
        Object.values(o).forEach(deepFreeze);
        return Object.freeze(o);
      }
    codeLang: js
    options:
      - text: 'A'
        correct: true
        why: 'В рекурсию уходят только объекты, примитивы пропускаются, а в конце замораживается сам объект.'
      - text: 'B'
        why: 'Заморожен только верхний уровень копии: её вложенные объекты изменяемы, а исходный объект не заморожен вовсе.'
      - text: 'C'
        why: 'Замораживаются только объекты первого уровня вложенности, а сам `o` и всё, что глубже, остаются изменяемыми.'
      - text: 'D'
        why: 'На строке рекурсия не остановится: `Object.values(''a'')` даёт `[''a'']`, и так до переполнения стека. На `null` в свойстве она тоже упадёт.'
    explanation: |
      Глубокая заморозка — это обход дерева: для каждого свойства-объекта функция вызывает саму себя, а затем
      замораживает текущий объект. Важно отсекать примитивы. Особенно строки: `Object.values` превращает
      строку в массив символов, и рекурсия без проверки уходит в бесконечность.
    links:
      - https://developer.mozilla.org/ru/docs/Web/JavaScript/Reference/Global_Objects/Object/freeze
      - https://learn.javascript.ru/recursion

