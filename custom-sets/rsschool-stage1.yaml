    question: |
      Что выведет код?
    code: |
      const el = document.createElement('div');
      document.body.append(el);

      document.body.addEventListener('hello', (e) => console.log('body', e.detail));
      el.addEventListener('hello', (e) => console.log('el', e.detail));

      el.dispatchEvent(new CustomEvent('hello', { detail: 42 }));
    codeLang: js
    options:
      - text: 'el 42, body 42'
        why: 'Свои события по умолчанию не всплывают. Чтобы дошло до `body`, нужен `bubbles: true`.'
      - text: 'el 42'
        correct: true
        why: 'Событие сработало на `el`, а всплытие у `CustomEvent` по умолчанию выключено.'
      - text: 'el undefined'
        why: 'Данные из `detail` попадают в `event.detail`.'
      - text: 'body 42, el 42'
        why: 'Обычный обработчик на `body` не срабатывает раньше цели, и всплытия тут нет вообще.'
    explanation: |
      Своё событие создают через `new CustomEvent(type, { detail, bubbles, cancelable })` и запускают через
      `dispatchEvent`. В `detail` можно положить любые данные. Флаг `bubbles` по умолчанию `false`, поэтому
      событие, которое нужно ловить на предках, создают с `bubbles: true`.
    links:
      - https://learn.javascript.ru/dispatch-events

  - id: rss1-097
    topic: JavaScript
    level: junior
    question: |
      Что выведется после `button.click()`?
    code: |
      button.onclick = () => console.log('A');
      button.onclick = () => console.log('B');
      button.addEventListener('click', () => console.log('C'));
      button.addEventListener('click', () => console.log('D'));

      button.click();
    codeLang: js
    options:
      - text: 'A, B, C, D'
        why: 'Свойство `onclick` хранит одну функцию, второе присваивание затёрло первое.'
      - text: 'C, D, B'
        why: 'Обработчики срабатывают в порядке установки, а `onclick` был задан раньше `addEventListener`.'
      - text: 'B, C, D'
        correct: true
        why: '`onclick` держит только последнюю функцию, а через `addEventListener` можно добавить сколько угодно.'
      - text: 'B, D'
        why: '`addEventListener` не заменяет прошлые обработчики, а добавляет новые.'
    explanation: |
      Свойство `on<событие>` — одно место для одного обработчика: новое присваивание заменяет старое.
      `addEventListener` хранит список, и все обработчики срабатывают в порядке добавления. Поэтому в библиотеках
      и больших приложениях используют `addEventListener`: никто не затрёт чужой обработчик.
    links:
      - https://learn.javascript.ru/introduction-browser-events

