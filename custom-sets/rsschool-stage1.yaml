    question: |
      Что выведется после `button.click()`?
    code: |
      button.addEventListener('click', () => console.log('hi'));
      button.removeEventListener('click', () => console.log('hi'));

      button.click();
    codeLang: js
    options:
      - text: 'hi'
        correct: true
        why: 'В `removeEventListener` передана новая функция, а не та, что была добавлена. Обработчик не снялся.'
      - text: 'Ничего не выведется'
        why: 'Две стрелочные функции с одинаковым текстом — разные объекты, поэтому снять обработчик не получилось.'
      - text: 'TypeError'
        why: 'Если обработчик не найден, `removeEventListener` молча ничего не делает.'
      - text: 'hi дважды'
        why: 'Обработчик добавлен один раз, поэтому и сработает один раз.'
    explanation: |
      `removeEventListener` ищет обработчик по ссылке на ту же самую функцию, с теми же типом события и флагом
      `capture`. Анонимную функцию потом не снять, поэтому обработчик, который надо будет убрать, сохраняют в
      переменную. Другой вариант — `AbortController` и опция `signal`.
    links:
      - https://learn.javascript.ru/introduction-browser-events

  - id: rss1-095
    topic: JavaScript
