  # ===================== Принципы =====================
  - id: rss1-109
    topic: Архитектура
    level: junior
    question: |
      Что означает принцип KISS?
    options:
      - text: 'Не повторять одно и то же знание в нескольких местах кода'
        why: 'Это DRY (Don''t Repeat Yourself).'
      - text: 'Делать решение настолько простым, насколько возможно'
        correct: true
        why: 'Keep It Simple, Stupid: простой код легче читать, проверять и менять.'
      - text: 'Не писать то, что сейчас не нужно, «на будущее»'
        why: 'Это YAGNI (You Aren''t Gonna Need It).'
      - text: 'Каждый модуль должен отвечать только за одну задачу'
        why: 'Это принцип единственной ответственности, буква S в SOLID.'
    explanation: |
      KISS (Keep It Simple, Stupid) предлагает выбирать самое простое решение, которое решает задачу. Хитрый
      однострочник, вложенные тернарные операторы или лишняя абстракция могут выглядеть умно, но их дольше
      читать и проще в них ошибиться. Простота — не примитивность, а отсутствие лишнего.

  - id: rss1-110
    topic: Архитектура
    level: junior
    question: |
      Обе функции проверяют, что пользователь совершеннолетний. Какой принцип здесь нарушен?
    code: |
      function getAdults(users) {
        return users.filter((user) => user.age >= 18);
      }

      function canBuyTicket(user) {
        return user.age >= 18;
      }
    codeLang: js
    options:
      - text: 'KISS: код слишком сложный для такой задачи'
        why: 'Обе функции предельно простые, сложности тут нет.'
      - text: 'YAGNI: эти функции никому не нужны в проекте'
        why: 'Из кода не видно, что функции лишние. Проблема в повторении правила.'
      - text: 'DRY: правило «взрослый с 18 лет» записано дважды'
        correct: true
        why: 'Если возраст изменится, придётся помнить про оба места. Правило стоит вынести в одну функцию `isAdult`.'
      - text: 'Нарушений нет: функции короткие и понятные'
        why: 'Длина кода тут ни при чём: одно и то же бизнес-правило живёт в двух местах.'
    explanation: |
      DRY (Don't Repeat Yourself) — про знания, а не про одинаковые строки. Если одно правило записано в
      нескольких местах, рано или поздно их поменяют не одновременно, и программа начнёт вести себя
      непоследовательно. Обычно правило выносят в именованную функцию или константу.

  - id: rss1-111
    topic: Архитектура
    level: junior
    question: |
      Какие решения противоречат принципу YAGNI?
    options:
      - text: 'Заранее добавить в форму пять языков, хотя сайт пока на одном'
        correct: true
        why: 'Переводы не нужны сейчас, а поддерживать их придётся уже сейчас.'
      - text: 'Написать систему плагинов ради одной кнопки'
        correct: true
        why: 'Гибкость, которая пока не нужна, усложняет код без пользы.'
      - text: 'Добавить параметр «на всякий случай», который никто не передаёт'
        correct: true
        why: 'Неиспользуемый параметр путает читателя и требует поддержки.'
      - text: 'Удалить код, который больше нигде не вызывается'
        why: 'Это как раз в духе YAGNI: мёртвый код только мешает.'
      - text: 'Сделать ровно то, что требует текущая задача'
        why: 'Это и есть YAGNI: не делать лишнего.'
    explanation: |
      YAGNI (You Aren't Gonna Need It) — не реализовывать возможности, пока они не понадобились. Предсказания
      будущего часто не сбываются, а лишний код приходится читать, тестировать и обновлять уже сегодня. Когда
      потребность появится, её реализуют, уже зная реальные требования.

