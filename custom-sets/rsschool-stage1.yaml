      Принципы иногда тянут в разные стороны. DRY просит убрать повторение, KISS — не усложнять. Помогает вопрос:
      «Если поменяется одна функция, должна ли поменяться и вторая?» Если да, это одно знание и его стоит
      объединить. Если нет, похожесть случайная, и две простые функции лучше одной с флагами.
