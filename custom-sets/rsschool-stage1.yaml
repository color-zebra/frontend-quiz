    question: |
      Разметка: `<div id="wrapper"><button id="child">OK</button></div>`. Что выведется при клике по кнопке?
    code: |
      wrapper.addEventListener('click', () => console.log('wrapper bubble'));
      wrapper.addEventListener('click', () => console.log('wrapper capture'), true);
      child.addEventListener('click', () => console.log('child'));
    codeLang: js
    options:
      - text: 'child, wrapper bubble, wrapper capture'
        why: 'Обработчик с `true` срабатывает на погружении, раньше всех, а не в конце.'
      - text: 'wrapper bubble, wrapper capture, child'
        why: 'Порядок регистрации обработчиков на родителе не важен: фазы идут в фиксированном порядке.'
      - text: 'wrapper capture, child, wrapper bubble'
        correct: true
        why: 'Сначала погружение сверху вниз, потом цель, потом всплытие снизу вверх.'
      - text: 'child, wrapper capture, wrapper bubble'
        why: 'Фаза погружения идёт до того, как событие дойдёт до кнопки.'
    explanation: |
      Событие проходит три фазы. Погружение: от `window` вниз к элементу, тут срабатывают обработчики с
      `capture: true` (или с третьим аргументом `true`). Цель: обработчики самого элемента. Всплытие: от
      элемента обратно вверх, тут работают обычные обработчики. Большинство обработчиков вешают на всплытие.
    links:
      - https://learn.javascript.ru/bubbling-and-capturing

