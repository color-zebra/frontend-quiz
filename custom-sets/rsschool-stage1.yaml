      - text: '{"name":"Ann"} string'
        why: 'Автоматического `JSON.stringify` нет, используется обычное приведение к строке.'
    explanation: |
      В `localStorage` и `sessionStorage` ключи и значения всегда строки. Всё остальное приводится к строке через
      `String(value)`, и для объектов информация теряется. Поэтому объекты сохраняют через `JSON.stringify`, а
      читают через `JSON.parse`.
