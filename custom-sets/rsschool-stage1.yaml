  - id: rss1-077
    topic: JavaScript
    level: junior
    question: |
      Что вернёт `padStart('abc', 8, 'xy')` для этой самописной функции?
    code: |
      function padStart(str, targetLength, padString = ' ') {
        if (str.length >= targetLength || padString === '') return str;
        const need = targetLength - str.length;
        const pad = padString.repeat(Math.ceil(need / padString.length));
        return pad.slice(0, need) + str;
      }
    codeLang: js
    options:
      - text: 'xyxyxyabc'
        why: '`slice(0, need)` обрезает заполнитель до 5 символов, итог длиной 8, а не 9.'
      - text: 'xyxyxabc'
        correct: true
        why: 'Нужно 5 символов: заполнитель повторяется 3 раза и обрезается до `xyxyx`.'
      - text: 'abcxyxyx'
        why: 'Заполнитель ставится перед строкой, а не после.'
      - text: 'xyxyabc'
        why: 'Длина результата должна быть ровно 8, а здесь 7.'
    explanation: |
      Полифил считает, сколько символов не хватает, повторяет заполнитель с запасом (округление вверх) и
      отрезает лишнее. Проверка пустого заполнителя нужна: иначе `need / 0` даст `Infinity`, и `repeat(Infinity)` бросит `RangeError`.
    links:
      - https://developer.mozilla.org/ru/docs/Web/JavaScript/Reference/Global_Objects/String/padStart

