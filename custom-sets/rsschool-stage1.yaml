    codeLang: js
    options:
      - text: 'outer, global'
        correct: true
        why: '`inner` находит `message` в ближайшем внешнем окружении, у `outer`. Глобальная переменная при этом не меняется.'
      - text: 'global, global'
        why: 'Поиск идёт от ближайшего окружения к дальнему, и `outer` с её `message` ближе глобального.'
      - text: 'outer, outer'
        why: '`let message` внутри `outer` — новая переменная, она не перезаписывает глобальную.'
      - text: 'undefined, global'
        why: 'Переменная в `outer` объявлена и инициализирована до вызова `inner`.'
    explanation: |
      Если переменной нет в текущей функции, движок ищет её во внешней, потом ещё выше, и так до глобальной
      области. Берётся первая найденная. Переменная с тем же именем во внутренней области «затеняет» внешнюю,
      но не меняет её.
    links:
      - https://learn.javascript.ru/closure

