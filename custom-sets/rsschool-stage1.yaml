  - id: rss1-035
    topic: JavaScript
    level: junior
    question: |
      Что выведет код?
    code: |
      function curry(fn) {
        return function curried(...args) {
          if (args.length >= fn.length) return fn(...args);
          return (...more) => curried(...args, ...more);
        };
      }

      const log = curry((level, module, message) => `[${level}] ${module}: ${message}`);
      const apiError = log('ERROR')('api');

      console.log(apiError('timeout'));
      console.log(apiError('not found'));
    codeLang: js
    options:
      - text: '[ERROR] api: timeout, затем [ERROR] api: not found'
        correct: true
        why: '`apiError` запомнила два первых аргумента и при каждом вызове добавляет третий.'
      - text: '[ERROR] api: timeout, затем функция'
        why: 'Каждый вызов `apiError` передаёт третий аргумент заново, а `args` не накапливаются между вызовами.'
      - text: '[api] ERROR: timeout, затем [api] ERROR: not found'
        why: 'Аргументы подставляются в том порядке, в котором переданы: сначала `level`, потом `module`.'
      - text: '[ERROR] api: timeout, затем [ERROR] api: timeout'
        why: 'Результат не кэшируется: при втором вызове `message` равен `not found`.'
    explanation: |
      Каррированная функция не меняет запомненные аргументы. `apiError` хранит `['ERROR', 'api']` в замыкании и
      при каждом вызове создаёт новый массив из них и нового аргумента. Поэтому одну частично применённую
      функцию можно вызывать сколько угодно раз.
    links:
      - https://learn.javascript.ru/currying-partials

