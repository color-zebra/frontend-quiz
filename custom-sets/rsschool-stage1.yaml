  - id: rss1-071
    topic: JavaScript
    level: junior
    question: |
      Что выведет самописный `flat`?
    code: |
      function flat(arr, depth = 1) {
        return arr.reduce((acc, item) => {
          if (Array.isArray(item) && depth > 0) {
            acc.push(...flat(item, depth - 1));
          } else {
            acc.push(item);
          }
          return acc;
        }, []);
      }

      console.log(flat([1, [2, [3, [4]]]], 2));
    codeLang: js
    options:
      - text: '[1, 2, [3, [4]]]'
        why: 'Так раскрыт один уровень, а передана глубина 2.'
      - text: '[1, 2, 3, 4]'
        why: 'Это полное раскрытие. При глубине 2 самый внутренний массив `[4]` останется.'
      - text: '[1, 2, 3, [4]]'
        correct: true
        why: 'Каждый рекурсивный вызов уменьшает глубину на 1, и на уровне `[4]` она становится 0.'
      - text: '[1, [2, [3, [4]]]]'
        why: 'Глубина больше нуля, поэтому вложенные массивы раскрываются.'
    explanation: |
      Самописный `flat` — классическая рекурсия: если элемент массив и глубина ещё не исчерпана, раскрыть его,
      вызвав себя же с глубиной на единицу меньше. Иначе положить элемент как есть. Глубина `Infinity` тоже
      работает: `Infinity - 1` по-прежнему `Infinity`.
    links:
      - https://developer.mozilla.org/ru/docs/Web/JavaScript/Reference/Global_Objects/Array/flat
      - https://learn.javascript.ru/recursion

