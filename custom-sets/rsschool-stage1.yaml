    question: |
      Что выведет код?
    code: |
      function curry(fn) {
        return function curried(...args) {
          if (args.length >= fn.length) return fn(...args);
          return (...more) => curried(...args, ...more);
        };
      }

      const sum3 = curry((a, b, c) => a + b + c);
      console.log(typeof sum3(1)(2), sum3(1)(2)(3), sum3(1, 2, 3));
    codeLang: js
    options:
      - text: 'number 6 6'
        why: 'После двух аргументов из трёх `fn` ещё не вызвана, возвращается функция, ждущая остальные.'
      - text: 'function 6 6'
        correct: true
        why: 'Двух аргументов мало, поэтому возвращается функция. С тремя аргументами, сразу или по частям, вызывается `fn`.'
      - text: 'undefined 6 6'
        why: '`curried` всегда что-то возвращает: либо результат, либо новую функцию.'
      - text: 'function 6 TypeError'
        why: 'Если передать все аргументы сразу, условие `args.length >= fn.length` выполнится с первого вызова.'
    explanation: |
      Каррированная функция копит аргументы, пока их не наберётся столько, сколько ожидает исходная функция
      (`fn.length`). Пока аргументов мало, она возвращает новую функцию, которая добавит следующие. Хорошая
      реализация позволяет передавать аргументы и по одному, и пачкой.
    links:
      - https://learn.javascript.ru/currying-partials

