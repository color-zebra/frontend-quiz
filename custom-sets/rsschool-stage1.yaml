# Свой набор по плану интервью RS School, CoreJS Interview #1 (rolling-scopes-school/tasks, interview-basic-coreJS.md).
# Темы: JavaScript, Архитектура. Уровень всех вопросов — junior. В сборку приложения не входит.
title: RSSchool - Stage1
questions:
  # ===================== Переменные, всплытие, полифилы =====================
  - id: rss1-001
    topic: JavaScript
    level: junior
    question: |
      Какие утверждения о `var`, `let` и `const` верны?
    options:
      - text: '`let` и `const` видны только внутри блока `{...}`, где объявлены'
        correct: true
        why: 'Блоком считается любое тело в фигурных скобках: `if`, `for`, просто `{}`. Снаружи такой переменной нет.'
      - text: '`var`, объявленная внутри `if`, видна во всей функции'
        correct: true
        why: 'У `var` нет блочной области видимости, только функциональная (или глобальная, если функции нет).'
      - text: '`const` запрещает менять свойства объекта, записанного в переменную'
        why: '`const` запрещает только присвоить переменной новое значение. Свойства объекта внутри меняются свободно.'
      - text: 'Повторное объявление через `var` в той же области не вызывает ошибку'
        correct: true
        why: 'Второе `var x` просто игнорируется как объявление, а присваивание выполняется. Для `let` и `const` это `SyntaxError`.'
      - text: '`let` можно объявить дважды в одном блоке, если значения разные'
        why: 'Повторное `let` с тем же именем в одном блоке — `SyntaxError`, ещё до запуска кода.'
    explanation: |
      `var` — старый способ объявления: область видимости у неё функциональная, объявление всплывает, и повторно
      объявлять её можно. `let` и `const` появились в ES2015: они живут в блоке, до строки объявления к ним
      обращаться нельзя, а повторное объявление запрещено. `const` отличается от `let` тем, что её нужно
      сразу инициализировать и нельзя записать в неё новое значение. Если в `const` лежит объект, сам объект менять
      можно.
    links:
      - https://learn.javascript.ru/var
      - https://learn.javascript.ru/variables
      - https://learn.javascript.ru/closure

  - id: rss1-002
    topic: JavaScript
    level: junior
    question: |
      Что выведет код?
    code: |
      console.log(typeof a);
      console.log(typeof b);
      let b = 1;
    codeLang: js
    options:
      - text: 'undefined, затем ReferenceError'
        correct: true
        why: '`a` вообще не объявлена, и `typeof` для неё безопасно возвращает `"undefined"`. А `b` объявлена через `let` ниже и до этой строки находится в TDZ.'
      - text: 'undefined, undefined'
        why: 'Так было бы с `var b`. Переменная `let` до строки объявления недоступна даже для `typeof`.'
      - text: 'ReferenceError на первой строке'
        why: '`typeof` от необъявленной переменной ошибку не бросает, это специально оставленная лазейка.'
      - text: 'undefined, number'
        why: 'Значение `1` попадёт в `b` только на третьей строке, а читаем мы её раньше.'
    explanation: |
      Переменная `let` или `const` существует с самого начала блока, но до строки объявления находится во
      «временной мёртвой зоне» (Temporal Dead Zone, TDZ). Любое обращение к ней в этот момент, даже `typeof`,
      бросает `ReferenceError: Cannot access 'b' before initialization`. С необъявленной переменной `typeof`
      ведёт себя мягче и просто возвращает `"undefined"`.
    links:
      - https://learn.javascript.ru/closure
      - https://developer.mozilla.org/ru/docs/Web/JavaScript/Reference/Statements/let

  - id: rss1-003
    topic: JavaScript
    level: junior
    question: |
      Что выведет код?
    code: |
      console.log(x);
      var x = 5;
      console.log(x);
    codeLang: js
    options:
      - text: 'undefined, 5'
        correct: true
        why: 'Объявление `var x` всплывает в начало, а присваивание `x = 5` остаётся на своём месте.'
      - text: '5, 5'
        why: 'Всплывает только объявление, значение присвоится позже, на второй строке.'
      - text: 'ReferenceError, 5'
        why: 'Ошибка была бы с `let` или `const`. Переменная `var` до присваивания просто равна `undefined`.'
      - text: 'null, 5'
        why: 'Неинициализированная `var` получает `undefined`, а не `null`.'
    explanation: |
      Всплытие (hoisting) — это поведение, при котором движок перед выполнением кода заранее создаёт все
      объявленные в области переменные и функции. Для `var` переменная сразу получает значение `undefined`, а
      реальное значение запишется, когда выполнение дойдёт до строки с присваиванием. Поэтому код ведёт себя
      так, будто `var x;` написали в самом начале.
    links:
      - https://learn.javascript.ru/var

  - id: rss1-004
    topic: JavaScript
    level: junior
    question: |
      Какая строка выбросит ошибку?
    code: |
      const user = { name: 'Ann' };
      user.name = 'Bob';        // 1
      user.age = 30;            // 2
      delete user.name;         // 3
      user = { name: 'Kate' };  // 4
    codeLang: js
    options:
      - text: 'Только 4'
        correct: true
        why: 'Это единственная строка, которая пытается записать в саму константу новое значение: `TypeError: Assignment to constant variable`.'
      - text: '2 и 4'
        why: 'Добавить объекту новое свойство можно. `const` защищает переменную, а не объект.'
      - text: '1, 2, 3 и 4'
        why: 'Строки 1–3 меняют объект, а не переменную `user`. Это разрешено.'
      - text: 'Ни одна'
        why: 'Строка 4 присваивает константе новый объект, а это запрещено.'
    explanation: |
      В переменной, где лежит объект, хранится ссылка на этот объект. `const` запрещает менять ссылку, то
      есть записывать в переменную что-то другое. Содержимое объекта по ссылке остаётся изменяемым: свойства
      можно менять, добавлять и удалять. Чтобы запретить и это, нужен `Object.freeze`.
    links:
      - https://learn.javascript.ru/object
      - https://developer.mozilla.org/ru/docs/Web/JavaScript/Reference/Statements/const

  - id: rss1-005
    topic: JavaScript
    level: junior
    question: |
      Что выведет код?
    code: |
      for (var i = 0; i < 3; i++) {
        setTimeout(() => console.log(i), 0);
      }
    codeLang: js
    options:
      - text: '3 3 3'
        correct: true
        why: 'Переменная `i` одна на весь цикл. Колбэки сработают после окончания цикла, когда `i` уже равна 3.'
      - text: '0 1 2'
        why: 'Так было бы с `let`: тогда у каждой итерации своя копия `i`.'
      - text: '2 2 2'
        why: 'Цикл останавливается, когда `i < 3` становится ложным, то есть при `i === 3`.'
      - text: 'undefined undefined undefined'
        why: 'Стрелочная функция видит переменную `i` через замыкание, просто к моменту вызова там 3.'
    explanation: |
      `setTimeout` даже с задержкой 0 запускает колбэк только после того, как выполнится весь текущий код.
      К этому моменту цикл уже закончился. У `var` нет блочной области видимости, поэтому все три стрелочные
      функции замыкают одну и ту же переменную `i` и видят её последнее значение 3.
    links:
      - https://learn.javascript.ru/closure
      - https://learn.javascript.ru/settimeout-setinterval

  - id: rss1-006
    topic: JavaScript
    level: junior
    question: |
      Какие правки заставят этот код вывести `0 1 2`?
    code: |
      for (var i = 0; i < 3; i++) {
        setTimeout(() => console.log(i), 0);
      }
    codeLang: js
    options:
      - text: 'Заменить `var` на `let`'
        correct: true
        why: 'С `let` на каждую итерацию создаётся своя переменная `i`, и каждый колбэк замыкает свою.'
      - text: 'Передать `i` третьим аргументом: `setTimeout((n) => console.log(n), 0, i)`'
        correct: true
        why: 'Дополнительные аргументы `setTimeout` передаёт в колбэк. Значение копируется в момент вызова `setTimeout`.'
      - text: 'Обернуть тело цикла в IIFE и передать туда `i` параметром'
        correct: true
        why: 'Каждый вызов IIFE создаёт новое окружение со своим параметром. Так делали до появления `let`.'
      - text: 'Поставить задержку `100` вместо `0`'
        why: 'Колбэки всё равно запустятся после цикла и увидят ту же единственную `i`, равную 3.'
      - text: 'Заменить стрелочную функцию на `function () {...}`'
        why: 'Обычная функция замыкает переменную так же, как стрелочная. Проблема в общей `i`, а не в виде функции.'
    explanation: |
      Корень проблемы в том, что все колбэки ссылаются на одну переменную. Любое исправление сводится к одному:
      у каждого колбэка должно быть своё значение. Его даёт блочная `let`, отдельный вызов функции или передача
      значения аргументом.
    links:
      - https://learn.javascript.ru/closure
      - https://learn.javascript.ru/settimeout-setinterval

  - id: rss1-007
    topic: JavaScript
    level: junior
    question: |
      Что произойдёт при запуске?
    code: |
      sayHi();

      var sayHi = function () {
        console.log('Hi');
      };
    codeLang: js
    options:
      - text: 'Выведется Hi'
        why: 'Так было бы с Function Declaration. Здесь функция записывается в переменную только на строке присваивания.'
      - text: 'TypeError'
        correct: true
        why: 'Переменная `sayHi` уже всплыла и равна `undefined`. Вызвать `undefined` как функцию нельзя: `sayHi is not a function`.'
      - text: 'ReferenceError'
        why: 'Ошибка `ReferenceError` была бы с `let` или `const`. Переменная `var` до присваивания существует и равна `undefined`.'
      - text: 'Ничего не выведется, ошибки не будет'
        why: 'Вызов `undefined()` всегда бросает ошибку.'
    explanation: |
      Function Expression — это обычное присваивание значения переменной. Всплывает только объявление `var sayHi`,
      значение `undefined`. Сама функция появится в переменной, когда выполнение дойдёт до присваивания.
    links:
      - https://learn.javascript.ru/function-expressions

  - id: rss1-008
    topic: JavaScript
    level: junior
    multiple: true
    question: |
      Какие из этих функций можно вызвать в коде выше строки, где они написаны?
    options:
      - text: '`function f() {}`'
        correct: true
        why: 'Function Declaration создаётся целиком ещё до выполнения кода, поэтому её можно вызвать раньше.'
      - text: '`var f = function () {}`'
        why: 'До присваивания `f` равна `undefined`, вызов даст `TypeError`.'
      - text: '`const f = () => {}`'
        why: 'До строки объявления `f` в TDZ, вызов даст `ReferenceError`.'
      - text: '`let f = function () {}`'
        why: 'То же, что с `const`: обращение до объявления даёт `ReferenceError`.'
    explanation: |
      Движок заранее обрабатывает все Function Declaration в области видимости и создаёт их целиком. Поэтому
      такие функции удобно объявлять внизу файла, а вызывать вверху. Function Expression и стрелочные функции —
      это значения, записанные в переменные, и они появляются только тогда, когда до них дойдёт выполнение.
    links:
      - https://learn.javascript.ru/function-expressions

  - id: rss1-009
    topic: JavaScript
    level: junior
    question: |
      Какие выражения вернут `true`?
    options:
      - text: '`Object.is(NaN, NaN)`'
        correct: true
        why: '`Object.is` считает `NaN` равным самому себе, в отличие от `===`.'
      - text: '`NaN === NaN`'
        why: 'По стандарту `NaN` не равно ничему, даже себе. Поэтому `===` здесь даёт `false`.'
      - text: '`Object.is(0, -0)`'
        why: '`Object.is` различает `0` и `-0`, поэтому здесь `false`.'
      - text: '`0 === -0`'
        correct: true
        why: 'Строгое сравнение считает ноль и минус ноль равными.'
      - text: '`Object.is(''a'', ''a'')`'
        correct: true
        why: 'Для обычных значений `Object.is` работает так же, как `===`.'
    explanation: |
      `Object.is` — то же строгое сравнение, но с двумя исключениями: `NaN` равно `NaN`, а `0` и `-0` считаются
      разными. Во всех остальных случаях результат совпадает с `===`. В своём коде `Object.is` нужен редко, но им
      пользуется, например, React, чтобы понять, изменилось ли состояние.
    links:
      - https://learn.javascript.ru/number
      - https://developer.mozilla.org/ru/docs/Web/JavaScript/Reference/Global_Objects/Object/is

  - id: rss1-010
    topic: JavaScript
    level: junior
    question: |
      Что такое полифил?
    options:
      - text: 'Код, который добавляет недостающую встроенную функцию в старый браузер'
        correct: true
        why: 'Например, если в браузере нет `Array.prototype.flat`, полифил дописывает этот метод на JavaScript.'
      - text: 'Программа, которая переписывает новый синтаксис вроде `?.` в старый'
        why: 'Это транспилятор, например Babel. Новый синтаксис полифилом не добавить, его нужно переписать.'
      - text: 'Библиотека, которая ускоряет работу встроенных методов браузера'
        why: 'Полифил не ускоряет методы, а добавляет те, которых нет.'
      - text: 'Флаг браузера, который включает экспериментальные возможности'
        why: 'Флаги браузера к полифилам отношения не имеют.'
    explanation: |
      Новые возможности языка бывают двух видов. Новые функции и методы (`Promise`, `Array.prototype.includes`)
      можно написать на старом JavaScript и подключить отдельно: это и есть полифил. Новый синтаксис (`?.`,
      `class`, стрелки) так не добавить, старый браузер просто не поймёт код. Его переписывает в старую форму
      транспилятор, например Babel. На практике их используют вместе.
    links:
      - https://learn.javascript.ru/polyfills

  - id: rss1-011
    topic: JavaScript
    level: junior
    question: |
      Зачем полифил обычно начинают с проверки вроде `if (!Array.prototype.flat)`?
    options:
      - text: 'Иначе браузер бросит ошибку при повторной записи метода в прототип'
        why: 'Записать в `Array.prototype` новое значение можно без ошибки, поэтому проверка нужна не для этого.'
      - text: 'Без проверки метод не попадёт в прототип массива'
        why: 'Присваивание `Array.prototype.flat = ...` работает и без проверки.'
      - text: 'Чтобы не затереть родную реализацию, которая быстрее и точнее'
        correct: true
        why: 'Встроенный метод написан внутри движка и учитывает все крайние случаи стандарта. Заменять его самодельным незачем.'
      - text: 'Проверка делает новый метод неперечисляемым'
        why: 'Перечисляемость задаётся через `Object.defineProperty`, `if` на неё не влияет.'
    explanation: |
      Полифил нужен только там, где метода нет. В современном браузере проверка не пропустит код дальше, и
      останется встроенный метод. Хороший полифил также добавляет метод через `Object.defineProperty` с
      `enumerable: false`, чтобы тот не вылезал в `for..in`, как и настоящие встроенные методы.
    links:
      - https://learn.javascript.ru/polyfills

  - id: rss1-012
    topic: JavaScript
    level: junior
    question: |
      Что выведет код?
    code: |
      if (true) {
        var a = 1;
        let b = 2;
      }
      console.log(a, typeof b);
    codeLang: js
    options:
      - text: '1 undefined'
        correct: true
        why: '`var a` видна за пределами блока, а `let b` нет. Для необъявленного имени `typeof` безопасно возвращает `"undefined"`.'
      - text: '1 number'
        why: '`b` объявлена через `let` внутри блока и снаружи не существует.'
      - text: 'ReferenceError'
        why: 'Прямое обращение к `b` дало бы ошибку, но `typeof` для неизвестного имени ошибку не бросает.'
      - text: 'undefined undefined'
        why: '`var` не привязана к блоку, поэтому `a` видна снаружи и равна 1.'
    explanation: |
      Блок `if` создаёт область видимости для `let`, `const`, `class` (и для функций в строгом режиме). Переменная `var` «пролетает»
      сквозь блок и принадлежит всей функции или глобальной области. Это одна из главных причин, по которым
      в современном коде `var` не используют.
    links:
      - https://learn.javascript.ru/var

  - id: rss1-013
    topic: JavaScript
    level: junior
    question: |
      Что выведет код?
    code: |
      let x = 1;

      function show() {
        console.log(x);
        let x = 2;
      }

      show();
    codeLang: js
    options:
      - text: '1'
        why: 'Внешняя `x` здесь не видна: внутри функции объявлена своя `x`, и она заслоняет внешнюю во всей функции.'
      - text: '2'
        why: 'Значение 2 запишется только на следующей строке, а читаем мы раньше.'
      - text: 'undefined'
        why: 'Так было бы с `var x = 2`. Переменная `let` до объявления не равна `undefined`, она недоступна.'
      - text: 'ReferenceError'
        correct: true
        why: 'Внутренняя `x` существует с начала функции, но до строки `let` находится в TDZ.'
    explanation: |
      Когда функция запускается, все её `let` и `const` сразу регистрируются в её окружении, но до строки
      объявления остаются в TDZ. Поэтому `console.log(x)` находит внутреннюю `x`, а не внешнюю, и падает. Это
      частая ловушка, когда во вложенной функции случайно используют то же имя, что и снаружи.
    links:
      - https://learn.javascript.ru/closure

  # ===================== Функции =====================
  - id: rss1-014
    topic: JavaScript
    level: junior
    question: |
      Что верно о стрелочных функциях?
    options:
      - text: 'У них нет своего `this`, он берётся из места создания'
        correct: true
        why: 'Стрелочная функция использует `this` внешнего кода, поэтому её удобно передавать колбэком внутри метода.'
      - text: 'Их нельзя вызвать через `new`'
        correct: true
        why: 'Конструктором стрелочная функция быть не может: `new` даст `TypeError`.'
      - text: 'У них нет свойства `prototype`'
        correct: true
        why: 'Раз стрелочную функцию нельзя вызвать через `new`, прототип для будущих объектов ей не нужен.'
      - text: 'В их теле нельзя писать `return`'
        why: 'В фигурных скобках `return` нужен как обычно. Без скобок результат возвращается неявно.'
      - text: 'Им нельзя задать параметры по умолчанию'
        why: 'Можно: `(a = 1) => a` работает.'
    explanation: |
      Стрелочная функция — короткая запись функции без собственного `this`, `arguments` и `prototype`. Её не
      вызвать как конструктор. Поэтому она хороша для колбэков и коротких выражений и плохо подходит для методов
      объекта, которым нужен свой `this`.
    links:
      - https://learn.javascript.ru/arrow-functions-basics
      - https://learn.javascript.ru/arrow-functions

  - id: rss1-015
    topic: JavaScript
    level: junior
    question: |
      Что выведет код?
    code: |
      const makeUser = () => { name: 'Ann' };
      console.log(makeUser());
    codeLang: js
    options:
      - text: '{ name: ''Ann'' }'
        why: 'Чтобы вернуть объект, его надо обернуть в скобки: `() => ({ name: ''Ann'' })`.'
      - text: 'undefined'
        correct: true
        why: 'Фигурные скобки здесь — тело функции, `name:` — метка, а `return` нет.'
      - text: 'SyntaxError'
        why: 'Код синтаксически корректен: внутри тела стоит метка `name` и строка `''Ann''`.'
      - text: 'Ann'
        why: 'Функция ничего не возвращает. Строка `''Ann''` просто вычисляется и отбрасывается.'
    explanation: |
      После стрелки `{` всегда начинает тело функции, а не объект. Внутри тела `name: 'Ann'` читается как
      метка `name` и выражение `'Ann'`. Раз `return` нет, функция возвращает `undefined`. Чтобы вернуть объект
      коротко, его оборачивают в круглые скобки.
    links:
      - https://learn.javascript.ru/arrow-functions-basics
      - https://developer.mozilla.org/ru/docs/Web/JavaScript/Reference/Functions/Arrow_functions

