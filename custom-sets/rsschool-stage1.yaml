          return (cache[n] = fn(n));
        };
      }
    codeLang: js
    options:
      - text: 'Оператор `in` не работает с числовыми ключами'
        why: '`in` работает с любыми ключами, числа приводятся к строкам.'
      - text: 'Нужно возвращать саму функцию `fn`, а не результат её вызова'
        why: 'Обёртка как раз должна возвращать результат, иначе это не замена исходной функции.'
      - text: 'Присваивание внутри `return` запрещено синтаксисом'
        why: 'Присваивание — выражение, у него есть значение, и вернуть его можно.'
      - text: 'Кэш создаётся заново при каждом вызове и ничего не запоминает'
        correct: true
        why: '`const cache = {}` стоит внутри возвращаемой функции. Его нужно вынести на уровень `memoize`, в замыкание.'
    explanation: |
      Мемоизация хранит результаты прошлых вызовов, и хранилище должно жить дольше одного вызова. Поэтому кэш
      объявляют во внешней функции `memoize`: он создаётся один раз, а возвращаемая функция обращается к нему
      через замыкание. Для любых типов ключей удобнее `Map`, чем обычный объект.
    links:
      - https://learn.javascript.ru/call-apply-decorators

