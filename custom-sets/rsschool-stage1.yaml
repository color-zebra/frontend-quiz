      console.log((user.hi)());
      console.log((user.hi || null)());
    codeLang: js
    options:
      - text: 'true, false, false'
        why: 'Скобки вокруг `user.hi` ничего не вычисляют, и контекст сохраняется.'
      - text: 'true, true, false'
        correct: true
        why: 'Первые два вызова идут прямо по ссылке «объект плюс свойство». Оператор `||` возвращает голую функцию, и `this` теряется.'
      - text: 'true, true, true'
        why: '`||` вычисляет значение и возвращает только функцию, без объекта.'
      - text: 'true, false, true'
        why: 'В третьей строке `||` вычисляет значение и возвращает голую функцию без объекта, поэтому `this` теряется.'
    explanation: |
      Выражение `user.hi` возвращает не просто функцию, а внутреннее значение «ссылочного типа»: функцию вместе с
      объектом. Если сразу после него стоят скобки вызова, `this` берётся из этой ссылки. Любая операция над
      выражением (`||`, присваивание, тернарный оператор) превращает ссылку в обычную функцию, и объект теряется.
      Просто скобки вокруг выражения ничего не вычисляют и ссылку не ломают.
    links:
      - https://learn.javascript.ru/reference-type

  - id: rss1-049
    topic: JavaScript
    level: junior
    question: |
      Что такое метод в JavaScript?
    options:
      - text: 'Функция в свойстве объекта, вызванная через точку'
        correct: true
        why: 'Технически метод — та же функция. Методом её делает способ вызова `obj.method()`.'
      - text: 'У метода есть `this`, а у обычной функции его нет'
        why: '`this` есть у любой обычной функции. Просто при вызове без объекта он `undefined` или глобальный объект.'
      - text: 'Метод можно объявить только в теле `class`, у объектов их нет'
        why: 'Методы есть и у обычных объектов: `{ sayHi() {...} }`.'
      - text: 'Метод нельзя передать в другую функцию как обычное значение'
        why: 'Можно, только при этом теряется `this`.'
    explanation: |
      С точки зрения `this` метод — та же функция, лежащая в свойстве объекта. Когда её вызывают через точку,
      в `this` попадает объект. Если ту же функцию взять отдельно, она теряет привязку к объекту. Небольшое
      отличие есть только у сокращённой записи `{ sayHi() {} }`: такой метод нельзя вызвать через `new`, и в нём
      работает `super`.
