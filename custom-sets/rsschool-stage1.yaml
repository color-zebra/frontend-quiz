    question: |
      Что верно про опции `addEventListener`?
    options:
      - text: '`{ once: true }` снимает обработчик после первого срабатывания'
        correct: true
        why: 'Удобно для одноразовых действий, не нужно вызывать `removeEventListener`.'
      - text: '`{ capture: true }` ловит событие на фазе погружения'
        correct: true
        why: 'То же, что третий аргумент `true` в старой форме записи.'
      - text: '`{ passive: true }` обещает, что обработчик не вызовет `preventDefault`'
        correct: true
        why: 'Браузеру не нужно ждать обработчик, чтобы начать прокрутку. Это ускоряет `touchmove` и `wheel`.'
      - text: '`{ once: true }` запрещает событию всплывать дальше'
        why: '`once` влияет только на сам обработчик, а не на путь события.'
      - text: '`{ passive: true }` запускает обработчик в отдельном потоке'
        why: 'Обработчики всегда выполняются в основном потоке. `passive` лишь разрешает не ждать их перед прокруткой.'
    explanation: |
      Третьим аргументом `addEventListener` можно передать объект опций: `once`, `capture`, `passive` и `signal`
      (снять обработчик через `AbortController`). Для `capture` раньше передавали просто `true`.
    links:
      - https://learn.javascript.ru/introduction-browser-events
      - https://learn.javascript.ru/default-browser-action

  - id: rss1-096
    topic: JavaScript
