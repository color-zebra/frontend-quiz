      - https://learn.javascript.ru/object-methods

  - id: rss1-050
    topic: JavaScript
    level: junior
    question: |
      Какие варианты выведут `Ann` через секунду?
    code: |
      const user = {
        firstName: 'Ann',
        sayHi() {
          console.log(this.firstName);
        },
      };
    codeLang: js
    options:
      - text: '`setTimeout(() => user.sayHi(), 1000)`'
        correct: true
        why: 'Стрелка вызывает метод через точку, контекст на месте.'
      - text: '`setTimeout(user.sayHi.bind(user), 1000)`'
        correct: true
        why: '`bind` закрепляет `this = user` заранее.'
      - text: '`setTimeout(user.sayHi(), 1000)`'
        why: 'Метод вызовется сразу, а в `setTimeout` уйдёт его результат `undefined`.'
      - text: '`setTimeout(function () { user.sayHi(); }, 1000)`'
        correct: true
        why: 'Обёртка вызывает метод через точку, как и стрелка.'
      - text: '`setTimeout(user.sayHi.call(user), 1000)`'
        why: '`call` тоже вызывает функцию сразу, а не через секунду.'
    explanation: |
      Чтобы метод не потерял `this` в колбэке, нужно либо вызвать его через точку внутри обёртки, либо заранее
      привязать контекст через `bind`. Частая ошибка — поставить скобки: тогда функция вызывается
      немедленно, а `setTimeout` получает её результат.
    links:
      - https://learn.javascript.ru/bind

