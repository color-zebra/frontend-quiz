      - https://learn.javascript.ru/json

  - id: rss1-105
    topic: JavaScript
    level: junior
    question: |
      Что верно про cookies?
    options:
      - text: '`document.cookie = ''theme=dark''` добавляет или обновляет одну куку, остальные не трогает'
        correct: true
        why: 'Запись в `document.cookie` — не обычное присваивание, а команда браузеру обновить одну куку.'
      - text: 'Куку с флагом `HttpOnly` нельзя прочитать из JavaScript'
        correct: true
        why: 'Так защищают, например, идентификатор сессии: даже при XSS скрипт его не украдёт.'
      - text: 'Без `expires` и `max-age` кука живёт до закрытия браузера'
        correct: true
        why: 'Это «сессионная» кука. Чтобы она жила дольше, задают срок.'
      - text: '`document.cookie` возвращает массив объектов с куками'
        why: 'Возвращается одна строка вида `"a=1; b=2"`, её надо разбирать самому.'
      - text: 'Куки одного сайта может прочитать JavaScript любого другого сайта'
        why: 'Куки привязаны к домену и пути, чужой сайт их не видит.'
    explanation: |
      `document.cookie` — странный интерфейс: при чтении он отдаёт строку со всеми доступными куками, а при записи
      меняет только одну. Важные настройки куки: `path`, `domain`, `expires` или `max-age`, `secure`, `samesite`
      и `HttpOnly`. Последний задаёт только сервер, из JavaScript его поставить нельзя.
    links:
      - https://learn.javascript.ru/cookie

  # ===================== Date и Intl =====================
  - id: rss1-106
    topic: JavaScript
    level: junior
    question: |
      Что выведет код?
    code: |
      const d = new Date(2024, 1, 30);
      console.log(d.getMonth(), d.getDate());
    codeLang: js
    options:
      - text: '1 30'
        why: 'В феврале 2024 года 29 дней, и лишний день переносится в март.'
      - text: '2 1'
        correct: true
        why: 'Месяц 1 — февраль. 30 февраля не существует, и дата «перетекает» в 1 марта, то есть месяц 2.'
      - text: '2 30'
        why: 'Перенос идёт на лишние дни: 30 февраля — это 1 марта, а не 30 марта.'
      - text: 'Invalid Date'
        why: '`Date` не считает такую дату ошибкой, а исправляет её автоматически.'
    explanation: |
      Месяцы в `Date` считаются с нуля: 0 — январь, 11 — декабрь. Если передать несуществующую дату, `Date` не
      бросает ошибку, а переносит излишек: 30 февраля становится 1 марта. Этим пользуются, например, чтобы
      прибавить дни: `date.setDate(date.getDate() + 10)`.
    links:
      - https://learn.javascript.ru/date

