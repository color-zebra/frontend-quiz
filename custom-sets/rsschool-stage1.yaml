  # ===================== Таймеры =====================
  - id: rss1-099
    topic: JavaScript
    level: junior
    question: |
      Что выведет код?
    code: |
      console.log(1);
      setTimeout(() => console.log(2), 0);
      console.log(3);
    codeLang: js
    options:
      - text: '1 2 3'
        why: 'Задержка 0 не значит «сразу». Колбэк ждёт, пока выполнится весь текущий код.'
      - text: '2 1 3'
        why: '`setTimeout` никогда не запускает колбэк раньше синхронного кода.'
      - text: '1 3 2'
        correct: true
        why: 'Колбэк таймера попадает в очередь и выполняется после того, как закончится текущий скрипт.'
      - text: '1 3'
        why: 'Задержка 0 допустима, колбэк выполнится, просто позже.'
    explanation: |
      `setTimeout` не останавливает выполнение: он ставит колбэк в очередь и сразу возвращает управление.
      Колбэк запустится, когда истечёт задержка и закончится текущий синхронный код. Поэтому `setTimeout(fn, 0)`
      — это «выполнить как можно скорее, но после текущего кода».
    links:
      - https://learn.javascript.ru/settimeout-setinterval
      - https://learn.javascript.ru/event-loop

  - id: rss1-100
    topic: JavaScript
    level: junior
    question: |
      Что выведет код?
    code: |
      const timer = setTimeout(() => console.log('A'), 100);
      setTimeout(() => clearTimeout(timer), 50);
      setTimeout(() => console.log('B'), 150);
    codeLang: js
    options:
      - text: 'A, B'
        why: 'Таймер `A` отменён через 50 мс, раньше, чем он успел сработать.'
      - text: 'B'
        correct: true
        why: '`clearTimeout` на 50-й миллисекунде отменяет запланированный на 100-ю вывод `A`.'
      - text: 'A'
        why: 'Таймер `B` никто не отменял.'
      - text: 'Ничего не выведется'
        why: '`clearTimeout(timer)` отменяет только таймер с этим идентификатором.'
    explanation: |
      `setTimeout` и `setInterval` возвращают идентификатор таймера. По нему таймер можно отменить через
      `clearTimeout` или `clearInterval`, если он ещё не сработал. Отмена уже сработавшего таймера ничего не
      делает и ошибку не бросает.
    links:
      - https://learn.javascript.ru/settimeout-setinterval

  - id: rss1-101
    topic: JavaScript
    level: junior
    question: |
      Что верно про `setInterval` и рекурсивный `setTimeout`?
    options:
      - text: '`setInterval` отсчитывает интервал от начала одного запуска до начала следующего'
        correct: true
        why: 'Если колбэк работает долго, пауза между его окончанием и следующим запуском сокращается.'
      - text: 'Рекурсивный `setTimeout` даёт паузу между концом одного запуска и началом следующего'
        correct: true
        why: 'Следующий таймер ставится только в конце колбэка, поэтому пауза не съедается.'
      - text: 'В рекурсивном `setTimeout` задержку можно менять на каждом шаге'
        correct: true
        why: 'Каждый раз вызывается новый `setTimeout`, и ему можно передать новую задержку, например увеличенную вдвое.'
      - text: '`setInterval` ждёт окончания колбэка и только потом начинает отсчёт'
        why: 'Это поведение рекурсивного `setTimeout`. `setInterval` отсчитывает от начала запуска.'
      - text: '`setTimeout(fn, 100)` запустит `fn` ровно через 100 мс'
        why: 'Задержка — минимальная. Если поток занят, колбэк подождёт дольше.'
    explanation: |
      `setInterval` удобен для простых повторов. Рекурсивный `setTimeout` гибче: можно менять задержку (например,
      реже опрашивать сервер при ошибках) и гарантировать паузу между запусками. В обоих случаях задержка
      означает «не раньше чем», а не «ровно через».
    links:
      - https://learn.javascript.ru/settimeout-setinterval

