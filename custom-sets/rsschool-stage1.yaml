  - id: rss1-022
    topic: JavaScript
    level: junior
    question: |
      Чем область видимости отличается от контекста (`this`)?
    options:
      - text: 'Область видимости задаётся местом в коде, а `this` — способом вызова'
        correct: true
        why: 'Какие переменные видны, понятно по тексту программы. Чему равен `this`, известно только в момент вызова.'
      - text: 'Это одно и то же, просто разные названия'
        why: 'Область видимости отвечает за переменные, `this` — за объект, с которым работает функция. Это разные механизмы.'
      - text: 'Область видимости задаётся вызовом, а `this` — местом в коде'
        why: 'Наоборот. Местом в коде `this` определяется только у стрелочных функций.'
      - text: 'Область видимости есть только у функций, а `this` только у объектов'
        why: 'Область видимости есть и у блоков, и у модулей. `this` есть в любой обычной функции.'
    explanation: |
      Область видимости (scope) отвечает на вопрос «какие переменные здесь доступны» и определяется текстом
      программы. Контекст (`this`) отвечает на вопрос «с каким объектом работает функция» и определяется тем,
      как функцию вызвали: `obj.f()`, `f()`, `f.call(x)`, `new F()`. Исключение — стрелочные функции: своего
      `this` у них нет, они берут его из окружения, то есть по месту в коде.
    links:
      - https://learn.javascript.ru/closure
      - https://learn.javascript.ru/object-methods

