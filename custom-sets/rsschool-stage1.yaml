      - text: 'Это дерево объектов, которое браузер строит по HTML страницы'
        correct: true
        why: 'Каждый тег, кусок текста и комментарий становится узлом этого дерева.'
      - text: 'Если поменять DOM из JavaScript, изменения появятся на странице'
        correct: true
        why: 'Браузер рисует страницу по DOM, поэтому изменения в нём отражаются на экране.'
      - text: 'Через объект `document` ищут элементы и создают новые'
        correct: true
        why: '`document` — точка входа в DOM: `querySelector`, `createElement`, `body` и другие.'
      - text: 'DOM входит в стандарт самого языка JavaScript, как массивы и объекты'
        why: 'DOM описан в отдельной спецификации WHATWG и реализуется браузером. В Node.js его нет.'
      - text: 'В DOM попадают только теги, а текст браузер хранит отдельно от дерева'
        why: 'Текст хранится в отдельных текстовых узлах, и даже пробелы между тегами становятся узлами.'
    explanation: |
      DOM (Document Object Model) — представление страницы в виде дерева объектов, с которым может работать
      JavaScript. Браузер разбирает HTML, строит DOM и рисует страницу по нему. Скрипт читает и меняет дерево,
      и браузер перерисовывает то, что изменилось.
    links:
      - https://learn.javascript.ru/dom-nodes
      - https://learn.javascript.ru/browser-environment

