  # ===================== Деструктуризация и перебор объектов =====================
  - id: rss1-052
    topic: JavaScript
    level: junior
    question: |
      Что выведет код?
    code: |
      const options = { title: 'Menu', size: { width: 100 } };

      const { size: { width, height = 200 }, items = [] } = options;
      console.log(width, height, items, typeof size);
    codeLang: js
    options:
      - text: '100 200 [] object'
        why: 'Запись `size: { ... }` только описывает, откуда достать `width` и `height`. Переменная `size` при этом не создаётся.'
      - text: '100 undefined [] undefined'
        why: 'У `height` есть значение по умолчанию 200, а в `options.size` такого свойства нет, значит, оно и подставится.'
      - text: '100 200 [] undefined'
        correct: true
        why: 'Из вложенного объекта достали `width` и `height` с умолчанием, `items` тоже взят по умолчанию, а переменной `size` нет.'
      - text: 'ReferenceError'
        why: '`typeof` от необъявленного имени не бросает ошибку, а возвращает `"undefined"`.'
    explanation: |
      Деструктуризация может быть вложенной: `size: { width }` значит «зайти в свойство `size` и достать из него
      `width`». Промежуточное имя слева от двоеточия — это путь, а не новая переменная. Если нужен и сам объект
      `size`, его указывают отдельно: `const { size, size: { width } } = options`. Если вложенного объекта может
      не быть, ему тоже задают умолчание: `size: { width } = {}`.
    links:
      - https://learn.javascript.ru/destructuring-assignment

  - id: rss1-053
    topic: JavaScript
    level: junior
    question: |
      Что выведет код?
    code: |
      const [first, , third, ...rest] = [1, 2, 3, 4, 5];
      console.log(first, third, rest);
    codeLang: js
    options:
      - text: '1 2 [3, 4, 5]'
        why: 'Пустое место между запятыми пропускает второй элемент, поэтому `third` получает 3.'
      - text: '1 3 [5]'
        why: '`...rest` собирает все оставшиеся элементы, а после третьего их два.'
      - text: '1 undefined [4, 5]'
        why: 'Пропущен только второй элемент. `third` получает 3.'
      - text: '1 3 [4, 5]'
