        why: '`for..of` первым делом вызывает `range[Symbol.iterator]()`.'
      - text: 'Метод `next()` у итератора, возвращающий `{ value, done }`'
        correct: true
        why: 'Цикл вызывает `next()` на каждой итерации и останавливается, когда `done` становится `true`.'
      - text: 'Свойство `length` с числом элементов, как у массива'
        why: '`length` делает объект псевдомассивом, но не перебираемым.'
      - text: 'Наследование от `Array.prototype` через `Object.setPrototypeOf`'
        why: 'Наследование не нужно: достаточно метода `Symbol.iterator`.'
      - text: 'Собственный метод `forEach`, который обходит элементы'
        why: '`for..of` не использует `forEach`, он работает только через протокол итерации.'
    explanation: |
      Протокол итерации простой. У объекта есть метод `[Symbol.iterator]()`, который возвращает итератор. У
      итератора есть `next()`, который каждый раз отдаёт `{ value, done }`. Этот протокол понимают `for..of`,
      спред `[...obj]`, `Array.from` и деструктуризация.
    links:
      - https://learn.javascript.ru/iterable

