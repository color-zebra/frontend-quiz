        why: 'KISS против лишней сложности, а не против абстракций вообще. Удачная общая функция упрощает код.'
      - text: 'Объединять, только если это одно правило: иначе оставить две'
        correct: true
        why: 'Если функции выражают одно знание, общая функция полезна. Если они лишь случайно похожи, объединение их свяжет.'
