# Свой набор с уроками: WebSocket — протокол, API браузера, надёжность, безопасность, архитектура, библиотеки.
# Формат — как у любого стороннего набора (см. examples/README.md). В сборку приложения не входит.
# Уроки перечисляют свои вопросы полем questions; номера вопросов не менять — к ним привязан прогресс людей.
# План уроков — plans/ws-course.md.
title: WebSocket
lessons:
  - id: wsl-intro
    topic: Введение
    title: Зачем нужен WebSocket
    questions: [ws-arch-004, ws-arch-006]
    body: |
      ## Какую проблему решаем

      Обычный веб устроен как разговор «вопрос — ответ»: браузер отправляет HTTP-запрос, сервер отвечает, и на этом
      всё. Сервер не может сам заговорить первым — он только отвечает на запросы.

      Теперь представим командный чат. Коллега написал сообщение — оно должно появиться у остальных сразу, а не когда
      они обновят страницу. Кто-то начал печатать — остальные видят «Оля печатает…». Человек закрыл ноутбук —
      его кружок «в сети» гаснет. Во всех этих случаях новость появляется на сервере, а доставить её нужно в браузер,
      который ни о чём не спрашивал.

      Этот набор — о WebSocket, самом распространённом способе дать серверу и браузеру говорить в обе стороны.
      В этом уроке — какие способы есть вообще, чем WebSocket от них отличается и когда он нужен, а когда нет.

      ## Четыре способа узнать новое

      - **Опрос** (polling) — браузер спрашивает сервер по таймеру: «есть что-нибудь новое?» Раз в пять секунд, раз
        в минуту. Проще некуда, работает везде. Цена — задержка до интервала и запросы впустую, когда нового нет.
      - **Длинный опрос** (long polling) — браузер отправляет запрос, а сервер не отвечает сразу, а держит его, пока
        не появится новость. Ответил — браузер тут же отправляет следующий запрос. Задержка маленькая, но каждое
        сообщение стоит целого HTTP-запроса с заголовками, а между запросами копятся паузы.
      - **События от сервера** (Server-Sent Events, SSE) — браузер открывает одно долгое HTTP-соединение, и сервер
        присылает по нему события, когда хочет. Встроенный объект `EventSource` сам переподключается. Но данные идут
        только от сервера к браузеру.
      - **WebSocket** — одно постоянное соединение, по которому обе стороны в любой момент отправляют друг другу
        сообщения. Начинается оно с обычного HTTP-запроса, а потом превращается в двусторонний канал.

      ## Что даёт WebSocket и чего не даёт

      **Даёт:**
      - сообщения в обе стороны по одному соединению, без нового запроса на каждое;
      - маленькую задержку: соединение уже открыто, сообщение просто уходит;
      - маленькие накладные расходы: у сообщения нет HTTP-заголовков (обычно это сотни байт), только заголовок
        **кадра** — порции данных протокола — в 2–14 байт (урок «Кадры, сообщения и закрытие»).

      **Не даёт** — и это надо сразу держать в голове:
      - кэширования, как у HTTP: каждый ответ живёт только в соединении;
      - стандартных кодов ответа и повторов: протокол сообщений придумывает приложение;
      - автоматического переподключения: если соединение оборвалось, браузер сам его не восстановит;
      - гарантии доставки: о ней тоже заботится приложение (урок «Доставка, порядок и обратное давление»).

      Поэтому WebSocket — не замена HTTP, а дополнение к нему. Страницы, картинки, списки и формы по-прежнему
      грузятся обычными запросами, а по сокету идёт только то, что должно приходить само и часто.

      ## Пример целиком: что в чате идёт по сокету

      Разберём командный чат по частям.

      - **Открыть приложение, загрузить список каналов и последние сообщения** — обычные HTTP-запросы: это разовое
        чтение, его удобно кэшировать.
      - **Новые сообщения от коллег** — по сокету: они приходят сами, в любой момент.
      - **«Печатает…»** — по сокету в обе стороны: человек начал печатать — браузер отправил событие, сервер разослал
        его остальным. Событий много, они короткие, и задержка важна.
      - **Отправить своё сообщение** — можно и так и так. По сокету быстрее, по HTTP проще получить ответ «сохранено»
        с кодом ошибки. Многие чаты отправляют по HTTP, а получают по сокету. Наш чат отправляет по сокету и сам
        строит подтверждение — как, расскажет урок «Доставка, порядок и обратное давление».
      - **Загрузить вложение** — только HTTP: большой файл по сокету — лишняя сложность.

      ## Как выбрать способ

      - **Опрос**
        - Подходит: новое появляется редко, задержка в минуту терпима — статус заказа, курс валют на сайте.
        - Цена: запросы впустую и задержка до интервала.
      - **Длинный опрос**
        - Подходит: как запасной путь, когда постоянные соединения режут прокси.
        - Цена: HTTP-запрос на каждое сообщение.
      - **SSE**
        - Подходит: данные идут только от сервера — уведомления, лента событий, прогресс задачи.
        - Цена: только в одну сторону; на HTTP/1.1 каждое соединение занимает место в лимите браузера (урок
          «Серверы, прокси и альтернативы»).
      - **WebSocket**
        - Подходит: сообщений много, они идут в обе стороны, важна задержка — чат, игры, совместная правка,
          котировки.
        - Цена: переподключение, доставку и протокол сообщений делает приложение; нужна настройка прокси.

      ## Типичные ошибки

      - **Брать WebSocket для всего.** Список статей или форма регистрации по сокету теряют кэш и коды ответов,
        а выигрыша нет.
      - **Брать WebSocket там, где хватит SSE.** Если сервер только присылает уведомления, двусторонний канал — лишняя
        сложность.
      - **Считать сокет надёжным, как HTTP-запрос.** У запроса есть ответ, у сообщения в сокете — нет, пока его
        не придумает приложение.

      ## Как спрашивают на интервью

      - «Чем WebSocket отличается от HTTP и от SSE?» — ждут двусторонний канал против «запрос — ответ» и одной
        стороны.
      - «Когда вы не стали бы использовать WebSocket?» — ждут разовые запросы, данные только от сервера, нужду
        в кэше.
      - «Как сделать уведомления в реальном времени?» — ждут сравнение опроса, SSE и WebSocket по направлению
        и частоте данных.

      ## Коротко

      - HTTP — «вопрос — ответ»: сервер не может заговорить первым. Чтобы доставить новость без запроса, есть
        опрос, длинный опрос, SSE и WebSocket.
      - WebSocket — одно постоянное соединение, по которому обе стороны в любой момент отправляют сообщения;
        начинается оно с обычного HTTP-запроса.
      - У WebSocket нет кэша, стандартных кодов ответа, автоматического переподключения и гарантии доставки — всё это
        делает приложение.
      - WebSocket берут, когда сообщений много, они идут в обе стороны и важна задержка. Если данные идут только
        от сервера, часто хватает SSE, а редкие новости проще получать опросом.
      - Даже в приложении с сокетом разовые чтения и загрузки файлов остаются обычными HTTP-запросами.

      ## Источники

      - [The WebSocket API (WebSockets) — MDN](https://developer.mozilla.org/ru/docs/Web/API/WebSockets_API)
      - [RFC 6455: The WebSocket Protocol, раздел 1 «Introduction»](https://datatracker.ietf.org/doc/html/rfc6455#section-1)

  - id: wsl-handshake
    topic: Протокол
    title: Рукопожатие и адрес соединения
    questions: [ws-proto-001, ws-proto-002, ws-proto-007, ws-api-008, ws-proto-009, ws-proto-008]
    body: |
      ## Какую проблему решаем

      WebSocket должен работать там же, где работает веб: на портах 80 и 443, через те же прокси, балансировщики
      и фаерволы. Поэтому соединение начинается не с нового протокола, а с обычного HTTP-запроса. Клиент как бы
      спрашивает: «давай дальше говорить по-другому?» — и, если сервер согласен, то же самое TCP-соединение
      превращается в канал WebSocket. Этот первый обмен называют **рукопожатием** (handshake).

      На рукопожатии ломается многое: прокси обрезает нужные заголовки, сервер выбирает не тот формат сообщений,
      страница по HTTPS пытается открыть незащищённый сокет. Урок о том, что происходит в эти первые миллисекунды.

      ## Как выглядит рукопожатие

      Браузер выполняет `new WebSocket('wss://chat.example.com/socket')` и отправляет:

      ```http
      GET /socket HTTP/1.1
      Host: chat.example.com
      Upgrade: websocket
      Connection: Upgrade
      Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==
      Sec-WebSocket-Version: 13
      Origin: https://chat.example.com
      Cookie: session=…
      ```

      Сервер, если согласен, отвечает:

      ```http
      HTTP/1.1 101 Switching Protocols
      Upgrade: websocket
      Connection: Upgrade
      Sec-WebSocket-Accept: s3pPLMBiTxaQ9kYGzzhZRbK+xOo=
      ```

      - **`Upgrade` и `Connection: Upgrade`** — просьба сменить протокол на этом же соединении.
      - **`101 Switching Protocols`** — согласие. С этого момента по TCP-соединению идут уже не HTTP-сообщения,
        а кадры WebSocket. Любой другой код браузер считает провалом рукопожатия.
      - **`Sec-WebSocket-Version: 13`** — версия протокола из RFC 6455. Если сервер её не поддерживает, он отвечает
        `426 Upgrade Required` и перечисляет свои версии.
      - **`Origin` и `Cookie`** браузер добавляет сам. О том, как их использовать для защиты, — урок «Безопасность WebSocket».

      ## Ключ и ответ на него

      Клиент кладёт в `Sec-WebSocket-Key` случайное значение. Сервер приклеивает к нему фиксированную строку из RFC
      (`258EAFA5-E914-47DA-95CA-C5AB0DC85B11`), считает SHA-1 и возвращает результат в base64 в
      `Sec-WebSocket-Accept`. Браузер проверяет значение.

      Зачем это нужно: так клиент убеждается, что ему ответил именно сервер WebSocket, а не старый прокси или кэш,
      который по ошибке вернул какой-то ответ. Это защита от недоразумений, а не шифрование и не проверка личности:
      значение может посчитать любой, кто видел ключ.

      ## Подпротоколы и расширения

      **Подпротокол** (subprotocol) — договорённость о формате сообщений поверх WebSocket. Сам WebSocket передаёт
      байты и строки, а что в них — решает приложение: свой JSON, `mqtt`, `graphql-transport-ws`. Клиент перечисляет,
      что умеет, вторым аргументом конструктора: `new WebSocket(url, ['chat.v2', 'chat.v1'])`. Они уходят
      в заголовке `Sec-WebSocket-Protocol`. Сервер выбирает **один** и возвращает его в том же заголовке, а клиент
      видит выбор в `ws.protocol`. Если клиент предложил варианты, а сервер ничего не выбрал, браузер проваливает
      соединение — страница увидит событие `error`, а затем `close` с кодом `1006`. Что это значит, разберём в уроках
      «Кадры, сообщения и закрытие» и «WebSocket в браузере».

      **Расширения** (extensions) меняют сами кадры. Самое известное — `permessage-deflate`: каждое сообщение
      сжимается алгоритмом deflate (RFC 7692). О нём договариваются в рукопожатии заголовком
      `Sec-WebSocket-Extensions`: клиент предлагает, сервер подтверждает или молчит — тогда сообщения идут без
      сжатия. Chrome предлагает сжатие сам, и выключить это из JavaScript нельзя. Распаковывает тоже браузер:
      в обработчик приходит обычное сообщение. На сервере сжатие стоит памяти и процессора, поэтому, например,
      в Node-библиотеке `ws` на сервере оно по умолчанию выключено.

      ## Адрес: ws, wss и относительные пути

      - **`ws://`** — незащищённое соединение, **`wss://`** — через TLS, как HTTPS. Со страницы, открытой по HTTPS,
        открыть `ws://` нельзя: это смешанное содержимое, и браузер запрещает его сразу (урок «Безопасность WebSocket»).
      - **Относительные адреса.** Раньше в конструктор можно было передать только полный адрес `ws://` или `wss://`,
        и его собирали из `location.host`. Современный стандарт WHATWG разрешает относительный адрес и схемы
        `http:` и `https:`: браузер разрешит адрес от страницы и заменит `http` на `ws`, а `https` на `wss`.
        Так, `new WebSocket('/socket')` на странице `https://example.com/app/` подключится к
        `wss://example.com/socket`. С 2024 года это поддерживают Chrome, Firefox и Safari; в старых браузерах такой
        адрес вызывает `SyntaxError`.

      ## WebSocket поверх HTTP/2 и HTTP/3

      В HTTP/1.1 каждый сокет занимает своё TCP-соединение. В HTTP/2 механизма `Upgrade` нет, поэтому RFC 8441
      придумал **расширенный `CONNECT`**: клиент отправляет `CONNECT` с псевдозаголовком `:protocol: websocket`,
      сервер отвечает `200`, и один поток внутри общего HTTP/2-соединения становится каналом WebSocket. Сокет делит
      соединение с обычными запросами страницы. Для HTTP/3 то же описывает RFC 9220. Если сервер такого не умеет,
      браузер откроет для сокета отдельное соединение HTTP/1.1. Для кода страницы всё это незаметно: API одно.

      ![Рукопожатие WebSocket: браузер отправляет GET с Upgrade, Sec-WebSocket-Key, версией 13, Origin и cookie и предлагает подпротоколы; сервер отвечает 101, Sec-WebSocket-Accept и выбранным подпротоколом; дальше по тому же соединению идут кадры в обе стороны — маску и управляющие кадры ping и pong разберём в следующем уроке](images/wsl-handshake.png "Рукопожатие: HTTP-запрос, который превращается в канал")

      ## Пример целиком: рукопожатие командного чата

      Фронтенд чата подключается так:

      ```js
      const ws = new WebSocket(`/socket?ticket=${ticket}`, ['chat.v2', 'chat.v1']);
      ws.onopen = () => console.log('протокол:', ws.protocol);
      ```

      1. Страница открыта по `https://chat.example.com`, поэтому адрес превращается в `wss://chat.example.com/socket?ticket=…`.
      2. Браузер отправляет рукопожатие с одноразовым билетом входа в адресе (как его получают — урок «Безопасность
         WebSocket»), `Origin`, двумя подпротоколами и предложением сжатия.
      3. Сервер проверяет `Origin` и билет, выбирает `chat.v2` — новый формат сообщений — и отвечает `101`.
         Сжатие он подтверждает, но сжимает только сообщения длиннее килобайта: короткие «печатает…» сжимать
         дороже, чем отправлять как есть.
      4. В `onopen` видно `протокол: chat.v2`. Старые клиенты, которые знают только `chat.v1`, получат свой формат:
         сервер выбирает из того, что предложили.

      ## Варианты и их цена

      - **Версия формата в подпротоколе** (`chat.v2`)
        - Подходит: формат меняется, старые и новые клиенты живут одновременно.
        - Цена: если сервер забудет вернуть выбранный подпротокол, соединение не откроется.
      - **Версия в адресе** (`/socket?v=2`)
        - Подходит: простой сервер, который не умеет выбирать подпротокол.
        - Цена: договорённость вне протокола — сервер должен сам её проверить.
      - **Сжатие `permessage-deflate`**
        - Подходит: длинные текстовые сообщения, например большие JSON.
        - Цена: память и процессор на сервере с тысячами соединений; для коротких сообщений выигрыша нет.

      ## Типичные ошибки

      - **Ждать `200` от рукопожатия по HTTP/1.1.** Согласие — только `101`.
      - **Считать `Sec-WebSocket-Accept` защитой.** Это проверка, что ответил сервер WebSocket, а не шифрование
        и не авторизация.
      - **Перечислять подпротоколы на клиенте, а на сервере их не выбирать.** Соединение проваливается.
      - **Собирать адрес вручную и ошибиться со схемой** — `ws://` со страницы по HTTPS.

      ## Как спрашивают на интервью

      - «Как устанавливается соединение WebSocket?» — ждут `GET` с `Upgrade`, ответ `101`, ключ и
        `Sec-WebSocket-Accept`.
      - «Зачем `Sec-WebSocket-Accept`?» — ждут защиту от посредников, а не криптографию.
      - «Что такое подпротокол?» — ждут договорённость о формате сообщений, которую выбирает сервер.

      ## Коротко

      - Соединение WebSocket начинается обычным HTTP-запросом с `Upgrade: websocket`, и только ответ
        `101 Switching Protocols` превращает то же TCP-соединение в канал кадров.
      - `Sec-WebSocket-Accept` — ответ сервера на случайный ключ клиента; он доказывает, что ответил именно сервер
        WebSocket, но ничего не шифрует и не проверяет пользователя.
      - Подпротокол — договорённость о формате сообщений: клиент предлагает варианты, сервер выбирает один и обязан
        его вернуть, иначе соединение проваливается.
      - Сжатие `permessage-deflate` согласуют в рукопожатии; распаковывает его браузер, а на сервере оно стоит памяти
        и процессора.
      - Современные браузеры принимают относительный адрес и схемы `http(s)` и сами меняют их на `ws(s)`; со страницы
        по HTTPS открыть `ws://` нельзя.
      - Поверх HTTP/2 и HTTP/3 сокет открывается расширенным `CONNECT` и делит соединение с запросами страницы; для
        кода это незаметно.

      ## Источники

      - [RFC 6455, раздел 4 «Opening Handshake»](https://datatracker.ietf.org/doc/html/rfc6455#section-4)
      - [WebSockets Standard — WHATWG](https://websockets.spec.whatwg.org/)
      - [RFC 8441: Bootstrapping WebSockets with HTTP/2](https://datatracker.ietf.org/doc/html/rfc8441)

  - id: wsl-frames
    topic: Протокол
    title: Кадры, сообщения и закрытие
    questions: [ws-proto-005, ws-proto-003, ws-proto-004, ws-proto-006, ws-api-004]
    body: |
      ## Какую проблему решаем

      После рукопожатия по соединению идут уже не HTTP-запросы, а **кадры** (frames). Браузер прячет их от кода:
      страница видит только целые сообщения и закрытие. Но устройство кадров объясняет многое из того, что
      встречается на практике: почему большое сообщение приходит одним событием, зачем браузер «маскирует» данные,
      откуда в событии закрытия код `1006`, которого никто не отправлял, и почему `ws.close(1011)` бросает
      исключение.

      ## Кадры и сообщения

      **Сообщение** (message) — то, что приложение отправило одним вызовом `send()`: строка или двоичные данные.
      **Кадр** — единица передачи по сети. Небольшое сообщение обычно уходит одним кадром, большое отправитель
      может разбить на **фрагменты**.

      У каждого кадра короткий заголовок:
      - **тип** (opcode): текст, двоичные данные, продолжение фрагмента — это кадры с данными; закрытие (close),
        ping и pong — это **управляющие** кадры;
      - **бит FIN** — «это последний кадр сообщения»;
      - **бит маски и ключ маски** — о них ниже;
      - **длина** полезной нагрузки.

      Фрагментированное сообщение выглядит так: первый кадр с типом «текст» или «двоичные данные», следующие —
      с типом «продолжение», у последнего выставлен FIN. Браузер собирает фрагменты сам, и `onmessage` срабатывает
      один раз — с целым сообщением. Обратная сторона: читать большое сообщение по частям, пока оно приходит,
      стандартный `WebSocket` не умеет.

      ## Маска: защита посредников, а не секретность

      **Маскирование** — XOR полезной нагрузки со случайным четырёхбайтовым ключом, который лежит тут же, в заголовке
      кадра. Снять маску может кто угодно, поэтому от чтения она не защищает — для этого есть TLS в `wss://`.

      Смысл маски в другом. Код на странице может оказаться враждебным. Без маски он мог бы подобрать такие байты,
      которые старый прокси или кэш на пути примет за HTTP-запрос и закэширует чужой ответ — это атака отравления
      кэша. Случайная маска на каждом кадре делает такие байты непредсказуемыми. Поэтому правило несимметричное:
      - клиент **обязан** маскировать каждый кадр, который отправляет серверу; сервер, получив немаскированный кадр,
        закрывает соединение;
      - сервер кадры **не маскирует**; клиент, получив маскированный кадр, тоже закрывает соединение.

      В браузере маскирует сам браузер, новым ключом для каждого кадра. Из JavaScript этим не управляют.

      ## Управляющие кадры: ping, pong и close

      - **Ping и pong** — проверка «ты жив?»: на ping собеседник отвечает pong. Pong можно отправить и сам по себе,
        как одностороннее «я жив», — ответа на него не ждут.
      - **Управляющие кадры короткие и целые:** полезная нагрузка не больше 125 байт, разбивать их на фрагменты нельзя.
      - **Их можно вставлять между фрагментами** большого сообщения. Так ping и закрытие не ждут, пока дойдёт
        мегабайтная передача.
      - **В браузере ими управляет браузер.** На ping сервера он отвечает pong сам, но не сообщает странице, а
        отправить ping из JavaScript нельзя: методов `ping()` и `pong()` у браузерного `WebSocket` нет. Поэтому
        проверку связи со стороны страницы делают своими сообщениями (урок «Обрывы и переподключение»).

      ## Закрытие и его коды

      **Закрытие по протоколу** — обмен кадрами close: одна сторона отправляет close с **кодом** и необязательной
      **причиной** (reason), другая отвечает своим close, и только потом закрывается TCP-соединение. Такое закрытие
      браузер помечает `wasClean: true`.

      Коды закрытия:
      - **`1000`** — нормальное закрытие: работа закончена.
      - **`1001` Going Away** — сторона уходит: например, браузер закрывает страницу или сервер выключается;
        **`1012` Service Restart** — сервер перезапускается и просит подключиться снова.
      - **`1002`, `1003`, `1007`, `1009`** — ошибка протокола, неподдерживаемые данные, неверные данные, слишком
        большое сообщение.
      - **`1008`** — нарушение правил, **`1011`** — внутренняя ошибка сервера, **`1013` Try Again Later** — сервер
        перегружен, приходите позже.
      - **`3000`–`3999`** — регистрируемые коды библиотек и фреймворков, **`4000`–`4999`** — коды самого приложения,
        например `4001` «не авторизован».

      Три кода по сети **не передаются никогда** — их ставит сам браузер, чтобы сообщить приложению, что случилось:
      - **`1005`** — кадр close пришёл без кода;
      - **`1006`** — закрытия по протоколу не было вовсе: сеть пропала, процесс сервера убит, прокси оборвал TCP.
        Тогда `wasClean: false`. Для приложения это обычно сигнал переподключаться;
      - **`1015`** — не удалось установить TLS.

      **Что можно передать из JavaScript.** `ws.close(code, reason)` принимает только `1000` или код из диапазона
      `3000`–`4999`. Остальные коды протокола — для серверов и самих реализаций, и браузер на них бросает
      `InvalidAccessError`. Причина — не длиннее 123 байт в UTF-8 (код и причина должны поместиться в управляющий
      кадр), иначе будет `SyntaxError`.

      ## Пример целиком: как закрывается чат

      - **Человек выходит из аккаунта.** Фронтенд вызывает `ws.close(4000, 'logout')`. Сервер отвечает close, событие
        `close` приходит с кодом `4000` и `wasClean: true`. Переподключаться не нужно.
      - **Сессия истекла.** Сервер сам закрывает соединение кодом `4001` с причиной «не авторизован». Клиент видит
        код, обновляет вход и только потом подключается заново.
      - **Сервер перегружен.** Сервер закрывает с `1013`. Клиент переподключается с паузой подольше.
      - **Пропал Wi-Fi.** Кадров close никто не отправил. Через какое-то время браузер сообщает `1006`
        и `wasClean: false`. Клиент переподключается.
      - **Ошибка в коде фронтенда.** Разработчик пишет `ws.close(1011)`, «чтобы сообщить серверу об ошибке», и получает
        `InvalidAccessError`: из скрипта такой код передать нельзя. Нужен свой код из диапазона `4000`–`4999`.

      ## Варианты и их цена

      - **Свой код закрытия** (`4001`, `4003`…)
        - Подходит: клиенту нужно понять причину и решить, переподключаться ли.
        - Цена: коды — договорённость приложения, их нужно описать и держать одинаковыми на клиенте и сервере.
      - **Сообщение с причиной перед закрытием**
        - Подходит: причина длинная или с данными — больше, чем влезает в 123 байта.
        - Цена: сообщение может не дойти, если соединение оборвётся раньше.
      - **Закрытие без кода**
        - Подходит: почти никогда.
        - Цена: клиент получит `1005` и не узнает, что делать дальше.

      ## Типичные ошибки

      - **Думать, что маска шифрует.** От чтения защищает только `wss://`.
      - **Ждать `onmessage` на каждый фрагмент.** Браузер отдаёт сообщения целиком.
      - **Искать `ws.ping()` в браузере.** Его нет; проверку связи делают своими сообщениями.
      - **Передавать из JavaScript коды протокола** вроде `1001` или `1011` — будет исключение.
      - **Ждать `1006` от сервера.** Этот код ставит только браузер.

      ## Как спрашивают на интервью

      - «Зачем клиент маскирует кадры?» — ждут защиту посредников от отравления кэша, а не шифрование.
      - «Что значит код закрытия `1006`?» — ждут «закрытия по протоколу не было, его ставит браузер».
      - «Как сообщить клиенту, что его выкинули за неверный токен?» — ждут свой код из `4000`–`4999`.

      ## Коротко

      - По соединению идут кадры; сообщение — это один или несколько кадров. Браузер собирает фрагменты сам
        и отдаёт в `onmessage` целое сообщение.
      - Клиент обязан маскировать каждый кадр, сервер — не маскирует. Маска защищает старые прокси и кэши
        от подделанных запросов, а не скрывает данные: от чтения защищает только `wss://`.
      - Управляющие кадры — close, ping, pong — короткие (до 125 байт), не фрагментируются и могут приходить посреди
        большого сообщения. Ping и pong в браузере обрабатывает сам браузер, из JavaScript их не отправить.
      - Закрытие по протоколу — обмен кадрами close с кодом и причиной; коды `1005`, `1006` и `1015` по сети
        не передаются, их ставит браузер, а `1006` обычно значит обрыв.
      - Из JavaScript в `close()` можно передать только `1000` и коды `3000`–`4999`, причину — до 123 байт; для своих
        причин приложение берёт коды `4000`–`4999`.

      ## Источники

      - [RFC 6455, раздел 5 «Data Framing»](https://datatracker.ietf.org/doc/html/rfc6455#section-5)
      - [RFC 6455, раздел 7.4 «Status Codes»](https://datatracker.ietf.org/doc/html/rfc6455#section-7.4)
      - [WebSocket: close() — MDN](https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/close)

  - id: wsl-browser-api
    topic: API браузера
    title: WebSocket в браузере
    questions: [ws-api-001, ws-api-002, ws-api-003, ws-api-006, ws-api-009, ws-api-010, ws-api-005]
    body: |
      ## Какую проблему решаем

      Браузерный `WebSocket` выглядит простым: конструктор, `send()`, четыре события. Но почти каждая его часть
      асинхронна и ведёт себя не так, как ждёшь от обычного объекта. Сообщение, отправленное сразу после создания,
      бросает исключение. Сообщение, отправленное после обрыва, молча пропадает. Событие ошибки не говорит, что
      случилось. Урок о том, как устроен объект и где на нём спотыкаются.

      ## Жизненный цикл: четыре состояния

      `ws.readyState` показывает, в каком состоянии соединение. Для чисел есть константы `WebSocket.CONNECTING`,
      `WebSocket.OPEN` и так далее.

      - **`0` CONNECTING** — сразу после конструктора. Конструктор не ждёт сети: рукопожатие идёт в фоне.
      - **`1` OPEN** — рукопожатие прошло, сработало событие `open`. Только теперь можно отправлять.
      - **`2` CLOSING** — вызван `close()` или пришёл кадр close, идёт обмен кадрами закрытия.
      - **`3` CLOSED** — соединение закрыто, сработало событие `close`. Объект одноразовый: открыть его снова нельзя,
        для нового соединения нужен новый `WebSocket`.

      ## События

      - **`open`** — соединение готово.
      - **`message`** — пришло сообщение. В `event.data` — строка для текстовых сообщений, а для двоичных — `Blob` или
        `ArrayBuffer`, в зависимости от `ws.binaryType`.
      - **`error`** — соединение провалилось. Это обычный `Event` без описания причины: браузер намеренно не раскрывает
        подробности, чтобы страница не выясняла по текстам ошибок устройство чужой сети. Даже HTTP-статус
        отклонённого рукопожатия (`401`, `403`) скрипту недоступен — его видно только в DevTools. После `error` всегда
        приходит `close`.
      - **`close`** — соединение закрыто. Событие `CloseEvent` несёт `code`, `reason` и `wasClean` (урок «Кадры,
        сообщения и закрытие»).

      Важная тонкость: `error` приходит только тогда, когда соединение **провалилось** — не удалось подключиться
      или нарушен протокол. Если уже открытое соединение просто оборвалось (сеть пропала, процесс сервера убит),
      по стандарту придёт одно событие `close` с кодом `1006` и `wasClean: false`, без `error`. Поэтому логику
      переподключения и диагностику строят на `close`, а не на `error`.

      ## Отправка: что делает send()

      - **В CONNECTING** `send()` бросает `InvalidStateError` синхронно, прямо в вызове. Очереди «до открытия»
        у нативного `WebSocket` нет: первые сообщения отправляют в `open`, а всё, что нужно раньше, складывают
        в свою очередь.
      - **В OPEN** `send()` не ждёт сети: кладёт данные в исходящую очередь и сразу возвращает `undefined`.
        По результату вызова отправку не проверить, `await` здесь ничего не даст.
      - **В CLOSING и CLOSED** `send()` молча ничего не делает: исключения нет, данные никуда не уходят. Chrome лишь
        пишет предупреждение в консоль. Отсюда типичная потеря данных: код отправляет сообщение в момент обрыва
        и считает, что оно ушло. Перед отправкой проверяют `readyState === WebSocket.OPEN`, а важные сообщения
        подтверждает сервер (урок «Доставка, порядок и обратное давление»).

      `send()` принимает строку, `Blob`, `ArrayBuffer` или типизированный массив — независимо от `binaryType`.

      ## bufferedAmount и binaryType

      **`ws.bufferedAmount`** — сколько байт лежит в исходящей очереди и ещё не ушло в сеть. Он растёт синхронно,
      в момент `send()`, и падает по мере отправки. Это не подтверждение доставки: счётчик уменьшается, когда данные
      ушли в сеть, а не когда сервер их получил. Входящие данные в нём не учитываются. Как пользоваться этим
      счётчиком, когда сеть не успевает, — урок «Доставка, порядок и обратное давление».

      **`ws.binaryType`** решает, в каком виде приходят **двоичные** сообщения: `"blob"` по умолчанию или
      `"arraybuffer"`. Текст всегда приходит строкой. `Blob` удобен для больших данных, но прочитать его можно только
      асинхронно (`await blob.arrayBuffer()`), поэтому для двоичных протоколов вроде protobuf или MessagePack сразу
      ставят `"arraybuffer"`. Менять значение можно в любой момент — оно действует на следующие сообщения.

      ## Пример целиком: тонкая обёртка для чата

      ```js
      class ChatSocket {
        #ws; #queue = [];
        connect() {
          this.#ws = new WebSocket('/socket', ['chat.v2']); // вход опущен — урок «Безопасность WebSocket»
          this.#ws.onopen = () => {
            for (const msg of this.#queue) this.#ws.send(msg);
            this.#queue = [];
          };
          this.#ws.onmessage = (e) => this.onMessage(JSON.parse(e.data));
          this.#ws.onclose = (e) => this.onClose(e.code, e.wasClean);
        }
        send(obj) {
          const data = JSON.stringify(obj);
          if (this.#ws.readyState === WebSocket.OPEN) this.#ws.send(data);
          else this.#queue.push(data);
        }
      }
      ```

      - Сообщения, отправленные до открытия, копятся в своей очереди и уходят в `onopen` — без `InvalidStateError`.
      - Если соединение не открыто, сообщение не пропадёт молча в закрытом сокете, а дождётся нового соединения.
      - Причину закрытия обёртка берёт из `close`, а не из `error`.

      Переподключения здесь пока нет: о нём урок «Обрывы и переподключение».

      ## Варианты и их цена

      - **Нативный `WebSocket` напрямую**
        - Подходит: прототип, одно соединение на маленькое приложение.
        - Цена: очередь до открытия, переподключение и подтверждения пишешь сам.
      - **Своя обёртка**
        - Подходит: нужен контроль над протоколом и переподключением.
        - Цена: код, который нужно поддерживать и тестировать.
      - **Готовая библиотека** (уроки «Socket.IO» и «Другие библиотеки»)
        - Подходит: нужны переподключение, подтверждения, комнаты из коробки.
        - Цена: свой протокол, часто несовместимый с чистым WebSocket.

      ## Типичные ошибки

      - **`send()` сразу после конструктора.** Исключение `InvalidStateError`.
      - **Ждать, что `send()` на закрытом сокете сообщит об ошибке.** Данные молча пропадут.
      - **Искать причину в `error`.** Её там нет; смотрят код и `wasClean` в `close`.
      - **Считать `bufferedAmount = 0` доставкой.** Данные ушли в сеть, но сервер мог их не получить.
      - **Читать `Blob` синхронно.** Для двоичного протокола удобнее `binaryType = "arraybuffer"`.

      ## Как спрашивают на интервью

      - «Что будет, если вызвать `send()` до открытия? А после закрытия?» — ждут исключение в первом случае и тихую
        потерю во втором.
      - «Как узнать, почему соединение не открылось?» — ждут, что `error` без подробностей, а смотрят `close`
        и логи сервера.
      - «Что показывает `bufferedAmount`?» — ждут размер исходящей очереди, а не доставку.

      ## Коротко

      - У `WebSocket` четыре состояния: CONNECTING, OPEN, CLOSING, CLOSED; конструктор и `close()` асинхронные,
        а закрытый объект одноразовый — для нового соединения нужен новый `WebSocket`.
      - Отправлять можно только в OPEN: в CONNECTING `send()` бросает `InvalidStateError`, а после закрытия молча
        ничего не делает. Поэтому до открытия нужна своя очередь, а перед отправкой — проверка `readyState`.
      - `send()` только кладёт данные в очередь и ничего не возвращает; `bufferedAmount` показывает размер этой
        очереди, а не доставку до сервера.
      - По стандарту и в Chrome событие `error` бывает только при провале соединения, не содержит причины и всегда
        сопровождается `close`; обрыв уже открытого соединения приходит одним `close` с `1006`.
      - Текст приходит строкой, двоичные данные — `Blob` по умолчанию или `ArrayBuffer`, если так задан `binaryType`.

      ## Источники

      - [WebSocket — MDN](https://developer.mozilla.org/ru/docs/Web/API/WebSocket)
      - [WebSockets Standard — WHATWG](https://websockets.spec.whatwg.org/)

  - id: wsl-reconnect
    topic: Надёжность
    title: Обрывы и переподключение
    questions: [ws-rel-005, ws-rel-007, ws-rel-001, ws-rel-002, ws-rel-009, ws-rel-008]
    body: |
      ## Какую проблему решаем

      Обычный HTTP-запрос живёт доли секунды, и шанс, что сеть пропадёт именно в этот момент, мал. Соединение
      WebSocket живёт часами — и за это время что-нибудь обязательно случится: человек зайдёт в лифт, телефон
      переключится с Wi-Fi на мобильную сеть, сервер перевыкатят. Для долгого соединения обрыв — норма, а не авария.

      Беда в том, что нативный `WebSocket` сам не переподключается, а иногда даже не замечает, что соединения уже нет.
      Чат, в котором «вроде всё работает, но сообщения не приходят», — самая частая жалоба на приложения с сокетами.
      Урок о том, как замечать обрывы и правильно переподключаться.

      ## Почему соединения рвутся

      Соединение может закрыться, хотя ни клиент, ни сервер его не закрывали:
      - **таймаут простоя у посредника** — прокси или балансировщик закрывает соединения, по которым долго нет
        данных; у nginx по умолчанию это 60 секунд (`proxy_read_timeout`);
      - **смена сети** — у телефона меняется IP-адрес, и старое TCP-соединение становится недействительным;
      - **выкатка сервера** — процесс со старой версией останавливается вместе со всеми своими соединениями;
      - **сон устройства и фоновые вкладки** — мобильные браузеры и системы экономят батарею, замораживают вкладки
        и отключают им сеть.

      ## Переподключение делает приложение

      Нативный `WebSocket` — одноразовый объект: закрылся — значит, всё. Флага «переподключаться» у конструктора нет,
      метода `open()` тоже. Автоматическое переподключение есть у `EventSource` (SSE), а у `WebSocket` — нет. Значит,
      в `onclose` приложение решает, переподключаться ли, и создаёт новый объект.

      **Растущая пауза.** Переподключаться сразу и без конца нельзя: если сервер упал, десятки тысяч клиентов будут
      долбить его попытками и не дадут подняться. Поэтому паузу между попытками увеличивают: 1, 2, 4, 8 секунд…
      до потолка, например 30 секунд. Это **экспоненциальная задержка** (exponential backoff). К ней добавляют
      **случайный разброс** (jitter): иначе клиенты, оборвавшиеся одновременно, вернутся тоже одновременно — волной.

      **Когда сбрасывать паузу.** Не в `onopen`. Если сервер принимает соединение и тут же закрывает его — упал,
      отклонил токен, — каждая попытка формально «успешна», и клиент засыплет сервер попытками с минимальной паузой.
      Паузу возвращают к начальной, когда соединение продержалось какое-то время, например 30 секунд.

      **Когда не переподключаться вслепую.** Код закрытия подсказывает, что делать:
      - `1006`, `1001`, `1012` — обрыв или перезапуск сервера: переподключаться с паузой;
      - `1013` Try Again Later — сервер перегружен: переподключаться с паузой подлиннее;
      - свой код вроде `4001` «не авторизован» — сначала обновить токен, потом подключаться;
      - `1000` или свой код «вышел из аккаунта» — закрыли намеренно, переподключаться не нужно.

      **`navigator.onLine` — не сигнал готовности.** Он говорит лишь, что у устройства есть сеть, а не что сервер
      работает и примет клиента. Событие `online` полезно как повод попробовать сразу, но не как гарантия.

      ## Heartbeat: как заметить молчаливую смерть

      TCP не сообщает о пропаже собеседника, пока не попробует что-то отправить. Если у телефона пропала сеть
      без обрыва TCP, сокет может минутами считаться открытым (`readyState` равен `OPEN`), а сообщения уходить
      в пустоту.

      Браузер отвечает на ping сервера сам, но не сообщает об этом странице и не даёт отправить ping из JavaScript
      (урок «Кадры, сообщения и закрытие»). Поэтому приложение делает свою проверку — **heartbeat**: раз в несколько
      секунд клиент отправляет сообщение `{"type":"ping"}` и ждёт ответа `{"type":"pong"}`. Нет ответа за отведённое
      время — соединение считается мёртвым: клиент закрывает его и переподключается. Ждать события `close` здесь
      нельзя: на мёртвом соединении браузер после `close()` ждёт ответный кадр close, и в Chrome это может занять
      до минуты. Поэтому клиент снимает обработчики со старого сокета, вызывает `close()` и сразу запускает
      переподключение. Заодно регулярные сообщения не дают посредникам закрыть соединение по таймауту простоя.

      ## Фоновые вкладки и возвращение

      Человек свернул вкладку на телефоне и вернулся через полчаса. Пока вкладка была заморожена, таймеры не
      работали, heartbeat не шёл, а сокет внешне жив: `readyState` равен `OPEN`, но по нему ничего не идёт. Держать
      вкладку «бодрствующей» таймером бесполезно: в фоне браузер притормаживает таймеры, а система может заморозить
      вкладку целиком.

      Правильный ход — проверять связь при возвращении: по событию `visibilitychange` (вкладка снова видна) или
      `pageshow` отправить пинг и, не получив ответа быстро, открыть новое соединение и догнать пропущенное
      (урок «Доставка, порядок и обратное давление»).

      ## Сокет в React

      Сокет — внешний ресурс, и эффект, который его открывает, обязан его закрывать:

      ```jsx
      useEffect(() => {
        const ws = new WebSocket('/socket');
        ws.onmessage = (e) => addMessage(e.data);
        return () => ws.close();
      }, []);
      ```

      Без `return () => ws.close()` в режиме разработки сообщения задвоятся: StrictMode специально монтирует,
      размонтирует и снова монтирует компонент, чтобы проверить очистку, и без неё открыты два сокета. В продакшене
      та же утечка проявится при каждом размонтировании компонента. Ещё лучше держать одно соединение на всё
      приложение — в модуле или контексте, — а компоненты пусть подписываются на нужные сообщения.

      ![Переподключение: соединение оборвалось с кодом 1006; пауза 1 с с разбросом, попытка не удалась; пауза 2 с, затем 4 с; соединение открылось, клиент заново подписывается и просит сообщения после последнего полученного номера; через 30 секунд устойчивой работы пауза сбрасывается](images/wsl-reconnect.png "Переподключение с растущей паузой и догоняющими сообщениями")

      ## Пример целиком: менеджер соединения чата

      1. **Обрыв.** Пришёл `close` с `1006`. Клиент показывает «Переподключаемся…» и ждёт паузу: 1 секунда плюс
         случайные ±50 %.
      2. **Неудачи.** Сервер ещё не поднялся — следующие паузы 2, 4, 8 секунд, но не больше 30.
      3. **Успех.** Соединение открылось. Клиент заново подписывается на каналы и забирает пропущенное. Паузу пока
         не сбрасывает.
      4. **Устойчивость.** Соединение продержалось 30 секунд — пауза снова 1 секунда.
      5. **Heartbeat.** Каждые 25 секунд клиент шлёт пинг; если понга нет 10 секунд, клиент снимает обработчики
         со старого сокета, закрывает его и сразу ставит таймер переподключения — как на шаге 1, не дожидаясь события
         `close`. Двадцать пять секунд меньше шестидесяти секунд таймаута nginx, поэтому живое соединение посредник
         не закроет.
      6. **Возвращение на вкладку.** По `visibilitychange` клиент сразу шлёт пинг, не дожидаясь таймера.
      7. **Сессия истекла.** Сервер закрыл соединение кодом `4001`. Клиент не переподключается вслепую: сначала
         обновляет токен, потом подключается.

      ## Варианты и их цена

      - **Переподключаться сразу и без паузы**
        - Подходит: никогда в продакшене.
        - Цена: лавина попыток, которая не даёт упавшему серверу подняться.
      - **Растущая пауза с разбросом и потолком**
        - Подходит: почти всегда.
        - Цена: после долгого сбоя человек ждёт до потолка паузы — показывают «Переподключаемся…» и кнопку
          «Повторить сейчас».
      - **Свой heartbeat**
        - Подходит: телефоны, нестабильные сети, посредники с таймаутом простоя.
        - Цена: лишние маленькие сообщения и код на обеих сторонах.
      - **Серверный ping**
        - Подходит: держать соединение живым для прокси и замечать мёртвых клиентов на сервере; браузер отвечает
          pong сам, без кода на странице. Так советует и документация nginx.
        - Цена: страница о нём не узнаёт, поэтому для своей проверки связи клиенту всё равно нужен свой heartbeat.

      ## Типичные ошибки

      - **Ждать, что `WebSocket` переподключится сам.** Он одноразовый.
      - **Сбрасывать паузу в `onopen`.** Сервер, который принимает и сразу закрывает, получит поток попыток.
      - **Переподключаться при «не авторизован»,** не обновив токен.
      - **Полагаться на `navigator.onLine`** как на признак того, что сервер доступен.
      - **Верить `readyState === OPEN`** после возвращения на вкладку.
      - **Эффект без очистки.** Задвоенные сообщения в разработке и утечка соединений в продакшене.
      - **Ждать `close` после своего `close()` на мёртвом соединении.** Событие придёт только по таймауту браузера.

      ## Как спрашивают на интервью

      - «Как сделать переподключение WebSocket?» — ждут растущую паузу с разбросом и потолком, сброс после устойчивой
        работы и учёт кода закрытия.
      - «Зачем heartbeat, если в протоколе есть ping?» — ждут, что браузер скрывает ping от страницы, а молчаливую
        смерть соединения надо заметить самому.
      - «Почему в разработке сообщения приходят дважды?» — ждут StrictMode и эффект без очистки.

      ## Коротко

      - Для долгого соединения обрыв — норма: таймауты посредников, смена сети, выкатка сервера, сон устройства.
      - Нативный `WebSocket` не переподключается сам: в `onclose` приложение создаёт новый объект с растущей паузой,
        случайным разбросом и потолком, чтобы не устроить лавину попыток.
      - Паузу сбрасывают не в `onopen`, а после устойчивой работы; код закрытия решает, переподключаться ли сразу,
        позже или сначала обновить токен.
      - Соединение может умереть молча, поэтому приложение шлёт свой heartbeat: нет ответа — соединение мёртвое,
        и клиент переподключается сразу, не дожидаясь `close` (в Chrome он может прийти только через минуту). Заодно
        heartbeat не даёт посредникам закрыть соединение по таймауту.
      - После возвращения на фоновую вкладку `readyState` может врать: связь проверяют по `visibilitychange`
        и при необходимости переподключаются.
      - В React эффект, открывший сокет, закрывает его в очистке, а лучше держать одно соединение на приложение.

      ## Источники

      - [Exponential Backoff And Jitter — AWS Architecture Blog](https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/)
      - [Synchronizing with Effects — React](https://ru.react.dev/learn/synchronizing-with-effects)
      - [WebSocket proxying — nginx](https://nginx.org/en/docs/http/websocket.html)

  - id: wsl-delivery
    topic: Надёжность
    title: Доставка, порядок и обратное давление
    questions: [ws-rel-003, ws-rel-004, ws-rel-006]
    body: |
      ## Какую проблему решаем

      Переподключаться приложение уже умеет. Но вот что видит человек в чате: связь моргнула на десять секунд,
      сокет переподключился, а три сообщения коллег, пришедшие за эти секунды, так и не появились. А его собственное
      сообщение, отправленное в момент обрыва, то ли ушло, то ли нет — и после повтора пришло дважды.

      И третья беда, с другой стороны: приложение шлёт в сокет позицию курсора на каждое движение мыши, а на слабой
      сети интерфейс со временем начинает тормозить и съедать память. Урок о том, что протокол гарантирует, чего
      не гарантирует и как достроить недостающее.

      ## Что гарантирует протокол

      WebSocket работает поверх одного TCP-соединения, поэтому:
      - **порядок внутри соединения сохраняется** — сообщения приходят в том порядке, в каком их отправили;
      - **сообщение приходит целым** или не приходит вовсе.

      И это всё. Протокол **не** гарантирует:
      - **доставку:** `send()` лишь кладёт данные в очередь; если соединение оборвётся, часть отправленного пропадёт
        без уведомления;
      - **досылку после переподключения:** новое соединение ничего не знает о старом;
      - **отсев дублей:** если клиент повторит сообщение, сервер получит его дважды;
      - **порядок между соединениями:** у каждой вкладки своё соединение, и сообщения из разных вкладок могут прийти
        на сервер в любом порядке.

      ## Как достроить доставку

      Если сообщения терять нельзя — чат, платежи, совместная правка, — поверх сокета строят свой протокол.

      **Своё сообщение.**
      - У каждого сообщения есть id, который придумывает клиент.
      - Сервер, сохранив сообщение, отвечает **подтверждением** (acknowledgement, ack) с этим id.
      - Пока подтверждения нет, клиент держит сообщение в своей очереди «неподтверждённых» и показывает его
        с пометкой «отправляется».
      - После переподключения клиент повторяет неподтверждённые с теми же id, а сервер отбрасывает повторы по id.
        Так id служит **ключом идемпотентности**: повтор не создаёт второе сообщение.

      **Чужие сообщения.**
      - Сервер нумерует события по порядку, и клиент помнит номер последнего полученного.
      - После переподключения клиент заново подписывается на нужные каналы — новое соединение чистое, сервер
        не помнит старых подписок — и просит «пришли всё после события N».
      - Если сервер так не умеет или история уже стёрта, клиент перечитывает актуальное состояние обычным
        HTTP-запросом и дальше слушает изменения.

      Так же устроены `Last-Event-ID` в SSE и восстановление состояния соединения (connection state recovery)
      в Socket.IO. Протоколы вроде MQTT берут подтверждения и досылку на себя.

      ## Обратное давление: когда сеть не успевает

      **Обратное давление** (backpressure) — ситуация, когда приложение производит данные быстрее, чем сеть успевает
      их отправить. Очередь неотправленного растёт, память тоже, а данные в хвосте очереди уже устарели.

      У браузерного `WebSocket` нет встроенного способа притормозить отправителя. Есть только счётчик
      `bufferedAmount` — размер исходящей очереди (урок «WebSocket в браузере»). Если он растёт, канал не успевает.

      Что помогает:
      - **реже отправлять** — позицию курсора хватает отправлять 20–30 раз в секунду, а не на каждое событие мыши;
      - **отправлять только последнее состояние** — для курсора важна только текущая позиция, старые можно выбросить;
      - **пропускать отправку, пока очередь не опустеет** — если `bufferedAmount` выше порога, новую позицию
        не отправляют, а запоминают; уйдёт следующая.

      Что **не** помогает:
      - `await ws.send(...)` — `send()` ничего не возвращает и не ждёт сети;
      - отправка из Web Worker — тормозит не основной поток, а растущая очередь, и в воркере она растёт так же;
      - несколько сокетов — канал от этого шире не станет, а порядок между сокетами потеряется.

      ## Пример целиком: сообщения и курсоры в чате

      **Отправка сообщения.**
      1. Человек нажал «Отправить». Клиент создаёт id `tmp-4f2a`, показывает сообщение с пометкой «отправляется»
         и отправляет `{ type: "send", id: "tmp-4f2a", text: "…" }`.
      2. Сервер сохраняет сообщение и отвечает `{ type: "ack", id: "tmp-4f2a", seq: 58213 }`. Клиент снимает пометку.
      3. Если связь оборвалась до ответа, после переподключения клиент повторяет то же сообщение с тем же id. Сервер
         узнаёт id и второй раз не сохраняет, а просто снова подтверждает.

      **Догнать чужие сообщения.** Клиент помнит `seq` последнего полученного события из канала — 58214, сообщение
      коллеги. Номер из подтверждения своего сообщения для этого не годится: подтверждение приходит отдельно
      от рассылки канала и может обогнать чужое событие с меньшим номером, которое ещё в пути. А догонять по номеру
      последнего события можно, только если сервер рассылает события канала по порядку номеров — это требование
      к серверу. После переподключения клиент отправляет «подпиши на каналы А и Б
      и пришли всё после 58214», и три пропущенных сообщения приходят по порядку.

      **Курсоры соавторов** в общем документе внутри чата. Клиент отправляет позицию не чаще 20 раз в секунду
      и только если `bufferedAmount` меньше 16 КБ, иначе запоминает последнюю позицию и отправит её в следующий раз.
      Потеря промежуточных позиций никого не волнует: важна текущая.

      ## Варианты и их цена

      - **Только то, что даёт протокол**
        - Подходит: данные, которые можно терять, — курсоры, «печатает…», котировки, которые и так обновятся.
        - Цена: при обрыве часть данных пропадает, и никто об этом не узнает.
      - **Свои id, подтверждения и досылка**
        - Подходит: сообщения, действия, деньги — всё, что терять нельзя.
        - Цена: протокол на обеих сторонах, очередь неподтверждённых, нумерация событий на сервере.
      - **Готовая библиотека с подтверждениями**
        - Подходит: нет желания писать протокол самим.
        - Цена: привязка к библиотеке и её серверу (урок «Socket.IO»).

      ## Типичные ошибки

      - **Считать `send()` доставкой.** Отправленное в момент обрыва пропадёт молча.
      - **После переподключения ничего не делать.** Сервер не помнит подписок, а пропущенное само не придёт.
      - **Повторять сообщение без id.** Получатель увидит его дважды.
      - **Слать каждое событие мыши.** На слабой сети очередь растёт, интерфейс тормозит.
      - **Лечить обратное давление воркером или вторым сокетом.** Канал шире не станет.

      ## Как спрашивают на интервью

      - «Гарантирует ли WebSocket доставку?» — ждут: только порядок и целостность внутри соединения, остальное
        строит приложение.
      - «Как не потерять сообщения при обрыве?» — ждут id, подтверждения, повтор неподтверждённого и досылку
        по номеру последнего события.
      - «Приложение шлёт много данных, и на плохой сети всё тормозит. Что делать?» — ждут обратное давление,
        `bufferedAmount`, троттлинг и отправку только последнего состояния.

      ## Коротко

      - WebSocket гарантирует только порядок и целостность сообщений внутри одного соединения; доставки, досылки
        после переподключения и отсева дублей в протоколе нет.
      - Чтобы не терять свои сообщения, у каждого есть id от клиента, сервер подтверждает приём, а клиент после
        переподключения повторяет неподтверждённые с теми же id — сервер отбрасывает повторы.
      - Чтобы не терять чужие, сервер нумерует события, а клиент после переподключения заново подписывается и просит
        всё после последнего номера; если история стёрта — перечитывает состояние по HTTP.
      - Обратное давление — когда данные производятся быстрее, чем уходят в сеть; его видно по растущему
        `bufferedAmount`.
      - Для данных, где важно только последнее значение, отправляют реже, выбрасывают устаревшее и пропускают отправку,
        пока очередь не опустеет; `await send()`, воркер и лишние сокеты не помогают.

      ## Источники

      - [WebSocket: bufferedAmount — MDN](https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/bufferedAmount)
      - [Connection state recovery — Socket.IO](https://socket.io/docs/v4/connection-state-recovery)

  - id: wsl-security
    topic: Безопасность
    title: Безопасность WebSocket
    questions: [ws-sec-001, ws-sec-002, ws-api-007, ws-sec-003, ws-sec-007, ws-sec-004, ws-sec-005, ws-sec-006]
    body: |
      ## Какую проблему решаем

      Фронтендер привык, что браузер его охраняет: политика одного источника не даёт чужому сайту читать ответы
      нашего API, CORS спрашивает разрешения у сервера, `fetch` не отправит что попало. С WebSocket всё иначе.
      Политика одного источника и CORS на него **не распространяются**: любая страница может открыть сокет к любому
      серверу, а браузер приложит к рукопожатию cookie этого сервера. Если сервер ничего не проверяет, злой сайт
      откроет сокет от имени пользователя и прочитает его переписку.

      Урок о том, кто за что отвечает в безопасности сокета: что делает браузер, что обязан сделать сервер
      и как не наделать ошибок на фронтенде.

      ## Чужой сайт в браузере пользователя: CSWSH

      **Cross-Site WebSocket Hijacking** (CSWSH, перехват WebSocket с чужого сайта). Пользователь вошёл
      на `bank.example`, сессия — в cookie. Он открывает страницу `evil.example`, и та выполняет
      `new WebSocket('wss://bank.example/socket')`. Браузер:
      - не спрашивает разрешения: preflight-запроса `OPTIONS`, как у CORS, у WebSocket нет;
      - прикладывает cookie банка, если её атрибут `SameSite` это позволяет: с `SameSite=None` она уходит и в чужое
        рукопожатие, с `Lax` или `Strict` — нет (в Chrome `Lax` — значение по умолчанию);
      - добавляет заголовок `Origin: https://evil.example` — и подделать его страница не может.

      **Защита — на сервере:** проверять `Origin` в рукопожатии и пускать только свои сайты. Проверка `Origin`
      защищает пользователей от чужих страниц в их браузерах. Но от программ вне браузера она не защищает: скрипт
      на Node или Python отправит любой `Origin`. Поэтому `Origin` дополняет авторизацию, а не заменяет её.

      ## Как передать вход

      В браузере нельзя задать произвольные заголовки рукопожатия. Сигнатура — `new WebSocket(url, protocols)`, и
      второй аргумент — список подпротоколов. Если передать туда объект `{ headers: … }`, он превратится в строку
      `[object Object]`, а это недопустимое имя подпротокола — конструктор бросит `SyntaxError`. (В Node-библиотеке
      `ws` заголовки задать можно, отсюда путаница.)

      Способы передать вход:
      - **cookie сессии** — браузер приложит её сам; обязательно вместе с проверкой `Origin`;
      - **первым сообщением после открытия** — клиент отправляет токен, сервер до его проверки ничего не делает;
      - **короткоживущий одноразовый билет в адресе** — клиент получает его обычным HTTP-запросом с авторизацией
        и сразу использует: `wss://api.example/socket?ticket=…`;
      - **через `Sec-WebSocket-Protocol`** — обходной трюк: токен кладут в имя подпротокола.

      **Долгоживущий токен в адресе — плохо.** Адреса запросов оседают в логах балансировщика, сервера и систем
      мониторинга, где их могут прочитать. По сети адрес при `wss://` шифруется — опасен не путь, а то, где адрес
      хранится потом. Одноразовый билет на секунды делает такую утечку бесполезной.

      ## Соединение живёт дольше токена

      Авторизация WebSocket — это авторизация **рукопожатия**. Токен проверили один раз, при подключении, а дальше
      по соединению идут сообщения без HTTP-заголовков и без кодов ответа. Если токен живёт 15 минут, а соединение —
      час, оно продолжит работать, пока сервер сам не проверит срок. Поэтому сервер следит за сроком и закрывает
      соединение своим кодом, например `4001`, а клиент обновляет токен и подключается заново. Другой вариант —
      протокол приложения позволяет прислать новый токен сообщением, не разрывая соединения.

      ## Незащищённый сокет со страницы по HTTPS

      Со страницы, открытой по `https://`, нельзя открыть `ws://` — это смешанное содержимое. Chrome сообщает об этом
      синхронным исключением `SecurityError` прямо в конструкторе. `onerror` тут не поможет: без `try` исключение
      оборвёт выполнение скрипта. Исключение из правила — заголовок CSP `upgrade-insecure-requests`: с ним браузер
      сам повышает `ws:` до `wss:`.

      ## Сообщения — недоверенные данные

      Открытое соединение — канал, по которому может прийти что угодно и в любом количестве. **На сервере:**
      - ограничить размер сообщения — например, Node-библиотека `ws` по умолчанию принимает сообщения до 100 МиБ,
        и несколько таких съедят память; лимит задают `maxPayload` (у Socket.IO — `maxHttpBufferSize`, по умолчанию
        1 МБ);
      - ограничить частоту сообщений и число соединений с одного пользователя или адреса;
      - проверять формат и права на **каждое** сообщение: авторизованное соединение не значит, что любую команду
        можно выполнить;
      - брать «кто отправитель» из сессии соединения, а не из поля `userId` в сообщении — его клиент подставит любое.
        И `Origin` проверяют только в рукопожатии: в сообщениях его нет.

      **На клиенте** сообщение от своего сервера тоже недоверенное: сервер часто пересылает то, что прислали другие
      пользователи. Типичная ловушка — выбор обработчика по полю `type`:

      ```js
      const handlers = { chat: addMessage, typing: showTyping };
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        handlers[msg.type](msg.payload);
      };
      ```

      Поиск в обычном объекте идёт и по прототипу: `type: "constructor"` вызовет `Object`, `"toString"` — унаследованный
      метод, а `"__proto__"` уронит обработчик. Надёжнее `Map` или объект без прототипа (`Object.create(null)`),
      проверка `Object.hasOwn` и отбрасывание неизвестных типов. Сам `JSON.parse` безопасен: функций в JSON нет.

      ## Пример целиком: защита командного чата

      1. **Рукопожатие.** Сервер пускает только `Origin` из белого списка: `https://chat.example.com` и
         `https://admin.chat.example.com`.
      2. **Вход.** Фронтенд получает одноразовый билет запросом `POST /ws-ticket` с обычной авторизацией и подключается
         к `wss://chat.example.com/socket?ticket=…`. Билет живёт 30 секунд и годится один раз.
      3. **Срок.** Сессия живёт 15 минут. За минуту до конца сервер присылает «обнови токен»; если клиент не обновил,
         сервер закрывает соединение кодом `4001`.
      4. **Сообщения.** Размер — до 64 КБ, не больше 20 сообщений в секунду с соединения; каждую команду сервер
         проверяет по схеме и по правам на канал; отправителя берёт из сессии.
      5. **Клиент.** Обработчики лежат в `Map`, неизвестные типы отбрасываются.

      ## Варианты передачи входа и их цена

      - **Cookie сессии**
        - Подходит: фронтенд и сокет на одном сайте.
        - Цена: обязательна проверка `Origin`, иначе CSWSH.
      - **Первое сообщение с токеном**
        - Подходит: токен лежит в памяти приложения.
        - Цена: до проверки сервер держит неавторизованное соединение — нужен таймаут на вход.
      - **Одноразовый билет в адресе**
        - Подходит: почти всегда, когда нет cookie.
        - Цена: лишний HTTP-запрос перед подключением.
      - **Токен в `Sec-WebSocket-Protocol`**
        - Подходит: как обходной путь.
        - Цена: злоупотребление заголовком, который предназначен для другого; сервер должен вернуть выбранное значение.

      ## Типичные ошибки

      - **Считать, что браузер защитит от чужих сайтов.** Политика одного источника и CORS на WebSocket не действуют.
      - **Проверять только `Origin`** вместо авторизации.
      - **Передавать заголовки в конструктор браузерного `WebSocket`.** Будет `SyntaxError`.
      - **Класть долгоживущий токен в адрес.** Он осядет в логах.
      - **Не следить за сроком токена** у открытого соединения.
      - **Доверять полям сообщения** — `userId`, `type` — без проверки.

      ## Как спрашивают на интервью

      - «Что такое CSWSH и как от него защититься?» — ждут проверку `Origin` на сервере плюс авторизацию.
      - «Как передать токен при подключении из браузера?» — ждут, что заголовки задать нельзя, и способы: cookie,
        первое сообщение, одноразовый билет.
      - «Что будет, когда истечёт токен у открытого соединения?» — ждут, что ничего, пока сервер сам не закроет.

      ## Коротко

      - Политика одного источника и CORS на WebSocket не действуют: любая страница может открыть сокет к любому серверу,
        а браузер приложит cookie, если `SameSite` это позволяет. Это атака CSWSH.
      - Сервер проверяет `Origin` в рукопожатии — это защищает от чужих сайтов в браузере пользователя, но не от
        скриптов вне браузера, поэтому нужна и авторизация.
      - Задать заголовки рукопожатия в браузере нельзя; вход передают cookie с проверкой `Origin`, первым сообщением
        или короткоживущим одноразовым билетом в адресе, но не долгоживущим токеном, который осядет в логах.
      - Токен проверяют только при рукопожатии, поэтому за сроком следит сервер: закрывает соединение своим кодом или
        принимает новый токен сообщением.
      - Со страницы по HTTPS `ws://` открыть нельзя: Chrome бросает `SecurityError` прямо в конструкторе.
      - Каждое сообщение — недоверенные данные: на сервере лимиты размера и частоты, проверка прав на каждую команду
        и отправитель из сессии; на клиенте — `Map` вместо обычного объекта для выбора обработчика.

      ## Источники

      - [WebSocket Security Cheat Sheet — OWASP](https://cheatsheetseries.owasp.org/cheatsheets/WebSocket_Security_Cheat_Sheet.html)
      - [WebSocket() constructor — MDN](https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/WebSocket)

  - id: wsl-architecture
    topic: Архитектура и альтернативы
    title: Серверы, прокси и альтернативы
    questions: [ws-arch-003, ws-arch-002, ws-arch-001, ws-arch-005]
    body: |
      ## Какую проблему решаем

      Локально чат работает идеально. На продакшене начинаются чудеса: за nginx соединения не открываются вовсе;
      открылись — но рвутся ровно через минуту тишины; сервер раскатили на три экземпляра — и сообщения доходят
      только до части собеседников. А соседняя команда, сделавшая уведомления на SSE, жалуется, что у пользователей
      с семью вкладками перестают грузиться страницы.

      Всё это не баги кода на клиенте, а свойства инфраструктуры, о которых фронтендеру нужно знать: от них зависит,
      работает ли решение у людей. Урок о том, что происходит между браузером и сервером и чем WebSocket отличается
      от соседних технологий.

      ## Прокси и балансировщики

      **Рукопожатие через прокси.** Заголовки `Upgrade` и `Connection` относятся к одному звену соединения, и прокси
      не передаёт их дальше без явной настройки. А сам механизм `Upgrade` есть только в HTTP/1.1. Поэтому nginx
      нужно попросить пробросить апгрейд. К тому же по умолчанию nginx ходит к серверу приложения по HTTP/1.0,
      где апгрейда нет вовсе:

      ```nginx
      location /socket {
        proxy_pass http://chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
      }
      ```

      Без этих трёх строк сервер приложения получит обычный HTTP-запрос без просьбы об апгрейде, и соединение
      не откроется, хотя обычные запросы работают. CORS и отдельный порт здесь ни при чём: WebSocket ходит по тем же
      портам, что и HTTP.

      **Таймаут простоя.** У nginx `proxy_read_timeout` по умолчанию 60 секунд: если по соединению минуту нет данных,
      прокси его закроет. Лечат либо увеличением таймаута, либо heartbeat чаще таймаута (урок «Обрывы
      и переподключение»).

      ## Несколько серверов

      Соединение WebSocket живёт на одном конкретном экземпляре сервера, и каждый экземпляр знает только свои
      соединения. Пользователь A подключён к первому серверу, B — ко второму. Первый получил сообщение от A
      и не знает, где B.

      Решение — **общая шина сообщений** между экземплярами: Redis Pub/Sub, NATS, Kafka. Сервер публикует сообщение
      в шину, все экземпляры получают его и рассылают своим клиентам. В Socket.IO для этого есть готовые адаптеры,
      например на Redis.

      **Sticky-сессии** («липкие» сессии — балансировщик отправляет клиента всегда на один и тот же экземпляр)
      этой задачи не решают: A и B всё равно окажутся на разных серверах. Они нужны для другого — когда клиент
      делает серию запросов в рамках одной сессии, как long polling в Socket.IO (урок «Socket.IO»). Одному
      WebSocket-соединению липкость не нужна: оно и так живёт на одном экземпляре.

      ## SSE и лимит соединений

      Когда данные идут только от сервера, часто выбирают SSE (урок «Зачем нужен WebSocket»). У него есть ловушка
      на HTTP/1.1: браузер держит не больше **шести одновременных соединений с одним сайтом**, и этот лимит общий для
      всех вкладок. Каждый `EventSource` занимает соединение надолго. В семи вкладках шесть соединений съедены SSE,
      и седьмой странице не на чем грузить даже обычные запросы.

      Решения: HTTP/2 или HTTP/3, где потоки делят одно соединение; одно SSE-соединение на все вкладки через
      `SharedWorker` или ведущую вкладку с `BroadcastChannel`; или WebSocket: на него лимит в шесть соединений
      не распространяется — в Chrome у сокетов свой, намного больший лимит.

      ## WebTransport

      WebSocket работает поверх TCP: всё доставляется по порядку, и одна потерянная порция данных задерживает всё,
      что идёт за ней. Это называют **блокировкой начала очереди** (head-of-line blocking). Для чата это неважно,
      а для игры или видео плохо: старая позиция игрока уже не нужна, а из-за неё ждут новые.

      **WebTransport** — новый API поверх HTTP/3 и протокола QUIC. Он даёт то, чего у WebSocket нет:
      - **много независимых потоков** — потеря в одном не задерживает остальные;
      - **ненадёжные датаграммы** — сообщения, которые можно терять ради скорости.

      Двусторонний обмен, двоичные данные и рукопожатие на стандартных портах есть и у WebSocket. WebTransport
      сложнее и поддерживается не всеми браузерами и серверами, поэтому для большинства задач WebSocket по-прежнему
      хватает.

      ## Пример целиком: чат на трёх серверах

      1. **Прокси.** nginx пробрасывает `Upgrade` и `Connection`, `proxy_read_timeout` — 60 секунд, а клиент шлёт
         heartbeat каждые 25.
      2. **Балансировщик** раскладывает новые соединения по трём экземплярам сервера.
      3. **Шина.** Экземпляр, получивший сообщение, сохраняет его и публикует в Redis Pub/Sub в канал «чат 42». Все три
         экземпляра подписаны и рассылают его своим участникам чата 42.
      4. **Выкатка.** Экземпляры перезапускают по одному. Их клиенты получают закрытие и переподключаются с разбросом
         к оставшимся — без волны в одну секунду.
      5. **Уведомления** идут по тому же сокету чата, что открыт в каждой вкладке, а не по отдельному SSE:
         на WebSocket лимит в шесть соединений не распространяется.

      ## Варианты и их цена

      - **Один сервер**
        - Подходит: небольшая нагрузка, прототип.
        - Цена: выкатка рвёт все соединения разом, масштабировать некуда.
      - **Несколько серверов и общая шина**
        - Подходит: почти всегда в продакшене.
        - Цена: ещё один компонент — шина, — который должен быть надёжным.
      - **SSE вместо WebSocket**
        - Подходит: данные только от сервера.
        - Цена: на HTTP/1.1 — лимит шести соединений на сайт; нужна HTTP/2 или одно соединение на вкладки.
      - **WebTransport**
        - Подходит: игры, видео, данные, которые можно терять.
        - Цена: сложнее, поддержка ещё не везде.

      ## Типичные ошибки

      - **Не настроить прокси на апгрейд.** Сокет не открывается, хотя HTTP работает.
      - **Забыть про таймаут простоя.** Тихие соединения рвутся каждые 60 секунд.
      - **Масштабировать без шины.** Сообщения доходят только до тех, кто на том же экземпляре.
      - **Надеяться, что sticky-сессии свяжут серверы.** Они только прикрепляют клиента к одному экземпляру.
      - **SSE в каждой вкладке на HTTP/1.1.** Седьмая вкладка не грузится.

      ## Как спрашивают на интервью

      - «Как масштабировать WebSocket на несколько серверов?» — ждут общую шину и понимание, что соединение живёт
        на одном экземпляре.
      - «Почему за прокси сокет не открывается или рвётся через минуту?» — ждут проброс `Upgrade` и таймаут простоя.
      - «Чем WebTransport отличается от WebSocket?» — ждут независимые потоки, датаграммы и блокировку начала очереди
        у TCP.

      ## Коротко

      - Прокси не передаёт `Upgrade` и `Connection` без явной настройки, а апгрейд работает только в HTTP/1.1; nginx
        нужны `proxy_http_version 1.1` и проброс обоих заголовков.
      - Посредники закрывают тихие соединения по таймауту простоя, у nginx это 60 секунд; лечат таймаутом или heartbeat.
      - Соединение живёт на одном экземпляре сервера, поэтому при нескольких экземплярах нужна общая шина вроде Redis
        Pub/Sub; sticky-сессии эту задачу не решают.
      - SSE на HTTP/1.1 упирается в лимит шести соединений на сайт, общий для всех вкладок; помогают HTTP/2, одно
        соединение на вкладки или WebSocket.
      - WebSocket наследует от TCP блокировку начала очереди; WebTransport поверх HTTP/3 даёт независимые потоки
        и ненадёжные датаграммы, но он сложнее и поддерживается не везде.

      ## Источники

      - [WebSocket proxying — nginx](https://nginx.org/en/docs/http/websocket.html)
      - [EventSource — MDN](https://developer.mozilla.org/ru/docs/Web/API/EventSource)
      - [WebTransport API — MDN](https://developer.mozilla.org/en-US/docs/Web/API/WebTransport_API)

  - id: wsl-socketio
    topic: Библиотеки
    title: Socket.IO
    questions: [ws-lib-001, ws-lib-002, ws-lib-003, ws-lib-004, ws-lib-005, ws-lib-006, ws-lib-007]
    body: |
      ## Какую проблему решаем

      Прошлые уроки показали, сколько всего приходится строить поверх нативного `WebSocket`: переподключение,
      heartbeat, подтверждения, досылку, рассылку по группам, запасной транспорт для сетей, где сокеты режут.
      **Socket.IO** — популярная библиотека, где всё это уже сделано: клиент для браузера и сервер для Node.

      Но у неё есть особенность, о которую спотыкаются чаще всего: Socket.IO — **не** обёртка над WebSocket, а свой
      протокол. Урок о том, как она устроена и где ведёт себя не так, как ждёшь.

      ## Свой протокол, а не обёртка

      Socket.IO работает поверх нескольких транспортов, а сверху говорит на своём протоколе: пакеты Engine.IO
      (открытие, ping, сообщения), события с именами, подтверждения, пространства имён (namespaces). Поэтому
      совместимость только в паре:
      - клиент Socket.IO не подключится к обычному WebSocket-серверу — тот не отправляет пакетов Engine.IO;
      - нативный `WebSocket`, подключившись к серверу Socket.IO, получит служебный пакет `0{"sid":…}`, а на обычный
        текст сервер закроет соединение.

      Если бэкенд поднял чистый WebSocket, фронтенду нужен нативный `WebSocket` или совместимая с ним библиотека,
      а не `socket.io-client`.

      ## Транспорты: сначала polling, потом WebSocket

      По умолчанию клиент Socket.IO v4 **начинает с HTTP long polling** — запросов
      `GET /socket.io/?EIO=4&transport=polling` — и, если получилось, **переходит на WebSocket**. Так соединение
      появляется даже там, где WebSocket режут прокси или фаерволы, а потом незаметно ускоряется. В списке транспортов
      клиента есть и WebTransport, но на сервере его нужно включить явно и поднять HTTP/3 — по умолчанию сервер
      принимает только polling и WebSocket.

      Если WebSocket в сети пользователей точно доступен, ставят `transports: ["websocket"]`: подключение быстрее,
      но без запасного пути.

      ## Переподключение и отключения

      Клиент переподключается сам: первая попытка примерно через секунду (±50 %), дальше пауза растёт до 5 секунд,
      попыток — бесконечно. Сервер шлёт ping каждые 25 секунд, и если ответа нет 20 секунд, соединение считается
      мёртвым.

      У события `disconnect` есть **причина**, и от неё зависит, переподключится ли клиент:
      - `"transport close"`, `"ping timeout"` — обрыв, клиент переподключится сам;
      - `"io server disconnect"` — сервер сам вызвал `socket.disconnect()`; клиент считает это намеренным и **не**
        переподключается, пока код не вызовет `socket.connect()`;
      - `"io client disconnect"` — клиент сам вызвал `disconnect()`, тоже без переподключения.

      Частая ошибка: сервер отключает неавторизованного клиента, а фронтенд ждёт, что тот переподключится сам после
      обновления токена. Нужно обновить токен и вызвать `socket.connect()`.

      **`connect_error`** — другое событие: неудачная попытка подключиться. При временном сбое сети попытки
      продолжаются. Но если подключение отклонил middleware сервера — например, токен истёк, — клиент тоже
      не переподключается сам (`socket.active` равен `false`): код обновляет токен и вызывает `socket.connect()`.

      ## Буфер событий без соединения

      `socket.emit()` без соединения не бросает исключение, как нативный `send()` до открытия, и не теряет событие:
      оно ложится в буфер и уйдёт после переподключения, по порядку. Для важных действий это удобно. Для частых
      и быстро устаревающих данных — курсор, позиция в игре — вредно: после переподключения на сервер вывалится
      пачка старых событий. Для них проверяют `socket.connected` перед отправкой или используют
      **`socket.volatile.emit`** — «летучие» события, которые без соединения просто теряются.

      ## Подтверждения

      Подтверждение (acknowledgement) — ответ сервера на конкретное событие. Два способа записи:
      - колбэк последним аргументом: `socket.emit("save", data, (res) => …)` — он получает только ответ сервера;
        с `socket.timeout(5000).emit("save", data, (err, res) => …)` первым аргументом приходит ошибка таймаута;
      - промис: `await socket.timeout(5000).emitWithAck("save", data)`.

      `timeout()` задаёт срок: без него клиент ждал бы ответа вечно, если сервер его не пришлёт. С `timeout()`
      промис `emitWithAck` по истечении срока отклоняется. `emit` сам промис не возвращает:
      `await socket.emit(...)` ничего не ждёт. На сервере обработчик получает функцию ответа последним аргументом
      и вызывает её с результатом.

      ## Комнаты и socket.id

      **Комната** (room) — серверная группа сокетов для рассылки: `io.to("room-42").emit("message", msg)`.
      - Добавить сокет в комнату можно только на сервере: `socket.join("room-42")`. Клиент о комнатах не знает и может
        лишь попросить сервер своим событием.
      - Клиент получает обычные события, которые сервер разослал в комнату. Подписываться на «имя комнаты»
        не нужно — имя комнаты не имя события.
      - Каждый сокет сразу состоит в комнате с именем своего `socket.id`, поэтому одному клиенту можно отправить
        через `io.to(socketId).emit(...)`.
      - **`socket.id` меняется при каждом подключении**, и комнаты после переподключения не сохраняются: новое
        подключение — новый серверный сокет без комнат. Поэтому при каждом подключении сервер заново определяет
        пользователя по токену или сессии, а не по `socket.id`, и заново добавляет его в нужные комнаты.
        Восстановление состояния соединения (connection state recovery, Socket.IO 4.6+) частично это смягчает.

      ## Несколько серверов

      Из-за старта через polling у Socket.IO на нескольких экземплярах две разные задачи:
      - **sticky-сессии** — long polling — это серия HTTP-запросов с одним id сессии, и все они должны попадать
        на один экземпляр. Иначе экземпляр, получивший чужой запрос, ответит `400` «Session ID unknown». Лечится
        sticky-сессиями на балансировщике (по cookie или IP) или `transports: ["websocket"]` на клиенте;
      - **адаптер** — чтобы `io.to(room).emit()` дошёл до клиентов на других экземплярах, нужен адаптер, например
        на Redis (урок «Серверы, прокси и альтернативы»). Без него подключение работает, но рассылки доходят только
        до своих.

      ## Пример целиком: чат на Socket.IO

      ```js
      const socket = io({ auth: (cb) => cb({ token: getToken() }) });

      socket.on('connect', () => socket.emit('join', ['chat-42']));
      socket.on('message', addMessage);
      let authExpired = false;
      socket.on('auth-expired', () => { authExpired = true; }); // сервер шлёт его перед socket.disconnect()
      socket.on('disconnect', (reason) => {
        if (reason === 'io server disconnect' && authExpired) {
          authExpired = false;
          refreshToken().then(() => socket.connect());
        }
      });
      socket.on('connect_error', (err) => {
        if (!socket.active && err.message === 'unauthorized') refreshToken().then(() => socket.connect());
      });

      // msg = { id: crypto.randomUUID(), text } — id создают один раз, когда человек нажал «Отправить»
      async function send(msg) {
        await socket.timeout(5000).emitWithAck('send', msg);
        markSent(msg.id);
      }
      function moveCursor(pos) {
        socket.volatile.emit('cursor', pos);
      }
      ```

      - При каждом подключении клиент просит сервер снова добавить его в комнату `chat-42`: комнаты не переживают
        переподключение.
      - `auth` — функция: при каждом подключении она берёт свежий токен. Объект `{ token }` запомнил бы значение один
        раз, и `socket.connect()` после обновления ушёл бы со старым.
      - Если сервер выгнал клиента или middleware отклонил подключение, клиент обновляет токен и подключается сам —
        автоматически этого не будет. Но только когда причина — токен. Middleware отклоняет вход вызовом
        `next(new Error('unauthorized'))`, и это сообщение приходит в `err.message`. Перед `socket.disconnect()`
        сервер присылает своё событие `auth-expired`, а у самого события `disconnect` причины нет. Другие отказы —
        бан, нет доступа — показывают человеку, иначе они превратятся в цикл попыток без паузы.
      - Сообщение отправляется с подтверждением, сроком 5 секунд и id от клиента, как в уроке «Доставка, порядок
        и обратное давление»: после таймаута событие из буфера может всё же дойти, и повтор с тем же id сервер
        отбросит. Поэтому id создают один раз, когда человек нажал «Отправить», а при повторе передают то же
        сообщение целиком.
      - Курсор — летучим событием: без соединения старые позиции не копятся.
      - На сервере три экземпляра за балансировщиком со sticky-сессиями и Redis-адаптер.

      ## Варианты и их цена

      - **Нативный WebSocket**
        - Подходит: нужен стандартный протокол, бэкенд не на Socket.IO, важен размер клиента.
        - Цена: переподключение, подтверждения, комнаты и запасной транспорт пишете сами.
      - **Socket.IO с настройками по умолчанию**
        - Подходит: нужны готовые переподключение, подтверждения, комнаты и запасной транспорт.
        - Цена: свой протокол; на нескольких серверах — sticky-сессии и адаптер.
      - **Socket.IO только на WebSocket** (`transports: ["websocket"]`)
        - Подходит: сеть пользователей точно пропускает WebSocket.
        - Цена: нет запасного пути через polling.

      ## Типичные ошибки

      - **Подключать `socket.io-client` к чистому WebSocket-серверу.** Соединение не установится.
      - **Ждать переподключения после `"io server disconnect"`** или после отказа middleware в `connect_error`.
        Его не будет.
      - **Слать курсор обычным `emit`.** После обрыва сервер получит пачку устаревших позиций.
      - **Хранить `socket.id` как идентификатор пользователя.** Он меняется при каждом подключении.
      - **Ждать, что комнаты переживут переподключение.** Их нужно восстанавливать.
      - **Несколько экземпляров без sticky-сессий** — ошибки «Session ID unknown».

      ## Как спрашивают на интервью

      - «Socket.IO — это WebSocket?» — ждут: нет, свой протокол поверх нескольких транспортов.
      - «Почему Socket.IO не работает за балансировщиком?» — ждут polling, sticky-сессии и адаптер.
      - «Как дождаться ответа сервера на событие?» — ждут подтверждения с `timeout()` и `emitWithAck`.

      ## Коротко

      - Socket.IO — свой протокол поверх нескольких транспортов, совместимый только в паре «клиент Socket.IO — сервер
        Socket.IO», а не обёртка над WebSocket.
      - По умолчанию клиент начинает с long polling и переходит на WebSocket; `transports: ["websocket"]` быстрее, но
        без запасного пути.
      - Клиент переподключается сам при обрывах, но не после `"io server disconnect"` и не после отказа middleware
        в `connect_error` (`socket.active` равен `false`). Если причина — истёкший токен, код обновляет его и вызывает
        `socket.connect()`; другие отказы показывают человеку.
      - Без соединения `emit` складывает события в буфер и отправит после переподключения; для устаревающих данных
        берут `socket.volatile.emit`.
      - Ответа сервера ждут подтверждением, и обязательно со сроком: `socket.timeout(5000).emitWithAck(...)`.
      - Комнаты живут на сервере, `socket.id` меняется при каждом подключении, поэтому пользователя определяют
        по токену и заново добавляют в комнаты.
      - На нескольких экземплярах нужны sticky-сессии для polling и адаптер, например Redis, для рассылок между
        экземплярами.

      ## Источники

      - [Introduction: What Socket.IO is not — Socket.IO](https://socket.io/docs/v4/#what-socketio-is-not)
      - [Client options — Socket.IO](https://socket.io/docs/v4/client-options/)
      - [Using multiple nodes — Socket.IO](https://socket.io/docs/v4/using-multiple-nodes/)

  - id: wsl-libraries
    topic: Библиотеки
    title: Другие библиотеки
    questions: [ws-lib-008, ws-lib-009, ws-lib-010, ws-lib-011, ws-lib-012]
    body: |
      ## Какую проблему решаем

      Socket.IO — не единственный способ работать с сокетами. На сервере Node чаще всего стоит библиотека `ws`.
      Подписки GraphQL идут по своему протоколу поверх WebSocket. В приложениях на RxJS сокет удобно превратить
      в поток. Бэкенд на .NET приносит SignalR со своим клиентом. У каждой из них свои умолчания: что она делает
      сама, а что нет, — и ошибки обычно из-за того, что от библиотеки ждут чужого поведения.

      Урок — короткий обзор этих четырёх библиотек: чем каждая отличается от нативного `WebSocket` и где на ней
      спотыкаются.

      ## ws: WebSocket для Node

      `ws` — самая популярная реализация протокола для Node: сервер и клиент без лишних абстракций.
      - **В браузере не работает** — там нужен встроенный `WebSocket`; сборка для браузера прямо бросает ошибку
        с этим советом. Зато в Node 22 есть и встроенный клиентский `WebSocket`, а сервер по-прежнему берут из `ws`.
      - **Нет комнат, подтверждений и переподключений.** Чтобы разослать всем, сервер сам обходит `wss.clients`.
      - **Мёртвые соединения сама не замечает.** В документации есть рецепт: сервер периодически шлёт ping, а тех,
        кто не ответил pong, закрывает через `terminate()`. Браузеры на ping отвечают pong сами, поэтому такой
        heartbeat работает без кода на фронтенде — но страница о нём не узнаёт, и свою проверку связи клиенту
        всё равно нужно делать самому (урок «Обрывы и переподключение»).
      - **Умолчания сервера:** сжатие `permessage-deflate` выключено, сообщения принимаются до 100 МиБ — лимит
        стоит уменьшить через `maxPayload` (урок «Безопасность WebSocket»).

      ## graphql-ws: подписки GraphQL

      Подписки GraphQL (subscriptions) — способ получать события по запросу GraphQL, и чаще всего они идут поверх
      WebSocket. Здесь историческая путаница, на которой ломается половина интеграций:
      - старая заброшенная библиотека **`subscriptions-transport-ws`** говорит по подпротоколу с именем **`graphql-ws`**;
      - новая библиотека называется **`graphql-ws`**, а её подпротокол — **`graphql-transport-ws`**.

      Протоколы несовместимы, и ломается всё на выборе подпротокола при рукопожатии (урок «Рукопожатие и адрес
      соединения»):
      - **старый клиент и новый сервер** — клиент предлагает только `graphql-ws`, сервер такого не знает и не выбирает
        ничего. Браузер проваливает соединение: `error`, затем `close` с `1006`;
      - **новый клиент и старый сервер** — сервер выбирает предложенный `graphql-transport-ws`, не проверив его,
        соединение открывается, а потом старая библиотека видит чужой подпротокол и закрывает его кодом `1002`.

      В обоих случаях код приложения написан правильно, а подписки не работают: в первом случае соединение
      не открывается, во втором подписки получают ошибку с кодом `1002`. Искать надо несовпадение библиотек
      на клиенте и сервере, а не ошибку в своём коде.

      Клиент `graphql-ws` по умолчанию **ленивый** (`lazy: true`): соединение и сообщение `connection_init`
      появляются при первой подписке, а после последней отписки соединение закрывается (`lazyCloseTimeout`
      по умолчанию 0). Все подписки клиента идут по одному соединению, у каждой свой `id`. Если подписки часто
      появляются и исчезают, соединение будет постоянно переоткрываться — тогда помогают `lazy: false` или ненулевой
      `lazyCloseTimeout`.

      ## webSocket() из RxJS

      В RxJS данные текут **потоками** (Observable): на поток подписываются, и он присылает значения, затем либо
      ошибку (`error`), либо сигнал «поток закончился» (`complete`). **Subject** — поток, в который можно ещё и
      писать самому методом `next()`. **Операторы** — функции, которые оборачивают поток и меняют его поведение:
      например, `retry` при ошибке заново подписывается на исходный поток.

      `webSocket()` из `rxjs/webSocket` превращает сокет в `WebSocketSubject`: входящие сообщения приходят как значения
      потока, а то, что передали в `next()`, уходит на сервер.
      - **Ленивый и общий:** соединение открывается с первой подпиской, все подписчики делят одно соединение, а когда
        отписывается последний, сокет закрывается.
      - **Сообщения до открытия не теряются:** то, что передали в `next()` раньше, Subject копит и отправит после
        открытия.
      - **JSON по умолчанию:** исходящие сообщения сериализуются `JSON.stringify`, входящие разбираются `JSON.parse`.
      - **Обрыв — это `error`:** нечистое закрытие подписчики получают как ошибку, чистое — как `complete`. Сам
        Subject не переподключается. Переподключение добавляют операторами: `retry` с паузой подписывается заново
        после ошибки — а новая подписка и есть новое соединение; `repeat` — то же после чистого закрытия.
      - **`multiplex()`** делает поверх одного сокета независимые «каналы» с сообщениями подписки и отписки.

      ## SignalR

      SignalR — библиотека Microsoft для реального времени поверх ASP.NET Core со своим протоколом и JavaScript-клиентом.
      - **Транспорт выбирается сам:** клиент делает запрос `negotiate` и пробует WebSocket, затем Server-Sent Events,
        затем long polling.
      - **Переподключение включается явно** — `withAutomaticReconnect()`. Без этого вызова после обрыва сразу
        срабатывает `onclose`.
      - **Политика по умолчанию — четыре попытки** с паузами 0, 2, 10 и 30 секунд; первая — сразу. После четвёртой
        неудачи клиент сдаётся, соединение переходит в Disconnected и срабатывает `onclose`. Бесконечные попытки
        задают своей политикой.
      - Во время попыток срабатывает `onreconnecting`, после успеха — `onreconnected`: можно показать
        «Переподключаемся…» и восстановить состояние ([документация клиента](https://learn.microsoft.com/ru-ru/aspnet/core/signalr/javascript-client)).

      ## Пример целиком: чат на SignalR теряет связь на две минуты

      Командный чат с бэкендом на ASP.NET Core подключается через SignalR с `withAutomaticReconnect()` и политикой
      по умолчанию. Человек заходит в лифт и спускается на парковку, и связь пропадает на две минуты. Сеть пропала
      молча, поэтому клиент замечает обрыв не сразу: если от сервера 30 секунд нет сообщений, SignalR считает
      соединение потерянным (`serverTimeoutInMilliseconds`). Время ниже отсчитываем от этого момента.

      1. **0 секунд.** Соединение оборвалось. Срабатывает `onreconnecting`, чат показывает плашку «Переподключаемся…»
         и делает первую попытку сразу — она не удаётся.
      2. **Около 2, 12 и 42 секунд.** Вторая попытка — через 2 секунды после первой, третья — ещё через 10, четвёртая —
         ещё через 30. Сети всё нет.
      3. **Около 42 секунд.** Четвёртая попытка провалилась, и клиент сдаётся: соединение переходит в Disconnected,
         срабатывает `onclose`. Без своего кода чат так и висел бы с плашкой, а сообщения перестали бы приходить.
      4. **Что делает чат.** В `onclose` плашка сменяется на «Нет связи» с кнопкой «Повторить», которая вызывает
         `start()` заново. Через две минуты человек выходит из лифта, нажимает кнопку — и чат снова на связи.
      5. **Как лучше.** Своя политика переподключения вместо умолчаний: растущая пауза до 30 секунд и попытки
         без конца, как в уроке «Обрывы и переподключение». Тогда чат вернётся сам, без кнопки.

      С другими библиотеками картина та же, только другие умолчания: у `ws` и нативного клиента переподключения нет
      вовсе, у RxJS его добавляют `retry`, а клиент `graphql-ws` по умолчанию делает до пяти повторных попыток
      с растущей паузой (`retryAttempts`).

      ## Варианты и их цена

      - **`ws` + нативный клиент**
        - Подходит: нужен стандартный протокол и полный контроль.
        - Цена: надёжность строится вручную.
      - **`graphql-ws`**
        - Подходит: API уже на GraphQL, нужны подписки.
        - Цена: обе стороны должны говорить на `graphql-transport-ws`.
      - **RxJS `webSocket()`**
        - Подходит: приложение уже живёт на потоках RxJS.
        - Цена: переподключение и протокол поверх — свои.
      - **SignalR**
        - Подходит: бэкенд на ASP.NET Core.
        - Цена: свой протокол и конечная политика переподключения по умолчанию.

      ## Типичные ошибки

      - **Импортировать `ws` во фронтенд.** В браузере он не работает.
      - **Ждать от `ws` комнат и переподключений.** Их там нет.
      - **Смешать `subscriptions-transport-ws` и `graphql-ws`.** Разные протоколы, подписки не работают.
      - **Ждать, что `webSocket()` из RxJS переподключится сам.** Нужен `retry`.
      - **Забыть `withAutomaticReconnect()` в SignalR** или считать, что попытки бесконечны.

      ## Как спрашивают на интервью

      - «Почему подписки GraphQL не работают с этим сервером?» — ждут путаницу `graphql-ws` и `graphql-transport-ws`.
      - «Как в `ws` обнаружить мёртвых клиентов?» — ждут серверный ping и `terminate()` тех, кто не ответил.
      - «Переподключается ли клиент SignalR сам?» — ждут: только с `withAutomaticReconnect()` и по умолчанию четыре
        попытки.

      ## Коротко

      - `ws` — реализация протокола для Node без комнат, подтверждений и переподключений; в браузере не работает,
        мёртвые соединения ловят серверным ping и `terminate()`.
      - Новая библиотека `graphql-ws` говорит по подпротоколу `graphql-transport-ws`, а старая
        `subscriptions-transport-ws` — по `graphql-ws`; клиент и сервер должны выбрать одну.
      - Клиент `graphql-ws` по умолчанию ленивый: соединение появляется с первой подпиской и закрывается после
        последней, а все подписки идут по одному соединению.
      - `webSocket()` из RxJS — ленивый общий Subject с JSON и буфером до открытия; обрыв приходит как `error`,
        а переподключение добавляют операторами `retry` или `repeat`.
      - SignalR сам выбирает транспорт, но переподключается только с `withAutomaticReconnect()` и по умолчанию
        делает четыре попытки — сразу, через 2, 10 и 30 секунд.

      ## Источники

      - [ws: How to detect and close broken connections — GitHub](https://github.com/websockets/ws#how-to-detect-and-close-broken-connections)
      - [GraphQL over WebSocket Protocol — graphql-ws](https://github.com/enisdenjo/graphql-ws/blob/master/PROTOCOL.md)
      - [webSocket — RxJS](https://rxjs.dev/api/webSocket/webSocket)

questions:
  # ===================== Протокол =====================
  - id: ws-proto-001
    topic: Протокол
    level: junior
    question: |
      Каким кодом сервер отвечает на рукопожатие по HTTP/1.1, если согласен перейти на WebSocket?
    options:
      - text: '`101`'
        correct: true
        why: '`101 Switching Protocols` подтверждает смену протокола: дальше по тому же TCP-соединению идут кадры WebSocket, а не HTTP.'
      - text: '`200`'
        why: 'Обычный успешный ответ. В HTTP/1.1 после него соединение осталось бы HTTP, а клиент посчитал бы рукопожатие неудачным.'
      - text: '`426`'
        why: '`426 Upgrade Required` — отказ: сервер требует другой протокол или версию. По RFC 6455 так отвечают, например, на неподдерживаемую `Sec-WebSocket-Version`.'
      - text: '`204`'
        why: '`204 No Content` — успешный ответ без тела. К смене протокола он отношения не имеет.'
    explanation: |
      Соединение WebSocket по HTTP/1.1 начинается как обычный запрос `GET` с заголовками `Upgrade: websocket`,
      `Connection: Upgrade`, `Sec-WebSocket-Key` и `Sec-WebSocket-Version: 13`. Если сервер согласен, он отвечает
      `101 Switching Protocols`, и с этого момента по тому же TCP-соединению обе стороны обмениваются кадрами
      WebSocket. Любой другой код браузер считает провалом рукопожатия. Поверх HTTP/2 рукопожатие устроено иначе.
    links:
      - https://datatracker.ietf.org/doc/html/rfc6455#section-4
  - id: ws-proto-002
    topic: Протокол
    level: middle
    question: |
      Зачем в рукопожатии сервер возвращает заголовок `Sec-WebSocket-Accept`?
    options:
      - text: 'Доказать, что сервер понял именно рукопожатие WebSocket'
        correct: true
        why: 'Значение вычисляется из `Sec-WebSocket-Key` клиента по правилу из RFC 6455. Обычный HTTP-сервер или кэш так не ответит.'
      - text: 'Передать клиенту ключ, которым дальше шифруются все сообщения'
        why: 'WebSocket сам ничего не шифрует, для этого есть TLS в `wss://`. Значение заголовка известно любому, кто видел ключ клиента.'
      - text: 'Подтвердить, что пользователь прошёл авторизацию на сервере'
        why: 'Заголовок вычисляется одинаково для любого клиента и ничего не знает о пользователе. Авторизацию нужно делать отдельно.'
      - text: 'Сообщить клиенту, какой из подпротоколов выбрал сервер'
        why: 'Для подпротокола есть отдельный заголовок `Sec-WebSocket-Protocol`.'
    explanation: |
      Клиент присылает случайный `Sec-WebSocket-Key`. Сервер приклеивает к нему фиксированную строку
      `258EAFA5-E914-47DA-95CA-C5AB0DC85B11`, считает SHA-1 и отдаёт результат в base64. Клиент проверяет значение
      и так убеждается, что на той стороне сервер WebSocket, а не прокси или кэш, случайно ответивший `101`.
      Это защита от недоразумений, а не криптография: ни шифрования, ни проверки личности здесь нет.
    links:
      - https://datatracker.ietf.org/doc/html/rfc6455#section-1.3

  - id: ws-proto-003
    topic: Протокол
    level: middle
    question: |
      Какие утверждения о маскировании кадров WebSocket верны?
    options:
      - text: 'Клиент обязан маскировать каждый кадр, который отправляет серверу'
        correct: true
        why: 'Это требование RFC 6455. Сервер, получивший немаскированный кадр от клиента, закрывает соединение с ошибкой протокола.'
      - text: 'Кадры от сервера к клиенту не маскируются'
        correct: true
        why: 'Маска нужна только в направлении от клиента. В обратную сторону то же правило: клиент, получив маскированный кадр, закрывает соединение.'
      - text: 'Маскирование защищает сообщения от чтения посредниками'
        why: 'Ключ маски передаётся в том же кадре, снять маску может кто угодно. От чтения защищает только TLS (`wss://`).'
      - text: 'Маску выбирает сервер при рукопожатии и сообщает её клиенту'
        why: 'Клиент генерирует новый случайный ключ маски для каждого кадра и кладёт его в заголовок кадра.'
      - text: 'В браузере маскирование нужно включить отдельной настройкой'
        why: 'Браузер маскирует кадры сам, управлять этим из JavaScript нельзя.'
    explanation: |
      Маскирование — это XOR полезной нагрузки со случайным 4-байтовым ключом, который лежит тут же, в заголовке
      кадра. Смысл не в секретности, а в защите посредников: злоумышленник со страницы не может подобрать байты,
      которые старый прокси или кэш примет за HTTP-запрос и закэширует (атака отравления кэша). Поэтому маскировать
      обязан только клиент — именно его код может оказаться враждебным.
    links:
      - https://datatracker.ietf.org/doc/html/rfc6455#section-5.3
  - id: ws-proto-004
    topic: Протокол
    level: senior
    question: |
      Какие утверждения об управляющих кадрах WebSocket (close, ping, pong) верны?
    options:
      - text: 'Их полезная нагрузка не больше 125 байт'
        correct: true
        why: 'Ограничение из RFC 6455: управляющий кадр должен помещаться в короткую форму длины.'
      - text: 'Их нельзя разбивать на фрагменты'
        correct: true
        why: 'Фрагментироваться могут только сообщения с данными. Управляющий кадр всегда один целый кадр.'
      - text: 'Их можно вставлять между фрагментами большого сообщения'
        correct: true
        why: 'Так ping или close не ждут, пока дойдёт огромное сообщение: управляющий кадр проходит посреди фрагментов.'
      - text: 'В браузере их можно отправить методами `ws.ping()` и `ws.pong()`'
        why: 'В браузерном API таких методов нет. На ping браузер отвечает pong сам, а отправить ping из JavaScript нельзя.'
      - text: 'Pong допустимо отправлять только в ответ на ping'
        why: 'RFC разрешает и самостоятельный pong — как одностороннее «я жив», ответ на него не ожидается.'
    explanation: |
      Кадры бывают с данными (текст, двоичные, продолжение фрагмента) и управляющие (close, ping, pong).
      Управляющие короткие, нефрагментируемые и могут приходить посреди фрагментированного сообщения — так
      проверка «жив ли собеседник» и закрытие не застревают за большой передачей. В браузере всем этим управляет
      сам браузер; из JavaScript доступны только сообщения и закрытие соединения.
    links:
      - https://datatracker.ietf.org/doc/html/rfc6455#section-5.5

  - id: ws-proto-005
    topic: Протокол
    level: middle
    question: |
      Сервер отправил одно сообщение тремя фрагментами. Сколько раз сработает `onmessage` в браузере?
    options:
      - text: '1'
        correct: true
        why: 'Браузер собирает фрагменты и отдаёт в `onmessage` уже целое сообщение.'
      - text: '3'
        why: 'Фрагменты — деталь протокола. Браузерный API работает с сообщениями, а не с кадрами.'
      - text: '`1`, но `event.data` будет массивом из трёх частей'
        why: '`event.data` бывает строкой, `Blob` или `ArrayBuffer`. Массива частей браузер не отдаёт: сообщение собирается целиком.'
      - text: '3, если сообщение двоичное'
        why: 'Тип данных на сборку не влияет: двоичное сообщение браузер тоже собирает целиком.'
    explanation: |
      В протоколе есть кадры и сообщения. Большое сообщение отправитель может разбить на фрагменты: первый кадр
      с типом текст или двоичные данные, следующие — с типом «продолжение», у последнего выставлен бит FIN.
      Браузер прячет это от кода: `onmessage` получает целое сообщение. Обратная сторона — потокового чтения
      большого сообщения по частям в стандартном `WebSocket` нет.
  - id: ws-proto-006
    topic: Протокол
    level: senior
    question: |
      Что верно про код `1006` в событии `close`?
    options:
      - text: 'Его никогда не передают по сети, браузер ставит его сам'
        correct: true
        why: 'RFC 6455 запрещает отправлять `1006` в кадре close: он только обозначает для приложения, что закрытия по протоколу не было.'
      - text: 'Так сервер сообщает, что перегружен и просит переподключиться позже'
        why: 'Для перегрузки есть `1013 Try Again Later`. `1006` вообще не приходит от сервера.'
      - text: 'Это код, который передают при обычном завершении работы'
        why: 'Нормальное закрытие — `1000`. `1006` означает как раз ненормальное, без обмена кадрами close.'
      - text: 'Его ставит браузер, когда пользователь уходит со страницы'
        why: 'При уходе со страницы браузер закрывает соединение по протоколу с кодом `1001 Going Away`.'
    explanation: |
      Корректное закрытие — обмен кадрами close с кодом и причиной. Если соединение исчезло без этого (сеть
      пропала, процесс сервера убит, прокси оборвал TCP), браузер сообщает `1006` и `wasClean: false`. Ещё два
      «служебных» кода тоже не передаются по сети: `1005` — кадр close пришёл без кода, `1015` — не удался
      TLS. Для приложения `1006` обычно сигнал переподключаться.
    links:
      - https://datatracker.ietf.org/doc/html/rfc6455#section-7.4.1
  - id: ws-proto-007
    topic: Протокол
    level: middle
    question: |
      Страница открыта по адресу `https://example.com/app/`. К какому адресу подключится сокет в современном
      браузере?
    code: |
      const ws = new WebSocket('/socket');
    codeLang: js
    options:
      - text: '`wss://example.com/socket`'
        correct: true
        why: 'Относительный адрес разрешается от адреса страницы, а схема `https` превращается в `wss`.'
      - text: '`ws://example.com/socket`'
        why: 'Для страницы по HTTPS схема берётся защищённая: `https` превращается в `wss`, а не в `ws`.'
      - text: '`wss://example.com/app/socket`'
        why: 'Адрес начинается с `/`, значит, он от корня сайта. Путь `/app/` добавился бы для адреса без косой черты: `socket`.'
      - text: 'Конструктор бросит `SyntaxError`'
        why: 'Так было в старых браузерах. Относительные адреса и схемы `http(s)` стандарт разрешил недавно, с 2024 года их поддерживают Chrome, Firefox и Safari.'
    explanation: |
      Современный стандарт WebSocket разрешает передавать в конструктор относительные адреса и адреса со схемами
      `http:` и `https:`: браузер разрешит их относительно страницы и заменит `http` на `ws`, а `https` на `wss`.
      Так проще писать код, который одинаково работает локально и на продакшене. В старых браузерах такой адрес
      вызывал `SyntaxError`, поэтому в старом коде адрес часто собирают вручную из `location.host`.
  - id: ws-proto-008
    topic: Протокол
    level: senior
    question: |
      Как WebSocket работает поверх HTTP/2?
    options:
      - text: 'Через расширенный `CONNECT`: сокет — поток в общем соединении'
        correct: true
        why: 'Так описано в RFC 8441: клиент отправляет `CONNECT` с псевдозаголовком `:protocol: websocket`, и в этом потоке идут кадры WebSocket.'
      - text: 'Через заголовок `Upgrade`, как в HTTP/1.1, только без ответа `101`'
        why: 'В HTTP/2 механизма `Upgrade` нет вовсе. Нужен был отдельный способ, им и стал расширенный `CONNECT`.'
      - text: 'Никак: при HTTP/2 браузер открывает для сокета отдельное соединение HTTP/1.1'
        why: 'Так было до RFC 8441 и до сих пор бывает, если сервер не поддерживает расширение. Но способ поверх HTTP/2 есть.'
      - text: 'Через Server Push: сервер сам открывает новый поток к клиенту'
        why: 'Push передавал ресурсы от сервера и к сокетам отношения не имел. К тому же браузеры его отключили.'
    explanation: |
      В HTTP/1.1 каждый WebSocket занимает своё TCP-соединение. RFC 8441 позволяет запустить WebSocket внутри
      HTTP/2: клиент отправляет `CONNECT` с `:protocol: websocket`, сервер отвечает `200`, и поток превращается в
      двунаправленный канал. Сокет делит соединение с обычными запросами страницы. Для HTTP/3 то же самое
      описывает RFC 9220. Если сервер такое не поддерживает, браузер откроет отдельное соединение HTTP/1.1.
    links:
      - https://datatracker.ietf.org/doc/html/rfc8441


  - id: ws-proto-009
    topic: Протокол
    level: senior
    question: |
      Что верно про сжатие сообщений `permessage-deflate`?
    options:
      - text: 'О нём договариваются в рукопожатии заголовком `Sec-WebSocket-Extensions`'
        correct: true
        why: 'Клиент предлагает расширение, сервер подтверждает его в ответе или не упоминает — тогда сообщения идут без сжатия.'
      - text: 'Chrome предлагает его сам, управлять этим из JavaScript нельзя'
        correct: true
        why: 'Chrome отправляет `Sec-WebSocket-Extensions: permessage-deflate; client_max_window_bits`, и в API нет настройки, чтобы это выключить.'
      - text: 'На сервере в библиотеке `ws` сжатие включено по умолчанию для всех'
        why: 'В `ws` на сервере сжатие по умолчанию выключено (`perMessageDeflate: false`), в отличие от клиента той же библиотеки.'
      - text: 'В `onmessage` приходят сжатые байты, их нужно распаковать'
        why: 'Распаковывает браузер: в `onmessage` приходит уже исходное сообщение.'
    explanation: |
      `permessage-deflate` — расширение протокола: каждое сообщение сжимается алгоритмом deflate. Для текста
      вроде JSON это заметно экономит трафик, но на сервере с тысячами соединений контексты сжатия съедают
      память, а само сжатие — процессор. Поэтому серверные библиотеки включают его осознанно, часто с порогом:
      маленькие сообщения не сжимают.
    links:
      - https://datatracker.ietf.org/doc/html/rfc7692
  # ===================== API браузера =====================
  - id: ws-api-001
    topic: API браузера
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      const ws = new WebSocket('wss://example.com/socket');
      const states = [ws.readyState];
      ws.onopen = () => {
        states.push(ws.readyState);
        ws.close();
        states.push(ws.readyState);
      };
      ws.onclose = () => {
        states.push(ws.readyState);
        console.log(states.join(' '));
      };
    codeLang: js
    options:
      - text: '`0 1 2 3`'
        correct: true
        why: 'CONNECTING сразу после конструктора, OPEN в `onopen`, CLOSING сразу после `close()`, CLOSED в `onclose`.'
      - text: '`0 1 3 3`'
        why: '`close()` не закрывает мгновенно: сначала идёт обмен кадрами close, а пока он идёт, состояние — CLOSING (2).'
      - text: '`1 1 2 3`'
        why: 'Сразу после конструктора соединение ещё не открыто: рукопожатие асинхронное, состояние CONNECTING (0).'
      - text: '`0 1 2 2`'
        why: 'К моменту события `close` закрытие завершено, состояние уже CLOSED (3).'
    explanation: |
      `readyState` проходит четыре состояния: `0` CONNECTING, `1` OPEN, `2` CLOSING, `3` CLOSED (есть и константы
      `WebSocket.OPEN` и т. д.). Конструктор не ждёт сети: соединение устанавливается в фоне, и узнать об успехе
      можно только из `onopen`. Закрытие тоже асинхронное: `close()` переводит сокет в CLOSING, а CLOSED
      наступает, когда стороны обменялись кадрами close или соединение оборвалось.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/readyState
  - id: ws-api-002
    topic: API браузера
    level: junior
    question: |
      Что произойдёт при вызове `send` сразу после создания сокета?
    code: |
      const ws = new WebSocket('wss://example.com/socket');
      ws.send('hello');
    codeLang: js
    options:
      - text: 'Будет исключение `InvalidStateError`'
        correct: true
        why: 'В состоянии CONNECTING отправлять нельзя, и браузер бросает исключение синхронно, прямо в `send`.'
      - text: 'Сообщение встанет в очередь и уйдёт после открытия'
        why: 'Нативный `WebSocket` такой очереди не ведёт.'
      - text: 'Сообщение молча потеряется без ошибки'
        why: 'До открытия браузер не молчит: об ошибке он сообщает сразу.'
      - text: 'Браузер дождётся открытия соединения прямо внутри `send`'
        why: 'Блокирующих вызовов у `WebSocket` нет: `send` никогда не ждёт сети.'
    explanation: |
      Отправлять можно только в состоянии OPEN, поэтому первые сообщения отправляют в `onopen`, а всё, что
      нужно послать раньше, складывают в свою очередь и отправляют после открытия. В Chrome текст ошибки:
      «Failed to execute 'send' on 'WebSocket': Still in CONNECTING state».
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/send
  - id: ws-api-003
    topic: API браузера
    level: middle
    question: |
      Соединение уже закрыто (`readyState === 3`). Что произойдёт при вызове `ws.send('hello')`?
    options:
      - text: 'Исключения не будет, данные пропадут'
        correct: true
        why: 'Так требует стандарт: после закрытия `send()` не бросает исключение, данные никуда не уходят.'
      - text: 'Будет исключение `InvalidStateError`'
        why: 'Частая ловушка: исключение для закрытого сокета было бы логично, но стандарт его не предусматривает.'
      - text: 'Будет исключение `NetworkError`'
        why: 'Такого исключения `send()` не бросает вовсе: сетевые проблемы проявляются через события, а не через исключения.'
      - text: '`send()` вернёт `false`, сообщение не уйдёт'
        why: '`send()` ничего не возвращает (`undefined`), так что по результату вызова отправку не проверить.'
    explanation: |
      После закрытия `send()` не бросает исключение: Chrome лишь пишет предупреждение в консоль, а код ничего не
      узнаёт. Отсюда типичная потеря данных: код отправляет сообщение в момент обрыва и считает, что оно ушло.
      Поэтому перед отправкой проверяют `readyState === WebSocket.OPEN`, а важные сообщения подтверждают ответом от
      сервера.
    links:
      - https://websockets.spec.whatwg.org/#dom-websocket-send
  - id: ws-api-004
    topic: API браузера
    level: middle
    question: |
      Какие вызовы выполнятся без исключения на открытом сокете?
    options:
      - text: '`ws.close(1000)`'
        correct: true
        why: '`1000` — нормальное закрытие, его передавать можно.'
      - text: '`ws.close(4000, "logout")`'
        correct: true
        why: 'Диапазон 4000–4999 отдан приложениям под свои коды.'
      - text: '`ws.close(3000)`'
        correct: true
        why: 'Коды 3000–3999 регистрируются для библиотек и фреймворков, браузер их тоже пропускает.'
      - text: '`ws.close(1001)`'
        why: '`1001 Going Away` браузер ставит сам при уходе со страницы. Из JavaScript такой код вызовет `InvalidAccessError`.'
      - text: '`ws.close(1011)`'
        why: '`1011` — внутренняя ошибка сервера. Код из диапазона 1001–2999 из скрипта передать нельзя — будет `InvalidAccessError`.'
    explanation: |
      Из JavaScript в `close()` можно передать только `1000` или код из диапазона 3000–4999. Остальные коды
      протокола (`1001`, `1008`, `1011` и т. д.) — для самих реализаций и серверов. Причина (`reason`) — до
      123 байт в UTF-8: длиннее не поместится в управляющий кадр вместе с кодом, и браузер бросит `SyntaxError`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/close

  - id: ws-api-005
    topic: API браузера
    level: senior
    question: |
      Соединение открылось, а через секунду процесс сервера убили — TCP-соединение просто оборвалось. Что выведется
      в консоль в Chrome?
    code: |
      const ws = new WebSocket('wss://example.com/socket');
      const log = [];
      ws.onopen = () => log.push('open');
      ws.onerror = () => log.push('error');
      ws.onclose = (e) => {
        log.push(`close ${e.code} ${e.wasClean}`);
        console.log(log.join(', '));
      };
    codeLang: js
    options:
      - text: '`open, close 1006 false`'
        correct: true
        why: 'Обрыв уже открытого соединения в Chrome приходит одним событием `close` с `1006` и `wasClean: false`, без `error`.'
      - text: '`open, error, close 1006 false`'
        why: 'Так выглядит неудачное подключение — например, сервер недоступен. Обрыв открытого соединения в Chrome проходит без `error`.'
      - text: '`open, close 1000 true`'
        why: '`1000` и `wasClean: true` бывают, только если стороны обменялись кадрами close. Убитый процесс их не отправит.'
      - text: '`open, close 1001 true`'
        why: '`1001` означает уход стороны по протоколу, например при закрытии страницы. Здесь закрытия по протоколу не было.'
    explanation: |
      Обрыв открытого соединения и неудачное подключение выглядят в событиях по-разному, поэтому смотреть стоит на
      `close`: `wasClean` и код показывают, как закрылось соединение.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/CloseEvent
  - id: ws-api-006
    topic: API браузера
    level: middle
    multiple: true
    question: |
      Что верно про `ws.binaryType`?
    options:
      - text: 'По умолчанию двоичные сообщения приходят как `Blob`'
        correct: true
        why: 'Значение по умолчанию — `"blob"`. Чтобы получать `ArrayBuffer`, его меняют на `"arraybuffer"`.'
      - text: 'От него зависит и тип текстовых сообщений'
        why: 'Текстовые сообщения всегда приходят строкой, `binaryType` касается только двоичных.'
      - text: 'Менять его можно только до открытия соединения'
        why: 'Его можно поменять в любой момент, новое значение действует на следующие входящие сообщения.'
      - text: 'Он задаёт и формат данных, которые отправляет `send()`'
        why: '`send()` принимает строку, `Blob`, `ArrayBuffer` или типизированный массив независимо от `binaryType`.'
    explanation: |
      Текстовые кадры приходят строкой, двоичные — `Blob` или `ArrayBuffer` в зависимости от `binaryType`. `Blob`
      удобен для больших данных, но прочитать его можно только асинхронно (`await blob.arrayBuffer()`). Для
      двоичных протоколов (protobuf, MessagePack) обычно сразу ставят `"arraybuffer"`, чтобы разбирать сообщения
      синхронно.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/binaryType
  - id: ws-api-007
    topic: API браузера
    level: middle
    question: |
      Нужно передать токен авторизации при открытии сокета. Что получится?
    code: |
      const ws = new WebSocket('wss://api.example.com/socket', {
        headers: { Authorization: `Bearer ${token}` },
      });
    codeLang: js
    options:
      - text: 'Конструктор бросит `SyntaxError`, заголовок не уйдёт'
        correct: true
        why: 'Второй аргумент — список подпротоколов. Объект превратится в строку `[object Object]`, а это недопустимое имя подпротокола.'
      - text: 'Заголовок `Authorization` уйдёт в запросе рукопожатия'
        why: 'Так можно в Node-библиотеке `ws`, но браузерный `WebSocket` не даёт задавать заголовки рукопожатия.'
      - text: 'Объект проигнорируется, соединение откроется без заголовка'
        why: 'Браузер не игнорирует аргумент, а пытается прочитать его как подпротокол и падает на проверке имени.'
      - text: 'Откроется соединение с подпротоколом `[object Object]`'
        why: 'В `[object Object]` есть пробел и скобки, а такие символы в имени подпротокола запрещены. До сети дело не дойдёт.'
    explanation: |
      Сигнатура в браузере — `new WebSocket(url, protocols)`, и задать произвольные заголовки рукопожатия нельзя.
      Браузер сам добавляет cookie сайта и `Origin`. Поэтому токен обычно передают другим путём: cookie, первым
      сообщением после открытия, короткоживущим одноразовым билетом в URL или (как обходной трюк) через значение
      `Sec-WebSocket-Protocol`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/WebSocket
  - id: ws-api-008
    topic: API браузера
    level: senior
    question: |
      Клиент открыл `new WebSocket(url, ['chat.v1'])`, а сервер в ответе на рукопожатие не прислал
      `Sec-WebSocket-Protocol`. Что произойдёт?
    options:
      - text: 'Соединение не откроется, будут `error` и `close` с кодом `1006`'
        correct: true
        why: 'Если клиент запросил подпротоколы, сервер обязан выбрать один из них. Без выбора браузер считает рукопожатие неудачным.'
      - text: 'Соединение откроется, а `ws.protocol` будет пустой строкой'
        why: 'У открытого сокета пустой `ws.protocol` бывает, только если клиент не просил подпротоколов вовсе.'
      - text: 'Соединение откроется, а `ws.protocol` будет равен `"chat.v1"`'
        why: 'Подпротокол выбирает сервер. Без его ответа браузер не может считать, что договорились о `chat.v1`.'
      - text: 'Браузер повторит рукопожатие уже без подпротоколов'
        why: 'Повторов рукопожатия с другими параметрами браузер не делает: подпротоколы задаёт только код.'
    explanation: |
      Подпротоколы — способ договориться о формате сообщений поверх WebSocket: например, `mqtt` или `wamp`.
      Клиент перечисляет, что умеет, сервер выбирает один вариант и возвращает его в `Sec-WebSocket-Protocol`, а
      клиент видит выбор в `ws.protocol`. Если варианты были, а выбора нет, браузер проваливает соединение.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/protocol
  - id: ws-api-009
    topic: API браузера
    level: middle
    question: |
      Что верно про `ws.bufferedAmount`?
    options:
      - text: 'Растёт синхронно, сразу при вызове `send()`'
        correct: true
        why: 'Данные кладутся в очередь в момент вызова: сразу после отправки мегабайта счётчик показывает около 1 000 000.'
      - text: 'Ничего не говорит о доставке до сервера'
        correct: true
        why: 'Он уменьшается, когда данные ушли в сеть, а не когда сервер их получил. Подтверждений доставки в протоколе нет.'
      - text: 'Учитывает и входящие данные, ещё не прочитанные в `onmessage`'
        why: 'Счётчик только про исходящую очередь, входящие данные в нём не учитываются.'
      - text: 'Обнуляется, только когда сервер подтвердит приём'
        why: 'Сервер ничего не подтверждает на уровне протокола. Счётчик уменьшается по мере отправки в сеть.'
    explanation: |
      `send()` не ждёт сети: данные кладутся в очередь, а `bufferedAmount` показывает её размер в байтах. Он
      растёт при вызове `send()` и падает по мере того, как данные уходят в сеть.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/bufferedAmount
  - id: ws-api-010
    topic: API браузера
    level: senior
    question: |
      Какие утверждения о событии `error` у `WebSocket` верны?
    options:
      - text: 'Это обычный `Event` без описания причины ошибки'
        correct: true
        why: 'Подробности браузер не раскрывает намеренно: так страница не может выяснять устройство чужой сети по текстам ошибок.'
      - text: 'После `error` всегда приходит `close`'
        correct: true
        why: 'Ошибка всегда заканчивается закрытием. Поэтому логику переподключения кладут в `onclose`.'
      - text: 'В нём есть HTTP-статус, если рукопожатие отклонили'
        why: 'Статус отказа (например, `401` или `403`) скрипту недоступен — его видно только в DevTools: в консоли и во вкладке Network.'
      - text: 'Оно приходит при каждом закрытии соединения'
        why: 'При нормальном закрытии обменом кадрами close события `error` нет.'
    explanation: |
      `error` — бедное событие: «что-то пошло не так», без деталей. Узнать, отклонил ли сервер рукопожатие с `401`
      или вовсе недоступен, из кода нельзя. Поэтому диагностику делают по `close` (код, `wasClean`) и по
      собственному протоколу: например, сервер принимает соединение и сразу закрывает его кодом `4001` с причиной
      «не авторизован».
  # ===================== Надёжность =====================
  - id: ws-rel-001
    topic: Надёжность
    level: senior
    question: |
      Клиент переподключается с растущей задержкой: 1, 2, 4, 8… секунд. Когда возвращать задержку к начальной?
    options:
      - text: 'Когда соединение продержалось, скажем, 30 секунд'
        correct: true
        why: 'Только устойчивое соединение говорит, что проблема ушла. Короткий успех ещё ничего не значит.'
      - text: 'Сразу в `onopen` нового соединения'
        why: 'Если сервер принимает соединение и тут же закрывает его (падает или отклоняет токен), клиент будет засыпать его попытками с минимальной задержкой.'
      - text: 'Никогда: однажды выросшая задержка должна только расти'
        why: 'Тогда после долгой стабильной работы любой случайный обрыв заставит пользователя ждать минуты.'
      - text: 'Когда `navigator.onLine` снова станет `true`'
        why: '`navigator.onLine` говорит лишь о том, что у устройства есть сеть, а не о том, что сервер работает и принимает клиента.'
    explanation: |
      Растущая задержка защищает сервер от лавины переподключений, но важно и то, когда её сбрасывать. Если
      сбрасывать в `onopen`, цикл «подключился — сервер сразу закрыл» превращается в непрерывный поток попыток: каждая
      попытка формально успешна. Поэтому задержку сбрасывают, когда соединение проработало какое-то время, а при
      закрытии с кодом «не авторизован» не переподключаются вслепую, а сначала обновляют токен.
  - id: ws-rel-002
    topic: Надёжность
    level: middle
    question: |
      Зачем приложению heartbeat — периодический обмен сообщениями «ты жив?» — если браузер сам отвечает на ping
      сервера?
    options:
      - text: 'Соединение может «умереть» молча, и клиент долго об этом не узнает'
        correct: true
        why: 'При пропаже сети без обрыва TCP событие `close` может не прийти минутами. Отсутствие ответа на heartbeat — быстрый сигнал.'
      - text: 'Без heartbeat браузер сам закрывает сокет после 60 секунд тишины'
        why: 'Браузер сам не закрывает простаивающий сокет.'
      - text: 'Heartbeat ускоряет доставку сообщений, поддерживая канал «прогретым»'
        why: 'Скорость доставки от этого не меняется. Задача heartbeat — обнаружить мёртвое соединение и не дать посредникам закрыть живое.'
      - text: 'Без heartbeat сервер не может первым отправлять сообщения клиенту'
        why: 'Сервер может отправить сообщение в любой момент, двунаправленность от heartbeat не зависит.'
    explanation: |
      TCP не сообщает о пропаже собеседника, пока не попробует что-то отправить. Если у телефона пропала сеть,
      сокет может считаться открытым долго, а сообщения уходить в пустоту. Браузер на ping сервера отвечает сам, но
      не сообщает о нём странице и не даёт отправить ping из JavaScript. Поэтому клиент шлёт своё сообщение-пинг и
      ждёт ответа: нет ответа — соединение мёртвое, пора переподключаться.
  - id: ws-rel-003
    topic: Надёжность
    level: senior
    question: |
      Какую гарантию даёт сам протокол WebSocket?
    options:
      - text: 'Сообщения внутри одного соединения приходят в порядке отправки'
        correct: true
        why: 'WebSocket работает поверх одного TCP-соединения, а TCP сохраняет порядок байтов.'
      - text: 'Сообщение, отправленное через `send()`, будет доставлено'
        why: '`send()` лишь ставит данные в очередь. Если соединение оборвётся, часть отправленного пропадёт без уведомления.'
      - text: 'После переподключения сервер дошлёт пропущенные сообщения'
        why: 'Новое соединение ничего не знает о старом. Досылку пропущенного приходится строить самим.'
      - text: 'Сообщения из разных вкладок одного пользователя придут на сервер в порядке отправки'
        why: 'Порядок есть только внутри одного соединения, а у каждой вкладки оно своё.'
    explanation: |
      У WebSocket есть только порядок внутри соединения и целостность сообщений. Подтверждений доставки,
      досылки и защиты от дублей нет. Если они нужны (чат, платежи, совместное редактирование), их строят
      поверх: у сообщений есть id, сервер подтверждает приём, клиент повторяет неподтверждённое после
      переподключения, а сервер отбрасывает повторы по id. Протоколы вроде MQTT и библиотеки вроде Socket.IO
      (подтверждения, восстановление состояния) берут часть этого на себя.
  - id: ws-rel-004
    topic: Надёжность
    level: middle
    question: |
      Что приложению обычно нужно сделать сразу после переподключения сокета?
    options:
      - text: 'Заново подписаться на нужные каналы и забрать пропущенное за время обрыва'
        correct: true
        why: 'Новое соединение — чистый лист: сервер не помнит подписок старого и не знает, что клиент пропустил.'
      - text: 'Ничего: браузер восстанавливает подписки вместе с соединением'
        why: 'Подписки — понятие приложения, браузер о них ничего не знает.'
      - text: 'Переслать серверу все сообщения, полученные до обрыва'
        why: 'Серверу не нужны его же сообщения. Нужно другое: сообщить, что клиент уже получил, и забрать остальное.'
      - text: 'Перезагрузить страницу, чтобы сбросить состояние'
        why: 'Это теряет состояние интерфейса и раздражает. Достаточно восстановить подписки и догнать данные.'
    explanation: |
      Типичная схема: клиент хранит id или номер последнего полученного события, после переподключения
      отправляет «подпишись на каналы X, Y и пришли всё после события N». Если сервер так не умеет, клиент
      перезапрашивает актуальное состояние по HTTP и дальше слушает изменения. Так же устроены `Last-Event-ID`
      в SSE и восстановление состояния соединения в Socket.IO.
  - id: ws-rel-005
    topic: Надёжность
    level: junior
    question: |
      В браузерном коде соединение оборвалось. Переподключится ли нативный `WebSocket` сам?
    options:
      - text: 'Нет, нужно создать новый объект `WebSocket`'
        correct: true
        why: 'Закрытый объект открыть заново нельзя, а автоматических переподключений в API нет.'
      - text: 'Да, браузер переподключится с той же задержкой, что у `EventSource`'
        why: 'Автопереподключение есть у `EventSource` (SSE), у `WebSocket` его нет.'
      - text: 'Да, если при создании передать флаг `{ reconnect: true }`'
        why: 'Такого параметра у конструктора нет.'
      - text: 'Да, после вызова `ws.open()` на закрытом объекте'
        why: 'Метода `open()` у `WebSocket` нет. Новое соединение — только новым объектом.'
    explanation: |
      Нативный `WebSocket` — одноразовый объект: создал, пользуешься, закрылся. Переподключение — забота
      приложения: в `onclose` запустить таймер, создать новый сокет, перевесить обработчики и восстановить
      подписки. Поэтому в реальных проектах сокет почти всегда заворачивают в свою обёртку или берут
      библиотеку, где это уже сделано.
  - id: ws-rel-006
    topic: Надёжность
    level: senior
    question: |
      Приложение шлёт в сокет позицию курсора на каждое событие `mousemove`. На слабой сети интерфейс со временем
      начинает тормозить и съедать память. Что поможет?
    options:
      - text: 'Смотреть на `bufferedAmount` и пропускать устаревшие позиции'
        correct: true
        why: 'Растущий `bufferedAmount` показывает, что канал не успевает. Для курсора важна только последняя позиция — старые можно выбросить.'
      - text: 'Отправлять позиции через `await ws.send(...)`, чтобы дождаться доставки'
        why: '`send()` ничего не возвращает и не ждёт сети: `await` здесь ничего не изменит.'
      - text: 'Отправлять позиции из Web Worker, чтобы не блокировать основной поток'
        why: 'Тормозит не основной поток, а растущая очередь неотправленного. Из воркера она растёт точно так же.'
      - text: 'Открыть несколько сокетов и раздавать сообщения по очереди'
        why: 'Канал от этого шире не станет, а порядок сообщений между разными сокетами перестанет быть гарантированным.'
    explanation: |
      Это проблема обратного давления (backpressure): клиент производит данные быстрее, чем их пропускает сеть.
      У браузерного `WebSocket` нет встроенного механизма притормозить отправителя — только счётчик
      `bufferedAmount`. Решения: троттлинг (не чаще 20–30 раз в секунду), отправка только последнего состояния и
      пропуск отправки, пока очередь не опустеет.
  - id: ws-rel-007
    topic: Надёжность
    level: middle
    question: |
      Какие события могут закрыть WebSocket-соединение, хотя код приложения ни на клиенте, ни на сервере его не
      закрывал?
    options:
      - text: 'Таймаут простоя на прокси или балансировщике'
        correct: true
        why: 'Посредники закрывают соединения, по которым долго нет данных. У nginx по умолчанию — 60 секунд.'
      - text: 'Смена сети на телефоне, например с Wi-Fi на мобильную'
        correct: true
        why: 'Меняется IP-адрес, и старое TCP-соединение становится недействительным.'
      - text: 'Деплой новой версии сервера'
        correct: true
        why: 'Процесс со старой версией останавливается вместе со всеми своими соединениями.'
      - text: 'Смена `binaryType` у открытого сокета'
        why: 'Это настройка формата входящих данных на клиенте: сервер о ней не узнаёт, соединение она не трогает.'
      - text: 'Отправка пустой строки `ws.send("")`'
        why: 'Пустое сообщение — допустимый кадр нулевой длины, соединение от него не закрывается.'
    explanation: |
      Долгое соединение живёт в мире, где всё время что-то меняется: сети, адреса, версии серверов, настройки
      посредников. Поэтому обрыв для WebSocket — норма, а не авария: переподключение и досылка пропущенного
      входят в обязательный набор любого серьёзного клиента.
  - id: ws-rel-008
    topic: Надёжность
    level: middle
    question: |
      В режиме разработки каждое сообщение чата появляется дважды, а в продакшене — один раз. Почему?
    code: |
      function Chat() {
        useEffect(() => {
          const ws = new WebSocket('wss://chat.example.com');
          ws.onmessage = (e) => addMessage(e.data);
        }, []);
        return <Messages />;
      }
    codeLang: jsx
    options:
      - text: 'StrictMode запустил эффект дважды, и первый сокет никто не закрыл'
        correct: true
        why: 'В разработке StrictMode монтирует, размонтирует и снова монтирует компонент. Без очистки открыты два сокета, и оба получают каждое сообщение.'
      - text: 'StrictMode дважды рендерит компонент, и `addMessage` вызывается дважды'
        why: 'Двойной рендер не вызывает `onmessage`: `addMessage` вызывает обработчик сокета, а не рендер.'
      - text: 'React в StrictMode вызывает обработчики событий дважды'
        why: 'Обработчики событий StrictMode не дублирует — только рендер, инициализаторы состояния и эффекты.'
      - text: 'Сервер в режиме разработки шлёт каждое сообщение дважды'
        why: 'Режим разработки фронтенда не влияет на сервер. Дубль появляется на клиенте.'
    explanation: |
      StrictMode в разработке проверяет, что эффект умеет убирать за собой: после первого запуска он вызывает
      очистку и запускает эффект снова. Без `return () => ws.close()` первый сокет остаётся открытым и тоже
      получает сообщения. В продакшене повтора нет, но та же утечка проявится при каждом размонтировании
      компонента. Ещё лучше держать одно соединение на всё приложение, а не в каждом компоненте.
    links:
      - https://react.dev/learn/synchronizing-with-effects#how-to-handle-the-effect-firing-twice-in-development
  - id: ws-rel-009
    topic: Надёжность
    level: middle
    question: |
      Пользователь свернул вкладку с чатом на телефоне и вернулся через полчаса. `readyState` равен `OPEN`, но
      сообщения не приходят. Что разумно сделать в приложении?
    options:
      - text: 'По `visibilitychange` проверять связь и при надобности переподключаться'
        correct: true
        why: 'Возвращение на вкладку — удобный момент отправить пинг и, не получив ответа, открыть новое соединение и догнать пропущенное.'
      - text: 'Ничего: вернувшись, браузер сам сразу пришлёт `close`, если связь пропала'
        why: 'Браузер узнаёт о потере связи, только когда это заметит TCP, а после заморозки вкладки на это могут уйти минуты.'
      - text: 'Не давать вкладке заснуть таймером `setInterval` раз в секунду'
        why: 'В фоне браузер притормаживает таймеры, а мобильная ОС может заморозить вкладку целиком — таймер этому не помешает.'
      - text: 'Перед каждым `send` проверять `readyState === OPEN`'
        why: 'Здесь `readyState` и так равен `OPEN` — проверка ничего не покажет.'
    explanation: |
      Мобильные браузеры и ОС экономят батарею: фоновые вкладки замораживают, сеть отключают. Сокет может
      пережить это внешне живым: `readyState` равен `OPEN`, но по нему ничего не идёт. Поэтому при возвращении
      пользователя (`visibilitychange` или `pageshow`) приложение проверяет соединение и догоняет пропущенное.
  # ===================== Безопасность =====================
  - id: ws-sec-001
    topic: Безопасность
    level: middle
    question: |
      Пользователь вошёл на `bank.example` в Chrome, сессия хранится в cookie с `SameSite=None; Secure`. Он
      открывает страницу `evil.example`, и та создаёт `new WebSocket('wss://bank.example/socket')`. Что
      произойдёт, если сервер банка ничего специально не проверяет?
    options:
      - text: 'Сокет откроется от имени пользователя, ответы увидит чужая страница'
        correct: true
        why: 'Браузер приложит cookie банка, а политика одного источника и CORS на WebSocket не действуют. Это атака CSWSH.'
      - text: 'Браузер заблокирует соединение политикой одного источника'
        why: 'Политика одного источника и CORS на WebSocket не распространяются: соединиться можно с любым сервером.'
      - text: 'Соединение откроется, но без cookie, то есть анонимно'
        why: 'Cookie с `SameSite=None` уходит и в межсайтовое рукопожатие. С `Lax` или `Strict` её бы не было, но полагаться только на это рискованно.'
      - text: 'Браузер сначала отправит preflight `OPTIONS` и откроет соединение по ответу'
        why: 'Preflight есть у CORS для `fetch`. У WebSocket его нет, рукопожатие уходит сразу.'
    explanation: |
      Атака называется Cross-Site WebSocket Hijacking. Защита — на сервере: проверять заголовок `Origin` в
      рукопожатии и пускать только свои сайты. Дополнительно помогают `SameSite=Lax` или `Strict` у cookie (в
      Chrome `Lax` — значение по умолчанию) и авторизация не по cookie, а токеном, который чужая страница не знает.
    links:
      - https://cheatsheetseries.owasp.org/cheatsheets/WebSocket_Security_Cheat_Sheet.html
  - id: ws-sec-002
    topic: Безопасность
    level: senior
    question: |
      Что верно про проверку заголовка `Origin` на WebSocket-сервере?
    options:
      - text: 'Она защищает пользователей от чужих сайтов в их браузерах'
        correct: true
        why: 'Страница не может подменить `Origin`: браузер ставит его сам. Поэтому злой сайт не откроет сокет под видом своего.'
      - text: 'От скриптов и ботов вне браузера она не защищает'
        correct: true
        why: 'Программа на Node или Python отправит любой `Origin`. От них защищает только авторизация.'
      - text: 'Её достаточно вместо авторизации пользователя'
        why: '`Origin` говорит, с какого сайта пришёл запрос, а не кто пользователь. Авторизация нужна всё равно.'
      - text: 'Браузер сам отклонит соединение, если `Origin` не совпадает с сервером'
        why: 'Браузер никого не проверяет: он только сообщает `Origin`, решать должен сервер.'
    explanation: |
      `Origin` — подпись браузера «этот запрос сделала страница с такого-то сайта». Она полезна против CSWSH, где
      атакуют через браузер пользователя, но ничего не стоит вне браузера. Правильная защита состоит из двух
      частей: белый список `Origin` против чужих страниц и авторизация каждого соединения против всех остальных.

  - id: ws-sec-003
    topic: Безопасность
    level: junior
    question: |
      Почему передавать долгоживущий токен доступа в адресе сокета (`wss://api.example/socket?token=...`) считается
      плохой практикой?
    options:
      - text: 'Адреса запросов часто пишутся в логи серверов и прокси'
        correct: true
        why: 'Токен из URL окажется в логах балансировщика, сервера и систем мониторинга, где его могут прочитать.'
      - text: 'Параметры URL при `wss://` передаются по сети незашифрованными'
        why: 'TLS шифрует весь запрос, включая путь и параметры. Проблема не в сети, а в том, где адрес оседает потом.'
      - text: 'Браузер обрезает параметры в адресе WebSocket'
        why: 'Параметры запроса передаются полностью, так и устроены многие API.'
      - text: 'Сервер не может прочитать параметры из запроса рукопожатия'
        why: 'Рукопожатие — обычный HTTP-запрос, сервер видит его адрес целиком.'
    explanation: |
      В браузере нельзя задать заголовок `Authorization` для WebSocket, поэтому токен соблазнительно положить в
      URL. Безопаснее короткоживущий одноразовый билет: клиент получает его обычным HTTP-запросом с авторизацией
      и тут же использует для подключения. Ещё варианты — cookie с проверкой `Origin` или авторизация первым
      сообщением после открытия.

  - id: ws-sec-004
    topic: Безопасность
    level: middle
    question: |
      Страница открыта по `https://`, CSP не настроен. Что выведется в консоль в Chrome?
    code: |
      try {
        const ws = new WebSocket('ws://api.example.com/socket');
        ws.onerror = () => console.log('error');
        console.log('created');
      } catch (e) {
        console.log(e.name);
      }
    codeLang: js
    options:
      - text: '`SecurityError`'
        correct: true
        why: 'Незашифрованный сокет со страницы по HTTPS браузер запрещает сразу: конструктор синхронно бросает исключение.'
      - text: '`created`, затем `error`'
        why: 'Так было бы, если бы браузер попытался подключиться и получил отказ. Здесь до сети дело не доходит.'
      - text: '`created`'
        why: 'Объект не создаётся вовсе: проверка на смешанное содержимое срабатывает прямо в конструкторе.'
      - text: '`SyntaxError`'
        why: 'Адрес синтаксически правильный, схема `ws:` допустима. Ошибка в другом — в небезопасном соединении с защищённой страницы.'
    explanation: |
      Со страницы по HTTPS нельзя открыть `ws://`: это смешанное содержимое. Chrome сообщает об этом синхронным
      исключением `SecurityError` с текстом «An insecure WebSocket connection may not be initiated from a page
      loaded over HTTPS». Исключение из правила — CSP `upgrade-insecure-requests`: с ним браузер сам повышает `ws:`
      до `wss:`. Ловушка в том, что `onerror` тут не поможет: исключение синхронное, и без `try` оно оборвёт
      выполнение скрипта.
  - id: ws-sec-005
    topic: Безопасность
    level: middle
    question: |
      Сервер чата на Node-библиотеке `ws` принимает сообщения от клиентов. Что нужно предусмотреть?
    options:
      - text: 'Ограничить размер сообщения сильнее, чем по умолчанию'
        correct: true
        why: 'По умолчанию `ws` принимает сообщения до 100 МиБ — несколько таких сообщений от злоумышленника съедят память сервера.'
      - text: 'Проверять формат и права на каждое сообщение'
        correct: true
        why: 'Авторизация при подключении не означает, что любое сообщение можно выполнять. Каждое — недоверенные данные.'
      - text: 'Ограничить частоту сообщений с одного соединения'
        correct: true
        why: 'Без ограничения один клиент может завалить сервер и остальных пользователей сообщениями.'
      - text: 'Доверять `userId` из тела сообщения, раз соединение авторизовано'
        why: 'Кто отправитель, сервер берёт из сессии соединения, установленной при рукопожатии. Поле в сообщении клиент может подставить любое.'
      - text: 'Проверять `Origin` в каждом входящем сообщении'
        why: '`Origin` есть только в запросе рукопожатия, в сообщениях его нет.'
    explanation: |
      Открытое соединение — это канал, по которому может прийти что угодно и в любом количестве. Основной набор
      защиты сервера: лимит размера сообщения (`maxPayload` в `ws`, `maxHttpBufferSize` в Socket.IO — у него
      умолчание 1 МБ), ограничение частоты, проверка схемы и прав на каждую команду, лимит числа соединений с
      одного пользователя или IP.
  - id: ws-sec-006
    topic: Безопасность
    level: middle
    question: |
      Клиент выбирает обработчик по полю пришедшего сообщения. Чем опасен такой код?
    code: |
      const handlers = {
        chat: (payload) => addMessage(payload),
        typing: (payload) => showTyping(payload),
      };
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        handlers[msg.type](msg.payload);
      };
    codeLang: js
    options:
      - text: '`type` вида `"constructor"` вызовет не тот обработчик или уронит код'
        correct: true
        why: 'Поиск по обычному объекту идёт и по прототипу: `"constructor"` вызовет `Object`, `"toString"` — унаследованный метод, а `"__proto__"` уронит обработчик с `TypeError`.'
      - text: '`JSON.parse` выполнит код, если в сообщении придёт функция'
        why: 'JSON не умеет описывать функции: `JSON.parse` возвращает только данные — объекты, массивы, строки, числа.'
      - text: 'Обработчики будут вызываться в случайном порядке'
        why: 'Сообщения обрабатываются по одному в порядке прихода, порядок ключей объекта тут ни при чём.'
      - text: 'Ничем: сообщения приходят от своего сервера, им можно полностью доверять'
        why: 'Сервер часто пересылает то, что прислали другие пользователи, а значит, `type` может прийти любым.'
    explanation: |
      Сообщение из сокета — недоверенные данные, даже если пришло от своего сервера. Выбор обработчика по строке
      из сообщения через обычный объект натыкается на унаследованные свойства прототипа. Надёжнее хранить
      обработчики в `Map` или в объекте без прототипа (`Object.create(null)`), проверять `Object.hasOwn` и
      отбрасывать неизвестные типы. Та же логика на сервере защищает от вызова непредусмотренных команд.
  - id: ws-sec-007
    topic: Безопасность
    level: middle
    question: |
      Сокет авторизовали токеном при подключении. Токен живёт 15 минут, а соединение открыто уже час. Что
      происходит?
    options:
      - text: 'Соединение живёт, пока сервер сам не проверит срок и не закроет'
        correct: true
        why: 'Токен проверялся один раз, при рукопожатии. Дальше по соединению идут только сообщения, и срок токена никто не проверяет, если этого не делает сервер.'
      - text: 'Браузер сам закроет сокет, когда у cookie или токена истечёт срок'
        why: 'Браузер не знает о токене приложения и не следит за сроком cookie у открытых соединений.'
      - text: 'Следующее сообщение от клиента вернёт ошибку `401`'
        why: 'HTTP-статусов у сообщений WebSocket нет: после рукопожатия это уже не HTTP.'
      - text: 'Сервер увидит новый токен в заголовках следующего сообщения'
        why: 'У сообщений WebSocket нет HTTP-заголовков. Новый токен можно передать только своим сообщением или новым подключением.'
    explanation: |
      Авторизация WebSocket — это авторизация рукопожатия. Чтобы истёкший или отозванный доступ не жил часами,
      сервер сам следит за сроком и закрывает соединение своим кодом (например, `4001`), а клиент обновляет токен
      и подключается заново. Другой вариант — протокол приложения позволяет прислать новый токен сообщением, не
      разрывая соединения.
  # ===================== Архитектура и альтернативы =====================
  - id: ws-arch-001
    topic: Архитектура и альтернативы
    level: senior
    question: |
      Сайт отдаёт уведомления через Server-Sent Events по HTTP/1.1. Пользователь открыл его в семи вкладках, и в
      седьмой страница перестала грузиться. Почему?
    options:
      - text: 'Браузер держит до шести соединений с одним сайтом, и все заняты SSE'
        correct: true
        why: 'Каждый `EventSource` занимает соединение надолго. Лимит в шесть соединений на сайт общий для всех вкладок, и седьмой странице не на чем грузить даже обычные запросы.'
      - text: 'Сервер по умолчанию принимает не больше шести подписчиков SSE с одного IP'
        why: 'Такого стандартного ограничения у серверов нет. Ограничение здесь в браузере.'
      - text: 'Браузер разрешает только один `EventSource` на вкладку'
        why: 'Ограничения «один на вкладку» нет: в одной вкладке можно открыть несколько `EventSource`.'
      - text: 'Седьмая вкладка не получила `Last-Event-ID` и ждёт его'
        why: '`Last-Event-ID` нужен только при переподключении, чтобы сервер дослал пропущенное. Загрузку страницы он не блокирует.'
    explanation: |
      В HTTP/1.1 браузер открывает не больше шести одновременных соединений с одним сайтом, и долгие соединения SSE
      их съедают. Решения: HTTP/2 или HTTP/3 (потоки делят одно соединение), одно SSE-соединение на все вкладки
      через `SharedWorker` или `BroadcastChannel`, или WebSocket — на него этот лимит не распространяется.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/EventSource
  - id: ws-arch-002
    topic: Архитектура и альтернативы
    level: senior
    question: |
      Приложение на WebSocket раскатили на три экземпляра сервера за балансировщиком. Пользователь A подключён к
      первому, B — ко второму. Что нужно, чтобы сообщение A дошло до B?
    options:
      - text: 'Общая шина между серверами, например Redis Pub/Sub'
        correct: true
        why: 'Каждый сервер знает только свои соединения. Шина разносит сообщение всем экземплярам, и каждый доставит его своим клиентам.'
      - text: 'Sticky-сессии на балансировщике'
        why: 'Sticky-сессии прикрепляют клиента к одному серверу, но A и B всё равно окажутся на разных.'
      - text: 'Увеличить таймаут простоя на балансировщике'
        why: 'Таймаут спасает соединения от закрытия, но не связывает серверы между собой.'
      - text: 'Ничего: балансировщик сам пересылает сообщения между серверами'
        why: 'Балансировщик только распределяет соединения и о сообщениях приложения ничего не знает.'
    explanation: |
      Соединение WebSocket живёт на одном сервере, поэтому при нескольких экземплярах нужна общая шина
      сообщений: Redis Pub/Sub, NATS, Kafka. Сервер публикует сообщение, все экземпляры получают его и рассылают
      своим клиентам. В Socket.IO для этого есть готовые адаптеры, например на Redis.
  - id: ws-arch-003
    topic: Архитектура и альтернативы
    level: middle
    question: |
      За nginx соединения WebSocket не открываются, хотя обычные запросы работают. Чего, скорее всего, не хватает в
      настройках прокси?
    options:
      - text: '`proxy_http_version 1.1` и проброса `Upgrade` и `Connection`'
        correct: true
        why: '`Upgrade` и `Connection` — заголовки одного звена, прокси не передаёт их дальше без явной настройки, а апгрейд работает только в HTTP/1.1.'
      - text: 'Заголовков CORS для домена, с которого открыт сайт'
        why: 'CORS к WebSocket не относится: дело в том, что прокси обрезает заголовки апгрейда.'
      - text: 'Отдельного порта для WebSocket-трафика'
        why: 'WebSocket работает на тех же портах, что и HTTP. Отдельный порт ничего не изменит.'
      - text: 'Включённого сжатия `gzip` для всех ответов сервера приложения'
        why: 'Сжатие HTTP-ответов к рукопожатию WebSocket отношения не имеет.'
    explanation: |
      Для nginx нужны три строки в `location`: `proxy_http_version 1.1;`, `proxy_set_header Upgrade
      $http_upgrade;` и `proxy_set_header Connection "upgrade";`. Без них сервер приложения получит обычный HTTP-запрос
      без просьбы об апгрейде. Вторая типичная проблема — `proxy_read_timeout` в 60 секунд: тихие соединения
      рвутся, пока не настроишь таймаут или heartbeat.
    links:
      - https://nginx.org/en/docs/http/websocket.html
  - id: ws-arch-004
    topic: Архитектура и альтернативы
    level: junior
    question: |
      Для какой задачи WebSocket подходит лучше, чем обычные HTTP-запросы?
    options:
      - text: 'Онлайн-игра, где позиции игроков шлются 30 раз в секунду'
        correct: true
        why: 'Частые сообщения в обе стороны с минимальной задержкой — ровно то, для чего WebSocket создан.'
      - text: 'Загрузка картинок товаров в каталоге'
        why: 'Картинки — статика, их выгоднее грузить по HTTP: кэш браузера, CDN, ленивая загрузка.'
      - text: 'Отправка формы регистрации'
        why: 'Разовая операция «запрос — ответ». Обычный HTTP-запрос проще и надёжнее.'
      - text: 'Получение списка статей блога при первом открытии страницы'
        why: 'Разовая загрузка данных — классический HTTP-запрос, его можно кэшировать.'
    explanation: |
      WebSocket выигрывает, когда сообщений много, они идут в обе стороны и важна задержка: чаты, игры,
      совместное редактирование, биржевые котировки. Для разовых запросов он хуже HTTP: нет кэширования, нет
      стандартных кодов ответа, нужно самим следить за соединением. Если сервер только шлёт уведомления, часто
      хватает SSE.

  - id: ws-arch-005
    topic: Архитектура и альтернативы
    level: senior
    question: |
      Что предлагает WebTransport (поверх HTTP/3), чего нет у WebSocket?
    options:
      - text: 'Ненадёжные датаграммы и много независимых потоков'
        correct: true
        why: 'Датаграммы можно терять ради скорости, а потери в одном потоке не задерживают остальные.'
      - text: 'Двунаправленный обмен сообщениями между клиентом и сервером'
        why: 'Двунаправленность есть и у WebSocket — это его главная возможность.'
      - text: 'Работу через HTTP-рукопожатие на стандартных портах'
        why: 'Это умеет и WebSocket: его рукопожатие — обычный HTTP-запрос на порту 80 или 443.'
      - text: 'Передачу двоичных данных, а не только текста'
        why: 'Двоичные сообщения есть и у WebSocket.'
    explanation: |
      WebSocket работает поверх TCP: всё доставляется по порядку, и одна потерянная порция задерживает всё
      следующее (head-of-line blocking). Для игр и видео это плохо — старая позиция игрока уже не нужна.
      WebTransport использует QUIC: можно открыть много независимых потоков и отправлять ненадёжные
      датаграммы. Но он сложнее, и для большинства задач WebSocket по-прежнему хватает.
  - id: ws-arch-006
    topic: Архитектура и альтернативы
    level: middle
    question: |
      Чем long polling хуже WebSocket при частых сообщениях?
    options:
      - text: 'Каждое сообщение требует нового HTTP-запроса с заголовками'
        correct: true
        why: 'После каждого ответа клиент отправляет новый запрос. Заголовки часто весят больше самих сообщений, а между запросами копятся задержки.'
      - text: 'Long polling не проходит через прокси и корпоративные фаерволы'
        why: 'Наоборот, это обычные HTTP-запросы, которые проходят почти везде.'
      - text: 'При long polling сервер не может первым отправить данные клиенту'
        why: 'Может: он держит запрос открытым и отвечает, как только появятся данные. В этом и смысл long polling.'
      - text: 'Long polling нельзя совмещать с авторизацией по cookie'
        why: 'Это обычные HTTP-запросы, cookie уходят с ними как всегда.'
    explanation: |
      Long polling — клиент шлёт запрос, сервер держит его, пока не появятся данные, отвечает, и клиент сразу шлёт
      следующий. Это работает везде, но каждое сообщение стоит целого HTTP-запроса. При одном сообщении в минуту
      разницы почти нет, при десятках в секунду long polling тратит больше трафика и даёт больше задержки.
      Сегодня он в основном служит запасным транспортом, когда WebSocket недоступен.
  # ===================== Библиотеки =====================
  - id: ws-lib-001
    topic: Библиотеки
    level: junior
    question: |
      Бэкенд поднял обычный WebSocket-сервер, а фронтенд подключается к нему через `socket.io-client`. Что будет?
    options:
      - text: 'Соединение не установится: Socket.IO использует свой протокол'
        correct: true
        why: 'Клиент Socket.IO ждёт от сервера пакетов своего протокола (Engine.IO). Чистый WebSocket-сервер их не отправляет.'
      - text: 'Всё заработает, Socket.IO — просто удобная обёртка над WebSocket'
        why: 'Это частое заблуждение. Socket.IO — свой протокол поверх нескольких транспортов, совместимый только с сервером Socket.IO.'
      - text: 'Заработает, но без событий и комнат, только `send` и `message`'
        why: 'Урезанного режима совместимости нет. Без сервера Socket.IO соединение не установится вовсе.'
      - text: 'Заработает, если передать `transports: ["websocket"]`'
        why: 'Транспорт будет WebSocket, но поверх него всё равно пойдёт протокол Socket.IO — сервер его не поймёт.'
    explanation: |
      Socket.IO — это не WebSocket, а свой протокол: пакеты Engine.IO (открытие, ping, сообщения), события,
      подтверждения, пространства имён. Работает он поверх нескольких транспортов. Совместимость работает
      только в паре: клиент Socket.IO ↔ сервер Socket.IO. Наоборот так же: нативный `WebSocket`, подключившись к
      серверу Socket.IO, получит служебный пакет `0{"sid":...}`, а на обычный текст сервер закроет соединение.
    links:
      - https://socket.io/docs/v4/#what-socketio-is-not
  - id: ws-lib-002
    topic: Библиотеки
    level: middle
    question: |
      Каким транспортом по умолчанию начинает соединение клиент Socket.IO v4?
    options:
      - text: 'HTTP long polling, затем переходит на WebSocket'
        correct: true
        why: 'Так соединение появляется даже там, где WebSocket режут прокси или фаерволы, а потом незаметно ускоряется.'
      - text: 'Сразу WebSocket, а long polling только при неудаче'
        why: 'Начать с WebSocket можно настройкой `transports: ["websocket", "polling"]`, но по умолчанию порядок обратный.'
      - text: 'Только WebSocket, других транспортов в v4 нет'
        why: 'Long polling в v4 остался и используется первым по умолчанию.'
      - text: 'Сразу WebTransport, если браузер его поддерживает'
        why: 'WebTransport нужно явно включить на сервере (по умолчанию там только polling и WebSocket) и поднять HTTP/3. Без этого клиент о нём не узнает.'
    explanation: |
      Клиент открывает соединение запросами `GET /socket.io/?EIO=4&transport=polling`, а затем, если получилось,
      переходит на WebSocket. Так соединение появляется быстро и там, где WebSocket режут. Если WebSocket в сети
      пользователей точно доступен, ставят `transports: ["websocket"]`: подключение быстрее, но без запасного пути.
    links:
      - https://socket.io/docs/v4/client-options/#transports
  - id: ws-lib-003
    topic: Библиотеки
    level: middle
    question: |
      Сервер вызвал `socket.disconnect()` для клиента Socket.IO. Что сделает клиент?
    options:
      - text: 'Получит `disconnect` и сам переподключаться не станет'
        correct: true
        why: 'Причина будет `"io server disconnect"`: отключение по решению сервера клиент считает намеренным. Подключиться снова — только вызовом `socket.connect()`.'
      - text: 'Переподключится через 1 секунду, как при любом обрыве сети'
        why: 'Автопереподключение срабатывает при обрывах (`"transport close"`, `"ping timeout"`), но не когда сервер отключил клиента сам.'
      - text: 'Переподключится сразу, без какой-либо задержки'
        why: 'Мгновенного повтора нет ни при каких причинах, а при этой причине повтора нет вовсе.'
      - text: 'Получит `connect_error` и начнёт попытки с растущей задержкой'
        why: '`connect_error` — неудачная попытка подключиться. Здесь же соединение было и было закрыто сервером.'
    explanation: |
      У события `disconnect` в Socket.IO есть причина. При `"io server disconnect"` (сервер выгнал) и
      `"io client disconnect"` (клиент сам вызвал `disconnect()`) автопереподключения нет. При сетевых причинах
      клиент переподключается сам: первая попытка примерно через секунду (±50 %), дальше задержка растёт до 5
      секунд, попыток бесконечно. Частая ошибка — сервер отключает неавторизованного клиента, а фронтенд ждёт, что
      тот переподключится после обновления токена.
    links:
      - https://socket.io/docs/v4/client-socket-instance/#disconnect
  - id: ws-lib-004
    topic: Библиотеки
    level: middle
    question: |
      Соединение Socket.IO оборвалось на 10 секунд, и за это время код трижды вызвал `socket.emit('cursor', pos)`.
      Что будет по умолчанию?
    options:
      - text: 'События накопятся в буфере и уйдут после переподключения'
        correct: true
        why: 'Клиент складывает события, отправленные без соединения, в буфер и отправляет их после восстановления.'
      - text: '`emit` бросит исключение, пока нет соединения'
        why: 'В отличие от нативного `send()` до открытия, `emit` не бросает: события буферизуются.'
      - text: 'События молча потеряются'
        why: 'Так ведут себя «летучие» события `socket.volatile.emit`, а обычный `emit` буферизуется.'
      - text: 'Отправится только последнее событие, остальные заменятся'
        why: 'Буфер не схлопывает события: после переподключения уйдут все три, по порядку.'
    explanation: |
      Буферизация удобна для важных действий, но для частых и быстро устаревающих данных (курсор, позиция в игре)
      она вредна: после переподключения на сервер вывалится пачка старых событий. Для таких данных проверяют
      `socket.connected` перед отправкой или используют `socket.volatile.emit`. Важные сообщения подтверждают
      через ack.
    links:
      - https://socket.io/docs/v4/client-offline-behavior/

  - id: ws-lib-005
    topic: Библиотеки
    level: middle
    question: |
      Как в Socket.IO v4 отправить событие и дождаться ответа сервера не дольше 5 секунд?
    options:
      - text: '`await socket.timeout(5000).emitWithAck("save", data)`'
        correct: true
        why: '`timeout()` задаёт срок, а `emitWithAck` возвращает промис: он выполнится ответом сервера или отклонится по таймауту.'
      - text: '`await socket.emit("save", data, { timeout: 5000 })`'
        why: '`emit` не возвращает промис, а объект станет просто ещё одним аргументом события.'
      - text: '`await socket.timeout(5000).emit("save", data)`'
        why: 'Без колбэка ждать нечего: `emit` возвращает сам сокет, а не промис. Промис даёт `emitWithAck`.'
      - text: '`await socket.request("save", data, 5000)`'
        why: 'Метода `request` у сокета Socket.IO нет.'
    explanation: |
      Подтверждения (acknowledgements) — ответ на конкретное событие. Есть два вида записи: колбэк последним
      аргументом `emit` (с `timeout()` он получает ошибку первым аргументом) и `emitWithAck`, возвращающий промис.
      На сервере обработчик получает функцию `ack` последним аргументом и вызывает её с ответом. Без
      `timeout()` клиент ждал бы ответа вечно, если сервер его не пришлёт.
    links:
      - https://socket.io/docs/v4/emitting-events/#acknowledgements
  - id: ws-lib-006
    topic: Библиотеки
    level: middle
    question: |
      Какие утверждения о комнатах и `socket.id` в Socket.IO верны при настройках по умолчанию?
    options:
      - text: 'Добавить сокет в комнату можно только на сервере'
        correct: true
        why: '`socket.join()` есть только у серверного сокета. Клиент может лишь попросить сервер своим событием.'
      - text: 'Каждый сокет сразу состоит в комнате с именем своего `id`'
        correct: true
        why: 'Поэтому отправить что-то одному клиенту можно через `io.to(socketId).emit(...)`.'
      - text: '`socket.id` меняется после переподключения'
        correct: true
        why: 'Каждое подключение получает новый `id`. Хранить его как идентификатор пользователя нельзя.'
      - text: 'Чтобы получать события комнаты, клиент подписывается на её имя: `socket.on("room-42", …)`'
        why: 'Имя комнаты — не имя события. Клиент получает обычные события, которые сервер разослал через `io.to("room-42").emit(...)`.'
      - text: 'Комнаты сохраняются за клиентом после переподключения'
        why: 'Новое подключение — новый серверный сокет без комнат. Сервер должен снова добавить клиента в нужные комнаты.'
    explanation: |
      Комната в Socket.IO — серверная группа сокетов для рассылки: `io.to("room-42").emit(...)`. Клиент о
      комнатах не знает. Отсюда правило: после каждого подключения (событие `connection` на сервере) заново
      определять, кто это, по токену или сессии, а не по `socket.id`, и заново добавлять в нужные комнаты.
      Восстановление состояния соединения (connection state recovery) в Socket.IO 4.6+ частично это смягчает.
    links:
      - https://socket.io/docs/v4/rooms/
  - id: ws-lib-007
    topic: Библиотеки
    level: senior
    question: |
      Socket.IO раскатили на три экземпляра за балансировщиком с настройками по умолчанию. Клиенты то и дело не
      могут подключиться, а сервер отвечает `400` с сообщением «Session ID unknown». В чём причина?
    options:
      - text: 'Запросы long polling одного клиента попадают на разные экземпляры'
        correct: true
        why: 'Сессия живёт на том экземпляре, где её открыли. Следующий запрос polling попал на другой, и тот такой сессии не знает. Лечится sticky-сессиями или отказом от polling.'
      - text: 'Не подключён Redis-адаптер для обмена событиями между экземплярами'
        why: 'Без адаптера не доходят рассылки между экземплярами, но подключение клиента при этом работает.'
      - text: 'Таймаут простоя на балансировщике меньше `pingInterval` сервера'
        why: 'Тогда через какое-то время рвались бы уже установленные соединения, а не сами подключения с ответом `400`.'
      - text: 'Клиент и сервер Socket.IO разных мажорных версий'
        why: 'Несовместимость версий даёт другую ошибку — «Unsupported protocol version», — и сразу у всех клиентов.'
    explanation: |
      По умолчанию клиент Socket.IO сначала работает через long polling — серию HTTP-запросов с одним id сессии.
      Если балансировщик раскидывает их по разным экземплярам, запросы, попавшие не туда, получают `400 Session ID
      unknown`. Решения: sticky-сессии на балансировщике (по cookie или IP) или `transports: ["websocket"]` на
      клиенте — одно WebSocket-соединение и так живёт на одном экземпляре.
    links:
      - https://socket.io/docs/v4/using-multiple-nodes/
  - id: ws-lib-008
    topic: Библиотеки
    level: middle
    question: |
      Какие утверждения о Node-библиотеке `ws` верны?
    options:
      - text: 'В браузере не работает, там нужен нативный `WebSocket`'
        correct: true
        why: 'В сборке для браузера `ws` прямо бросает ошибку с советом использовать встроенный `WebSocket`.'
      - text: 'Мёртвые соединения сама не обнаруживает, нужен свой ping'
        correct: true
        why: 'В документации есть готовый рецепт: периодически слать ping и закрывать через `terminate()` тех, кто не ответил pong.'
      - text: 'Она сама переподключает клиентов после обрыва связи'
        why: 'Переподключений в `ws` нет ни на сервере, ни в клиенте: это низкоуровневая реализация протокола.'
      - text: 'Умеет рассылать всем клиентам одним вызовом, как комнаты в Socket.IO'
        why: 'Метода рассылки в `ws` нет: всех клиентов обходят сами через `wss.clients`.'
    explanation: |
      `ws` — самая популярная реализация WebSocket для Node: сервер и клиент без лишних абстракций, без комнат,
      подтверждений и переподключений. Браузеры на ping сервера отвечают pong автоматически, поэтому серверный
      heartbeat работает без кода на фронтенде. Кстати, в Node 22 есть и встроенный клиентский `WebSocket`, а
      сервер по-прежнему берут из `ws`.
    links:
      - https://github.com/websockets/ws#how-to-detect-and-close-broken-connections
  - id: ws-lib-009
    topic: Библиотеки
    level: senior
    question: |
      Какой подпротокол WebSocket использует современная библиотека GraphQL-подписок `graphql-ws`?
    options:
      - text: '`graphql-transport-ws`'
        correct: true
        why: 'Это протокол «GraphQL over WebSocket», который реализует `graphql-ws`.'
      - text: '`graphql-ws`'
        why: 'Ловушка: это имя протокола старой заброшенной библиотеки `subscriptions-transport-ws`, а не одноимённой новой.'
      - text: '`graphql-subscriptions`'
        why: 'Так называется другой, ещё более старый вариант протокола той же устаревшей библиотеки.'
      - text: '`apollo-ws`'
        why: 'Такого подпротокола нет. Для подписок Apollo Client рекомендует `GraphQLWsLink` поверх `graphql-ws`.'
    explanation: |
      Путаница историческая. Старая библиотека `subscriptions-transport-ws` говорит по протоколу с именем
      `graphql-ws`. Новая библиотека называется `graphql-ws`, а её протокол — `graphql-transport-ws`. Протоколы
      несовместимы, поэтому подписки «не работают», если клиент и сервер выбрали разные библиотеки. Старый клиент
      с новым сервером не договорится о подпротоколе, и браузер провалит рукопожатие. Новый клиент со старым сервером
      подключится, но старая библиотека увидит чужой подпротокол и закроет соединение кодом `1002`.
    links:
      - https://github.com/enisdenjo/graphql-ws/blob/master/PROTOCOL.md
  - id: ws-lib-010
    topic: Библиотеки
    level: senior
    question: |
      Когда клиент `graphql-ws` с настройками по умолчанию открывает и закрывает соединение?
    options:
      - text: 'Открывает при первой подписке, закрывает без подписок'
        correct: true
        why: 'По умолчанию клиент «ленивый» (`lazy: true`): без активных подписок соединение не держится.'
      - text: 'Открывает при создании клиента и держит, пока страница открыта'
        why: 'Так он работает только при `lazy: false`. По умолчанию соединение появляется лишь с первой подпиской.'
      - text: 'Открывает отдельное соединение на каждую подписку'
        why: 'Все подписки клиента мультиплексируются в одно соединение, у каждой свой `id` в сообщениях.'
      - text: 'Открывает на время каждого запроса и закрывает после ответа'
        why: 'Для подписок это бессмысленно: события приходят в течение всего времени подписки.'
    explanation: |
      `createClient` из `graphql-ws` по умолчанию ленивый: соединение и сообщение `connection_init` появляются
      при первой подписке, а после последней отписки соединение закрывается (`lazyCloseTimeout` по умолчанию 0).
      Это экономит ресурсы, но при частом «подписался — отписался» соединение будет постоянно переоткрываться.
      Тогда помогают `lazy: false` или ненулевой `lazyCloseTimeout`.
    links:
      - https://github.com/enisdenjo/graphql-ws

  - id: ws-lib-011
    topic: Библиотеки
    level: middle
    question: |
      Какие утверждения о `webSocket()` из RxJS верны?
    code: |
      import { webSocket } from 'rxjs/webSocket';

      const socket$ = webSocket('wss://api.example.com/feed');
      socket$.next({ type: 'hello' });
      socket$.subscribe((msg) => console.log('A', msg));
      socket$.subscribe((msg) => console.log('B', msg));
    codeLang: js
    options:
      - text: 'При обрыве подписчики получат `error`, сам Subject не переподключится'
        correct: true
        why: 'Нечистое закрытие RxJS превращает в `error`, а чистое — в `complete`. Переподключение добавляют операторами `retry` или `repeat`.'
      - text: 'Обе подписки используют одно соединение'
        correct: true
        why: 'Subject один, и соединение у него одно. A и B получат одни и те же сообщения.'
      - text: '`{ type: "hello" }` не потеряется и уйдёт после открытия'
        correct: true
        why: 'Сообщения, переданные в `next()` до открытия, Subject копит и отправляет, как только сокет откроется.'
      - text: 'Объект отправится как строка `"[object Object]"`'
        why: 'По умолчанию сообщения сериализуются через `JSON.stringify`, а входящие разбираются через `JSON.parse`.'
      - text: 'Соединение останется открытым после того, как отпишутся оба'
        why: 'Когда отписывается последний подписчик, Subject закрывает сокет.'
    explanation: |
      `WebSocketSubject` из RxJS превращает сокет в Observable/Observer: входящие сообщения — поток, отправка —
      `next()`. Он ленивый, общий для всех подписчиков, буферизует ранние сообщения и по умолчанию работает с
      JSON. Через `multiplex()` поверх одного сокета делают независимые «каналы» с сообщениями
      подписки и отписки. Переподключения нет — его делают операторами `retry` или `repeat`.
    links:
      - https://rxjs.dev/api/webSocket/webSocket
  - id: ws-lib-012
    topic: Библиотеки
    level: senior
    question: |
      Клиент SignalR создан через `new HubConnectionBuilder().withUrl('/hub').withAutomaticReconnect().build()`.
      Какие утверждения о переподключении верны?
    options:
      - text: 'Первая попытка — сразу после обрыва'
        correct: true
        why: 'Первая задержка в политике по умолчанию — 0 мс, дальше 2, 10 и 30 секунд.'
      - text: 'После четырёх неудачных попыток клиент перестанет пытаться'
        correct: true
        why: 'Задержек по умолчанию четыре. После них соединение переходит в состояние Disconnected и срабатывает `onclose`.'
      - text: 'Во время попыток срабатывает `onreconnecting`, после успеха — `onreconnected`'
        correct: true
        why: 'Эти колбэки позволяют показать пользователю «переподключаемся» и восстановить состояние после успеха.'
      - text: 'Попытки идут бесконечно, задержка растёт до 30 секунд'
        why: 'Бесконечных попыток по умолчанию нет: после четвёртой клиент сдаётся. Бесконечность настраивается своей политикой.'
      - text: 'Без `withAutomaticReconnect()` клиент тоже переподключается, только реже'
        why: 'Без этого вызова автоматического переподключения нет вовсе: после обрыва сразу срабатывает `onclose`.'
    explanation: |
      В SignalR автопереподключение включается явно через `withAutomaticReconnect()`. Задержки можно передать
      массивом или своей политикой. При подключении клиент сначала делает запрос `negotiate` и выбирает транспорт:
      WebSocket, затем Server-Sent Events, затем long polling, если предыдущий недоступен.
    links:
      - https://learn.microsoft.com/en-us/aspnet/core/signalr/javascript-client
