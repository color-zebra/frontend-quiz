# Свой набор: WebSocket — протокол, API браузера, надёжность, безопасность, архитектура, библиотеки.
# Формат — как у любого стороннего набора (см. examples/README.md). В сборку приложения не входит.
title: WebSocket
questions:
  # ===================== Протокол =====================
  - id: ws-proto-001
    topic: Протокол
    level: junior
    question: |
      Каким кодом сервер отвечает на рукопожатие по HTTP/1.1, если согласен перейти на WebSocket?
    options:
      - text: '`101`'
        correct: true
        why: '`101 Switching Protocols` подтверждает смену протокола: дальше по тому же TCP-соединению идут кадры WebSocket, а не HTTP.'
      - text: '`200`'
        why: 'Обычный успешный ответ. В HTTP/1.1 после него соединение осталось бы HTTP, а клиент посчитал бы рукопожатие неудачным.'
      - text: '`426`'
        why: '`426 Upgrade Required` — отказ: сервер требует другой протокол или версию. По RFC 6455 так отвечают, например, на неподдерживаемую `Sec-WebSocket-Version`.'
      - text: '`204`'
        why: '`204 No Content` — успешный ответ без тела. К смене протокола он отношения не имеет.'
    explanation: |
      Соединение WebSocket по HTTP/1.1 начинается как обычный запрос `GET` с заголовками `Upgrade: websocket`,
      `Connection: Upgrade`, `Sec-WebSocket-Key` и `Sec-WebSocket-Version: 13`. Если сервер согласен, он отвечает
      `101 Switching Protocols`, и с этого момента по тому же TCP-соединению обе стороны обмениваются кадрами
      WebSocket. Любой другой код браузер считает провалом рукопожатия. Поверх HTTP/2 рукопожатие устроено иначе.
    links:
      - https://datatracker.ietf.org/doc/html/rfc6455#section-4
  - id: ws-proto-002
    topic: Протокол
    level: middle
    question: |
      Зачем в рукопожатии сервер возвращает заголовок `Sec-WebSocket-Accept`?
    options:
      - text: 'Доказать, что сервер понял именно рукопожатие WebSocket'
        correct: true
        why: 'Значение вычисляется из `Sec-WebSocket-Key` клиента по правилу из RFC 6455. Обычный HTTP-сервер или кэш так не ответит.'
      - text: 'Передать клиенту ключ, которым дальше шифруются все сообщения'
        why: 'WebSocket сам ничего не шифрует, для этого есть TLS в `wss://`. Значение заголовка известно любому, кто видел ключ клиента.'
      - text: 'Подтвердить, что пользователь прошёл авторизацию на сервере'
        why: 'Заголовок вычисляется одинаково для любого клиента и ничего не знает о пользователе. Авторизацию нужно делать отдельно.'
      - text: 'Сообщить клиенту, какой из подпротоколов выбрал сервер'
        why: 'Для подпротокола есть отдельный заголовок `Sec-WebSocket-Protocol`.'
    explanation: |
      Клиент присылает случайный `Sec-WebSocket-Key`. Сервер приклеивает к нему фиксированную строку
      `258EAFA5-E914-47DA-95CA-C5AB0DC85B11`, считает SHA-1 и отдаёт результат в base64. Клиент проверяет значение
      и так убеждается, что на той стороне сервер WebSocket, а не прокси или кэш, случайно ответивший `101`.
      Это защита от недоразумений, а не криптография: ни шифрования, ни проверки личности здесь нет.
    links:
      - https://datatracker.ietf.org/doc/html/rfc6455#section-1.3

  - id: ws-proto-003
    topic: Протокол
    level: middle
    question: |
      Какие утверждения о маскировании кадров WebSocket верны?
    options:
      - text: 'Клиент обязан маскировать каждый кадр, который отправляет серверу'
        correct: true
        why: 'Это требование RFC 6455. Сервер, получивший немаскированный кадр от клиента, закрывает соединение с ошибкой протокола.'
      - text: 'Кадры от сервера к клиенту не маскируются'
        correct: true
        why: 'Маска нужна только в направлении от клиента. В обратную сторону то же правило: клиент, получив маскированный кадр, закрывает соединение.'
      - text: 'Маскирование защищает сообщения от чтения посредниками'
        why: 'Ключ маски передаётся в том же кадре, снять маску может кто угодно. От чтения защищает только TLS (`wss://`).'
      - text: 'Маску выбирает сервер при рукопожатии и сообщает её клиенту'
        why: 'Клиент генерирует новый случайный ключ маски для каждого кадра и кладёт его в заголовок кадра.'
      - text: 'В браузере маскирование нужно включить отдельной настройкой'
        why: 'Браузер маскирует кадры сам, управлять этим из JavaScript нельзя.'
    explanation: |
      Маскирование — это XOR полезной нагрузки со случайным 4-байтовым ключом, который лежит тут же, в заголовке
      кадра. Смысл не в секретности, а в защите посредников: злоумышленник со страницы не может подобрать байты,
      которые старый прокси или кэш примет за HTTP-запрос и закэширует (атака отравления кэша). Поэтому маскировать
      обязан только клиент — именно его код может оказаться враждебным.
    links:
      - https://datatracker.ietf.org/doc/html/rfc6455#section-5.3
  - id: ws-proto-004
    topic: Протокол
    level: senior
    question: |
      Какие утверждения об управляющих кадрах WebSocket (close, ping, pong) верны?
    options:
      - text: 'Их полезная нагрузка не больше 125 байт'
        correct: true
        why: 'Ограничение из RFC 6455: управляющий кадр должен помещаться в короткую форму длины.'
      - text: 'Их нельзя разбивать на фрагменты'
        correct: true
        why: 'Фрагментироваться могут только сообщения с данными. Управляющий кадр всегда один целый кадр.'
      - text: 'Их можно вставлять между фрагментами большого сообщения'
        correct: true
        why: 'Так ping или close не ждут, пока дойдёт огромное сообщение: управляющий кадр проходит посреди фрагментов.'
      - text: 'В браузере их можно отправить методами `ws.ping()` и `ws.pong()`'
        why: 'В браузерном API таких методов нет. На ping браузер отвечает pong сам, а отправить ping из JavaScript нельзя.'
      - text: 'Pong допустимо отправлять только в ответ на ping'
        why: 'RFC разрешает и самостоятельный pong — как одностороннее «я жив», ответ на него не ожидается.'
    explanation: |
      Кадры бывают с данными (текст, двоичные, продолжение фрагмента) и управляющие (close, ping, pong).
      Управляющие короткие, нефрагментируемые и могут приходить посреди фрагментированного сообщения — так
      проверка «жив ли собеседник» и закрытие не застревают за большой передачей. В браузере всем этим управляет
      сам браузер; из JavaScript доступны только сообщения и закрытие соединения.
    links:
      - https://datatracker.ietf.org/doc/html/rfc6455#section-5.5

  - id: ws-proto-005
    topic: Протокол
    level: middle
    question: |
      Сервер отправил одно сообщение тремя фрагментами. Сколько раз сработает `onmessage` в браузере?
    options:
      - text: '1'
        correct: true
        why: 'Браузер собирает фрагменты и отдаёт в `onmessage` уже целое сообщение.'
      - text: '3'
        why: 'Фрагменты — деталь протокола. Браузерный API работает с сообщениями, а не с кадрами.'
      - text: '`1`, но `event.data` будет массивом из трёх частей'
        why: '`event.data` бывает строкой, `Blob` или `ArrayBuffer`. Массива частей браузер не отдаёт: сообщение собирается целиком.'
      - text: '3, если сообщение двоичное'
        why: 'Тип данных на сборку не влияет: двоичное сообщение браузер тоже собирает целиком.'
    explanation: |
      В протоколе есть кадры и сообщения. Большое сообщение отправитель может разбить на фрагменты: первый кадр
      с типом текст или двоичные данные, следующие — с типом «продолжение», у последнего выставлен бит FIN.
      Браузер прячет это от кода: `onmessage` получает целое сообщение. Обратная сторона — потокового чтения
      большого сообщения по частям в стандартном `WebSocket` нет.
  - id: ws-proto-006
    topic: Протокол
    level: senior
    question: |
      Что верно про код `1006` в событии `close`?
    options:
      - text: 'Его никогда не передают по сети, браузер ставит его сам'
        correct: true
        why: 'RFC 6455 запрещает отправлять `1006` в кадре close: он только обозначает для приложения, что закрытия по протоколу не было.'
      - text: 'Так сервер сообщает, что перегружен и просит переподключиться позже'
        why: 'Для перегрузки есть `1013 Try Again Later`. `1006` вообще не приходит от сервера.'
      - text: 'Это код, который передают при обычном завершении работы'
        why: 'Нормальное закрытие — `1000`. `1006` означает как раз ненормальное, без обмена кадрами close.'
      - text: 'Его ставит браузер, когда пользователь уходит со страницы'
        why: 'При уходе со страницы браузер закрывает соединение по протоколу с кодом `1001 Going Away`.'
    explanation: |
      Корректное закрытие — обмен кадрами close с кодом и причиной. Если соединение исчезло без этого (сеть
      пропала, процесс сервера убит, прокси оборвал TCP), браузер сообщает `1006` и `wasClean: false`. Ещё два
      «служебных» кода тоже не передаются по сети: `1005` — кадр close пришёл без кода, `1015` — не удался
      TLS. Для приложения `1006` обычно сигнал переподключаться.
    links:
      - https://datatracker.ietf.org/doc/html/rfc6455#section-7.4.1
  - id: ws-proto-007
    topic: Протокол
    level: middle
    question: |
      Страница открыта по адресу `https://example.com/app/`. К какому адресу подключится сокет в современном
      браузере?
    code: |
      const ws = new WebSocket('/socket');
    codeLang: js
    options:
      - text: '`wss://example.com/socket`'
        correct: true
        why: 'Относительный адрес разрешается от адреса страницы, а схема `https` превращается в `wss`.'
      - text: '`ws://example.com/socket`'
        why: 'Для страницы по HTTPS схема берётся защищённая: `https` превращается в `wss`, а не в `ws`.'
      - text: '`wss://example.com/app/socket`'
        why: 'Адрес начинается с `/`, значит, он от корня сайта. Путь `/app/` добавился бы для адреса без косой черты: `socket`.'
      - text: 'Конструктор бросит `SyntaxError`'
        why: 'Так было в старых браузерах. Относительные адреса и схемы `http(s)` стандарт разрешил недавно, с 2024 года их поддерживают Chrome, Firefox и Safari.'
    explanation: |
      Современный стандарт WebSocket разрешает передавать в конструктор относительные адреса и адреса со схемами
      `http:` и `https:`: браузер разрешит их относительно страницы и заменит `http` на `ws`, а `https` на `wss`.
      Так проще писать код, который одинаково работает локально и на продакшене. В старых браузерах такой адрес
      вызывал `SyntaxError`, поэтому в старом коде адрес часто собирают вручную из `location.host`.
  - id: ws-proto-008
    topic: Протокол
    level: senior
    question: |
      Как WebSocket работает поверх HTTP/2?
    options:
      - text: 'Через расширенный `CONNECT`: сокет — поток в общем соединении'
        correct: true
        why: 'Так описано в RFC 8441: клиент отправляет `CONNECT` с псевдозаголовком `:protocol: websocket`, и в этом потоке идут кадры WebSocket.'
      - text: 'Через заголовок `Upgrade`, как в HTTP/1.1, только без ответа `101`'
        why: 'В HTTP/2 механизма `Upgrade` нет вовсе. Нужен был отдельный способ, им и стал расширенный `CONNECT`.'
      - text: 'Никак: при HTTP/2 браузер открывает для сокета отдельное соединение HTTP/1.1'
        why: 'Так было до RFC 8441 и до сих пор бывает, если сервер не поддерживает расширение. Но способ поверх HTTP/2 есть.'
      - text: 'Через Server Push: сервер сам открывает новый поток к клиенту'
        why: 'Push передавал ресурсы от сервера и к сокетам отношения не имел. К тому же браузеры его отключили.'
    explanation: |
      В HTTP/1.1 каждый WebSocket занимает своё TCP-соединение. RFC 8441 позволяет запустить WebSocket внутри
      HTTP/2: клиент отправляет `CONNECT` с `:protocol: websocket`, сервер отвечает `200`, и поток превращается в
      двунаправленный канал. Сокет делит соединение с обычными запросами страницы. Для HTTP/3 то же самое
      описывает RFC 9220. Если сервер такое не поддерживает, браузер откроет отдельное соединение HTTP/1.1.
    links:
      - https://datatracker.ietf.org/doc/html/rfc8441


  - id: ws-proto-009
    topic: Протокол
    level: senior
    question: |
      Что верно про сжатие сообщений `permessage-deflate`?
    options:
      - text: 'О нём договариваются в рукопожатии заголовком `Sec-WebSocket-Extensions`'
        correct: true
        why: 'Клиент предлагает расширение, сервер подтверждает его в ответе или не упоминает — тогда сообщения идут без сжатия.'
      - text: 'Chrome предлагает его сам, управлять этим из JavaScript нельзя'
        correct: true
        why: 'Chrome отправляет `Sec-WebSocket-Extensions: permessage-deflate; client_max_window_bits`, и в API нет настройки, чтобы это выключить.'
      - text: 'На сервере в библиотеке `ws` сжатие включено по умолчанию для всех'
        why: 'В `ws` на сервере сжатие по умолчанию выключено (`perMessageDeflate: false`), в отличие от клиента той же библиотеки.'
      - text: 'В `onmessage` приходят сжатые байты, их нужно распаковать'
        why: 'Распаковывает браузер: в `onmessage` приходит уже исходное сообщение.'
    explanation: |
      `permessage-deflate` — расширение протокола: каждое сообщение сжимается алгоритмом deflate. Для текста
      вроде JSON это заметно экономит трафик, но на сервере с тысячами соединений контексты сжатия съедают
      память, а само сжатие — процессор. Поэтому серверные библиотеки включают его осознанно, часто с порогом:
      маленькие сообщения не сжимают.
    links:
      - https://datatracker.ietf.org/doc/html/rfc7692
  # ===================== API браузера =====================
  - id: ws-api-001
    topic: API браузера
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      const ws = new WebSocket('wss://example.com/socket');
      const states = [ws.readyState];
      ws.onopen = () => {
        states.push(ws.readyState);
        ws.close();
        states.push(ws.readyState);
      };
      ws.onclose = () => {
        states.push(ws.readyState);
        console.log(states.join(' '));
      };
    codeLang: js
    options:
      - text: '`0 1 2 3`'
        correct: true
        why: 'CONNECTING сразу после конструктора, OPEN в `onopen`, CLOSING сразу после `close()`, CLOSED в `onclose`.'
      - text: '`0 1 3 3`'
        why: '`close()` не закрывает мгновенно: сначала идёт обмен кадрами close, а пока он идёт, состояние — CLOSING (2).'
      - text: '`1 1 2 3`'
        why: 'Сразу после конструктора соединение ещё не открыто: рукопожатие асинхронное, состояние CONNECTING (0).'
      - text: '`0 1 2 2`'
        why: 'К моменту события `close` закрытие завершено, состояние уже CLOSED (3).'
    explanation: |
      `readyState` проходит четыре состояния: `0` CONNECTING, `1` OPEN, `2` CLOSING, `3` CLOSED (есть и константы
      `WebSocket.OPEN` и т. д.). Конструктор не ждёт сети: соединение устанавливается в фоне, и узнать об успехе
      можно только из `onopen`. Закрытие тоже асинхронное: `close()` переводит сокет в CLOSING, а CLOSED
      наступает, когда стороны обменялись кадрами close или соединение оборвалось.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/readyState
  - id: ws-api-002
    topic: API браузера
    level: junior
    question: |
      Что произойдёт при вызове `send` сразу после создания сокета?
    code: |
      const ws = new WebSocket('wss://example.com/socket');
      ws.send('hello');
    codeLang: js
    options:
      - text: 'Будет исключение `InvalidStateError`'
        correct: true
        why: 'В состоянии CONNECTING отправлять нельзя, и браузер бросает исключение синхронно, прямо в `send`.'
      - text: 'Сообщение встанет в очередь и уйдёт после открытия'
        why: 'Нативный `WebSocket` такой очереди не ведёт.'
      - text: 'Сообщение молча потеряется без ошибки'
        why: 'До открытия браузер не молчит: об ошибке он сообщает сразу.'
      - text: 'Браузер дождётся открытия соединения прямо внутри `send`'
        why: 'Блокирующих вызовов у `WebSocket` нет: `send` никогда не ждёт сети.'
    explanation: |
      Отправлять можно только в состоянии OPEN, поэтому первые сообщения отправляют в `onopen`, а всё, что
      нужно послать раньше, складывают в свою очередь и отправляют после открытия. В Chrome текст ошибки:
      «Failed to execute 'send' on 'WebSocket': Still in CONNECTING state».
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/send
  - id: ws-api-003
    topic: API браузера
    level: middle
    question: |
      Соединение уже закрыто (`readyState === 3`). Что произойдёт при вызове `ws.send('hello')`?
    options:
      - text: 'Исключения не будет, данные пропадут'
        correct: true
        why: 'Так требует стандарт: после закрытия `send()` не бросает исключение, данные никуда не уходят.'
      - text: 'Будет исключение `InvalidStateError`'
        why: 'Частая ловушка: исключение для закрытого сокета было бы логично, но стандарт его не предусматривает.'
      - text: 'Будет исключение `NetworkError`'
        why: 'Такого исключения `send()` не бросает вовсе: сетевые проблемы проявляются через события, а не через исключения.'
      - text: '`send()` вернёт `false`, сообщение не уйдёт'
        why: '`send()` ничего не возвращает (`undefined`), так что по результату вызова отправку не проверить.'
    explanation: |
      После закрытия `send()` не бросает исключение: Chrome лишь пишет предупреждение в консоль, а код ничего не
      узнаёт. Отсюда типичная потеря данных: код отправляет сообщение в момент обрыва и считает, что оно ушло.
      Поэтому перед отправкой проверяют `readyState === WebSocket.OPEN`, а важные сообщения подтверждают ответом от
      сервера.
    links:
      - https://websockets.spec.whatwg.org/#dom-websocket-send
  - id: ws-api-004
    topic: API браузера
    level: middle
    question: |
      Какие вызовы выполнятся без исключения на открытом сокете?
    options:
      - text: '`ws.close(1000)`'
        correct: true
        why: '`1000` — нормальное закрытие, его передавать можно.'
      - text: '`ws.close(4001, "logout")`'
        correct: true
        why: 'Диапазон 4000–4999 отдан приложениям под свои коды.'
      - text: '`ws.close(3000)`'
        correct: true
        why: 'Коды 3000–3999 регистрируются для библиотек и фреймворков, браузер их тоже пропускает.'
      - text: '`ws.close(1001)`'
        why: '`1001 Going Away` браузер ставит сам при уходе со страницы. Из JavaScript такой код вызовет `InvalidAccessError`.'
      - text: '`ws.close(1011)`'
        why: '`1011` — внутренняя ошибка сервера. Код из диапазона 1001–2999 из скрипта передать нельзя — будет `InvalidAccessError`.'
    explanation: |
      Из JavaScript в `close()` можно передать только `1000` или код из диапазона 3000–4999. Остальные коды
      протокола (`1001`, `1008`, `1011` и т. д.) — для самих реализаций и серверов. Причина (`reason`) — до
      123 байт в UTF-8: длиннее не поместится в управляющий кадр вместе с кодом, и браузер бросит `SyntaxError`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/close

  - id: ws-api-005
    topic: API браузера
    level: senior
    question: |
      Соединение открылось, а через секунду процесс сервера убили — TCP-соединение просто оборвалось. Что выведется
      в консоль в Chrome?
    code: |
      const ws = new WebSocket('wss://example.com/socket');
      const log = [];
      ws.onopen = () => log.push('open');
      ws.onerror = () => log.push('error');
      ws.onclose = (e) => {
        log.push(`close ${e.code} ${e.wasClean}`);
        console.log(log.join(', '));
      };
    codeLang: js
    options:
      - text: '`open, close 1006 false`'
        correct: true
        why: 'Обрыв уже открытого соединения в Chrome приходит одним событием `close` с `1006` и `wasClean: false`, без `error`.'
      - text: '`open, error, close 1006 false`'
        why: 'Так выглядит неудачное подключение — например, сервер недоступен. Обрыв открытого соединения в Chrome проходит без `error`.'
      - text: '`open, close 1000 true`'
        why: '`1000` и `wasClean: true` бывают, только если стороны обменялись кадрами close. Убитый процесс их не отправит.'
      - text: '`open, close 1001 true`'
        why: '`1001` означает уход стороны по протоколу, например при закрытии страницы. Здесь закрытия по протоколу не было.'
    explanation: |
      Обрыв открытого соединения и неудачное подключение выглядят в событиях по-разному, поэтому смотреть стоит на
      `close`: `wasClean` и код показывают, как закрылось соединение.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/CloseEvent
  - id: ws-api-006
    topic: API браузера
    level: middle
    multiple: true
    question: |
      Что верно про `ws.binaryType`?
    options:
      - text: 'По умолчанию двоичные сообщения приходят как `Blob`'
        correct: true
        why: 'Значение по умолчанию — `"blob"`. Чтобы получать `ArrayBuffer`, его меняют на `"arraybuffer"`.'
      - text: 'От него зависит и тип текстовых сообщений'
        why: 'Текстовые сообщения всегда приходят строкой, `binaryType` касается только двоичных.'
      - text: 'Менять его можно только до открытия соединения'
        why: 'Его можно поменять в любой момент, новое значение действует на следующие входящие сообщения.'
      - text: 'Он задаёт и формат данных, которые отправляет `send()`'
        why: '`send()` принимает строку, `Blob`, `ArrayBuffer` или типизированный массив независимо от `binaryType`.'
    explanation: |
      Текстовые кадры приходят строкой, двоичные — `Blob` или `ArrayBuffer` в зависимости от `binaryType`. `Blob`
      удобен для больших данных, но прочитать его можно только асинхронно (`await blob.arrayBuffer()`). Для
      двоичных протоколов (protobuf, MessagePack) обычно сразу ставят `"arraybuffer"`, чтобы разбирать сообщения
      синхронно.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/binaryType
  - id: ws-api-007
    topic: API браузера
    level: middle
    question: |
      Нужно передать токен авторизации при открытии сокета. Что получится?
    code: |
      const ws = new WebSocket('wss://api.example.com/socket', {
        headers: { Authorization: `Bearer ${token}` },
      });
    codeLang: js
    options:
      - text: 'Конструктор бросит `SyntaxError`, заголовок не уйдёт'
        correct: true
        why: 'Второй аргумент — список подпротоколов. Объект превратится в строку `[object Object]`, а это недопустимое имя подпротокола.'
      - text: 'Заголовок `Authorization` уйдёт в запросе рукопожатия'
        why: 'Так можно в Node-библиотеке `ws`, но браузерный `WebSocket` не даёт задавать заголовки рукопожатия.'
      - text: 'Объект проигнорируется, соединение откроется без заголовка'
        why: 'Браузер не игнорирует аргумент, а пытается прочитать его как подпротокол и падает на проверке имени.'
      - text: 'Откроется соединение с подпротоколом `[object Object]`'
        why: 'В `[object Object]` есть пробел и скобки, а такие символы в имени подпротокола запрещены. До сети дело не дойдёт.'
    explanation: |
      Сигнатура в браузере — `new WebSocket(url, protocols)`, и задать произвольные заголовки рукопожатия нельзя.
      Браузер сам добавляет cookie сайта и `Origin`. Поэтому токен обычно передают другим путём: cookie, первым
      сообщением после открытия, короткоживущим одноразовым билетом в URL или (как обходной трюк) через значение
      `Sec-WebSocket-Protocol`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/WebSocket
  - id: ws-api-008
    topic: API браузера
    level: senior
    question: |
      Клиент открыл `new WebSocket(url, ['chat.v1'])`, а сервер в ответе на рукопожатие не прислал
      `Sec-WebSocket-Protocol`. Что произойдёт?
    options:
      - text: 'Соединение не откроется, будут `error` и `close` с кодом `1006`'
        correct: true
        why: 'Если клиент запросил подпротоколы, сервер обязан выбрать один из них. Без выбора браузер считает рукопожатие неудачным.'
      - text: 'Соединение откроется, а `ws.protocol` будет пустой строкой'
        why: 'У открытого сокета пустой `ws.protocol` бывает, только если клиент не просил подпротоколов вовсе.'
      - text: 'Соединение откроется, а `ws.protocol` будет равен `"chat.v1"`'
        why: 'Подпротокол выбирает сервер. Без его ответа браузер не может считать, что договорились о `chat.v1`.'
      - text: 'Браузер повторит рукопожатие уже без подпротоколов'
        why: 'Повторов рукопожатия с другими параметрами браузер не делает: подпротоколы задаёт только код.'
    explanation: |
      Подпротоколы — способ договориться о формате сообщений поверх WebSocket: например, `mqtt` или `wamp`.
      Клиент перечисляет, что умеет, сервер выбирает один вариант и возвращает его в `Sec-WebSocket-Protocol`, а
      клиент видит выбор в `ws.protocol`. Если варианты были, а выбора нет, браузер проваливает соединение.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/protocol
  - id: ws-api-009
    topic: API браузера
    level: middle
    question: |
      Что верно про `ws.bufferedAmount`?
    options:
      - text: 'Растёт синхронно, сразу при вызове `send()`'
        correct: true
        why: 'Данные кладутся в очередь в момент вызова: сразу после отправки мегабайта счётчик показывает около 1 000 000.'
      - text: 'Ничего не говорит о доставке до сервера'
        correct: true
        why: 'Он уменьшается, когда данные ушли в сеть, а не когда сервер их получил. Подтверждений доставки в протоколе нет.'
      - text: 'Учитывает и входящие данные, ещё не прочитанные в `onmessage`'
        why: 'Счётчик только про исходящую очередь, входящие данные в нём не учитываются.'
      - text: 'Обнуляется, только когда сервер подтвердит приём'
        why: 'Сервер ничего не подтверждает на уровне протокола. Счётчик уменьшается по мере отправки в сеть.'
    explanation: |
      `send()` не ждёт сети: данные кладутся в очередь, а `bufferedAmount` показывает её размер в байтах. Он
      растёт при вызове `send()` и падает по мере того, как данные уходят в сеть.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/bufferedAmount
  - id: ws-api-010
    topic: API браузера
    level: senior
    question: |
      Какие утверждения о событии `error` у `WebSocket` верны?
    options:
      - text: 'Это обычный `Event` без описания причины ошибки'
        correct: true
        why: 'Подробности браузер не раскрывает намеренно: так страница не может выяснять устройство чужой сети по текстам ошибок.'
      - text: 'После `error` всегда приходит `close`'
        correct: true
        why: 'Ошибка всегда заканчивается закрытием. Поэтому логику переподключения кладут в `onclose`.'
      - text: 'В нём есть HTTP-статус, если рукопожатие отклонили'
        why: 'Статус отказа (например, `401` или `403`) скрипту недоступен — его видно только в DevTools: в консоли и во вкладке Network.'
      - text: 'Оно приходит при каждом закрытии соединения'
        why: 'При нормальном закрытии обменом кадрами close события `error` нет.'
    explanation: |
      `error` — бедное событие: «что-то пошло не так», без деталей. Узнать, отклонил ли сервер рукопожатие с `401`
      или вовсе недоступен, из кода нельзя. Поэтому диагностику делают по `close` (код, `wasClean`) и по
      собственному протоколу: например, сервер принимает соединение и сразу закрывает его кодом `4001` с причиной
      «не авторизован».
