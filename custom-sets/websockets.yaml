  - id: ws-rel-001
    topic: Надёжность
    level: senior
    question: |
      Клиент переподключается с растущей задержкой: 1, 2, 4, 8… секунд. Когда возвращать задержку к начальной?
    options:
      - text: 'Когда соединение продержалось, скажем, 30 секунд'
        correct: true
        why: 'Только устойчивое соединение говорит, что проблема ушла. Короткий успех ещё ничего не значит.'
      - text: 'Сразу в `onopen` нового соединения'
        why: 'Если сервер принимает соединение и тут же закрывает его (падает или отклоняет токен), клиент будет засыпать его попытками с минимальной задержкой.'
      - text: 'Никогда: однажды выросшая задержка должна только расти'
        why: 'Тогда после долгой стабильной работы любой случайный обрыв заставит пользователя ждать минуты.'
      - text: 'Когда `navigator.onLine` снова станет `true`'
        why: '`navigator.onLine` говорит лишь о том, что у устройства есть сеть, а не о том, что сервер работает и принимает клиента.'
    explanation: |
      Растущая задержка защищает сервер от лавины переподключений, но важно и то, когда её сбрасывать. Если
      сбрасывать в `onopen`, цикл «подключился — сервер сразу закрыл» превращается в непрерывный поток попыток: каждая
      попытка формально успешна. Поэтому задержку сбрасывают, когда соединение проработало какое-то время, а при
      закрытии с кодом «не авторизован» не переподключаются вслепую, а сначала обновляют токен.
  - id: ws-rel-002
    topic: Надёжность
    level: middle
    question: |
      Зачем приложению heartbeat — периодический обмен сообщениями «ты жив?» — если браузер сам отвечает на ping
      сервера?
    options:
      - text: 'Соединение может «умереть» молча, и клиент долго об этом не узнает'
        correct: true
        why: 'При пропаже сети без обрыва TCP событие `close` может не прийти минутами. Отсутствие ответа на heartbeat — быстрый сигнал.'
      - text: 'Без heartbeat браузер сам закрывает сокет после 60 секунд тишины'
        why: 'Браузер сам не закрывает простаивающий сокет.'
      - text: 'Heartbeat ускоряет доставку сообщений, поддерживая канал «прогретым»'
        why: 'Скорость доставки от этого не меняется. Задача heartbeat — обнаружить мёртвое соединение и не дать посредникам закрыть живое.'
      - text: 'Без heartbeat сервер не может первым отправлять сообщения клиенту'
        why: 'Сервер может отправить сообщение в любой момент, двунаправленность от heartbeat не зависит.'
    explanation: |
      TCP не сообщает о пропаже собеседника, пока не попробует что-то отправить. Если у телефона пропала сеть,
      сокет может считаться открытым долго, а сообщения уходить в пустоту. Браузер на ping сервера отвечает сам, но
      не сообщает о нём странице и не даёт отправить ping из JavaScript. Поэтому клиент шлёт своё сообщение-пинг и
      ждёт ответа: нет ответа — соединение мёртвое, пора переподключаться.
  - id: ws-rel-003
    topic: Надёжность
    level: senior
    question: |
      Какую гарантию даёт сам протокол WebSocket?
    options:
      - text: 'Сообщения внутри одного соединения приходят в порядке отправки'
        correct: true
        why: 'WebSocket работает поверх одного TCP-соединения, а TCP сохраняет порядок байтов.'
      - text: 'Сообщение, отправленное через `send()`, будет доставлено'
        why: '`send()` лишь ставит данные в очередь. Если соединение оборвётся, часть отправленного пропадёт без уведомления.'
      - text: 'После переподключения сервер дошлёт пропущенные сообщения'
        why: 'Новое соединение ничего не знает о старом. Досылку пропущенного приходится строить самим.'
      - text: 'Сообщения из разных вкладок одного пользователя придут на сервер в порядке отправки'
        why: 'Порядок есть только внутри одного соединения, а у каждой вкладки оно своё.'
    explanation: |
      У WebSocket есть только порядок внутри соединения и целостность сообщений. Подтверждений доставки,
      досылки и защиты от дублей нет. Если они нужны (чат, платежи, совместное редактирование), их строят
      поверх: у сообщений есть id, сервер подтверждает приём, клиент повторяет неподтверждённое после
      переподключения, а сервер отбрасывает повторы по id. Протоколы вроде MQTT и библиотеки вроде Socket.IO
      (подтверждения, восстановление состояния) берут часть этого на себя.
  - id: ws-rel-004
    topic: Надёжность
    level: middle
    question: |
      Что приложению обычно нужно сделать сразу после переподключения сокета?
    options:
      - text: 'Заново подписаться на нужные каналы и забрать пропущенное за время обрыва'
        correct: true
        why: 'Новое соединение — чистый лист: сервер не помнит подписок старого и не знает, что клиент пропустил.'
      - text: 'Ничего: браузер восстанавливает подписки вместе с соединением'
        why: 'Подписки — понятие приложения, браузер о них ничего не знает.'
      - text: 'Переслать серверу все сообщения, полученные до обрыва'
        why: 'Серверу не нужны его же сообщения. Нужно другое: сообщить, что клиент уже получил, и забрать остальное.'
      - text: 'Перезагрузить страницу, чтобы сбросить состояние'
        why: 'Это теряет состояние интерфейса и раздражает. Достаточно восстановить подписки и догнать данные.'
    explanation: |
      Типичная схема: клиент хранит id или номер последнего полученного события, после переподключения
      отправляет «подпишись на каналы X, Y и пришли всё после события N». Если сервер так не умеет, клиент
      перезапрашивает актуальное состояние по HTTP и дальше слушает изменения. Так же устроены `Last-Event-ID`
      в SSE и восстановление состояния соединения в Socket.IO.
  - id: ws-rel-005
    topic: Надёжность
    level: junior
    question: |
      В браузерном коде соединение оборвалось. Переподключится ли нативный `WebSocket` сам?
    options:
      - text: 'Нет, нужно создать новый объект `WebSocket`'
        correct: true
        why: 'Закрытый объект открыть заново нельзя, а автоматических переподключений в API нет.'
      - text: 'Да, браузер переподключится с той же задержкой, что у `EventSource`'
        why: 'Автопереподключение есть у `EventSource` (SSE), у `WebSocket` его нет.'
      - text: 'Да, если при создании передать флаг `{ reconnect: true }`'
        why: 'Такого параметра у конструктора нет.'
      - text: 'Да, после вызова `ws.open()` на закрытом объекте'
        why: 'Метода `open()` у `WebSocket` нет. Новое соединение — только новым объектом.'
    explanation: |
      Нативный `WebSocket` — одноразовый объект: создал, пользуешься, закрылся. Переподключение — забота
      приложения: в `onclose` запустить таймер, создать новый сокет, перевесить обработчики и восстановить
      подписки. Поэтому в реальных проектах сокет почти всегда заворачивают в свою обёртку или берут
      библиотеку, где это уже сделано.
  - id: ws-rel-006
    topic: Надёжность
    level: senior
    question: |
      Приложение шлёт в сокет позицию курсора на каждое событие `mousemove`. На слабой сети интерфейс со временем
      начинает тормозить и съедать память. Что поможет?
    options:
      - text: 'Смотреть на `bufferedAmount` и пропускать устаревшие позиции'
        correct: true
        why: 'Растущий `bufferedAmount` показывает, что канал не успевает. Для курсора важна только последняя позиция — старые можно выбросить.'
      - text: 'Отправлять позиции через `await ws.send(...)`, чтобы дождаться доставки'
        why: '`send()` ничего не возвращает и не ждёт сети: `await` здесь ничего не изменит.'
      - text: 'Отправлять позиции из Web Worker, чтобы не блокировать основной поток'
        why: 'Тормозит не основной поток, а растущая очередь неотправленного. Из воркера она растёт точно так же.'
      - text: 'Открыть несколько сокетов и раздавать сообщения по очереди'
        why: 'Канал от этого шире не станет, а порядок сообщений между разными сокетами перестанет быть гарантированным.'
    explanation: |
      Это проблема обратного давления (backpressure): клиент производит данные быстрее, чем их пропускает сеть.
      У браузерного `WebSocket` нет встроенного механизма притормозить отправителя — только счётчик
      `bufferedAmount`. Решения: троттлинг (не чаще 20–30 раз в секунду), отправка только последнего состояния и
      пропуск отправки, пока очередь не опустеет.
  - id: ws-rel-007
    topic: Надёжность
    level: middle
    question: |
      Какие события могут закрыть WebSocket-соединение, хотя код приложения ни на клиенте, ни на сервере его не
      закрывал?
    options:
      - text: 'Таймаут простоя на прокси или балансировщике'
        correct: true
        why: 'Посредники закрывают соединения, по которым долго нет данных. У nginx по умолчанию — 60 секунд.'
      - text: 'Смена сети на телефоне, например с Wi-Fi на мобильную'
        correct: true
        why: 'Меняется IP-адрес, и старое TCP-соединение становится недействительным.'
      - text: 'Деплой новой версии сервера'
        correct: true
        why: 'Процесс со старой версией останавливается вместе со всеми своими соединениями.'
      - text: 'Смена `binaryType` у открытого сокета'
        why: 'Это настройка формата входящих данных на клиенте: сервер о ней не узнаёт, соединение она не трогает.'
      - text: 'Отправка пустой строки `ws.send("")`'
        why: 'Пустое сообщение — допустимый кадр нулевой длины, соединение от него не закрывается.'
    explanation: |
      Долгое соединение живёт в мире, где всё время что-то меняется: сети, адреса, версии серверов, настройки
      посредников. Поэтому обрыв для WebSocket — норма, а не авария: переподключение и досылка пропущенного
      входят в обязательный набор любого серьёзного клиента.
  - id: ws-rel-008
    topic: Надёжность
    level: middle
    question: |
      В режиме разработки каждое сообщение чата появляется дважды, а в продакшене — один раз. Почему?
    code: |
      function Chat() {
        useEffect(() => {
          const ws = new WebSocket('wss://chat.example.com');
          ws.onmessage = (e) => addMessage(e.data);
        }, []);
        return <Messages />;
      }
    codeLang: jsx
    options:
      - text: 'StrictMode запустил эффект дважды, и первый сокет никто не закрыл'
        correct: true
        why: 'В разработке StrictMode монтирует, размонтирует и снова монтирует компонент. Без очистки открыты два сокета, и оба получают каждое сообщение.'
      - text: 'StrictMode дважды рендерит компонент, и `addMessage` вызывается дважды'
        why: 'Двойной рендер не вызывает `onmessage`: `addMessage` вызывает обработчик сокета, а не рендер.'
      - text: 'React в StrictMode вызывает обработчики событий дважды'
        why: 'Обработчики событий StrictMode не дублирует — только рендер, инициализаторы состояния и эффекты.'
      - text: 'Сервер в режиме разработки шлёт каждое сообщение дважды'
        why: 'Режим разработки фронтенда не влияет на сервер. Дубль появляется на клиенте.'
    explanation: |
      StrictMode в разработке проверяет, что эффект умеет убирать за собой: после первого запуска он вызывает
      очистку и запускает эффект снова. Без `return () => ws.close()` первый сокет остаётся открытым и тоже
      получает сообщения. В продакшене повтора нет, но та же утечка проявится при каждом размонтировании
      компонента. Ещё лучше держать одно соединение на всё приложение, а не в каждом компоненте.
    links:
      - https://react.dev/learn/synchronizing-with-effects#how-to-handle-the-effect-firing-twice-in-development
  - id: ws-rel-009
    topic: Надёжность
    level: middle
    question: |
      Пользователь свернул вкладку с чатом на телефоне и вернулся через полчаса. `readyState` равен `OPEN`, но
      сообщения не приходят. Что разумно сделать в приложении?
    options:
      - text: 'По `visibilitychange` проверять связь и при надобности переподключаться'
        correct: true
        why: 'Возвращение на вкладку — удобный момент отправить пинг и, не получив ответа, открыть новое соединение и догнать пропущенное.'
      - text: 'Ничего: вернувшись, браузер сам сразу пришлёт `close`, если связь пропала'
        why: 'Браузер узнаёт о потере связи, только когда это заметит TCP, а после заморозки вкладки на это могут уйти минуты.'
      - text: 'Не давать вкладке заснуть таймером `setInterval` раз в секунду'
        why: 'В фоне браузер притормаживает таймеры, а мобильная ОС может заморозить вкладку целиком — таймер этому не помешает.'
      - text: 'Перед каждым `send` проверять `readyState === OPEN`'
        why: 'Здесь `readyState` и так равен `OPEN` — проверка ничего не покажет.'
    explanation: |
      Мобильные браузеры и ОС экономят батарею: фоновые вкладки замораживают, сеть отключают. Сокет может
      пережить это внешне живым: `readyState` равен `OPEN`, но по нему ничего не идёт. Поэтому при возвращении
      пользователя (`visibilitychange` или `pageshow`) приложение проверяет соединение и догоняет пропущенное.
  # ===================== Безопасность =====================
  - id: ws-sec-001
    topic: Безопасность
    level: middle
    question: |
      Пользователь вошёл на `bank.example` в Chrome, сессия хранится в cookie с `SameSite=None; Secure`. Он
      открывает страницу `evil.example`, и та создаёт `new WebSocket('wss://bank.example/socket')`. Что
      произойдёт, если сервер банка ничего специально не проверяет?
    options:
      - text: 'Сокет откроется от имени пользователя, ответы увидит чужая страница'
        correct: true
        why: 'Браузер приложит cookie банка, а политика одного источника и CORS на WebSocket не действуют. Это атака CSWSH.'
      - text: 'Браузер заблокирует соединение политикой одного источника'
        why: 'Политика одного источника и CORS на WebSocket не распространяются: соединиться можно с любым сервером.'
      - text: 'Соединение откроется, но без cookie, то есть анонимно'
        why: 'Cookie с `SameSite=None` уходит и в межсайтовое рукопожатие. С `Lax` или `Strict` её бы не было, но полагаться только на это рискованно.'
      - text: 'Браузер сначала отправит preflight `OPTIONS` и откроет соединение по ответу'
        why: 'Preflight есть у CORS для `fetch`. У WebSocket его нет, рукопожатие уходит сразу.'
    explanation: |
      Атака называется Cross-Site WebSocket Hijacking. Защита — на сервере: проверять заголовок `Origin` в
      рукопожатии и пускать только свои сайты. Дополнительно помогают `SameSite=Lax` или `Strict` у cookie (в
      Chrome `Lax` — значение по умолчанию) и авторизация не по cookie, а токеном, который чужая страница не знает.
    links:
      - https://cheatsheetseries.owasp.org/cheatsheets/WebSocket_Security_Cheat_Sheet.html
  - id: ws-sec-002
    topic: Безопасность
    level: senior
    question: |
      Что верно про проверку заголовка `Origin` на WebSocket-сервере?
    options:
      - text: 'Она защищает пользователей от чужих сайтов в их браузерах'
        correct: true
        why: 'Страница не может подменить `Origin`: браузер ставит его сам. Поэтому злой сайт не откроет сокет под видом своего.'
      - text: 'От скриптов и ботов вне браузера она не защищает'
        correct: true
        why: 'Программа на Node или Python отправит любой `Origin`. От них защищает только авторизация.'
      - text: 'Её достаточно вместо авторизации пользователя'
        why: '`Origin` говорит, с какого сайта пришёл запрос, а не кто пользователь. Авторизация нужна всё равно.'
      - text: 'Браузер сам отклонит соединение, если `Origin` не совпадает с сервером'
        why: 'Браузер никого не проверяет: он только сообщает `Origin`, решать должен сервер.'
    explanation: |
      `Origin` — подпись браузера «этот запрос сделала страница с такого-то сайта». Она полезна против CSWSH, где
      атакуют через браузер пользователя, но ничего не стоит вне браузера. Правильная защита состоит из двух
      частей: белый список `Origin` против чужих страниц и авторизация каждого соединения против всех остальных.

  - id: ws-sec-003
    topic: Безопасность
    level: middle
    question: |
      Почему передавать долгоживущий токен доступа в адресе сокета (`wss://api.example/socket?token=...`) считается
      плохой практикой?
    options:
      - text: 'Адреса запросов часто пишутся в логи серверов и прокси'
        correct: true
        why: 'Токен из URL окажется в логах балансировщика, сервера и систем мониторинга, где его могут прочитать.'
      - text: 'Параметры URL при `wss://` передаются по сети незашифрованными'
        why: 'TLS шифрует весь запрос, включая путь и параметры. Проблема не в сети, а в том, где адрес оседает потом.'
      - text: 'Браузер обрезает параметры в адресе WebSocket'
        why: 'Параметры запроса передаются полностью, так и устроены многие API.'
      - text: 'Сервер не может прочитать параметры из запроса рукопожатия'
        why: 'Рукопожатие — обычный HTTP-запрос, сервер видит его адрес целиком.'
    explanation: |
      В браузере нельзя задать заголовок `Authorization` для WebSocket, поэтому токен соблазнительно положить в
      URL. Безопаснее короткоживущий одноразовый билет: клиент получает его обычным HTTP-запросом с авторизацией
      и тут же использует для подключения. Ещё варианты — cookie с проверкой `Origin` или авторизация первым
      сообщением после открытия.

  - id: ws-sec-004
    topic: Безопасность
    level: middle
    question: |
      Страница открыта по `https://`, CSP не настроен. Что выведется в консоль в Chrome?
    code: |
      try {
        const ws = new WebSocket('ws://api.example.com/socket');
        ws.onerror = () => console.log('error');
        console.log('created');
      } catch (e) {
        console.log(e.name);
      }
    codeLang: js
    options:
      - text: '`SecurityError`'
        correct: true
        why: 'Незашифрованный сокет со страницы по HTTPS браузер запрещает сразу: конструктор синхронно бросает исключение.'
      - text: '`created`, затем `error`'
        why: 'Так было бы, если бы браузер попытался подключиться и получил отказ. Здесь до сети дело не доходит.'
      - text: '`created`'
        why: 'Объект не создаётся вовсе: проверка на смешанное содержимое срабатывает прямо в конструкторе.'
      - text: '`SyntaxError`'
        why: 'Адрес синтаксически правильный, схема `ws:` допустима. Ошибка в другом — в небезопасном соединении с защищённой страницы.'
    explanation: |
      Со страницы по HTTPS нельзя открыть `ws://`: это смешанное содержимое. Chrome сообщает об этом синхронным
      исключением `SecurityError` с текстом «An insecure WebSocket connection may not be initiated from a page
      loaded over HTTPS». Исключение из правила — CSP `upgrade-insecure-requests`: с ним браузер сам повышает `ws:`
      до `wss:`. Ловушка в том, что `onerror` тут не поможет: исключение синхронное, и без `try` оно оборвёт
      выполнение скрипта.
  - id: ws-sec-005
    topic: Безопасность
    level: middle
    question: |
      Сервер чата на Node-библиотеке `ws` принимает сообщения от клиентов. Что нужно предусмотреть?
    options:
      - text: 'Ограничить размер сообщения сильнее, чем по умолчанию'
        correct: true
        why: 'По умолчанию `ws` принимает сообщения до 100 МиБ — несколько таких сообщений от злоумышленника съедят память сервера.'
      - text: 'Проверять формат и права на каждое сообщение'
        correct: true
        why: 'Авторизация при подключении не означает, что любое сообщение можно выполнять. Каждое — недоверенные данные.'
      - text: 'Ограничить частоту сообщений с одного соединения'
        correct: true
        why: 'Без ограничения один клиент может завалить сервер и остальных пользователей сообщениями.'
      - text: 'Доверять `userId` из тела сообщения, раз соединение авторизовано'
        why: 'Кто отправитель, сервер берёт из сессии соединения, установленной при рукопожатии. Поле в сообщении клиент может подставить любое.'
      - text: 'Проверять `Origin` в каждом входящем сообщении'
        why: '`Origin` есть только в запросе рукопожатия, в сообщениях его нет.'
    explanation: |
      Открытое соединение — это канал, по которому может прийти что угодно и в любом количестве. Основной набор
      защиты сервера: лимит размера сообщения (`maxPayload` в `ws`, `maxHttpBufferSize` в Socket.IO — у него
      умолчание 1 МБ), ограничение частоты, проверка схемы и прав на каждую команду, лимит числа соединений с
      одного пользователя или IP.
  - id: ws-sec-006
    topic: Безопасность
    level: middle
    question: |
      Клиент выбирает обработчик по полю пришедшего сообщения. Чем опасен такой код?
    code: |
      const handlers = {
        chat: (payload) => addMessage(payload),
        typing: (payload) => showTyping(payload),
      };
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        handlers[msg.type](msg.payload);
      };
    codeLang: js
    options:
      - text: '`type` вида `"constructor"` вызовет не тот обработчик или уронит код'
        correct: true
        why: 'Поиск по обычному объекту идёт и по прототипу: `"constructor"` вызовет `Object`, `"toString"` — унаследованный метод, а `"__proto__"` уронит обработчик с `TypeError`.'
      - text: '`JSON.parse` выполнит код, если в сообщении придёт функция'
        why: 'JSON не умеет описывать функции: `JSON.parse` возвращает только данные — объекты, массивы, строки, числа.'
      - text: 'Обработчики будут вызываться в случайном порядке'
        why: 'Сообщения обрабатываются по одному в порядке прихода, порядок ключей объекта тут ни при чём.'
      - text: 'Ничем: сообщения приходят от своего сервера, им можно полностью доверять'
        why: 'Сервер часто пересылает то, что прислали другие пользователи, а значит, `type` может прийти любым.'
    explanation: |
      Сообщение из сокета — недоверенные данные, даже если пришло от своего сервера. Выбор обработчика по строке
      из сообщения через обычный объект натыкается на унаследованные свойства прототипа. Надёжнее хранить
      обработчики в `Map` или в объекте без прототипа (`Object.create(null)`), проверять `Object.hasOwn` и
      отбрасывать неизвестные типы. Та же логика на сервере защищает от вызова непредусмотренных команд.
  - id: ws-sec-007
    topic: Безопасность
    level: middle
    question: |
      Сокет авторизовали токеном при подключении. Токен живёт 15 минут, а соединение открыто уже час. Что
      происходит?
    options:
      - text: 'Соединение живёт, пока сервер сам не проверит срок и не закроет'
        correct: true
        why: 'Токен проверялся один раз, при рукопожатии. Дальше по соединению идут только сообщения, и срок токена никто не проверяет, если этого не делает сервер.'
      - text: 'Браузер сам закроет сокет, когда у cookie или токена истечёт срок'
        why: 'Браузер не знает о токене приложения и не следит за сроком cookie у открытых соединений.'
      - text: 'Следующее сообщение от клиента вернёт ошибку `401`'
        why: 'HTTP-статусов у сообщений WebSocket нет: после рукопожатия это уже не HTTP.'
      - text: 'Сервер увидит новый токен в заголовках следующего сообщения'
        why: 'У сообщений WebSocket нет HTTP-заголовков. Новый токен можно передать только своим сообщением или новым подключением.'
    explanation: |
      Авторизация WebSocket — это авторизация рукопожатия. Чтобы истёкший или отозванный доступ не жил часами,
      сервер сам следит за сроком и закрывает соединение своим кодом (например, `4001`), а клиент обновляет токен
      и подключается заново. Другой вариант — протокол приложения позволяет прислать новый токен сообщением, не
      разрывая соединения.
  # ===================== Архитектура и альтернативы =====================
  - id: ws-arch-001
    topic: Архитектура и альтернативы
    level: senior
    question: |
      Сайт отдаёт уведомления через Server-Sent Events по HTTP/1.1. Пользователь открыл его в семи вкладках, и в
      седьмой страница перестала грузиться. Почему?
    options:
      - text: 'Браузер держит до шести соединений с одним сайтом, и все заняты SSE'
        correct: true
        why: 'Каждый `EventSource` занимает соединение надолго. Лимит в шесть соединений на сайт общий для всех вкладок, и седьмой странице не на чем грузить даже обычные запросы.'
      - text: 'Сервер по умолчанию принимает не больше шести подписчиков SSE с одного IP'
        why: 'Такого стандартного ограничения у серверов нет. Ограничение здесь в браузере.'
      - text: 'Браузер разрешает только один `EventSource` на вкладку'
        why: 'Ограничения «один на вкладку» нет: в одной вкладке можно открыть несколько `EventSource`.'
      - text: 'Седьмая вкладка не получила `Last-Event-ID` и ждёт его'
        why: '`Last-Event-ID` нужен только при переподключении, чтобы сервер дослал пропущенное. Загрузку страницы он не блокирует.'
    explanation: |
      В HTTP/1.1 браузер открывает не больше шести одновременных соединений с одним сайтом, и долгие соединения SSE
      их съедают. Решения: HTTP/2 или HTTP/3 (потоки делят одно соединение), одно SSE-соединение на все вкладки
      через `SharedWorker` или `BroadcastChannel`, или WebSocket — на него этот лимит не распространяется.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/EventSource
  - id: ws-arch-002
    topic: Архитектура и альтернативы
    level: senior
    question: |
      Приложение на WebSocket раскатили на три экземпляра сервера за балансировщиком. Пользователь A подключён к
      первому, B — ко второму. Что нужно, чтобы сообщение A дошло до B?
    options:
      - text: 'Общая шина между серверами, например Redis Pub/Sub'
        correct: true
        why: 'Каждый сервер знает только свои соединения. Шина разносит сообщение всем экземплярам, и каждый доставит его своим клиентам.'
      - text: 'Sticky-сессии на балансировщике'
        why: 'Sticky-сессии прикрепляют клиента к одному серверу, но A и B всё равно окажутся на разных.'
      - text: 'Увеличить таймаут простоя на балансировщике'
        why: 'Таймаут спасает соединения от закрытия, но не связывает серверы между собой.'
      - text: 'Ничего: балансировщик сам пересылает сообщения между серверами'
        why: 'Балансировщик только распределяет соединения и о сообщениях приложения ничего не знает.'
    explanation: |
      Соединение WebSocket живёт на одном сервере, поэтому при нескольких экземплярах нужна общая шина
      сообщений: Redis Pub/Sub, NATS, Kafka. Сервер публикует сообщение, все экземпляры получают его и рассылают
      своим клиентам. В Socket.IO для этого есть готовые адаптеры, например на Redis.
  - id: ws-arch-003
    topic: Архитектура и альтернативы
    level: middle
    question: |
      За nginx соединения WebSocket не открываются, хотя обычные запросы работают. Чего, скорее всего, не хватает в
      настройках прокси?
    options:
      - text: '`proxy_http_version 1.1` и проброса `Upgrade` и `Connection`'
        correct: true
        why: '`Upgrade` и `Connection` — заголовки одного звена, прокси не передаёт их дальше без явной настройки, а апгрейд работает только в HTTP/1.1.'
      - text: 'Заголовков CORS для домена, с которого открыт сайт'
        why: 'CORS к WebSocket не относится: дело в том, что прокси обрезает заголовки апгрейда.'
      - text: 'Отдельного порта для WebSocket-трафика'
        why: 'WebSocket работает на тех же портах, что и HTTP. Отдельный порт ничего не изменит.'
      - text: 'Включённого сжатия `gzip` для всех ответов сервера приложения'
        why: 'Сжатие HTTP-ответов к рукопожатию WebSocket отношения не имеет.'
    explanation: |
      Для nginx нужны три строки в `location`: `proxy_http_version 1.1;`, `proxy_set_header Upgrade
      $http_upgrade;` и `proxy_set_header Connection "upgrade";`. Без них сервер приложения получит обычный HTTP-запрос
      без просьбы об апгрейде. Вторая типичная проблема — `proxy_read_timeout` в 60 секунд: тихие соединения
      рвутся, пока не настроишь таймаут или heartbeat.
    links:
      - https://nginx.org/en/docs/http/websocket.html
  - id: ws-arch-004
    topic: Архитектура и альтернативы
    level: junior
    question: |
      Для какой задачи WebSocket подходит лучше, чем обычные HTTP-запросы?
    options:
      - text: 'Онлайн-игра, где позиции игроков шлются 30 раз в секунду'
        correct: true
        why: 'Частые сообщения в обе стороны с минимальной задержкой — ровно то, для чего WebSocket создан.'
      - text: 'Загрузка картинок товаров в каталоге'
        why: 'Картинки — статика, их выгоднее грузить по HTTP: кэш браузера, CDN, ленивая загрузка.'
      - text: 'Отправка формы регистрации'
        why: 'Разовая операция «запрос — ответ». Обычный HTTP-запрос проще и надёжнее.'
      - text: 'Получение списка статей блога при первом открытии страницы'
        why: 'Разовая загрузка данных — классический HTTP-запрос, его можно кэшировать.'
    explanation: |
      WebSocket выигрывает, когда сообщений много, они идут в обе стороны и важна задержка: чаты, игры,
      совместное редактирование, биржевые котировки. Для разовых запросов он хуже HTTP: нет кэширования, нет
      стандартных кодов ответа, нужно самим следить за соединением. Если сервер только шлёт уведомления, часто
      хватает SSE.

  - id: ws-arch-005
    topic: Архитектура и альтернативы
    level: senior
    question: |
      Что предлагает WebTransport (поверх HTTP/3), чего нет у WebSocket?
    options:
      - text: 'Ненадёжные датаграммы и много независимых потоков'
        correct: true
        why: 'Датаграммы можно терять ради скорости, а потери в одном потоке не задерживают остальные.'
      - text: 'Двунаправленный обмен сообщениями между клиентом и сервером'
        why: 'Двунаправленность есть и у WebSocket — это его главная возможность.'
      - text: 'Работу через HTTP-рукопожатие на стандартных портах'
        why: 'Это умеет и WebSocket: его рукопожатие — обычный HTTP-запрос на порту 80 или 443.'
      - text: 'Передачу двоичных данных, а не только текста'
        why: 'Двоичные сообщения есть и у WebSocket.'
    explanation: |
      WebSocket работает поверх TCP: всё доставляется по порядку, и одна потерянная порция задерживает всё
      следующее (head-of-line blocking). Для игр и видео это плохо — старая позиция игрока уже не нужна.
      WebTransport использует QUIC: можно открыть много независимых потоков и отправлять ненадёжные
      датаграммы. Но он сложнее, и для большинства задач WebSocket по-прежнему хватает.
  - id: ws-arch-006
    topic: Архитектура и альтернативы
    level: middle
    question: |
      Чем long polling хуже WebSocket при частых сообщениях?
    options:
      - text: 'Каждое сообщение требует нового HTTP-запроса с заголовками'
        correct: true
        why: 'После каждого ответа клиент отправляет новый запрос. Заголовки часто весят больше самих сообщений, а между запросами копятся задержки.'
      - text: 'Long polling не проходит через прокси и корпоративные фаерволы'
        why: 'Наоборот, это обычные HTTP-запросы, которые проходят почти везде.'
      - text: 'При long polling сервер не может первым отправить данные клиенту'
        why: 'Может: он держит запрос открытым и отвечает, как только появятся данные. В этом и смысл long polling.'
      - text: 'Long polling нельзя совмещать с авторизацией по cookie'
        why: 'Это обычные HTTP-запросы, cookie уходят с ними как всегда.'
    explanation: |
      Long polling — клиент шлёт запрос, сервер держит его, пока не появятся данные, отвечает, и клиент сразу шлёт
      следующий. Это работает везде, но каждое сообщение стоит целого HTTP-запроса. При одном сообщении в минуту
      разницы почти нет, при десятках в секунду long polling тратит больше трафика и даёт больше задержки.
      Сегодня он в основном служит запасным транспортом, когда WebSocket недоступен.
  # ===================== Библиотеки =====================
  - id: ws-lib-001
    topic: Библиотеки
    level: junior
    question: |
      Бэкенд поднял обычный WebSocket-сервер, а фронтенд подключается к нему через `socket.io-client`. Что будет?
    options:
      - text: 'Соединение не установится: Socket.IO использует свой протокол'
        correct: true
        why: 'Клиент Socket.IO ждёт от сервера пакетов своего протокола (Engine.IO). Чистый WebSocket-сервер их не отправляет.'
      - text: 'Всё заработает, Socket.IO — просто удобная обёртка над WebSocket'
        why: 'Это частое заблуждение. Socket.IO — свой протокол поверх нескольких транспортов, совместимый только с сервером Socket.IO.'
      - text: 'Заработает, но без событий и комнат, только `send` и `message`'
        why: 'Урезанного режима совместимости нет. Без сервера Socket.IO соединение не установится вовсе.'
      - text: 'Заработает, если передать `transports: ["websocket"]`'
        why: 'Транспорт будет WebSocket, но поверх него всё равно пойдёт протокол Socket.IO — сервер его не поймёт.'
    explanation: |
      Socket.IO — это не WebSocket, а свой протокол: пакеты Engine.IO (открытие, ping, сообщения), события,
      подтверждения, пространства имён. Работает он поверх нескольких транспортов. Совместимость работает
      только в паре: клиент Socket.IO ↔ сервер Socket.IO. Наоборот так же: нативный `WebSocket`, подключившись к
      серверу Socket.IO, получит служебный пакет `0{"sid":...}`, а на обычный текст сервер закроет соединение.
    links:
      - https://socket.io/docs/v4/#what-socketio-is-not
  - id: ws-lib-002
    topic: Библиотеки
    level: middle
    question: |
      Каким транспортом по умолчанию начинает соединение клиент Socket.IO v4?
    options:
      - text: 'HTTP long polling, затем переходит на WebSocket'
        correct: true
        why: 'Так соединение появляется даже там, где WebSocket режут прокси или фаерволы, а потом незаметно ускоряется.'
      - text: 'Сразу WebSocket, а long polling только при неудаче'
        why: 'Начать с WebSocket можно настройкой `transports: ["websocket", "polling"]`, но по умолчанию порядок обратный.'
      - text: 'Только WebSocket, других транспортов в v4 нет'
        why: 'Long polling в v4 остался и используется первым по умолчанию.'
      - text: 'Сразу WebTransport, если браузер его поддерживает'
        why: 'WebTransport нужно явно включить на сервере (по умолчанию там только polling и WebSocket) и поднять HTTP/3. Без этого клиент о нём не узнает.'
    explanation: |
      Клиент открывает соединение запросами `GET /socket.io/?EIO=4&transport=polling`, а затем, если получилось,
      переходит на WebSocket. Так соединение появляется быстро и там, где WebSocket режут. Если WebSocket в сети
      пользователей точно доступен, ставят `transports: ["websocket"]`: подключение быстрее, но без запасного пути.
    links:
      - https://socket.io/docs/v4/client-options/#transports
  - id: ws-lib-003
    topic: Библиотеки
    level: middle
    question: |
      Сервер вызвал `socket.disconnect()` для клиента Socket.IO. Что сделает клиент?
    options:
      - text: 'Получит `disconnect` и сам переподключаться не станет'
        correct: true
        why: 'Причина будет `"io server disconnect"`: отключение по решению сервера клиент считает намеренным. Подключиться снова — только вызовом `socket.connect()`.'
      - text: 'Переподключится через 1 секунду, как при любом обрыве сети'
        why: 'Автопереподключение срабатывает при обрывах (`"transport close"`, `"ping timeout"`), но не когда сервер отключил клиента сам.'
      - text: 'Переподключится сразу, без какой-либо задержки'
        why: 'Мгновенного повтора нет ни при каких причинах, а при этой причине повтора нет вовсе.'
      - text: 'Получит `connect_error` и начнёт попытки с растущей задержкой'
        why: '`connect_error` — неудачная попытка подключиться. Здесь же соединение было и было закрыто сервером.'
    explanation: |
      У события `disconnect` в Socket.IO есть причина. При `"io server disconnect"` (сервер выгнал) и
      `"io client disconnect"` (клиент сам вызвал `disconnect()`) автопереподключения нет. При сетевых причинах
      клиент переподключается сам: первая попытка примерно через секунду (±50 %), дальше задержка растёт до 5
      секунд, попыток бесконечно. Частая ошибка — сервер отключает неавторизованного клиента, а фронтенд ждёт, что
      тот переподключится после обновления токена.
    links:
      - https://socket.io/docs/v4/client-socket-instance/#disconnect
  - id: ws-lib-004
    topic: Библиотеки
    level: middle
    question: |
      Соединение Socket.IO оборвалось на 10 секунд, и за это время код трижды вызвал `socket.emit('cursor', pos)`.
      Что будет по умолчанию?
    options:
      - text: 'События накопятся в буфере и уйдут после переподключения'
        correct: true
        why: 'Клиент складывает события, отправленные без соединения, в буфер и отправляет их после восстановления.'
      - text: '`emit` бросит исключение, пока нет соединения'
        why: 'В отличие от нативного `send()` до открытия, `emit` не бросает: события буферизуются.'
      - text: 'События молча потеряются'
        why: 'Так ведут себя «летучие» события `socket.volatile.emit`, а обычный `emit` буферизуется.'
      - text: 'Отправится только последнее событие, остальные заменятся'
        why: 'Буфер не схлопывает события: после переподключения уйдут все три, по порядку.'
    explanation: |
      Буферизация удобна для важных действий, но для частых и быстро устаревающих данных (курсор, позиция в игре)
      она вредна: после переподключения на сервер вывалится пачка старых событий. Для таких данных проверяют
      `socket.connected` перед отправкой или используют `socket.volatile.emit`. Важные сообщения подтверждают
      через ack.
    links:
      - https://socket.io/docs/v4/client-offline-behavior/

  - id: ws-lib-005
    topic: Библиотеки
    level: middle
    question: |
      Как в Socket.IO v4 отправить событие и дождаться ответа сервера не дольше 5 секунд?
    options:
      - text: '`await socket.timeout(5000).emitWithAck("save", data)`'
        correct: true
        why: '`timeout()` задаёт срок, а `emitWithAck` возвращает промис: он выполнится ответом сервера или отклонится по таймауту.'
      - text: '`await socket.emit("save", data, { timeout: 5000 })`'
        why: '`emit` не возвращает промис, а объект станет просто ещё одним аргументом события.'
      - text: '`await socket.timeout(5000).emit("save", data)`'
        why: 'Без колбэка ждать нечего: `emit` возвращает сам сокет, а не промис. Промис даёт `emitWithAck`.'
      - text: '`await socket.request("save", data, 5000)`'
        why: 'Метода `request` у сокета Socket.IO нет.'
    explanation: |
      Подтверждения (acknowledgements) — ответ на конкретное событие. Есть два вида записи: колбэк последним
      аргументом `emit` (с `timeout()` он получает ошибку первым аргументом) и `emitWithAck`, возвращающий промис.
      На сервере обработчик получает функцию `ack` последним аргументом и вызывает её с ответом. Без
      `timeout()` клиент ждал бы ответа вечно, если сервер его не пришлёт.
    links:
      - https://socket.io/docs/v4/emitting-events/#acknowledgements
  - id: ws-lib-006
    topic: Библиотеки
    level: middle
    question: |
      Какие утверждения о комнатах и `socket.id` в Socket.IO верны при настройках по умолчанию?
    options:
      - text: 'Добавить сокет в комнату можно только на сервере'
        correct: true
        why: '`socket.join()` есть только у серверного сокета. Клиент может лишь попросить сервер своим событием.'
      - text: 'Каждый сокет сразу состоит в комнате с именем своего `id`'
        correct: true
        why: 'Поэтому отправить что-то одному клиенту можно через `io.to(socketId).emit(...)`.'
      - text: '`socket.id` меняется после переподключения'
        correct: true
        why: 'Каждое подключение получает новый `id`. Хранить его как идентификатор пользователя нельзя.'
      - text: 'Чтобы получать события комнаты, клиент подписывается на её имя: `socket.on("room-42", …)`'
        why: 'Имя комнаты — не имя события. Клиент получает обычные события, которые сервер разослал через `io.to("room-42").emit(...)`.'
      - text: 'Комнаты сохраняются за клиентом после переподключения'
        why: 'Новое подключение — новый серверный сокет без комнат. Сервер должен снова добавить клиента в нужные комнаты.'
    explanation: |
      Комната в Socket.IO — серверная группа сокетов для рассылки: `io.to("room-42").emit(...)`. Клиент о
      комнатах не знает. Отсюда правило: после каждого подключения (событие `connection` на сервере) заново
      определять, кто это, по токену или сессии, а не по `socket.id`, и заново добавлять в нужные комнаты.
      Восстановление состояния соединения (connection state recovery) в Socket.IO 4.6+ частично это смягчает.
    links:
      - https://socket.io/docs/v4/rooms/
  - id: ws-lib-007
    topic: Библиотеки
    level: senior
    question: |
      Socket.IO раскатили на три экземпляра за балансировщиком с настройками по умолчанию. Клиенты то и дело не
      могут подключиться, а сервер отвечает `400` с сообщением «Session ID unknown». В чём причина?
    options:
      - text: 'Запросы long polling одного клиента попадают на разные экземпляры'
        correct: true
        why: 'Сессия живёт на том экземпляре, где её открыли. Следующий запрос polling попал на другой, и тот такой сессии не знает. Лечится sticky-сессиями или отказом от polling.'
      - text: 'Не подключён Redis-адаптер для обмена событиями между экземплярами'
        why: 'Без адаптера не доходят рассылки между экземплярами, но подключение клиента при этом работает.'
      - text: 'Таймаут простоя на балансировщике меньше `pingInterval` сервера'
        why: 'Тогда через какое-то время рвались бы уже установленные соединения, а не сами подключения с ответом `400`.'
      - text: 'Клиент и сервер Socket.IO разных мажорных версий'
        why: 'Несовместимость версий даёт другую ошибку — «Unsupported protocol version», — и сразу у всех клиентов.'
    explanation: |
      По умолчанию клиент Socket.IO сначала работает через long polling — серию HTTP-запросов с одним id сессии.
      Если балансировщик раскидывает их по разным экземплярам, запросы, попавшие не туда, получают `400 Session ID
      unknown`. Решения: sticky-сессии на балансировщике (по cookie или IP) или `transports: ["websocket"]` на
      клиенте — одно WebSocket-соединение и так живёт на одном экземпляре.
    links:
      - https://socket.io/docs/v4/using-multiple-nodes/
  - id: ws-lib-008
    topic: Библиотеки
    level: middle
    question: |
      Какие утверждения о Node-библиотеке `ws` верны?
    options:
      - text: 'В браузере не работает, там нужен нативный `WebSocket`'
        correct: true
        why: 'В сборке для браузера `ws` прямо бросает ошибку с советом использовать встроенный `WebSocket`.'
      - text: 'Мёртвые соединения сама не обнаруживает, нужен свой ping'
        correct: true
        why: 'В документации есть готовый рецепт: периодически слать ping и закрывать через `terminate()` тех, кто не ответил pong.'
      - text: 'Она сама переподключает клиентов после обрыва связи'
        why: 'Переподключений в `ws` нет ни на сервере, ни в клиенте: это низкоуровневая реализация протокола.'
      - text: 'Умеет рассылать всем клиентам одним вызовом, как комнаты в Socket.IO'
        why: 'Метода рассылки в `ws` нет: всех клиентов обходят сами через `wss.clients`.'
    explanation: |
      `ws` — самая популярная реализация WebSocket для Node: сервер и клиент без лишних абстракций, без комнат,
      подтверждений и переподключений. Браузеры на ping сервера отвечают pong автоматически, поэтому серверный
      heartbeat работает без кода на фронтенде. Кстати, в Node 22 есть и встроенный клиентский `WebSocket`, а
      сервер по-прежнему берут из `ws`.
    links:
      - https://github.com/websockets/ws#how-to-detect-and-close-broken-connections
  - id: ws-lib-009
    topic: Библиотеки
    level: senior
    question: |
      Какой подпротокол WebSocket использует современная библиотека GraphQL-подписок `graphql-ws`?
    options:
      - text: '`graphql-transport-ws`'
        correct: true
        why: 'Это протокол «GraphQL over WebSocket», который реализует `graphql-ws`.'
      - text: '`graphql-ws`'
        why: 'Ловушка: это имя протокола старой заброшенной библиотеки `subscriptions-transport-ws`, а не одноимённой новой.'
      - text: '`graphql-subscriptions`'
        why: 'Так называется другой, ещё более старый вариант протокола той же устаревшей библиотеки.'
      - text: '`apollo-ws`'
        why: 'Такого подпротокола нет. Для подписок Apollo Client рекомендует `GraphQLWsLink` поверх `graphql-ws`.'
    explanation: |
      Путаница историческая. Старая библиотека `subscriptions-transport-ws` говорит по протоколу с именем
      `graphql-ws`. Новая библиотека называется `graphql-ws`, а её протокол — `graphql-transport-ws`. Протоколы
      несовместимы, поэтому подписки «не работают», если клиент и сервер выбрали разные библиотеки: в зависимости
      от сервера либо проваливается рукопожатие, либо соединение открывается и сразу закрывается — у `graphql-ws`
      кодом `4406`, у старой библиотеки кодом `1002`.
    links:
      - https://github.com/enisdenjo/graphql-ws/blob/master/PROTOCOL.md
  - id: ws-lib-010
    topic: Библиотеки
    level: senior
    question: |
      Когда клиент `graphql-ws` с настройками по умолчанию открывает и закрывает соединение?
    options:
      - text: 'Открывает при первой подписке, закрывает без подписок'
        correct: true
        why: 'По умолчанию клиент «ленивый» (`lazy: true`): без активных подписок соединение не держится.'
      - text: 'Открывает при создании клиента и держит, пока страница открыта'
        why: 'Так он работает только при `lazy: false`. По умолчанию соединение появляется лишь с первой подпиской.'
      - text: 'Открывает отдельное соединение на каждую подписку'
        why: 'Все подписки клиента мультиплексируются в одно соединение, у каждой свой `id` в сообщениях.'
      - text: 'Открывает на время каждого запроса и закрывает после ответа'
        why: 'Для подписок это бессмысленно: события приходят в течение всего времени подписки.'
    explanation: |
      `createClient` из `graphql-ws` по умолчанию ленивый: соединение и сообщение `connection_init` появляются
      при первой подписке, а после последней отписки соединение закрывается (`lazyCloseTimeout` по умолчанию 0).
      Это экономит ресурсы, но при частом «подписался — отписался» соединение будет постоянно переоткрываться.
      Тогда помогают `lazy: false` или ненулевой `lazyCloseTimeout`.
    links:
      - https://github.com/enisdenjo/graphql-ws

  - id: ws-lib-011
    topic: Библиотеки
    level: middle
    question: |
      Какие утверждения о `webSocket()` из RxJS верны?
    code: |
      import { webSocket } from 'rxjs/webSocket';

      const socket$ = webSocket('wss://api.example.com/feed');
      socket$.next({ type: 'hello' });
      socket$.subscribe((msg) => console.log('A', msg));
      socket$.subscribe((msg) => console.log('B', msg));
    codeLang: js
    options:
      - text: 'При обрыве подписчики получат `error`, сам Subject не переподключится'
        correct: true
        why: 'Нечистое закрытие RxJS превращает в `error`, а чистое — в `complete`. Переподключение добавляют операторами `retry` или `repeat`.'
      - text: 'Обе подписки используют одно соединение'
        correct: true
        why: 'Subject один, и соединение у него одно. A и B получат одни и те же сообщения.'
      - text: '`{ type: "hello" }` не потеряется и уйдёт после открытия'
        correct: true
        why: 'Сообщения, переданные в `next()` до открытия, Subject копит и отправляет, как только сокет откроется.'
      - text: 'Объект отправится как строка `"[object Object]"`'
        why: 'По умолчанию сообщения сериализуются через `JSON.stringify`, а входящие разбираются через `JSON.parse`.'
      - text: 'Соединение останется открытым после того, как отпишутся оба'
        why: 'Когда отписывается последний подписчик, Subject закрывает сокет.'
    explanation: |
      `WebSocketSubject` из RxJS превращает сокет в Observable/Observer: входящие сообщения — поток, отправка —
      `next()`. Он ленивый, общий для всех подписчиков, буферизует ранние сообщения и по умолчанию работает с
      JSON. Через `multiplex()` поверх одного сокета делают независимые «каналы» с сообщениями
      подписки и отписки. Переподключения нет — его делают операторами `retry` или `repeat`.
    links:
      - https://rxjs.dev/api/webSocket/webSocket
  - id: ws-lib-012
    topic: Библиотеки
    level: senior
    question: |
      Клиент SignalR создан через `new HubConnectionBuilder().withUrl('/hub').withAutomaticReconnect().build()`.
      Какие утверждения о переподключении верны?
    options:
      - text: 'Первая попытка — сразу после обрыва'
        correct: true
        why: 'Первая задержка в политике по умолчанию — 0 мс, дальше 2, 10 и 30 секунд.'
      - text: 'После четырёх неудачных попыток клиент перестанет пытаться'
        correct: true
        why: 'Задержек по умолчанию четыре. После них соединение переходит в состояние Disconnected и срабатывает `onclose`.'
      - text: 'Во время попыток срабатывает `onreconnecting`, после успеха — `onreconnected`'
        correct: true
        why: 'Эти колбэки позволяют показать пользователю «переподключаемся» и восстановить состояние после успеха.'
      - text: 'Попытки идут бесконечно, задержка растёт до 30 секунд'
        why: 'Бесконечных попыток по умолчанию нет: после четвёртой клиент сдаётся. Бесконечность настраивается своей политикой.'
      - text: 'Без `withAutomaticReconnect()` клиент тоже переподключается, только реже'
        why: 'Без этого вызова автоматического переподключения нет вовсе: после обрыва сразу срабатывает `onclose`.'
    explanation: |
      В SignalR автопереподключение включается явно через `withAutomaticReconnect()`. Задержки можно передать
      массивом или своей политикой. При подключении клиент сначала делает запрос `negotiate` и выбирает транспорт:
      WebSocket, затем Server-Sent Events, затем long polling, если предыдущий недоступен.
    links:
      - https://learn.microsoft.com/en-us/aspnet/core/signalr/javascript-client
