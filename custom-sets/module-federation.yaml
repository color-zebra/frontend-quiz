    options:
      - text: 'Во фрейме со страницей калькулятора, общение через `postMessage`'
        why: 'Окно не выйдет за рамку фрейма. А изоляция от собственного, доверенного кода здесь и не нужна.'
      - text: 'Веб-компонентом: скрипт регистрирует свой тег для вставки в разметку'
        correct: true
        why: 'Тег работает и в кабинете на React, и в разметке партнёра, а окно элемента перекрывает страницу: он живёт в ней.'
      - text: 'npm-пакетом, который кабинет и партнёры собирают вместе со своим кодом'
        why: 'Партнёрам понадобятся программист и своя сборка, а новые версии дойдут до людей только с их выкатками.'
      - text: 'Сборкой на сервере: калькулятор приходит готовым фрагментом HTML в страницу'
        why: 'Страницы партнёров собираются не на вашем сервере, а калькулятор всё равно оживёт только скриптом в браузере.'
    explanation: |
      Контрастная пара к чужому коду: здесь код свой и доверенный, поэтому стена iframe не нужна, а её цена — окна
      в рамке фрейма — мешает. Веб-компонент — свой HTML-тег со стандартным контрактом: его вставляют в разметку
      на любой странице и с любым фреймворком, а живёт он прямо в странице. Внутри элемент может быть написан хоть
      на Vue.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/Web_components/Using_custom_elements

  - id: mf-073
    topic: Способы встраивания
    level: senior
    question: |
      В админке SaaS-сервиса пять команд делят одну страницу. Все части на React 18, каждая команда хочет
      выкатываться сама, страница должна грузить одну копию React, а модальные окна частей — перекрывать весь экран.
      В админку входят по паролю, поисковики её не видят, а первый экран можно показать после загрузки скриптов.
      Какой способ встраивания предпочтительнее?
    options:
      - text: 'Каждая часть — во фрейме, общение через `postMessage`'
        why: 'Окна не выйдут за рамку фрейма, а React в каждом фрейме загрузится свой.'
      - text: 'Части — npm-пакеты, которые собирает оболочка'
        why: 'Одна копия React и общие окна будут, а независимых выкаток — нет.'
      - text: 'Сборка страницы на сервере из фрагментов, которые потом оживают в браузере'
        why: 'Фрагменты могут делить React, но серверная сборка окупается поисковиками и быстрым первым показом, а здесь их нет.'
      - text: 'Встраивание через JavaScript с общим React, например Module Federation'
        correct: true
        why: 'Части в одной странице: окна перекрывают экран, React делится, выкатки независимы.'
    explanation: |
      Условия отсекают варианты по одному: iframe — из-за окон и копий React, пакеты — из-за выкаток, серверная
