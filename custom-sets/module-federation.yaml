      - text: '`@module-federation/vite` — официальный плагин на рантайме 2.0, совместимый с webpack и Rspack'
        correct: true
        why: 'Старый сторонний плагин плохо работал вместе с webpack-remote. Новый использует общий рантайм.'
      - text: '`@originjs/vite-plugin-federation` — официальный, а `@module-federation/vite` — экспериментальный'
        why: 'Наоборот.'
      - text: '`@module-federation/vite` работает только в режиме разработки'
        why: 'Он используется и для продакшен-сборок.'
    explanation: |
      Официальный плагин поддерживает те же возможности, что и другие сборщики Module Federation 2.0: манифест, типы
      (`dts`), рантайм-плагины. Поэтому хост на webpack может подключать remote на Vite и наоборот.
    links:
      - https://module-federation.io/integrations/build-tool/vite.html

  - id: mf-042
    topic: Сборщики
    level: middle
    multiple: true
    question: |
      Хост грузит `remoteEntry.js` с `https://cdn.shop.com`, а чанки модулей remote запрашиваются с адреса хоста и
      получают 404. Как исправить, сохранив независимый деплой?
    options:
      - text: 'Задать у remote `publicPath: "auto"` или свой `base`'
        correct: true
        why: 'Тогда remote ищет свои чанки рядом со своим входом, а не на домене хоста.'
      - text: 'Скопировать чанки remote на сервер хоста'
        why: 'Работать будет, но каждый деплой remote потребует деплоя хоста.'
      - text: 'Включить у хоста `eager: true` для всех общих зависимостей'
        why: '`eager` к адресам чанков отношения не имеет.'
      - text: 'Добавить remote в `shared` хоста'
        why: '`shared` — для библиотек, а не для remote.'
    explanation: |
      Чанки remote грузятся относительно его `publicPath`. Если он указан как `/`, браузер запросит их с текущего
      домена — домена хоста. Значение `auto` в webpack вычисляет путь по адресу загруженного скрипта. В Vite для
      этого задают относительный `base` (например, `'./'`) или полный адрес CDN.
    links:
      - https://module-federation.io/integrations/build-tool/vite.html
      - https://webpack.js.org/plugins/module-federation-plugin

  - id: mf-043
    topic: Сборщики
    level: middle
    question: |
      До рантайма 2.0 как на webpack подставляли адрес remote из конфига окружения без пересборки хоста?
    options:
      - text: 'Promise-based remotes: в `remotes` пишут промис, который сам грузит вход по адресу из окружения'
        correct: true
        why: 'Строка вида `promise new Promise(...)` описана в документации webpack.'
      - text: 'Плагин `external-remotes-plugin` с подстановкой вида `remote@[window.remoteUrl]/remoteEntry.js`'
        correct: true
        why: 'Плагин подставляет значение глобальной переменной в рантайме.'
      - text: 'Переменные окружения `process.env` подставлялись при каждой загрузке страницы'
        why: '`process.env` вшивается при сборке — для смены адреса нужна пересборка.'
      - text: 'Адрес можно было задать только при сборке хоста'
        why: 'Были способы: промис в `remotes` или подстановка глобальной переменной плагином.'
    explanation: |
      Ещё один классический способ из документации webpack — Dynamic Remote Containers: вручную вставить тег script
      с входом, вызвать `__webpack_init_sharing__` и `container.init`, а затем `container.get`. Сейчас то же самое
      делают через рантайм: регистрируют remote с адресом из конфига окружения.
    links:
      - https://webpack.js.org/concepts/module-federation/

  # ===================== Ошибки и отказоустойчивость =====================
  - id: mf-044
    topic: Ошибки и отказоустойчивость
    level: junior
    multiple: true
    question: |
      Компонент из remote подключён через `React.lazy` и обёрнут только в `Suspense`. Сервер remote недоступен. Что
      произойдёт?
    options:
      - text: '`Suspense` будет показывать fallback бесконечно'
        why: 'Промис не висит — он отклоняется с ошибкой.'
      - text: 'Ошибка поднимется до корня, и React размонтирует всё приложение'
        correct: true
        why: '`Suspense` ждёт загрузку, но не ловит ошибки. Их ловит только `ErrorBoundary`, а его здесь нет.'
      - text: 'React молча не отрисует этот компонент'
        why: 'Ошибка не глотается — она идёт вверх по дереву.'
      - text: 'Рантайм федерации сам покажет заглушку'
        why: 'Только если вы настроили это в хуке `errorLoadRemote`.'
    explanation: |
      Обычный рецепт: каждый remote оборачивают в `ErrorBoundary` с запасным интерфейсом и в `Suspense` для
      ожидания. Тогда упавший микрофронтенд ломает только свой кусок страницы.
    links:
      - https://react.dev/reference/react/lazy
      - https://module-federation.io/blog/error-load-remote

  - id: mf-045
    topic: Ошибки и отказоустойчивость
    level: middle
    question: |
      Как обработать недоступность remote на уровне рантайма федерации, а не React?
    options:
      - text: 'Через хук `errorLoadRemote` в плагине рантайма'
        correct: true
        why: 'Хук получает этап, на котором случилась ошибка, и может вернуть запасной компонент или адрес.'
      - text: 'Обернуть `loadRemote` в `setTimeout`'
        why: 'Задержка не обрабатывает ошибку.'
      - text: 'Указать remote в `shared` с `eager: true`'
        why: 'Remote не кладут в `shared`.'
      - text: 'Включить `strictVersion` у всех общих зависимостей'
        why: '`strictVersion` касается версий библиотек, а не доступности remote.'
    explanation: |
      Слои защиты: сеть — `@module-federation/retry-plugin` для повторов; загрузка — `errorLoadRemote` (этап
      `onLoad` для модулей, `afterResolve` для манифеста, `beforeLoadShare` для входов при `version-first`);
      рендер — `ErrorBoundary`. Их можно комбинировать.
    links:
      - https://module-federation.io/blog/error-load-remote
      - https://module-federation.io/plugin/plugins/retry-plugin.html

  - id: mf-046
    topic: Ошибки и отказоустойчивость
    level: middle
    question: |
      Что может привести к ошибкам загрузки входа remote (RUNTIME-001 «Failed to get remoteEntry exports» или
      RUNTIME-008 «Failed to load script resources»)?
    options:
      - text: 'Неверный адрес или 404 у `remoteEntry.js`'
        correct: true
        why: 'Самая частая причина — проверьте адрес и что файл действительно выложен.'
      - text: 'Вход в формате ES-модуля отдаётся с другого домена без CORS-заголовков'
        correct: true
        why: 'Обычному `<script>` CORS не нужен, а `import()` ES-модуля с другого домена браузер без заголовков заблокирует.'
      - text: 'Вход в формате ES-модуля загружают как обычный скрипт'
        correct: true
        why: 'Для таких remote нужен `type: "module"`.'
      - text: 'Слишком большое число общих зависимостей'
        why: 'Количество общих зависимостей на загрузку входа не влияет.'
      - text: 'Remote написан на TypeScript'
        why: 'В браузер приходит уже собранный JavaScript.'
    explanation: |
      У RUNTIME-008 два вида: ошибка сети (404, таймаут, CORS) — помогают повторы; ошибка выполнения (файл скачался,
      но упал при запуске, например из-за синтаксиса, который браузер не поддерживает) — повторы не помогут.
    links:
      - https://module-federation.io/guide/troubleshooting/runtime

  # Проверено на стенде
  - id: mf-047
    topic: Ошибки и отказоустойчивость
    level: senior
    question: |
      Remote с классическим входом называется `name: 'remote'`. На странице хоста есть `<div id="remote">`. Хост
      падает с «The remote entry interface does not contain "init"». Почему?
    options:
      - text: '`window.remote` указывает на DOM-элемент, и рантайм принимает его за контейнер'
        correct: true
        why: 'Элементы с `id` доступны как свойства `window`. Рантайм видит занятое имя и ищет `init` у div.'
      - text: 'Рантайм запрещает имена контейнеров из одного слова'
        why: 'Таких ограничений нет.'
      - text: 'У remote не указан `exposes`'
        why: 'Тогда была бы ошибка про отсутствующий модуль.'
      - text: 'Версии React у хоста и remote разные'
        why: 'Версии зависимостей к `init` контейнера не относятся.'
    explanation: |
      Это ошибка RUNTIME-002. Классический вход кладёт контейнер в глобальную переменную с именем `name`, и рантайм
      сначала проверяет, не занято ли это имя. Если там уже лежит что-то другое (элемент с таким `id`, чужой
      скрипт), загрузка ломается. Документация советует проверить `window[remoteEntryKey]` и переименовать контейнер.
      Если два remote случайно назвать одинаково, второй может получить контейнер первого.
    links:
      - https://module-federation.io/guide/troubleshooting/runtime

  - id: mf-065
    topic: Ошибки и отказоустойчивость
    level: middle
    question: |
      Хост подключает remote с чужого CDN. Чем рискует хост с точки зрения безопасности?
    options:
      - text: 'Ничем: код remote работает в песочнице, как в iframe'
        why: 'Песочницы нет: код remote выполняется прямо на странице хоста.'
      - text: 'Код remote выполняется с правами страницы хоста'
        correct: true
        why: 'Ему доступны DOM, cookie без `HttpOnly`, localStorage с токенами. Подмена файла на CDN — подмена кода хоста.'
      - text: 'Только тем, что remote может замедлить загрузку страницы'
        why: 'Скорость — меньшая из проблем.'
      - text: 'Рискует, только если remote написан не на React'
        why: 'Фреймворк не важен: важно, откуда и чей код выполняется.'
    explanation: |
      Поэтому remote подключают только из доверенных источников под своим контролем, ограничивают источники
      скриптов через Content Security Policy и не хранят чувствительное там, куда дотянется любой скрипт страницы.
      Это главное отличие от iframe с другого домена, где код изолирован.
    links:
      - https://webpack.js.org/concepts/module-federation/

  # ===================== Роутинг, состояние, стили =====================
  - id: mf-048
    topic: Роутинг, состояние, стили
    level: junior
    question: |
      Кто должен владеть адресной строкой, когда хост и микрофронтенды используют роутинг?
    options:
      - text: 'Каждый микрофронтенд со своим `BrowserRouter` на весь адрес'
        why: 'Несколько роутеров слушают одну историю и мешают друг другу.'
      - text: 'Хост, а микрофронтенд — под базовым путём'
        correct: true
        why: 'Микрофронтенд не знает, где он встроен, и работает относительно базового пути, который дал хост.'
      - text: 'Никто: в микрофронтендах роутинг использовать нельзя'
        why: 'Можно — нужно договориться о границах.'
      - text: 'Последний загруженный микрофронтенд'
        why: 'Владелец адреса не должен зависеть от порядка загрузки.'
    explanation: |
      Хост определяет, на каком пути живёт микрофронтенд, и передаёт базовый путь. Внутри него микрофронтенд
      сам управляет своими экранами. Так можно перенести микрофронтенд на другой путь, не меняя его код.
    links:
      - https://module-federation.io/guide/bridge/react/load-app

  - id: mf-049
    topic: Роутинг, состояние, стили
    level: middle
    question: |
      Микрофронтенд встраивается как виджет внутрь страницы другого микрофронтенда, у которого свой роутер. Какой
      роутер лучше дать виджету?
    options:
      - text: '`BrowserRouter`, чтобы у виджета были свои адреса'
        why: 'Два роутера на одну адресную строку будут спорить за неё.'
      - text: '`MemoryRouter`: навигация живёт в памяти и не трогает адрес'
        correct: true
        why: 'Виджет переключает свои экраны, а адресом владеет страница вокруг.'
      - text: '`HashRouter`, чтобы не конфликтовать с основным адресом'
        why: 'Хеш — тоже часть адреса, конфликт останется.'
      - text: 'Роутер не нужен, экраны виджета переключаются перезагрузкой страницы'
        why: 'Перезагрузка сбросит состояние всей страницы, а не только виджета.'
    explanation: |
      Минус `MemoryRouter`: состояние виджета не сохраняется в адресе — им нельзя поделиться ссылкой, а кнопка
      «Назад» браузера его не переключает. Для виджетов внутри чужой страницы это обычно приемлемо.
    links:
      - https://module-federation.io/guide/bridge/react/load-app

  - id: mf-050
    topic: Роутинг, состояние, стили
    level: middle
    question: |
      Какие способы обмена данными сохраняют независимость микрофронтендов?
    options:
      - text: 'Пропсы и колбэки от хоста'
        correct: true
        why: 'Самая слабая связность: микрофронтенд получает готовое и не знает об устройстве хоста.'
      - text: 'События через `window` (`CustomEvent`)'
        correct: true
        why: 'Подходит для слабосвязанных уведомлений между независимыми частями.'
      - text: 'Параметры адреса'
        correct: true
        why: 'Состояние в адресе видно всем и переживает перезагрузку.'
      - text: 'Один общий стор, в который пишут все микрофронтенды'
        why: 'Работает, но все начинают зависеть от формы состояния и версии библиотеки — независимость теряется.'
      - text: 'Прямой импорт внутренних модулей друг друга в обход `exposes`'
        why: 'Так нельзя: снаружи доступно только то, что выставлено.'
    explanation: |
      Хорошее правило: значения — пропсами, действия — колбэками. Например, хост открывает свою панель, а
      микрофронтенд только вызывает функцию `openPanel(id)`. Тогда каждый держит своё состояние у себя.
    links:
      - https://webpack.js.org/concepts/module-federation/

  - id: mf-051
    topic: Роутинг, состояние, стили
    level: senior
    question: |
      У хоста и remote свои Redux-сторы. Общими сделаны только `react` и `react-dom`, а `react-redux` 8.1+ каждый
      привозит свой. Всё приложение хоста обёрнуто в его `Provider`. Хост передаёт в remote свой компонент с
      `useSelector`, и remote рисует его внутри своего `Provider`. Какой стор увидит компонент?
    options:
      - text: 'Стор remote: обе копии берут один объект контекста, и ближе провайдер remote'
        correct: true
        why: 'С 8.1 `react-redux` хранит контекст в `globalThis` по ключу на React. React общий — значит, и контекст общий.'
      - text: 'Стор хоста: у каждой копии `react-redux` свой контекст'
        why: 'Так было до 8.1 и так бывает со своими `createContext`. Начиная с 8.1 копии делят один контекст.'
      - text: 'Никакой: компонент упадёт, не найдя контекст'
        why: 'Над компонентом есть провайдеры с тем же объектом контекста — найдёт ближайший.'
      - text: '«Invalid hook call», потому что React дважды'
        why: 'React здесь общий, вопрос только в контексте.'
    explanation: |
      Поиск контекста в React идёт по объекту контекста. Обычно у каждой копии библиотеки свой `createContext`, и
      провайдер одной копии не перекрывает другую. Но `react-redux` с версии 8.1 специально держит контекст в
      `globalThis` (ключ `Symbol.for('react-redux-context')`, внутри — по экземпляру React), чтобы копии его делили.
      Поэтому провайдер remote перекрывает провайдер хоста, и компонент хоста молча читает чужой стор — без ошибок.

      Защита — обернуть компонент в `Provider` со стором хоста перед передачей: ближайшим станет провайдер хоста.
      Сверено по исходникам `react-redux` 8.1.3 (`components/Context.ts`).
    links:
      - https://react.dev/reference/react/useContext
      - https://module-federation.io/configure/shared

  - id: mf-052
    topic: Роутинг, состояние, стили
    level: junior
    question: |
      Как изолировать стили микрофронтендов друг от друга?
    options:
      - text: 'CSS Modules или префиксы классов'
        correct: true
        why: 'Имена классов уникальны, правила одного микрофронтенда не задевают другой.'
      - text: 'Shadow DOM для полностью изолированного виджета'
        correct: true
        why: 'Стили не проникают внутрь и не вытекают наружу. Цена — сложности с порталами и общей темой.'
      - text: 'Глобальные стили каждого микрофронтенда с `!important`'
        why: 'Это эскалация конфликтов, а не изоляция.'
      - text: 'Делать CSS общей зависимостью singleton'
        why: '`shared` делит JavaScript-модули, к изоляции стилей это не относится.'
    explanation: |
      Частая проблема — глобальные стили и сбросы (reset), которые микрофронтенд приносит с собой: они меняют вид
      всей страницы. Отдельная беда — разные версии UI-кита у разных микрофронтендов с глобальными классами.
    links:
      - https://webpack.js.org/concepts/module-federation/

  - id: mf-066
    topic: Роутинг, состояние, стили
    level: middle
    question: |
      Компонент из remote на мгновение показывается без стилей, а потом «встаёт на место». Почему?
    options:
      - text: 'Стили модуля подключаются отдельно и применяются позже разметки'
        correct: true
        why: 'Например, CSS вставляется в документ только при выполнении модуля или грузится запросом, которого загрузчик не ждёт.'
      - text: 'Браузер блокирует стили с других доменов'
        why: 'Стили с другого домена браузер применяет; CORS для них не нужен.'
      - text: 'Стили remote всегда применяются только после второго рендера'
        why: 'Порядок рендеров тут ни при чём — важно, когда загрузился CSS.'
      - text: 'Хост сначала рисует свою версию компонента, а потом подменяет'
        why: 'Хост ничего не подменяет — он рисует то, что пришло из remote.'
    explanation: |
      Это мигание без стилей (FOUC). В webpack с `mini-css-extract-plugin` загрузка чанка ждёт и его CSS, поэтому там
      мигания обычно нет; чаще его видят с remote на Vite и со стилями, которые вставляет JavaScript. Лечится тем, что
      модуль показывают только после загрузки его стилей:
      CSS-in-JS со стилями в самом модуле, предзагрузка ресурсов модуля (`preloadRemote` с `resourceCategory: 'all'`)
      или ожидание стилей перед показом.
    links:
      - https://module-federation.io/guide/runtime/runtime-api

  # ===================== Деплой и производительность =====================
  - id: mf-053
    topic: Деплой и производительность
    level: junior
    multiple: true
    question: |
      После деплоя remote часть пользователей ещё долго видит старую версию. Как настроить кэширование, чтобы
      обновления доходили сразу и без лишнего трафика?
    options:
      - text: 'Отдавать `remoteEntry.js` без долгого кэша'
        correct: true
        why: 'Вход должен всегда приходить свежим, иначе он ссылается на старые чанки.'
      - text: 'Отдавать чанки с хешем в имени и долгим кэшем'
        correct: true
        why: 'Новая сборка — новые имена, старые закэшированные файлы не мешают.'
      - text: 'Отключить кэш у всех файлов remote'
        why: 'Обновления дойдут, но каждый пользователь будет заново качать всё — лишний трафик.'
      - text: 'Добавлять номер версии remote в `shared`'
        why: '`shared` не управляет кэшированием.'
    explanation: |
      Схема как у обычного SPA: точка входа без кэша, файлы с хешем — надолго. Манифест, если он используется,
      тоже отдают без долгого кэша.
    links:
      - https://module-federation.io/configure/remotes

  - id: mf-054
    topic: Деплой и производительность
    level: junior
    question: |
      Что чаще всего делает систему на Module Federation медленнее монолита?
    options:
      - text: 'Дубли библиотек и цепочка загрузок'
        correct: true
        why: 'Библиотеки вне `shared` приезжают с каждым remote, а модуль появляется только после загрузки входа.'
      - text: 'Рантайм заново выполняет модуль при каждом импорте'
        why: 'Модуль выполняется один раз, дальше берётся из кэша.'
      - text: 'Общие зависимости по умолчанию лежат в стартовом бандле'
        why: 'По умолчанию они грузятся асинхронно, в стартовый бандл их кладёт `eager`.'
      - text: 'Браузер не кэширует файлы с других доменов'
        why: 'Кэширует при правильных заголовках.'
    explanation: |
      Лечение: договориться о списке общих библиотек и их версиях; предзагружать remote заранее (`preloadRemote`,
      манифест); не дробить приложение на слишком мелкие remote.
    links:
      - https://module-federation.io/guide/runtime/runtime-api

  - id: mf-055
    topic: Деплой и производительность
    level: junior
    question: |
      Remote нужно поменять API выставленного компонента так, что старый хост сломается. Как выкатить без поломки?
    options:
      - text: 'Выкатить remote, а хост обновить в тот же день'
        why: 'Между двумя деплоями хост будет сломан у пользователей.'
      - text: 'Выставить `./ProductV2` рядом со старым'
        correct: true
        why: 'Старый хост работает со старым модулем, новый — с новым. Когда хост переехал, старый модуль убирают.'
      - text: 'Обновить версию remote в `package.json`'
        why: 'Хост не зависит от версии remote в `package.json`.'
      - text: 'Включить у хоста `strictVersion`'
        why: '`strictVersion` касается общих библиотек, а не модулей remote.'
    explanation: |
      Это стратегия «расширить и сузить» (expand and contract): сначала добавить новое рядом со старым, потом
      перевести потребителей, потом удалить старое. Типы из `dts` и контрактные тесты помогают заметить поломку
      заранее.
    links:
      - https://module-federation.io/configure/dts

  # ===================== Архитектура и альтернативы =====================
  - id: mf-056
    topic: Архитектура и альтернативы
    level: junior
    question: |
      Когда Module Federation скорее не нужна?
    options:
      - text: 'Небольшая команда, один продукт, релизы и так выходят вместе'
        correct: true
        why: 'Микрофронтенды дают независимые релизы ценой сложности. Если релизы общие, остаётся только сложность.'
      - text: 'Несколько команд, которым нужны независимые релизы'
        why: 'Это как раз сценарий, ради которого её выбирают.'
      - text: 'Большая платформа с десятками разделов от разных команд'
        why: 'Тоже типичный сценарий для микрофронтендов.'
      - text: 'Переезд со старого сборщика по частям'
        why: 'Federation помогает переезжать постепенно: части на разных сборщиках живут вместе.'
    explanation: |
      Цена Module Federation: договорённости о версиях общих библиотек, контракты между командами, сложнее
      отладка и тестирование, риск дублей. Платить её стоит, когда независимость команд важнее.
    links:
      - https://webpack.js.org/concepts/module-federation/

  - id: mf-057
    topic: Архитектура и альтернативы
    level: middle
    question: |
      Чем встраивание через iframe с другого домена отличается от Module Federation?
    options:
      - text: 'Iframe изолирует стили, глобальные переменные и необработанные ошибки'
        correct: true
        why: 'Страница внутри iframe — отдельный документ со своим окном.'
      - text: 'Через iframe сложнее модалки поверх всей страницы и подгонка высоты'
        correct: true
        why: 'Содержимое iframe не выходит за его рамки, размер приходится синхронизировать вручную.'
      - text: 'С iframe с другого домена обмен данными идёт через `postMessage`'
        correct: true
        why: 'Прямых вызовов функций и пропсов между разными origin нет.'
      - text: 'Module Federation изолирует ошибки лучше, чем iframe'
        why: 'Наоборот: код remote работает в той же странице, и его ошибка может уронить хост.'
      - text: 'Iframe позволяет делить React между хостом и встроенным приложением'
        why: 'У iframe своё окно, React в нём всегда свой.'
    explanation: |
      Iframe выбирают, когда важнее изоляция и независимость стеков (например, встраивание редактора со своей
      сборкой). Module Federation — когда важны общая вёрстка, передача компонентов и общие библиотеки. Если iframe
      с того же origin, родитель может напрямую обращаться к его окну, и изоляция слабее.
    links:
      - https://webpack.js.org/concepts/module-federation/

  - id: mf-058
    topic: Архитектура и альтернативы
    level: middle
    question: |
      Какие подходы дают независимый деплой частей фронтенда?
    options:
      - text: 'Module Federation'
        correct: true
        why: 'Каждый remote деплоится сам, хост подхватывает новую версию в рантайме.'
      - text: 'iframe'
        correct: true
        why: 'Встроенная страница деплоится независимо.'
      - text: 'single-spa с отдельно собранными приложениями'
        correct: true
        why: 'Оркестратор подгружает приложения по отдельности, даже на разных фреймворках.'
      - text: 'Общие npm-пакеты, которые подключаются при сборке'
        why: 'Новая версия пакета требует пересборки и деплоя потребителя.'
      - text: 'Монорепозиторий с общей сборкой'
        why: 'Одна сборка — один деплой.'
    explanation: |
      Ещё один подход — нативные ES-модули и import maps (например, Native Federation): браузер сам сопоставляет
      имена модулей с адресами. Выбор зависит от того, нужны ли общие библиотеки, изоляция и разные фреймворки.
    links:
      - https://webpack.js.org/concepts/module-federation/

  - id: mf-059
    topic: Архитектура и альтернативы
    level: junior
    question: |
      Зачем remote иметь собственную HTML-страницу и точку входа, если его всё равно встраивают в хост?
    options:
      - text: 'Чтобы запускать и отлаживать его отдельно, без хоста'
        correct: true
        why: 'Команда remote работает над своей частью, не поднимая всю систему.'
      - text: 'Без своей страницы `remoteEntry.js` не соберётся'
        why: 'Вход контейнера собирается и без HTML-страницы.'
      - text: 'Хост загружает HTML-страницу remote вместо его входа'
        why: 'Хост загружает JavaScript-вход, а не страницу.'
      - text: 'Чтобы поисковики индексировали remote отдельно'
        why: 'К поиску это отношения не имеет.'
    explanation: |
      Отдельный запуск упрощает разработку и тесты. Цена — remote должен уметь работать без хоста: иметь свои
      копии общих библиотек (поэтому `import: false` мешает такому запуску) и заглушки для того, что обычно даёт хост.
    links:
      - https://module-federation.io/guide/start/quick-start

  - id: mf-060
    topic: Архитектура и альтернативы
    level: junior
    question: |
      Как тестировать систему на Module Federation?
    options:
      - text: 'Юнит-тесты каждого remote отдельно'
        correct: true
        why: 'Каждая часть проверяется сама по себе, быстро и без остальной системы.'
      - text: 'Контрактные тесты API между хостом и remote'
        correct: true
        why: 'Ловят несовпадение имён модулей и пропсов раньше, чем это увидят пользователи.'
      - text: 'Сквозные тесты собранной системы на стенде'
        correct: true
        why: 'Ловят проблемы склейки: версии библиотек, роутинг, стили.'
      - text: 'Снапшот-тесты содержимого `remoteEntry.js`'
        why: 'Файл меняется при каждой сборке — такой тест ничего не проверяет.'
      - text: 'Подключать настоящие remote вместо моков в каждом юнит-тесте хоста'
        why: 'Медленно и нестабильно, это задача сквозных тестов.'
    explanation: |
      Каждый вид тестов ловит своё: юнит-тесты — поломки внутри части, контрактные — расхождения API между
      частями, сквозные — проблемы склейки. Ни один из них не заменяет остальные.
    links:
      - https://module-federation.io/guide/runtime/runtime-hooks.html
