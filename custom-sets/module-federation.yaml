        why: 'Код remote грузится асинхронно в обоих случаях.'
      - text: 'Тем, где задан адрес: в конфиге сборки или в рантайме'
        correct: true
        why: 'Динамические позволяют брать адреса из конфига окружения и не пересобирать хост под каждый стенд.'
      - text: 'Статические — на webpack, динамические — на Vite'
