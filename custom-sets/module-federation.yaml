    question: |
      Хост вызывает `loadRemote('shop/Cart')` в двух разных местах. Сколько раз модуль скачается и выполнится?
    options:
      - text: 'Дважды: каждый вызов загружает и выполняет модуль заново'
        why: 'Рантайм кэширует загруженные модули, как обычный загрузчик модулей.'
      - text: 'Скачается дважды, но выполнится один раз'
        why: 'И скачивание, и выполнение происходят один раз.'
      - text: 'Один раз: второй вызов получит тот же экземпляр модуля'
        correct: true
        why: 'Модуль выполняется один раз, и всё его состояние на уровне модуля общее для обоих мест.'
      - text: 'Зависит от того, указан ли модуль в `shared`'
