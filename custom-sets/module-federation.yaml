      - text: 'Загрузка remote упадёт из-за несовпадения версии'
        why: 'Без `strictVersion` это только предупреждение.'
    explanation: |
      Работать будет, но в консоли висит предупреждение, которое легко принять за шум и пропустить настоящее.
      Лечится единым диапазоном версий: `^18.2.0` в `package.json` или явный `requiredVersion`. Опаснее та же схема
      с мажорной разницей: remote сядет на чужой мажор, отделавшись тем же предупреждением.
    links:
      - https://module-federation.io/configure/shared

  # ===================== Асинхронная граница =====================
  - id: mf-028
    topic: Асинхронная граница
    level: junior
    question: |
      Зачем в приложении с Module Federation файл `index.js` содержит только строку `import('./bootstrap')`, а весь код
      лежит в `bootstrap.js`?
    options:
      - text: 'Чтобы рантайм успел договориться о версиях'
        correct: true
        why: 'Пока грузится динамический импорт, рантайм собирает версии общих зависимостей и решает, какую копию отдать.'
      - text: 'Чтобы уменьшить размер `index.js` для быстрой загрузки'
        why: 'Выигрыш в размере — побочный эффект, а не цель.'
      - text: 'Чтобы `bootstrap.js` можно было закэшировать отдельно'
        why: 'Кэширование тут ни при чём.'
      - text: 'Это требование React 18 для `createRoot`'
        why: 'React такого не требует, это требование федерации.'
    explanation: |
      Код приложения синхронно импортирует общие зависимости (`import React from 'react'`). Если он запустится сразу,
      рантайм ещё не знает, какую копию React отдать. Динамический импорт создаёт асинхронную границу: сначала
      договорились, потом выполнили код. Альтернативы — `eager: true` у зависимостей (раздувает стартовый файл) или
      опция `experiments.asyncStartup` в `@module-federation/enhanced`, которая добавляет асинхронную границу сама.
    links:
      - https://module-federation.io/guide/troubleshooting/runtime

  # Проверено на стенде
  - id: mf-029
    topic: Асинхронная граница
    level: senior
    question: |
      В приложении на `@module-federation/enhanced` убрали `bootstrap.js` и синхронно импортировали общую
      зависимость прямо во входном файле. Какая ошибка появится в браузере?
    options:
      - text: '«Shared module is not available for eager consumption»'
        why: 'Это текст встроенного плагина webpack. Рантайм Module Federation 2.0 сообщает иначе.'
      - text: 'RUNTIME-006: «Invalid loadShareSync function call»'
        correct: true
        why: 'Рантайм 2.0 пытается синхронно отдать общую зависимость, которая ещё не загружена.'
      - text: '«Invalid hook call»'
        why: 'Эта ошибка про две копии React, а не про асинхронную границу.'
      - text: 'Ошибки не будет: рантайм 2.0 сам добавляет асинхронную границу'
        why: 'Сам не добавляет: для этого есть опция `experiments.asyncStartup`, и по умолчанию она выключена.'
    explanation: |
      Это одна и та же проблема с разными текстами: у встроенного `ModuleFederationPlugin` webpack — «Shared module
      is not available for eager consumption», у рантайма 2.0 — RUNTIME-006 с подсказкой «check whether an async
      boundary is implemented». В документации этот случай описан как RUNTIME-005, но на стенде (webpack +
      `@module-federation/enhanced` 2.9) пришёл именно RUNTIME-006. По тексту ошибки видно, какой плагин стоит в
      проекте. Лечение: асинхронная граница (`import('./bootstrap')`), `eager: true` у зависимости или
      `experiments.asyncStartup` в `@module-federation/enhanced`.
    links:
      - https://module-federation.io/guide/troubleshooting/runtime

  # ===================== Рантайм =====================
  - id: mf-030
