    options:
      - text: 'Через `createInstance({ name, remotes })`'
        correct: true
        why: 'Это рекомендуемый способ. Методы `loadRemote` и `registerRemotes` вызываются у экземпляра.'
      - text: 'Через `new ModuleFederationPlugin(...)` прямо в браузере'
        why: 'Плагин — часть сборщика, в браузере его нет.'
