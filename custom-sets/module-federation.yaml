        why: 'Так рантайм не создаётся и общие зависимости не договорятся.'
      - text: 'Просто вызвать `loadRemote` — экземпляр создастся сам'
        why: 'Без плагина и без экземпляра будет ошибка RUNTIME-009 «Please call createInstance first».'
    explanation: |
      Функция `init` из `@module-federation/enhanced/runtime` в документации помечена «Use with caution»: она ищет
      уже созданный экземпляр с тем же именем и переиспользует его, а для отдельного экземпляра документация
      советует `createInstance`. В старых проектах встречается именно `init` со списком remote — это рабочий,
      но устаревающий способ.
    links:
      - https://module-federation.io/guide/runtime/runtime-api
      - https://module-federation.io/guide/troubleshooting/runtime

  - id: mf-032
    topic: Рантайм
    level: junior
    question: |
      Что делает `registerRemotes`?
    options:
      - text: 'Добавляет remote в рантайме, после старта'
        correct: true
        why: 'Можно передать список remote, а с флагом `force` — заменить уже зарегистрированный.'
      - text: 'Скачивает и выполняет все модули указанных remote'
        why: 'Регистрация только запоминает адрес. Модули грузятся при `loadRemote`.'
      - text: 'Публикует текущее приложение как remote для других'
        why: 'Публикация — это `exposes` в конфиге сборки.'
      - text: 'Удаляет remote из общей области'
        why: 'Это не удаление, а регистрация.'
    explanation: |
      Сценарий: модуль, который сам является remote, при загрузке регистрирует свой remote и использует его —
      так строится вложенная федерация. Без `force` уже зарегистрированный remote не перезаписывается, а с `force`
      заменяется, и кэш его загруженных модулей очищается.
    links:
      - https://module-federation.io/guide/runtime/runtime-api

  - id: mf-033
    topic: Рантайм
    level: middle
    multiple: true
    question: |
      Зачем в этой обёртке проверка `default` перед возвратом модуля?
    code: |
      lazy(async () => {
        const module = await loadRemote('shop/Product');
        if (!module || !('default' in module)) {
          throw new Error('Product must be export default');
        }
        return module;
      });
    codeLang: ts
    options:
      - text: 'Проверка лишняя: `loadRemote` всегда возвращает модуль с `default`'
        why: 'Не всегда: модуль может экспортировать только именованные значения.'
      - text: 'Без неё `React.lazy` упадёт с невнятной ошибкой'
        correct: true
        why: '`React.lazy` ждёт компонент в `default`. Своё сообщение сразу говорит, что не так с экспортом.'
      - text: 'Проверка нужна, чтобы React закэшировал модуль'
        why: 'Кэшированием занимается рантайм федерации, а не эта проверка.'
      - text: 'Проверка ускоряет загрузку remote'
        why: 'Скорость она не меняет.'
    explanation: |
      `React.lazy` принимает функцию, которая возвращает промис модуля с `default`-экспортом компонента. Если remote
      экспортирует компонент по имени, его можно обернуть: `.then((m) => ({ default: m.Product }))`. Брошенная в
      фабрике ошибка уйдёт в ближайший `ErrorBoundary`.
    links:
      - https://react.dev/reference/react/lazy
      - https://module-federation.io/guide/runtime/runtime-api

  - id: mf-034
    topic: Рантайм
    level: junior
    question: |
      Для чего нужен `preloadRemote`?
    options:
      - text: 'Скачать ресурсы модулей заранее, не выполняя их код'
        correct: true
        why: 'Например, при наведении на ссылку. Когда модуль понадобится, файлы уже будут в кэше браузера.'
      - text: 'Выполнить remote заранее, чтобы он отрисовался в фоне'
        why: 'Код модулей не выполняется и ничего не рендерится.'
      - text: 'Проверить, доступен ли сервер remote'
        why: 'Это побочный эффект, а не назначение.'
      - text: 'Подготовить remote к `loadRemote`, без которой тот не сработает'
        why: '`loadRemote` работает и без предзагрузки.'
    explanation: |
      В `preloadRemote` можно указать конкретные `exposes`, категорию ресурсов (`sync` или `all`) и фильтр адресов.
      Это снижает задержку при первом показе микрофронтенда.
    links:
      - https://module-federation.io/guide/runtime/runtime-api

  - id: mf-035
    topic: Рантайм
    level: middle
    question: |
      Для чего нужны плагины рантайма Module Federation 2.0?
    options:
      - text: 'Перехватывать этапы загрузки remote в браузере'
        correct: true
        why: 'Хуки вроде `beforeRequest`, `errorLoadRemote` и `createScript` меняют поведение рантайма без правок кода.'
      - text: 'Добавлять в сборку загрузчики файлов, как плагины webpack'
        why: 'Это плагины сборщика. Плагины рантайма работают в браузере.'
      - text: 'Логировать загрузку, но не менять её результат'
        why: 'Хуки умеют менять результат: подменить адрес, вернуть запасной модуль.'
      - text: 'Генерировать типы для хоста'
        why: 'Типы генерирует опция `dts` при сборке.'
    explanation: |
      Примеры: `beforeRequest` подменяет адрес remote (например, на локальный для отладки); `createScript` ставит
      `crossorigin` тегам script; `errorLoadRemote` обрабатывает ошибки загрузки. Готовые плагины есть, например
      `@module-federation/retry-plugin` для повторов.
    links:
      - https://module-federation.io/guide/runtime/runtime-plugins
      - https://module-federation.io/guide/runtime/runtime-hooks.html

  - id: mf-036
    topic: Рантайм
    level: middle
    question: |
      Стратегия `version-first` (по умолчанию в рантайме 2.0) при старте загружает входы всех remote, чтобы собрать
      версии общих зависимостей. Чем это грозит?
    options:
      - text: 'Недоступный remote может сорвать старт'
        correct: true
        why: 'Рантайм ждёт вход remote ещё до того, как он понадобился. Ошибку ловят в `errorLoadRemote`.'
      - text: 'Выполнится код всех модулей всех remote'
        why: 'Загружаются только входные файлы, модули — по требованию.'
      - text: 'Выберется самая низкая из версий зависимости'
        why: 'Наоборот, стратегия выбирает самую высокую версию.'
      - text: 'Ничем: входы remote маленькие и грузятся быстро'
        why: 'Дело не в размере, а в доступности: если remote лежит, вход не загрузится вовсе.'
    explanation: |
      Документация советует при `version-first` обрабатывать ошибки на этапе `beforeLoadShare` в хуке
      `errorLoadRemote`, добавлять повторы и `ErrorBoundary`. Если важнее устойчивость и скорость старта, есть
      стратегия `loaded-first`: remote грузятся только при обращении.
    links:
      - https://module-federation.io/configure/shareStrategy.html

  # Проверено на стенде
  - id: mf-037
    topic: Рантайм
    level: senior
    question: |
      У хоста `lib` 1.0.0 (singleton), он использует её при старте. Позже подгружается remote с `lib` 2.0.0 и
      `requiredVersion: '^2.0.0'` (singleton). Какие утверждения верны?
    options:
      - text: 'При `loaded-first` remote получит уже загруженную 1.0.0 и предупреждение'
        correct: true
        why: 'Стратегия переиспользует загруженное, а несовпадение у singleton — только предупреждение.'
      - text: 'При `version-first` и хост, и remote получат 2.0.0'
        correct: true
        why: 'Стратегия ещё до старта собирает версии со всех входов и выбирает самую высокую.'
      - text: 'При `loaded-first` remote получит свою 2.0.0, будет две копии'
        why: 'Singleton не допускает второй копии.'
      - text: 'При любой стратегии загрузка remote упадёт'
        why: 'Без `strictVersion` ничего не падает.'
      - text: 'При `loaded-first` вход remote скачивается только при обращении к нему'
        correct: true
        why: 'Входы remote не грузятся при старте — это и даёт устойчивость к недоступным remote.'
    explanation: |
      Итог: `version-first` гарантирует наивысшую версию, но тянет входы всех remote при старте. `loaded-first`
      быстрее и устойчивее, но версия зависит от порядка загрузки: кто первый загрузил — того версия. Стратегия по
      умолчанию — `version-first`.
    links:
      - https://module-federation.io/configure/shareStrategy.html

  - id: mf-038
    topic: Рантайм
    level: middle
    question: |
      Что даёт `mf-manifest.json` вместо `remoteEntry.js` в качестве входа remote?
    options:
      - text: 'Ускоряет выполнение кода remote в браузере'
        why: 'Скорость выполнения не меняется.'
      - text: 'Метаданные о remote без выполнения его кода'
        correct: true
        why: 'По манифесту рантайм знает модули, общие зависимости и файлы remote: отсюда подсказки типов и предзагрузка.'
      - text: 'Позволяет не указывать `exposes` в конфиге remote'
        why: '`exposes` по-прежнему задают в конфиге — манифест их только описывает.'
      - text: 'Отключает необходимость в общих зависимостях'
        why: 'Общие зависимости работают так же.'
    explanation: |
      Манифест — JSON с описанием remote: что он отдаёт, какие зависимости делит, какие файлы нужны. По нему
      рантайм может заранее подгрузить ресурсы, а инструменты разработчика — показать подсказки типов. Если
      манифест вернул не тот JSON (например, его переписал шлюз), будет ошибка RUNTIME-013.
    links:
      - https://module-federation.io/configure/remotes
      - https://module-federation.io/guide/troubleshooting/runtime

  - id: mf-039
    topic: Рантайм
    level: junior
    question: |
      Пропсы компонентов remote в хосте приходится описывать как `any`, и ошибки всплывают только в рантайме. Что
      предлагает Module Federation 2.0?
    options:
      - text: 'Опцию `dts` с генерацией и загрузкой типов'
        correct: true
        why: 'Remote генерирует типы своих модулей (`@mf-types.zip`), а хост подтягивает их автоматически.'
      - text: 'Строгий режим, который проверяет пропсы в рантайме'
        why: 'Такого режима нет: проверка типов — дело компилятора.'
      - text: 'Включить `strict` в `tsconfig` хоста'
        why: 'Строгий режим не даст компилятору знаний о модулях remote.'
      - text: 'Перевод remote на JavaScript без типов'
        why: 'Это убирает проблему вместе с пользой от типов.'
    explanation: |
      Альтернативы: общий npm-пакет с типами контрактов или контрактные тесты. `dts` удобен тем, что типы
      соответствуют версии remote на момент сборки хоста и не расходятся с ней, как ручные объявления. От поломки
      при выкатке remote типы не защищают: сборка хоста при ней не запускается.
    links:
      - https://module-federation.io/configure/dts

  - id: mf-064
    topic: Рантайм
    level: middle
    question: |
      Разработчик правит один remote локально и хочет проверить его в хосте на стенде, не поднимая всю систему. Как?
    options:
      - text: 'Пересобрать хост с адресом локального remote и задеплоить на стенд'
        why: 'Это ломает стенд для всех остальных.'
      - text: 'Подменить адрес этого remote на localhost в рантайме'
        correct: true
        why: 'Через `registerRemotes` с `force`, хук `beforeRequest` или расширение Module Federation для Chrome.'
      - text: 'Скопировать собранный remote на сервер стенда'
        why: 'Это деплой, а не локальная проверка.'
      - text: 'Никак: проверить можно только после деплоя remote'
        why: 'Подмена адреса в рантайме решает задачу без деплоя.'
    explanation: |
      Так проверяют одну часть системы в окружении всех остальных частей со стенда. Локальный сервер remote должен
      отдавать CORS-заголовки, если вход — ES-модуль или подключается через манифест.
    links:
      - https://module-federation.io/guide/runtime/runtime-hooks.html

  # ===================== Сборщики =====================
  - id: mf-040
    topic: Сборщики
    level: middle
    multiple: true
    question: |
      В списке remote хоста у одного `type: 'module'`, у другого `type: 'var'`. Что это значит?
    options:
      - text: 'Формат входа: ES-модуль или глобальная переменная'
        correct: true
        why: 'Vite собирает вход как ES-модуль, классический webpack — как глобальную переменную. Тип говорит рантайму, как загрузить.'
      - text: '`module` — обязательные для старта remote, `var` — необязательные'
        why: 'Тип описывает формат входа, а не важность.'
      - text: '`var` — устаревшее значение, которое рантайм игнорирует'
        why: 'Не игнорирует: по нему грузятся классические входы webpack.'
      - text: 'Это способ экспорта модуля: именованный или по умолчанию'
        why: 'К экспортам модулей это отношения не имеет.'
    explanation: |
      Если хост загружает ES-модульный вход как обычный скрипт, будет ошибка RUNTIME-001 («Failed to get remoteEntry
      exports»), и документация советует указать `type: 'module'`. Смешанные системы типичны при переезде с webpack
      на Vite: часть remote уже переехала, часть нет.
    links:
      - https://module-federation.io/guide/troubleshooting/runtime
      - https://module-federation.io/integrations/build-tool/vite.html

  - id: mf-041
    topic: Сборщики
    level: middle
    question: |
      Чем `@module-federation/vite` отличается от `@originjs/vite-plugin-federation`?
    options:
      - text: 'Ничем: это один и тот же пакет под разными именами'
        why: 'Это разные проекты.'
      - text: '`@module-federation/vite` — официальный плагин на рантайме 2.0, совместимый с webpack и Rspack'
        correct: true
        why: 'Старый сторонний плагин плохо работал вместе с webpack-remote. Новый использует общий рантайм.'
      - text: '`@originjs/vite-plugin-federation` — официальный, а `@module-federation/vite` — экспериментальный'
        why: 'Наоборот.'
      - text: '`@module-federation/vite` работает только в режиме разработки'
        why: 'Он используется и для продакшен-сборок.'
    explanation: |
      Официальный плагин поддерживает те же возможности, что и другие сборщики Module Federation 2.0: манифест, типы
      (`dts`), рантайм-плагины. Поэтому хост на webpack может подключать remote на Vite и наоборот.
    links:
      - https://module-federation.io/integrations/build-tool/vite.html

  - id: mf-042
    topic: Сборщики
    level: middle
    multiple: true
    question: |
      Хост грузит `remoteEntry.js` с `https://cdn.shop.com`, а чанки модулей remote запрашиваются с адреса хоста и
      получают 404. Как исправить, сохранив независимый деплой?
    options:
      - text: 'Задать у remote `publicPath: "auto"` или свой `base`'
        correct: true
        why: 'Тогда remote ищет свои чанки рядом со своим входом, а не на домене хоста.'
      - text: 'Скопировать чанки remote на сервер хоста'
        why: 'Работать будет, но каждый деплой remote потребует деплоя хоста.'
      - text: 'Включить у хоста `eager: true` для всех общих зависимостей'
        why: '`eager` к адресам чанков отношения не имеет.'
      - text: 'Добавить remote в `shared` хоста'
        why: '`shared` — для библиотек, а не для remote.'
    explanation: |
      Чанки remote грузятся относительно его `publicPath`. Если он указан как `/`, браузер запросит их с текущего
      домена — домена хоста. Значение `auto` в webpack вычисляет путь по адресу загруженного скрипта. В Vite для
      этого задают относительный `base` (например, `'./'`) или полный адрес CDN.
    links:
      - https://module-federation.io/integrations/build-tool/vite.html
      - https://webpack.js.org/plugins/module-federation-plugin

  - id: mf-043
    topic: Сборщики
    level: middle
    question: |
      До рантайма 2.0 как на webpack подставляли адрес remote из конфига окружения без пересборки хоста?
    options:
      - text: 'Promise-based remotes: в `remotes` пишут промис, который сам грузит вход по адресу из окружения'
        correct: true
        why: 'Строка вида `promise new Promise(...)` описана в документации webpack.'
      - text: 'Плагин `external-remotes-plugin` с подстановкой вида `remote@[window.remoteUrl]/remoteEntry.js`'
        correct: true
        why: 'Плагин подставляет значение глобальной переменной в рантайме.'
      - text: 'Переменные окружения `process.env` подставлялись при каждой загрузке страницы'
        why: '`process.env` вшивается при сборке — для смены адреса нужна пересборка.'
      - text: 'Адрес можно было задать только при сборке хоста'
        why: 'Были способы: промис в `remotes` или подстановка глобальной переменной плагином.'
    explanation: |
      Ещё один классический способ из документации webpack — Dynamic Remote Containers: вручную вставить тег script
      с входом, вызвать `__webpack_init_sharing__` и `container.init`, а затем `container.get`. Сейчас то же самое
      делают через рантайм: регистрируют remote с адресом из конфига окружения.
    links:
      - https://webpack.js.org/concepts/module-federation/

  # ===================== Ошибки и отказоустойчивость =====================
  - id: mf-044
    topic: Ошибки и отказоустойчивость
    level: junior
    multiple: true
    question: |
      Компонент из remote подключён через `React.lazy` и обёрнут только в `Suspense`. Сервер remote недоступен. Что
      произойдёт?
    options:
      - text: '`Suspense` будет показывать fallback бесконечно'
        why: 'Промис не висит — он отклоняется с ошибкой.'
      - text: 'Ошибка поднимется до корня, и React размонтирует всё приложение'
        correct: true
        why: '`Suspense` ждёт загрузку, но не ловит ошибки. Их ловит только `ErrorBoundary`, а его здесь нет.'
      - text: 'React молча не отрисует этот компонент'
        why: 'Ошибка не глотается — она идёт вверх по дереву.'
      - text: 'Рантайм федерации сам покажет заглушку'
        why: 'Только если вы настроили это в хуке `errorLoadRemote`.'
    explanation: |
      Обычный рецепт: каждый remote оборачивают в `ErrorBoundary` с запасным интерфейсом и в `Suspense` для
      ожидания. Тогда упавший микрофронтенд ломает только свой кусок страницы.
    links:
      - https://react.dev/reference/react/lazy
      - https://module-federation.io/blog/error-load-remote

  - id: mf-045
    topic: Ошибки и отказоустойчивость
    level: middle
    question: |
      Как обработать недоступность remote на уровне рантайма федерации, а не React?
    options:
      - text: 'Через хук `errorLoadRemote` в плагине рантайма'
        correct: true
        why: 'Хук получает этап, на котором случилась ошибка, и может вернуть запасной компонент или адрес.'
      - text: 'Обернуть `loadRemote` в `setTimeout`'
        why: 'Задержка не обрабатывает ошибку.'
      - text: 'Указать remote в `shared` с `eager: true`'
        why: 'Remote не кладут в `shared`.'
      - text: 'Включить `strictVersion` у всех общих зависимостей'
        why: '`strictVersion` касается версий библиотек, а не доступности remote.'
    explanation: |
      Слои защиты: сеть — `@module-federation/retry-plugin` для повторов; загрузка — `errorLoadRemote` (этап
      `onLoad` для модулей, `afterResolve` для манифеста, `beforeLoadShare` для входов при `version-first`);
      рендер — `ErrorBoundary`. Их можно комбинировать.
    links:
      - https://module-federation.io/blog/error-load-remote
      - https://module-federation.io/plugin/plugins/retry-plugin.html

  - id: mf-046
    topic: Ошибки и отказоустойчивость
    level: middle
    question: |
      Что может привести к ошибкам загрузки входа remote (RUNTIME-001 «Failed to get remoteEntry exports» или
      RUNTIME-008 «Failed to load script resources»)?
    options:
      - text: 'Неверный адрес или 404 у `remoteEntry.js`'
        correct: true
        why: 'Самая частая причина — проверьте адрес и что файл действительно выложен.'
      - text: 'Вход в формате ES-модуля отдаётся с другого домена без CORS-заголовков'
        correct: true
        why: 'Обычному `<script>` CORS не нужен, а `import()` ES-модуля с другого домена браузер без заголовков заблокирует.'
      - text: 'Вход в формате ES-модуля загружают как обычный скрипт'
        correct: true
        why: 'Для таких remote нужен `type: "module"`.'
      - text: 'Слишком большое число общих зависимостей'
        why: 'Количество общих зависимостей на загрузку входа не влияет.'
      - text: 'Remote написан на TypeScript'
        why: 'В браузер приходит уже собранный JavaScript.'
    explanation: |
      У RUNTIME-008 два вида: ошибка сети (404, таймаут, CORS) — помогают повторы; ошибка выполнения (файл скачался,
      но упал при запуске, например из-за синтаксиса, который браузер не поддерживает) — повторы не помогут.
    links:
      - https://module-federation.io/guide/troubleshooting/runtime

  # Проверено на стенде
  - id: mf-047
    topic: Ошибки и отказоустойчивость
    level: senior
    question: |
      Remote с классическим входом называется `name: 'remote'`. На странице хоста есть `<div id="remote">`. Хост
      падает с «The remote entry interface does not contain "init"». Почему?
    options:
      - text: '`window.remote` указывает на DOM-элемент, и рантайм принимает его за контейнер'
        correct: true
        why: 'Элементы с `id` доступны как свойства `window`. Рантайм видит занятое имя и ищет `init` у div.'
      - text: 'Рантайм запрещает имена контейнеров из одного слова'
        why: 'Таких ограничений нет.'
      - text: 'У remote не указан `exposes`'
        why: 'Тогда была бы ошибка про отсутствующий модуль.'
      - text: 'Версии React у хоста и remote разные'
        why: 'Версии зависимостей к `init` контейнера не относятся.'
    explanation: |
      Это ошибка RUNTIME-002. Классический вход кладёт контейнер в глобальную переменную с именем `name`, и рантайм
      сначала проверяет, не занято ли это имя. Если там уже лежит что-то другое (элемент с таким `id`, чужой
      скрипт), загрузка ломается. Документация советует проверить `window[remoteEntryKey]` и переименовать контейнер.
      Если два remote случайно назвать одинаково, второй может получить контейнер первого.
    links:
      - https://module-federation.io/guide/troubleshooting/runtime

  - id: mf-065
    topic: Ошибки и отказоустойчивость
    level: middle
    question: |
      Хост подключает remote с чужого CDN. Чем рискует хост с точки зрения безопасности?
    options:
      - text: 'Ничем: код remote работает в песочнице, как в iframe'
        why: 'Песочницы нет: код remote выполняется прямо на странице хоста.'
      - text: 'Код remote выполняется с правами страницы хоста'
        correct: true
        why: 'Ему доступны DOM, cookie без `HttpOnly`, localStorage с токенами. Подмена файла на CDN — подмена кода хоста.'
      - text: 'Только тем, что remote может замедлить загрузку страницы'
        why: 'Скорость — меньшая из проблем.'
      - text: 'Рискует, только если remote написан не на React'
        why: 'Фреймворк не важен: важно, откуда и чей код выполняется.'
    explanation: |
      Поэтому remote подключают только из доверенных источников под своим контролем, ограничивают источники
      скриптов через Content Security Policy и не хранят чувствительное там, куда дотянется любой скрипт страницы.
      Это главное отличие от iframe с другого домена, где код изолирован.
    links:
      - https://webpack.js.org/concepts/module-federation/

  # ===================== Роутинг, состояние, стили =====================
  - id: mf-048
