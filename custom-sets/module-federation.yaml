    explanation: |
      Хост определяет, на каком пути живёт микрофронтенд, и передаёт базовый путь. Внутри него микрофронтенд
      сам управляет своими экранами. Так можно перенести микрофронтенд на другой путь, не меняя его код.
    links:
      - https://module-federation.io/guide/bridge/react/load-app

  - id: mf-049
