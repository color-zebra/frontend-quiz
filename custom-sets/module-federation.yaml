      встраивание через JavaScript в браузере.
      Его цена — договорённость о версии общего React и риск, что части помешают друг другу стилями.
    links:
      - https://martinfowler.com/articles/micro-frontends.html
      - https://module-federation.io/configure/shared

  # ===================== iframe =====================
  - id: mf-074
    topic: iframe
    level: junior
    question: |
      Сайт турагентства показывает во фрейме форму бронирования с домена `https://book.partner.example` и слушает
      от неё сообщение `{ type: 'booked' }`. Как убедиться, что сообщение прислала именно эта форма?
    options:
      - text: 'Проверить, что в данных есть поле `source: "partner"`'
        why: 'Это поле может вписать в своё сообщение любой сайт: данные пишет отправитель.'
      - text: 'Сравнить `event.origin` с `https://book.partner.example`'
        correct: true
        why: 'Источник отправителя подставляет браузер, и подделать его отправитель не может.'
      - text: 'Проверить, что `document.referrer` указывает на партнёра'
        why: '`document.referrer` говорит, откуда пришли на саму страницу, и ничего не знает о сообщениях.'
      - text: 'Проверить, что `event.target` — элемент фрейма бронирования'
        why: 'Событие `message` приходит на окно получателя, а не на элемент фрейма.'
    explanation: |
      Слушатель `message` получает сообщения от любых окон, в том числе от чужого сайта, который открыл вашу
      страницу во фрейме. Поэтому первая строка обработчика — проверка `event.origin`. Для надёжности сверяют ещё
      `event.source` с окном своего фрейма (`frame.contentWindow`), а затем формат данных. Отправитель со своей
      стороны указывает точный `targetOrigin`, а не `'*'`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Window/postMessage

  - id: mf-075
    topic: iframe
    level: middle
    question: |
      Встроенная форма с другого домена вырастает, когда показывает подсказки об ошибках, и во фрейме появляется
      полоса прокрутки. Как подгонять высоту фрейма под содержимое?
    options:
      - text: 'Родитель читает `iframe.contentDocument.body.scrollHeight` и меняет высоту'
        why: 'Для фрейма с другого источника `contentDocument` равен `null`: читать его документ родителю нельзя.'
      - text: 'Задать фрейму в CSS `height: auto`, чтобы он рос вместе с формой'
        why: 'Фрейм не подстраивается под содержимое: без заданной высоты у него размер по умолчанию.'
      - text: 'Форма измеряет свою высоту и шлёт её родителю через `postMessage`'
        correct: true
        why: 'Измерить документ может только он сам, а родитель по сообщению меняет высоту элемента.'
      - text: 'Добавить фрейму `sandbox="allow-same-origin"`, чтобы родитель видел размер'
        why: 'Этот токен оставляет документу его собственный источник и не даёт родителю доступа к чужому.'
    explanation: |
      Обычная схема: во фрейме `ResizeObserver` следит за документом и при каждом изменении шлёт
      `{ type: 'resize', height }` родителю с точным `targetOrigin`. Родитель проверяет `event.origin` и выставляет
      фрейму высоту. Так же фрейм просит родителя открыть окно на весь экран: сам он за свою рамку не выходит.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Window/postMessage
      - https://developer.mozilla.org/en-US/docs/Web/API/ResizeObserver

  - id: mf-076
    topic: iframe
    level: senior
    question: |
      Админка почтового сервиса показывает HTML писем, которые прислали пользователи, во фрейме с того же домена:
      `<iframe sandbox="allow-scripts allow-same-origin" src="/preview/42">`. Насколько это защищает админку
      от скриптов в письмах?
    options:
      - text: 'Надёжно: sandbox не даёт скриптам письма обратиться к родителю'
        why: 'Документ того же источника со скриптами может обратиться к родителю и снять с фрейма sandbox.'
      - text: 'Почти никак: скрипт письма может снять sandbox со своего фрейма'
        correct: true
        why: 'С этими двумя токенами документ того же источника — такой же «свой», как сама админка.'
      - text: 'Защищает от скриптов, но письмо сможет отправить форму от имени админа'
        why: 'Не защищает и от скриптов: скрипт письма снимет sandbox, а с ним и запрет форм, и сможет слать запросы с cookie админа.'
      - text: 'Защищает, если добавить ещё и `allow-top-navigation`'
        why: 'Этот токен снимает ещё один запрет — на переход всей вкладки. Защиты он не прибавляет.'
    explanation: |
      MDN прямо предупреждает: если встроенный документ того же источника, сочетание `allow-scripts`
      и `allow-same-origin` позволяет ему убрать атрибут sandbox, и защиты не остаётся. Правильно — отдавать
      недоверенный HTML с отдельного домена или оставить ему только один из токенов. Чаще всего убирают
      `allow-same-origin`: документ получает особый источник и не видит ни админку, ни её cookie.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/iframe

  # ===================== Сборка на сервере =====================
  - id: mf-077
    topic: Сборка на сервере
    level: junior
    question: |
      Что делает сервер, который собирает страницу из фрагментов разных команд?
    options:
      - text: 'Отдаёт браузеру шаблон, а фрагменты потом загружает JavaScript оболочки'
        why: 'Это сборка в браузере: готового HTML в первом ответе не будет.'
      - text: 'Запрашивает у серверов команд куски HTML и вставляет их в шаблон до ответа'
        correct: true
        why: 'Браузер с первого ответа получает готовую страницу, а каждая команда выкатывает свой фрагмент сама.'
      - text: 'Пересобирает бандлы команд в один общий бандл при каждом новом запросе страницы'
        why: 'Сборщик работает с готовым HTML фрагментов, а не с исходным кодом и бандлами.'
      - text: 'Отдаёт каждый фрагмент отдельной страницей во фрейме внутри шаблона'
        why: 'Это встраивание через iframe: фрейм грузит свою страницу уже в браузере.'
    explanation: |
      Фрагмент — кусок HTML от сервера команды, шаблон — HTML с метками «сюда вставить фрагмент». Сборщик
      запрашивает фрагменты параллельно и склеивает ответ. Им может быть веб-сервер (SSI в nginx), CDN (ESI)
      или свой сервис на Node. Интерактивность фрагменты потом оживляют своими скриптами в браузере.
    links:
      - https://nginx.org/ru/docs/http/ngx_http_ssi_module.html

  - id: mf-078
    topic: Сборка на сервере
    level: middle
    question: |
      Страница статьи на новостном сайте собирается на сервере из пяти фрагментов. Фрагмент комментариев иногда
      отвечает за четыре секунды, и тогда вся страница приходит через четыре секунды. Что сделать?
    options:
      - text: 'Запрашивать фрагменты по очереди, чтобы медленный шёл последним'
        why: 'По очереди время ответов складывается: страница придёт ещё позже.'
      - text: 'Ждать комментарии ограниченное время, а не успели — заглушка и догрузка в браузере'
        correct: true
        why: 'Статья приходит сразу, а второстепенный блок появится чуть позже, когда загрузится сам.'
      - text: 'Увеличить тайм-аут сборщика, чтобы комментарии успевали прийти при любой нагрузке'
        why: 'Комментарии будут успевать, но страница по-прежнему будет ждать их по четыре секунды.'
      - text: 'Кэшировать готовую страницу статьи целиком на час'
        why: 'Ответ ускорится, но комментарии и остальные блоки отстанут на час для всех читателей.'
    explanation: |
      При серверной сборке страница готова, только когда пришёл последний фрагмент. Поэтому у каждого фрагмента
      свой тайм-аут и запасной вид, а фрагменты делят на важные, без которых страница бессмысленна, и второстепенные,
      которые можно догрузить в браузере. В nginx запасной блок задают параметром `stub` у команды `include`.
    links:
      - https://nginx.org/ru/docs/http/ngx_http_ssi_module.html

  - id: mf-079
    topic: Сборка на сервере
    level: senior
    question: |
      Сайт авиабилетов собирает страницы на CDN из фрагментов и кэширует каждый фрагмент на 10 минут. В шапке есть
      имя вошедшего пользователя, и шапка кэшируется так же, как остальные фрагменты. Что пойдёт не так?
    options:
      - text: 'Имя обновится с опозданием до 10 минут, но у каждого человека будет своё'
        why: 'Кэш на CDN общий: закэшированную шапку получат все следующие посетители.'
      - text: 'Ничего: CDN кэширует фрагменты отдельно для каждого браузера'
        why: 'Общий кэш по умолчанию хранит один ответ на адрес для всех, если явно не делить его по пользователю.'
      - text: 'Шапка перестанет обновляться после выкатки, и кэш придётся сбрасывать вручную'
        why: 'Через 10 минут шапка обновится сама. Главная беда здесь не в выкатке.'
      - text: 'Люди увидят в шапке чужое имя, закэшированное для первого посетителя'
        correct: true
        why: 'Общую шапку можно кэшировать, а имя — подставлять в браузере для конкретного человека.'
    explanation: |
      Кэш фрагментов — сильная сторона серверной сборки: редкие изменения живут в кэше долго. Но общий кэш
      не различает людей. Персональные данные — имя, корзину, число уведомлений — либо не кэшируют на общем сервере,
      либо оставляют в шаблоне пустое место и подставляют в браузере запросом от имени пользователя.
    links:
      - https://martinfowler.com/articles/micro-frontends.html

  # ===================== Веб-компоненты =====================
  - id: mf-080
    topic: Веб-компоненты
    level: junior
    question: |
      Виджет погоды сделан веб-компонентом `<weather-widget>`. Как ему сообщить странице, что человек выбрал
      другой город?
    options:
      - text: 'Вызвать глобальную функцию `onCityChange`, которую страница должна объявить'
        why: 'Это скрытая договорённость о глобальном имени: страница, не объявившая функцию, сломает виджет.'
      - text: 'Отправить со своего элемента `CustomEvent` с городом в поле `detail`'
        correct: true
        why: 'Страница подписывается на событие элемента, а виджету неважно, кто его вставил.'
      - text: 'Записать город в свой атрибут `city`, чтобы страница опрашивала его таймером'
        why: 'Атрибуты — канал от страницы к элементу. Опрос таймером запаздывает и тратит ресурсы впустую.'
      - text: 'Положить город в `localStorage`, чтобы страница читала его оттуда'
        why: 'Хранилище не сообщает о записи в той же вкладке: страница не узнает о выборе вовремя.'
    explanation: |
      Контракт веб-компонента — атрибуты и свойства на вход, события на выход. Элемент вызывает
      `this.dispatchEvent(new CustomEvent('city-change', { detail: { city }, bubbles: true, composed: true }))`,
      а страница — `element.addEventListener('city-change', …)`. Флаг `composed` нужен, если событие отправляет
      узел внутри теневого дерева: без него событие останется внутри.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/Web_components/Using_custom_elements

  - id: mf-081
    topic: Веб-компоненты
    level: middle
    question: |
      Приложение на React 18 рендерит веб-компонент так: `<order-summary order={order} />`, где `order` — объект.
      Внутри элемента `order` оказывается строкой `"[object Object]"`. Почему?
    options:
      - text: 'Элемент ещё не зарегистрирован, и React откладывает передачу свойств'
        why: 'React 18 не откладывает свойства: он передаёт пропы атрибутами при любом состоянии регистрации.'
      - text: 'Shadow DOM превращает все входные данные элемента в строки'
        why: 'Shadow DOM изолирует стили и разметку, а данные не трогает.'
      - text: 'React 18 передаёт пропы неизвестным элементам атрибутами, а атрибут — строка'
        correct: true
        why: 'Объект приводится к строке. В React 18 сложные данные присваивают свойством через `ref`.'
      - text: 'Объект передаётся элементу свойством, только если у теневого дерева `mode: "closed"`'
        why: 'Режим теневого дерева не влияет на то, как React передаёт пропы.'
    explanation: |
      React 18 не знает, какие свойства есть у чужого элемента, и любой проп превращает в атрибут. Строки и числа
      доходят, а массивы и объекты — нет. Обход в React 18: `ref` и `ref.current.order = order` в эффекте.
      React 19 поступает иначе: если у экземпляра элемента есть свойство с именем пропа, React присваивает
      свойство, иначе — атрибут.
    links:
      - https://react.dev/blog/2024/12/05/react-19#support-for-custom-elements

  - id: mf-082
    topic: Веб-компоненты
    level: senior
    question: |
      На сайте партнёра виджет рекомендаций версии 1 подключили его разработчики, а версию 2 подтянул плагин
      из CMS. Оба скрипта вызывают `customElements.define('shop-recommendations', …)` без проверки. Что произойдёт?
    options:
      - text: 'Класс версии 2 заменит класс версии 1, и все элементы перерисуются'
        why: 'Переопределить уже зарегистрированное имя нельзя: реестр тегов этого не позволяет.'
      - text: 'Браузер зарегистрирует оба класса и выберет нужный по атрибуту версии на элементе'
        why: 'У одного имени тега на странице может быть только один класс, атрибутов версии реестр не знает.'
      - text: 'Второй `define` бросит `NotSupportedError`, на странице останется первый класс'
        correct: true
        why: 'Реестр общий на страницу, повторная регистрация имени — исключение.'
      - text: 'Оба вызова пройдут, а элементы получат класс из последнего скрипта'
        why: 'Второй вызов не проходит: он бросает исключение, и регистрация первого остаётся в силе.'
    explanation: |
      `customElements` — один реестр на страницу. Если там уже есть запись с таким именем, `define` бросает
      `NotSupportedError`. Элементы получат класс того, кто успел первым, — какая версия это окажется, зависит
      от порядка загрузки скриптов. Защиты: проверять `customElements.get(name)` перед регистрацией и выпускать
      несовместимую версию под новым именем тега, например `<shop-recommendations-v2>`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/CustomElementRegistry/define

  # ===================== single-spa и import maps =====================
  - id: mf-083
    topic: single-spa и import maps
    level: junior
    multiple: true
    question: |
      Что делает single-spa?
    options:
      - text: 'Делит общие библиотеки между приложениями ещё при их сборке'
        why: 'single-spa работает в браузере и библиотеки не делит: для этого берут import maps или Module Federation.'
      - text: 'Изолирует приложения друг от друга так же, как iframe'
        why: 'Приложения single-spa живут в одной странице и одном окне, изоляции нет.'
      - text: 'По адресу решает, какие приложения смонтировать, и вызывает их `mount` и `unmount`'
        correct: true
        why: 'Это оркестратор: список приложений, правила `activeWhen` и жизненный цикл каждого.'
      - text: 'Собирает приложения разных команд в одну HTML-страницу на сервере до отправки браузеру'
        why: 'Это серверная сборка из фрагментов. single-spa работает в браузере.'
    explanation: |
      Приложения регистрируют в корневом конфиге через `registerApplication` с функцией загрузки и правилом
      `activeWhen`. После каждого перехода single-spa сверяет адрес с правилами и монтирует или размонтирует
      приложения. Приложения могут быть на разных фреймворках: от каждого нужны только функции `bootstrap`,
      `mount` и `unmount`.
    links:
      - https://single-spa.js.org/docs/configuration

  - id: mf-084
    topic: single-spa и import maps
    level: middle
    question: |
      Приложение онлайн-кинотеатра под single-spa в `mount` подписывается на `window` `resize` и запускает таймер,
      который раз в минуту опрашивает сервер. Его `unmount` только очищает свой DOM-элемент. Что будет после
      нескольких переходов из этого раздела и обратно?
    options:
      - text: 'single-spa сам снимет все обработчики приложения при размонтировании'
        why: 'single-spa не знает, на что подписывалось приложение: уборка — обязанность самого `unmount`.'
      - text: 'Браузер удалит обработчики вместе с очищенным DOM-элементом'
        why: 'Обработчик висит на `window`, а таймер вообще не связан с DOM — очистка элемента их не трогает.'
      - text: 'Обработчики и таймеры копятся: старые экземпляры работают в фоне'
        correct: true
        why: 'Каждое монтирование добавляет новую подписку и новый таймер, а старые никто не снимает.'
      - text: 'Ничего: `bootstrap` при каждом монтировании сбрасывает состояние'
        why: '`bootstrap` вызывается один раз, перед первым монтированием, и ничего не сбрасывает.'
    explanation: |
      Жизненный цикл single-spa — договор: `mount` создаёт, `unmount` убирает всё созданное — обработчики,
      таймеры, соединения, подписки на хранилища. Обёртки вроде `single-spa-react` размонтируют дерево
      компонентов, но то, что код создал вне React-эффектов с очисткой, они не уберут.
    links:
      - https://single-spa.js.org/docs/building-applications

  - id: mf-085
    topic: single-spa и import maps
    level: middle
    question: |
      Два приложения на странице импортируют `react` по голому имени, React не входит в их бандлы, а карта импортов
      сопоставляет `react` с одним адресом. Сколько экземпляров React получит страница?
    options:
      - text: 'Два: каждое приложение получит свой экземпляр'
        why: 'Модуль с одним адресом браузер загружает и выполняет один раз, второй импорт получит тот же экземпляр.'
      - text: 'Один: модуль с одним адресом выполняется один раз'
        correct: true
        why: 'Оба импорта разрешаются в один адрес, а браузер кэширует модули по адресу.'
      - text: 'Один, но только если приложения собраны одним сборщиком'
        why: 'Карту импортов применяет браузер, и сборщик приложения на это не влияет.'
      - text: 'Два, если приложения загрузились в разное время'
        why: 'Время загрузки неважно: уже выполненный модуль браузер отдаёт из своей карты модулей.'
    explanation: |
      Это основа совместного использования библиотек через import maps. Условия: библиотека в формате ES-модуля
      (для React берут ESM-сборку), приложения не кладут её в свои бандлы, а импортируют по имени из карты.
      Если хотя бы одно приложение привезёт React в бандле, на странице окажется второй экземпляр.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/script/type/importmap

  - id: mf-086
    topic: single-spa и import maps
    level: senior
    question: |
      Страница сначала грузит модуль-вход `<script type="module" src="/root.js">`, который импортирует
      `@shop/account`, а карту импортов с адресом `@shop/account` вставляет другой скрипт чуть позже. Импорт падает
      с ошибкой разрешения имени. Как исправить?
    options:
      - text: 'Заменить статический импорт на `import()`: карты действуют только на динамические импорты'
        why: 'Карты действуют и на `import`, и на `import()`. Дело в порядке, а не в виде импорта.'
      - text: 'Вынести карту во внешний файл и подключить её атрибутом `src`'
        why: 'У `<script type="importmap">` атрибута `src` нет: карту пишут в HTML или вставляют скриптом.'
      - text: 'Написать карту в HTML до первого `<script type="module">` на странице'
        correct: true
        why: 'Карту нужно объявить раньше, чем загрузится модуль, который по ней разрешает имена.'
      - text: 'Продублировать карту в каждом воркере, который запускает страница'
        why: 'На воркеры карты не действуют вовсе, а ошибка здесь в основном документе.'
    explanation: |
      Карта импортов разрешает имена модулей, и её нужно объявить до того, как загрузится модуль, использующий эти
      имена. Современные браузеры разрешают несколько карт в любом месте документа — с тем же условием «до модулей,
      которые от них зависят», а старые — только одну карту до первого модуля. Самый надёжный вариант — карта прямо
      в HTML перед первым модулем.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/script/type/importmap

  # ===================== Основы =====================
  - id: mf-001
    topic: Основы
    level: junior
    question: |
      Что такое Module Federation?
    options:
      - text: 'Способ собрать несколько приложений в один общий бандл на этапе сборки'
        why: 'Наоборот: приложения собираются и деплоятся отдельно, а соединяются уже в браузере.'
      - text: 'Загрузка модулей из отдельно собранных приложений в рантайме'
        correct: true
        why: 'Каждое приложение собирается само, а в браузере одно подгружает модули другого и делит с ним зависимости.'
      - text: 'Инструмент для управления пакетами в монорепозитории'
        why: 'Монорепой управляют pnpm workspaces, Nx, Turborepo. Module Federation про загрузку кода в рантайме.'
      - text: 'Фреймворк для серверного рендеринга микрофронтендов'
        why: 'Module Federation работает и в браузере, и на Node, но фреймворком SSR не является.'
    explanation: |
      Module Federation появилась в webpack 5. Приложения собираются и деплоятся независимо, а в браузере одно
      приложение загружает модули другого по сети и при этом делит с ним общие библиотеки, например React. Сейчас
      её развивает проект Module Federation 2.0: общий рантайм `@module-federation/runtime`, плагин для webpack и
      Rspack в пакете `@module-federation/enhanced` и плагин для Vite `@module-federation/vite`.
    links:
      - https://webpack.js.org/concepts/module-federation/
      - https://module-federation.io/guide/start/quick-start

  - id: mf-002
    topic: Основы
    level: junior
    question: |
      Какие утверждения о хосте и remote верны?
    options:
      - text: 'Хост загружает модули из других приложений'
        correct: true
        why: 'Хост — потребитель: он подключает remote и берёт из него модули.'
      - text: 'Remote отдаёт наружу часть своих модулей'
        correct: true
        why: 'Remote объявляет в `exposes`, какие модули можно взять снаружи.'
      - text: 'Одно приложение может быть и хостом, и remote'
        correct: true
        why: 'Например, remote для оболочки и при этом сам подключает другой remote — вложенная федерация.'
      - text: 'Хост и remote собираются одной и той же версией сборщика'
        why: 'Важен формат контейнера, а не версия сборщика. Рантайм 2.0 подключает remote и на webpack, и на Vite.'
      - text: 'Remote знает список хостов, которые его подключают'
        why: 'Remote не знает потребителей: он только публикует вход.'
    explanation: |
      Роли условны: хост — тот, кто потребляет, remote — тот, кто отдаёт. В реальных системах приложение-оболочка
      подключает десятки remote, а некоторые remote сами подключают другие remote.
    links:
      - https://module-federation.io/guide/start/quick-start

  - id: mf-061
    topic: Основы
    level: junior
    question: |
      В конфиге remote заданы `name: 'shop'`, `filename: 'remoteEntry.js'` и `exposes`. За что отвечает каждое поле?
    options:
      - text: '`name` — имя контейнера, `filename` — имя входного файла, `exposes` — что отдаётся наружу'
        correct: true
        why: 'Хост ищет контейнер по `name`, загружает файл `filename` и берёт модули, перечисленные в `exposes`.'
      - text: '`name` — заголовок вкладки, `filename` — имя входного файла, `exposes` — что отдаётся наружу'
        why: 'К заголовку вкладки `name` отношения не имеет: это идентификатор контейнера.'
      - text: '`name` — имя контейнера, `filename` — путь к исходнику входа, `exposes` — что отдаётся наружу'
        why: '`filename` — имя собранного входного файла, а не исходник.'
      - text: '`name` — имя контейнера, `filename` — имя входного файла, `exposes` — общие библиотеки'
        why: 'Общие библиотеки — это `shared`. `exposes` — собственные модули remote.'
    explanation: |
      Для классического входа (`var`) `name` становится ещё и именем глобальной переменной, в которой лежит
      контейнер. Поэтому имена контейнеров должны быть уникальными и не совпадать с другими глобальными именами.
    links:
      - https://module-federation.io/configure/
      - https://webpack.js.org/plugins/module-federation-plugin

  - id: mf-003
    topic: Основы
    level: junior
    question: |
      Что такое `remoteEntry.js`?
    options:
      - text: 'Весь код remote, собранный в один большой файл'
        why: 'Это маленький входной файл. Код модулей лежит в отдельных чанках и грузится по требованию.'
      - text: 'HTML-страница remote, которую хост встраивает к себе'
        why: 'Это JavaScript-файл, а не страница. Встраивание страниц — это подход с iframe.'
      - text: 'Входной файл контейнера remote'
        correct: true
        why: 'Контейнер умеет `init` (получить общие зависимости) и `get` (отдать модуль). Остальное грузится по требованию.'
      - text: 'Конфиг хоста со списком подключаемых remote'
        why: 'Список remote лежит в конфиге хоста, а `remoteEntry.js` публикует сам remote.'
    explanation: |
      Хост сначала загружает `remoteEntry.js`, через `init` передаёт контейнеру общую область зависимостей (share
      scope), а затем через `get` получает нужный модуль. Только тогда скачиваются чанки этого модуля. В Module
      Federation 2.0 вместо `remoteEntry.js` можно указать `mf-manifest.json` с метаданными.
    links:
      - https://webpack.js.org/concepts/module-federation/
      - https://module-federation.io/configure/remotes

  - id: mf-004
    topic: Основы
    level: junior
    question: |
      Remote объявил `exposes: { './Product': './src/Product.tsx' }`. Хост вызывает `loadRemote('shop/Cart')`. Что
      произойдёт?
    options:
      - text: 'Хост получит `undefined` и продолжит работу'
        why: 'Рантайм не молчит: он бросает ошибку с кодом.'
      - text: 'Загрузка упадёт с ошибкой: remote не отдаёт такой модуль'
        correct: true
        why: 'Наружу доступно только то, что перечислено в `exposes`. В рантайме 2.0 это ошибка RUNTIME-014.'
      - text: 'Рантайм сам найдёт файл `Cart` внутри исходников remote'
        why: 'Исходников в браузере нет, а неэкспортированные модули снаружи недоступны.'
      - text: 'Сборка хоста упадёт с ошибкой, потому что модуля нет'
        why: 'Хост о составе remote при сборке не знает — ошибка будет только в рантайме.'
    explanation: |
      `exposes` — публичный контракт remote: ключ (`./Product`) — имя для потребителей, значение — путь к файлу.
      Частые причины ошибки: опечатка, лишний или пропущенный `./`, разный регистр, устаревшая сборка remote.
    links:
      - https://module-federation.io/guide/troubleshooting/runtime

  - id: mf-005
    topic: Основы
    level: junior
    question: |
      Зачем нужен раздел `shared`?
    options:
      - text: 'Чтобы участники переиспользовали общие библиотеки друг друга'
        correct: true
        why: 'Иначе каждый remote привезёт свою копию: лишний вес и проблемы у библиотек с внутренним состоянием.'
      - text: 'Чтобы перечислить модули, которые remote отдаёт хосту'
        why: 'Это делает `exposes`.'
      - text: 'Чтобы разрешить хосту и remote читать один localStorage'
        why: 'localStorage общий у всех скриптов одного origin и без всякого `shared`.'
      - text: 'Чтобы объединить их сторы Redux в один'
        why: '`shared` делит модуль библиотеки, а стор создаёт код приложения, и у каждого он свой.'
    explanation: |
      Все участники кладут свои версии общих библиотек в общую область (share scope), а при использовании рантайм
      выбирает подходящую версию. Если версии совместимы, все берут одну копию; если нет — правила задают `singleton`,
      `requiredVersion` и `strictVersion`.
    links:
      - https://module-federation.io/configure/shared

  - id: mf-006
    topic: Основы
    level: junior
    question: |
      Что означает строка `remotes: { shop: 'shop@https://cdn.example.com/shop/remoteEntry.js' }` в конфиге хоста?
    options:
      - text: '`shop` слева — npm-пакет, который нужно установить в хост'
        why: 'Ничего не устанавливается: это имя, под которым хост импортирует модули remote.'
      - text: 'Хост будет копировать файлы `shop` к себе при каждой сборке'
        why: 'Ничего не копируется: код remote загружается из сети в рантайме.'
      - text: '`shop` — имя в импортах, далее имя контейнера и адрес входа'
        correct: true
        why: 'Ключ — алиас в импортах (`shop/Product`), до `@` — имя контейнера, после — адрес `remoteEntry.js`.'
      - text: 'Это адрес API бэкенда магазина для запросов хоста'
        why: 'Это адрес JavaScript-контейнера, а не API.'
    explanation: |
      Для классического входа имя до `@` должно совпадать с `name` в конфиге remote, иначе контейнер не найдётся.
      Если подключать remote через манифест, имя берётся из него. В рантайме 2.0 тот же remote описывают объектом
      `{ name, entry }`.
    links:
      - https://module-federation.io/configure/remotes

  - id: mf-007
    topic: Основы
    level: junior
    question: |
      Как в коде хоста подключить компонент из remote?
    options:
      - text: 'Установить remote как зависимость через npm и импортировать как обычный пакет'
        why: 'Тогда это сборка на этапе билда, без независимого деплоя.'
      - text: 'Импортировать `shop/Product` динамически или через `loadRemote`'
        correct: true
        why: 'Для `import()` сборщик знает, что `shop/*` — remote; `loadRemote` находит remote по имени в рантайме.'
      - text: 'Скачать JS-файл через `fetch` и выполнить его через `eval`'
        why: 'Это обход всего механизма: ни общих зависимостей, ни контракта.'
      - text: 'Вставить remote на страницу через `<iframe>`'
        why: 'Это другой подход к микрофронтендам, не Module Federation.'
    explanation: |
      Типичный код: `const Product = React.lazy(() => import('shop/Product'))` или
      `React.lazy(() => loadRemote('shop/Product'))`. Компонент оборачивают в `Suspense` (пока грузится) и
      `ErrorBoundary` (если не загрузился).
    links:
      - https://module-federation.io/guide/runtime/runtime-api

