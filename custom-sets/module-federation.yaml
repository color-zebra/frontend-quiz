    question: |
      Хост: `lib` 1.0.0, `{ singleton: true, strictVersion: true, requiredVersion: '^1.0.0' }`. Remote: `lib` 2.0.0,
      `{ singleton: true }`. Стратегия `version-first`. Что произойдёт в хосте при `import('lib')`?
    options:
      - text: 'Хост получит 1.0.0: `strictVersion` заставляет взять подходящую версию'
        why: 'У singleton копия одна. `strictVersion` не выбирает другую копию, а запрещает неподходящую.'
      - text: 'Хост получит 2.0.0 и предупреждение, как без `strictVersion`'
        why: 'С `strictVersion` предупреждение превращается в ошибку.'
      - text: 'Импорт в хосте упадёт с ошибкой о несовпадении версии'
        correct: true
        why: 'Наивысшая версия 2.0.0 не подходит под `^1.0.0`, а `strictVersion` запрещает её использовать.'
      - text: 'Упадёт загрузка remote, а хост продолжит работать с 1.0.0'
        why: 'Remote не строгий — ему 2.0.0 подходит. Падает сторона со `strictVersion`.'
    explanation: |
      Сообщение: «Version 2.0.0 from remote of shared singleton module lib does not satisfy the requirement of host
      which needs ^1.0.0». Важно, где именно падает: на той стороне, которая объявила `strictVersion`. Для singleton
      `strictVersion` превращает несовпадение в ошибку. Для обычной зависимости с локальной копией несовпадение
      ничего не ломает: берётся своя копия, поэтому там `strictVersion` по умолчанию включён. Без `requiredVersion`
      у `strictVersion` нет эффекта.
    links:
      - https://webpack.js.org/plugins/module-federation-plugin
      - https://module-federation.io/configure/shared

