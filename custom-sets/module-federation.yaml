  - id: mf-009
    topic: Основы
    level: junior
    question: |
      Команда remote починила баг и выкатила новую версию. Что нужно сделать хосту, чтобы пользователи её получили?
    options:
      - text: 'Обновить версию remote в `package.json` хоста и пересобрать хост'
        why: 'Хост не держит remote в зависимостях. Пересборка не нужна — в этом смысл независимого деплоя.'
      - text: 'Ничего: при следующей загрузке страницы хост возьмёт свежий вход'
        correct: true
        why: 'Если `remoteEntry.js` не закэширован надолго, хост получит новую версию remote без своего деплоя.'
      - text: 'Пересобрать хост с флагом, который сбрасывает кэш remote'
        why: 'Такого флага нет: обновление remote не требует действий от хоста.'
      - text: 'Перезапустить сервер, на котором работает хост'
        why: 'Код remote грузит браузер напрямую, сервер хоста здесь ни при чём.'
    explanation: |
      Независимый деплой — главная причина выбирать Module Federation. Уже открытые вкладки остаются на старой
      версии до перезагрузки. А если адрес remote содержит версию в пути, хосту придётся поменять адрес в конфиге.
      Оборотная сторона независимости: если remote сломал контракт, хост узнает об этом только в рантайме.
    links:
      - https://webpack.js.org/concepts/module-federation/

  - id: mf-010
    topic: Основы
    level: middle
    question: |
      Какие изменения в remote сломают хост в рантайме, хотя сборка хоста пройдёт без ошибок?
    options:
      - text: 'Переименовали ключ в `exposes`'
        correct: true
        why: 'Хост просит старое имя, а такого модуля больше нет.'
      - text: 'Поменяли обязательные пропсы выставленного компонента'
        correct: true
        why: 'Хост передаёт старые пропсы — компонент получит не то, что ждёт.'
      - text: 'Поменяли `name` контейнера, а хост подключает его по `remoteEntry.js`'
        correct: true
        why: 'Хост ищет контейнер по старому имени.'
      - text: 'Отрефакторили внутренний код, не меняя выставленных модулей и их API'
        why: 'Внутренности хосту не видны — это и есть смысл контракта.'
      - text: 'Обновили зависимость, которой нет в `shared`'
        why: 'Она внутри бандла remote и хоста не касается.'
    explanation: |
      Контракт remote — это имя контейнера, ключи `exposes` и API выставленных модулей. Его защищают контрактными
      тестами в сборке remote и меняют API только с обратной совместимостью; типы из `dts` помогают хосту, когда
      он сам переходит на новую версию.
    links:
      - https://module-federation.io/configure/dts

  - id: mf-011
    topic: Основы
    level: junior
    question: |
      В каких сборщиках есть Module Federation?
    options:
