    question: |
      Как изолировать стили микрофронтендов друг от друга?
    options:
      - text: 'CSS Modules или префиксы классов'
        correct: true
        why: 'Имена классов уникальны, правила одного микрофронтенда не задевают другой.'
      - text: 'Shadow DOM для полностью изолированного виджета'
        correct: true
        why: 'Стили не проникают внутрь и не вытекают наружу. Цена — сложности с порталами и общей темой.'
      - text: 'Глобальные стили каждого микрофронтенда с `!important`'
        why: 'Это эскалация конфликтов, а не изоляция.'
      - text: 'Делать CSS общей зависимостью singleton'
        why: '`shared` делит JavaScript-модули, к изоляции стилей это не относится.'
    explanation: |
      Частая проблема — глобальные стили и сбросы (reset), которые микрофронтенд приносит с собой: они меняют вид
      всей страницы. Отдельная беда — разные версии UI-кита у разных микрофронтендов с глобальными классами.
    links:
      - https://webpack.js.org/concepts/module-federation/

  - id: mf-066
    topic: Роутинг, состояние, стили
    level: middle
    question: |
      Компонент из remote на мгновение показывается без стилей, а потом «встаёт на место». Почему?
    options:
      - text: 'Стили модуля подключаются отдельно и применяются позже разметки'
        correct: true
        why: 'Например, CSS вставляется в документ только при выполнении модуля или грузится запросом, которого загрузчик не ждёт.'
      - text: 'Браузер блокирует стили с других доменов'
        why: 'Стили с другого домена браузер применяет; CORS для них не нужен.'
      - text: 'Стили remote всегда применяются только после второго рендера'
        why: 'Порядок рендеров тут ни при чём — важно, когда загрузился CSS.'
      - text: 'Хост сначала рисует свою версию компонента, а потом подменяет'
        why: 'Хост ничего не подменяет — он рисует то, что пришло из remote.'
    explanation: |
      Это мигание без стилей (FOUC). В webpack с `mini-css-extract-plugin` загрузка чанка ждёт и его CSS, поэтому там
      мигания обычно нет; чаще его видят с remote на Vite и со стилями, которые вставляет JavaScript. Лечится тем, что
      модуль показывают только после загрузки его стилей:
      CSS-in-JS со стилями в самом модуле или ожидание стилей перед показом. Предзагрузка ресурсов модуля
      (`preloadRemote`) сокращает ожидание, но мигание без ожидания не убирает.
    links:
      - https://module-federation.io/guide/runtime/runtime-api

  - id: mf-087
    topic: Роутинг, состояние, стили
    level: junior
    question: |
      Онлайн-кинотеатр собран из микрофронтендов на одном домене: каталог фильмов, плеер, подписка. Где держать
      сессию пользователя?
    options:
      - text: 'Каждая часть сама входит и хранит свой токен у себя'
        why: 'Человек увидит несколько входов, а выход из одной части не выведет из остальных.'
      - text: 'Оболочка владеет токеном и держит его в `window.token`, откуда его читают все части'
        why: 'Токен прочитает любой скрипт страницы, а части станут зависеть от скрытого глобального имени.'
      - text: 'Оболочка: сессия в cookie с `HttpOnly`, данные пользователя — пропсами'
        correct: true
        why: 'Браузер сам приложит cookie к запросам частей, а скрипты её не прочитают.'
      - text: 'Каждая часть при монтировании копирует токен оболочки себе'
        why: 'Копия протухнет после обновления токена, и часть начнёт получать отказы.'
    explanation: |
      Вход — общий ресурс, и владелец у него один, как у адресной строки. На общем домене удобнее всего cookie
      сессии с `HttpOnly`: она уходит с каждым запросом к своему API и недоступна скриптам. Если API на другом
      домене и нужен токен, оболочка передаёт частям функцию `getToken()`, которая всегда отдаёт свежий токен.
    links:
      - https://developer.mozilla.org/ru/docs/Web/HTTP/Cookies

  - id: mf-088
    topic: Роутинг, состояние, стили
    level: middle
    question: |
      Счётчик в шапке онлайн-кинотеатра слушает событие `watchlist:changed` с `{ count }` от части «Мои списки».
      Шапку делает другая команда со своими выкатками. «Мои списки» хотят передавать ещё и id последнего
      добавленного фильма. Как это сделать, не сломав шапку?
    options:
      - text: 'Переименовать событие в `watchlist:updated` и передать оба поля'
        why: 'Шапка слушает старое имя и перестанет получать события вовсе.'
      - text: 'Передавать в `count` объект `{ count, lastId }` вместо числа'
        why: 'Шапка ждёт в `count` число и покажет вместо него `[object Object]` или сломается.'
      - text: 'Добавить в `detail` того же события новое поле `lastId`'
        correct: true
        why: 'Старый слушатель новое поле просто не читает, а новые им пользуются.'
      - text: 'Договориться с командой шапки выкатиться в тот же час'
        why: 'Это общий график выкатки, от которого микрофронтенды и уходят; да и открытые вкладки останутся старыми.'
    explanation: |
      Событие между частями — контракт, как пропсы или API. Добавлять новые поля можно: это обратно совместимое
      изменение. Переименование события или поля и смена типа значения ломают тех, кто ещё не обновился. Такое
      изменение выпускают новым событием рядом со старым и убирают старое, когда его никто не слушает: «добавить
      рядом, перевести, удалить».
    links:
      - https://martinfowler.com/articles/micro-frontends.html

  - id: mf-089
    topic: Роутинг, состояние, стили
    level: senior
    question: |
      Сервис бронирования отелей: оболочка и remote «Мои бронирования» делят `react-router-dom` v6 как singleton.
      Оболочка рендерит remote внутри своего `BrowserRouter` на пути `/bookings/*`. Разработчик remote, чтобы тот
      запускался и отдельно, обернул его корневой компонент в собственный `BrowserRouter`. Что будет при открытии
      `/bookings` в оболочке?
    options:
      - text: 'Два роутера будут спорить за адрес, но никаких ошибок в консоли не появится'
        why: 'Так было бы с двумя копиями роутера. Здесь копия одна, и она видит, что уже внутри роутера.'
      - text: 'Всё заработает: внутренний роутер получит базовый путь от внешнего'
        why: '`BrowserRouter` не наследует базовый путь от внешнего — он сам слушает весь адрес.'
      - text: 'React Router бросит ошибку: роутер внутри другого роутера запрещён'
        correct: true
        why: 'Общая копия видит контекст роутера оболочки и не даёт создать второй роутер внутри.'
      - text: '«Invalid hook call», потому что на странице две копии роутера'
        why: 'Роутер общий singleton — копия одна. «Invalid hook call» бывает при двух копиях React.'
    explanation: |
      React Router v6 бросает «You cannot render a `<Router>` inside another `<Router>`». Правильно: корневой
      компонент remote рисует только маршруты (`Routes`) относительно пути, который дала оболочка, а свой
      `BrowserRouter` ставит отдельная точка входа для самостоятельного запуска remote. Без общего роутера ошибки
      не было бы, но два роутера слушали бы одну историю браузера и мешали друг другу.
    links:
      - https://reactrouter.com/6.30.1/router-components/browser-router

  # ===================== Деплой и производительность =====================
  - id: mf-053
    topic: Деплой и производительность
    level: junior
    multiple: true
    question: |
      После деплоя remote часть пользователей ещё долго видит старую версию. Как настроить кэширование, чтобы
      обновления доходили сразу и без лишнего трафика?
    options:
      - text: 'Отдавать `remoteEntry.js` без долгого кэша'
        correct: true
        why: 'Вход должен всегда приходить свежим, иначе он ссылается на старые чанки.'
      - text: 'Отдавать чанки с хешем в имени и долгим кэшем'
        correct: true
        why: 'Новая сборка — новые имена, старые закэшированные файлы не мешают.'
      - text: 'Отключить кэш у всех файлов remote'
        why: 'Обновления дойдут, но каждый пользователь будет заново качать всё — лишний трафик.'
      - text: 'Добавлять номер версии remote в `shared`'
        why: '`shared` не управляет кэшированием.'
    explanation: |
      Схема как у обычного SPA: точка входа без кэша, файлы с хешем — надолго. Манифест, если он используется,
      тоже отдают без долгого кэша.
    links:
      - https://module-federation.io/configure/remotes

  - id: mf-054
    topic: Деплой и производительность
    level: junior
    question: |
      Что чаще всего делает систему на Module Federation медленнее монолита?
    options:
      - text: 'Дубли библиотек и цепочка загрузок'
        correct: true
        why: 'Библиотеки вне `shared` приезжают с каждым remote, а модуль появляется только после загрузки входа.'
      - text: 'Рантайм заново выполняет модуль при каждом импорте'
        why: 'Модуль выполняется один раз, дальше берётся из кэша.'
      - text: 'Общие зависимости по умолчанию лежат в стартовом бандле'
        why: 'По умолчанию они грузятся асинхронно, в стартовый бандл их кладёт `eager`.'
      - text: 'Браузер не кэширует файлы с других доменов'
        why: 'Кэширует при правильных заголовках.'
    explanation: |
      Лечение: договориться о списке общих библиотек и их версиях; предзагружать remote заранее (`preloadRemote`,
      манифест); не дробить приложение на слишком мелкие remote.
    links:
      - https://module-federation.io/guide/runtime/runtime-api

  - id: mf-055
    topic: Деплой и производительность
    level: junior
    question: |
      Remote нужно поменять API выставленного компонента так, что старый хост сломается. Как выкатить без поломки?
    options:
      - text: 'Выкатить remote, а хост обновить в тот же день'
        why: 'Между двумя деплоями хост будет сломан у пользователей.'
      - text: 'Выставить `./ProductV2` рядом со старым'
        correct: true
        why: 'Старый хост работает со старым модулем, новый — с новым. Когда хост переехал, старый модуль убирают.'
      - text: 'Обновить версию remote в `package.json`'
        why: 'Хост не зависит от версии remote в `package.json`.'
      - text: 'Включить у хоста `strictVersion`'
        why: '`strictVersion` касается общих библиотек, а не модулей remote.'
    explanation: |
      Это стратегия «расширить и сузить» (expand and contract): сначала добавить новое рядом со старым, потом
      перевести потребителей, потом удалить старое. Контрактные тесты в сборке remote помогают заметить поломку
      заранее, а типы из `dts` — перевести хост на новый модуль.
    links:
      - https://module-federation.io/configure/dts

  - id: mf-090
    topic: Деплой и производительность
    level: middle
    multiple: true
    question: |
      Remote выкатили днём, и старые чанки при выкатке удалили с CDN. У людей, которые держали вкладку открытой
      с утра, переход на экран из этого remote падает: чанки отвечают 404. Почему?
    options:
      - text: 'CDN ещё не успел получить новые чанки после выкатки'
        why: 'Открытая вкладка просит не новые чанки, а старые: её вход загружен ещё до выкатки.'
      - text: 'Старый вход в памяти вкладки ссылается на удалённые чанки прошлой сборки'
        correct: true
        why: 'Вход загрузился утром и знает только утренние имена файлов, а их уже нет.'
      - text: 'Хост закэшировал модули remote в памяти и не берёт новые'
        why: 'Модуль из кэша грузить не нужно — 404 тогда не было бы. Падает загрузка ещё не скачанных чанков.'
      - text: 'Новая версия remote несовместима с хостом по версиям общих библиотек из `shared`'
        why: 'Несовместимость версий даёт предупреждение или ошибку версии, а не 404 на файлах.'
    explanation: |
      Вход remote перечисляет чанки своей сборки по именам с хешем. Вкладка, открытая до выкатки, держит в памяти
      старый вход и при первом обращении к новому экрану просит старые файлы. Поэтому старые чанки хранят на CDN
      несколько дней после выкатки, а на ошибку загрузки чанка показывают предложение обновить страницу.
    links:
      - https://module-federation.io/configure/remotes

  - id: mf-091
    topic: Деплой и производительность
    level: middle
    question: |
      Медиапортал собран из микрофронтендов. Ошибки плеера — отдельного remote — попадают в отчёты команды главной
      страницы, потому что происходят на её страницах. Как сделать, чтобы предупреждения получала команда плеера?
    options:
      - text: 'Отключить сбор ошибок в оболочке, чтобы ошибки ловили только сами части у себя'
        why: 'Пропадут ошибки самой оболочки и необработанные ошибки, которые ни одна часть не поймала.'
      - text: 'Пересылать все ошибки из границы ошибок оболочки в общий чат команд'
        why: 'Владелец по-прежнему неизвестен: разбирать общий поток придётся всем по очереди.'
      - text: 'Подписывать каждую ошибку частью, версией и командой по загруженному remote'
        correct: true
        why: 'Оболочка знает, какой remote загрузила и откуда, — по пометке отчёт уходит владельцу.'
      - text: 'Попросить команды по очереди просматривать общий отчёт оболочки'
        why: 'Дежурство по чужим ошибкам не делает отчёт адресным и быстро превращается в шум.'
    explanation: |
      В системе из частей все ошибки происходят на страницах оболочки. Чтобы сбой доходил до владельца, оболочка
      добавляет к каждой ошибке, к какой части она относится, какой версии и какой команды. Каждая часть
      выкладывает свои карты исходников, чтобы стек читался в её коде.
    links:
      - https://martinfowler.com/articles/micro-frontends.html

  - id: mf-092
    topic: Деплой и производительность
    level: middle
    question: |
      Экран бронирования в сервисе отелей открывается через 1,5 секунды после клика. Remote подключён через
      манифест, у хоста стратегия `loaded-first`, поэтому после клика сначала грузится вход remote, потом чанк
      экрана, потом данные брони. Что сократит ожидание сильнее всего, если архитектуру не менять?
    options:
      - text: 'Сделать `react` и `react-dom` общими с `eager: true`'
        why: '`eager` ускоряет старт приложения, а не открытие экрана из remote по клику.'
      - text: 'Переключиться на `version-first`, чтобы входы всех remote грузились ещё при старте'
        why: 'Уберёт один шаг — вход, но чанк и данные пойдут по очереди после клика, а старт станет зависеть от всех remote.'
      - text: 'Грузить заранее: вход и чанк — при наведении, данные — параллельно с кодом'
        correct: true
        why: 'Цепочка разрывается: к клику код уже в кэше, а данные не ждут код.'
      - text: 'Собрать экран бронирования вместе с оболочкой в один бандл'
        why: 'Это смена архитектуры, которую условие исключает, и конец независимой выкатки экрана.'
    explanation: |
      Главный тормоз федерации — цепочка загрузок, где каждый шаг ждёт предыдущего. Её разрывают предзагрузкой
      (`preloadRemote` при наведении или по вероятному переходу; файлы модуля рантайм берёт из манифеста remote)
      и параллельными запросами данных. Ещё помогают общий список библиотек без дублей и разумный размер remote:
      каждый лишний remote — лишний шаг цепочки.
    links:
      - https://module-federation.io/guide/runtime/runtime-api

  - id: mf-093
    topic: Деплой и производительность
    level: senior
    question: |
      Онлайн-банк: шесть команд, микрофронтенды на Module Federation, всё в одном монорепозитории, у каждой части
      свой конвейер выкатки. Remote «Платежи» импортирует напрямую файл соседа:
      `import { formatAmount } from '../../cards/src/utils/money'`. Сборка проходит. Чем это плохо?
    options:
      - text: 'Ничем: в монорепозитории общий код можно брать из любой папки'
        why: 'Монорепозиторий не отменяет контрактов: «Карты» не знают, что их внутренний файл кто-то использует.'
      - text: 'Сборка «Платежей» упадёт, как только «Карты» выкатят новую версию своей части'
        why: 'Не упадёт: файл уже скопирован в бандл «Платежей» при их сборке. Беда тише и хуже.'
      - text: '«Платежи» зависят от внутренностей «Карт» в обход контракта и везут копию их кода'
        correct: true
        why: '«Карты» поменяют файл — «Платежи» сломаются при своей следующей сборке или разойдутся в поведении.'
      - text: 'Функция загрузится на страницу дважды и нарушит singleton общих зависимостей'
        why: 'Это не общая библиотека и не singleton: файл просто скопирован в чужой бандл.'
    explanation: |
      Микрофронтенды — про независимую выкатку, а не про число репозиториев. В монорепозитории легко взять файл
      соседа, и сборка это пропустит. Границы держат линтером (`enforce-module-boundaries` в Nx,
      `eslint-plugin-boundaries`), а общий код выносят в пакет с версией или отдают через `exposes`.
    links:
      - https://nx.dev/features/enforce-module-boundaries

  - id: mf-094
    topic: Деплой и производительность
    level: junior
    question: |
      Онлайн-школа собрана из микрофронтендов с независимыми выкатками. Новая версия части «Расписание» сломала
      фильтры. Как откатить быстрее всего?
    options:
      - text: 'Откатить всю систему на вчерашнее состояние'
        why: 'Вместе с расписанием откатятся чужие исправления, а они ни в чём не виноваты.'
      - text: 'Команда «Расписания» возвращает прошлую сборку своей части'
        correct: true
        why: 'Откат касается только сломанной части, остальные и оболочку никто не трогает.'
      - text: 'Пересобрать и выкатить оболочку со старым адресом «Расписания»'
        why: 'Если адрес входа стабилен, оболочку пересобирать не нужно: достаточно вернуть прошлую сборку по нему.'
      - text: 'Дождаться общего релиза, в который войдёт исправление'
        why: 'Общего релиза при независимых выкатках нет — и ждать его незачем.'
    explanation: |
      Откат — та же выкатка, только назад, и при независимых выкатках он свой у каждой части. Команда снова отдаёт
      по адресу входа прошлую сборку, а вход идёт без долгого кэша, поэтому люди получают старую версию при
      следующей загрузке страницы.
    links:
      - https://martinfowler.com/articles/micro-frontends.html

  # ===================== Архитектура и альтернативы =====================
  - id: mf-056
    topic: Архитектура и альтернативы
    level: junior
    question: |
      Когда Module Federation скорее не нужна?
    options:
      - text: 'Небольшая команда, один продукт, релизы и так выходят вместе'
        correct: true
        why: 'Микрофронтенды дают независимые релизы ценой сложности. Если релизы общие, остаётся только сложность.'
      - text: 'Несколько команд, которым нужны независимые релизы'
        why: 'Это как раз сценарий, ради которого её выбирают.'
      - text: 'Большая платформа с десятками разделов от разных команд'
        why: 'Тоже типичный сценарий для микрофронтендов.'
      - text: 'Переезд со старого сборщика по частям'
        why: 'Federation помогает переезжать постепенно: части на разных сборщиках живут вместе.'
    explanation: |
      Цена Module Federation: договорённости о версиях общих библиотек, контракты между командами, сложнее
      отладка и тестирование, риск дублей. Платить её стоит, когда независимость команд важнее.
    links:
      - https://webpack.js.org/concepts/module-federation/

  - id: mf-057
    topic: Архитектура и альтернативы
    level: middle
    question: |
      Чем встраивание через iframe с другого домена отличается от Module Federation?
    options:
      - text: 'Iframe изолирует стили, глобальные переменные и необработанные ошибки'
        correct: true
        why: 'Страница внутри iframe — отдельный документ со своим окном.'
      - text: 'Через iframe сложнее модалки поверх всей страницы и подгонка высоты'
        correct: true
        why: 'Содержимое iframe не выходит за его рамки, размер приходится синхронизировать вручную.'
      - text: 'С iframe с другого домена обмен данными идёт через `postMessage`'
        correct: true
        why: 'Прямых вызовов функций и пропсов между разными origin нет.'
      - text: 'Module Federation изолирует ошибки лучше, чем iframe'
        why: 'Наоборот: код remote работает в той же странице, и его ошибка может уронить хост.'
      - text: 'Iframe позволяет делить React между хостом и встроенным приложением'
        why: 'У iframe своё окно, React в нём всегда свой.'
    explanation: |
      Iframe выбирают, когда важнее изоляция и независимость стеков (например, встраивание редактора со своей
      сборкой). Module Federation — когда важны общая вёрстка, передача компонентов и общие библиотеки. Если iframe
      с того же origin, родитель может напрямую обращаться к его окну, и изоляция слабее.
    links:
      - https://webpack.js.org/concepts/module-federation/

  - id: mf-058
    topic: Архитектура и альтернативы
    level: middle
    question: |
      Какие подходы дают независимый деплой частей фронтенда?
    options:
      - text: 'Module Federation'
        correct: true
        why: 'Каждый remote деплоится сам, хост подхватывает новую версию в рантайме.'
      - text: 'iframe'
        correct: true
        why: 'Встроенная страница деплоится независимо.'
      - text: 'single-spa с отдельно собранными приложениями'
        correct: true
        why: 'Оркестратор подгружает приложения по отдельности, даже на разных фреймворках.'
      - text: 'Общие npm-пакеты, которые подключаются при сборке'
        why: 'Новая версия пакета требует пересборки и деплоя потребителя.'
      - text: 'Монорепозиторий с общей сборкой'
        why: 'Одна сборка — один деплой.'
    explanation: |
      Ещё один подход — нативные ES-модули и import maps (например, Native Federation): браузер сам сопоставляет
      имена модулей с адресами. Выбор зависит от того, нужны ли общие библиотеки, изоляция и разные фреймворки.
    links:
      - https://webpack.js.org/concepts/module-federation/

  - id: mf-059
    topic: Архитектура и альтернативы
    level: junior
    question: |
      Зачем remote иметь собственную HTML-страницу и точку входа, если его всё равно встраивают в хост?
    options:
      - text: 'Чтобы запускать и отлаживать его отдельно, без хоста'
        correct: true
        why: 'Команда remote работает над своей частью, не поднимая всю систему.'
      - text: 'Без своей страницы `remoteEntry.js` не соберётся'
        why: 'Вход контейнера собирается и без HTML-страницы.'
      - text: 'Хост загружает HTML-страницу remote вместо его входа'
        why: 'Хост загружает JavaScript-вход, а не страницу.'
      - text: 'Чтобы поисковики индексировали remote отдельно'
        why: 'К поиску это отношения не имеет.'
    explanation: |
      Отдельный запуск упрощает разработку и тесты. Цена — remote должен уметь работать без хоста: иметь свои
      копии общих библиотек (поэтому `import: false` мешает такому запуску) и заглушки для того, что обычно даёт хост.
    links:
      - https://module-federation.io/guide/start/quick-start

  - id: mf-060
    topic: Архитектура и альтернативы
    level: junior
    question: |
      Как тестировать систему на Module Federation?
    options:
      - text: 'Юнит-тесты каждого remote отдельно'
        correct: true
        why: 'Каждая часть проверяется сама по себе, быстро и без остальной системы.'
      - text: 'Контрактные тесты API между хостом и remote'
        correct: true
        why: 'Ловят несовпадение имён модулей и пропсов раньше, чем это увидят пользователи.'
      - text: 'Сквозные тесты собранной системы на стенде'
        correct: true
        why: 'Ловят проблемы склейки: версии библиотек, роутинг, стили.'
      - text: 'Снапшот-тесты содержимого `remoteEntry.js`'
        why: 'Файл меняется при каждой сборке — такой тест ничего не проверяет.'
      - text: 'Подключать настоящие remote вместо моков в каждом юнит-тесте хоста'
        why: 'Медленно и нестабильно, это задача сквозных тестов.'
    explanation: |
      Каждый вид тестов ловит своё: юнит-тесты — поломки внутри части, контрактные — расхождения API между
      частями, сквозные — проблемы склейки. Ни один из них не заменяет остальные.
    links:
      - https://module-federation.io/guide/runtime/runtime-hooks.html
