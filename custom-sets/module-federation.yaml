      - text: 'Ошибку «модуль не найден»: нужно объявление модуля или типы remote'
        correct: true
        why: 'Компилятор не знает модуль remote, пока о нём ничего не сказано.'
      - text: 'Ошибку в рантайме, а при компиляции всё пройдёт'
        why: 'Компилятор проверяет импорты при сборке, ошибка будет именно там.'
      - text: 'Ошибку, которую можно убрать только переписав хост на JavaScript'
        why: 'Хватит объявления модуля или типов из remote.'
    explanation: |
      Объявление вида `declare module 'shop/*' { const Component: React.ComponentType<any>; export default Component; }`
      убирает ошибку, но превращает пропсы в `any` — дальше компилятор вам не помощник.
    links:
      - https://module-federation.io/configure/dts

  - id: mf-008
    topic: Основы
    level: junior
    question: |
      Когда браузер скачивает код модуля, который remote отдаёт через `exposes`?
    options:
      - text: 'Сразу при загрузке хоста, вместе с его основным бандлом'
        why: 'Код модуля не входит в бандл хоста и не качается заранее сам по себе.'
      - text: 'Когда хост впервые импортирует этот модуль'
        correct: true
        why: 'Модуль грузится по требованию: при `import()` или `loadRemote`.'
      - text: 'Заранее, если хост вызвал для него `preloadRemote`'
        correct: true
        why: 'Предзагрузка скачивает файлы модуля, но не выполняет его.'
      - text: 'При сборке хоста, чтобы положить его в папку `dist`'
        why: 'Хост при сборке код remote не скачивает.'
      - text: 'Когда remote задеплоен: сервер сам присылает новый код в браузер'
        why: 'Сервер ничего не присылает: браузер сам запрашивает файлы.'
    explanation: |
      Тонкость: входной файл `remoteEntry.js` может загрузиться раньше модуля. При стратегии `version-first` (по
      умолчанию в рантайме 2.0) рантайм загружает входы remote при старте, чтобы собрать их версии общих
      зависимостей. А сами модули всё равно качаются только при импорте или предзагрузке.
    links:
      - https://module-federation.io/configure/shareStrategy.html

  - id: mf-063
