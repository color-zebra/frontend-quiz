# Свой набор: Module Federation — основы, shared и версии, асинхронная граница, рантайм, сборщики,
# ошибки, роутинг и состояние, деплой, альтернативы.
# Формат — как у любого стороннего набора (см. examples/README.md). В сборку приложения не входит.
# Вопросы с пометкой «Проверено на стенде» сверены на webpack 5.111.1 + @module-federation/enhanced 2.9.2.
title: Module Federation
questions:
  # ===================== Основы =====================
  - id: mf-001
    topic: Основы
    level: junior
    question: |
      Что такое Module Federation?
    options:
      - text: 'Способ собрать несколько приложений в один общий бандл на этапе сборки'
        why: 'Наоборот: приложения собираются и деплоятся отдельно, а соединяются уже в браузере.'
      - text: 'Загрузка модулей из отдельно собранных приложений в рантайме'
        correct: true
        why: 'Каждое приложение собирается само, а в браузере одно подгружает модули другого и делит с ним зависимости.'
      - text: 'Инструмент для управления пакетами в монорепозитории'
        why: 'Монорепой управляют pnpm workspaces, Nx, Turborepo. Module Federation про загрузку кода в рантайме.'
      - text: 'Фреймворк для серверного рендеринга микрофронтендов'
        why: 'Module Federation работает и в браузере, и на Node, но фреймворком SSR не является.'
    explanation: |
      Module Federation появилась в webpack 5. Приложения собираются и деплоятся независимо, а в браузере одно
      приложение загружает модули другого по сети и при этом делит с ним общие библиотеки, например React. Сейчас
      её развивает проект Module Federation 2.0: общий рантайм `@module-federation/runtime`, плагин для webpack и
      Rspack в пакете `@module-federation/enhanced` и плагин для Vite `@module-federation/vite`.
    links:
      - https://webpack.js.org/concepts/module-federation/
      - https://module-federation.io/guide/start/quick-start

  - id: mf-002
    topic: Основы
    level: junior
    question: |
      Какие утверждения о хосте и remote верны?
    options:
      - text: 'Хост загружает модули из других приложений'
        correct: true
        why: 'Хост — потребитель: он подключает remote и берёт из него модули.'
      - text: 'Remote отдаёт наружу часть своих модулей'
        correct: true
        why: 'Remote объявляет в `exposes`, какие модули можно взять снаружи.'
      - text: 'Одно приложение может быть и хостом, и remote'
        correct: true
        why: 'Например, remote для оболочки и при этом сам подключает другой remote — вложенная федерация.'
      - text: 'Хост и remote собираются одной и той же версией сборщика'
        why: 'Важен формат контейнера, а не версия сборщика. Рантайм 2.0 подключает remote и на webpack, и на Vite.'
      - text: 'Remote знает список хостов, которые его подключают'
        why: 'Remote не знает потребителей: он только публикует вход.'
    explanation: |
      Роли условны: хост — тот, кто потребляет, remote — тот, кто отдаёт. В реальных системах приложение-оболочка
      подключает десятки remote, а некоторые remote сами подключают другие remote.
    links:
      - https://module-federation.io/guide/start/quick-start

  - id: mf-061
    topic: Основы
    level: junior
    question: |
      В конфиге remote заданы `name: 'shop'`, `filename: 'remoteEntry.js'` и `exposes`. За что отвечает каждое поле?
    options:
      - text: '`name` — имя контейнера, `filename` — имя входного файла, `exposes` — что отдаётся наружу'
        correct: true
        why: 'Хост ищет контейнер по `name`, загружает файл `filename` и берёт модули, перечисленные в `exposes`.'
      - text: '`name` — заголовок вкладки, `filename` — имя входного файла, `exposes` — что отдаётся наружу'
        why: 'К заголовку вкладки `name` отношения не имеет: это идентификатор контейнера.'
      - text: '`name` — имя контейнера, `filename` — путь к исходнику входа, `exposes` — что отдаётся наружу'
        why: '`filename` — имя собранного входного файла, а не исходник.'
      - text: '`name` — имя контейнера, `filename` — имя входного файла, `exposes` — общие библиотеки'
        why: 'Общие библиотеки — это `shared`. `exposes` — собственные модули remote.'
    explanation: |
      Для классического входа (`var`) `name` становится ещё и именем глобальной переменной, в которой лежит
      контейнер. Поэтому имена контейнеров должны быть уникальными и не совпадать с другими глобальными именами.
    links:
      - https://module-federation.io/configure/
      - https://webpack.js.org/plugins/module-federation-plugin

  - id: mf-003
    topic: Основы
    level: junior
    question: |
      Что такое `remoteEntry.js`?
    options:
      - text: 'Весь код remote, собранный в один большой файл'
        why: 'Это маленький входной файл. Код модулей лежит в отдельных чанках и грузится по требованию.'
      - text: 'HTML-страница remote, которую хост встраивает к себе'
        why: 'Это JavaScript-файл, а не страница. Встраивание страниц — это подход с iframe.'
      - text: 'Входной файл контейнера remote'
        correct: true
        why: 'Контейнер умеет `init` (получить общие зависимости) и `get` (отдать модуль). Остальное грузится по требованию.'
      - text: 'Конфиг хоста со списком подключаемых remote'
        why: 'Список remote лежит в конфиге хоста, а `remoteEntry.js` публикует сам remote.'
    explanation: |
      Хост сначала загружает `remoteEntry.js`, через `init` передаёт контейнеру общую область зависимостей (share
      scope), а затем через `get` получает нужный модуль. Только тогда скачиваются чанки этого модуля. В Module
      Federation 2.0 вместо `remoteEntry.js` можно указать `mf-manifest.json` с метаданными.
    links:
      - https://webpack.js.org/concepts/module-federation/
      - https://module-federation.io/configure/remotes

  - id: mf-004
    topic: Основы
    level: junior
    question: |
      Remote объявил `exposes: { './Product': './src/Product.tsx' }`. Хост вызывает `loadRemote('shop/Cart')`. Что
      произойдёт?
    options:
      - text: 'Хост получит `undefined` и продолжит работу'
        why: 'Рантайм не молчит: он бросает ошибку с кодом.'
      - text: 'Загрузка упадёт с ошибкой: remote не отдаёт такой модуль'
        correct: true
        why: 'Наружу доступно только то, что перечислено в `exposes`. В рантайме 2.0 это ошибка RUNTIME-014.'
      - text: 'Рантайм сам найдёт файл `Cart` внутри исходников remote'
        why: 'Исходников в браузере нет, а неэкспортированные модули снаружи недоступны.'
      - text: 'Сборка хоста упадёт с ошибкой, потому что модуля нет'
        why: 'Хост о составе remote при сборке не знает — ошибка будет только в рантайме.'
    explanation: |
      `exposes` — публичный контракт remote: ключ (`./Product`) — имя для потребителей, значение — путь к файлу.
      Частые причины ошибки: опечатка, лишний или пропущенный `./`, разный регистр, устаревшая сборка remote.
    links:
      - https://module-federation.io/guide/troubleshooting/runtime

  - id: mf-005
    topic: Основы
    level: junior
    question: |
      Зачем нужен раздел `shared`?
    options:
      - text: 'Чтобы участники переиспользовали общие библиотеки друг друга'
        correct: true
        why: 'Иначе каждый remote привезёт свою копию: лишний вес и проблемы у библиотек с внутренним состоянием.'
      - text: 'Чтобы перечислить модули, которые remote отдаёт хосту'
        why: 'Это делает `exposes`.'
      - text: 'Чтобы разрешить хосту и remote читать один localStorage'
        why: 'localStorage общий у всех скриптов одного origin и без всякого `shared`.'
      - text: 'Чтобы объединить их сторы Redux в один'
        why: '`shared` делит модуль библиотеки, а стор создаёт код приложения, и у каждого он свой.'
    explanation: |
      Все участники кладут свои версии общих библиотек в общую область (share scope), а при использовании рантайм
      выбирает подходящую версию. Если версии совместимы, все берут одну копию; если нет — правила задают `singleton`,
      `requiredVersion` и `strictVersion`.
    links:
      - https://module-federation.io/configure/shared

  - id: mf-006
    topic: Основы
    level: junior
    question: |
      Что означает строка `remotes: { shop: 'shop@https://cdn.example.com/shop/remoteEntry.js' }` в конфиге хоста?
    options:
      - text: '`shop` слева — npm-пакет, который нужно установить в хост'
        why: 'Ничего не устанавливается: это имя, под которым хост импортирует модули remote.'
      - text: 'Хост будет копировать файлы `shop` к себе при каждой сборке'
        why: 'Ничего не копируется: код remote загружается из сети в рантайме.'
      - text: '`shop` — имя в импортах, далее имя контейнера и адрес входа'
        correct: true
        why: 'Ключ — алиас в импортах (`shop/Product`), до `@` — имя контейнера, после — адрес `remoteEntry.js`.'
      - text: 'Это адрес API бэкенда магазина для запросов хоста'
        why: 'Это адрес JavaScript-контейнера, а не API.'
    explanation: |
      Для классического входа имя до `@` должно совпадать с `name` в конфиге remote, иначе контейнер не найдётся.
      Если подключать remote через манифест, имя берётся из него. В рантайме 2.0 тот же remote описывают объектом
      `{ name, entry }`.
    links:
      - https://module-federation.io/configure/remotes

  - id: mf-007
    topic: Основы
    level: junior
    question: |
      Как в коде хоста подключить компонент из remote?
    options:
      - text: 'Установить remote как зависимость через npm и импортировать как обычный пакет'
        why: 'Тогда это сборка на этапе билда, без независимого деплоя.'
      - text: 'Импортировать `shop/Product` динамически или через `loadRemote`'
        correct: true
        why: 'Для `import()` сборщик знает, что `shop/*` — remote; `loadRemote` находит remote по имени в рантайме.'
      - text: 'Скачать JS-файл через `fetch` и выполнить его через `eval`'
        why: 'Это обход всего механизма: ни общих зависимостей, ни контракта.'
      - text: 'Вставить remote на страницу через `<iframe>`'
        why: 'Это другой подход к микрофронтендам, не Module Federation.'
    explanation: |
      Типичный код: `const Product = React.lazy(() => import('shop/Product'))` или
      `React.lazy(() => loadRemote('shop/Product'))`. Компонент оборачивают в `Suspense` (пока грузится) и
      `ErrorBoundary` (если не загрузился).
    links:
      - https://module-federation.io/guide/runtime/runtime-api

  - id: mf-062
    topic: Основы
    level: junior
    question: |
      В хосте на TypeScript написано `import('shop/Product')`, а remote не публикует типы. Что скажет компилятор и
      как это решают?
    options:
      - text: 'Ничего: TypeScript сам скачает типы remote при компиляции'
        why: 'Сам он ничего не скачивает — это умеет только плагин с опцией `dts`.'
      - text: 'Ошибку «модуль не найден»: нужно объявление модуля или типы remote'
        correct: true
        why: 'Компилятор не знает модуль remote, пока о нём ничего не сказано.'
      - text: 'Ошибку в рантайме, а при компиляции всё пройдёт'
        why: 'Компилятор проверяет импорты при сборке, ошибка будет именно там.'
      - text: 'Ошибку, которую можно убрать только переписав хост на JavaScript'
        why: 'Хватит объявления модуля или типов из remote.'
    explanation: |
      Объявление вида `declare module 'shop/*' { const Component: React.ComponentType<any>; export default Component; }`
      убирает ошибку, но превращает пропсы в `any` — дальше компилятор вам не помощник.
    links:
      - https://module-federation.io/configure/dts

  - id: mf-008
    topic: Основы
    level: junior
    question: |
      Когда браузер скачивает код модуля, который remote отдаёт через `exposes`?
    options:
      - text: 'Сразу при загрузке хоста, вместе с его основным бандлом'
        why: 'Код модуля не входит в бандл хоста и не качается заранее сам по себе.'
      - text: 'Когда хост впервые импортирует этот модуль'
        correct: true
        why: 'Модуль грузится по требованию: при `import()` или `loadRemote`.'
      - text: 'Заранее, если хост вызвал для него `preloadRemote`'
        correct: true
        why: 'Предзагрузка скачивает файлы модуля, но не выполняет его.'
      - text: 'При сборке хоста, чтобы положить его в папку `dist`'
        why: 'Хост при сборке код remote не скачивает.'
      - text: 'Когда remote задеплоен: сервер сам присылает новый код в браузер'
        why: 'Сервер ничего не присылает: браузер сам запрашивает файлы.'
    explanation: |
      Тонкость: входной файл `remoteEntry.js` может загрузиться раньше модуля. При стратегии `version-first` (по
      умолчанию в рантайме 2.0) рантайм загружает входы remote при старте, чтобы собрать их версии общих
      зависимостей. А сами модули всё равно качаются только при импорте или предзагрузке.
    links:
      - https://module-federation.io/configure/shareStrategy.html

  - id: mf-063
    topic: Основы
    level: middle
    multiple: true
    question: |
      Хост вызывает `loadRemote('shop/Cart')` в двух разных местах. Сколько раз модуль скачается и выполнится?
    options:
      - text: 'Дважды: каждый вызов загружает и выполняет модуль заново'
        why: 'Рантайм кэширует загруженные модули, как обычный загрузчик модулей.'
      - text: 'Скачается дважды, но выполнится один раз'
        why: 'И скачивание, и выполнение происходят один раз.'
      - text: 'Один раз: второй вызов получит тот же экземпляр модуля'
        correct: true
        why: 'Модуль выполняется один раз, и всё его состояние на уровне модуля общее для обоих мест.'
      - text: 'Зависит от того, указан ли модуль в `shared`'
        why: 'Модули remote кэшируются независимо от `shared`.'
    explanation: |
      Это важно для понимания состояния: если модуль remote хранит что-то в переменной на уровне модуля (кэш,
      синглтон-сервис), оба места хоста видят одно и то же. Сбросить его можно перезагрузкой страницы или повторной
      регистрацией remote через `registerRemotes` с `force`: кэш загруженных модулей очищается.
    links:
      - https://module-federation.io/guide/runtime/runtime-api

  - id: mf-009
    topic: Основы
    level: junior
    question: |
      Команда remote починила баг и выкатила новую версию. Что нужно сделать хосту, чтобы пользователи её получили?
    options:
      - text: 'Обновить версию remote в `package.json` хоста и пересобрать хост'
        why: 'Хост не держит remote в зависимостях. Пересборка не нужна — в этом смысл независимого деплоя.'
      - text: 'Ничего: при следующей загрузке страницы хост возьмёт свежий вход'
        correct: true
        why: 'Если `remoteEntry.js` не закэширован надолго, хост получит новую версию remote без своего деплоя.'
      - text: 'Пересобрать хост с флагом, который сбрасывает кэш remote'
        why: 'Такого флага нет: обновление remote не требует действий от хоста.'
      - text: 'Перезапустить сервер, на котором работает хост'
        why: 'Код remote грузит браузер напрямую, сервер хоста здесь ни при чём.'
    explanation: |
      Независимый деплой — главная причина выбирать Module Federation. Уже открытые вкладки остаются на старой
      версии до перезагрузки. А если адрес remote содержит версию в пути, хосту придётся поменять адрес в конфиге.
      Оборотная сторона независимости: если remote сломал контракт, хост узнает об этом только в рантайме.
    links:
      - https://webpack.js.org/concepts/module-federation/

  - id: mf-010
    topic: Основы
    level: middle
    question: |
      Какие изменения в remote сломают хост в рантайме, хотя сборка хоста пройдёт без ошибок?
    options:
      - text: 'Переименовали ключ в `exposes`'
        correct: true
        why: 'Хост просит старое имя, а такого модуля больше нет.'
      - text: 'Поменяли обязательные пропсы выставленного компонента'
        correct: true
        why: 'Хост передаёт старые пропсы — компонент получит не то, что ждёт.'
      - text: 'Поменяли `name` контейнера, а хост подключает его по `remoteEntry.js`'
        correct: true
        why: 'Хост ищет контейнер по старому имени.'
      - text: 'Отрефакторили внутренний код, не меняя выставленных модулей и их API'
        why: 'Внутренности хосту не видны — это и есть смысл контракта.'
      - text: 'Обновили зависимость, которой нет в `shared`'
        why: 'Она внутри бандла remote и хоста не касается.'
    explanation: |
      Контракт remote — это имя контейнера, ключи `exposes` и API выставленных модулей. Его защищают: генерируют
      типы для хоста (`dts`), пишут контрактные тесты и меняют API только с обратной совместимостью.
    links:
      - https://module-federation.io/configure/dts

  - id: mf-011
    topic: Основы
    level: junior
    question: |
      В каких сборщиках есть Module Federation?
    options:
      - text: 'webpack 5'
        correct: true
        why: 'Там она появилась: встроенный `ModuleFederationPlugin`.'
      - text: 'webpack 4 — встроенным плагином'
        why: 'Встроенного плагина нет, он появился в webpack 5.'
      - text: 'Rspack'
        correct: true
        why: 'Поддержка встроена и совместима с webpack.'
      - text: 'Vite — через плагин'
        correct: true
        why: 'Официальный `@module-federation/vite`, раньше — сторонний `@originjs/vite-plugin-federation`.'
      - text: 'Create React App 4 без дополнительной настройки'
        why: 'CRA 4 работает на webpack 4, где встроенной Module Federation нет.'
    explanation: |
      Проект Module Federation 2.0 даёт общий рантайм для всех сборщиков, поэтому хост на одном сборщике может
      подключать remote, собранный другим.
    links:
      - https://module-federation.io/integrations/build-tool/vite.html
      - https://webpack.js.org/plugins/module-federation-plugin

  - id: mf-012
    topic: Основы
    level: junior
    question: |
      Хост написан на React. Можно ли подключить через Module Federation remote на Vue?
    options:
      - text: 'Нельзя: хост и remote должны быть на одном фреймворке'
        why: 'Module Federation делит JavaScript-модули и о фреймворках не знает.'
      - text: 'Можно, но только через iframe внутри remote'
        why: 'iframe здесь не нужен.'
      - text: 'Можно: например, remote отдаёт функции `mount` и `unmount` для DOM-узла'
        correct: true
        why: 'Vue-компонент в JSX не вставить, а функцию монтирования может вызвать кто угодно.'
      - text: 'Можно, Vue-компонент встанет в JSX хоста как обычный React-компонент'
        why: 'React не умеет рендерить Vue-компонент напрямую.'
    explanation: |
      Если у хоста и remote один фреймворк, удобно отдавать компоненты и делить фреймворк через `shared`. Если
      разные — remote отдаёт функции монтирования или веб-компонент, а хост встраивает его в свой DOM-узел. Для
      этого у Module Federation есть мосты (Bridge) для React и Vue.
    links:
      - https://module-federation.io/guide/bridge/react/load-app

  # ===================== Shared и версии =====================
  - id: mf-013
    topic: Shared и версии
    level: junior
    question: |
      React не указан в `shared` ни у хоста, ни у remote. Хост рендерит в своём дереве компонент из remote, который
      вызывает `useState`.
      Что будет?
    options:
      - text: 'Всё работает, просто страница скачает React дважды'
        why: 'Лишний вес — меньшая из проблем: хуки сломаются.'
      - text: 'Сборка remote упадёт с требованием указать React в `shared`'
        why: 'Сборка пройдёт: проблема проявится только в браузере.'
      - text: 'Две копии React, и хуки упадут с «Invalid hook call»'
        correct: true
        why: 'Компонент вызывает хуки своей копии React, а рендерит его чужая копия — диспетчер хуков не найден.'
      - text: 'Рантайм сам заметит дубль и оставит одну копию'
        why: 'Без `shared` рантайм ничего не делит — каждая копия живёт в своём бандле.'
    explanation: |
      React хранит состояние на уровне модуля: текущий диспетчер хуков, объекты контекстов. Если копий две,
      компонент из одной копии в дереве другой ломается. Поэтому React и ReactDOM делят как `singleton`.
    links:
      - https://module-federation.io/guide/troubleshooting/runtime

  - id: mf-014
    topic: Shared и версии
    level: junior
    question: |
      Что делает `singleton: true` у общей зависимости?
    options:
      - text: 'Загружает зависимость один раз при старте, даже если её никто не использует'
        why: 'Это ближе к `eager`. `singleton` про количество копий, а не про момент загрузки.'
      - text: 'Разрешает одну копию в общей области для всех, кто её делит'
        correct: true
        why: 'Даже если версии участников расходятся, все получают одну и ту же копию.'
      - text: 'Запрещает remote использовать эту зависимость'
        why: 'Наоборот, remote её использует — ту же копию, что и все.'
      - text: 'Делает зависимость доступной только хосту'
        why: 'Копия общая для всех участников области.'
    explanation: |
      Без `singleton` участники могут получить разные копии, если их версии несовместимы. С `singleton` копия одна
      на всех, даже ценой несовпадения версий. Что именно происходит при несовпадении, разобрано в соседних вопросах.
    links:
      - https://module-federation.io/configure/shared

