      `eager: true` убирает это ожидание для конкретной зависимости, зато она всегда попадает в стартовый файл и
      всегда скачивается. Документация прямо предупреждает о раздувании входного файла.
    links:
      - https://module-federation.io/configure/shared
      - https://webpack.js.org/plugins/module-federation-plugin

