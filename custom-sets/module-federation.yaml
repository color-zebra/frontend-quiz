    question: |
      Откуда берётся `requiredVersion`, если его не указать?
    options:
      - text: 'Из диапазона в `package.json` приложения'
        correct: true
        why: 'Сборщик берёт диапазон из `dependencies`. Если не может определить — выдаёт предупреждение.'
      - text: 'Из версии, которую принёс первый загруженный участник'
        why: 'Это про то, какая версия окажется в общей области, а не про требование.'
      - text: 'Это всегда `*` — подходит любая версия'
        why: 'Любая версия — это явное `requiredVersion: false`.'
      - text: 'Из lock-файла: точная установленная версия'
        why: 'Берётся диапазон из `package.json`, а не точная версия из lock-файла.'
    explanation: |
      Ловушка: если в `package.json` стоит точная версия (`"react": "18.2.0"`), то и требование точное. Если
      зависимость объявлена не по semver (`file:` или ссылка на git), требование вычислить не получится. Для
      библиотек внутри `node_modules` требование берётся из `package.json` самой библиотеки (например, из её
      `peerDependencies`) — отсюда предупреждения про чужие пакеты. Значение `false` означает «подходит что угодно».
    links:
      - https://webpack.js.org/plugins/module-federation-plugin
      - https://module-federation.io/configure/shared

