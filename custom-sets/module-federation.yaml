# Свой набор с уроками: Микрофронтенды — зачем они нужны, способы встраивания (iframe, сборка на сервере,
# веб-компоненты, single-spa и import maps), Module Federation и общие задачи системы из частей.
# Формат — как у любого стороннего набора (см. examples/README.md). В сборку приложения не входит.
# Уроки перечисляют свои вопросы полем questions; номера вопросов не менять — к ним привязан прогресс людей.
# Вопросы с пометкой «Проверено на стенде» сверены на webpack 5.111.1 + @module-federation/enhanced 2.9.2.
# План уроков — plans/mfe-course.md.
title: Микрофронтенды
lessons:
  - id: mfl-intro
    topic: Введение
    title: Зачем нужны микрофронтенды
    questions: [mf-067, mf-068, mf-069]
    body: |
      ## Какую проблему решаем

      Интернет-магазин электроники делают пять команд, около сорока человек: «Платформа» отвечает за шапку и вход,
      «Каталог» — за список товаров и карточку товара, «Корзина и заказ» — за корзину и оформление, «Личный
      кабинет» — за заказы и профиль, «Рекомендации» — за блок «С этим покупают». Код у всех в одном репозитории,
      сборка идёт 25 минут, а выпускается магазин раз в неделю, по четвергам, — всё, что успели влить, уезжает
      одним **релизным поездом**.

      Во вторник в корзине находят ошибку: при промокоде неверно считается скидка. Исправление готово через час,
      но ждёт четверга. В четверг поезд уезжает, и выясняется, что новый фильтр каталога ломает поиск. Релиз
      откатывают целиком — вместе с исправлением корзины. Люди ещё неделю видят неверную скидку, хотя команда
      корзины свою работу сделала.

      Беда не в том, что кто-то плохо пишет код. Беда в том, что пять команд связаны одной сборкой и одной
      выкаткой: каждая ждёт остальных и откатывается вместе с ними. Урок о том, как это разорвать, что за это
      придётся заплатить и когда платить не стоит.

      Если вы проходили курс «Системный дизайн: большие приложения», первые два урока коротко напомнят его уроки
      «Границы между командами» и «Модульный монолит или микрофронтенды» на примере магазина. Новое здесь — как
      устроен каждый способ встраивания; оно начинается с урока «iframe».

      ## Что такое микрофронтенды

      Кэм Джексон в статье на сайте Мартина Фаулера определяет **микрофронтенды** (micro frontends) как
      архитектурный стиль, в котором независимо выпускаемые фронтенд-приложения собираются в одно целое.
      Главное слово здесь — **независимо выпускаемые**: у каждой части своя сборка, своя выкатка и свой откат.
      Человек видит один магазин, а внутри это несколько приложений разных команд.

      Чтобы части оказались на одной странице, кто-то должен их собрать. Это делает **оболочка** (shell) —
      приложение, которое решает, какую часть где показать, и даёт частям общее: вход пользователя, язык, тему.
      Как именно части попадают на страницу — через ссылки, сервер, фреймы или JavaScript, — разберём в следующих
      уроках.

      Микрофронтенды часто сравнивают с микросервисами на бэкенде: та же идея независимых частей, только
      в браузере. Сравнение полезно в главном и ломается в деталях: микросервисы общаются по сети, а микрофронтенды
      делят одну страницу, одну адресную строку и один экран — и мешать друг другу им гораздо проще.

      ## Закон Конвея: части повторяют команды

      В 1968 году Мелвин Конвей сформулировал наблюдение, которое теперь называют **законом Конвея**: организация,
      проектирующая систему, создаёт систему, структура которой копирует структуру связей внутри организации.
      Проще говоря, границы в коде рано или поздно проходят там, где проходят границы между командами.

      Для микрофронтендов из этого следует правило: **резать по предметным областям, а не по слоям.**
      - **Разрез по предметным областям** (вертикальный): у каждой команды свой кусок продукта целиком — экраны,
        логика, запросы к своему API. «Каталог» владеет всем, что связано с поиском и выбором товара. Новая функция
        каталога обычно не требует ничего от других команд.
      - **Разрез по слоям** (горизонтальный): одна команда делает все компоненты, другая — все запросы к API, третья —
        все экраны. Любая новая функция задевает все три команды сразу, и они снова выпускаются вместе, только теперь
        в трёх репозиториях вместо одного.

      Части можно отделять и по-другому. Если части почти не пересекаются на экране, удобен **разрез
      по страницам**: у каждой команды свои адреса целиком, между частями переходят по ссылке. Если на одном экране
      нужны части разных команд — например, маленькая корзина в шапке каталога, — это **разрез внутри страницы**.
      Второй гибче, но почти все трудности микрофронтендов — именно у него.

      ## Что даёт независимая выкатка

      - **Свой темп.** Команда выпускает исправление, когда оно готово, и откатывает только свою часть.
      - **Меньше кода в одной голове.** У каждой части свой небольшой репозиторий или папка и своя быстрая сборка.
      - **Постепенная замена старого.** Новая часть растёт рядом со старой и забирает её экраны по одному — не нужно
        переписывать всё за раз.
      - **Выбор технологий** — с оговоркой. Части могут быть на разных фреймворках, но каждый лишний фреймворк —
        это лишние килобайты у пользователя и лишние знания у тех, кто переходит между командами.

      ## Сколько это стоит

      Джексон называет три пункта цены — размер, разницу между средой разработки и настоящей страницей, сложность
      эксплуатации, — а опыт команд добавляет к ним ещё несколько:
      - **Размер.** Части, собранные отдельно, легко привозят каждая свою копию React и других библиотек.
        Пользователь скачивает больше, чем у монолита.
      - **Договорённости о версиях.** Чтобы делить одну копию библиотеки, части договариваются о её версии — и это
        снова общий график, только для зависимостей.
      - **Ошибки склейки видны поздно.** Каждая часть по отдельности работает, а вместе они ломаются: одна поменяла
        то, чего ждала другая. Сборка такого не заметит.
      - **Единый вид.** Части на разных версиях дизайн-системы показывают на одном экране разные кнопки.
      - **Эксплуатация.** Больше репозиториев, сборок, выкаток и отчётов об ошибках; разработка части отдельно
        отличается от её работы на настоящей странице.

      ## Когда микрофронтенды не нужны

      Микрофронтенды дают одно — независимую выкатку частей. Если она не нужна или её можно получить дешевле,
      остаётся только цена.
      - **Одна небольшая команда, один продукт, релизы и так выходят вместе.** Независимо выпускаться некому.
      - **Чтобы уменьшить бандл.** Размер уменьшает разбиение кода на чанки внутри одного приложения,
        а микрофронтенды его обычно увеличивают.
      - **Медленная сборка и нестабильные тесты.** Это лечат в самом приложении: собирать и проверять только
        затронутые модули, выпускать функции за **флагами** — переключателями, которые включают готовый код
        отдельно от выкатки, — и выключать сломанную функцию флагом вместо отката всего релиза.

      Промежуточный вариант — **модульный монолит**: одно приложение с одной сборкой, но с жёсткими границами
      и владельцами модулей внутри. Подробно он разобран в курсе «Системный дизайн: большие приложения», уроке
      «Модульный монолит или микрофронтенды».

      ## Пример целиком: как магазин решил делить

      Команды разобрали свою ситуацию по шагам.
      1. **Что болит.** Пять команд ждут общего поезда, срочное исправление стоит до шести дней, а откат одной
         функции откатывает всех. Флаги уже пробовали: они помогают с выключением функций, но не с тем, что
         исправление корзины ждёт четверга.
      2. **Где резать.** По предметным областям: каталог, корзина и заказ, личный кабинет, рекомендации. У каждой
         команды свои экраны и своё API. «Платформа» делает оболочку: шапку, вход, общие правила.
      3. **Что не делить.** Форму оформления заказа не режут между командами: её поля, проверки и отправка — одна
         предметная область, и разрез посередине связал бы две команды в каждой задаче.
      4. **Какую цену принять.** «Платформа» ведёт список общих библиотек и их версий, команды договариваются
         о контрактах между частями, а у каждой части появляется свой отчёт об ошибках.
      5. **Что получилось.** Каждая команда выкатывается сама, несколько раз в день. Срочное исправление корзины
         доходит до людей за час, и откатывается только корзина.

      ## Варианты и их цена

      Выбирают не по виду архитектуры, а по тому, что болит.
      - **Команды на одной странице ждут общего релиза**
        - Что брать: микрофронтенды внутри страницы.
        - Цена: общая страница, адрес и данные; договорённости о версиях библиотек; самые сложные ошибки склейки.
      - **Одна часть нужна в нескольких приложениях** — как виджет рекомендаций
        - Что брать: микрофронтенд-виджет со своей выкаткой.
        - Цена: контракт виджета с каждым потребителем; своя копия библиотек, если их не делить.
      - **Старое приложение надо заменить по частям**
        - Что брать: микрофронтенды по страницам или оркестратор — библиотеку, которая показывает старое и новое
          приложение под одним адресом (урок «single-spa и import maps»).
        - Цена: два стека и переходный код, который потом нужно удалить.
      - **Медленная сборка и общие откаты при одной команде**
        - Что брать: модульный монолит, проверку затронутых модулей и флаги.
        - Цена: одна выкатка остаётся; дисциплина границ держится на линтере.

      ## Типичные ошибки

      - **Резать по слоям.** Каждая функция задевает все команды, и они снова выпускаются вместе.
      - **Делать микрофронтенды ради размера бандла.** Получится больше, а не меньше.
      - **Резать слишком мелко** — по микрофронтенду на кнопку или форму. Связей между частями становится больше,
        чем кода внутри них.
      - **Связать части общим состоянием.** Если все читают и пишут одно хранилище, независимость остаётся только
        на бумаге.
      - **Не назвать цену заранее.** Команды узнают о версиях библиотек и ошибках склейки уже после разделения.

      ## Как спрашивают на интервью

      - «Что такое микрофронтенды и зачем они нужны?» — ждут независимую выкатку частей и связь с командами.
      - «Когда микрофронтенды не нужны?» — ждут одну команду, общий релиз, размер бандла как ложную причину
        и модульный монолит как альтернативу.
      - «Как делить приложение на части?» — ждут разрез по предметным областям и закон Конвея.

      ## Коротко

      - Микрофронтенды — независимо выпускаемые фронтенд-приложения, собранные в одно целое; главное в них —
        своя сборка, выкатка и откат у каждой части.
      - По закону Конвея границы в коде повторяют границы команд, поэтому части режут по предметным областям,
        а не по слоям: иначе каждая функция задевает все команды.
      - Независимая выкатка даёт свой темп, небольшие кодовые базы и постепенную замену старого кода.
      - Цена — больший размер страницы, договорённости о версиях библиотек, поздние ошибки склейки, разнобой
        во внешнем виде и сложная эксплуатация.
      - Если релизы и так общие, а беда в медленной сборке или откатах, сначала помогают модульный монолит,
        проверка затронутых модулей и флаги; ради размера бандла микрофронтенды не делают.

      ## Источники

      - [Micro Frontends — Cam Jackson, martinfowler.com](https://martinfowler.com/articles/micro-frontends.html)
      - [Conway's Law — Mel Conway](https://www.melconway.com/Home/Conways_Law.html)

  - id: mfl-approaches
    topic: Способы встраивания
    title: Карта способов встраивания
    questions: [mf-070, mf-058, mf-071, mf-072, mf-073]
    body: |
      ## Какую проблему решаем

      Команды магазина решили выпускаться отдельно. Следующий вопрос — как человек увидит их работу на одном
      экране. Страница товара должна быстро показываться и находиться поисковиками. Форму оплаты делает внешний
      платёжный провайдер, и его код магазину не подконтролен. Каталог и корзина — интерактивные экраны на React,
      которые хорошо бы держать на одной копии React. А личный кабинет написан на Angular, и переписать его быстро
      не выйдет.

      Один способ все эти требования не закрывает. Способов встраивания несколько, и различаются они тем, **где
      и когда** части соединяются в страницу: при сборке, на сервере или в браузере. Урок — карта этих способов:
      как каждый работает, что даёт и чего стоит. Следующие уроки разбирают каждый подробно.

      ## Отдельные приложения по адресам

      Самый простой способ: у каждой части свои адреса целиком, а переходят между частями обычной ссылкой. Магазин —
      одно приложение, личный кабинет на `/account` — другое. Сервер или балансировщик по пути решает, какое
      приложение отдать.

      Во время работы у частей нет ничего общего, поэтому и мешать друг другу им нечем. Цена — переход между частями
      грузит новую страницу, а общее, вроде шапки и входа, каждое приложение повторяет у себя, обычно через общий
      пакет.

      ## При сборке: части как npm-пакеты

      Каждая часть публикуется npm-пакетом, а оболочка собирает их в один бандл — без дублей библиотек и с проверкой
      типов. Независимой выкатки нет: новая версия каталога дойдёт до людей только с выкаткой оболочки. Поэтому
      Джексон не советует этот способ для микрофронтендов (подробно — курс «Системный дизайн: большие приложения»,
      урок «Модульный монолит или микрофронтенды»). Пакеты при этом хороши для того, что и не должно выходить
      отдельно: дизайн-системы, утилит, клиента API.

      ## На сервере: страница из фрагментов

      Сервер получает запрос страницы, запрашивает у серверов команд куски HTML — **фрагменты** — и вставляет их
      в шаблон, а браузер получает уже готовую страницу. Так быстро виден первый экран, и поисковики видят текст
      сразу. Цена: нужна серверная инфраструктура, медленный фрагмент задерживает всю страницу, а интерактивность
      частей всё равно оживает в браузере. Подробно — урок «Сборка на сервере».

      ## В браузере: iframe

      Каждая часть — отдельная страница внутри **iframe** (встроенного фрейма) со своим документом, стилями
      и JavaScript. Это самая сильная изоляция: стили и ошибки не протекают, а код с чужого домена не дотянется
      до страницы. Цена: фрейм не подстраивается под высоту содержимого, его окна не выходят за рамку, адрес внутри
      не виден снаружи, а каждый фрейм грузит свои библиотеки. Подробно — урок «iframe».

      ## В браузере: через JavaScript

      Оболочка загружает скрипт части, а тот отдаёт функцию вроде `mount(element)`, которая рисует часть в переданный
      элемент, или готовый компонент. Части живут в одной странице и могут делить библиотеки — например, одну копию
      React. Это самый гибкий способ, и Джексон выбирает его по умолчанию. Цена: части могут мешать друг другу
      стилями и глобальным состоянием, а общие библиотеки требуют договорённостей о версиях.

      Реализаций несколько:
      - **single-spa** — оркестратор, который монтирует и размонтирует приложения по адресу, даже на разных
        фреймворках;
      - **import maps** — возможность браузера сопоставить имя модуля с адресом, чтобы все части брали одну копию
        библиотеки;
      - **Module Federation** — механизм сборщика: одно приложение загружает модули другого во время работы и делит
        с ним общие библиотеки.

      Первые две — урок «single-spa и import maps», Module Federation — отдельный раздел набора.

      **Веб-компоненты** — вариант того же способа: часть регистрирует свой HTML-элемент, например
      `<shop-recommendations>`, а оболочка просто вставляет его в разметку. Внутри элемент может быть написан
      на любом фреймворке или без него. Контракт описан стандартом браузера,
      и элемент работает на странице с любым фреймворком. Джексон описывает их отдельным, пятым способом, хотя сам
      называет вариантом встраивания через JavaScript; в курсе «Системный дизайн: большие приложения» они тоже идут
      пятым способом. Подробно — урок «Веб-компоненты».

      ![Карта способов встраивания: по ссылкам — разные приложения на своих адресах; при сборке — пакеты в одном бандле, без независимой выкатки; на сервере — фрагменты HTML в шаблоне; в браузере — iframe, встраивание через JavaScript (single-spa, import maps, Module Federation) и веб-компоненты](images/mfl-approaches.png "Где и когда части соединяются в страницу")

      ## Пример целиком: какой способ где у магазина

      Магазин не выбирал один способ на всё — каждый стоит там, где его плюс нужен:
      1. **Магазин и личный кабинет — разные приложения по адресам.** Человек переходит в кабинет редко, и полная
         загрузка страницы при этом никому не мешает.
      2. **Страница товара собирается на сервере** из трёх фрагментов: шапки от «Платформы», карточки товара
         от «Каталога» и блока рекомендаций. Ей нужны поисковики и быстрый первый показ.
      3. **Форма оплаты провайдера — во фрейме** с домена `pay.provider.example`. Данные карты не должны проходить
         через код магазина, а код провайдера магазин не проверяет.
      4. **Блок рекомендаций — веб-компонент** `<shop-recommendations>`. Его вставляют в страницу товара, в кабинет
         на Angular и на сайты партнёров.
      5. **Внутри личного кабинета — single-spa и import maps.** Старые разделы на Angular и новые на React живут под
         одним адресом `/account`, а React грузится одной копией.
      6. **Каталог, корзина и оформление — Module Federation.** Оболочка на React загружает их экраны во время
         работы и делит с ними React, роутер и дизайн-систему.

      Шесть способов в одной системе — много, и обычно их два-три. Здесь каждый оправдан своим требованием,
      а за каждый платят: свою инфраструктуру, свои правила и свои ошибки склейки.

      ## Варианты и их цена

      - **По ссылкам**
        - Подходит: части почти не пересекаются на экране.
        - Цена: полная загрузка при переходе; общее повторяют в каждом приложении.
      - **При сборке**
        - Подходит: общие библиотеки и дизайн-система, но не микрофронтенды.
        - Цена: нет независимой выкатки.
      - **На сервере**
        - Подходит: страницы для поисковиков и быстрого первого показа, с небольшой интерактивностью.
        - Цена: серверная инфраструктура; медленный фрагмент держит страницу.
      - **iframe**
        - Подходит: чужой или недоверенный код, другой стек, строгая изоляция.
        - Цена: высота, окна, адрес и доступность; свои библиотеки в каждом фрейме.
      - **JavaScript в браузере**
        - Подходит: интерактивные части на одной странице, общий фреймворк.
        - Цена: части мешают друг другу; договорённости о версиях общих библиотек.
      - **Веб-компоненты**
        - Подходит: виджет для страниц на разных фреймворках.
        - Цена: те же, что у JavaScript, плюс сложные данные и отрисовка на сервере.

      ## Типичные ошибки

      - **Называть микрофронтендами npm-пакеты, собранные в одно приложение.** Независимой выкатки у них нет.
      - **Выбирать один способ для всего.** Страница для поисковиков и встроенная форма оплаты требуют разного.
      - **Встраивать чужой код через JavaScript.** Он получает все права страницы.
      - **Брать iframe для частей, которым нужны общие окна и единый вид.** Окна не выйдут за рамку фрейма.
      - **Собирать в браузере страницы, которые должны находить поисковики,** не подумав о первом показе.

      ## Как спрашивают на интервью

      - «Какие есть способы собрать микрофронтенды?» — ждут сборку, сервер и браузер, внутри браузера — iframe,
        JavaScript и веб-компоненты, и плюсы и минусы каждого.
      - «Почему npm-пакеты — не микрофронтенды?» — ждут отсутствие независимой выкатки.
      - «Что выбрать для чужого виджета?» — ждут iframe и изоляцию.

      ## Коротко

      - Способы встраивания различаются тем, где и когда части соединяются в страницу: при сборке, на сервере или
        в браузере.
      - Отдельные приложения по адресам — самый простой и надёжный способ, если частям не нужно делить экран.
      - Части-пакеты, собранные в одно приложение, не дают независимой выкатки, поэтому это не микрофронтенды;
        пакеты хороши для дизайн-системы и утилит.
      - Сборка на сервере даёт быстрый первый показ и видимость для поисковиков, но медленный фрагмент задерживает
        страницу.
      - iframe изолирует сильнее всех и подходит для чужого кода, но неудобен с высотой, окнами и адресом.
      - Встраивание через JavaScript — single-spa, import maps, Module Federation, веб-компоненты — самое гибкое
        и позволяет делить библиотеки, но части живут в одной странице и могут мешать друг другу.
      - В одной системе способы сочетают, выбирая каждый под своё требование.

      ## Источники

      - [Micro Frontends, раздел «Integration approaches» — Cam Jackson](https://martinfowler.com/articles/micro-frontends.html)

  - id: mfl-iframe
    topic: Способы встраивания
    title: iframe
    questions: [mf-074, mf-057, mf-075, mf-076]
    body: |
      ## Какую проблему решаем

      На шаге «Оплата» магазин показывает форму платёжного провайдера: номер карты, срок, код. Требований два,
      и оба жёсткие. Данные карты не должны проходить через код магазина — иначе магазину придётся проходить
      строгую проверку безопасности платёжных систем. А код формы пишет провайдер, выкатывает его, когда считает
      нужным, и магазин его не проверяет.

      Если подключить скрипт провайдера прямо в страницу, его код получит доступ ко всему, что видит страница
      магазина, а код магазина — к полям с номером карты. Нужна часть, которая живёт на той же странице, но отделена
      от неё стеной. Урок о встраивании через iframe: как работает эта стена, как через неё общаться и чем приходится
      платить.

      ## Отдельный документ внутри страницы

      **iframe** (inline frame, встроенный фрейм) — элемент, внутри которого браузер открывает отдельную страницу:
      со своим документом, своим окном `window`, своими стилями и скриптами. Страницу вокруг называют
      **родителем**.

      Насколько крепка стена между ними, решает **политика одного источника** (same-origin policy).
      **Источник** (origin) — это схема, домен и порт адреса: `https://shop.example` и `https://pay.provider.example` —
      разные источники.
      - **Фрейм с другого источника** изолирован: родитель не может прочитать его DOM (`iframe.contentDocument`
        для него равен `null`), а фрейм — DOM родителя. Стили не протекают в обе стороны, глобальные переменные
        у каждого свои, а необработанная ошибка во фрейме не роняет родителя.
      - **Фрейм с того же источника** изолирован слабо: родитель может напрямую обращаться к его окну и документу,
        и наоборот.

      Для формы оплаты это ровно то, что нужно: она на домене провайдера, и ни одна сторона не видит данных
      другой.

      ## Общение через postMessage

      Раз прямых вызовов нет, стороны обмениваются сообщениями. Метод `otherWindow.postMessage(data, targetOrigin)`
      отправляет данные в другое окно, а там срабатывает событие `message`. Данные копируются алгоритмом
      структурированного клонирования: можно передать объект, массив, дату, но не функцию.

      Два правила безопасности обязательны:
      - **Отправитель указывает точный `targetOrigin`** — источник, которому можно доставить сообщение. Со значением
        `'*'` сообщение уйдёт любому, кто в этот момент окажется во фрейме или окне, в том числе чужому сайту.
      - **Получатель проверяет `event.origin`** — от кого пришло сообщение. Слушатель `message` получает сообщения
        от любых окон, и без проверки любой сайт, открывший вашу страницу во фрейме или в соседнем окне, сможет
        прислать «оплата прошла». Дополнительно можно сверить `event.source` с окном своего фрейма, а после этого —
        формат самих данных.

      ## Атрибуты sandbox и allow

      **`sandbox`** включает для фрейма набор запретов: без значения запрещено почти всё — скрипты, отправка форм,
      всплывающие окна, переход родителя на другой адрес, — а документ получает особый источник, который
      не совпадает ни с одним другим. Каждый токен снимает один запрет:
      - `allow-scripts` — разрешить скрипты;
      - `allow-forms` — разрешить отправку форм;
      - `allow-same-origin` — оставить документу его настоящий источник, иначе он теряет доступ к своим cookie
        и хранилищам;
      - `allow-popups`, `allow-top-navigation` — всплывающие окна и переход всей вкладки.

      Важная ловушка: **для документа того же источника** сочетание `allow-scripts allow-same-origin` делает
      sandbox бесполезным. Скрипт во фрейме — такой же «свой», как родитель, и может просто снять атрибут sandbox
      со своего фрейма. Поэтому недоверенное содержимое, например HTML писем от пользователей, отдают с отдельного
      домена или не дают ему одновременно эти два токена.

      **`allow`** задаёт фрейму политику разрешений (Permissions Policy): к каким возможностям браузера у него есть
      доступ. Например, `allow="payment"` разрешает API оплаты (Payment Request) внутри фрейма.

      Стену можно строить и с другой стороны. Провайдер не хочет, чтобы его форму встроил кто попало, поэтому
      отвечает заголовком `Content-Security-Policy: frame-ancestors https://shop.example` — браузер покажет форму
      только во фрейме на сайте магазина.

      ## Чем приходится платить

      - **Высота.** Фрейм не подстраивается под содержимое, а родитель не может измерить документ с другого
        источника. Решение — фрейм сам измеряет свою высоту (например, `ResizeObserver`) и присылает её родителю
        сообщением, а родитель меняет высоту элемента.
      - **Окна и подсказки** не выходят за рамку фрейма. Модальное окно на весь экран фрейм может только попросить
        у родителя сообщением.
      - **Адрес.** Переходы внутри фрейма не меняют адресную строку, поэтому ссылкой на конкретное место во фрейме
        не поделиться. Зато они добавляют записи в историю вкладки, и кнопка «Назад» сначала листает фрейм, а не
        страницу. Если адрес внутри важен, фрейм сообщает его родителю, а родитель кладёт в свой адрес.
      - **Cookie.** Для фрейма с другого сайта его cookie — сторонние. Safari блокирует их по умолчанию, Firefox
        разделяет по сайту верхнего уровня, Chrome пока пропускает, если пользователь не запретил. Строить вход
        во фрейме на сторонних cookie поэтому опасно.
      - **Скорость и вес.** Каждый фрейм грузит свой документ, свои стили и свои библиотеки; две части на React
        во фреймах — две копии React. Фреймы ниже первого экрана грузят лениво: `loading="lazy"`.
      - **Доступность и вид.** Фрейму нужен атрибут `title`, иначе программа чтения с экрана не скажет, что внутри.
        Шрифты и тему родителя фрейм не видит — их передают параметрами или сообщениями.

      ## Пример целиком: форма оплаты в магазине

      Сервер магазина создаёт у провайдера сессию оплаты и получает её номер. Страница оформления вставляет фрейм:

      ```html
      <iframe
        id="pay"
        src="https://pay.provider.example/form?session=s_81f3"
        title="Оплата картой"
        allow="payment"
        sandbox="allow-scripts allow-forms allow-same-origin"
        style="width: 100%; border: 0"
      ></iframe>
      ```

      Форма провайдера на другом источнике, поэтому `allow-scripts` вместе с `allow-same-origin` здесь безопасны:
      форма сохраняет доступ к своим cookie, но страницу магазина не видит. Нужный набор токенов провайдер указывает
      в своей документации.

      Форма следит за своей высотой и шлёт её магазину — домен магазина провайдер знает из настроек сессии:

      ```js
      new ResizeObserver(() => {
        parent.postMessage(
          { type: 'payment:resize', height: document.documentElement.scrollHeight },
          'https://shop.example',
        );
      }).observe(document.documentElement);
      ```

      Магазин принимает сообщения только от провайдера и только из своего фрейма:

      ```js
      const PAY_ORIGIN = 'https://pay.provider.example';
      const frame = document.getElementById('pay');

      window.addEventListener('message', (event) => {
        if (event.origin !== PAY_ORIGIN || event.source !== frame.contentWindow) return;
        const msg = event.data;
        if (msg?.type === 'payment:resize' && typeof msg.height === 'number') {
          frame.style.height = `${msg.height}px`;
        } else if (msg?.type === 'payment:done') {
          showPaymentResult(msg.status); // 'paid' или 'failed'
        }
      });
      ```

      1. Человек вводит карту прямо в форме провайдера — код магазина этих данных не видит.
      2. Ошибка ввода раскрывает подсказку, форма вырастает, и магазин сразу растягивает фрейм.
      3. Оплата прошла — форма шлёт `payment:done`. Магазин показывает «Заказ оплачен», но окончательно статус
         заказа берёт со своего сервера, которому провайдер сообщил об оплате напрямую: сообщению из браузера
         одному верить нельзя.

      ## Варианты и их цена

      - **Фрейм с другого источника**
        - Подходит: чужой или недоверенный код, платёжные формы, виджеты партнёров.
        - Цена: высота, окна, адрес, cookie и вес — всё через сообщения и ручную работу.
      - **Фрейм с того же источника**
        - Подходит: своя старая часть на другом стеке, которую нужно показать как есть.
        - Цена: изоляция слабая — стороны могут обращаться друг к другу напрямую.
      - **Встраивание через JavaScript**
        - Подходит: свои части, которым нужны общие окна, вид и библиотеки.
        - Цена: никакой стены — код части работает с правами страницы.

      ## Типичные ошибки

      - **Не проверять `event.origin`.** Любой сайт сможет присылать вашей странице команды.
      - **Отправлять с `targetOrigin: '*'`.** Данные получит тот, кто окажется во фрейме.
      - **Давать недоверенному документу своего источника `allow-scripts allow-same-origin`.** Он снимет sandbox.
      - **Ждать, что фрейм подстроится по высоте сам.** Высоту присылают сообщением.
      - **Верить сообщению «оплата прошла» без проверки на сервере.**
      - **Забывать `title`.** Программа чтения с экрана не скажет, что во фрейме.

      ## Как спрашивают на интервью

      - «Чем iframe отличается от встраивания через JavaScript?» — ждут изоляцию политикой одного источника, общение
        через `postMessage` и цену: высота, окна, адрес, вес.
      - «Как безопасно общаться с фреймом?» — ждут точный `targetOrigin` и проверку `event.origin`.
      - «Защищает ли sandbox?» — ждут ловушку с `allow-scripts allow-same-origin` для документа того же источника.

      ## Коротко

      - iframe открывает внутри страницы отдельный документ со своим окном, стилями и скриптами; фрейм с другого
        источника изолирован политикой одного источника, с того же — слабо.
      - Стороны общаются через `postMessage`: отправитель указывает точный `targetOrigin`, получатель проверяет
        `event.origin` и формат данных.
      - `sandbox` включает запреты, а токены их снимают; для документа того же источника `allow-scripts`
        с `allow-same-origin` делают sandbox бесполезным.
      - Фрейм не подстраивается по высоте и не выводит окна за свою рамку: высоту и окна родитель делает
        по сообщениям фрейма.
      - Переходы внутри фрейма не видны в адресе, но попадают в историю вкладки; сторонние cookie во фрейме
        браузеры всё чаще блокируют.
      - iframe выбирают для чужого и недоверенного кода, когда изоляция важнее общего вида и общих библиотек.

      ## Источники

      - [<iframe>: The Inline Frame element — MDN](https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/iframe)
      - [Window: postMessage() — MDN](https://developer.mozilla.org/en-US/docs/Web/API/Window/postMessage)

  - id: mfl-server
    topic: Способы встраивания
    title: Сборка на сервере
    questions: [mf-077, mf-078, mf-079]
    body: |
      ## Какую проблему решаем

      Страница товара — главная страница магазина для чужих глаз: на неё приходят из поисковиков и по ссылкам
      из рекламы. Она должна показаться быстро, даже на слабом телефоне, а поисковик должен сразу увидеть название,
      цену и описание. При этом на ней работают три команды: шапку делает «Платформа», карточку товара — «Каталог»,
      блок «С этим покупают» — «Рекомендации».

      Если собирать такую страницу в браузере, человек сначала получит почти пустой HTML, потом скачает
      JavaScript оболочки, потом JavaScript частей, и только после этого увидит товар. Урок о другом пути: страница
      собирается из кусков разных команд ещё на сервере, и браузер с первого ответа получает готовый HTML.

      ## Как собирается страница

      **Фрагмент** — кусок HTML, который отдаёт сервер одной команды: шапка, карточка товара, блок рекомендаций.
      **Шаблон страницы** (layout) — HTML с метками «сюда вставить такой-то фрагмент». Когда приходит запрос,
      сервер-сборщик:
      1. берёт шаблон;
      2. параллельно запрашивает фрагменты у серверов команд;
      3. вставляет полученный HTML на место меток;
      4. отдаёт браузеру готовую страницу.

      Каждая команда выкатывает свой сервер фрагмента, когда хочет: сборщик в следующем запросе получит уже новый
      HTML. Независимая выкатка сохраняется, а технологии на серверах команд могут быть любыми.

      ## Чем собирают

      **SSI** (Server Side Includes) — старый механизм веб-серверов. В nginx он включается директивой `ssi on`,
      а метка в шаблоне выглядит так:

      ```html
      <!--# include virtual="/fragments/header" -->
      ```

      nginx запрашивает такие адреса параллельно и вставляет ответы. У команды `include` есть параметр `stub` —
      имя запасного блока, который nginx выведет, если фрагмент вернул пустой ответ или ошибку.

      **ESI** (Edge Side Includes) — похожая разметка для кэширующих серверов и CDN: `<esi:include src="…" />`.
      Её понимают некоторые CDN и Varnish, и тогда страница собирается на сервере CDN рядом с пользователем.

      **Свой сборщик** на Node — когда нужна логика сложнее вставки: тайм-ауты на каждый фрагмент, отправка страницы
      по частям, сбор стилей и скриптов фрагментов в `<head>`. Готовые решения такого рода — Tailor от Zalando
      и Podium.

      ## Медленный фрагмент держит всю страницу

      Главная беда серверной сборки: страница готова, только когда пришёл последний фрагмент. Если рекомендации
      отвечают за две секунды, вся страница товара приходит через две секунды, хотя шапка и карточка были готовы
      почти сразу. Поэтому у каждого фрагмента есть:
      - **тайм-аут** — сколько сборщик готов его ждать;
      - **запасной вид** — что вставить, если фрагмент не успел или ответил ошибкой: пустое место, заглушку или
        последнюю сохранённую версию;
      - **деление на важное и второстепенное.** Карточку товара, без которой страница бессмысленна, ждут дольше;
        рекомендации можно не дождаться и догрузить уже в браузере.

      ## Кэш фрагментов

      Фрагменты кэшируют по отдельности, и это одно из главных преимуществ подхода: шапка меняется редко и живёт
      в кэше долго, цена товара — недолго. Но кэш, общий для всех пользователей, опасен для **персональных
      данных**. Если закэшировать шапку вместе с числом товаров в корзине или именем пользователя, следующие люди
      увидят чужое. Персональные куски либо не кэшируют на общем сервере, либо оставляют на сервере пустое место
      и догружают в браузере для конкретного человека.

      ## Интерактивность всё равно в браузере

      Сервер отдаёт HTML, а кнопки, фильтры и выпадающие списки оживают только после загрузки JavaScript. Каждый
      фрагмент приносит свои стили и свой скрипт, который «оживляет» его кусок страницы — это называют
      **гидратацией** (hydration). Отсюда две заботы:
      - **стили** фрагментов не должны конфликтовать: у каждого свои префиксы классов, а глобальные правила
        запрещены;
      - **скрипты** фрагментов не должны везти по своей копии одних и тех же библиотек — или их делят, или держат
        фрагменты лёгкими.

      ## Отдельные приложения под одним доменом

      Похожий приём на уровне целых страниц — **multi-zones** в Next.js: несколько приложений обслуживают разные
      пути одного домена, например `/blog` и всё остальное. Переходы внутри одной зоны мягкие, без перезагрузки,
      а переход в другую зону — полная загрузка страницы. Поэтому ссылки между зонами делают обычным тегом `<a>`,
      а не компонентом `Link`: тот пытается предзагрузить и открыть чужой путь как свой. Страницы, по которым
      переходят часто, держат в одной зоне.

      ## Пример целиком: страница товара

      Запрос `https://shop.example/p/12345` приходит на сборщик. Шаблон страницы:

      ```html
      <body>
        <!--# include virtual="/fragments/header" -->
        <main>
          <!--# include virtual="/fragments/product/12345" -->
        </main>
        <!--# block name="reco-empty" --><div id="reco-slot"></div><!--# endblock -->
        <!--# include virtual="/fragments/reco/12345" stub="reco-empty" -->
      </body>
      ```

      1. **Три запроса параллельно.** Шапка («Платформа») лежит в кэше на 10 минут и приходит сразу. Карточка
         («Каталог») — в кэше на 60 секунд: цена и наличие не должны отставать надолго.
      2. **Рекомендации ждут не дольше 300 мс.** Тайм-аут задан в настройках адреса фрагмента:

         ```nginx
         location /fragments/reco/ {
           proxy_pass http://reco_backend;
           proxy_read_timeout 300ms;
         }
         ```

         `proxy_read_timeout` ограничивает ожидание между двумя порциями ответа, и для маленького фрагмента
         это фактически время до ответа. Не успели — запрос фрагмента заканчивается ошибкой, nginx вставляет блок
         `reco-empty` с пустым местом, и скрипт рекомендаций в браузере догружает блок сам.
      3. **Персональное — в браузере.** Число товаров в корзине на шапке не кэшируется вместе с ней: шапка приходит
         с пустым значком, а скрипт «Платформы» подставляет число для конкретного человека.
      4. **Браузер получает готовую страницу.** Поисковик видит название, цену и описание в первом же ответе.
         Затем скрипты фрагментов оживляют свои части: кнопку «В корзину», галерею, блок рекомендаций.

      ## Варианты и их цена

      - **SSI в веб-сервере**
        - Подходит: простая вставка фрагментов, уже есть nginx.
        - Цена: мало логики; тайм-ауты и запасные блоки — настройками сервера.
      - **ESI на CDN**
        - Подходит: страница должна собираться близко к пользователю.
        - Цена: ESI понимают не все CDN и обычно не полностью.
      - **Свой сборщик**
        - Подходит: нужны тайм-ауты, отправка по частям, сбор ресурсов фрагментов.
        - Цена: ещё один сервис, за который кто-то отвечает.
      - **Multi-zones**
        - Подходит: разделы сайта — отдельные приложения на одном домене.
        - Цена: переход между зонами — полная загрузка страницы.

      ## Типичные ошибки

      - **Нет тайм-аутов.** Самый медленный фрагмент задерживает всю страницу.
      - **Кэшировать персональные данные в общем кэше.** Люди видят чужое имя или корзину.
      - **Запрашивать фрагменты по очереди.** Время ответа складывается.
      - **Глобальные стили во фрагменте.** Одна команда меняет вид чужих частей.
      - **Компонент `Link` между зонами Next.js.** Переход сломается.

      ## Как спрашивают на интервью

      - «Как собрать страницу из частей разных команд, если важны поисковики и первый показ?» — ждут серверную
        сборку из фрагментов.
      - «Что делать с медленным фрагментом?» — ждут тайм-аут, запасной вид и догрузку в браузере.
      - «Что нельзя кэшировать во фрагментах?» — ждут персональные данные в общем кэше.

      ## Коротко

      - При серверной сборке сервер запрашивает у команд фрагменты HTML, вставляет их в шаблон и отдаёт браузеру
        готовую страницу; каждая команда выкатывает свой фрагмент сама.
      - Собирают средствами веб-сервера (SSI), CDN (ESI) или своим сборщиком, если нужна логика сложнее вставки.
      - Страница готова только с последним фрагментом, поэтому у каждого фрагмента есть тайм-аут и запасной вид,
        а второстепенное догружают в браузере.
      - Фрагменты кэшируют по отдельности, но персональные данные в общем кэше покажут одному человеку чужое.
      - Интерактивность всё равно оживает в браузере скриптами фрагментов, и их стили и библиотеки не должны
        мешать друг другу.
      - Multi-zones в Next.js делит сайт на приложения по путям; переход между зонами — полная загрузка, поэтому
        ссылки между ними — обычный `<a>`.

      ## Источники

      - [Модуль ngx_http_ssi_module — nginx](https://nginx.org/ru/docs/http/ngx_http_ssi_module.html)
      - [Multi-zones — Next.js](https://nextjs.org/docs/app/guides/multi-zones)
      - [Micro Frontends: Server-side template composition — Cam Jackson](https://martinfowler.com/articles/micro-frontends.html)

  - id: mfl-web-components
    topic: Способы встраивания
    title: Веб-компоненты
    questions: [mf-080, mf-081, mf-082]
    body: |
      ## Какую проблему решаем

      Блок «С этим покупают» команда «Рекомендации» показывает в четырёх местах: на странице товара, которую
      собирает сервер, в корзине на React, в личном кабинете на Angular и на сайтах партнёров, где стек неизвестен
      вовсе. Делать четыре версии блока под четыре окружения команда не хочет, а заставить всех перейти на один
      фреймворк не может.

      Нужен контракт, который понимает любая страница независимо от фреймворка. Такой контракт уже есть в самом
      браузере: это обычный HTML-элемент. Урок о том, как часть становится своим HTML-тегом, что этот тег может
      принимать и отдавать и где на этом пути ловушки.

      ## Свой HTML-элемент

      **Веб-компоненты** (Web Components) — набор стандартов браузера для своих элементов. Главный из них —
      **Custom Elements**: часть описывает класс, наследник `HTMLElement`, и регистрирует его под именем тега:

      ```js
      customElements.define('shop-recommendations', ShopRecommendations);
      ```

      После этого `<shop-recommendations product-id="12345">` работает на любой странице, где загружен скрипт
      виджета: в чистом HTML, в шаблоне Angular, в JSX. Имя тега обязательно содержит дефис и пишется строчными
      буквами — так браузер отличает свои элементы от стандартных.

      Браузер сам вызывает методы класса в нужные моменты — это **жизненный цикл** элемента:
      - `connectedCallback` — элемент вставили в документ: можно рисовать и загружать данные;
      - `disconnectedCallback` — элемент убрали: пора снять обработчики и остановить запросы;
      - `attributeChangedCallback` — изменился атрибут из списка `static observedAttributes`.

      Если тег оказался в разметке раньше, чем загрузился скрипт, он остаётся неизвестным элементом. Когда скрипт
      вызовет `define`, браузер «обновит» все такие элементы на странице. Пока этого не случилось, их можно
      оформить через `shop-recommendations:not(:defined)`, например оставить под блок место.

      ## Контракт: атрибуты, свойства, события

      У элемента три канала связи со страницей, и каждый годится для своего:
      - **Атрибуты** — то, что пишется в HTML: `product-id="12345"`. Атрибут всегда строка. Подходит для простых
        настроек и работает даже в чистом HTML на сайте партнёра.
      - **Свойства** — поля объекта элемента в JavaScript: `element.excludeIds = ['12', '40']`. Свойство может быть
        любым значением: массивом, объектом, функцией. Подходит для сложных данных.
      - **События** — то, что элемент сообщает наружу. Элемент создаёт `CustomEvent` с данными в поле `detail`
        и отправляет его со своего узла, а страница подписывается обычным `addEventListener`.

      Элемент не знает, кто его вставил, а страница не знает, что внутри элемента. Контракт состоит из имени тега,
      списка атрибутов и свойств и списка событий с форматом `detail` — его описывают и меняют так же осторожно,
      как любой другой контракт между командами.

      ## Shadow DOM: изоляция стилей

      **Shadow DOM** (теневое дерево) — второй стандарт из набора. Элемент вызывает `this.attachShadow({ mode: 'open' })`
      и рисует своё содержимое в отдельное дерево, скрытое от страницы:
      - стили страницы не применяются к содержимому теневого дерева, а стили из теневого дерева не выходят наружу;
      - селекторы страницы вроде `document.querySelector('button')` не находят кнопки внутри.

      Изоляция не полная, и это полезно. **Наследуемые свойства CSS** — шрифт, цвет текста — проходят внутрь, как
      к любому потомку. **CSS-переменные** (custom properties) тоже наследуются, поэтому через них страница задаёт
      виджету тему: `--shop-color-accent: #d33`. А если элемент пометил свои узлы атрибутом `part="card"`, страница
      может оформить их снаружи селектором `shop-recommendations::part(card)`.

      У событий из теневого дерева есть своя особенность. Снаружи они выглядят так, будто их отправил сам элемент:
      браузер подменяет `event.target` на него. А чтобы своё событие `CustomEvent` вообще вышло за границу теневого
      дерева и всплыло по странице, ему нужны флаги `bubbles: true` и `composed: true`.

      ## Ловушки

      **Одно имя — один класс на страницу.** Реестр `customElements` общий для всей страницы. Если два скрипта —
      например, v1 и v2 виджета — оба вызовут `define` с одним именем, второй вызов бросит исключение
      `NotSupportedError`, и на странице останется класс, который зарегистрировался первым. Защищаются двумя
      способами: проверяют `customElements.get(name)` перед регистрацией и вносят мажорную версию в имя тега, если
      две версии должны жить рядом, — `<shop-recommendations-v2>`.

      **React до версии 19 передаёт элементам всё атрибутами.** React 18 не знает, какие свойства есть у чужого
      элемента, и любой проп превращает в атрибут. Строка дойдёт, а объект превратится в строку `"[object Object]"`,
      массив — в свои элементы через запятую. В React 18 сложные данные передают свойством через `ref`. React 19 научился сам: если
      у элемента есть свойство с именем пропа, React присвоит свойство, иначе — атрибут. Для событий надёжный
      способ во всех версиях — подписка через `ref` и `addEventListener`.

      **Отрисовка на сервере.** Обычный веб-компонент рисует себя скриптом, поэтому в HTML с сервера он приходит
      пустым тегом. Declarative Shadow DOM позволяет отдать теневое дерево прямо в HTML, но интерактивным элемент
      станет всё равно только после загрузки скрипта.

      **Свои библиотеки.** Веб-компоненты не делят библиотеки сами по себе: если виджет внутри написан на React,
      он везёт свою копию React на каждую страницу. Для виджетов поэтому часто берут лёгкие библиотеки вроде Lit
      или пишут без фреймворка.

      ## Пример целиком: блок рекомендаций

      Скрипт виджета лежит по адресу с мажорной версией: `https://cdn.shop.example/reco/v1/reco.js`. Внутри —
      класс элемента:

      ```js
      class ShopRecommendations extends HTMLElement {
        static observedAttributes = ['product-id'];
        #root = this.attachShadow({ mode: 'open' });

        connectedCallback() { this.#load(); }
        attributeChangedCallback(name, oldValue) {
          if (oldValue !== null && this.isConnected) this.#load();
        }

        async #load() {
          const items = await fetchRecommendations(this.getAttribute('product-id'));
          this.#root.replaceChildren(styles(), ...items.map((item) => this.#card(item)));
        }

        #card(item) {
          const button = document.createElement('button');
          button.textContent = item.title;
          button.setAttribute('part', 'card');
          button.addEventListener('click', () => {
            this.dispatchEvent(new CustomEvent('recommendation-click', {
              detail: { productId: item.id }, bubbles: true, composed: true,
            }));
          });
          return button;
        }
      }

      if (!customElements.get('shop-recommendations')) {
        customElements.define('shop-recommendations', ShopRecommendations);
      }
      ```

      Событие отправляет сам элемент, а не кнопка внутри теневого дерева, поэтому `composed` здесь лишь страхует
      на случай, если отправку перенесут внутрь; `bubbles` нужен, чтобы событие можно было слушать выше по странице.
      Стили внутри используют переменные с запасными значениями: `color: var(--shop-color-accent, #0a6)`.

      1. **Страница товара.** Фрагмент «Рекомендаций» с сервера содержит тег `<shop-recommendations product-id="12345">`
         и скрипт. Если сервер не дождался фрагмента, пустое место заполняет тот же тег, вставленный скриптом.
      2. **Корзина на React 18.** Атрибут `product-id` — строка, его можно писать прямо в JSX. На событие корзина
         подписывается через `ref`:

         ```jsx
         const ref = useRef(null);
         useEffect(() => {
           const onClick = (e) => navigate(`/p/${e.detail.productId}`);
           ref.current.addEventListener('recommendation-click', onClick);
           return () => ref.current?.removeEventListener('recommendation-click', onClick);
         }, [navigate]);
         return <shop-recommendations ref={ref} product-id={productId} />;
         ```

      3. **Личный кабинет на Angular** вставляет тот же тег в свой шаблон и слушает событие средствами Angular.
      4. **Сайт партнёра** подключает скрипт и тег, задаёт свою тему переменными `--shop-*`, а по событию открывает
         товар у себя.
      5. **Ломающее изменение** — например, другой формат `detail` — выходит как `reco/v2/` с тегом
         `<shop-recommendations-v2>`. Страницы переходят, когда готовы, а v1 убирают, когда её никто не загружает.

      ## Варианты и их цена

      - **Веб-компонент с Shadow DOM**
        - Подходит: виджет для страниц на разных фреймворках и чужих сайтов.
        - Цена: тема только через переменные и `::part`; сложные данные — свойствами.
      - **Веб-компонент без Shadow DOM**
        - Подходит: виджет должен наследовать стили страницы.
        - Цена: стили страницы и виджета могут ломать друг друга.
      - **Компонент фреймворка**
        - Подходит: все потребители на одном фреймворке.
        - Цена: на странице с другим фреймворком его не вставить.

      ## Типичные ошибки

      - **Передавать массив или объект атрибутом.** Элемент получит строку вроде `"[object Object]"`.
      - **Забыть `composed: true`.** Событие не выйдет из теневого дерева.
      - **Регистрировать имя без проверки.** Второй скрипт с тем же тегом упадёт на `define`.
      - **Не убирать за собой в `disconnectedCallback`.** Обработчики и запросы живут после удаления элемента.
      - **Ждать, что глобальные стили страницы оформят теневое дерево.** Пройдут только наследуемые свойства
        и переменные.

      ## Как спрашивают на интервью

      - «Как сделать виджет, который работает на страницах с любым фреймворком?» — ждут Custom Elements и контракт
        из атрибутов, свойств и событий.
      - «Как Shadow DOM изолирует стили и как задать виджету тему?» — ждут наследуемые свойства, CSS-переменные
        и `::part`.
      - «Почему React 18 плохо дружит с веб-компонентами?» — ждут передачу пропов атрибутами.

      ## Коротко

      - Custom Elements позволяют части стать своим HTML-тегом, который работает на странице с любым фреймворком;
        имя тега содержит дефис.
      - Контракт элемента — атрибуты для простых строковых настроек, свойства для сложных данных и события
        `CustomEvent` с данными в `detail`.
      - Shadow DOM отделяет стили элемента от стилей страницы, но наследуемые свойства и CSS-переменные проходят
        внутрь, поэтому тему задают переменными и `::part`.
      - Чтобы событие вышло из теневого дерева и всплыло по странице, ему нужны `bubbles: true` и `composed: true`.
      - Реестр тегов общий на страницу: повторный `define` того же имени бросает `NotSupportedError`, поэтому
        проверяют `customElements.get`, а несовместимую версию выпускают под новым именем.
      - React 18 передаёт пропы элементам атрибутами, поэтому сложные данные и события подключают через `ref`;
        React 19 присваивает свойство, если оно есть у элемента.

      ## Источники

      - [Использование пользовательских элементов — MDN](https://developer.mozilla.org/ru/docs/Web/API/Web_components/Using_custom_elements)
      - [Using shadow DOM — MDN](https://developer.mozilla.org/en-US/docs/Web/API/Web_components/Using_shadow_DOM)
      - [React 19: Support for Custom Elements — React](https://react.dev/blog/2024/12/05/react-19#support-for-custom-elements)

  - id: mfl-single-spa
    topic: Способы встраивания
    title: single-spa и import maps
    questions: [mf-083, mf-084, mf-085, mf-086]
    body: |
      ## Какую проблему решаем

      Личный кабинет магазина пять лет пишут на Angular. Новые разделы команда «Личный кабинет» делает на React,
      а переписать старые — заказы, возвраты — разом не может: на это ушёл бы год без новых функций. Значит,
      какое-то время под одним адресом `/account` будут жить два приложения на двух фреймворках. Человек должен
      переходить из «Заказов» в «Профиль» без перезагрузки страницы и не замечать, что там другой фреймворк.

      Кто-то должен решать, какое приложение показать на текущем адресе, вовремя запускать одно и аккуратно
      убирать другое. И желательно, чтобы React грузился один раз, даже если на нём написано несколько приложений.
      Урок о двух инструментах для этого: оркестраторе single-spa и import maps — возможности браузера,
      которая сопоставляет имена модулей с адресами.

      ## single-spa: оркестратор приложений

      **single-spa** — библиотека, которая держит список приложений и по адресу решает, какие из них должны быть
      на странице. Приложения регистрируют в **корневом конфиге** (root config) — маленьком скрипте, который
      грузится первым:

      ```js
      registerApplication({
        name: '@shop/account',
        app: () => import('@shop/account'),
        activeWhen: ['/account/profile', '/account/addresses'],
        customProps: { user },
      });
      start();
      ```

      - `app` — функция, которая загружает приложение;
      - `activeWhen` — когда приложение активно: префикс пути, функция от адреса или массив из них;
      - `customProps` — данные, которые single-spa передаст приложению, например сведения о пользователе.

      `start()` разрешает начать монтирование. До его вызова single-spa может загружать приложения, но не монтирует
      их — так корневой конфиг успевает, например, дождаться данных о пользователе.

      ## Жизненный цикл приложения

      Приложение для single-spa — модуль, который экспортирует три функции **жизненного цикла**. Каждая возвращает
      промис или объявлена как `async`:
      - `bootstrap` — один раз, перед первым монтированием: подготовка;
      - `mount` — адрес стал подходящим: нарисовать приложение в свой элемент;
      - `unmount` — адрес перестал подходить: убрать за собой **всё**.

      «Всё» — ключевое слово. single-spa не знает, что делало приложение: подписывалось ли на `window`, запускало
      ли таймеры, открывало ли соединения. Если `unmount` только очищает элемент, обработчики и таймеры продолжают
      работать в фоне, и с каждым переходом туда и обратно их становится больше. Для популярных фреймворков есть
      готовые обёртки, которые пишут эти функции за вас, — `single-spa-react`, `single-spa-angular`, `single-spa-vue`.
      Но своё — подписки, таймеры — обёртка за вас не уберёт.

      Между приложениями переходят без перезагрузки двумя способами: функцией `navigateToUrl` — её можно повесить
      на обычную ссылку, `<a href="/account/profile" onclick="singleSpaNavigate(event)">`, — или роутером самого
      приложения, который меняет адрес через `history.pushState`. single-spa следит за историей браузера и после
      каждого перехода решает, кого смонтировать, а кого убрать. Ссылка без обработчика — обычная навигация
      браузера: страница загрузится заново.

      **Parcel** (посылка) — компонент любого фреймворка с тем же жизненным циклом, который монтируют вручную,
      а не по адресу: например, виджет на React внутри приложения на Angular. Посылку монтирует код через
      `mountRootParcel` или `mountParcel` из props, и сам же её размонтирует: автоматически она не уходит.

      ## import maps: имя модуля → адрес

      Чтобы оба приложения взяли одну копию React, нужен способ сказать браузеру: «где бы ни встретился `import`
      из `'react'`, грузи вот этот файл». Это и есть **import map** — карта импортов:

      ```html
      <script type="importmap">
      {
        "imports": {
          "react": "https://cdn.shop.example/libs/react@18.3.1/react.js",
          "@shop/account": "https://cdn.shop.example/account/1.42.0/main.js"
        }
      }
      </script>
      ```

      Теперь `import React from 'react'` в любом модуле страницы грузит этот адрес. Браузер загружает и выполняет
      модуль с одним адресом один раз, поэтому все приложения получают **один экземпляр** React. Ключ с косой
      чертой в конце (`"@shop/ui/"`) сопоставляет целый префикс пути, а раздел `scopes` задаёт другие адреса для
      модулей из определённого пути.

      Правила, о которые спотыкаются:
      - **Карту объявляют до модулей**, которые по ней разрешают имена. Если модуль-вход загрузился раньше карты,
        имя в нём не разрешится. Надёжнее всего — написать карту в HTML до первого `<script type="module">`.
      - **Несколько карт можно** в современных браузерах: они сливаются в одну, и если имя уже сопоставлено, прежний
        адрес остаётся. Старые версии браузеров разрешают только одну карту до первого модуля.
      - **У карты нет атрибута `src`**: она пишется прямо в HTML или вставляется скриптом.
      - **Карта действует на `import` и `import()` в документе**, но не на воркеры и не на `src` у `<script>`.
      - **Библиотека должна быть ES-модулем.** React на npm публикуется в формате CommonJS, поэтому для import maps
        берут ESM-сборку — с CDN вроде esm.sh или собранную самостоятельно. Сборщик приложения при этом помечает
        `react` внешней зависимостью и не кладёт его в бандл.

      import maps работают во всех основных браузерах с марта 2023 года. Для старых браузеров single-spa советует
      SystemJS — загрузчик модулей с картами в том же формате; приложения для него собирают в формат
      System.register. Есть и полифил es-module-shims, но команда single-spa для продакшена его не рекомендует.
      Поверх import maps построен и **Native Federation** — подход с идеями Module Federation (общие зависимости,
      отданные наружу модули), но на стандартных ES-модулях и без привязки к сборщику.

      ## Независимая выкатка через карту

      Карта ещё и удобный рычаг выкатки. Каждая команда собирает своё приложение в новую папку с номером версии,
      а выкатка — это замена одной строки в карте: `account/1.42.0` → `account/1.43.0`. Откат — замена обратно.
      Страницу с картой отдают без долгого кэша, чтобы новая строка доходила сразу. Для этого часто хранят карту
      отдельным JSON на сервере и подставляют в HTML при отдаче — у single-spa есть для этого сервис
      import-map-deployer.

      ## Пример целиком: личный кабинет на двух фреймворках

      HTML кабинета содержит карту и корневой конфиг:

      ```html
      <script type="importmap">
      {
        "imports": {
          "single-spa": "https://cdn.shop.example/libs/single-spa@6/single-spa.js",
          "react": "https://cdn.shop.example/libs/react@18.3.1/react.js",
          "react-dom/client": "https://cdn.shop.example/libs/react-dom@18.3.1/client.js",
          "@shop/account-legacy": "https://cdn.shop.example/account-legacy/3.8.2/main.js",
          "@shop/account": "https://cdn.shop.example/account/1.42.0/main.js"
        }
      }
      </script>
      <script type="module" src="/account/root-config.js"></script>
      ```

      Корневой конфиг регистрирует два приложения:

      ```js
      import { registerApplication, start } from 'single-spa';

      registerApplication({
        name: '@shop/account-legacy',
        app: () => import('@shop/account-legacy'),
        activeWhen: '/account/orders',
      });
      registerApplication({
        name: '@shop/account',
        app: () => import('@shop/account'),
        activeWhen: ['/account/profile', '/account/addresses'],
        customProps: { user },
      });
      start();
      ```

      1. **Человек открывает «Заказы».** Адрес `/account/orders` подходит старому приложению: single-spa загружает
         его, вызывает `bootstrap` и `mount`, и Angular рисует список заказов.
      2. **Переход в «Профиль».** Ссылка в меню вызывает `navigateToUrl`, адрес меняется без перезагрузки.
         single-spa вызывает `unmount` у приложения
         на Angular и `mount` у приложения на React. React загружается по карте — один раз.
      3. **Вход.** Кабинет на том же домене `shop.example`, поэтому запросы обоих приложений к `/api` идут с cookie
         сессии сами. Сведения о пользователе — имя, язык — приложение на React получает через props (`user`).
      4. **Блок рекомендаций** на странице профиля — тот же веб-компонент `<shop-recommendations>`, что и везде.
      5. **Выкатка.** Команда собирает `account/1.43.0` и меняет строку в карте; откат — обратная замена.
      6. **Переезд дальше.** Когда «Заказы» перепишут на React, приложение `@shop/account` получит путь
         `/account/orders`, а старое удалят из конфига. Так кабинет переезжает раздел за разделом — постепенная
         миграция, подробнее о ней в курсе «Системный дизайн: большие приложения», урок «Постепенная миграция».

      ## Варианты и их цена

      - **single-spa и import maps**
        - Подходит: приложения на разных фреймворках под одним адресом, постепенный переезд.
        - Цена: свой жизненный цикл в каждом приложении; общие библиотеки нужны в виде ES-модулей.
      - **Module Federation**
        - Подходит: общий фреймворк и обмен компонентами между приложениями.
        - Цена: привязка к сборщику и его рантайму; договорённости о версиях общих зависимостей.
      - **Разные приложения по адресам**
        - Подходит: разделы, между которыми переходят редко.
        - Цена: полная загрузка страницы при переходе.

      single-spa и Module Federation не исключают друг друга: single-spa отвечает на вопрос «кого и когда
      показать», а Module Federation — «как загрузить код и поделить библиотеки», и приложения single-spa можно
      загружать через Module Federation.

      ## Типичные ошибки

      - **`unmount` только очищает элемент.** Подписки и таймеры старых экземпляров копятся.
      - **Объявлять карту импортов после модуля, который по ней разрешает имена.** Импорт упадёт.
      - **Класть React в бандл каждого приложения.** Карта бесполезна: на странице будет несколько копий.
      - **Ждать, что посылка размонтируется сама.** Её убирает тот, кто смонтировал.
      - **Отдавать страницу с картой с долгим кэшем.** Новые версии приложений не дойдут до людей.

      ## Как спрашивают на интервью

      - «Что такое single-spa и чем он отличается от Module Federation?» — ждут оркестрацию по адресу
        и жизненный цикл против загрузки модулей и общих зависимостей.
      - «Как поделить одну копию React между приложениями без сборщика?» — ждут import maps и ESM-сборку.
      - «Что должен делать `unmount`?» — ждут уборку всего, что приложение создало.

      ## Коротко

      - single-spa держит список приложений и по адресу решает, какие смонтировать, вызывая их `bootstrap`,
        `mount` и `unmount`; `start()` разрешает монтирование.
      - `unmount` обязан убрать всё, что приложение создало, — обработчики, таймеры, соединения; иначе они
        копятся с каждым переходом.
      - Посылки (parcels) монтируют вручную, и тот же код обязан их размонтировать.
      - import map сопоставляет имя модуля с адресом; модуль с одним адресом браузер загружает один раз, поэтому
        приложения получают общую копию библиотеки, если она ES-модуль и не лежит в их бандлах.
      - Карту объявляют до модулей, которые по ней разрешают имена; на воркеры она не действует.
      - Выкатка и откат приложения — замена его адреса в карте, поэтому страницу с картой отдают без долгого кэша.

      ## Источники

      - [Configuring single-spa — single-spa](https://single-spa.js.org/docs/configuration)
      - [Building single-spa applications — single-spa](https://single-spa.js.org/docs/building-applications)
      - [<script type="importmap"> — MDN](https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/script/type/importmap)

  - id: mfl-mf-basics
    topic: Module Federation
    title: Хост, remote и контейнер
    questions: [mf-001, mf-002, mf-061, mf-003, mf-004, mf-006, mf-007, mf-008, mf-063, mf-009, mf-012, mf-056]
    body: |
      ## Какую проблему решаем

      Каталог, корзина и оформление заказа — интерактивные экраны на React, между которыми человек ходит постоянно.
      Перезагружать страницу при каждом переходе нельзя, фреймы не подходят: окна и вид должны быть общими. Нужно,
      чтобы оболочка магазина во время работы загрузила экран каталога, собранный и выкаченный командой «Каталог»
      отдельно, и показала его как свой компонент. И чтобы при этом React на странице был один.

      Именно это делает Module Federation. Урок об основах: кто кого загружает, что лежит в конфигах, какой файл
      качается первым и когда браузер скачивает код модуля.

      ## Что такое Module Federation

      **Module Federation** (федерация модулей) появилась в webpack 5. Приложения собираются и выкатываются
      независимо, а во время работы одно приложение загружает модули другого по сети и делит с ним общие
      библиотеки, например React. Это не способ собрать всё в один бандл и не фреймворк для серверного рендеринга:
      соединение происходит в рантайме (во время работы), в браузере или в Node.

      Сейчас технологию развивает проект **Module Federation 2.0**:
      - общий рантайм `@module-federation/runtime` — код, который загружает модули и договаривается о библиотеках;
      - плагин для webpack и Rspack в пакете `@module-federation/enhanced`;
      - плагин для Vite `@module-federation/vite`.

      Рантайм у всех общий, поэтому важен формат, в котором приложение отдаёт модули, а не сборщик и его версия.

      ## Хост и remote

      В федерации две роли:
      - **хост** (host) — потребитель: он подключает другие приложения и берёт из них модули;
      - **remote** — поставщик: он объявляет, какие свои модули отдаёт наружу.

      Роли условны. Одно приложение может быть remote для оболочки и при этом само подключать другой remote — это
      **вложенная федерация**. Remote не знает, кто его подключает: он только публикует вход. Обычно хост — это
      оболочка из прошлых уроков.

      ## Конфиг remote

      Remote описывает себя в плагине четырьмя полями:

      ```js
      // webpack.config.js команды «Каталог»
      new ModuleFederationPlugin({
        name: 'catalog',
        filename: 'remoteEntry.js',
        exposes: { './CatalogPage': './src/CatalogPage.tsx' },
        shared: { react: { singleton: true }, 'react-dom': { singleton: true } },
      });
      ```

      - **`name`** — имя **контейнера**: так хост найдёт этот remote. У классического входа (о нём ниже) это ещё
        и имя глобальной переменной, в которой лежит контейнер, поэтому имена должны быть уникальными
        и не совпадать с другими глобальными именами страницы.
      - **`filename`** — имя собранного входного файла, который хост загрузит первым.
      - **`exposes`** — что отдаётся наружу. Ключ (`./CatalogPage`) — имя для потребителей, значение — путь к файлу
        в исходниках. Это **публичный контракт** remote: снаружи доступно только перечисленное здесь.
      - **`shared`** — общие библиотеки, о них следующий урок.

      ## Вход remote и контейнер

      **`remoteEntry.js`** — маленький входной файл. Это не весь код remote и не HTML-страница: внутри только
      **контейнер** — объект с двумя методами:
      - `init` — получить общую область зависимостей (share scope), куда участники кладут свои библиотеки;
      - `get` — отдать фабрику модуля по имени из `exposes`.

      Код самих модулей лежит в отдельных файлах — **чанках** — и скачивается, только когда модуль понадобился.
      В Module Federation 2.0 вместо `remoteEntry.js` можно указать `mf-manifest.json` — описание remote
      с метаданными, о нём урок «Рантайм и типы».

      ## Конфиг хоста и импорт

      Хост перечисляет remote, которые подключает:

      ```js
      // webpack.config.js оболочки
      new ModuleFederationPlugin({
        name: 'shell',
        remotes: {
          catalog: 'catalog@https://cdn.shop.example/catalog/remoteEntry.js',
          checkout: 'checkout@https://cdn.shop.example/checkout/remoteEntry.js',
        },
        shared: { react: { singleton: true }, 'react-dom': { singleton: true } },
      });
      ```

      В строке `catalog: 'catalog@https://…/remoteEntry.js'` три части: ключ слева — имя, под которым хост пишет
      импорты (`catalog/CatalogPage`); до `@` — имя контейнера, оно должно совпадать с `name` в конфиге remote;
      после `@` — адрес входа. Если remote подключают через манифест, имя берётся из манифеста. В рантайме 2.0 тот же
      remote описывают объектом `{ name, entry }`.

      Ничего не устанавливается через npm и не копируется при сборке. Модуль подключают в коде одним из двух
      способов:
      - **динамический импорт** `import('catalog/CatalogPage')` — сборщик знает из конфига, что `catalog/*` — это
        remote;
      - **`loadRemote('catalog/CatalogPage')`** из рантайма — remote ищется по имени во время работы.

      Компонент обычно оборачивают в `React.lazy`, а его — в `Suspense` (что показать, пока грузится)
      и в границу ошибок (что показать, если не загрузился; подробнее — урок «Ошибки и безопасность»).

      Если хост просит модуль, которого нет в `exposes`, — опечатка, другой регистр, лишний или пропущенный `./`,
      устаревшая сборка remote, — рантайм не вернёт тихо `undefined`, а бросит ошибку RUNTIME-014. Сборка хоста
      при этом пройдёт: о составе remote она ничего не знает.

      ## Когда что скачивается

      1. Код модулей remote не входит в бандл хоста и при сборке хоста не скачивается.
      2. Когда хост впервые импортирует модуль, рантайм загружает вход remote (если ещё не загружен), вызывает
         `init`, затем `get`, который скачивает чанки модуля и отдаёт его фабрику.
      3. Скачать файлы модуля заранее, не выполняя его, можно через `preloadRemote` (урок «Рантайм и типы»).
      4. Сам вход может загрузиться раньше модуля: при стратегии `version-first`, которая включена по умолчанию,
         рантайм загружает входы remote при старте, чтобы узнать их версии общих библиотек (урок «Версии
         и асинхронная граница»).

      **Модули кэшируются.** Если хост вызывает `loadRemote('checkout/CartPage')` в двух местах, модуль скачается
      и выполнится один раз, а второй вызов получит тот же экземпляр. Значит, всё, что модуль хранит на уровне
      модуля, — кэш, сервис-синглтон — общее для обоих мест. Сбросить это можно перезагрузкой страницы или повторной
      регистрацией remote с флагом `force` (урок «Рантайм и типы»).

      ![Как хост загружает модуль remote: оболочка грузит remoteEntry.js с CDN — при старте или при первом обращении, вызывает init и передаёт общую область зависимостей, затем get('./CatalogPage'), который скачивает чанки модуля и отдаёт фабрику; React берётся из общей области](images/mfl-mf-loading.png "Хост, вход remote, init, get и чанки")

      ## Независимая выкатка и её цена

      Команда каталога исправила ошибку и выкатила новую версию. Хосту ничего делать не нужно: при следующей загрузке
      страницы он возьмёт свежий `remoteEntry.js` и через него — новые чанки, если вход не закэширован надолго
      (про кэш — урок «Выкатка, скорость и тесты»). Уже открытые вкладки остаются на старой версии до перезагрузки.
      Если же адрес remote содержит версию в пути, хосту придётся поменять адрес в конфиге.

      Оборотная сторона: если remote сломал контракт — переименовал ключ в `exposes`, сменил `name` или обязательные
      пропсы, — хост узнает об этом только в рантайме, у людей.

      ## Разные фреймворки

      Module Federation делит JavaScript-модули и о фреймворках не знает. Если у хоста и remote один фреймворк,
      удобно отдавать компоненты и делить фреймворк через `shared`. Если разные — например, хост на React,
      а remote на Vue, — компонент Vue в JSX не вставить. Тогда remote отдаёт функции `mount(element)`
      и `unmount()` или веб-компонент, а хост встраивает его в свой DOM-узел. Для этого у Module Federation есть
      готовые мосты (Bridge) для React и Vue.

      ## Пример целиком: оболочка открывает каталог

      1. **Человек открывает главную.** Оболочка («Платформа») загружает свой бандл. Кода каталога в нём нет.
      2. **Переход на `/catalog`.** Роутер оболочки рендерит
         `const CatalogPage = lazy(() => import('catalog/CatalogPage'))` внутри `Suspense` и границы ошибок.
      3. **Загрузка.** Рантайм берёт `https://cdn.shop.example/catalog/remoteEntry.js`, вызывает `init`
         с общей областью, где уже лежит React оболочки, затем `get('./CatalogPage')`. Скачиваются чанки экрана,
         React берётся общий.
      4. **Второе обращение.** Человек уходит в корзину и возвращается: модуль каталога уже в кэше, ничего не грузится.
      5. **Выкатка каталога.** «Каталог» выкатывает исправление днём. Люди, открывшие магазин после выкатки, получают
         новую версию; оболочку никто не пересобирал.

      ## Варианты и их цена

      - **Динамический импорт `import('catalog/…')`**
        - Подходит: remote известны при сборке хоста.
        - Цена: адреса в конфиге сборки — для смены нужна пересборка.
      - **`loadRemote` из рантайма**
        - Подходит: remote и адреса известны только во время работы.
        - Цена: больше кода вокруг загрузки; ошибки имён видны только в рантайме.
      - **Remote отдаёт функцию монтирования**
        - Подходит: хост и remote на разных фреймворках.
        - Цена: нет общих компонентов и контекстов; данные — через параметры монтирования.

      ## Типичные ошибки

      - **Думать, что `remoteEntry.js` — весь код remote.** Это маленький вход, модули грузятся отдельно.
      - **Ждать `undefined` вместо ошибки** при неверном имени модуля.
      - **Не совпадает имя до `@` и `name` remote.** Контейнер не найдётся.
      - **Одинаковые или «популярные» имена контейнеров.** Классический вход конфликтует с глобальными именами.
      - **Ждать, что сборка хоста поймает поломку контракта remote.** Не поймает.

      ## Как спрашивают на интервью

      - «Как работает Module Federation?» — ждут хост и remote, `exposes` и `remotes`, вход с `init` и `get`,
        чанки по требованию и общие библиотеки.
      - «Что нужно сделать хосту, когда remote выкатил новую версию?» — ждут: ничего, если вход не закэширован
        надолго.
      - «Можно ли подключить remote на другом фреймворке?» — ждут функции монтирования или веб-компонент.

      ## Коротко

      - Module Federation позволяет приложению во время работы загружать модули другого, отдельно собранного
        приложения и делить с ним общие библиотеки.
      - Хост потребляет, remote отдаёт модули через `exposes`; одно приложение может быть и тем и другим, а remote
        не знает своих хостов.
      - `remoteEntry.js` — маленький вход с контейнером: `init` принимает общую область зависимостей, `get` отдаёт
        модуль, а чанки модуля скачиваются только при первом импорте или предзагрузке.
      - В `remotes` хоста ключ — имя в импортах, до `@` — имя контейнера, равное `name` remote, после — адрес входа.
      - Модуль remote выполняется один раз, и его состояние на уровне модуля общее для всех мест хоста.
      - Новая версия remote доходит до людей без выкатки хоста, но поломку контракта хост увидит только в рантайме.
      - Remote на другом фреймворке отдаёт функции монтирования или веб-компонент.

      ## Источники

      - [Module Federation — webpack](https://webpack.js.org/concepts/module-federation/)
      - [Quick Start — Module Federation](https://module-federation.io/guide/start/quick-start)
      - [Configuration — Module Federation](https://module-federation.io/configure/)

  - id: mfl-mf-shared
    topic: Module Federation
    title: Общие зависимости
    questions: [mf-005, mf-013, mf-014, mf-016, mf-024, mf-025, mf-023, mf-026, mf-021, mf-020]
    body: |
      ## Какую проблему решаем

      Оболочка магазина и каталог написаны на React. Каждый собирается отдельно, и каждый привозит React в своём
      бандле. Если ничего не делать, на странице окажутся две копии React. Это не только лишние 40–50 КБ. Хуже
      другое: компонент каталога, отрисованный в дереве оболочки, падает при первом же `useState` с ошибкой
      «Invalid hook call».

      Урок о разделе `shared`: как участники федерации договариваются пользоваться одной копией библиотеки,
      каким библиотекам это обязательно, а каким — просто экономия, и какие настройки здесь чаще всего путают.

      ## Общая область зависимостей

      В разделе **`shared`** участник перечисляет библиотеки, которые готов делить с другими. Каждый участник
      кладёт свою версию такой библиотеки в **общую область** (share scope), а когда кто-то импортирует
      библиотеку, рантайм выбирает из области подходящую версию:
      - если версии участников совместимы, все берут одну копию;
      - если нет — что делать, решают правила `singleton`, `requiredVersion` и `strictVersion`.

      `shared` нужен именно для библиотек. Свои модули remote отдаёт через `exposes`. Стор Redux через `shared`
      тоже не объединить: делится модуль библиотеки, а стор создаёт код приложения, и у каждого он свой.
      А localStorage и так общий у всех скриптов одного источника — `shared` для этого не нужен.

      ## Почему две копии React ломают хуки

      React хранит часть состояния **на уровне модуля** — в переменных самой библиотеки: например, текущий
      диспетчер хуков и объекты контекстов. Компонент каталога вызывает `useState` из своей копии React, а рендерит
      его копия оболочки. Диспетчер выставлен в одной копии, а хук ищет его в другой — отсюда «Invalid hook call».
      Сборка при этом проходит, и рантайм ничего не делит сам: без `shared` каждая копия живёт в своём бандле.

      Поэтому React и ReactDOM всегда делают общими, причём как **singleton**.

      ## singleton: одна копия на всех

      **`singleton: true`** разрешает в общей области только одну копию библиотеки для всех участников. Даже если
      версии участников расходятся, все получат одну и ту же копию. Это не про момент загрузки и не про права
      доступа: remote пользуется библиотекой так же, как хост, — той же копией.

      Без `singleton` участники с несовместимыми версиями получат разные копии. Например, у хоста `lib` 1.0.0
      с требованием `^1.0.0`, у remote — 2.0.0 с требованием `^2.0.0`: каждая сторона возьмёт свою версию,
      и на странице будут две копии. Какую версию получает singleton при расхождении — следующий урок.

      **Каким библиотекам нужен singleton.** Правило: тем, у кого есть состояние на уровне модуля или контекст,
      общий для хоста и remote:
      - `react` и `react-dom`;
      - роутер, если хост и remote работают в одном дереве роутинга: иначе remote не увидит контекст роутера хоста;
      - библиотека стилей или UI-кит с темой через контекст, если тему задаёт хост.

      Утилиты без состояния — работа с датами, lodash — можно делать общими ради экономии веса, но и две их копии
      ничего не ломают. Делать общим весь `node_modules` не стоит: каждая общая библиотека — это договорённость
      о версиях и асинхронная загрузка.

      ## Подпути — отдельные модули

      Ключ в `shared` совпадает с **точным** путём импорта. `react-dom` и `react-dom/client` для федерации — два
      разных модуля. Если в `shared` указан только `react-dom`, а код импортирует `createRoot`
      из `'react-dom/client'`, этот подпуть каждый участник привезёт свой.

      Насколько это опасно, зависит от содержимого подпути. В React 18 `react-dom/client` — тонкая обёртка над
      `react-dom`, а в React 19 рендерер переехал туда целиком, и дубль становится настоящим вторым рендерером.
      `react/jsx-runtime` тоже подпуть, но его дубль ничего не ломает. Чтобы покрыть все подпути, используют ключ
      с косой чертой в конце — `'react-dom/'`: он включает сопоставление по префиксу.

      ## Область с именем: shareScope

      **`shareScope`** задаёт имя общей области. По умолчанию все участники кладут библиотеки в область `default`,
      и делятся только те, кто положил библиотеку в одну и ту же область. Отдельные области нужны, например, чтобы
      изолировать группу микрофронтендов на другой мажорной версии фреймворка.

      Обратная сторона — участники в разных областях библиотеку не делят, даже если ключ и версия совпадают
      и у обоих стоит singleton. Singleton действует внутри области, а не на всю страницу. Ошибку легко получить,
      скопировав конфиг из другого проекта: у remote `shareScope: 'mf2'`, у хоста — область по умолчанию,
      и на странице снова два React и «Invalid hook call».

      ## import: false и eager

      **`import: false`** — участник не привозит свою копию и берёт библиотеку только из общей области.
      Бандл меньше, но если библиотеку никто не предоставил, загрузка падает с ошибкой RUNTIME-012 («The getter
      for the shared module is not a function»). И такой remote нельзя запустить самостоятельно, без хоста. Это
      уместно, когда хост гарантированно даёт библиотеку.

      **`eager: true`** кладёт библиотеку прямо в стартовый файл участника. Обычно общие библиотеки грузятся
      асинхронно: рантайм сначала договаривается с участниками о версии. С `eager` библиотека доступна сразу, без
      этого ожидания, но она всегда попадает в стартовый файл и всегда скачивается — документация прямо
      предупреждает о раздувании входа. `eager` влияет только на бандл того, кто его объявил, и не делает
      библиотеку singleton: это разные настройки. Зачем вообще нужно ожидание — урок «Версии и асинхронная граница».

      ## Пример целиком: что делит магазин

      «Платформа» ведёт общий список, и все участники пишут одинаково:

      ```js
      shared: {
        react: { singleton: true, requiredVersion: '^18.3.0' },
        'react-dom': { singleton: true, requiredVersion: '^18.3.0' },
        'react-dom/': { singleton: true, requiredVersion: '^18.3.0' },
        'react-router-dom': { singleton: true },
        '@shop/ui': { singleton: true },
      },
      ```

      1. **React и ReactDOM** — singleton: каталог и корзина рисуются в дереве оболочки, их хуки и контексты должны
         быть общими. Ключ `'react-dom/'` покрывает `react-dom/client`.
      2. **Роутер** — singleton: экраны каталога и корзины живут в одном дереве маршрутов оболочки.
      3. **Дизайн-система `@shop/ui`** — singleton: тема задаётся провайдером в оболочке.
      4. **Даты и мелкие утилиты** в список не попали: две копии — несколько килобайт, а договариваться о каждой
         версии дороже.
      5. **Случай из жизни.** Команда корзины скопировала конфиг из учебного примера с `shareScope: 'mf2'`. Сборка
         прошла, а в браузере корзина упала с «Invalid hook call». Строку убрали — корзина снова в общей области.

      ## Варианты и их цена

      - **Общая библиотека singleton**
        - Подходит: библиотеки с состоянием на уровне модуля или общим контекстом.
        - Цена: одна версия на всех — договорённости и риск несовпадения.
      - **Общая библиотека без singleton**
        - Подходит: утилиты, где важна экономия веса, но две копии не страшны.
        - Цена: при несовместимых версиях всё равно две копии.
      - **Своя копия в бандле**
        - Подходит: мелкие библиотеки без состояния.
        - Цена: лишний вес у пользователя.
      - **`import: false`**
        - Подходит: хост гарантированно даёт библиотеку.
        - Цена: remote не запускается без хоста; нет библиотеки — ошибка загрузки.

      ## Типичные ошибки

      - **React не в `shared`.** Две копии и «Invalid hook call».
      - **Общим объявлен `react-dom`, а импортируется `react-dom/client`.** В React 19 — второй рендерер.
      - **Разные `shareScope` у хоста и remote.** Библиотека не делится, хотя ключи совпадают.
      - **Делать общим весь `node_modules`.** Договорённости о версиях на каждую библиотеку.
      - **`import: false` у remote, который должен запускаться отдельно.** Без хоста он не загрузится.

      ## Как спрашивают на интервью

      - «Зачем нужен `shared` и что делает `singleton`?» — ждут одну копию библиотек с состоянием и почему две копии
        React ломают хуки.
      - «Какие библиотеки делать singleton?» — ждут React, роутер, тему через контекст и правило про состояние
        на уровне модуля.
      - «React общий, а хуки всё равно падают. Почему?» — ждут подпути и `shareScope`.

      ## Коротко

      - В `shared` участники перечисляют библиотеки, которые кладут в общую область, а рантайм при импорте выбирает
        подходящую версию.
      - React хранит диспетчер хуков и контексты на уровне модуля, поэтому две копии ломают хуки: React и ReactDOM
        делают общими singleton.
      - `singleton` оставляет одну копию на всех, даже при расхождении версий; без него несовместимые версии дают
        две копии.
      - Singleton нужен библиотекам с состоянием на уровне модуля или общим контекстом; утилиты без состояния
        можно и не делить.
      - Ключ в `shared` совпадает с точным путём импорта: подпути вроде `react-dom/client` покрывает ключ с косой
        чертой в конце.
      - Делятся только участники одной `shareScope`; singleton действует внутри области.
      - `import: false` не привозит свою копию и требует, чтобы её дал кто-то другой; `eager` кладёт библиотеку
        в стартовый файл ценой его размера.

      ## Источники

      - [Shared — Module Federation](https://module-federation.io/configure/shared)
      - [ModuleFederationPlugin — webpack](https://webpack.js.org/plugins/module-federation-plugin)

  - id: mfl-mf-versions
    topic: Module Federation
    title: Версии и асинхронная граница
    questions: [mf-019, mf-027, mf-015, mf-018, mf-036, mf-037, mf-028, mf-029]
    body: |
      ## Какую проблему решаем

      React у всех участников магазина общий и singleton. Но выкатываются участники независимо, и однажды
      каталог обновит свою библиотеку раньше оболочки. Копия на странице одна — чья версия победит? Что увидит
      сторона, которой эта версия не подходит: ошибку, предупреждение или ничего? И когда вообще рантайм успевает
      это решить, если код приложения начинает импортировать React с первой строки?

      Урок о версиях общих библиотек: откуда берётся требование к версии, как выбирается копия, какие есть
      стратегии выбора и зачем приложению с федерацией асинхронная граница.

      ## Требуемая версия

      **`requiredVersion`** — диапазон версий, который участник готов принять, например `^18.3.0`. Если его
      не указать, сборщик берёт диапазон из `dependencies` в `package.json` приложения, а не точную версию
      из lock-файла. Ловушки:
      - **Точная версия в `package.json`** (`"react": "18.2.0"`) даёт точное требование «ровно 18.2.0», а не
        «18.2.0 и совместимые».
      - **Зависимость не по semver** — `file:` или ссылка на git — не даёт вычислить требование, и сборщик
        предупреждает об этом.
      - **Библиотеки внутри `node_modules`** берут требование из своего `package.json`, например из
        `peerDependencies`. Отсюда предупреждения о чужих пакетах, которых вы не трогали.
      - **`requiredVersion: false`** означает «подходит любая версия».

      ## Как выбирается копия singleton

      У singleton копия одна, поэтому кто-то может получить не ту версию, которую ждал. По умолчанию рантайм берёт
      **наивысшую** из версий, которые положили участники. Сторона, чьему диапазону эта версия не подходит, получает
      предупреждение в консоли:

      ```
      Version 2.0.0 from remote of shared singleton module lib does not satisfy
      the requirement of host which needs ^1.0.0
      ```

      Ни сборка, ни загрузка при этом не падают. Хост главнее не становится: при выборе наивысшей версии его
      1.0.0 проиграет. Несовместимость проявится уже в работе — например, когда хост вызовет функцию, которой
      в 2.0.0 больше нет. Поэтому предупреждения федерации в консоли — не шум, а сигнал.

      Частый безобидный на вид случай: хост даёт React 18.3.1, а remote собран с `"react": "18.2.0"` — точной
      версией. Remote получит 18.3.1 и предупреждение, потому что требование «ровно 18.2.0». Работать будет, но
      консоль замусорена, и настоящее предупреждение в ней легко пропустить. Лечится единым диапазоном — `^18.2.0`
      в `package.json` или явный `requiredVersion`. Та же схема с мажорной разницей опасна по-настоящему: remote
      сядет на чужую мажорную версию с тем же скромным предупреждением.

      ## strictVersion: ошибка вместо предупреждения

      **`strictVersion: true`** превращает несовпадение у singleton в ошибку. Падает импорт на той стороне, которая
      объявила `strictVersion`: если у хоста `^1.0.0` и `strictVersion`, а наивысшая версия — 2.0.0 от remote,
      то `import('lib')` в хосте бросит ошибку с тем же текстом. Другую копию `strictVersion` не выбирает — копия
      у singleton одна, — он только запрещает неподходящую. Remote без `strictVersion` спокойно работает на 2.0.0.

      У обычной, не singleton, библиотеки с собственной копией несовпадение ничего не ломает: участник просто
      возьмёт свою копию. Поэтому там `strictVersion` включён по умолчанию. Без `requiredVersion` у `strictVersion`
      нет эффекта: сравнивать не с чем.

      ## Стратегии: version-first и loaded-first

      Чтобы выбрать наивысшую версию, рантайм должен знать версии всех участников. Как он их узнаёт, задаёт
      **стратегия** (`shareStrategy`):
      - **`version-first`** — по умолчанию в рантайме 2.0. При старте рантайм загружает входы **всех** remote,
        собирает версии и для singleton выбирает наивысшую. Загружаются только входные файлы, модули — по-прежнему
        по требованию. Цена: старт зависит от доступности всех remote, даже тех, что ещё не понадобились. Если
        вход какого-то remote не загрузился, старт может сорваться. Документация советует обрабатывать такие
        ошибки в хуке `errorLoadRemote` на этапе `beforeLoadShare`, добавлять повторы и границы ошибок
        (урок «Ошибки и безопасность»).
      - **`loaded-first`** — рантайм переиспользует то, что уже загружено, а вход remote грузит, только когда
        к remote обратились. Старт быстрее и устойчивее, но версия зависит от порядка загрузки: кто первым
        загрузил библиотеку, того версия и будет.

      Разница видна на примере. У хоста `lib` 1.0.0 singleton, он использует её при старте. Позже подгружается
      remote с `lib` 2.0.0 и требованием `^2.0.0`:
      - при `version-first` рантайм ещё до старта увидел 2.0.0 во входе remote — и хост, и remote получат 2.0.0;
      - при `loaded-first` вход remote скачается только при обращении, а к этому моменту 1.0.0 уже загружена:
        remote получит её и предупреждение. Ошибки не будет — без `strictVersion` несовпадение у singleton только
        предупреждение.

      ## Асинхронная граница

      Код приложения синхронно импортирует общие библиотеки: `import React from 'react'` — первая строка многих
      файлов. Если такой код выполнится сразу при загрузке входного файла, рантайм ещё не договорился с участниками,
      какую копию React отдать.

      Поэтому в приложениях с федерацией входной файл обычно содержит одну строку:

      ```js
      // index.js
      import('./bootstrap');
      ```

      а весь код приложения переезжает в `bootstrap.js`. Динамический импорт создаёт **асинхронную границу**:
      пока он загружается, рантайм собирает версии и решает, какие копии отдать, и только потом выполняется код
      с синхронными импортами. Выигрыш в размере `index.js` — побочный эффект, а не цель; React этого не требует,
      это требование федерации.

      Если границу убрать и синхронно импортировать общую библиотеку прямо во входном файле, будет ошибка. Её текст
      зависит от плагина — и по нему видно, какой плагин стоит в проекте:
      - встроенный `ModuleFederationPlugin` webpack: «Shared module is not available for eager consumption»;
      - рантайм 2.0 (`@module-federation/enhanced`): RUNTIME-006 «Invalid loadShareSync function call»
        с подсказкой проверить асинхронную границу. В документации этот случай описан как RUNTIME-005, но
        на проверочном стенде с webpack и `@module-federation/enhanced` 2.9 пришла именно RUNTIME-006.

      Обходные пути: `eager: true` у библиотеки (стартовый файл растёт) или опция `experiments.asyncStartup`
      в `@module-federation/enhanced`, которая добавляет асинхронную границу сама. По умолчанию она выключена.

      ## Пример целиком: каталог обновляет дизайн-систему раньше всех

      В магазине дизайн-система `@shop/ui` — общая singleton: тема задаётся провайдером в оболочке. Все участники
      объявляют её с диапазоном `^2.4.0`.
      1. **Каталог собрался с `@shop/ui` 2.5.0**, оболочка и корзина — с 2.4.1. При `version-first` рантайм при старте
         читает входы каталога и корзины, видит 2.5.0 и отдаёт её всем. Диапазон `^2.4.0` она устраивает —
         предупреждений нет, и оболочка с корзиной получают исправления из 2.5.0 без своей выкатки.
      2. **Корзина по ошибке закрепила `"@shop/ui": "2.4.1"`** точной версией. Она получает 2.5.0 и предупреждение.
         «Платформа» добавляет проверку в сборку: точные версии общих библиотек в `package.json` запрещены.
      3. **Каталог пробует `@shop/ui` 3.0** с другими именами компонентов. Наивысшей стала бы 3.0, и оболочка
         получила бы её с одним предупреждением, а сломалась бы уже в работе. Оболочка объявляет для `@shop/ui`
         `strictVersion: true`: несовместимая версия теперь роняет её импорт сразу и заметно. У этого две стороны:
         если каталог выкатит 3.0 прямо к людям, упадёт не каталог, а оболочка — весь магазин. Поэтому «Платформа»
         добавляет в сборку каждого remote проверку, что мажорные версии общих singleton-библиотек совпадают с общим
         списком. Сборка каталога с 3.0 не пройдёт, а строгая оболочка остаётся страховкой на тестовом стенде.
      4. **Падение каталога в субботу.** CDN каталога отвечает ошибками, и при `version-first` старт оболочки
         споткнулся о его вход. Оболочка обрабатывает ошибку на этапе `beforeLoadShare` и продолжает старт без
         каталога — как это устроено, показано в уроке «Ошибки и безопасность».
      5. **Входной файл** каждого приложения — `import('./bootstrap')`.

      ## Варианты и их цена

      - **`version-first`**
        - Подходит: важно, чтобы все получили наивысшую версию.
        - Цена: старт тянет входы всех remote и зависит от их доступности.
      - **`loaded-first`**
        - Подходит: важнее скорость и устойчивость старта.
        - Цена: версия зависит от порядка загрузки.
      - **`strictVersion` у singleton**
        - Подходит: несовместимая версия должна падать сразу, а не ломаться тихо.
        - Цена: несовместимый участник роняет загрузку библиотеки у строгой стороны.
      - **`eager` вместо асинхронной границы**
        - Подходит: библиотека нужна сразу при старте.
        - Цена: больше стартовый файл.

      ## Типичные ошибки

      - **Считать хост главным при выборе версии.** Побеждает наивысшая.
      - **Пропускать предупреждения о версиях.** Несовместимость проявится позже, уже в работе.
      - **Точные версии общих библиотек в `package.json`.** Лишние предупреждения на каждый патч.
      - **Ждать, что `strictVersion` выберет подходящую копию.** Он только запрещает неподходящую.
      - **Убрать `bootstrap.js` без замены.** Ошибка про синхронную загрузку общей библиотеки.
      - **Не обрабатывать недоступный remote при `version-first`.** Старт сорвётся из-за части, которая ещё
        не нужна.

      ## Как спрашивают на интервью

      - «Как выбирается версия общей библиотеки singleton?» — ждут наивысшую версию, предупреждение для
        неудовлетворённой стороны и `strictVersion`.
      - «Зачем в приложении с федерацией `import('./bootstrap')`?» — ждут асинхронную границу для договорённости
        о версиях.
      - «Чем `version-first` отличается от `loaded-first`?» — ждут загрузку входов при старте против
        переиспользования загруженного.

      ## Коротко

      - `requiredVersion` по умолчанию берётся из диапазона в `package.json`, поэтому точная версия там даёт
        точное требование, а библиотеки в `node_modules` приносят требования своих `peerDependencies`.
      - Singleton по умолчанию получает наивысшую версию из положенных участниками; сторона, которой она не подходит,
        получает предупреждение, а несовместимость проявится только в работе.
      - `strictVersion` у singleton превращает несовпадение в ошибку на той стороне, что его объявила, и не выбирает
        другую копию.
      - `version-first` при старте загружает входы всех remote ради наивысшей версии, поэтому недоступный remote
        может сорвать старт; `loaded-first` быстрее и устойчивее, но версия зависит от порядка загрузки.
      - Асинхронная граница — входной файл `import('./bootstrap')` — даёт рантайму договориться о версиях до того,
        как выполнится код с синхронными импортами общих библиотек.
      - Без границы будет ошибка синхронной загрузки общей библиотеки; обходы — `eager` или
        `experiments.asyncStartup`.

      ## Источники

      - [Shared — Module Federation](https://module-federation.io/configure/shared)
      - [shareStrategy — Module Federation](https://module-federation.io/configure/shareStrategy.html)
      - [Runtime troubleshooting — Module Federation](https://module-federation.io/guide/troubleshooting/runtime)

  - id: mfl-mf-runtime
    topic: Module Federation
    title: Рантайм и типы
    questions: [mf-030, mf-031, mf-032, mf-022, mf-033, mf-034, mf-038, mf-039, mf-062, mf-064]
    body: |
      ## Какую проблему решаем

      У магазина три стенда — разработка, тестовый и продакшен, — и на каждом свои адреса remote. Если адреса
      записаны в конфиге сборки оболочки, её придётся собирать трижды, и на продакшен поедет не тот бандл, который
      проверяли. Разработчик каталога хочет проверить свою локальную сборку прямо на тестовом стенде, не поднимая
      всю систему у себя. А в коде оболочки пропсы экранов из remote описаны как `any`, и опечатка в пропсе
      всплывает только у людей.

      Всё это решает рантайм федерации — код, который работает в браузере и умеет регистрировать remote,
      загружать модули, предзагружать файлы и подключать плагины. Урок о его API, о манифесте и о типах для
      модулей remote.

      ## Статические и динамические remote

      Разница — в том, **где задан адрес**:
      - **статические** remote перечислены в `remotes` конфига сборки — адрес вшит в бандл хоста;
      - **динамические** remote регистрируются во время работы — адрес можно взять откуда угодно, например
        из конфига окружения.

      Код remote в обоих случаях загружается асинхронно, оба способа есть в webpack и Vite, и общие зависимости
      работают одинаково. Типичная схема: при выкатке рядом с оболочкой кладут конфиг окружения — например,
      скрипт, который заполняет `window.env` адресами remote, — а оболочка при старте регистрирует их через
      рантайм. Тогда один и тот же бандл работает на всех стендах.

      ## Экземпляр рантайма

      Если приложение собрано с плагином федерации, экземпляр рантайма создаёт плагин, а функции вроде `loadRemote`
      импортируют из `@module-federation/enhanced/runtime`. Без плагина экземпляр создают сами — рекомендуемый
      способ в Module Federation 2.0:

      ```js
      import { createInstance } from '@module-federation/enhanced/runtime';

      const mf = createInstance({
        name: 'shell',
        remotes: [{ name: 'catalog', entry: window.env.catalogEntry }],
      });
      const { default: CatalogPage } = await mf.loadRemote('catalog/CatalogPage');
      ```

      Без плагина и без экземпляра `loadRemote` упадёт с ошибкой RUNTIME-009 «Please call createInstance first».
      В старых проектах встречается функция `init` со списком remote. Она работает, но документация помечает её
      «Use with caution»: `init` ищет уже созданный экземпляр с тем же именем и переиспользует его, а для
      отдельного экземпляра советует `createInstance`.

      **Общие библиотеки без плагина** экземпляр получает в поле `shared`. Хост отдаёт уже загруженную копию:

      ```js
      shared: {
        react: {
          version: '18.3.1',
          lib: () => React,
          shareConfig: { singleton: true, requiredVersion: '^18.3.0' },
        },
      },
      ```

      `version` говорит, какую версию хост даёт, `lib` возвращает уже загруженный объект библиотеки — ничего
      не скачивается и не собирается, — а `shareConfig` задаёт правила singleton и требуемой версии. Remote
      с singleton React получат именно этот экземпляр. Вместо `lib` можно указать `get` — асинхронную функцию,
      которая возвращает фабрику модуля.

      ## Регистрация и загрузка

      - **`registerRemotes([...])`** добавляет remote после старта. Регистрация только запоминает имя и адрес —
        модули грузятся позже, при `loadRemote`. Уже зарегистрированный remote без флага не перезаписывается,
        а с флагом `{ force: true }` заменяется, и кэш его загруженных модулей очищается. Так, например, строится
        вложенная федерация: модуль, который сам загружен из remote, регистрирует свой remote и пользуется им.
      - **`loadRemote('catalog/CatalogPage')`** загружает модуль и возвращает его объект с экспортами.

      `loadRemote` не обязан вернуть модуль с `default`: remote может экспортировать компонент по имени. А `React.lazy`
      ждёт промис модуля с компонентом именно в `default`, и без него падает с невнятной ошибкой. Поэтому обёртку
      делают с проверкой:

      ```js
      const CatalogPage = lazy(async () => {
        const module = await loadRemote('catalog/CatalogPage');
        if (!module || !('default' in module)) {
          throw new Error('catalog/CatalogPage must be export default');
        }
        return module;
      });
      ```

      Своё сообщение сразу говорит, что не так с экспортом, а брошенная ошибка уходит в ближайшую границу ошибок.
      Если компонент экспортирован по имени, его оборачивают: `.then((m) => ({ default: m.CatalogPage }))`.

      ## Предзагрузка

      **`preloadRemote`** скачивает файлы модулей заранее, **не выполняя** их код и ничего не рисуя. Например,
      при наведении на ссылку «Каталог»: когда человек нажмёт, файлы уже будут в кэше браузера. Файлы модуля
      рантайм знает из манифеста (о нём следующий раздел). Если remote подключён прямым адресом `remoteEntry.js`,
      без манифеста, `preloadRemote` заранее скачает только сам вход, а чанки модуля всё равно пойдут после клика.

      Можно указать конкретные модули из `exposes`, категорию ресурсов (`sync` — только код, нужный модулю сразу,
      по умолчанию, или `all` — все его файлы) и фильтр адресов. `loadRemote` работает и без предзагрузки: это
      только способ сократить ожидание при первом показе.

      ## Манифест вместо remoteEntry.js

      **`mf-manifest.json`** — JSON с описанием remote: какие модули он отдаёт, какие библиотеки делит, какие
      файлы для этого нужны. В отличие от `remoteEntry.js`, по манифесту рантайм знает всё это, **не выполняя** код
      remote: может заранее подгрузить нужные файлы, а инструменты разработчика — показать подсказки типов.
      `exposes` по-прежнему задают в конфиге remote — манифест их только описывает, — а общие зависимости работают
      так же. Если по адресу манифеста пришёл не тот JSON — например, его переписал шлюз или пришла страница
      ошибки, — будет ошибка RUNTIME-013.

      ## Типы для модулей remote

      В хосте на TypeScript строка `import('catalog/CatalogPage')` даст ошибку компилятора «модуль не найден»:
      компилятор ничего не знает о модуле, пока о нём не сказали. Есть три пути:
      - **объявление модуля** — `declare module 'catalog/*' { const Component: React.ComponentType<any>; export default Component; }`.
        Ошибка уйдёт, но пропсы станут `any`, и компилятор больше не помощник;
      - **опция `dts`** в Module Federation 2.0 — remote при сборке генерирует типы своих модулей в архив
        `@mf-types.zip`, а хост подтягивает их при своей сборке и в режиме разработки. Типы соответствуют той
        версии remote, которая была опубликована на момент сборки хоста. Выкатка remote сборку хоста
        не запускает, поэтому от поломки у людей типы не защищают: они помогают хосту, когда он сам переходит
        на новую версию;
      - **общий npm-пакет с типами контрактов** или контрактные тесты (урок «Выкатка, скорость и тесты»).

      Строгий режим `tsconfig` знаний о модулях remote компилятору не даст, а проверять пропсы в рантайме
      федерация не умеет.

      ## Подмена remote для отладки

      Разработчик правит каталог локально и хочет увидеть его в окружении всех остальных частей со стенда.
      Пересобирать оболочку и выкатывать её на стенд нельзя — это сломает стенд для всех. Вместо этого адрес одного
      remote подменяют на `localhost` прямо в браузере:
      - `registerRemotes` с `force` и локальным адресом;
      - хук `beforeRequest` в плагине рантайма, который меняет адрес по флагу в localStorage (о плагинах — урок
        «Ошибки и безопасность»);
      - расширение Module Federation для Chrome, которое делает это из панели разработчика.

      Локальный сервер remote при этом должен отдавать CORS-заголовки, если вход — ES-модуль или подключается
      через манифест: такие загрузки с другого источника браузер без заголовков блокирует.

      ## Пример целиком: одна сборка оболочки на три стенда

      1. **Конфиг окружения.** Раньше адреса стояли в конфиге сборки оболочки (урок «Хост, remote и контейнер»).
         Теперь при выкатке рядом с оболочкой кладут `env.js` со своими адресами для каждого стенда, и каталог
         подключается через манифест:
         `window.env = { catalogEntry: 'https://cdn.shop.example/catalog/mf-manifest.json', … }`.
         Манифест оболочка загружает через `fetch` с другого источника, поэтому CDN каталога отдаёт его
         с заголовком `Access-Control-Allow-Origin: https://shop.example` и без долгого кэша.
      2. **Старт.** Оболочка регистрирует remote из `window.env` через `registerRemotes`. Бандл на всех стендах
         один и тот же, проверенный.
      3. **Экран каталога** подключается через `lazy` с проверкой `default`, как в коде выше.
      4. **Наведение на «Каталог»** вызывает `preloadRemote` для `./CatalogPage`: каталог подключён через манифест,
         поэтому его файлы уже в кэше к моменту клика. Корзина пока подключена прямым адресом входа, и для неё
         предзагрузка скачала бы только вход.
      5. **Типы.** Каталог и корзина собираются с `dts`, и оболочка получает их типы при своей сборке. Когда
         «Платформа» переводила оболочку на новый экран корзины, компилятор сразу показал, какой проп переименован.
         А чтобы переименование не дошло до людей раньше, его ловит контрактный тест в сборке корзины (урок
         «Выкатка, скорость и тесты»).
      6. **Отладка.** Разработчик каталога ставит в localStorage флаг, хук `beforeRequest` подменяет адрес каталога
         на `http://localhost:3001/mf-manifest.json`, и разработчик видит свою сборку внутри тестового стенда.

      ## Варианты и их цена

      - **Статические remote в конфиге сборки**
        - Подходит: один стенд или адреса не меняются.
        - Цена: смена адреса — пересборка хоста.
      - **Динамические remote через рантайм**
        - Подходит: несколько стендов, адреса из конфига окружения, подмена для отладки.
        - Цена: больше кода при старте; ошибка в конфиге видна только в рантайме.
      - **Вход `remoteEntry.js`**
        - Подходит: простая загрузка без метаданных.
        - Цена: чтобы что-то узнать о remote, нужно выполнить его вход.
      - **Манифест `mf-manifest.json`**
        - Подходит: предзагрузка, подсказки типов, инструменты.
        - Цена: ещё один файл, который должен приходить свежим и неизменным.

      ## Типичные ошибки

      - **Адреса remote в конфиге сборки при нескольких стендах.** Свой бандл на каждый стенд.
      - **`loadRemote` без экземпляра рантайма** в приложении без плагина — RUNTIME-009.
      - **Ждать, что `registerRemotes` без `force` заменит адрес.** Не заменит.
      - **Отдавать `React.lazy` модуль без `default`.** Невнятная ошибка вместо понятной.
      - **`declare module` с `any` навсегда.** Ошибки пропсов уходят к людям.
      - **Подмена адреса пересборкой хоста на общем стенде.** Ломает стенд всем.

      ## Как спрашивают на интервью

      - «Как не пересобирать хост под каждый стенд?» — ждут динамические remote и конфиг окружения.
      - «Как получить типы модулей remote в хосте?» — ждут `dts` или общий пакет типов.
      - «Как проверить локальную сборку remote на стенде?» — ждут подмену адреса в рантайме.

      ## Коротко

      - Статические remote задают адрес в конфиге сборки, динамические — во время работы, поэтому с динамическими
        один бандл хоста работает на всех стендах.
      - Без плагина сборки экземпляр рантайма создают через `createInstance`, а общие библиотеки передают полем
        `shared` с `lib` — уже загруженной копией.
      - `registerRemotes` только запоминает адрес; без `force` не перезаписывает зарегистрированный remote, а с ним
        заменяет и очищает кэш его модулей.
      - `React.lazy` ждёт компонент в `default`, поэтому результат `loadRemote` проверяют или оборачивают.
      - `preloadRemote` скачивает файлы модулей заранее, не выполняя их.
      - Манифест описывает remote без выполнения его кода, что даёт предзагрузку и подсказки типов.
      - Типы модулей remote даёт опция `dts` или общий пакет — по версии remote на момент сборки хоста;
        `declare module` с `any` только глушит компилятор.

      ## Источники

      - [Runtime API — Module Federation](https://module-federation.io/guide/runtime/runtime-api)
      - [dts — Module Federation](https://module-federation.io/configure/dts)
      - [Remotes — Module Federation](https://module-federation.io/configure/remotes)

  - id: mfl-mf-bundlers
    topic: Module Federation
    title: Сборщики
    questions: [mf-011, mf-040, mf-041, mf-042, mf-043]
    body: |
      ## Какую проблему решаем

      Команда «Корзина и заказ» переводит своё приложение с webpack на Vite: сборка в разработке стала занимать
      секунды вместо минуты. Оболочка и каталог остаются на webpack. После переезда корзина перестала загружаться
      в оболочке с ошибкой «Failed to get remoteEntry exports», а когда это починили, чанки корзины стали
      запрашиваться с домена магазина и получать 404.

      Федерация обещает, что хост на одном сборщике может подключать remote, собранный другим. Обещание держится,
      если знать, чем сборщики отличаются: форматом входа, тем, как remote находит свои чанки, и тем, какой плагин
      стоит в проекте. Урок об этом.

      ## Где есть Module Federation

      - **webpack 5** — там она появилась: встроенный `ModuleFederationPlugin`. В webpack 4 встроенного плагина нет,
        поэтому нет её и в Create React App 4, который работает на webpack 4.
      - **Rspack** — сборщик на Rust, совместимый с webpack; поддержка встроена.
      - **Vite** — через плагин. Официальный — `@module-federation/vite`; раньше пользовались сторонним
        `@originjs/vite-plugin-federation`.

      Для webpack и Rspack проект Module Federation 2.0 даёт ещё плагин в пакете `@module-federation/enhanced` —
      с рантаймом 2.0, манифестом и типами. Общий рантайм у всех плагинов 2.0 — то, что позволяет хосту на одном
      сборщике подключать remote, собранный другим.

      ## Два плагина для Vite

      `@module-federation/vite` и `@originjs/vite-plugin-federation` — разные проекты, а не один пакет под двумя
      именами:
      - **`@module-federation/vite`** — официальный плагин на рантайме 2.0. Он поддерживает то же, что плагины 2.0
        для других сборщиков: манифест, типы (`dts`), плагины рантайма — и годится для продакшен-сборок. Хост
        на webpack может подключать remote на Vite и наоборот.
      - **`@originjs/vite-plugin-federation`** — старый сторонний плагин со своей реализацией, который плохо работал
        вместе с remote на webpack.

      ## Формат входа: type: 'module' и 'var'

      Вход remote бывает в двух форматах:
      - **глобальная переменная** (`type: 'var'`) — классический webpack: скрипт кладёт контейнер в глобальную
        переменную с именем `name`;
      - **ES-модуль** (`type: 'module'`) — так собирает вход Vite: контейнер экспортируется из модуля.

      Тип в списке remote хоста говорит рантайму, как загрузить вход: обычным тегом script или как модуль. Это не
      важность remote и не способ экспорта его модулей. Если загрузить вход-модуль как обычный скрипт, рантайм
      не найдёт экспортов и бросит RUNTIME-001 «Failed to get remoteEntry exports» — документация в этом случае
      советует указать `type: 'module'`. Значение `var` не устарело: по нему грузятся классические входы webpack.
      Смешанные системы типичны как раз при переезде: часть remote уже на Vite, часть ещё на webpack.

      ## Откуда remote грузит свои чанки

      Вход remote лежит на его CDN, а чанки модулей он загружает относительно своего **`publicPath`** — базового
      адреса для своих файлов. Если `publicPath` равен `/`, браузер запросит чанки с текущего домена, то есть
      с домена хоста, и получит 404.

      Решение — чтобы remote искал чанки рядом со своим входом:
      - в webpack — `publicPath: 'auto'`: путь вычисляется по адресу загруженного скрипта входа;
      - в Vite — относительный `base` (например, `'./'`) или полный адрес CDN.

      Копировать чанки remote на сервер хоста — тоже «работает», но тогда каждая выкатка remote требует выкатки
      хоста, и независимость пропадает. Настройки `eager` и `shared` к адресам чанков отношения не имеют.

      ## Динамические адреса до рантайма 2.0

      Сейчас адрес remote из конфига окружения передают рантайму при регистрации (урок «Рантайм и типы»). До
      рантайма 2.0 на webpack делали так:
      - **promise-based remotes** — в `remotes` вместо адреса пишут строку `promise new Promise(...)`: промис сам
        вставляет скрипт входа по адресу из окружения и отдаёт контейнер. Способ описан в документации webpack;
      - **плагин `external-remotes-plugin`** — подставляет значение глобальной переменной в адрес во время работы:
        `remote@[window.remoteUrl]/remoteEntry.js`;
      - **Dynamic Remote Containers** из документации webpack — вручную вставить тег script со входом, вызвать
        `__webpack_init_sharing__`, затем `container.init` и `container.get`.

      Подставить адрес через `process.env` нельзя: значения из него вшиваются при сборке, и для смены адреса нужна
      пересборка. Эти способы стоит узнавать в старых проектах, а в новых брать рантайм.

      ## Пример целиком: корзина переезжает на Vite

      1. **Плагин.** «Корзина и заказ» ставит `@module-federation/vite`, а не старый сторонний плагин: оболочка
         на webpack с `@module-federation/enhanced`, и обоим нужен общий рантайм 2.0.
      2. **Первая ошибка.** Каталог оболочка подключает через манифест, где формат входа уже записан, а корзину —
         прямым адресом её `remoteEntry.js`. Новый вход корзины оболочка грузит как обычный скрипт и падает
         с RUNTIME-001. В описании remote корзины в оболочке появляется `type: 'module'`.
      3. **Вторая ошибка.** Чанки корзины запрашиваются с `https://shop.example/assets/…` и получают 404. В конфиге
         Vite корзины ставят `base: 'https://cdn.shop.example/checkout/'` — теперь чанки грузятся с CDN корзины.
      4. **CORS.** Вход-модуль и его чанки грузятся с другого источника, поэтому CDN корзины отдаёт
         `Access-Control-Allow-Origin: https://shop.example`: модули с чужого источника браузер без этого заголовка
         заблокирует.
      5. **Манифест.** После переезда корзину тоже подключили через манифест, который строит `@module-federation/vite`
         (опция `manifest: true`): формат входа записан в нём, и строка `type: 'module'` в оболочке стала не нужна.
         Заодно заработала предзагрузка файлов корзины (урок «Рантайм и типы»).
      6. **Результат.** Корзина выкатывается с Vite, а оболочка на webpack о переезде узнала только по смене адреса
         корзины в конфиге окружения.

      ## Варианты и их цена

      - **webpack 5 со встроенным плагином**
        - Подходит: старые проекты, где уже всё настроено.
        - Цена: нет рантайма 2.0 — манифеста, типов, плагинов рантайма.
      - **webpack или Rspack с `@module-federation/enhanced`**
        - Подходит: новые проекты на webpack-совместимом сборщике.
        - Цена: ещё одна зависимость и её версии.
      - **Vite с `@module-federation/vite`**
        - Подходит: быстрая разработка, смешанные системы с webpack.
        - Цена: вход — ES-модуль: `type: 'module'` и CORS при загрузке с другого источника.

      ## Типичные ошибки

      - **Грузить вход-модуль Vite как обычный скрипт.** RUNTIME-001.
      - **`publicPath: '/'` у remote на своём CDN.** Чанки ищутся на домене хоста.
      - **Копировать чанки remote к хосту.** Выкатки снова связаны.
      - **Брать старый сторонний плагин для Vite** в системе с remote на webpack.
      - **Подставлять адрес remote через `process.env`.** Он вшивается при сборке.

      ## Как спрашивают на интервью

      - «Можно ли подключить remote на Vite к хосту на webpack?» — ждут общий рантайм 2.0 и `type: 'module'`.
      - «Почему чанки remote грузятся с домена хоста?» — ждут `publicPath: 'auto'` или `base` в Vite.
      - «Как раньше задавали адрес remote без пересборки?» — ждут promise-based remotes и подстановку глобальной
        переменной.

      ## Коротко

      - Module Federation встроена в webpack 5 и Rspack, а для Vite есть официальный плагин `@module-federation/vite`;
        в webpack 4 и CRA 4 её нет.
      - Общий рантайм 2.0 позволяет хосту на одном сборщике подключать remote на другом; старый сторонний плагин
        для Vite с webpack-remote работал плохо.
      - Тип входа говорит рантайму, как его загрузить: `var` — глобальная переменная классического webpack,
        `module` — ES-модуль Vite; вход-модуль, загруженный как скрипт, даёт RUNTIME-001.
      - Remote грузит чанки относительно своего `publicPath`, поэтому ему нужен `publicPath: 'auto'` в webpack
        или относительный либо полный `base` в Vite, иначе чанки ищутся на домене хоста.
      - До рантайма 2.0 адрес remote брали из окружения через promise-based remotes или плагин подстановки;
        `process.env` для этого не годится, потому что вшивается при сборке.

      ## Источники

      - [Vite — Module Federation](https://module-federation.io/integrations/build-tool/vite.html)
      - [ModuleFederationPlugin — webpack](https://webpack.js.org/plugins/module-federation-plugin)
      - [Module Federation: Dynamic Remote Containers — webpack](https://webpack.js.org/concepts/module-federation/#dynamic-remote-containers)

  - id: mfl-mf-errors
    topic: Module Federation
    title: Ошибки и безопасность
    questions: [mf-044, mf-045, mf-035, mf-046, mf-047, mf-065]
    body: |
      ## Какую проблему решаем

      В субботу утром CDN каталога отвечает ошибками. Каталог недоступен — это неприятно, но терпимо: корзина,
      оформление и личный кабинет могли бы работать. Вместо этого у всех белый экран: экран каталога подключён через
      `React.lazy` и обёрнут только в `Suspense`, и его ошибка размонтировала всё приложение. А в понедельник
      служба безопасности спрашивает, что будет, если кто-то подменит файл на CDN каталога.

      Remote загружаются по сети, принадлежат другим командам и выкатываются без ведома хоста. Значит, сбой
      remote — обычная ситуация, к которой хост готовится заранее, а код remote — чужой код в своей странице. Урок
      о слоях защиты от сбоев, о типичных ошибках загрузки и о том, чем рискует хост.

      ## Suspense ждёт, граница ошибок ловит

      `React.lazy` возвращает компонент, который при первом рендере запускает загрузку модуля. Пока промис ждёт,
      ближайший **`Suspense`** показывает запасной вид — спиннер. Если промис **отклонился** — сервер remote
      недоступен, — `Suspense` эту ошибку не ловит: она поднимается вверх по дереву. Ловит её только **граница
      ошибок** (error boundary) — компонент, который перехватывает ошибки при отрисовке своих потомков и показывает
      запасной вид. Если границы нет, ошибка доходит до корня, и React размонтирует всё приложение. Рантайм федерации
      сам заглушку не покажет — разве что вы настроили это в его хуке.

      Поэтому каждый remote оборачивают и в `Suspense`, и в свою границу ошибок. Тогда упавший микрофронтенд ломает
      только свой кусок страницы.

      ## Плагины рантайма

      **Плагины рантайма** Module Federation 2.0 перехватывают этапы загрузки remote прямо в браузере. Это не плагины
      сборщика и не генерация типов: они работают во время работы приложения и могут не только наблюдать, но и менять
      результат — подменить адрес, вернуть запасной модуль. Хуки плагина — например:
      - `beforeRequest` — перед загрузкой remote: можно подменить адрес, скажем на локальный для отладки;
      - `createScript` — создание тега script для входа: можно поставить `crossorigin`;
      - `errorLoadRemote` — загрузка не удалась: можно вернуть запасной компонент или модуль.

      Готовые плагины тоже есть, например `@module-federation/retry-plugin` повторяет неудавшиеся запросы.

      **`errorLoadRemote`** получает этап, на котором случилась ошибка:
      - `onLoad` — не загрузился модуль;
      - `afterResolve` — не загрузился манифест;
      - `beforeLoadShare` — не загрузился вход remote при старте со стратегией `version-first`, когда рантайм
        собирает версии общих библиотек (урок «Версии и асинхронная граница»).

      Плагин — функция, которая возвращает объект с именем и хуками. Оболочка подключает его опцией
      `runtimePlugins` в конфиге плагина сборки или полем `plugins` у `createInstance`:

      ```ts
      // src/mf-fallback-plugin.ts
      export default function fallbackPlugin() {
        return {
          name: 'shop-fallback',
          errorLoadRemote(args) {
            reportError(args.error, { remote: args.id, stage: args.lifecycle });
            if (args.lifecycle === 'onLoad') {
              // модуль не загрузился — вместо него запасной компонент
              return () => ({ __esModule: true, default: RemoteUnavailable });
            }
            if (args.lifecycle === 'beforeLoadShare') {
              // вход не загрузился при старте — контейнер-заглушка, чтобы старт продолжился
              return { init: () => Promise.resolve(), get: () => () => Promise.resolve(() => null) };
            }
          },
        };
      }
      ```

      ```js
      // webpack.config.js оболочки
      new ModuleFederationPlugin({
        name: 'shell',
        runtimePlugins: [require.resolve('./src/mf-fallback-plugin.ts')],
        // …
      });
      ```

      Если на этапе `onLoad` хук вернул запасной модуль, `lazy` получит его как обычный, и граница ошибок
      не сработает: запасной вид показывает сам плагин. Если хук ничего не вернул, ошибка уходит дальше, в границу
      ошибок.

      Слои защиты складываются: сеть — повторы через retry-plugin; загрузка — `errorLoadRemote`; отрисовка — граница
      ошибок. Задержка через `setTimeout`, `strictVersion` или `eager` ошибку загрузки не обрабатывают.

      ## Ошибки загрузки входа

      Две самые частые ошибки — RUNTIME-001 «Failed to get remoteEntry exports» и RUNTIME-008 «Failed to load script
      resources». Причины:
      - **неверный адрес или 404** у входа — самое частое: проверить адрес и что файл действительно выложен;
      - **вход — ES-модуль с другого источника без CORS-заголовков.** Обычному тегу script CORS не нужен,
        а модуль с чужого источника браузер без заголовков заблокирует;
      - **вход — ES-модуль, а загружают его как обычный скрипт** — нужен `type: 'module'` (урок «Сборщики»).

      Число общих библиотек и язык, на котором написан remote, тут ни при чём: в браузер приходит собранный
      JavaScript. У RUNTIME-008 два вида, и лечатся они по-разному:
      - **ошибка сети** — 404, тайм-аут, CORS: помогают повторы;
      - **ошибка выполнения** — файл скачался, но упал при запуске, например из-за синтаксиса, которого браузер
        не поддерживает: повторы не помогут.

      ## Конфликт глобального имени

      Классический вход кладёт контейнер в глобальную переменную с именем `name`, и перед этим рантайм проверяет,
      не занято ли имя. А у браузера есть старая особенность: элементы с атрибутом `id` доступны как свойства
      `window`. Если remote называется `remote`, а на странице хоста есть `<div id="remote">`, то `window.remote`
      указывает на этот div. Рантайм принимает его за контейнер, ищет у него `init` и падает с ошибкой RUNTIME-002
      «The remote entry interface does not contain "init"».

      То же бывает, если имя занял чужой скрипт. Документация советует проверить `window[remoteEntryKey]`
      и переименовать контейнер. А если два remote случайно назвать одинаково, второй может получить контейнер
      первого. Отсюда правило: имена контейнеров уникальные и непохожие на обычные слова — `shop_catalog`, а не
      `remote` или `app`.

      ## Чем рискует хост

      Код remote выполняется **прямо на странице хоста, с её правами**. Песочницы нет: ему доступны DOM, cookie без
      `HttpOnly`, токены в localStorage, запросы от имени пользователя. Подмена файла на CDN remote — это подмена
      кода хоста. Фреймворк remote здесь неважен, важно, чей код и откуда он загружается. Это главное отличие
      от iframe с другого источника, где чужой код изолирован (урок «iframe»).

      Что делают:
      - подключают remote только из доверенных источников под своим контролем;
      - ограничивают источники скриптов через Content Security Policy (`script-src`);
      - не хранят чувствительное там, куда дотянется любой скрипт страницы: токены — в cookie с `HttpOnly`;
      - чужой, недоверенный код встраивают через iframe, а не через федерацию.

      ## Пример целиком: каталог упал в субботу

      Оболочка магазина после субботы устроена так:
      1. **Отрисовка.** Каждый экран из remote обёрнут в свою границу ошибок и `Suspense`. Если каталог не загрузился,
         на его месте — «Каталог временно недоступен» и кнопка «Повторить», а шапка, корзина и кабинет работают.
      2. **Тайм-аут.** Оболочка ждёт загрузку remote не дольше 5 секунд, потом показывает тот же запасной вид —
         тот же приём, что для окна чата в курсе «Системный дизайн: большие приложения», урок «Контракты между
         командами»:
         ```js
         // withTimeout — своя обёртка: отклоняет промис, если он не успел за 5 секунд
         const CatalogPage = lazy(() => withTimeout(loadRemote('catalog/CatalogPage'), 5000));
         ```
      3. **Сеть.** retry-plugin повторяет неудачные запросы входа и чанков.
      4. **Старт.** Каталог подключён через манифест, поэтому первым срабатывает этап `afterResolve`: не загрузился
         манифест. Плагин только пишет ошибку в отчёт, и на старте она приходит ещё раз — как `beforeLoadShare`. Тут
         плагин возвращает контейнер-заглушку, и недоступный каталог не срывает старт оболочки. При переходе
         в каталог настоящего модуля нет, и человек видит запасной вид. Каждую ошибку плагин пишет в отчёт
         с пометкой «remote: catalog, команда: Каталог».
      5. **Имена.** Контейнеры переименованы в `shop_catalog` и `shop_checkout` после того, как вёрстка добавила
         на страницу блок `<div id="catalog">`: вход каталога классический, и `window.catalog` указал на этот div.
         Корзину на Vite с входом-модулем это не задело, но её переименовали заодно, по общему правилу. Имена,
         под которыми оболочка пишет импорты, остались прежними — `catalog/CatalogPage` не поменялся.
      6. **Безопасность.** Remote грузятся только с `cdn.shop.example`, и Content Security Policy пускает скрипты
         только оттуда. Форма оплаты провайдера — во фрейме, не через федерацию.

      ## Варианты и их цена

      - **Граница ошибок вокруг каждого remote**
        - Подходит: всегда.
        - Цена: нужен осмысленный запасной вид для каждого места.
      - **`errorLoadRemote` в плагине рантайма**
        - Подходит: общая обработка загрузки для всех remote, запасные модули, старт при `version-first`.
        - Цена: логика загрузки уходит из компонентов в плагин — её надо знать при отладке.
      - **Повторы через retry-plugin**
        - Подходит: кратковременные сетевые сбои.
        - Цена: дольше ждать при настоящем отказе; ошибки выполнения повторы не лечат.

      ## Типичные ошибки

      - **Только `Suspense` без границы ошибок.** Недоступный remote роняет всё приложение.
      - **Ждать, что рантайм сам покажет заглушку.** Только если вы это настроили.
      - **Повторять загрузку при ошибке выполнения.** Файл упадёт снова.
      - **Короткие «обычные» имена контейнеров.** Конфликт с `id` элементов и чужими глобальными переменными.
      - **Подключать remote с чужого CDN, которому вы не доверяете.** Его код получает права вашей страницы.

      ## Как спрашивают на интервью

      - «Что будет, если remote недоступен?» — ждут границу ошибок, `Suspense` для ожидания и обработку на уровне
        рантайма.
      - «Как защититься от сбоев загрузки в Module Federation?» — ждут слои: повторы, `errorLoadRemote`, граница
        ошибок.
      - «Чем опасен remote с чужого CDN?» — ждут выполнение с правами страницы и сравнение с iframe.

      ## Коротко

      - `Suspense` показывает запасной вид, пока модуль грузится, но ошибки загрузки не ловит; без границы ошибок
        недоступный remote размонтирует всё приложение.
      - Плагины рантайма перехватывают этапы загрузки в браузере и могут менять результат: `beforeRequest` подменяет
        адрес, `errorLoadRemote` возвращает запасной модуль.
      - Слои защиты складываются: повторы для сетевых сбоев, `errorLoadRemote` для загрузки, граница ошибок для
        отрисовки.
      - Ошибки загрузки входа чаще всего — неверный адрес, ES-модуль без CORS или вход-модуль, загруженный как
        скрипт; ошибки сети лечат повторами, ошибки выполнения — нет.
      - Классический вход кладёт контейнер в глобальную переменную, поэтому `id` элемента или чужой скрипт с тем же
        именем ломают загрузку; имена контейнеров делают уникальными.
      - Код remote работает с правами страницы хоста, поэтому remote подключают только из доверенных источников,
        а чужой код встраивают через iframe.

      ## Источники

      - [Runtime troubleshooting — Module Federation](https://module-federation.io/guide/troubleshooting/runtime)
      - [Error handling for loading remotes — Module Federation](https://module-federation.io/blog/error-load-remote)
      - [Runtime plugins — Module Federation](https://module-federation.io/guide/runtime/runtime-plugins)

  - id: mfl-integration
    topic: Общие задачи
    title: Адрес, общение и стили
    questions: [mf-048, mf-087, mf-049, mf-089, mf-050, mf-088, mf-051, mf-052, mf-066]
    body: |
      ## Какую проблему решаем

      Части магазина загружаются и не падают — уже хорошо. Но на одной странице им приходится делить общее. Кто
      меняет адресную строку, когда человек фильтрует каталог, и почему кнопка «Назад» вдруг уводит со страницы?
      Как маленькая корзина в шапке узнаёт, что в каталоге нажали «В корзину»? Почему после подключения корзины
      у всего магазина поменялся шрифт? И почему экран корзины на долю секунды показывается без стилей?

      Это вопросы не одного способа встраивания, а любой системы из частей. Урок о четырёх общих вещах: адресе,
      общении между частями, входе пользователя и стилях.

      ## Кто владеет адресом

      Адресная строка одна на страницу, и владелец у неё должен быть один — **оболочка**. Она решает, какая часть
      живёт на каком пути, и передаёт части **базовый путь**: каталогу — `/catalog`. Внутри него часть сама управляет
      своими экранами: `/catalog/phones`, `/catalog/phones?brand=…`. Часть не знает, где её встроили, и работает
      относительно базового пути, поэтому её можно переселить на другой путь, не меняя её код.

      Что ломается, если владельцев несколько:
      - **каждая часть со своим `BrowserRouter` на весь адрес** — несколько роутеров слушают одну историю браузера
        и мешают друг другу;
      - **владелец зависит от порядка загрузки** — кто последним загрузился, тот и управляет адресом;
      - **ссылка `<a href>` на другую часть** внутри одной оболочки перезагружает всю страницу: переходить нужно
        через навигацию оболочки — общий роутер или функцию `navigate`, которую оболочка передала части.

      Если роутер общий singleton (урок «Общие зависимости»), часть не создаёт свой роутер, а рисует маршруты внутри
      роутера оболочки. Своего `BrowserRouter` внутри чужого быть не может: React Router прямо запрещает роутер
      внутри другого роутера и бросает ошибку «You cannot render a `<Router>` inside another `<Router>`».

      **Виджет внутри чужой страницы.** Если часть встраивается не на свой путь, а виджетом внутрь страницы другой
      части, у которой свой роутер, виджету дают `MemoryRouter`: его навигация живёт в памяти и адрес не трогает.
      Цена — состоянием виджета нельзя поделиться ссылкой, и кнопка «Назад» его не переключает. Для виджета внутри
      чужой страницы это обычно приемлемо. `HashRouter` не спасает: хеш — тоже часть адреса.

      ## Как части общаются

      Кэм Джексон советует частям общаться как можно меньше, а там, где нужно, — сообщениями и событиями, а не общим
      состоянием. Способы, которые сохраняют независимость:
      - **пропсы и колбэки от оболочки** — самая слабая связь. Правило: значения — пропсами, действия — колбэками.
        Оболочка открывает свою панель, а часть только вызывает переданную функцию `openPanel(id)`;
      - **события на `window`** — `CustomEvent` для уведомлений между частями, которые друг о друге не знают;
      - **параметры адреса** — состояние, которое видно всем, переживает перезагрузку и попадает в ссылку.

      **Один общий стор**, в который пишут все, работает, но каждая часть начинает зависеть от формы чужого
      состояния и от версии библиотеки — независимость пропадает незаметно. А **прямой импорт внутренностей**
      друг друга в обход контракта федерация и не позволит: снаружи доступно только то, что отдано через `exposes`.

      **Событие — тоже контракт.** Имя события и формат `detail` описывают и меняют обратно совместимо:
      - **добавить новое поле** в `detail` можно — старые слушатели его просто не читают;
      - **переименовать событие или поле**, поменять тип значения — ломающее изменение: такое выпускают новым
        событием рядом со старым и убирают старое, когда его никто не слушает.

      У событий есть ещё одна особенность: они не хранятся. Если слушатель появился позже события, он его
      не получит. Поэтому часть при монтировании сначала берёт текущее состояние — из API или от оболочки, — а
      события лишь обновляют его.

      ## Ловушка общего контекста: react-redux

      Обычно у каждой копии библиотеки свой объект контекста, и провайдер одной копии не перекрывает другую.
      Но `react-redux` с версии 8.1 специально хранит контекст в `globalThis` — по ключу
      `Symbol.for('react-redux-context')`, отдельно для каждого экземпляра React, — чтобы копии библиотеки его
      делили. Если React общий, общий и контекст, даже когда `react-redux` каждый привёз свой.

      Отсюда тихая ошибка. Оболочка передаёт в remote свой компонент с `useSelector`, а remote рисует его внутри своего
      `Provider`. Ближайший провайдер — у remote, и компонент оболочки молча читает **чужой** стор, без единой ошибки.
      Защита — обернуть компонент в `Provider` со своим стором перед тем, как отдавать: тогда ближайшим окажется свой
      провайдер.

      ## Вход и сессия

      Пользователь входит один раз, и сессией владеет оболочка. Если части на одном домене, удобнее всего cookie
      сессии с `HttpOnly`: браузер сам прикладывает её к запросам частей в `/api`, а скрипты — ни свои, ни чужие —
      её не прочитают. Данные о пользователе — имя, язык — части получают от оболочки пропсами.

      Если API на другом домене и нужен токен, оболочка передаёт частям **функцию** `getToken()`, которая всегда
      отдаёт свежий токен. Копия токена, сохранённая частью при монтировании, протухнет после обновления. А если
      каждая часть входит сама, человек увидит несколько входов, и выход из одной части не выведет из остальных.

      ## Стили

      Все части живут в одном документе, и любое глобальное правило задевает всех. Способы изоляции:
      - **CSS Modules или префиксы классов** — у каждой части уникальные имена классов, и её правила не задевают
        соседей;
      - **Shadow DOM** для полностью изолированного виджета: стили не проникают внутрь и не выходят наружу. Цена —
        сложности с порталами и с общей темой (урок «Веб-компоненты»).

      Чего делать нельзя:
      - **приносить с частью глобальные стили и сбросы** (reset) — они меняют вид всей страницы;
      - **лечить конфликты через `!important`** — это эскалация, а не изоляция;
      - **ждать, что `shared` поделит CSS** — он делит JavaScript-модули.

      Отдельная беда — **разные версии UI-кита** с глобальными классами у разных частей: на одном экране две разные
      кнопки, и стили одной версии ломают другую. Поэтому дизайн-систему делают общей singleton, а тему задают
      CSS-переменными.

      **Мигание без стилей** (FOUC, flash of unstyled content): экран из remote на мгновение показывается без
      стилей, а потом «встаёт на место». Причина — стили модуля подключаются отдельно и применяются позже разметки:
      CSS вставляется в документ только при выполнении модуля или грузится запросом, которого загрузчик не ждёт.
      В webpack с `mini-css-extract-plugin` загрузка чанка ждёт и его CSS, поэтому там мигания обычно нет; чаще его
      видят с remote на Vite и со стилями, которые вставляет JavaScript. Лечат тем, что модуль показывают только
      после того, как применились его стили: стили лежат в самом модуле (CSS-in-JS) или обёртка ждёт события `load`
      у `<link>` стилей модуля и только потом показывает экран. Предзагрузка файлов модуля через `preloadRemote`
      сокращает это ожидание, но сама показ не задерживает.

      ## Пример целиком: кнопка «В корзину» в каталоге

      1. **Адрес.** Оболочка рендерит каталог на `/catalog/*` и передаёт ему базовый путь. Каталог рисует свои
         маршруты внутри общего роутера, фильтры кладёт в параметры адреса: ссылкой на подборку можно поделиться.
      2. **Действие — у владельца.** Кнопка «В корзину» — модуль `checkout/AddToCartButton` команды корзины.
         Оболочка передаёт её каталогу пропсом-функцией:
         `<CatalogPage renderAddToCart={(id) => <AddToCartButton productId={id} />} />`. Каталог не знает, как
         устроена корзина, — он только показывает чужую кнопку в своей карточке.
      3. **Чужой стор.** У каталога свой Redux со своим `Provider`, у корзины — свой. Кнопка корзины внутри
         каталога прочитала бы стор каталога, поэтому корзина отдаёт кнопку уже обёрнутой в свой `Provider`.
      4. **Уведомление.** После добавления корзина отправляет `cart:changed` с `{ count }` на `window`. Маленькая
         корзина в шапке обновляет число; при монтировании она сначала берёт текущее число из API корзины.
      5. **Вход.** Запросы кнопки к `/api/cart` идут с cookie сессии сами — токен частям не нужен.
      6. **Стили.** У частей CSS Modules, глобальный сброс есть только у оболочки, дизайн-система `@shop/ui` общая.
         Экран корзины на Vite мигал без стилей; теперь обёртка оболочки показывает его после загрузки его стилей,
         а `preloadRemote` при наведении на «Корзину» заранее кладёт файлы в кэш — корзина после переезда подключена
         через манифест (урок «Сборщики»), — и ждать почти не приходится.

      ## Варианты и их цена

      - **Пропсы и колбэки от оболочки**
        - Подходит: оболочка знает обе стороны и может их связать.
        - Цена: оболочка становится посредником для каждой новой связи.
      - **События на `window`**
        - Подходит: уведомления между частями, которые друг о друге не знают.
        - Цена: событие не хранится, формат — контракт без проверки компилятором.
      - **Параметры адреса**
        - Подходит: состояние, которым делятся ссылкой и которое переживает перезагрузку.
        - Цена: только простые значения; адрес — общий ресурс, его нужно делить.
      - **Общий стор**
        - Подходит: почти никогда между независимыми частями.
        - Цена: все зависят от формы состояния и версии библиотеки.

      ## Типичные ошибки

      - **Несколько `BrowserRouter` на одной странице.** Роутеры спорят за адрес.
      - **`<a href>` между частями одной оболочки.** Перезагрузка всей страницы.
      - **Переименовать поле события «по-тихому».** Слушатели других команд сломаются.
      - **Отдавать компонент со `useSelector` в чужое дерево без своего `Provider`.** Он прочитает чужой стор.
      - **Хранить копию токена в части.** Она протухнет.
      - **Глобальные стили и сбросы в части.** Меняется вид всей страницы.

      ## Как спрашивают на интервью

      - «Кто владеет адресом в системе микрофронтендов?» — ждут оболочку и базовый путь для части, `MemoryRouter`
        для виджетов.
      - «Как микрофронтенды обмениваются данными?» — ждут пропсы и колбэки, события, адрес и почему общий стор
        вреден.
      - «Как изолировать стили частей?» — ждут CSS Modules, Shadow DOM и запрет глобальных стилей.

      ## Коротко

      - Адресом владеет оболочка, а часть работает относительно базового пути; несколько роутеров на весь адрес
        мешают друг другу, а виджету внутри чужой страницы дают `MemoryRouter`.
      - С общим роутером singleton часть рисует маршруты внутри роутера оболочки: свой роутер внутри чужого React
        Router запрещает.
      - Части общаются минимально: значения — пропсами, действия — колбэками, уведомления — событиями, общее
        состояние — через адрес; общий стор незаметно связывает части.
      - Событие — контракт: новые поля добавлять можно, а переименование выпускают новым событием; события
        не хранятся, поэтому часть сначала берёт текущее состояние.
      - `react-redux` с версии 8.1 делит контекст между копиями, поэтому компонент, отданный в чужое дерево,
        оборачивают в свой `Provider`.
      - Сессией владеет оболочка: cookie с `HttpOnly` на общем домене или функция `getToken`, а не копии токена.
      - Стили изолируют CSS Modules или Shadow DOM, без глобальных стилей в частях; мигание без стилей лечат тем,
        что показывают модуль после применения его CSS, а предзагрузка только сокращает ожидание.

      ## Источники

      - [Micro Frontends: Cross-application communication — Cam Jackson](https://martinfowler.com/articles/micro-frontends.html)
      - [Load App — Module Federation Bridge](https://module-federation.io/guide/bridge/react/load-app)

  - id: mfl-operations
    topic: Общие задачи
    title: Выкатка, скорость и тесты
    questions: [mf-053, mf-090, mf-094, mf-010, mf-055, mf-054, mf-092, mf-091, mf-059, mf-060, mf-093]
    body: |
      ## Какую проблему решаем

      Магазин живёт на микрофронтендах полгода, и все жалобы теперь про эксплуатацию. Корзину выкатили утром,
      а часть людей до вечера видит старую версию. У тех, кто держал вкладку открытой во время выкатки, экран
      оформления не открывается — чанки отвечают 404. Команда корзины переименовала проп у экрана, и оболочка
      сломалась у людей, хотя все тесты обеих команд были зелёными. Страница каталога стала грузиться дольше, чем
      в монолите. А ошибки каталога приходят в отчёты «Платформы».

      Независимая выкатка — главное, ради чего делают микрофронтенды, и именно в ней больше всего подводных
      камней. Урок о кэше, ломающих изменениях, скорости, наблюдаемости, тестах и о том, как раскладывать код
      по репозиториям.

      ## Кэш и выкатка

      Схема та же, что у обычного одностраничного приложения:
      - **вход** — `remoteEntry.js` или манифест — отдают **без долгого кэша** (`Cache-Control: no-cache`):
        он должен приходить свежим, иначе браузер будет ссылаться на чанки старой сборки;
      - **чанки** — с хешем в имени и **долгим кэшем**: новая сборка — новые имена файлов, и старые закэшированные
        файлы ничему не мешают.

      Отключать кэш у всех файлов remote не нужно: обновления дойдут, но каждый человек будет заново качать всё.
      `shared` кэшированием не управляет — это про библиотеки, а не про файлы.

      **Открытые вкладки.** Вкладка, открытая до выкатки, держит в памяти старый вход, и он ссылается на чанки
      прошлой сборки. Если при выкатке старые чанки удалили, такая вкладка при первом переходе на новый экран
      получит 404. Поэтому старые чанки хранят на CDN ещё несколько дней после выкатки, а на ошибку загрузки чанка
      оболочка может предложить обновить страницу.

      **Откат** при независимой выкатке тоже свой: команда возвращает предыдущую сборку своего remote — например,
      снова отдаёт по адресу входа прошлую версию. Оболочку и остальные части не трогают и общего релиза не ждут.

      ## Ломающие изменения

      **Контракт remote** — имя контейнера, ключи `exposes` и API отданных модулей: пропсы компонентов, сигнатуры
      функций. Внутренний рефакторинг и обновление библиотек, которых нет в `shared`, хосту не видны. А вот такие
      изменения сломают хост в рантайме, хотя его сборка пройдёт:
      - переименовали ключ в `exposes` — хост просит старое имя;
      - поменяли обязательные пропсы — хост передаёт старые;
      - поменяли `name` контейнера — хост ищет его по старому имени.

      Выкатить remote, а хост «обновить в тот же день» не выйдет: между двумя выкатками хост сломан у людей,
      а открытые вкладки ещё дольше. Версия remote в `package.json` хоста ничего не решает — хост от неё
      не зависит, а `strictVersion` относится к общим библиотекам, а не к модулям remote.

      Работает приём **«добавить рядом, перевести, удалить»** (expand and contract): remote выставляет
      `./CheckoutPageV2` рядом со старым `./CheckoutPage`, старый хост работает со старым модулем, новый — с новым,
      а когда хост переехал, старый модуль убирают. Для больших изменений так же публикуют весь remote по новому пути
      с мажорной версией — `/checkout/v2/`. Заметить поломку раньше людей помогают **контрактные тесты** со стороны
      потребителя: хост записывает, какие модули и пропсы он ждёт, а сборка remote проверяет эти ожидания
      до выкатки. Типы из `dts` помогают хосту, когда он переходит на новый модуль, но от выкатки remote не защищают:
      сборка хоста при ней не запускается. Подробно об этих приёмах — курс «Системный дизайн: большие приложения», урок «Контракты
      между командами».

      ## Скорость

      Систему на федерации чаще всего замедляют две вещи:
      - **дубли библиотек** — всё, что не в `shared`, приезжает с каждым remote;
      - **цепочка загрузок** — бандл оболочки → вход remote → чанк модуля → данные экрана, и каждый шаг ждёт
        предыдущего.

      Модуль при этом выполняется один раз, а общие библиотеки по умолчанию грузятся асинхронно, — проблема
      не в этом. Лечение:
      - договориться о списке общих библиотек и их версиях;
      - начинать загрузку заранее: `preloadRemote` при наведении на ссылку; файлы модуля он скачивает, если remote
        подключён через манифест, иначе только вход;
      - запрашивать данные экрана параллельно с его кодом, а не после него;
      - не дробить приложение на слишком мелкие remote: каждый — ещё один шаг цепочки.

      **Бюджет** — например, сколько JavaScript может загрузить страница, у магазина 200 КБ сжатого на каталог, —
      меряют на собранной странице, а не по частям: каждая часть может уложиться в свой бюджет, а страница целиком —
      нет.

      ## Чья это ошибка

      Все ошибки происходят на страницах оболочки, и без пометок они попадают в отчёты её команды. Оболочка знает,
      какой remote она загрузила и по какому адресу, поэтому подписывает каждую ошибку частью, версией и командой —
      и предупреждение о росте ошибок каталога приходит команде «Каталог». Каждая часть выкладывает свои карты
      исходников (source maps), чтобы стек ошибки читался в её коде.

      ## Отдельный запуск и тесты

      **У remote есть своя HTML-страница и точка входа**, хотя его всё равно встраивают в хост. Это нужно, чтобы
      запускать и отлаживать его отдельно, не поднимая всю систему. Для `remoteEntry.js` страница не нужна — вход
      собирается и без неё, — и хост грузит именно вход, а не страницу. Цена отдельного запуска: remote должен уметь
      жить без хоста — иметь свои копии общих библиотек (поэтому `import: false` такому запуску мешает) и заглушки
      для того, что обычно даёт хост: вход, тему, навигацию.

      **Тесты** разные, и каждый ловит своё:
      - **юнит-тесты** каждой части отдельно — поломки внутри части, быстро и без остальной системы;
      - **контрактные тесты** между хостом и remote — расхождения имён модулей и пропсов;
      - **сквозные тесты** собранной системы на стенде — проблемы склейки: версии библиотек, роутинг, стили.

      Ни один не заменяет остальные. Снапшот содержимого `remoteEntry.js` ничего не проверяет — файл меняется
      при каждой сборке, — а настоящие remote в юнит-тестах хоста делают их медленными и нестабильными: это задача
      сквозных тестов, а в юнит-тестах remote заменяют заглушками.

      ## Один репозиторий или много

      Микрофронтенды — про независимую выкатку, а не про то, сколько репозиториев. Оба варианта работают:
      - **монорепозиторий** упрощает общий код, общие инструменты и изменения, задевающие несколько частей сразу.
        Но в нём легко импортировать файл из папки соседа в обход контракта — и сборка это пропустит. Границы
        поэтому проверяет линтер, например правило `enforce-module-boundaries` в Nx или `eslint-plugin-boundaries`,
        а у каждой части свой конвейер сборки и выкатки;
      - **отдельные репозитории** сами держат границы, но инструменты и настройки повторяются, а общий код ходит
        пакетами с версиями.

      ## Пример целиком: корзина меняет экран оформления

      Команда «Корзина и заказ» переделывает экран оформления, и обязательный проп `onPaid` становится
      `onOrderComplete` с другими данными.
      1. **Рядом, а не вместо.** Корзина выставляет `./CheckoutPageV2` и оставляет `./CheckoutPage`. Оболочка
         ничего не замечает.
      2. **Контракт.** В сборке корзины прогоняются ожидания оболочки: «`./CheckoutPage` принимает `onPaid`». Тест
         зелёный — старый модуль на месте.
      3. **Перевод.** «Платформа» переходит на `./CheckoutPageV2` в своём темпе; типы из `dts` подсказывают новый
         проп.
      4. **Уборка.** Через две недели в отчётах нет загрузок `./CheckoutPage`, и корзина его удаляет вместе
         с ожиданием в контрактном тесте.
      5. **Выкатка.** Вход корзины идёт с `no-cache`, чанки — с хешем и кэшем на год, старые чанки живут на CDN ещё
         неделю.
      6. **Сбой.** Новая версия считает доставку неверно — корзина за пять минут возвращает прошлую сборку своего
         входа. Оболочка и каталог об откате не узнают.

      ## Варианты и их цена

      - **Ломающее изменение под новым ключом `exposes`**
        - Подходит: изменился один модуль.
        - Цена: две версии модуля в одной сборке, пока хост не переехал.
      - **Весь remote по новому пути `/v2/`**
        - Подходит: изменилось многое сразу.
        - Цена: две сборки remote живут параллельно.
      - **Монорепозиторий**
        - Подходит: много общего кода и инструментов.
        - Цена: границы держит только линтер и дисциплина.
      - **Отдельные репозитории**
        - Подходит: части почти не делят код.
        - Цена: повторяющиеся инструменты; общий код — пакетами с версиями.

      ## Типичные ошибки

      - **Вход remote с долгим кэшем.** Обновления не доходят.
      - **Удалять старые чанки сразу при выкатке.** Открытые вкладки получают 404.
      - **Ломающее изменение «вместо», а не «рядом».** Хост сломан до своей выкатки.
      - **Мерить бюджет по частям.** Страница целиком в него не влезает.
      - **Ошибки без пометки части.** Предупреждения приходят не той команде.
      - **Импорт из папки соседа в монорепозитории.** Зависимость от внутренностей в обход контракта.

      ## Как спрашивают на интервью

      - «Как выкатить ломающее изменение в remote?» — ждут «добавить рядом, перевести, удалить» и контрактные тесты.
      - «Почему система на федерации медленнее монолита и что делать?» — ждут дубли, цепочку загрузок,
        предзагрузку и общий список библиотек.
      - «Как тестировать микрофронтенды?» — ждут юнит-, контрактные и сквозные тесты и что ловит каждый.

      ## Коротко

      - Вход remote отдают без долгого кэша, чанки — с хешем и долгим кэшем; старые чанки хранят несколько дней,
        потому что открытые вкладки ещё на них ссылаются.
      - Откат при независимой выкатке — возврат прошлой сборки своего remote, без отката остальных.
      - Контракт remote — имя контейнера, ключи `exposes` и API модулей; его поломку сборка хоста не видит, поэтому
        ломающие изменения выпускают рядом со старыми и проверяют контрактными тестами в сборке remote.
      - Систему замедляют дубли библиотек и цепочка загрузок; помогают общий список библиотек, предзагрузка
        и данные параллельно с кодом, а бюджет меряют на собранной странице.
      - Оболочка подписывает ошибки частью, версией и командой, чтобы сбой доходил до владельца.
      - Remote умеет запускаться отдельно со своей страницей; юнит-, контрактные и сквозные тесты ловят разное
        и друг друга не заменяют.
      - Монорепозиторий или много репозиториев — дело удобства: в монорепозитории границы частей держит линтер.

      ## Источники

      - [Micro Frontends: Testing, Downsides — Cam Jackson](https://martinfowler.com/articles/micro-frontends.html)
      - [dts — Module Federation](https://module-federation.io/configure/dts)

questions:
  # ===================== Введение =====================
  - id: mf-067
    topic: Введение
    level: junior
    question: |
      Что в первую очередь дают микрофронтенды по сравнению с одним приложением?
    options:
      - text: 'Каждая команда выпускает и откатывает свою часть, не дожидаясь остальных'
        correct: true
        why: 'Это и есть суть подхода: своя сборка, своя выкатка и свой откат у каждой части.'
      - text: 'Страница скачивает меньше JavaScript, потому что код поделён на небольшие части'
        why: 'Обычно наоборот: части, собранные отдельно, легко привозят свои копии библиотек.'
      - text: 'Команды перестают договариваться друг с другом о чём-либо'
        why: 'Договариваться всё равно нужно: о контрактах между частями и версиях общих библиотек.'
      - text: 'Ошибка в одной части больше не может сломать соседнюю на странице'
        why: 'Части обычно живут в одной странице и могут мешать друг другу. Такую изоляцию даёт только iframe.'
    explanation: |
      Кэм Джексон определяет микрофронтенды как независимо выпускаемые фронтенд-приложения, собранные в одно целое.
      Всё остальное — меньшие кодовые базы, постепенная замена старого кода — следует из независимой выкатки.
      Платят за неё размером страницы, договорённостями о версиях и ошибками склейки, которые видны только
      на собранной странице.
    links:
      - https://martinfowler.com/articles/micro-frontends.html

  - id: mf-068
    topic: Введение
    level: middle
    question: |
      Онлайн-банк переходит на микрофронтенды. Четыре команды, продукт — карты, кредиты, переводы и вклады. Цель —
      чтобы новая функция обычно требовала работы одной команды и выходила без остальных. Какой разрез выбрать?
    options:
      - text: 'По слоям: одна команда — компоненты, другая — запросы к API, третья — экраны'
        why: 'Любая новая функция заденет все три слоя, то есть все три команды, и они снова будут выпускаться вместе.'
      - text: 'По предметным областям: у каждой команды свои экраны и API от начала до конца'
        correct: true
        why: 'Функция по кредитам почти всегда целиком внутри области «Кредиты» и её команды.'
      - text: 'По технологиям: старый код на Angular в одну часть, новый на React в другую'
        why: 'Функция по переводам может задеть обе части сразу. Такой разрез описывает историю кода, а не продукт.'
      - text: 'По частоте изменений: всё, что меняется часто, — в одну часть, остальное — в другую'
        why: 'Часто меняющийся код разных областей окажется у одной команды, и ей придётся согласовывать всё со всеми.'
    explanation: |
      По закону Конвея структура системы повторяет структуру связей между командами. Поэтому части режут
      по предметным областям (вертикально): у команды свой кусок продукта целиком, и большая часть задач не выходит
      за его границы. Разрез по слоям (горизонтальный) оставляет общий график выкатки, только теперь в нескольких
      репозиториях.
    links:
      - https://martinfowler.com/articles/micro-frontends.html
      - https://www.melconway.com/Home/Conways_Law.html

  - id: mf-069
    topic: Введение
    level: senior
    question: |
      Продукт делает одна команда из шести человек. Сборка идёт 40 минут, тесты нестабильны, релиз раз в неделю,
      и сломанная функция откатывает весь релиз. Команда хочет «перейти на микрофронтенды, чтобы выпускаться
      быстрее». Что предпочтительнее?
    options:
      - text: 'Разделить приложение на микрофронтенды по страницам, чтобы каждая сборка стала заметно короче'
        why: 'Сборки станут короче, но команда одна: выпускать части независимо друг от друга ей не нужно, а цена останется.'
      - text: 'Перейти на Module Federation, чтобы выпускать части страницы отдельно друг от друга'
        why: 'Независимая выкатка нужна, когда команды ждут друг друга. Здесь ждать некого — проблема в сборке и тестах.'
      - text: 'Остаться в одном приложении: проверять затронутые модули и выпускать функции за флагами'
        correct: true
        why: 'Это лечит настоящие беды: долгую сборку и откат всего релиза из-за одной функции.'
      - text: 'Вынести общие компоненты в npm-пакет с отдельной сборкой и своими релизами'
        why: 'Пакет добавит релизы и версии, но не ускорит основную сборку и не решит откат релиза целиком.'
    explanation: |
      Микрофронтенды дают одно — независимую выкатку частей разными командами. У одной команды общий релиз —
      не проблема, а норма. Медленную сборку лечат проверкой только затронутых модулей, нестабильные тесты —
      починкой тестов, откат всего релиза — флагами: сломанную функцию выключают флагом, не трогая остальное.
    links:
      - https://martinfowler.com/articles/micro-frontends.html

  # ===================== Способы встраивания =====================
  - id: mf-070
    topic: Способы встраивания
    level: junior
    question: |
      Каждая часть сайта опубликована npm-пакетом, а оболочка ставит пакеты зависимостями и собирает из них одно
      приложение. Чего команды частей при этом не получат?
    options:
      - text: 'Одной общей копии библиотек вроде React в итоговом бандле'
        why: 'Это они как раз получат: сборщик положит одну копию библиотеки на всё приложение.'
      - text: 'Выкатки своей части без пересборки и выкатки оболочки'
        correct: true
        why: 'Новая версия пакета дойдёт до людей, только когда оболочка обновит зависимость и выкатится.'
      - text: 'Проверки типов между оболочкой и частями при сборке'
        why: 'Получат: пакеты с типами проверяются компилятором вместе с оболочкой.'
      - text: 'Одного бандла без лишних загрузок во время работы'
        why: 'Получат: всё собрано заранее, ничего не грузится отдельно.'
    explanation: |
      Это встраивание при сборке. Оно даёт один бандл без дублей, но связывает выкатки: части выходят только вместе
      с оболочкой. Кэм Джексон поэтому не советует его для микрофронтендов. Для общей дизайн-системы, утилит
      и клиента API пакеты подходят хорошо — им и не нужно выходить отдельно.
    links:
      - https://martinfowler.com/articles/micro-frontends.html

  - id: mf-071
    topic: Способы встраивания
    level: middle
    question: |
      Новостной сайт: статьи должны показываться быстро и находиться поисковиками. Страницу статьи собирают три
      команды — текст, блок «Читайте также» и шапку, — и каждая хочет выкатываться сама. Интерактивности на странице
      мало. Какой способ встраивания предпочтительнее?
    options:
      - text: 'Сборка страницы на сервере из HTML-фрагментов трёх команд'
        correct: true
        why: 'Браузер и поисковик сразу получают готовый HTML, а каждая команда выкатывает свой фрагмент сама.'
      - text: 'Module Federation: оболочка в браузере загружает три части после старта'
        why: 'Текст появится только после загрузки и выполнения JavaScript — первый показ медленнее, а поисковикам сложнее.'
      - text: 'Каждый блок — отдельная страница во фрейме внутри страницы статьи'
        why: 'Поисковики не обещают засчитать содержимое фреймов самой статье, а высоту блоков придётся подгонять вручную.'
      - text: 'Три npm-пакета, собранные в одно приложение с отрисовкой на сервере'
        why: 'Быстро и видно поисковикам, но команды выкатываются только вместе с общим приложением.'
    explanation: |
      Сборка на сервере даёт то, что здесь главное: готовый HTML с первого ответа. Независимость сохраняется —
      каждый фрагмент отдаёт сервер своей команды. Цена — серверная инфраструктура и риск, что медленный фрагмент
      задержит всю страницу; это лечат тайм-аутами (урок «Сборка на сервере»).
    links:
      - https://martinfowler.com/articles/micro-frontends.html

  - id: mf-072
    topic: Способы встраивания
