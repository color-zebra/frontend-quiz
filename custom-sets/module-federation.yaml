  # ===================== Shared и версии =====================
  - id: mf-013
    topic: Shared и версии
    level: junior
    question: |
      React не указан в `shared` ни у хоста, ни у remote. Хост рендерит в своём дереве компонент из remote, который
      вызывает `useState`.
      Что будет?
    options:
      - text: 'Всё работает, просто страница скачает React дважды'
        why: 'Лишний вес — меньшая из проблем: хуки сломаются.'
      - text: 'Сборка remote упадёт с требованием указать React в `shared`'
        why: 'Сборка пройдёт: проблема проявится только в браузере.'
      - text: 'Две копии React, и хуки упадут с «Invalid hook call»'
        correct: true
        why: 'Компонент вызывает хуки своей копии React, а рендерит его чужая копия — диспетчер хуков не найден.'
      - text: 'Рантайм сам заметит дубль и оставит одну копию'
        why: 'Без `shared` рантайм ничего не делит — каждая копия живёт в своём бандле.'
    explanation: |
      React хранит состояние на уровне модуля: текущий диспетчер хуков, объекты контекстов. Если копий две,
      компонент из одной копии в дереве другой ломается. Поэтому React и ReactDOM делят как `singleton`.
    links:
      - https://module-federation.io/guide/troubleshooting/runtime

  - id: mf-014
    topic: Shared и версии
    level: junior
    question: |
      Что делает `singleton: true` у общей зависимости?
    options:
      - text: 'Загружает зависимость один раз при старте, даже если её никто не использует'
        why: 'Это ближе к `eager`. `singleton` про количество копий, а не про момент загрузки.'
      - text: 'Разрешает одну копию в общей области для всех, кто её делит'
        correct: true
        why: 'Даже если версии участников расходятся, все получают одну и ту же копию.'
      - text: 'Запрещает remote использовать эту зависимость'
        why: 'Наоборот, remote её использует — ту же копию, что и все.'
      - text: 'Делает зависимость доступной только хосту'
        why: 'Копия общая для всех участников области.'
    explanation: |
      Без `singleton` участники могут получить разные копии, если их версии несовместимы. С `singleton` копия одна
      на всех, даже ценой несовпадения версий. Что именно происходит при несовпадении, разобрано в соседних вопросах.
    links:
      - https://module-federation.io/configure/shared

  # Проверено на стенде
  - id: mf-015
    topic: Shared и версии
    level: middle
    multiple: true
    question: |
      Хост: `lib` 1.0.0, `{ singleton: true, requiredVersion: '^1.0.0' }`. Remote: `lib` 2.0.0,
      `{ singleton: true }`. Стратегия по умолчанию (`version-first`). Какую версию получит хост?
    options:
      - text: '1.0.0 — хост главный, его версия важнее'
        why: 'Хост не главный: при `version-first` побеждает самая высокая версия.'
      - text: '2.0.0 и предупреждение в консоли'
        correct: true
        why: 'Singleton выбирает самую высокую версию, а сторона, чьему диапазону она не подходит, получает предупреждение.'
      - text: 'Загрузка `lib` в хосте упадёт с ошибкой'
        why: 'Без `strictVersion` несовпадение — только предупреждение.'
      - text: 'Хост получит 1.0.0, а remote — 2.0.0'
        why: 'Так было бы без `singleton`. Здесь копия одна на всех.'
    explanation: |
      При `version-first` рантайм загружает входы remote при старте, собирает все версии и для singleton берёт
      наивысшую. Предупреждение выглядит так: «Version 2.0.0 from remote of shared singleton module lib does not
      satisfy the requirement of host which needs ^1.0.0». Ни сборка, ни загрузка не падают — несовместимость
      проявится только в работе, например когда хост вызовет API, которого в 2.0.0 уже нет. Поэтому предупреждения
      федерации в консоли нельзя считать шумом.
    links:
      - https://module-federation.io/configure/shared
      - https://module-federation.io/configure/shareStrategy.html

