      - text: 'Удаляет remote из общей области'
        why: 'Это не удаление, а регистрация.'
    explanation: |
      Сценарий: модуль, который сам является remote, при загрузке регистрирует свой remote и использует его —
      так строится вложенная федерация. Без `force` уже зарегистрированный remote не перезаписывается, а с `force`
      заменяется, и кэш его загруженных модулей очищается.
    links:
      - https://module-federation.io/guide/runtime/runtime-api

  - id: mf-033
    topic: Рантайм
    level: middle
    multiple: true
    question: |
      Зачем в этой обёртке проверка `default` перед возвратом модуля?
    code: |
      lazy(async () => {
        const module = await loadRemote('shop/Product');
        if (!module || !('default' in module)) {
          throw new Error('Product must be export default');
        }
        return module;
      });
    codeLang: ts
    options:
      - text: 'Проверка лишняя: `loadRemote` всегда возвращает модуль с `default`'
        why: 'Не всегда: модуль может экспортировать только именованные значения.'
      - text: 'Без неё `React.lazy` упадёт с невнятной ошибкой'
        correct: true
        why: '`React.lazy` ждёт компонент в `default`. Своё сообщение сразу говорит, что не так с экспортом.'
      - text: 'Проверка нужна, чтобы React закэшировал модуль'
        why: 'Кэшированием занимается рантайм федерации, а не эта проверка.'
      - text: 'Проверка ускоряет загрузку remote'
        why: 'Скорость она не меняет.'
    explanation: |
      `React.lazy` принимает функцию, которая возвращает промис модуля с `default`-экспортом компонента. Если remote
      экспортирует компонент по имени, его можно обернуть: `.then((m) => ({ default: m.Product }))`. Брошенная в
      фабрике ошибка уйдёт в ближайший `ErrorBoundary`.
    links:
      - https://react.dev/reference/react/lazy
      - https://module-federation.io/guide/runtime/runtime-api

