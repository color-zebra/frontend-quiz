    question: |
      Разработчик нового магазина кроссовок решил «выделиться»: корзина — в левом нижнем углу, логотип не ведёт
      на главную, а фильтры открываются свайпом вправо. В тестах люди долго ищут корзину и не могут вернуться
      на главную. Что не так?
    options:
      - text: 'Люди привыкли к другим сайтам, и непривычному приходится учиться'
