    level: senior
    multiple: true
    question: |
      Онлайн-школа хочет, чтобы меньше учеников отменяли подписку. Маркетинг предлагает несколько приёмов. Какие
      из них честные?
    options:
      - text: 'Напоминать о продлении за три дня и предлагать паузу вместо отмены'
        correct: true
        why: 'Человек заранее знает о списании и получает выбор, которого мог не знать. Решение остаётся за ним, а отмена не становится сложнее.'
      - text: 'При отмене объяснять, что будет с купленными курсами и прогрессом'
        correct: true
        why: 'Это предупреждение о последствиях: человек принимает решение, понимая, что потеряет. Это помогает избежать ошибочного намерения, а не мешает уйти.'
      - text: 'Принимать отмену подписки только через чат с менеджером в рабочее время'
        why: 'Подписка оформляется в два касания, а отмена — через барьер: это «мышеловка». Человек, которого так удерживают, злится и пишет жалобы, а не остаётся из удовольствия.'
      - text: 'Сделать кнопку отказа от скидки «Нет, я не хочу развиваться»'
        why: 'Это стыжение за отказ: давление вместо выбора. Честная кнопка называет действие — «Нет, отменить подписку».'
      - text: 'Отмечать по умолчанию «Продлить со скидкой» в окне отмены'
        why: 'Заранее отмеченный выбор в пользу компании: человек, пришедший отменить, рискует продлить подписку, не заметив галочки.'
    explanation: |
      **Тёмные паттерны** — «мышеловка» (выйти труднее, чем войти), стыжение за отказ, заранее отмеченный выбор —
      дают результат на коротком отрезке, но, по опыту практиков, клиент, которого удержали силой, уходит при первой
      возможности и не возвращается. Честные приёмы оставляют
      решение человеку: напоминание заранее, пауза, скидка с нейтральной кнопкой отказа, объяснение последствий.
    links:
      - https://www.deceptive.design/

  - id: uix-065
    topic: Поведение
    subtopic: Формы
    level: junior
    question: |
      В форме адреса доставки цветов подписи «Улица», «Дом», «Квартира», «Домофон» написаны бледным текстом внутри полей.
      Курьеры жалуются, что номер домофона часто оказывается в поле квартиры. Что исправить?
    options:
      - text: 'Вынести подписи над полями, чтобы они были видны после ввода'
        correct: true
        why: 'Подсказка внутри поля исчезает при вводе, и человек не может перепроверить, что куда вписал. Подпись над полем видна всегда.'
      - text: 'Сделать подсказки внутри полей темнее, чтобы их было лучше видно'
        why: 'Темнее — лучше для контраста, но подсказка всё равно исчезнет, как только человек начнёт печатать, и перепроверить поля нельзя.'
      - text: 'Добавить под формой общую подсказку о порядке заполнения полей'
        why: 'Общая подсказка далеко от полей, её пропускают. Подпись нужна у каждого поля и постоянно.'
      - text: 'Объединить квартиру и домофон в одно поле, чтобы не путали'
        why: 'Путаница уйдёт, но курьеру придётся угадывать, где номер квартиры, а где код. Нужны подписи, а не меньше полей.'
    explanation: |
      **Подсказка внутри поля** (placeholder) не может быть подписью: она исчезает при вводе, её бледный цвет обычно
      не проходит контраст, и её принимают за уже заполненное значение. Подписи ставят **над полем** и оставляют
      видимыми — так советуют Nielsen Norman Group и британская дизайн-система GOV.UK.
    links:
      - https://www.nngroup.com/articles/form-design-placeholders/

