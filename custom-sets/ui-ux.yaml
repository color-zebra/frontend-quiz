      В календаре записи к врачу числа месяца — клетки 20 × 20 пикселей, стоят вплотную друг к другу сеткой семь
      на пять. Других способов выбрать дату нет. Проходит ли календарь требование WCAG к размеру целей уровня AA?
    options:
      - text: 'Нет: клетки меньше 24 пикселей и стоят вплотную — их нужно увеличить'
