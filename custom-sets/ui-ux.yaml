      **Контраст элементов интерфейса** (требование WCAG уровня AA): то, что показывает существование и состояние
      элемента интерфейса, — рамка поля,
      кольцо фокуса, значок статуса без подписи — должно иметь контраст не меньше **3:1** с соседним цветом.
      Пример из пояснений W3C: светло-серая рамка поля на белом не проходит. Рамка с контрастом около 3:1 остаётся
      спокойной, но поле становится видно.
    links:
      - https://www.w3.org/WAI/WCAG22/Understanding/non-text-contrast.html

  - id: uix-032
    topic: Основа визуала
    subtopic: Цвет и контраст
    level: middle
    question: |
      Разработчик сервиса погоды сделал метки «солнечно» и «ливень» в HSL с одинаковой светлотой 50 %: ярко-жёлтую
      и ярко-синюю, обе с белым текстом. На синей метке текст читается, на жёлтой почти пропадает. Почему?
    options:
      - text: 'Светлота HSL — не яркость для глаза: жёлтый намного светлее синего'
        correct: true
        why: 'При одинаковой «светлоте» HSL ярко-жёлтый по формуле яркости почти в тринадцать раз ярче синего, и глаз видит его намного светлее. Белый текст на нём сливается, а на синем — контрастен.'
      - text: 'Жёлтый — тёплый цвет, а тёплые цвета глаз всегда видит темнее'
        why: 'Наоборот: из насыщенных цветов жёлтый для глаза самый светлый. Дело не в «теплоте» цвета, а в его яркости, которую цифра светлоты HSL не отражает.'
      - text: 'Браузер по-разному смешивает тёплые и холодные цвета при отрисовке'
        why: 'Браузер рисует цвета точно. Разница не в отрисовке, а в том, что цифра «светлоты» HSL не совпадает с яркостью, которую видит глаз.'
      - text: 'Белый текст плохо читается на любом цветном фоне, нужен чёрный'
        why: 'На синей метке белый текст читается хорошо. Вопрос не в цвете фона вообще, а в его яркости.'
    explanation: |
      «Светлота» в **HSL** — математика над экранными каналами, а не яркость для глаза. Поэтому палитра «одинаковой
      светлоты» в HSL выходит неровной. Модель **OKLCH** ближе к восприятию: одинаковая светлота выглядит примерно
      одинаково светлой, и шкалы оттенков получаются ровнее. Но и в ней контраст текста с фоном нужно проверять
      отдельно, по формуле WCAG.

  - id: uix-033
    topic: Основа визуала
    subtopic: Цвет и контраст
    level: middle
    question: |
      На сайте турагентства белый заголовок лежит прямо на большом фото. На тёмной фотографии моря контраст был
      7:1, всё проверили. Через месяц маркетолог поставил фото снежных гор, и заголовок почти исчез. Как сделать,
      чтобы это не повторялось?
    options:
      - text: 'Положить под заголовок затемнение, чтобы контраст не зависел от фото'
        correct: true
        why: 'Затемнение снизу или полупрозрачная плашка обеспечивают контраст на любой картинке. Фото меняются, а текст на подложке остаётся читаемым.'
      - text: 'Проверять контраст на каждом новом фото и менять цвет текста под него'
        why: 'Это работает, пока о проверке помнят. Фото меняют часто и разные люди, и рано или поздно снова пропустят светлое.'
      - text: 'Сделать заголовок крупнее и жирнее, тогда хватит меньшего контраста'
        why: 'Порог для крупного текста ниже, 3:1, но белый на снежных горах не дотянет и до него. Размер не заменяет контраст.'
      - text: 'Договориться с маркетологом, что светлые фото на главную не ставят'
        why: 'Правило для людей легко забыть, а хорошие кадры часто светлые. Надёжнее сделать вёрстку, которая не зависит от фото.'
    explanation: |
      Контраст текста на фото непредсказуем: фото меняются, а текст остаётся. Поэтому под текст кладут
      **затемнение** (градиент от прозрачного к тёмному), полупрозрачную плашку или размытие. Тогда контраст
      держится на любой картинке, а не только на той, на которой проверяли.

