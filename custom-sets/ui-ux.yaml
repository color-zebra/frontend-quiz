  - id: uix-017
    topic: Основа визуала
    subtopic: Отступы, сетка и плотность
    level: junior
    question: |
      В приложении доставки еды отступы на экранах — 10, 14, 15, 18 и 20 пикселей, каждый подобран отдельно.
      Ошибок нет, но экраны выглядят неаккуратно, хотя никто не может сказать почему. Что поможет?
    options:
      - text: 'Брать каждый отступ из короткой шкалы, например 4, 8, 12, 16, 24'
        correct: true
        why: 'Когда значения почти одинаковые, но не совсем, глаз замечает разнобой. Шкала оставляет несколько заметно разных значений, и одинаковые расстояния начинают выглядеть намеренными.'
      - text: 'Увеличить все отступы на четыре пикселя, чтобы на экране стало просторнее'
        why: 'Разнобой останется тем же, только крупнее: 14, 18, 19, 22, 24. Дело не в размере отступов, а в том, что их слишком много разных.'
      - text: 'Заменить все отступы одним значением 16 пикселей на всём экране'
        why: 'Разнобой исчезнет, но вместе с ним и группировка: если внутри групп и между ними одно расстояние, групп не видно.'
      - text: 'Обвести блоки экрана рамками, чтобы границы стали чёткими'
        why: 'Рамки добавят шум и не уберут неровные расстояния между блоками. Неаккуратность — от разнобоя отступов, а не от отсутствия границ.'
    explanation: |
      **Шкала отступов** — короткий список разрешённых значений, из которого берут каждый отступ, чаще всего
      кратные восьми с половинкой для мелочей: 4, 8, 12, 16, 24, 32. С ней меньше решений и меньше разнобоя,
      а одинаковые расстояния выглядят намеренными. При этом отступы не становятся одинаковыми: внутри группы
      берут меньшие ступени, между группами — большие.

  - id: uix-018
    topic: Основа визуала
    subtopic: Отступы, сетка и плотность
    level: junior
    question: |
      В отчёте каршеринга столбец «Пробег, км» выровнен по левому краю, как текст: 87, 1 240, 315, 12 900.
      Менеджеру трудно с первого взгляда найти машины с большим пробегом. Что сделать со столбцом?
    options:
      - text: 'Выровнять числа по правому краю и включить цифры одинаковой ширины'
        correct: true
        why: 'По правому краю разряды встают друг под другом, и длина числа сама показывает величину. Цифры одинаковой ширины не дают столбцу «гулять».'
      - text: 'Выровнять числа по центру столбца, чтобы столбец выглядел ровнее и аккуратнее'
        why: 'По центру разряды тоже не встают друг под другом: у короткого и длинного числа середины совпадают, а единицы — нет.'
      - text: 'Выделить жирным шрифтом числа больше десяти тысяч километров'
        why: 'Жирное поможет заметить самые большие, но сравнивать остальные будет так же трудно. И порог в десять тысяч выбран наугад.'
      - text: 'Раскрасить строки таблицы через одну, чтобы не терять строку'
        why: 'Полосы помогают держать строку, но не сравнивать числа: разряды по-прежнему стоят вразнобой.'
    explanation: |
      В таблицах **числа выравнивают по правому краю**: тогда единицы стоят под единицами, тысячи под тысячами,
      и длина числа сама показывает его величину. Заголовок числового столбца тоже ставят вправо, над числами.
      **Цифры одинаковой ширины** (в CSS — `font-variant-numeric: tabular-nums`) не дают столбцу дрожать: в обычном
      шрифте единица уже восьмёрки. Текст при этом остаётся по левому краю.
    links:
      - https://design-system.service.gov.uk/components/table/

