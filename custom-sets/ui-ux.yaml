    multiple: true
    question: |
      Магазин переделывает форму оформления заказа в одну колонку. Какие пары полей всё же можно оставить рядом
      в одной строке?
    options:
      - text: 'Срок действия карты и трёхзначный код на её обороте'
        correct: true
        why: 'Это короткие тесно связанные поля, которые люди привыкли видеть рядом: так они расположены и на самой карте.'
      - text: 'Почта и её повтор, чтобы человек сверил их глазами'
        why: 'Два длинных поля рядом станут узкими, а сверять адрес глазами всё равно неудобно. Поле повтора почты обычно лучше убрать вовсе и показать введённое на шаге подтверждения.'
      - text: 'Телефон и адрес электронной почты покупателя'
        why: 'Это два разных и не коротких поля. Рядом правое легко пропустить, а на узком экране оба станут тесными.'
      - text: 'Адрес доставки и комментарий для курьера'
        why: 'Оба поля длинные, особенно комментарий. Рядом им не хватит ширины, и порядок заполнения станет неочевидным.'
      - text: 'Номер карты и имя владельца, как они написаны на карте'
        why: 'Номер карты — длинное поле, имя тоже. Поставленные рядом, они станут узкими и неудобными.'
    explanation: |
      Поля в две колонки заставляют взгляд идти зигзагом, правую колонку легко пропустить. В тестах Baymard в одной
      колонке поля реже пропускали и путали. Исключение — **короткие тесно связанные пары**, которые люди привыкли
      видеть рядом: срок карты и код на обороте, индекс и город.

