      прошлые поездки. Продакт хочет одну длинную страницу, «чтобы клиент видел всё сразу». Клиенты заполняют её
      с телефона и часто бросают на середине. Что разумнее?
    options:
      - text: 'Разбить на шаги по темам, показывать прогресс, сохранять введённое'
        correct: true
        why: 'На каждом шаге человек думает об одной теме, видит, сколько осталось, и может уйти за справкой и вернуться, не потеряв введённое. Длинная простыня на телефоне пугает и теряется при любом сбое.'
      - text: 'Одна страница с разделами-гармошками: открыт только текущий раздел'
        why: 'На телефоне это почти шаги, но без своего адреса у раздела и без работающей кнопки «Назад». Раскрытая гармошка всё равно уезжает вниз, а ошибку в свёрнутом разделе не видно.'
      - text: 'Разбить на сорок шагов по одному вопросу, как советует GOV.UK'
        why: 'GOV.UK советует начинать с одного вопроса и объединять связанные. Сорок нажатий «Дальше» ради связанных полей паспорта — перебор, а сохранения введённого это не даёт.'
      - text: 'Одна страница с закреплённым вверху экрана оглавлением всех разделов'
        why: 'Оглавление помогает не потеряться, но не убирает простыню на телефоне и не сохраняет черновик, если человек ушёл за справкой.'
    explanation: |
      Длинную форму разбивают на **шаги**: небольшие группы связанных вопросов, видимый прогресс, сохранение
      введённого. GOV.UK советует начинать с одного вопроса на странице и объединять вопросы, когда это подтверждают
      исследования с пользователями. Цена шагов — больше нажатий «Дальше», поэтому короткие формы не дробят.
    links:
      - https://design-system.service.gov.uk/patterns/question-pages/

  - id: uix-071
    topic: Поведение
    subtopic: Память, привычки и навигация
    level: junior
    question: |
      Дизайнер интернет-магазина товаров для дома урезал главное меню с двенадцати категорий до семи, а остальные
      спрятал в пункт «Ещё»: «Больше семи пунктов человек не запомнит — это правило Миллера». Что на это ответить?
    options:
      - text: 'Это миф: меню не запоминают, а просматривают — его пункты ведь видны'
        correct: true
        why: 'Миллер писал о кратковременной памяти, а пункты меню видны на экране. Пряча категории в «Ещё», дизайнер заставляет искать дольше, а не помогает памяти.'
      - text: 'Он прав: по Миллеру в памяти помещается не больше семи пунктов любого меню'
        why: 'Статья Миллера была о том, сколько человек удерживает в голове, а не о том, сколько пунктов он может просмотреть на экране.'
      - text: 'Он прав, но лучше урезать до пяти: память ещё меньше, около четырёх'
        why: 'Рабочая память действительно мала, но к меню это не относится: его не держат в голове, а видят. Урезание только спрячет нужное.'
      - text: 'Нужно убрать «Ещё» и показывать категории по одной, листая их вбок'
        why: 'Так категории станет ещё труднее просмотреть: видна будет одна, а остальные придётся вспоминать.'
    explanation: |
      «Не больше семи пунктов в меню» — **миф**, выросший из статьи Миллера 1956 года о кратковременной памяти.
      Но меню не нужно помнить: его пункты видны, их просматривают. В опытах с меню каждый лишний уровень замедлял
      поиск, а прятать видимые категории в «Ещё» — значит добавить уровень. Лучше меньше уровней с понятными группами.
    links:
      - https://www.nngroup.com/articles/flat-vs-deep-hierarchy/

  - id: uix-072
    topic: Поведение
    subtopic: Память, привычки и навигация
    level: junior
    question: |
      Клиентка мобильного банка каждый месяц переводит деньги одному и тому же арендодателю. Каждый раз приложение
      просит ввести номер его счёта — двадцать цифр — с нуля. Что поможет вернее всего?
    options:
      - text: 'Показывать недавних получателей, чтобы выбрать из списка'
        correct: true
        why: 'Узнать знакомого получателя в списке проще, чем вспомнить или переписать двадцать цифр. Это эвристика «узнавание вместо вспоминания».'
      - text: 'Разбить номер счёта на группы по четыре цифры для удобства'
        why: 'Группы помогут не ошибиться при вводе, но клиентке всё равно придётся каждый раз искать и вводить номер.'
      - text: 'Добавить подсказку «Номер счёта есть в договоре аренды»'
        why: 'Подсказка говорит, где взять номер, но не избавляет от того, чтобы каждый раз его искать и вводить.'
      - text: 'Проверять номер счёта по контрольной сумме прямо при вводе'
        why: 'Проверка поймает опечатку, но не уберёт главную работу — вводить двадцать цифр каждый месяц.'
    explanation: |
      **Рабочая память** мала — в среднем около четырёх единиц. Поэтому интерфейс не заставляет человека помнить
      и вводить то, что уже известно, а показывает варианты: **узнавание легче вспоминания**.

  - id: uix-073
    topic: Поведение
    subtopic: Память, привычки и навигация
    level: middle
    question: |
      В онлайн-кинотеатре раздел с купленными и взятыми напрокат фильмами называется «Транзакции контента».
      Поддержка постоянно получает вопросы «куда пропал купленный фильм». Что изменить в первую очередь?
    options:
      - text: 'Назвать раздел словами зрителей, например «Мои покупки»'
        correct: true
        why: 'Человек ищет «мои фильмы» или «покупки», а «Транзакции контента» — слова системы. У пункта нет запаха информации, и его проходят мимо.'
      - text: 'Добавить к пункту меню значок плёнки, чтобы его было видно'
        why: 'Значок сделает пункт заметнее, но не понятнее: люди и так видят «Транзакции контента», просто не связывают их со своими фильмами.'
      - text: 'Добавить в раздел «Справка» статью о том, где искать фильмы'
        why: 'Справку открывают, когда уже потерялись, и не все. Лучше назвать раздел так, чтобы искать не пришлось.'
      - text: 'Перенести пункт на самый верх меню, чтобы его заметили'
        why: 'Наверху его увидят раньше, но название всё равно не скажет, что купленные фильмы там.'
    explanation: |
      Человек выбирает пункт меню, оценивая, насколько вероятно найти за ним нужное. Это **запах информации**
      (information scent). Пункты называют **словами пользователей**, а не системы, и конкретно, без «Подробнее»
      и «Ещё». Проверить названия просто: попросить нескольких людей найти в меню типичные вещи.
    links:
      - https://www.nngroup.com/articles/information-scent/

  - id: uix-074
    topic: Поведение
    subtopic: Память, привычки и навигация
    level: middle
    question: |
      Продакт-менеджер банка хочет убрать половину разделов личного кабинета в подменю «Ещё»: «По закону Хика чем
      меньше вариантов, тем быстрее выбор». Разделы незнакомы новым клиентам, и им приходится их просматривать.
      Что верно?
    options:
      - text: 'Хик — про выбор из знакомого, а незнакомое меню просматривают'
        correct: true
        why: 'Незнакомое меню просматривают подряд, и это другая задача, чем выбор, описанный законом. Спрятав разделы, продакт заставит искать их на втором уровне — дольше.'
      - text: 'Он прав: по закону Хика время выбора растёт с каждым пунктом меню'
        why: 'Закон описывает выбор между равновероятными знакомыми сигналами, а не поиск в незнакомом меню. К тому же время там растёт медленно, по логарифму.'
      - text: 'Он прав, но разделы лучше не прятать, а просто удалить из кабинета'
        why: 'Удалённый раздел не станет быстрее находиться — его не станет вовсе. Довод о законе Хика неверен и тут.'
      - text: 'Закон Хика давно опровергнут, на него вообще нельзя ссылаться'
        why: 'Закон верен в своих условиях — выбор из знакомых равновероятных вариантов. Ошибка не в законе, а в том, что его переносят на просмотр меню.'
    explanation: |
      **Закон Хика** говорит, что время выбора между равновероятными знакомыми вариантами растёт с их числом,
      причём медленно, по логарифму. Незнакомое меню человек просматривает глазами подряд — это другая задача.
      Довод «уберём пункты, по закону Хика станет быстрее» обычно неверен: спрятанный раздел ищут дольше.
      Лучше меньше уровней с понятными группами.

  - id: uix-075
    topic: Поведение
