    level: middle
    question: |
      На сайте музея дизайнер добавил всем кнопкам `outline: none`: ему не нравится рамка, появляющаяся после
      нажатия мышью. Посетители, которые работают с клавиатуры, пишут, что не видят, где находятся. Как решить, чтобы
      устроило обоих?
    options:
      - text: 'Рисовать кольцо фокуса через :focus-visible вместо обычного :focus'
        correct: true
        why: 'Браузер показывает :focus-visible при работе с клавиатуры и обычно не показывает после нажатия мышью. Посетители с клавиатуры видят фокус, а дизайнеру не мешает рамка от клика.'
      - text: 'Вернуть рамку через :focus для всех случаев, включая нажатие мышью'
        why: 'Посетители с клавиатуры увидят фокус, но рамка снова будет появляться после каждого клика мышью — ровно то, что не устроило дизайнера.'
      - text: 'Оставить outline: none, а фокус показывать подсказкой при наведении'
        why: 'Наведение — это мышь. Человек с клавиатуры курсор не двигает, и подсказку не увидит.'
      - text: 'Сделать кольцо фокуса светло-серым, чтобы оно было почти незаметным'
        why: 'Почти незаметное кольцо — то же, что его отсутствие. Кольцо фокуса должно быть достаточно контрастным к фону.'
    explanation: |
      Стандарт WCAG требует, чтобы **фокус клавиатуры был виден**, а кольцо фокуса — достаточно контрастным.
      Компромисс между «рамка мешает при клике» и «фокус должен быть виден» — селектор **`:focus-visible`**: браузер
      сам решает, когда показывать фокус. Его поддерживают все современные браузеры.
    links:
      - https://www.w3.org/WAI/WCAG22/Understanding/focus-visible.html

  - id: uix-050
    topic: Поведение
    subtopic: Состояния и подсказки
    level: middle
    question: |
      В онлайн-школе кнопка «Зарегистрироваться» серая и не нажимается, пока все поля формы не заполнены верно.
      Аналитика показывает: многие доходят до кнопки, несколько раз нажимают на неё и уходят. Что изменить?
    options:
      - text: 'Оставить кнопку активной и по нажатию показывать ошибки у полей'
        correct: true
        why: 'Нажатие на активную кнопку получает ответ: человек видит, какое поле не так, прямо рядом с ним. Серая кнопка не отвечает и ничего не объясняет.'
      - text: 'Оставить кнопку серой и написать над ней «Заполните все поля верно»'
        why: 'Надпись общая: человек не знает, какое именно поле не так, и ищет сам. Ошибку показывают у того поля, где она есть. К тому же нажатие на серую кнопку по-прежнему ничего не отвечает.'
      - text: 'Сделать серую кнопку ярче, чтобы её было лучше видно на форме'
        why: 'Кнопку и так видят и нажимают. Беда в том, что нажатие ничего не делает и не говорит, чего не хватает.'
      - text: 'Убрать проверку полей, чтобы кнопка всегда была активной'
        why: 'Тогда ошибки всплывут уже после отправки, на сервере, или не всплывут вовсе. Проверка нужна, ей нужен понятный способ сообщить результат.'
    explanation: |
      У **отключённой кнопки** две беды: нажатие на неё не даёт никакого ответа, а программы чтения с экрана часто
      её пропускают. Надёжнее оставить кнопку активной и по нажатию показать, чего не хватает, у того поля, где ошибка.
      Отключённое состояние уместно, когда действие действительно невозможно и причина видна сразу: «Мест нет».
    links:
      - https://www.smashingmagazine.com/2021/08/frustrating-design-patterns-disabled-buttons/

  - id: uix-051
    topic: Поведение
    subtopic: Состояния и подсказки
    level: middle
    question: |
      В сервисе записи к врачу «Перейти к записи» сверстано как `<button>`, который по нажатию меняет адрес страницы
      скриптом. Пациенты жалуются, что не могут открыть запись в новой вкладке, чтобы сравнить с расписанием врачей.
      Что не так?
    options:
      - text: 'Это переход на другую страницу, и сверстать его нужно ссылкой <a href>'
        correct: true
        why: 'Ссылка ведёт в другое место, кнопка выполняет действие здесь. У ссылки есть то, чего люди от неё ждут: новая вкладка, адрес при наведении, правильная работа с клавиатуры. Выглядеть ссылка может как кнопка.'
      - text: 'Кнопке не хватает атрибута target="_blank" для открытия во вкладке'
        why: 'У кнопки нет такого атрибута: target работает у ссылок и форм. Кнопка со скриптом не умеет то, что ссылка умеет сама.'
      - text: 'Скрипт перехода нужно вызывать не при нажатии, а при отпускании кнопки'
        why: 'Время вызова скрипта ничего не меняет: человек по-прежнему не сможет открыть переход в новой вкладке, как обычную ссылку.'
      - text: 'Ничего: открывать запись к врачу в новой вкладке просто не принято'
        why: 'Люди сами решают, как им удобно, и ссылки в вебе всегда открывались в новой вкладке. Ломать привычку ради неверного элемента — плохо.'
    explanation: |
      **Ссылка** ведёт в другое место — на другую страницу, раздел, файл. **Кнопка** выполняет действие здесь —
      оплатить, удалить, открыть шторку. Путать их — ломать ожидания: ссылку открывают в новой вкладке, видят адрес,
      нажимают Enter; кнопку — Enter и пробелом. Внешне главную ссылку экрана можно оформить как кнопку, но в разметке
      она остаётся ссылкой.

  - id: uix-052
    topic: Поведение
    subtopic: Состояния и подсказки
    level: senior
    question: |
      На видеосервисе автор загружает ролик, и обработка занимает от двух до пяти минут. Разработчик предлагает
      показать на это время скелетон страницы ролика, «потому что скелетон всегда лучше спиннера». Что разумнее?
    options:
      - text: 'Полосу прогресса с оценкой оставшегося времени и этапом обработки'
        correct: true
        why: 'Ожидание дольше десяти секунд и это обработка файла: человеку нужно знать, сколько осталось и что происходит. Скелетон этого не показывает и в таком процессе только запутает.'
      - text: 'Скелетон страницы ролика, как и предлагает разработчик'
        why: 'Скелетон уместен при первой загрузке страницы, когда ждать меньше десяти секунд. Пять минут серых заготовок выглядят как сломанная страница.'
      - text: 'Индикатор вращения поверх страницы, пока ролик не обработается'
        why: 'Индикатор вращения не говорит, сколько ждать. Через минуту вращения человек решит, что всё зависло.'
      - text: 'Ничего не показывать, а прислать уведомление, когда ролик будет готов'
        why: 'Уведомление полезно, но без видимого прогресса автор не узнает, идёт ли обработка вообще, и может загрузить ролик повторно.'
    explanation: |
      Что показать во время ожидания, зависит от его длины и вида: **индикатор вращения** — для блока и ожидания
      в несколько секунд; **скелетон** — для первой загрузки целой страницы, если ждать меньше десяти секунд;
      **полоса прогресса** с оценкой времени — для ожидания дольше десяти секунд и для загрузки и обработки файлов.
      Утверждение «скелетон всегда лучше» — миф: данных для него мало, и для процессов он не подходит.
    links:
      - https://www.nngroup.com/articles/skeleton-screens/

  - id: uix-053
    topic: Поведение
    subtopic: Окна, шторки и сообщения
    level: junior
    question: |
      В приложении заметок после сохранения нужно сообщить «Заметка сохранена». Сообщение ничего не требует от человека,
      и он обычно сразу пишет следующую заметку. Как это показать?
    options:
      - text: 'Короткой плашкой у края экрана, которая исчезнет сама'
        correct: true
        why: 'Плашка сообщает и не прерывает: человек продолжает писать. Действий у неё нет, поэтому ей можно исчезнуть самой.'
      - text: 'Модальным окном «Сохранено!» с кнопкой «Хорошо»'
        why: 'Окно прерывает и требует нажать «Хорошо», хотя ничего не спрашивает. На каждой заметке это лишнее действие.'
      - text: 'Отдельной страницей «Готово» с кнопкой «Новая заметка»'
        why: 'Переход на отдельную страницу ради одного слова отрывает от работы сильнее всего.'
      - text: 'Постоянной строкой вверху экрана, пока приложение открыто'
        why: 'Сообщение о прошлом действии быстро устаревает, а постоянная строка занимает место и путает: что сейчас сохранено?'
    explanation: |
      **Плашка** (snackbar, toast) — короткое сообщение у края экрана, которое исчезает само. Она для того, что
      не требует ответа: «Сохранено», «Ссылка скопирована». Самое большее у неё одно действие. **Модальное окно**
      прерывает и требует ответа — оно для критичных предупреждений и данных, без которых нельзя продолжить.

  - id: uix-054
