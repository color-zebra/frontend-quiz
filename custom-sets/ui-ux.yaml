    question: |
      Приложение для пробежек при первом же запуске запрашивает доступ к геолокации. Многие нажимают «Блокировать»
      и потом не понимают, почему не записывается маршрут. Когда лучше просить разрешение?
    options:
      - text: 'Когда человек нажал «Начать пробежку» и понятно, зачем геолокация'
        correct: true
        why: 'Разрешение просят после действия человека, когда польза очевидна: маршрут нельзя записать без геолокации. Так шанс, что его разрешат, гораздо выше.'
      - text: 'При регистрации, вместе с остальными настройками нового профиля'
        why: 'Регистрация — тоже не тот момент: человек ещё не пробовал бегать с приложением и не видит, зачем ему геолокация.'
      - text: 'При первом запуске, но сначала показать экран с объяснением пользы'
        why: 'Объяснение лучше, чем ничего, но человек всё ещё ничего не делал. Просить стоит в момент, когда разрешение нужно для его действия.'
      - text: 'Не просить вовсе, а определять место по адресу интернет-провайдера'
        why: 'Так можно узнать город, но не маршрут пробежки. Без разрешения приложение не сделает главного.'
    explanation: |
      Руководства Google советуют просить разрешения **после действия человека**, когда польза понятна, а не при
      первом открытии. Отклонённое разрешение трудно вернуть: его приходится искать в настройках браузера или системы.
      Браузеры всё строже относятся к запросам без действия человека.
    links:
      - https://web.dev/articles/permissions-best-practices

  - id: uix-062
    topic: Поведение
    subtopic: Сценарий раньше экрана
    level: middle
    question: |
      Клиент банка нажал «Закрыть вклад досрочно», решив, что так продлит вклад ещё на год. Вклад закрылся, и клиент
      потерял проценты. Кнопки стоят отдельно, клиент нажал именно ту, что хотел. Что это за ошибка и что поможет?
    options:
      - text: 'Ошибочное намерение: нужны понятные слова и предупреждение о потерях'
        correct: true
        why: 'Клиент сделал ровно то, что хотел, но хотел не того: он неверно понял интерфейс. От таких ошибок спасают понятные названия и предупреждение о последствиях перед необратимым.'
      - text: 'Промах: кнопки нужно развести дальше друг от друга на экране'
        why: 'Промах — когда хотел одно, а нажал соседнее. По условию клиент нажал ту кнопку, которую хотел, так что расстояние тут не поможет.'
      - text: 'Промах: досрочное закрытие вклада в приложении нужно запретить совсем'
        why: 'Это не промах, и запрет лишит клиентов законной возможности забрать деньги. Нужно, чтобы человек понимал, что делает.'
      - text: 'Ошибка клиента: он был невнимателен, а интерфейс тут ни при чём'
        why: 'Если люди неверно понимают кнопку, дело в интерфейсе. Ошибочные намерения рождаются там, где слова расходятся с тем, что происходит.'
    explanation: |
      Норман различает **промах** — хотел одно, сделал соседнее, на автомате — и **ошибочное намерение** — правильно
      сделал то, что хотел, но хотел не того, потому что неверно понял интерфейс. От промахов спасают ограничения,
      разумные значения по умолчанию и отмена. От ошибочных намерений — понятные слова и предупреждение о последствиях:
      «Вклад закроется сегодня, проценты за полгода не начислятся».

  - id: uix-063
    topic: Поведение
