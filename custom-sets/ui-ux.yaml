    question: |
      Разработчик переделывает экран оформления заказа в приложении аптеки. Проблем много: невидимая кнопка
      «Оформить», мелкий бледный текст, обрезанные длинные названия лекарств, нет состояния загрузки у кнопки.
      В каком порядке их лучше исправлять?
    options:
      - text: 'Сначала кнопка, затем читаемость, в конце названия и загрузка'
        correct: true
        why: 'Сначала то, что мешает выполнить главную задачу, — кнопку. Потом то, что мешает читать. В конце — крайние случаи содержимого и состояния.'
      - text: 'Сначала длинные названия лекарств: на них экран ломается сильнее всего'
        why: 'Длинные названия важны, но с невидимой кнопкой заказ не оформят вообще. Крайние случаи исправляют после главной задачи.'
      - text: 'Сначала состояние загрузки, потом всё остальное по очереди'
        why: 'Состояние загрузки нужно, но только после того, как кнопку вообще находят и нажимают.'
      - text: 'Порядок неважен: главное — исправить все проблемы до релиза'
        why: 'Порядок важен: если время кончится, неисправленной должна остаться мелочь, а не главное действие.'
    explanation: |
      Экран переделывают **по порядку важности**: главное действие и иерархия → читаемость (размер, контраст, текст) →
      крайние случаи содержимого и состояния. Так, если времени не хватит, неисправленным останется наименее важное.

  - id: uix-104
    topic: Проверка и итог
    subtopic: Разбор экрана
    level: middle
    question: |
      В разборе экрана записи на приём к врачу команда заменила цветные точки «свободно» и «занято» на подписи
      «Свободно» и «Занято» с тем же цветом. На чём держится это изменение?
    options:
      - text: 'На стандарте WCAG: смысл не должен передаваться только цветом'
        correct: true
        why: 'Это требование стандарта доступности базового уровня. Его подкрепляют данные о нарушениях цветового зрения — примерно у каждого двенадцатого мужчины.'
      - text: 'На мифе: цветовые точки давно понятны всем без подписей'
        why: 'Это не миф, а наоборот: красный и зелёный хуже всего различают люди с нарушениями цветового зрения.'
      - text: 'На законе Фиттса: подписи заметно увеличивают размер цели для пальца'
        why: 'Закон Фиттса — про попадание в цель. Здесь подписи нужны, чтобы понять смысл, а не чтобы легче нажимать.'
      - text: 'На договорённости Material: подписи требуются в каждой метке'
        why: 'Изменение держится на требовании стандарта, а не на правилах одной платформы.'
    explanation: |
      В хорошем разборе у каждого изменения названо, **на чём оно держится**: исследование, стандарт, договорённость
      или миф. «Смысл не только цветом» — стандарт WCAG (уровень A), подкреплённый данными о распространённости
      нарушений цветового зрения. Со стандартом и исследованием спорят данными, с договорённостью можно спорить
      причинами.

  - id: uix-105
    topic: Проверка и итог
    subtopic: Разбор экрана
    level: senior
    question: |
      Команда онлайн-кинотеатра переделала экран покупки по всем правилам: у каждого изменения есть причина
      и уровень доказательности. Продакт предлагает сразу выпускать: «Мы же всё сделали по науке». Что разумнее
      перед выпуском?
    options:
      - text: 'Оценить по эвристикам и провести мини-тест на нескольких зрителях'
        correct: true
        why: 'Правила подсказывают решения, но сработали ли они, показывает проверка. Мини-тест часто находит то, что правила не предусмотрели.'
      - text: 'Выпускать сразу: изменения основаны на исследованиях и стандартах'
        why: 'Правило верно в общем, но конкретное решение может не сработать на конкретных людях. Переделку не принимают на веру.'
      - text: 'Показать экран всей команде разработки и собрать мнения'
        why: 'Команда знает экран лучше всех и видит то, что знает. Мнения коллег не заменяют проверки на людях, которые экран не видели.'
      - text: 'Запустить A/B-тест на один день и выпустить, если не хуже'
        why: 'За день разница легко окажется случайной, и A/B-тест не покажет, почему людям трудно. Мини-тест быстрее даст причины.'
    explanation: |
      Даже переделка, где каждое изменение опирается на правило, проверяется: **эвристическая оценка** несколькими
      людьми и **мини-тест** на нескольких пользователях. Правило из курса подсказывает решение, а тест показывает,
      сработало ли оно, — и часто находит то, что правила не предусмотрели.
