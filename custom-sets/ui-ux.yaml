      карточка ломается. Карточку используют ещё в пяти местах, и держать её копии команда не хочет. Как это исправить?
    options:
      - text: 'Перестраивать карточку контейнерным запросом по её колонке'
        correct: true
        why: 'Карточке важно не то, какой ширины экран, а сколько места ей дали. Контейнерный запрос спрашивает ширину родителя, и карточка подстраивается под любое место.'
      - text: 'Добавить ещё один медиазапрос для мониторов с боковой колонкой'
        why: 'Ширина экрана одна и та же, а колонки разные: медиазапрос не может отличить карточку в основной колонке от карточки в боковой.'
      - text: 'Сделать две разные карточки: для основной и для боковой колонки'
        why: 'По условию копии карточки команда держать не хочет: две карточки разойдутся при первой же правке. Контейнерный запрос даёт то же самое одной карточкой.'
      - text: 'Запретить боковой колонке становиться уже ширины основной'
        why: 'Боковая колонка потому и боковая, что она уже. Ломать раскладку экрана ради одной карточки — не выход.'
    explanation: |
      **Медиазапрос** отвечает на вопрос «какой ширины экран», **контейнерный запрос** `@container` — «сколько места
      у компонента». Одна и та же карточка может стоять в широкой и узкой колонке, и перестраиваться ей нужно
      по своему месту. Родителя для этого объявляют контейнером: `container-type: inline-size`.

