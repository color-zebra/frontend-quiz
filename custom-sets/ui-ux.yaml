    question: |
      В онлайн-кинотеатре на странице фильма кнопка «Смотреть» и метки «Драма», «16+», «2 ч 10 мин» выглядят
      одинаково: серые капсулы одного размера. Люди не сразу понимают, куда нажать, чтобы начать фильм. Какой
      принцип группировки сработал против интерфейса?
    options:
      - text: 'Сходство: одинаковые на вид элементы кажутся одним видом вещей'
        correct: true
        why: 'Кнопка выглядит как метки, и глаз относит её к меткам. Чтобы её узнали как действие, она должна выглядеть иначе, чем справочные капсулы.'
      - text: 'Близость: кнопка стоит слишком близко к меткам и сливается с ними'
        why: 'Близость тоже может мешать, но главное здесь — одинаковый вид. Даже отодвинутая серая капсула останется похожей на метку.'
      - text: 'Общая область: кнопка и метки лежат на одном фоне страницы'
        why: 'Вся страница лежит на одном фоне, это не создаёт путаницы. Путаница — от того, что кнопка оформлена как метки.'
      - text: 'Связность: кнопку и метки соединяет общая линия по краю'
        why: 'В условии нет линий, соединяющих элементы. Связность — про соединение линией, а здесь всё решает одинаковое оформление.'
    explanation: |
      **Сходство**: элементы, которые выглядят одинаково, человек считает одним видом вещей. Это помогает, когда
      все кнопки одного действия одинаковые, и мешает, когда кнопка оформлена как справочная метка. Главное действие
      должно отличаться от справочных элементов — тогда оно ещё и «выпрыгивает» среди них.

  - id: uix-013
    topic: Как человек видит
    subtopic: Иерархия и группировка
    level: middle
    question: |
      Клиенты банка иногда сохраняют шаблон вместо того, чтобы отправить перевод. Банк сравнивает два экрана.

      ![Экран перевода А: три одинаковые синие кнопки «Перевести», «Сохранить шаблон», «Отмена»](images/uix-q-bank-buttons-a.png)

      ![Экран перевода Б: синяя «Перевести», светлая «Сохранить шаблон» и текстовая «Отмена»](images/uix-q-bank-buttons-b.png)

      Какой экран лучше и почему?
    options:
      - text: 'Б: основное действие одно, остальные легче по визуальному весу'
        correct: true
        why: 'Человек пришёл переводить, и на экране Б первым замечает именно «Перевести». Шаблон и отмена доступны, но не спорят с главным действием.'
      - text: 'Б: синий цвет остался у одной кнопки, а вес кнопки задаёт только цвет'
        why: 'Экран выбран верно, а причина — нет. Вес задаёт не только цвет: заливка, контур, текст без фона. У «Отмены» на экране Б фона нет вовсе — дело в уровнях кнопок.'
      - text: 'А: все три действия видны одинаково хорошо, ничего не спрятано'
        why: 'Одинаково заметные кнопки заставляют прочитать все три, прежде чем нажать, — отсюда и ошибки. Ничего не спрятать можно и с разными уровнями.'
      - text: 'А: экран не навязывает выбор и оставляет решение клиенту'
        why: 'Клиент уже решил — он пришёл перевести деньги. Экран, где все действия равны, не уважает выбор, а мешает его сделать.'
    explanation: |
      Кнопки делят по важности на три уровня: **основная** с заливкой — для главного действия экрана,
      **второстепенная** с мягкой заливкой или контуром, **третьестепенная** текстом без фона. Обычно на экране
      одна основная. Когда одинаково тяжёлых кнопок несколько, человек сравнивает их и иногда нажимает не ту.
      Так кнопки делят руководства Google и Apple — это договорённость, к которой люди привыкли.

  - id: uix-014
    topic: Как человек видит
    subtopic: Иерархия и группировка
    level: middle
    question: |
      В каталоге электронной библиотеки разработчик обвёл рамкой каждую строку карточки книги: название, автора,
      год, кнопку «Читать». Список выглядит шумным, и трудно понять, где кончается одна книга и начинается
      следующая. Что поможет вернее всего?
    options:
      - text: 'Убрать рамки у строк, разделить их отступами, а фон оставить карточке'
        correct: true
        why: 'Одна общая область — карточка — объединяет книгу, а отступы внутри неё тише рамок. Рамки у каждой строки делили карточку на равные куски и ломали группировку.'
      - text: 'Оставить рамки у строк, но сделать их светлее, чтобы шума стало меньше'
        why: 'Шума станет меньше, но каждая строка по-прежнему в своей рамке. Карточка так и делится на равные куски, и границы между книгами не видно.'
      - text: 'Заменить рамки у строк цветным фоном своего оттенка для каждой строки'
        why: 'Фон — тоже общая область, только для каждой строки отдельно. Разноцветные полосы шумят не меньше рамок и так же дробят книгу на части.'
      - text: 'Убрать и рамки, и фон, оставив одинаковые отступы между всеми строками'
        why: 'Равные отступы везде — тоже ошибка: внутри книги и между книгами одно и то же расстояние, и групп не видно.'
    explanation: |
      Есть несколько способов сказать «это вместе»: **близость**, **сходство**, **общая область** (общая рамка
      или фон) и **связность**. Граница — очень сильный сигнал, но рамка у каждого блока создаёт шум и дробит
      группу. Порядок выбора: сначала отступы, потом фон, линии и рамки — когда больше ничего не помогает.
      Здесь достаточно одной общей области на книгу и отступов внутри неё.

  - id: uix-015
    topic: Как человек видит
    subtopic: Иерархия и группировка
    level: senior
    question: |
      Каршеринг делает два экрана со списком машин. Клиент в приложении видит пять-шесть машин рядом с собой.
      Оператор диспетчерской весь день следит за тремя сотнями машин на мониторе и должен видеть как можно
      больше строк сразу. Как отделять машины друг от друга на экране оператора?
    options:
      - text: 'Фоном через строку или тонкой линией: на большие промежутки нет места'
        correct: true
        why: 'Отступы — самое тихое средство, но у оператора они съели бы строки. Когда отступов мало, группу отделяют фоном или тонкой линией — шума немного, а строк на экране много.'
      - text: 'Такими же большими промежутками между строками, как в клиентском приложении'
        why: 'В клиентском приложении это правильный выбор, но у оператора на экран влезет втрое меньше машин, и он будет постоянно прокручивать.'
      - text: 'Рамкой вокруг каждой ячейки таблицы, чтобы границы были видны точно'
        why: 'Рамка у каждой ячейки дробит строку на куски и создаёт сетку шума — машина как целое при этом теряется.'
      - text: 'Никак не отделять: оператор опытный и быстро привыкнет'
        why: 'Привыкнуть можно, но ошибаться строкой при беглом взгляде будет и опытный оператор. Разделение стоит почти ничего.'
    explanation: |
      Чем отделять группы, зависит от плотности. На свободном клиентском экране хватает отступов: внутри
      группы тесно, между группами просторно. В плотном рабочем экране места на просторные промежутки нет,
      и тогда группы отделяют фоном — например, через строку — или тонкой линией. Рамки у каждой ячейки —
      крайний случай: они шумят и дробят строку.

