      - text: 'Каждую строку превратить в карточку с подписями к каждому числу'
        why: 'Карточки удобны, чтобы рассмотреть одну строку. Сравнивать числа между карточками трудно: они не стоят друг под другом.'
      - text: 'Оставить в строке только название, а остатки показывать по нажатию'
        why: 'Это хорошо, когда ищут одну строку. Для сравнения пришлось бы открывать товары по одному и держать числа в голове.'
      - text: 'Уменьшить шрифт таблицы, пока она целиком не влезет в экран телефона'
        why: 'Таблица влезет, но станет нечитаемой, а цели для пальца — крошечными. Это меняет одну проблему на две.'
    explanation: |
      У таблицы на узком экране три способа: **карточки** (удобно рассмотреть одну строку), **главное и раскрытие**
      (удобно найти конкретную строку) и **прокрутка вбок** в своей рамке с закреплённым первым столбцом (удобно
      сравнивать столбцы). Выбор зависит от задачи человека. Плохо, когда таблица уезжает вбок вместе со всей
      страницей.

