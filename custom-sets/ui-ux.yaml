      - text: '«Ошибка формата даты. Проверьте введённые данные ещё раз»'
        why: 'Упрёка нет, но и выхода тоже: человек не знает, что не так — формат у него правильный, ошибка в самой дате.'
      - text: '«Неверная дата! Будьте внимательнее при вводе»'
        why: 'Сообщение обвиняет человека и не говорит, что исправить. Восклицательный знак звучит как окрик.'
      - text: '«Дата рождения не прошла проверку регулярным выражением»'
        why: 'Это слова разработчика. Человек не знает, что такое регулярное выражение и что с ним делать.'
    explanation: |
      Сообщение об ошибке **не упрекает** человека и **даёт выход**: говорит, что именно не так и что исправить.
      Но сначала стоит спросить, нужна ли ошибка вообще. Дату «5.9.90» программа может понять и привести к виду
      05.09.1990 сама — это терпимый ввод. А 31 февраля исправить за человека нельзя: тут нужно сообщение.

  - id: uix-087
    topic: Слова и система
    subtopic: Тексты в интерфейсе
    level: middle
    question: |
      В приложении доставки продуктов то, что человек набрал до оплаты, на одном экране называется «Корзина», на другом —
      «Пакет», на третьем — «Мой заказ». Люди пишут в поддержку, что «пакет пропал из заказа». Что изменить?
    options:
      - text: 'Выбрать одно слово для этого понятия и использовать его везде'
        correct: true
        why: 'Разные слова для одного заставляют думать, что это разные вещи. Одно слово во всём приложении убирает путаницу; помогает словарь интерфейса.'
      - text: 'Добавить на каждый экран пояснение, что эти слова означают одно'
        why: 'Пояснение лечит симптом: люди всё равно будут путаться между тремя словами. Проще оставить одно.'
      - text: 'Оставить «Корзину» на главной, а остальные экраны не трогать'
        why: 'Путаница останется на тех экранах, где «Пакет» и «Мой заказ», — там, где люди и пишут в поддержку.'
      - text: 'Заменить все три слова одним значком корзины без подписи'
        why: 'Значок без подписи понимают по-разному, а «Мой заказ» после оплаты — уже другое понятие, его не стоит прятать.'
    explanation: |
      **Единообразие**: одно и то же называется одинаково и выглядит одинаково.
      Разные слова для одного действия или понятия заставляют людей думать, что они разные. Короткий **словарь
      интерфейса** — список понятий и слов для них — помогает держать единообразие, когда тексты пишут разные люди.

