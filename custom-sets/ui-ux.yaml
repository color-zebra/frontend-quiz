    level: middle
    question: |
      Приложение такси при каждом заказе просит выбрать способ оплаты из четырёх. Девять клиентов из десяти каждый раз
      выбирают одну и ту же свою карту. Какое значение по умолчанию поставить?
    options:
      - text: 'Способ, которым этот человек платил в прошлый раз'
        correct: true
        why: 'Хорошее значение по умолчанию — то, что выбрал бы сам человек. Большинству не придётся делать лишний шаг, а остальные легко поменяют.'
      - text: 'Наличные: так никто случайно не заплатит не той картой'
        why: 'Большинство платит картой, и наличные придётся менять почти каждому. Значение по умолчанию, которое почти всех заставляет переключать, — плохое.'
      - text: 'Новую карту партнёрского банка с кэшбэком, которую продвигает компания'
        why: 'Это значение выгодно компании, а не человеку. Подставлять по умолчанию то, что выгодно себе, — шаг к тёмному паттерну.'
      - text: 'Ничего не выбирать, чтобы не решать за человека'
        why: 'Пустой выбор заставляет девять из десяти делать одно и то же действие на каждом заказе. Решить за человека то, что он и так выбирает, — забота, а не давление.'
    explanation: |
      **Значение по умолчанию** — то, что уже выбрано, когда человек открывает экран. Большинство его не меняет,
      поэтому это сильное решение. Хорошее значение по умолчанию экономит шаги: последний способ оплаты, свой клуб,
      сегодняшний день. Правило — выбирать то, что выбрал бы сам человек, а не то, что выгодно компании.

  - id: uix-064
    topic: Поведение
