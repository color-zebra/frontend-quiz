    topic: Слова и система
    subtopic: Тексты в интерфейсе
    level: middle
    question: |
      В онлайн-кинотеатре раздел «Смотреть позже» при открытии на долю секунды показывает «Список пуст. Добавляйте
      фильмы, чтобы не потерять», а потом появляются сохранённые фильмы. Некоторые зрители успевают испугаться,
      что список пропал. Как исправить?
    options:
      - text: 'Показывать загрузку, пока список грузится, а «пусто» — когда пусто'
        correct: true
        why: 'Пустое состояние сообщает, что данных нет. Показанное во время загрузки, оно врёт: данные есть, просто ещё не пришли.'
      - text: 'Сделать текст пустого состояния мягче, чтобы он меньше пугал зрителей'
        why: 'Мягкий текст по-прежнему говорит неправду: список не пуст. Пугает не тон, а ложное сообщение.'
      - text: 'Убрать пустое состояние совсем, оставив белый экран до загрузки'
        why: 'Белый экран тоже ничего не объясняет, а у тех, у кого список действительно пуст, пропадёт подсказка и действие.'
      - text: 'Показывать пустое состояние дольше, чтобы его успели прочитать до конца'
        why: 'Чем дольше висит ложное «пусто», тем сильнее испуг. Нужно не дольше, а вовремя.'
    explanation: |
      **Пустое состояние** говорит, почему пусто, что здесь появится, и даёт действие. Но показывать его можно, только
      когда данных действительно нет. Во время загрузки нужен индикатор: «пусто» на месте ещё не пришедших данных
      пугает людей и подрывает доверие.
    links:
      - https://www.nngroup.com/articles/empty-state-interface-design/

