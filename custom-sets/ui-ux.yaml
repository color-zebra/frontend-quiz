        why: 'Сообщение ничего не спрашивает: для него хватит плашки или изменения самой кнопки. Окно прерывает каждое добавление.'
      - text: 'Выбор места в самолёте, где нужно видеть схему салона под окном'
        why: 'Окно закроет то, что нужно для решения. Когда человеку надо видеть контекст, модальное окно — плохой выбор.'
    explanation: |
      По рекомендациям Nielsen Norman Group модальное окно уместно, когда прерывание стоит своей цены: **критичное предупреждение**
      перед необратимым, **данные, без которых нельзя продолжить**, сложная задача по шагам. Неуместно — для
      рекламы, для сообщений без вопроса и для решений, где нужно видеть то, что окно закрывает.
    links:
      - https://www.nngroup.com/articles/modal-nonmodal-dialog/

  - id: uix-058
    topic: Поведение
    subtopic: Окна, шторки и сообщения
    level: senior
    question: |
      В CRM удаление клиента сразу уходит во внешнюю бухгалтерскую систему, и вернуть его нельзя ни в CRM, ни там.
      Сейчас перед удалением показывается «Вы уверены? Да / Нет», и менеджеры иногда удаляют не того клиента.
      Как сделать подтверждение?
    options:
      - text: 'Назвать клиента и последствия, а на кнопках — сами действия'
        correct: true
        why: 'Действие необратимо, поэтому подтверждение нужно. Говорящее подтверждение показывает, кого именно удаляют и что пропадёт, — по нему менеджер замечает ошибку.'
      - text: 'Заменить подтверждение плашкой «Клиент удалён. Вернуть»'
        why: 'Вернуть нечего: по условию удаление сразу уходит во внешнюю систему. Плашка обещала бы то, чего нет.'
      - text: 'Оставить «Вы уверены?», но сделать кнопку «Да» ярко-красной'
        why: 'Цвет кнопки не говорит, кого удаляют. Менеджер по-прежнему не увидит, что выбрал не того клиента.'
      - text: 'Требовать пароль администратора при каждом удалении клиента'
        why: 'Пароль защищает от посторонних, а не от ошибки: менеджер введёт его и удалит не того клиента так же уверенно.'
    explanation: |
      Подтверждение уместно перед **необратимым** действием, но работает только **говорящее**: оно называет объект
      («Удалить клиента ООО „Вектор“?»), последствия («пропадут 14 сделок, вернуть нельзя») и действия на кнопках
      вместо «Да» и «Нет». Для обратимых действий подтверждение лучше заменить отменой.

