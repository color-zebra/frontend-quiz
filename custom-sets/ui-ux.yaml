    level: junior
    question: |
      В приложении такси перед заказом появляется окно «Подтвердите действие» с кнопками «Нет» и «Да». Какой текст
      для кнопки подтверждения лучше всего?
    options:
      - text: '«Заказать такси за 450 ₽»'
        correct: true
        why: 'Кнопка сама называет результат и цену: человек понимает, что произойдёт, не читая заголовок окна.'
      - text: '«Да, подтверждаю»'
        why: 'Слов больше, но смысла не прибавилось: какое действие — всё равно нужно догадываться по заголовку.'
      - text: '«ОК», как во многих приложениях'
        why: '«ОК» ничего не говорит о результате. Привычность здесь не спасает: человек должен понять, что нажимает.'
      - text: '«Подтвердить» с галочкой рядом'
        why: 'Галочка и «Подтвердить» по-прежнему не называют, что именно подтверждается и сколько это стоит.'
    explanation: |
      Хорошая кнопка **называет результат**: «Заказать такси за 450 ₽», «Оплатить 900 ₽», «Отменить запись». GOV.UK
      советует описывать в тексте кнопки действие, которое она выполняет, и не экономить слова, если они нужны для
      ясности. Кнопки «ОК» и «Да» заставляют человека догадываться по заголовку.
    links:
      - https://design-system.service.gov.uk/components/button/

  - id: uix-084
    topic: Слова и система
    subtopic: Тексты в интерфейсе
    level: junior
    question: |
      При переводе в мобильном банке, когда на карте не хватает денег, появляется сообщение «Error:
      INSUFFICIENT_FUNDS». Как его лучше переписать?
    options:
      - text: '«Не хватает 1 200 ₽. Пополните карту или выберите другую»'
        correct: true
        why: 'Сообщение обычными словами говорит, что не так и сколько не хватает, и предлагает выход. Код ошибки человеку не нужен.'
      - text: '«Ошибка: недостаточно средств на счёте (INSUFFICIENT_FUNDS)»'
        why: 'Перевод кода — уже лучше, но выхода нет: человек не знает, сколько не хватает и что делать дальше.'
      - text: '«Произошла ошибка. Повторите попытку позже»'
        why: 'Сообщение расплывчатое и обманчивое: позже денег на карте не прибавится, повтор не поможет.'
      - text: '«Вы пытаетесь перевести больше, чем у вас есть на карте»'
        why: 'Это упрёк, а не помощь: сообщение обвиняет человека и не говорит, как решить проблему.'
    explanation: |
      Правила Nielsen Norman Group для сообщений об ошибках: у места ошибки, **обычными словами** без кодов, **точно**, с **выходом**,
      **без упрёка**, с сохранением введённого. «Error: INSUFFICIENT_FUNDS» — слова сервера, а не человека. Хорошее
      сообщение отвечает на два вопроса: что случилось и что делать.
    links:
      - https://www.nngroup.com/articles/error-message-guidelines/

