      выхода; с выходом, но с кодом; с причиной, но с упрёком.

  - id: uix-089
    topic: Слова и система
    subtopic: Своя дизайн-система
    level: junior
    question: |
      В приложении для изучения языков все главные кнопки покрашены переменной `--blue-500`. Для тёмной темы кнопкам нужен цвет
      светлее. Если просто поменять значение `--blue-500` на светлый оттенок, где-то в приложении сломаются другие
      места, которые тоже её используют. Как назвать токен кнопок правильно?
    options:
