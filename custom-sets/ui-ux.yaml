    question: |
      В истории операций мобильного банка расходы показаны красным числом, доходы — зелёным, оба без знака
      «минус» или «плюс»: «2 400 ₽». Что здесь не так и как исправить?
    options:
      - text: 'Смысл держится только на цвете: добавить к суммам «−» и «+»'
        correct: true
        why: 'Красный и зелёный хуже всего различают люди с нарушением цветового зрения — это примерно каждый двенадцатый мужчина. Знак передаёт смысл при любом зрении, а цвет остаётся подсказкой.'
      - text: 'Цвета недостаточно яркие: сделать красный и зелёный насыщеннее'
        why: 'Насыщенность не поможет тем, кто не различает эти два цвета: для них яркие красный и зелёный всё равно похожи.'
      - text: 'Зелёный и красный путают: заменить их на синий и оранжевый'
        why: 'Другая пара цветов различима лучше, но смысл всё равно держится только на цвете. Нужен второй признак — знак, слово или значок.'
      - text: 'Всё в порядке: красный и зелёный — понятная всем договорённость'
        why: 'Договорённость понятна тем, кто различает эти цвета. Для каждого двенадцатого мужчины расход и доход выглядят похоже.'
    explanation: |
      Правило WCAG (уровень A): **цвет не должен быть единственным способом передать смысл**. Нарушения цветового
      зрения есть примерно у одного мужчины из двенадцати и у одной женщины из двухсот, чаще всего это «красно-зелёные».
      К цвету добавляют текст, знак, значок или форму; цвет при этом остаётся и помогает тем, кто его различает.

