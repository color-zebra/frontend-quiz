      - text: 'Сделать липкую кнопку полупрозрачной, чтобы поле просвечивало сквозь неё'
        why: 'Сквозь полупрозрачную кнопку текст поля будет плохо виден, а сама кнопка потеряет контраст. Поле должно быть видно, а не просвечивать.'
      - text: 'Поднять полю z-index, чтобы оно оказалось поверх кнопки'
        why: 'Тогда поле наложится на кнопку и закроет её. Нужно не перекрытие, а чтобы поле и кнопка стояли рядом.'
      - text: 'Оставить как есть: стандарт допускает перекрытие, если поле можно прокрутить'
        why: 'Требование WCAG «фокус не закрыт» как раз запрещает полностью закрывать элемент с фокусом липкими панелями. Это уровень AA.'
    explanation: |
      **Фокус не закрыт** (требование WCAG уровня AA): элемент с фокусом не должен быть полностью закрыт содержимым страницы — липкими
      шапками, подвалами, баннерами. Липкая кнопка над клавиатурой — частый случай. Решение из пояснений к стандарту —
      `scroll-padding` у прокручиваемой области на высоту липкой панели: тогда поле с фокусом прокручивается с запасом.
    links:
      - https://www.w3.org/WAI/WCAG22/Understanding/focus-not-obscured-minimum.html

