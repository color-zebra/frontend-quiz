      - text: 'Только при нажатии «Зарегистрироваться», все ошибки разом'
        why: 'Человек узнает об ошибках поздно, когда уже ушёл от поля, и вернётся исправлять всё сразу. В опыте Вроблевски проверка только при отправке работала хуже.'
      - text: 'Во время ввода, но с задержкой в полсекунды после каждой буквы'
        why: 'Задержка смягчит мигание, но человека всё равно будут ругать за незаконченный адрес, пока он печатает.'
      - text: 'Никогда не показывать: неверный адрес проверит письмо с подтверждением'
        why: 'Человек с опечаткой в адресе так и не получит письмо и не поймёт почему. Ошибку дешевле поймать в форме.'
    explanation: |
      Ошибку поля, которую показывают во время ввода, человек воспринимает как упрёк за незаконченное. В небольшом
      опыте Люка Вроблевски лучше всего работала проверка **после ухода из поля** — быстрее, меньше ошибок,
      выше удовлетворённость; автор сам называет цифры ориентировочными. При отправке показывают все оставшиеся ошибки,
      каждую у своего поля.
    links:
      - https://alistapart.com/article/inline-validation-in-web-forms/

  - id: uix-068
    topic: Поведение
    subtopic: Формы
