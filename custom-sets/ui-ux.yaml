    topic: Проверка и итог
    subtopic: Проверить без дизайнера
    level: senior
    question: |
      Фитнес-студия на одну площадку переделала экран записи. В день приложение открывают около трёхсот раз,
      а записываются около сорока человек.
      Владелец хочет A/B-тест старого и нового экрана, чтобы «точно знать, что стало лучше», и запустить его
      на неделю. Что разумнее?
    options:
      - text: 'Мини-тесты на клиентах: трафика мало, а тесты покажут причины'
        correct: true
        why: 'При таком трафике разницу в A/B-тесте за неделю трудно отличить от случайности. Мини-тесты дёшевы, находят проблемы и объясняют, почему людям трудно.'
      - text: 'A/B-тест на неделю, как хочет владелец: это самый точный способ'
        why: 'A/B-тест точен, когда пользователей много. При трёхстах открытиях в день разница между версиями утонет в случайном разбросе.'
      - text: 'A/B-тест на месяц: тогда данных хватит и причины станут ясны'
        why: 'Данных станет больше, но A/B-тест всё равно скажет только «что лучше», а не почему. Причины показывают тесты с наблюдением.'
      - text: 'Эвристическая оценка силами команды вместо любых тестов'
        why: 'Оценка по эвристикам полезна и дешева, но её делают люди, которые знают интерфейс. Она не заменяет проверки на тех, кто экран не видел.'
    explanation: |
      **A/B-тест** показывает, какая версия лучше, на настоящих людях, но ему нужен большой трафик, и он не объясняет
      **почему**. Для небольшого продукта обычно полезнее мини-тесты на пяти людях: дёшево, быстро и видно причины.
      Эвристическая оценка — хорошее дополнение, но не замена проверке на людях, которые экран не видели.

  - id: uix-101
    topic: Проверка и итог
    subtopic: Разбор экрана
    level: junior
    question: |
      ![Экран покупки билетов в кино: мелкое название фильма, схема мест красными и зелёными прямоугольниками, бледный абзац о возврате, внизу серая кнопка «Оплатить» и ссылка «изменить места»](images/uix-q-case-cinema.png "Экран покупки билетов в кино")

      Человек выбрал два места и хочет купить билеты. Что на этом экране стоит исправить в первую очередь?
    options:
      - text: 'Сделать «Оплатить» основной кнопкой и написать в ней сумму'
        correct: true
        why: 'Главная задача экрана — оплатить, а кнопка серая и выглядит отключённой. Сначала исправляют то, что мешает выполнить главную задачу.'
      - text: 'Подписать свободные и занятые места словами или значками'
        why: 'Проблема настоящая, но человек уже выбрал места. Сейчас ему мешает кнопка оплаты, которая выглядит отключённой.'
      - text: 'Вынести правило возврата к кнопке и посчитать время за человека'
        why: 'Это важно, но вторично: без заметной кнопки до оплаты не дойдут. Сначала исправляют то, что мешает главной задаче.'
      - text: 'Сделать «изменить места» кнопкой, чтобы её было лучше видно'
        why: 'Это второстепенное действие, и ссылка для него уместна. Если сделать его заметнее, оно начнёт спорить с оплатой.'
    explanation: |
      Экран переделывают по порядку: сначала **главное действие и иерархия**, потом читаемость, потом крайние случаи
      и состояния. Здесь главная задача — оплатить, и кнопка должна быть единственной основной на экране и называть
      результат: «Оплатить 1 200 ₽».

  - id: uix-102
    topic: Проверка и итог
    subtopic: Разбор экрана
    level: middle
    multiple: true
    question: |
      ![Экран покупки билетов в кино: схема мест красными и зелёными прямоугольниками, бледный абзац о возврате, серая кнопка «Оплатить»](images/uix-q-case-cinema.png "Экран покупки билетов в кино")

      Какие из проблем действительно есть на этом экране?
    options:
      - text: 'Свободные и занятые места различаются только красным и зелёным'
        correct: true
        why: 'Для людей с самым частым нарушением цветового зрения красный и зелёный почти одинаковы. Смысл не должен держаться только на цвете.'
      - text: 'Правило возврата набрано бледным текстом вдали от кнопки оплаты'
        correct: true
        why: 'Условие «вернуть можно не позднее чем за 30 минут до сеанса» набрано бледно-серым, его легко пропустить, и оно стоит далеко от решения о покупке. Его стоит вынести к кнопке и посчитать время: «Вернуть можно до 21:10».'
      - text: 'Кнопка «Оплатить» серая и выглядит как отключённая'
        correct: true
        why: 'Главное действие оформлено как неактивное: человек может решить, что что-то не выбрано, и не нажать.'
      - text: 'На экране слишком мало элементов, и он выглядит пустоватым и бедным'
        why: 'Пустое место — не проблема: экрану нужно меньше, а не больше. Беда в том, как оформлены нужные элементы.'
      - text: 'Постер фильма стоит вверху, а не внизу экрана'
        why: 'Постер вверху — привычное место, оно ничему не мешает. Проблемы экрана — в цвете мест, тексте и кнопке.'
    explanation: |
      Разбор экрана — это список проблем, у каждой из которых есть правило: **смысл не только цветом** (стандарт WCAG),
      **важное не набирают бледным мелким текстом** (стандарт контраста), **важное условие — у действия**
      (эвристика «узнавание вместо вспоминания»), **одна заметная основная кнопка** (договорённость и эффект
      «выпрыгивания»).
      Пустое место само по себе проблемой не является.

