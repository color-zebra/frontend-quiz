      его тёмный оттенок с достаточным контрастом. Исключения WCAG касаются логотипов, а не интерфейса с фирменной
      раскраской.

  # ===================== Телефон и экраны =====================
  - id: uix-035
    topic: Телефон и экраны
    subtopic: Палец, а не курсор
    level: junior
    question: |
      В музыкальном приложении кнопка «следующий трек» — значок 18 пикселей без отступов вокруг. Люди часто
      промахиваются, особенно на ходу. Дизайнер хочет, чтобы значок остался таким же лёгким на вид. Что сделать?
    options:
      - text: 'Оставить значок, а область нажатия расширить до 44 × 44 отступами'
        correct: true
        why: 'Область нажатия не обязана совпадать с видимым значком. Отступы делают цель удобной для пальца, а внешний вид не меняется.'
      - text: 'Сделать значок толще и контрастнее, чтобы его было лучше видно'
        why: 'Его и так видно — промахиваются не потому, что не видят. Палец касается пятном, и в 18 пикселей не попасть, каким бы контрастным ни был значок.'
      - text: 'Перенести кнопку в угол экрана, где её проще всего найти'
        why: 'Углы — как раз худшее место для пальца: туда попадают хуже всего. Это правило мыши, у которой курсор упирается в край.'
      - text: 'Убрать кнопку на ходу и оставить переключение треков свайпом по обложке'
        why: 'Скрытый жест о себе не сообщает: многие о нём не узнают и потеряют кнопку. Беда не в кнопке, а в том, что в 18 пикселей трудно попасть пальцем.'
    explanation: |
      Палец касается пятном шириной 1,6–2 сантиметра, поэтому цели для пальца делают около 44 пикселей: у Apple —
      44 × 44 пункта, у Google — 48 × 48 dp. **Область нажатия** может быть больше видимого элемента: значок 18 пикселей
      с отступами вокруг нажимается на площади 44 × 44. Так интерфейс остаётся лёгким, а в цель легко попасть.
    links:
      - https://www.nngroup.com/articles/touch-target-size/

  - id: uix-036
    topic: Телефон и экраны
    subtopic: Палец, а не курсор
    level: junior
    question: |
      В интернет-магазине одежды таблица размеров появляется, когда наводишь курсор на значок «?» рядом с выбором
      размера. На компьютере покупатели ею пользуются, а с телефона почти никто. Почему?
    options:
      - text: 'У телефона нет наведения, и таблицу там нельзя открыть'
        correct: true
        why: 'На компьютере есть состояние «курсор над элементом», у пальца его нет: палец либо касается, либо нет. Всё, что нужно, не должно открываться только наведением.'
      - text: 'На телефоне значок «?» слишком мелкий, его не замечают'
        why: 'Даже заметив значок, человек ничего не откроет: подсказка привязана к наведению, которого у телефона нет.'
      - text: 'С телефона покупают другие люди, которым таблица не нужна'
        why: 'Размер нужно выбрать при любой покупке одежды. Дело не в людях, а в том, что на телефоне таблица недоступна.'
      - text: 'Мобильный браузер не умеет показывать всплывающие подсказки'
        why: 'Показать всплывающий блок браузер может, но его нечем вызвать: событие наведения пальцем не происходит.'
    explanation: |
      У пальца нет промежуточного состояния «над элементом», поэтому всё, что нужно для работы, не должно появляться
      только при наведении. На телефоне подсказку открывают нажатием или показывают сразу. В CSS можно узнать, есть ли
      наведение: `@media (hover: hover)`, и насколько точен указатель: `@media (pointer: coarse)`. Ими добавляют удобства
      на компьютере, а не прячут нужное на телефоне.

