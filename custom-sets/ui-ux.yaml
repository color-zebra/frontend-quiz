      - text: 'Врач без фото, которого ещё не успели сфотографировать для сайта'
        correct: true
        why: 'Без фото на его месте окажется пустая рамка или значок сломанной картинки. Нужна заранее продуманная заглушка, например инициалы.'
      - text: 'Новый врач без отзывов и рейтинга, где число отзывов равно нулю'
        correct: true
        why: 'Ноль — крайний случай, который легко пропустить: «0 · 0 отзывов» выглядит как плохая оценка. Для нового врача нужен свой текст.'
      - text: 'Те же данные из макета, но на компьютере с большим монитором'
        why: 'Ширина экрана — отдельная проверка. Удобные данные из макета не покажут ни длинного имени, ни отсутствия фото.'
      - text: 'Данные, которые разработчик сам ввёл в тестовую базу за последнюю неделю'
        why: 'Тестовые данные обычно такие же удобные, как в макете: их вводит человек, который знает, как должно выглядеть.'
    explanation: |
      Макет обычно рисуют на удобных данных. Экран проверяют на **крайних случаях содержимого**: очень длинные
      имена и слова, нет картинки, ноль, один и очень много элементов, большие числа. Для каждого случая
      решают заранее: перенести, обрезать с подсказкой, показать заглушку. Обрезать стоит только то, что можно
      прочитать иначе: имя, по которому человека отличают, обрезать нельзя.

