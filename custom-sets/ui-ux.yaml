    question: |
      В почтовом сервисе перед каждым удалением письма появляется «Вы уверены? Да / Нет». Пользователи жалуются,
      что всё равно удаляют нужные письма: «нажимаю Да не глядя». Удалённое письмо технически можно вернуть.
      Что изменить?
    options:
      - text: 'Удалять сразу и показывать плашку «Письмо удалено. Вернуть»'
        correct: true
        why: 'К частому вопросу привыкают и перестают его читать. Если действие обратимо, лучше выполнить его сразу и дать отменить: передумать можно, а лишнего шага нет.'
      - text: 'Сделать окно «Вы уверены?» красным, чтобы его читали внимательнее'
        why: 'Цвет не отменяет привычку: окно, которое появляется на каждом удалении, всё равно начнут закрывать не глядя.'
      - text: 'Спрашивать два раза подряд: «Вы уверены?» и «Точно удалить?»'
        why: 'Второй вопрос привыкнут проходить так же, как первый, а удаление станет вдвое медленнее.'
      - text: 'Убрать кнопку удаления, оставив только перенос в архив'
        why: 'Людям действительно нужно удалять письма. Задача — уберечь от ошибки, а не отнять возможность.'
    explanation: |
      Частые и расплывчатые подтверждения «Вы уверены?» приучают нажимать «Да» не читая — Якоб Нильсен сравнивает
      это с криком «Волки!». Для **обратимых** действий надёжнее отмена: действие выполняется сразу, а плашка
      «Вернуть» даёт время передумать. Подтверждение оставляют для **необратимого**.
    links:
      - https://www.nngroup.com/articles/confirmation-dialog/

  - id: uix-055
    topic: Поведение
    subtopic: Окна, шторки и сообщения
    level: middle
    question: |
      В облачном хранилище после удаления файла внизу появляется плашка «Файл удалён. Вернуть» и исчезает через три
      секунды. Люди не успевают её нажать и пишут в поддержку. Как исправить по правилам доступности и гайдам?
    options:
      - text: 'Держать плашку с «Вернуть», пока человек не сделает другое действие'
        correct: true
        why: 'WCAG требует, чтобы лимит времени можно было отключить или продлить, и разбирает именно исчезающие сообщения. В документации Google для Android плашка с действием тоже не должна исчезать сама.'
      - text: 'Увеличить время показа плашки с трёх секунд до пяти'
        why: 'Пять секунд — по-прежнему лимит, который человек не может продлить. Кто-то не успеет и за пять, особенно с ограничениями движения или зрения.'
      - text: 'Показывать вместо плашки модальное окно «Файл удалён» с кнопкой «Вернуть»'
        why: 'Окно не исчезнет, но будет прерывать каждое удаление, даже когда человек ничего возвращать не собирается.'
      - text: 'Перенести плашку в верх экрана, где её заметят быстрее'
        why: 'Место не решает главного: плашка всё равно исчезнет через три секунды, и успеть нажать по-прежнему трудно.'
    explanation: |
      **Регулируемый лимит времени** (требование WCAG уровня A): лимит времени можно отключить, увеличить хотя бы
      в десять раз или продлить
      по предупреждению. Пояснения W3C прямо разбирают сообщение, исчезающее через пять секунд. Плашку с действием
      «Вернуть» надёжнее держать, пока человек не сделает что-то ещё, и ставить так, чтобы она не закрывала
      навигацию.
    links:
      - https://www.w3.org/WAI/WCAG22/Understanding/timing-adjustable.html

  - id: uix-056
    topic: Поведение
    subtopic: Окна, шторки и сообщения
    level: middle
    question: |
      На сайте авиакомпании при ошибках в данных пассажира вверху экрана на четыре секунды появляется красная плашка
      «Проверьте данные пассажира». В форме двенадцать полей. Что не так и как лучше?
    options:
      - text: 'Показывать каждую ошибку у её поля и не скрывать до исправления'
        correct: true
        why: 'Человеку нужно понять, какое из двенадцати полей не так, и сверяться с подсказкой, пока он исправляет. Сообщение у поля не исчезает, пока ошибка не исправлена.'
      - text: 'Держать плашку вверху экрана, пока человек её не закроет сам, вручную'
        why: 'Плашка перестанет исчезать, но по-прежнему не скажет, какое поле неверное, — человеку придётся проверять все двенадцать.'
      - text: 'Показать модальное окно со списком всех ошибок формы'
        why: 'Окно закроет форму, а исправлять ошибки нужно именно в ней. Закрыв окно, человек снова не видит, что было не так.'
      - text: 'Сделать плашку крупнее и добавить звук, чтобы её точно заметили'
        why: 'Беда не в заметности, а в том, что сообщение общее и исчезает. Громче — не значит понятнее.'
    explanation: |
      Если сообщение относится к **конкретному месту** на экране, его ставят в это место: ошибку — у поля,
      предупреждение — на карточку. Такое сообщение не исчезает, пока проблема не решена, и с ним можно сверяться.
      Плашки — для того, что не требует исправления. Исследователи Nielsen Norman Group тоже советуют показывать ошибки форм рядом
      с проблемой, а не в окне.

