        correct: true
        why: 'При прищуре мелкий бледный текст исчезает в любом варианте, поэтому проверка о нём ничего не говорит. Иерархия может быть правильной, а второстепенный текст — нечитаемым.'
      - text: 'Размыли недостаточно: при более сильном размытии проблема была бы видна'
        why: 'Чем сильнее размытие, тем меньше видно мелкого текста. Никакая степень размытия не покажет, что текст трудно прочитать.'
      - text: 'Иерархия сломана: условия доставки должны быть заметнее, чем цена товара'
        why: 'Цена и кнопка — главное на странице товара, и иерархия это верно отражает. Условия второстепенны, но второстепенное тоже должно читаться.'
      - text: 'Всё в порядке: условия второстепенны, их и не обязаны читать'
        why: 'Второстепенное — значит «замечают позже», а не «не могут прочитать». Покупатель, которому важна доставка, должен суметь её прочитать.'
    explanation: |
      Проверка прищуром или размытием показывает **иерархию**: какие крупные формы и пятна заметны первыми.
      Мелкие детали при этом исчезают, поэтому о **читаемости** проверка ничего не говорит. Второстепенный текст
      можно сделать менее заметным, но он должен оставаться читаемым — размером и контрастом, которые разбирают
      уроки о шрифте и цвете.

