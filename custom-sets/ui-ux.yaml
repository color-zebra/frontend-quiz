      Токены и компоненты не останавливают разнобой сами: кто-то впишет сырое значение, потому что так быстрее.
      Удерживает единообразие **автоматическая проверка** — правило линтера стилей, запрещающее сырые цвета и размеры, —
      плюс **список токенов** рядом с кодом и в подсказках нейросети и страница с примерами компонентов.

