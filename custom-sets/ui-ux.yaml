# Свой набор с уроками: UI и UX дизайн для фронтендера — как человек видит экран, иерархия, отступы, шрифт,
# цвет, палец и экраны разной ширины, состояния, окна и шторки, сценарии, формы, навигация, анимация, тексты,
# своя дизайн-система и проверка без дизайнера. Пример — приложение фитнес-клуба «Абонемент».
# Формат — как у любого стороннего набора (см. examples/README.md). В сборку приложения не входит.
# Уроки перечисляют свои вопросы полем questions; номера вопросов не менять — к ним привязан прогресс людей.
# Картинки — свёрстанные макеты в images/uix-*.png. План — plans/uiux-course.md.
title: UI и UX дизайн
lessons:
  - id: uix-intro
    topic: Введение
    subtopic: UI, UX и доказательность
    title: Красиво и удобно — не дело вкуса
    audio: https://color-zebra.github.io/frontend-quiz-audio/ui-ux/uix-intro.mp3
    questions: [uix-001, uix-002, uix-003, uix-004, uix-106]
    body: |
      ## Какую проблему решаем

      «Абонемент» — веб-приложение сети фитнес-клубов «Форма». В нём смотрят расписание занятий, записываются
      на тренировки, платят за абонемент. Экран расписания сверстал разработчик: дизайнера в команде не было,
      задача была простая, всё работает, тесты зелёные. Через неделю в поддержку приходят жалобы.

      ![Экран расписания «Абонемента» с номерами в местах, на которые жалуются люди](images/uix-intro-complaints.png "Экран расписания до переделки. Номера — места жалоб")

      1. «Не нашла, где записаться» — на экране есть слово «записаться», но мелким серым текстом, как подпись.
      2. «Случайно отменил запись» — крестик отмены стоит вплотную к «перенести», и оба крошечные.
      3. «На телефоне всё мелко» — зал, тренер и число мест набраны мелким бледным шрифтом.
      4. «Оплатил дважды» — после нажатия «Оплатить» ничего не изменилось, и человек нажал ещё раз.

      Разработчик честно не понимает, в чём дело: всё же видно, всё нажимается. Но каждая жалоба — не каприз
      и не вопрос вкуса. За каждой стоит правило, у которого есть причина: как устроены глаз, палец и внимание
      человека. Этот курс — про такие правила. Он нужен, чтобы сделать приличный интерфейс без дизайнера,
      а с дизайнером говорить на одном языке: спорить с макетом по делу, а не «мне кажется».

      ## UI и UX — в чём разница

      Представьте другую жалобу: «Записалась в два касания, удобно. Пришла в клуб — а йогу отменили, тренер
      заболел. Уведомление пришло через час после начала занятия». С экраном записи всё в порядке, а впечатление
      у человека плохое.

      В этой истории видны два разных понятия. **UI** (интерфейс пользователя) — то, что человек видит
      и нажимает: кнопки, текст, отступы, поля. **UX** (опыт пользователя) — всё, что человек переживает, пока
      решает свою задачу с компанией: от уведомления «освободилось место» до прихода в зал. Интерфейс записи
      хорош, а опыт плохой: уведомление об отмене пришло слишком поздно.

      Между ними — **удобство**: насколько легко пользоваться интерфейсом. Удобство всегда меряют в конкретных
      условиях: добился ли человек цели, сколько сил и времени на это ушло и доволен ли он. Условия важны: экран
      может быть удобным за компьютером и неудобным на телефоне в раздевалке, одной рукой.

      Жалобы на экран расписания — про UI и удобство: человек не видит то, что есть, или промахивается мимо нужного.
      А последняя, «оплатил дважды», задевает и UX: человек потерял деньги и потратит ещё время на возврат.

      Фронтендеру важны оба слова. UI он верстает руками каждый день. UX он тоже делает, даже если об этом
      не думает: решает, сколько шагов до записи, что будет при медленной сети, что увидит человек при ошибке.

      ## Почему «на глаз» не работает

      Разработчик смотрит на свой экран иначе, чем человек, который видит его впервые. Это хорошо видно по одному
      простому опыту. Одни участники выстукивали пальцем по столу мелодию известной песни, другие угадывали её.
      Выстукивающие ожидали, что угадают примерно половину песен. Угадали три из ста двадцати. Выстукивающий слышит
      мелодию у себя в голове и не может представить, каково слышать только стук. Опыт провела психолог Элизабет
      Ньютон.

      Это **проклятие знания**: кто знает, тому трудно представить, как это выглядит для того, кто не знает.
      Разработчик знает, где на экране «записаться», — он сам её туда поставил. Поэтому серая подпись для него
      заметна, а для новичка её нет.

      К этому добавляются условия работы:
      - большой монитор вместо телефона, и мелкий текст кажется нормальным;
      - мышь вместо пальца, и в крошечный крестик легко попасть;
      - быстрая сеть, и кнопка «Оплатить» успевает ответить раньше, чем захочется нажать ещё раз;
      - идеальные данные: короткие имена, три занятия в день, всё помещается.

      «Посмотреть внимательно» не помогает: внимательный автор видит то, что знает. Помогают две вещи:
      правила, у которых есть причина, и проверка на людях, которые экран не видели.

      ## Как работает дизайнер

      Дизайнеры защищаются от проклятия знания тем, что встраивают чужие глаза в сам порядок работы: начинают
      с изучения людей и проверяют прототип на тех, кто экран ещё не видел. А между этими шагами идут от схемы
      к цвету, чтобы сначала договориться, что где стоит, и только потом спорить об оттенках. Посмотрим этот путь
      на одной карточке занятия.

      Всё начинается с **изучения пользователей**: разговоров с клиентами, наблюдения, жалоб в поддержку.
      Из него появляется **сценарий** — путь человека по шагам: открыл расписание, нашёл занятие, записался,
      увидел, что запись прошла.

      Потом рисуют **вайрфрейм** — схему экрана серыми блоками. На нём видно, что где стоит и что главное,
      и нет ни цветов, ни шрифтов: спорят о том, где кнопка, а не о её оттенке. Следом идёт **макет** — экран
      в настоящем виде, с текстами, цветами и отступами. А **прототип** связывает макеты переходами: нажал
      «Записаться» — открылся экран «Вы записаны». На прототипе сценарий проверяют на людях раньше, чем кто-то
      напишет код.

      ![Одна карточка занятия на четырёх шагах: сценарий, вайрфрейм, макет, прототип](images/uix-intro-design-stages.png "Сценарий, вайрфрейм, макет и прототип одной карточки занятия")

      Фронтендеру обычно приходят макеты и **UI-кит** — набор готовых компонентов со всеми состояниями: кнопки,
      поля, карточки. Без дизайнера эти шаги проходит сам разработчик, хотя бы коротко: записать сценарий
      и набросать схему экрана на бумаге до того, как открыть редактор.

      ## На чём держатся правила

      Советов по дизайну в интернете тысячи, и многие противоречат друг другу. Чтобы не верить всему подряд,
      полезно спрашивать о каждом правиле: на чём оно держится? Курс отвечает на этот вопрос по ходу объяснения,
      а там, где ответ неочевиден или правило оказывается мифом, говорит об этом отдельной строкой
      **«На чём держится»**. Уровней четыре.

      - **Исследование.** Правило проверили на людях опытом или измерением, и есть публикация, где описано как.
        Часто правило верно только при условиях — тогда они названы. Сюда же курс относит многолетние наблюдения
        исследовательских компаний вроде Nielsen Norman Group: это не академическая наука, но настоящие замеры
        на людях. А вот их советы, за которыми нет опубликованных замеров, курс считает договорённостью.
      - **Стандарт.** Требование записали и приняли организации, и закон может сделать его обязательным. Главный
        стандарт этого курса — **WCAG**, международные правила доступности сайтов: как сделать сайт, которым
        смогут пользоваться люди с плохим зрением и другими ограничениями. Например, он задаёт, насколько
        текст должен отличаться от фона. У требований WCAG три уровня: A — самые базовые, AA — то, что требуют
        законы о доступности во многих странах и большинство заказчиков, AAA — высший, желательный, но обычно
        не обязательный. Уровни вложены: чтобы соответствовать AA, нужно выполнить все требования и уровня A,
        и уровня AA, поэтому законы, ссылаясь на AA, требуют и A. Сам стандарт никого не обязывает: обязательным его
        делают законы и договоры, которые
        на него ссылаются. Поэтому, когда курс пишет «уровень AA, обязательный», это значит «его требуют законы».
      - **Договорённость.** Правило проверено практикой, но это не закон природы. Сюда относятся рекомендации
        Apple и Google для своих платформ, традиции типографики и **эвристики Нильсена** — десять общих правил,
        по которым удобно проверять интерфейс. Их стоит соблюдать, потому что люди к ним привыкли, но с ними
        можно спорить.
      - **Миф.** Правило все повторяют, но оно не подтверждается или выросло из неверно понятого исследования.
        Пример — «в меню должно быть не больше семи пунктов». Рядом с каждым мифом курс говорит, что верно
        вместо него.

      На жалобах «Абонемента» это выглядит так. Серую подпись «записаться» не замечают — это объясняют
      исследования того, как глаз просматривает экран. Крестик отмены слишком мал для пальца — об этом есть и
      исследования, и требование стандарта, и рекомендации Apple и Google.

      Уровень подсказывает, что делать с правилом. Исследование и стандарт нарушают только с очень веской
      причиной. Договорённость нарушают, когда понятно, чем за это заплатят люди, и цена того стоит. Миф просто
      не используют как довод.

      ## Что будет дальше

      Четыре жалобы на экран расписания разбираются в курсе по порядку:
      1. «Не нашла, где записаться» — как человек видит экран и как устроена иерархия: что замечается первым.
      2. «Случайно отменил запись» — палец, а не курсор: размер цели и расстояние между целями.
      3. «На телефоне всё мелко» — отступы, шрифт и цвет: из чего складывается читаемость.
      4. «Оплатил дважды» — состояния элементов: что показывает кнопка, пока идёт оплата.

      Потом мы перейдём к поведению интерфейса: окнам и шторкам, сценариям, формам, навигации и анимации. Дальше —
      к словам на экране и своей маленькой дизайн-системе, к проверке без дизайнера. А в последнем уроке
      переделаем один экран «Абонемента» целиком.

      ## Типичные ошибки

      - **Спорить вкусом.** «Мне так красивее» не убеждает ни дизайнера, ни команду. Убеждает причина: «серую
        подпись не видно на фоне карточки, а действие на этом экране главное».
      - **Считать UX «рисованием экранов».** Двойная оплата — это не про цвет кнопки, а про то, что видит человек,
        пока запрос идёт, и что будет, если он нажмёт ещё раз.
      - **Проверять на себе.** Автор экрана — худший тестировщик своего экрана: он знает, где что лежит.
      - **Верить любому правилу из статьи.** Правило без источника — в лучшем случае договорённость, а иногда миф.

      ## Как обсудить с дизайнером

      Чаще всего фронтендеру присылают один красивый макет на ширине компьютера, где всё заполнено и всё удалось.
      Лучше спросить о недостающем до вёрстки, а не додумывать в коде. Например: «Пришли, пожалуйста, этот экран
      на ширине телефона и что видно, пока идёт оплата и если она не прошла. Иначе я придумаю это сам, и тебе
      может не понравиться».

      Что обычно стоит попросить:
      - сценарий: откуда человек попадает на экран и куда идёт дальше;
      - макеты на ширине телефона, а не только компьютера;
      - все состояния: загрузка, пусто, ошибка, отключено, долгий ответ;
      - UI-кит или хотя бы список цветов, шрифтов и отступов.

      ## Коротко

      - UI — то, что человек видит и нажимает; UX — весь его опыт решения задачи, от уведомления до результата.
        Удобство — насколько легко пользоваться интерфейсом в конкретных условиях.
      - «На глаз» не работает из-за проклятия знания: автор знает свой экран и видит то, что знает. К этому
        добавляются большой монитор, мышь, быстрая сеть и идеальные данные.
      - Дизайнер идёт от изучения пользователей и сценария через вайрфрейм и макет к прототипу. Без дизайнера
        разработчик проходит этот путь сам, хотя бы коротко: сценарий и схема до кода.
      - У каждого правила есть уровень: исследование, стандарт, договорённость или миф. Исследование и стандарт
        нарушают только с веской причиной, миф не используют как довод.
      - Спорить об интерфейсе стоит причинами, а не вкусом: что человек не увидит, не поймёт или не сможет нажать.

      ## Источники

      - [The Definition of User Experience (UX) — Nielsen Norman Group](https://www.nngroup.com/articles/definition-user-experience/)
      - [Usability 101: Introduction to Usability — Nielsen Norman Group](https://www.nngroup.com/articles/usability-101-introduction-to-usability/)

  - id: uix-perception
    topic: Как человек видит
    subtopic: Внимание и просмотр экрана
    title: Как человек видит экран
    audio: https://color-zebra.github.io/frontend-quiz-audio/ui-ux/uix-perception.mp3
    questions: [uix-005, uix-006, uix-007, uix-008, uix-009, uix-010]
    body: |
      ## Какую проблему решаем

      В «Абонементе» запустили акцию: приведи друга — и оба получите месяц занятий в подарок. Маркетолог попросил
      сделать заметно, и разработчик поставил вверху расписания яркий баннер с градиентом. Через месяц выяснилось,
      что по акции пришли единицы, а в опросе большинство клиентов о ней не слышали. Хотя баннер был на самом видном
      месте экрана, который каждый открывает по нескольку раз в неделю.

      ![Расписание с ярким баннером акции над списком занятий](images/uix-perception-banner.png "Акция — ярким баннером вверху расписания")

      Вторая история — продолжение жалобы «не нашла, где записаться» из первого урока. Серую подпись «записаться»
      разработчик заменил настоящей кнопкой, но тоже светло-серой, «чтобы не кричала». Жалоб стало меньше, но
      новички всё равно пишут в поддержку, что не понимают, как записаться.

      Обе проблемы — не про вкус. Они про то, как устроено зрение и внимание: что человек замечает сам,
      что пропускает и как он просматривает экран. Если понимать эти механизмы, можно заранее сказать, где
      важное потеряется.

      ## Чётко глаз видит очень мало

      Кажется, что мы видим весь экран сразу и одинаково чётко. На самом деле чётко глаз видит только маленькое
      пятно в центре взгляда — примерно ноготь большого пальца на вытянутой руке. Всё вокруг размыто, а цельную
      картинку мозг собирает из множества коротких взглядов.

      Поэтому глаз не стоит на месте, а прыгает по экрану несколько раз в секунду. Между прыжками он
      останавливается примерно на четверть секунды, и только в эти остановки по-настоящему видит. Человек
      не «смотрит на экран» — он осматривает его серией коротких остановок.

      Отсюда первое следствие для интерфейса: то, на чём взгляд не остановился, человек не прочитал. А куда
      глаз прыгнет в следующий раз, во многом решает то, что выделяется на экране.

      ## Что замечается сразу

      Если среди одинаковых предметов один отличается цветом, его видно мгновенно — искать не нужно. Неважно,
      сколько вокруг соседей: красный круг среди синих кругов замечаешь сразу. А если красный круг стоит среди
      синих кругов и красных квадратов, он отличается уже не одним признаком, а сочетанием двух: и цветом, и формой.
      Такой круг приходится искать, перебирая фигуры одну за другой.

      ![Слева красный круг среди синих кругов, справа красный круг среди синих кругов и красных квадратов](images/uix-perception-popout.png "Одно отличие видно сразу, сочетание отличий приходится искать")

      Такое мгновенное узнавание называют **«выпрыгиванием»**. Выпрыгивает предмет, который отличается от соседей
      одним простым признаком: цветом, размером, наклоном, движением.

      ![Карточка занятия с серой кнопкой «Записаться» и такая же с зелёной кнопкой](images/uix-perception-signup.png "Отличается только цвет кнопки")

      Теперь серая кнопка «Записаться». На карточке «как было» она похожа на серые метки «Для новичков» и «60 минут»:
      тот же цвет фона, тот же цвет текста. Ей нечем выпрыгнуть, и глаз ищет её перебором. На карточке «как стало»
      кнопка — единственный крупный цветной блок на карточке, и её замечаешь раньше, чем читаешь название занятия.

      Отсюда важное следствие: выпрыгивает одно отличие. Если на экране выделено всё — яркий баннер, красные метки,
      жирные цены, три цветные кнопки, — ни одному из них не на чем выделиться. Как распределять важность между
      элементами экрана, подробно разберём в следующем уроке, об иерархии.

      Движение тоже выпрыгивает, и очень сильно. Поэтому мигающая плашка действительно заметна — и поэтому же
      она раздражает и мешает читать всё остальное.

      ## Как просматривают страницы

      Страницу, которую человек видит впервые, он обычно не читает, а просматривает. Ещё в конце 1990-х Якоб
      Нильсен наблюдал, как люди читают сайты: четверо из пяти участников просматривали новую страницу, и лишь
      каждый шестой читал подряд, слово за словом. Более поздние исследования, где записывали движения глаз,
      показывают ту же картину.

      Исследователи из Nielsen Norman Group много лет записывают, куда смотрят люди, и описали несколько способов
      просмотра текста. Два из них встречаются чаще всего:
      - **F-паттерн.** Глаз читает одну-две строки сверху почти целиком, потом строку пониже, но короче, а дальше
        скользит вниз по левому краю, выхватывая только первые слова строк. Следы взгляда складываются в букву F.
      - **Слоёный пирог.** Глаз пробегает заголовки и подзаголовки, а текст читает только под тем, который нужен.

      Бывает и иначе: человек ищет что-то конкретное — число, слово, ссылку — и перескакивает целые абзацы. А очень
      заинтересованный читатель читает почти всё подряд.

      Сами исследователи подчёркивают: F-паттерн — не схема, под которую надо верстать, а признак плохо
      оформленного текста. Глаз идёт по букве F, когда в тексте нет подсказок — заголовков, выделений, списков.
      Человеку от этого хуже: всё, что не в начале строк и не в первых абзацах, пропадает.

      ![Правила клуба одним сплошным абзацем](images/uix-perception-rules-wall.png "Правила клуба сплошным текстом")

      Правила клуба в «Абонементе» сначала были одним абзацем. Самое важное для клиента — что отменить запись без
      списания можно не позже чем за четыре часа — стоит в середине абзаца, посреди строки. Взгляд пробегает
      верхние строки и дальше скользит по левому краю, а до середины строк почти не доходит. Люди узнают правило,
      когда занятие уже списано.

      ![Те же правила с заголовками, списками и выделенным правилом отмены](images/uix-perception-rules-structured.png "Те же правила с заголовками и списками")

      Те же правила с заголовками и списками глаз просматривает слоёным пирогом: пробегает заголовки «Запись
      и отмена», «Опоздания», «Что взять с собой» и читает раздел, который нужен сейчас. Правило отмены выделено
      жирным и стоит в начале строки.

      ![Схема: на сплошном тексте следы взгляда похожи на букву F, на тексте с заголовками взгляд пробегает заголовки](images/uix-perception-scan-scheme.png "Схема по описаниям Nielsen Norman Group. Это иллюстрация, а не замер")

      Что делать с текстом в интерфейсе:
      - делить его на разделы с заголовками, которые говорят суть: «Запись и отмена», а не «Важное о визитах»;
      - ставить главное в начало: первые слова абзаца, пункта списка, строки;
      - выделять жирным ключевое — немногое, иначе выделение перестанет работать;
      - перечисления давать списком, а не через запятую в абзаце.

      ## Баннерная слепота

      Теперь понятно, что случилось с акцией. Люди привыкли, что реклама на сайтах — это яркие прямоугольники
      в привычных местах: полоса вверху, колонка справа. И научились пропускать их, не глядя. Это называется
      **баннерная слепота** (banner blindness): человек пропускает всё, что принимает за рекламу, — даже если это
      не реклама, а нужная ему информация.

      Явление заметили ещё в конце 1990-х, и исследователи с тех пор не раз подтверждали его, записывая движения
      глаз. Пропускают:
      - то, что стоит на привычных для рекламы местах: верхняя полоса, правая колонка;
      - то, что оформлено не так, как всё остальное: прямоугольник с цветным фоном, градиентом, текстом на картинке;
      - то, что стоит рядом с рекламой: решив, что блок рекламный, человек пропускает всю область.

      Баннер в «Абонементе» попал сразу под две приметы рекламы: верхняя полоса экрана и кричащее оформление —
      градиент, крупный текст с восклицательным знаком. Глаз узнал рекламу раньше, чем прочитал слова.

      ![Та же акция в виде обычной карточки в списке занятий](images/uix-perception-promo-card.png "Та же акция: оформлена и стоит как обычная карточка")

      Что сделали: убрали обе приметы. Текст акции остался прежним, но теперь это белая карточка, как у занятий,
      с обычным шрифтом и спокойной кнопкой, и стоит она в списке, а не над ним. Чтобы акцию заметили, ей не нужно
      кричать: достаточно выглядеть как часть приложения, а не как реклама поверх него. Верный ли это выбор,
      окончательно покажет только проверка на людях.

      ## Миф: «ниже первого экрана не прокручивают»

      **Первый экран** — то, что видно без прокрутки. Долго считалось, что ниже него никто не смотрит, и всё важное
      пытались втиснуть наверх. Но когда это измерили, оказалось иначе: на первый экран приходится больше половины
      времени просмотра, а первые три экрана вместе — около четырёх пятых. Люди прокручивают, но умеренно и когда
      есть причина.

      Для «Абонемента» это значит: длинное расписание на день — не беда. Если вверху видно, что это сегодняшние
      занятия и их можно листать, вечерние занятия внизу найдут. Верх страницы по-прежнему видят больше всего,
      поэтому главное ставят туда. Но втискивать всё в первый экран не нужно: плотная каша сверху хуже, чем ясный
      верх и понятное продолжение ниже.

      **На чём держится:** миф. Верно вместо него: внимание убывает сверху вниз, но люди прокручивают, если верх
      страницы обещает, что ниже есть нужное.

      ## Типичные ошибки

      - **«Сделаем поярче — заметят».** Яркий блок, оформленный не так, как остальное, глаз принимает за рекламу
        и пропускает.
      - **Выделять всё.** Когда выделено каждое второе слово и каждая третья кнопка, выделения перестают работать.
      - **Прятать главное действие ради аккуратности.** Серая кнопка выглядит спокойно, но если это главное действие
        экрана, его не найдут.
      - **Важное в середине абзаца.** Правило отмены, срок, цену в середине сплошного текста почти никто не прочитает.
      - **Вбивать всё в первый экран.** Прокрутку люди используют, а переполненный верх мешает найти главное.

      ## Как обсудить с дизайнером

      Частая просьба: «Сделайте баннер, чтобы точно заметили». Хороший ответ — не «баннеры не работают», а с причиной:
      «Блок, похожий на рекламу, люди пропускают — это баннерная слепота. Давайте оформим акцию как обычную карточку
      в списке и проверим на нескольких людях, заметят ли её». Так спор идёт о механизме и о проверке, а не о вкусе.

      ## Коротко

      - Чётко глаз видит только маленькое пятно в центре взгляда и осматривает экран прыжками. Что не попало
        в центр взгляда, человек не прочитал.
      - Отличие по одному простому признаку — цвету, размеру, движению — замечается мгновенно. Поэтому главное
        действие выделяют одним заметным отличием, а не всё сразу.
      - Незнакомую страницу обычно не читают, а просматривают. F-паттерн — признак текста без заголовков и выделений,
        а не схема для вёрстки.
      - Текст делят на разделы с ясными заголовками, главное ставят в начало строк и абзацев, перечисления
        дают списком.
      - Всё, что похоже на рекламу по месту или оформлению, люди пропускают — это баннерная слепота. Нужное
        оформляют и ставят как обычное содержимое.
      - Ниже первого экрана прокручивают, но умеренно: верх видят больше всего, туда ставят главное, но не втискивают
        всё.

      ## Источники

      - [F-Shaped Pattern of Reading on the Web: Misunderstood, But Still Relevant — Nielsen Norman Group](https://www.nngroup.com/articles/f-shaped-pattern-reading-web-content/)
      - [Banner Blindness Revisited — Nielsen Norman Group](https://www.nngroup.com/articles/banner-blindness-old-and-new-findings/)
      - [Scrolling and Attention — Nielsen Norman Group](https://www.nngroup.com/articles/scrolling-and-attention/)

  - id: uix-hierarchy
    topic: Как человек видит
    subtopic: Иерархия и группировка
    title: Иерархия и группировка
    audio: https://color-zebra.github.io/frontend-quiz-audio/ui-ux/uix-hierarchy.mp3
    questions: [uix-011, uix-012, uix-013, uix-014, uix-015, uix-016]
    body: |
      ## Какую проблему решаем

      Карточка занятия — главный кирпич «Абонемента»: из таких карточек состоит расписание. На ней пять сведений
      и одна кнопка: название, время, зал с тренером, сколько осталось мест и «Записаться». За год её переделывали
      несколько раз, и в истории задач сохранились пять вариантов.

      ![Пять вариантов одной карточки занятия, подписаны буквами от А до Д](images/uix-hierarchy-five-cards.png "Пять вариантов одной карточки «Йоги для начинающих»")

      Первую версию, вариант А, сверстали быстро: всё одним шрифтом и цветом, кнопка с тонкой рамкой. Потом
      маркетолог попросил «сделать ярче», и получился вариант В — разноцветный, с тремя кнопками. Ещё кто-то решил,
      что всё должно быть «солидно и заметно», и сделал вариант Д, весь жирный и заглавными буквами. Вариант Г
      сделали ради компактности: в одну строку влезает больше занятий. Вариант Б — тот, к которому мы придём
      в этом уроке.

      Почти любой человек скажет, что Б лучше остальных. Но «лучше» — это ощущение, а не довод. В этом уроке
      разберём, почему именно так: из каких механизмов восприятия складывается порядок, в котором человек видит
      элементы, и как этим порядком управлять.

      ## Иерархия: что увидят первым

      **Визуальная иерархия** — порядок, в котором человек замечает элементы экрана: что первым, что вторым, что
      потом. Хорошая иерархия совпадает с важностью: первым замечают то, ради чего человек пришёл.

      На карточке занятия человеку важно, по порядку: что за занятие и когда оно; есть ли места; как записаться.
      Зал и тренер нужны, но во вторую очередь. В варианте Б порядок взгляда совпадает с этим списком. В варианте А
      порядка нет вовсе: пять строк одинаковые, и глаз читает их подряд, как сплошной текст.

      Иерархию строят двумя инструментами. Первый — **группировка**: что с чем связано. Второй — **визуальный вес**:
      что заметнее. Начнём с группировки.

      ## Близость: рядом — значит вместе

      ![Список записей, где расстояние между занятиями такое же, как между названием и временем](images/uix-hierarchy-proximity-bad.png "Все строки на одинаковом расстоянии")

      В разделе «Мои записи» сначала были строки на равном расстоянии друг от друга. Человек видит шесть строк
      и не сразу понимает, что «Завтра, 08:00» относится к пилатесу, а не к йоге: время стоит ровно посередине между
      ними. Приходится читать и сопоставлять.

      ![Тот же список: название и время занятия рядом, между занятиями заметный промежуток](images/uix-hierarchy-proximity-good.png "Внутри записи — тесно, между записями — просторно")

      Исправили одним параметром — расстояниями. Название и время одного занятия стоят тесно, а между занятиями
      промежуток в несколько раз больше. Теперь глаз видит три группы раньше, чем прочитает хоть слово.

      Это **принцип близости**: элементы, которые стоят рядом, человек воспринимает как группу. Он один из самых
      сильных: близость часто перебивает даже сходство по цвету и форме. Из него следует простое правило вёрстки —
      **отступ внутри группы меньше, чем отступ между группами**. Подпись ближе к своему полю, чем к соседнему.
      Текст раздела ближе к своему заголовку, чем к предыдущему разделу. Как подбирать сами отступы, разберём
      в уроке об отступах.

      ## Сходство и общая область

      Близость — не единственный способ сказать «это вместе». Есть ещё три.

      - **Сходство.** Элементы, которые выглядят одинаково, кажутся одним видом вещей. Все кнопки «Записаться»
        одного цвета — значит, они делают одно и то же. Отсюда и обратное: если серая кнопка похожа на серые метки
        «60 минут», глаз записывает её в метки.
      - **Общая область.** Всё, что лежит внутри общей рамки или на общем фоне, воспринимается группой. Карточка —
        это общая область: фон объединяет название, время и кнопку одного занятия. Граница — очень сильный сигнал,
        она может пересилить даже близость. Какой сигнал победит, зависит от силы каждого: едва заметная рамка
        проиграет большому промежутку.
      - **Связность.** Элементы, соединённые линией, воспринимаются связанными. Так рисуют шаги оформления заказа:
        кружки, соединённые полосой.

      Раз граница — такой сильный сигнал, возникает соблазн обвести рамкой всё подряд. Это частая ошибка.

      ![Карточка тренера, где каждая строка в своей рамке, и та же карточка, где группы разделены отступами](images/uix-hierarchy-borders.png "Рамка у каждой строки и группы отступами")

      В первой версии карточки тренера каждая строка была в своей рамке. Рамки делят всё на равные куски,
      и группировки не видно: имя, описание и ближайшее занятие выглядят одинаково важными и одинаково отдельными.
      Вдобавок рамки — это лишние линии, которые глаз тоже обрабатывает.

      Во второй версии рамок внутри нет вовсе. Сведения о тренере собраны тесно, ближайшее занятие отделено
      промежутком, ссылка на все занятия стала кнопкой. Общая область — одна, сама карточка.

      Порядок выбора простой. Сначала разделяют отступами — это самое тихое средство. Если отступов мало, например
      в плотном кабинете администратора, добавляют фон. Линии и рамки — когда больше ничего не помогает. Тени
      работают как фон: приподнимают карточку над подложкой и тоже создают общую область.

      ## Визуальный вес

      Группировка говорит, что с чем связано. **Визуальный вес** говорит, что заметнее. Чем больше вес, тем раньше
      элемент притягивает взгляд. Вес складывается из нескольких рычагов:
      - **размер** — крупное замечают раньше мелкого;
      - **насыщенность шрифта** — жирное раньше обычного;
      - **цвет и контраст** — яркое и контрастное с фоном раньше бледного;
      - **положение** — верх и начало строки видят раньше низа и конца;
      - **свободное место** — элемент с простором вокруг заметнее зажатого.

      Каждый рычаг подробно разберём в следующих трёх уроках: об отступах, о шрифте и о цвете. Здесь важно другое:
      вес — понятие относительное. Элемент тяжёл не сам по себе, а по сравнению с соседями. Поэтому выделение
      работает, только пока выделено немногое: если жирное всё, жирное ничего не значит. Это то же «выпрыгивает
      одно отличие» из прошлого урока, только применённое ко всему экрану.

      ## Одна главная кнопка

      Самый тяжёлый элемент экрана — обычно кнопка главного действия. И тут чаще всего ломается иерархия: на экране
      оказывается несколько одинаково тяжёлых кнопок.

      ![Экран оплаты с тремя одинаковыми яркими кнопками и тот же экран, где яркая только «Оплатить картой»](images/uix-hierarchy-buttons.png "Три одинаковые кнопки и кнопки трёх уровней")

      На экране оплаты абонемента сначала было три одинаковые зелёные кнопки: «Оплатить картой», «Применить
      промокод», «Вернуться к выбору». Человек, который пришёл платить, должен прочитать все три, чтобы найти
      нужную. А кто-то случайно нажимал «Вернуться» и терял выбранный абонемент.

      Кнопки делят по важности на три уровня:
      - **основная** — с заливкой акцентным цветом, для главного действия экрана: «Оплатить», «Записаться»;
      - **второстепенная** — с мягкой заливкой или контуром, для нужного, но не главного: «Применить промокод»;
      - **третьестепенная** — текстом без фона, для редкого или отступления: «Вернуться к выбору».

      Обычно на экране одна основная кнопка. Если кажется, что нужны две, стоит спросить, какое действие человек
      совершает чаще и какое важнее для его задачи. Второе становится второстепенным.

      ## Проверка прищуром

      Есть простой способ увидеть иерархию своего экрана свежим глазом — прищуриться или размыть снимок экрана.
      Мелкие детали и текст исчезают, остаются крупные формы и цветные пятна, то есть ровно то, что заметно первым.

      ![Карточки А и Б, размытые так, что текст не читается](images/uix-hierarchy-squint.png "Карточки А и Б при размытии")

      В размытой карточке А не видно ничего: четыре одинаковые серые полосы и бледный прямоугольник. В карточке Б
      сразу видно тёмное название, строку времени под ним и зелёную кнопку — ровно то, что важно человеку.
      Если после размытия на экране выделяется не главное, иерархия сломана.

      Прищур проверяет иерархию, но не читаемость: мелкий бледный текст при размытии исчезает в любом варианте,
      и о нём нужно судить отдельно.

      ## Разбор пяти карточек

      Теперь можно назвать причину для каждого варианта.
      - **А — без иерархии.** Всё одного размера, насыщенности и цвета, строки на равном расстоянии. Глазу не за что
        зацепиться, и карточку приходится читать целиком.
      - **Б — иерархия совпадает с важностью.** Крупное название, жирное время, второстепенное серым, места оранжевым,
        одна основная кнопка. Зал и тренер тесно под временем, кнопка отделена промежутком.
      - **В — выделено всё.** Каждая строка своим цветом, три яркие кнопки. Отличий так много, что ни одно
        не выпрыгивает: по сути это вариант А, только пёстрый.
      - **Г — главное спрятано.** Название мелкое и стоит второй строкой, время ушло в правый угол, «записаться» —
        крошечная ссылка. Компактно, но вес распределён против важности.
      - **Д — всё тяжёлое.** Жирные заглавные везде. Когда тяжело всё, тяжёлого нет: глаз снова читает карточку
        подряд, как в варианте А, только громче.

      ## Типичные ошибки

      - **Выделять всё, что попросили выделить.** Каждая новая просьба «сделать заметнее» облегчает остальное.
        Иногда правильный ответ — не выделить новое, а приглушить старое.
      - **Рамки вместо отступов.** Рамка у каждого блока создаёт шум и ломает группировку.
      - **Равные отступы везде.** Когда внутри группы и между группами одно и то же расстояние, групп не видно.
      - **Две основные кнопки.** Человек должен сравнить их, прежде чем нажать, и иногда нажимает не ту.
      - **Компактность ценой веса.** Уплотнили карточку — и главное оказалось мелким, в углу.

      ## Как обсудить с дизайнером

      Слова этого урока — общий язык с дизайнером: «иерархия», «визуальный вес», «основное и второстепенное
      действие», «группировка». Вместо «как-то некрасиво» можно сказать: «на экране две основные кнопки, человек
      должен выбирать; давай оставим основной „Оплатить“, а промокод сделаем второстепенной». А если макет кажется
      перегруженным, приложите к разговору размытый снимок: на нём спор о вкусе превращается в спор о том, что
      видно первым.

      ## Коротко

      - Визуальная иерархия — порядок, в котором человек замечает элементы. Хорошая иерархия совпадает с важностью
        для его задачи.
      - Близкое воспринимается группой, поэтому отступ внутри группы меньше, чем между группами. Близость часто
        сильнее сходства цвета и формы.
      - Общая рамка или фон могут объединить даже сильнее близости, но рамки у всего подряд создают шум. Сначала разделяют
        отступами, потом фоном, линии — в последнюю очередь.
      - Визуальный вес складывается из размера, насыщенности шрифта, цвета и контраста, положения и свободного
        места. Вес относителен: если выделено всё, не выделено ничего.
      - Обычно на экране одна основная кнопка; остальные действия — второстепенными и третьестепенными кнопками.
      - Иерархию проверяют прищуром или размытием: заметным должно остаться главное.

      ## Источники

      - [Proximity Principle in Visual Design — Nielsen Norman Group](https://www.nngroup.com/articles/gestalt-proximity/)
      - [The Principle of Common Region: Containers Create Groupings — Nielsen Norman Group](https://www.nngroup.com/articles/common-region/)

  - id: uix-spacing
    topic: Основа визуала
    subtopic: Отступы, сетка и плотность
    title: Отступы, сетка и плотность
    audio: https://color-zebra.github.io/frontend-quiz-audio/ui-ux/uix-spacing.mp3
    questions: [uix-017, uix-018, uix-019, uix-020, uix-021, uix-022]
    body: |
      ## Какую проблему решаем

      Экран профиля в «Абонементе» собирали в разное время разные люди. Каждый ставил отступы «на глаз»: где-то 7
      пикселей, где-то 13, 14, 18, 22. По отдельности ничего страшного нет, но экран в целом выглядит неаккуратно.
      Люди не могут объяснить, что не так, но говорят «как-то кривовато», а дизайнер, если бы он был, сказал бы
      «нет ритма».

      ![Экран профиля: красные пунктирные линии показывают, что левые края блоков не совпадают](images/uix-spacing-profile-bad.png "Профиль с отступами «на глаз»")

      Вторая история — в кабинете администратора. Таблица платежей за день: дата, клиент, сумма. Администратору
      нужно быстро найти крупные платежи, а суммы прыгают по столбцу: 900 стоит вровень с 32 000, и глазу приходится
      читать каждое число, чтобы сравнить.

      Обе проблемы — про пустое место: сколько его, где оно и как выровнены края. Это самая незаметная часть
      интерфейса и одна из самых важных. Отступы делают то, что в прошлом уроке делала близость: показывают,
      что с чем связано. А ещё они отвечают за то, выглядит ли экран собранным.

      ## Шкала отступов

      Главная причина «кривого» профиля — каждый отступ выбран отдельно. Когда значений много и они близки
      друг к другу, глаз видит, что расстояния почти одинаковые, но не совсем. Это и есть ощущение неаккуратности.

      Лечение — **шкала отступов**: короткий список разрешённых значений, из которого берут каждый отступ. Самая
      распространённая — кратные восьми, с половинкой для мелочей: 4, 8, 12, 16, 24, 32, 48. Чем крупнее значения,
      тем больше шаг между ними: разница между 4 и 8 заметна, а между 44 и 48 — уже нет, поэтому после 16 шкала
      идёт крупными ступенями.

      ![Тот же профиль: все блоки начинаются от одного края, отступы из шкалы](images/uix-spacing-profile-good.png "Профиль с отступами по шкале")

      В исправленном профиле все блоки стоят на одном поле в 16 пикселей от края экрана. Между именем и телефоном —
      4, между аватаром и именем по горизонтали — 12, между блоками — 16, после шапки профиля — 24. Все четыре
      значения взяты
      из одной шкалы, поэтому одинаковые расстояния выглядят намеренными, а разные — заметно разными.

      У шкалы есть и практическая польза. Меньше решений: вместо «сколько тут поставить?» вопрос «какой шаг шкалы?».
      Меньше разнобоя, когда экран делают три человека и нейросеть. А в коде шкала становится переменными, о чём
      подробно поговорим в уроке о дизайн-системе.

      ## Внутри теснее, чем снаружи

      Правило из урока об иерархии здесь становится числами: отступ внутри группы меньше, чем между группами.
      В профиле имя и телефон стоят в 4 пикселях друг от друга, карточка абонемента и список — в 16. Ступени шкалы
      удобно раздать по ролям:
      - 4–8 — между строками одной группы: название и время занятия, подпись и поле;
      - 12–16 — между элементами внутри карточки, поля карточки от её края и между элементами, стоящими рядом
        в строке, как аватар и имя;
      - 16 — поле экрана на телефоне и промежуток между блоками экрана;
      - 24–32 — между крупными разделами экрана.

      Главное — чтобы разница между «внутри» и «снаружи» была заметной. Если строки одной группы стоят в 12 пикселях,
      а группы друг от друга — в 16, глаз почти не видит разницы, и группы сливаются. Обычно между ступенями хотя бы
      полтора-два раза.

      ## Выравнивание и сетка

      Второй источник «кривизны» в профиле — края. Аватар стоял в 18 пикселях от края экрана, карточка абонемента —
      в 14, список — снова в 18. Глаз мгновенно замечает, когда края почти совпадают, но не совпадают.

      Правило простое: у элементов экрана должно быть как можно меньше разных левых краёв. На телефоне это обычно
      одна линия — поле экрана, и всё содержимое начинается от неё. Текст внутри карточек начинается от второй
      линии — поля карточки. Две-три линии на весь экран глаз читает как порядок, пять-шесть — как беспорядок.

      На широком экране к этому добавляется **сетка колонок**: экран делят на равные колонки с промежутками, и блоки
      занимают одну, две, три колонки. Чаще всего колонок двенадцать: это число делится на 2, 3, 4 и 6, поэтому блоки
      можно раскладывать по-разному. Как сетка перестраивается при смене ширины, разберём в уроке об экранах разной
      ширины.

      ## Плотность

      **Плотность** — сколько содержимого помещается на экран. Отступы — её главный регулятор: те же данные с отступами
      8 и 24 занимают очень разную высоту.

      Правильная плотность зависит от того, кто и как работает с экраном:
      - **приложение клиента** — человек заходит на минуту, смотрит пару занятий, часто одной рукой. Нужен простор:
        крупные отступы, мало элементов, всё легко читается и нажимается;
      - **кабинет администратора** — человек работает весь день на большом мониторе, сравнивает десятки строк. Простор
        здесь вредит: таблица в двадцать строк не помещается на экран, и приходится всё время прокручивать.

      Поэтому плотный рабочий интерфейс — не неряшливость, а правильный выбор. Но правила группировки в нём те же:
      внутри теснее, чем снаружи. Просто все ступени меньше, а группы чаще отделяют фоном или линией — это мы уже
      обсуждали в уроке об иерархии. Плотность ограничена снизу размером цели для пальца или мыши: о нём — в уроке
      о пальце и курсоре.

      ## Таблицы

      Таблица платежей «как было» сверстана, как обычный текст: всё выровнено по левому краю.

      ![Таблица платежей: суммы выровнены по левому краю и стоят вразнобой](images/uix-spacing-table-bad.png "Суммы по левому краю")

      Сравнивать числа так трудно. Разряды не стоят друг под другом: у 900 сотни там же, где у 32 000 десятки тысяч.
      Чтобы понять, какой платёж крупнее, приходится читать каждое число целиком.

      ![Та же таблица: суммы выровнены по правому краю, строки через одну на сером фоне](images/uix-spacing-table-good.png "Суммы по правому краю, строки через одну на фоне")

      Что изменили:
      - **числа — по правому краю**, тогда разряды встают друг под другом, и длина числа сама показывает его величину;
        заголовок числового столбца — тоже вправо, над своими числами;
      - **цифры одинаковой ширины**: в обычном шрифте единица уже восьмёрки, и столбец «гуляет». В CSS их включает
        `font-variant-numeric: tabular-nums`;
      - **текст — по левому краю**: имена читают слева направо, и им удобно начинаться с одной линии;
      - **длинное имя переносится**, а не обрезается: администратору важно отличить одну клиентку от другой.

      Ещё две вещи для длинных таблиц. Если таблица выше экрана, шапку закрепляют, чтобы при прокрутке было
      видно, какой столбец что значит. А чтобы глаз не терял строку, их разделяют тонкими линиями или фоном через
      одну — «зеброй». Что из этого лучше, исследования однозначно не говорят: в единственном заметном опыте
      с зеброй устойчивой разницы в скорости и точности не нашли, хотя почти половине участников полосы понравились
      больше.

      ## Реальное содержимое

      Макет обычно рисуют на удобных данных: «Анна К.», красивое фото, шесть занятий. В жизни всё длиннее и хуже.

      ![Карточка тренера на удобных данных, на настоящих — с обрезанным именем и пустым местом под фото — и исправленная](images/uix-spacing-real-content.png "Одна карточка на удобных и на настоящих данных")

      В «Абонементе» работает тренер Анастасия Белоусова-Константинопольская, у неё нет фото, и она ведёт
      четырнадцать занятий в неделю. Карточка из макета на ней разваливается: имя обрезано многоточием, на месте
      фото — пустая рамка. Исправленная карточка переносит имя на вторую строку, а вместо фото показывает инициалы.

      Перед тем как считать экран готовым, его проверяют на крайних случаях содержимого:
      - очень длинные имена, названия и слова — русские слова бывают длинными, «Зарегистрироваться» не влезает
        в узкую кнопку;
      - нет картинки или фото;
      - ноль, один и очень много элементов: пустая история записей, одна запись, сто двадцать записей;
      - большие числа: сумма за месяц в кабинете — 1 284 500 ₽, а в макете было 3 500.

      Для каждого случая решают заранее: перенести, обрезать с подсказкой, показать заглушку, разбить на страницы.
      Обрезать стоит только то, что можно прочитать иначе: имя человека, по которому его отличают, обрезать нельзя.

      ## Почему в коде отступы не как в макете

      Частый спор: дизайнер поставил в макете отступ 16 от края кнопки до текста, разработчик сверстал 16, а на экране
      заметно больше. Никто не ошибся — так устроен текст в браузере.

      ![Кнопка с текстом: в браузере отступ отсчитывается от верха строки, а до букв он больше; со свойством text-box-trim — до букв](images/uix-spacing-line-box.png "Строка текста выше самих букв")

      Каждая строка текста в браузере выше самих букв: **межстрочный интервал** добавляет пустое место над
      и под ними. При шрифте 22 пикселя и интервале 1,6 строка занимает около 35 пикселей, а заглавные буквы —
      около 16. Отступ 16 в CSS отсчитывается от края строки, а до верха букв выходит примерно на 9 пикселей
      больше. Глаз же меряет до букв. Если дизайнер в макете ставил отступ по буквам, а не по строке, на экране
      получится расхождение.

      Что с этим делать:
      - в новых браузерах есть свойство `text-box-trim` (в паре с `text-box-edge`, вместе — `text-box`): оно
        обрезает пустое место строки до верха заглавных и линии, на которой стоят буквы. Свойство совсем
        новое: в современных браузерах работает, а в старых просто не сработает, и отступ останется чуть больше —
        это не страшно;
      - или договориться с дизайнером, от чего мерить: например, что в макете отступы тоже считают от строки,
        а не от букв.

      ## Типичные ошибки

      - **Отступы «на глаз».** Каждое значение по отдельности нормальное, а вместе — разнобой, который читается
        как неаккуратность.
      - **Почти одинаковые края.** 14 и 18 пикселей от края — глаз видит, что они разные, и это хуже, чем 14 и 32.
      - **Одинаковая плотность везде.** Клиентский простор в рабочем кабинете заставляет постоянно прокручивать,
        а плотность кабинета на клиентском экране мешает читать и нажимать.
      - **Числа по левому краю.** Сравнивать суммы и количества становится трудно.
      - **Проверка только на удобных данных.** Длинное имя, пустой список или большая сумма ломают экран после
        выпуска, а не в макете.

      ## Как обсудить с дизайнером

      Попросите у дизайнера шкалу отступов, если её нет в UI-ките: «Какие значения отступов у нас разрешены?»
      Покажите ему крайние случаи до вёрстки: «Как карточка выглядит с именем в сорок букв и без фото? А когда записей
      сто двадцать?» И договоритесь, от чего мерить отступы у текста — от строки или от букв, — чтобы спор
      «в макете 16, а у тебя 22» не возникал на каждом экране.

      ## Коротко

      - Отступы берут из короткой шкалы, например кратных восьми с половинкой для мелочей: 4, 8, 12, 16, 24, 32.
        Когда значений мало, одинаковые расстояния выглядят намеренными, а экран — собранным.
      - Отступ внутри группы заметно меньше, чем между группами: обычно хотя бы в полтора-два раза.
      - У элементов экрана как можно меньше разных левых краёв. Почти совпадающие края хуже явно разных.
      - Плотность выбирают по задаче: клиентскому экрану — простор, рабочему кабинету — плотность. Правила группировки
        те же, ступени меньше.
      - В таблицах числа выравнивают по правому краю с цифрами одинаковой ширины, текст — по левому. Длинную таблицу
        снабжают закреплённой шапкой и линиями или зеброй.
      - Экран проверяют на крайних случаях: длинные имена, нет фото, ноль и сто элементов, большие числа.
      - В коде отступ до текста больше, чем в макете, из-за межстрочного интервала; это лечит `text-box-trim`
        или договорённость с дизайнером, от чего мерить.

      ## Источники

      - [Table — GOV.UK Design System](https://design-system.service.gov.uk/components/table/)
      - [Data Tables: Four Major User Tasks — Nielsen Norman Group](https://www.nngroup.com/articles/data-tables/)
      - [text-box-trim — MDN](https://developer.mozilla.org/en-US/docs/Web/CSS/text-box-trim)

  - id: uix-type
    topic: Основа визуала
    subtopic: Типографика
    title: Типографика
    audio: https://color-zebra.github.io/frontend-quiz-audio/ui-ux/uix-type.mp3
    questions: [uix-023, uix-024, uix-025, uix-026, uix-027, uix-028]
    body: |
      ## Какую проблему решаем

      В «Абонементе» появился раздел статей: тренеры пишут о технике, питании, восстановлении. Первая статья —
      «Как не сорвать спину на тренировке» тренера Анны Ковалёвой. Её открывают в основном с телефона, и там всё
      более-менее в порядке. Но часть клиентов читает статьи на работе, с компьютера, и пишет одно и то же:
      «читать тяжело, глаза устают, бросил на середине».

      ![Статья на широком экране: строки во всю ширину окна, мелкий бледно-серый текст, заголовки чуть крупнее текста](images/uix-type-article-bad.png "Статья тренера на компьютере")

      На широком экране строка растянулась на полторы сотни знаков. Текст мелкий и бледно-серый: его делали серым
      «для элегантности». Заголовки разделов лишь чуть крупнее текста и почти не отличаются от него. Каждое решение
      по отдельности не выглядит ошибкой, а вместе они делают текст утомительным.

      Этот урок — о том, как сделать текст удобным для чтения: какого размера, какой ширины, с какими интервалами,
      и что особенного в русском тексте на экране.

      ## Размер основного текста

      Основной текст — то, что человек читает больше всего: описания, абзацы статей, подписи. С него и начинают.
      На телефоне его обычно делают не мельче 16 пикселей: столько по умолчанию ставят браузеры, у Google основной
      текст — 16, у Apple — 17 пунктов. Мельче делают только второстепенное: подписи, даты, пометки.

      Мелкий текст опасен вдвойне, если он ещё и бледный: каждое ослабление по отдельности терпимо, а вместе текст
      перестаёт читаться. Насколько текст должен отличаться от фона по цвету, разберём в следующем уроке, о цвете.

      ## Шкала размеров

      Второе, что сломано в статье, — заголовки почти не отличаются от текста. То же самое было на экране «Мои записи»:
      заголовок экрана, заголовок раздела, название занятия и подпись — 18, 17, 16 и 15 пикселей.

      ![Слева четыре размера текста, отличающихся на пиксель; справа — четыре размера с заметными шагами](images/uix-type-scale.png "Размеры «на пиксель» и с заметными шагами")

      Разница в пиксель видна, но не читается как разница в важности: глаз замечает, что размеры разные, но не видит,
      что главнее. Это тот же эффект, что с почти совпадающими краями в уроке об отступах.

      Решение — **шкала размеров**: несколько размеров с заметными шагами, например 14, 16, 20, 28. Часто шаги
      берут с постоянным множителем — каждый следующий размер в 1,2–1,33 раза больше предыдущего, — тогда шкала
      выглядит ровной. Для интерфейса обычно хватает пяти-шести размеров на всё приложение. Всё, что сверх этого,
      — признак того, что размеры подбирали на месте, как отступы в профиле.

      Размеры шкалы раздают **по ролям текста**: у заголовка экрана, заголовка раздела, основного текста и подписи —
      по одному размеру на всё приложение. Тогда заголовок раздела выглядит одинаково на любом экране, а не «где-то 20,
      где-то 22».

      ## Длина строки

      Главная беда статьи на компьютере — длина строки. Когда строка очень длинная, глазу трудно вернуться в начало
      следующей: он теряет место и перечитывает ту же строку или перескакивает через одну. Когда очень короткая,
      глаз прыгает слишком часто, и чтение становится рваным.

      Типографская традиция советует 45–75 знаков в строке, около 65 — как золотую середину. В стандарте доступности
      WCAG есть похожее требование высшего уровня: строка не длиннее 80 знаков. Исследования при этом расходятся:
      в некоторых опытах длинные строки читали даже быстрее, но люди предпочитали средние и меньше уставали.
      Поэтому ориентир «45–75 знаков, около 65» — хороший выбор по умолчанию, но не закон.

      ![Та же статья: текст в колонке около 65 знаков, крупнее и темнее, заголовки заметно крупнее текста](images/uix-type-article-good.png "Та же статья в колонке с ограниченной шириной")

      В исправленной статье колонка текста ограничена, остальное место окна просто пустое. Это не потеря: пустые поля
      по бокам удобнее, чем строка во всю ширину. В CSS ширину колонки удобно задавать в единицах `ch` — это ширина
      цифры «0» в текущем шрифте, примерно ширина среднего знака: `max-width: 65ch`.

      ## Межстрочный интервал

      **Межстрочный интервал** (в CSS — `line-height`) — расстояние между строками. Для основного текста его обычно
      делают в 1,4–1,6 раза больше размера шрифта: строки не слипаются, и глаз легко находит следующую. Заголовкам
      нужно меньше, около 1,1–1,3: они крупные и короткие, и с большим интервалом строки заголовка распадаются.
      Абзацы отделяют промежутком заметно больше межстрочного.

      Здесь есть требование стандарта, которое касается каждого фронтендера. Некоторые люди с плохим зрением или
      дислексией увеличивают в браузере интервалы между строками, буквами и словами, например расширением.
      WCAG требует, чтобы при этом ничего не терялось: текст не обрезался и не налезал на соседние блоки. На практике
      это значит — не задавать текстовым блокам жёсткую высоту. Блок с фиксированной высотой и `overflow: hidden`
      обрежет текст, как только человек увеличит интервалы.

      ## Начертания и шрифты

      У шрифта обычно есть несколько **насыщенностей**: обычная, полужирная, жирная. Интерфейсу хватает двух-трёх:
      обычной для текста, полужирной для заголовков и акцентов. Шрифтовых семейств тоже обычно хватает одного,
      иногда двух — например, отдельный для крупных заголовков. Каждое новое семейство — ещё один голос, и экран
      начинает звучать хором.

      Отдельно о заглавных буквах. Связный текст, набранный заглавными, читается медленнее обычного — это показали
      ещё классические опыты с чтением, и руководства по удобству до сих пор на них опираются. А одно-два слова заглавными, например
      короткая метка, при беглом взгляде, наоборот, узнаются быстро. Поэтому заглавные годятся для коротких меток,
      но не для предложений и абзацев.

      ## Цифры одинаковой ширины

      В обычном шрифте цифры разной ширины: единица уже восьмёрки. В тексте это незаметно, а в меняющихся числах —
      очень. В «Абонементе» неоплаченная бронь держится десять минут, и на кнопке «Оплатить» идёт обратный отсчёт.

      ![Кнопка с таймером: с обычными цифрами текст сдвигается каждую секунду, с цифрами одинаковой ширины стоит на месте](images/uix-type-timer.png "Таймер с обычными цифрами и с цифрами одинаковой ширины")

      С обычными цифрами текст на кнопке каждую секунду сдвигается на пару пикселей, и кнопка будто дрожит. С цифрами
      одинаковой ширины меняются только сами цифры. В CSS их включает `font-variant-numeric: tabular-nums`, если шрифт
      их поддерживает. Те же цифры нужны в таблицах, счётчиках, ценах в столбик — везде, где числа меняются или
      стоят друг под другом.

      ## Русская типографика

      Большинство советов по типографике в интернете — про английский текст. У русского свои правила, и их нарушения
      так же режут глаз, как неровные отступы.

      ![Строка с прямыми кавычками, дефисом вместо тире и неразделёнными разрядами и та же строка по правилам; узкая кнопка, в которую не влезло длинное слово](images/uix-type-russian.png "Русский текст до и после")

      - **Кавычки «ёлочки».** Прямые кавычки "так" — след клавиатуры, в русском тексте основные кавычки «такие».
      - **Тире, а не дефис.** Между словами ставят длинное тире «—» с пробелами, а дефис «-» — только внутри слов:
        «бизнес-ланч». Перед тире ставят неразрывный пробел, чтобы тире не уехало в начало следующей строки.
      - **Разряды.** Большие числа делят на группы по три цифры неразрывным пробелом: «32 000», а не «32000». Знак
        рубля пишут после числа через неразрывный пробел: «32 000 ₽».
      - **Неразрывный пробел после коротких слов и в сокращениях**, чтобы «в», «и», «12» не висели в конце строки,
        отрываясь от своего слова. А сокращения вроде «т. ч.» в интерфейсе лучше писать полностью.

      Отдельная беда — длинные слова. Русские слова в среднем длиннее английских, и «Зарегистрироваться» в узкую
      кнопку не влезает. Что с этим делать:
      - сначала — поискать слово короче: в «Абонементе» на карточке занятия по смыслу и так нужно «Записаться»;
      - переносы по слогам включает `hyphens: auto`, но только если у страницы указан язык, `lang="ru"`, и у браузера
        есть словарь переносов для этого языка. Современные браузеры переносы поддерживают, но словари и качество
        переносов зависят от браузера и системы. Поэтому строить узкую кнопку в расчёте на переносы нельзя;
      - от вылезания текста за край спасает `overflow-wrap: anywhere` — слово перенесётся без дефиса, некрасиво,
        но читаемо.

      ## Типичные ошибки

      - **Серый мелкий текст «для элегантности».** Каждое ослабление по отдельности терпимо, вместе текст
        не читается.
      - **Строка во всю ширину экрана.** На компьютере это полторы сотни знаков, и глаз теряет строки.
      - **Размеры «на пиксель».** 15, 16, 17 и 18 видно, но не читается как иерархия.
      - **Жёсткая высота у текстового блока.** Текст обрезается при увеличении интервалов или длинном переводе.
      - **Абзацы заглавными.** Их читают медленнее; заглавные — только для коротких меток.
      - **Прямые кавычки, дефис вместо тире, «32000».** Мелочи, по которым русский читатель сразу видит небрежность.

      ## Как обсудить с дизайнером

      Попросите шкалу размеров текста и межстрочных интервалов, если её нет в UI-ките, и спросите, какой ширины
      должна быть колонка текста на широком экране: в макете под компьютер она часто растянута на всю ширину просто
      потому, что так нарисовалось. Отдельно договоритесь о правилах русского набора: кто следит за кавычками,
      тире и неразрывными пробелами — дизайнер в макетах или разработчик в коде, — иначе их не будет нигде.

      ## Коротко

      - Основной текст на телефоне — не мельче 16 пикселей; мельче — только второстепенное. Мелкий и бледный текст
        вместе перестаёт читаться.
      - Размеры текста берут из короткой шкалы с заметными шагами. Разница в пиксель не читается как разница
        в важности.
      - Удобная длина строки — около 45–75 знаков, лучше около 65; на широком экране колонку текста ограничивают, например
        `max-width: 65ch`. Это традиция, частично подтверждённая исследованиями.
      - Межстрочный интервал основного текста — около 1,4–1,6, у заголовков меньше. Текст должен выдерживать
        увеличенные человеком интервалы, поэтому текстовым блокам не задают жёсткую высоту.
      - Хватает одного-двух шрифтов и двух-трёх насыщенностей. Заглавными набирают только короткие метки, не абзацы.
      - В меняющихся и выровненных числах нужны цифры одинаковой ширины, `font-variant-numeric: tabular-nums`.
      - Русский текст набирают по правилам русского набора — ёлочки, тире между словами, разряды через пробел:
        ошибки в них читатель замечает сразу, как неровные отступы. Длинные слова решают выбором слова короче,
        а не надеждой на переносы.

      ## Источники

      - [Understanding Success Criterion 1.4.12: Text Spacing — W3C](https://www.w3.org/WAI/WCAG22/Understanding/text-spacing.html)
      - [Typography — Apple Human Interface Guidelines](https://developer.apple.com/design/human-interface-guidelines/typography)

  - id: uix-color
    topic: Основа визуала
    subtopic: Цвет и контраст
    title: Цвет и контраст
    audio: https://color-zebra.github.io/frontend-quiz-audio/ui-ux/uix-color.mp3
    questions: [uix-029, uix-030, uix-031, uix-032, uix-033, uix-034]
    body: |
      ## Какую проблему решаем

      Весной «Абонемент» обновили, и кнопку «Оплатить» сделали светло-зелёной — «свежей, весенней». Летом пошли
      жалобы: на улице, на солнце, люди не видят надпись на кнопке и не понимают, нажалась ли она. В офисе
      на мониторе всё выглядело прекрасно.

      Вторая история — в расписании. Свободные занятия отмечались зелёной точкой, занятия без мест — красной.
      Клиент написал в поддержку, что приложение «врёт»: он трижды шёл записываться на занятие с «зелёной» точкой,
      а мест не было. Оказалось, что он плохо различает красный и зелёный, и точки для него почти одного цвета.

      Обе проблемы — про цвет, но не про вкус. Первая — про **контраст**: насколько цвет текста отличается от фона.
      Вторая — про то, что цвет не должен быть единственным носителем смысла. Есть и третья, менее заметная:
      как вообще выбирать цвета, чтобы они не спорили друг с другом.

      ## Контраст

      **Контраст** — насколько цвет текста или элемента отличается от фона по яркости. Его выражают отношением:
      1:1 — цвета одинаковые, 21:1 — чёрный на белом. Считают по формуле стандарта доступности WCAG, которая
      учитывает, что зелёный глаз видит ярче синего.

      ![Кнопка «Оплатить» светло-зелёная с белым текстом, контраст 1,7:1, и тёмно-зелёная, контраст 5,5:1](images/uix-color-pay-button.png "Кнопка оплаты до и после")

      WCAG задаёт минимальные пороги:
      - **обычный текст** — не меньше 4,5:1;
      - **крупный текст** — не меньше 3:1; крупный — это примерно от 24 пикселей или от 18,5 пикселя жирным;
      - **элементы интерфейса** — рамка поля, кольцо фокуса, значок без подписи — не меньше 3:1 к соседнему цвету.

      Пороги не округляют: 4,49:1 не проходит. Светло-зелёная кнопка «Абонемента» давала 1,7:1 — в два с половиной
      раза меньше нормы. Новая, тёмно-зелёная, даёт 5,5:1, и надпись читается и на солнце.

      ![Поле «Телефон» с почти невидимой рамкой 1,4:1 и с заметной рамкой 3,2:1](images/uix-color-input-border.png "Рамка поля до и после")

      Порог для элементов интерфейса часто забывают. Светло-серая рамка поля на белом выглядит «аккуратно», но при
      контрасте 1,4:1 многие люди просто не видят, где поле. Рамка с контрастом 3,2:1 по-прежнему спокойная, но поле
      видно.

      Проверять контраст удобно прямо в браузере: в Chrome DevTools пипетка цвета показывает контраст текста с фоном
      и отмечает, проходит ли он порог. Дальше в курсе вместо чисел будем говорить «достаточный контраст».

      Есть и альтернативный метод подсчёта, APCA. Его обсуждали для будущей версии WCAG, но в принятые стандарты
      он не входит, поэтому ориентируются на формулу WCAG 2.

      ## Смысл не только цветом

      Красный и зелёный — самая частая пара для «плохо» и «хорошо», и именно их хуже всего различают люди
      с нарушениями цветового зрения. Такие нарушения есть примерно у каждого двенадцатого мужчины и у одной женщины
      из двухсот. У «Абонемента» около двух с половиной тысяч клиентов — значит, примерно сотня из них.

      ![Статусы занятий только цветными точками и цветными метками с текстом; во втором ряду — как это видит человек с нарушением цветового зрения](images/uix-color-status.png "Верхний ряд — обычное зрение, нижний — приближение дейтеранопии")

      Для такого человека красная и зелёная точки — почти один оттенок оливкового, различимый разве что
      по светлоте. На мелкой точке и при плохом свете эта разница почти незаметна. Метки с текстом
      «Мест нет» и «3 места» читаются одинаково при любом зрении. Правило стандарта простое: цвет не должен быть
      **единственным** способом передать смысл. К цвету добавляют текст, значок или форму. Цвет при этом остаётся:
      он помогает тем, кто его различает, увидеть статус быстрее.

      ## Текст поверх фото

      В «Абонементе» у каждого направления есть обложка с фото, и на неё положили белый заголовок. На тёмных
      фотографиях всё хорошо, а на светлом небе или белой стене заголовок пропадает.

      ![Белый заголовок на светлом фото почти не виден; с затемнением снизу читается](images/uix-color-text-on-photo.png "Заголовок на фото без затемнения и с затемнением")

      Контраст текста на фото непредсказуем: фото меняются, а текст остаётся. Поэтому под текст кладут затемнение:
      градиент от прозрачного к тёмному снизу, полупрозрачную плашку или размытие. Затемнение подбирают так, чтобы
      контраст держался и на самом светлом фото: проверяют на белой картинке и меряют в самой светлой точке под
      текстом. На картинке выше там 5,6:1 — с запасом даже для обычного текста.

      ## Роли цветов вместо палитры

      Обе жалобы разобраны. Осталась третья проблема из начала урока, менее заметная: как вообще выбирать цвета,
      чтобы они не спорили друг с другом.

      Частая ошибка — подбирать цвета «по вкусу» для каждого места: тут зелёный посвежее, там синий построже.
      Через год в приложении двадцать цветов, и ни один ничего не значит.

      Надёжнее начинать не с цветов, а с **ролей**: какие задачи цвет решает на экране. Для большинства интерфейсов
      ролей немного:
      - **фон и поверхности** — подложка экрана, карточки, шторки;
      - **текст** — основной и второстепенный;
      - **акцент** — цвет действия: главные кнопки, ссылки, выбранный пункт;
      - **состояния** — успех, ошибка, предупреждение;
      - **линии** — рамки полей, разделители.

      У каждой роли один цвет или несколько близких оттенков, и роль не меняется от экрана к экрану. Тогда цвет
      начинает что-то значить: зелёный «Абонемента» — это всегда «можно нажать», красный — всегда «что-то не так».
      А акцент работает, как выпрыгивающее отличие из урока о восприятии, только пока им не красят украшения.

      ## Почему HSL обманывает глаз

      Разработчики часто подбирают оттенки в модели **HSL**: тон, насыщенность и «светлота». Кажется удобным:
      хочешь цвет потемнее — уменьши «светлоту». Но «светлота» HSL — это математика над экранными каналами,
      а не то, как светлым цвет видит глаз.

      ![Шесть цветов с одинаковой «светлотой» HSL — жёлтый и голубой очень светлые, синий тёмный; и шесть цветов OKLCH с одинаковой светлотой](images/uix-color-hsl-oklch.png "Одинаковая «светлота» HSL и одинаковая светлота OKLCH")

      У ярко-жёлтого и ярко-синего в HSL одинаковая «светлота» 50 %. Но по формуле яркости, которой пользуется WCAG,
      жёлтый почти в тринадцать раз ярче синего, и глаз видит его намного светлее. Поэтому палитра «одинаковой
      светлоты» в HSL получается неровной: одни цвета кричат, другие тонут.

      Есть модель, которая ближе к восприятию, — **OKLCH**: светлота, насыщенность и тон, подобранные так, чтобы
      одинаковая светлота выглядела примерно одинаково светлой. Её понимают все современные браузеры. В CSS это
      выглядит как `oklch(0.7 0.15 145)`. С OKLCH удобно
      строить ровные шкалы оттенков: шаг светлоты — и все цвета темнеют одинаково.

      Две оговорки. OKLCH равномерна только приблизительно. И одинаковая светлота OKLCH ещё не значит одинаковый
      контраст с фоном: контраст по стандарту считают по другой формуле, его всё равно нужно проверять.

      ## Типичные ошибки

      - **Светлые «свежие» кнопки с белым текстом.** В офисе на мониторе красиво, на улице не видно.
      - **Бледно-серый текст и рамки «для аккуратности».** Подписи и поля перестают читаться у многих людей.
      - **Смысл только цветом.** Красная и зелёная точки для каждого двенадцатого мужчины выглядят похоже.
      - **Цвет без роли.** Акцентным цветом красят украшения, и он перестаёт выделять действие.
      - **Палитра в HSL «одинаковой светлоты».** Цвета выглядят неровно, часть из них не проходит контраст.
      - **Текст на фото без подложки.** Проверили на одном фото — сломалось на другом.

      ## Как обсудить с дизайнером

      Самый частый спор — фирменный цвет не проходит контраст. Хорошее решение обычно не в том, чтобы отказаться
      от бренда, а в том, чтобы развести роли: фирменный светлый цвет — для крупных элементов и украшений, а для
      текста и кнопок — его более тёмный оттенок с достаточным контрастом. Принесите дизайнеру не «мне кажется,
      бледно», а число: «у кнопки 1,7:1, нужно хотя бы 4,5:1 — давай подберём оттенок темнее».

      ## Коротко

      - Контраст по WCAG: обычный текст — не меньше 4,5:1, крупный текст и элементы интерфейса (рамки полей,
        кольцо фокуса, значки) — не меньше 3:1. Пороги не округляют.
      - Контраст проверяют инструментом, например пипеткой цвета в DevTools, а не на глаз и не на своём мониторе.
      - Цвет не должен быть единственным носителем смысла: к нему добавляют текст, значок или форму. Красный
        и зелёный плохо различает примерно каждый двенадцатый мужчина.
      - Текст на фото кладут на затемнение или плашку: контраст должен держаться на любой картинке.
      - Цвета выбирают по ролям: фон, текст, акцент, состояния, линии. У роли один цвет, и он не меняется от экрана
        к экрану — тогда цвет что-то значит.
      - «Светлота» HSL не совпадает с яркостью для глаза. OKLCH ближе к восприятию и удобна для ровных шкал,
        но контраст всё равно проверяют отдельно.

      ## Источники

      - [Understanding Success Criterion 1.4.3: Contrast (Minimum) — W3C](https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html)
      - [Understanding Success Criterion 1.4.11: Non-text Contrast — W3C](https://www.w3.org/WAI/WCAG22/Understanding/non-text-contrast.html)

  - id: uix-touch
    topic: Телефон и экраны
    subtopic: Палец, а не курсор
    title: Палец, а не курсор
    audio: https://color-zebra.github.io/frontend-quiz-audio/ui-ux/uix-touch.mp3
    questions: [uix-035, uix-036, uix-037, uix-038, uix-039, uix-040]
    body: |
      ## Какую проблему решаем

      Помните жалобу «случайно отменил запись» из первого урока? В карточке занятия, на которое человек записан,
      рядом стояли две вещи: «перенести» — перейти на это же занятие в другой день — и крестик отмены шириной
      16 пикселей. Люди хотели перенести запись, промахивались на несколько миллиметров и отменяли её совсем.

      ![Карточка записи с мелкими серыми «перенести» и крестиком вплотную друг к другу и исправленная — с кнопкой «Перенести» и отдельной строкой «Отменить запись»](images/uix-touch-cancel.png "Крестик отмены до и после")

      Разработчик проверял экран мышью на большом мониторе, и там промахнуться было невозможно: курсор попадает
      в точку. Палец — нет. Он закрывает собой то, во что целится, касается пятном, а не точкой, и телефон часто
      держат одной рукой в дороге.

      В этом уроке — чем палец отличается от курсора и что из этого следует: какого размера делать цели,
      где их ставить, что делать с наведением, которого у телефона нет, и с системными жестами по краям экрана.

      ## Закон Фиттса

      Попробуйте мышью попасть в крошечную кнопку на другом конце экрана, а потом — в большую рядом с курсором.
      Во вторую попадаешь не глядя, в первую приходится целиться и иногда промахиваться. Это измерили ещё
      в середине прошлого века, и вывод вошёл в учебники как **закон Фиттса**, по имени психолога Пола Фиттса:
      чем дальше цель и чем она меньше, тем дольше в неё попадать и тем чаще промахиваются. Крупная близкая
      цель — быстрая и надёжная, мелкая далёкая — медленная и капризная.

      Для интерфейса из этого следует простое правило: частые и важные действия делают крупными и ставят близко
      к тому месту, где уже находится палец или курсор. А редкие и опасные можно сделать меньше и отодвинуть.

      Тут есть любопытная разница между мышью и пальцем. Для мыши углы и края экрана — лучшие цели: курсор упирается
      в край и дальше не уходит, промахнуться невозможно. Поэтому меню на компьютере так часто живут у краёв. У пальца
      края ничем не помогают, наоборот: в углы и к краям попадают хуже всего.

      ## Размер цели

      **Цель** — то, во что человек нажимает: кнопка, ссылка, значок, переключатель. Сколько ей нужно места
      для пальца?

      По замерам MIT подушечка пальца шириной 1,6–2 сантиметра. Исследователи Nielsen Norman Group советуют делать
      цели не меньше сантиметра на сантиметр. Платформы перевели это в свои единицы:
      - Apple — не меньше 44 × 44 пунктов;
      - Google — не меньше 48 × 48 dp, это около 9 миллиметров;
      - стандарт WCAG — не меньше 24 × 24 пикселей на уровне AA, с исключением: цель может быть меньше, если вокруг
        неё достаточно пустого места до соседних целей. Ссылки внутри текста под требование не попадают.

      Цифры разные, потому что это разные договорённости и разные единицы. Для практики хватит одного правила: всё,
      что нажимают пальцем, — около 44 пикселей в высоту и ширину. Дальше в курсе будем говорить «удобная для пальца
      цель».

      Важная деталь: **область нажатия** не обязана совпадать с тем, что видно. Значок колокольчика может быть
      20 пикселей, а нажиматься — на площади 44 × 44, за счёт отступов вокруг него.

      ![Значок колокольчика 20 пикселей и пунктиром — область нажатия 44 на 44](images/uix-touch-hit-area.png "Видимый значок меньше области нажатия")

      В CSS это обычно отступы (`padding`) у кнопки или невидимое расширение через псевдоэлемент. Так интерфейс
      остаётся лёгким на вид, а в цель легко попасть.

      ## Расстояние между целями

      Даже крупная цель опасна, если рядом стоит другая, с противоположным смыслом. Промах на пару миллиметров
      превращает «перенести» в «отменить».

      Отсюда правило: опасное действие не ставят вплотную к частому. В исправленной карточке «Абонемента» отмена
      ушла на отдельную строку под линией, получила подпись «Отменить запись» вместо безымянного крестика и полную
      высоту пальца. «Перенести» стала настоящей кнопкой и осталась наверху, на привычном месте. Между ними — расстояние, на котором промах
      уже невозможен.

      Что делать с самим необратимым действием — спрашивать подтверждение или давать отменить, — разберём в уроке
      об окнах, шторках и сообщениях.

      ## Где удобно пальцу

      В интернете популярны схемы «зон большого пальца»: зелёная зона внизу экрана, красная вверху. Их рисовали
      по наблюдениям Стивена Хубера: в 2013 году он понаблюдал на улице больше чем за тысячей человек с телефонами.
      Около половины держали телефон одной рукой, ещё треть — придерживая второй, остальные — двумя руками.

      Но сам Хубер позже отказался от этих схем. Его более поздние наблюдения показали: люди постоянно меняют хват,
      иногда каждые несколько секунд, а точнее и быстрее всего попадают в середину экрана, а не в низ. Хуже всего —
      углы и края.

      Поэтому вывод «всё важное — вниз» — натяжка. Вернее так:
      - частые действия держать там, куда палец легко дотягивается при любом хвате: середина и нижняя часть экрана;
      - в углы и к самым краям не ставить мелкие цели;
      - редкие действия, вроде настроек, могут жить наверху.

      **На чём держится:** исследование с оговорками — наблюдения Хубера и его поздние уточнения; схемы «зон пальца» —
      миф в той форме, в какой их обычно рисуют.

      ## У телефона нет наведения

      На компьютере у элемента есть промежуточное состояние: курсор над ним, но нажатия ещё нет. На этом построено
      много интерфейса: подсказки, раскрывающиеся меню, кнопки, появляющиеся при наведении на строку.
      У пальца такого состояния нет: палец либо касается, либо нет.

      ![На компьютере подсказка «Осталось 3 места из 12» появляется при наведении; на телефоне видна только цифра 3; в исправленной карточке текст написан прямо](images/uix-touch-hover.png "Подсказка при наведении на компьютере и на телефоне")

      В кабинете «Абонемента» число свободных мест показывали значком с цифрой, а пояснение — подсказкой при наведении.
      На компьютере понятно, на телефоне клиент видит только «3» и гадает: места? минуты? Исправление простое —
      написать прямо: «осталось 3 места».

      Правило: всё, что нужно для работы, не должно появляться только при наведении. В CSS можно узнать, есть ли
      наведение и насколько точен указатель: `@media (hover: hover)` — есть наведение, `@media (pointer: coarse)` —
      указатель неточный, как палец. Ими пользуются, чтобы добавить удобства на компьютере, а не чтобы спрятать
      нужное на телефоне.

      ## Системные жесты и безопасные зоны

      Теперь вторая история этого урока — системные жесты. Кнопка «Оплатить» в «Абонементе» прилипала к низу экрана.
      На новых телефонах внизу живёт полоска системных жестов: свайп от нижнего края сворачивает приложение. Полоска
      легла прямо на кнопку, и люди то сворачивали приложение вместо оплаты, то не могли попасть в кнопку.

      ![Липкая кнопка «Оплатить» под полоской системных жестов и та же кнопка с отступом снизу](images/uix-touch-gesture-bar.png "Кнопка у самого края и с отступом безопасной зоны")

      Края экрана заняты не только полоской: вырез камеры сверху, скруглённые углы. Браузер сообщает их размер через
      **безопасные зоны** — переменные `env(safe-area-inset-bottom)` и подобные. Чтобы они заработали, странице
      нужна метка `viewport-fit=cover`, а липким панелям — отступ снизу на величину безопасной зоны.

      Есть и другой случай, когда липкая панель мешает, — клавиатура. Что станет с липкой кнопкой, когда клавиатура
      открыта, зависит от браузера и настроек страницы. По умолчанию Chrome на Android и Safari на iPhone уменьшают
      только видимую часть страницы, и липкая кнопка остаётся внизу, под клавиатурой: пока человек печатает, её
      просто не видно. Но в старых версиях Chrome, во многих встроенных браузерах приложений и на страницах, где
      в метке viewport задано `interactive-widget=resizes-content`, страница сжимается, и кнопка поднимается
      вместе с клавиатурой. Браузер прокручивает страницу так, чтобы поле оказалось видно, но о вашей липкой кнопке
      он не знает, и поле может спрятаться прямо под ней.

      ![Форма с открытой клавиатурой: поле промокода спряталось под липкой кнопкой; в исправленной версии поле видно над кнопкой](images/uix-touch-keyboard.png "Поле под липкой кнопкой и над ней")

      Стандарт WCAG прямо требует, чтобы элемент с фокусом не был полностью закрыт содержимым страницы: липкими
      шапками, подвалами, баннерами. Простое решение из пояснений к стандарту — `scroll-padding` у прокручиваемой
      области на высоту липкой панели: тогда браузер прокручивает поле с запасом и оставляет его над кнопкой.

      ## Типичные ошибки

      - **Проверять экран мышью.** Курсор попадает в точку, палец — нет. Проверяйте на телефоне, пальцем,
        лучше одной рукой.
      - **Крошечные значки без области нажатия.** Крестик в 16 пикселей виден, но в него не попасть.
      - **Опасное рядом с частым.** Промах на пару миллиметров превращается в отмену записи или удаление.
      - **Нужное только при наведении.** На телефоне подсказку не увидеть, а меню не раскрыть.
      - **Липкая панель у самого края.** Её перекрывает полоска жестов, а если она поднимается вместе
        с клавиатурой — закрывает поле.
      - **«Всё вниз, в зону большого пальца».** Красивая схема, от которой отказался её автор.

      ## Как обсудить с дизайнером

      В макете часто рисуют только видимую часть элемента, и неясно, какая у него область нажатия. Спросите
      прямо: «Какая область нажатия у этого значка — сам значок или 44 × 44?» Покажите экран на телефоне с открытой
      клавиатурой и с полоской жестов: в макете их обычно нет. А если дизайнер ссылается на «зону большого пальца»,
      можно мягко рассказать, что её автор сам пересмотрел эти схемы.

      ## Коротко

      - Палец касается пятном, закрывает цель и часто держит телефон одной рукой. Проверять экран мышью —
        значит не увидеть половину проблем.
      - По закону Фиттса чем дальше и мельче цель, тем дольше в неё попадать и тем чаще промахи. Частое и важное
        делают крупным и близким.
      - Цели для пальца — около 44 пикселей в высоту и ширину: это близко к рекомендациям Apple и Google, а стандарт
        WCAG требует минимум вдвое меньше. Область нажатия может быть больше видимого значка.
      - Опасное действие не ставят вплотную к частому: подпись, отдельное место и расстояние.
      - Схемы «зон большого пальца» пересмотрел их автор: точнее всего попадают в середину экрана, хуже всего —
        в углы и края.
      - У телефона нет наведения: всё нужное должно быть видно без него.
      - Липкие панели отодвигают от полоски жестов отступом безопасной зоны и не дают им закрывать поле с фокусом,
        например через `scroll-padding`.

      ## Источники

      - [Touch Targets on Touchscreens — Nielsen Norman Group](https://www.nngroup.com/articles/touch-target-size/)
      - [Understanding Success Criterion 2.5.8: Target Size (Minimum) — W3C](https://www.w3.org/WAI/WCAG22/Understanding/target-size-minimum.html)
      - [Understanding Success Criterion 2.4.11: Focus Not Obscured (Minimum) — W3C](https://www.w3.org/WAI/WCAG22/Understanding/focus-not-obscured-minimum.html)

  - id: uix-adaptive
    topic: Телефон и экраны
    subtopic: Экраны разной ширины
    title: Экраны разной ширины
    audio: https://color-zebra.github.io/frontend-quiz-audio/ui-ux/uix-adaptive.mp3
    questions: [uix-041, uix-042, uix-043, uix-044, uix-045, uix-046]
    body: |
      ## Какую проблему решаем

      Приложение клиента «Абонемента» задумывали для телефона, и там оно выглядит хорошо. Но часть клиентов
      записывается на занятия с работы, с компьютера. На мониторе в 1280 пикселей карточки растянулись во всю
      ширину: название занятия слева, время на другом конце экрана, кнопка «Записаться» — зелёная полоса длиной
      в метр. Нижняя навигация уехала в самый низ огромного окна, и до неё нужно тянуться мышью через весь экран.

      ![Приложение на широком мониторе: карточки занятий и кнопки растянуты во всю ширину, нижняя навигация внизу окна](images/uix-adaptive-stretched.png "Приложение клиента, растянутое на мониторе")

      С кабинетом администратора — наоборот. Его делали для монитора, а администраторы стали открывать его
      на планшете у стойки и даже на телефоне. Таблица клиентов уехала за край экрана, и нужную строку приходится
      искать, двигая страницу во все стороны.

      Один и тот же интерфейс открывают на экранах шириной от 320 до 2500 пикселей. Этот урок — о том, как сделать,
      чтобы он везде оставался удобным: с чего начинать, где менять раскладку и что делать с таблицами.

      ## Начинать с телефона

      На узком экране просто нет места для лишнего, и это полезное ограничение. Приходится решить, что на экране
      главное, и это решение потом помогает и на компьютере. Поэтому проектировать удобно сначала для телефона,
      а потом расширять на большие экраны. Подход называют **«сначала мобильные»** (mobile first); так его назвал
      дизайнер Люк Вроблевски в 2009 году, когда мобильный интернет только начинал расти.

      Обратный путь — сделать большой экран и «ужать» его до телефона — обычно заканчивается тем, что на телефон
      пытаются впихнуть всё, что было на мониторе, и получается каша.

      В CSS подход выглядит так: базовые стили — для узкого экрана, а для широких добавляются медиазапросы
      `@media (min-width: …)`. Не забудьте и метку `<meta name="viewport" content="width=device-width, initial-scale=1">`:
      без неё телефонный браузер нарисует страницу шириной с компьютерную, обычно около 980 пикселей, и уменьшит её.
      Для медиазапросов ширина тоже будет около 980, и правила для узкого экрана не сработают.

      ## Точки перелома — по содержимому

      **Точка перелома** (breakpoint) — ширина экрана, на которой раскладка меняется: одна колонка превращается
      в две, нижняя навигация — в боковую. Частая ошибка — ставить точки по моделям устройств: «вот ширина iPhone,
      вот ширина iPad». Моделей сотни, и каждый год появляются новые.

      Надёжнее ставить точки по содержимому. Растягивайте окно браузера и смотрите, где раскладка начинает
      выглядеть плохо: строки текста стали слишком длинными, карточки — слишком широкими, на экране появилось много
      пустого места. Там и нужна точка перелома. Обычно хватает двух-трёх точек на всё приложение.

      ## Что меняется с ростом ширины

      Широкий экран — не повод растянуть всё, что было на телефоне. Это повод показать иначе.

      ![То же приложение на мониторе: слева боковая навигация, справа карточки занятий тремя колонками](images/uix-adaptive-desktop.png "Приложение клиента на мониторе после переделки")

      Что изменили в «Абонементе»:
      - **навигация:** снизу экрана — на телефоне, слева, боковой колонкой — на широком экране: мышью удобнее
        к левому краю, чем к нижнему краю высокого окна;
      - **колонки:** вместо одной растянутой — карточки сеткой по три в ряд;
      - **максимальная ширина:** у содержимого есть предел, и на очень широком мониторе по бокам остаётся пустое
        место, а не растягивается кнопка в метр длиной;
      - **текст** — в колонке около 65 знаков, не шире 75, как в уроке о типографике.

      Похожие переходы встречаются почти везде: шторка снизу на телефоне становится окном посередине на компьютере,
      список и подробности, которые на телефоне открываются разными экранами, на широком экране стоят рядом.

      ## Контейнерные запросы и «текучие» размеры

      Медиазапрос отвечает на вопрос «какой ширины экран». Но компоненту часто важно другое — сколько места
      ему дали. Карточка тренера может стоять в широкой основной колонке или в узкой боковой на том же самом экране.

      ![Карточка тренера в широкой колонке — фото слева, кнопка справа; та же карточка в узкой колонке — всё друг под другом](images/uix-adaptive-container.png "Одна карточка в широкой и в узкой колонке")

      Для этого есть **контейнерные запросы**: `@container (min-width: 400px)` спрашивает ширину не экрана,
      а ближайшего родителя, которого объявили контейнером: `.column { container-type: inline-size }`. Без этого
      объявления запрос молча не сработает. Карточка сама перестраивается под то место, куда её поставили.
      Контейнерные запросы работают во всех современных браузерах.

      Иногда точки перелома не нужны вовсе: размер можно сделать **текучим**. Функция `clamp()` задаёт размер,
      который плавно растёт с шириной экрана, но не выходит за пределы: `font-size: clamp(22px, 4vw, 32px)` — заголовок
      от 22 до 32 пикселей. Так меньше скачков на точках перелома.

      ## Таблица на телефоне

      Таблицы — самое трудное место адаптивной вёрстки: у них два измерения, и ширину не обманешь. Для таблицы
      клиентов в кабинете на телефоне есть три способа, и у каждого своя цена.

      ![Таблица клиентов на телефоне тремя способами: карточками, главными колонками с раскрытием и прокруткой вбок с закреплённым именем](images/uix-adaptive-table-phone.png "Три способа показать таблицу на узком экране")

      - **Карточки.** Каждая строка становится карточкой. Удобно рассмотреть одного клиента, но сравнивать клиентов
        между собой трудно: числа не стоят друг под другом.
      - **Главное и раскрытие.** В строке только имя и самое важное, остальное — по нажатию. Хорошо, когда
        администратор ищет конкретного человека.
      - **Прокрутка вбок.** Таблица остаётся таблицей и прокручивается внутри своей рамки, а первый столбец с именем
        закреплён. Хорошо, когда нужно сравнивать значения в столбцах.

      Выбор зависит от задачи: ищут одну строку или сравнивают много. Плохо только одно — когда таблица прокручивается
      вбок вместе со всей страницей, и человек теряет и заголовок, и меню.

      ## Узкий экран и увеличение текста

      Здесь есть и требования стандарта WCAG. Экран должен работать на ширине 320 пикселей без прокрутки вбок —
      так выглядит страница шириной 1280 пикселей, когда человек со слабым зрением увеличивает её в четыре раза.
      Исключение — то, чему нужны два измерения: таблицы данных, карты, схемы. Но заголовок таблицы, поиск и кнопки
      рядом с ней перестраиваться всё равно обязаны.

      Второе требование — текст должен увеличиваться вдвое без потери содержимого. Жёсткие высоты блоков и кнопки
      фиксированной ширины ломаются первыми: текст обрезается или налезает на соседей.

      ## Типичные ошибки

      - **Растянуть телефонную раскладку на монитор.** Кнопка в метр длиной и навигация на дне огромного окна.
      - **Ужать компьютерную раскладку до телефона.** На маленький экран пытаются вместить всё, что было на большом.
      - **Точки перелома по моделям устройств.** Каждый новый телефон их ломает.
      - **Таблица, уезжающая вместе со страницей.** Прокручивать нужно таблицу в её рамке, а не весь экран.
      - **Забытая метка viewport.** Без неё телефон показывает уменьшенную компьютерную версию.
      - **Жёсткие высоты и ширины.** Ломаются при увеличении текста и на узких экранах.

      ## Как обсудить с дизайнером

      Попросите макеты хотя бы на двух ширинах — телефон и компьютер — и спросите, что происходит между ними:
      «Где колонки превращаются в одну? Куда уходит навигация? Какая максимальная ширина у содержимого?» Отдельно
      договоритесь о таблицах: какой из трёх способов выбрать и почему — это решение о задаче человека, а не о вёрстке.

      ## Коротко

      - Начинать с телефона: узкий экран заставляет решить, что главное. Базовые стили пишут для узкого экрана,
        а медиазапросы добавляют раскладку для широких.
      - Без метки viewport телефон считает страницу шириной около 980 пикселей, и правила для узкого экрана
        не срабатывают.
      - Точки перелома ставят там, где ломается содержимое, а не по моделям устройств. Обычно хватает двух-трёх.
      - На широком экране не растягивают телефонную раскладку, а показывают иначе: боковая навигация, колонки,
        максимальная ширина содержимого, текст в колонке.
      - Контейнерные запросы перестраивают компонент по ширине его места, а не экрана; `clamp()` делает размеры
        текучими без точек перелома.
      - Таблицу на телефоне показывают карточками, главным с раскрытием или прокруткой вбок с закреплённым первым
        столбцом — по задаче: найти одну строку или сравнивать много.
      - По WCAG экран работает на ширине 320 пикселей без прокрутки вбок, кроме таблиц и карт, а текст увеличивается
        вдвое без потерь.

      ## Источники

      - [Responsive web design basics — web.dev](https://web.dev/articles/responsive-web-design-basics)
      - [Understanding Success Criterion 1.4.10: Reflow — W3C](https://www.w3.org/WAI/WCAG22/Understanding/reflow.html)

  - id: uix-states
    topic: Поведение
    subtopic: Состояния и подсказки
    title: Состояния и подсказки к действию
    audio: https://color-zebra.github.io/frontend-quiz-audio/ui-ux/uix-states.mp3
    questions: [uix-047, uix-048, uix-049, uix-050, uix-051, uix-052]
    body: |
      ## Какую проблему решаем

      Последняя жалоба из первого урока — «оплатил дважды». Вот как это случилось. Человек оплачивал разовое занятие,
      нажал «Оплатить 900 ₽», и две секунды на экране ничего не происходило: кнопка выглядела так же, как до
      нажатия. Связь в раздевалке плохая, запрос шёл долго. Человек решил, что не попал, и нажал ещё раз. Списались
      деньги за два занятия.

      Кнопка в этой истории была нарисована только в одном виде — обычном. А у любого элемента интерфейса видов
      несколько: он реагирует на наведение, на фокус, на нажатие, показывает, что занят, что готово, что недоступен.
      Эти виды называют **состояниями**. Если их нет, человек не понимает, что происходит, и действует наугад.

      В этом уроке — какие состояния бывают, как интерфейс подсказывает, что можно нажать, и как показать ожидание.

      ## Состояния элемента

      ![Кнопка «Оплатить 900 ₽» в семи состояниях: обычное, наведение, фокус, нажатие, загрузка, готово, недоступно](images/uix-states-button.png "Состояния кнопки оплаты")

      У кнопки оплаты «Абонемента» теперь семь состояний:
      - **обычное** — как кнопка выглядит в покое;
      - **наведение** — курсор над кнопкой, она чуть темнеет; только на компьютере;
      - **фокус** — кнопка выбрана с клавиатуры, вокруг неё кольцо;
      - **нажатие** — палец или кнопка мыши прижаты, кнопка темнеет сильнее и чуть уменьшается;
      - **загрузка** — запрос ушёл, ответа ещё нет: значок ожидания и слово «Оплачиваем…»;
      - **готово** — операция прошла: «✓ Оплачено»;
      - **недоступно** — действие сейчас невозможно, например мест нет.

      Двойная оплата лечится состоянием загрузки. Как только человек нажал, кнопка сразу меняет вид и перестаёт
      принимать нажатия, пока не придёт ответ. Человек видит, что нажатие сработало, и не нажимает снова. Сервер
      при этом всё равно должен уметь распознать повторный запрос — но это уже не про интерфейс.

      Сколько ждать, прежде чем показывать загрузку? Ответ быстрее десятой доли секунды кажется мгновенным,
      до секунды ожидание заметно, но мысль не прерывается, а после десяти секунд человек теряет внимание. Поэтому
      кнопку блокируют сразу, а значок ожидания нужен, если ответ может идти дольше секунды. Эти пороги — классическая
      рекомендация Якоба Нильсена.

      ## Подсказки к действию

      Вспомните дверь, которую тянешь на себя, а она открывается от себя. Пластина на двери подсказывает «толкать»,
      ручка — «тянуть», и когда на двери, которую нужно толкать, висит ручка, люди тянут. С кнопкой то же самое:
      чтобы нажать, человек должен сначала понять, что это кнопка. То, что сообщает «здесь можно действовать»,
      называют **подсказками к действию** (signifiers) — это слово ввёл исследователь дизайна Дон Норман.

      В интерфейсе подсказки такие:
      - у кнопки — заливка или рамка, форма прямоугольника, реакция на наведение и нажатие;
      - у ссылки — цвет, отличный от текста, и подчёркивание;
      - у поля — рамка и пустое место для ввода;
      - у раскрывающегося блока — стрелка.

      ![Ссылка «Правила клуба» тем же цветом, что текст, и подчёркнутая ссылка цвета акцента](images/uix-states-link.png "Ссылка без подсказки и с подсказкой")

      В «Абонементе» ссылку на правила клуба оформили так же, как обычный текст, — «чтобы не пестрило». Её никто
      не нажимал: в тексте не было ни одного признака, что это ссылка. После того как ссылку выделили цветом
      и подчеркнули, на правила стали переходить.

      Отсюда же правило: не наделяйте подсказками то, что не нажимается. Подчёркнутый текст без ссылки, заголовок
      цвета кнопки, карточка, которая выглядит кликабельной, но не открывается, — всё это обман, который учит
      человека не доверять подсказкам.

      ## Кнопка или ссылка

      Кнопка и ссылка выглядят похоже, но значат разное. **Ссылка** ведёт в другое место: на другую страницу,
      к разделу, к файлу. **Кнопка** выполняет действие здесь: оплатить, записаться, удалить, открыть шторку.

      Путать их плохо по двум причинам. Человек ждёт от них разного: ссылку можно открыть в новой вкладке, а кнопку
      нет. И с клавиатуры они работают по-разному: ссылка срабатывает от Enter, кнопка — от Enter и пробела.
      Программы чтения с экрана объявляют их разными словами. Поэтому `<a href>` — для переходов, `<button>` —
      для действий, а внешне ссылку можно оформить кнопкой, если это главный переход экрана.

      ## Видимый фокус

      Часть людей управляет интерфейсом с клавиатуры: кто-то из-за ограничений движения, кто-то просто быстрее
      работает без мыши. Клавишей Tab они переходят от элемента к элементу, и им нужно видеть, где сейчас фокус.

      ![Карточка покупки, где не видно, какая кнопка выбрана с клавиатуры, и та же карточка с кольцом вокруг кнопки](images/uix-states-focus.png "Фокус без кольца и с кольцом")

      Частая ошибка — убрать рамку фокуса целиком через `outline: none`, потому что она «некрасиво» появляется
      при нажатии мышью. Тогда человек с клавиатурой перестаёт понимать, где он. Стандарт WCAG требует, чтобы фокус
      клавиатуры был виден, и чтобы кольцо фокуса было достаточно контрастным к фону.

      Компромисс давно найден — селектор `:focus-visible`. Браузер сам решает, когда показывать фокус: при работе
      с клавиатуры — да, после нажатия мышью — обычно нет. Поддерживают его все современные браузеры.

      ## Отключённая кнопка

      В форме покупки абонемента кнопку «Оплатить» сделали серой и неактивной, пока не отмечена галочка «Согласен
      с правилами клуба». Люди нажимали серую кнопку, ничего не происходило, и они не понимали почему.

      ![Серая неактивная кнопка «Оплатить» без объяснений и активная кнопка с сообщением у галочки](images/uix-states-disabled.png "Отключённая кнопка и активная кнопка с сообщением")

      У отключённой кнопки две беды. Нажатие на неё ничего не делает и ничего не объясняет: человек ищет, что не так,
      по всей форме. А программы чтения с экрана часто пропускают отключённые кнопки, и человек вообще не узнаёт,
      что кнопка есть.

      Надёжнее оставить кнопку активной, а по нажатию показать, чего не хватает, прямо у того поля, где ошибка.
      Если кнопку всё же отключают, рядом пишут, что её включит. Отключённое состояние уместно там, где действие
      действительно невозможно и причина видна: «Мест нет» на занятии.

      ## Иконки и подписи

      Последнее про подсказки — иконки. Кажется, что значок понятнее слова и экономит место. Но исследователи
      Nielsen Norman Group пишут, что однозначно понятных значков очень мало: домик, принтер, лупа для поиска.
      Остальные каждый понимает по-своему: сердце — это «нравится», «в избранное» или «сохранить»?

      ![Нижняя навигация из четырёх значков без подписей и те же значки с подписями](images/uix-states-icons.png "Нижняя навигация без подписей и с подписями")

      В нижней навигации «Абонемента» сначала были четыре значка без подписей. Календарь и человечка поняли все,
      а билет и карту путали: где мои записи, а где абонемент? С подписями вопросов не стало. Подпись по наведению
      не выход: на телефоне наведения нет.

      **На чём держится:** миф — «иконки понятнее слов»; верно вместо него: значок плюс подпись надёжнее
      и того и другого по отдельности.

      ## Ожидание: что показать

      Состояние загрузки бывает не только у кнопки. Пока грузится экран или блок, тоже нужно показать, что идёт работа:
      - **индикатор вращения** — для отдельного блока или короткого ожидания в несколько секунд;
      - **скелетон** — серые заготовки на месте будущего содержимого — при первой загрузке целого экрана, когда ждать
        меньше десяти секунд: человек заранее видит, как будет устроена страница;
      - **полоса прогресса** — когда ожидание дольше десяти секунд или это загрузка файла: человеку нужно знать,
        сколько осталось.

      Часто говорят, что скелетон всегда лучше индикатора вращения. Данные тут неоднозначные, и выбор зависит
      от случая: для кнопки скелетон не нужен вовсе, для загрузки файла он только запутает.

      ## Типичные ошибки

      - **Кнопка без состояния загрузки.** Человек не видит, что нажатие сработало, и нажимает снова.
      - **Ссылка, похожая на текст.** Её не нажимают. И наоборот: подчёркнутый текст без ссылки обманывает.
      - **`outline: none` без замены.** Человек с клавиатуры теряет фокус.
      - **Серая кнопка без объяснения.** Человек не понимает, чего от него ждут.
      - **Значки без подписей.** Кроме пары общепринятых, их понимают по-разному.
      - **Кнопка для перехода, ссылка для действия.** Ломаются ожидания и работа с клавиатуры.

      ## Как обсудить с дизайнером

      Самый частый пробел макета — нарисовано только обычное состояние. Попросите все: «Как кнопка выглядит при
      наведении, в фокусе, при нажатии, при загрузке, когда готово и когда недоступна?» Для каждого нового
      компонента удобно завести таблицу состояний, как на картинке в начале урока. Если дизайнер убирает кольцо
      фокуса ради красоты, предложите `:focus-visible`: кольцо будет только у тех, кто работает с клавиатуры.

      ## Коротко

      - У элемента не один вид, а несколько состояний — от наведения и фокуса до загрузки и недоступности. Макет,
        где нарисовано только обычное, неполный: без остальных человек не понимает, что происходит, и действует
        наугад.
      - Кнопку, отправившую запрос, сразу переводят в состояние загрузки и не дают нажать снова. Значок ожидания
        нужен, если ответ может идти дольше секунды.
      - Подсказки к действию сообщают «здесь можно действовать»: заливка и рамка у кнопки, цвет и подчёркивание
        у ссылки. Подсказки не ставят на то, что не нажимается.
      - Ссылка ведёт в другое место, кнопка выполняет действие здесь; путать их — ломать ожидания и клавиатуру.
      - Фокус клавиатуры должен быть виден; `:focus-visible` показывает кольцо при работе с клавиатуры и прячет
        после нажатия мышью.
      - Вместо серой кнопки без объяснения лучше активная кнопка и сообщение у поля, где не хватает данных.
      - Однозначно понятных значков мало, поэтому значки подписывают.

      ## Источники

      - [Icon Usability — Nielsen Norman Group](https://www.nngroup.com/articles/icon-usability/)
      - [Understanding Success Criterion 2.4.7: Focus Visible — W3C](https://www.w3.org/WAI/WCAG22/Understanding/focus-visible.html)
      - [Usability Pitfalls of Disabled Buttons — Smashing Magazine](https://www.smashingmagazine.com/2021/08/frustrating-design-patterns-disabled-buttons/)

  - id: uix-overlays
    topic: Поведение
    subtopic: Окна, шторки и сообщения
    title: Окно, шторка, сообщение или страница
    audio: https://color-zebra.github.io/frontend-quiz-audio/ui-ux/uix-overlays.mp3
    questions: [uix-053, uix-054, uix-055, uix-056, uix-057, uix-058]
    body: |
      ## Какую проблему решаем

      После записи на занятие «Абонемент» показывал окно «Вы записаны!» с кнопкой «Хорошо». Окно закрывало всё
      расписание. Клиенты, которые записывались сразу на несколько занятий недели, каждый раз нажимали «Хорошо»,
      возвращались к списку, искали, где остановились, и снова видели то же окно. Оно ничего не спрашивало
      и ни от чего не защищало — просто мешало.

      Обратная история — с отменой записи. После отмены внизу появлялась плашка «Запись отменена. Вернуть», но через
      две секунды исчезала. Пока человек понимал, что отменил не то занятие, и тянулся к кнопке, её уже не было.
      К тому же плашка ложилась прямо на нижнюю навигацию.

      В одном случае интерфейс прерывает человека там, где не нужно, в другом — не даёт времени там, где оно нужно.
      Сообщить что-то человеку можно разными способами, и у каждого своё назначение. В этом уроке — как выбрать
      между окном, шторкой, плашкой, сообщением на самой странице и отдельной страницей.

      ## Модальное окно — когда без ответа нельзя

      **Модальное окно** — окно поверх экрана, которое не даёт работать с экраном под ним, пока его не закроют.
      Это самый сильный способ прервать человека: он вынужден остановиться и ответить.

      ![Слева окно «Вы записаны!» поверх затемнённого расписания; справа на карточке занятия просто появилась метка «Вы записаны»](images/uix-overlays-modal.png "Подтверждение записи окном и на самой карточке")

      Исследователи Nielsen Norman Group советуют модальные окна только там, где прерывание стоит своей цены:
      - **критичное предупреждение** перед необратимым — например, потерей несохранённой работы;
      - **недостающие данные**, без которых начатое не продолжить, — например, войти, чтобы записаться;
      - **сложная задача по шагам**, где каждый шаг — отдельный вопрос.

      И не советуют — для рекламы и подписок, для сообщений, которые ничего не требуют, и для решений, где человеку
      нужно видеть то, что окно закрывает. Окно «Вы записаны!» не требовало ответа, поэтому его убрали: результат
      теперь видно на самой карточке — метка «✓ Вы записаны», — а расписание остаётся под рукой.

      Одна техническая деталь: у окна правила работы с клавиатурой — фокус уходит внутрь окна и возвращается
      на место после закрытия. Элемент `<dialog>`, открытый методом `showModal()`, делает это сам и вдобавок
      закрывает доступ к экрану под окном, а Esc закрывает окно. Метод `show()` открывает окно немодальным: фокус
      внутрь он переносит, но экран под окном остаётся доступным. А если просто поставить атрибут `open`, фокус
      останется на месте.

      ## Шторка — детали, не теряя экран

      **Шторка** выезжает снизу поверх экрана и занимает его часть. Её любят в мобильных приложениях: в ней можно
      показать подробности или выбор, а экран под ней остаётся виден, и человек не теряет, где был.

      ![Расписание, поверх которого снизу выехала шторка с описанием йоги, залом, тренером и кнопкой «Записаться»](images/uix-overlays-sheet.png "Детали занятия в шторке")

      В «Абонементе» по нажатию на занятие выезжает шторка с описанием, залом, тренером и кнопкой записи. Закрыл
      свайпом вниз — и снова в расписании, на том же месте. На широком экране шторка обычно становится окном
      посередине или боковой панелью: тянуться к низу большого монитора неудобно.

      Шторка — плохой выбор для длинного и сложного: многошаговой формы, статьи, всего, что прокручивается
      несколькими экранами. Для такого есть отдельная страница.

      ## Плашка — короткое сообщение и одно действие

      **Плашка** — короткое сообщение, которое появляется у края экрана и само исчезает. Дизайнеры называют её
      snackbar или toast, в зависимости от гайда. Она ничего не требует: «Сохранено», «Ссылка скопирована»,
      «Запись отменена». У неё бывает самое большее одно действие — обычно «Отменить» или «Вернуть».

      ![Плашка «Запись отменена. Вернуть» поверх нижней навигации и та же плашка над навигацией, с названием занятия](images/uix-overlays-snackbar.png "Плашка поверх навигации и над ней")

      Что было не так с плашкой «Абонемента»:
      - **время.** Две секунды не хватает, чтобы прочитать, понять ошибку и дотянуться до кнопки. Стандарт WCAG
        требует, чтобы лимиты времени можно было отключить или продлить, и прямо разбирает пример с исчезающим
        сообщением. В документации Google для Android сказано ещё строже: плашка с действием не должна исчезать сама,
        пока человек не сделает что-то другое;
      - **место.** Плашка не должна закрывать навигацию и кнопки — её ставят над нижней панелью;
      - **текст.** «Запись отменена» — какая? Лучше назвать: «Запись на сайкл в субботу отменена».

      Плашка не подходит для ошибок, которые нужно исправить, и для всего важного, что нельзя пропустить: она
      исчезает, и информация пропадает вместе с ней.

      ## Сообщение в странице — когда оно про конкретное место

      Ошибку оплаты в «Абонементе» сначала показывали красной плашкой вверху: «Ошибка оплаты». Через три секунды она
      исчезала. Человек не успевал прочитать и, главное, не понимал, что именно не так.

      ![Слева красная плашка «Ошибка оплаты» над формой; справа поле «Срок действия» с красной рамкой и пояснением под ним](images/uix-overlays-error.png "Ошибка во всплывающем сообщении и у поля")

      Если сообщение относится к конкретному месту на экране, его ставят в это место: ошибку — под полем с ошибкой,
      предупреждение о месте — на карточку занятия. Такое сообщение не исчезает, пока проблема не решена, и человек
      может сверяться с ним, исправляя. Как формулировать сами ошибки, разберём в уроке о текстах.

      ## Отдельная страница — длинное и сложное

      Когда содержимого много или задача сложная, лучше отдельная страница: оформление абонемента в несколько шагов,
      история платежей, правила клуба. У страницы есть свой адрес — его можно сохранить, отправить, открыть
      в новой вкладке, — и привычная кнопка «Назад». Окну и шторке этого обычно не хватает.

      ## «Отменить» вместо «Вы уверены?»

      Раньше перед каждым удалением спрашивали «Вы уверены?». Беда в том, что люди привыкают: если вопрос появляется
      на каждом шагу, его перестают читать и нажимают «Да» по привычке. Якоб Нильсен описывает это как «кричать
      „волки“»: когда тревога ложная слишком часто, на настоящую уже не реагируют.

      Поэтому для обратимых действий подтверждение заменяют возможностью отменить: действие выполняется сразу,
      а плашка «Вернуть» даёт время передумать. Подтверждение оставляют для действительно необратимого — и делают
      его говорящим.

      ![Окно «Вы уверены?» с кнопками «Да» и «Нет» и окно «Отменить абонемент на год?» с суммой возврата и кнопками «Оставить» и «Отменить абонемент»](images/uix-overlays-confirm.png "Пустое подтверждение и говорящее")

      В говорящем подтверждении:
      - названо, что именно произойдёт: «Отменить абонемент на год?»;
      - названы последствия: сколько вернут и что вернуть абонемент будет нельзя;
      - кнопки называют действия, а не «Да» и «Нет»: «Отменить абонемент» и «Оставить».

      ## Типичные ошибки

      - **Окно для сообщения, которое ничего не спрашивает.** Прерывает без причины и учит закрывать окна не глядя.
      - **Плашка, исчезающая за пару секунд.** Человек не успевает прочитать и нажать «Вернуть».
      - **Плашка поверх навигации и кнопок.** Закрывает то, чем человек сейчас пользуется.
      - **Ошибку, которую нужно исправить, — в исчезающей плашке.** Пропала плашка — пропало и понимание, что не так.
      - **«Вы уверены?» на каждом шагу.** К вопросу привыкают и перестают его читать.
      - **Длинная форма в шторке или окне.** Нет адреса, нет «Назад», легко потерять всё одним свайпом.

      ## Как обсудить с дизайнером

      Здесь у дизайнеров много слов, и полезно их знать: модальное и немодальное окно, шторка (bottom sheet),
      snackbar и toast — разные названия плашки в разных гайдах. Спросите у дизайнера про каждый такой элемент:
      «Сколько он висит и что будет, если человек не успел нажать? Что он закрывает собой?» А если в макете
      «Вы уверены?» перед обратимым действием, предложите отмену вместо подтверждения.

      ## Коротко

      - Модальное окно прерывает человека и требует ответа. Оно уместно для критичных предупреждений перед
        необратимым и для данных, без которых не продолжить, но не для сообщений, которые ничего не спрашивают.
      - Шторка показывает детали и выбор, не теряя экран под ней; длинное и сложное — на отдельную страницу
        со своим адресом.
      - Плашка — короткое сообщение с самое большее одним действием. Она не закрывает навигацию, называет, что
        произошло. Плашка с действием не должна исчезать раньше, чем человек успеет нажать: WCAG требует, чтобы
        лимит времени можно было снять или продлить, а гайд Google советует держать её, пока человек не сделает
        что-то другое.
      - Сообщение о конкретном месте, например ошибку поля, ставят в это место, и оно не исчезает, пока проблема
        не решена.
      - Вместо «Вы уверены?» для обратимых действий дают отменить. Подтверждение оставляют для необратимого
        и делают говорящим: что произойдёт, какие последствия, кнопки — действиями.

      ## Источники

      - [Modal & Nonmodal Dialogs: When (& When Not) to Use Them — Nielsen Norman Group](https://www.nngroup.com/articles/modal-nonmodal-dialog/)
      - [Confirmation Dialogs Can Prevent User Errors (If Not Overused) — Nielsen Norman Group](https://www.nngroup.com/articles/confirmation-dialog/)
      - [Understanding Success Criterion 2.2.1: Timing Adjustable — W3C](https://www.w3.org/WAI/WCAG22/Understanding/timing-adjustable.html)

  - id: uix-flow
    topic: Поведение
    subtopic: Сценарий раньше экрана
    title: Сценарий раньше экрана
    audio: https://color-zebra.github.io/frontend-quiz-audio/ui-ux/uix-flow.mp3
    questions: [uix-059, uix-060, uix-061, uix-062, uix-063, uix-064]
    body: |
      ## Какую проблему решаем

      На популярные занятия в «Абонементе» есть лист ожидания: если кто-то отменяет запись, первому в листе
      приходит уведомление «Освободилось место», и место держится за ним полчаса. Звучит удобно. Но клиенты
      жалуются, что не успевают: место уходит следующему.

      Разработчик проверил все экраны по отдельности — каждый в порядке. Тогда он прошёл путь целиком, как клиент:
      нажал на уведомление, и приложение открылось на главной. Попросило войти — сессия истекла. Дальше расписание,
      нужный день, нужное занятие, «Записаться», окно подтверждения. Семь шагов. А человек часто видит
      уведомление не сразу, потом вспоминает забытый пароль и ищет занятие в метро с плохой связью. К концу пути
      полчаса уже истекли.

      ![Путь от уведомления до записи: семь шагов было, два стало](images/uix-flow-steps.png "Путь от уведомления до записи до и после")

      Экраны были хорошие, а **путь** — плохой. Этот урок о том, что интерфейс начинается не с экрана, а с задачи
      человека и пути к ней. И о том, как этот путь бывает нечестным: интерфейсы, которые нарочно мешают человеку
      ради выгоды компании.

      ## Путь пользователя

      **Путь пользователя** (user flow) — шаги, которые человек проходит от начала задачи до результата: от уведомления
      до записи, от «хочу купить абонемент» до оплаты. Экран — только один шаг этого пути.

      Полезная привычка — прежде чем рисовать или верстать экран, записать путь словами: откуда человек приходит,
      что он хочет, что ему для этого нужно на каждом шаге. Тогда лишние шаги видно сразу:
      - **уведомление ведёт прямо к делу.** Нажатие на «Освободилось место на йоге в 19:00» открывает карточку
        этого занятия, а не главную;
      - **не спрашивать то, что уже известно.** Если человек недавно входил, второй раз вход не нужен; если он всегда
        ходит в один клуб, клуб выбран заранее;
      - **не подтверждать то, что можно отменить.** Окно «Точно записаться?» после нажатия «Записаться» — лишний шаг.

      После переделки путь стал двухшаговым: уведомление — карточка занятия — «Записаться».

      Сколько людей теряется на каждом лишнем шаге, у каждого продукта своё: это видно в аналитике, а не в общих
      правилах.

      ## Значения по умолчанию

      **Значение по умолчанию** — то, что уже выбрано, когда человек открывает экран. Большинство людей его не меняет,
      поэтому значение по умолчанию — одно из самых сильных решений интерфейса.

      Хорошее значение по умолчанию экономит шаги: клуб, в который человек ходит; тренер, у которого он занимается;
      сегодняшний день в расписании. Плохое работает против человека — об этом ниже, в разделе о тёмных паттернах.
      Правило простое: по умолчанию выбирают то, что выбрал бы сам человек, а не то, что выгодно компании.

      ## Предотвращать ошибки

      Помните, как люди отменяли запись, промахнувшись мимо «перенести»? Лучше хорошего сообщения об ошибке —
      интерфейс, в котором ошибиться трудно. Это правило называют **предотвращением ошибок**, и оно входит
      в эвристики Нильсена. Ошибки бывают двух видов — так их разделил исследователь дизайна Дон Норман:
      - **промах** — человек хотел одно, а сделал соседнее, на автомате: нажал «отменить» вместо «перенести», выбрал
        не тот день. От промахов спасают ограничения (нельзя выбрать занятие, которое уже прошло), разумные значения
        по умолчанию и возможность отменить;
      - **ошибочное намерение** — человек правильно сделал то, что хотел, но хотел не того, потому что неверно понял
        интерфейс: например, решил, что «Заморозить абонемент» — значит отменить. От таких ошибок спасают понятные
        слова и предупреждение о последствиях.

      ## Когда просить разрешения

      Раньше «Абонемент» при первом же открытии спрашивал разрешение показывать уведомления. Человек ещё не понял,
      что это за приложение, и не знал, зачем ему уведомления, — большинство нажимало «Блокировать». А заблокированное
      разрешение потом не вернуть одной кнопкой: его нужно искать в настройках браузера.

      ![Слева системный запрос уведомлений поверх экрана входа; справа в листе ожидания кнопка «Сообщить мне»](images/uix-flow-permission.png "Запрос уведомлений при первом открытии и в момент пользы")

      Руководства Google советуют просить разрешение после действия человека, когда польза очевидна, и сравнивают
      запрос при открытии страницы с тем, как если бы продавец спрашивал у покупателя личные данные прямо на входе
      в магазин. Некоторые браузеры, например Firefox, и вовсе не показывают запрос уведомлений, если ему не
      предшествовало нажатие. В «Абонементе» уведомления теперь предлагают, когда человек встал в лист ожидания:
      «Сообщить, когда освободится место?»

      ## Тёмные паттерны

      Пока что лишние шаги в пути появлялись по недосмотру. Но бывает, что путь делают неудобным нарочно — чтобы
      человек сделал то, что выгодно компании. Такие приёмы называют **тёмными паттернами** (dark patterns, сейчас
      чаще — deceptive patterns). Сайт, который с 2010 года собирает их примеры, насчитывает почти два десятка видов.
      В 2019 году исследователи проверили около одиннадцати тысяч интернет-магазинов и нашли на них больше тысячи
      восьмисот таких приёмов.

      В «Абонементе» нашлись три известных приёма.

      **«Мышеловка»** — войти легко, выйти трудно. Абонемент покупался в два касания, а отключить автопродление можно
      было только звонком в клуб в рабочее время.

      ![Слева абонемент с мелкой надписью «Для отмены позвоните в клуб»; справа кнопки «Отключить автопродление» и «Отменить абонемент»](images/uix-flow-cancel.png "Отмена абонемента звонком и в приложении")

      **Заранее отмеченная галочка** — платная страховка от травм уже была выбрана при покупке, и итоговая сумма
      включала её.

      ![Страховка за 290 рублей отмечена заранее, итого 3 790; во втором варианте галочка пустая, итого 3 500](images/uix-flow-preselect.png "Заранее отмеченная страховка и пустая галочка")

      **Стыжение за отказ** (confirmshaming) — кнопка отказа сформулирована так, чтобы человеку было неловко её
      нажать: «Нет, мне не важно моё здоровье».

      ![Предложение остаться со скидкой: ссылка отказа «Нет, мне не важно моё здоровье» и обычная кнопка «Нет, отменить абонемент»](images/uix-flow-confirmshaming.png "Стыжение за отказ и нейтральный отказ")

      Тёмные паттерны работают на коротком отрезке. Практики считают, что на длинном они вредят: человек, которого
      заперли в подписке, уходит и рассказывает об этом другим.

      Часть таких приёмов уже запрещена законом — но не все и не везде. В России с сентября 2025 года нельзя
      навязывать платные дополнительные услуги и заранее ставить за покупателя галочку согласия, а за навязанное
      можно вернуть деньги. В Евросоюзе онлайн-площадкам — маркетплейсам, соцсетям, сайтам объявлений — запрещены
      интерфейсы, которые обманывают или мешают свободному выбору. Про отмену сложнее подписки там прямого запрета
      пока нет: Еврокомиссия может уточнить это отдельно. Стыжение за отказ ни один из этих законов прямо
      не называет — против него работают только доверие и жалобы.

      **На чём держится:** исследование — сколько таких приёмов на сайтах; что они вредят на длинном отрезке —
      договорённость практиков, точных замеров мало.

      ## Типичные ошибки

      - **Проверять экраны по отдельности.** Каждый хорош, а путь из семи шагов теряет людей.
      - **Уведомление ведёт на главную.** Человеку приходится заново искать то, о чём ему сообщили.
      - **Спрашивать то, что уже известно.** Повторный вход, выбор клуба, который человек выбирает всегда.
      - **Запрос разрешения при первом открытии.** Его блокируют, и вернуть разрешение трудно.
      - **Значение по умолчанию в пользу компании.** Заранее отмеченная платная услуга — это и плохой интерфейс,
        и в России нарушение закона.
      - **Отмена сложнее покупки.** По опыту практиков, человек уходит при первой возможности и рассказывает другим.

      ## Как обсудить с дизайнером

      Начинайте разговор о новой функции с пути, а не с экрана: «Откуда человек сюда приходит, что он хочет, сколько
      шагов до результата?» Если от вас просят тёмный паттерн — например, спрятать отмену подписки, — отказываться
      лучше доводами, а не эмоциями. По опыту практиков, такие приёмы прибавляют жалоб и возвратов, а клиент,
      которого удержали силой, вряд ли вернётся. А заранее отмеченные платные услуги в России и вовсе запрещены.
      Предложите честную замену: напомнить о продлении заранее, предложить заморозку
      или скидку — но с кнопкой отказа, которая называет действие, а не стыдит.

      ## Коротко

      - Экран — один шаг пути пользователя. Путь записывают словами до вёрстки и убирают лишние шаги: уведомление
        ведёт прямо к делу, известное не спрашивают, обратимое не подтверждают.
      - Значение по умолчанию большинство не меняет. По умолчанию выбирают то, что выбрал бы сам человек, а не то,
        что выгодно компании.
      - Ошибки лучше предотвращать: от промахов спасают ограничения, разумные значения по умолчанию и отмена,
        от ошибочных намерений — понятные слова и предупреждение о последствиях.
      - Разрешения просят после действия человека, когда польза понятна, а не при первом открытии.
      - Тёмные паттерны — «мышеловка», заранее отмеченная платная услуга, стыжение за отказ — подрывают доверие,
        а часть из них уже запрещена: в России — заранее отмеченные платные услуги, в ЕС для онлайн-платформ —
        интерфейсы, мешающие свободному выбору.

      ## Источники

      - [10 Usability Heuristics for User Interface Design — Nielsen Norman Group](https://www.nngroup.com/articles/ten-usability-heuristics/)
      - [Deceptive Patterns](https://www.deceptive.design/)
      - [Web permissions best practices — web.dev](https://web.dev/articles/permissions-best-practices)

  - id: uix-forms
    topic: Поведение
    subtopic: Формы
    title: Формы
    audio: https://color-zebra.github.io/frontend-quiz-audio/ui-ux/uix-forms.mp3
    questions: [uix-065, uix-066, uix-067, uix-068, uix-069, uix-070]
    body: |
      ## Какую проблему решаем

      Форма покупки абонемента в «Абонементе» выглядела аккуратно и коротко: поля без подписей, названия поля написаны
      бледно прямо внутри него. Но аналитика показывала, что до оплаты доходит меньше людей, чем начинает. В записях
      сессий было видно, что происходит:
      - человек вводил имя, и подпись «Имя» исчезала; на третьем поле он уже не помнил, что от него хотели во втором;
      - на поле телефона открывалась буквенная клавиатура, и цифры приходилось искать;
      - номер «8 (912) 345-67-80» форма отклоняла: «Введите номер в формате +79123456780»;
      - красная ошибка «Неверный адрес почты» появлялась, когда человек успел ввести две буквы.

      Форма — место, где человек работает на интерфейс, а не интерфейс на человека. Каждая лишняя трудность здесь
      стоит прямых денег: человек бросает покупку. В этом уроке — как сделать форму, которую легко заполнить.

      ## Подпись над полем

      ![Слева форма, где подписи были внутри полей и исчезли после ввода; справа подписи над полями и короткое поле промокода](images/uix-forms-labels.png "Подписи внутри полей и над полями")

      Самое надёжное место для подписи — **над полем**. В опыте со слежением за взглядом глаз
      переходил от подписи над полем к самому полю почти мгновенно, а от подписи слева, выровненной по левому краю,
      — в разы дольше. Опыт был маленький, на коротких формах, и сам автор назвал его стартовой точкой, но вывод
      совпадает с практикой: британская дизайн-система GOV.UK, одна из самых проверенных на людях, ставит подписи
      над полями.

      **Подсказка внутри поля** (placeholder) — бледный текст, который исчезает при вводе, — подписью быть не может.
      Исследователи Nielsen Norman Group перечисляют почему:
      - она исчезает, как только человек начал печатать, и перепроверить форму перед отправкой нельзя;
      - её бледный цвет обычно не проходит контраст;
      - она похожа на уже заполненное значение, и поле пропускают.

      Поэтому подписи — над полем и всегда видны, а пример формата, если он нужен, — отдельной строкой под подписью.

      **На чём держится:** исследование с условиями — маленький опыт со слежением за взглядом; договорённость —
      правила GOV.UK и советы Nielsen Norman Group.

      ## Одна колонка

      ![Слева поля формы в две колонки; справа те же поля в одну колонку разной ширины](images/uix-forms-columns.png "Форма в две колонки и в одну")

      Поля в две колонки экономят высоту, но взгляду приходится идти зигзагом: слева направо, потом вниз, потом снова
      слева направо. Поле в правой колонке легко пропустить, а порядок заполнения становится неочевидным.
      Исследователи из Baymard — компании, которая много лет тестирует формы интернет-магазинов, — видели, что
      в одной колонке поля реже пропускают и реже путают.

      Исключение — тесно связанные короткие пары, которые люди привыкли видеть рядом: срок действия карты и код
      на обороте, индекс и город.

      ## Ширина поля и пометка «необязательно»

      Ширина поля — тоже подсказка: длинное поле обещает длинный ответ, короткое — короткий. Поле промокода во всю
      ширину экрана выглядело так, будто туда нужно вписать абзац. GOV.UK советует подбирать ширину по ожидаемой
      длине ответа: индекс — узкое, телефон — средней ширины, адрес — широкое.

      Обязательные поля часто помечают звёздочкой. GOV.UK советует наоборот: обязательные не помечать, а редкие
      необязательные подписывать словом: «Промокод (необязательно)». Звёздочка на каждом поле — шум, а слово
      «необязательно» на одном поле говорит то, что человеку действительно нужно знать.

      ## Нужная клавиатура и автозаполнение

      На телефоне браузер показывает клавиатуру по типу поля. Неверный тип — и человек ищет цифры на буквенной
      клавиатуре.

      ![Буквенная клавиатура для поля телефона, цифровая для type="tel" и латинская с «@» для type="email" — схематично](images/uix-forms-keyboards.png "Клавиатуры для разных полей, схематично")

      Что ставить:
      - `type="tel"` — для телефона: цифровая клавиатура с «+»;
      - `type="email"` — для почты: латиница с «@»;
      - `inputmode="numeric"` — для чисел вроде кода из СМС или номера карты; GOV.UK советует его вместо
        `type="number"`, у которого есть стрелочки и странное поведение с длинными числами;
      - `autocomplete` — назначение поля: `name`, `tel`, `email`, `cc-number`. Тогда браузер предложит заполнить
        поле одним нажатием. Стандарт WCAG требует указывать назначение полей с личными данными.

      Ещё одна ловушка Safari на iPhone: если шрифт в поле мельче 16 пикселей, при нажатии на поле браузер увеличивает
      страницу, и после ввода её приходится уменьшать обратно. Лечится шрифтом от 16 пикселей, а не запретом
      масштабирования: запрет мешает людям, которым увеличение нужно.

      ## Терпимый ввод

      ![Слева номер «8 (912) 345-67-80» отклонён с требованием особого формата; справа принят и приведён к виду «+7 912 345-67-80»](images/uix-forms-forgiving.png "Строгий и терпимый ввод телефона")

      Люди пишут телефон по-разному: с восьмёркой и с «+7», со скобками, пробелами и дефисами. Требовать один формат —
      значит заставлять человека делать работу, которую программа делает за миллисекунды. **Терпимый ввод**
      принимает любой разумный вариант: убирает лишние символы, приводит к общему виду и показывает результат.
      То же с картами (пробелы между группами), датами, суммами. Это частный случай предотвращения ошибок из прошлого
      урока: интерфейс подстраивается под человека, а не наоборот.

      ## Когда показывать ошибку

      ![Ошибка «Неверный адрес почты» после двух введённых букв и ошибка с примером после того, как человек перешёл к следующему полю](images/uix-forms-validation-timing.png "Ошибка во время ввода и после ухода из поля")

      Ошибка поля, которую показывают, пока человек ещё печатает, раздражает: он не закончил, а его уже ругают.
      В небольшом опыте дизайнера Люка Вроблевски проверка после того, как человек ушёл из поля, работала лучше,
      чем проверка во время ввода и только при отправке. Автор сам называет свои цифры ориентировочными, но совет
      закрепился в практике. Правило: проверять поле, когда человек его закончил и перешёл
      к следующему, а при отправке — показывать все оставшиеся ошибки, у каждого поля.

      **На чём держится:** исследование с условиями — маленький опыт, совет из которого закрепился в практике.

      Сама ошибка стоит у поля и говорит, что не так и как исправить: «В адресе нет „@“ — например, elena@mail.ru».
      Как формулировать такие сообщения, подробно разберём в уроке о текстах.

      ## Длинная форма по шагам

      ![Форма покупки в три шага: на первом выбор абонемента, на втором данные; сверху полоска прогресса](images/uix-forms-steps.png "Длинная форма, разбитая на шаги")

      Если полей много, форму разбивают на шаги: на каждом — небольшая группа связанных вопросов, сверху — сколько
      шагов осталось. GOV.UK идёт дальше и советует начинать с «одного вопроса на странице»: так человек думает
      об одном, ошибок меньше, а на телефоне не нужно листать длинную простыню. Связанные вопросы потом объединяют
      на одной странице, если проверка на людях показала, что так удобнее. Цена шагов — больше нажатий «Дальше»,
      поэтому их не дробят без нужды: короткую форму из трёх полей разбивать не стоит.

      Введённое на каждом шаге сохраняют. Длинную форму редко заполняют за один раз: человек уходит за справкой
      о доходах, отвлекается на звонок, у него садится телефон. Если, вернувшись, он находит пустую форму, второго
      раза может и не быть. У шагов есть и ещё одно преимущество перед одной длинной страницей: у каждого свой адрес
      и работает кнопка «Назад».

      ## Типичные ошибки

      - **Подсказка внутри поля вместо подписи.** Исчезает при вводе, бледная, похожа на заполненное поле.
      - **Две колонки полей.** Правую колонку пропускают, порядок неясен.
      - **Все поля одной ширины и звёздочки на каждом.** Форма не подсказывает ни длину ответа, ни что можно пропустить.
      - **Буквенная клавиатура для цифр.** Неверный `type` или `inputmode`.
      - **Строгий формат ввода.** Отклонять номер со скобками — заставлять человека работать за программу.
      - **Ошибка во время ввода.** Человека ругают, пока он ещё печатает.
      - **Шрифт поля мельче 16 пикселей.** Safari на iPhone увеличивает страницу при каждом нажатии на поле.

      ## Как обсудить с дизайнером

      Попросите в макете формы все состояния полей: пустое, заполненное, в фокусе, с ошибкой, отключённое — и тексты
      ошибок. Покажите, как форма выглядит на телефоне с открытой клавиатурой: в макете её обычно нет, а на деле она
      закрывает половину экрана. Если в макете подписи внутри полей ради компактности, принесите доводы Nielsen Norman Group
      и GOV.UK, а не «мне так не нравится».

      ## Коротко

      - Подписи — над полем и всегда видны. Подсказка внутри поля подписью быть не может: она исчезает, бледная
        и похожа на заполненное значение.
      - Поля — в одну колонку; рядом ставят только тесно связанные короткие пары. Ширина поля подсказывает длину ответа.
      - Обязательные поля не помечают звёздочками; редкие необязательные подписывают словом «необязательно».
      - Тип поля и `inputmode` открывают нужную клавиатуру, `autocomplete` включает автозаполнение. Шрифт в поле —
        от 16 пикселей, иначе Safari на iPhone увеличивает страницу.
      - Терпимый ввод принимает любой разумный формат и сам приводит его к общему виду.
      - Ошибку поля показывают после того, как человек ушёл из поля, а не во время ввода; при отправке — все ошибки
        у своих полей.
      - Длинную форму разбивают на шаги с видимым прогрессом, короткую — не дробят.

      ## Источники

      - [Placeholders in Form Fields Are Harmful — Nielsen Norman Group](https://www.nngroup.com/articles/form-design-placeholders/)
      - [Text input — GOV.UK Design System](https://design-system.service.gov.uk/components/text-input/)
      - [Inline Validation in Web Forms — A List Apart](https://alistapart.com/article/inline-validation-in-web-forms/)

  - id: uix-navigation
    topic: Поведение
    subtopic: Память, привычки и навигация
    title: Память, привычки и навигация
    audio: https://color-zebra.github.io/frontend-quiz-audio/ui-ux/uix-navigation.mp3
    questions: [uix-071, uix-072, uix-073, uix-074, uix-075, uix-076]
    body: |
      ## Какую проблему решаем

      Администратору клуба позвонила клиентка: ей не вернули деньги за отменённое занятие. Нужно найти возврат
      в кабинете администратора. Меню слева: «Управление», «Настройки». Под «Управлением» — «Финансы» и «Клиентская
      база», под «Финансами» — «Операции» и «Отчёты», под «Операциями» — «Платежи» и «Корректировки». Возвраты,
      как выяснилось, — это «Корректировки». Администратор работает в клубе третий месяц и каждый раз ищет этот
      пункт заново, открывая все разделы по очереди.

      Меню собрал разработчик, и для него всё логично: так устроены таблицы в базе данных. Но администратор думает
      не таблицами, а задачами: «найти возврат», «посмотреть платежи клиентки». Этот урок о том, как устроены память
      и привычки людей и что из этого следует для навигации: как назвать разделы, сколько уровней делать
      и как показать человеку, где он находится.

      ## Рабочая память мала

      Пока администратор идёт по меню, он держит в голове, где уже был: «Управление — не то, Финансы — Операции…».
      Это **рабочая память** — то, что человек удерживает прямо сейчас: номер телефона, который диктуют, путь
      по меню, который он только что прошёл. Она очень мала: по оценкам психологов, взрослый держит в ней около
      четырёх отдельных единиц. Четыре уровня меню её почти исчерпывают — и на пятом администратор уже не помнит,
      что видел на первом.

      Отсюда два следствия для интерфейса:
      - **не заставлять запоминать.** Если на третьем шаге формы нужно помнить, что было на первом, — покажите это;
        если код из СМС нужно переписать, — дайте его вставить;
      - **узнавание легче вспоминания.** Выбрать знакомое из списка проще, чем вспомнить и ввести самому.
        Администратору проще узнать «Возвраты» в списке разделов, чем помнить, что они спрятаны в «Корректировках».

      ## Сколько пунктов и уровней в меню

      ![Слева меню в четыре уровня, где возвраты называются «Корректировки»; справа меню в два уровня с группами «Клуб», «Деньги», «Прочее»](images/uix-nav-depth.png "Глубокое меню и широкое с группами")

      Когда разработчик собирал кабинет, ему сказали: «В меню должно быть не больше семи пунктов». Поэтому разделы
      и разложили по вложенным уровням. Это один из самых живучих мифов интерфейса. Он ссылается на старую статью
      о «магическом числе семь» — о том, сколько человек удерживает в голове. Но меню не нужно помнить: его пункты
      видны на экране, их просматривают глазами. Память нужна как раз в глубоком меню — чтобы помнить, где ты уже был.

      Опыты с меню показывают: каждый лишний уровень замедляет поиск, на каждом приходится угадывать, куда идти
      дальше. Но и другая крайность вредит: сотня пунктов в одном списке превращается в простыню, которую трудно
      просмотреть. Обычно лучше меньше уровней с понятными группами: разделы видны сразу, а заголовки групп
      помогают глазу.

      Так и сделали в «Абонементе»: меню стало двухуровневым, с группами «Клуб», «Деньги» и «Прочее», и в них видны
      все разделы сразу. Возвраты стали отдельным пунктом в «Деньгах».

      Против широкого меню часто приводят **закон Хика**: чем больше вариантов, тем дольше выбор. Но закон описывает
      другое — выбор между знакомыми равновероятными сигналами, например какую из лампочек нажать, и время там растёт
      медленно. Незнакомое меню человек просматривает подряд. Если нужный пункт спрятать на второй уровень, искать его
      придётся дольше, а не быстрее.

      **На чём держится:** миф — «не больше семи пунктов». Верно вместо него: меню просматривают, а не запоминают;
      лучше меньше уровней с понятными группами, но без простыни в сотню пунктов.

      ## Люди ждут, что всё работает как везде

      До клуба администратор полгода работал в другом фитнес-клубе, а платежи каждый день проверяет в банковском
      приложении. Там возвраты лежат рядом с платежами — и здесь он ищет их там же. Это общее правило: человек
      проводит большую часть времени в других приложениях и приходит в ваше с привычками из сотен других. Корзина —
      в правом верхнем углу, логотип ведёт на главную, свайп вниз обновляет список. Это правило называют **законом
      Якоба**, по имени Якоба Нильсена, который его сформулировал.

      Когда интерфейс работает иначе, человеку приходится переучиваться, и он ошибается. Поэтому для разработчика
      без дизайнера это самый сильный довод: если не уверен, как сделать, — сделай так, как принято. Привычное
      решение может быть не лучшим в теории, но оно лучше непривычного на практике.

      Представление человека о том, как устроена система, называют **ментальной моделью**. У администратора модель
      «деньги клиента»: платежи и возвраты рядом. Меню, построенное по модели базы данных, с ней не совпадает.

      ## Называть словами людей

      ![Пункты меню «Транзакции», «Корректировки», «Сущности клиентов», «Слоты» и те же пункты словами «Платежи», «Возвраты», «Клиенты», «Расписание»](images/uix-nav-labels.png "Пункты словами системы и словами людей")

      Администратор ищет возврат и смотрит на пункты меню. «Корректировки» ничего ему не говорят, и он идёт мимо.
      Человек выбирает пункт, оценивая, насколько вероятно найти за ним то, что он ищет. Исследователи называют
      это **запахом информации** (information scent): как запах ведёт к еде, так слова в ссылке ведут к цели.

      Правила простые:
      - называть словами пользователей, а не системы: «Возвраты», а не «Корректировки» и не «Транзакции»;
      - называть конкретно: «Платежи клиента», а не «Подробнее» и не «Ещё»;
      - проверять названия на людях: попросить найти в меню пять типичных вещей и посмотреть, куда они нажимают.

      ## Где я и куда могу пойти

      Администратор нашёл возврат и открыл платежи клиентки. На экране написано просто «Платежи». Чьи? В каком
      он разделе? Как вернуться к карточке клиентки? Хорошая навигация в любой момент отвечает на три вопроса:
      где я, откуда пришёл и куда могу пойти.

      ![Экран «Платежи» без отмеченного раздела и тот же экран с выделенным разделом «Клиенты» и цепочкой «Клиенты › Смирнова Елена › Платежи»](images/uix-nav-where.png "Экран без признаков местоположения и с хлебными крошками")

      Ответы дают:
      - **заголовок экрана**, который говорит, что это: «Платежи Елены Смирновой», а не просто «Платежи»;
      - **отмеченный пункт навигации** — раздел, в котором человек сейчас;
      - **хлебные крошки** — цепочка «Клиенты › Смирнова Елена › Платежи» на глубоких экранах; по ней видно путь
        и можно вернуться на любой уровень.

      ## Нижняя навигация и «гамбургер»

      ![Слева приложение со значком меню из трёх полосок; справа нижняя навигация с четырьмя разделами](images/uix-nav-hamburger.png "Спрятанные разделы и нижняя навигация")

      У клиентов «Абонемента» другая навигация — на телефоне. Главные разделы приложения обычно показывают **нижней
      навигацией**: три-пять пунктов внизу экрана. Альтернатива — спрятать всё за значком из трёх полосок,
      «гамбургером». Это экономит место, но замеры исследователей удобства из Nielsen Norman Group показали:
      спрятанной навигацией пользуются реже и находят разделы хуже, особенно на компьютере, но и на телефоне тоже.
      Когда часть меню была видна, навигацией пользовались почти девять человек из десяти, а когда меню пряталось
      за незаметным значком — меньше половины.

      Поэтому четыре-пять главных разделов показывают, а за меню прячут редкое: настройки, справку, политику.

      ## Миф «трёх кликов»

      Ещё один живучий миф — «любая страница должна быть в трёх кликах от главной». Администратору не важно, три
      клика до возврата или четыре. Важно, чтобы на каждом шаге он видел слово, которое ведёт к цели, — «Деньги»,
      потом «Возвраты» — и понимал, что идёт верно. Когда миф проверяли на настоящих задачах, связи между числом
      кликов и успехом не нашлось. Люди бросают поиск не после третьего клика, а когда перестают чувствовать, что
      идут в правильном направлении, — когда пропадает запах информации.

      **На чём держится:** миф. Верно вместо него: важно не число кликов, а уверенность на каждом шаге, что идёшь
      правильно.

      ## Типичные ошибки

      - **Меню по устройству базы данных.** «Корректировки» и «Сущности» вместо «Возвратов» и «Клиентов».
      - **Глубокое меню ради «семи пунктов».** Миф выдают за науку, а нужный раздел прячут на четвёртый уровень.
      - **Непривычное ради оригинальности.** Человеку приходится переучиваться, и он ошибается.
      - **Нет ответа на «где я».** Заголовок без смысла, раздел не отмечен, крошек нет.
      - **Главные разделы за «гамбургером».** Их находят хуже и пользуются реже.
      - **«Сократим до трёх кликов».** Число кликов не главное, главное — уверенность на каждом шаге.

      ## Как обсудить с дизайнером

      В спорах о навигации чаще всего звучат мифы: «не больше семи пунктов», «три клика», «по закону Хика».
      Отвечайте данными: меню просматривают, а не запоминают; лишние уровни меню в опытах замедляли поиск; число кликов
      не связано с успехом. А вместо спора о названиях предложите короткую проверку: пять человек, пять задач
      «найдите…», и посмотреть, куда они нажимают. Как провести такую проверку, разберём в уроке о проверке без дизайнера.

      ## Коротко

      - Рабочая память мала — около четырёх единиц. Интерфейс не заставляет запоминать и предлагает узнавать
        из списка, а не вспоминать.
      - «Не больше семи пунктов в меню» — миф: меню просматривают, а не запоминают. Лишние уровни замедляют поиск,
        поэтому лучше меньше уровней с понятными группами, но без простыни из сотни пунктов.
      - Закон Хика описывает выбор между знакомыми равновероятными вариантами; к незнакомому меню его применяют неверно.
      - Люди большую часть времени проводят в других приложениях и ждут привычного. Не уверен — делай как принято.
      - Пункты называют словами пользователей и конкретно — так у них есть «запах информации».
      - Навигация отвечает на «где я»: понятный заголовок, отмеченный раздел, хлебные крошки на глубоких экранах.
      - Главные разделы показывают нижней навигацией из трёх-пяти пунктов; за «гамбургером» их находят хуже.
      - «Три клика» — миф: важна не длина пути, а уверенность на каждом шаге.

      ## Источники

      - [Flat vs. Deep Website Hierarchies — Nielsen Norman Group](https://www.nngroup.com/articles/flat-vs-deep-hierarchy/)
      - [Information Scent — Nielsen Norman Group](https://www.nngroup.com/articles/information-scent/)
      - [Hamburger Menus and Hidden Navigation Hurt UX Metrics — Nielsen Norman Group](https://www.nngroup.com/articles/find-navigation-mobile-even-hamburger/)

  - id: uix-motion
    topic: Поведение
    subtopic: Анимация со смыслом
    title: Анимация со смыслом
    audio: https://color-zebra.github.io/frontend-quiz-audio/ui-ux/uix-motion.mp3
    questions: [uix-077, uix-078, uix-079, uix-080, uix-081, uix-082]
    body: |
      ## Какую проблему решаем

      В «Абонементе» по нажатию на занятие выезжает шторка с подробностями. Разработчику хотелось, чтобы было «живо»,
      и он сделал шторку медленной — почти секунда — и с отскоком: она вылетает чуть выше, чем нужно, и пружинит
      назад. На демонстрации всем понравилось. Через месяц клиенты, которые листают расписание и открывают по пять
      занятий подряд, стали писать, что приложение «тормозит». Оно не тормозило — просто каждый раз приходилось ждать
      анимацию.

      Вторая жалоба пришла от клиентки с вестибулярным расстройством. На главной экране был **параллакс**: фоновая
      картинка двигалась медленнее содержимого при прокрутке. У неё от этого кружилась голова, и приложение пришлось
      закрывать.

      Анимация — сильное средство: движение замечается очень сильно, это мы видели в уроке о восприятии.
      Поэтому её легко передозировать. В этом уроке — зачем анимация нужна, какой длины и формы она должна быть
      и когда её лучше не делать вовсе.

      ## Зачем нужна анимация

      Хорошая анимация не украшает, а объясняет. Задач у неё немного:
      - **связь состояний** — показать, откуда что пришло и куда ушло. Шторка выезжает снизу и уезжает вниз — человек
        понимает, что под ней тот же экран и что её можно смахнуть обратно;
      - **отклик на действие** — кнопка чуть сжимается при нажатии, переключатель плавно переходит в другое положение,
        и человек чувствует, что нажатие засчитано;
      - **внимание** — новое сообщение плавно появляется, а не возникает рывком.

      Если анимация не делает ничего из этого, она мешает: отнимает время и отвлекает. Простая проверка: если
      убрать анимацию, станет ли человеку что-то непонятно? Если нет — анимация, скорее всего, лишняя.

      ## Длительность

      ![Раскадровка шторки: медленная с отскоком доходит до места только к 800 мс, перелетая выше; быстрая с замедлением — к 250 мс](images/uix-motion-storyboard.png "Шторка в моменты от 0 до 800 мс: как было и как стало")

      На раскадровке видно: старая шторка добирается до места только к восьмистам миллисекундам, новая — к двумстам
      пятидесяти. Сколько вообще должна длиться анимация? Практики из Nielsen Norman Group советуют держать
      большинство анимаций интерфейса в пределах 100–500 мс:
      - **около 100 мс** — мелкий отклик: переключатель, галочка. Это кажется мгновенным, будто человек сам двигает
        предмет;
      - **200–300 мс** — заметная смена: появление окна или шторки;
      - **400 мс** — уже очень медленно, только для больших перемещений через весь экран;
      - **около 500 мс и дольше** — анимация начинает раздражать, особенно если её видят много раз за день.

      Появление обычно чуть длиннее исчезновения: шторка выезжает за 250–300 мс, а уезжает за 200. Важно, что
      анимация, которую человек видит десятки раз в день, должна быть короче той, что видна раз: на демонстрации
      медленная шторка нравится, а на пятом открытии подряд — уже нет.

      ## Кривая движения

      Предметы в жизни не двигаются с постоянной скоростью: они разгоняются и замедляются. Поэтому равномерное
      движение на экране выглядит механическим. В CSS форму движения задаёт **кривая** (easing): `ease-out`,
      `ease-in` или `cubic-bezier(…)`.

      Правило, на котором сходятся руководства:
      - **появление — с замедлением в конце** (ease-out): предмет быстро стартует, и интерфейс кажется отзывчивым,
        а мягкая остановка даёт глазу зацепиться;
      - **уход — с разгоном** (ease-in): предмет уезжает, ускоряясь, и не задерживает человека.

      Отскок — пружинка в конце — выглядит игриво, но добавляет время и движение. Для элемента, который открывают
      много раз, он почти всегда лишний.

      Попробовать обе шторки руками можно на демо-странице:
      [color-zebra.github.io/frontend-quiz/demos/uiux/sheet.html](https://color-zebra.github.io/frontend-quiz/demos/uiux/sheet.html).
      Откройте занятие пять раз подряд в каждом режиме — разница станет ощутимой.

      ## Что анимировать, чтобы не тормозило

      Одна техническая деталь, без которой красивая анимация превращается в рывки. Браузер дёшево двигает
      и проявляет готовую картинку: свойства `transform` и `opacity` он меняет на последнем этапе отрисовки, не пересчитывая
      раскладку страницы. А если анимировать `top`, `left`, `height` или `margin`, браузер на каждом кадре заново
      считает положение всех элементов и перерисовывает их, и на слабом телефоне анимация дёргается.

      Поэтому шторку двигают через `transform: translateY(…)`, а не через `bottom`, и появление делают через `opacity`.

      ## Когда не анимировать

      Есть люди, которым движение на экране физически вредит. При **вестибулярных расстройствах** — нарушениях работы
      внутреннего уха, которое отвечает за равновесие, — параллакс, большие перемещения и масштабирование вызывают
      головокружение, тошноту и головную боль.

      В операционных системах есть настройка «уменьшить движение», и браузер сообщает о ней медиазапросом
      `prefers-reduced-motion: reduce`. Когда она включена:
      - убирают параллакс, автопрокрутку и большие перемещения;
      - заменяют выезд и масштабирование на мягкое проявление или на мгновенную смену;
      - оставляют то, что нужно для смысла, но без движения.

      В демо-странице шторка при этой настройке не выезжает, а проявляется.

      Стандарт WCAG говорит об этом дважды. Обязательное требование: всё, что движется само дольше пяти секунд, —
      карусели, бегущие строки — человек должен уметь остановить. А отключать движение, вызванное действием человека,
      стандарт требует только на высшем, необязательном уровне. Но уважать настройку «уменьшить движение» дёшево,
      и именно это спасает людей, которым от движения плохо.

      ## Типичные ошибки

      - **Медленно ради красоты.** То, что приятно на демонстрации, раздражает на пятом открытии подряд.
      - **Отскок и пружины на частых элементах.** Добавляют время и движение без смысла.
      - **Равномерная скорость.** Выглядит механически; появление — с замедлением, уход — с разгоном.
      - **Анимация `top` и `height`.** Браузер пересчитывает раскладку на каждом кадре, и на слабом телефоне всё дёргается.
      - **Игнорировать «уменьшить движение».** Параллакс и большие перемещения вредят людям с вестибулярными расстройствами.
      - **Карусель без паузы.** Автодвижение дольше пяти секунд должно останавливаться.

      ## Как обсудить с дизайнером

      Попросите длительность и кривую числами, а не словами «плавно» и «живенько»: «250 мс, cubic-bezier(0, 0, 0.2, 1)».
      Спросите, как анимация выглядит при включённой настройке «уменьшить движение». А если в макете медленная
      красивая анимация на частом элементе, предложите проверку: открыть его десять раз подряд — обычно после этого
      спорить уже не о чем.

      ## Коротко

      - Анимация нужна, чтобы показать связь состояний, откликнуться на действие или привлечь внимание. Если без неё
        ничего не становится непонятно, она, скорее всего, лишняя.
      - Длительность интерфейсной анимации — обычно 100–500 мс: около 100 для мелкого отклика, 200–300 для окон
        и шторок. Частые анимации делают короче редких.
      - Появление — с замедлением в конце, уход — с разгоном; равномерное движение выглядит механически, отскок
        на частых элементах лишний.
      - Анимируют `transform` и `opacity`: браузер двигает готовую картинку, не пересчитывая раскладку.
      - При `prefers-reduced-motion` убирают параллакс и большие перемещения, заменяя их проявлением. Автодвижение
        дольше пяти секунд человек должен уметь остановить.

      ## Источники

      - [Executing UX Animations: Duration and Motion Characteristics — Nielsen Norman Group](https://www.nngroup.com/articles/animation-duration/)
      - [Understanding Success Criterion 2.3.3: Animation from Interactions — W3C](https://www.w3.org/WAI/WCAG22/Understanding/animation-from-interactions.html)
      - [prefers-reduced-motion — MDN](https://developer.mozilla.org/en-US/docs/Web/CSS/@media/prefers-reduced-motion)

  - id: uix-words
    topic: Слова и система
    subtopic: Тексты в интерфейсе
    title: Тексты в интерфейсе
    audio: https://color-zebra.github.io/frontend-quiz-audio/ui-ux/uix-words.mp3
    questions: [uix-083, uix-084, uix-085, uix-086, uix-087, uix-088]
    body: |
      ## Какую проблему решаем

      Тексты в «Абонементе» писали разработчики по ходу работы — кто как придумал. В итоге:
      - при попытке записаться на уже начавшееся занятие появлялось «Ошибка 422 Unprocessable Entity»;
      - пустой раздел «Мои записи» у нового клиента показывал серое «Нет данных»;
      - в окне подтверждения записи стояли кнопки «Отмена» и «ОК»;
      - одно и то же действие называлось в расписании «Записаться», на карточке — «Забронировать», в уведомлении —
        «Зарегистрироваться». Клиенты спрашивали, чем бронь отличается от записи.

      Каждый текст по отдельности кажется мелочью. Но интерфейс говорит с человеком именно словами, и для разработчика
      без дизайнера и редактора это самый дешёвый способ сделать интерфейс заметно лучше: поменять слова можно
      за час, без новой вёрстки.

      ## Кнопка называет результат

      ![Окно с кнопками «Отмена» и «ОК» и карточка с кнопкой «Записаться на 19:00» и пояснением, сколько занятий останется](images/uix-words-buttons.png "Кнопки «ОК» и «Записаться на 19:00»")

      Кнопка «ОК» ничего не говорит: человек должен прочитать заголовок и догадаться, что произойдёт. Хорошая кнопка
      сама называет результат: «Записаться на 19:00», «Оплатить 900 ₽», «Отменить запись». Британская дизайн-система
      GOV.UK формулирует правило так: текст кнопки описывает действие, которое она выполняет, и не стоит экономить
      слова, если они нужны для ясности.

      В русских интерфейсах кнопки обычно пишут **инфинитивом** — «Записаться», «Оплатить»: это читается как название
      действия. Повелительное «Запишитесь» звучит как просьба или указание. Встречается и то и другое; важно выбрать
      одно и держаться его во всём приложении.

      ## Ошибка: что случилось и что делать

      ![Сообщение «Ошибка 422 Unprocessable Entity» и сообщение «Не получилось записаться: йога уже началась» с предложением ближайшего занятия](images/uix-words-error.png "Ошибка кодом и ошибка словами")

      «Ошибка 422» — это слова сервера, а не человека. Исследователи Nielsen Norman Group собрали правила хорошего
      сообщения об ошибке:
      - **у места ошибки** и заметно — не только цветом;
      - **обычными словами**, без кодов; код можно показать мелко, если он нужен поддержке;
      - **точно**: что именно не так, а не «Произошла ошибка»;
      - **с выходом**: как исправить или что делать дальше;
      - **без упрёка**: не «Вы ввели неверные данные», а «В адресе нет „@“»;
      - **с сохранением введённого**: человек исправляет одно поле, а не заполняет всё заново.

      В «Абонементе» сообщение стало таким: «Не получилось записаться: йога уже началась. Ближайшее занятие сегодня —
      функциональный тренинг в 20:15», и рядом кнопка «Записаться на 20:15». Человек понимает, что произошло, и сразу
      видит выход.

      ## Пустой экран

      ![Раздел «Мои записи» с серым «Нет данных» и с текстом «Вы пока ни на что не записаны» и кнопкой «Открыть расписание»](images/uix-words-empty.png "Пустой раздел до и после")

      Пустой экран — не «нет данных», а момент, когда интерфейс может помочь. Хороший пустой экран:
      - **говорит, почему пусто**: «Вы пока ни на что не записаны»;
      - **объясняет, что здесь будет**: «Здесь появятся занятия, на которые вы запишетесь»;
      - **даёт действие**: кнопка «Открыть расписание».

      Особенно это важно при первом запуске: у нового человека пусто всё, и именно пустые экраны учат его пользоваться
      приложением. Одна ловушка: не показывать «пусто», пока данные ещё грузятся. Человек увидит «Вы ни на что
      не записаны», испугается за свои записи, а через секунду они появятся. Пока идёт загрузка — индикатор загрузки.

      ## Одно действие — одно слово

      ![Слева одно действие называется «Записаться», «Забронировать» и «Зарегистрироваться» на разных экранах; справа везде «Записаться»](images/uix-words-consistency.png "Одно действие тремя словами и одним")

      Разные слова для одного действия заставляют человека думать, что действия разные. «Забронировать» звучит так,
      будто место держится, но ещё не твоё. «Зарегистрироваться» — будто нужно создать учётную запись. Клиенты
      «Абонемента» так и спрашивали поддержку.

      Это правило называют **единообразием**: одно и то же называется одинаково и выглядит одинаково.
      На практике помогает короткий **словарь интерфейса**: список понятий и слов для них — «запись», «абонемент»,
      «лист ожидания», «отменить запись». Его ведут вместе с кодом, и новые тексты пишут по нему.

      ## Главное — в начало

      В уроке о восприятии мы видели, что текст на экране не читают, а просматривают, и выхватывают начала строк. Отсюда
      два правила для любого текста в интерфейсе:
      - **главное — в начало**: «Отмена без списания — за 4 часа до занятия», а не «Обращаем внимание, что согласно
        правилам клуба отмена без списания возможна…»;
      - **короче**: каждое слово, которое можно убрать без потери смысла, убирают.

      И одна русская договорённость: обращение «вы» в интерфейсе обычно пишут со строчной буквы. Справочники требуют
      прописную «Вы» в письмах конкретному человеку, а интерфейс говорит со всеми сразу. Как и с кнопками, главное —
      одинаково во всём приложении.

      ## Типичные ошибки

      - **«ОК», «Отправить», «Да».** Кнопка не говорит, что произойдёт.
      - **Коды и слова сервера.** «Ошибка 422», «Unprocessable Entity», «null».
      - **Упрёк в ошибке.** «Вы ввели неверные данные» вместо того, что именно не так и как исправить.
      - **«Нет данных».** Пустой экран без объяснения и без действия.
      - **«Пусто», пока грузится.** Человек пугается, что данные пропали.
      - **Разные слова для одного.** Люди думают, что действия разные.
      - **Важное в конце длинной фразы.** Его не дочитают.

      ## Как обсудить с дизайнером

      Тексты в макете — тоже требования, а не «рыба». Спросите, кто пишет тексты и где их окончательный список,
      особенно ошибки и пустые экраны: в макетах их обычно нет. Предложите завести словарь интерфейса, если его нет.
      И когда в макете кнопка «ОК», предложите текст, который называет результат: это изменение, о котором редко спорят.

      ## Коротко

      - Кнопка называет результат: «Записаться на 19:00», «Оплатить 900 ₽», а не «ОК». В русских интерфейсах кнопки
        обычно пишут инфинитивом.
      - Хорошее сообщение об ошибке стоит у места ошибки и отвечает на два вопроса — что случилось и что теперь
        делать — обычными словами и без упрёка. Введённое при этом не пропадает.
      - Пустой экран объясняет, почему пусто и что здесь появится, и даёт действие. Пока идёт загрузка, «пусто»
        не показывают.
      - Одно действие называют одним словом во всём приложении; поможет словарь интерфейса.
      - Главное ставят в начало фразы и убирают лишние слова: текст просматривают, а не читают.

      ## Источники

      - [Error-Message Guidelines — Nielsen Norman Group](https://www.nngroup.com/articles/error-message-guidelines/)
      - [Designing Empty States in Complex Applications — Nielsen Norman Group](https://www.nngroup.com/articles/empty-state-interface-design/)
      - [Button — GOV.UK Design System](https://design-system.service.gov.uk/components/button/)

  - id: uix-system
    topic: Слова и система
    subtopic: Своя дизайн-система
    title: Своя маленькая дизайн-система
    audio: https://color-zebra.github.io/frontend-quiz-audio/ui-ux/uix-system.mp3
    questions: [uix-089, uix-090, uix-091, uix-092, uix-093, uix-094]
    body: |
      ## Какую проблему решаем

      «Абонемент» год делали три разработчика, а часть экранов сгенерировала нейросеть. Каждый подбирал цвета
      и размеры на месте, и каждый раз выбор был разумным. Когда наконец собрали все значения из стилей в одну таблицу,
      оказалось, что в приложении четырнадцать оттенков серого, девять размеров шрифта и три разные кнопки
      «Записаться»: со скруглением 10, 6 и 20 пикселей и чуть разными зелёными.

      ![Слева четырнадцать серых, девять размеров текста и три вида кнопки; справа пять серых по ролям, пять размеров и одна кнопка](images/uix-system-chaos.png "Значения в стилях через год без системы и с токенами")

      Потом решили сделать тёмную тему — и выяснилось, что её некуда добавить: цвета записаны прямо в сотнях мест
      по всем стилям.

      В прошлых уроках мы ввели шкалу отступов, шкалу размеров текста и роли цветов. Этот урок — о том, как собрать
      их в маленькую **дизайн-систему**: набор договорённостей и компонентов, по которым строится весь интерфейс.
      Не о большой организационной истории с отдельной командой, а о том, что может сделать один разработчик за неделю.

      ## Токены

      **Токен** (дизайн-токен) — именованное значение: цвет, отступ, размер шрифта, скругление. Вместо `#0f766e`
      в стилях пишут `var(--color-action)`, вместо `16px` — `var(--space-4)`. В вебе токены обычно и живут
      в CSS-переменных.

      Что это даёт:
      - **одно место правки** — поменять фирменный цвет значит поменять одну строку, а не искать его по сотне файлов;
      - **запрет на произвольное** — значения выбирают из списка, а не придумывают на месте, и разнобой не появляется;
      - **общий язык** — дизайнер в макете и разработчик в коде называют одно и то же одинаково.

      Для обмена токенами между инструментами дизайна и кодом есть общий формат: его разрабатывает сообщество при W3C,
      и первая стабильная версия вышла в октябре 2025 года. Для маленького проекта он не обязателен — хватит
      CSS-переменных, — но знать о нём полезно, если дизайнер приносит токены из своего инструмента.

      ## Три слоя имён

      Самая частая ошибка с токенами — красить компоненты токенами, названными по значению: `--green`, `--gray-900`,
      `--font-16`. Допустим,
      основной текст покрашен `--gray-900`, «самым тёмным серым». В тёмной теме текст должен стать почти белым —
      и имя «самый тёмный серый» начнёт врать. А если бренд сменят с зелёного на синий, `--green` окажется синим.
      Поэтому токены делят на слои — так устроены токены
      и у Google в Material.

      ![Цепочка из трёх слоёв: базовый «teal-700», смысловой «color-action», компонентный «button-primary-bg»](images/uix-system-layers.png "Слои токенов: базовые, смысловые, компонентные")

      - **Базовые** — палитра и шкалы: `teal-700`, `gray-100`, `space-4`. Они говорят, что это за значение, и ничего
        не знают о том, где его используют.
      - **Смысловые** — роли: `color-action`, `color-text-secondary`, `color-surface`. Это те самые роли цветов
        из урока о цвете, только записанные в коде. Смысловой токен ссылается на базовый.
      - **Компонентные** — свойства конкретного компонента: `button-primary-bg`, `card-padding`. Они ссылаются
        на смысловые.

      В маленьком проекте компонентный слой часто не нужен: хватает базовых и смысловых. Главное правило —
      в стилях компонентов использовать смысловые токены, а не базовые и не сырые значения.

      ## Таблица состояний

      Компонент в дизайн-системе — это не одна картинка кнопки, а кнопка во всех состояниях из урока о состояниях:
      обычное, наведение, фокус, нажатие, загрузка, отключено. Для каждого компонента полезно иметь такую таблицу —
      в документации или прямо на странице с примерами — и проверять по ней любое изменение.

      Это и есть защита от трёх разных кнопок «Записаться». Когда кнопка одна и у неё есть все состояния, новому экрану
      нечего придумывать: он берёт готовую.

      ## Тёмная тема — не инверсия

      Когда цвета записаны ролями, тёмная тема становится простой: это **новые значения тех же смысловых токенов**.
      `color-surface` в светлой теме белый, в тёмной — тёмно-серый; `color-action` в светлой — тёмно-зелёный,
      в тёмной — светлее, чтобы на тёмном фоне был достаточный контраст.

      ![Карточка занятия в светлой теме, в тёмной, полученной инверсией цветов, и в тёмной по токенам](images/uix-system-dark.png "Светлая тема, тёмная инверсией и тёмная по токенам")

      Соблазн сделать тёмную тему «одной строкой» — инверсией цветов фильтром — заканчивается плохо: фирменный зелёный
      становится розовым, оранжевая пометка о местах — синей, а фотографии превращаются в негативы.

      Что советует Google для тёмной темы:
      - фон — тёмно-серый, а не чёрный: на сером видны тени, а светлый текст на нём режет глаз меньше, чем на чёрном;
      - чем выше слой — карточка, шторка, окно, — тем светлее его поверхность: в темноте тени почти не видны,
        и глубину показывает яркость.

      Пока делали макет для этого урока, мы сами наступили на типичную ловушку. Текст заголовка карточки был задан
      не смысловым токеном, а жёстко, тёмным цветом. В тёмной теме фон поменялся, а заголовок остался тёмным и почти
      исчез. Каждое значение, записанное мимо токенов, ломается первым, когда появляется вторая тема.

      ## Миф: «тёмная тема полезнее для глаз»

      Тёмную тему часто продают как заботу о зрении. Исследования этого не подтверждают. У людей с обычным зрением
      тёмный текст на светлом фоне читается лучше и точнее, особенно мелкий, — это показывают несколько опытов,
      которые собрали исследователи Nielsen Norman Group. А вот людям с помутнением хрусталика, например при катаракте,
      тёмная тема помогает: меньше рассеянного света.

      **На чём держится:** миф. Верно вместо него: тёмная тема — удобный выбор для части людей, но не лекарство
      для глаз; Nielsen Norman Group советует давать её как вариант, а не делать по умолчанию для всех.

      ## Как удержать единообразие

      Токены и компоненты сами по себе разнобой не остановят: через полгода кто-то снова впишет `#14806f`, потому что
      так было быстрее. Особенно легко это делает нейросеть: она уверенно придумывает «похожий» цвет. Помогает:
      - **проверка линтером** — правило линтера стилей, которое запрещает сырые цвета и размеры и требует токены;
      - **список токенов рядом с кодом** — и в подсказке для нейросети: «используй только эти переменные»;
      - **страница с примерами компонентов** — где видно все компоненты во всех состояниях, и новое сравнивают с ней.

      ## Типичные ошибки

      - **Компоненты на токенах по значению.** `--gray-900` для текста в тёмной теме становится почти белым,
        `--green` после смены
        бренда — синим, и имена врут.
      - **Сырые значения в стилях компонентов.** Тёмная тема и смена бренда ломаются первыми именно на них.
      - **Тёмная тема инверсией.** Фирменные цвета превращаются в чужие, фото — в негативы.
      - **Чёрный фон тёмной темы.** Тени не видны, светлый текст режет глаз.
      - **Компонент без состояний.** Каждый экран дорисовывает их по-своему, и появляются три разные кнопки.
      - **Нет проверки.** Без линтера разнобой возвращается через пару месяцев.

      ## Как обсудить с дизайнером

      Договоритесь об именах токенов и о том, где они живут: в инструменте дизайнера, в коде или в общем файле.
      Лучше, если дизайнер в макете называет цвета ролями — «цвет действия», «второстепенный текст», — а не номерами
      из палитры: тогда макет переводится в код без догадок. А тёмную тему просите в макетах сразу, а не «потом
      инвертируем».

      ## Коротко

      - Токены — именованные значения цвета, отступов, шрифта; в вебе это CSS-переменные. Они дают одно место правки,
        запрет на произвольные значения и общий язык с дизайнером.
      - Токены делят на слои: базовые (палитра), смысловые (роли), компонентные. В стилях компонентов используют
        смысловые, а не сырые значения.
      - У каждого компонента — таблица всех состояний; новый экран берёт готовый компонент, а не рисует свой.
      - Тёмная тема — новые значения смысловых токенов, а не инверсия. Фон — тёмно-серый, верхние слои светлее.
      - «Тёмная тема полезнее для глаз» — миф: при обычном зрении светлая читается лучше, тёмная помогает части людей.
      - Единообразие держит проверка линтером, список токенов рядом с кодом и в подсказках нейросети, страница
        с примерами компонентов.

      ## Источники

      - [Dark Mode vs. Light Mode: Which Is Better? — Nielsen Norman Group](https://www.nngroup.com/articles/dark-mode/)
      - [Dark theme — Material Design 2](https://m2.material.io/design/color/dark-theme)
      - [Design Tokens Format Module — Design Tokens Community Group](https://www.designtokens.org/)

  - id: uix-evaluation
    topic: Проверка и итог
    subtopic: Проверить без дизайнера
    title: Проверить без дизайнера
    audio: https://color-zebra.github.io/frontend-quiz-audio/ui-ux/uix-evaluation.mp3
    questions: [uix-095, uix-096, uix-097, uix-098, uix-099, uix-100]
    body: |
      ## Какую проблему решаем

      Экран записи «Абонемента» переделали по всем урокам курса: иерархия, отступы, цвет, состояния, тексты. Релиз
      завтра. Дизайнера в команде по-прежнему нет. Как понять, что экран действительно стал удобным?

      Самый частый способ — показать коллеге и спросить «ну как?». Коллега скажет «нормально» и будет прав только
      в одном: ему, разработчику, который видел экран десять раз, действительно нормально. Это то же проклятие знания
      из первого урока, только теперь в роли автора вся команда.

      Есть способы проверить интерфейс без дизайнера и без дорогого исследования. Этот урок о двух главных:
      проверка по эвристикам и мини-тест на нескольких людях, — и о том, что из них можно мерить, а что нет.

      ## Проверка по эвристикам

      **Эвристики Нильсена** — десять общих правил удобного интерфейса. Почти все вы уже знаете по этому курсу,
      просто под другими именами:
      1. **Видимость состояния системы** — человек всегда знает, что происходит. Помните кнопку «Оплатить 900 ₽»,
         которая две секунды молчала, и двойную оплату.
      2. **Язык пользователя** — слова людей, а не базы данных: «Возвраты», а не «Корректировки».
      3. **Контроль и свобода** — выход и отмена: плашка «Вернуть», которая не исчезает через две секунды.
      4. **Единообразие и стандарты** — одно действие одним словом и как принято в других приложениях:
         не «Записаться», «Забронировать» и «Зарегистрироваться» вперемешку.
      5. **Предотвращение ошибок** — интерфейс, в котором трудно ошибиться: отмена записи не стоит вплотную
         к «Перенести».
      6. **Узнавание вместо вспоминания** — показывать, а не требовать помнить: правило отмены у кнопки,
         а не в «Правилах клуба».
      7. **Гибкость для опытных** — короткие пути для тех, кто пользуется каждый день, которые не мешают
         новичкам. Например, повторить прошлую запись в одно касание.
      8. **Эстетика и минимализм** — ничего лишнего: экран, где выделено всё, не выделяет ничего.
      9. **Понятные ошибки** — что случилось и что делать: «йога уже началась», а не «Ошибка 422».
      10. **Справка** — если она нужна, то короткая и в том месте, где возник вопрос.

      **Эвристическая оценка** — проверка интерфейса по этому списку. Как её проводить, советуют исследователи
      Nielsen Norman Group: три-пять человек по отдельности проходят экран, записывают каждое нарушение с номером
      эвристики и оценкой тяжести, и только потом сводят списки вместе. По отдельности — потому что каждый замечает
      своё, а обсуждение до сведения сбивает всех на одно мнение.

      ![Таблица нарушений эвристик на старом экране записи: «Оплатить 900 ₽» без отклика, отмена на две секунды, три слова для записи, правило отмены спрятано, «Ошибка 422»](images/uix-eval-heuristics.png "Эвристическая оценка старого экрана записи")

      Прогнав старый экран записи «Абонемента» по эвристикам, команда нашла почти все жалобы, которые разбирала весь
      курс. Это дёшево — час-два на человека — и полезно. Но у оценки есть предел: её делают те же люди, которые знают
      интерфейс. Поэтому она не заменяет проверку на тех, кто экран не видел.

      ## Мини-тест на пяти людях

      **Тест на пользователях** в самом простом виде: несколько человек, похожих на ваших клиентов, по очереди
      выполняют реальные задачи на экране, а вы смотрите. Для этого не нужна лаборатория — хватит ноутбука или
      телефона и часа на человека.

      ![Протокол мини-теста: четыре задачи с цитатами участницы и результатами — успех за 14 секунд, успех за 41 секунду, не нашла за 2 минуты, думает, что записалась на сайкл](images/uix-eval-protocol.png "Протокол мини-теста нового экрана записи")

      Как провести:
      - **задачи — реальные и без подсказок в словах**: не «нажмите „Отменить запись“», а «вы передумали — освободите
        место на йоге»;
      - **просите думать вслух**: человек проговаривает, что ищет и что думает. Так видно не только где он ошибся,
        но и почему;
      - **молчите и не помогайте**. Самое трудное правило: хочется подсказать. Но подсказанный кусок теста ничего
        не показывает, его выбрасывают;
      - **записывайте**: успех или нет, сколько времени, где засомневался, дословные фразы.

      Мини-тест нового экрана «Абонемента» нашёл две вещи. Первая: правило отмены, которое нашла ещё оценка
      по эвристикам, вынесли из абзаца, но спрятали под ссылку «Подробнее» — и его всё равно почти никто не нашёл.
      Исправление не сработало, и стало это видно только на людях. Вторая — то, чего эвристики поймать не могли.
      Трое из пяти участниц решили, что кнопка «Сообщить мне» на занятии без мест уже записывает их, и потом
      удивлялись, что записи нет. Команда знала, что это лист ожидания, и кнопка казалась ей понятной — проклятие
      знания в чистом виде. Кнопку переименовали в «Встать в лист ожидания».

      ## Сколько людей нужно

      В мини-тесте «Абонемента» было пять участниц, и это не случайное число. Знаменитое правило «достаточно пяти
      человек» Якоб Нильсен вывел на своей модели: пятеро находят около
      85 % проблем удобства, а каждый следующий человек добавляет всё меньше нового. Но у этого вывода есть условия:
      - проблемы **достаточно частые**: модель считает, что каждый участник натыкается примерно на треть всех
        проблем. Редкую проблему, которую встречает один человек из десяти, пятеро скорее всего не увидят;
      - тест **качественный**: цель — найти проблемы, а не измерить числа;
      - люди **похожи** друг на друга и решают одни задачи; если групп несколько, например клиенты и администраторы,
        каждую проверяют отдельно;
      - тест **повторяют**: нашли проблемы, исправили, проверили снова. Три теста по пять человек лучше одного
        на пятнадцать.

      **На чём держится:** исследование с условиями. Пять человек — для поиска проблем, а не для чисел.

      ## Что мерить и когда нужны числа

      Иногда нужен не список проблем, а число: стало ли лучше, на сколько быстрее. Обычно мерят:
      - **успех задачи** — какая доля людей справилась;
      - **время** — сколько ушло на задачу;
      - **ошибки** — сколько раз человек пошёл не туда;
      - **удовлетворённость** — например, опросником **SUS**: десять коротких вопросов, балл от 0 до 100, средний
        по множеству продуктов — около 68.

      Главная ловушка — мерить на пятерых. Если трое из пяти справились быстрее, это может быть случайность: разброс
      между людьми огромный. По расчётам Nielsen Norman Group, даже на десяти людях погрешность среднего времени около четверти
      в обе стороны. Для чисел нужно хотя бы двадцать человек, а для большинства количественных исследований —
      около сорока.

      ## A/B-тест

      Когда у продукта много пользователей, можно показать двум группам разные версии и сравнить, где лучше
      результат, — это **A/B-тест**. Он отвечает на вопрос «что лучше» на настоящих людях в настоящей работе.

      Но у него два ограничения. Нужен трафик, причём считают не посещения, а нужные действия: если в день
      записываются несколько десятков человек, разницу в несколько процентов не отличить от случайности.
      И A/B-тест говорит «что», но не «почему»: версия Б лучше, а чем именно — неизвестно. Поэтому его сочетают
      с мини-тестами, которые показывают причины. Для небольшого продукта вроде клубного приложения мини-тесты
      обычно полезнее.

      ## Типичные ошибки

      - **«Ну как?» коллеге.** Коллега знает интерфейс и видит то, что знает.
      - **Подсказывать на тесте.** Подсказанный кусок ничего не показывает.
      - **Задачи с ответом в словах.** «Нажмите „Отменить запись“» проверяет чтение, а не интерфейс.
      - **Мерить на пятерых.** Разброс огромный, и любая разница может быть случайной.
      - **Один большой тест вместо нескольких маленьких.** Проблемы находят, но не проверяют исправления.
      - **Эвристическая оценка вместо теста.** Она дешевле, но её делают люди, которые знают интерфейс.

      ## Как обсудить с дизайнером

      Лучший довод в любом споре об интерфейсе — запись того, как настоящий человек не нашёл кнопку. Если дизайнер
      и разработчик спорят, предложите не спорить дальше, а дать двум-трём людям задачу и посмотреть. Результаты
      показывайте как наблюдения — «трое из пяти решили, что „Сообщить мне“ уже записывает», — а не как мнение.
      И помните про условия: пятеро — чтобы найти проблему, а не чтобы доказать, что вариант А на 12 % быстрее.

      ## Коротко

      - Проверка у коллеги «ну как?» не работает: он знает интерфейс. Нужны правила и люди, которые экран не видели.
      - Эвристическая оценка — проверка по десяти эвристикам Нильсена. Её делают три-пять человек по отдельности
        и сводят потом. Это дёшево, но не заменяет теста на людях.
      - Мини-тест: реальные задачи без подсказки в словах, человек думает вслух, ведущий молчит и не помогает.
      - Пять человек находят большую часть проблем, если тест качественный, люди похожи и тест повторяют после
        исправлений.
      - Для чисел — успеха, времени, ошибок, балла SUS — нужно хотя бы двадцать человек, лучше около сорока.
      - A/B-тест показывает, что лучше, но не почему, и нужен большой трафик; его сочетают с мини-тестами.

      ## Источники

      - [Why You Only Need to Test with 5 Users — Nielsen Norman Group](https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/)
      - [How to Conduct a Heuristic Evaluation — Nielsen Norman Group](https://www.nngroup.com/articles/how-to-conduct-a-heuristic-evaluation/)
      - [Thinking Aloud: The #1 Usability Tool — Nielsen Norman Group](https://www.nngroup.com/articles/thinking-aloud-the-1-usability-tool/)

  - id: uix-case
    topic: Проверка и итог
    subtopic: Разбор экрана
    title: 'Разбор: переделываем экран'
    audio: https://color-zebra.github.io/frontend-quiz-audio/ui-ux/uix-case.mp3
    questions: [uix-101, uix-102, uix-103, uix-104, uix-105]
    body: |
      ## Какой экран разбираем

      Экран **«Занятие»** — сердце «Абонемента». Его открывают по нажатию на занятие в расписании, а он
      решает одну задачу: понять, что это за занятие, и записаться на него. Первая версия экрана собрала почти
      все ошибки, которые мы разбирали в курсе: её сверстали быстро, на удобных данных и на большом мониторе.

      ![Экран «Занятие» до переделки: семь номеров у проблемных мест, по номерам шагов урока](images/uix-case-before.png "Экран «Занятие» до переделки")

      В этом уроке переделаем экран целиком, шаг за шагом. У каждого изменения — правило из курса и причина,
      почему оно работает. Порядок шагов не случаен: сначала то, что мешает выполнить главную задачу, потом то, что
      мешает читать, и в конце — то, что ломается на особых случаях.

      ## Шаг 1. Главное действие

      **Что не так.** «Записаться» — светло-серая кнопка в правом нижнем углу, на вид как отключённая. На экране,
      где главная задача — записаться, главное действие почти не видно.

      **Что сделали.** Одна основная кнопка во всю ширину, цветом действия: «Записаться на 19:00». Текст называет
      результат и время, чтобы человек не сомневался, на что записывается.

      **Почему.** Глаз сразу замечает то, что отличается от соседей одним заметным признаком, — цветом, заливкой.
      Серая кнопка среди серого текста ничем не отличается, и её ищут. Одна основная кнопка на экране не спорит
      с другими за внимание, а текст «на 19:00» снимает вопрос, что именно произойдёт после нажатия.

      ## Шаг 2. Иерархия

      **Что не так.** Название занятия всего 16 пикселей, время и зал — мелким бледным текстом в одной строке.
      Прищурившись, на экране видишь только фото и пустоту.

      **Что сделали.** Название — крупно, следующим — время, ниже, спокойнее, — зал и места. Порядок взгляда теперь
      совпадает с важностью: что, когда, есть ли места.

      **Почему.** Глаз замечает крупное и тяжёлое раньше мелкого и бледного. Если порядок по размеру совпадает
      с порядком важности, человек читает экран в нужной последовательности, даже не задумываясь.

      ## Шаг 3. Места словами, а не точкой

      **Что не так.** Свободные места показывала только зелёная точка. Для каждого двенадцатого мужчины она того же
      цвета, что красная «мест нет», а сколько мест осталось, не видно никому.

      **Что сделали.** «Осталось 3 места из 12» — словами, оранжевым, с достаточным контрастом.

      **Почему.** Каждый двенадцатый мужчина плохо различает красный и зелёный, а слово «осталось 3 места» читает
      любой. Цвет остаётся подсказкой, но смысл держится на словах — этого и требует стандарт WCAG.

      ## Шаг 4. Правило отмены — у кнопки

      **Что не так.** Самое важное для клиента правило — отменить без списания можно не позже чем за четыре часа —
      стояло в середине бледного сплошного абзаца. Люди узнавали о нём, когда занятие уже списали.

      **Что сделали.** Описание занятия оставили коротким, а правило вынесли отдельной заметной строкой прямо над
      кнопкой и посчитали за человека: «Отмена без списания — до 15:00». Не нужно помнить правило и вычитать
      из семи вечера четыре часа.

      **Почему.** Сплошной текст не читают, а просматривают: верхние строки и левый край. Правило в середине абзаца
      проходит мимо глаз. А посчитанное время «до 15:00» не нужно ни помнить, ни вычислять — его достаточно увидеть.

      ## Шаг 5. Тренер на настоящих данных

      **Что не так.** Сегодня йогу ведёт тренер на замене — Анастасия Белоусова-Константинопольская, она только
      пришла в клуб. Её имя обрезалось многоточием, а фото у неё
      нет, и на его месте висела пустая рамка.

      **Что сделали.** Имя переносится на вторую строку, вместо фото — инициалы в цветном круге.

      **Почему.** По имени тренера клиент выбирает занятие, и обрезанное «Анастасия Белоусова-Констан…» не отличить
      от другой Анастасии. Обрезать можно только то, что можно прочитать где-то ещё, а имя переносят. Пустая рамка
      вместо фото выглядит как ошибка, а инициалы — как задуманное.

      ## Шаг 6. Отмена — не рядом с частым

      **Что не так.** Внизу рядом с «перенести» стоял крошечный крестик отмены записи — та самая жалоба
      «случайно отменил».

      **Что сделали.** На экране занятия, пока человек не записан, отмене просто нечего делать. Для записанных она
      живёт в «Моих записях» — отдельной строкой с подписью и в полную высоту пальца, далеко от частой кнопки.

      **Почему.** Палец касается пятном и промахивается на миллиметры, а в маленькую цель рядом с частой
      промахиваются чаще всего. Поэтому опасное действие делают крупным, подписанным и отодвигают от частого.

      ## Шаг 7. Кнопка над полоской жестов

      **Что не так.** Липкая кнопка стояла вплотную к нижнему краю, и полоска системных жестов ложилась прямо на неё.

      **Что сделали.** Под кнопкой — отступ безопасной зоны через `env(safe-area-inset-bottom)`.

      **Почему.** Низ экрана на телефоне занят системными жестами: касание там уходит системе, а не кнопке.
      Браузер сообщает размер этой полосы через безопасную зону, и отступ на её высоту выводит кнопку из-под жестов.

      ## Шаг 8. Состояния кнопки

      Последнее, что не видно на неподвижной картинке: что происходит после нажатия. Кнопка сразу переходит
      в состояние загрузки — «Записываем…» — и не принимает повторных нажатий. Когда запись прошла, на месте кнопки
      появляется «✓ Вы записаны» и подсказка, где отменить. Никакого окна «Вы записаны!» поверх экрана.

      ![Кнопка в состоянии «Записываем…» и метка «Вы записаны, 19:00» с подсказкой, где отменить](images/uix-case-states.png "Что происходит после нажатия")

      **Почему.** Человек должен видеть, что его нажатие услышано, иначе он нажмёт ещё раз — так и случилась двойная
      оплата из первого урока. А окно поверх экрана прерывает человека и уместно только там, где от него нужен ответ.

      ## Что получилось

      ![Экран «Занятие» после переделки: крупное название и время, места словами, тренер с инициалами, правило отмены у кнопки, одна основная кнопка](images/uix-case-after.png "Экран «Занятие» после переделки")

      Ни одно изменение не потребовало дизайнерского таланта. Каждое — применение правила, у которого есть причина.
      И экран не стал «красивее» в смысле украшений: на нём стало меньше, а не больше. Главное видно первым, нужное
      сказано словами, крайние случаи не ломают вёрстку.

      На компьютере тот же экран раскладывается в три колонки: навигация, описание, карточка записи. Карточка
      записи с временем, местами, правилом отмены и кнопкой — тот же компонент, что на телефоне.

      ![Экран «Занятие» на компьютере: навигация слева, описание посередине, карточка записи справа](images/uix-case-desktop.png "Экран «Занятие» на широком экране")

      ## Как проверить, что стало лучше

      Переделку не принимают на веру — даже если каждое изменение опирается на правило. Перед выпуском экран прогнали
      по эвристикам три человека из команды и потом устроили мини-тест на пяти клиентах клуба: «запишитесь
      на сегодняшнюю йогу», «узнайте, до какого времени можно отменить без списания». Этот тест и показал, что правило
      отмены нужно не просто вынести из абзаца, а посчитать время за человека: «до 15:00».

      ## Типичные ошибки разбора

      - **Править всё сразу без порядка.** Сначала главная задача экрана, потом читаемость, потом особые случаи.
      - **Улучшать украшениями.** Тени, градиенты и анимации не исправляют невидимую кнопку и спрятанное правило.
      - **Проверять только на удобных данных.** Длинное имя и тренер без фото ломают экран после выпуска.
      - **Не проверять результат на людях.** Правило из курса подсказывает решение, а тест показывает, сработало ли оно.

      ## Как обсудить с дизайнером

      Такой разбор — хороший формат разговора. Не «мне не нравится экран», а список: что не так, что предлагаем
      и на чём это держится — исследование, стандарт или договорённость. Дизайнер может не согласиться
      с договорённостью — и это нормальный спор, — но со стандартом и исследованием спорить приходится данными.

      ## Коротко

      - Экран переделывают по порядку: сначала главное действие и иерархия, потом читаемость, потом крайние случаи
        и состояния.
      - Каждое изменение называет правило и то, на чём оно держится: исследование, стандарт или договорённость.
      - Хороший экран обычно не богаче, а беднее: меньше выделений, меньше слов, одна основная кнопка.
      - Важное правило не прячут в абзаце: выносят к действию и по возможности считают за человека («до 15:00»).
      - Переделку проверяют: эвристическая оценка командой и мини-тест на нескольких людях.

      ## Итоги курса

      Курс начинался с четырёх жалоб на экран расписания и с утверждения, что удобство — не дело вкуса. Теперь за каждой
      жалобой видна причина: как глаз просматривает экран, почему выпрыгивает одно отличие, сколько места нужно пальцу,
      почему пустой экран и текст ошибки — тоже интерфейс. А у каждого правила — уровень: исследование, стандарт,
      договорённость или миф.

      Если бы «Абонемент» был настоящим, следующей проверкой стали бы письма в поддержку: пропали ли из них четыре
      жалобы первого урока. Это тоже часть работы — не считать экран готовым, пока не видно, что людям стало проще.

      Этого достаточно, чтобы сделать приличный интерфейс без дизайнера — и чтобы с дизайнером говорить на одном
      языке. Самое полезное, что стоит унести из курса, — не список правил, а привычка спрашивать: «Почему это так?
      На чём это держится? Проверили ли мы это на людях?»

      ## Источники

      - [10 Usability Heuristics for User Interface Design — Nielsen Norman Group](https://www.nngroup.com/articles/ten-usability-heuristics/)
      - [Why You Only Need to Test with 5 Users — Nielsen Norman Group](https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/)

questions:
  # ===================== Введение =====================
  - id: uix-001
    topic: Введение
    subtopic: UI, UX и доказательность
    level: junior
    question: |
      В приложении доставки еды удобное меню и оплата в два нажатия. Но курьер звонит с незнакомого номера, не может
      найти подъезд, и еда приезжает холодной. Оценки сервиса падают. К чему относится проблема?
    options:
      - text: 'К опыту пользователя: экраны удобные, но путь человека до еды плохой'
        correct: true
        why: 'UX — весь опыт решения задачи с компанией, от заказа до горячей еды на столе. Интерфейс здесь хорош, а опыт плохой — это и есть разница между UX и интерфейсом.'
      - text: 'К интерфейсу: значит, экраны заказа и оплаты нужно перерисовать заново'
        why: 'Меню и оплата по условию удобные. Перерисовка экранов не вернёт курьеру точный адрес и не сделает еду горячей.'
      - text: 'К удобству: раз отзывы плохие, приложением трудно пользоваться'
        why: 'Удобство — насколько легко пользоваться интерфейсом. С ним как раз всё в порядке, плохо то, что происходит за пределами экранов.'
      - text: 'Ни к UI, ни к UX: опыт пользователя заканчивается на экранах приложения'
        why: 'Опыт пользователя включает всё взаимодействие с компанией, а не только экраны. Холодная еда — часть этого опыта, даже если чинить её будут не в коде.'
    explanation: |
      **UI** — то, что человек видит и нажимает. **UX** — весь его опыт решения задачи с компанией. **Удобство**
      (usability) — насколько легко пользоваться интерфейсом. Удобный интерфейс не спасает плохой опыт: человек
      оценивает не экраны, а то, решил ли он свою задачу.
    links:
      - https://www.nngroup.com/articles/definition-user-experience/

  - id: uix-002
    topic: Введение
    subtopic: UI, UX и доказательность
    level: middle
    multiple: true
    question: |
      Команда спорит, делать ли в школьном приложении для родителей нижнюю панель с пятью разделами. Звучат
      четыре довода. Какие из них опираются на договорённость, а не на исследование или стандарт?
    options:
      - text: '«Так советует руководство Apple для приложений на iPhone»'
        correct: true
        why: 'Рекомендации платформ — договорённость: люди привыкли к ним по другим приложениям, поэтому их стоит соблюдать. Но это решение компании, а не результат опыта с описанным методом.'
      - text: '«Так устроены почти все приложения, и люди к этому привыкли»'
        correct: true
        why: 'Довод от привычки — тоже договорённость: он верен, пока так делают другие. Это весомая причина, но не закон природы, и с ней можно спорить, если понятна цена.'
      - text: '«Так требует WCAG, а соблюдать WCAG требует закон о доступности»'
        why: 'Это стандарт: требование записано и принято, и закон может сделать его обязательным. Уровень такого довода выше договорённости.'
      - text: '«Это проверили на сорока людях, есть статья с методом»'
        why: 'Это исследование: правило проверили на людях и описали как. Чтобы его оспорить, нужно другое исследование или условие, при котором оно неверно.'
    explanation: |
      В курсе у каждого правила один из четырёх уровней. **Исследование** — проверено опытом на людях, есть
      публикация с методом. **Стандарт** — записано и принято, бывает обязательно по закону. **Договорённость** —
      гайды платформ, привычки людей, эвристики, традиции типографики: их соблюдают, потому что люди привыкли,
      но спорить с ними можно. **Миф** — популярное правило без подтверждения. Уровень подсказывает, что делать
      с доводом: исследование и стандарт нарушают только с веской причиной, договорённость — когда понятна цена,
      миф не используют вовсе.

  - id: uix-003
    topic: Введение
    subtopic: UI, UX и доказательность
    level: junior
    question: |
      Разработчик банковского приложения сделал новый экран перевода и сам его проверил: нашёл всё за секунды.
      Первые пользователи жалуются, что не понимают, где выбрать счёт, с которого списать деньги. Почему проверка
      автора ничего не показала?
    options:
      - text: 'Автор знает, где что лежит на экране, и видит то, что знает сам'
        correct: true
        why: 'Это проклятие знания: тому, кто знает, трудно представить экран глазами того, кто видит его впервые. Автор сам поставил выбор счёта на место, поэтому находит его сразу.'
      - text: 'Автор проверял слишком быстро и смотрел на экран невнимательно'
        why: 'Внимательность не спасает: внимательный автор тоже видит то, что знает. Помогают правила с причиной и проверка на людях, которые экран не видели.'
      - text: 'У пользователей другие телефоны, и экран у них выглядит иначе'
        why: 'Разница устройств бывает важна, но в условии нет ничего о том, что экран сломан. Люди видят тот же экран и всё равно не находят выбор счёта.'
      - text: 'Пользователи невнимательны, им поможет обучение при первом запуске'
        why: 'Если новые люди массово не находят элемент, дело в экране, а не в людях. Обучение маскирует проблему: его пропускают и забывают.'
    explanation: |
      **Проклятие знания** (curse of knowledge): кто знает, тому трудно представить, как это выглядит для незнающего.
      В опыте Элизабет Ньютон люди выстукивали мелодии песен и ожидали, что слушатели угадают примерно половину,
      а те угадали 3 из 120: выстукивающий слышит мелодию в голове, слушатель — только стук. Автор интерфейса
      в том же положении. Поэтому экран проверяют правилами с понятной причиной и на людях, которые его не видели.

  - id: uix-004
    topic: Введение
    subtopic: UI, UX и доказательность
    level: middle
    multiple: true
    question: |
      Дизайнер прислал фронтендеру макет экрана заказа такси — на ширине компьютера, со всеми полями заполненными
      и найденной машиной. Других материалов нет. Что стоит попросить у дизайнера до начала вёрстки?
    options:
      - text: 'Тот же экран на ширине телефона, где им будут пользоваться чаще всего'
        correct: true
        why: 'Такси заказывают с телефона. Как экран перестраивается на узкой ширине — решение дизайна, а не вёрстки, и угадывать его в коде рискованно.'
      - text: 'Состояния: поиск машины, машин рядом нет, ошибка оплаты, долгий ответ'
        correct: true
        why: 'Макет показывает только удачный случай. Что видит человек, пока машина ищется или когда её нет, — главные минуты его опыта, и их тоже нужно нарисовать.'
      - text: 'Сценарий: откуда человек попадает на экран и что он делает после'
        correct: true
        why: 'Экран — шаг пути. Не зная, что было до и после, легко сделать лишние шаги или потерять данные, которые человек уже ввёл.'
      - text: 'Отдельный макет под каждую популярную модель телефона и планшета'
        why: 'Это лишняя работа: моделей сотни. Достаточно макетов на нескольких ширинах и правила, как экран ведёт себя между ними.'
      - text: 'Описание запросов к серверу, которыми экран получает данные о машинах'
        why: 'Описание запросов фронтендеру действительно нужно, но это вопрос к бэкенду, а не к дизайнеру. Дизайнер отвечает за то, что видит человек.'
    explanation: |
      Фронтендер обычно получает **макет** и **UI-кит**. Но удачный макет на компьютере — малая часть работы
      дизайнера. До вёрстки стоит получить **сценарий** (путь человека), **вид на телефоне** и **все состояния**:
      загрузку, пустоту, ошибку, долгий ответ. Если их нет, это вопрос к дизайнеру, а не решение «додумаем в коде».
      Без дизайнера эти шаги проходит сам разработчик, хотя бы коротко.

  - id: uix-106
    topic: Введение
    subtopic: UI, UX и доказательность
    level: senior
    question: |
      Складское приложение работает на сканерах, а кладовщики носят толстые перчатки. Дизайнер предлагает убрать
      привычную нижнюю панель с пятью маленькими разделами и сделать главный экран из четырёх огромных кнопок.
      Разработчик возражает: «Так не делают, это против рекомендаций Apple и Google». Как оценить спор?
    options:
      - text: 'Рекомендация — договорённость, и тут её цена оправдана перчатками'
        correct: true
        why: 'Рекомендации платформ — договорённость: их нарушают, когда понятно, чем заплатят люди. Кладовщики в перчатках промахиваются по маленьким целям, а к новому экрану их приучит обязательный инструктаж на смене — это не подсказка, которую можно пропустить.'
      - text: 'Прав разработчик: рекомендации платформ — стандарт, их не нарушают'
        why: 'Рекомендации Apple и Google — договорённость, а не стандарт вроде WCAG. С ними можно спорить, если назвать цену.'
      - text: 'Прав дизайнер: договорённость ничего не стоит, её можно не учитывать'
        why: 'Договорённость стоит привычек людей: нарушая её, платят тем, что человек ищет знакомое и не находит. Здесь цена оправдана, но она есть.'
      - text: 'Спор не решить, пока нет опубликованного исследования про склады'
        why: 'Ждать публикации не нужно: довод — понятная цена и выгода для конкретных людей. А проверить решение можно, дав двум-трём кладовщикам в перчатках пройти задачу на макете.'
    explanation: |
      Уровень правила подсказывает, что с ним делать. **Исследование и стандарт** нарушают только с очень веской
      причиной. **Договорённость** — рекомендации платформ, традиции, эвристики — нарушают, когда понятно, чем
      за это заплатят люди, и цена того стоит. Перчатки делают маленькие цели опасными, а к новому экрану
      кладовщиков приучит обязательный инструктаж на смене. Это не всплывающая подсказка, которую пропускают:
      здесь обучение — часть работы, а не заплатка на неудобный экран.

  # ===================== Как человек видит =====================
  - id: uix-005
    topic: Как человек видит
    subtopic: Внимание и просмотр экрана
    level: junior
    question: |
      В кабинете продавца на маркетплейсе — список из двадцати заказов, все строки одинаковые: серый текст на белом.
      Один заказ просрочен, и продавцы его пропускают. Как сделать, чтобы просроченный заказ замечали сразу, ещё
      не читая списка?
    options:
      - text: 'Выделить его одним отличием: красной меткой «Просрочен» в начале строки'
        correct: true
        why: 'Отличие по одному простому признаку, например цвету, «выпрыгивает»: его видно сразу, сколько бы строк ни было вокруг.'
      - text: 'Раскрасить все статусы в разные цвета, чтобы каждый статус было видно сразу'
        why: 'Когда цветное всё, просроченному заказу не из чего выпрыгивать: глаз снова ищет перебором, только теперь среди пёстрых строк.'
      - text: 'Дописать в конец строки слово «просрочен» тем же серым шрифтом'
        why: 'Слово того же цвета и размера ничем не отличается от соседних — его найдут, только прочитав строку. А конец строки при просмотре видят хуже всего.'
      - text: 'Перенести его в самый конец списка, чтобы он стоял отдельно'
        why: 'Конец списка — место, куда взгляд доходит реже всего. Отделить заказ положением, не изменив его вида, значит спрятать его ещё дальше.'
    explanation: |
      Эффект **«выпрыгивания»** (pop-out): предмет, который отличается от соседей одним простым признаком — цветом,
      размером, движением, — замечается мгновенно, без поиска. Работает именно одно отличие: если выделено всё,
      ни одному элементу не на чем выделиться.

  - id: uix-006
    topic: Как человек видит
    subtopic: Внимание и просмотр экрана
    level: junior
    question: |
      ![Страница отеля: вверху зелёный блок с градиентом «Бесплатная отмена до 20 мая!», ниже фото и карточка номера с ценой](images/uix-q-hotel-promo.png "Страница отеля в приложении бронирования")

      Условие о бесплатной отмене — важное для решения о брони. Но гости, которые уже забронировали, спрашивают
      в поддержке, можно ли отменить бесплатно. Почему они пропустили блок вверху страницы?
    options:
      - text: 'По месту и по виду блок похож на рекламу, его пропускают не глядя'
        correct: true
        why: 'Это баннерная слепота: яркий прямоугольник с градиентом и восклицательным знаком в верхней полосе люди принимают за рекламу и пропускают, даже если в нём нужное.'
      - text: 'Блок видели, но не поверили: условие сочли уловкой временной акции'
        why: 'Так бывает, но тогда гости не спрашивали бы, можно ли отменить, — они бы уточняли, правда ли это. Они не видели условия вовсе: блок приняли за рекламу и пропустили.'
      - text: 'Люди не прокручивают страницу и не дошли до этого блока'
        why: 'Блок стоит в самом верху, прокручивать до него не нужно. Его видели — просто приняли за рекламу.'
      - text: 'В блоке слишком мало текста, условия нужно расписать подробнее'
        why: 'Длинный текст в том же рекламном прямоугольнике пропустят так же. Сначала блок должен выглядеть как часть страницы, а не как реклама.'
    explanation: |
      **Баннерная слепота** (banner blindness) — привычка пропускать всё, что похоже на рекламу: по месту (верхняя
      полоса, правая колонка) или по оформлению (цветной прямоугольник, градиент, текст на картинке). Её заметили
      ещё на первых сайтах, и с тех пор исследования со слежением за взглядом не раз её подтверждали. Нужное
      условие лучше оформить как обычное
      содержимое — например, строкой в карточке номера рядом с ценой: «Бесплатная отмена до 20 мая».
    links:
      - https://www.nngroup.com/articles/banner-blindness-old-and-new-findings/

  - id: uix-007
    topic: Как человек видит
    subtopic: Внимание и просмотр экрана
    level: middle
    question: |
      Аналитик страховой компании записал, куда смотрят клиенты на странице с условиями страховки — это три
      длинных абзаца текста. Следы взгляда складываются в букву F: две строки вверху и дальше полоса по левому краю. Какой вывод правильный?
    options:
      - text: 'Текст не размечен: нужны заголовки, списки и главное в начале строк'
        correct: true
        why: 'F-паттерн — поведение по умолчанию, когда в тексте нет подсказок для глаза. Заголовки и главное в начале строк дают взгляду, за что зацепиться, и условия перестают теряться в середине абзацев.'
      - text: 'Страница свёрстана правильно: люди читают по букве F, так и задумано'
        why: 'F — не схема, под которую верстают, а признак проблемы: всё, что не в начале строк и не в первых абзацах, клиенты пропустили.'
      - text: 'Выделить жирным половину текста, чтобы глазу было за что зацепиться'
        why: 'Выделение работает, только когда выделено немногое. Если жирная половина текста, ничего не выпрыгивает, и взгляд снова идёт по букве F.'
      - text: 'Клиентам тема неинтересна, и никакое оформление тут не поможет'
        why: 'Люди пришли выбирать страховку, интерес у них есть. Просматривают они, потому что текст не подсказывает, где главное, а не потому что им всё равно.'
    explanation: |
      Nielsen Norman Group описывает несколько способов просмотра текста. **F-паттерн** возникает, когда у текста нет сильных
      подсказок для глаза, и считается плохим исходом: пропадает всё, что не в начале строк. **Слоёный пирог** —
      глаз пробегает заголовки и читает нужный раздел — появляется, когда у текста есть ясные заголовки. Поэтому
      F на записи взгляда — повод разметить текст: разделы с заголовками, главное в начале, перечисления списком.
    links:
      - https://www.nngroup.com/articles/f-shaped-pattern-reading-web-content/

  - id: uix-008
    topic: Как человек видит
    subtopic: Внимание и просмотр экрана
    level: middle
    question: |
      Магазин одежды выбирает, как оформить условия возврата. Покупатели часто пропускают главное условие: вернуть
      можно в течение 14 дней, если сохранены бирки.

      ![Вариант А: условия возврата одним сплошным абзацем](images/uix-q-returns-a.png)

      ![Вариант Б: те же условия под заголовками, списком, срок выделен жирным в начале пункта](images/uix-q-returns-b.png)

      Какой вариант лучше и почему?
    options:
      - text: 'Б: заголовки ведут взгляд к разделу, а срок стоит в начале пункта'
        correct: true
        why: 'Человек пробегает заголовки, находит «Когда можно вернуть» и сразу видит срок в начале строки. Это просмотр «слоёным пирогом» — способ, при котором нужное находят быстрее всего.'
      - text: 'Б: текст в нём заметно короче, а короткий текст обычно читают целиком'
        why: 'Б действительно немного короче, но дело не в длине: даже сокращённое условие, набранное сплошным абзацем, теряется посреди строки. Решают заголовки и место срока в начале пункта.'
      - text: 'А: сплошной абзац читают подряд и ничего в нём не пропускают'
        why: 'Наоборот: незнакомый сплошной текст просматривают, и взгляд идёт по F — середина строк пропадает. Условие о бирках стоит как раз посреди строки.'
      - text: 'А: один абзац выглядит солиднее, и ему больше доверяют'
        why: 'Солидность здесь ни при чём: покупатель ищет конкретное условие. Если он его не нашёл, доверие падает после первого отказа в возврате.'
    explanation: |
      Незнакомую страницу обычно не читают, а просматривают. В сплошном абзаце взгляд идёт по **F-паттерну**
      и теряет середину строк. Текст с ясными заголовками просматривают **слоёным пирогом**: по заголовкам находят
      нужный раздел и читают его. Помогает и главное в начале пункта: первые слова строк видят лучше всего.

  - id: uix-009
    topic: Как человек видит
    subtopic: Внимание и просмотр экрана
    level: middle
    question: |
      Школа программирования делает страницу курса. Руководитель просит уместить в первый экран всё: программу,
      отзывы, цены, преподавателей и форму записи — «ниже первого экрана никто не смотрит». Что ему ответить?
    options:
      - text: 'Наверх — что за курс и кнопку записи, остальное ясным продолжением ниже'
        correct: true
        why: 'Верх видят больше всего, поэтому там то, ради чего пришли. Но люди прокручивают, если верх обещает нужное, и программа с отзывами ниже не пропадёт.'
      - text: 'Он прав: ниже первого экрана почти не смотрят, поэтому всё нужно уплотнить'
        why: 'Это миф: внимание убывает сверху вниз, но ниже первого экрана смотрят. Переполненный верх мешает найти главное.'
      - text: 'Оставить всё в первом экране, но разбить его на разделы с заголовками'
        why: 'Заголовки помогают просматривать текст, но не спасают переполненный экран: пять разделов в одном экране — та же каша, только с подписями.'
      - text: 'Всё, что не влезает в первый экран, вынести на отдельные страницы'
        why: 'Переход на другую страницу — лишний шаг, который многие не сделают. Прокрутка дешевле перехода, и люди ею пользуются.'
    explanation: |
      **Первый экран** — то, что видно без прокрутки. В замерах Nielsen Norman Group на него пришлось больше
      половины времени просмотра, а на первые три экрана — около четырёх пятых. Значит, внимание убывает сверху вниз, но люди
      прокручивают, когда верх обещает нужное. Миф «ниже первого экрана не смотрят» толкает втиснуть всё наверх,
      и получается каша, в которой главное теряется.
    links:
      - https://www.nngroup.com/articles/scrolling-and-attention/

  - id: uix-010
    topic: Как человек видит
    subtopic: Внимание и просмотр экрана
    level: senior
    question: |
      На экране диспетчера такси список вызовов. Со временем в нём появились красные метки «VIP», «Долгое ожидание»,
      «Детское кресло», оранжевые кнопки у каждой строки и жирные цены. Теперь диспетчеры пропускают срочные вызовы,
      хотя они помечены красным. Что поможет вернее всего?
    options:
      - text: 'Приглушить метки и кнопки, а красный цвет оставить только срочным'
        correct: true
        why: 'Срочный вызов отличается от остальных тем же красным, что и половина строк, — ему не из чего выпрыгивать. Когда яркий цвет остаётся одному признаку, отличие снова замечается сразу.'
      - text: 'Сделать срочные вызовы ещё ярче и крупнее, чем остальные красные метки'
        why: 'Это гонка выделений: следующая просьба сделает ярче что-то ещё. Пока на экране много яркого, каждое новое выделение работает всё хуже.'
      - text: 'Заставить срочные вызовы мигать, раз цвет уже не работает'
        why: 'Движение действительно очень заметно, но постоянное мигание мешает читать остальной список и утомляет за смену. Причину — пёстрый экран — оно не убирает.'
      - text: 'Вынести срочные вызовы в яркую полосу вверху экрана'
        why: 'Яркая полоса вверху — классическое место рекламы, и такой блок рискует попасть под баннерную слепоту. К тому же список останется таким же пёстрым.'
    explanation: |
      «Выпрыгивает» одно отличие. Когда экран обрастает выделениями, каждое следующее работает хуже, и важное
      теряется среди выделенного второстепенного. Лечение — не выделить важное ещё сильнее, а убрать лишнее:
      вторичные метки сделать спокойнее, кнопки — одного вида, а яркий цвет оставить одному смыслу. Как
      распределять важность по экрану, подробно разбирает урок об иерархии.

  - id: uix-011
    topic: Как человек видит
    subtopic: Иерархия и группировка
    level: junior
    question: |
      В форме записи к врачу подпись «Дата рождения» стоит на одинаковом расстоянии от своего поля и от поля
      «Телефон» над ней. Часть пациентов вписывает дату рождения в поле телефона. Что исправить в первую очередь?
    options:
      - text: 'Придвинуть подпись к своему полю, а между парами оставить промежуток'
        correct: true
        why: 'Близкое воспринимается группой. Когда подпись ближе к своему полю, чем к соседнему, пара «подпись — поле» видна сразу, и путать поля перестают.'
      - text: 'Сделать все подписи полей жирными, чтобы их было лучше видно на форме'
        why: 'Жирная подпись станет заметнее, но по-прежнему будет висеть посередине между полями. Вес не говорит, с чем элемент связан, — это делает расстояние.'
      - text: 'Покрасить подписи полей в акцентный цвет, чтобы они выделялись на фоне'
        why: 'Цвет тоже меняет вес, а не группировку. Подпись станет ярче, но так и останется непонятно, к какому полю она относится.'
      - text: 'Добавить подсказку с примером даты внутрь поля «Дата рождения»'
        why: 'Подсказка поможет тем, кто уже нашёл нужное поле. Беда в том, что поле путают с соседним, а это решается расстояниями.'
    explanation: |
      **Принцип близости**: элементы, стоящие рядом, человек воспринимает как группу. Из него следует правило
      вёрстки — отступ внутри группы меньше, чем между группами. Подпись должна быть ближе к своему полю, чем
      к соседнему. Если расстояния равны, глаз не может решить, что с чем связано, и человек ошибается полем.

  - id: uix-012
