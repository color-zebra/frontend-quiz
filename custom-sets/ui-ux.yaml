      просто бледнеет без объяснения. Что сделать, чтобы следующий экран не повторил эту историю?
    options:
      - text: 'Сделать одну кнопку-компонент с таблицей всех её состояний'
        correct: true
        why: 'Когда у кнопки одна реализация и в ней уже есть загрузка, отключение и фокус, новому экрану нечего придумывать: он берёт готовую. Таблица состояний показывает, что ничего не забыто.'
      - text: 'Добавить загрузку на экран, где её нет, и пояснение у бледной'
        why: 'Это исправит три экрана сейчас, но четвёртый разработчик снова сделает свою кнопку и снова что-то забудет. Беда в том, что кнопок три, а не одна.'
      - text: 'Записать в README правило: не забывать о загрузке у кнопок'
        why: 'Правило в документе помнят не все и не всегда. Надёжнее, когда состояния уже встроены в общий компонент и забыть их невозможно.'
      - text: 'Перед выпуском каждого экрана проверять все его кнопки вручную'
        why: 'Ручная проверка ловит ошибку поздно и каждый раз заново. Общий компонент с таблицей состояний не даёт ей появиться.'
    explanation: |
      Компонент в дизайн-системе — это не одна картинка кнопки, а кнопка **во всех состояниях**: обычное, наведение,
      фокус, нажатие, загрузка, отключено. **Таблица состояний** — в документации или на странице с примерами —
      показывает их все и служит проверкой при любой правке. Когда кнопка одна, новый экран берёт готовую,
      а не рисует свою со своими пропусками.

