    question: |
      На сайте каршеринга поле «Код из СМС» на телефоне открывает буквенную клавиатуру, и цифры приходится искать по отдельной
      кнопке. Что изменить в разметке поля?
    options:
      - text: 'Добавить полю inputmode="numeric" для цифровой клавиатуры кодов'
        correct: true
        why: 'inputmode подсказывает браузеру, какую клавиатуру показать. Для кодов и номеров из цифр GOV.UK советует именно inputmode="numeric".'
      - text: 'Сделать поле type="number", ведь код из СМС состоит только из цифр'
        why: 'У type="number" стрелочки увеличения, а ведущие нули и длинные числа ведут себя странно. GOV.UK советует его избегать для кодов и номеров.'
      - text: 'Написать внутри поля подсказку «Только цифры» бледным текстом'
        why: 'Подсказка не меняет клавиатуру: человек прочитает её и всё равно будет искать цифры.'
      - text: 'Проверять ввод и молча стирать буквы, если их всё же ввели'
        why: 'Это защищает от неверного ввода, но не помогает быстро ввести цифры. Клавиатура останется буквенной.'
    explanation: |
      На телефоне браузер выбирает клавиатуру по типу поля и атрибуту **`inputmode`**: `type="tel"` — для телефона,
      `type="email"` — для почты, `inputmode="numeric"` — для чисел вроде кодов и номеров карт. Атрибут `autocomplete`
      дополнительно позволяет браузеру заполнить поле за человека.
    links:
      - https://design-system.service.gov.uk/components/text-input/

