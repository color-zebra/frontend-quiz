        correct: true
        why: 'Смысловой токен называет роль, а не значение. В тёмной теме color-action просто ссылается на другой оттенок, и ни одно имя не начинает врать.'
      - text: 'Оставить --blue-500 и в тёмной теме поменять его значение на светлое'
        why: 'Тогда «синий 500» в тёмной теме станет совсем другим оттенком, а всё остальное, что его использует, поменяется вместе с кнопками.'
      - text: 'Завести отдельную переменную --blue-500-dark для тёмной темы'
        why: 'Придётся в каждом компоненте выбирать между двумя переменными по теме. Имя по значению так и останется привязанным к цвету, а не к роли.'
      - text: 'Отказаться от переменных и писать цвета кнопок прямо в стилях'
        why: 'Тогда для тёмной темы придётся искать и менять цвет в сотне мест — ровно то, от чего токены и спасают.'
    explanation: |
      Токены делят на слои: **базовые** (палитра — `blue-500`), **смысловые** (роли — `color-action`)
