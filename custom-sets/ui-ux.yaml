      **Путь пользователя** — шаги от начала задачи до результата. Экраны могут быть хорошими по отдельности,
      а путь — плохим. Первое правило укорачивания пути: уведомление ведёт прямо к делу, о котором сообщает, а не
      на главную. Второе — не спрашивать то, что уже известно.

