    question: |
      Команда новостного портала решает, на каких ширинах менять раскладку. Один разработчик предлагает взять
      ширины популярных телефонов и планшетов: 375, 390, 768 и 1024 пикселя. Как выбирать точки перелома надёжнее?
    options:
      - text: 'Растянуть окно и поставить точки там, где начинает ломаться раскладка'
        correct: true
        why: 'Точки перелома ставят по содержимому: где строки стали слишком длинными, карточки — слишком широкими. Тогда раскладка выдерживает любые устройства, а не только знакомые.'
      - text: 'Добавить точку под каждую популярную модель телефона и планшета'
        why: 'Моделей сотни, и каждый год появляются новые. Список ширин устареет быстрее, чем его допишут.'
      - text: 'Взять точки перелома из любого популярного фреймворка и не думать'
        why: 'Готовые точки фреймворка ничего не знают о вашем содержимом: статьи и таблицы ломаются на других ширинах, чем карточки товаров.'
      - text: 'Сделать одну точку перелома на 768 пикселях для всех экранов приложения'
        why: 'Одна точка редко покрывает и телефон, и планшет, и широкий монитор: между ними раскладка всё равно где-то сломается.'
    explanation: |
      **Точка перелома** — ширина, на которой меняется раскладка. Ставить её по моделям устройств ненадёжно:
      их слишком много. Руководства Google советуют начинать с узкого экрана, растягивать окно и добавлять точку
      там, где содержимое начинает выглядеть плохо. Обычно хватает двух-трёх точек на приложение.
    links:
      - https://web.dev/articles/responsive-web-design-basics

  - id: uix-042
    topic: Телефон и экраны
    subtopic: Экраны разной ширины
    level: junior
    question: |
      Сайт кинотеатра на телефоне открывается крошечной уменьшенной компьютерной версией. Медиазапросы
      `@media (max-width: 600px)` в стилях есть, но не срабатывают. Чего, скорее всего, не хватает?
    options:
      - text: 'Метки viewport: width=device-width, initial-scale=1 в разметке'
        correct: true
        why: 'Без этой метки телефонный браузер рисует страницу шириной с компьютерную и уменьшает её. Ширина страницы для медиазапросов — около 980 пикселей, и условие до 600 не выполняется.'
      - text: 'Медиазапросов для каждой модели телефона в отдельном файле'
        why: 'Медиазапросы уже есть, и правильные. Они не срабатывают, потому что браузер считает страницу широкой, — дело не в их количестве.'
      - text: 'Контейнерных запросов вместо медиазапросов во всех стилях'
        why: 'Контейнерные запросы решают другую задачу — подстройку компонента под его место. Без метки viewport страница всё равно останется уменьшенной.'
      - text: 'Стилей с !important, чтобы мобильные правила перебили основные'
        why: 'Беда не в том, что правила перебиваются, а в том, что условие медиазапроса вообще не выполняется.'
    explanation: |
      Без метки `<meta name="viewport" content="width=device-width, initial-scale=1">` мобильный браузер считает
      ширину страницы компьютерной, рисует её целиком и уменьшает. Медиазапросы при этом видят большую ширину
      и не срабатывают. Эту метку ставят первой, ещё до любых точек перелома.

