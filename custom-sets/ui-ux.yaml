      - text: 'Проверять стили глазами на каждом ревью кода, ничего не автоматизируя'
        why: '«Почти наш синий» на ревью легко пропустить: человек не помнит все токены наизусть. Проверка глазами не держит единообразие долго.'
      - text: 'Запретить нейросеть и писать все стили проекта только вручную'
        why: 'Сырые цвета вписывают и люди: так было быстрее. Беда не в авторе, а в том, что ничто не проверяет значения.'
      - text: 'Раз в квартал собирать все цвета и вручную заменять их токенами'
        why: 'Это уборка после разнобоя, а не защита от него: три месяца новые цвета будут копиться, и уборка станет всё дороже.'
