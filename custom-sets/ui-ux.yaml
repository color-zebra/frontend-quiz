      - text: 'Дизайнер прав: требования WCAG к контрасту касаются только текста'
        why: 'Кроме текста, WCAG требует контраст 3:1 от рамок полей, кольца фокуса и значков без подписи. При 1,4:1 многие люди не видят, где поле.'
      - text: 'Рамке нужен такой же контраст, как тексту, — не меньше 4,5:1'
        why: 'Для элементов интерфейса порог ниже — 3:1. 4,5:1 нужен обычному тексту, а не рамке.'
      - text: 'Рамка — украшение, поэтому подходит любой цвет, лишь бы было аккуратно'
        why: 'Украшение — то, без чего смысл не теряется. Здесь рамка — единственное, что показывает поле, значит, это не украшение.'
