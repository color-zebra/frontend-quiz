      Даже крупная цель опасна, если вплотную к ней стоит действие с противоположным смыслом. **Опасное действие
      не ставят рядом с частым**: его отодвигают, отделяют линией или переносят в меню, подписывают словами.
      Размер цели и расстояние до соседей работают вместе — так и устроено требование WCAG к размеру целей.

