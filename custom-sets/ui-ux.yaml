    question: |
      Дизайнер интернет-магазина проверил страницу товара размытием: заметнее всего цена и кнопка «В корзину»,
      как и задумано. После запуска покупатели жалуются, что не могут прочитать условия доставки под ценой —
      они набраны мелким светло-серым шрифтом. Как это понимать?
