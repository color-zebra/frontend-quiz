        why: 'Браузер не знает о шкале отступов и ничего к ней не округляет: `padding-top: 16px` — это ровно 16 пикселей до края строки.'
      - text: 'Браузер прибавил к 16 пикселям свой стандартный отступ кнопки'
        why: 'Свойство `padding-top: 16px` заменяет стандартный отступ кнопки, а не складывается с ним. Лишнее место — внутри строки текста, над самими буквами.'
      - text: 'Шрифт на компьютере дизайнера отрисовывается крупнее, чем в браузере'
        why: 'По условию шрифт и его размер те же. Разница не в размере букв, а в том, от чего отсчитан отступ.'
    explanation: |
      Каждая строка текста в браузере выше самих букв: **межстрочный интервал** добавляет пустое место над и под ними.
      Отступ в CSS отсчитывается от края строки, а глаз и часто дизайнер — от букв. Что делать: свойство
      `text-box-trim` (вместе с `text-box-edge`) обрезает пустое место строки до верха заглавных и линии букв —
      оно работает в современных браузерах, а в старых просто не срабатывает. Или договориться с дизайнером мерить отступы
      от строки.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/text-box-trim

  - id: uix-021
    topic: Основа визуала
    subtopic: Отступы, сетка и плотность
    level: middle
    question: |
      В таблице рейсов на сайте авиакомпании сорок строк. Продакт-менеджер требует сделать строки полосатыми
      («зеброй») и говорит, что исследования доказали: так таблицы читают быстрее. Что верно?
    options:
      - text: 'Данных мало: заметный опыт не нашёл ни устойчивой пользы, ни вреда'
        correct: true
        why: 'В известном опыте с зеброй устойчивой разницы в скорости и точности не нашли, хотя полосы понравились почти половине участников. Это выбор по вкусу команды: полосы или тонкие линии.'
      - text: 'Он прав: исследования однозначно показывают, что зебра ускоряет чтение'
        why: 'Однозначных данных нет. Довод «доказали исследования» здесь сильнее, чем позволяют сами исследования.'
      - text: 'Наоборот: полосы отвлекают внимание и замедляют работу с таблицей'
        why: 'Вреда опыт тоже не нашёл. Заменить один необоснованный довод другим — не выход.'
      - text: 'Зебра нужна только в таблицах длиннее сотни строк, здесь она лишняя'
        why: 'Такого порога нет ни в исследованиях, ни в гайдах. Держать строку помогают и линии, и полосы, и подсветка при наведении — при любом числе строк.'
    explanation: |
      Чтобы глаз не терял строку в длинной таблице, их разделяют тонкими линиями, фоном через одну («зеброй») или
      подсветкой при наведении. Какой способ лучше, данных мало: в опыте Джессики Эндерс 2008 года (244 участника)
      устойчивой разницы не нашли. Поэтому это **договорённость**, а не исследование, и довод «так доказано»
      в споре не годится.
    links:
      - https://alistapart.com/article/zebrastripingdoesithelp/

  - id: uix-022
    topic: Основа визуала
    subtopic: Отступы, сетка и плотность
    level: senior
    question: |
      В кабинете администратора отеля таблица гостей: имя, номер комнаты, даты, сумма. Столбец имени узкий, и длинные
      имена обрезаются многоточием. Администраторы путают гостей с похожими фамилиями и заселяют не в тот номер.
      Работают они за компьютерами и на планшетах у стойки. Что разумнее всего?
    options:
      - text: 'Переносить длинное имя на вторую строку, даже если строка станет выше'
        correct: true
        why: 'Имя, по которому человека отличают, обрезать нельзя. Строка с переносом станет выше, но таблица останется плотной, а администратор увидит фамилию целиком.'
      - text: 'Оставить многоточие и показывать имя полностью при наведении курсора мыши'
        why: 'На планшете у стойки наведения нет, и полное имя там не увидеть вовсе. На компьютере — лишнее действие на каждой строке.'
      - text: 'Уменьшать шрифт имени в ячейке, пока оно не влезет в её ширину'
        why: 'Длинные имена станут крошечными и нечитаемыми, а строки — разного вида. Читаемость теряется ровно там, где она важнее всего.'
      - text: 'Расширить столбец имени, сузив столбец суммы до самых коротких чисел'
        why: 'Обрезанными окажутся большие суммы — проблема переедет в соседний столбец. Ширина столбцов ограничена, и длинное содержимое всё равно найдётся.'
    explanation: |
      Для каждого крайнего случая содержимого решают заранее: перенести, обрезать с подсказкой, показать заглушку.
      Обрезать стоит только то, что можно прочитать иначе. Имя человека, по которому его отличают, обрезать нельзя,
      поэтому его переносят. Подсказка при наведении не работает на сенсорных экранах — у планшета нет курсора.

  - id: uix-023
    topic: Основа визуала
    subtopic: Типографика
    level: junior
    question: |
      Новостной сайт на мониторе шириной 1920 пикселей показывает статьи во всю ширину окна: в строке около двухсот
      знаков. Читатели жалуются, что теряют строку и перечитывают одно и то же. Что исправить в первую очередь?
    options:
      - text: 'Ограничить колонку текста примерно 65 знаками, поля оставить пустыми'
        correct: true
        why: 'При очень длинной строке глазу трудно попасть в начало следующей. Колонка около 45–75 знаков — привычный ориентир, а пустые поля по бокам не мешают.'
      - text: 'Увеличить шрифт до 24 пикселей, чтобы в строку влезало меньше знаков'
        why: 'На мониторе в 1920 пикселей и при 24 пикселях строка останется длиной больше сотни знаков, а текст станет непривычно крупным.'
      - text: 'Поставить межстрочный интервал 2, чтобы строки не путались между собой'
        why: 'Большой интервал чуть помогает найти следующую строку, но не убирает главную беду — дальний прыжок глаза через двести знаков.'
      - text: 'Сделать текст темнее и контрастнее, чтобы глаз меньше уставал'
        why: 'Контраст важен, но строку теряют из-за длины, а не из-за цвета. Тёмный текст во всю ширину по-прежнему трудно читать.'
    explanation: |
      Удобная **длина строки** — около 45–75 знаков: при очень длинной глаз теряет начало следующей строки, при очень
      короткой прыгает слишком часто. Это типографская традиция; исследования расходятся, но средние строки людям
      удобнее. В CSS колонку ограничивают, например, `max-width: 65ch` — `ch` равна ширине цифры «0» в шрифте.

  - id: uix-024
    topic: Основа визуала
    subtopic: Типографика
    level: junior
    question: |
      В приложении такси во время поездки на экране идёт счётчик стоимости: «412 ₽», «418 ₽», «421 ₽». Пассажиры
      пишут, что цифры «дрожат» и это раздражает. Число выровнено по центру экрана. Что поправить?
    options:
      - text: 'Включить в шрифте цифры одинаковой ширины через tabular-nums'
        correct: true
        why: 'В обычном шрифте цифры разной ширины, поэтому при каждой смене число становится чуть шире или уже и сдвигается. С цифрами одинаковой ширины меняются только сами цифры.'
      - text: 'Перевести всё приложение на моноширинный шрифт, как в коде'
        why: 'Цифры перестанут дрожать, но весь интерфейс станет похож на терминал. Достаточно включить цифры одинаковой ширины в обычном шрифте.'
      - text: 'Выровнять число по левому краю вместо выравнивания по центру'
        why: 'Начало числа перестанет двигаться, но конец будет прыгать на каждой смене: цифры по-прежнему разной ширины.'
      - text: 'Плавно анимировать смену числа, чтобы скачки стали незаметными'
        why: 'Анимация добавит движения к уже дрожащему числу. Причина — разная ширина цифр, и её анимация не убирает.'
    explanation: |
      В обычном шрифте **цифры разной ширины**: единица уже восьмёрки. В тексте это незаметно, а в меняющихся
      и выровненных числах — счётчиках, таймерах, ценах в столбик — число дрожит или «гуляет». В CSS цифры одинаковой
      ширины включает `font-variant-numeric: tabular-nums`, если шрифт их поддерживает.

  - id: uix-025
    topic: Основа визуала
    subtopic: Типографика
    level: middle
    question: |
      На сайте музея описание выставки в карточке лежит в блоке высотой 72 пикселя с `overflow: hidden`. Посетитель
      с дислексией увеличил расширением браузера интервалы между строками и буквами — и описание обрезалось
      на середине. Есть ли тут нарушение WCAG и что сделать?
    options:
      - text: 'Да: увеличенные интервалы не должны обрезать текст — убрать жёсткую высоту'
        correct: true
        why: 'WCAG требует, чтобы при увеличенных человеком интервалах ничего не терялось. Блок фиксированной высоты с обрезкой — ровно то, что ломается.'
      - text: 'Да: нужно сразу поставить интервал строк 1,5 и межбуквенный 0,12 по умолчанию'
        why: 'Это неверное прочтение требования: стандарт не требует ставить такие значения самому, он требует, чтобы вёрстка выдерживала их, когда их ставит человек.'
      - text: 'Нет: стандарт требует только интервал 1,5 у текста, и в карточке он стоит'
        why: 'Требование не про то, какой интервал задан на сайте, а про то, что при увеличенных человеком интервалах ничего не теряется.'
      - text: 'Нет: проблему создало расширение, а сайт не обязан под него подстраиваться'
        why: 'Требование как раз про то, что люди меняют интервалы своими средствами, и сайт должен это выдерживать. Это требование уровня AA.'
    explanation: |
      **Интервалы текста** (требование WCAG уровня AA, обязательное): если человек в браузере заметно увеличит
      интервалы между строками, буквами и словами, ничего не должно теряться. Так делают люди с плохим зрением
      или дислексией. На практике — не задавать текстовым блокам жёсткую высоту с обрезкой. Точные значения,
      которые надо выдержать, — по ссылке.
    links:
      - https://www.w3.org/WAI/WCAG22/Understanding/text-spacing.html

  - id: uix-026
    topic: Основа визуала
    subtopic: Типографика
    level: middle
    question: |
      Банк хочет, чтобы клиенты точно прочитали предупреждение о мошенниках, и предлагает набрать его заглавными
      буквами. Предупреждение — три предложения. Что ответить?
    options:
      - text: 'Связный текст заглавными читают медленнее, выделить его стоит иначе'
        correct: true
        why: 'Три предложения заглавными читаются хуже обычного текста. Выделить предупреждение можно местом, фоном, значком и коротким заголовком.'
      - text: 'Заглавными — правильно: так текст заметнее и к тому же читается быстрее'
        why: 'Заметнее — да, но связный текст заглавными читают медленнее. Быстро узнаются только одно-два слова, а не три предложения.'
      - text: 'Заглавные запрещены в интерфейсе вовсе, даже для коротких меток'
        why: 'Это перегиб: одно-два слова заглавными, например короткая метка, при беглом взгляде узнаются быстро. Плохи заглавные в связном тексте.'
      - text: 'Заглавные допустимы, если вдобавок сделать текст ещё и красным'
        why: 'Цвет не ускорит чтение заглавных. Предупреждение станет громче, но читать три предложения так же тяжело.'
    explanation: |
      Классические опыты с чтением показали: **связный текст заглавными** читается медленнее обычного, и руководства
      по удобству до сих пор на них опираются. При этом одно-два слова заглавными при беглом взгляде узнаются быстро.
      Поэтому заглавные годятся для коротких меток, а важный длинный текст выделяют местом, фоном, значком,
      заголовком — но обычными буквами.

  - id: uix-027
    topic: Основа визуала
    subtopic: Типографика
    level: middle
    multiple: true
    question: |
      Музыкальный сервис показывает на странице тарифа строку: Тариф "Семейный" - 12900 руб. в год. Что в ней
      стоит исправить по правилам русского набора?
    options:
      - text: 'Заменить прямые кавычки вокруг названия на «ёлочки»: «Семейный»'
        correct: true
        why: 'В русском тексте основные кавычки — «ёлочки». Прямые кавычки — след клавиатуры и сразу выдают небрежность.'
      - text: 'Поставить между словами длинное тире с неразрывным пробелом перед ним'
        correct: true
        why: 'Между словами ставят длинное тире «—», дефис — только внутри слов. Неразрывный пробел не даст тире уехать в начало строки.'
      - text: 'Разделить разряды пробелом и поставить после числа знак рубля: 12 900 ₽'
        correct: true
        why: 'Большие числа делят на группы по три неразрывным пробелом, знак рубля пишут после числа через неразрывный пробел.'
      - text: 'Набрать название тарифа заглавными буквами, чтобы оно стало заметнее на странице'
        why: 'Это вопрос иерархии, а не правил набора. Короткое название заглавными допустимо, но в правилах русского набора такого требования нет.'
      - text: 'Сократить «в год» до «/год», чтобы строка стала короче'
        why: 'Косая черта вместо предлога — не правило набора, а сокращение, которое читается хуже. Правила русского набора — о кавычках, тире, разрядах и знаке рубля.'
    explanation: |
      Правила **русского набора**, которые чаще всего нарушают в интерфейсах: кавычки «ёлочки», а не прямые; длинное
      тире между словами с неразрывным пробелом перед ним, дефис — только внутри слов; разряды больших чисел через
      неразрывный пробел; знак рубля после числа. Правильная строка: Тариф «Семейный» — 12 900 ₽ в год.

  - id: uix-028
    topic: Основа визуала
    subtopic: Типографика
    level: senior
    question: |
      В приложении электронной библиотеки после двух лет работы одиннадцать размеров шрифта: 12, 13, 14, 15, 16, 17,
      18, 20, 22, 24 и 26 пикселей. Заголовки разделов на разных экранах разного размера. Дизайнера нет. Как навести
      порядок?
    options:
      - text: 'Свести к пяти-шести размерам с заметными шагами и назначить их по ролям'
        correct: true
        why: 'Заголовок раздела получает один размер шкалы на всех экранах, подпись — другой, и иерархия везде одинакова. Короткая шкала с заметными шагами делает разницу в важности видимой.'
      - text: 'Свести к пяти-шести размерам, заменив каждый ближайшим по шкале'
        why: 'Шкала нужна, но замена «на ближайшее число» оставит заголовки разными: заголовок в 20 пикселей станет 20, а в 26 — 28. Размер назначают по роли текста, а не по близости числа.'
      - text: 'Оставить все одиннадцать размеров, но дать каждому понятное имя'
        why: 'Имена не убирают разнобой: размеры по-прежнему отличаются на пиксель, и иерархия так и не читается.'
      - text: 'Сделать весь текст одним размером 16, а важность показывать насыщенностью'
        why: 'Так пропадает самый сильный рычаг иерархии — размер. Заголовки экранов перестанут отличаться от текста, даже если будут жирными.'
    explanation: |
      **Шкала размеров** — несколько размеров текста с заметными шагами, например 14, 16, 20, 28; часто каждый следующий
      в 1,2–1,33 раза больше. Интерфейсу обычно хватает пяти-шести размеров. Разница в пиксель видна, но не читается
      как разница в важности, поэтому одиннадцать близких размеров иерархию не создают, а размывают. Размеры
      назначают **по ролям**: заголовок экрана, заголовок раздела, основной текст, подпись — у каждой роли один
      размер на всех экранах.

  - id: uix-029
    topic: Основа визуала
    subtopic: Цвет и контраст
    level: junior
    question: |
      На сайте театра под ценой билета мелким серым шрифтом, 14 пикселей, написано «Электронный билет придёт
      на почту». Контраст этой подписи с белым фоном — 3,2:1. Проходит ли подпись требование WCAG?
    options:
      - text: 'Нет: обычному тексту нужен контраст с фоном не меньше 4,5:1'
        correct: true
        why: 'Текст в 14 пикселей — обычный, не крупный. Для него порог 4,5:1, и 3,2:1 его не проходит: многим людям подпись будет трудно прочитать.'
      - text: 'Да: подпись короткая, и ей хватает 3:1, как крупному тексту'
        why: 'Порог 3:1 зависит не от длины текста, а от размера: крупный — это примерно от 24 пикселей или 18,5 жирным. 14 пикселей — обычный текст.'
      - text: 'Да: второстепенный серый текст под требование не попадает'
        why: 'Исключения — неактивные элементы, украшения и логотипы. Подпись о билете — информация для зрителя, к ней требование относится.'
      - text: 'Да: 3,2:1 близко к порогу, и такую разницу никто не заметит'
        why: 'Пороги не округляют: даже 4,49:1 не проходит. А 3,2:1 далеко от 4,5:1 — для людей со слабым зрением это заметная разница.'
    explanation: |
      **Контраст** по WCAG — отношение яркостей текста и фона, от 1:1 до 21:1. Пороги уровня AA: обычный текст —
      не меньше 4,5:1, крупный (примерно от 24 пикселей или 18,5 пикселя жирным) и элементы интерфейса —
      не меньше 3:1. Пороги не округляют. Проверять удобно пипеткой цвета в Chrome DevTools.
    links:
      - https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html

