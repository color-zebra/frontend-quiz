    question: |
      На маркетплейсе в поле номера карты люди вставляют номер с пробелами, как он напечатан на карте: «2200 1234 5678
      9010». Форма отвечает: «Номер карты должен состоять из 16 цифр». Как сделать поле удобнее?
    options:
      - text: 'Принимать номер с пробелами и самой убирать лишние символы'
        correct: true
        why: 'Это терпимый ввод: программа за миллисекунды делает работу, которую иначе делает человек. Номер с пробелами разумен — так он и напечатан на карте.'
      - text: 'Написать под полем «Вводите номер без пробелов» мелким текстом'
        why: 'Человек по-прежнему делает работу за программу, а подсказку многие не заметят до ошибки.'
      - text: 'Запретить вставку из буфера, чтобы номер вводили вручную'
        why: 'Это прибавит работы и ошибок: ручной ввод шестнадцати цифр — источник опечаток. Пробелы проще убрать программно.'
      - text: 'Разбить поле на четыре отдельных поля по четыре цифры'
        why: 'Вставка номера целиком сломается, а переход между полями добавит путаницы. Одно поле, принимающее пробелы, проще.'
    explanation: |
      **Терпимый ввод** принимает любой разумный вариант: убирает лишние символы, приводит к общему виду и показывает
      результат. Телефон со скобками и восьмёркой, номер карты с пробелами, сумма с пробелом в разрядах — всё это
      программа нормализует сама. Это частный случай предотвращения ошибок: интерфейс подстраивается под человека.

