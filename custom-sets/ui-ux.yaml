        why: 'Минимум по WCAG — 24 × 24 пикселя; меньшая цель допустима, только если вокруг неё достаточно пустого места до соседей. Здесь клетки мельче и стоят вплотную.'
      - text: 'Да: календарь — особый элемент, и требование к размеру к нему не относится'
        why: 'Исключения — ссылки внутри текста, элементы браузера, цели с равноценной заменой. Календарь, в котором другого способа выбрать дату нет, к ним не относится.'
      - text: 'Да: 20 пикселей меньше нормы всего на четыре, это допустимое отклонение'
        why: 'Пороги WCAG не допускают отклонений: 20 меньше 24, и при плотной сетке исключение про пустое место не работает.'
      - text: 'Нет: по WCAG каждая клетка должна быть не меньше 48 × 48 пикселей'
        why: '48 × 48 — рекомендация Google, а не требование стандарта. Уровень AA WCAG требует 24 × 24 или достаточного расстояния между целями.'
    explanation: |
      **Размер цели** (требование WCAG уровня AA): цели не меньше 24 × 24 пикселей. Исключения: вокруг маленькой цели достаточно
      места до соседей, есть равноценная цель того же назначения, ссылка внутри текста, элемент браузера. Рекомендации
      платформ строже — 44 пункта у Apple и 48 dp у Google, — и для пальца удобнее ориентироваться на них.
    links:
      - https://www.w3.org/WAI/WCAG22/Understanding/target-size-minimum.html

