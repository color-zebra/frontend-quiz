        why: 'Люди большую часть времени проводят на других сайтах и ждут, что корзина справа вверху, а логотип ведёт на главную. Непривычное решение стоит ошибок и времени.'
      - text: 'Корзину и логотип нужно сделать крупнее и ярче, чтобы их точно заметили'
        why: 'Беда не в заметности, а в том, что они стоят и работают не там, где человек их ищет. Яркость не отменяет привычку.'
      - text: 'Нужно добавить при первом запуске обучение по новому интерфейсу'
        why: 'Обучение маскирует проблему: его пропускают и забывают, а привычки к другим сайтам остаются.'
      - text: 'Всё в порядке: через неделю люди привыкнут к новому интерфейсу'
        why: 'Магазин кроссовок посещают редко, и привыкать некогда. А многие уйдут, не дождавшись привычки.'
    explanation: |
      **Закон Якоба** — наблюдение Нильсена: люди проводят большую часть времени на других сайтах и приходят
      с их привычками. Когда интерфейс работает иначе, человеку приходится переучиваться. Для разработчика без
      дизайнера это сильный довод: не уверен — делай как принято.

  - id: uix-076
    topic: Поведение
    subtopic: Память, привычки и навигация
    level: senior
    question: |
      В приложении доставки продуктов четыре главных раздела — «Каталог», «Корзина», «Заказы», «Профиль» — и шесть
      второстепенных: акции, адреса, способы оплаты, справка, настройки, о приложении. Сейчас все десять спрятаны
      за значком меню из трёх полосок. Как устроить навигацию?
    options:
      - text: 'Четыре главных — нижней навигацией, остальное — внутри профиля'
        correct: true
        why: 'Главные разделы всегда на виду, и ими пользуются чаще. Редкие пункты не занимают место на экране, но доступны в профиле.'
      - text: 'Все десять разделов вынести в нижнюю навигацию со значками и подписями'
        why: 'Десять значков внизу — мелкие цели и непонятные иконки. Нижней навигации хватает трёх-пяти пунктов.'
      - text: 'Оставить меню из трёх полосок, но сделать значок крупнее и ярче'
        why: 'Так меню станет заметнее, но главные разделы останутся спрятанными, а спрятанной навигацией пользуются реже.'
      - text: 'Вывести все десять разделов вкладками вверху с прокруткой вбок'
        why: 'Половина вкладок окажется за краем экрана, и главные разделы смешаются с редкими.'
    explanation: |
      На телефоне главные разделы показывают **нижней навигацией** из трёх-пяти пунктов. Замеры Nielsen Norman
      Group показали, что спрятанной за «гамбургером» навигацией пользуются реже и находят разделы хуже, на компьютере
      сильнее, на телефоне тоже. Поэтому главное показывают, а прячут только редкое.
    links:
      - https://www.nngroup.com/articles/find-navigation-mobile-even-hamburger/

  - id: uix-077
    topic: Поведение
    subtopic: Анимация со смыслом
    level: junior
    question: |
      В приложении погоды при каждом открытии температура, ветер, влажность и давление «вылетают» на экран по очереди,
      и всё вместе занимает полторы секунды. Люди открывают приложение, чтобы за секунду глянуть температуру. Что
      не так с этой анимацией?
    options:
      - text: 'Она ничего не объясняет и заставляет ждать нужную температуру'
        correct: true
        why: 'Анимация нужна, чтобы показать связь состояний, откликнуться на действие или привлечь внимание. Здесь она только задерживает температуру, ради которой человек пришёл.'
      - text: 'Она слишком быстрая: полутора секунд мало, чтобы её разглядеть'
        why: 'Наоборот: полторы секунды для анимации интерфейса очень много. Обычно её держат в пределах 100–500 мс.'
      - text: 'Цифрам не хватает отскока в конце, чтобы появление было живее'
        why: 'Отскок добавит ещё времени и движения. Беда в том, что анимация мешает получить то, ради чего открыли приложение.'
      - text: 'Нужно вылетать всем цифрам одновременно, а не по очереди'
        why: 'Это ускорит появление, но вопрос остаётся: зачем вообще анимировать цифры, которые человек хочет увидеть сразу?'
    explanation: |
      Хорошая анимация не украшает, а объясняет: показывает **связь состояний**, даёт **отклик** на действие или
      привлекает **внимание**. Простая проверка — если убрать анимацию, станет ли что-то непонятно? Если нет, анимация
      лишняя. Особенно там, где человек хочет быстро получить информацию.

  - id: uix-078
    topic: Поведение
    subtopic: Анимация со смыслом
    level: junior
    question: |
      В настройках приложения погоды переключатель «Предупреждать о грозе» после нажатия плавно переезжает в другое
      положение за 600 миллисекунд. Какая длительность подойдёт такому мелкому отклику?
    options:
      - text: 'Около 100 миллисекунд — так отклик кажется человеку мгновенным'
        correct: true
        why: 'Мелкий отклик вроде переключателя или галочки держат около 100 мс: это воспринимается так, будто человек сам двигает переключатель.'
      - text: 'Около 300 миллисекунд — как у появления окна или шторки'
        why: '200–300 мс — для заметной смены экрана, например появления окна. Переключателю столько не нужно, он кажется вялым.'
      - text: 'Около 600 миллисекунд — как сейчас, чтобы движение было заметно'
        why: 'Около 500 мс анимация уже начинает раздражать, а переключатель за 600 мс кажется заторможенным.'
      - text: 'Около секунды — чтобы человек точно успел увидеть переключение'
        why: 'Секунда для мелкого отклика — огромная задержка. Переключение видно и за десятую долю секунды.'
    explanation: |
      Исследователи Nielsen Norman Group советуют большинство анимаций интерфейса держать в пределах **100–500 мс**: около 100 мс —
      для мелкого отклика (переключатель, галочка), 200–300 мс — для появления окна или шторки, 400 мс — только для
      больших перемещений. Около 500 мс анимация начинает раздражать, особенно если её видят много раз.
    links:
      - https://www.nngroup.com/articles/animation-duration/

  - id: uix-079
    topic: Поведение
    subtopic: Анимация со смыслом
    level: middle
    question: |
      В почтовом приложении шторка с действиями над письмом появляется с постоянной скоростью (`linear`), а уезжает
      с замедлением в конце (`ease-out`). Пользователи говорят, что шторка «вязкая». Какие кривые лучше?
    options:
      - text: 'Появление с замедлением в конце, уход — с разгоном'
        correct: true
        why: 'Появляясь быстро, шторка кажется отзывчивой, а мягкая остановка даёт глазу зацепиться. Уходя с разгоном, она не задерживает человека в конце.'
      - text: 'Появление и уход — с постоянной скоростью'
        why: 'Равномерное движение выглядит механическим: предметы в жизни разгоняются и замедляются.'
      - text: 'Появление с разгоном, уход — с замедлением в конце'
        why: 'Так шторка медленно трогается, когда человек ждёт её, и тянет в конце, когда она уже не нужна, — как раз «вязкость».'
      - text: 'Появление и уход — с отскоком в конце для живости'
        why: 'Отскок добавляет время и движение, а шторку с действиями открывают часто. Живость здесь превращается в ожидание.'
    explanation: |
      Форму движения в CSS задаёт **кривая** (easing). Правило, на котором сходятся руководства Nielsen Norman Group и Google:
      **появление — с замедлением** в конце (ease-out), **уход — с разгоном** (ease-in). Равномерное движение
      выглядит механическим, а отскок на часто используемых элементах лишний.

  - id: uix-080
    topic: Поведение
    subtopic: Анимация со смыслом
    level: middle
    question: |
      В новостном приложении боковое меню выезжает анимацией свойства `left` от −300 пикселей до нуля. На новых
      телефонах всё плавно, а на старых меню выезжает рывками. Что изменить?
    options:
      - text: 'Двигать меню через transform: translateX вместо свойства left'
        correct: true
        why: 'transform браузер меняет на последнем этапе отрисовки, сдвигая готовую картинку. При анимации left он на каждом кадре пересчитывает раскладку и перерисовывает страницу.'
      - text: 'Сделать анимацию длиннее, чтобы старым телефонам хватало времени'
        why: 'Дольше — значит больше тех же тяжёлых кадров. Рывки останутся, а меню станет ещё и медленным.'
      - text: 'Анимировать вместо left свойство margin-left у меню'
        why: 'margin тоже влияет на раскладку: браузер так же будет пересчитывать её на каждом кадре.'
      - text: 'Убрать на старых телефонах анимацию, определяя их по модели'
        why: 'Список моделей не угадать, а настоящая причина — дорогое свойство. С transform анимация пойдёт плавно и на старых телефонах.'
    explanation: |
      Браузер дёшево двигает и проявляет готовую картинку: **`transform` и `opacity`** он меняет на последнем этапе
      отрисовки, без пересчёта раскладки. Анимация `top`, `left`, `height`, `margin` заставляет пересчитывать
      и перерисовывать страницу на каждом кадре, и на слабых устройствах это видно как рывки.

  - id: uix-081
    topic: Поведение
    subtopic: Анимация со смыслом
    level: middle
    question: |
      На главной странице новостного сайта — параллакс: фоновое фото двигается медленнее текста при прокрутке.
      Что делать, когда у человека в системе включено «уменьшить движение» (`prefers-reduced-motion: reduce`)?
    options:
      - text: 'Отключить параллакс: фото стоит на месте, текст прокручивается'
        correct: true
        why: 'Параллакс вызывает у людей с вестибулярными расстройствами головокружение и тошноту. Без него содержимое остаётся тем же, пропадает только лишнее движение.'
      - text: 'Замедлить параллакс вдвое, чтобы движение стало мягче'
        why: 'Мягче — не значит безопасно: разница в скорости движения слоёв и вызывает плохое самочувствие. Человек просил меньше движения, а не медленнее.'
      - text: 'Скрыть фото вместе с заголовком, чтобы на странице ничего не двигалось'
        why: 'Человек просил убрать движение, а не содержимое. Фото и заголовок можно оставить неподвижными.'
      - text: 'Показать предупреждение «На странице есть анимация»'
        why: 'Предупреждение не убирает движение. Человек уже сказал системе, что движение ему вредит, — сайт должен это учесть.'
    explanation: |
      При **вестибулярных расстройствах** параллакс, большие перемещения и масштабирование вызывают головокружение,
      тошноту и головную боль. Настройку «уменьшить движение» браузер сообщает медиазапросом
      `prefers-reduced-motion: reduce`. При ней убирают параллакс и автопрокрутку, выезды заменяют проявлением,
      а содержимое оставляют. Это техника из пояснений WCAG к требованию об анимации от действий.
    links:
      - https://www.w3.org/WAI/WCAG22/Understanding/animation-from-interactions.html

  - id: uix-082
    topic: Поведение
    subtopic: Анимация со смыслом
    level: senior
    question: |
      На главной онлайн-кинотеатра карусель с новинками сама переключается каждые четыре секунды и крутится, пока
      открыта страница. Кнопок остановки нет. Что нужно по WCAG и что разумно сделать?
    options:
      - text: 'Дать кнопку паузы: долгое автодвижение должно останавливаться'
        correct: true
        why: 'Требование базового уровня A: то, что движется само, дольше пяти секунд и рядом с другим содержимым, можно приостановить, остановить или скрыть. Карусель крутится всё время, пока открыта страница.'
      - text: 'Увеличить интервал до шести секунд, тогда требование не применяется'
        why: 'Пять секунд — это не интервал между слайдами, а сколько длится движение в целом. Карусель крутится бесконечно, и интервал этого не меняет.'
      - text: 'Останавливать карусель только при наведении на неё курсора'
        why: 'На телефоне и телевизоре наведения нет, а с клавиатуры тоже не остановить. Нужна явная кнопка паузы.'
      - text: 'Отключать автопрокрутку только при prefers-reduced-motion'
        why: 'Это полезно, но требования не закрывает: остановить карусель должен уметь любой человек, а не только тот, кто включил настройку в системе.'
    explanation: |
      **Пауза, остановка, скрытие** (требование WCAG уровня A, обязательное): движущееся, мигающее или
      прокручивающееся содержимое, которое
      стартует само, длится больше пяти секунд и показано рядом с другим содержимым, можно приостановить, остановить
      или скрыть. Карусели и бегущие строки — частый случай. Учитывать `prefers-reduced-motion` хорошо, но этого мало:
      остановить движение должен уметь каждый.
    links:
      - https://www.w3.org/WAI/WCAG22/Understanding/pause-stop-hide.html

