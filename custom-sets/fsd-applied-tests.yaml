title: 'FSD Applied Architecture — тесты'
kind: 'test'
questions:
  - id: 'fsd-a-a1-1-001'
    level: 'middle'
    question: 'Карточка заказа нужна каждому вошедшему; тяжёлый аудит открывают 4% пользователей. API независимы. Приоритет — не тратить трафик на неоткрытый аудит, ожидание при его открытии допустимо. Как организовать первую загрузку?'
    options:
      - text: 'Загрузить оба чтения сразу, не блокируя карточку аудитом'
        why: 'Карточка не блокируется, но дорогой аудит передаётся даже тем 96%, кто его не откроет; это нарушает приоритет экономии трафика.'
      - text: 'Карточку загрузить сразу, аудит — только при открытии панели'
        why: 'Eager обслуживает обязательный путь, on-demand откладывает дорогой редкий ресурс.'
        correct: true
      - text: 'После карточки фоново подготовить аудит для каждого пользователя'
        why: 'Фоновый приоритет уменьшит конкуренцию, но не уберёт ненужную передачу для большинства.'
      - text: 'Загрузить оба ресурса перед показом карточки'
        why: 'Аудит увеличивает критический путь и расходует трафик большинства пользователей.'
    explanation: 'Стратегию выбирают для ресурса, а не для приложения целиком. Eager уменьшает ожидание обязательных данных, lazy/on-demand откладывает маловероятные затраты. Background fetching обновляет уже полезный экран, если старая копия допустима; он тоже потребляет сеть.'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.1 Fetching strategy'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/request-waterfalls'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/prefetching'
  - id: 'fsd-a-a1-1-002'
    level: 'middle'
    question: 'Экран последовательно получает профиль, валюты и счета. Все запросы используют известный tenantId и не зависят от ответов друг друга. Как сократить waterfall?'
    options:
      - text: 'Кешировать только последний ответ цепочки'
        why: 'Повторный вход ускорится, но холодная загрузка останется последовательной.'
      - text: 'Поменять порядок валют и счетов после профиля'
        why: 'Перестановка независимых ожиданий не сокращает критический путь.'
      - text: 'Перенести цепочку в общий hook, сохранив порядок'
        why: 'Общее место кода не устраняет сумму сетевых ожиданий.'
      - text: 'Начать чтения вместе и задать границы их показа'
        why: 'Убирается искусственная последовательная зависимость старта.'
        correct: true
    explanation: 'Waterfall возникает, если доступная работа ждёт завершения другой без необходимости. Позднее монтирование владельца запроса тоже может создавать эту задержку. Если следующий запрос требует ID из ответа предыдущего, параллелизация уже требует изменения контракта или границ данных.'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.1 Fetching strategy'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/request-waterfalls'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/prefetching'
  - id: 'fsd-a-a1-1-003'
    level: 'middle'
    question: 'Для строки поиска сервер отдаёт документ с вложениями: 2 МБ вместо нужных 3 КБ метаданных. Сеть занимает 90% времени. Что адресует overfetching?'
    options:
      - text: 'Раньше загрузить те же полные документы'
        why: 'Работа сдвинется во времени, но объём и нагрузка останутся.'
      - text: 'Проекция списка, детали по открытию'
        why: 'Сокращение происходит до передачи ненужного содержимого.'
        correct: true
      - text: 'Скрыть вложения после разбора полного ответа'
        why: 'Сетевой расход и разбор к этому моменту уже оплачены.'
      - text: 'Мемоизировать отрисовку строки результата'
        why: 'Это другая фаза, не основной измеренный сетевой расход.'
    explanation: 'Overfetching устраняют на границе получения данных. Проекция уменьшает ответ, но добавляет API-контракт и отдельное чтение для деталей. Выбор проверяют по байтам и задержке реального пути, сохраняя нужные поля и идентичность записей.'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.1 Fetching strategy'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/request-waterfalls'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/prefetching'
  - id: 'fsd-a-a1-1-004'
    level: 'middle'
    question: 'Таблица показана; допустимо отставание 30 секунд. Справка открывается редко, экспорт создаётся по кнопке. Как разделить загрузки?'
    options:
      - text: 'Повторять создание экспорта при обновлении списка его результатов'
        why: 'Фоновое чтение не означает намерения создать новый отчёт.'
      - text: 'Фоновое чтение таблицы, справка по открытию, экспорт по команде'
        why: 'У экрана, дополнительного ресурса и эффекта разные триггеры.'
        correct: true
      - text: 'Согласовать показ таблицы и справки общим барьером ожидания'
        why: 'Необязательный ресурс блокирует уже пригодные данные.'
      - text: 'Связать время жизни справки с единственной загрузкой всего экрана'
        why: 'Ресурсы связаны искусственно и лишняя работа выполняется заранее.'
    explanation: 'Границы загрузки задают момент старта и область ожидания или ошибки. Фоновое чтение может сохранять старую выдачу с индикатором обновления. Команду с эффектом запускают отдельным намерением; монтирование или обновление экрана не должно незаметно создавать экспорт.'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.1 Fetching strategy'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/request-waterfalls'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/prefetching'
  - id: 'fsd-a-a1-2-001'
    level: 'middle'
    question: 'Два маршрута читают один справочник. Копия нужна после перехода назад, но должна исчезнуть после logout. Какой scope подходит?'
    options:
      - text: 'Кеш в каждом маршруте с удалением при его размонтировании'
        why: 'Копии не разделяются между маршрутами, а при размонтировании владельца его кеш исчезнет.'
      - text: 'Постоянный общий кеш с проверкой возраста только при входе'
        why: 'Проверка возраста не обеспечивает требуемое удаление приватной копии при выходе.'
      - text: 'Общий сессионный кеш над маршрутами, очистка при выходе'
        why: 'Копия переживает экран и имеет явную границу уничтожения.'
        correct: true
      - text: 'Общий кеш с TTL и очисткой только при закрытии браузера'
        why: 'TTL и закрытие браузера не обеспечивают немедленную очистку после logout.'
    explanation: 'Scope определяет потребителей копии, срок хранения — момент её удаления. Оба независимы от срока свежести. После очистки нужно также отсечь поздние ответы старой сессии, иначе приватный кеш заполнится снова.'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.2 Cache architecture'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/query-keys'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/important-defaults'
  - id: 'fsd-a-a1-2-002'
    level: 'middle'
    question: 'Ответ зависит от tenant, пользователя, фильтра, сортировки и версии проекции. Ключ содержит только endpoint. Как устранить смешивание?'
    options:
      - text: 'Включить контекст и параметры представления в ключ'
        why: 'Разные по смыслу ответы получат разные записи.'
        correct: true
      - text: 'Проверять пользователя только при отображении кеша'
        why: 'Несовместимые ответы уже попали в общую запись и её обновления.'
      - text: 'Добавлять время каждого вызова к endpoint'
        why: 'Уникальность уничтожит reuse и объединение одинаковых запросов.'
      - text: 'Использовать текст фильтра и номер экрана'
        why: 'Пользователи, сортировки и версии всё ещё могут столкнуться.'
    explanation: 'Ключ описывает идентичность результата, включая безопасный контекст доступа. Секретный токен в ключ не входит. Канонизация эквивалентных параметров улучшает reuse; разделение ключей не заменяет серверную авторизацию и политику очистки.'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.2 Cache architecture'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/query-keys'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/important-defaults'
  - id: 'fsd-a-a1-2-003'
    level: 'middle'
    question: 'Остаток локально помечен fresh на минуту. Другой оператор уже продал товар, а клиент нового запроса не делал. Что означает fresh?'
    options:
      - text: 'Чужая продажа инвалидирует кеш без подписки'
        why: 'Без событий или другого механизма клиент не узнает о внешнем изменении автоматически.'
      - text: 'Сервер сохраняет неизменность данных до истечения fresh-периода'
        why: 'Такой гарантии локальная настройка не создаёт.'
      - text: 'Отсутствие запроса доказывает согласованность клиентов'
        why: 'Это отсутствие наблюдения, а не проверка чужих записей.'
      - text: 'Копия допустима, текущий остаток не подтверждён'
        why: 'Локальная оценка пригодности не фиксирует серверное состояние.'
        correct: true
    explanation: 'Наличие записи, fresh-метка и согласованность с сервером — разные свойства. Короткий допустимый возраст снижает риск устаревания, но не обеспечивает корректность покупки. Сервер повторно проверяет остаток при операции.'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.2 Cache architecture'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/query-keys'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/important-defaults'
  - id: 'fsd-a-a1-2-004'
    level: 'middle'
    question: 'Неактивный кеш хранится 20 минут, данные fresh лишь 30 секунд. Через пять минут экран открыли снова. Как трактовать запись?'
    options:
      - text: 'Новый маршрут обязан завести независимый кеш ресурса'
        why: 'Необходимость отдельного владельца из устаревания не следует.'
      - text: 'Копия fresh до завершения двадцати минут хранения'
        why: 'Срок удаления подменяет срок свежести.'
      - text: 'Копии быть не должно после первых тридцати секунд'
        why: 'Это другая политика удаления, не заданная в условии.'
      - text: 'Копия сохранена, её свежесть нужно проверить'
        why: 'Хранение разрешает reuse, не продлевая пригодность без проверки.'
        correct: true
    explanation: 'Eviction освобождает память, freshness определяет необходимость проверки. Stale-копию можно показать с фоновым чтением только при допустимости старых данных. Долгое хранение не является разрешением долго выдавать данные за актуальные.'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.2 Cache architecture'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/query-keys'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/important-defaults'
  - id: 'fsd-a-a1-3-001'
    level: 'middle'
    question: 'Старый справочник допустимо показать сразу, но при открытии stale-копии нужна фоновая проверка. Какой механизм соответствует требованиям?'
    options:
      - text: 'Stale-while-revalidate: показ копии и проверка в фоне'
        why: 'Немедленный полезный показ совмещается с проверкой актуальности.'
        correct: true
      - text: 'Поток изменений без начального чтения справочника'
        why: 'Изменения не предоставляют исходное полное состояние.'
      - text: 'Удаление копии перед каждым показом экрана'
        why: 'Пропадает требуемый немедленный показ допустимой копии.'
      - text: 'Сохранение копии с refetch только при новом фокусе окна'
        why: 'Первое открытие ресурса не обязано сопровождаться focus.'
    explanation: 'TTL задаёт срок политики, SWR — поведение показа и проверки. Invalidation реагирует на известное изменение зависимости, focus — на возвращение пользователя, push — на уведомления источника. Их можно комбинировать; одинаковая отметка stale не означает одинаковый момент refetch.'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.3 Freshness & invalidation'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/query-invalidation'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/window-focus-refetching'
  - id: 'fsd-a-a1-3-002'
    level: 'middle'
    question: 'Постоянно открытое табло должно отражать изменения цены за пять секунд при доступной сети. API допускает не более одного полного чтения в минуту на клиента. Какой договор обновления нужно добавить, чтобы выдержать свежесть без превышения лимита чтений?'
    options:
      - text: 'Доставку серверных изменений с версиями и восстановлением пропусков'
        why: 'События обновляют активное табло между редкими чтениями; восстановление закрывает разрывы доставки.'
        correct: true
      - text: 'Полное чтение после каждого истечения пятисекундного TTL'
        why: 'Двенадцать чтений в минуту превышают заданный лимит API.'
      - text: 'Проверку по возврату фокуса с пятиминутным хранением копии'
        why: 'Долго активное окно может не получать focus-событий и оставаться устаревшим.'
      - text: 'SWR при повторном открытии табло с пятиминутным кешем'
        why: 'Повторное открытие не обеспечивает обновления постоянно видимого экрана.'
    explanation: 'Бюджет свежести и лимит чтений вместе задают потребность получать изменения между полными запросами. Событийный контракт должен определять версии или позицию, допустимую задержку и восстановление после пропусков. Сам TTL не создаёт новые данные, а focus и повторный вход не покрывают активный экран. Если источник не может предоставить нужную доставку, ограничения нужно пересогласовать и честно показать потерю актуальности.'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.3 Freshness & invalidation'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/query-invalidation'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/window-focus-refetching'
  - id: 'fsd-a-a1-3-003'
    level: 'senior'
    question: 'Refetch уже прочитал v8. Пока ответ в пути, мутация подтвердила изменение v9 и инвалидировала кеш, но полного v9 у клиента нет. Старый ответ завершился. Как сохранить смысл invalidation?'
    options:
      - text: 'Не снимать stale по ответу v8; запустить проверку после изменения'
        why: 'Известная граница v9 показывает, что старое чтение не закрыло причину invalidation.'
        correct: true
      - text: 'Считать окончание любого refetch выполнением последней invalidation'
        why: 'Чтение началось до изменения и могло вернуть прежнюю базу.'
      - text: 'Обновить fetchedAt ответом v8 и ждать обычного TTL'
        why: 'Новая метка времени скроет известную устарелость результата.'
      - text: 'Очистить флаг invalidation сразу при отправке refetch'
        why: 'Сам старт чтения не доказывает получение данных после изменения.'
    explanation: 'Invalidation во время чтения должна пережить результат, который ещё не включает изменённую базу. Для этого связывают проверку с поколением invalidation и, когда доступно, минимальной серверной версией. Старый ответ может не закрыть свежесть, даже если был успешным. Отменённый refetch мог уже завершиться, поэтому проверка версии при применении ответа остаётся.'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.3 Freshness & invalidation'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/query-invalidation'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/window-focus-refetching'
  - id: 'fsd-a-a1-3-004'
    level: 'middle'
    question: 'После смены тарифа известны зависимые кеши расчёта. Точные значения клиент вычислять не умеет. Как использовать invalidation?'
    options:
      - text: 'Подставить старую цену в новые расчёты на клиенте'
        why: 'Появится неподтверждённый результат вместо согласованного чтения.'
      - text: 'Продлить freshness, оставив прежние расчёты'
        why: 'Изменившиеся входы не позволяют считать старые результаты свежими.'
      - text: 'Пометить расчёты stale и обновить нужные по политике'
        why: 'Известна зависимость, а вычисление остаётся у авторитетного сервиса.'
        correct: true
      - text: 'Удалить лишь тариф, расчёты оставить до обычного TTL'
        why: 'Известная недействительность зависимостей будет проигнорирована.'
    explanation: 'Invalidation выражает знание, что результат больше не следует считать свежим. Она не обязана удалять запись и немедленно запрашивать все неактивные ресурсы. Для активного критичного расчёта нужно повторное чтение и честный статус до получения ответа.'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.3 Freshness & invalidation'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/query-invalidation'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/window-focus-refetching'
  - id: 'fsd-a-a1-4-001'
    level: 'middle'
    question: 'Три блока одновременно читают один ресурс с одинаковым ключом. Batch endpoint отсутствует. Как уменьшить число одинаковых обращений?'
    options:
      - text: 'Разделить один in-flight запрос между потребителями'
        why: 'Deduplication объединяет совпадающее чтение без нового API.'
        correct: true
      - text: 'Задержать каждый запрос на одинаковые сто миллисекунд'
        why: 'Общая задержка не создаёт совместного использования результата.'
      - text: 'Сделать три запроса параллельно вместо последовательности'
        why: 'Задержка изменится, число обращений останется тем же.'
      - text: 'Дать каждому блоку свой уникальный ключ того же ресурса'
        why: 'Разные ключи помешают распознать совпадение работы.'
    explanation: 'Deduplication объединяет одинаковые чтения с совместимым контекстом. Batching объединяет разные операции и требует формата пакета. Общий запрос не следует отменять при уходе одного блока, если другие всё ещё ждут результат.'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.4 Coordination & prefetch'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/query-cancellation'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/prefetching'
  - id: 'fsd-a-a1-4-005'
    level: 'middle'
    question: 'Два блока делят один in-flight запрос по одному ключу и контексту. Первый размонтирован, второй ещё ждёт. Какие положения протокола сохраняют совместное чтение?'
    options:
      - text: 'Снять подписку первого блока, продолжить запрос для второго'
        why: 'Оставшийся потребитель ещё нуждается в результате.'
        correct: true
      - text: 'Отдать отмену координатору, знающему активных наблюдателей'
        why: 'Только общий владелец располагает сведениями о востребованности операции.'
        correct: true
      - text: 'Доставить второму блоку результат той же общей операции'
        why: 'Одинаковые ключ и контекст позволяют переиспользовать уже начатое чтение.'
        correct: true
      - text: 'Прервать общий запрос контроллером первого блока при его уходе'
        why: 'Второй блок лишится нужного результата из-за чужого lifecycle.'
      - text: 'Создать отдельный fetch второму блоку при снятии первой подписки'
        why: 'Это дублирует ещё нужную работу вместо сохранения общего запроса.'
    explanation: 'Deduplication объединяет сетевую работу, но не жизненные циклы всех потребителей. Координатор хранит подписки или эквивалентное знание о востребованности. Отмена допустима, когда запрос больше никому не нужен и его результат не требуется политике кеша. Это отличается от take-latest: здесь проблема общего владения одной операцией, а не выбора нового намерения.'
    multiple: true
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.4 Coordination & prefetch'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/query-cancellation'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/prefetching'
  - id: 'fsd-a-a1-4-003'
    level: 'middle'
    question: 'Наведённую ссылку открывают в 80% случаев. Ответ 20 КиБ успевает загрузиться до клика и переиспользуется тем же ключом; текущий экран уже готов. Лимит ожидаемых неиспользованных данных — 5 КиБ на наведение. Как снизить ожидание перехода в этом бюджете?'
    options:
      - text: 'Подготовить данные наведённой ссылки низким приоритетом в общем кеше'
        why: 'Ожидаемый неиспользованный объём равен 20% от 20 КиБ, то есть 4 КиБ; пригодный результат уменьшит ожидание клика.'
        correct: true
      - text: 'Отказаться от подготовки и начинать каждое чтение по клику'
        why: 'Трафик минимален, но допустимая по заданному бюджету возможность сократить ожидание не используется.'
      - text: 'Подготовить эту и ещё девять ссылок одинакового размера'
        why: 'Вероятность одного перехода не оправдывает объём остальных неподтверждённых ресурсов.'
      - text: 'Подготовить в отдельном кеше, а при клике заново прочитать ресурс'
        why: 'Без reuse подготовка не сокращает ожидание и добавляет передачу.'
    explanation: 'Prefetch полезен, если вероятная работа успевает до действия и её результат действительно переиспользуется. Здесь ожидаемая потеря 4 КиБ укладывается в лимит 5 КиБ, поэтому подготовка одной ссылки оправданна. Выигрыш относится к задержке, а не к уменьшению общего числа запросов; низкий приоритет не должен мешать уже нужному контенту. При другой вероятности, объёме или свежести решение может быть противоположным.'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.4 Coordination & prefetch'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/query-cancellation'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/prefetching'
  - id: 'fsd-a-a1-4-004'
    level: 'middle'
    question: 'Сервер поддерживает batch чтения 30 разных карточек с поэлементными ошибками. Сейчас они читаются параллельно. Какой эффект ожидаем?'
    options:
      - text: 'Меньше обменов; число операций может сохраниться'
        why: 'Транспортная упаковка не устраняет работу по каждому ресурсу.'
        correct: true
      - text: 'Ускорение каждой карточки пропорционально размеру batch'
        why: 'Медленные элементы и обработка ограничивают выигрыш.'
      - text: 'Единую ошибку без необходимости различать элементы'
        why: 'Заданный API допускает частичные исходы.'
      - text: 'Общий атомарный снимок без отдельного обещания API'
        why: 'Batch сам по себе не является транзакцией.'
    explanation: 'Batching сокращает накладные расходы обменов, но добавляет окно накопления и формат частичных результатов. Общая доставка может задерживать быстрые элементы из-за медленных. Измеряют критический путь, операции и нагрузку раздельно.'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.4 Coordination & prefetch'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/query-cancellation'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/prefetching'
  - id: 'fsd-a-a1-4-006'
    level: 'middle'
    question: 'Ссылку на тяжёлый отчёт после наведения открывают в 2% случаев. Ответ 2 МиБ, лимит ожидаемой неиспользованной передачи — 20 КиБ на наведение. Ожидание загрузки после клика допустимо. Какую стратегию выбрать?'
    options:
      - text: 'Загружать отчёт по клику, без сетевого prefetch на наведение'
        why: 'Ожидаемые потери подготовки около 0,98 × 2048 КиБ, что значительно выше лимита.'
        correct: true
      - text: 'Подготавливать каждый отчёт низким сетевым приоритетом'
        why: 'Приоритет меняет конкуренцию, но не устраняет передачу почти всегда неиспользованного ответа.'
      - text: 'Подготавливать весь ответ и продлить его TTL для редких переходов'
        why: 'Длительное хранение не доказывает использование и не снимает заданный бюджет передачи.'
      - text: 'Отправлять подготовку в batch с другими отчётами'
        why: 'Меньше обменов не означает меньше переданных ненужных данных.'
    explanation: 'Низкая вероятность и большой ответ могут сделать prefetch невыгодным, даже если он ускоряет редкое попадание. В этом сценарии приоритет имеет лимит потерь, а дополнительное ожидание по клику разрешено. Можно позже оценить меньшую проекцию или иной сигнал намерения, но подготовка полного ответа по каждому наведению заданный бюджет не выдерживает.'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.4 Coordination & prefetch'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/query-cancellation'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/prefetching'
  - id: 'fsd-a-a1-5-001'
    level: 'middle'
    question: 'Живая лента отсортирована по createdAt и ID, в начало часто вставляют записи. Нужен последовательный просмотр без перехода к странице N. Какой контракт предпочтителен?'
    options:
      - text: 'Cursor с полным порядком и договором снимка'
        why: 'Граница продолжения не определяется сдвигающимся количеством предыдущих строк.'
        correct: true
      - text: 'Offset живой коллекции без контроля повторов'
        why: 'Вставки перед позицией сдвигают границы и повторяют строки.'
      - text: 'Номер страницы с сортировкой каждой порции на клиенте'
        why: 'Порядок порции не создаёт согласованный порядок всей коллекции.'
      - text: 'Cursor по одному неуникальному createdAt'
        why: 'При равных метках нужна дополнительная определяющая граница.'
    explanation: 'Cursor лучше выдерживает вставки перед текущей границей, если порядок определён однозначно. Сам курсор не даёт неизменяемого snapshot: перемещения и удаления требуют отдельной семантики. Для фиксированного отчёта с прямыми переходами offset может быть удобнее.'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.5 Pagination consistency'
    links:
      - 'https://www.postgresql.org/docs/current/queries-limit.html'
      - 'https://www.elastic.co/docs/reference/elasticsearch/rest-apis/paginate-search-results'
  - id: 'fsd-a-a1-5-002'
    level: 'middle'
    question: 'Отчёт неизменяем и закреплён snapshotId, порядок строк стабилен. Нужно сразу открыть страницу 37 и показать число страниц. Что выбрать?'
    options:
      - text: 'Offset в закреплённом снимке с согласованным total'
        why: 'Фиксированный набор поддерживает адресуемые страницы без сдвигов.'
        correct: true
      - text: 'Считать offset в снимке гарантированно дешёвым на любой глубине'
        why: 'Snapshot фиксирует состав, но не обещает стоимость больших смещений; её нужно измерить.'
      - text: 'Использовать offset живой коллекции без snapshotId'
        why: 'Будет потеряна заданная неизменность набора.'
      - text: 'Последовательно пройти курсоры предыдущих страниц'
        why: 'Это добавляет ожидание вместо требуемого прямого перехода.'
    explanation: 'Offset не является ошибкой сам по себе: на фиксированном наборе он подходит для страниц по номеру. Цена глубоких смещений и точного total зависит от источника и индексов. Снимок определяет состав, но не делает любой запрос дешёвым.'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.5 Pagination consistency'
    links:
      - 'https://www.postgresql.org/docs/current/queries-limit.html'
      - 'https://www.elastic.co/docs/reference/elasticsearch/rest-apis/paginate-search-results'
  - id: 'fsd-a-a1-5-003'
    level: 'middle'
    question: 'Две страницы живой ленты содержат один ID; удаление между запросами могло сдвинуть offset. Что обеспечивает дедупликация по ID?'
    options:
      - text: 'Позволяет отказаться от контракта продолжения'
        why: 'Следующая граница и семантика коллекции всё ещё нужны.'
      - text: 'Убирает дубли, но не восстанавливает пропуски'
        why: 'Совпадения не содержат сведений о невидимых элементах.'
        correct: true
      - text: 'Восстанавливает состав ленты без повторного чтения'
        why: 'Данных о пропусках из одного дубликата получить нельзя.'
      - text: 'Фиксирует порядок при изменении поля сортировки'
        why: 'Стабильная идентичность не равна стабильной позиции.'
    explanation: 'Dedup защищает представление, но не доказывает полноту коллекции. Пропуски и перемещения решают снимок, стабильное продолжение или согласованный refresh. Живая лента может осознанно допускать изменения, не обещая исторически точный состав.'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.5 Pagination consistency'
    links:
      - 'https://www.postgresql.org/docs/current/queries-limit.html'
      - 'https://www.elastic.co/docs/reference/elasticsearch/rest-apis/paginate-search-results'
  - id: 'fsd-a-a1-5-004'
    level: 'middle'
    question: 'Загружается страница 4 фильтра A, пользователь применил B. Кеш A нужен для возврата, а cursor зависит от фильтра. Как переключить цепочки страниц?'
    options:
      - text: 'Для B начать свою цепочку; позднюю страницу A сохранить в контексте A'
        why: 'Новая выборка получает совместимые продолжения, а прежний кеш можно использовать при возврате.'
        correct: true
      - text: 'Оставить cursor A и заменить фильтр на B в следующем запросе'
        why: 'Позиция продолжения относится к другому набору и не обещает корректную границу B.'
      - text: 'Сбросить только первую страницу и дописать поздний ответ A к B'
        why: 'В одной цепочке окажутся страницы разных выборок.'
      - text: 'Хранить общий cursor по имени endpoint независимо от фильтра'
        why: 'Разные составы и порядки не могут надёжно делить одну позицию продолжения.'
    explanation: 'Изменение фильтра или сортировки меняет идентичность цепочки страниц. Параметры и продолжения хранят в её контексте; поздний ответ может заполнить прежний кеш, но не текущую выдачу. Для возврата проверяют пригодность прежних страниц и snapshot. Если продолжение истекло, цепочку восстанавливают по новому договорному чтению, не склеивая старый cursor с новым набором.'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.5 Pagination consistency'
    links:
      - 'https://www.postgresql.org/docs/current/queries-limit.html'
      - 'https://www.elastic.co/docs/reference/elasticsearch/rest-apis/paginate-search-results'
  - id: 'fsd-a-a1-5-005'
    level: 'senior'
    question: 'Курсор идёт по изменяемому приоритету. Ещё не прочитанная запись переместилась выше уже пройденной границы. Продукт требует полный состав на согласованный момент; API умеет закреплять снимки. Как продолжить просмотр?'
    options:
      - text: 'Сохранить старый cursor и добавить новый snapshotId'
        why: 'Продолжение и снимок должны относиться к одному контексту; произвольное сочетание не обещает полного обхода.'
      - text: 'Начать цепочку в закреплённом снимке с восстановлением якоря'
        correct: true
        why: 'Фиксируется состав и порядок на согласованный момент, а позиция восстанавливается в этом же контексте.'
      - text: 'Продолжить старым курсором и удалить дубли по ID'
        why: 'Удаление повторов не вернёт запись, переместившуюся за уже пройденную границу.'
      - text: 'Пересортировать загруженные страницы перед продолжением'
        why: 'Локальная сортировка не обнаружит ещё не полученную запись.'
    explanation: 'Курсор не предотвращает пропуски при изменении ключа сортировки через пройденную границу. Для полноты на один момент требуется закреплённый состав и порядок с соответствующей цепочкой продолжений. Переход на снимок может изменить видимую позицию: её восстанавливают по якорю и честно обрабатывают недоступность прежней строки.'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.5 Pagination consistency'
    links:
      - 'https://www.postgresql.org/docs/current/queries-limit.html'
      - 'https://www.elastic.co/docs/reference/elasticsearch/rest-apis/paginate-search-results'
  - id: 'fsd-a-a2-1-001'
    level: 'middle'
    question: 'Пользователь выбирает адрес A, затем B. Два независимых чтения цены доставки завершаются B, A. Как связать показ цены с выбором?'
    options:
      - text: 'Применять ответ только для текущего поколения выбора'
        why: 'Проверяется принадлежность результата актуальному адресу.'
        correct: true
      - text: 'Применять любой успешный расчёт, пока экран остаётся открыт'
        why: 'Экран может остаться открыт, хотя адрес уже изменился и результат относится к прежним параметрам.'
      - text: 'Показывать последний пришедший расчёт независимо от адреса'
        why: 'Поздняя доставка A не делает его ценой для B.'
      - text: 'Хранить только флаг loading для обоих чтений'
        why: 'Флаг не различает две конкурирующие операции и их входы.'
    explanation: 'Race возникает при нескольких операциях, способных обновлять один потребительский результат. Take-latest подходит к заменяемому чтению: проверяют поколение и ключ параметров. Кеш старого адреса можно заполнить отдельно, но он не меняет экран нового выбора.'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.1 Race conditions & ordering'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/query-cancellation'
  - id: 'fsd-a-a2-1-002'
    level: 'senior'
    question: 'Клиент прервал ожидание длительного POST через AbortController. Отдельный API отмены вернул 202 cancel_requested; по договору это ещё не финальный cancelled, а завершение операции может выиграть гонку. Как вести UI?'
    options:
      - text: 'Показать запрос отмены и получить терминальный исход операции'
        why: 'Отмена ожидания и принятая просьба об отмене не доказывают прекращение серверного эффекта.'
        correct: true
      - text: 'Показать cancelled после 202 и разрешить новую дублирующую операцию'
        why: '202 в заданном контракте означает принятую просьбу, а сервер мог уже завершить работу.'
      - text: 'Показать success после abort, если POST был принят сервером'
        why: 'Принятие и отмена ожидания не являются подтверждением успешного эффекта.'
      - text: 'Повторить исходный POST, чтобы проверить, была ли отмена успешной'
        why: 'Новая отправка с эффектом не является безопасным запросом статуса отменяемой работы.'
    explanation: 'Нужно различать локальное прекращение ожидания, запрос серверной отмены и подтверждённый финальный исход. Кооперативная отмена может проиграть гонку завершению. UI сохраняет идентичность операции и получает cancelled или completed по договорному статусу/событию; повторное действие разрешается по этому результату, а не по локальному abort.'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.1 Race conditions & ordering'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/query-cancellation'
  - id: 'fsd-a-a2-1-003'
    level: 'middle'
    question: 'Клиент отправляет две команды «добавить одну единицу». Обе должны сохраниться, сервер поддерживает их последовательное применение. Какая локальная координация подходит?'
    options:
      - text: 'Take-latest с отбрасыванием первой команды до отправки'
        why: 'Будет потеряна одна значимая пользовательская операция.'
      - text: 'Отправлять команды последовательно с исходом каждой'
        why: 'Порядок сохраняет обе операции и позволяет обрабатывать отказ по отдельности.'
        correct: true
      - text: 'Объединить клики в одну команду добавления единицы через debounce'
        why: 'Debounce без накопления намерений потеряет одно из двух значимых добавлений.'
      - text: 'Отправить параллельно и отменить медленный запрос'
        why: 'Отмена ожидания не управляет порядком или числом серверных эффектов.'
    explanation: 'Take-latest выбирают для заменяемых намерений, serialize — для зависимых команд, каждая из которых значима. Локальная сериализация защищает только этот отправитель. При нескольких клиентах серверу всё равно нужны проверки инвариантов и согласованный порядок применения.'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.1 Race conditions & ordering'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/query-cancellation'
  - id: 'fsd-a-a2-1-004'
    level: 'middle'
    question: 'Два оператора редактируют один документ целиком; молчаливая потеря изменений запрещена. API поддерживает expectedVersion. Какую стратегию выбрать?'
    options:
      - text: 'Применять take-latest только к ответам своего экрана'
        why: 'Это не предотвращает перезапись чужой версии на сервере.'
      - text: 'Повторить устаревший документ с новой прочитанной версией'
        why: 'Так проверка обходится, а чужие изменения затираются осознанно без решения.'
      - text: 'Сериализовать запросы внутри каждого браузера отдельно'
        why: 'Две локальные очереди не образуют общий порядок с проверкой базы.'
      - text: 'Проверять expectedVersion и разрешать конфликт базы'
        why: 'Устаревшая база не принимается как безусловная замена.'
        correct: true
    explanation: 'Version-check обнаруживает конкурирующую запись, а не автоматически сливает её. После отказа нужно получить новую базу и выбрать политику разрешения. Обновить только номер версии в старом теле — значит замаскировать lost update.'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.1 Race conditions & ordering'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/query-cancellation'
  - id: 'fsd-a-a2-1-005'
    level: 'middle'
    question: 'Операторы добавляют разные метки к карточке. API задаёт добавление по уникальному ID метки, повтор не меняет результат; порядок разных добавлений не важен. Как сохранить оба намерения?'
    options:
      - text: 'Сериализовать локальные массивы и обещать защиту от чужих записей'
        why: 'Локальная очередь не координирует другой клиент.'
      - text: 'Отправлять полные массивы меток с локальным last-write-wins'
        why: 'Последний массив может потерять метку другого оператора.'
      - text: 'Принять только последнее добавление по времени ответа'
        why: 'Независимое полезное намерение будет отброшено.'
      - text: 'Передавать добавления по ID, применяя серверное объединение'
        why: 'Контракт допускает объединение именно этих независимых операций.'
        correct: true
    explanation: 'Merge обоснован, когда операции и инварианты действительно допускают объединение. Добавление в множество отличается от замены всего массива. Этот пример не даёт универсального правила для удаления, лимита меток или совместного редактирования текста: их семантика требует отдельного контракта.'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.1 Race conditions & ordering'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/query-cancellation'
  - id: 'fsd-a-a2-2-001'
    level: 'middle'
    question: 'Лайк разрешено показать сразу; API возвращает подтверждённый liked и count, иногда отклоняет действие. Как устроить optimistic lifecycle?'
    options:
      - text: 'Показать pending-прогноз и связать его согласование с ID попытки'
        why: 'Идентичность связывает прогноз с подтверждением или отказом именно этой операции.'
        correct: true
      - text: 'После отправки сохранить прогноз как новую подтверждённую базу'
        why: 'При отказе прогноз уже будет выдан за принятое сервером состояние.'
      - text: 'На ошибке восстановить liked, а прогнозный count оставить в кеше'
        why: 'Связанные значения разойдутся после отклонённого действия.'
      - text: 'После успеха оставить локальный count вместо возвращённого значения'
        why: 'Сервер мог нормализовать счётчик; успешный ответ не доказывает точность локального прогноза.'
    explanation: 'Optimistic update — прогноз интерфейса поверх подтверждённой базы. Нужны идентичность попытки, pending-статус и политика согласования. Ответ может содержать нормализованное значение; оптимистичность не переносит полномочия сервера на клиент.'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.2 Optimistic mutations'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/optimistic-updates'
  - id: 'fsd-a-a2-2-002'
    level: 'senior'
    question: 'База: количество 1. Оптимистическая мутация A добавила 1, B затем добавила ещё 1. A отклонена, B подтверждена. Почему rollback к снимку до A опасен?'
    options:
      - text: 'Снимок до A может заменить базу с подтверждённым результатом B'
        why: 'Снимок описывает более раннюю базу, в которой ещё нет результата B.'
        correct: true
      - text: 'Снимок сохранит B как более позднее сетевое подтверждение'
        why: 'Полная замена старым снимком не включает B лишь из-за времени её ответа.'
      - text: 'Замена снимком эквивалентна удалению дельты одной A'
        why: 'Восстановление всего объекта отличается от удаления отдельного optimistic-слоя.'
      - text: 'Локальное восстановление снимка отменит серверный эффект B'
        why: 'Подмена клиентского объекта не является серверной компенсацией и не отменяет успешную команду.'
    explanation: 'Snapshot rollback прост при одной изолированной попытке. При пересекающихся мутациях нужен rollback только своего слоя, корректная inverse operation либо повторное чтение с восстановлением оставшихся прогнозов. Обратная операция тоже безопасна не всегда: её применимость зависит от коммутативности и серверной нормализации.'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.2 Optimistic mutations'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/optimistic-updates'
  - id: 'fsd-a-a2-2-003'
    level: 'senior'
    question: 'Сервер нелинейно пересчитывает скидки. Две пересекающиеся optimistic-операции уже отправлены, A отклонена; эффект B ещё неизвестен. Надёжной inverse operation и маркера включённых операций в снимке нет. Как получить корректную итоговую базу?'
    options:
      - text: 'Вернуть общий снимок до обеих попыток без проверки исходов'
        why: 'Могут исчезнуть уже подтверждённые независимые изменения.'
      - text: 'Вычесть из итоговой скидки локальную дельту ошибочного ввода'
        why: 'Нелинейная нормализация не гарантирует обратимость такого вычитания.'
      - text: 'Перечитать базу и наложить все отправленные операции без проверки'
        why: 'Pending у клиента не доказывает отсутствие эффекта в базе: сервер мог применить операцию до потери её подтверждения.'
      - text: 'Выяснить пересекающиеся исходы и перечитать итоговую базу'
        why: 'Без знания включённых эффектов нельзя повторно накладывать B как заведомо отсутствующую; после выяснения её исхода можно получить авторитетный итог.'
        correct: true
    explanation: 'Refetch возвращает серверное состояние, но pending на клиенте не доказывает, что эффект ещё отсутствует в нём. Повторное наложение уже включённого приращения даст двойной учёт. Если API не сообщает включённые операции, сначала выясняют исходы пересекающихся отправок, затем перечитывают итог. Пока это невозможно, pending показывают отдельно без ложного численного обещания; новый ещё не отправленный ввод сохраняют раздельно.'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.2 Optimistic mutations'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/optimistic-updates'
  - id: 'fsd-a-a2-2-004'
    level: 'middle'
    question: 'Одно действие меняет избранное, другое отправляет юридически значимую заявку с редкими, но существенными отказами. Как выбрать UX?'
    options:
      - text: 'Избранное показывать прогнозом; отправку и подтверждение заявки разделять'
        why: 'Цена ложного успеха и возможность восстановить действие у сценариев различаются.'
        correct: true
      - text: 'Оба действия показать успешными, отказы исправлять при следующем входе'
        why: 'Пользователь может уйти с юридически значимой заявкой, которая не была принята.'
      - text: 'Для заявки показывать окончательный успех после локального принятия в очередь'
        why: 'Очередь гарантирует лишь локальную работу, а не результат серверной проверки.'
      - text: 'Для избранного считать локальный флаг основанием серверного подтверждения'
        why: 'Прогноз допустим, но остаётся прогнозом до согласования с API.'
    explanation: 'Optimistic UX выбирают по вероятности отказа, обратимости и последствиям ошибочного представления. Немедленная реакция может быть анимацией или статусом отправки без заявления окончательного успеха. Финансовые или юридические действия требуют особенно точной семантики подтверждения.'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.2 Optimistic mutations'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/optimistic-updates'
  - id: 'fsd-a-a2-3-005'
    level: 'middle'
    question: 'API обещает: GET читает тему; PUT устанавливает указанную тему идемпотентно; POST увеличивает счётчик на единицу при каждом вызове. Ответы потеряны, конкурентных изменений темы нет. Как различить повторы?'
    options:
      - text: 'GET и прежний PUT повторить; для POST нужна защита повтора'
        why: 'Чтение не меняет состояние, повтор установки не добавляет новый эффект, приращение может удвоиться.'
        correct: true
      - text: 'GET повторить; PUT и POST повторить с новыми значениями входа'
        why: 'Новые входы меняют намерение и не являются повторением прежней попытки.'
      - text: 'GET и PUT считать чтениями; POST повторить после локального сброса'
        why: 'PUT остаётся записью, а локальный сброс не предотвращает повторное приращение.'
      - text: 'GET отложить; PUT и POST считать идемпотентными по HTTP-методу'
        why: 'Для POST задан повторяемый эффект, а обещание PUT относится к конкретной операции установки.'
    explanation: 'Безопасность чтения означает отсутствие запрошенного изменения состояния, а идемпотентность записи — одинаковый итог повторения одного намерения. Это разные свойства. Контракт установки может допускать повтор того же значения, тогда как приращение требует серверной идентичности попытки или выяснения результата. При конкурирующих изменениях даже повтор установки нужно согласовать с версиями, чтобы не восстановить устаревшее намерение.'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.3 Idempotency & retries'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html'
      - 'https://docs.stripe.com/api/idempotent_requests'
  - id: 'fsd-a-a2-3-002'
    level: 'middle'
    question: 'Сервер хранит результат операции по idempotency key 24 часа, сравнивает тело и область аккаунта. Что отправить при сетевом повторе той же попытки через минуту?'
    options:
      - text: 'Новый ключ при каждом запросе, сохраняя то же тело'
        why: 'Для сервера это новые операции, способные повторить эффект.'
      - text: 'Тот же ключ после смены аккаунта как глобальную гарантию'
        why: 'Область действия ключа в условии ограничена аккаунтом.'
      - text: 'Тот же ключ с изменённой суммой новой покупки'
        why: 'Ключ нельзя использовать для принципиально другого намерения.'
      - text: 'Тот же ключ и тело в той же области аккаунта'
        why: 'Повтор попадает в обещанную область серверной дедупликации.'
        correct: true
    explanation: 'Idempotency key идентифицирует одну логическую попытку, а не каждый транспортный запрос. Сервер должен определить атомарную обработку повторов, совместимость тела, scope и срок хранения. Наличие заголовка без такой реализации ничего не гарантирует.'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.3 Idempotency & retries'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html'
      - 'https://docs.stripe.com/api/idempotent_requests'
  - id: 'fsd-a-a2-3-003'
    level: 'senior'
    question: 'Первый платёж мог выполниться, ответ потерян. Прошло 48 часов, а ключи сервер помнит только 24 часа. Что делать?'
    options:
      - text: 'До нового списания запросить бизнес-результат прежней попытки'
        why: 'Срок хранения ключа истёк, поэтому нужно установить, был ли эффект.'
        correct: true
      - text: 'Повторить платёж со старым ключом как с сохранённой идентичностью'
        why: 'Идентичность осталась у клиента, но сервер больше не обещает её дедупликацию.'
      - text: 'Назначить ключ новой попытки после истечения клиентского ожидания'
        why: 'Новый ключ разрешает серверу создать второй эффект, даже если старый платёж успешен.'
      - text: 'Считать отсутствие ответа отказом и предложить оплату снова'
        why: 'Потеря подтверждения не устанавливает отрицательный бизнес-результат.'
    explanation: 'Гарантия повтора ограничена временем и серверной областью ключа. После её истечения нужен бизнес-способ выяснения исхода или поддержка оператора. Идемпотентность не означает вечное exactly-once для всей системы и не устраняет необходимость восстановления пользовательского сценария.'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.3 Idempotency & retries'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html'
      - 'https://docs.stripe.com/api/idempotent_requests'
  - id: 'fsd-a-a2-4-001'
    level: 'middle'
    question: 'Редактор прочитал документ с ETag "v7". Сервер поддерживает сильный валидатор и If-Match для записи. Как обнаружить изменение после чтения?'
    options:
      - text: 'Проверить ETag только в локальном кеше перед POST'
        why: 'Проверка не видит конкурентную запись между клиентом и сервером.'
      - text: 'Повторить GET и при совпадении ETag отправить безусловную запись'
        why: 'Между проверочным GET и записью возможна чужая правка; проверка должна сопровождать саму запись.'
      - text: 'Передать If-None-Match: "v7" как защиту перезаписи'
        why: 'При текущем ETag "v7" If-None-Match не выполняется, а после изменения может выполниться: это противоположность проверки записи на базе v7.'
      - text: 'Записать с If-Match: "v7", обработать отказ предусловия'
        why: 'Сервер проверит, совпадает ли версия базы с текущей.'
        correct: true
    explanation: 'Условная запись переносит проверку базы к владельцу данных, где она может быть атомарной с изменением. If-Match со сильным ETag подходит для защиты от lost update. Ответ о конфликте или невыполненном предусловии требует отдельной политики, а не подстановки свежей версии в старое тело.'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.4 Versioning & conflicts'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html#section-13.1.1'
  - id: 'fsd-a-a2-4-002'
    level: 'middle'
    question: 'Два оператора правят одинаковое поле юридического документа. Потеря текста запрещена, автоматическое смысловое слияние отсутствует. Какой путь подходит?'
    options:
      - text: 'Отклонить устаревшую запись и показать обе версии для решения'
        why: 'Сохраняется работа пользователя и не затирается чужое изменение.'
        correct: true
      - text: 'Слить поля автоматически, выбрав последнее значение спорного поля'
        why: 'Конфликт остаётся в одном поле и замаскирован тем же перезаписыванием.'
      - text: 'Перечитать документ и очистить локальный ввод'
        why: 'Актуальность сервера достигается потерей несохранённой работы.'
      - text: 'Last-write-wins по времени получения сервером'
        why: 'Один текст может молча заменить другой вопреки запрету потери.'
    explanation: 'Field-level merge полезен при действительно независимых полях и совместимых инвариантах. Для одного значимого текста нужен reject-and-refresh с сохранённым черновиком и явным разрешением. Last-write-wins допустим только если продукт осознанно принимает потерю конкурирующей версии.'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.4 Versioning & conflicts'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html#section-13.1.1'
  - id: 'fsd-a-a2-4-003'
    level: 'middle'
    question: 'Два клиента меняют разные поля: имя и язык. Между полями нет инварианта, API принимает patch с проверкой независимых версий полей. Что допустимо?'
    options:
      - text: 'Принять patch без серверных проверок версий полей'
        why: 'Будет потеряна заданная защита при реальном конфликте того же поля.'
      - text: 'Объявить любой merge запрещённым из-за двух клиентов'
        why: 'Условие явно разрешает независимое согласованное объединение.'
      - text: 'Заменить объект целиком локальной копией каждого клиента'
        why: 'Полная замена может затереть другое независимое изменение.'
      - text: 'Применить независимые patch с проверкой версий полей'
        why: 'Конкуренция не затрагивает одну единицу конфликта.'
        correct: true
    explanation: 'Гранулярность версии определяет гранулярность конфликта. Независимый patch может безопасно объединять поля при серверном контракте, но не при скрытых межполевых правилах. Сложные коллаборативные модели не нужны, если точечные проверки покрывают реальные операции.'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.4 Versioning & conflicts'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html#section-13.1.1'
  - id: 'fsd-a-a2-4-004'
    level: 'senior'
    question: 'Два клиента видят остаток 1, версия v12. API резерва атомарно проверяет If-Match и возвращает 412 проигравшему клиенту. Его UI уже показал optimistic «зарезервировано». Как согласовать результат этой попытки?'
    options:
      - text: 'Снять прогноз резерва, перечитать остаток и показать исход отказа'
        why: '412 подтверждает непринятие этой условной записи; локальное представление нужно согласовать с актуальной базой.'
        correct: true
      - text: 'Повторить прежний резерв с последним ETag, не меняя статус успеха'
        why: 'Новая версия не означает наличие товара или согласие пользователя на новую попытку.'
      - text: 'Оставить прогноз и обработать 412 как сетевой retry того же чтения'
        why: 'Отказ предусловия относится к записи на устаревшей базе, а не к временному отказу чтения.'
      - text: 'Заменить остаток локальным нулём и считать резерв подтверждённым'
        why: 'Локальный итог не доказывает, кому сервер выдал единственный резерв.'
    explanation: 'Условная запись связывает серверную проверку версии с эффектом. Локально согласованный прогноз не становится подтверждением при 412: эта попытка не была применена по договору API. Клиент снимает её optimistic-слой, обновляет базу и показывает допустимые действия. Подстановка нового ETag в старый запрос без пересмотра намерения обходит полезный смысл обнаруженного конфликта.'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.4 Versioning & conflicts'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html#section-13.1.1'
  - id: 'fsd-a-a2-4-005'
    level: 'middle'
    question: 'Пользователь выбирает цвет темы с двух устройств. История выбора не нужна; продукт принимает последнюю принятую сервером запись. Нужна простая политика без пользовательского разрешения конкурирующих версий. Какую политику достаточно использовать?'
    options:
      - text: 'Last-write-wins по согласованному серверному порядку'
        why: 'Последнее принятое значение соответствует явно разрешённой семантике потери прежнего выбора.'
        correct: true
      - text: 'Отклонять всякую запись с устаревшей базой и требовать решения'
        why: 'Это добавляет не требуемый для этой настройки конфликтный UX; сохранение обеих версий не нужно.'
      - text: 'Объединять значения двух цветов в составной объект темы'
        why: 'Контракт требует один выбранный цвет, а не результат слияния двух альтернатив.'
      - text: 'Выбирать последнее значение по часам каждого устройства'
        why: 'Несогласованные клиентские часы не реализуют заданный порядок принятия сервером.'
    explanation: 'Last-write-wins допустим, если продукт принимает потерю прежнего конкурирующего значения и определяет общий порядок победителя. Это простой выбор для низкорисковой заменяемой настройки. Для текста договора или ограниченного ресурса та же политика могла бы нарушить инварианты и требовать версий либо явного разрешения.'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.4 Versioning & conflicts'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html#section-13.1.1'
  - id: 'fsd-a-a2-5-001'
    level: 'senior'
    question: 'Ответ мутации A содержит сущность версии 11, но кеш уже получил версию 12 от B. Как применить A?'
    options:
      - text: 'Перезаписать кеш ответом A как последним полученным'
        why: 'Время доставки не означает новизну сущности.'
      - text: 'Отметить A ошибкой только из-за более новой версии кеша'
        why: 'Операция могла успешно завершиться, хотя её снимок уже устарел.'
      - text: 'Стереть версию из ответа и поверхностно слить поля'
        why: 'Так можно откатить новые данные без возможности заметить регрессию.'
      - text: 'Завершить pending A, не регрессируя кеш с 12 до 11'
        why: 'Подтверждение попытки и обновление содержимого имеют разные условия.'
        correct: true
    explanation: 'Reconciliation связывает ответ с попыткой и с текущим состоянием ресурса. Успешный исход старой попытки не обязывает показывать её старый снимок. Серверные версии и явно заданные правила слияния полезнее времени прихода; без сравнимых версий может понадобиться авторитетный refetch.'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.5 Cache reconciliation'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/updates-from-mutation-responses'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/invalidations-from-mutations'
  - id: 'fsd-a-a2-5-002'
    level: 'middle'
    question: 'PATCH возвращает полную подтверждённую карточку с версией; состав коллекции и сортировка не изменились. Требуется согласовать деталь без лишнего повторного чтения, если ответ достаточно актуален. Как обновить кеш?'
    options:
      - text: 'Инвалидировать карточку и связанные списки, затем перечитать их'
        why: 'Так можно получить корректные данные, но при достаточном полном ответе возникают лишние чтения вопреки условию. Это допустимая стратегия при неполном ответе или неизвестных зависимостях.'
      - text: 'Обновить карточку полным ответом с проверкой его версии'
        why: 'Ответ содержит достаточную авторитетную форму для прямого обновления.'
        correct: true
      - text: 'Оставить локальный прогноз вместо нормализованного ответа'
        why: 'Прогноз может отличаться от подтверждённых сервером данных.'
      - text: 'Перезаписать карточку только полями отправленного PATCH'
        why: 'Сервер мог нормализовать или изменить дополнительные поля.'
    explanation: 'Прямое обновление подходит, когда ответ достаточен и его версия пригодна. Это экономит чтение, но клиент отвечает за идентичность и корректную форму записи. Если ответ частичный или затронуты неизвестные агрегаты, invalidation безопаснее выдуманного пересчёта.'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.5 Cache reconciliation'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/updates-from-mutation-responses'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/invalidations-from-mutations'
  - id: 'fsd-a-a2-5-003'
    level: 'senior'
    question: 'Изменение статуса переносит заказ между несколькими серверно фильтруемыми страницами и меняет total. API возвращает только ID и новый статус. Других конкурирующих записей в этом сценарии нет. Что выбрать?'
    options:
      - text: 'Применить известные поля и инвалидировать затронутые выборки'
        why: 'Неполного ответа недостаточно для нового состава страниц и total.'
        correct: true
      - text: 'Изменить статус и арифметически поправить total загруженных страниц'
        why: 'Нельзя точно восстановить членство, границы и агрегат по одному ID и статусу.'
      - text: 'Обновить строки по ID и продлить свежесть их прежних страниц'
        why: 'Поля обновятся, но страницы могут содержать уже неподходящие записи или пропуски.'
      - text: 'Перечитать открытую страницу, оставив остальные выборки пригодными'
        why: 'Изменение затрагивает и другие известные фильтры, не только активное представление.'
    explanation: 'Одна сущность встречается в деталях, списках и агрегатах с разными зависимостями. Прямая замена полей не исправляет серверную пагинацию или total. Нужна карта затронутых запросов либо нормализованный слой с явной invalidation коллекций.'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.5 Cache reconciliation'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/updates-from-mutation-responses'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/invalidations-from-mutations'
  - id: 'fsd-a-a2-5-004'
    level: 'middle'
    question: 'Карточка и два списка хранят копии товара; обновление имени видно только в карточке. Как устранить расхождение без единого кеша всего приложения?'
    options:
      - text: 'Связать копии по ID и применять обновление или invalidation'
        why: 'Физически разные записи могут иметь явную согласованную политику обновления.'
        correct: true
      - text: 'Обновить карточку и продлить всем спискам одинаковый TTL'
        why: 'Одинаковый возраст не доставит новое имя в копии.'
      - text: 'Записать новое имя в открытый список, остальные обновить по навигации'
        why: 'Известные потребители останутся несогласованными до перехода, хотя изменение уже известно.'
      - text: 'Выбрать более поздно отрисованный список как источник имени'
        why: 'Поздний рендер может использовать старый кеш, а не новую версию сущности.'
    explanation: 'Нормализация может упростить общие сущности, но не автоматически вычисляет членство в списках. Независимые query-кеши тоже корректны, если известны правила обновления и invalidation. Архитектура должна различать копию полей сущности и результат серверного запроса.'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.5 Cache reconciliation'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/updates-from-mutation-responses'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/invalidations-from-mutations'
  - id: 'fsd-a-a3-1-001'
    level: 'middle'
    question: 'navigator.onLine возвращает true, но запрос чтения API завершился сетевой ошибкой без HTTP-ответа. Как классифицировать наблюдение?'
    options:
      - text: 'API доступен, поскольку сетевой интерфейс подключён'
        why: 'Локальная связность не доказывает путь до сервиса.'
      - text: 'Это HTTP 500: клиент не получил полезные данные'
        why: 'Без ответа нельзя вывести конкретный серверный статус.'
      - text: 'Это ошибка валидации введённого пользователем фильтра'
        why: 'Нет серверного ответа, подтверждающего отказ проверки данных.'
      - text: 'Нет доступа к API; HTTP-статус неизвестен'
        why: 'Флаг сети не гарантирует доступность конкретного сервиса.'
        correct: true
    explanation: 'Offline-сигнал, транспортная ошибка, timeout и HTTP-ответ несут разную информацию. navigator.onLine полезен как подсказка, но не как доказательство доступности endpoint. Диагностика должна сохранять категорию без выдуманного статуса и предлагать подходящее восстановление.'
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.1 Failure taxonomy'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Navigator/onLine'
  - id: 'fsd-a-a3-1-002'
    level: 'middle'
    question: 'API по договору вернул validation error с полем «дата», а интерфейс повторяет то же тело как transient failure. Что исправить?'
    options:
      - text: 'Скрыть ошибку поля за общей плашкой недоступности API'
        why: 'Теряется точный полезный способ восстановления.'
      - text: 'Повторить тело с увеличением интервала до успешного ответа'
        why: 'Та же недопустимая дата не станет корректной из-за ожидания.'
      - text: 'Показать ошибку поля, сохранить ввод до исправления'
        why: 'Известный отказ требует новых входных данных, а не задержки.'
        correct: true
      - text: 'Считать ввод потерянным и заново открыть пустую форму'
        why: 'Пользователь теряет работу, хотя известен локальный путь исправления.'
    explanation: 'Recoverable с точки зрения пользователя не обязательно означает автоматический retry. Validation восстанавливается исправлением ввода, auth — восстановлением сессии, version conflict — согласованием базы. HTTP-класс сам по себе не задаёт всё поведение: важен договор ошибки.'
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.1 Failure taxonomy'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Navigator/onLine'
  - id: 'fsd-a-a3-1-003'
    level: 'middle'
    question: 'Сервер ответил 403 для закрытого документа, а другая запись получила 412 при If-Match. Какие действия соответствуют этим исходам?'
    options:
      - text: 'Для обеих повторить запрос с теми же входами после задержки'
        why: 'Ни права, ни конфликтующая версия от такой задержки не исправляются.'
      - text: '403 — права, 412 — сохранение ввода и решение конфликта'
        why: 'Категории указывают на разные необходимые изменения условий.'
        correct: true
      - text: 'Для обеих очистить все данные и сообщить об offline'
        why: 'Есть известные HTTP-ответы, не доказательство отсутствия сети.'
      - text: 'Для 403 заменить ID, для 412 убрать условие версии'
        why: 'Так обходятся контракты вместо безопасного восстановления.'
    explanation: 'Коды и машинные причины сопоставляют с действиями пользователя по контракту. Не следует трактовать любой 4xx как навсегда неисправимый или любой 5xx как безопасный повтор записи. Сохранённая причина помогает отличить отсутствие доступа от устаревшей базы.'
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.1 Failure taxonomy'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Navigator/onLine'
  - id: 'fsd-a-a3-1-004'
    level: 'middle'
    question: 'Чтение получило 503, а команда создания потеряла ответ после отправки. Как различить восстановление?'
    options:
      - text: 'Повторить оба действия с новыми операционными ID'
        why: 'Команда могла выполниться и будет создана повторно.'
      - text: 'Чтению retry; команде — выяснение исхода'
        why: 'Транзиентность доступности не снимает неопределённость серверного эффекта.'
        correct: true
      - text: 'Оба исхода считать окончательным отказом пользователя'
        why: '503 может быть временным, потерянный ответ не доказывает отказ записи.'
      - text: 'Оба действия показать сохранёнными после восстановления сети'
        why: 'Связность сама не подтверждает результат ни одного запроса.'
    explanation: 'Transient failure описывает вероятность восстановления доступности, неопределённый исход — недостаток знания об эффекте. Они могут встречаться одновременно, но требуют разных решений. Для записи сначала нужен контракт статуса или безопасного повтора, затем политика нагрузки.'
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.1 Failure taxonomy'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Navigator/onLine'
  - id: 'fsd-a-a3-1-005'
    level: 'middle'
    question: 'API подтвердил: срок приёма заявки завершён окончательно, продление и повтор для этого конкурса не предусмотрены. Рядом другая заявка отклонена из-за исправляемой даты. Как различить исходы для пользователя?'
    options:
      - text: 'Оба исхода повторять с теми же данными после сетевой паузы'
        why: 'Ожидание не меняет договорный срок и не исправляет недопустимую дату.'
      - text: 'В обоих случаях предлагать только изменение входных данных'
        why: 'Исправление даты поможет второй заявке, но не продлит окончательно завершённый приём в первом конкурсе.'
      - text: 'Обе ошибки направить на повтор после обновления сессии'
        why: 'Ни окончательный срок, ни неверная дата не являются указанной ошибкой сессии; повторный вход не исправит причины.'
      - text: 'Первое намерение завершить отказом, во втором дать исправить ввод'
        correct: true
        why: 'У текущего конкурса нет допустимого пути выполнить ту же заявку, а ошибка даты устраняется изменением входа.'
    explanation: 'Восстанавливаемость оценивают относительно намерения пользователя и доступных изменений условий. Исправление ввода, вход в аккаунт или возврат сети могут открыть путь продолжения. Окончательный договорный отказ требует завершить эту попытку и предложить только реальные альтернативы; это не правило «любой 4xx невосстанавливаем».'
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.1 Failure taxonomy'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Navigator/onLine'
  - id: 'fsd-a-a3-2-001'
    level: 'middle'
    question: 'Безопасный GET получил 503 с Retry-After: 20 секунд. У текущего пользовательского действия осталось 8 секунд общего deadline. Серверную паузу нарушать нельзя. Как поступить с автоматическим повтором?'
    options:
      - text: 'Завершить этот цикл ожидания и предложить повтор позже'
        why: 'Разрешённый сервером момент уже выходит за оставшийся бюджет действия.'
        correct: true
      - text: 'Повторить через 8 секунд, чтобы уложиться в клиентский deadline'
        why: 'Клиентский бюджет не даёт права сократить серверную паузу.'
      - text: 'Ждать 20 секунд и продолжить под прежним восьмисекундным deadline'
        why: 'Такой цикл нарушит собственный общий бюджет ожидания.'
      - text: 'Сразу повторить GET, поскольку чтение не имеет побочного эффекта'
        why: 'Безопасность эффекта не отменяет ограничение нагрузки и Retry-After.'
    explanation: 'Политика повторов учитывает не только число попыток, но и общий срок действия, серверные ограничения и актуальность результата. Если допустимая следующая попытка не помещается в deadline, автоматический цикл завершается с понятным состоянием. Ручной запуск позже может создать новый ограниченный цикл; он не должен незаметно продлевать исходное ожидание.'
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.2 Retry policy'
    links:
      - 'https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/retry-backoff.html'
      - 'https://www.rfc-editor.org/rfc/rfc9110.html#section-10.2.3'
  - id: 'fsd-a-a3-2-002'
    level: 'middle'
    question: 'После сбоя тысячи клиентов делают повторы через 1, 2 и 4 секунды строго одновременно. Как уменьшить синхронные пики?'
    options:
      - text: 'Добавить случайность только после последней попытки'
        why: 'Рабочие повторы по-прежнему попадут в одни временные окна.'
      - text: 'Оставить общий таймер, удвоив число попыток'
        why: 'Клиенты останутся синхронны и добавят обращений.'
      - text: 'Backoff с jitter, верхней задержкой и бюджетом'
        why: 'Случайное распределение разносит нагрузку разных клиентов.'
        correct: true
      - text: 'Обнулить задержку после каждой транспортной ошибки'
        why: 'Частота обращений к недоступному сервису возрастёт.'
    explanation: 'Exponential backoff уменьшает частоту повторов, jitter разносит их между клиентами. Они не исправляют неверную авторизацию и не делают мутацию идемпотентной. Политика включает верхний интервал, лимит попыток или времени и явный исход для пользователя.'
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.2 Retry policy'
    links:
      - 'https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/retry-backoff.html'
      - 'https://www.rfc-editor.org/rfc/rfc9110.html#section-10.2.3'
  - id: 'fsd-a-a3-2-003'
    level: 'senior'
    question: 'UI повторяет запрос три раза; SDK на каждое обращение тоже делает три попытки. У сервиса массовый сбой. Что важно изменить?'
    options:
      - text: 'Уменьшить задержки SDK, оставив оба полных цикла'
        why: 'Попытки сохранятся и станут плотнее во время отказа.'
      - text: 'Один владелец retry и сквозной бюджет операции'
        why: 'Несогласованные уровни перемножают обращения и задержки.'
        correct: true
      - text: 'Считать только попытки UI, скрыв повторы SDK из метрик'
        why: 'Пользовательский бюджет и нагрузка станут неверно оцениваться.'
      - text: 'Добавить третий уровень повторов в общий API-адаптер'
        why: 'Число фактических обращений ещё увеличится.'
    explanation: 'Повторы на нескольких слоях могут мультипликативно усиливать сбой. У операции должен быть согласованный deadline и понятный владелец политики; сетевые попытки наблюдаются отдельно от пользовательских действий. Локальное ограничение каждого слоя ещё не доказывает ограниченность разумной общей нагрузки.'
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.2 Retry policy'
    links:
      - 'https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/retry-backoff.html'
      - 'https://www.rfc-editor.org/rfc/rfc9110.html#section-10.2.3'
  - id: 'fsd-a-a3-2-004'
    level: 'middle'
    question: 'Безопасное чтение уже исчерпало бюджет автоматических попыток. Пользователь ушёл с экрана, затем нажал «Повторить» на сохранённой ошибке в другом разделе. Что требуется?'
    options:
      - text: 'Разрешить ручной retry без лимита конкурентных запросов'
        why: 'Много кликов может усилить нагрузку и создать гонки.'
      - text: 'Повторить чтение с параметрами уже закрытого маршрута'
        why: 'Результат может не соответствовать новому контексту пользователя.'
      - text: 'Проверить контекст, начать ограниченный цикл'
        why: 'Ручной retry остаётся управляемым действием с актуальными параметрами.'
        correct: true
      - text: 'Продолжить прежний бесконечный цикл в фоне'
        why: 'Бюджет будет обойдён, хотя исходный потребитель ушёл.'
    explanation: 'Лимит автоматических попыток не запрещает осмысленное восстановление человеком. Ручной запуск проверяет параметры, сессию и необходимость результата; повторные клики координируются. После исчерпания бюджета нужен понятный конечный статус, а не невидимая бесконечная активность.'
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.2 Retry policy'
    links:
      - 'https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/retry-backoff.html'
      - 'https://www.rfc-editor.org/rfc/rfc9110.html#section-10.2.3'
  - id: 'fsd-a-a3-3-001'
    level: 'senior'
    question: 'Введена редакция 12, отправлена 11, подтверждена только 10. Какой статус честно показать текущему тексту?'
    options:
      - text: 'Весь текст failed, потому что подтверждение ещё не пришло'
        why: 'Штатное ожидание не является известным отказом.'
      - text: 'Сохранено, поскольку предыдущая редакция имела успех'
        why: 'Успех 10 не подтверждает текст редакции 12.'
      - text: 'Конфликт версии, поскольку локальных редакций больше одной'
        why: 'Несколько локальных правок сами по себе не доказывают серверный конфликт.'
      - text: 'Есть несохранённые изменения; сохраняется более ранняя редакция'
        why: 'Подтверждение относится не к текущему содержимому.'
        correct: true
    explanation: 'Статус относится к определённой редакции, а не к форме вообще. Draft обозначает локальную работу, saving — отправленную попытку, saved — подтверждённое содержимое, error — известный отказ, conflict — несовместимость базы. Во время сохранения новая правка может снова сделать текущий ввод dirty.'
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.3 Autosave lifecycle'
    links:
      - 'https://developer.chrome.com/docs/web-platform/page-lifecycle-api'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Window/beforeunload_event'
  - id: 'fsd-a-a3-3-002'
    level: 'senior'
    question: 'Autosave использует debounce 500 мс. Старое сохранение иногда завершается после нового. Как устранить регрессию?'
    options:
      - text: 'Обновлять saved при любом успешном ответе autosave'
        why: 'Старый ack может ложно подтвердить новый локальный ввод.'
      - text: 'Считать поздний ответ самым новым сохранённым текстом'
        why: 'Время доставки не определяет редакцию подтверждения.'
      - text: 'Увеличить debounce до секунды без изменения протокола'
        why: 'Вероятность пересечения снизится, но порядок всё ещё не гарантирован.'
      - text: 'Согласовать порядок или версии записи и проверять редакцию ack'
        why: 'Debounce задаёт старт, а протокол управляет сохранением.'
        correct: true
    explanation: 'Debounce объединяет частые триггеры в одну отправку после паузы. Он не задаёт серверный порядок, версии и обработку конфликтов. Для согласованного autosave сериализуют допустимые сохранения или используют ожидаемые версии и идентичность редакции; неподтверждённый новый текст остаётся dirty.'
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.3 Autosave lifecycle'
    links:
      - 'https://developer.chrome.com/docs/web-platform/page-lifecycle-api'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Window/beforeunload_event'
  - id: 'fsd-a-a3-3-003'
    level: 'senior'
    question: 'Редакция 12 успешно записана в разрешённое локальное хранилище, сервер подтвердил пока редакцию 10. При уходе sendBeacon для 12 вернул true; альтернативный fetch с keepalive был запущен без полученного ответа. Какой статус и восстановление честны?'
    options:
      - text: 'Локально сохранённая редакция 12 остаётся отдельной от серверной 10'
        why: 'У локальной записи и серверного подтверждения разные источники гарантии.'
        correct: true
      - text: 'До выяснения серверного результата нужно удержать локальную 12'
        why: 'Подтверждение отправки не получено, а работа уже есть в допустимом хранилище.'
        correct: true
      - text: 'Положительный sendBeacon позволяет пометить редакцию 12 как server-saved'
        why: 'true говорит о постановке передачи в очередь браузера.'
      - text: 'Запуск fetch с keepalive позволяет удалить локальную 12 до ответа'
        why: 'Продолжение сетевой работы не доказывает успешное сохранение редакции.'
    explanation: 'Локально сохранено и подтверждено сервером — разные гарантии, привязанные к редакции. sendBeacon не даёт прикладного ответа, а keepalive позволяет fetch продолжать работу после ухода, но запуск запроса не подтверждает его результат. При возвращении клиент сверяет серверную редакцию или статус попытки и сохраняет локальную 12 до согласования. Путь восстановления должен распознавать уже применённую попытку, чтобы не повторить её эффект вслепую.'
    links:
      - 'https://developer.chrome.com/docs/web-platform/page-lifecycle-api'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Window/beforeunload_event'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Navigator/sendBeacon'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Request/keepalive'
    multiple: true
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.3 Autosave lifecycle'
  - id: 'fsd-a-a3-3-004'
    level: 'middle'
    question: 'При переходе в другой маршрут сохраняется revision 5, но пользователь уже ввёл 6. Данные на устройстве хранить запрещено. Как защитить работу при управляемой навигации?'
    options:
      - text: 'Разрешить переход, потому что любой autosave уже запущен'
        why: 'Отправка 5 не сохраняет текст 6.'
      - text: 'Считать отмену запроса подтверждением отказа от revision 6'
        why: 'Отмена ожидания не является решением пользователя потерять ввод.'
      - text: 'Предупредить о тексте 6 и предложить его сохранение'
        why: 'UI опирается на текущую несохранённую редакцию без обхода запрета хранения.'
        correct: true
      - text: 'Положить revision 6 в локальное хранилище незаметно'
        why: 'Техническая возможность не снимает запрет продукта.'
    explanation: 'Управляемая навигация может предложить сохранение, отказ или отмену ухода. Она не даёт абсолютной защиты от завершения процесса. Если локальное хранение запрещено, невозможно обещать восстановление неподтверждённого текста после внезапного закрытия без сети; гарантию нужно честно ограничить.'
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.3 Autosave lifecycle'
    links:
      - 'https://developer.chrome.com/docs/web-platform/page-lifecycle-api'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Window/beforeunload_event'
  - id: 'fsd-a-a3-4-001'
    level: 'middle'
    question: 'Пользователь должен писать без сети, но не требует фиксации каждого промежуточного изменения на сервере. После reconnect допустима проверка и одна отправка итогового текста. Какая минимальная модель достаточна?'
    options:
      - text: 'Долговечный черновик и одна согласованная отправка после reconnect'
        why: 'Требуется сохранить итоговый ввод, а не воспроизвести каждое промежуточное намерение.'
        correct: true
      - text: 'Журнал каждого промежуточного ввода с серверным replay'
        why: 'Он сохраняет данные, но вводит избыточные для минимальной модели операции и протокол.'
      - text: 'Кеш серверной базы, очищаемый при изменении локального текста'
        why: 'Новый offline-ввод не станет долговечной восстанавливаемой копией.'
      - text: 'Сетевой autosave по debounce с черновиком в памяти страницы'
        why: 'Без сети и после refresh такая модель не сохраняет требуемую работу.'
    explanation: 'Черновик хранит восстанавливаемое содержимое, очередь — намерения выполнить команды. Очередь нужна, если важны отдельные действия, их порядок и эффекты. Не следует вводить offline-first синхронизацию там, где достаточно сохранить ввод и явно отправить его позже.'
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.4 Persistence & offline queue'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Storage_API/Storage_quotas_and_eviction_criteria'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API/Using_IndexedDB'
  - id: 'fsd-a-a3-4-002'
    level: 'middle'
    question: 'Приложение обещает «команда принята в локальную очередь» после refresh. Какие данные должны пережить refresh до такого сообщения?'
    options:
      - text: 'Сохранённые тело и ID без контекста аккаунта и зависимостей'
        why: 'Нельзя надёжно восстановить владельца и допустимый порядок отправки после смены сессии.'
      - text: 'Команда с ID, владельцем и зависимостями после durable-записи'
        why: 'Очередь можно восстановить и отправить с той же идентичностью.'
        correct: true
      - text: 'Сохранённая команда с ID, который заменяют при каждом refresh'
        why: 'Содержимое переживёт refresh, но новая идентичность нарушит дедупликацию и выяснение исхода.'
      - text: 'Сохранённое тело команды без устойчивого ID; ID создать при отправке'
        why: 'После потери ответа новый ID не позволит безопасно распознать повтор той же логической попытки.'
    explanation: 'Обещание локального принятия дают после успешной записи необходимых данных, не после запуска асинхронного сохранения. Нужны идентичность операции, входы, владелец и зависимость порядка. Браузерное хранение всё равно ограничено квотой, очисткой и политикой устройства; ошибки записи отражаются в UI.'
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.4 Persistence & offline queue'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Storage_API/Storage_quotas_and_eviction_criteria'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API/Using_IndexedDB'
  - id: 'fsd-a-a3-4-003'
    level: 'senior'
    question: 'В очереди команда B меняет сущность, которую создаёт A. После refresh сеть появилась, A ещё без подтверждения. Что делать?'
    options:
      - text: 'Отправить обе параллельно и принять порядок ответов за порядок эффектов'
        why: 'Сеть не обеспечивает серверное соблюдение зависимости.'
      - text: 'Назначить A новый ID при каждом восстановлении приложения'
        why: 'Повтор перестанет распознаваться как та же логическая операция.'
      - text: 'Отправить B первой, поскольку она новее в очереди'
        why: 'Зависимая сущность ещё не получила подтверждённую идентичность.'
      - text: 'Восстановить зависимости и выяснить исход A до B'
        why: 'Нельзя использовать неподтверждённый серверный ID или повторить создание вслепую.'
        correct: true
    explanation: 'Возобновление начинается с восстановления контекста и состояний попыток. Зависимые команды не обгоняют неподтверждённую базу; неопределённый исход выясняют или повторяют по серверной гарантии. Это ограниченная очередь известных действий, не универсальный протокол многодневного offline merge.'
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.4 Persistence & offline queue'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Storage_API/Storage_quotas_and_eviction_criteria'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API/Using_IndexedDB'
  - id: 'fsd-a-a3-4-004'
    level: 'middle'
    question: 'После reconnect отложенная команда получила постоянный конфликт: объект удалён. Автоматическое восстановление по контракту невозможно. Как поступить?'
    options:
      - text: 'Остановить зависимые команды и предложить решение'
        why: 'Пользователь видит застрявшую работу и варианты вместо скрытого цикла.'
        correct: true
      - text: 'Повторять команду с тем же телом до появления объекта'
        why: 'Постоянная причина не устранится задержкой.'
      - text: 'Создать новый объект без согласия и перепривязать действия'
        why: 'Меняется смысл исходного намерения и возможные права доступа.'
      - text: 'Удалить всю очередь вместе с независимыми командами'
        why: 'Теряется работа, не связанная с конфликтом.'
    explanation: 'Неустранимый конфликт требует явного пути: экспорт допустимых данных, редактирование, отмена или поддержка. Зависимые команды блокируют отдельно от независимых. Для чувствительных данных варианты сохранения ограничены политикой доступа; очередь не должна бесконечно прятать необходимость решения.'
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.4 Persistence & offline queue'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Storage_API/Storage_quotas_and_eviction_criteria'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API/Using_IndexedDB'
  - id: 'fsd-a-a3-5-005'
    level: 'middle'
    question: 'В общем календаре перенос записи сервер отклоняет примерно в 20% случаев из-за занятости. Откат мгновенно перестроенной сетки мешает диспетчеру, который уже использует её для следующих назначений. Неудачный перенос нужно исправлять без повторного ввода. Какой UX выбрать для этой операции?'
    options:
      - text: 'Ждать подтверждения для сетки; показывать статус попытки и сохранять отклонённый ввод'
        why: 'Pessimistic-обновление сетки убирает частые откаты, а отдельный черновик и статус сохраняют работу и объясняют ожидание либо отказ.'
        correct: true
      - text: 'Менять сетку оптимистично; при отказе перезагружать её вместе с формой переноса'
        why: 'Для частых отказов откат останется разрушительным, а перезагрузка формы потеряет введённые параметры вместо возможности их исправить.'
      - text: 'Ждать ответа перед изменением сетки; при отказе сбрасывать форму к данным сервера'
        why: 'Сетка отражает подтверждённое состояние, но сброс формы уничтожает несохранённый перенос. Пессимистический UX не требует потери черновика.'
      - text: 'Менять сетку после локальной проверки; серверный отказ показывать общим уведомлением'
        why: 'Локальная проверка не знает актуальную занятость. Уведомление само по себе не согласует уже показанный перенос с отказом и не даёт ясного пути исправления.'
    explanation: 'Optimistic/pessimistic UI выбирают с учётом частоты отказов и стоимости отката для дальнейшей работы. Здесь выгоднее сохранить подтверждённую сетку до ответа, а предлагаемый перенос держать отдельным черновиком: во время запроса показать ожидание, при известном отказе — причину и возможность исправить сохранённый ввод. Это не требует замораживать всю страницу или скрывать локальное предложение. В другом сценарии с редкими отказами и дешёвым откатом оптимистическое изменение может быть оправдано; само название стратегии не определяет ни сохранность ввода, ни честность статуса.'
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.5 Recovery UX'
    links:
      - 'https://developer.chrome.com/docs/web-platform/page-lifecycle-api'
      - 'https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/retry-backoff.html'
  - id: 'fsd-a-a3-5-002'
    level: 'senior'
    question: 'База формы: имя Ира, телефон 111, язык ru. Локально введены имя Мира и язык en. После сбоя пришла новая база: имя Софья, телефон 222, язык ru. Поля независимы, запись поддерживает проверку версии. Как сохранить ввод и согласовать изменения?'
    options:
      - text: 'Взять телефон 222 и язык en, конфликт имён показать с обеими версиями'
        why: 'Телефон изменён сервером, язык — локально, а имя независимо изменено с обеих сторон.'
        correct: true
      - text: 'Принять все локальные поля и отправить с новой серверной версией'
        why: 'Так телефон откатится к старому, а конфликт имени будет скрыт под свежей версией.'
      - text: 'Принять новую базу целиком и предложить пользователю набрать правки заново'
        why: 'Будут потеряны неконфликтная смена языка и введённое имя.'
      - text: 'Считать любое dirty-поле конфликтом и блокировать всю форму до перезагрузки'
        why: 'Локальный язык не конфликтует, а перезагрузка сама не разрешает разные правки имени.'
    explanation: 'Для согласования сравнивают старую базу, локальный черновик и новую серверную базу. При независимых полях односторонние изменения можно сохранить, а разные изменения одного поля требуют решения. Черновик удерживают до завершения конфликта; после него запись использует актуальную ожидаемую версию. Автоматическое слияние недопустимо, если между полями есть неучтённый инвариант.'
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.5 Recovery UX'
    links:
      - 'https://developer.chrome.com/docs/web-platform/page-lifecycle-api'
      - 'https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/retry-backoff.html'
  - id: 'fsd-a-a3-5-003'
    level: 'middle'
    question: 'После ограниченных повторов сохранение всё ещё невозможно. Как закончить сценарий, не скрывая проблему?'
    options:
      - text: 'Несохранённый ввод, ручной повтор и разрешённый экспорт'
        why: 'Есть видимый статус и контролируемые действия восстановления.'
        correct: true
      - text: 'Экспорт всего введённого в файл без проверки ограничений хранения'
        why: 'Способ сохранения должен соответствовать политике чувствительных данных.'
      - text: 'Общая плашка с повтором и сбросом полей до серверной версии'
        why: 'Повтор остаётся доступен ценой потери несохранённой локальной работы.'
      - text: 'Ручной повтор с параметрами первой попытки без проверки текущего ввода'
        why: 'Пользователь мог изменить поля или аккаунт; восстановление должно использовать актуальный согласованный контекст.'
    explanation: 'У автоматического восстановления должен быть предел и понятный следующий шаг. Доступные варианты зависят от безопасности: экспорт, копирование или локальный черновик могут быть запрещены. Тогда явно сообщают ограничение и предлагают разрешённый путь, не обещая невозможной сохранности.'
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.5 Recovery UX'
    links:
      - 'https://developer.chrome.com/docs/web-platform/page-lifecycle-api'
      - 'https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/retry-backoff.html'
  - id: 'fsd-a-a4-1-001'
    level: 'middle'
    question: 'Статусы сборки передаются текстовыми событиями сервер→браузер с задержкой до секунды; команды редкие и идут обычным HTTP. Прокси допускает потоковые HTTP-ответы, но блокирует смену протокола и туннелирование. Регулярные пустые опросы превышают бюджет. Какой канал выбрать?'
    options:
      - text: 'SSE для статусов, обычный HTTP для пользовательских команд'
        why: 'Односторонний HTTP-поток соответствует направлению и проходит ограничения инфраструктуры.'
        correct: true
      - text: 'WebSocket для статусов и команд поверх отдельного постоянного канала'
        why: 'В этой инфраструктуре необходимое согласование двустороннего канала блокируется прокси.'
      - text: 'Короткий polling раз в секунду с обычными HTTP-командами'
        why: 'Задержка может подойти, но регулярные пустые запросы нарушают бюджет.'
      - text: 'Короткий polling раз в минуту с обычными HTTP-командами'
        why: 'Сеть дешевле, но изменение может быть замечено существенно позже секунды.'
    explanation: 'Транспорт выбирают по направлению, частоте, инфраструктуре и бюджету задержки. SSE удобен для потока сервер→клиент, а команды можно оставить HTTP. WebSocket даёт двусторонний канал, но его выбор не отменяет протокол событий, авторизацию и восстановление.'
    topic: 'A4. Real-time systems'
    subtopic: 'A4.1 Transport choice'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API'
  - id: 'fsd-a-a4-1-002'
    level: 'senior'
    question: 'Панель передаёт до 50 команд в секунду и получает события, бюджет задержки — 100 мс. Инфраструктура допускает постоянный двусторонний обмен; обычный HTTP ограничен пятью запросами в секунду на клиента и не поддерживает batch команд. Какой транспортный план соответствует ограничениям?'
    options:
      - text: 'WebSocket для частых команд и ответных событий приложения'
        why: 'Один двусторонний канал не требует отдельного HTTP-запроса на каждую команду.'
        correct: true
      - text: 'SSE для событий, отдельный POST для каждой команды'
        why: 'Односторонняя доставка подходит, но частота команд превышает лимит обычного HTTP.'
      - text: 'Long polling для событий, отдельный POST для каждой команды'
        why: 'Долгое чтение не меняет ограничение на 50 клиентских отправок в секунду.'
      - text: 'Polling и отправка команд раз в секунду одним пакетом'
        why: 'Для команд нет пакетного контракта, а секундное накопление превышает бюджет задержки.'
    explanation: 'WebSocket полезен для интенсивного двустороннего обмена. Цена — управление соединением, ограничение нагрузки и прикладная семантика сообщений. Если команд мало, HTTP плюс SSE может быть проще; потребность в real-time сама по себе не делает WebSocket обязательным.'
    topic: 'A4. Real-time systems'
    subtopic: 'A4.1 Transport choice'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API'
  - id: 'fsd-a-a4-1-003'
    level: 'middle'
    question: 'Мониторинг обновляется раз в несколько минут, допустима задержка 60 секунд. Разрешены только короткие запросы-ответы; удержание запроса и streaming запрещены. Какой базовый вариант обоснован?'
    options:
      - text: 'Polling с периодом, оставляющим запас на сетевую задержку'
        why: 'Требуемая свежесть достижима обычными короткими чтениями.'
        correct: true
      - text: 'SSE с повторным открытием после каждого обрыва прокси'
        why: 'Повторное открытие не превращает запрещённый streaming в обычное короткое чтение.'
      - text: 'Таймер ровно в минуту с обещанием строгих 60 секунд'
        why: 'К периоду добавятся задержка запроса и возможное планирование таймера.'
      - text: 'Long polling с удержанием запроса без ограничения времени'
        why: 'Это противоречит запрету долгих соединений.'
    explanation: 'Polling может быть достаточным при широком бюджете свежести. Long polling держит запрос до изменения или таймаута, затем клиент повторяет его, уменьшая холостые ответы ценой долгих запросов. Период и задержку чтения оценивают вместе; в background таймер не является жёстким расписанием.'
    topic: 'A4. Real-time systems'
    subtopic: 'A4.1 Transport choice'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API'
  - id: 'fsd-a-a4-1-004'
    level: 'middle'
    question: 'Постоянный канал заблокирован корпоративной сетью. Продукт допускает деградацию свежести с секунды до 30 секунд и API даёт snapshot. Какой fallback выбрать?'
    options:
      - text: 'Получить snapshot один раз и не обновлять до ручной навигации'
        why: 'Одно чтение восстановит базу, но без новых триггеров нарушит 30-секундный бюджет активной страницы.'
      - text: 'Показывать прежние данные как real-time до возврата канала'
        why: 'Пользователь получит ложное обещание актуальности.'
      - text: 'Быстро переподключать заблокированный канал без остановки'
        why: 'Это создаёт нагрузку, не меняя причину недоступности.'
      - text: 'Ограниченный polling snapshot с видимым режимом деградации'
        why: 'Сохраняется полезный сценарий в согласованном более слабом бюджете.'
        correct: true
    explanation: 'Fallback заранее связывают с более слабыми допустимыми гарантиями. Канал и резервный опрос не должны одновременно бесконтрольно дублировать работу. Если даже деградированный бюджет не выдержан, UI сообщает потерю актуальности и ограничивает зависящие от неё действия.'
    topic: 'A4. Real-time systems'
    subtopic: 'A4.1 Transport choice'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API'
  - id: 'fsd-a-a4-1-005'
    level: 'middle'
    question: 'Изменения редкие, доставлять их нужно быстро. Частый polling превышает бюджет пустых запросов. Streaming и upgrade отсутствуют, но сервер умеет держать GET до изменения или 25-секундного таймаута; прокси это разрешает. Что выбрать?'
    options:
      - text: 'Короткий polling с той же частотой, что и требуемая доставка'
        why: 'Задержка может подойти, но условие прямо ограничивает стоимость пустых запросов.'
      - text: 'Long polling с возобновлением запроса после ответа или таймаута'
        correct: true
        why: 'Готовый контракт ждёт событие без частых пустых коротких чтений; после ответа клиент снова подписывается запросом.'
      - text: 'Редкий polling раз в минуту для уменьшения числа обращений'
        why: 'Сеть станет дешевле, но требование быстрой доставки изменений не будет выполнено.'
      - text: 'Один удерживаемый GET без нового запроса после ответа'
        why: 'Long-poll ответ завершает ожидание, поэтому для следующего изменения нужен новый запрос.'
    explanation: 'Long polling удерживает чтение до события или таймаута, затем клиент возобновляет его. При редких изменениях он сокращает пустые ответы по сравнению с частым polling, но занимает серверные ресурсы ожидания и имеет накладные расходы переподключения. Нужны согласованные таймауты прокси, позиция продолжения и ограниченный retry; отсутствие streaming не исключает такой контракт.'
    topic: 'A4. Real-time systems'
    subtopic: 'A4.1 Transport choice'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API'
  - id: 'fsd-a-a4-2-005'
    level: 'senior'
    question: 'После разрыва стоит таймер reconnect. До его срабатывания пришли online и focus, оба вызывают connect. Нужно не более одного активного соединения и не более одной попытки подключения. Как организовать lifecycle?'
    options:
      - text: 'Общий координатор попытки и таймера с переходами по триггерам'
        why: 'Переход проверяет активную попытку и не запускает параллельные каналы.'
        correct: true
      - text: 'Свой цикл connect и таймер для каждого источника события'
        why: 'Независимые циклы могут одновременно открыть несколько подписок.'
      - text: 'Каждый успешный handshake оставлять активным до закрытия страницы'
        why: 'Дублирующие каналы сохранятся и будут повторно доставлять события.'
      - text: 'Отменять последний созданный таймер после любого focus'
        why: 'Ранее запущенные попытки и другие таймеры останутся вне общего управления.'
    explanation: 'Соединением владеет один lifecycle-координатор, а online, focus и таймер являются входными событиями. Переходы учитывают подключение in-flight, поколение канала, закрытие и остановку. Поздний результат прежней попытки не создаёт новый активный канал. Backoff регулирует частоту попыток, но сам не обеспечивает единственного владельца и отсутствие параллельных подписок.'
    topic: 'A4. Real-time systems'
    subtopic: 'A4.2 Connection lifecycle'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events'
      - 'https://developer.chrome.com/docs/web-platform/page-lifecycle-api'
  - id: 'fsd-a-a4-2-002'
    level: 'middle'
    question: 'WebSocket снова открыт, но за минуту разрыва сервер менял данные, replay ещё не выполнен. Какой статус корректен?'
    options:
      - text: 'Канал подключён; восстанавливается состояние данных'
        why: 'Handshake восстановил транспорт, но не доставил пропущенное состояние.'
        correct: true
      - text: 'Данные обновлены сейчас по времени успешного handshake'
        why: 'Время подключения не является временем актуальной базы данных.'
      - text: 'История подтверждена, поскольку reconnect завершился без ошибки'
        why: 'Успех канала не подтверждает полноту истории или пользовательские записи.'
      - text: 'Ошибка данных, поскольку replay ещё не закончен'
        why: 'Штатное восстановление является ожиданием, а не доказанным отказом синхронизации.'
    explanation: 'Connection state и data readiness — независимые оси. UI может иметь подключённый транспорт и неполные данные либо пригодный snapshot при временно недоступном потоке. Статусы определяют, какие действия допустимы до окончания replay или refetch.'
    topic: 'A4. Real-time systems'
    subtopic: 'A4.2 Connection lifecycle'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events'
      - 'https://developer.chrome.com/docs/web-platform/page-lifecycle-api'
  - id: 'fsd-a-a4-2-003'
    level: 'middle'
    question: 'Во время открытого канала пользователь сменил аккаунт, затем пришло событие старой сессии. Как обработать переход?'
    options:
      - text: 'Сохранить старый канал, заменив только подпись пользователя'
        why: 'Авторизация и поток остаются в прежней области.'
      - text: 'Принять событие, если оно пришло после нового входа'
        why: 'Время доставки не меняет область прав события.'
      - text: 'Сменить контекст подписки, отсечь события прежней сессии'
        why: 'Поздняя доставка не должна заполнять данные нового аккаунта.'
        correct: true
      - text: 'Очистить экран, но разрешить старым событиям обновлять кеш'
        why: 'Приватные данные могут снова появиться после очистки.'
    explanation: 'Auth/session — часть идентичности подписки и контекста событий. Переподключение после смены прав следует серверному протоколу, а обработчик дополнительно проверяет поколение сессии. Нельзя считать старую открытую связь авторизацией на весь срок её жизни.'
    topic: 'A4. Real-time systems'
    subtopic: 'A4.2 Connection lifecycle'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events'
      - 'https://developer.chrome.com/docs/web-platform/page-lifecycle-api'
  - id: 'fsd-a-a4-2-004'
    level: 'middle'
    question: 'Страница была скрыта и могла быть заморожена. После возврата соединение выглядит открытым, но возраст данных не проверен. Что делать?'
    options:
      - text: 'Считать непрерывность доказанной по прежнему readyState'
        why: 'Старый флаг не доказывает доставку всех необходимых данных.'
      - text: 'Перезапускать подписку каждую секунду независимо от состояния'
        why: 'Это добавляет соединения без протокола проверки gap.'
      - text: 'Воспроизвести пропуски из таймеров, сработавших в фоне'
        why: 'Таймеры могут ограничиваться и не содержат событий сервера.'
      - text: 'Проверить непрерывную позицию и восстановить данные при gap'
        why: 'Browser lifecycle мог нарушить приём или обработку событий.'
        correct: true
    explanation: 'Background не равен закрытию и не гарантирует непрерывную работу. После resume проверяют жизнеспособность канала и контрольную позицию данных; при неизвестной полноте восстанавливаются по серверному контракту. Сохранение позиции заранее полезнее ожидания гарантированного события завершения, которого нет.'
    topic: 'A4. Real-time systems'
    subtopic: 'A4.2 Connection lifecycle'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events'
      - 'https://developer.chrome.com/docs/web-platform/page-lifecycle-api'
  - id: 'fsd-a-a4-3-001'
    level: 'middle'
    question: 'Поток доставляет событие «увеличить счётчик» как минимум один раз; есть устойчивый eventId. После reconnect одно событие пришло повторно. Что требуется?'
    options:
      - text: 'Сравнивать только время получения в браузере'
        why: 'Повтор имеет новое время получения, но ту же идентичность.'
      - text: 'Применять каждый доставленный пакет как новое событие'
        why: 'Счётчик увеличится дважды для одного эффекта.'
      - text: 'Применять эффект каждого eventId однократно'
        why: 'Дедупликация защищает неидемпотентное приращение от повторной доставки.'
        correct: true
      - text: 'Удалять eventId после рендера текущего кадра'
        why: 'Повтор через reconnect может прийти гораздо позже.'
    explanation: 'At-least-once допускает повторы. Для приращений нужен учёт применённых событий или эквивалентный протокол последовательности. Scope и срок дедупликации согласуют с replay-окном; переход на snapshot должен задавать соответствующую базу и границу обработанных событий.'
    topic: 'A4. Real-time systems'
    subtopic: 'A4.3 Event processing'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events'
      - 'https://www.rfc-editor.org/rfc/rfc6455'
  - id: 'fsd-a-a4-3-002'
    level: 'middle'
    question: 'У событий есть случайный уникальный UUID, но нет версий или общего порядка. Можно ли по сравнению UUID определить, какое изменение сущности новее?'
    options:
      - text: 'Нет, ID различает повторы, порядок нужен отдельно'
        why: 'Уникальность не задаёт причинность или последовательность.'
        correct: true
      - text: 'Да, если событие позже пришло после reconnect'
        why: 'Доставка может повторяться и переставляться по прикладному протоколу.'
      - text: 'Да, лексикографически больший UUID обозначает новое состояние'
        why: 'Случайный UUID не несёт обещанного временного порядка.'
      - text: 'Нет, поэтому нужно отказаться и от дедупликации по UUID'
        why: 'Для распознавания повторов уникальная идентичность всё ещё полезна.'
    explanation: 'Event ID, версия сущности и позиция потока решают разные задачи. У конкретного источника один маркер может выполнять несколько ролей, но это нужно явно обещать. Нельзя сравнивать позиции разных потоков или случайные ID как глобальные версии. UUIDv7 содержит временную компоненту, но порядок по времени генератора не становится авторитетной версией сущности или причинным порядком событий разных источников.'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events'
      - 'https://www.rfc-editor.org/rfc/rfc6455'
      - 'https://www.rfc-editor.org/rfc/rfc9562.html'
    topic: 'A4. Real-time systems'
    subtopic: 'A4.3 Event processing'
  - id: 'fsd-a-a4-3-003'
    level: 'middle'
    question: 'Сервер подтвердил приём пакета сообщения транспортным ack. Контракт не обещает, что этот ack означает запись в БД или чтение адресатом. Как показать статус?'
    options:
      - text: 'Пакет принят транспортом; бизнес-подтверждения ещё ожидаются'
        why: 'Статус ограничен реально обещанным смыслом полученного ack.'
        correct: true
      - text: 'Сообщение сохранено сервером после приёма его транспортом'
        why: 'Приём пакета не обещает долговечную фиксацию приложения.'
      - text: 'Сообщение доставлено устройству адресата после серверного ack'
        why: 'Подтверждение сервера не доказывает доставку конкретному получателю.'
      - text: 'Сообщение прочитано после доставки ack обратно отправителю'
        why: 'Квитанция отправителю не является действием адресата или read-подтверждением.'
    explanation: 'Подтверждения именуют по их смыслу: получено транспортом, принято приложением, сохранено, доставлено устройству, прочитано по продуктовой семантике. Название ack само по себе ничего не говорит о долговечности. Интерфейс не должен повышать гарантию без нового события.'
    topic: 'A4. Real-time systems'
    subtopic: 'A4.3 Event processing'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events'
      - 'https://www.rfc-editor.org/rfc/rfc6455'
  - id: 'fsd-a-a4-3-004'
    level: 'middle'
    question: 'В одном упорядоченном потоке ожидается seq=42, но получено 44. Сервер обещает непрерывный seq и replay. Как обработать это?'
    options:
      - text: 'Сравнить seq с последним событием другого канала'
        why: 'Позиции разных потоков не обязаны быть сопоставимы.'
      - text: 'Запросить replay пропуска до применения зависимого события'
        why: 'Пропущенные изменения могут влиять на смысл события 44.'
        correct: true
      - text: 'Применить 44 и сохранить его как полностью обработанную границу'
        why: 'Позиции 42–43 будут молча признаны пройденными.'
      - text: 'Удалить 44 как дубль из-за большого значения seq'
        why: 'Большая позиция означает пропуск, а не доказанный повтор.'
    explanation: 'Непрерывная последовательность позволяет обнаруживать gap только в пределах обещанного scope. После пропуска возможны буферизация и replay либо переход на новый snapshot. Произвольное продвижение watermark рискует навсегда скрыть пропущенный эффект.'
    topic: 'A4. Real-time systems'
    subtopic: 'A4.3 Event processing'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events'
      - 'https://www.rfc-editor.org/rfc/rfc6455'
  - id: 'fsd-a-a4-4-001'
    level: 'senior'
    question: 'Snapshot включает состояние до seq=100; API гарантирует replay всех событий после переданной позиции. Как закрыть окно до подписки?'
    options:
      - text: 'Установить snapshot до 100 и открыть replay событий после 100'
        why: 'Общая граница включает изменения, произошедшие до фактического подключения.'
        correct: true
      - text: 'Установить snapshot, затем подписаться с текущего конца журнала'
        why: 'Изменения между снимком и подпиской окажутся позади выбранной позиции.'
      - text: 'Использовать время получения snapshot как позицию подписки'
        why: 'Клиентское время не совпадает с договорной серверной границей seq.'
      - text: 'Начать replay с 101, не устанавливая данные snapshot'
        why: 'Инкрементам нужна база до 100, иначе результат не содержит исходного состояния.'
    explanation: 'Snapshot и поток должны иметь общую границу. Серверный watermark с replay после него закрывает гонку начального чтения. Альтернатива — сначала подписаться и буферизовать, затем согласовать события с версией снимка; без контракта границ произвольное объединение не доказывает полноту.'
    topic: 'A4. Real-time systems'
    subtopic: 'A4.4 Snapshot & resync'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events'
      - 'https://www.elastic.co/docs/reference/elasticsearch/rest-apis/paginate-search-results'
      - 'https://etcd.io/docs/v3.6/learning/api_guarantees/'
  - id: 'fsd-a-a4-4-002'
    level: 'senior'
    question: 'Сначала открывают подписку и буферизуют события, затем получают snapshot версии V. Как слить буфер при наличии сопоставимых серверных версий?'
    options:
      - text: 'Из буфера применить по порядку только события после снимка'
        why: 'Снимок и инкременты согласуются по известной границе.'
        correct: true
      - text: 'Применить события в порядке сетевой доставки без проверки'
        why: 'Порядок и включённость в базу могут отличаться от доставки.'
      - text: 'Применить все накопленные приращения поверх снимка'
        why: 'Часть эффектов может уже входить в snapshot и удвоиться.'
      - text: 'Очистить весь буфер после показа snapshot независимо от версий'
        why: 'В буфере могут находиться изменения, произошедшие после снимка.'
    explanation: 'Буферизация сама не закрывает gap: нужно знать, какие эффекты включены в снимок. Версия или watermark позволяет не пропустить и не удвоить изменение. Размер буфера ограничивают; переполнение требует повторной синхронизации, а не скрытого удаления событий.'
    multiple: true
    topic: 'A4. Real-time systems'
    subtopic: 'A4.4 Snapshot & resync'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events'
      - 'https://www.elastic.co/docs/reference/elasticsearch/rest-apis/paginate-search-results'
      - 'https://etcd.io/docs/v3.6/learning/api_guarantees/'
  - id: 'fsd-a-a4-4-003'
    level: 'middle'
    question: 'После reconnect сохранённый cursor вышел за срок хранения журнала. Сервер отвечает «replay недоступен». Что делать?'
    options:
      - text: 'Продолжить поток с текущего момента поверх старой базы'
        why: 'Неизвестные пропуски сохранят расхождение.'
      - text: 'Новый snapshot с новой точкой продолжения'
        why: 'Старая история недоступна, поэтому требуется новая полная база.'
        correct: true
      - text: 'Продвинуть cursor вручную, оставив прежнее состояние'
        why: 'Маркер будет утверждать применение неизвестных событий.'
      - text: 'Повторять тот же cursor без предела'
        why: 'Срок хранения от ожидания не восстановится.'
    explanation: 'Replay подходит для доступного непрерывного диапазона. При истечении журнала или недоказанной целостности нужен refetch соответствующего ресурса либо полный resync. Масштаб восстановления выбирают по известной области повреждения, сохраняя локальный ввод отдельно от серверной базы.'
    topic: 'A4. Real-time systems'
    subtopic: 'A4.4 Snapshot & resync'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events'
      - 'https://www.elastic.co/docs/reference/elasticsearch/rest-apis/paginate-search-results'
      - 'https://etcd.io/docs/v3.6/learning/api_guarantees/'
  - id: 'fsd-a-a4-4-004'
    level: 'senior'
    question: 'Потерялось событие, изменяющее только содержимое одной карточки: порядок, фильтры и агрегаты не затронуты. API возвращает её полную версию и границу для согласования дальнейшего потока карточки. Нужен ли полный resync приложения?'
    options:
      - text: 'Восстановить полную карточку и согласовать буфер по серверной границе'
        why: 'Область повреждения известна, а API даёт полную базу и продолжение.'
        correct: true
      - text: 'Перечитать карточку и применить накопленные приращения подряд'
        why: 'Часть приращений могла уже войти в снимок и будет учтена повторно.'
      - text: 'Продвинуть позицию карточки до последнего события из буфера'
        why: 'Изменение маркера не восстанавливает пропущенный эффект в содержимом.'
      - text: 'Перезапустить поток карточки с текущего конца журнала'
        why: 'Будущие события не обязаны восстановить уже пропущенные поля.'
    explanation: 'Resync не обязан всегда быть глобальным. Если событие могло изменить членство, порядок или агрегаты, область шире детали и нужно восстановить зависимости. Для известной локальной карточки полный ответ с границей может быть дешевле replay или очистки приложения.'
    topic: 'A4. Real-time systems'
    subtopic: 'A4.4 Snapshot & resync'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events'
      - 'https://www.elastic.co/docs/reference/elasticsearch/rest-apis/paginate-search-results'
      - 'https://etcd.io/docs/v3.6/learning/api_guarantees/'
  - id: 'fsd-a-a4-5-001'
    level: 'middle'
    question: 'Чат показывает временное сообщение tmp-7; сервер прислал событие с ID=91 и clientMessageId=tmp-7 раньше ответа отправки. Что делать?'
    options:
      - text: 'Согласовать echo и временную строку по clientMessageId'
        why: 'Событие и ответ относятся к одному намерению и не должны создать две строки.'
        correct: true
      - text: 'Добавить серверное сообщение рядом с временным как новое'
        why: 'Пользователь увидит дубликат одной отправки.'
      - text: 'Удалить временное и ждать ответа, игнорируя событие'
        why: 'Полезное подтверждённое сообщение исчезнет до другого транспорта.'
      - text: 'Сопоставлять только по тексту сообщения и минуте отправки'
        why: 'Две одинаковые отправки могут быть разными намерениями.'
    explanation: 'Optimistic sending требует корреляции временного и серверного ID. Серверный echo может прийти раньше HTTP-ответа; согласование должно быть идемпотентным для обоих путей. Текст и время недостаточны для надёжной идентичности попытки.'
    topic: 'A4. Real-time systems'
    subtopic: 'A4.5 Real-time UX'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events'
  - id: 'fsd-a-a4-5-002'
    level: 'middle'
    question: 'Пользователь закрыл ноутбук без события ухода. Presence и typing были активны, а read подтверждено отдельной командой. Как моделировать?'
    options:
      - text: 'Хранить typing до обязательного события stop от клиента'
        why: 'Финальное событие может не прийти при потере связи.'
      - text: 'Снимать read при каждом истечении presence'
        why: 'Присутствие сейчас не отменяет ранее совершённое чтение.'
      - text: 'Presence/typing ограничивать сроком, read хранить по его контракту'
        why: 'Эфемерные сигналы и зафиксированное действие имеют разные гарантии.'
        correct: true
      - text: 'Считать presence доказательством доставки каждого сообщения'
        why: 'Факт соединения не подтверждает получение конкретного содержимого.'
    explanation: 'Presence и typing обычно являются временными оценками с timeout, а delivered/read относятся к конкретным сообщениям и действиям по продуктовой семантике. Потеря соединения может оставлять фантомное присутствие до истечения срока. Нельзя выводить прочтение из открытия канала.'
    topic: 'A4. Real-time systems'
    subtopic: 'A4.5 Real-time UX'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events'
  - id: 'fsd-a-a4-5-003'
    level: 'middle'
    question: 'Рынок присылает 1000 обновлений котировок в секунду, экран нужен человеку и должен показывать последнее значение каждого инструмента. Промежуточные значения в UI не обязательны. Как снизить работу?'
    options:
      - text: 'Случайно отбрасывать события до декодирования их типа'
        why: 'Можно потерять последнее значение или значимое управляющее событие.'
      - text: 'Коалесцировать по инструменту, показывать пакетами'
        why: 'Избыточные промежуточные перерисовки заменяются актуальным состоянием.'
        correct: true
      - text: 'Объединять все инструменты в одно последнее сообщение'
        why: 'Обновление одного инструмента вытеснит данные остальных.'
      - text: 'Показывать каждый пакет отдельным синхронным рендером'
        why: 'UI расходует время на промежуточные состояния без пользовательской пользы.'
    explanation: 'Частота получения и частота показа могут различаться. Коалесцирование допустимо для заменяемого состояния, если сохранено последнее значение каждого ключа и бюджет задержки. Необратимые команды, приращения и история сообщений требуют другой семантики, а не произвольного отбрасывания.'
    topic: 'A4. Real-time systems'
    subtopic: 'A4.5 Real-time UX'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events'
  - id: 'fsd-a-a4-5-004'
    level: 'senior'
    question: 'В одном канале идут typing и новые сообщения чата. При перегрузке нужно уменьшить UI-работу, сохранив каждое сообщение. Что выбрать?'
    options:
      - text: 'Коалесцировать typing, сообщения пакетно добавлять без потерь'
        why: 'Типы событий имеют разные требования к сохранению промежуточных элементов.'
        correct: true
      - text: 'Для каждого типа оставить только последнее событие за секунду'
        why: 'Часть самостоятельных сообщений исчезнет.'
      - text: 'Debounce всего смешанного канала с сохранением последнего события'
        why: 'Это потеряет самостоятельные сообщения, хотя допустимо для заменяемого typing-состояния.'
      - text: 'При переполнении удалять самые старые сообщения до обработки'
        why: 'Нарушится требование сохранить каждый элемент истории.'
    explanation: 'Batching группирует применение, coalescing заменяет промежуточные состояния. Первое может сохранять все сообщения, второе допустимо только для заменяемой информации. При росте буфера нужны ограничения, контроль отставания и восстановление; ограничение памяти не оправдывает молчаливую потерю обязательных событий.'
    topic: 'A4. Real-time systems'
    subtopic: 'A4.5 Real-time UX'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events'
  - id: 'fsd-a-a5-1-001'
    level: 'middle'
    question: 'Таблица получает 50k строк: передача 8 секунд, разбор 1 секунду, создание DOM 100 мс. Сначала нужно увидеть 50 строк. Что адресует главный bottleneck?'
    options:
      - text: 'Виртуализация уже полученных 50k строк без изменения API'
        why: 'DOM и так не определяет основные восемь секунд передачи.'
      - text: 'Перенос разбора JSON в worker при прежнем размере ответа'
        why: 'Разбор можно разгрузить, но основная передача останется.'
      - text: 'Мемоизация строк при первом открытии полного набора'
        why: 'Повторные рендеры не являются указанной причиной холодной задержки.'
      - text: 'Частичная передача нужной страницы с серверной фильтрацией'
        why: 'Сокращается измеренный доминирующий сетевой путь.'
        correct: true
    explanation: 'Передача, память, вычисления и DOM имеют разные пределы. Оптимизация полезна, если меняет измеренную доминирующую фазу. Виртуализация уменьшает видимое дерево, но не размер полного ответа; частичная загрузка требует API для нужного фильтра и порядка.'
    topic: 'A5. UI at scale'
    subtopic: 'A5.1 Large datasets & partitioning'
    links:
      - 'https://web.dev/articles/virtualize-long-lists-react-window'
      - 'https://tanstack.com/table/v8/docs/guide/row-selection'
  - id: 'fsd-a-a5-1-002'
    level: 'middle'
    question: 'Отчёт содержит 300 малых строк, целиком укладывается в бюджет устройства; пользователь мгновенно перебирает локальные фильтры без строгой свежести. Какой вариант оправдан?'
    options:
      - text: 'Загрузить набор и фильтровать локально по согласованному бюджету'
        why: 'Объём мал, а интерактивность не требует сети на каждый шаг.'
        correct: true
      - text: 'Считать локальную копию вечной серверной истиной после загрузки'
        why: 'Допустимая стратегия вычисления не отменяет политику свежести.'
      - text: 'Отправлять каждый ввод фильтра отдельным серверным запросом'
        why: 'Это возможно, но добавляет задержку без заданной нужды в серверном масштабе.'
      - text: 'Читать по 20 строк, фильтровать только полученную страницу'
        why: 'Локальный фильтр увидит только загруженную порцию и даст неполный результат для всего отчёта.'
    explanation: 'Клиентская обработка оправдана для ограниченного набора и подходящего UX. При больших данных, ограниченном устройстве или необходимости искать по полной серверной коллекции фильтрация переносится к источнику. Решение проверяют на целевом объёме и классе устройств, а не по одному числу строк.'
    topic: 'A5. UI at scale'
    subtopic: 'A5.1 Large datasets & partitioning'
    links:
      - 'https://web.dev/articles/virtualize-long-lists-react-window'
      - 'https://tanstack.com/table/v8/docs/guide/row-selection'
  - id: 'fsd-a-a5-1-003'
    level: 'middle'
    question: 'На клиенте загружены 100 из миллиона продаж; нужно показать сумму всех подходящих продаж, а не этой страницы. Что требуется?'
    options:
      - text: 'Получить серверный агрегат по полному фильтру и контексту доступа'
        why: 'Источник может вычислить итог всей выборки, а не локальной порции.'
        correct: true
      - text: 'Сложить суммы загруженных страниц и показать их как общий итог'
        why: 'Незагруженная часть коллекции остаётся вне суммы.'
      - text: 'Умножить среднюю сумму текущей страницы на серверный total'
        why: 'Без модели распределения такая оценка не является требуемой точной суммой.'
      - text: 'Запросить общий итог по организации, фильтр применить лишь к строкам'
        why: 'Итог и показанный результат будут относиться к разным наборам.'
    explanation: 'Агрегат должен относиться к той же полной выборке, что и пользовательское требование. Если источник считает его отдельно от страниц, нужно определить фильтр, права и при необходимости общий снимок. Виртуализация и пагинация меняют доступную клиенту часть, не смысл общего результата.'
    topic: 'A5. UI at scale'
    subtopic: 'A5.1 Large datasets & partitioning'
    links:
      - 'https://web.dev/articles/virtualize-long-lists-react-window'
      - 'https://tanstack.com/table/v8/docs/guide/row-selection'
  - id: 'fsd-a-a5-1-004'
    level: 'middle'
    question: 'Бюджет кеша страниц — 24 МБ, каждая страница занимает 2 МБ. Три активные страницы должны оставаться; неактивные разрешено перечитать. Как ограничить удержание при долгой прокрутке?'
    options:
      - text: 'Три активные плюс до девяти неактивных страниц по LRU'
        why: 'Максимум двенадцать страниц укладывается в заданный бюджет и сохраняет необходимые активные данные.'
        correct: true
      - text: 'Держать двенадцать неактивных дополнительно к активным'
        why: 'Суммарно получится пятнадцать страниц и 30 МБ вместо 24.'
      - text: 'Задать TTL десять минут без ограничения числа загруженных страниц'
        why: 'За этот интервал может накопиться больше страниц, чем вмещает бюджет.'
      - text: 'Ограничить число DOM-строк, оставив данные страниц в кеше'
        why: 'Виртуальное окно не ограничивает память удерживаемых объектов данных.'
    explanation: 'Частичная загрузка не ограничивает накопление кеша. Для заданного бюджета нужен предел удерживаемых страниц или байтов и политика выбора жертв, например LRU среди неактивных. TTL отвечает за время, а не за максимальный объём при интенсивной загрузке. При переменных размерах учитывают реальные байты, а активность и возможность повторного чтения задают допустимость eviction.'
    topic: 'A5. UI at scale'
    subtopic: 'A5.1 Large datasets & partitioning'
    links:
      - 'https://web.dev/articles/virtualize-long-lists-react-window'
      - 'https://tanstack.com/table/v8/docs/guide/row-selection'
  - id: 'fsd-a-a5-2-001'
    level: 'middle'
    question: '50k строк уже получены; 90% задержки взаимодействия создаёт большое DOM-дерево. Показывать одновременно все строки не требуется. Что выбрать первым?'
    options:
      - text: 'Увеличить TTL ответа, сохранив то же дерево элементов'
        why: 'Возраст данных не ограничивает стоимость DOM.'
      - text: 'Виртуализировать строки с контролем фокуса и размеров'
        why: 'Уменьшается именно измеренный объём DOM.'
        correct: true
      - text: 'Перенести сортировку в worker, оставив все строки в DOM'
        why: 'Это адресует вычисления, но не указанную доминирующую работу.'
      - text: 'Ввести ещё один сетевой кеш без изменения отрисовки'
        why: 'Сеть не является текущим bottleneck.'
    explanation: 'Виртуализация сохраняет небольшое окно элементов вместо дерева всех строк. Она полезна при высокой цене отрисовки, но добавляет измерения, позиционирование и доступность. Если тормозит сервер или передача, один виртуальный список проблему не решит.'
    topic: 'A5. UI at scale'
    subtopic: 'A5.2 Virtualization strategy'
    links:
      - 'https://web.dev/articles/virtualize-long-lists-react-window'
      - 'https://www.w3.org/WAI/ARIA/apg/patterns/grid/'
  - id: 'fsd-a-a5-2-002'
    level: 'senior'
    question: 'Высота строк меняется после раскрытия текста. При возврате пользователь должен видеть ту же запись и место в ней. Как восстановить прокрутку?'
    options:
      - text: 'Восстановить ID-якорь и смещение после измерения изменившихся высот'
        why: 'Геометрия обновляется, а позиция остаётся связана с нужным содержимым.'
        correct: true
      - text: 'Восстановить scrollTop из кеша до проверки новых размеров строк'
        why: 'Старое число пикселей может попасть на другую запись.'
      - text: 'Оценить позиции по средней высоте, не корректируя видимую область'
        why: 'При разных раскрытых блоках ошибка накапливается и меняет якорь.'
      - text: 'Сохранить кеш прежних высот после раскрытия текста'
        why: 'Измерения перестают описывать текущую геометрию.'
    explanation: 'Для динамических размеров нужен кеш измерений и политика его обновления. Overscan сглаживает появление краёв при прокрутке, увеличивая работу и память, но не заменяет измерение. Восстановление по якорю устойчивее пикселя при изменении размеров и должно учитывать доступность строки.'
    topic: 'A5. UI at scale'
    subtopic: 'A5.2 Virtualization strategy'
    links:
      - 'https://web.dev/articles/virtualize-long-lists-react-window'
      - 'https://www.w3.org/WAI/ARIA/apg/patterns/grid/'
  - id: 'fsd-a-a5-2-003'
    level: 'senior'
    question: 'В интерактивной ячейке открыт редактор; прокрутка может размонтировать строку. Ввод и логический фокус должны сохраниться. Как организовать состояние?'
    options:
      - text: 'Хранить весь ввод только внутри переиспользуемой DOM-строки'
        why: 'При размонтировании или смене записи локальная работа может исчезнуть или перепутаться.'
      - text: 'Вынести редакцию по ID из окна и определить политику фокуса'
        why: 'Жизнь данных не зависит от наличия строки в DOM.'
        correct: true
      - text: 'Использовать индекс окна как постоянную идентичность редактора'
        why: 'После прокрутки тот же индекс относится к другой записи.'
      - text: 'Удерживать невидимый активный input без доступного способа возврата'
        why: 'Фокус окажется вне понятной пользователю структуры навигации.'
    explanation: 'Виртуальное окно не должно владеть долгоживущей редакцией. Состояние связывают со стабильным ID; активную строку можно временно удержать либо явно завершить редактирование и восстановить фокус по правилам. Политику проверяют клавиатурой и скринридером, не только мышью.'
    topic: 'A5. UI at scale'
    subtopic: 'A5.2 Virtualization strategy'
    links:
      - 'https://web.dev/articles/virtualize-long-lists-react-window'
      - 'https://www.w3.org/WAI/ARIA/apg/patterns/grid/'
  - id: 'fsd-a-a5-2-004'
    level: 'senior'
    question: 'Таблица содержит sticky-колонки, объединённые ячейки, переменную высоту и клавиатурный grid. Что учесть перед выбором виртуализатора?'
    options:
      - text: 'Считать количество DOM-узлов единственным критерием качества'
        why: 'Удобство редактирования и семантика таблицы тоже являются требованиями.'
      - text: 'Проверить поддерживаемую геометрию и модель доступной навигации'
        why: 'Не каждый механизм окна поддерживает нужные взаимосвязи ячеек.'
        correct: true
      - text: 'Добавить роль grid после внедрения без изменения поведения'
        why: 'ARIA-роль не реализует клавиатурный контракт автоматически.'
      - text: 'Выбрать по демо простого списка с фиксированной высотой'
        why: 'Оно не доказывает работу объединений, sticky и фокуса.'
    explanation: 'Сложная таблица может требовать согласования двух осей, высот и закреплённых областей. Виртуализация усложняет нативный поиск, чтение скринридером и управление фокусом. Иногда ограниченная пагинация с обычной таблицей лучше соответствует требованиям, чем универсальное окно.'
    topic: 'A5. UI at scale'
    subtopic: 'A5.2 Virtualization strategy'
    links:
      - 'https://web.dev/articles/virtualize-long-lists-react-window'
      - 'https://www.w3.org/WAI/ARIA/apg/patterns/grid/'
  - id: 'fsd-a-a5-2-005'
    level: 'middle'
    question: 'На целевом устройстве проверены overscan 2/6/12/20: пустые края в 8%/0,8%/0,3%/0,1% прокруток, p95 ввода 110/135/175/210 мс. Нужны края менее 1% и p95 не выше 150 мс. Какую проверенную настройку выбрать?'
    options:
      - text: 'Overscan 6: края 0,8%, p95 ввода 135 мс'
        why: 'Эта конфигурация проходит оба бюджета без избыточного запаса строк.'
        correct: true
      - text: 'Overscan 2: края 8%, p95 ввода 110 мс'
        why: 'Самый быстрый ввод не компенсирует нарушение бюджета пустых краёв.'
      - text: 'Overscan 12: края 0,3%, p95 ввода 175 мс'
        why: 'Запас строк уменьшает края, но уже нарушает допустимую задержку ввода.'
      - text: 'Overscan 20: края 0,1%, p95 ввода 210 мс'
        why: 'Минимум пустых краёв достигается ценой неприемлемой интерактивности.'
    explanation: 'Overscan готовит строки за видимым окном и уменьшает риск пустых краёв, увеличивая работу. Выбор определяется совместным бюджетом, а не максимумом плавности или минимумом DOM по отдельности. Здесь из измеренных конфигураций требованиям соответствует 6. Числа относятся к этому устройству и сценарию; при другом объёме и высотах проверку повторяют.'
    topic: 'A5. UI at scale'
    subtopic: 'A5.2 Virtualization strategy'
    links:
      - 'https://web.dev/articles/virtualize-long-lists-react-window'
      - 'https://www.w3.org/WAI/ARIA/apg/patterns/grid/'
  - id: 'fsd-a-a5-3-001'
    level: 'middle'
    question: 'При каждом фильтре клиент пересчитывает миллион записей, хотя сервер может вернуть нужный агрегат. Основной расход — объём вычислений. Что проверить первым?'
    options:
      - text: 'Пометить вычисление низкоприоритетным без разделения задачи'
        why: 'Приоритет не делает длинный синхронный код прерываемым.'
      - text: 'Сократить объём или перенести агрегацию к источнику'
        why: 'Устраняется лишняя работа, а не только меняется место её выполнения.'
        correct: true
      - text: 'Перенести тот же полный набор в worker без замера передачи'
        why: 'UI-поток можно разгрузить, но полный объём вычислений остаётся; передачу данных и координацию нужно измерить.'
      - text: 'Debounce каждого ввода считать гарантией быстрой обработки'
        why: 'Частота уменьшится, но одна операция останется дорогой.'
    explanation: 'Первый вопрос — нужна ли вся работа. Worker переносит вычисление с UI-потока, chunking отдаёт управление между порциями, серверная агрегация сокращает клиентский объём. У каждого подхода есть цена передачи, координации и задержки итогового результата.'
    topic: 'A5. UI at scale'
    subtopic: 'A5.3 Scheduling & expensive work'
    links:
      - 'https://web.dev/articles/optimize-long-tasks'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Using_web_workers'
      - 'https://react.dev/reference/react/useTransition'
  - id: 'fsd-a-a5-3-002'
    level: 'middle'
    question: 'Нужно обработать локальный файл; вычисления независимы от DOM, переносимых данных немного, UI не должен зависать. Что подходит?'
    options:
      - text: 'Promise.then вокруг всего синхронного расчёта на UI-потоке'
        why: 'Микрозадача не переносит вычисление в другой поток.'
      - text: 'Мемоизация результата до первого полного расчёта файла'
        why: 'Первое вычисление всё равно блокирует поток без изменения выполнения.'
      - text: 'Worker, который напрямую обновляет DOM каждой обработанной строки'
        why: 'У worker нет доступа к DOM документа.'
      - text: 'Worker с ID задачи, прогрессом и отсечением старого результата'
        why: 'Вычисления можно выполнить отдельно от UI-потока.'
        correct: true
    explanation: 'Worker полезен для достаточно крупной независимой CPU-работы. Нужно оценить сериализацию или transfer данных, идентичность задачи, ошибку и устаревший результат. Перенос не уменьшает общую работу и не ускоряет автоматически каждую задачу.'
    topic: 'A5. UI at scale'
    subtopic: 'A5.3 Scheduling & expensive work'
    links:
      - 'https://web.dev/articles/optimize-long-tasks'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Using_web_workers'
      - 'https://react.dev/reference/react/useTransition'
  - id: 'fsd-a-a5-3-003'
    level: 'middle'
    question: 'Вычисление зависит от UI-данных и допускает поэтапное выполнение. Перенос в worker сейчас слишком дорог, но длинная задача блокирует ввод. Что выбрать?'
    options:
      - text: 'Делить расчёт на порции с уступкой планировщику между ними'
        why: 'Новые task дают UI возможность обработать ввод до завершения всей работы.'
        correct: true
      - text: 'Отложить полный расчёт одним таймером до следующего task'
        why: 'Начало сдвинется, но выполнение всё ещё заблокирует поток одной длинной задачей.'
      - text: 'Построить цепочку Promise.then для отдельных порций'
        why: 'Последовательность микрозадач может отложить обработку ввода и отрисовку.'
      - text: 'Синхронно обходить порции с проверкой времени между функциями'
        why: 'Логическое разбиение на функции не отдаёт управление планировщику.'
    explanation: 'Chunking уменьшает непрерывный интервал блокировки, но может увеличить полное время завершения. Между порциями нужно действительно отдавать управление, а не только создавать Promise. Проверяют отмену устаревшей задачи, прогресс и согласованность частичного результата.'
    topic: 'A5. UI at scale'
    subtopic: 'A5.3 Scheduling & expensive work'
    links:
      - 'https://web.dev/articles/optimize-long-tasks'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Using_web_workers'
      - 'https://react.dev/reference/react/useTransition'
  - id: 'fsd-a-a5-3-004'
    level: 'middle'
    question: 'Поиск должен отправляться после паузы ввода, drag-индикатор — обновляться не чаще заданной частоты, тяжёлая выдача — уступать приоритет набору текста. Как сопоставить механизмы?'
    options:
      - text: 'Throttle для всех трёх как гарантию отсутствия старых ответов'
        why: 'Ограничение частоты не обеспечивает актуальность сетевых результатов.'
      - text: 'Debounce drag до остановки как непрерывное сопровождение движения'
        why: 'При постоянном движении отображение может не обновляться.'
      - text: 'Приоритет UI вместо debounce как ограничение числа запросов'
        why: 'Планирование рендера не задаёт сетевую политику отправки.'
      - text: 'Debounce для поиска, throttle для drag, приоритет для выдачи'
        why: 'Механизмы управляют разными свойствами времени работы.'
        correct: true
    explanation: 'Debounce ждёт паузу, throttle ограничивает частоту, приоритетное обновление позволяет более важному UI откликаться раньше. Это не взаимозаменяемые сетевые протоколы. Ни один из них сам не устраняет race старых ответов и не отменяет серверный эффект.'
    topic: 'A5. UI at scale'
    subtopic: 'A5.3 Scheduling & expensive work'
    links:
      - 'https://web.dev/articles/optimize-long-tasks'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Using_web_workers'
      - 'https://react.dev/reference/react/useTransition'
  - id: 'fsd-a-a5-3-005'
    level: 'senior'
    question: 'Нужно сделать применение фильтра предсказуемым на целевых телефонах при 50k строк; важны медленные взаимодействия, включая показ результата. Какой performance budget и план сравнения полон?'
    options:
      - text: 'От применения до видимой выдачи: p95 ≤150 мс, 50k строк, целевой телефон, до/после'
        why: 'Названы границы пользовательского пути, хвостовая метрика, порог, объём, устройство и воспроизводимое сравнение.'
        correct: true
      - text: 'Только функция фильтра: p95 ≤150 мс, 50k строк, целевой телефон, до/после'
        why: 'Время планирования и показа результата исключено, хотя именно полный отклик важен продукту.'
      - text: 'От применения до видимой выдачи: p95 ≤150 мс, 50k строк, ноутбук, до/после'
        why: 'Бюджет проверяется на другой среде; результат ноутбука не доказывает отклик целевых телефонов.'
      - text: 'От применения до видимой выдачи: среднее ≤150 мс, 50k строк, телефон, до/после'
        why: 'Среднее может скрыть медленные взаимодействия, ради которых нужен хвостовой критерий.'
    explanation: 'Performance budget связывает сценарий, объём, устройство, метрику и порог. Сравнение до/после должно сохранять эти условия и учитывать ошибки, память и полное время работы. Число 150 мс здесь условие задачи, не универсальный стандарт для любого интерфейса.'
    topic: 'A5. UI at scale'
    subtopic: 'A5.3 Scheduling & expensive work'
    links:
      - 'https://web.dev/articles/optimize-long-tasks'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Using_web_workers'
      - 'https://react.dev/reference/react/useTransition'
  - id: 'fsd-a-a5-4-005'
    level: 'middle'
    question: 'В таблице выбраны 40 ID, из них 15 уже не загружены. Часть записей могла быть удалена или потерять право на массовое действие. API умеет проверить список ID и вернуть допустимые и отклонённые. Как подготовить действие без потери выбора?'
    options:
      - text: 'Проверить выбранные ID сервером и показать состав допустимого действия'
        why: 'Незагруженность не отменяет выбор, а наличие ID не доказывает актуальную допустимость команды.'
        correct: true
      - text: 'Оставить в выборе лишь строки текущей загруженной страницы'
        why: 'Невидимые, но намеренно выбранные записи исчезнут из действия.'
      - text: 'Принять все выбранные ID как подтверждённо допустимые'
        why: 'Права и существование могли измениться после выбора.'
      - text: 'Расширить выбор до всех записей текущего фильтра перед проверкой'
        why: 'Будет изменено пользовательское намерение, заданное конкретными 40 ID.'
    explanation: 'Состояние выбора живёт независимо от загруженных страниц, но должно согласоваться с текущими серверными ограничениями. Проверка выбранных ID позволяет объяснить исчезнувшие и недоступные записи, не теряя оставшийся выбор. Перед выполнением сервер снова обеспечивает права и инварианты: предварительная проверка не является блокировкой состояния. При частичном выполнении UI показывает договорные исходы по элементам.'
    topic: 'A5. UI at scale'
    subtopic: 'A5.4 Scaling interaction state'
    links:
      - 'https://tanstack.com/table/v8/docs/guide/row-selection'
      - 'https://www.w3.org/WAI/ARIA/apg/patterns/grid/'
  - id: 'fsd-a-a5-4-002'
    level: 'middle'
    question: 'Пользователь видит 40 строк из 200k подходящих записей. Значок «выбрано всё» должен означать полную серверную выборку. Можно ли вывести его из selected у всех видимых строк?'
    options:
      - text: 'Нет, видимое окно не описывает весь подходящий набор'
        why: 'Полная выборка шире загруженной и отрисованной части.'
        correct: true
      - text: 'Да, если увеличить overscan до двух экранов'
        why: 'Размер локального окна не превращает его в полную коллекцию.'
      - text: 'Да, все видимые строки определяют универсальную выборку'
        why: 'Невидимые страницы и их состав остаются неизвестными.'
      - text: 'Нет, но достаточно выбрать все уже загруженные страницы'
        why: 'Это всё ещё только загруженная часть серверного результата.'
    explanation: 'Нужно различать видимые строки, загруженные страницы и полную серверную выборку. Для выбора всех используют отдельную семантику, а не флаг у каждого DOM-элемента. Счётчик и команды должны соответствовать именно выбранной области.'
    topic: 'A5. UI at scale'
    subtopic: 'A5.4 Scaling interaction state'
    links:
      - 'https://tanstack.com/table/v8/docs/guide/row-selection'
      - 'https://www.w3.org/WAI/ARIA/apg/patterns/grid/'
  - id: 'fsd-a-a5-4-003'
    level: 'senior'
    question: 'Нужно выбрать все результаты серверного фильтра на согласованный момент, кроме трёх исключённых записей. API поддерживает snapshot token. Как представить команду?'
    options:
      - text: 'Передать snapshot выборки и исключённые ID на серверную проверку'
        why: 'Набор закреплён на согласованный момент без передачи клиенту всех ID.'
        correct: true
      - text: 'Передать живой фильтр и исключения для вычисления набора при выполнении'
        why: 'Новые совпавшие записи могут попасть в команду после момента выбора.'
      - text: 'Передать ID загруженных страниц и исключения из них'
        why: 'Команда затронет часть набора вместо всех подходящих на заданный момент.'
      - text: 'Передать total и ID исключений вместо контекста выборки'
        why: 'Количество не определяет состав и не заменяет snapshot.'
    explanation: 'Модель all-matching обычно хранит контекст выборки и исключения. Продукт должен выбрать живой или закреплённый набор; это разные гарантии. Сервер повторно проверяет права и допустимость каждой операции, а UI объясняет количество и частичные отказы по контракту.'
    topic: 'A5. UI at scale'
    subtopic: 'A5.4 Scaling interaction state'
    links:
      - 'https://tanstack.com/table/v8/docs/guide/row-selection'
      - 'https://www.w3.org/WAI/ARIA/apg/patterns/grid/'
  - id: 'fsd-a-a5-4-004'
    level: 'middle'
    question: 'При включённом all-matching пользователь меняет фильтр. Требуется не применять старый массовый выбор к новому набору молча. Какой переход подходит?'
    options:
      - text: 'Сбросить выбор или запросить явное подтверждение его нового контекста'
        why: 'Смена набора не должна молча изменить область массового действия.'
        correct: true
      - text: 'Перенести all-matching и прежние исключения на новый фильтр'
        why: 'Исключения и охват станут относиться к другому намерению без решения пользователя.'
      - text: 'Сохранить прежний snapshot, но показать счётчик нового фильтра'
        why: 'Команда и видимое объяснение выбора разойдутся.'
      - text: 'Переопределить выбор как загруженную страницу нового фильтра'
        why: 'Это неявно заменит полный выбор локальной частью.'
    explanation: 'Выбор — отдельная модель с собственным контекстом. Переключение фильтра, снимка или аккаунта не должно неявно расширять полномочия команды. Политика сброса или подтверждения должна быть видимой и согласованной с API.'
    topic: 'A5. UI at scale'
    subtopic: 'A5.4 Scaling interaction state'
    links:
      - 'https://tanstack.com/table/v8/docs/guide/row-selection'
      - 'https://www.w3.org/WAI/ARIA/apg/patterns/grid/'
  - id: 'fsd-a-a6-1-001'
    level: 'middle'
    question: 'Публичные инструкции меняются раз в месяц, SEO нужен, персонализации нет. CDN и обновление сборки доступны, задержку API на каждом входе хотят убрать. Какой вариант подходит?'
    options:
      - text: 'SSR на каждый вход без кеширования готового результата'
        why: 'Это работает, но сохраняет ненужные для редко меняющегося текста runtime-затраты.'
      - text: 'Один вечный HTML без процесса обновления после правок'
        why: 'Статика тоже требует пути публикации изменившегося содержания.'
      - text: 'SSG с публикацией новой версии при изменении содержания'
        why: 'Готовый HTML обслуживается без запроса к API на каждый просмотр.'
        correct: true
      - text: 'CSR с пустым HTML и обязательным чтением перед показом текста'
        why: 'Первый полезный контент зависит от клиентского кода и API вопреки цели.'
    explanation: 'SSG переносит рендер на сборку и выгоден для предсказуемого публичного содержания. Цена — процесс обновления, длительность сборки и число страниц. Он не запрещает небольшую клиентскую интерактивность; данные, которым нужна другая свежесть, могут иметь отдельный путь.'
    topic: 'A6. Rendering & delivery strategies'
    subtopic: 'A6.1 Rendering selection'
    links:
      - 'https://react.dev/reference/react-dom/server/renderToPipeableStream'
      - 'https://nextjs.org/docs/app/guides/incremental-static-regeneration'
      - 'https://react.dev/reference/react-dom/client/hydrateRoot'
  - id: 'fsd-a-a6-1-002'
    level: 'middle'
    question: 'Каталог публичный, посещений много, контент меняется несколько раз в день. Продукт допускает короткое устаревание, платформа умеет регенерировать кешированный HTML. Обращаться к контентному API на каждом просмотре нельзя из-за бюджета нагрузки. Что рассмотреть?'
    options:
      - text: 'ISR с договорённым сроком и триггерами обновления'
        why: 'Готовые страницы переиспользуются, а обновление не требует полного билда.'
        correct: true
      - text: 'Бессрочный CDN-кеш HTML с immutable по постоянному URL'
        why: 'Контент не сможет обновляться в согласованном бюджете.'
      - text: 'SSR каждого запроса как единственный способ обновления HTML'
        why: 'Свежесть может подойти, но это не единственный вариант при допустимом кеше.'
      - text: 'SSG только по ежемесячной сборке без другого обновления'
        why: 'Возраст HTML превысит заданный допуск изменений.'
    explanation: 'ISR — регенерация статического результата по правилам конкретной платформы, а не универсальная HTTP-гарантия. Уточняют, кто видит старую страницу во время обновления, как обрабатывается ошибка и откуда идёт invalidation. Допустимый возраст нужно доказать на всём пути кешей, не только одной настройкой.'
    topic: 'A6. Rendering & delivery strategies'
    subtopic: 'A6.1 Rendering selection'
    links:
      - 'https://react.dev/reference/react-dom/server/renderToPipeableStream'
      - 'https://nextjs.org/docs/app/guides/incremental-static-regeneration'
      - 'https://react.dev/reference/react-dom/client/hydrateRoot'
  - id: 'fsd-a-a6-1-003'
    level: 'middle'
    question: 'Публичная страница должна отдать актуальный текст в первом HTML, контент меняется часто, stale-HTML запрещён. API доступен на сервере, его стоимость согласована. Что выбрать?'
    options:
      - text: 'CSR с пустым HTML и чтением после загрузки приложения'
        why: 'Данные появятся позже, а не в требуемом первом HTML.'
      - text: 'SSR с чтением актуального контента на запрос'
        why: 'Первый HTML строится по данным текущего запроса без разрешённого stale-кеша.'
        correct: true
      - text: 'ISR с выдачей старого HTML до фоновой регенерации'
        why: 'Это нарушает явный запрет устаревшего первого HTML.'
      - text: 'SSG без повторной публикации между изменениями'
        why: 'Статическая страница не отразит изменения до обновления.'
    explanation: 'SSR помогает получить актуальный или персонализированный первый HTML ценой runtime-вычисления и зависимости от API. Он не означает автоматически отсутствие всех кешей: их политика должна соответствовать требованию. Ошибки источника и время до первого контента остаются частью архитектуры.'
    topic: 'A6. Rendering & delivery strategies'
    subtopic: 'A6.1 Rendering selection'
    links:
      - 'https://react.dev/reference/react-dom/server/renderToPipeableStream'
      - 'https://nextjs.org/docs/app/guides/incremental-static-regeneration'
      - 'https://react.dev/reference/react-dom/client/hydrateRoot'
  - id: 'fsd-a-a6-1-004'
    level: 'middle'
    question: 'Закрытый кабинет не индексируется, его клиентский старт измерен и приемлем; персональные данные меняются после входа. Размещение статическое, отдельный runtime рендера вводить нельзя, контент в первом HTML не требуется. Как доставить интерфейс?'
    options:
      - text: 'CSR с загрузкой приватных данных по API и разделением кода'
        why: 'План работает при статической поставке и в измеренном клиентском бюджете.'
        correct: true
      - text: 'SSR персонального кабинета при каждом входящем запросе'
        why: 'Для этого нужен серверный runtime рендера, исключённый условиями.'
      - text: 'SSG персональных данных при сборке с показом этих снимков после входа'
        why: 'Сборочный снимок не покрывает меняющиеся после входа данные кабинета.'
      - text: 'ISR приватных маршрутов с регенерацией на сервере после входа'
        why: 'Стратегия требует runtime регенерации, которого в допустимой поставке нет.'
    explanation: 'CSR может быть разумен для закрытого интерактивного приложения с приемлемым первым запуском. SSR или гибрид остаются альтернативами при изменении time-to-content, устройств и инфраструктуры. SEO — один из критериев, но не единственная причина серверного рендера.'
    topic: 'A6. Rendering & delivery strategies'
    subtopic: 'A6.1 Rendering selection'
    links:
      - 'https://react.dev/reference/react-dom/server/renderToPipeableStream'
      - 'https://nextjs.org/docs/app/guides/incremental-static-regeneration'
      - 'https://react.dev/reference/react-dom/client/hydrateRoot'
  - id: 'fsd-a-a6-1-005'
    level: 'middle'
    question: 'Сервер уже подготовил статью; медленный независимый блок комментариев мешает отправить первый контент. Комментарии могут появиться позже. Что даст streaming с границей ожидания?'
    options:
      - text: 'Доставить готовую статью до завершения независимых комментариев'
        why: 'Граница ожидания исключает медленный блок из барьера основного контента.'
        correct: true
      - text: 'Отправить статью после готовности комментариев одним итоговым HTML'
        why: 'Общий барьер сохранит задержку полезного содержания.'
      - text: 'Сначала целиком подготовить комментарии, затем разбить готовый HTML на чанки'
        why: 'Разбиение доставки после полной подготовки не устраняет исходное ожидание.'
      - text: 'Передать лишь loading-оболочку, статью получить клиентским чтением'
        why: 'Это переносит уже доступную статью в дополнительный клиентский путь, а не доставляет её раньше с сервера.'
    explanation: 'Hydration связывает серверный HTML с клиентским поведением и имеет цену JavaScript и согласования. Streaming меняет границы доставки, а частичная интерактивность может сократить активируемые области. Ранний видимый контент не равен полной готовности всех действий; эти моменты нужно измерять отдельно.'
    topic: 'A6. Rendering & delivery strategies'
    subtopic: 'A6.1 Rendering selection'
    links:
      - 'https://react.dev/reference/react-dom/server/renderToPipeableStream'
      - 'https://nextjs.org/docs/app/guides/incremental-static-regeneration'
      - 'https://react.dev/reference/react-dom/client/hydrateRoot'
  - id: 'fsd-a-a6-1-006'
    level: 'senior'
    question: 'Сайт содержит редко меняющиеся статьи, часто обновляемый публичный каталог с допуском stale и закрытый редактор. Публичным маршрутам нужны SEO и контент в первом HTML; начальный CSR редактора измерен и укладывается в бюджет. Обоснуй стратегию маршрутов.'
    options:
      - text: 'Один CSR-путь без проверки первого контента публичных страниц'
        why: 'Выбор не учитывает SEO и бюджет начального содержания.'
      - text: 'Один SSR-путь обязателен для всех из-за общего домена'
        why: 'Организационная оболочка не делает freshness и интерактивность одинаковыми.'
      - text: 'Один бессрочный SSG-кеш для публичных и приватных маршрутов'
        why: 'Потеряются свежесть каталога и изоляция пользовательских данных.'
      - text: 'SSG статей, ISR каталога, CSR закрытого редактора'
        why: 'Разные требования имеют разные выгодные места и сроки выполнения.'
        correct: true
    explanation: 'Гибрид выбирают на уровне маршрутов и областей данных. Общие навигация, auth и дизайн не требуют одного механизма рендера. Цена гибрида — несколько путей доставки, кеширования и диагностики; его пользу сопоставляют с требованиями, а не числом используемых технологий.'
    topic: 'A6. Rendering & delivery strategies'
    subtopic: 'A6.1 Rendering selection'
    links:
      - 'https://react.dev/reference/react-dom/server/renderToPipeableStream'
      - 'https://nextjs.org/docs/app/guides/incremental-static-regeneration'
      - 'https://react.dev/reference/react-dom/client/hydrateRoot'
  - id: 'fsd-a-a6-1-007'
    level: 'senior'
    question: 'Преимущественно статическая страница быстро показывает серверный HTML, но тяжёлая hydration задерживает управление двумя небольшими виджетами. Виджетам нужны локальные вычисления и немедленный показ результата без сетевого перехода; платформа поддерживает независимые интерактивные области. Как изменить границы интерактивности?'
    options:
      - text: 'Ограничить интерактивную активацию виджетами с явными контрактами границ'
        why: 'Статические области не требуют прежнего объёма клиентской активации, но границы имеют цену.'
        correct: true
      - text: 'Раньше отправить тот же HTML, оставив общую hydration-работу'
        why: 'Первый контент уже быстр, а измеренная задержка взаимодействия остаётся.'
      - text: 'Разбить HTML на потоковые части, затем гидратировать всё одним блоком'
        why: 'Границы доставки не обязаны уменьшать объём клиентской активации.'
      - text: 'Предзагрузить больше общего JS и сохранить единый блок активации'
        why: 'Сетевое ожидание может уменьшиться, но сама тяжёлая hydration не сокращается.'
    explanation: 'Граница интерактивности определяет, сколько клиентского кода нужно загрузить и активировать. Независимые области или поддерживаемая платформой частичная активация могут уменьшить hydration-работу, но требуют контрактов данных и общих зависимостей. Streaming решает раннюю доставку, а не автоматически стоимость клиентской активации; сравнивают time-to-content и готовность действий отдельно.'
    topic: 'A6. Rendering & delivery strategies'
    subtopic: 'A6.1 Rendering selection'
    links:
      - 'https://react.dev/reference/react-dom/server/renderToPipeableStream'
      - 'https://nextjs.org/docs/app/guides/incremental-static-regeneration'
      - 'https://react.dev/reference/react-dom/client/hydrateRoot'
  - id: 'fsd-a-a6-2-001'
    level: 'middle'
    question: 'Редактор диаграмм весит 2 МБ и нужен на редком маршруте. Шапка и чтение списка нужны всегда. Какая граница code splitting полезна?'
    options:
      - text: 'Выделить каждую маленькую кнопку в обязательный последовательный chunk'
        why: 'Мелкое разбиение может добавить накладные расходы и waterfall.'
      - text: 'Загрузить редактор вместе с начальной шапкой ради общего bundle'
        why: 'Большинство пользователей оплатит код редкого сценария.'
      - text: 'Вынести редактор, но ждать его перед показом любого маршрута'
        why: 'Физическое разделение не поможет, если сохранён общий барьер.'
      - text: 'Отделить редкий редактор, не блокируя им основной список'
        why: 'Тяжёлый необязательный код покидает критический путь.'
        correct: true
    explanation: 'Граница splitting полезна при независимом сценарии и существенном отложенном объёме. Progressive loading отделяет полезные части UI и их ошибки, не только файлы. Слишком мелкие chunks могут увеличить зависимую загрузку; измеряют фактический путь.'
    topic: 'A6. Rendering & delivery strategies'
    subtopic: 'A6.2 Loading boundaries & assets'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Attributes/rel/preload'
      - 'https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Attributes/rel/prefetch'
      - 'https://react.dev/reference/react-dom/server/renderToPipeableStream'
  - id: 'fsd-a-a6-2-002'
    level: 'middle'
    question: 'Крупное изображение первого экрана известно заранее и обнаруживается поздно, а следующий маршрут открывают лишь 20% пользователей. Как различить подсказки загрузки?'
    options:
      - text: 'Preload всех возможных маршрутов при любом бюджете сети'
        why: 'Избыточная подготовка замедляет и удорожает текущую загрузку.'
      - text: 'Prefetch сделать гарантированным высокоприоритетным preload для всего'
        why: 'Спекуляция может конкурировать с текущим контентом и не использоваться.'
      - text: 'Отложить критический hero до события первой прокрутки'
        why: 'Собственный триггер только по прокрутке задерживает нужное на первом экране изображение до ненужного действия. Нативное loading="lazy" само по себе не означает ожидания прокрутки для изображения в viewport.'
      - text: 'Preload для нужного сейчас, prefetch следующего — по бюджету'
        why: 'Текущий критический ресурс и спекулятивный переход имеют разные приоритеты.'
        correct: true
    explanation: 'Preload сообщает о ресурсе, нужном текущей навигации; prefetch — о вероятном будущем использовании и не является гарантией загрузки. Lazy loading откладывает работу до потребности. Подсказки должны соответствовать реальному URL и способу потребления, иначе возможны лишние или повторные передачи.'
    topic: 'A6. Rendering & delivery strategies'
    subtopic: 'A6.2 Loading boundaries & assets'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Attributes/rel/preload'
      - 'https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Attributes/rel/prefetch'
      - 'https://react.dev/reference/react-dom/server/renderToPipeableStream'
  - id: 'fsd-a-a6-2-003'
    level: 'middle'
    question: 'Бюджет передачи ресурсов до первого полезного экрана — 600 КиБ. На этом пути JS 180, CSS 40, шрифт 80 и hero 900 КиБ; данные уже готовы. Отложенный редактор 2 МиБ не запрашивается на входе. Какая оптимизация уложит критический путь в бюджет?'
    options:
      - text: 'Подобрать hero нужного качества объёмом 250 КиБ'
        why: 'Критическая передача станет 180 + 40 + 80 + 250 = 550 КиБ.'
        correct: true
      - text: 'Сократить отложенный редактор с 2 МиБ до 200 КиБ'
        why: 'Это улучшит другой сценарий, но не уменьшит текущие 1200 КиБ критической передачи.'
      - text: 'Сократить начальный JS до 80 КиБ, оставив прежний hero'
        why: 'Критическая передача останется 1100 КиБ и превысит бюджет.'
      - text: 'Заранее подготовить редактор параллельно с прежним hero'
        why: 'Подготовка добавит конкуренцию и не уменьшит обязательные байты первого экрана.'
    explanation: 'Бюджет относится к конкретному пути, а не к сумме файлов приложения на диске. Здесь доминирует обязательный hero, и его подходящее представление уменьшает критическую передачу до 550 КиБ. Сокращение редкого кода полезно для открытия редактора, но не решает данный бюджет. После изменения проверяют полезный результат и качество на целевой среде; соблюдение байтов само не доказывает нужное время.'
    topic: 'A6. Rendering & delivery strategies'
    subtopic: 'A6.2 Loading boundaries & assets'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Attributes/rel/preload'
      - 'https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Attributes/rel/prefetch'
      - 'https://react.dev/reference/react-dom/server/renderToPipeableStream'
  - id: 'fsd-a-a6-2-004'
    level: 'middle'
    question: 'Комментарии под статьёй могут быть позже, но клиентский модуль комментариев запускается только после получения их данных; два этапа независимы. Что сократит ожидание открытия?'
    options:
      - text: 'Начать известные независимые код и данные у границы комментариев'
        why: 'Убирается лишняя связь старта одного этапа с окончанием другого.'
        correct: true
      - text: 'Ускорить чтение данных, сохранив загрузку кода после ответа'
        why: 'Это может уменьшить один этап, но оставляет последовательное ожидание на холодном пути.'
      - text: 'Разбить модуль на chunks, обнаруживаемые после тех же данных'
        why: 'Меньшие файлы не устраняют позднее обнаружение работы.'
      - text: 'Поставить загрузку кода в следующий task после монтирования'
        why: 'Старт станет ещё позже, хотя его входы уже известны.'
    explanation: 'Код и данные могут образовывать waterfall независимо от размера chunks. Граница загрузки должна владеть известными входами и начинать независимую работу вовремя. Параллельность повышает пиковую конкуренцию, поэтому её согласуют с приоритетом основного контента.'
    topic: 'A6. Rendering & delivery strategies'
    subtopic: 'A6.2 Loading boundaries & assets'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Attributes/rel/preload'
      - 'https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Attributes/rel/prefetch'
      - 'https://react.dev/reference/react-dom/server/renderToPipeableStream'
  - id: 'fsd-a-a6-3-001'
    level: 'middle'
    question: 'JS с content hash кешируется браузером на год. Данные заказов меняются каждую минуту и зависят от пользователя. Что следует?'
    options:
      - text: 'Разделить политики неизменяемых ассетов и изменяемых приватных ресурсов'
        why: 'Идентичность кода и свежесть данных изменяются независимо.'
        correct: true
      - text: 'Инвалидировать заказы при изменении hash клиентской сборки'
        why: 'Изменения заказов происходят между выкатами и не будут обнаружены таким триггером.'
      - text: 'Назначить заказам тот же срок хранения, что и хешированному JS'
        why: 'Годовая пригодность изменяемых пользовательских данных не следует из срока ассета.'
      - text: 'Обновлять ответы заказов при успешной загрузке нового manifest'
        why: 'Manifest описывает код, а не текущие версии данных пользователя.'
    explanation: 'Browser/CDN caching повторно использует HTTP-ответы, а data cache приложения моделирует ресурсы и зависимости. Хеш имени делает новый ассет новым URL, но не обновляет данные и не отменяет авторизацию. Политики HTML, immutable-ассетов и приватных ответов согласуют отдельно.'
    topic: 'A6. Rendering & delivery strategies'
    subtopic: 'A6.3 Caching & compatibility'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching'
  - id: 'fsd-a-a6-3-002'
    level: 'senior'
    question: 'Вкладка версии 1 открыта сутки. После выката версии 2 старые chunks удалены, пользователь открыл ещё не загруженный раздел. Как предотвратить проблему?'
    options:
      - text: 'Сохранять поколения ассетов на окно поддержки и дать путь обновления'
        why: 'Старый runtime может впервые запросить прежний chunk после deploy.'
        correct: true
      - text: 'Удалять прежние ассеты после публикации нового index.html'
        why: 'Открытая вкладка продолжает работать с прежним графом ленивых зависимостей.'
      - text: 'Обновить общий manifest, оставив старый runtime с прежними URL'
        why: 'Новый manifest сам не переписывает уже загруженный runtime и его адреса chunks.'
      - text: 'Записать новый chunk по старому хешированному адресу'
        why: 'Содержимое и совместимость перестанут соответствовать идентичности ассета.'
    explanation: 'Клиентская версия переживает deploy сервера. Старые адресуемые ассеты сохраняют на согласованное время, а путь обновления не должен терять ввод. Если chunk уже недоступен, UI объясняет необходимость обновления и защищает несохранённую работу вместо цикла reload.'
    topic: 'A6. Rendering & delivery strategies'
    subtopic: 'A6.3 Caching & compatibility'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching'
  - id: 'fsd-a-a6-3-003'
    level: 'middle'
    question: 'Во время rolling deploy часть клиентов ожидает поле name, новые читают displayName. Как избежать несовместимости в переходное окно?'
    options:
      - text: 'Добавить displayName, перевести клиентов, затем убрать name'
        why: 'Оба поколения получают совместимый ответ в переходном окне.'
        correct: true
      - text: 'Переименовать поле на сервере перед публикацией нового клиента'
        why: 'Старые вкладки продолжат ожидать name и получат несовместимый ответ.'
      - text: 'Выпустить клиент displayName до добавления поля в API'
        why: 'Новые клиенты столкнутся с сервером, ещё не выполняющим их контракт.'
      - text: 'Удалить name после очистки CDN от старых клиентских сборок'
        why: 'Удаление ассетов не завершает работу уже загруженных старых вкладок.'
    explanation: 'Совместимость учитывает одновременно старых и новых потребителей. Добавление поля часто проще разрушительного переименования; удаление ждёт доказанного завершения поддержки. Нужны наблюдение версий, контрактные проверки и план отказа устаревшего клиента, а не надежда на атомарный deploy.'
    topic: 'A6. Rendering & delivery strategies'
    subtopic: 'A6.3 Caching & compatibility'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching'
  - id: 'fsd-a-a6-3-004'
    level: 'middle'
    question: 'Старую версию клиента больше нельзя безопасно обслуживать. Вкладка содержит несохранённый ввод; локальный экспорт разрешён. Как обновить?'
    options:
      - text: 'Подменить старую схему запроса только по совпадению имён полей'
        why: 'Сходство полей не доказывает семантическую совместимость.'
      - text: 'Принудительно reload при следующем фокусе без предупреждения'
        why: 'Ввод может исчезнуть, хотя разрешён путь его сохранения.'
      - text: 'Заблокировать опасную отправку, предложить сохранить ввод и обновиться'
        why: 'Совместимость и пользовательская работа учитываются вместе.'
        correct: true
      - text: 'Продолжить старые команды, скрыв несовместимые ответы'
        why: 'Нарушения контракта останутся и могут привести к неверному эффекту.'
    explanation: 'Окно поддержки имеет предел, после которого нужен управляемый отказ старой версии. Переход защищает разрешённый ввод, объясняет ограничение и исключает опасные команды. Хранить все версии бесконечно не обязательно, но завершение поддержки — часть контракта, а не случайный chunk error.'
    topic: 'A6. Rendering & delivery strategies'
    subtopic: 'A6.3 Caching & compatibility'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching'
  - id: 'fsd-a-a6-3-005'
    level: 'middle'
    question: 'Ответ /me зависит от cookie-сессии и содержит персональные реквизиты. Политика запрещает хранить его в общем CDN-кеше, но разрешает браузерное повторение до 60 секунд. Как задать HTTP-политику?'
    options:
      - text: 'Cache-Control: private, max-age=60'
        why: 'private запрещает хранение в shared cache, сохраняя возможность частного браузерного кеширования по сроку.'
        correct: true
      - text: 'Cache-Control: public, max-age=60 и Vary: Cookie'
        why: 'Vary разделяет варианты, но не запрещает хранить персональные ответы в общем кеше.'
      - text: 'Cache-Control: s-maxage=60 и Vary: Cookie'
        why: 's-maxage задаёт пригодность именно для shared cache, что противоречит запрету.'
      - text: 'Cache-Control: max-age=60 и отдельный query-ключ пользователя'
        why: 'Ключ data cache приложения не запрещает промежуточному HTTP-кешу хранить ответ.'
    explanation: 'Политика shared HTTP cache и ключ data cache приложения находятся на разных границах. private запрещает общему кешу сохранять ответ; Vary выбирает вариант по заголовкам запроса, но сам не является запретом хранения или проверкой доступа. no-store подошёл бы для более строгого запрета любого хранения, но лишил бы разрешённого браузерного reuse. Серверная авторизация и очистка чувствительных клиентских копий остаются отдельными задачами.'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching'
      - 'https://www.rfc-editor.org/rfc/rfc9111.html'
    multiple: true
    topic: 'A6. Rendering & delivery strategies'
    subtopic: 'A6.3 Caching & compatibility'
  - id: 'fsd-a-a6-4-001'
    level: 'middle'
    question: 'Ссылка должна открыть фильтр и сортировку отчёта у коллеги. Секретный токен сессии переносить нельзя, API проверяет его отдельно. Как устроить deep link?'
    options:
      - text: 'Канонические параметры в URL, проверка доступа по сессии получателя'
        why: 'Ссылка переносит представление, не полномочия отправителя.'
        correct: true
      - text: 'ID отчёта в URL, фильтр из локальных настроек получателя'
        why: 'У коллеги может восстановиться другая выборка вместо состояния ссылки.'
      - text: 'Параметры и токен отправителя в подписанном query'
        why: 'Подпись не отменяет запрет переносить секрет в адресе и не делает его безопасным для истории.'
      - text: 'Параметры в URL, разрешение чтения по непредсказуемому ID отчёта'
        why: 'Сложность угадывания идентификатора не заменяет серверную авторизацию.'
    explanation: 'URL — публично переносимый контракт представления с разбором, значениями по умолчанию и версионированием при необходимости. Неизвестные или недопустимые параметры обрабатывают предсказуемо, а не превращают в произвольную команду. Права и секреты не следуют из адреса.'
    topic: 'A6. Rendering & delivery strategies'
    subtopic: 'A6.4 Routing as contract'
    links:
      - 'https://reactrouter.com/start/framework/data-loading'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/History_API/Working_with_the_History_API'
  - id: 'fsd-a-a6-4-002'
    level: 'senior'
    question: 'Прямой URL содержит эквивалентную, но неканоническую запись фильтра; нормализация не должна добавлять шаг Back. При popstate нужно показать выборку адреса, используя пригодный кеш и обновляя stale-данные по политике. Как связать историю и загрузчик?'
    options:
      - text: 'Нормализовать через replaceState, popstate передать загрузчику ключа адреса'
        why: 'Техническая правка не создаёт новое намерение, а возврат проходит тот же путь выбора и проверки данных.'
        correct: true
      - text: 'Нормализовать через pushState, на popstate восстановить текущий store'
        why: 'Появится лишний шаг, а выбранный адрес может разойтись с показанной выборкой.'
      - text: 'Нормализовать через replaceState, на popstate менять адрес без загрузчика'
        why: 'Смена записи истории сама по себе не обновляет данные и не проверяет их пригодность.'
      - text: 'Нормализовать через replaceState, при Back очищать кеш перед каждым чтением'
        why: 'Семантика истории сохранится, но пригодный кеш не будет использован вопреки требованию.'
    explanation: 'replaceState подходит для технической нормализации текущей записи, а pushState — для нового навигационного намерения. Вызовы pushState/replaceState сами не создают popstate; навигационный слой должен согласовать прямой вход и последующие переходы. При Back загрузчик получает параметры выбранного URL, находит соответствующий кеш и применяет политику свежести. Момент восстановления прокрутки согласуют с готовностью нужного содержимого.'
    links:
      - 'https://reactrouter.com/start/framework/data-loading'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/History_API/Working_with_the_History_API'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Window/popstate_event'
    topic: 'A6. Rendering & delivery strategies'
    subtopic: 'A6.4 Routing as contract'
  - id: 'fsd-a-a6-4-003'
    level: 'middle'
    question: 'Внутри кабинета переходят между отчётами. Шапка и навигация неизменны, данные отчётов независимы. Сбой одного отчёта не должен сносить оболочку. Как выбрать границы?'
    options:
      - text: 'Устойчивый layout и собственная граница данных/ошибки отчёта'
        why: 'Локальный отказ не уничтожает независимую навигацию.'
        correct: true
      - text: 'Общий loader кабинета, ожидающий доступности каждого отчёта'
        why: 'Неиспользуемый зависимый ресурс станет барьером всего экрана.'
      - text: 'Error boundary отчёта с fallback, заменяющим всю оболочку'
        why: 'Ошибка локализована кодом, но пользователь всё ещё теряет независимые пути.'
      - text: 'Новый экземпляр оболочки при каждом изменении фильтра отчёта'
        why: 'Неизменная навигация потеряет контекст из-за чрезмерной границы пересоздания.'
    explanation: 'Layout и data-loading границы выбирают по устойчивости контекста и независимости данных. Слишком общий барьер увеличивает область отказа, слишком мелкие loader могут породить waterfall. Навигация должна сохранять полезную оболочку и явно обозначать, какая часть ещё загружается.'
    topic: 'A6. Rendering & delivery strategies'
    subtopic: 'A6.4 Routing as contract'
    links:
      - 'https://reactrouter.com/start/framework/data-loading'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/History_API/Working_with_the_History_API'
  - id: 'fsd-a-a6-4-006'
    level: 'middle'
    question: 'В одной вкладке две записи истории открывают список задач проекта с разными фильтрами. В каждой пользователь отметил свои строки. При переходе в карточку список размонтируется. Back должен вернуть выбор именно той записи истории, но ссылка коллеге не должна его переносить. Состав задач мог измениться. Как организовать восстановление?'
    options:
      - text: 'URL хранит фильтр; выбор — по записи истории и проекту, с проверкой актуальных строк'
        why: 'Фильтр остаётся переносимым контрактом, а непереносимый выбор относится к конкретному навигационному контексту. Проверка исключает исчезнувшие или недоступные строки.'
        correct: true
      - text: 'URL хранит фильтр; выбор — один на маршрут и проект, общий для всех записей истории'
        why: 'Два посещения одного списка будут перезаписывать выбор друг друга: Back восстановит последний общий набор вместо выбора нужной записи.'
      - text: 'URL хранит фильтр и выбранные строки; Back и общая ссылка восстанавливают их вместе'
        why: 'История восстановится, но ссылка перенесёт личный выбор коллеге вопреки условию. Не всё состояние интерфейса должно входить в deep link.'
      - text: 'URL хранит фильтр; выбор — в компоненте списка до его размонтирования при переходе'
        why: 'Такой срок жизни короче требуемого: после карточки экземпляр списка создастся заново и прежние отметки не восстановятся.'
    explanation: 'Контракт URL и контекст конкретного посещения имеют разные области действия. Фильтры нужны для воспроизводимой ссылки, а временный выбор можно сохранить вне компонента, привязав к идентичности записи истории и области проекта. При возврате сначала восстанавливают параметры нужной записи и получают пригодные данные, затем согласуют сохранённый выбор с доступными строками. Исторический контекст сохраняет намерение пользователя, но не превращает старые данные или права в текущие. Отсутствующие отметки снимают с понятным уведомлением, а не применяют к другой выборке. Для требования в пределах одной вкладки и без refresh достаточно памяти навигационного слоя; переживание перезагрузки потребовало бы отдельного решения о хранении.'
    topic: 'A6. Rendering & delivery strategies'
    subtopic: 'A6.4 Routing as contract'
    links:
      - 'https://reactrouter.com/start/framework/data-loading'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/History_API/Working_with_the_History_API'
  - id: 'fsd-a-a7-1-006'
    level: 'middle'
    question: 'Оператор авторизован и имеет роль редактирования заказов своей организации. В PATCH он подменил ID заказа на заказ другой организации; UI список чужих заказов не показывает. Какую проверку должен выполнить API для целевого объекта?'
    options:
      - text: 'Проверить связь оператора, организации и заказа перед применением PATCH'
        why: 'Роль разрешает тип действия, но доступ к конкретному объекту определяется дополнительной связью.'
        correct: true
      - text: 'Проверить роль редактора и существование переданного заказа'
        why: 'Эти проверки не доказывают принадлежность объекта разрешённой организации.'
      - text: 'Проверить формат ID и соответствие тела публичной схеме'
        why: 'Корректная форма запроса не устанавливает право действовать над выбранным объектом.'
      - text: 'Проверить, что запрос пришёл из маршрута редактирования приложения'
        why: 'Маршрут и источник UI не являются доверенным доказательством объектного доступа.'
    explanation: 'Объектная авторизация проверяется на сервере при каждом обращении к выбранному ресурсу. Успешная аутентификация и широкая роль не определяют доступ к любому ID. Tenant или owner из клиентского тела нельзя принимать как доказательство связи: API выводит доступ из доверенного контекста и отношений данных. Скрытие чужих объектов в UI остаётся удобством, а не границей защиты.'
    topic: 'A7. Cross-cutting requirements'
    subtopic: 'A7.1 Security boundaries'
    links:
      - 'https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html'
      - 'https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html'
      - 'https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html'
      - 'https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html'
      - 'https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html'
  - id: 'fsd-a-a7-1-002'
    level: 'middle'
    question: 'Роль оператора отозвана во время открытой сессии. UI ещё показывает кнопку изменения. Какой контракт необходим?'
    options:
      - text: 'API доверяет роли из сохранённого пользователем store'
        why: 'Клиентская копия не является доверенным источником авторизации.'
      - text: 'API проверяет текущие права каждой операции, UI обрабатывает отказ'
        why: 'Открытый экран не закрепляет полномочия на весь срок жизни вкладки.'
        correct: true
      - text: 'Права фиксируются только при первом входе до закрытия браузера'
        why: 'Отозванный пользователь сохранит возможность действовать.'
      - text: 'Клиент скрывает кнопку после focus и это заменяет серверную проверку'
        why: 'Прямой запрос может уйти до focus или вне приложения.'
    explanation: 'Authn подтверждает, кто действует, authz — что ему разрешено. UI может кешировать возможности для удобства, но сервер проверяет актуальные права и доступ к конкретному объекту. Отказ требует обновить доступные действия и обработать несохранённую работу согласно политике безопасности.'
    topic: 'A7. Cross-cutting requirements'
    subtopic: 'A7.1 Security boundaries'
    links:
      - 'https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html'
      - 'https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html'
      - 'https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html'
      - 'https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html'
      - 'https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html'
  - id: 'fsd-a-a7-1-003'
    level: 'senior'
    question: 'Веб-приложение использует серверную cookie-сессию. Хотят уменьшить кражу секрета через чтение JS и защитить изменяющие запросы от CSRF. Какой набор мер соответствует обеим целям?'
    options:
      - text: 'Перенести сессионный секрет в localStorage ради защиты от XSS'
        why: 'JS того же origin сможет прочитать такой секрет.'
      - text: 'Отказаться от проверки доступа после включения SameSite'
        why: 'SameSite не подтверждает права на объект или допустимость бизнес-команды.'
      - text: 'Secure/HttpOnly cookie и согласованная CSRF-защита изменяющих запросов'
        why: 'HttpOnly ограничивает чтение секрета, а CSRF-защита проверяет допустимость отправки.'
        correct: true
      - text: 'Оставить только HttpOnly и считать CSRF невозможным'
        why: 'Cookie может автоматически прикладываться браузером; защита CSRF требует своей политики.'
    explanation: 'Выбор хранения секрета зависит от модели сессии и угроз. HttpOnly не предотвращает все действия XSS от имени пользователя; нужны безопасное отображение и другие меры. SameSite, anti-CSRF token и проверка origin применяются по контракту, а серверная authz остаётся обязательной.'
    topic: 'A7. Cross-cutting requirements'
    subtopic: 'A7.1 Security boundaries'
    links:
      - 'https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html'
      - 'https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html'
      - 'https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html'
      - 'https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html'
      - 'https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html'
  - id: 'fsd-a-a7-1-004'
    level: 'middle'
    question: 'Пользовательские описания показываются в карточке, поиске и SSR-превью. Разрешён ограниченный rich text. Как задать безопасную границу отображения?'
    options:
      - text: 'Ограниченный rich text и единый безопасный путь вывода'
        why: 'Защита применяется в каждом опасном месте использования и не зависит от происхождения копии.'
        correct: true
      - text: 'Очищать только в редакторе, а API-клиентам разрешить произвольный HTML'
        why: 'Данные могут прийти через другой клиент или старую версию.'
      - text: 'Очистить SSR, а поисковое превью вставлять как исходный HTML'
        why: 'Один защищённый путь не закрывает другой опасный sink.'
      - text: 'Доверять описанию после его сохранения в собственной БД'
        why: 'Persisted пользовательский ввод не становится доверенным HTML.'
    explanation: 'Архитектура задаёт формат данных и границу их безопасного потребления во всех клиентах. Для plain text подходит текстовый вывод; для rich text нужен ограниченный формат и проверенный sanitizer с политикой URL и элементов. Собственное хранилище и серверный рендер не делают пользовательский ввод доверенным.'
    topic: 'A7. Cross-cutting requirements'
    subtopic: 'A7.1 Security boundaries'
    links:
      - 'https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html'
      - 'https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html'
      - 'https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html'
      - 'https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html'
      - 'https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html'
  - id: 'fsd-a-a7-1-005'
    level: 'senior'
    question: 'Чувствительный ввод должен переживать переходы между маршрутами, но не закрытие или logout. Долговечное восстановление не требуется, хранение на устройстве хотят минимизировать. Какую модель выбрать с учётом XSS-риска?'
    options:
      - text: 'Держать ввод в памяти сессии над маршрутами и очищать при выходе'
        correct: true
        why: 'Сценарий не требует долговечной копии. Память уменьшает время сохранения, но сама не даёт иммунитета от выполняющегося XSS.'
      - text: 'Записывать ввод в localStorage и чистить только при следующем входе'
        why: 'Копия переживёт закрытие до следующего входа, хотя такой срок не нужен и увеличивает поверхность утечки.'
      - text: 'Хранить ввод в IndexedDB, считая его недоступным JavaScript origin'
        why: 'IndexedDB не изолирует данные от кода того же origin; смена хранилища не создаёт такую границу доверия.'
      - text: 'Шифровать постоянную копию, сохранив ключ для JS в том же origin'
        why: 'Это не уменьшает нужду в постоянном хранении и не обеспечивает защиту от XSS, который может получить ключ и данные.'
    explanation: 'Модель хранения следует минимально необходимому сроку и чувствительности данных. Общая память над маршрутами может сохранить ввод при навигации без ненужной долговечной копии. Это снижает удержание, но не устраняет XSS во время активной сессии; безопасный вывод, контроль стороннего кода и серверные границы остаются важны. Шифрование с доступным тому же коду ключом не создаёт отдельную защиту от этого кода.'
    topic: 'A7. Cross-cutting requirements'
    subtopic: 'A7.1 Security boundaries'
    links:
      - 'https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html'
      - 'https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html'
      - 'https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html'
      - 'https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html'
      - 'https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html'
  - id: 'fsd-a-a7-2-001'
    level: 'middle'
    question: 'Команда выбирает общий компонент диалога для всех критических форм. В требованиях клавиатура, скринридер и возвращение к месту открытия. Что проверить до внедрения?'
    options:
      - text: 'Контракт имени, начального фокуса, Tab/Escape и логического возврата'
        why: 'Общий паттерн должен обеспечивать смысл и поведение системного диалога.'
        correct: true
      - text: 'Доступное имя и aria-modal, фокус оставить поведению страницы'
        why: 'Атрибуты не реализуют удержание фокуса, закрытие и возврат.'
      - text: 'Tab-trap и Escape, имя оставить одинаковым для всех форм'
        why: 'Пользователь скринридера должен различать назначение конкретного диалога.'
      - text: 'Внутреннюю навигацию, возврат реализовать в экранах без общего API'
        why: 'Не будет устойчивого контракта для исчезающего инициатора и повторного открытия.'
    explanation: 'Доступность — свойство архитектуры взаимодействия. Модальный паттерн определяет доступное имя, размещение и удержание фокуса, закрытие и возврат к логическому месту. При сложном содержимом начальный фокус не обязан всегда попадать в первый input; выбор зависит от задачи.'
    topic: 'A7. Cross-cutting requirements'
    subtopic: 'A7.2 Accessibility architecture'
    links:
      - 'https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/'
      - 'https://www.w3.org/WAI/ARIA/apg/patterns/grid/'
      - 'https://www.w3.org/TR/WCAG22/#status-messages'
  - id: 'fsd-a-a7-2-002'
    level: 'middle'
    question: 'После «Загрузить ещё» добавляются записи, клавиатурный фокус остаётся на кнопке. Нужно сообщить о результате скринридеру без чтения каждой новой строки. Какой контракт подходит?'
    options:
      - text: 'Оставить фокус предсказуемым и объявить краткий итог загрузки'
        why: 'Статус сообщает результат без перехвата управления и чтения всей таблицы.'
        correct: true
      - text: 'Объявлять полный обновлённый текст таблицы через assertive live-region'
        why: 'Объём и срочность перебьют текущую работу и создадут поток лишних объявлений.'
      - text: 'Переводить фокус в последнюю добавленную строку после ответа'
        why: 'Пользователь теряет место управления загрузкой из-за несогласованного перехвата фокуса.'
      - text: 'Обновлять итог вне live-region, не связывая его с активным контролом'
        why: 'Изменение текста само по себе не обеспечивает своевременное объявление результата.'
    explanation: 'Динамическое обновление должно иметь понятный статус без лишнего перехвата фокуса. Краткое сообщение о числе добавленных записей и конце выдачи часто полезнее чтения всей области. При ошибке кнопка и путь повтора остаются доступными; конкретный способ объявления проверяют с assistive technology.'
    topic: 'A7. Cross-cutting requirements'
    subtopic: 'A7.2 Accessibility architecture'
    links:
      - 'https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/'
      - 'https://www.w3.org/WAI/ARIA/apg/patterns/grid/'
      - 'https://www.w3.org/TR/WCAG22/#status-messages'
  - id: 'fsd-a-a7-2-005'
    level: 'middle'
    question: 'Каталог должен позволять клавиатурой и скринридером найти любую запись. API поддерживает поиск и страницы по 50 строк, обычная таблица такого размера укладывается в бюджет. Выбранный виртуализатор не даёт надёжной навигации за DOM-окном, до релиза нет ресурса реализовать её. Что выбрать?'
    options:
      - text: 'Поиск по полному набору и доступную пагинацию с обычной таблицей'
        why: 'Каждая страница имеет доступную структуру, а полный набор достижим через управляемые переходы.'
        correct: true
      - text: 'Оставить окно и добавить aria-rowcount вместо недостающей навигации'
        why: 'Описание общего размера не делает невидимые записи достижимыми.'
      - text: 'Увеличить overscan до трёх экранов без смены навигации'
        why: 'Доступная область станет чуть шире, но произвольная запись всё ещё может быть недостижима.'
      - text: 'Загрузить весь каталог в DOM без проверки объёма на целевых устройствах'
        why: 'Неограниченная отрисовка может нарушить бюджет; условие подтверждает пригодность лишь ограниченной страницы.'
    explanation: 'Доступность влияет на выбор механизма отображения, а не добавляется одной ролью после него. Ограниченная обычная таблица с доступными поиском и пагинацией может надёжнее покрыть сценарий, чем неподходящее виртуальное окно. Если позже потребуются непрерывная навигация и другой объём, виртуализатор выбирают вместе с его полным клавиатурным и screen-reader контрактом.'
    topic: 'A7. Cross-cutting requirements'
    subtopic: 'A7.2 Accessibility architecture'
    links:
      - 'https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/'
      - 'https://www.w3.org/WAI/ARIA/apg/patterns/grid/'
      - 'https://www.w3.org/TR/WCAG22/#status-messages'
  - id: 'fsd-a-a7-2-004'
    level: 'middle'
    question: 'После сохранения диалог закрывается, обработанная строка исчезает из фильтра. Пользователь последовательно проверяет записи; следующая доступная строка есть. Как вернуть фокус с сохранением этого рабочего контекста?'
    options:
      - text: 'На управление следующей записи, с fallback к заголовку списка'
        why: 'Продолжается последовательная задача; цель определяет экран по актуальному содержимому.'
        correct: true
      - text: 'На поиск в верхней части кабинета с началом Tab-порядка'
        why: 'Пользователю придётся заново находить место последовательной обработки.'
      - text: 'На всплывающее сообщение успеха вместо элемента рабочего списка'
        why: 'Статус можно объявить без переноса фокуса в временную область, не продолжающую задачу.'
      - text: 'На первую строку текущей страницы после каждой обработки'
        why: 'Начало страницы не соответствует текущему месту и заставляет повторять пройденный путь.'
    explanation: 'Возврат фокуса — часть сценария, не механическое focus на старом ref. Если инициатор исчез, выбирают ближайшую устойчивую область или следующий необходимый шаг. Компоненту нужен контракт с экраном для таких переходов; одной внутренней реализации диалога недостаточно.'
    topic: 'A7. Cross-cutting requirements'
    subtopic: 'A7.2 Accessibility architecture'
    links:
      - 'https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/'
      - 'https://www.w3.org/WAI/ARIA/apg/patterns/grid/'
