  - id: 'fsd-a-a7-3-001'
    level: 'middle'
    question: 'Пользователи реже заканчивают оформление, но JS errors не выросли. Что измерить для диагностики, не приравнивая разные сигналы?'
    options:
      - text: 'Связать воронку действий, время шага и сетевые исходы с JS errors'
        why: 'Продуктовое завершение, latency, исключения и HTTP-причины останутся различимыми.'
        correct: true
      - text: 'Считать долю действий с JS exception основной долей неуспешных оформлений'
        why: 'Отказ API или незавершённый путь может не создавать исключения.'
      - text: 'Считать каждый HTTP 200 завершённым оформлением в воронке'
        why: 'Транспортный ответ не означает, что пользователь закончил нужную операцию.'
      - text: 'Оценивать UX шага по длительности API, исключив время до запроса и показа'
        why: 'Время интерфейса и путь пользователя могут регрессировать при прежнем времени API.'
    explanation: 'Продуктовые метрики, web performance, ошибки JS и сеть отвечают на разные вопросы. Их связывают контекстом сценария, но не подменяют одну другой. Для сравнения версий нужны знаменатель, сегменты и одинаковая семантика событий, иначе причина регрессии останется неясной.'
    topic: 'A7. Cross-cutting requirements'
    subtopic: 'A7.3 Observability'
    links:
      - 'https://www.w3.org/TR/trace-context/'
      - 'https://opentelemetry.io/docs/languages/js/propagation/'
      - 'https://opentelemetry.io/docs/security/handling-sensitive-data/'
  - id: 'fsd-a-a7-3-002'
    level: 'senior'
    question: 'Одно оформление вызывает несколько API и ограниченные retry. Саппорт должен связать пользовательский сбой с серверными логами. Что спроектировать?'
    options:
      - text: 'ID действия, span на попытку и перенос trace context в API'
        why: 'Действие связывает ветви, а отдельные попытки сохраняют причинную структуру retry.'
        correct: true
      - text: 'Несвязанный ID каждому запросу и поиск цепочки по близкому времени'
        why: 'Соседние обращения разных действий трудно надёжно сопоставить без общей идентичности.'
      - text: 'Одинаковый span ID каждому независимому HTTP-вызову как новому span'
        why: 'Разные операции потеряют различимость, хотя общий trace и разные spans могли бы сохранить связи.'
      - text: 'Связь запросов по URL формы и аккаунту вместо ID действия'
        why: 'Два параллельных оформления одного аккаунта могут иметь тот же адрес, а URL может содержать чувствительные параметры.'
    explanation: 'Correlation ID связывает наблюдения действия, trace context переносит причинную структуру вызовов. При retry полезно различать логическую операцию и попытки, не переиспользуя один span как все события. Cross-origin передача требует согласованных CORS и доверенных получателей; заголовок trace не является авторизацией.'
    topic: 'A7. Cross-cutting requirements'
    subtopic: 'A7.3 Observability'
    links:
      - 'https://www.w3.org/TR/trace-context/'
      - 'https://opentelemetry.io/docs/languages/js/propagation/'
      - 'https://opentelemetry.io/docs/security/handling-sensitive-data/'
  - id: 'fsd-a-a7-3-003'
    level: 'middle'
    question: 'Телеметрия формы сейчас пишет полный URL, тело запроса и токен. Какие меры уменьшают утечку, сохраняя диагностику?'
    multiple: true
    options:
      - text: 'Редакция URL и секретов до отправки в сборщик'
        why: 'Фильтрация на клиентской границе предотвращает уход исходного секрета.'
        correct: true
      - text: 'Хеширование любого текста формы как автоматическую анонимизацию'
        why: 'Низкоэнтропийные или связываемые значения могут оставаться чувствительными.'
      - text: 'Отправка всего тела с последующим скрытием в интерфейсе аналитики'
        why: 'Данные уже переданы и могут храниться или обрабатываться до сокрытия.'
      - text: 'Allowlist технических полей и кодов ошибок вместо полного тела'
        why: 'Явная разрешённая схема ограничивает объём чувствительных данных.'
        correct: true
      - text: 'Не включать чувствительные поля формы в baggage внешних вызовов'
        correct: true
        why: 'Контекст трассировки тоже передаётся другим сервисам и должен подчиняться политике минимизации.'
    explanation: 'Приватность телеметрии начинается с минимизации и схемы событий до передачи. URL, baggage, произвольные атрибуты и сообщения ошибок тоже могут содержать секреты. Псевдонимизация не всегда анонимизация; нужны ограничения доступа, срок хранения и проверка реальных payload.'
    topic: 'A7. Cross-cutting requirements'
    subtopic: 'A7.3 Observability'
    links:
      - 'https://www.w3.org/TR/trace-context/'
      - 'https://opentelemetry.io/docs/languages/js/propagation/'
      - 'https://opentelemetry.io/docs/security/handling-sensitive-data/'
  - id: 'fsd-a-a7-3-004'
    level: 'middle'
    question: 'Новая версия добавила повтор запросов. В графике число HTTP-ошибок выросло, а доля завершённых действий не изменилась. Как оценить?'
    options:
      - text: 'Считать отсутствие JS exceptions доказательством безопасного rollout'
        why: 'Регрессия может происходить в сети и пользовательском времени.'
      - text: 'Игнорировать рост HTTP-ошибок при неизменной конверсии'
        why: 'Дополнительная нагрузка и хвост задержки всё ещё могут быть существенными.'
      - text: 'Разделить попытки и действия, проверить задержку и нагрузку'
        why: 'Retry меняет количество сетевых событий без равного изменения продуктовых исходов.'
        correct: true
      - text: 'Считать каждый retry отдельным новым провалом пользователя'
        why: 'Одно действие будет многократно учтено как несколько людей или намерений.'
    explanation: 'Наблюдаемость должна сохранять семантику единицы измерения. Действие, попытка и span не взаимозаменяемы. Оценка надёжности включает завершение, latency, число попыток и воздействие на сервис; один благополучный график не доказывает отсутствие цены.'
    topic: 'A7. Cross-cutting requirements'
    subtopic: 'A7.3 Observability'
    links:
      - 'https://www.w3.org/TR/trace-context/'
      - 'https://opentelemetry.io/docs/languages/js/propagation/'
      - 'https://opentelemetry.io/docs/security/handling-sensitive-data/'
  - id: 'fsd-a-a7-4-001'
    level: 'middle'
    question: 'Главный риск формы — неверное согласование запроса с API при условной записи. Верстка стабильна. Какой тест непосредственно проверяет этот риск?'
    options:
      - text: 'E2E успешной отправки с всегда успешным замоканным API'
        why: 'Happy path не проверяет отказ условной записи и согласованность версий на границе.'
      - text: 'Snapshot визуального состояния управления сохранением'
        why: 'Вид не проверяет сетевой договор версии и отказ предусловия.'
      - text: 'Проверка контракта запроса, версии и отказа предусловия'
        why: 'Проверяется граница и отказ предусловия, а не только локальная функция.'
        correct: true
      - text: 'Unit: запрос соответствует локальному TypeScript-типу'
        why: 'Совпадение с локальным типом не доказывает соответствие реальному контракту сервера и его исходам.'
    explanation: 'Уровень теста выбирают по месту риска. Unit полезен для чистых переходов, integration — для координации, contract — для договоров границы, E2E — для целого пользовательского пути. Максимальное число одного типа тестов не заменяет покрытие нужных отказов.'
    topic: 'A7. Cross-cutting requirements'
    subtopic: 'A7.4 Testability & rollout'
    links:
      - 'https://martinfowler.com/articles/feature-toggles.html'
      - 'https://www.w3.org/TR/trace-context/'
      - 'https://reactrouter.com/start/framework/data-loading'
      - 'https://martinfowler.com/bliki/UnitTest.html'
  - id: 'fsd-a-a7-4-002'
    level: 'middle'
    question: 'Новая форма использует autosave, навигационное предупреждение и обновление сессии. Нужно проверить согласование модели с API и уходом пользователя. Какие проверки дополняют unit переходов?'
    multiple: true
    options:
      - text: 'Integration с поздним ack и новым вводом во время сохранения'
        why: 'Проверяется связь редакции, сетевого исхода и состояния формы.'
        correct: true
      - text: 'E2E ухода и возврата с сохранением актуального черновика'
        why: 'Реальная навигация и восстановление пересекают границы нескольких подсистем.'
        correct: true
      - text: 'Unit: любой успешный ack переводит текущую форму в saved'
        why: 'Такое ожидание неправильно: ack старой редакции не подтверждает новый ввод.'
      - text: 'E2E: перед уходом очистить черновик и проверить отсутствие предупреждения'
        why: 'Тест обходит риск несохранённой работы вместо проверки поведения при ней.'
      - text: 'Contract-проверка редакции и машинных исходов ответа API'
        correct: true
        why: 'Она проверяет договор, на котором основаны подтверждение сохранения и обработка отказов.'
    explanation: 'Набор проверок должен пересекать границы, где возможна ошибка. Для autosave важны порядок, lifecycle и доступный UX восстановления; для API — контракт и версии. Сквозные тесты дороже и менее локальны, поэтому ими проверяют значимые пути, а не каждую чистую ветку.'
    topic: 'A7. Cross-cutting requirements'
    subtopic: 'A7.4 Testability & rollout'
    links:
      - 'https://martinfowler.com/articles/feature-toggles.html'
      - 'https://www.w3.org/TR/trace-context/'
      - 'https://reactrouter.com/start/framework/data-loading'
      - 'https://martinfowler.com/bliki/UnitTest.html'
  - id: 'fsd-a-a7-4-003'
    level: 'senior'
    question: 'Новый клиентский путь записи выкатывают на 5% аккаунтов. Вкладки живут долго, запрос старого пути может быть in-flight при выключении флага. Что требуется для rollback?'
    options:
      - text: 'При выключении флага начать старый путь поверх незавершённого нового'
        why: 'Переключение может запустить второй эффект для той же работы; нужна политика завершения in-flight и совместимости.'
      - text: 'Удалить новый API сразу после переключения флага в false'
        why: 'Открытые клиенты и запросы могут продолжать им пользоваться.'
      - text: 'Случайно выбирать флаг заново при каждом рендере'
        why: 'Один сценарий может перескакивать между несовместимыми моделями.'
      - text: 'Стабильная когорта, совместимость и переход in-flight'
        why: 'Выключение выбора пути не отменяет уже начатые эффекты.'
        correct: true
    explanation: 'Feature flag отделяет поставку кода от включения поведения. Staged rollout требует стабильной аудитории, наблюдения и пути выключения; rollback учитывает уже выполненные эффекты и сохранённое состояние. Клиентский флаг не является проверкой прав и не заменяет серверную совместимость.'
    topic: 'A7. Cross-cutting requirements'
    subtopic: 'A7.4 Testability & rollout'
    links:
      - 'https://martinfowler.com/articles/feature-toggles.html'
      - 'https://www.w3.org/TR/trace-context/'
      - 'https://reactrouter.com/start/framework/data-loading'
      - 'https://martinfowler.com/bliki/UnitTest.html'
  - id: 'fsd-a-a7-4-004'
    level: 'senior'
    question: 'Новый autosave возвращает 202 после постановки записи в очередь. Финальный статус и подтверждённая редакция недоступны, но UI планируют отмечать saved по 202. Цель rollout — доказать сохранение текущего текста. Какое решение принять до включения?'
    options:
      - text: 'Отложить включение до финального подтверждения и метрик saved редакции'
        why: 'Иначе метрика приёма запросов подменит нужное серверное сохранение текста.'
        correct: true
      - text: 'Включить на 5%, оценивать сохранение по доле ответов 202'
        why: 'Когорта уменьшает масштаб риска, но выбранная метрика не измеряет конечный результат.'
      - text: 'Добавить unit для перехода 202→saved и включить по его успешности'
        why: 'Тест закрепит неподтверждённую гарантию и не увидит отказ после очереди.'
      - text: 'Включить с откатом по росту HTTP 4xx/5xx у отправок'
        why: 'Асинхронная запись может не завершиться после принятого 202, не дав такого ответа отправителю.'
    explanation: 'Проверяемость решения требует наблюдать тот результат, который обещает UI. 202 в данном контракте подтверждает приём в очередь, поэтому не доказывает saved текущей редакции. До включения нужен договор финального исхода, идентичности редакции и соответствующие тесты/метрики. После этого staged rollout ограничивает риск и имеет наблюдаемые критерии остановки, а не опирается на счётчик принятых запросов.'
    topic: 'A7. Cross-cutting requirements'
    subtopic: 'A7.4 Testability & rollout'
    links:
      - 'https://martinfowler.com/articles/feature-toggles.html'
      - 'https://www.w3.org/TR/trace-context/'
      - 'https://reactrouter.com/start/framework/data-loading'
      - 'https://martinfowler.com/bliki/UnitTest.html'
  - id: 'fsd-a-a7-4-005'
    level: 'middle'
    question: 'Модель autosave выделена как чистые переходы по событиям. Нужно быстро проверить много комбинаций и невозможные состояния без браузера и сети. Какой уровень достаточен для проверки самой модели?'
    options:
      - text: 'Unit-тесты таблицы переходов и инвариантов модели'
        correct: true
        why: 'Чистую логику можно перебрать непосредственно, без дорогих внешних границ.'
      - text: 'Contract-тесты схемы ответа API вместо переходов'
        why: 'Совместимость данных на границе не проверяет внутренние комбинации событий модели.'
      - text: 'E2E в браузере для каждого сочетания локальных событий'
        why: 'Это вводит исключённые зависимости и издержки для проверки, доступной на чистом уровне.'
      - text: 'Snapshot DOM формы вместо проверки инвариантов'
        why: 'Внешний снимок не гарантирует покрытие логических переходов и невозможных сочетаний.'
    explanation: 'Unit подходит для детерминированной логики с явными входами и выходами. Его дешевизна позволяет покрыть больше сочетаний, но успешная проверка модели не доказывает сетевую координацию, контракт API или навигацию. Эти риски дополняют integration, contract и значимыми E2E-сценариями, не заменяя ими всю локальную проверку.'
    topic: 'A7. Cross-cutting requirements'
    subtopic: 'A7.4 Testability & rollout'
    links:
      - 'https://martinfowler.com/articles/feature-toggles.html'
      - 'https://www.w3.org/TR/trace-context/'
      - 'https://reactrouter.com/start/framework/data-loading'
      - 'https://martinfowler.com/bliki/UnitTest.html'
  - id: 'fsd-a-a7-4-006'
    level: 'senior'
    question: 'Критический путь включён клиентским флагом. Конфигурация в старых вкладках может не обновляться часами, а при аварии нужно остановить приём новых записей за минуту. Какой rollback соответствует этому требованию?'
    options:
      - text: 'Отключить приём на серверной границе и обновлять клиентский UX по доступности'
        why: 'Сервер может контролировать новые эффекты независимо от свежести конфигурации открытой вкладки.'
        correct: true
      - text: 'Изменить удалённый клиентский флаг и считать минутный срок обеспеченным'
        why: 'Вкладки со старой конфигурацией могут продолжать посылать команды.'
      - text: 'Удалить новый chunk и рассчитывать на немедленную остановку вкладок'
        why: 'Уже загруженный код продолжает выполняться без нового чтения ассета.'
      - text: 'Откатить вид кнопки при следующем фокусе вместо серверного ограничения'
        why: 'Новая запись может прийти до обновления UI или из другого клиента.'
    explanation: 'Клиентский флаг управляет поведением клиента в пределах его обновляемости. Для жёсткого срока остановки новых эффектов нужен контролируемый серверный приём и соответствующий отказ API. Уже начатые операции завершаются по своему контракту: выключение не означает их отмены. UI получает понятное состояние недоступности и сохраняет разрешённый ввод, а не молча теряет работу.'
    topic: 'A7. Cross-cutting requirements'
    subtopic: 'A7.4 Testability & rollout'
    links:
      - 'https://martinfowler.com/articles/feature-toggles.html'
      - 'https://www.w3.org/TR/trace-context/'
      - 'https://reactrouter.com/start/framework/data-loading'
      - 'https://martinfowler.com/bliki/UnitTest.html'
