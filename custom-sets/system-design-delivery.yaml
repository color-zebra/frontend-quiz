title: 'Системный дизайн: доставка и качество'
lessons:
  - id: sdr-intro
    topic: Введение
    subtopic: Путь продукта к человеку
    title: Как продукт доезжает до человека
    body: |
      ## Какую проблему решаем

      За два курса мы спроектировали сервис доставки еды: выяснили требования, разделили клиент на части, решили, кто
      владеет какими данными, описали API и научили клиент жить в настоящей сети — с кэшем, повторами, конфликтами
      и работой без связи. На ноутбуке разработчика всё это работает.

      Теперь сервис вырос, и вопросы звучат по-другому:

      - **маркетолог:** «Страница ресторана открывается у покупателей четыре секунды, а у конкурентов — две. И в поиске
        её почти не видно»;
      - **поддержка:** «Человек был на шаге оплаты, вы выкатили новую версию — и у него вместо кнопки белый экран»;
      - **служба безопасности:** «Ресторан вставил в описание кусок кода, и у покупателей на странице появилось
        чужое окно оплаты»;
      - **покупатель с программой экранного чтения:** «Статус заказа сменился, а я об этом не узнал»;
      - **разработчик:** «У части людей не проходит оплата, но мы не знаем у кого и почему»;
      - **бизнес:** «Через полгода запускаемся в Дубае: арабский язык, дирхамы, другое время».

      Ни один из этих вопросов не про логику корзины или заказа. Они про то, как продукт **доезжает до человека**:
      как быстро он появляется на экране, как выходят новые версии, можно ли ему доверять, могут ли им пользоваться
      все и понятен ли он людям в другой стране. Об этом курс.

      ## Что добавляется, когда продукт вырос

      Курс делится на две большие части.

      **Рендеринг и доставка** — как страница попадает на экран и как обновляется.
      - Как измерить скорость: какие метрики видят люди и Google и чем замер на ноутбуке отличается от данных реальных
        пользователей.
      - Где собирать страницу: в браузере, на сервере или заранее при сборке — и почему для разных страниц одного
        продукта ответ разный.
      - Что грузить сразу, а что потом: какой код нужен первому экрану, а какой может подождать.
      - Маршруты и переходы: как переходить между экранами, не теряя место и не выстраивая запросы в очередь.
      - Картинки и видео: как отдать фото блюда так, чтобы оно было чётким и не съело трафик.
      - Кэш файлов и выкатка новой версии: что происходит с вкладкой, открытой со вчерашнего дня.
      - Service Worker: как приложение курьера открывается без сети и как ему сообщить о новой версии.

      **Сквозные требования** — свойства, которые нельзя сделать «в одном модуле»: они проходят через всё приложение.
      - Безопасность: где кончается доверие и как чужой текст не превращается в код на странице.
      - Доступность: как сделать, чтобы сценарии целиком работали с клавиатуры и экранного чтеца.
      - Наблюдаемость: как узнать, что происходит у пользователей, и связать ошибку на телефоне с логами сервера.
      - Проверки и выкатка: какие тесты против какого риска и как выпускать новое не всем сразу.
      - Локализация: языки, валюты, часовые пояса и письмо справа налево.

      Почему эти темы в одном курсе? Они держатся друг за друга. Наблюдаемость опирается на метрики скорости, выкатка —
      на кэш файлов, загрузка переводов — на разбиение кода, а защита от чужих скриптов — на то, как сервер отдаёт
      страницу. Курс «Реальное время и большие списки» идёт параллельно этому и почти от него не зависит: он про данные,
      которых много и которые меняются сами.

      ## Как курс опирается на первые два

      Здесь не будет заново объяснено то, что уже разобрано подробно. Если урок опирается на прошлый материал, он
      напоминает его одной-двумя фразами и называет урок.

      - Атрибуты качества и Web Vitals одной строкой — курс 1, «Как превратить „быстро“ в цифры». Здесь метрики
        разберём подробно.
      - Адрес страницы как контракт — курс 1, «Что переживает перезагрузку». Здесь — вложенные маршруты и переходы.
      - Клавиатура, фокус и роли в компоненте — курс 1, «Компонент как контракт». Здесь — доступность целых сценариев.
      - Кэш данных и его свежесть — курс 2, «Как устроен клиентский кэш» и «Когда данные устаревают». Здесь — кэш
        файлов приложения, это другой кэш.
      - Загрузка фото в хранилище — курс 2, «Загрузка файлов». Здесь — как эти фото отдать покупателю.
      - Идентификатор операции — курс 2, «Повторы без двойных списаний». Здесь он же поможет найти сбой в логах.

      ## Что нового в сервисе доставки

      Сквозной пример тот же. В этом курсе в нём появятся:

      - **публичные страницы ресторанов,** которые находят поисковики и которыми делятся в мессенджерах. Это требование
        мы записали ещё в первом уроке о требованиях, а теперь его выполним;
      - **фото блюд,** которые ресторан загрузил в курсе 2, — их нужно быстро отдать на телефон;
      - **выкатка новой версии** несколько раз в день, пока у кого-то открыта вкладка с оформлением;
      - **приложение курьера,** которое открывается без сети;
      - **описание ресторана с форматированием,** которое ресторан пишет сам, а видит каждый покупатель;
      - **новое оформление заказа,** которое выкатывают сначала на 5 % покупателей;
      - **выход в ОАЭ:** арабский язык, дирхамы и часовой пояс Дубая.

      ## Типичные ошибки

      - **Думать о скорости после запуска.** Способ рендеринга и размер кода закладываются в начале; через полгода их
        меняют месяцами.
      - **Считать безопасность и доступность задачами «на потом».** Они проходят через всё приложение, и добавить их
        позже — значит переделать многое.
      - **Мерить скорость только на своём ноутбуке.** Покупатели открывают сайт на недорогих телефонах в электричке.
      - **Выкатывать всем сразу без пути назад.** Ошибка в оформлении заказа за минуту доходит до всех покупателей.

      ## Как спрашивают на интервью

      - «Как сделать, чтобы страница товара быстро открывалась и находилась в поиске?» — разговор о метриках, способе
        рендеринга, коде и картинках.
      - «Что вы сделаете, чтобы безопасно выкатить важное изменение?» — флаги, выкатка на часть людей, наблюдаемость.
      - На собеседовании по плану RADIO эти темы — шаг «оптимизации» (Optimizations) и вопросы о нефункциональных
        требованиях.

      ## Коротко

      - Этот курс о том, как продукт доезжает до человека: быстро ли он появляется на экране, как выходят новые
        версии, можно ли ему доверять, могут ли им пользоваться все и понятен ли он в другой стране.
      - Первая часть — о том, как страница доезжает до экрана и обновляется: как быстро она появляется и отвечает,
        где собирается, какой код и какие картинки грузятся сразу и как выходят новые версии.
      - Вторая часть — о свойствах, которые нельзя сделать в одном модуле: безопасность, доступность, наблюдаемость,
        выкатка и локализация касаются каждого экрана, поэтому их закладывают общими решениями с самого начала.
      - Темы курса держатся друг за друга, а курс «Реальное время и большие списки» почти от него не зависит.

      ## Источники

      - [Web Vitals — web.dev](https://web.dev/articles/vitals)
      - [Introduction to Web Accessibility — W3C WAI](https://www.w3.org/WAI/fundamentals/accessibility-intro/)

  - id: sdr-vitals
    topic: Рендеринг и доставка
    subtopic: Метрики скорости
    title: Как измерить скорость
    body: |
      ## Какую проблему решаем

      В курсе 1, в уроке «Как превратить „быстро“ в цифры», мы записали требование: меню ресторана открывается
      за 2,5 секунды на 75-м процентиле у телефонов. Команда сделала страницу, разработчик запустил проверку в браузере
      на своём ноутбуке и получил 1,2 секунды. Всё хорошо?

      Через месяц маркетолог показывает отчёт по настоящим покупателям: 75-й процентиль появления меню —
      4,1 секунды, а не 2,5: у каждого четвёртого покупателя меню появляется ещё дольше. Ещё жалуются, что кнопка «В корзину» иногда «залипает», а страница прыгает: человек целится в одно
      блюдо и попадает в соседнее.

      Разработчик не врал и не ошибся. Он мерил другое: на другом устройстве, при другой сети, одну загрузку вместо
      тысяч. И мерил одно число, хотя жалобы о трёх разных вещах: страница долго появляется, медленно отвечает на
      нажатия и прыгает. Этот урок о том, что именно измерять, как и где, и какие решения на какое число влияют.

      ## Три вопроса человека — три метрики

      Пока страница грузится и работает, человек задаёт себе три вопроса: «Показалось ли то, ради чего я пришёл?»,
      «Ответила ли страница на моё нажатие?» и «Не прыгает ли всё у меня под пальцем?». Google описывает их набором
      метрик **Web Vitals**, а три главные называет **Core Web Vitals** — основными. Их пороги одни и те же для любых
      сайтов, и Google учитывает их при ранжировании в поиске.

      | Метрика | Хорошо | Плохо |
      |---|---|---|
      | LCP | до 2,5 с | больше 4 с |
      | INP | до 200 мс | больше 500 мс |
      | CLS | до 0,1 | больше 0,25 |

      Между «хорошо» и «плохо» лежит зона «нужно улучшить».

      ### LCP: показалось ли главное

      **LCP** (Largest Contentful Paint, «отрисовка самого крупного содержимого») — время от начала загрузки страницы
      до момента, когда отрисовался самый крупный элемент в видимой части экрана: картинка, видео с обложкой или блок
      текста. На странице ресторана это обычно фото-обложка, в статье — первый абзац или главная иллюстрация.

      Почему самый крупный? Исследования показали, что именно он лучше всего совпадает с моментом, когда человек считает
      страницу загруженной. Спиннер или пустая шапка, которые появились быстро, человека не успокаивают.

      ### INP: ответила ли страница на нажатие

      **INP** (Interaction to Next Paint, «от взаимодействия до следующей отрисовки») — сколько проходит от нажатия,
      касания или клавиши до момента, когда браузер нарисовал следующий кадр, то есть показал реакцию. Метрика
      наблюдает за всеми взаимодействиями за всё время на странице и берёт одно из самых медленных: если человек
      сделал больше 50 действий, одно самое медленное на каждые 50 отбрасывают как случайный выброс.

      Задержка одного взаимодействия складывается из трёх частей:

      1. **Задержка ввода** — браузер занят другой работой, например выполняет скрипт, и не может сразу обработать
         нажатие.
      2. **Обработка** — работают ваши обработчики события.
      3. **Задержка отрисовки** — браузер пересчитывает вёрстку и рисует новый кадр.

      Отсюда главное: у браузера один **основной поток** (main thread), и на нём выполняются и ваш JavaScript,
      и отрисовка. Пока он занят долгой задачей, нажатие ждёт. Долгой задачей (long task) называют работу дольше
      50 миллисекунд без перерыва.

      ### CLS: не прыгает ли страница

      **CLS** (Cumulative Layout Shift, «суммарный сдвиг вёрстки») — насколько неожиданно смещаются видимые элементы,
      пока человек на странице. Каждый сдвиг оценивается по двум множителям: какую долю экрана занимают сдвинувшиеся
      элементы и на какую долю экрана они уехали. Сдвиги, которые идут один за другим, складываются в группу, и CLS —
      это самая крупная такая группа за всё время на странице.

      Не всякий сдвиг считается. Если вёрстка поменялась в течение полсекунды после нажатия человека — раскрылся список,
      который он открыл, — это ожидаемо, и в CLS не входит. Плохо, когда страница двигается сама: догрузилась картинка
      без заданного размера, сверху вставился баннер, подменился шрифт.

      ### Почему 75-й процентиль

      Пороги проверяют по 75-му процентилю всех открытий страницы — отдельно для телефонов и для компьютеров. Что такое
      процентиль и почему он лучше среднего, разобрано в курсе 1, в уроке «Как превратить „быстро“ в цифры»; здесь
      правило одно: страница «хорошая», если так быстро как минимум у трёх посетителей из четырёх.

      ## Лаборатория и реальные пользователи

      Скорость измеряют двумя способами, и они отвечают на разные вопросы.

      **Лабораторный замер** (lab data) — одна или несколько загрузок в заданных условиях: Lighthouse во вкладке
      инструментов разработчика, проверка в сборке. Условия — модель телефона, скорость сети, процессор — задаёт тот,
      кто мерит, и часто имитирует медленный телефон замедлением процессора и сети.

      **Данные реальных пользователей** (field data, RUM — real user monitoring) — замеры, которые собираются в браузерах
      настоящих посетителей и отправляются на сервер. Открытый источник таких данных — **Chrome UX Report** (CrUX):
      Google собирает Web Vitals у пользователей Chrome, которые на это согласились, и публикует их по сайтам
      за последние 28 дней. Собирать свои данные помогает небольшая библиотека `web-vitals` от команды Chrome.

      - **Лабораторный замер**
        - Что даёт: повторяемость, подробную разбивку, можно мерить до выпуска.
        - Чем ограничен: одно устройство и одна сеть; нет настоящих нажатий, поэтому INP в лаборатории не измерить —
          Lighthouse показывает вместо него общее время блокировки основного потока (Total Blocking Time).
      - **Данные реальных пользователей**
        - Что даёт: правду о том, что видят люди, на всех их телефонах и сетях.
        - Чем ограничен: приходит уже после выпуска, шумит, хуже объясняет причину.

      Почему числа расходятся? В лаборатории одна загрузка с пустым кэшем на одной модели и одной сети. У реальных людей —
      старые телефоны, у которых процессор в несколько раз медленнее, мобильная сеть с потерями, расширения браузера,
      повторные визиты с прогретым кэшем, люди, которые прокрутили страницу до конца загрузки. Для решений о продукте
      главное — данные реальных пользователей; лабораторный замер нужен, чтобы найти причину и проверить исправление до
      выпуска.

      ## Какие решения на какую метрику влияют

      Метрики полезны тем, что каждая указывает на свою группу архитектурных решений.

      **LCP** складывается из четырёх отрезков:

      1. **Время до первого байта** (TTFB, time to first byte) — пока сервер не начал отвечать, ничего не происходит.
         Влияет: где и как собирается страница, расстояние до сервера, кэш на CDN.
      2. **Задержка загрузки ресурса** — время, пока браузер не узнал, что главную картинку надо грузить. Если картинка
         есть в HTML, браузер находит её сразу. Если её вставляет скрипт после загрузки данных, задержка растёт на всё
         время работы скрипта.
      3. **Загрузка ресурса** — сколько качается сама картинка. Влияет её размер и формат.
      4. **Задержка отрисовки** — картинка скачана, но её не рисуют: браузер ждёт стилей или скриптов, которые
         блокируют отрисовку.

      **INP** зависит от того, сколько JavaScript выполняется в основном потоке и насколько тяжёлые обработчики. Большой
      объём кода, который выполняется при загрузке, длинные вычисления в обработчике нажатия, перерисовка огромного
      списка — всё это растит INP.

      **CLS** зависит от того, зарезервировано ли место под то, что появится позже: картинки без размеров, рекламу
      и баннеры, вставку содержимого сверху, смену шрифта.

      Как каждое из этих решений принимать, разбирают следующие уроки: где собирать страницу, что грузить сразу,
      как отдавать картинки. Тяжёлые вычисления без зависаний — тема курса «Реальное время и большие списки».

      ## Пример целиком: страница ресторана

      Отчёт по реальным пользователям показал для страницы ресторана на телефонах LCP 4,1 секунды на 75-м процентиле.
      LCP-элемент — фото-обложка ресторана. Команда открыла страницу в лаборатории с замедлением до «телефона среднего
      уровня» и сети 1,6 Мбит/с с задержкой 150 мс и разложила LCP на отрезки:

      | Отрезок | Время |
      |---|---|
      | До первого байта | 0,8 с |
      | Задержка загрузки | 1,6 с |
      | Загрузка фото | 1,2 с |
      | Задержка отрисовки | 0,5 с |

      Сразу видно главное: 1,6 секунды браузер просто не знает, что нужно грузить обложку. Страница собирается в браузере:
      сервер отдаёт пустой HTML, скрипт загружается, запрашивает данные ресторана и только потом вставляет `<img>`.
      Вторая проблема — обложка весит 240 КБ: это JPEG вдвое шире экрана телефона.

      Что из этого следует для архитектуры:

      - отдавать страницу ресторана готовым HTML, чтобы обложка была в нём с самого начала, — урок «Где собирать
        страницу»;
      - подсказать браузеру, что обложка — самое важное, и отдавать её под размер экрана — урок «Картинки и видео»;
      - не держать в первом экране скрипты, которые блокируют отрисовку, — урок «Что грузить сразу, а что потом».

      А «залипающая» кнопка и прыгающая страница — это INP и CLS. Первый растёт от тяжёлого кода, который выполняется
      при загрузке; второй — от фото блюд без заданных размеров: картинка догружается и сдвигает всё под собой.

      После изменений команда снова смотрит на данные реальных пользователей, а не на лабораторное число: успехом
      считается 75-й процентиль на телефонах ниже 2,5 секунды.

      ## Как выбрать, на что смотреть

      - **Собрать данные реальных пользователей** по трём метрикам, по типам страниц и отдельно для телефонов. Это
        основа: без них не понять, есть ли проблема.
      - **Найти худшую метрику на важной странице** и разложить её в лаборатории на части. Для LCP — четыре отрезка,
        для INP — какие взаимодействия медленные и чем занят основной поток.
      - **Исправлять причину, а не число.** Если обложка находится поздно, сжатие картинки и быстрый сервер
        помогут мало: они укоротят свои отрезки, а самый большой останется, пока обложки нет в HTML.
      - **Проверять результат на реальных пользователях** после выпуска, а лабораторный замер держать в сборке, чтобы
        не пропустить ухудшение.

      ## Типичные ошибки

      - **Судить по одной лабораторной загрузке на своём ноутбуке.** Быстрый процессор и офисная сеть рисуют картину,
        которой нет у покупателей.
      - **Смотреть на среднее.** Пороги задуманы для 75-го процентиля; среднее прячет тех, у кого медленно.
      - **Считать скорость одним числом.** Быстро появившаяся страница может медленно отвечать на нажатия и прыгать.
      - **Ускорять сервер, когда LCP-картинка находится поздно.** Узкое место — задержка загрузки ресурса, а не ответ
        сервера.
      - **Не задавать размеры картинкам и рекламным местам.** Страница прыгает при каждой догрузке, CLS растёт.

      ## Как спрашивают на интервью

      - «Как вы поймёте, что страница быстрая?» — ждут три метрики, их пороги, 75-й процентиль и разницу между лабораторией
        и реальными пользователями.
      - «LCP плохой — что будете делать?» — ждут разложения на отрезки и того, что исправляют самый большой из них.
      - «Почему у вас в Lighthouse 95 баллов, а пользователи жалуются?» — ждут разговора о разных устройствах, сетях
        и об INP, который в лаборатории не измерить.

      ## Коротко

      - Скорость — это три разных вопроса человека и три метрики Core Web Vitals: LCP (показалось ли главное),
        INP (ответила ли страница на нажатие) и CLS (не прыгает ли страница). Хорошие пороги — 2,5 с, 200 мс и 0,1.
      - Пороги проверяют по 75-му процентилю открытий отдельно для телефонов и компьютеров: страница хорошая, если так
        как минимум у трёх посетителей из четырёх.
      - INP растёт, пока основной поток занят: нажатие ждёт, если браузер выполняет долгую задачу, а задержка складывается
        из ожидания, работы обработчиков и отрисовки.
      - CLS растёт от неожиданных сдвигов: картинок без размеров, вставки сверху, смены шрифта. Сдвиги в течение полсекунды
        после нажатия человека не считаются.
      - Лабораторный замер повторяем и подробен, но это одно устройство и одна сеть, и INP в нём не измерить. Решения
        о продукте принимают по данным реальных пользователей (RUM, Chrome UX Report), а лабораторию используют, чтобы
        найти причину.
      - LCP раскладывают на время до первого байта, задержку загрузки ресурса, его загрузку и задержку отрисовки, и
        исправляют самый большой отрезок. Если главная картинка появляется в HTML только после скрипта, сжатие и быстрый
        сервер помогут мало.

      ## Источники

      - [Web Vitals — web.dev](https://web.dev/articles/vitals)
      - [Optimize Largest Contentful Paint: разбивка LCP на отрезки — web.dev](https://web.dev/articles/optimize-lcp)
      - [Interaction to Next Paint (INP) — web.dev](https://web.dev/articles/inp)

  - id: sdr-rendering
    topic: Рендеринг и доставка
    subtopic: Выбор способа рендеринга
    title: Где собирать страницу
    body: |
      ## Какую проблему решаем

      Первая версия сервиса доставки — одностраничное приложение. На любой адрес сервер отдаёт один и тот же почти
      пустой HTML: `<div id="root"></div>` и ссылку на скрипт. Скрипт загружается, спрашивает у API данные и рисует
      страницу.

      Для корзины и оформления это нормально. А со страницей ресторана три беды:

      - **ссылку в мессенджере никто не открывает:** превью пустое, без названия и фото — мессенджер посмотрел HTML
        с сервера, а там ничего нет;
      - **страница плохо находится в поиске:** не каждый робот выполняет скрипты, а те, что умеют, делают это не сразу
        и не всегда;
      - **LCP — 4,1 секунды:** как мы видели в прошлом уроке, обложку браузер узнаёт только после того, как скрипт
        загрузился и получил данные.

      Кто-то в команде предлагает: «Давайте всё рендерить на сервере». Но тогда сервер собирает HTML на каждый запрос,
      в том числе для кабинета ресторана, которому поисковики не нужны, а пик запросов в пятницу вечером ложится
      на серверы рендеринга. Этот урок о том, какие бывают способы собрать страницу и как выбрать свой для каждого
      маршрута.

      ## Четыре способа собрать страницу

      **Рендеринг** — превращение данных и кода компонентов в HTML, который видит человек. Главный вопрос — **где
      и когда** это происходит.

      **CSR** (client-side rendering, рендеринг на клиенте) — сервер отдаёт пустую оболочку и скрипт, страницу собирает
      браузер. Так работает обычное приложение на React без серверной части.

      **SSR** (server-side rendering, рендеринг на сервере) — на каждый запрос сервер получает данные, собирает готовый
      HTML и отдаёт его. Браузер сразу показывает содержимое, а потом загружает скрипт, чтобы страница стала
      интерактивной.

      **SSG** (static site generation, генерация статических страниц) — HTML собирают заранее, при сборке проекта,
      и кладут как файлы. Сервер ничего не собирает при запросе: файл отдаёт CDN — сеть серверов, которые хранят копии
      поближе к людям.

      **ISR** (incremental static regeneration, постепенная пересборка) — тот же заранее собранный HTML, но отдельные
      страницы пересобираются без пересборки всего сайта: по расписанию («не чаще раза в минуту») или по событию
      («ресторан изменил меню — пересобрать его страницу»). Название пришло из фреймворка Next.js; в других фреймворках
      та же идея зовётся по-своему.

      ## Что каждый способ даёт и чего стоит

      Сравним их по тому, что важно продукту.

      - **CSR**
        - Поисковики и превью: видят пустую страницу; часть поисковых роботов выполняет скрипты, но с задержкой.
        - Первое содержимое: после загрузки скрипта и данных — позже всех.
        - Нагрузка на сервер: только API, HTML — статический файл.
        - Свежесть: данные всегда свежие, их берут при открытии.
        - Когда подходит: личные экраны за входом — корзина, кабинет, настройки.
      - **SSR**
        - Поисковики и превью: видят готовый HTML.
        - Первое содержимое: сразу с ответом сервера, но ответ ждёт, пока сервер соберёт страницу.
        - Нагрузка на сервер: рендеринг на каждый запрос, пик трафика — пик нагрузки.
        - Свежесть: на момент запроса.
        - Когда подходит: страницы, которые зависят от запроса, — поиск, выдача с фильтрами, персональные страницы,
          которые должны быстро показаться.
      - **SSG**
        - Поисковики и превью: видят готовый HTML.
        - Первое содержимое: быстрее всех — файл с CDN.
        - Нагрузка на сервер: почти никакой при запросе, вся работа при сборке.
        - Свежесть: на момент сборки; изменилось — пересобирай.
        - Когда подходит: страницы, которые одинаковы для всех и меняются редко: статьи, документация, лендинги.
      - **ISR**
        - Поисковики и превью: видят готовый HTML.
        - Первое содержимое: как у SSG.
        - Нагрузка на сервер: пересборка отдельных страниц при изменении.
        - Свежесть: отстаёт на время до пересборки.
        - Когда подходит: много похожих страниц, которые меняются время от времени: карточки товаров, рестораны.

      Свежесть и стоимость тянут в разные стороны. Чем ближе момент сборки к моменту запроса, тем свежее страница
      и тем дороже каждый запрос. SSG и ISR дешёвы, потому что одну собранную страницу видят тысячи людей; SSR платит
      за каждого.

      ## Гидратация: видно, но ещё не работает

      У SSR, SSG и ISR есть общая цена. HTML пришёл, страница видна, но кнопки ещё не работают: обработчики событий
      живут в JavaScript. Браузер загружает скрипт, React строит из тех же данных то же дерево компонентов и связывает
      его с готовым HTML. Этот шаг называется **гидратация** (hydration): серверный HTML «оживает». В React для этого есть
      функция `hydrateRoot`.

      Пока гидратация не закончилась, страница выглядит готовой, а нажатия не срабатывают или срабатывают с задержкой.
      Человек жмёт «В корзину» — и ничего. Причём гидратация — тяжёлая работа в основном потоке: чем больше компонентов
      и кода, тем дольше заняты процессор и, значит, тем хуже INP на слабых телефонах.

      Отсюда важная мысль: SSR ускоряет **появление** содержимого (LCP), но не отменяет затрат на JavaScript. Если весь
      код по-прежнему грузится и выполняется в браузере, просто позже, интерактивность наступает не раньше, чем при CSR.

      ### Как ускоряют появление и уменьшают гидратацию

      - **Потоковая отдача** (streaming SSR) — сервер не ждёт, пока соберёт всю страницу, а отправляет HTML частями:
        сначала шапку и меню, потом медленные блоки вроде отзывов. В React так работают серверный рендеринг с `Suspense`
        и функции вроде `renderToPipeableStream`: пока блок не готов, на его месте заглушка, а готовая разметка приходит
        позже в том же ответе. Человек видит начало страницы раньше, медленный блок не держит быстрый. Объём кода, который нужно
        гидратировать, потоковая отдача не уменьшает, зато React может гидратировать готовые части по очереди.
      - **Частичная интерактивность** — оживлять не всю страницу, а только то, что действительно реагирует на нажатия.
        Архитектура **островов** (islands architecture): страница — статический HTML, а интерактивные части вроде
        кнопки «В корзину» или фильтра — отдельные «острова», каждый со своим небольшим скриптом. Так устроен, например,
        фреймворк Astro.
      - **Серверные компоненты** (React Server Components) — компоненты, которые выполняются только на сервере и не
        отправляют свой код в браузер. Список блюд с описаниями рисуется на сервере и в браузер приходит готовым,
        а скрипт нужен только для кнопок.

      Само слово «оживление» обманчиво: страница не становится живой по щелчку. Гидратация идёт постепенно, а при
      потоковой отдаче — по кусочкам, и разные части страницы становятся интерактивными в разное время.

      ![Три полосы времени для CSR, SSR и SSG. CSR: пустой экран, загрузка скрипта, запрос данных, затем содержимое и сразу интерактивность. SSR: ожидание сборки на сервере, затем содержимое, затем загрузка скрипта и гидратация, затем интерактивность. SSG: содержимое почти сразу с CDN, затем загрузка скрипта и гидратация, затем интерактивность](images/sdr-rendering.png "Когда появляется содержимое и когда страница начинает отвечать")

      ## Пример целиком: разные маршруты — разные способы

      У сервиса доставки маршруты очень разные, поэтому и способ у каждого свой. Решения записаны с причинами.

      - **Страница ресторана и меню** — SSG с пересборкой по событию (ISR).
        - Почему: страницу должны видеть поисковики и превью; она одинакова для всех покупателей; меню меняется
          несколько раз в день — ресторанов тысячи, пересобирать только изменившийся дёшево.
        - Цена: между изменением меню и пересборкой страница отстаёт. Поэтому стоп-лист и цены клиент всё равно
          перепроверяет после загрузки, как в курсе 2, в уроке «Когда данные устаревают», а окончательную цену считает
          сервер при оформлении.
      - **Каталог ресторанов с фильтрами** — SSR.
        - Почему: выдача зависит от адреса доставки и фильтров в адресе страницы; заранее собрать все сочетания нельзя,
          а превью и поисковики полезны.
        - Цена: нагрузка на рендеринг в пик. Зона доставки и фильтры лежат в адресе страницы, а не в cookie, поэтому
          ответы для популярных сочетаний можно кэшировать на CDN на короткое время.
      - **Корзина, оформление, отслеживание** — CSR.
        - Почему: страницы личные, поисковикам не нужны; человек приходит на них из уже загруженного приложения.
        - Цена: при прямом открытии по ссылке — пустая оболочка, пока не загрузится скрипт.
      - **Кабинет ресторана** — CSR.
        - Почему: за входом, поисковикам не нужен, работают на компьютерах в ресторане; важнее простота, чем первый
          показ.

      Такую смешанную схему называют **гибридным рендерингом**: способ выбирают для каждого маршрута отдельно. Современные
      фреймворки — Next.js, Nuxt, Remix и другие — позволяют задать его на уровне страницы.

      Что получилось со страницей ресторана: HTML приходит с CDN, обложка есть в нём с самого начала, превью в
      мессенджере строится по готовой разметке. LCP на телефонах опустился ниже 2,5 секунды. А кнопка «В корзину» —
      маленький интерактивный участок, и гидратировать нужно его и фильтр меню, а не описания всех блюд.

      ## Как выбрать

      Для каждого маршрута задайте вопросы по порядку:

      1. **Нужны ли поисковики и превью ссылок?** Нет — CSR почти всегда достаточно.
      2. **Одинакова ли страница для всех?** Да — её можно собрать заранее: SSG или ISR. Нет, зависит от запроса
         или человека — SSR или CSR.
      3. **Как часто меняются данные и насколько вредно отставание?** Редко — SSG. Время от времени, отставание
         на минуты терпимо — ISR. Нужна свежесть на момент запроса — SSR, а самое изменчивое догружают на клиенте.
      4. **Сколько интерактивности?** Мало кнопок на большой странице — подумайте об островах или серверных компонентах,
         чтобы не гидратировать лишнее.

      ## Типичные ошибки

      - **Один способ на весь продукт.** Всё на CSR — пустые превью и поздний LCP; всё на SSR — лишняя нагрузка
        на сервер ради страниц за входом.
      - **Считать, что SSR делает страницу быстрой целиком.** Содержимое появляется раньше, но если весь код всё равно
        выполняется в браузере, кнопки оживут не раньше.
      - **Не учитывать окно до гидратации.** Человек нажимает кнопку, которая выглядит готовой, а нажатие теряется.
      - **SSG для часто меняющихся данных без пересборки.** Страница показывает цены недельной давности.
      - **Доверять заранее собранной странице как окончательной.** Цена и наличие из HTML — тоже копия; решает
        сервер в момент заказа.

      ## Как спрашивают на интервью

      - «CSR или SSR для этого продукта?» — ждут, что вы спросите про поисковики, превью и свежесть данных и ответите
        по маршрутам, а не одним словом.
      - «Что такое гидратация и чем она плоха?» — ждут окна, когда страница видна, но не работает, и цены
        на JavaScript.
      - «Как сделать страницу товара быстрой и при этом с актуальной ценой?» — ждут пересборки по событию
        и догрузки изменчивых данных на клиенте.

      ## Коротко

      - Способ рендеринга — это вопрос, где и когда данные превращаются в HTML: в браузере (CSR), на сервере при каждом
        запросе (SSR), заранее при сборке (SSG) или заранее с пересборкой отдельных страниц по событию или расписанию (ISR).
      - Готовый HTML от сервера нужен, если страницу должны видеть поисковики и превью ссылок, — пустую оболочку CSR
        мессенджер и многие роботы видят пустой.
      - Свежесть и стоимость тянут в разные стороны: SSG и ISR дёшевы, потому что одну собранную страницу видят тысячи
        людей, а SSR платит за каждый запрос, зато свеж на момент запроса.
      - Гидратация — шаг, на котором серверный HTML связывают с JavaScript. Пока он не закончился, страница видна,
        но не отвечает, а сама гидратация нагружает основной поток.
      - SSR ускоряет появление содержимого, но не отменяет цену JavaScript. Её уменьшают острова, где оживляют только
        интерактивные части, и серверные компоненты, которые свой код в браузер не отправляют.
      - Способ выбирают для каждого маршрута отдельно (гибридный рендеринг): публичные одинаковые страницы — SSG или ISR,
        зависящие от запроса — SSR, личные экраны за входом — CSR.
      - Заранее собранная страница — тоже копия данных: изменчивое догружают на клиенте, а окончательное решение
        принимает сервер в момент действия.

      ## Источники

      - [Rendering on the Web — web.dev](https://web.dev/articles/rendering-on-the-web)
      - [hydrateRoot — документация React](https://ru.react.dev/reference/react-dom/client/hydrateRoot)
      - [Incremental Static Regeneration — документация Next.js](https://nextjs.org/docs/app/guides/incremental-static-regeneration)

  - id: sdr-loading
    topic: Рендеринг и доставка
    subtopic: Границы загрузки и ассеты
    title: Что грузить сразу, а что потом
    body: |
      ## Какую проблему решаем

      Страницу ресторана перевели на заранее собранный HTML, обложка появляется быстро. Но в отчёте по реальным
      пользователям INP на телефонах — 450 мс, а кнопка «В корзину» в первые секунды не реагирует. Разработчик открывает
      сборку и видит, что на странице ресторана браузер загружает 620 КБ JavaScript в сжатом виде. Туда попало всё
      приложение покупателя: каталог, корзина, оформление с платёжным модулем, экран отслеживания с картой курьера,
      библиотека графиков из личного кабинета.

      Покупателю, который смотрит меню, из этого нужна малая часть: кнопки блюд, фильтр меню и значок корзины. Остальное
      он скачивает, а главное — браузер разбирает и выполняет этот код в основном потоке, пока нажатия ждут.

      Этот урок о том, как решить, что нужно первому экрану, а что может подождать, и когда начинать грузить отложенное,
      чтобы человек не ждал и потом.

      ## Критический путь и бюджет

      **Критический путь загрузки** (critical rendering path) — всё, что браузер обязан получить и обработать, прежде чем
      нарисовать первый экран: HTML, стили, которые к нему относятся, и скрипты, которые блокируют отрисовку. Главная
      картинка отрисовку не блокирует, но для LCP важно, как рано браузер её найдёт. Как браузер внутри рисует страницу, нам знать не нужно; важно, какие ресурсы стоят на этом пути
      и кто их туда поставил.

      Два правила браузера, от которых зависит путь:

      - **Стили в `<head>` блокируют отрисовку:** пока они не загружены, браузер не рисует страницу, чтобы не показать
        её без оформления.
      - **Обычный `<script>` в `<head>` блокирует разбор HTML:** браузер останавливается, загружает и выполняет скрипт.
        Атрибут `defer` откладывает выполнение до конца разбора HTML и сохраняет порядок скриптов, `async` выполняет
        скрипт сразу по готовности, в любом порядке. Скрипты с `type="module"` по умолчанию ведут себя как `defer`.

      **Бюджет скорости** (performance budget) — заранее согласованный предел, который нельзя превышать: объём JavaScript
      на первый экран, число запросов, время LCP. Бюджет нужен, чтобы скорость не таяла по 20 КБ за каждую новую функцию.
      Для страницы ресторана команда записала: **не больше 170 КБ JavaScript в сжатом виде на первый экран**.

      Почему бюджет считают именно по JavaScript? Картинку на 170 КБ браузер скачает и раскодирует быстро.
      Скрипт на 170 КБ в сжатом виде — это около 600–800 КБ кода, который нужно разобрать, скомпилировать и выполнить
      на процессоре телефона, и всё это в основном потоке. На недорогом телефоне это сотни миллисекунд, в которые нажатия
      ждут.

      ## Разбиение кода

      **Разбиение кода** (code splitting) — сборщик делит приложение не на один большой файл, а на несколько **кусков**
      (chunks), и браузер загружает кусок только тогда, когда он понадобился. Точку разреза задаёт динамический импорт:

      ```ts
      // Кусок с оплатой загрузится, только когда этот код выполнится
      const { startPayment } = await import('./payment');
      ```

      В React для компонентов есть `lazy` и `Suspense`: компонент загружается при первой отрисовке, а пока его нет,
      на его месте показывается запасной вариант.

      ```tsx
      const CourierMap = lazy(() => import('./CourierMap'));

      <Suspense fallback={<MapPlaceholder />}>
        <CourierMap orderId={orderId} />
      </Suspense>
      ```

      Режут по двум признакам:

      - **По маршрутам.** Каждая страница — свой кусок: каталог, ресторан, корзина, оформление, отслеживание. Это самый
        полезный разрез: человек почти никогда не открывает всё за один визит.
      - **По тяжёлым частям внутри страницы.** Модуль, который большой и нужен не всем или не сразу: карта курьера,
        платёжный модуль, редактор, графики, вставка видео.

      ### Цена разбиения

      - **Ожидание при первом использовании.** Кусок грузится, когда понадобился, и человек ждёт. Это лечится
        загрузкой заранее по сигналу, о ней ниже.
      - **Водопад кусков.** Ленивый компонент внутри ленивого компонента: сначала грузится один кусок, он выполняется
        и только тогда просит второй. Тот же водопад, что с запросами данных в курсе 2, в уроке «Когда и что загружать».
        Если вложенный кусок нужен всегда, его либо подключают обычным импортом, и он попадает в тот же кусок, либо
        запускают его `import()` или `modulepreload` одновременно с внешним.
      - **Слишком мелкая нарезка.** Сотня крошечных файлов — сотня запросов, а сжатие работает хуже на маленьких
        файлах. Режут по смыслу — маршрут, тяжёлый модуль, — а не каждый компонент.

      ## Сейчас, заранее или по требованию

      Когда кусок отделён, остаётся решить, **когда** его грузить. Для этого у браузера есть подсказки в виде тега
      `<link>`.

      **Срочная загрузка** (`<link rel="preload">`) — «этот ресурс понадобится этой странице, и скоро; начни грузить
      сейчас». Браузер узнаёт о ресурсе рано, но приоритет даёт по его типу, который задают обязательным атрибутом `as`: скрипты
      и шрифты в Chrome так получают высокий приоритет, картинки — низкий;
      главной картинке приоритет поднимают отдельно, через `fetchpriority` (урок «Картинки и видео»). Нужна для того,
      что браузер нашёл бы слишком поздно: шрифт, который упомянут только внутри стилей, главную картинку, которую
      вставляет скрипт. Для модулей JavaScript есть вариант `rel="modulepreload"`. У шрифтов своя ловушка: их `preload`
      пишут с атрибутом `crossorigin`, иначе браузер скачает шрифт дважды. Если срочно загруженный ресурс так и не
      использовали, браузер предупреждает об этом в консоли: он отобрал канал у других ресурсов первого экрана.

      **Загрузка на будущее** (`<link rel="prefetch">`) — «это, вероятно, понадобится на следующей странице; скачай,
      когда сеть свободна». Приоритет низкий, ресурс ложится в HTTP-кэш, и при переходе берётся оттуда. Тот же приём
      для данных — предзагрузка из курса 2, урок «Лишние и одинаковые запросы»: это ставка, которая выигрывает, когда
      вероятность высока, а лишние байты дёшевы. Одна оговорка: Safari `prefetch` по умолчанию не поддерживает. Там тот же
      эффект дают вручную: после сигнала, когда браузер свободен, вызывают `import()` нужного куска: он скачается и выполнится
      заранее. Это безопасно, если модуль при загрузке ничего не делает, а только объявляет функции и компоненты.

      **Заранее открыть соединение** (`<link rel="preconnect">`) — «скоро будут запросы на этот чужой домен». Браузер
      заранее выполняет поиск адреса, установку соединения и шифрования, и первый запрос туда приходит быстрее.
      Полезно для платёжного сервиса или CDN с картинками.

      **Ленивая загрузка** — грузить, только когда дошло до дела: картинки ниже первого экрана (`loading="lazy"`,
      курс 2) и куски кода при первом использовании.

      - **preload**
        - Для чего: важное для текущей страницы, что браузер найдёт поздно.
        - Цена: при ошибке отбирает канал у первого экрана.
      - **prefetch**
        - Для чего: вероятный следующий шаг.
        - Цена: лишний трафик, если человек туда не пошёл.
      - **preconnect**
        - Для чего: скорые запросы на чужой домен.
        - Цена: почти никакой, но лишние соединения держат ресурсы; ставят на один-два домена.
      - **Ленивая загрузка**
        - Для чего: то, что нужно не всем и не сразу.
        - Цена: ожидание при первом использовании.

      ## Пример целиком: страница ресторана и оформление

      Команда разбирает, что на самом деле нужно первому экрану страницы ресторана.

      1. **Разрез по маршрутам.** Каталог, ресторан, корзина, оформление, отслеживание и личный кабинет — отдельные куски.
         На странице ресторана остаются общая оболочка (шапка, значок корзины), код меню и кнопки «В корзину». Получилось
         140 КБ в сжатом виде — в бюджет 170 КБ укладываемся.
      2. **Тяжёлые части отдельно.** Платёжный модуль вместе с SDK провайдера (180 КБ) грузится только на оформлении.
         Карта курьера (240 КБ) — только на экране отслеживания, и только когда заказ в пути. Библиотека графиков
         уехала в личный кабинет.
      3. **Когда грузить оформление.** Если начинать загрузку по нажатию «Оформить», человек на медленной сети ждёт
         больше секунды. Если грузить сразу со страницей ресторана, тратим трафик тех, кто ничего не закажет. Решение —
         ставка по сигналу: как только в корзине появилось первое блюдо, кусок оформления скачивается заранее через
         `prefetch`, когда сеть свободна. Добавивший блюдо почти наверняка дойдёт до оформления. В Safari, где `prefetch` не работает, тот же кусок
         загружается через `import()`, когда браузер свободен.
      4. **Платёжный домен.** На странице оформления ставят `preconnect` к домену платёжного сервиса: соединение
         готово к моменту, когда откроется форма карты.
      5. **Обложка.** Она уже в HTML. А шрифт заголовков, который упомянут только в стилях, браузер нашёл бы поздно, —
         для него `preload` с атрибутом `crossorigin`.
      6. **Контроль бюджета.** Сборка проверяет размер куска страницы ресторана и падает, если он больше 170 КБ.
         Иначе через полгода новые функции незаметно вернут всё как было.

      Результат по данным реальных пользователей через две недели: INP на телефонах — 180 мс, кнопка «В корзину»
      отвечает сразу, а оформление открывается почти мгновенно у тех, кто положил блюдо в корзину.

      ## Как выбрать

      Для каждого куска кода задайте вопросы:

      1. **Нужно ли это первому экрану этой страницы?** Да — в критический путь, и следите, чтобы оно не блокировало
         отрисовку без нужды. Нет — отделить.
      2. **Найдёт ли браузер важный ресурс сам и вовремя?** Нет — `preload`.
      3. **Насколько вероятно, что это понадобится скоро?** Высоко и есть сигнал — `prefetch` по сигналу. Низко — ленивая
         загрузка при первом использовании.
      4. **Пойдут ли скоро запросы на чужой домен?** Да — `preconnect`.
      5. **Укладывается ли первый экран в бюджет?** Нет — режем дальше или отказываемся от лишнего, а бюджет проверяем
         в сборке.

      ## Типичные ошибки

      - **Один файл на всё приложение.** Покупатель скачивает и выполняет код оформления, отслеживания и личного
        кабинета, чтобы посмотреть меню.
      - **Ленивая загрузка того, что нужно первому экрану.** Кнопка «В корзину» в отдельном куске — первый экран
        появляется без неё и ждёт ещё один запрос.
      - **`preload` на всё подряд.** Если всё важно, ничего не важно: предзагрузки отбирают канал у главного ресурса.
      - **Водопад кусков.** Ленивый компонент внутри ленивого — второй кусок не начнёт грузиться, пока не выполнится
        первый.
      - **Бюджет без проверки.** Число в документе, которое никто не проверяет, перестаёт соблюдаться через пару месяцев.
      - **Считать JavaScript только по весу файла.** Его цена — ещё разбор и выполнение на процессоре телефона.

      ## Как спрашивают на интервью

      - «Бандл весит 2 МБ, страница тормозит. Что будете делать?» — ждут разбиения по маршрутам и тяжёлым модулям,
        бюджета и того, что JavaScript дорог не только загрузкой.
      - «Чем preload отличается от prefetch?» — для текущей страницы и срочно против следующей страницы и в фоне.
      - «Когда начать грузить код оформления заказа?» — ждут ставки по сигналу и её цены.

      ## Коротко

      - Критический путь — всё, без чего браузер не нарисует первый экран. Стили в `<head>` блокируют отрисовку,
        обычный скрипт — разбор HTML, а `defer` и модули выполняются после разбора.
      - Бюджет скорости — заранее согласованный предел, например 170 КБ сжатого JavaScript на первый экран. Его проверяют
        в сборке, иначе он незаметно перестаёт соблюдаться.
      - JavaScript дорог не только загрузкой: его разбирают и выполняют в основном потоке, и на слабом телефоне это
        сотни миллисекунд, в которые нажатия ждут.
      - Разбиение кода выносит в отдельные куски маршруты и тяжёлые модули, которые нужны не всем и не сразу (`import()`,
        `lazy` и `Suspense`). Слишком мелкая нарезка и ленивое внутри ленивого дают свои задержки.
      - `preload` срочно грузит важное для текущей страницы, что браузер нашёл бы поздно, а `prefetch` в фоне скачивает
        вероятный следующий шаг (в Safari вместо него — `import()`, когда браузер свободен). `preconnect` заранее открывает соединение с чужим доменом.
      - Когда начинать загрузку отложенного, решают ставкой по сигналу: высокая вероятность и дешёвые лишние байты —
        загрузка заранее, низкая вероятность — при первом использовании.

      ## Источники

      - [Reduce JavaScript payloads with code splitting — web.dev](https://web.dev/articles/reduce-javascript-payloads-with-code-splitting)
      - [rel=preload — MDN](https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Attributes/rel/preload)
      - [Performance budgets 101 — web.dev](https://web.dev/articles/performance-budgets-101)

  - id: sdr-routing
    topic: Рендеринг и доставка
    subtopic: Маршрутизация как контракт
    title: Маршруты и переходы
    body: |
      ## Какую проблему решаем

      Покупатель на телефоне выбирает ужин. На странице ресторана сверху шапка — название, рейтинг, время доставки, —
      а под ней вкладки «Меню», «Отзывы» и «О ресторане». Вот что он видит в первой версии:

      - **Переключил вкладку на «Отзывы» — моргнула вся страница.** Шапка ресторана пропала, появился спиннер,
        шапка загрузилась заново. Меню, которое он пролистал до середины, при возврате открылось с начала.
      - **Открыл ресторан из каталога — ждёт полторы секунды.** Сначала грузится информация о ресторане, только потом
        меню, и только потом отзывы для вкладки.
      - **Открыл карточку «Маргариты» и отправил ссылку другу.** Друг открыл ссылку и увидел ресторан, но без карточки:
        её не было в адресе.
      - **Вернулся «Назад» в каталог** — оказался в самом начале списка из сорока ресторанов.

      Каждая из этих бед — решение о маршрутах, которое никто не принимал явно. В курсе 1, в уроке «Что переживает
      перезагрузку», мы договорились, что адрес страницы — контракт: в нём фильтры, открытая сущность, всё, чем делятся
      и к чему возвращаются. Здесь — следующий шаг: как устроить маршруты, чтобы переходы не разрушали то, что не
      менялось, данные грузились одновременно, а человек не терял место.

      ## Вложенные маршруты и макеты

      **Маршрут** (route) — правило «такому адресу соответствует такой экран». **Вложенные маршруты** (nested routes)
      повторяют вложенность экранов: адрес `/r/pizza-na-uglu/reviews` разбирается на три уровня.

      1. **Оболочка приложения** — шапка сервиса со значком корзины, нижнее меню.
      2. **Ресторан** — шапка ресторана и вкладки.
      3. **Вкладка** — отзывы.

      Каждый уровень — свой **макет** (layout): компонент, который рисует общую часть и оставляет место для вложенного
      уровня. В React Router это место отмечает компонент `<Outlet>`:

      ```tsx
      // Маршрут ресторана: шапка и вкладки общие, содержимое вкладки — в Outlet
      function RestaurantLayout() {
        const restaurant = useLoaderData();
        return (
          <>
            <RestaurantHeader restaurant={restaurant} />
            <Tabs />
            <Outlet />  {/* меню, отзывы или «О ресторане» */}
          </>
        );
      }
      ```

      Главное свойство вложенных макетов: **при переходе перерисовывается только тот уровень, который изменился.**
      Переключение с «Меню» на «Отзывы» меняет только третий уровень. Шапка ресторана остаётся на месте, её состояние
      не сбрасывается, данные заново не грузятся. А если бы каждая вкладка была отдельной страницей со своей копией шапки,
      React убирал бы старую шапку и ставил новую, и всё её состояние терялось бы — это и было «моргание».

      ## Данные маршрута: одновременно, а не по очереди

      В курсе 2, в уроке «Когда и что загружать», мы видели, откуда берётся водопад запросов: вложенный компонент начинает
      грузить свои данные, только когда отрисовался родитель. С вложенными маршрутами этот водопад становится особенно
      заметным: оболочка ждёт профиль, ресторан ждёт оболочку, вкладка ждёт ресторан.

      Там же был назван приём против этого — **загрузка данных на уровне маршрута** (route loaders). В React Router
      у каждого маршрута может быть функция `loader`. При переходе маршрутизатор знает весь адрес сразу и запускает
      загрузчики **всех** совпавших уровней одновременно, ещё до отрисовки: и для ресторана, и для вкладки.

      ```tsx
      {
        path: '/r/:slug',
        loader: ({ params }) => api.restaurant(params.slug),     // шапка ресторана
        element: <RestaurantLayout />,
        children: [
          { index: true, loader: ({ params }) => api.menu(params.slug), element: <Menu /> },
          { path: 'reviews', loader: ({ params }) => api.reviews(params.slug), element: <Reviews /> },
        ],
      }
      ```

      Каждому загрузчику нужен только адрес, а не данные родителя, поэтому они не ждут друг друга. Если же загрузчику
      действительно нужно что-то от родителя, это настоящая зависимость, и её убирают так же, как в курсе 2: просят API
      отдавать данные по тому, что есть в адресе.

      Код и данные тоже можно грузить параллельно: маршрутизатор при переходе одновременно запрашивает и кусок кода
      страницы, о котором шла речь в уроке «Что грузить сразу, а что потом», и её данные. Это работает, если загрузчик
      объявлен вне ленивого куска; иначе данные ждут, пока загрузится код.

      ### Что показывать, пока идёт переход

      Пока загрузчики работают, на экране ещё старая страница. Есть два способа вести себя в это время.

      - **Оставить старую страницу и показать тонкий индикатор** вверху экрана. Так работает переход по ссылке в обычном
        сайте. Подходит, когда загрузка обычно короткая: человек не видит мелькания пустого экрана.
      - **Сразу показать новую страницу со скелетоном.** Подходит, когда загрузка долгая: человек видит, что переход
        случился, и не жмёт ссылку второй раз.

      В React Router состояние перехода доступно через хук `useNavigation`: по нему и рисуют индикатор. Для медленных
      частей страницы есть отложенные данные: загрузчик возвращает быстрые данные сразу, а медленные — промисом,
      и страница показывает их позже на месте заглушки.

      ## Сохранить контекст человека

      ### Прокрутка при «Назад»

      Человек ждёт, что «Назад» вернёт его туда, где он был, а «Вперёд» по новой ссылке откроет страницу сверху.
      Браузер умеет это сам для обычных страниц, но в одностраничном приложении содержимое часто приходит из сети после
      перехода, и браузер не успевает. В курсе 2, в уроке «Пагинация живых списков», мы разобрали, как это делают
      руками: выключают автоматическое восстановление (`history.scrollRestoration = 'manual'`) и прокручивают сами,
      когда содержимое отрисовано. В React Router для этого есть готовый компонент `<ScrollRestoration>`: он запоминает
      прокрутку для каждой записи истории и восстанавливает её после загрузки данных.

      ### Содержимое вкладок

      Шапка ресторана сохраняется сама — она в макете. А вот позиция в меню при переключении на «Отзывы» и обратно
      теряется: компонент меню убирается со страницы. По умолчанию `<ScrollRestoration>` помнит позицию для записи
      истории, а переключение вкладки — новый переход, а не «Назад», поэтому позицию он не вернёт. Ему можно задать
      ключ по пути, но только для вкладок ресторана:
      `getKey={(l) => l.pathname.startsWith('/r/') ? l.pathname : l.key}`. Тогда позиция восстанавливается для каждой
      вкладки, а остальные страницы помнят её по записи истории — иначе любая новая ссылка на уже виденный путь,
      например каталог с другим фильтром, открылась бы на старой прокрутке. Другие варианты —
      сохранять позицию самим, например в `sessionStorage` по ключу ресторана, или держать меню смонтированным, но скрытым, — второе
      дороже по памяти. Ссылкам вкладок при этом не дают сбрасывать прокрутку наверх (в React Router —
      `preventScrollReset`).

      ### Глубокие ссылки

      **Глубокая ссылка** (deep link) — адрес, который открывает не просто страницу, а конкретное место в ней: карточку
      блюда в меню, отзыв, выбранную вкладку. Карточку «Маргариты» кладут в адрес: `/r/pizza-na-uglu?dish=57`.
      Тогда работает всё сразу:

      - друг по ссылке видит ресторан и открытую карточку;
      - «Назад» на телефоне закрывает карточку, а не уводит из ресторана — люди этого и ждут;
      - перезагрузка не теряет открытое блюдо.

      Почему параметр, а не отдельная страница `/dish/57`? Карточка — шторка поверх меню: под ней должно остаться меню
      с той же прокруткой. Если сделать карточку отдельным маршрутом, меню при открытии исчезнет. Параметр в адресе
      (или вложенный маршрут внутри ресторана) сохраняет меню под шторкой.

      ## Пример целиком: от каталога до карточки блюда

      Соберём маршруты сервиса доставки:

      - `/restaurants?zone=…&cuisine=pizza` — каталог: фильтры в адресе (курс 1), зона доставки тоже (урок «Где
        собирать страницу»);
      - `/r/:slug` — макет ресторана: шапка и вкладки;
        - `/r/:slug` — меню (вкладка по умолчанию);
        - `/r/:slug/reviews` — отзывы;
        - `/r/:slug/about` — о ресторане;
      - `?dish=57` — открытая карточка блюда поверх любой вкладки.

      Что происходит при переходах:

      1. **Каталог → ресторан.** Маршрутизатор одновременно запускает загрузку куска страницы ресторана, загрузчик шапки
         и загрузчик меню. Пока они работают, каталог остаётся на экране с индикатором. Через 400 мс открывается
         ресторан целиком, без лесенки.
      2. **Меню → Отзывы.** Меняется только вкладка. Шапка ресторана на месте, загружаются только отзывы. `<ScrollRestoration>`
         запоминает позицию по пути вкладки (ключ по пути задан только для страниц ресторана), поэтому при возврате
         на «Меню» человек оказывается на том же блюде.
      3. **Открыта «Маргарита».** Адрес становится `/r/pizza-na-uglu?dish=57`, данные блюда уже есть в меню, запроса нет.
         Ссылкой можно поделиться.
      4. **«Назад» дважды.** Первый закрывает карточку, второй возвращает в каталог, на ту же прокрутку: страницы списка
         взяты из кэша, а `<ScrollRestoration>` прокручивает к нужному месту.

      ## Варианты и их цена

      - **Плоские маршруты, у каждой страницы своя копия общих частей**
        - Что даёт: просто.
        - Цена: при каждом переходе общие части пересоздаются, теряют состояние и грузят данные заново.
      - **Вложенные маршруты с макетами**
        - Что даёт: меняется только изменившийся уровень, общие части живут.
        - Цена: нужно продумать иерархию экранов и где проходят уровни.
      - **Данные грузит сам компонент при отрисовке**
        - Что даёт: всё рядом в одном файле.
        - Цена: водопад по уровням вложенности.
      - **Загрузчики маршрутов**
        - Что даёт: все уровни грузятся одновременно, вместе с кодом.
        - Цена: данные отделены от компонента; нужен маршрутизатор, который это умеет.

      ## Типичные ошибки

      - **Копия общих частей на каждой странице.** Шапка и меню моргают и теряют состояние при каждом переходе.
      - **Каждый уровень грузит своё после отрисовки родителя.** Страница собирается лесенкой.
      - **Открытая карточка, вкладка или шаг только в памяти.** Ссылкой не поделиться, «Назад» уводит со страницы.
      - **Карточка-шторка отдельной страницей.** Меню под ней пропадает, и при закрытии человек теряет место.
      - **Не восстанавливать прокрутку** после загрузки данных — «Назад» возвращает в начало длинного списка.

      ## Как спрашивают на интервью

      - «Как устроите маршруты этого приложения?» — ждут вложенные маршруты с общими макетами и что в адресе.
      - «При переходе между вкладками страница моргает и всё грузится заново. Почему?» — ждут разговора о макетах
        и о том, какой уровень пересоздаётся.
      - «Как сделать модальное окно, на которое можно дать ссылку?» — ждут параметр или вложенный маршрут, «Назад»
        и сохранение страницы под окном.

      ## Коротко

      - Вложенные маршруты повторяют вложенность экранов, а каждый уровень — макет с местом для вложенного (`<Outlet>`).
        При переходе перерисовывается только изменившийся уровень, а общие части сохраняют состояние и данные.
      - Загрузчики маршрутов знают весь адрес сразу и запускаются для всех совпавших уровней одновременно, ещё до
        отрисовки, вместе с загрузкой кода. Когда компонент сам грузит данные после родителя, получается водопад.
      - Пока идёт переход, при короткой загрузке оставляют старую страницу с индикатором, а при долгой сразу показывают
        новую со скелетоном. Медленные части можно отдать позже, на месте заглушки.
      - Прокрутку при «Назад» восстанавливают после того, как содержимое отрисовано: браузер в одностраничном приложении
        часто не успевает сам, поэтому помогают `<ScrollRestoration>` или ручное восстановление.
      - Глубокая ссылка открывает конкретное место — карточку, вкладку, отзыв. Шторку поверх страницы кладут в параметр
        или вложенный маршрут, чтобы страница под ней осталась, а «Назад» закрыл шторку.

      ## Источники

      - [Data Loading — документация React Router](https://reactrouter.com/start/data/data-loading)
      - [ScrollRestoration — документация React Router](https://reactrouter.com/api/components/ScrollRestoration)

  - id: sdr-media
    topic: Рендеринг и доставка
    subtopic: Картинки и медиа
    title: Картинки и видео
    body: |
      ## Какую проблему решаем

      В курсе 2, в уроке «Загрузка файлов», ресторан научился загружать фото блюд: оригиналы с телефона, до 10 МБ каждое.
      Теперь эти фото нужно показать покупателю. Первая версия делает просто: `<img src>` с адресом оригинала.

      Что из этого выходит на странице ресторана:

      - **меню из 40 блюд — это 40 фото по 3–8 МБ.** Карточка на телефоне шириной в полэкрана, а качается снимок
        4000 пикселей в ширину. Трафик уходит мегабайтами, а на медленной сети меню догружается минуту;
      - **обложка ресторана — LCP страницы — JPEG на 240 КБ** вдвое шире экрана телефона. После перехода на готовый
        HTML (урок «Где собирать страницу») LCP укладывается в 2,5 секунды на хорошей сети, но на медленной — нет;
      - **страница прыгает:** каждая догрузившаяся картинка раздвигает карточки, CLS — 0,3;
      - **у ресторана есть видео** о том, как готовят пиццу, — 450 МБ одним файлом. На мобильной сети оно то и дело
        останавливается.

      Картинки и видео — обычно самая тяжёлая часть страницы. Этот урок о том, как отдать каждому устройству ровно
      столько пикселей, сколько оно покажет, не дать странице прыгать и решить, кто и когда готовит нужные размеры.

      ## Картинка под экран

      **Плотность пикселей** (DPR, device pixel ratio) — сколько физических точек экрана приходится на один пиксель
      в CSS. У многих телефонов она 2 или 3: картинка шириной 180 CSS-пикселей должна иметь 360–540 настоящих точек,
      иначе будет мыльной. Компьютер с обычным экраном обходится единицей.

      Чтобы браузер сам выбрал подходящий размер, ему дают список вариантов:

      ```html
      <img
        src="/img/dish-57-640.jpg"
        srcset="/img/dish-57-320.jpg 320w, /img/dish-57-640.jpg 640w,
                /img/dish-57-960.jpg 960w, /img/dish-57-1280.jpg 1280w"
        sizes="(min-width: 768px) 33vw, 50vw"
        width="640" height="480"
        alt="Пицца «Маргарита»">
      ```

      - **`srcset`** — какие варианты есть и какой ширины каждый (`640w` — 640 пикселей).
      - **`sizes`** — какую ширину картинка займёт на странице: на широком экране треть окна, на узком — половину.
        Браузер узнаёт это ещё до того, как построил страницу, и сам умножает на плотность пикселей. На телефоне шириной
        360 CSS-пикселей с плотностью 3 картинке нужна ширина 180 × 3 = 540 точек, и браузер обычно выберет вариант `640w`.
      - **`src`** — запасной вариант для браузеров, которые `srcset` не понимают.

      Если без `sizes`, браузер считает, что картинка во всю ширину окна, и выбирает слишком крупный вариант. Для картинок
      постоянного размера, вроде логотипа, хватает варианта попроще: `srcset="logo.png 1x, logo@2x.png 2x"`.

      ### Формат

      **WebP** и **AVIF** — современные форматы, которые при том же качестве обычно заметно легче JPEG; AVIF чаще всего
      легче и WebP. Старые браузеры их могут не понимать, поэтому варианты перечисляют в элементе `<picture>`, а браузер
      берёт первый подходящий:

      ```html
      <picture>
        <source type="image/avif" srcset="…">
        <source type="image/webp" srcset="…">
        <img src="dish-57-640.jpg" srcset="…" sizes="…" width="640" height="480" alt="…">
      </picture>
      ```

      ## Место под картинку заранее

      Пока картинка грузится, браузер не знает её высоту и отводит под неё ноль. Пришла картинка — всё под ней едет вниз.
      Это и есть сдвиг вёрстки, который портит CLS.

      Лечится одной строкой: у `<img>` указывают атрибуты `width` и `height`. Браузер по ним вычисляет соотношение
      сторон и сразу резервирует место нужной высоты, даже если в CSS ширина резиновая (`width: 100%; height: auto`).
      Для блоков, у которых нет своих атрибутов размера, — встроенного плеера, рекламного места — используют свойство CSS
      `aspect-ratio: 16 / 9` или заранее заданную высоту.

      ## Приоритет и ленивая загрузка

      У картинок на странице разная важность.

      - **Главная картинка первого экрана,** обычно LCP-элемент. Её грузят как можно раньше: она должна быть в HTML
        (урок «Где собирать страницу»), а атрибут `fetchpriority="high"` подсказывает браузеру поставить её впереди
        других картинок. Без подсказки браузер не знает, какая картинка главная: он начинает грузить картинки с невысоким
        приоритетом и повышает его видимым только после того, как построит страницу.
      - **Картинки ниже первого экрана.** Их грузят лениво: `loading="lazy"`, как в курсе 2, в уроке «Когда и что
        загружать». Браузер начнёт загрузку, когда картинка приблизится к видимой области.
      - **Ловушка:** `loading="lazy"` у главной картинки откладывает её загрузку, пока браузер не построит страницу и не
        поймёт, что она видна. LCP становится хуже. Ленивую загрузку ставят только тому, что заведомо ниже первого экрана.

      ## Кто готовит размеры

      Картинку в четырёх ширинах и трёх форматах — двенадцать файлов — кто-то должен сделать. Есть два пути.

      - **Нарезать при загрузке.**
        - Как: после загрузки оригинала сервер или фоновая задача делает все варианты и кладёт в хранилище.
        - Что даёт: при показе ничего не вычисляется, всё готово.
        - Цена: новый размер или формат — перенарезать все старые фото; варианты, которые никто не смотрит, всё равно
          хранятся.
      - **CDN с изменением размера на лету** (image CDN).
        - Как: адрес картинки содержит нужную ширину и формат, например `/img/dish-57.jpg?w=640&format=avif`. При первом
          запросе CDN берёт оригинал из хранилища, уменьшает и перекодирует, а результат кэширует. Формат CDN может
          выбрать и сам, по заголовку `Accept`, где браузер перечисляет, какие форматы понимает. Тогда в ответе нужен
          заголовок `Vary: Accept`, иначе промежуточный кэш отдаст AVIF браузеру, который его не понимает.
        - Что даёт: новый размер — это просто новый адрес; оригинал один.
        - Цена: первый запрос нового варианта медленнее; сервис стоит денег; число разрешённых ширин ограничивают,
          иначе каждый случайный `?w=` создаёт новый вариант в кэше.

      ## Видео: качество под скорость сети

      Видео одним файлом плохо по двум причинам: на медленной сети оно останавливается, а на быстрой — человек всё равно
      качает весь файл, даже если посмотрел десять секунд.

      **Адаптивный стриминг** (adaptive bitrate streaming) решает это так: видео заранее кодируют в нескольких качествах
      и режут на короткие отрезки по несколько секунд. Список вариантов и отрезков лежит в файле-манифесте. Плеер следит
      за скоростью сети и для каждого следующего отрезка выбирает качество: сеть просела — следующий отрезок пойдёт
      в 480p, восстановилась — снова в 1080p. Видео не останавливается, а качество меняется.

      Два распространённых формата — **HLS** (от Apple, манифест `.m3u8`) и **DASH** (стандарт MPEG-DASH, манифест
      `.mpd`). Safari умеет HLS сам, в остальных браузерах плеер собирают на основе Media Source Extensions —
      это делают библиотеки вроде hls.js и dash.js. Для фронтенда главное архитектурное решение здесь — не писать
      свой плеер, а выбрать готовый и договориться с бэкендом, что видео перекодируется в отрезки после загрузки.

      Ещё два решения у видео на странице: **постер** — картинка, которую показывают до запуска (у неё те же правила
      размера и места), и атрибут `preload="none"` или `"metadata"`, чтобы браузер не качал видео, которое человек,
      может быть, не запустит.

      ## Пример целиком: фото блюд и обложка

      Команда сервиса доставки договорилась так.

      1. **Где нарезаются размеры.** Оригинал из курса 2 лежит в хранилище. Картинки отдаёт CDN с изменением размера
         на лету. Разрешённые ширины — 320, 640, 960 и 1280 пикселей; форматы — AVIF и WebP, запасной — JPEG.
      2. **Карточки меню.** На телефоне две колонки, каждая примерно 170 CSS-пикселей; на компьютере — три колонки.
         Поэтому `sizes="(min-width: 768px) 33vw, 50vw"`. Телефону с плотностью 3 нужно около 510 точек, браузер
         обычно возьмёт вариант `640w`, а не оригинал на 4000.
      3. **Место.** У всех фото блюд на странице соотношение сторон 4:3, атрибуты `width="640" height="480"` дают его
         браузеру заранее. Карточки больше не прыгают.
      4. **Обложка ресторана.** Это LCP-элемент. Она во весь экран (`sizes="100vw"`), есть в HTML с самого начала,
         с `fetchpriority="high"` и без ленивой загрузки. На телефоне берётся вариант `960w` или `1280w` в AVIF — около
         90 КБ вместо 240 КБ в JPEG.
      5. **Фото ниже первого экрана** — с `loading="lazy"`.
      6. **Видео о пицце.** После загрузки сервер перекодирует его в HLS в трёх качествах. На странице — постер
         и плеер на основе готовой библиотеки, `preload="none"`.

      Результат: вес первого экрана страницы ресторана упал с 9 МБ до 400 КБ, LCP на телефонах — 1,9 секунды на 75-м процентиле, а в срезе по медленной сети тоже ниже 2,5 с,
      CLS — 0,02.

      ## Типичные ошибки

      - **Оригинал с камеры на странице.** 4000 пикселей там, где показывают 500.
      - **`srcset` без `sizes`.** Браузер считает, что картинка во всё окно, и выбирает крупный вариант.
      - **Картинки без `width` и `height`.** Страница прыгает при каждой догрузке.
      - **`loading="lazy"` у главной картинки.** LCP становится хуже.
      - **Главная картинка без приоритета** — она ждёт в очереди наравне с иконками.
      - **Видео одним файлом на мобильной сети.** Остановки и лишний трафик там, где помог бы адаптивный стриминг.
      - **Произвольные размеры в адресе CDN.** Каждый новый `?w=` — новый вариант в кэше и лишняя работа.

      ## Как спрашивают на интервью

      - «Спроектируйте фотохостинг» или «ленту с фото» — ждут разговора о размерах под экран, форматах, CDN
        и ленивой загрузке.
      - «Как показать картинку так, чтобы страница не прыгала?» — ждут `width` и `height` или `aspect-ratio`.
      - «Как устроен видеоплеер, который не тормозит на плохой сети?» — ждут адаптивный стриминг: отрезки и выбор
        качества по скорости сети.

      ## Коротко

      - Каждому устройству отдают столько пикселей, сколько оно покажет: `srcset` перечисляет варианты по ширине,
        а `sizes` говорит, какую ширину картинка займёт. Браузер сам учитывает плотность пикселей, а без `sizes`
        выбирает слишком крупный вариант.
      - Современные форматы WebP и AVIF обычно заметно легче JPEG; их перечисляют в `<picture>` с запасным JPEG.
      - Атрибуты `width` и `height` у картинки, а у блоков без своих размеров — `aspect-ratio`, резервируют место заранее,
        и догрузка ничего не сдвигает.
      - Главную картинку первого экрана держат в HTML, поднимают ей приоритет `fetchpriority="high"` и не грузят лениво.
        `loading="lazy"` ставят только тому, что заведомо ниже первого экрана.
      - Размеры можно нарезать при загрузке или отдавать через CDN с изменением размера на лету. Во втором случае
        оригинал один, а новый размер — новый адрес, но набор разрешённых ширин ограничивают.
      - Видео отдают адаптивным стримингом (HLS, DASH): несколько качеств, короткие отрезки, и плеер выбирает качество
        каждого отрезка по скорости сети. Плеер берут готовый, а перекодирование согласуют с бэкендом.

      ## Источники

      - [Responsive images — web.dev](https://web.dev/learn/design/responsive-images)
      - [`<img>`: атрибуты srcset, sizes, width, height, loading — MDN](https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/img)
      - [Optimize resource loading with the Fetch Priority API — web.dev](https://web.dev/articles/fetch-priority)

  - id: sdr-versions
    topic: Рендеринг и доставка
    subtopic: Кэширование и совместимость версий
    title: Кэш файлов и выкатка новой версии
    body: |
      ## Какую проблему решаем

      Команда сервиса доставки выкатывает новую версию веб-приложения несколько раз в день. После очередной выкатки
      приходят три вида жалоб.

      - **«У меня старая версия».** Исправление выкатили час назад, а у части покупателей ошибка осталась: браузер
        держит старый файл скрипта в кэше.
      - **«Белый экран при смене адреса».** Покупатель с утра не закрывал вкладку, дошёл до оформления, нажал «Изменить
        адрес» — и вместо формы пустое место, а в консоли ошибка загрузки модуля.
      - **«Заказ не оформляется».** Новая версия сервера ждёт в запросе поле, которого старый клиент не присылает,
        и отвечает ошибкой.

      Все три — про одно: в любой момент у людей открыто приложение **разных версий**, и они говорят с сервером, который
      тоже обновляется. В курсе 2, в уроке «Почему сеть всё усложняет», это было заблуждение «администратор один»: никто
      не перезагрузит открытую вкладку за человека. Этот урок о том, как кэшировать файлы приложения, чтобы новое
      доходило сразу, а старые вкладки не ломались.

      ## Кэш файлов — не кэш данных

      В курсе 2, в уроках «Как устроен клиентский кэш» и «Когда данные устаревают», речь шла о кэше **данных**: меню,
      заказы, статусы. Здесь другой кэш — **файлов приложения** (ассетов): скриптов, стилей, шрифтов, картинок
      интерфейса. Им управляет HTTP-кэш браузера и CDN по заголовку `Cache-Control`, который ставит сервер.

      У файлов приложения есть удобное свойство: файл конкретной версии никогда не меняется. Изменился код — это новый
      файл. На этом строится главный приём.

      ### Хэш в имени и вечный кэш

      Сборщик (Vite, webpack) добавляет к имени каждого файла **хэш** — короткий отпечаток содержимого:
      `restaurant.3f9a2c.js`. Изменился код — изменился хэш, а значит, и имя. Поэтому такие файлы можно кэшировать
      «навсегда»:

      ```http
      Cache-Control: public, max-age=31536000, immutable
      ```

      `max-age=31536000` — год, а `immutable` говорит браузеру: «этот файл не изменится, даже не проверяй». Новая версия
      придёт под новым именем, и браузер скачает её как новый файл.

      ### Страница-вход без долгого кэша

      Остаётся вопрос: откуда браузер узнает новые имена? Из **страницы-входа** — `index.html` или HTML, который отдаёт
      сервер. В ней ссылки на файлы текущей версии. Её кэшировать надолго нельзя, иначе браузер будет держать ссылки
      на старые файлы.

      ```http
      Cache-Control: no-cache
      ```

      `no-cache` не значит «не кэшировать». Это значит «можно хранить, но каждый раз спроси сервер, не изменилось ли».
      Сервер отвечает коротким «не изменилось» (304), если версия та же, и новым HTML, если вышла новая. Для этого
      у ответа должна быть метка `ETag` или дата `Last-Modified` — та же метка версии, что в курсе 2, в уроке «Версии
      и конфликты». Так страница-вход
      всегда свежая, а тяжёлые файлы почти всегда берутся из кэша.

      - **Файлы с хэшем в имени**
        - Кэш: год, `immutable`.
        - Почему можно: файл под этим именем никогда не меняется.
      - **Страница-вход (`index.html`)**
        - Кэш: `no-cache`, проверять каждый раз.
        - Почему: в ней ссылки на текущую версию.
      - **Файлы без хэша (`favicon.ico`, `robots.txt`)**
        - Кэш: короткий, часы или день.
        - Почему: имя не меняется, а содержимое может.

      Первая жалоба — «у меня старая версия» — почти всегда значит, что эту схему нарушили: файл без хэша закэширован
      надолго или страница-вход закэширована на CDN.

      ## Вкладка, открытая со вчерашнего дня

      Теперь вторая жалоба. Вкладка открыта утром. Она загрузила страницу-вход версии 41, основной скрипт и те куски, что
      понадобились. Куски, которые ещё не понадобились, — например, форма смены адреса, — она загрузит позже, по ссылкам
      из **своей** версии: `address-form.a1b2c3.js`.

      Днём выкатили версию 42. Если при выкатке старые файлы удалили с сервера, то вечером вкладка версии 41 просит
      `address-form.a1b2c3.js` — и получает 404. Динамический импорт падает с ошибкой загрузки модуля, и на месте формы —
      пустота.

      ![Схема: вкладка версии 41 открыта утром; днём на сервер выкатывают версию 42 и старые файлы удаляют; вечером вкладка версии 41 просит файл address-form старой версии и получает 404, вместо формы — ошибка](images/sdr-versions.png "Старая вкладка просит удалённый кусок приложения")

      Что с этим делают, по порядку надёжности:

      1. **Не удалять старые файлы сразу.** Хранить файлы прошлых версий на CDN ещё несколько дней. Имена с хэшем
         не конфликтуют, места это стоит мало. Почти все вкладки за это время закроются или перезагрузятся.
      2. **Ловить ошибку загрузки куска.** Даже с хранением бывают вкладки старше срока. Ошибку динамического импорта
         ловят, и вместо пустоты приложение показывает: «Приложение обновилось. Обновите страницу, чтобы продолжить».
         Сборщики помогают: Vite, например, генерирует на `window` событие `vite:preloadError`, когда не удалось
         загрузить кусок.
      3. **Перезагружать в безопасный момент.** Перезагрузка лечит ошибку, но может стереть то, что человек ввёл. Поэтому
         автоматическую перезагрузку делают при переходе между страницами, а не посреди формы, и только когда ввод
         сохранён — как черновик из курса 1, урока «Что переживает перезагрузку». И защищают от бесконечного цикла:
         если после перезагрузки ошибка повторилась, второй раз не перезагружают, а показывают сообщение.

      ### Предложить обновиться заранее

      Можно не ждать ошибки. Приложение периодически, например при возврате на вкладку, спрашивает у сервера номер
      текущей версии. Если он новее своего — показывает ненавязчивое «Доступна новая версия — обновить» или тихо
      перезагружается при следующем переходе между страницами. Для приложений с Service Worker у этого есть
      стандартный механизм — о нём следующий урок.

      ## Старый клиент и новый сервер

      Третья жалоба — про API. Во время выкатки и ещё долго после неё с сервером говорят клиенты разных версий:
      вкладки, открытые вчера, и только что загруженные. Да и сами серверы при постепенной выкатке (rolling deploy)
      обновляются не одновременно: часть запросов попадает на старые, часть — на новые. Поэтому контракт API меняют так,
      чтобы работали **все** сочетания.

      Этот приём называют **расширить и сузить** (expand and contract, parallel change) — по шагам:

      1. **Расширить сервер.** Сервер начинает понимать и старый формат, и новый: принимает запрос и без нового поля,
         отдаёт в ответе и старое поле, и новое. Клиенты пока прежние.
      2. **Выкатить клиент,** который пользуется новым форматом.
      3. **Дождаться, пока старые клиенты уйдут.** Для веб-приложения это срок, после которого старые вкладки почти все
         закрылись, плюс запас. Чтобы понять, сколько их осталось, клиент присылает свою версию в заголовке запроса,
         например `X-App-Version: 41`, и сервер её считает.
      4. **Сузить сервер:** убрать поддержку старого формата.

      Это то же правило, что в курсе 1, в уроке «Зависимости и публичный интерфейс модуля»: добавить новое рядом
      со старым, перевести потребителей, потом удалить старое. Только потребители здесь — открытые вкладки, которые
      никто не может обновить принудительно.

      На крайний случай у сервера есть запасной выход: если он видит слишком старую версию клиента, он может ответить
      понятной ошибкой «клиент устарел», а клиент по ней предложит обновить страницу.

      ## Пример целиком: оплата посреди выкатки

      Сервис доставки договорился о таких правилах.

      - **Кэш.** Файлы с хэшем — год и `immutable`, страница-вход — `no-cache`, на CDN она сбрасывается при выкатке.
      - **Хранение.** Файлы прошлых версий живут на CDN ещё 7 дней.
      - **Порядок выкладки.** Сначала на CDN выкладывают файлы новой версии и только потом — страницу-вход. Иначе
        при постепенной выкатке новая страница-вход может сослаться на файлы, которых ещё нет.
      - **Ошибка куска.** При ошибке загрузки модуля приложение показывает «Приложение обновилось» с кнопкой «Обновить».
        Автоматическая перезагрузка — только при переходе между страницами и не чаще одного раза.
      - **Версия.** Клиент присылает `X-App-Version` с каждым запросом.
      - **API.** Изменения — только через «расширить и сузить», старый формат живёт не меньше 7 дней после выкатки клиента.

      Как это сработало. Команда меняет формат времени доставки: было `deliveryMinutes: 40`, стало `deliveryWindow:
      { from: "19:30", to: "19:50" }`.

      1. **Понедельник.** Сервер начинает отдавать оба поля. Клиенты ничего не замечают.
      2. **Вторник, 14:00.** Выкатывают клиент версии 42, который читает `deliveryWindow`.
      3. **Вторник, 19:00.** Покупательница с утренней вкладкой версии 41 на шаге оформления нажимает «Изменить адрес».
         Кусок формы версии 41 ещё лежит на CDN, форма открывается. Время доставки она видит по старому полю — сервер
         отдаёт оба. Заказ оформлен без единой ошибки.
      4. **Через неделю.** По заголовку `X-App-Version` видно, что запросов от версий старше 42 почти не осталось.
         Сервер перестаёт отдавать `deliveryMinutes`, а старые файлы удаляются с CDN.

      Если бы кто-то пришёл с вкладкой двухнедельной давности, он увидел бы «Приложение обновилось» вместо пустого
      экрана, а корзина и адрес сохранились бы: корзина живёт на сервере, а черновик комментария — в `sessionStorage`.

      ## Типичные ошибки

      - **Долгий кэш у файлов без хэша** или у страницы-входа. Люди сидят на старой версии, пока не очистят кэш.
      - **`no-cache` у всех файлов.** Каждый визит проверяет десятки файлов, хотя они не менялись: лишние запросы.
      - **Удалять старые файлы при выкатке.** Каждая открытая вкладка ломается при первом же ленивом куске.
      - **Не ловить ошибку загрузки куска.** Человек видит пустоту и не понимает, что делать.
      - **Перезагружать страницу посреди формы** или в цикле.
      - **Менять формат API одной выкаткой** клиента и сервера. Старые вкладки и серверы, обновлённые не все сразу,
        получают формат, которого не понимают.

      ## Как спрашивают на интервью

      - «Как сделать, чтобы после выкатки люди сразу получали новую версию, но кэш при этом работал?» — ждут хэш
        в именах, долгий кэш у них и проверку страницы-входа.
      - «После выкатки у части пользователей ошибки загрузки модулей. Почему и что делать?» — ждут старые вкладки,
        хранение прошлых файлов и обработку ошибки.
      - «Как поменять формат ответа API, не сломав клиентов?» — ждут «расширить и сузить».

      ## Коротко

      - Кэш файлов приложения — не кэш данных: им управляют HTTP-кэш браузера и CDN по `Cache-Control`, а файл конкретной
        версии никогда не меняется.
      - Файлы с хэшем содержимого в имени кэшируют на год с `immutable`, а страницу-вход — с `no-cache`, то есть проверяют
        каждый раз. Так новая версия доходит сразу, а тяжёлые файлы берутся из кэша.
      - Открытая вкладка живёт со своей версией и просит свои ленивые куски по старым именам. Если старые файлы удалили
        при выкатке, она получает 404 и пустой экран.
      - Поэтому файлы прошлых версий хранят ещё несколько дней, ошибку загрузки куска ловят и показывают «Приложение
        обновилось», а перезагружают только в безопасный момент, не посреди формы и не в цикле.
      - Во время выкатки и после неё с сервером говорят клиенты разных версий, поэтому API меняют приёмом «расширить
        и сузить»: сервер сначала понимает оба формата, потом выходит клиент, и только когда старые клиенты ушли, старое
        убирают.
      - Клиент сообщает серверу свою версию в заголовке, чтобы сервер видел, сколько старых клиентов осталось, и мог
        попросить слишком старый обновиться.

      ## Источники

      - [HTTP caching: хэш в имени и долгий кэш — web.dev](https://web.dev/articles/http-cache)
      - [Cache-Control — MDN](https://developer.mozilla.org/ru/docs/Web/HTTP/Reference/Headers/Cache-Control)
      - [Load Error Handling — документация Vite](https://vite.dev/guide/build#load-error-handling)

  - id: sdr-service-worker
    topic: Рендеринг и доставка
    subtopic: Service Worker и обновления
    title: Service Worker и обновления
    body: |
      ## Какую проблему решаем

      Приложение курьера — веб-приложение, которое курьеры добавляют на главный экран телефона и открывают как обычное
      приложение. Такие веб-приложения называют **PWA** (progressive web app, прогрессивное веб-приложение): их ставят
      на главный экран, они открываются в своём окне без адресной строки и умеют работать без сети с помощью Service
      Worker, о котором этот урок. В курсе 2, в уроке
      «Работа без сети и очередь действий», мы научили его не терять отметки «доставлено» в подвале: они ждут
      в очереди в IndexedDB. Но осталась беда посерьёзнее: **если открыть приложение без сети, оно вообще не
      открывается.** Курьер в лифте нажимает на значок и видит динозавра браузера — страница, скрипты и стили лежат
      на сервере.

      Вторая беда появится, как только мы это починим. Когда приложение умеет открываться из своего кэша, становится
      неясно, как к курьеру попадёт новая версия. Если кэш отдаёт файлы всегда, курьер неделями сидит на старой версии.
      Если обновлять всё сразу, новая версия может прийти посреди отметки заказа.

      Этот урок о Service Worker: как с ним приложение открывается без сети, какие стратегии кэша выбрать для разных
      ресурсов и как устроен переход на новую версию.

      ## Что такое Service Worker

      **Service Worker** — скрипт, который браузер запускает отдельно от страницы и который стоит **между страницей
      и сетью**. Каждый запрос страницы — за HTML, скриптом, картинкой, данными API — сначала попадает к нему в обработчик
      события `fetch`. Он может ответить из своего кэша, сходить в сеть, сделать и то и другое или собрать ответ сам.

      Свойства, которые важны для архитектуры:

      - **Живёт отдельно от вкладки.** Браузер запускает его, когда есть работа, и останавливает в простое. У него нет
        доступа к странице (DOM), а данные он хранит в Cache Storage и IndexedDB — о выборе хранилища курс 2, урок
        «Работа без сети и очередь действий».
      - **Управляет страницами в своей области** (scope): обычно это весь сайт, если файл лежит в корне.
      - **Работает только по HTTPS** (кроме `localhost` при разработке): посредник между страницей и сетью слишком
        мощный, чтобы разрешать его на незащищённых соединениях.
      - **Регистрируется страницей:** `navigator.serviceWorker.register('/sw.js')`.

      MDN описывает Service Worker как прокси-сервер между приложением и сетью. Где это сравнение ломается: Service
      Worker не обычный прокси-сервер в сети, он работает в браузере
      человека и только для своего сайта. И он не живёт постоянно: между событиями браузер может его остановить,
      поэтому держать состояние в его переменных нельзя.

      ## Стратегии: откуда брать ответ

      Для каждого вида запросов Service Worker выбирает, откуда брать ответ. Устоявшиеся названия стратегий пришли
      из библиотеки **Workbox** от команды Chrome, которой Service Worker обычно и собирают.

      - **Сначала кэш** (Cache First) — есть в кэше, отдать оттуда; нет — сходить в сеть и положить в кэш.
        - Для чего: файлы с хэшем в имени, шрифты, иконки — то, что под этим именем не меняется.
        - Цена: если положить так то, что меняется, человек будет видеть старое.
      - **Сначала сеть** (Network First) — попробовать сеть; не вышло — отдать из кэша.
        - Для чего: то, что должно быть свежим, но без сети лучше старое, чем ничего: список заказов, профиль.
        - Цена: на медленной сети ждём, пока сеть не ответит или не истечёт тайм-аут.
      - **Кэш и обновление в фоне** (Stale While Revalidate) — сразу отдать из кэша и параллельно обновить кэш из сети.
        - Для чего: то, где небольшое отставание терпимо: аватары, справочники, ненавязчивые данные.
        - Цена: человек видит прошлую версию до следующего открытия.
      - **Только сеть** (Network Only) — без кэша.
        - Для чего: оплата, отметки, всё, что меняет данные; запросы, которые нельзя подменить старым ответом.

      Третья стратегия — та же идея stale-while-revalidate, что в курсе 2, в уроке «Когда данные устаревают», только
      на уровне Service Worker.

      ### Оболочка приложения

      Частый способ устроить офлайн-открытие — **модель оболочки приложения** (app shell): HTML, скрипты и стили, без
      которых интерфейс не нарисовать, заранее кладут в кэш при установке Service Worker. Это называется **предварительное
      кэширование** (precaching): сборщик составляет список файлов текущей версии с хэшами, а Service Worker при
      установке их скачивает. Данные приходят отдельно — из сети или из IndexedDB. Тогда без сети приложение открывается
      мгновенно и показывает то, что знает, а не ошибку браузера.

      ## Жизненный цикл: почему новая версия не включается сама

      Service Worker — тоже код, и у него бывают новые версии. Переход между ними устроен осторожно, и это главное, что
      нужно понимать для архитектуры.

      1. **Проверка.** Браузер проверяет, не изменился ли файл `sw.js`, при каждом переходе на страницу сайта, а также
         при событиях вроде push, если с прошлой проверки прошли сутки. Страница может запросить проверку сама вызовом
         `registration.update()`, например при возврате на вкладку. Файл `sw.js` браузер берёт мимо своего HTTP-кэша.
         Если изменился хотя бы байт, это новая версия.
      2. **Установка** (install). Новая версия запускается параллельно со старой и готовит кэш: скачивает файлы своей
         оболочки. Старая в это время продолжает обслуживать открытые страницы.
      3. **Ожидание** (waiting). Установленная новая версия **ждёт**, пока закроются все вкладки, которыми управляет
         старая. Даже перезагрузки одной вкладки обычно мало: новая страница начинает загружаться раньше, чем уходит
         старая, и старая версия так и не отпускает управление.
      4. **Активация** (activate). Когда старых страниц не осталось, новая версия активируется и начинает управлять
         страницами, а её обработчик события `activate` удаляет кэши прошлой версии. Удаляет их ваш код или Workbox,
         сам браузер этого не делает.

      ![Схема жизненного цикла: версия 1 управляет открытой вкладкой; версия 2 устанавливается и скачивает свою оболочку, затем ждёт; вкладку закрыли — версия 2 активируется, удаляет кэш версии 1 и управляет новыми страницами; рядом путь «Обновить»: страница просит версию 2 не ждать, та активируется, страница перезагружается](images/sdr-service-worker.png "Как новая версия Service Worker сменяет старую")

      Зачем ожидание? Чтобы одна страница не оказалась с кодом одной версии, а кэшем другой. Представьте, что новая
      версия сразу удалит старые файлы: открытая вкладка попросит свой ленивый кусок — тот самый случай из урока
      «Кэш файлов и выкатка новой версии» — и получит ошибку.

      ### Как обновиться, не дожидаясь закрытия всех вкладок

      У новой версии есть вызов `self.skipWaiting()`: не ждать, а активироваться сразу. Страницы, которыми управляла
      старая версия, после этого переходят к новой. Вызов `clients.claim()` нужен для другого: он берёт под управление
      страницы, которые открылись вовсе без Service Worker, например при первой установке. Делать `skipWaiting()` молча
      опасно — ровно по причине выше: открытая страница со старым кодом окажется под управлением новой версии.

      Поэтому принятый путь такой:

      1. Страница замечает, что появилась ожидающая версия: у регистрации есть свойство `waiting`, а событие
         `updatefound` говорит, что началась установка, — после него следят, когда новая версия перейдёт в состояние
         `installed`. Если у страницы уже есть управляющая версия (`navigator.serviceWorker.controller`), это
         обновление; если нет — первая установка, и предлагать обновиться незачем.
      2. Показывает человеку «Доступна новая версия — обновить».
      3. По нажатию отправляет ожидающей версии сообщение, и та вызывает `skipWaiting()`.
      4. Страница ловит событие `controllerchange` — управление сменилось — и перезагружается уже с новым кодом.

      Человек сам выбирает момент, а значит, обновление не случится посреди формы.

      ## Пример целиком: приложение курьера

      Решения для приложения курьера:

      1. **Оболочка — предварительное кэширование.** Сборка составляет список файлов версии с хэшами, Service Worker
         скачивает их при установке. Без сети приложение открывается из кэша за долю секунды.
      2. **Переходы по страницам приложения** Service Worker обслуживает кэшированной страницей-входом оболочки.
         Она новая только вместе с новой версией Service Worker, поэтому оболочка всегда согласована сама с собой.
      3. **Файлы с хэшем, шрифты, иконки** — «сначала кэш».
      4. **Список заказов** — «сначала сеть» с тайм-аутом 3 секунды: в лифте курьер сразу видит последнюю сохранённую
         копию с пометкой времени, а не крутящийся индикатор.
      5. **Отметки «доставлено», «забрал заказ»** — «только сеть»: они идут через очередь из курса 2, и Service Worker
         не должен подменять ответ сервера.
      6. **Обновление.** Утром курьер открывает приложение, браузер находит новый `sw.js`, новая версия устанавливается
         и ждёт. На экране плашка «Доступна новая версия — обновить». Курьер нажимает её, когда закончил с заказом.
         Очередь в IndexedDB при этом не трогается: она переживает перезагрузку, как и было задумано в курсе 2.
      7. **Сам `sw.js`** не кэшируют на CDN: браузер проверяет его мимо своего HTTP-кэша, но CDN могла бы отдать ему
         старую копию. А чтобы курьер, который весь день не закрывает приложение, получил новую версию, страница
         вызывает `registration.update()` при возврате на вкладку.

      А что с покупательским сайтом? Ему офлайн-открытие почти не нужно: без сети заказать еду всё равно нельзя.
      Service Worker там можно не ставить вовсе. Это нормальный выбор: Service Worker — инструмент для конкретной
      задачи, а не обязательная часть любого приложения. Основа офлайн-режима, когда данные живут на устройстве, —
      тема курса «Синхронизация и офлайн».

      ## Типичные ошибки

      - **«Сначала кэш» для HTML и данных.** Приложение открывается быстро, но неделями показывает старое.
      - **`skipWaiting()` без спроса.** Новая версия берёт открытую страницу со старым кодом, и ленивые куски не находятся.
      - **Ждать, что новая версия включится после перезагрузки.** Обычно нужна перезагрузка после того, как ожидающая
        версия активирована, или закрытие всех вкладок.
      - **`sw.js` в кэше CDN.** Браузер проверяет его мимо своего кэша, но CDN отдаёт старую копию, и новую версию
        никто не видит.
      - **Хранить состояние в переменных Service Worker.** Браузер останавливает его в простое, и переменные пропадают.
      - **Service Worker «на всякий случай».** Его ошибка кэширования ломает сайт у людей так, что не помогает даже
        обычная перезагрузка; ставят его, когда есть задача.

      ## Как спрашивают на интервью

      - «Как сделать, чтобы приложение открывалось без сети?» — ждут Service Worker, оболочку приложения и стратегии
        для разных ресурсов.
      - «Мы выкатили новую версию, а пользователи PWA её не видят. Почему?» — ждут ожидания новой версии
        и пути «Доступна новая версия — обновить».
      - «Какую стратегию кэша выберете для API, картинок и скриптов?» — ждут разных ответов для разных ресурсов.

      ## Коротко

      - Service Worker — скрипт между страницей и сетью: каждый запрос страницы попадает к нему, и он отвечает из кэша,
        из сети или сам. Он живёт отдельно от вкладки, работает только по HTTPS, и браузер останавливает его в простое,
        поэтому состояние держат в Cache Storage и IndexedDB.
      - Стратегию выбирают для каждого вида запросов: «сначала кэш» — для файлов с хэшем, шрифтов и иконок, «сначала сеть» —
        для того, что должно быть свежим, но без сети лучше старое, «кэш и обновление в фоне» — где отставание терпимо,
        «только сеть» — для изменений.
      - Модель оболочки приложения кладёт HTML, скрипты и стили в кэш при установке (предварительное кэширование), а данные
        приходят отдельно, поэтому без сети приложение открывается мгновенно.
      - Новая версия устанавливается рядом со старой и ждёт, пока закроются все вкладки старой, — чтобы страница
        не оказалась с кодом одной версии и кэшем другой. Перезагрузки одной вкладки обычно мало.
      - Обновляют по согласию: показывают «Доступна новая версия — обновить», по нажатию ожидающая версия вызывает
        `skipWaiting()`, а страница по `controllerchange` перезагружается. `skipWaiting()` без спроса ломает открытые
        страницы.
      - Service Worker ставят, когда есть задача вроде офлайн-открытия; сайту, которым без сети всё равно не пользоваться,
        он может быть не нужен.

      ## Источники

      - [The service worker lifecycle — web.dev](https://web.dev/articles/service-worker-lifecycle)
      - [Service Worker API — MDN](https://developer.mozilla.org/ru/docs/Web/API/Service_Worker_API)
      - [Стратегии кэширования, workbox-strategies — документация Workbox](https://developer.chrome.com/docs/workbox/modules/workbox-strategies)

  - id: sdr-security
    topic: Сквозные требования
    subtopic: Границы безопасности
    title: Где кончается доверие
    body: |
      ## Какую проблему решаем

      В кабинете ресторана появилось поле «Описание» с форматированием: жирный, списки, ссылки. Описание видит каждый
      покупатель на странице ресторана. Разработчик сделал просто: редактор отдаёт HTML, сервер его сохраняет, а страница
      ресторана вставляет его как есть.

      Через неделю служба безопасности присылает скриншот. Кто-то получил доступ к кабинету одного ресторана и вставил
      в описание `<img src="x" onerror="...">`. У каждого покупателя, открывшего страницу, выполнился чужой скрипт:
      он нарисовал поверх страницы поддельную форму «Подтвердите карту» и отправлял введённое на чужой сервер.

      Ни сервер, ни браузер не ошиблись: сервер сохранил то, что прислали, браузер выполнил то, что было на странице.
      Ошибка в архитектуре: текст, написанный одним человеком, стал **кодом** на странице другого. Этот урок о границах
      доверия и о том, как не дать данным превратиться в код.

      ## Граница доверия

      **Граница доверия** (trust boundary) — линия, через которую данные приходят из места, которое вы не контролируете.
      Всё, что пересекло её, считается недоверенным, пока не проверено.

      Для веб-приложения таких границ несколько:

      - **браузер → сервер.** Код фронтенда работает на устройстве человека, и тот может изменить его и отправить что
        угодно. Об этом курс 1, урок «Контракт API глазами фронтенда»: цену, права и однократность заказа гарантирует
        сервер, а проверки на клиенте — подсказка;
      - **один пользователь → другой.** Описание ресторана, отзыв, имя в чате, название файла — всё, что написал один
        человек, а видит другой, пришло из-за границы, даже если прошло через ваш сервер;
      - **чужой сайт → ваш.** Другой сайт может отправить запрос к вашему API от имени вашего пользователя или встроить
        вашу страницу в рамку;
      - **сторонний код.** Скрипт аналитики, виджет чата, библиотека из npm работают на вашей странице с теми же правами,
        что ваш код.

      На фронтенде граница доверия чаще всего проходит в момент **вывода**: когда чужие данные попадают в HTML страницы.

      ## XSS: как данные становятся кодом

      **XSS** (cross-site scripting, межсайтовый скриптинг) — уязвимость, при которой чужие данные выполняются на вашей
      странице как скрипт. У такого скрипта те же права, что у вашего кода: он видит страницу, может делать запросы к API
      от имени человека, подменять формы и читать всё, что доступно JavaScript.

      Бывает несколько видов:

      - **хранимый** (stored) — вредный текст сохранили в базе, и он выполняется у каждого, кто его откроет: описание
        ресторана, отзыв;
      - **отражённый** (reflected) — вредный текст пришёл в адресе ссылки и попал на страницу, например в «Вы искали: …»;
      - **в DOM** (DOM-based) — клиентский код сам берёт данные из адреса или хранилища и вставляет их в страницу как
        HTML.

      ### Что делает React и где он не защищает

      React по умолчанию **экранирует** текст: в `<p>{review.text}</p>` угловые скобки станут символами, а не тегами,
      и скрипт не выполнится. Это главная защита, и большая часть интерфейса ею закрыта.

      Дыры остаются там, где эту защиту обходят:

      - **`dangerouslySetInnerHTML`** и `innerHTML` — вставить строку как HTML. Название в React намеренно пугающее;
      - **адреса в `href` и `src`** — ссылка `javascript:alert(1)` выполняет код при нажатии. Новые версии React такие адреса
        предупреждают или блокируют, но адреса из данных всё равно фильтруют сами: разрешают только `http:` и `https:`;
      - **сторонние библиотеки,** которые рисуют HTML из данных: редакторы, рендеры Markdown, графики с подписями.

      ## Как показывать чужой HTML

      Иногда HTML действительно нужен: форматированное описание, письмо в почтовом клиенте, статья из редактора. Тогда
      есть три уровня защиты.

      **1. Не принимать HTML, если можно.** Ограниченный формат вроде Markdown или собственной структуры («абзац, список,
      ссылка») сохраняют и превращают в разметку своим кодом. Важная оговорка: спецификация Markdown разрешает вставлять
      сырой HTML, и рендереры обращаются с ним по-разному. Например, marked пропускает HTML всегда, и его вывод обязательно
      чистят санитайзером, а в markdown-it сырой HTML выключен опцией `html: false`, и она стоит по умолчанию. Схемы
      ссылок проверяют отдельно: ссылки в Markdown тоже бывают `javascript:`.

      **2. Санитизация** (sanitization) — очистка HTML по **белому списку**: разрешены только перечисленные теги
      и атрибуты (`b`, `i`, `ul`, `li`, `a` с атрибутом `href`), всё остальное удаляется. Белый список, а не чёрный:
      способов спрятать скрипт в HTML слишком много, чтобы перечислить запрещённое. Признанная библиотека для этого
      в браузере — **DOMPurify**; OWASP советует именно её. Свою санитизацию на регулярных выражениях не пишут.

      Где санитизировать? Надёжнее всего — **при выводе**, прямо перед вставкой в страницу: правила вывода зависят
      от места, а библиотеку можно обновить, и она защитит и старые записи. Санитизация при сохранении полезна
      как дополнительный слой, но если обходной путь найдут после сохранения, она уже не поможет.

      **3. Политика безопасности контента** — вторая линия, о ней ниже.

      ## CSP: вторая линия обороны

      **Content Security Policy** (CSP, политика безопасности контента) — заголовок ответа, которым сервер говорит
      браузеру, какой код на этой странице разрешено выполнять. Если XSS всё-таки случился, браузер откажется выполнять
      то, что политика не разрешает.

      Надёжный вариант — **строгая политика с одноразовым номером** (nonce): сервер при каждом ответе генерирует
      случайную строку, ставит её в заголовок и во все свои теги `<script>`.

      ```http
      Content-Security-Policy: script-src 'nonce-r4nd0m' 'strict-dynamic'; object-src 'none'; base-uri 'none'
      ```

      Скрипт без правильного номера — например, вставленный через описание ресторана — браузер не выполнит. Встроенные
      обработчики вроде `onerror="..."` при такой политике тоже не работают. А `'strict-dynamic'` разрешает скриптам
      с номером загружать свои куски кода, иначе сломалось бы разбиение кода.

      Для заранее собранных страниц, где номер каждый раз не сгенерировать, вместо номера используют хэши: в политике
      записан хэш содержимого каждого разрешённого встроенного скрипта. Внешние файлы приложения при этом подключает
      маленький встроенный загрузчик с хэшем в политике, а `'strict-dynamic'` разрешает всё, что он загрузил.

      Цена CSP — её нужно настроить так, чтобы не сломать свои же скрипты, аналитику и виджеты. Поэтому её вводят
      в два шага: сначала заголовок `Content-Security-Policy-Report-Only` — браузер ничего не блокирует, только присылает
      отчёты о нарушениях, — и лишь когда отчёты чистые, включают блокировку. Политика с `'unsafe-inline'` в `script-src`
      почти ничего не защищает: она разрешает как раз встроенные скрипты.

      CSP — вторая линия, а не замена первой: она снижает вред от ошибки, но правильный вывод данных остаётся главным.

      ## Сторонний код и чужие рамки

      Две границы доверия из списка выше защищают своими средствами.

      - **Сторонний код** — аналитика, виджет чата, библиотеки — работает с правами вашего кода. Строгая политика
        с `'strict-dynamic'` не ограничивает, что загрузит уже доверенный скрипт: список доменов в `script-src` при ней
        не действует. Куда сторонний код может отправлять данные и что встраивать, ограничивают другими директивами CSP —
        `connect-src`, `img-src`, `frame-src`. Скрипты с чужого CDN подключают с атрибутом `integrity`
        (хэш содержимого): если файл на CDN подменили, браузер его не выполнит. Тяжёлые чужие виджеты по возможности
        выносят в `<iframe>` с атрибутом `sandbox`, чтобы у них не было доступа к вашей странице.
      - **Встраивание вашей страницы в чужую рамку.** Злоумышленник может показать вашу страницу в прозрачной рамке
        поверх своей и заставить человека нажать кнопку, которую тот не видит (clickjacking). Защита — директива
        `frame-ancestors` в CSP: она перечисляет, кому разрешено встраивать страницу, например `frame-ancestors 'none'`.

      ## Запросы с чужого сайта: CSRF и SameSite

      **CSRF** (cross-site request forgery, подделка межсайтового запроса) — чужой сайт заставляет браузер человека
      отправить запрос к вашему API. Если вход держится на cookie, браузер сам приложит её к запросу, и сервер решит,
      что действие сделал человек. Пример: человек открыл страницу злоумышленника, а та незаметно отправила форму
      «сменить адрес доставки» на ваш сервер.

      Защита строится на нескольких мерах:

      - **атрибут cookie `SameSite`.** `SameSite=Lax` — браузер не прикладывает cookie к запросам с чужих сайтов, кроме
        обычного перехода по ссылке методом GET; `SameSite=Strict` — не прикладывает вовсе. Chrome уже считает
        `Lax` значением по умолчанию, другие браузеры — не всегда, поэтому атрибут задают явно. `SameSite=None`
        (только вместе с `Secure`) прикладывает cookie везде; его ставят виджетам, которые встраиваются на чужие сайты,
        и тогда от CSRF защищают другие меры из этого списка. Учтите, что Safari такие cookie в чужой рамке обычно
        не отправляет, а Firefox хранит их отдельно для каждого сайта. И ещё: `SameSite` считает «своим» сайтом
        и поддомены, поэтому взломанный поддомен его обходит;
      - **запросы, меняющие данные, — никогда через GET,** как в курсе 1, уроке «Чтение, запись и реакция интерфейса».
        Иначе даже `Lax` пропустит переход по ссылке;
      - **проверка на сервере,** откуда пришёл запрос: заголовок `Origin` или специальный токен в форме.

      Если API принимает токен в заголовке `Authorization`, а не в cookie, классического CSRF нет: чужой сайт не может
      приложить заголовок, которого не знает. Где хранить токены и почему не в `localStorage`, разобрано в курсе 2,
      в уроке «Сессия и обновление токена». Там же важная оговорка: cookie с флагом `HttpOnly` защищает токен от
      кражи скриптом, но не от действий — XSS может отправлять запросы от имени человека прямо с его страницы. Поэтому
      защита от XSS важнее, чем выбор места для токена.

      ## Пример целиком: описание ресторана

      Решения для поля «Описание»:

      1. **Формат.** Редактор кабинета сохраняет не HTML, а Markdown с ограниченным набором: жирный, курсив, списки,
         ссылки. Рендерер Markdown настроен не пропускать сырой HTML. Сервер отклоняет описание длиннее 3000 символов.
      2. **Вывод.** Страница ресторана превращает Markdown в HTML и пропускает результат через DOMPurify с белым
         списком: `p`, `b`, `i`, `ul`, `ol`, `li`, `a`. У ссылок разрешён только `href` со схемой `http` или `https`,
         и им добавляется `rel="nofollow ugc noopener"`: это чужие ссылки, поисковикам не стоит считать их нашими
         рекомендациями.
      3. **CSP.** Страницы ресторанов отдаются со строгой политикой. Они собираются заранее, поэтому вместо одноразовых
         номеров — хэши: файлы приложения подключает встроенный загрузчик с хэшем в политике, остальное разрешает
         `'strict-dynamic'`, а `frame-ancestors 'none'` запрещает встраивать страницу в чужие рамки. Перед включением
         политика две недели работала в режиме отчётов: нашлись два встроенных скрипта аналитики, их хэши добавили
         в политику.
      4. **Cookie сессии кабинета** — `HttpOnly`, `Secure`, `SameSite=Lax`; смена описания — только запросом `PUT`
         с проверкой заголовка `Origin` на сервере.

      Атака из начала урока теперь не проходит трижды: рендерер Markdown не пропускает сырой `<img onerror>`, санитизация удалила бы
      атрибут `onerror`, а CSP не выполнила бы встроенный обработчик.

      ## Типичные ошибки

      - **Вставлять чужой HTML как есть** через `dangerouslySetInnerHTML` или `innerHTML`.
      - **Санитизация чёрным списком** или самописной регулярной заменой: «уберём `<script>`» не спасает от `onerror`.
      - **Пропускать любые адреса в ссылки.** `javascript:` в `href` выполняет код.
      - **Считать проверки на клиенте защитой.** Запрос можно отправить в обход интерфейса.
      - **CSP с `'unsafe-inline'`** или сразу в режиме блокировки без отчётов — первая не защищает, вторая ломает сайт.
      - **Изменения через GET.** Их отправит любой чужой сайт простой ссылкой или картинкой.

      ## Как спрашивают на интервью

      - «Пользователи могут писать отзывы с форматированием. Как показать их безопасно?» — ждут ограниченный формат или
        санитизацию по белому списку при выводе и CSP.
      - «Что такое XSS и почему React от него защищает не полностью?» — ждут экранирования по умолчанию и мест, где его
        обходят.
      - «Где хранить токен и что защищает от CSRF?» — ждут `HttpOnly` и `SameSite`, токен в заголовке и то, что XSS
        опаснее выбора хранилища.

      ## Коротко

      - Граница доверия — линия, через которую приходят данные из неконтролируемого места: из браузера, от другого
        пользователя, с чужого сайта, из стороннего кода. Всё, что её пересекло, недоверенное, а на фронтенде граница
        чаще всего проходит в момент вывода чужих данных.
      - XSS — чужие данные выполняются на вашей странице как скрипт с правами вашего кода. React экранирует текст
        по умолчанию, а дыры остаются в `dangerouslySetInnerHTML`, `innerHTML`, адресах вроде `javascript:` и сторонних
        библиотеках, которые рисуют HTML.
      - Чужой HTML лучше не принимать вовсе, заменив его ограниченным форматом вроде Markdown с выключенным сырым HTML. Если HTML нужен, его чистят
        по белому списку признанной библиотекой (DOMPurify), надёжнее всего — при выводе.
      - CSP — вторая линия: заголовок говорит браузеру, какой код разрешено выполнять. Строгая политика с одноразовым номером
        или хэшами не даст выполниться вставленному скрипту, а вводят её через режим отчётов.
      - Сторонний код работает с правами вашего: `'strict-dynamic'` его загрузки не ограничивает, куда он ходит, сужают
        `connect-src` и `img-src`, подмену файла на CDN ловит атрибут `integrity`, а встраивание вашей страницы в чужую
        рамку запрещает `frame-ancestors`.
      - CSRF — чужой сайт отправляет запрос от имени человека, потому что браузер сам прикладывает cookie. Защищают
        `SameSite`, отказ от изменений через GET и проверка `Origin`; токен в заголовке `Authorization` от CSRF не страдает.
      - `HttpOnly` защищает токен от кражи, но не от действий: XSS может делать запросы прямо со страницы человека, поэтому
        защита от XSS важнее выбора места для токена.

      ## Источники

      - [Cross Site Scripting Prevention Cheat Sheet — OWASP](https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html)
      - [Content Security Policy (CSP) — MDN](https://developer.mozilla.org/ru/docs/Web/HTTP/Guides/CSP)
      - [Set-Cookie, атрибут SameSite — MDN](https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Set-Cookie#samesitesamesite-value)

  - id: sdr-a11y
    topic: Сквозные требования
    subtopic: Доступность как часть архитектуры
    title: Доступность в архитектуре
    body: |
      ## Какую проблему решаем

      В курсе 1, в уроке «Компонент как контракт», мы договорились: клавиатура, фокус и роли — часть контракта каждого
      компонента. Команда сделала это честно: кнопки — настоящие `<button>`, у окна корзины правильный фокус, поле
      адреса работает со стрелками. И всё равно незрячий покупатель с программой экранного чтения пишет в поддержку:

      - **«Я не знаю, сменился ли статус заказа».** Надпись на экране отслеживания меняется раз в 30 секунд, но программа
        чтения об этом молчит: она читает то, на чём стоит фокус, а фокус на кнопке «Позвонить курьеру».
      - **«После нажатия на ресторан ничего не происходит».** На самом деле страница сменилась, но приложение
        одностраничное, браузер не загружал новую страницу, и программе чтения нечего объявить. Фокус остался там,
        где была ссылка, а её уже нет на экране.
      - **«Не могу добраться до контактов».** В подвале сайта телефон поддержки, но при переходе по Tab лента
        ресторанов догружается бесконечно, и подвал всё время уезжает.

      Каждый компонент по отдельности доступен, а **сценарии** — нет. Этот урок о доступности на уровне сценариев
      и всего приложения: что делать, когда экран меняется без перезагрузки, как вести фокус при переходах и почему
      доступность — критерий выбора архитектуры, а не доделка.

      ## Сначала понятия

      **Экранный чтец** (screen reader) — программа, которая озвучивает интерфейс: VoiceOver на iPhone и Mac, TalkBack
      на Android, NVDA и JAWS на Windows. Человек перемещается по странице клавишами или жестами, и чтец читает то,
      на чём стоит **фокус** или виртуальный курсор, а также роль элемента: «кнопка», «ссылка», «заголовок второго уровня».

      **WCAG** (Web Content Accessibility Guidelines) — международное руководство W3C по доступности веб-содержимого.
      Обычная цель продуктов — уровень соответствия AA версии 2.2. Во многих странах это уже не только хороший тон:
      например, с июня 2025 года в Евросоюзе действует закон о доступности (European Accessibility Act), и интернет-магазины
      обязаны быть доступными.

      ## Изменения без перезагрузки: живые области

      Чтец не следит за всей страницей: он читает то, к чему подвёл человек. Если что-то поменялось в другом месте —
      пришёл новый статус, отфильтровались результаты, появилась ошибка, — человек об этом не узнает.

      **Живая область** (live region) — часть страницы, изменения в которой чтец объявляет сам, не перенося фокус. Её
      задают атрибутом `aria-live`:

      - **`aria-live="polite"`** — объявить, когда чтец закончит текущую фразу. Для большинства случаев: новый статус,
        «Найдено 12 блюд», «Добавлено в корзину».
      - **`aria-live="assertive"`** — прервать и объявить сразу. Только для срочного: «Сессия истекает через минуту»,
        ошибка оплаты. Если злоупотреблять, человек перестанет понимать, что важно.

      Есть готовые роли с этим поведением: **`role="status"`** — вежливое объявление, **`role="alert"`** — срочное.

      ```html
      <p role="status">Статус заказа: курьер в пути, будет в 19:40</p>
      ```

      Главная ловушка: **живая область должна уже быть на странице до того, как в ней изменится текст.** Чтец следит
      за изменениями внутри уже известной ему области. Если компонент с `role="status"` появляется вместе с текстом,
      многие чтецы ничего не скажут. Поэтому область рисуют сразу, пустой, а потом меняют её содержимое.

      ## Переходы между страницами

      В обычном многостраничном сайте при переходе браузер загружает новую страницу, и чтец объявляет её заголовок.
      В одностраничном приложении браузер страницу не загружает: маршрутизатор подменяет часть экрана (урок «Маршруты
      и переходы»). Для чтеца ничего не произошло, а фокус либо остался на ссылке, которой больше нет, либо улетел
      в начало документа.

      Поэтому при смене маршрута приложение делает сам то, что браузер делал бы при загрузке:

      1. **Меняет заголовок вкладки** — `document.title`: «Пицца на углу — меню».
      2. **Переносит фокус** на главный заголовок новой страницы (`<h1 tabindex="-1">`) или в начало основного
         содержимого. Тогда чтец прочитает заголовок, а следующее нажатие Tab поведёт по новой странице, а не по старой
         шапке.
      3. **При возврате «Назад»** — возвращает фокус туда, откуда человек ушёл, если это возможно, вместе с прокруткой.

      Это решение уровня маршрутизатора, а не отдельной страницы: его пишут один раз в оболочке приложения, и оно
      работает для всех переходов. Если оставить его каждой команде, половина страниц про него забудет.

      ## Диалоги, шторки и что за ними

      Правила для модального окна — фокус внутрь, Tab по кругу, Escape закрывает, фокус возвращается — разобраны
      в курсе 1, в уроке «Компонент как контракт». На уровне приложения добавляется вот что:

      - **страница под окном должна стать недоступной** не только для мыши, но и для чтеца и клавиатуры. Встроенный
        `<dialog>`, открытый через `showModal()`, делает это сам. Для своих решений есть атрибут `inert`: элемент и всё
        внутри него перестают получать фокус и пропадают для чтеца;
      - **окно, открытое по адресу** (как карточка блюда `?dish=57` из урока «Маршруты и переходы»), при открытии
        по ссылке тоже получает фокус, а при закрытии кнопкой «Назад» фокус возвращается на карточку в меню.

      ## Ленты и длинные списки

      Бесконечная прокрутка удобна пальцу, но опасна для клавиатуры и чтеца:

      - **подвал недостижим:** каждый раз, когда фокус подходит к концу, догружается следующая порция;
      - **человек не знает, что пришло новое:** список вырос, но чтец об этом молчит;
      - **место теряется,** если при догрузке список перестраивается.

      Что помогает:

      - **кнопка «Показать ещё»** вместо догрузки по прокрутке — выбор, который в курсе 2, в уроке «Пагинация живых
        списков», оправдывали доступностью подвала. Для клавиатуры это почти всегда лучше;
      - **объявление результата** через живую область: «Загружено ещё 20 ресторанов»;
      - **фокус на первом новом элементе** после нажатия «Показать ещё», чтобы человек продолжил с того же места;
      - для настоящих лент есть шаблон **feed** в WAI-ARIA Authoring Practices: `role="feed"`, у элементов
        `aria-posinset` и `aria-setsize`, а на время догрузки — `aria-busy="true"`.

      Отдельная тема — **виртуализированные списки**, где в документе есть только видимые строки. Это разбирается в курсе
      «Реальное время и большие списки».

      ## Доступность как критерий выбора

      Многое из сказанного трудно добавить потом. Перенос фокуса при переходах живёт в маршрутизаторе, живые области —
      в общем слое уведомлений, поведение окон — в библиотеке компонентов. Если библиотека, на которой построено
      приложение, не умеет правильный фокус в выпадающих списках, исправлять придётся в сотнях мест или менять
      библиотеку.

      Поэтому доступность проверяют **при выборе** архитектурных кирпичей:

      - **библиотека компонентов** — повторяет ли она шаблоны WAI-ARIA Authoring Practices для своих виджетов, проверена
        ли с чтецами. Есть «безголовые» библиотеки (headless) вроде React Aria или Radix, которые берут на себя поведение
        и роли, оставляя внешний вид вам; их цена — делать и поддерживать внешний вид самим;
      - **маршрутизатор** — можно ли централизованно управлять фокусом и заголовком при переходе;
      - **слой уведомлений** — есть ли общая живая область, через которую идут все объявления;
      - **сторонние виджеты** — чат поддержки, карта, платёжная форма: их доступность часто определяет, пройдёт ли человек
        сценарий целиком.

      И проверяют постоянно: автоматические инструменты вроде axe находят часть ошибок — нет подписи, неверная роль,
      слабый контраст, — но не скажут, удобен ли сценарий. Поэтому главные сценарии раз в выпуск проходят руками:
      только клавиатурой и с чтецом.

      ## Пример целиком: от выбора ресторана до статуса

      Решения сервиса доставки:

      1. **Каталог.** Фильтр кухни меняет список без перезагрузки; в общей живой области объявляется «Найдено 12
         ресторанов». Внизу — «Показать ещё» вместо бесконечной прокрутки; после нажатия фокус встаёт на первый новый
         ресторан, а область объявляет «Загружено ещё 20».
      2. **Переход в ресторан.** Оболочка приложения на каждый переход меняет `document.title` и переносит фокус на `<h1>`
         с названием ресторана. Чтец говорит: «Пицца на углу, заголовок первого уровня».
      3. **Корзина.** «Добавлено: Маргарита» — вежливое объявление через ту же область, фокус остаётся на кнопке, чтобы
         человек мог добавить ещё.
      4. **Оформление.** Ошибка оплаты — `role="alert"`, срочно. Сообщения об ошибках полей связаны с полями, как в курсе 2,
         в уроке «Формы и валидация».
      5. **Отслеживание.** Строка статуса — `role="status"`, нарисована сразу при открытии экрана. Когда опрос раз
         в 30 секунд приносит новый статус, меняется только её текст, и чтец вежливо объявляет: «Курьер в пути».
      6. **Выбор кирпичей.** Библиотеку компонентов кабинета ресторана выбирали в том числе по тому, как её выпадающие
         списки и окна работают с NVDA и VoiceOver.

      ## Типичные ошибки

      - **Доступные компоненты, недоступные сценарии.** Каждая кнопка в порядке, а новый статус и смена страницы проходят
        мимо чтеца.
      - **Живая область, которая появляется вместе с текстом.** Чтец её не замечает и молчит.
      - **`assertive` на всё.** Каждое «Добавлено в корзину» перебивает чтеца, и важное тонет.
      - **Фокус после перехода остаётся на исчезнувшей ссылке** или улетает в начало документа.
      - **Бесконечная лента без альтернативы:** до подвала с клавиатуры не дойти.
      - **Выбирать библиотеку компонентов только по внешнему виду.** Чинить фокус в чужих выпадающих списках потом дороже,
        чем выбрать правильную библиотеку.
      - **Полагаться только на автоматическую проверку.** Она находит отсутствие подписей, но не скажет, проходится ли
        оформление заказа с чтецом.

      ## Как спрашивают на интервью

      - «Как сделать доступным одностраничное приложение?» — ждут фокус и заголовок при смене маршрута, живые области
        и доступность как часть выбора библиотек.
      - «Статус заказа обновляется сам. Как об этом узнает незрячий пользователь?» — ждут `aria-live` или `role="status"`
        и то, что область есть на странице заранее.
      - «Бесконечная лента и доступность — в чём проблема?» — ждут подвал, объявления и «Показать ещё».

      ## Коротко

      - Доступные компоненты не делают доступными сценарии: смену статуса, переход между страницами, догрузку ленты
        проектируют на уровне приложения.
      - Изменения без перезагрузки объявляют живой областью (`aria-live`, `role="status"`, `role="alert"`): `polite` —
        для большинства случаев, `assertive` — только для срочного. Область должна быть на странице до того, как в ней
        изменится текст.
      - При смене маршрута одностраничное приложение само делает то, что браузер делал бы при загрузке: меняет
        `document.title` и переносит фокус на главный заголовок. Это пишут один раз в маршрутизаторе или оболочке.
      - Под модальным окном страница должна стать недоступной и для клавиатуры, и для чтеца: это делает `<dialog>` через
        `showModal()` или атрибут `inert`.
      - Бесконечная лента прячет подвал от клавиатуры. Помогают «Показать ещё», объявление о догрузке и фокус на первом
        новом элементе, а для настоящих лент — шаблон feed из WAI-ARIA Authoring Practices.
      - Доступность — критерий выбора библиотеки компонентов, маршрутизатора и сторонних виджетов: добавить её потом
        значит переделать многое. Автоматические проверки находят часть ошибок, а главные сценарии проходят руками
        с клавиатурой и чтецом.

      ## Источники

      - [WAI-ARIA Authoring Practices Guide — W3C](https://www.w3.org/WAI/ARIA/apg/)
      - [ARIA live regions — MDN](https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Guides/Live_regions)
      - [WCAG 2.2 — W3C](https://www.w3.org/TR/WCAG22/)

  - id: sdr-observability
    topic: Сквозные требования
    subtopic: Наблюдаемость
    title: Что происходит у пользователей
    body: |
      ## Какую проблему решаем

      Поддержка сервиса доставки сообщает: «С утра много жалоб — у людей не проходит оплата». Команда открывает свои
      инструменты.

      - Логи сервера чистые: ошибок оплаты не больше обычного.
      - Аналитика показывает, что до шага оплаты доходит столько же людей, сколько вчера, а оплачивают на 8 % меньше.
      - Ошибок в браузере никто не собирает.

      Что происходит у этих 8 %, неизвестно. Разработчики пробуют оплатить сами — всё работает. Через два дня случайно
      выясняется: после обычной выкатки исправления в оформлении код вызывает метод, которого нет в старых версиях Safari на iPhone,
      и падает с ошибкой ещё до отправки запроса. Сервер ничего не видел, потому что запрос до него не дошёл.

      **Наблюдаемость** (observability) — свойство системы, которое позволяет по данным, которые она о себе сообщает,
      понять, что с ней происходит, в том числе в ситуациях, которых никто не предвидел. Для фронтенда это значит: знать,
      что видят и с чем сталкиваются люди на своих устройствах, а не только на сервере. Этот урок о том, какие данные
      собирать с клиента, как связать ошибку в браузере с записью на сервере и что собирать нельзя.

      ## Четыре потока данных

      С клиента идут четыре разных вида данных. Они отвечают на разные вопросы, и один не заменяет другой.

      - **Продуктовые события** (product analytics)
        - Что это: «открыл ресторан», «добавил блюдо», «нажал „Оплатить“», «заказ оплачен».
        - На какой вопрос отвечает: доходят ли люди до цели и где отваливаются — воронка.
        - Чего не скажет: почему отвалились.
      - **Скорость** (RUM, real user monitoring)
        - Что это: LCP, INP, CLS и другие замеры у реальных людей — то, о чём урок «Как измерить скорость».
        - На какой вопрос отвечает: быстро ли работает приложение у людей и где медленно.
        - Чего не скажет: о сломанных функциях, если они ломаются быстро.
      - **Ошибки JavaScript**
        - Что это: необработанные исключения и отклонённые промисы, ошибки отрисовки, которые поймала граница ошибок
          (error boundary) в React, со стеком вызовов.
        - На какой вопрос отвечает: что сломалось в коде и у кого.
        - Чего не скажет: о проблемах, которые кодом не считаются: медленный сервер, отказ платёжного сервиса.
      - **Сетевая телеметрия**
        - Что это: какие запросы падали или шли долго, с какими кодами ответа, на каких сетях.
        - На какой вопрос отвечает: что не так между клиентом и сервером.
        - Чего не скажет: что было в коде до запроса.

      В истории с оплатой хватило бы потока ошибок: он показал бы `TypeError` в коде оформления у одной группы людей.
      Воронка только сказала, **что** проблема есть.

      ### Как собирать, не мешая человеку

      - **Ошибки ловят глобально:** события `error` и `unhandledrejection` на `window`, плюс границы ошибок в React
        для отрисовки. Обычно это делает готовый сервис сбора ошибок вроде Sentry.
      - **Стек расшифровывают картами исходников** (source maps). Код в браузере сжат, и стек вида `a.b is not
        a function at t (main.3f9a2c.js:1:48211)` бесполезен. Карты исходников сопоставляют его с исходным кодом. Их
        загружают в сервис сбора ошибок и не выкладывают публично вместе с сайтом.
      - **К каждой записи прикладывают контекст:** версия приложения (та же, что в заголовке `X-App-Version` из урока
        «Кэш файлов и выкатка новой версии»), страница, браузер, устройство, флаги функций, включённые у человека.
        Ошибка «только в версии 42 и только в Safari 15» находится за минуты.
      - **Данные отправляют пачками и не теряют при уходе.** Пачку досылают, когда страница скрывается, через
        `navigator.sendBeacon` или `fetch` с `keepalive` — как черновик в курсе 2, в уроке «Автосохранение».
      - **Выборка** (sampling). Замеры скорости и продуктовые события можно собирать с части сессий — 10 % часто
        достаточно для статистики. Ошибки обычно собирают все: редкая ошибка в редкой ситуации и есть то, что ищут.

      ## Сквозной номер: связать клиент и сервер

      Человек нажал «Оплатить», клиент отправил запрос, сервер API вызвал сервис заказов, тот — платёжный сервис. Где-то
      по дороге ошибка. В логах каждого сервиса тысячи записей в минуту. Как найти записи именно этого нажатия?

      Для этого запросу дают **сквозной номер** (trace ID), который передаётся по всей цепочке и пишется в каждую запись.
      Этот номер и вся цепочка вызовов, связанных одним нажатием, называется **трассой** (trace). Чтобы разные системы
      понимали номер одинаково, у W3C есть стандарт **Trace Context**: номер едет в заголовке `traceparent`.

      ```http
      traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
      ```

      Четыре части через дефис: версия формата, номер трассы (32 шестнадцатеричных знака — общий для всей цепочки),
      номер текущего шага (16 знаков) и флаги, например «эту трассу записывать».

      Клиент начинает трассу сам: создаёт номер на действие человека и прикладывает `traceparent` к запросам. Сервер
      продолжает ту же трассу. Тогда ошибку в браузере и записи в логах всех сервисов можно найти по одному номеру.
      Обычно это делает не самописный код, а **OpenTelemetry** — открытый стандарт и библиотеки для сбора трасс,
      метрик и логов; для браузера есть готовая обвязка `fetch`.

      Одна техническая деталь: если API на другом домене, `traceparent` — нестандартный заголовок, и сервер должен
      разрешить его в `Access-Control-Allow-Headers`, иначе браузер не отправит запрос. Это та же ловушка, что
      с `If-Match` в курсе 2, в уроке «Версии и конфликты».

      ### Идентификатор операции как номер для людей

      Номер трассы удобен машинам. Для людей в сервисе доставки уже есть номер попроще — **идентификатор операции**
      (`operationId`) из курса 2, урок «Повторы без двойных списаний». Он живёт столько же, сколько операция, а не один
      запрос, и переживает повторы. Его кладут в логи рядом с номером трассы, а если операция не удалась, показывают
      человеку: «Не удалось оплатить. Код для поддержки: op-7c1d». Поддержка по этому коду находит все попытки, все
      трассы и что с ними случилось.

      ## Что нельзя отправлять

      Логи, аналитика и сервис ошибок — это копии данных, которые хранятся долго, доступны многим сотрудникам
      и подрядчикам, а иногда лежат у сторонних компаний. Всё, что туда попало, считайте утёкшим. Поэтому:

      - **не отправляют личные данные:** имена, телефоны, адреса доставки, электронную почту. Вместо них — внутренние
        номера: номер пользователя, номер заказа. Законы о персональных данных — в России 152-ФЗ, в Евросоюзе GDPR —
        требуют собирать не больше необходимого и отвечают за передачу данных подрядчикам;
      - **не отправляют секреты:** токены доступа, cookie сессии, одноразовые коды, данные карт;
      - **проверяют адреса страниц.** В параметрах адреса бывают токены сброса пароля, почта, поисковые запросы.
        Адрес в событии чистят до отправки;
      - **проверяют тексты ошибок.** Сообщение ошибки иногда содержит ввод человека: «Неверный адрес: Ленина, 5,
        кв. 12». Такие поля маскируют;
      - **записи сессий** (session replay), которые повторяют действия человека на экране, настраивают так, чтобы
        содержимое полей ввода было скрыто по умолчанию.

      Удобное правило: чистить на клиенте, до отправки, и разрешать поля белым списком. Чистить на сервере поздно —
      данные уже ушли за пределы устройства.

      ## Пример целиком: оплата у 8 %

      Как сервис доставки устроил наблюдаемость после той истории.

      1. **Ошибки.** Сервис сбора ошибок ловит необработанные исключения, отклонённые промисы и ошибки границ в React.
         Карты исходников загружаются при сборке. К каждой ошибке прикладываются версия приложения, страница,
         браузер с версией, устройство и включённые флаги.
      2. **Скорость.** Библиотека `web-vitals` отправляет LCP, INP и CLS с 10 % сессий.
      3. **Воронка.** Продуктовые события на ключевых шагах: меню, корзина, оформление, оплата, успех.
      4. **Сеть.** Клиент сообщает о запросах, которые завершились ошибкой или шли дольше 5 секунд: адрес без
         параметров, код ответа, длительность, тип сети.
      5. **Трассы.** Каждый запрос оформления и оплаты несёт `traceparent`, сервер продолжает трассу. В логах рядом —
         `operationId`.
      6. **Чистка.** Адрес доставки, телефон и комментарий курьеру не попадают никуда: в события отправляют только
         номер заказа. Параметры адреса страницы удаляются, кроме разрешённых, вроде фильтра кухни.

      Повторись та история сейчас — через десять минут после выкатки сработало бы оповещение «рост ошибок
      в оформлении», а фильтр по версии браузера показал бы, кого это касается. А если бы исправление выпускали
      за флагом шагами (урок «Проверки и выкатка»), его выключили бы за секунды, пока оно было у 5 % покупателей,
      — до того, как первые из них дозвонятся в поддержку.

      ## Варианты и их цена

      - **Готовый сервис сбора ошибок и замеров**
        - Что даёт: ловля ошибок, расшифровка стеков, группировка и оповещения из коробки.
        - Цена: деньги за объём и данные у сторонней компании — тем строже правила о том, что туда отправлять.
      - **Свой сбор на открытых стандартах** (OpenTelemetry и своё хранилище)
        - Что даёт: данные у себя, можно сменить хранилище, не трогая код клиента.
        - Цена: группировку, оповещения и хранение придётся настроить и поддерживать самим.
      - **Выборка по сессиям**
        - Что даёт: меньше объём, а сессия видна целиком — понятно, что человек делал до ошибки.
        - Цена: редкие события в невыбранных сессиях теряются, поэтому ошибки обычно собирают все.

      ## Типичные ошибки

      - **Смотреть только на сервер.** Ошибки, из-за которых запрос не ушёл, сервер не видит вовсе.
      - **Одна воронка вместо ошибок.** Аналитика покажет, что люди отваливаются, но не почему.
      - **Ошибки без версии и окружения.** «TypeError у 0,5 % пользователей» нельзя разобрать, не зная, в какой версии
        и на каком устройстве.
      - **Стек без карт исходников.** Сжатый код в стеке ничего не объясняет.
      - **Нет сквозного номера.** Найти записи одного нажатия в логах нескольких сервисов невозможно.
      - **Личные данные и токены в логах.** Адреса и телефоны в аналитике, токены в адресах страниц — утечка, которая
        хранится годами.

      ## Как спрашивают на интервью

      - «Как вы узнаете, что у пользователей что-то сломалось?» — ждут ошибки JavaScript с контекстом, скорость
        у реальных людей, воронку и сеть, и что это разные потоки.
      - «Пользователь пишет, что оплата не прошла. Как найдёте причину?» — ждут сквозной номер, связь клиента
        с логами сервера и код для поддержки.
      - «Что нельзя отправлять в аналитику и логи?» — ждут личные данные и секреты, чистку на клиенте и белый список.

      ## Коротко

      - Наблюдаемость — возможность по данным, которые система сообщает о себе, понять, что происходит у людей, в том
        числе в непредвиденных ситуациях. Ошибки, из-за которых запрос не ушёл, сервер не видит вовсе.
      - С клиента идут четыре разных потока: продуктовые события (где отваливаются), скорость RUM (где медленно),
        ошибки JavaScript (что сломалось в коде) и сетевая телеметрия (что не так между клиентом и сервером). Один
        не заменяет другой.
      - Ошибки ловят глобально и через границы ошибок, расшифровывают картами исходников и снабжают контекстом: версия
        приложения, страница, устройство, флаги.
      - Пачки данных досылают при скрытии страницы через `sendBeacon` или `fetch` с `keepalive`. Скорость и события можно
        собирать выборкой, а ошибки обычно собирают все.
      - Сквозной номер трассы в заголовке `traceparent` (стандарт W3C Trace Context, библиотеки OpenTelemetry) связывает
        ошибку в браузере с записями всех сервисов. Для людей рядом кладут идентификатор операции и показывают его как
        код для поддержки.
      - Всё, что попало в логи и аналитику, считайте утёкшим: личные данные и секреты не отправляют, адреса страниц
        и тексты ошибок чистят на клиенте до отправки, разрешая поля белым списком.

      ## Источники

      - [Trace Context — W3C](https://www.w3.org/TR/trace-context/)
      - [Browser: начало работы с OpenTelemetry — документация OpenTelemetry](https://opentelemetry.io/docs/languages/js/getting-started/browser/)
      - [Navigator.sendBeacon() — MDN](https://developer.mozilla.org/ru/docs/Web/API/Navigator/sendBeacon)

  - id: sdr-rollout
    topic: Сквозные требования
    subtopic: Тестируемость и выкатка
    title: Проверки и выкатка
    body: |
      ## Какую проблему решаем

      Команда переписала оформление заказа: новый адрес с картой, новые способы оплаты, новый расчёт времени доставки.
      Работа шла два месяца. Перед выпуском всё проверили: 1200 модульных тестов зелёные, сквозной тест «заказать пиццу»
      проходит. В пятницу в 18:00 новую версию выкатили всем.

      К 19:00 оплаты упали на треть. Сквозной тест проверял оплату картой с тестовым провайдером, а у реальных покупателей
      в приложении банка-партнёра новый платёжный модуль не открывался. Модульные тесты проверяли правила корзины,
      которые и так не менялись. Откатить можно только новой выкаткой, сборка и проверка занимают 40 минут — в самый
      горячий час вечера пятницы.

      Ошибиться можно всегда. Вопрос в том, сколько людей пострадает, как быстро это заметят и как быстро вернут как было.
      Этот урок о двух вещах: какие проверки против какого риска ставить и как выпускать новое не всем сразу и с путём
      назад.

      ## Тесты по риску, а не по привычке

      Тесты бывают разного масштаба, и у каждого своя цена и свои слепые пятна.

      - **Модульные** (unit) — проверяют одну функцию или модуль без сети и браузера.
        - Что ловят: ошибки в правилах и вычислениях — «в корзине блюда одного ресторана», расчёт итога.
        - Цена: дешёвые и быстрые, тысячи за секунды.
        - Чего не видят: как части работают вместе.
      - **Интеграционные, или компонентные** — проверяют компонент или сценарий вместе с его хуками и состоянием, с
        поддельной сетью: например, Testing Library в браузерном окружении и MSW вместо настоящего API.
        - Что ловят: «форма оформления показывает ошибку поля, когда сервер ответил 422».
        - Цена: средняя.
        - Чего не видят: настоящий сервер, настоящий браузер, сторонние скрипты.
      - **Сквозные** (end-to-end, E2E) — открывают приложение в настоящем браузере и проходят сценарий целиком, как
        человек: Playwright, Cypress.
        - Что ловят: поломки на стыках — сборка, маршруты, API, оплата в тестовой среде.
        - Цена: медленные и хрупкие: падают от таймингов и тестовых данных; держат немного, на главные пути.
        - Чего не видят: устройства и окружения, которых нет в тестовом стенде, — WebView партнёра, старые телефоны.
      - **Контрактные** (contract tests) — проверяют, что клиент и сервер понимают API одинаково. В подходе, который
        называют контрактами со стороны потребителя (consumer-driven contracts), клиент записывает, какие запросы он
        шлёт и какие поля ответа читает, а сервер в своей сборке проверяет, что его ответы этим ожиданиям соответствуют.
        Так работает, например, Pact.
        - Что ловят: «бэкенд переименовал поле, а клиент его читает» — до выкатки, а не у людей.
        - Цена: нужна договорённость между командами клиента и сервера.

      Известный образ — **пирамида тестов** (test pyramid), её описал Майк Кон, а подробно разобрал Хэм Фоке в статье
      на сайте Мартина Фаулера: много быстрых модульных тестов внизу, меньше интеграционных, совсем немного сквозных
      наверху. Где образ ломается: пирамида говорит о пропорциях, но не о том, **что** проверять. Сотня модульных тестов
      на неизменные правила не поймает ошибку в новом платёжном модуле.

      Поэтому тесты выбирают по **риску**: что в этом изменении может сломаться, сколько это стоит и какой самый дешёвый
      тест это поймает. В истории из начала урока главный риск был на стыке с внешним платёжным модулем в чужом
      окружении. Его не ловит ни один тест в тестовом стенде, и защитой от него может быть только выкатка на часть
      людей с наблюдением.

      ## Флаги функций

      **Флаг функции** (feature flag, feature toggle) — условие в коде, которое включает или выключает функцию без новой
      выкатки:

      ```tsx
      {flags.newCheckout ? <NewCheckout /> : <OldCheckout />}
      ```

      Пит Ходжсон в статье на сайте Мартина Фаулера различает флаги по назначению:

      - **флаг выпуска** (release toggle) — прячет незаконченное или новое, пока его не выпустят всем;
      - **флаг эксперимента** (experiment toggle) — делит людей на группы для A/B-теста;
      - **рубильник** (ops toggle, kill switch) — быстро выключает тяжёлую или рискованную функцию при аварии;
      - **флаг прав** (permission toggle) — включает функцию для части людей: сотрудникам, бета-тестерам.

      ### Как устроить флаги

      - **Где вычисляется флаг.** Обычно на сервере: он знает пользователя и правила выкатки и отдаёт клиенту готовые
        значения. Список правил на клиенте раскрыл бы всем, какие функции готовятся.
      - **Один и тот же человек — одно и то же значение.** Для выкатки на 5 % человека относят к группе по его номеру
        (например, по хэшу номера пользователя), а не случайно при каждом открытии. Иначе у него оформление будет
        то новым, то старым.
      - **Значение не меняется посреди сценария.** Клиент читает флаги при старте и перечитывает в безопасные
        моменты — при переходе между страницами, при возврате на вкладку. Если флаг переключился, пока человек на шаге
        оплаты, оформление не должно смениться у него под руками. Исключение — рубильник при аварии: сломанный
        сценарий всё равно не завершить, поэтому выключение применяется сразу, а человек видит «Оформление обновилось»
        и продолжает по старому пути. О таком выключении клиент узнаёт сразу — по подписке на изменения флагов или
        по частому опросу.
      - **Флаги удаляют.** Флаг выпуска живёт, пока идёт выкатка, потом его и старую ветку кода убирают. Иначе код
        обрастает сотнями условий, и никто не знает, какие сочетания вообще проверены. Ходжсон советует относиться
        к флагам как к запасу, хранение которого стоит денег, и сразу заводить задачу на удаление.

      ## Выкатка по шагам

      **Постепенная выкатка** (staged rollout, или канареечная — canary release) — новое получает сначала маленькая
      группа, потом больше, потом все. На каждом шаге смотрят на **сторожевые метрики** (guardrail metrics) —
      показатели, которые не должны ухудшиться: доля успешных оплат, ошибки JavaScript в изменённой части, INP. Как эти
      метрики собирать, разобрано в уроке «Что происходит у пользователей».

      - **Шаги.** Сотрудники → 5 % → 25 % → 100 %. На каждом — сравнение группы с новым и группы со старым.
      - **Условие остановки** записывают заранее: «доля успешных оплат в новой группе ниже, чем в старой, больше чем
        на 1 процентный пункт — выключить флаг». Как условие пересмотра в курсе 1, в уроке «Как сравнивать решения»:
        договориться, что увидим и что сделаем, до того, как это случится.
      - **Откат флагом.** Выключить флаг — секунды, без сборки и выкатки.

      ### Почему откат кода не возвращает всё назад

      Здесь важна связь с уроком «Кэш файлов и выкатка новой версии». Если откатить новую версию кода выкаткой, вкладки,
      которые уже загрузили новую версию, продолжат с ней работать до перезагрузки. А флаг они перечитают при следующем
      переходе. Поэтому для рискованных изменений рубильник надёжнее отката кода.

      И ещё одно: если новая версия успела записать данные в новом формате — например, заказ с новым полем «окно
      доставки», — старая версия должна их понимать. Это всё то же «расширить и сузить»: сначала все версии умеют читать
      новый формат, и только потом новое начинает его писать.

      ## Проверяемость закладывают в проект

      Тестируемость и наблюдаемость — тоже свойства архитектуры, их закладывают до кода.

      - **Тестируемость.** Сценарий оформления, который получает платёжный модуль через порт, проверяется без настоящего
        SDK — это приём из курса 1, урок «Зависимости и публичный интерфейс модуля». Сценарий, который импортирует SDK
        напрямую, проверяется только в браузере с настоящим провайдером.
      - **Наблюдаемость.** Ещё в проекте записывают, по каким событиям и метрикам поймут, что новое работает: какие
        продуктовые события на шагах оформления, какая сторожевая метрика, какой порог.
      - **Выключаемость.** Рискованное изменение сразу проектируют за флагом, со старым путём, который продолжает
        работать.

      ## Пример целиком: новое оформление

      Как сервис доставки выкатил новое оформление во второй раз.

      1. **Тесты по риску.**
         - Модульные — новые правила расчёта времени доставки.
         - Компонентные — шаги формы с поддельным API: ошибки полей, неизвестный исход, ответ «цена изменилась».
         - Контрактные — между оформлением и API заказов: клиент читает `deliveryWindow`, сервер проверяет, что его
           отдаёт.
         - Сквозной — один главный путь «корзина → оформление → оплата тестовой картой».
      2. **Флаг.** `newCheckout`, вычисляется на сервере по хэшу номера покупателя. Клиент читает флаги при старте
         и при входе в корзину; на шагах оформления значение не меняется,
         кроме аварийного выключения: о нём клиент узнаёт сразу, по подписке на изменения флагов.
      3. **Шаги.** Сотрудники (неделя) → 5 % → 25 % → 100 %, по два-три дня на шаг.
      4. **Сторожевые метрики:** доля успешных оплат, ошибки JavaScript на шагах оформления, INP оформления. Условие
         остановки записано: оплаты хуже старой группы больше чем на 1 пункт или рост ошибок вдвое.
      5. **Что случилось.** На 5 % через двадцать минут ошибки в платёжном модуле выросли в WebView ещё
         одного банка-партнёра, которого не было в списке проверенных.
         Флаг выключили для всех за минуту. Пострадали несколько десятков человек, а не тысячи; исправление вышло
         на следующий день, выкатка продолжилась.
      6. **Через две недели после 100 %** старое оформление и флаг удалили.

      ## Типичные ошибки

      - **Считать тесты по количеству.** Тысячи модульных тестов там, где риск на стыке с внешней системой.
      - **Много сквозных тестов.** Медленно, хрупко, и команда привыкает перезапускать упавшие, не разбираясь.
      - **Выкатывать всем сразу без пути назад.** Ошибка в оплате за минуту доходит до всех.
      - **Случайное значение флага при каждом открытии.** Человек видит то новое, то старое.
      - **Переключать флаг посреди сценария.** Оформление меняется под руками на шаге оплаты.
      - **Не удалять флаги.** Через год никто не знает, какие сочетания проверены.
      - **Выкатка без сторожевых метрик и условия остановки.** Ошибку замечают по жалобам.

      ## Как спрашивают на интервью

      - «Как безопасно выкатить новую версию критичной формы?» — ждут флаг, шаги выкатки, сторожевые метрики, условие
        остановки и откат флагом.
      - «Какие тесты вы напишете для этой функции?» — ждут выбора по риску, а не «юниты на всё».
      - «Чем откат флагом лучше отката кода?» — ждут скорости и того, что открытые вкладки не перезагружаются.

      ## Коротко

      - Ошибиться можно всегда, поэтому проверки и выкатку проектируют так, чтобы ошибка задела мало людей, её быстро
        заметили и быстро вернули как было.
      - Модульные тесты ловят ошибки в правилах, компонентные — в работе частей вместе с поддельной сетью, сквозные —
        поломки на стыках, но медленны и хрупки, а контрактные проверяют, что клиент и сервер одинаково понимают API.
      - Пирамида тестов говорит о пропорциях, но не о том, что проверять: тесты выбирают по риску изменения. Риск
        в чужом окружении, которого нет в стенде, ловит только выкатка на часть людей с наблюдением.
      - Флаг функции включает и выключает функцию без выкатки. Его обычно вычисляют на сервере, держат одинаковым для
        человека, не меняют посреди сценария, кроме аварийного выключения рубильником, и удаляют после выкатки.
      - Постепенная выкатка идёт шагами (сотрудники, 5 %, 25 %, все) со сторожевыми метриками и заранее записанным
        условием остановки. Откат флагом занимает секунды и доходит до уже открытых вкладок при следующем
        перечитывании флагов, а откат кода — нет.
      - Тестируемость, наблюдаемость и возможность выключить закладывают в проект до кода: зависимость за портом,
        события и пороги, флаг со старым путём.

      ## Источники

      - [Feature Toggles (aka Feature Flags) — Пит Ходжсон, martinfowler.com](https://martinfowler.com/articles/feature-toggles.html)
      - [The Practical Test Pyramid — Хэм Фоке, martinfowler.com](https://martinfowler.com/articles/practical-test-pyramid.html)
      - [Contract testing — документация Pact](https://docs.pact.io/)

  - id: sdr-i18n
    topic: Сквозные требования
    subtopic: Локализация
    title: Языки, валюты и часовые пояса
    body: |
      ## Какую проблему решаем

      Сервис доставки выходит в ОАЭ, в Дубай. Нужны арабский и английский языки, цены в дирхамах, время по Дубаю. Команда
      решила, что это работа на пару недель: перевести строки и поменять значок валюты. Вот что нашлось в коде:

      - **строки собираются из кусков:** `'Доставка через ' + minutes + ' мин'`. В арабском другой порядок слов,
        и перевести «кусок» без остального предложения нельзя;
      - **множественное число на условиях:** `count === 1 ? 'блюдо' : 'блюд'`. Даже по-русски «2 блюд» неверно,
        а в арабском шесть форм;
      - **цена форматируется вручную:** `price + ' ₽'`. Дирхамы пишутся по-другому, и разделители разрядов тоже другие;
      - **время берётся из часов устройства:** человек из Москвы, который заказывает родителям в Дубай, видит часы
        работы ресторана со сдвигом на час;
      - **вёрстка прибита к левому краю:** `margin-left`, стрелки «назад» влево. Арабский пишется справа налево,
        и весь интерфейс должен отразиться.

      **Локализация** (localization, l10n) — перевод и адаптация продукта под язык и страну. **Интернационализация**
      (internationalization, i18n) — подготовка кода к тому, чтобы локализация вообще была возможна. Этот урок
      об интернационализации: как устроить переводы, числа, даты и вёрстку, чтобы новая страна была работой переводчиков,
      а не переписыванием приложения.

      ## Переводы: ключи и целые фразы

      Тексты интерфейса выносят из кода в файлы переводов: код ссылается на **ключ**, а файл для каждого языка хранит
      фразу целиком.

      ```json
      // ru.json
      { "delivery.eta": "Доставка через {minutes} мин" }
      // en.json
      { "delivery.eta": "Delivery in {minutes} min" }
      ```

      Главное правило: **переводится фраза целиком, с местом для подстановки,** а не кусочки, которые код склеивает.
      Порядок слов, падежи и согласование в разных языках разные, и только переводчик, который видит всю фразу, может
      расставить их правильно. Синтаксис с фигурными скобками для подстановок и вариантов называют **ICU MessageFormat**;
      его понимают библиотеки вроде FormatJS (react-intl) и i18next.

      ### Загружать только нужный язык

      Если положить все переводы в основной файл приложения, каждый человек будет качать тексты на всех языках. Это тот же
      вопрос, что в уроке «Что грузить сразу, а что потом»: переводы — отдельные куски, по одному на язык, а в большом
      приложении ещё и по разделам («каталог», «оформление», «кабинет»). Приложение при старте знает язык человека и
      динамически загружает только его файл, а на сервере, при рендеринге страницы, подставляет переводы сразу в HTML.

      Откуда взять язык:

      - **из адреса** — `/ar/r/pizza-na-uglu`. Нужен для публичных страниц: поисковики индексируют каждый язык отдельно,
        и ссылкой на арабскую версию можно поделиться;
      - **из настроек человека** — они решают, куда перенаправить с адреса без языка; если язык есть в адресе,
        действует он: адрес отвечает за то, что на странице;
      - **из заголовка `Accept-Language`,** который присылает браузер, — только как первая догадка.

      ## Множественное число, числа, даты: Intl

      Правила форматирования для разных языков уже есть в браузере — в стандартном объекте **`Intl`**. Писать их самим не
      нужно и опасно.

      ### Множественное число

      В русском у существительного после числа три формы: «1 блюдо», «2 блюда», «5 блюд» (и ещё дробные «1,5 блюда»).
      В английском две: «1 dish», «2 dishes». В арабском шесть. `Intl.PluralRules` по числу и языку говорит, какую
      **категорию** формы взять: `one`, `few`, `many`, `other` и другие. Переводчик для каждого языка пишет нужные
      формы, а библиотека выбирает:

      ```json
      { "cart.items": "{count, plural, one {# блюдо} few {# блюда} many {# блюд} other {# блюда}}" }
      ```

      ```ts
      new Intl.PluralRules('ru').select(2);   // 'few'
      new Intl.PluralRules('ru').select(5);   // 'many'
      new Intl.PluralRules('en').select(5);   // 'other'
      ```

      ### Числа и валюты

      `Intl.NumberFormat` знает разделители разрядов и дробной части, место и вид знака валюты для каждого языка
      и страны. Деньги по-прежнему хранят целым числом в мелких единицах вместе с кодом валюты, как в курсе 1, в уроке
      «Контракт API глазами фронтенда», а форматируют только при показе:

      ```ts
      const fmt = (locale: string, minor: number, currency: string) =>
        new Intl.NumberFormat(locale, { style: 'currency', currency }).format(minor / 100);

      fmt('ru-RU', 184000, 'RUB');  // «1 840,00 ₽»
      fmt('en-AE', 4500, 'AED');    // «AED 45.00»
      ```

      Делитель 100 подходит не всем валютам: у японской иены нет дробной части, а у кувейтского и бахрейнского динара
      три знака после запятой. Число знаков берут из справочника валют или из `resolvedOptions().maximumFractionDigits`
      форматтера.

      Язык и валюта — разные вещи. Английский интерфейс в Дубае показывает дирхамы, а русский интерфейс в Дубае —
      тоже дирхамы, только по-русски записанные. Валюту берут из заказа и ресторана, а язык — из адреса страницы или выбора человека.

      ### Даты и часовые пояса

      **События** — заказ создан, доставка к 20:30 — хранят на сервере и в API как **момент**: в формате ISO 8601
      с часовым поясом или в UTC, как в курсе 1. А **повторяющееся местное время** — часы работы «до 23:00», заезд
      «с 14:00» — моментом не является: его хранят как время суток плюс пояс места по имени (`Asia/Dubai`), а не
      смещение `+04:00`, потому что смещение у пояса может меняться с переходом на летнее время.

      Показывают время в часовом поясе, который нужен человеку **в этом месте интерфейса**. `Intl.DateTimeFormat`
      принимает и язык, и пояс:

      ```ts
      new Intl.DateTimeFormat('ru', { timeStyle: 'short', timeZone: 'Asia/Dubai' })
        .format(new Date('2026-10-21T16:30:00Z'));  // «20:30»
      ```

      Какой пояс где:

      - **часы работы ресторана** — в поясе ресторана: «до 23:00 по Дубаю». Ресторан закрывается по своим часам;
      - **время доставки** — в поясе адреса доставки: курьер приедет туда;
      - **история заказов и уведомления** — обычно в поясе человека.

      Если пояс отличается от пояса устройства, его подписывают: человек из Москвы, заказывающий в Дубай, должен видеть
      «доставка к 20:30 по Дубаю», а не гадать. `Intl.RelativeTimeFormat` пишет «через 20 минут» на любом языке.

      ## Вёрстка: длинные строки и письмо справа налево

      ### Длина строк

      Одна и та же фраза на разных языках разной длины: немецкий и финский часто длиннее английского на десятки процентов,
      русский тоже нередко длиннее английского. Вёрстка, рассчитанная на одну длину, ломается: кнопки обрезаются, текст
      налезает на соседей. Поэтому избегают фиксированной ширины у элементов с текстом и проверяют интерфейс
      **псевдолокализацией** — подменой строк на удлинённые вида «[Ðöšţåŵķå ţĥŕöûĝĥ 20 ɱîñ]», которая показывает,
      где тексту тесно, ещё до перевода.

      ### Справа налево

      Арабский, иврит и персидский пишутся **справа налево** (RTL, right-to-left). Для них весь интерфейс отражается:
      меню слева уходит направо, стрелка «назад» смотрит вправо, отступ «перед текстом» оказывается справа.

      - **Направление задают атрибутом** `dir="rtl"` на `<html>` вместе с `lang="ar"`. Браузер сам развернёт текст
        и порядок строчных элементов.
      - **Логические свойства CSS** вместо физических: `margin-inline-start` вместо `margin-left`, `padding-inline-end`
        вместо `padding-right`, `inset-inline-start` вместо `left`. Они означают «в начале строки» и «в конце строки»
        и сами отражаются в RTL. Тогда одна таблица стилей работает для обоих направлений.
      - **Иконки со смыслом направления** — стрелки, «назад», «далее» — отражают. Логотипы, знаки «воспроизвести»
        и цифры не отражают.
      - **Смешанный текст.** В арабской фразе может быть английское название ресторана или номер заказа. Браузер
        раскладывает такой текст по правилам двунаправленного письма, но подставленное значение лучше обернуть
        в `<bdi>` или задать ему `dir="auto"`, иначе знаки препинания могут оказаться не с той стороны.

      Переделывать вёрстку под RTL потом дорого: каждый `margin-left` в проекте — место для правки. Если выход в такие
      страны вероятен, логические свойства берут с самого начала: они ничего не стоят и в LTR.

      ## Пример целиком: запуск в Дубае

      Что команда сделала для запуска.

      1. **Переводы.** Все тексты вынесены в файлы `ru`, `en` и `ar`, по разделам приложения. Фразы целиком, с ICU
         MessageFormat для подстановок и множественного числа. Склейка строк в коде запрещена правилом линтера.
      2. **Загрузка.** Файл переводов — отдельный кусок на язык и раздел. Страницы ресторанов собираются заранее для каждого
         языка с адресами `/ar/…` и `/en/…`, чтобы поисковики индексировали каждую версию.
      3. **Язык.** Если язык есть в адресе, действует он. С адреса без языка приложение перенаправляет по выбору
         человека в профиле, а если выбора нет — по `Accept-Language`.
      4. **Деньги.** Сервер отдаёт суммы в мелких единицах с кодом валюты; ресторан в Дубае — `AED`. Форматирует
         `Intl.NumberFormat` по языку интерфейса.
      5. **Время.** У ресторана в данных указан часовой пояс `Asia/Dubai`. Часы работы и время доставки показываются
         в нём с подписью «по Дубаю», если пояс устройства другой.
      6. **Направление.** Вёрстку перевели на логические свойства CSS, иконки направления отражаются, для арабского
         `dir="rtl"`. Названия ресторанов и номера заказов внутри арабских фраз обёрнуты в `<bdi>`.
      7. **Проверка.** Псевдолокализация в тестовой сборке и скриншоты главных экранов во всех трёх языках при каждой
         выкатке.

      ## Варианты и их цена

      - **Язык в адресе** (`/ar/…`)
        - Что даёт: каждый язык — отдельная страница для поисковиков, ссылкой можно поделиться.
        - Цена: адреса удваиваются, нужны перенаправления и ссылки между языковыми версиями.
      - **Язык в cookie или профиле**
        - Что даёт: адреса не меняются.
        - Цена: поисковик и друг по ссылке увидят не тот язык; годится для страниц за входом.
      - **Переводы собраны в код при сборке**
        - Что даёт: ничего не нужно загружать отдельно.
        - Цена: отдельная сборка на каждый язык, правка текста — новая выкатка.
      - **Переводы загружаются при запуске**
        - Что даёт: одна сборка, тексты можно править без выкатки.
        - Цена: лишний запрос и короткое ожидание, пока файл переводов не пришёл.

      ## Типичные ошибки

      - **Склеивать фразу из кусков.** Перевести «кусок» без остального предложения невозможно.
      - **Множественное число условием `=== 1`.** Неверно уже для русского, а для арабского и подавно.
      - **Форматировать числа, валюты и даты вручную.** Разделители, порядок и знаки у разных языков разные; `Intl`
        знает их все.
      - **Путать язык и валюту.** Валюта зависит от заказа, а не от языка интерфейса.
      - **Показывать время по часам устройства,** когда важен пояс ресторана или адреса доставки.
      - **Физические свойства CSS** (`left`, `margin-left`) по всему проекту — каждое придётся править для RTL.
      - **Все языки в основном файле приложения.** Каждый качает переводы, которые ему не нужны.

      ## Как спрашивают на интервью

      - «Как подготовить приложение к нескольким языкам?» — ждут ключи и целые фразы, ICU MessageFormat, загрузку
        только нужного языка и `Intl`.
      - «Как показать „3 товара“ правильно на любом языке?» — ждут `Intl.PluralRules` и формы, которые пишет переводчик.
      - «Что изменится в вёрстке для арабского?» — ждут `dir="rtl"`, логические свойства CSS и отражение иконок
        направления.

      ## Коротко

      - Интернационализация — подготовка кода к переводу, локализация — сам перевод и адаптация. Хорошая подготовка
        делает новую страну работой переводчиков, а не переписыванием приложения.
      - Тексты выносят в файлы переводов по ключам, и переводится фраза целиком с местами для подстановки (ICU
        MessageFormat). Склейка из кусков ломает порядок слов и согласование.
      - Переводы грузят только для нужного языка — отдельными кусками, по языкам и разделам. Язык в адресе важнее
        всего, выбор человека решает, куда перенаправить с адреса без языка, а `Accept-Language` — только догадка.
      - Множественное число, числа, валюты и даты форматирует стандартный `Intl`: `PluralRules` выбирает форму, а
        `NumberFormat` и `DateTimeFormat` знают разделители, знаки и порядок. Язык интерфейса и валюта — разные вещи.
      - События хранят как момент в UTC или ISO 8601 с поясом, а местное время вроде часов работы — как время суток
        плюс пояс места. Показывают в поясе, важном в этом месте: часы работы — по ресторану, доставку — по адресу,
        с подписью, если пояс не совпадает с поясом устройства.
      - Вёрстка должна выдерживать длинные строки (проверяют псевдолокализацией) и письмо справа налево: `dir="rtl"`,
        логические свойства CSS вместо `left` и `margin-left`, отражённые иконки направления и `<bdi>` для вставок.

      ## Источники

      - [Intl — MDN](https://developer.mozilla.org/ru/docs/Web/JavaScript/Reference/Global_Objects/Intl)
      - [Intl.PluralRules — MDN](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl/PluralRules)
      - [Structural markup and right-to-left text in HTML — W3C Internationalization](https://www.w3.org/International/questions/qa-html-dir)

questions:
  - id: sdr-intro-001
    topic: Введение
    subtopic: Путь продукта к человеку
    level: junior
    question: |
      В онлайн-кинотеатре новую версию сайта выкатили днём. Вечером приходят жалобы: у людей, которые не закрывали
      вкладку со вчерашнего дня, при переходе в раздел «Мои фильмы» вместо раздела белый экран. После перезагрузки
      всё работает. К какой теме курса относится эта проблема?
    options:
      - text: 'Кэш файлов и выкатка новой версии'
        correct: true
        why: 'Старая вкладка живёт со старым кодом и просит у сервера файлы, которых после выкатки уже может не быть. Как с этим жить, разбирает урок о кэше файлов и выкатке.'
      - text: 'Метрики скорости страницы'
        why: 'Метрики описывают, как быстро страница появляется и отвечает. Здесь страница не медленная, а ломается у тех, кто пережил выкатку.'
      - text: 'Маршруты и переходы между экранами'
        why: 'Сломался действительно переход, но причина не в устройстве маршрутов: после перезагрузки тот же переход работает. Дело в старом коде и новой версии на сервере.'
      - text: 'Наблюдаемость и сбор ошибок'
        why: 'Наблюдаемость поможет узнать о проблеме раньше жалоб, но саму проблему создаёт выкатка новой версии при открытых вкладках.'
    explanation: |
      Вкладка, открытая до выкатки, продолжает работать со старым кодом. Когда ей нужен ещё не загруженный кусок
      приложения, она просит старый файл, а на сервере его может уже не быть. Это тема урока «Кэш файлов и выкатка
      новой версии»: как называть файлы, сколько их хранить и что показать человеку, если файл не нашёлся.
    links:
      - https://web.dev/articles/http-cache

  - id: sdr-intro-002
    topic: Введение
    subtopic: Путь продукта к человеку
    level: middle
    question: |
      Автор блога жалуется: статьи не находятся в поиске, а ссылка на статью в мессенджере приходит без заголовка
      и картинки. Сам блог у читателей открывается быстро и без ошибок. Блог — одностраничное приложение: сервер
      отдаёт пустую страницу, а текст статьи браузер получает запросом к API. С какой темы курса начать?
    options:
      - text: 'Картинки и видео: выбрать подходящий формат обложки статьи'
        why: 'Формат картинки не объясняет пропавший заголовок. Поисковый робот и мессенджер не видят ни текста, ни обложки, потому что их нет в HTML от сервера.'
      - text: 'Где собирать страницу: отдавать статью с сервера готовым HTML'
        correct: true
        why: 'Мессенджер и многие поисковые роботы смотрят на HTML, который вернул сервер, и не ждут, пока скрипт загрузит статью. Способ рендеринга решает, что они увидят.'
      - text: 'Метрики скорости: ускорить открытие статьи у читателей'
        why: 'В условии сказано, что читатели не жалуются на скорость. Проблема в том, что видят не люди, а роботы и мессенджеры.'
      - text: 'Маршруты: дать каждой статье свой постоянный адрес'
        why: 'Адрес у статьи может быть, но по нему сервер всё равно отдаёт пустую страницу. Без готового HTML адрес не помогает.'
    explanation: |
      Когда страница собирается только в браузере, сервер отдаёт почти пустой HTML, а содержимое появляется после
      работы скрипта. Человек этого не замечает, а превью ссылки в мессенджере строится по HTML от сервера, и многие
      поисковые роботы тоже опираются на него. Поэтому выбор, где собирать страницу, — первый вопрос для страниц,
      которые должны находиться и красиво выглядеть в превью.
    links:
      - https://web.dev/articles/rendering-on-the-web

  - id: sdr-intro-003
    topic: Введение
    subtopic: Путь продукта к человеку
    level: senior
    multiple: true
    question: |
      Команда онлайн-банка делит работу на ближайший квартал по модулям: «переводы», «вклады», «карты», «профиль».
      За каждый модуль отвечает своя небольшая группа. Какие требования из списка не получится закрыть внутри одного
      модуля, потому что они проходят через всё приложение?
    options:
      - text: 'Ни один экран не выполняет чужой скрипт, пришедший в данных'
        correct: true
        why: 'Чужой текст выводят все модули, и одна дыра в любом из них открывает доступ ко всей странице. Защиту закладывают общими правилами вывода и политикой безопасности для всего приложения.'
      - text: 'Перевод можно повторить по шаблону из истории переводов'
        why: 'Это функция одного модуля «переводы». Её делает одна группа, не затрагивая остальные.'
      - text: 'Каждый экран целиком проходится с клавиатуры и экранным чтецом'
        correct: true
        why: 'Доступность — свойство каждого экрана и переходов между ними. Если её сделает один модуль, а соседние нет, человек всё равно застрянет на первом недоступном шаге.'
      - text: 'Карту можно временно заблокировать прямо из списка карт'
        why: 'Это действие внутри модуля «карты». Остальным модулям не нужно для него ничего менять.'
      - text: 'В выписках модуля «вклады» даты и суммы записаны в одном формате'
        why: 'Звучит как локализация, но требование касается только выписок одного модуля и закрывается внутри него. Сквозным оно стало бы, если бы речь шла о формате дат и сумм на всех экранах.'
    explanation: |
      Сквозные требования — безопасность, доступность, наблюдаемость, локализация — нельзя поручить одной группе
      и одному модулю: они касаются каждого экрана. Их закладывают общими решениями для всего приложения — правилами
      вывода чужого текста, общими компонентами, политикой безопасности — и проверяют во всех модулях. Функции вроде
      повтора перевода или блокировки карты живут в своём модуле.
    links:
      - https://www.w3.org/WAI/fundamentals/accessibility-intro/

  - id: sdr-vitals-001
    topic: Рендеринг и доставка
    subtopic: Метрики скорости
    level: junior
    question: |
      Новостной сайт открывается быстро, и статьи видны почти сразу. Но читатели жалуются: после нажатия на кнопку
      «Показать комментарии» проходит больше полсекунды, прежде чем на экране что-то меняется. Какая из основных
      метрик скорости описывает эту жалобу?
    options:
      - text: 'LCP — когда отрисовался самый крупный элемент экрана'
        why: 'LCP описывает появление главного содержимого при загрузке. В условии страница появляется быстро, а жалуются на реакцию после нажатия.'
      - text: 'INP — сколько проходит от нажатия до следующего кадра'
        correct: true
        why: 'INP измеряет время от взаимодействия до момента, когда браузер показал реакцию. Полсекунды — это больше порога «плохо» в 500 мс.'
      - text: 'CLS — насколько сдвигается вёрстка при загрузке'
        why: 'CLS говорит о неожиданных сдвигах элементов, а жалоба — на задержку после нажатия. К тому же сдвиг в течение полсекунды после нажатия в CLS не входит.'
      - text: 'TTFB — когда сервер прислал первый байт ответа'
        why: 'Время до первого байта — часть загрузки страницы. После загрузки нажатие обрабатывается в браузере, и TTFB его не описывает.'
    explanation: |
      Три основные метрики отвечают на три вопроса человека: показалось ли главное (LCP), ответила ли страница
      на нажатие (INP) и не прыгает ли она (CLS). Медленная реакция на кнопку — это INP: время от нажатия до следующей
      отрисовки, хорошо — до 200 мс. Обычно его портит долгая работа в основном потоке, из-за которой нажатие ждёт.
    links:
      - https://web.dev/articles/inp

  - id: sdr-vitals-002
    topic: Рендеринг и доставка
    subtopic: Метрики скорости
    level: middle
    question: |
      У интернет-магазина Lighthouse на ноутбуке разработчика показывает LCP карточки товара 1,3 секунды. По данным
      Chrome UX Report у реальных покупателей на телефонах 75-й процентиль LCP — 4,2 секунды. Команде нужно решить,
      есть ли проблема и как её искать. Какой вывод верный?
    options:
      - text: 'Проблемы нет: лабораторный замер точнее, а данные CrUX шумят'
        why: 'Лабораторный замер повторяем, но это одно устройство и одна сеть. У покупателей другие телефоны и сети, и решения о продукте принимают по их данным.'
      - text: 'Проблема есть: искать причину в лаборатории на медленном профиле'
        correct: true
        why: 'Данные реальных пользователей показывают, что у четверти покупателей и больше LCP хуже 4 секунд. Лаборатория нужна, чтобы с замедленными процессором и сетью разложить LCP на отрезки и найти причину.'
      - text: 'Проблемы нет, если среднее значение LCP у покупателей ниже 2,5 с'
        why: 'Пороги Web Vitals проверяют по 75-му процентилю, а не по среднему. Среднее прячет тех, у кого медленно.'
      - text: 'Проблема есть: нужно сразу переписать сайт на рендеринг с сервера'
        why: 'Сначала нужно понять, какой отрезок LCP большой. Если причина в весе картинки или в стилях, блокирующих отрисовку, смена рендеринга не поможет.'
    explanation: |
      Лабораторный замер и данные реальных пользователей отвечают на разные вопросы. Данные реальных пользователей
      (RUM, Chrome UX Report) говорят, есть ли проблема у людей, а лабораторный замер помогает найти её причину
      и проверить исправление до выпуска. Расхождение в три раза — обычное дело: у покупателей медленнее процессоры
      и сети. Причину ищут в лаборатории с замедлением, раскладывая LCP на отрезки.
    links:
      - https://web.dev/articles/vitals

  - id: sdr-vitals-003
    topic: Рендеринг и доставка
    subtopic: Метрики скорости
    level: middle
    question: |
      На странице урока в онлайн-школе сначала появляется текст урока, а через секунду над ним загружается
      видеоплеер и сдвигает текст на 400 пикселей вниз. Ученик в это время уже начал читать. CLS страницы — 0,32.
      Плеер нужен именно над текстом. Что исправит CLS?
    options:
      - text: 'Загружать плеер лениво, когда он появится в видимой части экрана'
        why: 'Плеер стоит над текстом и виден сразу, поэтому ленивая загрузка ничего не изменит. А если место под него не зарезервировано, текст сдвинется всё равно.'
      - text: 'Заранее отвести под плеер место с его соотношением сторон'
        correct: true
        why: 'Если место зарезервировано с самого начала, загрузка плеера ничего не сдвигает: он встаёт в пустую рамку. CLS считается только по неожиданным сдвигам.'
      - text: 'Предзагрузить файлы плеера, чтобы он появлялся быстрее'
        why: 'Плеер появится раньше, но всё равно после текста и всё равно сдвинет его. CLS зависит не от скорости, а от того, сдвигается ли видимое.'
      - text: 'Показывать текст урока только после того, как загрузится плеер'
        why: 'Сдвига не будет, но текст, ради которого пришёл ученик, появится позже. Ухудшится LCP, а CLS можно было исправить без этой цены.'
    explanation: |
      CLS растёт, когда видимые элементы неожиданно смещаются: догрузилась картинка, баннер или плеер без заданного
      места. Лечится это резервированием места заранее — размерами или соотношением сторон контейнера. Ускорение
      загрузки сдвиг не убирает, а прятать содержимое до загрузки всего значит ухудшить LCP.
    links:
      - https://web.dev/articles/cls

  - id: sdr-vitals-004
    topic: Рендеринг и доставка
    subtopic: Метрики скорости
    level: senior
    question: |
      У новостного сайта LCP статьи на телефонах — 3,0 секунды на 75-м процентиле, LCP-элемент — главная иллюстрация.
      Команда разложила LCP в лаборатории: время до первого байта 0,3 с, задержка загрузки картинки 2,1 с, загрузка
      картинки 0,4 с, задержка отрисовки 0,2 с. Иллюстрацию вставляет скрипт после того, как получит статью из API.
      Какое изменение даст наибольший эффект?
    options:
      - text: 'Перенести HTML статьи на CDN поближе к читателям'
        why: 'CDN сократит время до первого байта, но оно и так 0,3 с. Самый большой отрезок — задержка загрузки картинки.'
      - text: 'Сжать иллюстрацию и перевести её в современный формат'
        why: 'Это сократит загрузку картинки, а она занимает 0,4 с. Главные 2,1 с браузер просто не знает, что картинку надо грузить.'
      - text: 'Отдавать иллюстрацию в HTML с сервера'
        correct: true
        why: '2,1 с уходят на то, чтобы скрипт загрузился, получил статью и вставил картинку. Если она есть в HTML с самого начала, браузер начнёт её грузить сразу, и этот отрезок почти исчезнет.'
      - text: 'Убрать стили, которые блокируют отрисовку первого экрана'
        why: 'Это сокращает задержку отрисовки, а она 0,2 с. Даже убрав её полностью, LCP останется выше 2,5 с.'
    explanation: |
      LCP раскладывают на четыре отрезка: время до первого байта, задержку загрузки ресурса, его загрузку и задержку
      отрисовки. Исправляют самый большой. Здесь это задержка загрузки: картинку вставляет скрипт после запроса к API,
      и до этого браузер о ней не знает. Сжатие картинки и быстрый сервер изменят мало, пока картинка появляется
      в документе так поздно: они укоротят свои отрезки, а самый большой останется.
    links:
      - https://web.dev/articles/optimize-lcp

  - id: sdr-vitals-005
    topic: Рендеринг и доставка
    subtopic: Метрики скорости
    level: middle
    question: |
      Команда онлайн-школы хочет, чтобы сборка проверяла скорость каждой новой версии и не пропускала ухудшения.
      Проверка — Lighthouse на тестовом стенде, то есть лабораторный замер без живых людей. Тимлид предлагает следить
      там за всеми тремя основными метриками. Что верно про INP в такой проверке?
    options:
      - text: 'INP можно измерить в Lighthouse так же, как LCP и CLS'
        why: 'Для INP нужны настоящие взаимодействия людей за всё время на странице. Одна загрузка без нажатий их не даёт.'
      - text: 'INP в лаборатории не измерить, смотрят время блокировки потока'
        correct: true
        why: 'Lighthouse показывает Total Blocking Time: сколько основной поток был занят долгими задачами. Это не INP, но растёт от тех же причин и годится, чтобы поймать ухудшение в сборке.'
      - text: 'INP в лаборатории не нужен, потому что он зависит только от сети'
        why: 'INP почти не зависит от сети: он про то, насколько занят основной поток браузера и тяжелы ли обработчики.'
      - text: 'INP можно измерить, если запускать Lighthouse много раз и усреднять'
        why: 'Сколько ни повторяй загрузку без нажатий, взаимодействий в ней не появится. INP собирают у реальных пользователей.'
    explanation: |
      INP измеряет задержку настоящих взаимодействий за всё время на странице, поэтому в лабораторном замере одной
      загрузки его нет. Lighthouse показывает вместо него общее время блокировки основного потока (Total Blocking
      Time): оно растёт от тех же долгих задач. Окончательно INP проверяют по данным реальных пользователей.
    links:
      - https://web.dev/articles/vitals

  - id: sdr-rendering-001
    topic: Рендеринг и доставка
    subtopic: Выбор способа рендеринга
    level: junior
    question: |
      Документацию библиотеки собирают так: при каждом выпуске сборщик превращает все статьи в готовые HTML-файлы
      и выкладывает их на CDN. Когда читатель открывает статью, сервер ничего не собирает, а просто отдаёт файл.
      Как называется такой способ рендеринга?
    options:
      - text: 'SSR — рендеринг на сервере при каждом запросе'
        why: 'При SSR сервер собирает HTML в момент запроса. Здесь страницы собраны заранее, при выпуске, и при запросе ничего не собирается.'
      - text: 'SSG — генерация статических страниц при сборке'
        correct: true
        why: 'HTML собирают заранее, при сборке проекта, и отдают готовыми файлами. Это и есть генерация статических страниц.'
      - text: 'CSR — рендеринг в браузере после загрузки скрипта'
        why: 'При CSR сервер отдаёт пустую оболочку, а страницу собирает браузер. Здесь читатель сразу получает готовый HTML со статьёй.'
      - text: 'Гидратация — сборка HTML из компонентов на сервере'
        why: 'Гидратация — это шаг в браузере: готовый HTML связывают с JavaScript, чтобы он стал интерактивным. Сборкой HTML она не занимается.'
    explanation: |
      Способ рендеринга отвечает на вопрос, где и когда собирается HTML. При SSG это происходит заранее, при сборке
      проекта, и страницы лежат как файлы — на CDN их отдают быстрее всего и почти без нагрузки на сервер. Цена —
      свежесть: изменившуюся статью нужно пересобрать. Документация, статьи, лендинги — типичные случаи для SSG.
    links:
      - https://web.dev/articles/rendering-on-the-web

  - id: sdr-rendering-002
    topic: Рендеринг и доставка
    subtopic: Выбор способа рендеринга
    level: middle
    question: |
      Сайт бронирования жилья показывает 50 000 карточек квартир. Карточки должны находиться в поиске и красиво
      выглядеть в превью ссылок, и они одинаковы для всех гостей. Описание и фото хозяин правит раз в несколько недель,
      а свободные даты меняются каждый час и окончательно проверяются при бронировании. Как рендерить карточку?
    options:
      - text: 'SSR на каждый запрос, чтобы и описание, и даты были свежими'
        why: 'Это работает, но сервер будет собирать одинаковые страницы тысячи раз, хотя описание меняется раз в несколько недель. Свежесть дат можно получить дешевле.'
      - text: 'SSG со сборкой всех карточек раз в сутки вместе с датами'
        why: 'Даты будут отставать до суток, а пересобирать 50 000 страниц из-за одной правки дорого и долго.'
      - text: 'Собрать заранее, пересобирать при правке, даты — в браузере'
        correct: true
        why: 'Описание и фото редко меняются и одинаковы для всех — их выгодно собрать заранее и пересобирать только изменившуюся карточку. Изменчивые даты догружаются на клиенте, а окончательно их проверяет сервер при бронировании.'
      - text: 'CSR, чтобы все данные запрашивались при каждом открытии'
        why: 'Даты будут свежими, но поисковики и превью ссылок увидят пустую страницу, а это прямое требование.'
    explanation: |
      Заранее собранные страницы с пересборкой отдельных страниц (ISR) подходят, когда страниц много, они одинаковы
      для всех и меняются время от времени. Самое изменчивое — даты, остатки, цены дня — догружают в браузере после
      показа, а окончательную проверку делает сервер в момент действия. Так страница находится в поиске, быстро
      открывается с CDN и не стоит серверу рендеринга на каждый запрос.
    links:
      - https://nextjs.org/docs/app/guides/incremental-static-regeneration

  - id: sdr-rendering-003
    topic: Рендеринг и доставка
    subtopic: Выбор способа рендеринга
    level: middle
    question: |
      Компания делает внутренний дашборд аналитики: открывают его только сотрудники после входа, в основном с рабочих
      компьютеров, а ссылками на него никто не делится наружу. Данные у каждого отдела свои и обновляются каждые
      несколько минут. Какой способ рендеринга выбрать?
    options:
      - text: 'SSR, чтобы первый экран дашборда появлялся быстрее'
        why: 'SSR ускорит первый показ, но потребует серверов рендеринга ради экрана, которому не нужны ни поисковики, ни превью. На рабочих компьютерах эта выгода невелика.'
      - text: 'SSG, чтобы страницы отдавались с CDN'
        why: 'Данные личные для отдела и меняются каждые несколько минут. Заранее собрать одинаковую для всех страницу нельзя.'
      - text: 'CSR: данные запрашиваются в браузере'
        correct: true
        why: 'Экран за входом, поисковики и превью не нужны, данные у каждого свои и часто меняются. Рендеринг в браузере здесь самый простой и дешёвый вариант.'
      - text: 'ISR с пересборкой дашборда каждые несколько минут'
        why: 'Пересборка заранее собранных страниц выгодна, когда одну страницу видят многие. Здесь у каждого отдела свои данные за входом, и общей страницы нет.'
    explanation: |
      CSR — нормальный выбор для личных экранов за входом: корзины, кабинета, внутренних дашбордов. Поисковики и превью
      им не нужны, данные у каждого свои, а пустая оболочка при первом открытии обычно приемлема. Серверный рендеринг
      и заранее собранные страницы окупаются там, где страницу должны видеть роботы или где одну страницу видят тысячи
      людей.
    links:
      - https://web.dev/articles/rendering-on-the-web

  - id: sdr-rendering-004
    topic: Рендеринг и доставка
    subtopic: Выбор способа рендеринга
    level: senior
    question: |
      Статьи блога рендерятся на сервере, LCP хороший. Но на недорогих телефонах первые три-четыре секунды после
      появления статьи ссылки «Поделиться» и кнопка «Нравится» не реагируют, а INP плохой. Профиль показывает: всё это
      время браузер гидратирует страницу целиком, включая длинный текст статьи и блок комментариев, которые только
      читают. Что даст наибольший эффект?
    options:
      - text: 'Перевести статьи на SSG, чтобы HTML приходил с CDN'
        why: 'HTML придёт быстрее, но гидратировать в браузере придётся то же самое. Проблема не в том, когда приходит HTML, а в том, сколько кода оживляется.'
      - text: 'Перевести статьи на CSR, чтобы не было гидратации'
        why: 'Гидратации не станет, но весь код всё равно выполнится в браузере, только ещё и до появления текста. LCP ухудшится, а основной поток будет занят тем же.'
      - text: 'Оживлять только кнопки: острова или серверные компоненты'
        correct: true
        why: 'Текст статьи и комментарии только читают, им не нужен JavaScript. Если гидратировать лишь кнопки, работы в основном потоке станет в разы меньше, и нажатия перестанут ждать.'
      - text: 'Отдавать HTML статьи потоком, по частям'
        why: 'Потоковая отдача ускоряет появление начала страницы, когда медленный блок держит быстрый. Здесь страница появляется вовремя, а тормозит гидратация.'
    explanation: |
      SSR ускоряет появление содержимого, но если весь код потом гидратируется в браузере, интерактивность наступает
      не раньше. Гидратация — тяжёлая работа в основном потоке, и на слабых телефонах она портит INP. Частичная
      интерактивность — острова или серверные компоненты — оставляет статический HTML статическим и оживляет только
      то, что реагирует на нажатия.
    links:
      - https://web.dev/articles/rendering-on-the-web

  - id: sdr-rendering-005
    topic: Рендеринг и доставка
    subtopic: Выбор способа рендеринга
    level: middle
    question: |
      Страница результатов поиска на сайте бронирования рендерится на сервере: она зависит от запроса, и её должны
      видеть поисковики. Список отелей сервер получает за 200 мс, а блок «Вам может понравиться» — за 1,5 секунды
      от отдельного сервиса рекомендаций. Сейчас весь ответ ждёт самый медленный блок. Как ускорить появление
      списка, не отказываясь от рендеринга на сервере?
    options:
      - text: 'Отдавать HTML потоком: список сразу, рекомендации позже'
        correct: true
        why: 'При потоковой отдаче сервер отправляет готовые части, не дожидаясь медленных. Список появится через 200 мс, а рекомендации придут, когда будут готовы, на место заглушки.'
      - text: 'Собрать результаты поиска заранее для всех возможных запросов'
        why: 'Сочетаний запросов и дат слишком много, чтобы собрать их заранее, а выдача должна быть свежей на момент запроса.'
      - text: 'Перенести всю страницу поиска на рендеринг в браузере'
        why: 'Список перестанут видеть поисковики, а это требование. К тому же он всё равно появится только после загрузки скрипта.'
      - text: 'Кэшировать на CDN весь ответ страницы поиска на сутки'
        why: 'Выдача зависит от запроса и дат и должна быть свежей. Суточный кэш покажет устаревшие цены и свободные номера.'
    explanation: |
      Потоковая отдача (streaming SSR) позволяет серверу отправлять HTML частями. Быстрые блоки уходят сразу, медленные
      догоняют в том же ответе, а до этого на их месте стоит заглушка. В React так работает серверный рендеринг
      с `Suspense`. Приём полезен, когда один медленный источник данных держит всю страницу.
    links:
      - https://ru.react.dev/reference/react-dom/server/renderToPipeableStream

  - id: sdr-loading-001
    topic: Рендеринг и доставка
    subtopic: Границы загрузки и ассеты
    level: junior
    question: |
      На странице фильма в видеосервисе заголовок набран особым шрифтом. Шрифт упомянут только внутри файла стилей,
      поэтому браузер узнаёт о нём, лишь когда скачает и разберёт стили, и заголовок появляется поздно. Файл шрифта
      лежит на том же сайте и нужен этой же странице сразу. Какая подсказка браузеру подходит?
    options:
      - text: '`<link rel="prefetch">` для файла шрифта'
        why: 'prefetch грузит с низким приоритетом то, что понадобится на следующей странице. Здесь шрифт нужен текущей странице и срочно.'
      - text: '`<link rel="preload">` для файла шрифта'
        correct: true
        why: 'preload говорит браузеру: этот ресурс нужен текущей странице скоро, начни грузить сейчас. Это ровно случай ресурса, который браузер иначе нашёл бы поздно; у шрифта нужен ещё атрибут crossorigin, иначе он скачается дважды.'
      - text: '`<link rel="preconnect">` к домену сайта'
        why: 'preconnect заранее открывает соединение с чужим доменом. Шрифт лежит на том же сайте, соединение уже есть, а проблема в том, что браузер поздно узнаёт о файле.'
      - text: 'Атрибут `loading="lazy"` у заголовка'
        why: 'Ленивая загрузка откладывает то, что не нужно сразу. Здесь нужно обратное — начать загрузку раньше.'
    explanation: |
      Подсказки отличаются тем, для какой страницы и насколько срочно. `preload` — для текущей страницы и сейчас:
      шрифтов, упомянутых только в стилях, и главной картинки, которую вставляет скрипт. `prefetch` — для вероятной
      следующей страницы, в фоне. `preconnect` открывает соединение с чужим доменом заранее. Предзагрузку стоит
      ставить только на действительно важное: она отбирает канал у остальных ресурсов первого экрана.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Attributes/rel/preload

  - id: sdr-loading-002
    topic: Рендеринг и доставка
    subtopic: Границы загрузки и ассеты
    level: middle
    question: |
      В веб-почте есть просмотрщик PDF-вложений: библиотека весит 300 КБ в сжатом виде. Просмотрщик открывают
      примерно в одном визите из десяти, и только по нажатию на вложение. Сейчас он входит в основной файл приложения,
      и список писем на слабых ноутбуках начинает реагировать на клики с опозданием. Как поступить?
    options:
      - text: 'Оставить в основном файле, но включить сжатие посильнее'
        why: 'Сжатие уменьшит загрузку, но код всё равно придётся разобрать и выполнить при старте. Цена JavaScript — не только вес файла.'
      - text: 'Вынести в отдельный кусок и загружать при открытии вложения'
        correct: true
        why: 'Девяти визитам из десяти просмотрщик не нужен вовсе. Отдельный кусок, загружаемый по требованию, убирает его код из старта, а тот, кто открыл вложение, подождёт загрузку один раз.'
      - text: 'Вынести в отдельный кусок и загрузить его через preload при старте'
        why: 'preload загрузит кусок сразу с высоким приоритетом — ради того, что нужно одному визиту из десяти. Это отнимет канал у первого экрана.'
      - text: 'Сделать просмотр PDF отдельной страницей на другом домене'
        why: 'Отдельный домен ничего не даёт для скорости старта, а добавляет ещё одно соединение и усложняет вход и права доступа к вложениям.'
    explanation: |
      Разбиение кода выносит в отдельные куски то, что нужно не всем и не сразу. Тяжёлый модуль, который открывают редко
      и по явному действию, грузят лениво при первом использовании. JavaScript дорог не только загрузкой: его разбирают
      и выполняют в основном потоке, поэтому лишний код в старте портит отклик на нажатия.
    links:
      - https://web.dev/articles/reduce-javascript-payloads-with-code-splitting

  - id: sdr-loading-003
    topic: Рендеринг и доставка
    subtopic: Границы загрузки и ассеты
    level: middle
    question: |
      В онлайн-банке после входа открывается главная. Почти все клиенты заходят из Chrome — с Android и с компьютеров.
      По статистике 70 % людей следующим шагом идут в «Переводы».
      Код раздела переводов — отдельный кусок на 150 КБ, и при переходе люди ждут его загрузку почти секунду. Главная
      уже загружена и работает. Как сократить ожидание, не замедлив саму главную?
    options:
      - text: 'Добавить кусок переводов в основной файл главной'
        why: 'Главная станет тяжелее и медленнее для всех, в том числе для 30 %, кому переводы не нужны. Задача — не замедлить главную.'
      - text: 'Поставить на главной `<link rel="preload">` для куска переводов'
        why: 'preload грузит с высоким приоритетом как ресурс текущей страницы и конкурирует с ресурсами главной. Для следующего шага подходит другая подсказка.'
      - text: 'Скачать кусок переводов в фоне через prefetch'
        correct: true
        why: 'Вероятность высокая, а кусок качается с низким приоритетом, когда сеть свободна, и ложится в кэш. При переходе ждать почти нечего, а главная не тормозит.'
      - text: 'Грузить кусок переводов по нажатию, но показывать скелетон'
        why: 'Скелетон делает ожидание понятнее, но не короче. Секунда загрузки останется.'
    explanation: |
      Загрузка на будущее (`prefetch`) — ставка на вероятный следующий шаг: ресурс качается с низким приоритетом
      и ложится в HTTP-кэш. Она оправдана, когда вероятность высока, а лишние байты дёшевы, как здесь: семь человек
      из десяти пойдут в переводы. `preload` для этого не подходит — он для текущей страницы и конкурирует с её
      собственными ресурсами.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Attributes/rel/prefetch

  - id: sdr-loading-004
    topic: Рендеринг и доставка
    subtopic: Границы загрузки и ассеты
    level: senior
    question: |
      В видеосервисе страница просмотра — ленивый кусок маршрута. Внутри неё плеер подключён через `lazy`, а внутри
      плеера через `lazy` подключены субтитры. В панели «Сеть» три куска грузятся строго друг за другом: каждый начинается
      только после того, как предыдущий загрузился и выполнился. На мобильной сети это 1,5 секунды до запуска видео.
      Плеер и субтитры нужны на этой странице всегда. Что исправит задержку?
    options:
      - text: 'Начинать загрузку плеера и субтитров вместе с куском страницы'
        correct: true
        why: 'Это водопад кусков: второй запрос ждёт выполнения первого. Если плеер и субтитры нужны всегда, их либо подключают обычным импортом в кусок страницы, либо запускают их import() или modulepreload одновременно со страницей.'
      - text: 'Собрать плеер и субтитры в основной файл всего приложения'
        why: 'Водопад исчезнет, но код плеера будут скачивать и выполнять все, включая тех, кто смотрит только каталог. Первый экран остальных страниц станет тяжелее.'
      - text: 'Разделить плеер на ещё несколько мелких кусков'
        why: 'Мелкая нарезка добавит запросов и не уберёт главного — каждый кусок по-прежнему ждёт предыдущий.'
      - text: 'Загрузить все куски сервиса через prefetch на главной'
        why: 'prefetch грузит в фоне на будущее и для всех страниц сразу — много лишнего трафика. А если человек пришёл по прямой ссылке на фильм, главной он не видел.'
    explanation: |
      Ленивый компонент внутри ленивого компонента даёт водопад кусков: следующий начинает грузиться, только когда
      выполнится предыдущий. Если вложенные части нужны всегда, их отделяют вместе со страницей или запускают их
      загрузку параллельно. Ленивая загрузка нужна там, где кусок понадобится не всем и не сразу.
    links:
      - https://web.dev/articles/reduce-javascript-payloads-with-code-splitting

  - id: sdr-loading-005
    topic: Рендеринг и доставка
    subtopic: Границы загрузки и ассеты
    level: junior
    question: |
      Команда встраиваемого виджета опросов записала бюджет скорости: не больше 170 КБ сжатого JavaScript на первый
      экран; все скрипты подключены с атрибутом `defer`. Дизайнер спрашивает, почему не ограничить так же картинки
      и почему JavaScript считают отдельно. Что ответить?
    options:
      - text: 'Картинки грузятся лениво и в первый экран не попадают'
        why: 'Главная картинка как раз попадает в первый экран и часто бывает LCP-элементом. Отдельный счёт JavaScript нужен по другой причине.'
      - text: 'Скрипт ещё разбирают и выполняют в основном потоке'
        correct: true
        why: 'Картинку браузер скачивает и раскодирует, не мешая нажатиям. Скрипт того же веса нужно разобрать, скомпилировать и выполнить на процессоре, и всё это время нажатия ждут.'
      - text: 'Скрипт блокирует разбор HTML, а картинка — нет'
        why: 'Это верно только для обычного скрипта без defer и без type="module". Скрипты с defer разбор не блокируют, а дорогими остаются всё равно.'
      - text: 'Картинки не влияют на метрики скорости, а скрипты влияют'
        why: 'Картинки влияют, и сильно: главная картинка часто и есть LCP, а картинки без размеров портят CLS. Отдельный счёт JavaScript нужен по другой причине.'
    explanation: |
      Цена JavaScript — не только загрузка. 170 КБ в сжатом виде — это несколько сотен килобайт кода, который браузер
      разбирает, компилирует и выполняет в основном потоке. На недорогом телефоне это сотни миллисекунд, в которые
      страница не отвечает. Поэтому бюджет на первый экран обычно записывают отдельно по JavaScript и проверяют в сборке.
    links:
      - https://web.dev/articles/performance-budgets-101

  - id: sdr-routing-001
    topic: Рендеринг и доставка
    subtopic: Маршрутизация как контракт
    level: junior
    question: |
      В трекере задач у проекта три вкладки: «Список», «Доска» и «Настройки». Слева у проекта боковая панель с фильтром
      по исполнителям. Сейчас каждая вкладка — отдельная страница со своей копией боковой панели, и при переключении
      вкладок фильтр сбрасывается, а панель заново грузит исполнителей. Как это исправить?
    options:
      - text: 'Сделать вкладки вложенными маршрутами в общем макете проекта'
        correct: true
        why: 'Макет проекта рисует боковую панель один раз и оставляет место для вкладки. При переключении меняется только вложенный уровень, а панель с её фильтром и данными остаётся.'
      - text: 'Сохранять фильтр в localStorage и восстанавливать при каждом открытии вкладки'
        why: 'Фильтр вернётся, но панель всё равно будет пересоздаваться и заново грузить исполнителей. Причина в том, что у каждой вкладки своя копия панели.'
      - text: 'Загружать исполнителей заранее при входе в приложение'
        why: 'Запрос станет быстрее, но панель всё равно будет пересоздаваться при каждом переходе, и её состояние будет теряться.'
      - text: 'Объединить три вкладки в одну страницу без маршрутов'
        why: 'Панель перестанет пересоздаваться, но вкладки пропадут из адреса: ссылкой на «Доску» не поделиться, «Назад» не вернёт на прошлую вкладку.'
    explanation: |
      Вложенные маршруты повторяют вложенность экранов: оболочка, проект, вкладка. Каждый уровень — макет, который
      рисует общую часть и оставляет место для вложенного (`<Outlet>` в React Router). При переходе перерисовывается
      только изменившийся уровень, поэтому общие части не теряют состояние и не грузят данные заново.
    links:
      - https://reactrouter.com/start/data/data-loading

  - id: sdr-routing-002
    topic: Рендеринг и доставка
    subtopic: Маршрутизация как контракт
    level: middle
    question: |
      На маркетплейсе объявлений страница `/items/:id` — макет с данными объявления, а внутри него вложенный маршрут
      с карточкой продавца. Сейчас компонент макета запрашивает объявление после отрисовки, а карточка продавца
      запрашивает продавца после отрисовки макета. API отдаёт продавца по номеру объявления. Как убрать лесенку
      запросов?
    options:
      - text: 'Запрашивать продавца внутри загрузки объявления, одним промисом за другим'
        why: 'Запросы по-прежнему пойдут друг за другом, только в другом месте. Продавцу не нужны данные объявления: номер есть в адресе.'
      - text: 'Перенести обе загрузки в загрузчики маршрутов'
        correct: true
        why: 'Маршрутизатор знает весь адрес сразу и запускает загрузчики всех совпавших уровней параллельно, до отрисовки. Обоим нужен только номер из адреса, поэтому ждать друг друга им незачем.'
      - text: 'Показать карточку продавца со скелетоном, пока идёт его запрос'
        why: 'Скелетон делает ожидание понятнее, но не короче: запрос продавца по-прежнему начнётся только после отрисовки макета.'
      - text: 'Кэшировать объявления, чтобы второй запрос шёл быстрее'
        why: 'Кэш поможет при повторных визитах, но при первом открытии лесенка останется. Причина — в порядке запросов.'
    explanation: |
      Когда каждый уровень грузит свои данные после отрисовки родителя, вложенные маршруты дают водопад. Загрузчики
      маршрутов (`loader` в React Router) запускаются для всех совпавших уровней одновременно, потому что маршрутизатор
      знает весь адрес до отрисовки. Это работает, пока загрузчику нужен только адрес, а не данные родителя.
    links:
      - https://reactrouter.com/start/data/data-loading

  - id: sdr-routing-003
    topic: Рендеринг и доставка
    subtopic: Маршрутизация как контракт
    level: middle
    question: |
      На странице объявления маркетплейса фото открываются в полноэкранной галерее поверх страницы. Люди хотят
      отправлять ссылку на конкретное фото, а на телефоне ждут, что «Назад» закроет галерею. После закрытия они должны
      оказаться на том же месте страницы объявления. Как устроить галерею?
    options:
      - text: 'Отдельная страница `/photos/:photoId` вместо страницы объявления'
        why: 'Ссылка и «Назад» будут работать, но при открытии галереи страница объявления исчезнет. После закрытия она загрузится заново, и человек потеряет место.'
      - text: 'Состояние «галерея открыта» в памяти компонента'
        why: 'Страница останется под галереей, но ссылкой на фото не поделиться, а «Назад» уведёт со страницы объявления.'
      - text: 'Номер фото в параметре адреса страницы объявления: `?photo=3`'
        correct: true
        why: 'Галерея открыта поверх той же страницы, поэтому страница с прокруткой остаётся под ней. Адрес с фото можно отправить, а «Назад» убирает параметр и закрывает галерею.'
      - text: 'Номер фото в sessionStorage и восстановление после перезагрузки'
        why: 'Галерея переживёт перезагрузку, но ссылкой не поделиться: у друга своё хранилище. И «Назад» по-прежнему уведёт со страницы.'
    explanation: |
      Глубокая ссылка открывает конкретное место страницы: вкладку, отзыв, фото. Окно поверх страницы кладут
      в параметр адреса или во вложенный маршрут той же страницы. Тогда страница под окном не исчезает, ссылкой можно
      поделиться, а «Назад» закрывает окно — так, как люди и ждут на телефоне.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/History_API

  - id: sdr-routing-004
    topic: Рендеринг и доставка
    subtopic: Маршрутизация как контракт
    level: senior
    question: |
      В трекере задач при каждом переходе между проектами сразу показывается скелетон новой страницы. По статистике
      девять переходов из десяти загружаются быстрее 300 мс, и люди жалуются на мелькание: скелетон вспыхивает
      и тут же сменяется данными. Но у больших проектов блок «Активность за месяц» грузится две секунды, и раньше
      он держал всю страницу. Как вести себя при переходе?
    options:
      - text: 'Всегда показывать скелетон новой страницы, но с анимацией появления'
        why: 'Анимация смягчит вспышку, но не уберёт её: на быстрых переходах человек по-прежнему видит лишний промежуточный экран.'
      - text: 'Оставлять старую страницу с индикатором, «Активность» — позже на заглушке'
        correct: true
        why: 'На быстрых переходах человек не видит пустого экрана — страница просто сменяется. Медленный блок больше не держит переход: основное появляется сразу, а «Активность» догружается на своём месте.'
      - text: 'Оставлять старую страницу, пока не загрузятся все данные, включая «Активность»'
        why: 'Мелькания не будет, но у больших проектов каждый переход займёт две секунды из-за одного второстепенного блока.'
      - text: 'Загружать «Активность» для всех проектов заранее при входе'
        why: 'Это десятки тяжёлых запросов ради нескольких проектов, которые откроют. И при новых данных блок всё равно придётся грузить снова.'
    explanation: |
      Пока идёт переход, есть два поведения: оставить старую страницу с индикатором или сразу показать новую со
      скелетоном. Первое лучше для коротких загрузок — нет мелькания, второе — для долгих. Медленные второстепенные
      части отделяют: загрузчик отдаёт быстрые данные сразу, а медленные — позже, и страница показывает их на месте
      заглушки, не задерживая переход.
    links:
      - https://reactrouter.com/start/data/data-loading

  - id: sdr-routing-005
    topic: Рендеринг и доставка
    subtopic: Маршрутизация как контракт
    level: middle
    question: |
      В документации библиотеки длинный список статей слева. Человек прокручивает его, открывает статью и нажимает
      «Назад» — и оказывается в начале списка. Список приходит из сети после перехода, примерно через полсекунды.
      Автоматическое восстановление прокрутки браузера включено. Что исправит возврат на место?
    options:
      - text: 'Ничего не менять: браузер сам восстановит прокрутку при «Назад»'
        why: 'Браузер восстанавливает прокрутку сразу при переходе. Если содержимое приходит позже, страница в этот момент короткая, и прокручивать некуда.'
      - text: 'Прокручивать к сохранённому месту после того, как список отрисован'
        correct: true
        why: 'Прокрутку нужно восстановить, когда у страницы уже есть содержимое нужной высоты. Это делает, например, ScrollRestoration в React Router или ручное восстановление после отрисовки.'
      - text: 'Всегда открывать список с начала, чтобы поведение было предсказуемым'
        why: 'Поведение станет предсказуемым, но человек потеряет место, а именно на это жалоба.'
      - text: 'Сохранять прокрутку в localStorage при каждом её изменении'
        why: 'Место будет сохранено, но восстанавливать его всё равно нужно после отрисовки. А общая запись в localStorage смешает прокрутку разных вкладок и визитов.'
    explanation: |
      В одностраничном приложении содержимое часто приходит из сети после перехода, и браузер не успевает восстановить
      прокрутку: в момент перехода страница ещё короткая. Прокрутку запоминают для каждой записи истории
      и восстанавливают после того, как содержимое отрисовано. В React Router для этого есть `<ScrollRestoration>`;
      вручную — `history.scrollRestoration = 'manual'` и прокрутка после отрисовки.
    links:
      - https://reactrouter.com/api/components/ScrollRestoration

  - id: sdr-media-001
    topic: Рендеринг и доставка
    subtopic: Картинки и медиа
    level: junior
    question: |
      На фотохостинге галерея миниатюр: на телефоне три колонки, каждая примерно в треть экрана. У миниатюр есть
      `srcset` с вариантами 400w, 800w, 1600w и 2000w, но атрибута `sizes` нет. Профиль показывает, что телефон качает
      вариант 1600w для каждой миниатюры. Почему?
    options:
      - text: 'Без `sizes` браузер считает, что картинка во всю ширину окна'
        correct: true
        why: 'Ширину картинки на странице браузер узнаёт из sizes. Без него он предполагает 100vw, умножает на плотность пикселей и выбирает крупный вариант, хотя миниатюра занимает треть экрана.'
      - text: 'Браузер всегда выбирает самый крупный вариант из `srcset`'
        why: 'Не всегда: он выбирает вариант под нужную ширину с учётом плотности пикселей. 2000w он как раз не взял, а 1600w подошёл под ширину всего окна.'
      - text: 'Без `width` и `height` браузер не знает размер и берёт крупный вариант'
        why: 'width и height нужны, чтобы зарезервировать место и не дать странице прыгать. Какой вариант качать, браузер решает по sizes и плотности пикселей.'
      - text: 'Миниатюры загружаются лениво, поэтому браузер не знает их размер'
        why: 'Ленивая загрузка меняет момент загрузки, а не выбор варианта. Выбор зависит от того, какую ширину картинка займёт по sizes.'
    explanation: |
      `srcset` перечисляет варианты по ширине, а `sizes` говорит, какую ширину картинка займёт на странице. Браузер
      умножает эту ширину на плотность пикселей и выбирает подходящий вариант. Без `sizes` он считает картинку
      во всю ширину окна и для миниатюр в треть экрана качает картинку в несколько раз шире нужной — а пикселей
      в ней в десяток раз больше.
    links:
      - https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/img

  - id: sdr-media-002
    topic: Рендеринг и доставка
    subtopic: Картинки и медиа
    level: middle
    question: |
      В ленте новостей у каждой новости фото с резиновой шириной на всю колонку. Пока фото грузятся, текст новостей
      идёт сплошным столбцом, а потом фото одно за другим раздвигают ленту. CLS — 0,28. Пропорции фото у всех новостей
      известны заранее. Что исправит сдвиги?
    options:
      - text: 'Указать у фото атрибуты `width` и `height`'
        correct: true
        why: 'По этим атрибутам браузер вычисляет соотношение сторон и резервирует место нужной высоты ещё до загрузки, даже при резиновой ширине. Фото встаёт в готовое место, ничего не сдвигая.'
      - text: 'Загружать все фото ленты лениво'
        why: 'Ленивая загрузка откладывает фото, но место под них всё равно не отведено. Они будут раздвигать ленту так же, только позже.'
      - text: 'Перевести фото в формат AVIF, чтобы они грузились быстрее'
        why: 'Фото придут быстрее, но всё равно после текста, и сдвиг останется. CLS зависит от того, отведено ли место, а не от скорости.'
      - text: 'Поставить фото первой новости `fetchpriority="high"`'
        why: 'Это ускорит одно фото, но не отведёт места остальным. Сдвиги от других фото останутся.'
    explanation: |
      Пока картинка не загружена, браузер не знает её высоту и отводит под неё ноль. Атрибуты `width` и `height` дают ему
      соотношение сторон, и место резервируется заранее даже при `width: 100%; height: auto`. Для блоков без своих
      размеров — плееров, рекламы — используют CSS-свойство `aspect-ratio`.
    links:
      - https://web.dev/articles/cls

  - id: sdr-media-003
    topic: Рендеринг и доставка
    subtopic: Картинки и медиа
    level: middle
    question: |
      На новостном сайте у статьи большое фото вверху, и оно — LCP-элемент. Компонент картинки во всём проекте ставит
      `loading="lazy"` по умолчанию. Фото есть в HTML с самого начала, но LCP на телефонах — 3,4 секунды, и профиль
      показывает, что загрузка фото начинается поздно. Что сделать с этим фото?
    options:
      - text: 'Оставить `loading="lazy"` и уменьшить размер фото'
        why: 'Меньший файл загрузится быстрее, но начнёт загружаться всё так же поздно: ленивая загрузка ждёт, пока браузер построит страницу.'
      - text: 'Убрать `loading="lazy"` и поставить `fetchpriority="high"`'
        correct: true
        why: 'Главная картинка первого экрана не должна ждать: без ленивой загрузки браузер начнёт её сразу, а высокий приоритет поставит её впереди других картинок.'
      - text: 'Добавить `<link rel="prefetch">` для этого фото статьи'
        why: 'prefetch грузит с низким приоритетом ресурсы для следующей страницы. Фото нужно этой странице и срочно.'
      - text: 'Перенести фото ниже заголовка, подзаголовка и даты'
        why: 'Фото останется в первом экране и, скорее всего, LCP-элементом. Ленивая загрузка и низкий приоритет никуда не денутся.'
    explanation: |
      Ленивая загрузка нужна картинкам ниже первого экрана. У главной картинки она откладывает загрузку до момента,
      когда браузер построит страницу и поймёт, что картинка видна, и LCP ухудшается. Главной картинке нужно обратное:
      быть в HTML, грузиться сразу и получить высокий приоритет через `fetchpriority="high"`.
    links:
      - https://web.dev/articles/fetch-priority

  - id: sdr-media-004
    topic: Рендеринг и доставка
    subtopic: Картинки и медиа
    level: senior
    question: |
      На фотохостинге 20 миллионов фото. Сейчас при загрузке каждого фото сервер нарезает два варианта: 400 и 1200
      пикселей в JPEG. Новый дизайн требует ещё три ширины и формат AVIF, а через полгода, скорее всего, появятся
      новые размеры. Старые фото смотрят редко, но смотрят. Как отдавать варианты?
    options:
      - text: 'Перенарезать все 20 миллионов фото в новые варианты фоновой задачей'
        why: 'Работать будет, но это огромная перенарезка ради редко просматриваемых фото, и её придётся повторять при каждом новом размере.'
      - text: 'CDN с изменением размера на лету и ограниченным набором ширин'
        correct: true
        why: 'Оригинал один, а нужный вариант CDN делает при первом запросе и кэширует. Новый размер — просто новый адрес, а редкие старые фото не нарезаются впрок.'
      - text: 'Отдавать оригинал, а размер подгонять в браузере через CSS'
        why: 'Браузер будет качать оригиналы целиком, хотя покажет их маленькими. Трафик и LCP станут хуже.'
      - text: 'Уменьшать фото в браузере через canvas перед показом'
        why: 'Чтобы уменьшить фото в браузере, его сначала нужно скачать целиком. Это лишний трафик и нагрузка на процессор телефона.'
    explanation: |
      Варианты размеров можно нарезать при загрузке или делать на лету в CDN с изменением размера. Нарезка при загрузке
      хороша, пока набор размеров стабилен. Когда размеры меняются, а архив большой и в основном холодный, CDN выгоднее:
      оригинал один, вариант создаётся при первом запросе и кэшируется. Набор разрешённых ширин ограничивают, чтобы
      случайные параметры не плодили варианты.
    links:
      - https://web.dev/learn/design/responsive-images

  - id: sdr-media-005
    topic: Рендеринг и доставка
    subtopic: Картинки и медиа
    level: middle
    question: |
      Онлайн-кинотеатр отдаёт трейлеры одним MP4-файлом в 1080p. Зрители на мобильной сети жалуются: трейлер то и дело
      останавливается на подгрузку, а на хорошем Wi-Fi всё идеально. Скорость сети у одного и того же зрителя за минуту
      просмотра может меняться в разы. Какое решение подходит?
    options:
      - text: 'Отдавать всем трейлеры в 480p, чтобы хватало любой сети'
        why: 'Остановок станет меньше, но зрители на хорошем Wi-Fi получат мыльную картинку без всякой причины.'
      - text: 'Перед запуском скачивать трейлер целиком'
        why: 'На медленной сети человек будет долго ждать старта, и весь файл скачается, даже если досмотрят десять секунд.'
      - text: 'Адаптивный стриминг с несколькими качествами'
        correct: true
        why: 'Плеер для каждого следующего отрезка выбирает качество по текущей скорости сети. Сеть просела — следующий отрезок пойдёт в худшем качестве, и видео не остановится.'
      - text: 'Перенести файлы трейлеров на CDN поближе к зрителям'
        why: 'CDN сократит задержку, но не поможет, когда сама мобильная сеть зрителя проседает. Один файл в 1080p по-прежнему не пройдёт в узкий канал.'
    explanation: |
      Адаптивный стриминг (HLS, DASH) кодирует видео в нескольких качествах и режет на отрезки по несколько секунд.
      Плеер следит за скоростью сети и выбирает качество каждого следующего отрезка, поэтому видео меняет качество,
      а не останавливается. Плеер обычно берут готовый, а перекодирование в отрезки делает сервер после загрузки.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Media/Guides/Audio_and_video_delivery

  - id: sdr-versions-001
    topic: Рендеринг и доставка
    subtopic: Кэширование и совместимость версий
    level: junior
    question: |
      Сборщик встраиваемого виджета опросов кладёт в имя каждого скрипта и стиля хэш содержимого: `poll.8c41f2.js`.
      Изменился код — изменилось имя. Какой заголовок `Cache-Control` подходит таким файлам?
    options:
      - text: '`no-store` — не хранить вовсе, чтобы всегда была свежая версия'
        why: 'Свежесть уже гарантирует имя: новый код придёт под новым именем. Без кэша браузер будет качать неизменные файлы при каждом визите.'
      - text: '`no-cache` — хранить, но проверять у сервера при каждом использовании'
        why: 'Так настраивают страницу-вход, в которой ссылки на текущую версию. Файл с хэшем под этим именем никогда не изменится, проверять его незачем.'
      - text: '`max-age=31536000, immutable` — хранить год и не проверять'
        correct: true
        why: 'Содержимое файла под этим именем никогда не меняется, поэтому его можно хранить сколь угодно долго без проверок. Новая версия придёт под новым именем.'
      - text: '`max-age=300` — хранить пять минут, потом проверить'
        why: 'Короткий срок нужен файлам, которые меняются под тем же именем. Здесь он лишь заставит браузер зря переспрашивать сервер.'
    explanation: |
      Файлы с хэшем содержимого в имени — основа кэширования ассетов. Раз файл под этим именем не меняется, его хранят
      год с `immutable`, а новая версия приходит под новым именем. Чтобы браузер узнал новые имена, страницу-вход
      (`index.html`) отдают с `no-cache`: её можно хранить, но каждый раз проверять у сервера.
    links:
      - https://web.dev/articles/http-cache

  - id: sdr-versions-002
    topic: Рендеринг и доставка
    subtopic: Кэширование и совместимость версий
    level: middle
    question: |
      После выкатки исправления в дашборде аналитики часть сотрудников ещё сутки видит старую ошибку. Файлы скриптов
      названы с хэшем и кэшируются на год. Страница-вход `index.html` отдаётся с CDN с заголовком
      `Cache-Control: max-age=86400`. Что исправить?
    options:
      - text: 'Убрать хэш из имён скриптов, чтобы они всегда брались с сервера'
        why: 'Без хэша файлы нельзя кэшировать надолго, и браузер станет качать или проверять их при каждом визите. А старая страница-вход всё равно будет ссылаться на старые файлы.'
      - text: 'Сократить кэш скриптов с года до одного дня'
        why: 'Проблема не в скриптах: новая версия лежит под новыми именами. Браузер о них не знает, потому что сутки держит старую страницу-вход со старыми ссылками.'
      - text: 'Отдавать `index.html` с `no-cache`, сбрасывая на CDN'
        correct: true
        why: 'Страница-вход хранит ссылки на текущую версию. Если её проверять каждый раз и сбрасывать на CDN, браузер сразу получит ссылки на новые файлы.'
      - text: 'Попросить сотрудников очищать кэш браузера после каждой выкатки'
        why: 'Это перекладывает ошибку настройки на людей. Правильный кэш страницы-входа решает задачу без их участия.'
    explanation: |
      Новую версию браузер находит через страницу-вход: в ней ссылки на файлы с хэшем. Если её закэшировать на сутки,
      браузер сутки будет ссылаться на старые файлы, хотя новые давно на сервере. Страницу-вход отдают с `no-cache`
      и сбрасывают на CDN при выкатке, а долгий кэш оставляют файлам с хэшем.
    links:
      - https://developer.mozilla.org/ru/docs/Web/HTTP/Reference/Headers/Cache-Control

  - id: sdr-versions-003
    topic: Рендеринг и доставка
    subtopic: Кэширование и совместимость версий
    level: middle
    question: |
      В онлайн-редакторе документов после выкатки у людей с давно открытыми вкладками перестала открываться панель
      комментариев: её кусок кода загружается лениво, а старого файла на сервере уже нет. Разработчик предлагает при
      ошибке загрузки куска сразу перезагружать страницу. Люди в это время часто дописывают абзац, который ещё не
      сохранён. Как поступить?
    options:
      - text: 'Перезагружать сразу: так человек быстрее получит новую версию'
        why: 'Перезагрузка посреди набора сотрёт несохранённый абзац. Восстанавливать работу ценой потери ввода нельзя.'
      - text: 'Хранить старые файлы, а при ошибке — сохранить ввод и спросить'
        correct: true
        why: 'Старые файлы на сервере уберут большую часть ошибок: вкладка получит свою версию куска. Оставшиеся ловят и перезагружают только после того, как ввод сохранён, и не в цикле.'
      - text: 'Скрывать панель комментариев, если её кусок не загрузился'
        why: 'Ошибка станет незаметной, а функция просто пропадёт без объяснения. Человек не поймёт, почему нет комментариев и как их вернуть.'
      - text: 'Отказаться от ленивой загрузки и класть всё в основной файл'
        why: 'Это утяжелит старт для всех ради редкого случая. Проблему решают хранением старых файлов и обработкой ошибки.'
    explanation: |
      Открытая вкладка живёт со своей версией и просит свои ленивые куски по старым именам. Если старые файлы удалены,
      загрузка падает. Защита в два слоя: хранить файлы прошлых версий несколько дней и ловить ошибку загрузки куска.
      Перезагрузку делают в безопасный момент — когда ввод сохранён — и не повторяют по кругу.
    links:
      - https://vite.dev/guide/build#load-error-handling

  - id: sdr-versions-004
    topic: Рендеринг и доставка
    subtopic: Кэширование и совместимость версий
    level: senior
    question: |
      В онлайн-банке сервер отдаёт сумму операции полем `amount` в рублях дробным числом. Команда хочет заменить его
      полем `amountMinor` — целым числом копеек. Серверы обновляются постепенно, по одному, а вкладки клиентов живут
      по несколько дней. Ни одна вкладка не должна показать неправильную сумму или упасть. В каком порядке менять?
    options:
      - text: 'Выкатить клиент и сервер одновременно в одну выкатку'
        why: 'Одновременно не получится: вкладки, открытые до выкатки, останутся со старым клиентом, а серверы обновляются по одному. Старые клиенты не найдут amount.'
      - text: 'Сначала клиент, который читает только amountMinor, потом сервер'
        why: 'Пока серверы не обновлены, новый клиент не найдёт amountMinor в ответах и сломается.'
      - text: 'Сервер отдаёт оба поля, потом новый клиент, затем amount убирают'
        correct: true
        why: 'Это «расширить и сузить»: на каждом шаге работает любое сочетание версий клиента и сервера. Старое поле убирают, только когда по версиям в запросах видно, что старых клиентов почти не осталось.'
      - text: 'Сервер сразу отдаёт только amountMinor, старый клиент перезагрузится сам'
        why: 'Старый клиент не умеет обрабатывать новый формат: он может показать пустую или неверную сумму, а не перезагрузиться. Условие запрещает и то и другое.'
    explanation: |
      Во время постепенной выкатки и после неё с сервером говорят клиенты разных версий, а серверы обновлены не все
      сразу. Поэтому контракт меняют приёмом «расширить и сузить»: сервер начинает понимать и отдавать оба формата,
      выходит клиент на новом формате, и только когда старые клиенты ушли — это видно по версии в заголовке запроса, —
      старый формат убирают.
    links:
      - https://martinfowler.com/bliki/ParallelChange.html

  - id: sdr-versions-005
    topic: Рендеринг и доставка
    subtopic: Кэширование и совместимость версий
    level: junior
    question: |
      Инженер веб-календаря предлагает при каждой выкатке удалять с CDN все файлы прошлой версии, «чтобы не копить
      мусор». Имена у файлов с хэшем, так что новые и старые файлы не конфликтуют. Чем опасно это предложение?
    options:
      - text: 'CDN не сможет отдать новую версию, пока старая не удалена'
        why: 'Имена с хэшем не конфликтуют: новые и старые файлы спокойно лежат рядом. Удаление старых для новой версии не нужно.'
      - text: 'Новые пользователи получат смесь старых и новых файлов'
        why: 'Новые пользователи загружают свежую страницу-вход и берут файлы только новой версии.'
      - text: 'Открытые вкладки не смогут догрузить свои ленивые куски'
        correct: true
        why: 'Вкладка, открытая до выкатки, просит куски по именам своей версии. Если их удалили, загрузка упадёт, и вместо экрана человек увидит пустоту.'
      - text: 'Браузеры перестанут кэшировать файлы с хэшем'
        why: 'Кэширование в браузере не зависит от того, что лежит на CDN. Дело в том, что вкладкам нечего будет догрузить.'
    explanation: |
      У веб-приложения нет одного администратора, который обновил бы все открытые вкладки. Вкладка версии 41 продолжает
      работать и при первом использовании ленивого куска просит файл версии 41. Поэтому файлы прошлых версий хранят
      ещё несколько дней после выкатки, а ошибку загрузки куска всё равно ловят — для совсем старых вкладок.
    links:
      - https://vite.dev/guide/build#load-error-handling

  - id: sdr-service-worker-001
    topic: Рендеринг и доставка
    subtopic: Service Worker и обновления
    level: junior
    question: |
      Онлайн-школа добавила Service Worker. Скрипты и стили приложения собираются с хэшем содержимого в имени:
      изменился код — изменилось имя. Какую стратегию Service Worker выбрать для этих файлов?
    options:
      - text: 'Сначала кэш: есть в кэше — отдать оттуда, нет — взять из сети'
        correct: true
        why: 'Файл под этим именем никогда не меняется, поэтому кэш всегда прав. Новая версия придёт под новым именем, и её Service Worker возьмёт из сети.'
      - text: 'Сначала сеть: попробовать сеть, а без неё отдать из кэша'
        why: 'Так каждый файл будет ждать сеть, хотя его содержимое заведомо не изменилось. Это лишние задержки, особенно на медленной сети.'
      - text: 'Только сеть: файлы приложения не кэшировать вовсе'
        why: 'Тогда приложение не откроется без сети, а с сетью будет каждый раз качать неизменные файлы.'
      - text: 'Кэш и обновление в фоне: отдать из кэша и перекачать файл'
        why: 'Отдать из кэша правильно, но перекачивать файл, который под этим именем не меняется, незачем: это лишний трафик.'
    explanation: |
      Стратегию Service Worker выбирают для каждого вида запросов. Для файлов с хэшем в имени, шрифтов и иконок
      подходит «сначала кэш»: содержимое под этим именем не меняется, а новая версия приходит под новым именем. «Сначала
      сеть» нужна там, где важна свежесть, а «только сеть» — для запросов, которые меняют данные.
    links:
      - https://developer.chrome.com/docs/workbox/modules/workbox-strategies

  - id: sdr-service-worker-002
    topic: Рендеринг и доставка
    subtopic: Service Worker и обновления
    level: middle
    question: |
      Полевое приложение инспекторов показывает список проверок на сегодня. Список меняется в течение дня, и инспектор
      должен видеть свежий, если связь есть. Но инспекторы часто работают в подвалах, и там лучше показать последнюю
      сохранённую копию с пометкой времени, чем ошибку. Какую стратегию Service Worker выбрать для запроса списка?
    options:
      - text: 'Сначала кэш: показать сохранённый список, сеть только если его нет'
        why: 'Список, однажды попавший в кэш, будет показываться всегда, и инспектор не увидит новых проверок даже при хорошей связи.'
      - text: 'Только сеть: без связи показать понятную ошибку'
        why: 'Свежесть будет, но в подвале инспектор останется без списка, а условие требует показать сохранённую копию.'
      - text: 'Сначала сеть с тайм-аутом: без ответа — сохранённая копия'
        correct: true
        why: 'При связи инспектор получает свежий список. Без связи или на очень медленной сети тайм-аут отдаёт последнюю копию из кэша, и экран не пустой.'
      - text: 'Только кэш: список заранее кладут при установке Service Worker'
        why: 'Список меняется в течение дня, а при установке он кладётся один раз. Инспектор увидит вчерашние проверки.'
    explanation: |
      «Сначала сеть» подходит данным, которые должны быть свежими, но без сети лучше старое, чем ничего. Тайм-аут
      важен: на очень медленной сети запрос может висеть долго, а копия из кэша покажется сразу. Рядом с копией стоит
      показать время, на которое она верна.
    links:
      - https://developer.chrome.com/docs/workbox/modules/workbox-strategies

  - id: sdr-service-worker-003
    topic: Рендеринг и доставка
    subtopic: Service Worker и обновления
    level: middle
    question: |
      Онлайн-школа выкатила новую версию своего PWA с новым `sw.js`. Ученики жалуются: даже после перезагрузки страницы
      они видят старую версию. У многих приложение открыто сразу в нескольких вкладках. В инструментах разработчика
      видно, что новая версия Service Worker установлена и стоит в состоянии waiting. Почему так и что сделать?
    options:
      - text: 'Браузер кэширует sw.js на год — нужно сбросить кэш CDN'
        why: 'Браузер проверяет sw.js мимо своего HTTP-кэша при каждом переходе. Здесь новая версия уже найдена и установлена, она ждёт.'
      - text: 'Новая версия ждёт закрытия вкладок старой — предложить обновиться'
        correct: true
        why: 'Установленная версия ждёт, пока старая управляет хоть одной страницей, а перезагрузки одной вкладки для этого мало. Страница замечает ожидающую версию и предлагает обновиться, а по нажатию та активируется.'
      - text: 'Перезагрузка страницы не обновляет PWA — нужно переустановить приложение'
        why: 'Переустанавливать не нужно: новая версия уже установлена браузером и ждёт момента активации.'
      - text: 'Service Worker не умеет обновляться — нужно сменить адрес sw.js'
        why: 'Service Worker обновляется, когда меняется содержимое sw.js. Новый адрес в той же области дал бы ту же новую версию в той же регистрации, и она тоже ждала бы; web.dev вообще советует адрес sw.js не менять.'
    explanation: |
      Новая версия Service Worker устанавливается рядом со старой и ждёт, пока закроются все вкладки, которыми
      управляет старая: так одна страница не окажется с кодом одной версии и кэшем другой. Перезагрузки одной вкладки
      обычно мало. Принятый путь — заметить ожидающую версию, показать «Доступна новая версия — обновить» и по нажатию
      попросить её активироваться, а затем перезагрузить страницу.
    links:
      - https://web.dev/articles/service-worker-lifecycle

  - id: sdr-service-worker-004
    topic: Рендеринг и доставка
    subtopic: Service Worker и обновления
    level: senior
    question: |
      В новостном PWA, чтобы обновления доходили быстрее, разработчик добавил в новую версию Service Worker вызовы
      `skipWaiting()` и `clients.claim()`, а при активации она удаляет кэши прошлой версии. После выкатки у людей
      с открытыми вкладками стали падать переходы в разделы: ленивые куски кода не загружаются. Почему и как исправить?
    options:
      - text: 'Новая версия взяла страницы со старым кодом — обновлять по согласию'
        correct: true
        why: 'Открытая страница работает со старым кодом и просит старые куски, а новая версия уже управляет ею и удалила старый кэш. Ожидание и обновление по нажатию «Обновить» с перезагрузкой страницы как раз защищают от этого.'
      - text: 'clients.claim() сбрасывает HTTP-кэш браузера — его нужно убрать, оставив skipWaiting()'
        why: 'clients.claim() не трогает HTTP-кэш. И одного skipWaiting() достаточно, чтобы новая версия активировалась при открытых старых страницах.'
      - text: 'Удалять кэши прошлой версии нужно не при активации, а при установке'
        why: 'При установке старая версия ещё обслуживает страницы, и удаление её кэша сломает их ещё раньше.'
      - text: 'Ленивые куски нельзя кэшировать в Service Worker — их надо брать только из сети'
        why: 'Кэшировать их можно и нужно для офлайн-открытия. Проблема в том, что страница со старым кодом оказалась под управлением новой версии.'
    explanation: |
      Ожидание в жизненном цикле Service Worker защищает от смешения версий: страница со старым кодом не должна
      оказаться под управлением новой версии, которая удалила старые файлы. `skipWaiting()` без спроса снимает эту
      защиту. Принятый путь — показать «Доступна новая версия», по нажатию активировать ожидающую версию и перезагрузить
      страницу по событию `controllerchange`.
    links:
      - https://web.dev/articles/service-worker-lifecycle

  - id: sdr-service-worker-005
    topic: Рендеринг и доставка
    subtopic: Service Worker и обновления
    level: middle
    question: |
      Service Worker полевого приложения считает неотправленные фото в переменной `pending` и показывает число
      на значке. Иногда счётчик внезапно сбрасывается в ноль, хотя фото так и не ушли. Ошибок в коде подсчёта нет.
      В чём причина?
    options:
      - text: 'В простое браузер останавливает Service Worker'
        correct: true
        why: 'Service Worker не живёт постоянно: браузер запускает его на событие и останавливает, когда работы нет. При следующем запуске переменные начинаются заново, поэтому состояние держат в IndexedDB.'
      - text: 'Service Worker перезапускается при каждой перезагрузке страницы'
        why: 'Его жизнь не привязана к перезагрузкам страницы: он может пережить их и может остановиться, когда страница открыта. Дело в остановках в простое.'
      - text: 'Переменные Service Worker видны только одной вкладке'
        why: 'Service Worker один на сайт и обслуживает все вкладки. Видимость между вкладками здесь ни при чём.'
      - text: 'Счётчик сбрасывается, когда браузер проверяет новую версию sw.js'
        why: 'Проверка обновления не трогает работающую версию. Если версия новая, она установится рядом и будет ждать.'
    explanation: |
      Service Worker живёт отдельно от страницы, и браузер останавливает его, когда событий нет, а потом запускает
      снова. Всё, что лежало в переменных, при этом теряется. Состояние, которое должно пережить остановку, хранят
      в IndexedDB или Cache Storage.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/Service_Worker_API

  - id: sdr-security-001
    topic: Сквозные требования
    subtopic: Границы безопасности
    level: junior
    question: |
      На форуме текст сообщения выводится в React так: `<p>{post.text}</p>`. Кто-то отправил сообщение с текстом
      `<script>steal()</script>`. Что увидят другие участники?
    options:
      - text: 'Скрипт выполнится у каждого, кто откроет тему'
        why: 'React по умолчанию экранирует текст в фигурных скобках: угловые скобки становятся символами, а не тегами. Чтобы скрипт выполнился, защиту нужно обойти.'
      - text: 'Строку `<script>steal()</script>` как обычный текст'
        correct: true
        why: 'Текст в JSX экранируется, поэтому браузер показывает его буквами и не разбирает как HTML. Это главная защита React от XSS.'
      - text: 'Пустой абзац: React вырежет тег вместе с содержимым'
        why: 'React ничего не вырезает — он экранирует. Строка будет показана целиком как текст.'
      - text: 'Ошибку отрисовки: React не выводит строки с тегами'
        why: 'Строки с угловыми скобками React выводит спокойно, просто как текст. Ошибки не будет.'
    explanation: |
      React экранирует данные, которые выводятся в фигурных скобках: `<` превращается в символ, а не начало тега.
      Поэтому большая часть интерфейса защищена от XSS по умолчанию. Дыры появляются там, где эту защиту обходят:
      `dangerouslySetInnerHTML`, `innerHTML`, адреса из данных в `href` и библиотеки, которые сами рисуют HTML.
    links:
      - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html

  - id: sdr-security-002
    topic: Сквозные требования
    subtopic: Границы безопасности
    level: middle
    question: |
      Форум разрешил сообщения с форматированием: редактор отдаёт HTML с жирным, курсивом, цитатами и ссылками. Сообщение
      видят все участники. Отказаться от HTML нельзя: архив за десять лет уже в этом формате. Как выводить сообщения?
    options:
      - text: 'Перед выводом удалять теги `<script>` регулярным выражением'
        why: 'Скрипт можно выполнить без тега script: через атрибуты вроде onerror, через адреса javascript: и десятки других способов. Чёрный список их не перечислит.'
      - text: 'Чистить HTML при выводе по белому списку тегов через DOMPurify'
        correct: true
        why: 'Белый список оставляет только разрешённые теги и атрибуты, всё прочее удаляется. Признанная библиотека учитывает обходные пути, а чистка при выводе защищает и старый архив.'
      - text: 'Проверять HTML в редакторе перед отправкой и запрещать опасные теги'
        why: 'Проверку в браузере легко обойти: запрос можно отправить без редактора. Архиву за десять лет она тоже не поможет.'
      - text: 'Экранировать сообщения целиком, как обычный текст'
        why: 'Это безопасно, но участники увидят теги вместо форматирования, а условие требует его сохранить.'
    explanation: |
      Если показывать чужой HTML необходимо, его санитизируют по белому списку: разрешены только перечисленные теги
      и атрибуты. Чёрный список не работает, потому что способов спрятать скрипт слишком много. Для браузера OWASP
      советует DOMPurify, а чистить надёжнее при выводе: обновлённая библиотека защитит и старые записи.
    links:
      - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html

  - id: sdr-security-003
    topic: Сквозные требования
    subtopic: Границы безопасности
    level: middle
    question: |
      Веб-почта хочет добавить строгую политику безопасности контента (CSP), чтобы вставленный в письмо скрипт не мог
      выполниться. На страницах есть скрипты аналитики и виджет поддержки, и команда не уверена, что знает все места,
      где они вставляют свой код. Ломать работу почты нельзя. Как ввести политику?
    options:
      - text: 'Сразу включить строгую политику и чинить то, что сломается'
        why: 'Сломается почта у людей, и чинить придётся вслепую по жалобам. Риск в условии прямо запрещён.'
      - text: 'Добавить в политику `unsafe-inline`, чтобы ничего не сломалось'
        why: 'unsafe-inline разрешает встроенные скрипты, а именно их и вставляют через письма. Такая политика почти ничего не защищает.'
      - text: 'Сначала включить режим только отчётов, затем блокировку'
        correct: true
        why: 'Заголовок Content-Security-Policy-Report-Only ничего не блокирует, а присылает отчёты о нарушениях. По ним находят и исправляют свои скрипты, и только потом включают блокировку.'
      - text: 'Отказаться от CSP и полагаться на санитизацию писем'
        why: 'Санитизация — первая линия, но ошибки в ней возможны. CSP нужна как вторая линия на случай, если вредный код всё-таки попадёт на страницу.'
    explanation: |
      CSP говорит браузеру, какой код на странице разрешено выполнять, и не даёт выполниться вставленному скрипту, даже
      если санитизация ошиблась. Её цена — риск сломать собственные скрипты. Поэтому политику сначала включают
      заголовком `Content-Security-Policy-Report-Only`: браузер только сообщает о нарушениях. Когда отчёты чистые, включают
      блокировку.
    links:
      - https://developer.mozilla.org/ru/docs/Web/HTTP/Guides/CSP

  - id: sdr-security-004
    topic: Сквозные требования
    subtopic: Границы безопасности
    level: senior
    question: |
      Виджет опросов встраивается в рамку (iframe) на сайты партнёров. Голос отправляется запросом `POST` к API виджета,
      а участник опознаётся по cookie. Чтобы cookie работала внутри рамки на чужом сайте, у неё стоит `SameSite=None`
      и `Secure`; виджет рассчитан на браузеры, которые разрешают такие cookie в чужих рамках. Значит, любой сайт может
      отправить запрос к API от имени участника. Как защитить голосование от CSRF?
    options:
      - text: 'Поставить cookie `SameSite=Strict`'
        why: 'Тогда браузер не приложит cookie и к запросам из рамки на сайте партнёра, и виджет перестанет узнавать участников.'
      - text: 'Принимать голос только с токеном, которого нет у чужих сайтов'
        correct: true
        why: 'Токен, который виджет получает внутри своей рамки и прикладывает к запросу, чужой сайт не знает и подделать не может. Дополнительно сервер проверяет заголовок Origin.'
      - text: 'Отправлять голос запросом GET вместо POST'
        why: 'Это хуже: изменение через GET отправит любая ссылка или картинка на чужом сайте. Изменения никогда не делают через GET.'
      - text: 'Сделать cookie `HttpOnly`, чтобы её не прочитал чужой скрипт'
        why: 'HttpOnly защищает cookie от чтения скриптом, но для CSRF её не нужно читать: браузер сам приложит её к запросу.'
    explanation: |
      CSRF возможен, потому что браузер сам прикладывает cookie к запросу с чужого сайта. `SameSite` отсекает такие запросы,
      но встроенному виджету приходится ставить `SameSite=None`. Тогда защита — секрет, который чужой сайт не знает:
      CSRF-токен в теле или заголовке запроса, плюс проверка `Origin` на сервере. `HttpOnly` от CSRF не защищает.
      Учтите, что Safari такие cookie в чужой рамке обычно не отправляет вовсе, а Firefox хранит их отдельно для каждого
      сайта, поэтому встраиваемым виджетам часто нужен вход без cookie.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Set-Cookie#samesitesamesite-value

  - id: sdr-security-005
    topic: Сквозные требования
    subtopic: Границы безопасности
    level: middle
    question: |
      Почтовый клиент написан на React 18. У контакта есть поле «Сайт», и его выводят ссылкой:
      `<a href={contact.website}>`. React экранирует текст, поэтому команда считает, что поле безопасно. Контакт может
      прислать в поле что угодно. Что исправить?
    options:
      - text: 'Ничего: React экранирует значения атрибутов'
        why: 'Экранирование не мешает адресу javascript: остаться рабочим адресом. Ссылка с ним выполнит код при нажатии.'
      - text: 'Разрешать в ссылке только схемы http и https'
        correct: true
        why: 'Опасна сама схема адреса: javascript: выполняет код. Белый список схем отсекает её и другие опасные варианты; он нужен и в React 19, который блокирует только javascript:.'
      - text: 'Удалять из поля угловые скобки и кавычки'
        why: 'Для javascript:alert(1) не нужны ни скобки, ни кавычки. Чистка символов не трогает опасную схему.'
      - text: 'Выводить ссылку через `dangerouslySetInnerHTML`'
        why: 'Это снимает даже экранирование, и опасных вариантов станет больше.'
    explanation: |
      Экранирование защищает от тегов в тексте, но адрес в `href` — особое место: ссылка `javascript:` выполняет код
      при нажатии. Новые версии React такие адреса предупреждают или блокируют, но адреса из чужих данных всё равно
      фильтруют сами: разрешают только `http:` и `https:` (для почты ещё `mailto:`).
    links:
      - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html

  - id: sdr-a11y-001
    topic: Сквозные требования
    subtopic: Доступность как часть архитектуры
    level: junior
    question: |
      На сайте бронирования жилья человек меняет фильтр, и над списком без перезагрузки меняется строка «Найдено
      34 варианта». Незрячий пользователь с экранным чтецом об этом не узнаёт: фокус остаётся на фильтре. Как сделать,
      чтобы чтец объявил новое число, не перенося фокус?
    options:
      - text: 'Перенести фокус на строку с числом после каждого изменения'
        why: 'Чтец прочитает число, но человек потеряет место в фильтре и будет каждый раз возвращаться к нему. Объявить можно без переноса фокуса.'
      - text: 'Сделать строку живой областью: `role="status"`'
        correct: true
        why: 'Изменения в живой области чтец объявляет сам, не трогая фокус. role="status" объявляет вежливо, дождавшись конца текущей фразы.'
      - text: 'Добавить строке атрибут `aria-label` с тем же текстом'
        why: 'aria-label задаёт имя элемента, которое чтец прочитает, когда дойдёт до него. Сам по себе он не заставляет объявлять изменения.'
      - text: 'Выделить число жирным и крупным шрифтом'
        why: 'Это поможет зрячим, но чтец не видит оформления. Ему нужно знать, что область живая.'
    explanation: |
      Экранный чтец читает то, на чём стоит фокус, и не замечает изменений в других местах. Живая область (`aria-live`,
      `role="status"`, `role="alert"`) говорит чтецу объявлять изменения в ней самостоятельно. Для числа найденных
      вариантов подходит вежливое объявление; срочное (`assertive`, `role="alert"`) оставляют для ошибок и предупреждений.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Guides/Live_regions

  - id: sdr-a11y-002
    topic: Сквозные требования
    subtopic: Доступность как часть архитектуры
    level: middle
    question: |
      На сайте бронирования после отправки брони появляется сообщение о результате. Компонент написан так: пока ответа
      нет, он ничего не рисует, а когда ответ пришёл, рисует `<p role="status">Номер забронирован</p>`. Тестировщик
      с NVDA говорит, что объявление иногда не звучит вовсе. Почему?
    options:
      - text: 'Область появляется вместе с текстом, и чтец её пропускает'
        correct: true
        why: 'Чтец объявляет изменения внутри уже известной ему области. Если область появляется сразу с текстом, многие чтецы её пропускают. Область рисуют заранее, пустой, и меняют только текст.'
      - text: 'Для результата брони нужен `role="alert"`, а не `status`'
        why: 'Срочность здесь не главное: с alert та же проблема, если он появляется вместе с текстом. Успешную бронь вполне можно объявить вежливо.'
      - text: 'NVDA не поддерживает `role="status"`'
        why: 'NVDA поддерживает живые области. Дело в том, как компонент их создаёт.'
      - text: 'Объявление теряется, потому что фокус остаётся на кнопке'
        why: 'Живые области как раз и нужны, чтобы объявлять без переноса фокуса. Фокус на кнопке объявлению не мешает.'
    explanation: |
      Живая область должна быть на странице до того, как в ней изменится текст: чтец следит за изменениями в уже
      известной ему области. Компонент, который появляется вместе с сообщением, многие чтецы пропускают. Надёжная
      схема — общая область в оболочке приложения, которая есть всегда, и меняется только её текст.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Guides/Live_regions

  - id: sdr-a11y-003
    topic: Сквозные требования
    subtopic: Доступность как часть архитектуры
    level: middle
    question: |
      Новостной сайт — одностраничное приложение, и это решение команда менять не хочет. Человек с экранным чтецом
      нажимает на заголовок статьи и ничего не слышит, а следующее нажатие Tab ведёт по старой шапке, хотя на экране
      уже статья. Что должно делать приложение при смене маршрута?
    options:
      - text: 'Сделать живой областью весь блок основного содержимого'
        why: 'Чтец начнёт зачитывать всю новую статью при каждом изменении, а фокус всё равно останется на старом месте.'
      - text: 'Перезагружать страницу целиком при каждом переходе'
        why: 'Чтец объявил бы новую страницу, но это отказ от одностраничного приложения, а условие его сохраняет.'
      - text: 'Менять `document.title` и переносить фокус на заголовок'
        correct: true
        why: 'Это то, что браузер сделал бы при загрузке новой страницы: чтец прочитает заголовок, а Tab пойдёт по статье. Делают это один раз в маршрутизаторе для всех переходов.'
      - text: 'Добавить ссылке на статью `aria-label` «Открыть статью»'
        why: 'Подпись ссылки поможет понять, куда она ведёт, но после перехода человек всё равно ничего не услышит, и фокус останется на прежнем месте.'
    explanation: |
      В одностраничном приложении браузер не загружает новую страницу, поэтому чтец не объявляет переход, а фокус
      остаётся на исчезнувшей ссылке или улетает в начало. Приложение само меняет заголовок вкладки и переносит фокус
      на главный заголовок новой страницы. Решение принимают на уровне маршрутизатора или оболочки, чтобы оно работало
      для всех переходов.
    links:
      - https://www.w3.org/WAI/ARIA/apg/

  - id: sdr-a11y-004
    topic: Сквозные требования
    subtopic: Доступность как часть архитектуры
    level: senior
    question: |
      Онлайн-банк выбирает библиотеку компонентов для нового кабинета. Требование закона — кабинет должен быть доступен
      с клавиатуры и экранного чтеца. Библиотека A красива и готова к работе, но её выпадающие списки и окна не работают
      с клавиатуры. Библиотека B — «безголовая»: поведение, фокус и роли по шаблонам WAI-ARIA, а внешний вид команда
      делает сама. Срок плотный. Что выбрать?
    options:
      - text: 'Библиотеку A, а доступность доделать после запуска'
        why: 'Поведение фокуса в выпадающих списках зашито в библиотеку. Доделывать его потом — править сотни мест или менять библиотеку, а закон требует доступности уже при запуске.'
      - text: 'Библиотеку A и самим добавить нужные aria-атрибуты'
        why: 'Атрибуты сообщают чтецу роль и состояние, но не добавляют поведение: стрелки, Escape, фокус по кругу. Их всё равно придётся писать заново.'
      - text: 'Библиотеку B, вложив время в собственный внешний вид'
        correct: true
        why: 'Самая трудная и дорогая часть — поведение по шаблонам WAI-ARIA — уже готова и проверена. Внешний вид команда сделает сама, и это предсказуемая работа.'
      - text: 'Написать свои компоненты с нуля под требования'
        why: 'Правильное поведение выпадающих списков и окон — большая работа с массой тонкостей. При плотном сроке это рискованнее, чем взять готовое поведение.'
    explanation: |
      Доступность — критерий выбора архитектурных кирпичей, а не доделка. Поведение клавиатуры и фокуса зашито
      в библиотеку компонентов, и исправлять его потом дорого. «Безголовые» библиотеки вроде React Aria или Radix
      реализуют поведение и роли по шаблонам WAI-ARIA Authoring Practices и оставляют внешний вид команде.
    links:
      - https://www.w3.org/WAI/ARIA/apg/

  - id: sdr-a11y-005
    topic: Сквозные требования
    subtopic: Доступность как часть архитектуры
    level: middle
    question: |
      Лента новостей догружается сама, когда пользователь приближается к концу. Люди, которые пользуются только
      клавиатурой, жалуются: до подвала с контактами и настройками не добраться — каждый раз, когда фокус подходит
      к концу ленты, приходят новые новости. Что изменить?
    options:
      - text: 'Догружать новости большими порциями, по 100 штук'
        why: 'Конец ленты станет дальше, но всё равно будет отодвигаться при каждом приближении. Подвал по-прежнему недостижим.'
      - text: 'Заменить автодогрузку кнопкой «Показать ещё»'
        correct: true
        why: 'Человек сам решает, грузить ли дальше, и подвал остаётся доступным. Фокус на первой новой новости позволяет продолжить чтение с того же места.'
      - text: 'Объявлять через живую область «Загружено ещё 20 новостей»'
        why: 'Объявление полезно, но не решает главного: подвал всё равно уезжает при каждой догрузке.'
      - text: 'Убрать новости из порядка обхода по Tab'
        why: 'Тогда клавиатурой нельзя будет открыть ни одну новость, а это основная функция ленты.'
    explanation: |
      Бесконечная прокрутка прячет подвал от клавиатуры: конец ленты отодвигается при каждом приближении. Кнопка
      «Показать ещё» отдаёт решение человеку и оставляет подвал доступным. Вместе с ней фокус ставят на первый новый
      элемент, а через живую область объявляют, сколько загрузилось.
    links:
      - https://www.w3.org/WAI/ARIA/apg/patterns/feed/

  - id: sdr-observability-001
    topic: Сквозные требования
    subtopic: Наблюдаемость
    level: junior
    question: |
      Аналитика видеосервиса показывает: после выкатки на 15 % меньше людей запускают видео со страницы фильма.
      Логи сервера чистые — запросов на запуск просто стало меньше. Других данных с клиента команда не собирает.
      Чего не хватает, чтобы понять причину?
    options:
      - text: 'Ещё более подробной воронки продуктовых событий'
        why: 'Воронка уже показала, что люди отваливаются на запуске. Она говорит «где», но не «почему».'
      - text: 'Сбора ошибок JavaScript из браузеров'
        correct: true
        why: 'Если кнопка падает с ошибкой до отправки запроса, сервер ничего не видит. Ошибки из браузеров со стеком и версией покажут, что сломалось и у кого.'
      - text: 'Более подробных логов на сервере'
        why: 'Запрос на запуск до сервера не доходит, поэтому никакая подробность серверных логов его не покажет.'
      - text: 'Замеров LCP и CLS у реальных пользователей'
        why: 'Эти метрики говорят о скорости и сдвигах при загрузке. Если кнопка ломается быстро, они ничего не покажут.'
    explanation: |
      С клиента идут разные потоки данных, и каждый отвечает на свой вопрос. Воронка показывает, где люди отваливаются,
      скорость — где медленно, сеть — что не так между клиентом и сервером, а ошибки JavaScript — что сломалось в коде.
      Ошибки, из-за которых запрос не ушёл, сервер не видит вовсе, поэтому их собирают в браузере.
    links:
      - https://opentelemetry.io/docs/languages/js/getting-started/browser/

  - id: sdr-observability-002
    topic: Сквозные требования
    subtopic: Наблюдаемость
    level: middle
    question: |
      Форум начал собирать ошибки из браузеров, но стек выглядит так: `TypeError: a.b is not a function at t
      (main.3f9a2c.js:1:48211)`. Понять по нему, где ошибка в исходном коде, нельзя. Публиковать исходный код
      сайта владельцы форума не хотят. Что сделать?
    options:
      - text: 'Отключить сжатие кода в сборке для промышленной версии'
        why: 'Стек станет читаемым, но сайт потяжелеет для всех, а исходный код окажется в открытом доступе — этого владельцы и не хотят.'
      - text: 'Загружать карты исходников в сервис ошибок, а не на сайт'
        correct: true
        why: 'Карты исходников сопоставляют сжатый код с исходным. Если их загружает только сборка в сервис сбора ошибок, стеки расшифровываются там, а посторонние карт не видят.'
      - text: 'Логировать в каждой функции её название перед вызовом'
        why: 'Это тонны шума и лишнего кода, и всё равно не даст точного места ошибки. Задачу решают карты исходников.'
      - text: 'Просить пользователей присылать скриншоты консоли'
        why: 'В консоли тот же сжатый стек, а большинство людей не знает, где консоль. Это не способ разбирать ошибки.'
    explanation: |
      Код в браузере сжат, и стек ошибки указывает на строки сжатого файла. Карты исходников (source maps) сопоставляют
      его с исходным кодом. Их загружают в сервис сбора ошибок при сборке и не выкладывают вместе с сайтом, чтобы
      исходный код не был публичным.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/Source_map

  - id: sdr-observability-003
    topic: Сквозные требования
    subtopic: Наблюдаемость
    level: middle
    question: |
      Встраиваемый виджет оплаты отправляет события в аналитику вместе с адресом страницы, на которой он стоит. Сайты
      партнёров иногда кладут в адрес почту покупателя и токен входа: `?email=…&token=…`. Аналитика хранится два года
      и доступна подрядчику. Что сделать с адресами?
    options:
      - text: 'Чистить адрес в виджете до отправки, по белому списку'
        correct: true
        why: 'Почта и токен не покидают устройство вовсе. Белый список разрешённых параметров защищает и от тех, о которых пока никто не знает.'
      - text: 'Удалять почту и токены из записей на сервере аналитики'
        why: 'К этому моменту данные уже ушли с устройства, прошли через сеть и, возможно, попали в промежуточные журналы. Чистить нужно до отправки.'
      - text: 'Шифровать адрес целиком перед отправкой в аналитику'
        why: 'Почта и токен всё равно хранятся два года и расшифровываются для отчётов. Их не нужно хранить вовсе.'
      - text: 'Ограничить доступ подрядчика к отчётам аналитики'
        why: 'Данные всё равно будут храниться годами, и любой доступ к ним — риск. Правильнее, чтобы они туда не попадали.'
    explanation: |
      Логи и аналитика — долгоживущие копии, доступные многим. Всё, что туда попало, считайте утёкшим. Личные данные
      и секреты не отправляют: адрес страницы и тексты ошибок чистят на клиенте до отправки, причём разрешённые поля
      задают белым списком, а не перечисляют запрещённые.
    links:
      - https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html

  - id: sdr-observability-004
    topic: Сквозные требования
    subtopic: Наблюдаемость
    level: senior
    question: |
      В онлайн-банке перевод проходит через три сервиса: API, сервис платежей и антифрод. Пользователь пишет, что перевод
      упал с ошибкой. Ошибка из браузера в сервисе ошибок есть, но найти записи этого перевода в логах трёх сервисов
      не удаётся. API работает на другом домене, чем сайт. Как связать ошибку в браузере с логами всех сервисов?
    options:
      - text: 'Искать записи в логах сервисов по времени ошибки в браузере'
        why: 'Каждую секунду в логах сотни переводов, а часы устройства и серверов расходятся. Время не связывает записи однозначно.'
      - text: 'Слать `traceparent`, разрешив его в CORS на сервере API'
        correct: true
        why: 'Сквозной номер по стандарту Trace Context продолжает каждый сервис, и все записи одного перевода находятся по нему. API на другом домене должен разрешить этот заголовок, иначе браузер не отправит запрос.'
      - text: 'Слать заголовок `traceparent`, ничего не меняя на сервере API'
        why: 'Это нестандартный заголовок в запросе на другой домен. Если сервер не разрешил его в Access-Control-Allow-Headers, браузер не отправит запрос вовсе.'
      - text: 'Записывать в логи номер пользователя и искать по нему'
        why: 'У пользователя за день может быть много действий, и номер не говорит, какие записи относятся к этому переводу.'
    explanation: |
      Сквозной номер трассы связывает все записи одного действия. Стандарт W3C Trace Context передаёт его в заголовке
      `traceparent`, а сервисы продолжают ту же трассу; библиотеки OpenTelemetry делают это готовыми средствами.
      Для API на другом домене заголовок нужно разрешить в CORS. Для людей рядом удобно хранить идентификатор операции
      и показывать его как код для поддержки.
    links:
      - https://www.w3.org/TR/trace-context/

  - id: sdr-observability-005
    topic: Сквозные требования
    subtopic: Наблюдаемость
    level: middle
    question: |
      Видеосервис собирает с каждой сессии замеры скорости и все ошибки JavaScript. Сессий миллионы в день, и счёт
      за сервис сбора данных вырос втрое. Замеры нужны для статистики по 75-му процентилю, а ошибки бывают редкие —
      одна на десятки тысяч сессий у отдельных устройств. Как сократить объём?
    options:
      - text: 'Собирать и замеры, и ошибки с 10 % сессий'
        why: 'Редкие ошибки отдельных устройств начнут теряться: из десяти случаев девять не попадут в данные, а их как раз и нужно найти.'
      - text: 'Собирать замеры с части сессий, а ошибки — со всех'
        correct: true
        why: 'Для процентилей по миллионам сессий выборки хватает. Ошибки собирают все, потому что редкая ошибка в редкой ситуации и есть то, что ищут.'
      - text: 'Отказаться от замеров скорости, оставив только ошибки'
        why: 'Тогда команда не узнает, медленно ли работает сервис у людей, а замеры нужны для статистики.'
      - text: 'Собирать только ошибки, повторившиеся больше 100 раз'
        why: 'Чтобы посчитать повторы, их всё равно нужно собрать. И редкая, но важная ошибка не попадёт в данные вовсе.'
    explanation: |
      Выборка (sampling) сокращает объём данных: для статистики скорости и воронки хватает части сессий. Ошибки обычно
      собирают все, потому что важны и редкие: одна на десятки тысяч сессий может означать, что у всех владельцев
      определённого устройства сервис не работает.
    links:
      - https://opentelemetry.io/docs/languages/js/getting-started/browser/

  - id: sdr-rollout-001
    topic: Сквозные требования
    subtopic: Тестируемость и выкатка
    level: junior
    question: |
      На главной маркетплейса есть блок персональных рекомендаций. Он тяжёлый для сервера, и в распродажи сервер
      рекомендаций иногда не выдерживает. Команде нужна возможность за секунды выключить блок для всех, не выкатывая
      новую версию. Как называется такой флаг?
    options:
      - text: 'Флаг эксперимента (experiment toggle)'
        why: 'Флаг эксперимента делит людей на группы для A/B-теста. Здесь нужно выключить функцию для всех при аварии.'
      - text: 'Рубильник (kill switch)'
        correct: true
        why: 'Рубильник — флаг для эксплуатации: он быстро выключает тяжёлую или рискованную функцию при аварии без новой выкатки.'
      - text: 'Флаг выпуска (release toggle)'
        why: 'Флаг выпуска прячет новое, пока его не выпустили всем, и удаляется после выкатки. Блок рекомендаций давно выпущен.'
      - text: 'Флаг прав (permission toggle)'
        why: 'Флаг прав включает функцию для части людей, например сотрудникам. Здесь нужно выключить её для всех.'
    explanation: |
      Флаги функций различают по назначению: флаг выпуска прячет новое, флаг эксперимента делит людей на группы, флаг
      прав открывает функцию части людей, а рубильник (ops toggle, kill switch) быстро выключает функцию при аварии.
      Рубильник для тяжёлых и рискованных частей закладывают заранее, вместе со старым или упрощённым путём.
    links:
      - https://martinfowler.com/articles/feature-toggles.html

  - id: sdr-rollout-002
    topic: Сквозные требования
    subtopic: Тестируемость и выкатка
    level: middle
    question: |
      Маркетплейс выкатывает новую карточку товара на 10 % покупателей. Флаг вычисляется в браузере так: при каждом
      открытии страницы `Math.random() < 0.1`. Покупатели жалуются: карточка выглядит то по-новому, то по-старому,
      а кнопка «В корзину» каждый раз в другом месте. Как исправить?
    options:
      - text: 'Относить к группе по хэшу номера человека на сервере'
        correct: true
        why: 'Тогда один и тот же человек всегда попадает в одну группу, а доля выкатки остаётся 10 %. Сервер знает пользователя и правила и отдаёт клиенту готовое значение.'
      - text: 'Запоминать результат `Math.random()` в sessionStorage'
        why: 'В новой вкладке и при следующем визите значение снова будет случайным. Человек всё равно будет видеть то одно, то другое.'
      - text: 'Включить новую карточку сразу всем, чтобы не было разницы'
        why: 'Разница исчезнет, но вместе с ней и постепенная выкатка: ошибка новой карточки сразу дойдёт до всех.'
      - text: 'Вычислять флаг раз в сутки для всех покупателей одновременно'
        why: 'Тогда выкатка будет не на 10 % людей, а на весь сайт в какие-то дни. Задача — постоянная доля людей.'
    explanation: |
      Для постепенной выкатки человека относят к группе устойчиво — например, по хэшу его номера, — а не случайно при
      каждом открытии. Иначе у одного человека функция то появляется, то пропадает. Обычно флаг вычисляет сервер: он
      знает пользователя и правила выкатки и не раскрывает их клиенту.
    links:
      - https://martinfowler.com/articles/feature-toggles.html

  - id: sdr-rollout-003
    topic: Сквозные требования
    subtopic: Тестируемость и выкатка
    level: middle
    question: |
      Платформой онлайн-обучения занимаются две команды: клиента и API. Дважды за месяц команда API переименовывала поля
      ответа, а клиент об этом узнавал от учеников, когда экран урока ломался. Сквозные тесты гоняются раз в сутки
      на общем стенде и часто падают по другим причинам. Как ловить такие поломки до выкатки API?
    options:
      - text: 'Добавить больше сквозных тестов на экраны уроков'
        why: 'Сквозные тесты медленные, хрупкие и гоняются раз в сутки. Они поймают поломку поздно и вперемешку с другими падениями.'
      - text: 'Контрактные тесты, которые проверяет сборка API'
        correct: true
        why: 'Сборка API падает сразу, если ответ перестал соответствовать ожиданиям клиента, — ещё до выкатки. Это и есть контракты со стороны потребителя, например Pact.'
      - text: 'Больше модульных тестов на компоненты экрана урока'
        why: 'Модульные тесты клиента работают с поддельными данными и не знают, что настоящий API поменял поле.'
      - text: 'Попросить команду API заранее писать в чат о переименованиях'
        why: 'Договорённость в чате забывается. Контракт, который проверяется в сборке, не забывается.'
    explanation: |
      Контрактные тесты проверяют, что клиент и сервер одинаково понимают API. В подходе контрактов со стороны
      потребителя клиент записывает, какие запросы шлёт и какие поля читает, а сервер в своей сборке проверяет, что его
      ответы этому соответствуют. Поломка видна в сборке API до выкатки, а не у учеников.
    links:
      - https://docs.pact.io/

  - id: sdr-rollout-004
    topic: Сквозные требования
    subtopic: Тестируемость и выкатка
    level: senior
    question: |
      Онлайн-банк переписал форму перевода. Главный риск — ошибки в платёжном модуле на устройствах, которых нет
      на тестовом стенде. Вкладки у клиентов живут днями, а сборка и выкатка занимают 40 минут. Если с новой формой
      что-то пойдёт не так, ущерб должен коснуться как можно меньшего числа людей и прекратиться за минуты. Как выпускать?
    options:
      - text: 'Выкатить всем и при проблемах выкатить прежнюю версию'
        why: 'Откат займёт 40 минут, а открытые вкладки с новой версией продолжат работать с ней до перезагрузки. Ущерб коснётся всех.'
      - text: 'Сначала покрыть форму сквозными тестами на всех сценариях'
        why: 'Сквозные тесты работают на стенде, а риск — на устройствах, которых там нет. Они его не поймают.'
      - text: 'За флагом, шагами от 5 %, с откатом флагом'
        correct: true
        why: 'Ошибка затронет только первую маленькую группу, её покажут сторожевые метрики, а выключение флага займёт секунды и дойдёт до открытых вкладок при следующем перечитывании флагов.'
      - text: 'Выкатить ночью, когда переводов меньше всего'
        why: 'Пострадает меньше людей за первый час, но потом новая форма всё равно у всех, а откат по-прежнему занимает 40 минут.'
    explanation: |
      Риск, который проявляется только в чужом окружении, не ловит ни один тест на стенде. Защита — постепенная
      выкатка: флаг, маленькие шаги, сторожевые метрики и заранее записанное условие остановки. Откат флагом быстрее
      отката кода и доходит до уже открытых вкладок, которые иначе продолжали бы работать с новой версией.
    links:
      - https://martinfowler.com/articles/feature-toggles.html

  - id: sdr-rollout-005
    topic: Сквозные требования
    subtopic: Тестируемость и выкатка
    level: junior
    question: |
      В онлайн-школе поменяли формулу подсчёта баллов за тест: учитываются частичные ответы, штрафы за подсказки
      и бонус за время. Формула — отдельная чистая функция без сети и интерфейса, а вариантов сочетаний десятки.
      Какие тесты дадут больше всего уверенности за разумную цену?
    options:
      - text: 'Сквозной тест на каждое сочетание в настоящем браузере'
        why: 'Десятки медленных хрупких тестов ради проверки вычисления, которому не нужны ни браузер, ни сеть.'
      - text: 'Модульные тесты функции на все важные сочетания'
        correct: true
        why: 'Риск — в правилах вычисления, а функция чистая. Модульные тесты проверят все сочетания за доли секунды.'
      - text: 'Контрактные тесты между клиентом и API'
        why: 'Контракт API не менялся: изменилась формула внутри функции.'
      - text: 'Ручную проверку тестировщиком перед выпуском'
        why: 'Десятки сочетаний вручную — долго и ненадёжно, а при следующем изменении проверку придётся повторить.'
    explanation: |
      Тесты выбирают по риску: что может сломаться и какой самый дешёвый тест это поймает. Ошибки в правилах
      и вычислениях лучше всего ловят модульные тесты: они быстрые и проверяют много сочетаний. Сквозные тесты
      оставляют на главные пути через стыки системы.
    links:
      - https://martinfowler.com/articles/practical-test-pyramid.html

  - id: sdr-i18n-001
    topic: Сквозные требования
    subtopic: Локализация
    level: junior
    question: |
      На сайте бронирования туров под кнопкой написано «Осталось 3 места», а в коде это
      `'Осталось ' + n + ' мест'`. Сайт переводят на английский и немецкий. Как устроить эту строку?
    options:
      - text: 'Перевести отдельно «Осталось» и «мест» и склеивать с числом'
        why: 'Порядок слов и формы в другом языке иные. Переводчик, который видит только кусочки, не сможет собрать правильную фразу.'
      - text: 'Фраза целиком по ключу, с формами числа для языков'
        correct: true
        why: 'Переводчик видит фразу целиком и пишет нужные формы множественного числа, а библиотека выбирает форму через Intl.PluralRules.'
      - text: 'Условие: при n === 1 одно слово, иначе другое'
        why: 'Уже по-русски форм три: 1 место, 3 места, 5 мест. В других языках форм бывает до шести.'
      - text: 'Писать число цифрами без слова: «Осталось: 3»'
        why: 'Это обходит проблему только для одной строки и ухудшает текст. Правильный способ работает для любой фразы с числом.'
    explanation: |
      Тексты выносят в файлы переводов по ключам, и переводится фраза целиком с местами для подстановки — так работает
      ICU MessageFormat. Формы множественного числа для каждого языка пишет переводчик, а выбирает нужную `Intl.PluralRules`:
      по-русски категории `one`, `few`, `many`, `other`, по-английски — `one` и `other`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl/PluralRules

  - id: sdr-i18n-002
    topic: Сквозные требования
    subtopic: Локализация
    level: middle
    question: |
      Сайт бронирования отелей работает на русском, английском и немецком. Цена номера приходит из API в мелких
      единицах с кодом валюты отеля, а показывается так: `price / 100 + ' €'`. Теперь появились отели в Великобритании
      с ценами в фунтах, а немецкие пользователи жалуются, что «1234.5 €» записано не по-немецки. Как показывать цену?
    options:
      - text: 'Заменить знак евро на знак валюты по языку интерфейса'
        why: 'Валюта зависит от отеля, а не от языка: немец, бронирующий отель в Лондоне, платит фунтами.'
      - text: '`Intl.NumberFormat`: язык интерфейса, валюта из API'
        correct: true
        why: 'Валюта берётся из данных отеля, а разделители, знак и его место — по языку интерфейса. Intl знает правила записи для каждого языка.'
      - text: 'Хранить в API готовую строку цены для каждого языка'
        why: 'API придётся знать все языки интерфейса, а клиент не сможет посчитать сумму из готовых строк. Форматирование — дело показа.'
      - text: 'Свой словарь разделителей и знаков валют для трёх языков'
        why: 'Правила уже есть в браузере, а свой словарь придётся поддерживать для каждого нового языка и валюты.'
    explanation: |
      Деньги хранят целым числом в мелких единицах с кодом валюты и форматируют только при показе. `Intl.NumberFormat`
      принимает язык и валюту по отдельности: язык — из настроек интерфейса, валюту — из данных. Он знает разделители
      разрядов и дробной части, вид и место знака валюты.
    links:
      - https://developer.mozilla.org/ru/docs/Web/JavaScript/Reference/Global_Objects/Intl

  - id: sdr-i18n-003
    topic: Сквозные требования
    subtopic: Локализация
    level: middle
    question: |
      В календаре встреча хранится как строка `2026-11-03T10:00` без часового пояса. Её создал организатор в Москве,
      а участник в Лондоне видит «10:00» и приходит на три часа позже. Как хранить и показывать время встречи?
    options:
      - text: 'Хранить как есть и подписывать «по Москве»'
        why: 'Подпись поможет человеку пересчитать, но он должен делать это сам, а если организатор окажется в другом городе, подпись соврёт.'
      - text: 'Хранить момент с поясом, а показывать в поясе каждого участника'
        correct: true
        why: 'Момент с поясом или в UTC однозначен. Intl.DateTimeFormat с часовым поясом участника покажет каждому его местное время начала одной и той же встречи.'
      - text: 'Хранить время по часам устройства того, кто открывает встречу'
        why: 'У каждого устройства свои часы и пояс, и одна встреча будет храниться по-разному. Однозначного момента не будет.'
      - text: 'Хранить время в UTC и показывать всем в UTC'
        why: 'Хранить так правильно, но показывать всем UTC неудобно: каждому придётся пересчитывать в своё время.'
    explanation: |
      Время хранят как момент: в ISO 8601 с часовым поясом или в UTC. Показывают его в поясе, который нужен человеку
      в этом месте интерфейса. Для встречи это пояс каждого участника: одна и та же встреча у москвича в 10:00, у
      лондонца в 07:00. `Intl.DateTimeFormat` принимает часовой пояс параметром.
    links:
      - https://developer.mozilla.org/ru/docs/Web/JavaScript/Reference/Global_Objects/Intl

  - id: sdr-i18n-004
    topic: Сквозные требования
    subtopic: Локализация
    level: senior
    question: |
      Платформа онлайн-обучения выходит в Израиль, нужен иврит — он пишется справа налево. В стилях проекта тысячи
      мест с `margin-left`, `padding-right`, `left` и `text-align: left`. Английская и русская версии продолжают
      работать, и стили потом будут развиваться для всех языков сразу. Как подготовить вёрстку?
    options:
      - text: 'Сделать копию всех стилей для иврита с отражёнными свойствами'
        why: 'Каждое следующее изменение стилей придётся делать дважды, и копии разойдутся. Условие требует развивать стили для всех языков сразу.'
      - text: 'Логические свойства CSS и `dir="rtl"` для иврита'
        correct: true
        why: 'margin-inline-start и подобные означают «в начале строки» и сами отражаются при dir="rtl". Одна таблица стилей работает для обоих направлений.'
      - text: 'Отразить страницу целиком через `transform: scaleX(-1)`'
        why: 'Вместе с вёрсткой отразятся и буквы, и картинки, и цифры — читать станет невозможно.'
      - text: 'Только задать `dir="rtl"` на `<html>`, без изменения стилей'
        why: 'Направление текста и строчных элементов браузер развернёт, но физические отступы margin-left останутся слева, и вёрстка поедет.'
    explanation: |
      Для языков, которые пишутся справа налево, интерфейс отражается. Направление задают атрибутом `dir="rtl"`, а вместо
      физических свойств CSS используют логические: `margin-inline-start` вместо `margin-left`, `inset-inline-start`
      вместо `left`. Они отражаются сами, и одна таблица стилей служит обоим направлениям. Иконки со смыслом направления
      отражают отдельно.
    links:
      - https://www.w3.org/International/questions/qa-html-dir

  - id: sdr-i18n-005
    topic: Сквозные требования
    subtopic: Локализация
    level: middle
    question: |
      Сайт бронирования отелей показывает «Заезд с 14:00». Человек в Москве бронирует отель на Бали, где разница с Москвой
      пять часов. Сейчас время заезда переводится в пояс устройства, и человек видит «Заезд с 09:00». Какое время
      показывать?
    options:
      - text: 'В поясе устройства, чтобы человеку не пришлось пересчитывать'
        why: 'Заезд происходит в отеле по местным часам. Время «по Москве» ничего не говорит человеку, который будет на Бали.'
      - text: 'В поясе отеля с подписью, что это местное время'
        correct: true
        why: 'Заезд — событие в месте отеля, и его часы определяет отель. Подпись нужна, потому что пояс отличается от пояса устройства.'
      - text: 'В UTC, чтобы время было однозначным'
        why: 'Показывать человеку UTC бесполезно: ему всё равно придётся пересчитывать. Да и местное время заезда хранят не в UTC, а как время суток плюс пояс отеля.'
      - text: 'Сразу в двух поясах без подписей'
        why: 'Два времени без подписей запутают сильнее, чем одно неправильное.'
    explanation: |
      Время заезда — не момент, а местное время отеля: его хранят как «14:00» плюс пояс отеля по имени. Показывают
      время в поясе, который важен в этом месте интерфейса: часы работы и заезд — по месту, где событие происходит.
      Если этот пояс отличается от пояса устройства, его подписывают: «с 14:00 по местному времени».
    links:
      - https://developer.mozilla.org/ru/docs/Web/JavaScript/Reference/Global_Objects/Intl
