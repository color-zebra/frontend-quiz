  # ===================== Redux =====================
  - id: redux-001
    topic: Redux
    level: middle
    multiple: true
    question: |
      В каком порядке проходят данные в Redux после клика пользователя?
    options:
      - text: 'dispatch(action) → reducer → новое состояние в store → перерисовка подписчиков'
        correct: true
        why: 'Компонент диспатчит действие, store передаёт его редьюсерам, они возвращают новое состояние, а `useSelector` перерисовывает тех, чья часть изменилась.'
      - text: 'reducer → dispatch(action) → store → перерисовка подписчиков'
        why: 'Редьюсер вызывается в ответ на действие, а не до него.'
      - text: 'dispatch(action) → компонент меняет store напрямую → reducer'
        why: 'Компонент не меняет store сам — только через действие и редьюсер.'
      - text: 'store → компонент → reducer → dispatch(action)'
        why: 'Действие — начало цепочки, а не её конец.'
    explanation: |
      Поток данных в Redux однонаправленный: UI → `dispatch(action)` → store → reducer(s) → новое состояние →
      компоненты, подписанные через `useSelector`, перерисовываются → UI обновлён. Redux Toolkit — официальный способ
      писать Redux: store, слайсы, действия, редьюсеры, async thunks.
    links:
      - https://redux.js.org/tutorials/fundamentals/part-2-concepts-data-flow

  - id: redux-002
    topic: Redux
    level: middle
    question: |
      Почему в редьюсере `createSlice` можно писать `state.items.push(item)`, хотя Redux требует иммутабельности?
    code: |
      const todosSlice = createSlice({
        name: 'todos',
        initialState: { items: [] },
        reducers: {
          added(state, action) {
            state.items.push(action.payload);
          },
        },
      });
    codeLang: js
    options:
      - text: 'RTK оборачивает редьюсер в Immer, и тот строит новый объект'
        correct: true
        why: '`state` в слайсе — черновик Immer. «Мутации» черновика превращаются в неизменяемое обновление с новыми ссылками.'
      - text: 'Redux Toolkit отключил требование иммутабельности'
        why: 'Требование осталось: store по-прежнему получает новый объект. Просто его строит Immer.'
      - text: '`push` в редьюсерах разрешён всегда, мутации не страшны'
        why: 'В обычном редьюсере без Immer такая мутация сломает обновление — ссылка не изменится.'
      - text: 'Это работает только в режиме разработки'
        why: 'Immer работает одинаково в разработке и в продакшене.'
    explanation: |
      `createSlice` генерирует action creators и типы действий из описания редьюсеров и подключает Immer. В обычном
      Redux редьюсер — чистая функция: `(state, action) => newState` без мутаций, запросов и случайностей.
    links:
      - https://redux-toolkit.js.org/usage/immer-reducers

  - id: redux-003
    topic: Redux
    level: middle
    question: |
      Компонент перерисовывается при любом изменении store, хотя данные, которые он читает, не менялись. В чём причина?
    code: |
      const { user, theme } = useSelector((state) => ({
        user: state.user,
        theme: state.ui.theme,
      }));
    codeLang: js
    options:
      - text: 'Селектор каждый раз возвращает новый объект'
        correct: true
        why: '`useSelector` сравнивает результат через `===`. Новый объектный литерал никогда не равен прошлому.'
      - text: '`useSelector` всегда перерисовывает при изменении store'
        why: 'Он перерисовывает, только если результат селектора изменился по ссылке.'
      - text: 'Нельзя читать два поля в одном компоненте'
        why: 'Можно — двумя вызовами `useSelector` или мемоизированным селектором.'
      - text: 'Не обёрнут в `React.memo`'
        why: '`memo` защищает от пропсов, а здесь рендер вызывает подписка на store.'
    explanation: |
      Решения: несколько `useSelector` по одному полю, `shallowEqual` вторым аргументом или мемоизированный селектор
      через `createSelector` (Reselect). Те же селекторы нужны для производных данных — отфильтрованных и
      отсортированных списков.
    links:
      - https://react-redux.js.org/api/hooks#equality-comparisons-and-updates

