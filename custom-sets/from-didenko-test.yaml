        why: '`Object.create` не вызывает конструктор — поэтому `constructor` не выведется.'
      - text: '`false`'
        why: '`instanceof` не проверяет, через `new` ли создан объект, — только цепочку прототипов.'
      - text: '`constructor`, `false`'
        why: 'Конструктор не вызывается, а прототип совпадает.'
    explanation: |
      `obj instanceof C` проверяет, есть ли `C.prototype` в цепочке `[[Prototype]]` объекта `obj`. Поэтому результат
      можно «обмануть» сменой прототипа, и он ложный для объектов из другого iframe.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/instanceof

  - id: js-029
    topic: JavaScript
    level: middle
    question: |
      Два объекта ссылаются друг на друга, но из корней (глобальный объект, стек) до них не добраться. Что сделает
      современный сборщик мусора?
    options:
      - text: 'Удалит оба'
        correct: true
        why: 'Mark-and-sweep помечает только достижимое от корней. Взаимные ссылки не делают объекты достижимыми.'
      - text: 'Оставит оба навсегда'
        why: 'Так было при подсчёте ссылок: цикл держал счётчики больше нуля. Современные сборщики так не работают.'
      - text: 'Удалит один, второй останется'
        why: 'Оба одинаково недостижимы и удаляются вместе.'
      - text: 'Удалит, только если вызвать `gc()` вручную'
        why: 'Сборщик запускается сам. Ручного вызова в браузере нет.'
    explanation: |
      Раньше сборщики подсчитывали ссылки и текли на циклах. Сейчас работает mark-and-sweep: от корней (глобальный
      объект, стек вызовов) обходятся все ссылки, живые объекты помечаются, остальные удаляются. V8 ещё уплотняет
      память и маркирует параллельно, чтобы не замораживать страницу.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Memory_management

  - id: js-030
    topic: JavaScript
    level: middle
    multiple: true
    question: |
      Зачем V8 делит кучу на молодое и старое поколения?
    options:
      - text: 'Большинство объектов умирают молодыми, их выгодно чистить часто и дёшево'
        correct: true
        why: 'Молодое поколение маленькое и очищается быстрым Scavenge. Объект, переживший две очистки, переезжает в старое, которое чистят реже.'
      - text: 'В молодом поколении хранятся примитивы, в старом — объекты'
        why: 'Разделение по возрасту объекта, а не по типу значения.'
      - text: 'Старое поколение никогда не очищается, это постоянная память'
        why: 'Очищается, но реже и тяжелее — Mark-Sweep-Compact.'
      - text: 'Каждое поколение принадлежит своему потоку'
        why: 'Поколения — это зоны одной кучи, а не потоки.'
    explanation: |
      Гипотеза поколений: большинство объектов живут недолго. New Space (небольшая область, единицы–десятки МБ) чистится часто алгоритмом
      Scavenge — живое копируется в другую половину, остальное выбрасывается. Old Space чистится реже: маркировка
      от корней, удаление немаркированного, уплотнение. Маркировка идёт инкрементально и в фоне, без долгой
      остановки JS.
    links:
      - https://v8.dev/blog/trash-talk

  - id: js-031
    topic: JavaScript
    level: middle
    question: |
      Что из этого может привести к утечке памяти на фронтенде?
    options:
      - text: 'Не снятый `setInterval`, чей колбэк замыкает большой массив'
        correct: true
        why: 'Таймер держит колбэк, колбэк держит массив — после ухода со страницы всё остаётся в памяти.'
      - text: 'Обработчик на `window`, не снятый при размонтировании компонента'
        correct: true
        why: '`window` живёт всегда и через обработчик удерживает компонент.'
      - text: 'Ссылка в переменной на DOM-узел, удалённый со страницы'
        correct: true
        why: 'Detached DOM node — узел и его поддерево висят в памяти, пока есть ссылка.'
      - text: 'Объект, который лежит ключом в `WeakMap` и больше нигде не нужен'
        why: '`WeakMap` держит ключ слабо и не мешает сборщику его удалить.'
      - text: 'Локальная переменная завершённой функции без замыканий'
        why: 'После выхода из функции такая переменная недостижима и удаляется.'
    explanation: |
      Утечка — объект больше не нужен, но на него по ошибке осталась ссылка из корня. Типичные причины: глобальные
      переменные, забытые таймеры, не снятые обработчики, замыкания, отсоединённые DOM-узлы, растущие `Map` и `Set`.
      Лечат `clearInterval`, `removeEventListener` или `AbortSignal`, обнулением ссылок, `WeakMap`. Ищут во вкладке
      Memory: сравнение Heap Snapshot и Allocation Timeline.
    links:
      - https://developer.chrome.com/docs/devtools/memory-problems

  - id: js-032
    topic: JavaScript
    level: middle
    multiple: true
    question: |
      Чем `WeakMap` отличается от `Map`?
    options:
      - text: 'Ключи — только объекты, перебрать их нельзя, `size` нет'
        correct: true
        why: 'Ключ держится слабо: если на объект больше нет ссылок, запись исчезнет сама. Поэтому перебор и размер не имеют смысла.'
      - text: 'Ключи — только строки, перебор и `size` есть'
        why: 'Наоборот, примитивы в `WeakMap` ключами быть не могут.'
      - text: 'Хранит значения слабо, а ключи — сильно'
        why: 'Слабо держится ключ. Значение живёт, пока жив ключ.'
      - text: 'Работает быстрее, но не гарантирует порядок'
        why: 'Отличие в сборке мусора и API, а не в скорости.'
    explanation: |
      `Map` — ключи любого типа, полный набор методов, итерация, `size`, ключи удерживаются в памяти. `WeakMap` —
      только объекты (или незарегистрированные символы), только `set`, `get`, `has`, `delete`, без итерации. Подходит
      для кэшей и метаданных объектов. С `Set` и `WeakSet` — та же разница.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/WeakMap

  - id: js-033
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      const copy = JSON.parse(JSON.stringify({
        d: new Date(0),
        u: undefined,
        n: NaN,
      }));

      console.log(copy);
    codeLang: js
    options:
      - text: '`{ d: ''1970-01-01T00:00:00.000Z'', n: null }`'
        correct: true
        why: 'Дата превращается в строку, свойство с `undefined` выпадает, а `NaN` в JSON не бывает — становится `null`.'
      - text: '`{ d: Date, u: undefined, n: NaN }`'
        why: 'JSON не умеет хранить ни даты, ни `undefined`, ни `NaN`.'
      - text: '`{ d: ''1970-01-01T00:00:00.000Z'', u: null, n: null }`'
        why: 'Свойство с `undefined` пропускается целиком, `null` получится только у элементов массива.'
      - text: '`{ d: 0, n: NaN }`'
        why: 'Дата сериализуется через `toJSON` в ISO-строку, а не в число.'
    explanation: |
      Поверхностная копия — spread и `Object.assign`. Глубокая через `JSON.parse(JSON.stringify())` теряет функции,
      `undefined`, превращает `Date` в строку, ломается на циклических ссылках. `structuredClone()` копирует
      `Date`, `Map`, `Set`, циклы, но падает на функциях (`DataCloneError`).
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Window/structuredClone

  - id: js-034
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      const original = { a: 1, b: { c: 2 } };
      const copy = { ...original };

      copy.a = 10;
      copy.b.c = 20;

      console.log(original);
    codeLang: js
    options:
      - text: '`{ a: 1, b: { c: 20 } }`'
        correct: true
        why: 'Spread копирует только верхний уровень. `copy.b` и `original.b` — один и тот же объект.'
      - text: '`{ a: 1, b: { c: 2 } }`'
        why: 'Так было бы при глубоком копировании. Spread — поверхностное.'
      - text: '`{ a: 10, b: { c: 20 } }`'
        why: '`a` — примитив на верхнем уровне, у копии своя ячейка.'
      - text: '`{ a: 10, b: { c: 2 } }`'
        why: 'Наоборот: верхний уровень независим, а вложенный объект общий.'
    explanation: |
      Поверхностная копия создаёт новый объект с теми же значениями верхнего уровня. Вложенные объекты копируются
      ссылкой. Для глубокой копии — `structuredClone`, JSON-трюк с его ограничениями или своя рекурсивная функция.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/Shallow_copy

  - id: js-035
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      const a = { x: 1, y: 2 };
      const b = { y: 2, x: 1 };

      console.log(JSON.stringify(a) === JSON.stringify(b));
    codeLang: js
    options:
      - text: '`false`'
        correct: true
        why: 'Строки получаются `{"x":1,"y":2}` и `{"y":2,"x":1}` — порядок свойств разный.'
      - text: '`true`'
        why: 'Объекты одинаковые по смыслу, но JSON-строки сравниваются посимвольно, и порядок ключей важен.'
      - text: '`TypeError`'
        why: 'Обычные объекты сериализуются без ошибок.'
      - text: '`undefined`'
        why: 'Сравнение строк всегда даёт булево значение.'
    explanation: |
      Сравнение через `JSON.stringify` — простой способ, но порядок свойств имеет значение, функции, `undefined` и
      символы теряются, циклические ссылки ломают сериализацию. Надёжнее рекурсивный `deepEqual`: сравнить
      примитивы и ссылки, количество ключей, затем рекурсивно каждое значение.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/JSON/stringify

  - id: js-036
    topic: JavaScript
    level: middle
    question: |
      Что происходит с остальными промисами, когда один промис в `Promise.all` отклонился?
    options:
      - text: 'Они продолжают выполняться, но их результат уже никто не ждёт'
        correct: true
        why: '`Promise.all` сразу отклоняется с первой ошибкой. Отменить начатые операции промисы не умеют.'
      - text: 'Они отменяются, запросы обрываются'
        why: 'У промисов нет отмены — для fetch нужен свой `AbortController`.'
      - text: '`Promise.all` дожидается их всех и только потом отклоняется'
        why: 'Так ведёт себя `allSettled`, а `all` отклоняется сразу.'
      - text: '`Promise.all` выполняется с массивом, где на месте ошибки `undefined`'
        why: 'Одной ошибки достаточно, чтобы весь `Promise.all` отклонился.'
    explanation: |
      `Promise.all` выполнится, когда выполнятся все, или отклонится при первой ошибке. `allSettled` ждёт всех и
      отдаёт массив `{ status, value }` или `{ status, reason }`. `race` — результат первого завершившегося, успех
      или ошибка. `any` — первый успешный, а если все отклонены — `AggregateError` со всеми ошибками.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/all

  - id: js-037
    topic: JavaScript
    level: middle
    question: |
      Чем закончится `Promise.any`, если все переданные промисы отклонились?
    options:
      - text: 'Отклонится с `AggregateError` со всеми причинами'
        correct: true
        why: '`any` ищет первый успех. Когда успехов нет, он собирает все ошибки в одну.'
      - text: 'Отклонится с ошибкой первого отклонённого промиса'
        why: 'Так отклоняется `Promise.all`, а `any` ждёт, пока откажут все.'
      - text: 'Выполнится с `undefined`'
        why: 'Успешного значения нет — значит, будет отклонение.'
      - text: 'Выполнится с массивом причин всех отказов'
        why: 'Массив причин лежит в ошибке `AggregateError`, а сам промис отклоняется.'
    explanation: |
      `any` — «первый успешный», `race` — «первый завершившийся», `all` — «все успешные или первая ошибка»,
      `allSettled` — «все, с отчётом по каждому».
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/any

  - id: js-038
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      console.log('a.b.c'.replace('.', '-'));
      console.log('hello'.slice(-3));
      console.log('hello'.substring(-3));
    codeLang: js
    options:
      - text: '`a-b.c`, `llo`, `hello`'
        correct: true
        why: '`replace` со строкой меняет только первое вхождение. `slice` считает отрицательный индекс с конца, а `substring` превращает его в `0`.'
      - text: '`a-b-c`, `llo`, `llo`'
        why: 'Все вхождения меняет `replaceAll`. `substring` отрицательные индексы не понимает.'
      - text: '`a-b-c`, `llo`, `hello`'
        why: '`replace` со строкой (не с регуляркой `/g`) меняет только первое вхождение.'
      - text: '`a-b.c`, `hel`, `hello`'
        why: '`slice(-3)` — последние три символа, `llo`.'
    explanation: |
      Строки неизменяемы: методы, которые «меняют» строку, возвращают новую. `slice` понимает отрицательные индексы,
      `substring` — нет. `replace` меняет первое вхождение (все — с регуляркой `/g` или через `replaceAll`).
      `padStart` и `padEnd` дополняют строку до длины, `split` разбивает в массив и принимает лимит вторым
      аргументом. `substr` устарел.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String

  - id: js-039
    topic: JavaScript
    level: middle
    question: |
      Какие методы массива меняют исходный массив?
    options:
      - text: '`push`'
        correct: true
        why: 'Добавляет в конец и возвращает новую длину.'
      - text: '`sort`'
        correct: true
        why: 'Сортирует на месте. Без мутации — `toSorted`.'
      - text: '`reverse`'
        correct: true
        why: 'Разворачивает на месте. Без мутации — `toReversed`.'
      - text: '`splice`'
        correct: true
        why: 'Удаляет и вставляет элементы на месте.'
      - text: '`slice`'
        why: 'Возвращает новый массив-кусок, исходный не трогает.'
      - text: '`concat`'
        why: 'Соединяет массивы в новый.'
    explanation: |
      Мутируют: `push`, `pop`, `shift`, `unshift`, `sort`, `reverse`, `splice`, `fill`. Новый массив возвращают
      `slice`, `concat`, `map`, `filter`, `flat`, `toSorted`, `toReversed`, `toSpliced`, `with`. В React мутирующие
      методы над состоянием — частая причина багов.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array

  - id: js-040
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      console.log([1, 2].push(3));
      console.log([1, [2, [3, [4]]]].flat());
      console.log([1, 2].find((x) => x > 5), [1, 2].filter((x) => x > 5));
    codeLang: js
    options:
      - text: '`3`, `[1, 2, [3, [4]]]`, `undefined []`'
        correct: true
        why: '`push` возвращает новую длину. `flat()` по умолчанию разворачивает один уровень. `find` без находки — `undefined`, `filter` — пустой массив.'
      - text: '`[1, 2, 3]`, `[1, 2, 3, 4]`, `undefined []`'
        why: '`push` возвращает длину, а не массив. `flat()` без аргумента раскрывает только один уровень.'
      - text: '`3`, `[1, 2, 3, 4]`, `[] []`'
        why: 'Для полного разворота нужно `flat(Infinity)`. `find` без находки даёт `undefined`.'
      - text: '`3`, `[1, 2, [3, [4]]]`, `null []`'
        why: '`find` возвращает `undefined`, а не `null`.'
    explanation: |
      Частые ловушки массивов: `push` и `unshift` возвращают длину, `flat` по умолчанию на глубину 1, `find` и
      `findIndex` при неудаче дают `undefined` и `-1`, `filter` — пустой массив. `indexOf` не находит `NaN`, а
      `includes` находит.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/flat

  - id: js-041
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль (обычный скрипт, не strict mode)?
    code: |
      const person = { name: 'Lydia' };
      Object.defineProperty(person, 'age', { value: 21 });

      person.age = 30;
      console.log(Object.keys(person), person.age);
    codeLang: js
    options:
      - text: '`[''name''] 21`'
        correct: true
        why: '`defineProperty` по умолчанию ставит все флаги в `false`: свойство не перечисляется и не перезаписывается — запись молча проигнорирована.'
      - text: '`[''name'', ''age''] 30`'
        why: 'Флаги по умолчанию у `defineProperty` — `false`, в отличие от обычного присваивания.'
      - text: '`[''name'', ''age''] 21`'
        why: '`enumerable: false` прячет `age` из `Object.keys`.'
      - text: '`TypeError`'
        why: 'Ошибка будет только в strict mode. В обычном режиме запись в read-only молча теряется.'
    explanation: |
      У свойства кроме `value` есть флаги: `writable` — можно ли менять, `enumerable` — видно ли в переборе,
      `configurable` — можно ли удалить и менять флаги. При обычном присваивании все `true`, у `defineProperty` по
      умолчанию все `false`. Посмотреть — `Object.getOwnPropertyDescriptor`. Вместо `value` можно задать `get` и
      `set`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/defineProperty

  - id: js-042
    topic: JavaScript
    level: middle
    question: |
      Какие утверждения про `Object.freeze` и `Object.seal` верны?
    options:
      - text: '`seal` запрещает добавлять и удалять свойства, но разрешает их менять'
        correct: true
        why: 'Существующие свойства остаются `writable`.'
      - text: '`freeze` поверхностный: вложенный объект можно менять'
        correct: true
        why: 'Замораживается только сам объект. Для глубокой заморозки обходят дерево рекурсивно.'
      - text: '`freeze` запрещает и добавлять, и удалять, и менять свойства'
        correct: true
        why: 'Это `seal` плюс `writable: false` у всех свойств.'
      - text: '`seal` делает все свойства только для чтения, но разрешает удалять'
        why: '`seal` наоборот: значения менять можно, а удалять свойства нельзя. Только для чтения делает `freeze`.'
      - text: '`freeze` можно отменить вызовом `Object.unfreeze(obj)`'
        why: 'Такого метода нет — заморозка необратима.'
    explanation: |
      Методы `Object`: `keys`, `values`, `entries` — массивы ключей, значений и пар; `assign` — копирует свойства;
      `create` — объект с прототипом; `freeze` и `seal` — ограничения; `getPrototypeOf`; `defineProperty` —
      свойство с дескриптором; `getOwnPropertyNames` — все строковые ключи, включая неперечисляемые;
      `getOwnPropertySymbols` — символьные.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/freeze

  - id: js-043
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      class User {
        static create() {
          return new User();
        }
      }

      console.log(typeof new User().create, typeof User.create);
    codeLang: js
    options:
      - text: '`undefined function`'
        correct: true
        why: 'Статический метод лежит на самом классе, а не на прототипе — экземпляр его не видит.'
      - text: '`function function`'
        why: 'Экземпляр ищет свойства в `User.prototype`, а `static` кладёт метод в `User`.'
      - text: '`function undefined`'
        why: 'Наоборот: у класса метод есть, у экземпляра нет.'
      - text: '`TypeError`'
        why: '`typeof` от отсутствующего свойства не бросает ошибку, а даёт `''undefined''`.'
    explanation: |
      Статические поля и методы принадлежат классу, не требуют экземпляра и вызываются как `Class.method()`. Так
      делают фабрики, утилиты, счётчики экземпляров. Внутри статического метода `this` — сам класс.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Classes/static

  - id: js-044
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      const x = 'global';

      function show() {
        console.log(x);
      }

      function run() {
        const x = 'local';
        show();
      }

      run();
    codeLang: js
    options:
      - text: '`global`'
        correct: true
        why: '`show` объявлена на верхнем уровне, её внешнее окружение — глобальное. Место вызова роли не играет.'
      - text: '`local`'
        why: 'Так было бы при динамической области видимости. В JS она лексическая — по месту объявления.'
      - text: '`undefined`'
        why: '`x` найдена во внешнем окружении `show` — глобальном.'
      - text: '`ReferenceError`'
        why: 'Переменная доступна по цепочке областей видимости.'
    explanation: |
      Лексическое окружение — запись с переменными плюс ссылка на внешнее окружение. Ссылка задаётся там, где
      функция создана, а не где вызвана. Поиск переменной идёт по цепочке наружу, а если её нет нигде —
      `ReferenceError`. На этом же держится замыкание.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Closures

  - id: js-045
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      for (var i = 0; i < 3; i++) {
        setTimeout(() => console.log('var', i), 0);
      }

      for (let j = 0; j < 3; j++) {
        setTimeout(() => console.log('let', j), 0);
      }
    codeLang: js
    options:
      - text: '`var 3` ×3, потом `let 0`, `let 1`, `let 2`'
        correct: true
        why: '`var` — одна переменная на весь цикл, к моменту таймеров она уже 3. `let` создаёт новую привязку на каждой итерации.'
      - text: '`var 0`, `var 1`, `var 2`, потом `let 0`, `let 1`, `let 2`'
        why: 'Колбэки с `var` замыкают одну и ту же `i`, а не её значение на итерации.'
      - text: '`var 3` ×3, потом `let 3` ×3'
        why: 'У `let` в цикле своя `j` на каждую итерацию — замыкания видят 0, 1, 2.'
      - text: '`var 2` ×3, потом `let 0`, `let 1`, `let 2`'
        why: 'Цикл останавливается, когда `i` стала 3 — это значение и видят колбэки.'
    explanation: |
      Замыкание хранит ссылку на переменную, а не её копию. `var` имеет функциональную область видимости — в цикле
      она одна. `let` и `const` блочные, и цикл `for` с `let` создаёт новую переменную на каждой итерации.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let

  - id: js-046
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      Promise.resolve('foo')
        .then(Promise.resolve('bar'))
        .then((result) => console.log(result));
    codeLang: js
    options:
      - text: '`foo`'
        correct: true
        why: 'В `then` передан промис, а не функция. Не-функция заменяется функцией идентичности, и `''foo''` проваливается дальше.'
      - text: '`bar`'
        why: 'Чтобы получить `bar`, нужна функция: `.then(() => Promise.resolve(''bar''))`.'
      - text: 'Промис-объект'
        why: 'Переданный промис вообще не используется как обработчик.'
      - text: '`TypeError`'
        why: '`then` не бросает ошибку на не-функцию — молча игнорирует её.'
    explanation: |
      Проваливание промисов: если аргумент `then` не функция, он заменяется на `x => x` (для ошибок — на
      проброс). Частый баг — передать результат вызова, который оказался промисом, вместо самой функции. Всегда
      оборачивайте: `promise.then(() => doSomething())`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/then

  - id: js-047
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      const proto = { x: 1 };
      const obj = Object.create(proto);

      obj.x = 2;
      console.log(proto.x, obj.x, Object.getPrototypeOf(Object.prototype));
    codeLang: js
    options:
      - text: '`1 2 null`'
        correct: true
        why: 'Запись создаёт собственное свойство `obj`, прототип не меняется. Цепочка заканчивается на `null` после `Object.prototype`.'
      - text: '`2 2 null`'
        why: 'Присваивание не идёт в прототип — у `obj` появляется своё `x`, которое затеняет прототипное.'
      - text: '`1 2 Object.prototype`'
        why: 'У `Object.prototype` прототипа нет — `null`.'
      - text: '`1 1 null`'
        why: 'Своё `x` у `obj` теперь `2` — оно находится раньше, чем `x` прототипа.'
    explanation: |
      Каждый объект ссылается на прототип через `[[Prototype]]`. Чтение ищет свойство по цепочке до `null`, а
      запись создаёт свойство на самом объекте (если в прототипе нет сеттера или read-only свойства). Наследование
      — это делегирование, а не копирование.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Inheritance_and_the_prototype_chain

  - id: js-048
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      class Animal {}
      const cat = new Animal();

      Animal.prototype.speak = function () {
        return 'мяу';
      };

      console.log(cat.speak());
    codeLang: js
    options:
      - text: '`мяу`'
        correct: true
        why: '`cat` не копирует методы, а ссылается на `Animal.prototype`. Метод, добавленный позже, виден по цепочке.'
      - text: '`TypeError`: `cat.speak` is not a function'
        why: 'Так было бы, если бы экземпляр получал копию методов при создании. В JS он делегирует прототипу.'
      - text: '`undefined`'
        why: 'Метод найден и вызван — он возвращает строку.'
      - text: '`SyntaxError`: методы класса нельзя добавлять снаружи'
        why: '`class` — сахар над прототипами, и `prototype` можно расширять.'
    explanation: |
      В классическом ООП класс — чертёж, а объект получает копию структуры. В JS прототип — живой объект-образец, на
      который ссылаются экземпляры. Поэтому изменение прототипа сразу видят все, и цепочку можно менять в рантайме.
      `__proto__` — ссылка на прототип объекта, `prototype` — свойство функции-конструктора.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Inheritance_and_the_prototype_chain

  - id: js-049
    topic: JavaScript
    level: middle
    question: |
      Что произойдёт на первой строке?
    code: |
      sum(2, 3);

      var sum = function (a, b) {
        return a + b;
      };
    codeLang: js
    options:
      - text: '`TypeError`: sum is not a function'
        correct: true
        why: '`var sum` поднимается со значением `undefined`, а присваивание функции случится позже. Вызвать `undefined` нельзя.'
      - text: '`ReferenceError`: sum is not defined'
        why: 'Переменная уже существует благодаря поднятию `var` — она просто равна `undefined`.'
      - text: 'Вернётся `5`'
        why: 'Так было бы с Function Declaration — она поднимается целиком.'
      - text: '`ReferenceError`: Cannot access before initialization'
        why: 'Так было бы с `const` или `let` — у них временная мёртвая зона.'
    explanation: |
      Function Declaration поднимается целиком — её можно вызвать до объявления. Function Expression — это значение
      переменной: с `var` до присваивания там `undefined` (TypeError при вызове), с `let` и `const` — мёртвая зона
      (ReferenceError).
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/Hoisting

  - id: js-050
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      const factorial = function fac(n) {
        return n <= 1 ? 1 : n * fac(n - 1);
      };

      console.log(factorial(5));
      console.log(typeof fac);
    codeLang: js
    options:
      - text: '`120`, `undefined`'
        correct: true
        why: 'Имя Named Function Expression видно только внутри самой функции — для рекурсии. Снаружи `fac` нет, а `typeof` у необъявленного имени даёт `''undefined''`.'
      - text: '`120`, `function`'
        why: 'Имя функции-выражения не попадает во внешнюю область видимости.'
      - text: '`ReferenceError`, `undefined`'
        why: 'Внутри функции `fac` доступно — рекурсия работает.'
      - text: '`120`, `ReferenceError`'
        why: '`typeof` — единственный способ обратиться к необъявленному имени без ошибки.'
    explanation: |
      У Named Function Expression имя локально для тела функции: удобно для рекурсии и стека ошибок. Ещё у
      функции-выражения в переменной имя выводится автоматически: `const f = function () {}` — `f.name === 'f'`.
    links:
