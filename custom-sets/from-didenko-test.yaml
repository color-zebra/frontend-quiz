  - id: react-008
    topic: React
    level: middle
    question: |
      Модалка отрендерена через `createPortal` в `document.body`. Сработает ли `onClick` родительского компонента в
      React-дереве при клике внутри модалки?
    options:
      - text: 'Да: события всплывают по дереву React, а не по DOM'
        correct: true
        why: 'Портал меняет только место в DOM. Для React модалка остаётся ребёнком своего компонента, и синтетические события всплывают к нему.'
      - text: 'Нет: в DOM модалка вне родителя, событие туда не дойдёт'
        why: 'Нативное событие действительно не дойдёт до DOM-родителя, но React всплывает по своему дереву.'
      - text: 'Только если добавить `stopPropagation`'
        why: '`stopPropagation` наоборот останавливает всплытие.'
      - text: 'Только для событий клавиатуры'
        why: 'Все синтетические события ведут себя одинаково.'
    explanation: |
      Порталы рендерят детей в DOM-узел вне иерархии родителя: модалки, всплывающие окна, тултипы — чтобы не
      мешали `overflow: hidden` и контексты наложения. Контекст, состояние и всплытие событий при этом работают
      как для обычного ребёнка.
    links:
      - https://react.dev/reference/react-dom/createPortal

  - id: react-009
    topic: React
    level: middle
    question: |
      Почему этот код не обновит список на экране?
    code: |
      const [items, setItems] = useState([]);

      const add = (item) => {
        items.push(item);
        setItems(items);
      };
    codeLang: jsx
    options:
      - text: 'React сравнивает ссылки, а массив остался тем же'
        correct: true
        why: '`push` мутирует старый массив. React сравнивает ссылки (`Object.is`), а ссылка прежняя — рендера не будет.'
      - text: '`setItems` асинхронный и ещё не успел сработать'
        why: 'Дело не во времени: даже потом React увидит ту же ссылку.'
      - text: '`push` нельзя вызывать у массивов из `useState`'
        why: 'Можно — массив обычный. Но мутация не сообщает React об изменении.'
      - text: 'Нужно было передать функцию: `setItems(() => items)`'
        why: 'Функция вернёт тот же массив — результат прежний. Нужен новый массив: `[...prev, item]`.'
    explanation: |
      React полагается на иммутабельность: изменение он «видит» только по новой ссылке, а не по изменённым свойствам
      внутри старого объекта. Поверхностное сравнение ссылок быстрее глубокого и делает поток данных предсказуемым.
      Правильно: `setItems((prev) => [...prev, item])`.
    links:
      - https://react.dev/learn/updating-arrays-in-state

  - id: react-010
    topic: React
    level: middle
    question: |
      Зачем нужен `flushSync`?
    options:
      - text: 'Чтобы обновление состояния сразу попало в DOM'
        correct: true
        why: 'Внутри `flushSync` React синхронно делает рендер и коммит — например, чтобы прокрутить к только что добавленному элементу.'
      - text: 'Чтобы сбросить все состояния компонента'
        why: 'Сброс состояния — смена `key` или своя логика.'
      - text: 'Чтобы отправить данные формы на сервер'
        why: 'Это работа fetch или Actions, не `flushSync`.'
      - text: 'Чтобы отключить батчинг для всего приложения'
        why: '`flushSync` действует только на обновления внутри своего колбэка.'
    explanation: |
      `flushSync` — «перерисовать прямо сейчас и обновить DOM», `forceUpdate` у классов — «попросить React
      перерисовать». `flushSync` бьёт по производительности, его используют точечно — для интеграции с нативными API,
      которым нужен готовый DOM.
    links:
      - https://react.dev/reference/react-dom/flushSync

  - id: react-011
    topic: React
    level: middle
    question: |
      `Parent` рендерит `Child`, у обоих есть `useEffect`. В каком порядке будет вывод при монтировании?
    options:
      - text: 'Parent render → Child render → Child effect → Parent effect'
        correct: true
        why: 'Рендер идёт сверху вниз, а эффекты — снизу вверх: к моменту эффекта родителя дети уже смонтированы.'
      - text: 'Parent render → Parent effect → Child render → Child effect'
        why: 'Эффекты запускаются после рендера всего дерева, а не сразу после каждого компонента.'
      - text: 'Child render → Parent render → Child effect → Parent effect'
        why: 'Родитель рендерится первым — он возвращает элемент `Child`.'
      - text: 'Parent render → Child render → Parent effect → Child effect'
        why: 'Эффекты идут от детей к родителю.'
    explanation: |
      Рендер-фаза — от родителя к детям. Эффекты (и `useLayoutEffect`, и `useEffect`) — от детей к родителю. Сначала
      все рендеры, потом все эффекты. Ребёнок перерисовывается, если перерисовался родитель (без `memo`), изменились
      его состояние или контекст.
    links:
      - https://react.dev/learn/render-and-commit

  - id: react-012
    topic: React
    level: middle
    question: |
      Что вызывает ререндер компонента?
    options:
      - text: '`setState` с новым значением'
        correct: true
        why: 'Основной триггер рендера.'
      - text: 'Ререндер родителя без `memo` у ребёнка'
        correct: true
        why: 'По умолчанию при рендере родителя рендерятся все дети, даже с теми же пропсами.'
      - text: 'Новое значение контекста, который он читает'
        correct: true
        why: 'Все потребители контекста перерисуются, даже если используют лишь часть значения.'
      - text: 'Запись нового значения в `ref.current`'
        why: '`useRef` специально не вызывает рендер.'
      - text: 'Мутация объекта из состояния без вызова `setState`'
        why: 'React не узнает о мутации — рендера не будет.'
    explanation: |
      Ререндер вызывают: изменение состояния (`useState`, `useReducer`), ререндер родителя, изменение контекста,
      `forceUpdate` в классах. Новые объекты и функции в пропсах ломают `memo`, потому что сравнение идёт по ссылке.
      Батчинг группирует обновления, но не отменяет рендеры.
    links:
      - https://react.dev/learn/render-and-commit#step-1-trigger-a-render

  - id: react-013
    topic: React
    level: middle
    question: |
      Чем `useCallback(fn, deps)` отличается от `useMemo`?
    options:
      - text: 'Это то же самое, что `useMemo(() => fn, deps)`'
        correct: true
        why: '`useCallback` запоминает саму функцию, `useMemo` — результат вызова. Обёрнутый так `useMemo` вернёт функцию.'
      - text: '`useCallback` вызывает функцию и запоминает результат'
        why: 'Это `useMemo`. `useCallback` функцию не вызывает.'
      - text: '`useCallback` не принимает зависимости'
        why: 'Принимает — новая функция создаётся только при их изменении.'
      - text: '`useCallback` работает только с async-функциями'
        why: 'С любыми функциями.'
    explanation: |
      `useMemo` мемоизирует значение (результат тяжёлого вычисления), `useCallback` — функцию, чтобы ссылка была
      стабильной. Оба полезны в паре с `React.memo` у детей или в зависимостях эффектов. Без этого мемоизация — лишняя
      работа.
    links:
      - https://react.dev/reference/react/useCallback

  - id: react-014
    topic: React
    level: middle
    question: |
      Зачем нужен `useImperativeHandle`?
    options:
      - text: 'Чтобы задать, что родитель получит через ref'
        correct: true
        why: 'Вместо DOM-узла ребёнок отдаёт объект с выбранными методами, например `{ focus, clear }`.'
      - text: 'Чтобы вызвать эффект до отрисовки'
        why: 'Это `useLayoutEffect`.'
      - text: 'Чтобы обновить DOM без рендера'
        why: 'Хук не трогает DOM, он настраивает значение ref.'
      - text: 'Чтобы передать данные от родителя к ребёнку'
        why: 'Для этого есть пропсы и контекст. `useImperativeHandle` даёт данные в обратную сторону — родителю.'
    explanation: |
      `useImperativeHandle(ref, createHandle, deps)` кастомно настраивает значение ref, доступное родителю. Это редкий
      случай связи «снизу вверх»: родитель вызывает `childRef.current.focus()`. Раньше требовал `forwardRef`, в React
      19 ref передаётся как обычный проп.
    links:
      - https://react.dev/reference/react/useImperativeHandle

  - id: react-015
    topic: React
    level: middle
    question: |
      В каком порядке выполняются эффекты при коммите?
    options:
      - text: '`useInsertionEffect` → `useLayoutEffect` → `useEffect`'
        correct: true
        why: 'Insertion — до мутаций DOM, layout — после мутаций и до отрисовки, обычный — после отрисовки.'
      - text: '`useLayoutEffect` → `useInsertionEffect` → `useEffect`'
        why: '`useInsertionEffect` срабатывает раньше всех — ещё до изменений DOM.'
      - text: '`useEffect` → `useLayoutEffect` → `useInsertionEffect`'
        why: '`useEffect` — самый поздний, после отрисовки.'
      - text: '`useInsertionEffect` → `useEffect` → `useLayoutEffect`'
        why: '`useLayoutEffect` блокирует отрисовку и поэтому идёт раньше `useEffect`.'
    explanation: |
      `useInsertionEffect` почти единственная задача — вставлять стили CSS-in-JS до того, как layout-эффекты начнут
      читать размеры. У него нет доступа к ref и нельзя обновлять состояние. `useLayoutEffect` — измерения DOM до
      отрисовки. `useEffect` — всё остальное.
    links:
      - https://react.dev/reference/react/useInsertionEffect

  - id: react-016
    topic: React
    level: middle
    question: |
      Ввод в поле поиска тормозит из-за фильтрации большого списка. Что даёт `startTransition` вокруг обновления
      списка?
    code: |
      const handleChange = (value) => {
        setInputValue(value);
        startTransition(() => {
          setSearchQuery(value);
        });
      };
    codeLang: jsx
    options:
      - text: 'Поле обновится сразу, а список позже, с низким приоритетом'
        correct: true
        why: 'Обновление внутри `startTransition` несрочное: React может прервать его ради нового ввода.'
      - text: 'Фильтрация уходит в отдельный поток'
        why: 'Всё выполняется в основном потоке. React просто дробит и откладывает работу.'
      - text: 'Список обновится ровно через 300 мс, как debounce'
        why: 'Фиксированной задержки нет — React начнёт, как только будет свободен.'
      - text: 'Обновление списка выполнится синхронно до обновления поля'
        why: 'Наоборот: срочное обновление поля идёт первым.'
    explanation: |
      Конкурентные фичи React 18: `useTransition` даёт `[isPending, startTransition]` и помечает обновление
      несрочным. `useDeferredValue(value)` даёт «отстающую» копию значения — когда управлять самим `setState` нельзя.
      Это лучше debounce: нет фиксированной задержки, и ненужный рендер прерывается.
    links:
      - https://react.dev/reference/react/useTransition

  - id: react-017
    topic: React
    level: middle
    multiple: true
    question: |
      Зачем нужен `useId`?
    options:
      - text: 'Генерирует уникальный id, одинаковый на сервере и клиенте'
        correct: true
        why: 'Для связки `<label htmlFor>` и `<input id>`, `aria-describedby` — без расхождений при гидратации.'
      - text: 'Генерирует ключи для элементов списка'
        why: 'Ключи должны идти из данных. `useId` для `key` не предназначен.'
      - text: 'Возвращает id DOM-элемента компонента'
        why: 'К DOM обращаются через `useRef`.'
      - text: 'Генерирует новый случайный id на каждом рендере'
        why: 'Id стабилен на всё время жизни компонента.'
    explanation: |
      `Math.random()` для id ломает SSR: сервер и клиент получат разные значения. `useId` строит id из положения
      компонента в дереве, поэтому он совпадает при гидратации. Появился в React 18.
    links:
      - https://react.dev/reference/react/useId

  - id: react-018
    topic: React
    level: middle
    multiple: true
    question: |
      Значение контекста — объект `{ user, theme }`. Компонент читает только `theme`, а меняется `user`. Что будет?
    options:
      - text: 'Компонент перерисуется: изменилось значение контекста целиком'
        correct: true
        why: 'React сравнивает значение контекста по ссылке и перерисовывает всех потребителей, независимо от того, какую часть они читают.'
      - text: 'Не перерисуется: `theme` не изменилась'
        why: 'Селекторов у `useContext` нет — подписка на весь объект.'
      - text: 'Не перерисуется, если обернуть его в `React.memo`'
        why: '`memo` защищает от пропсов, а не от контекста: потребитель перерисуется всё равно.'
      - text: 'Перерисуется только провайдер'
        why: 'Провайдер перерисовался сам, а потребители — из-за нового значения.'
    explanation: |
      Context хорош для редко меняющихся данных: тема, язык, текущий пользователь, и против prop drilling. При частых
      изменениях контекст делят на несколько или берут стейт-менеджер с селекторами (Redux, Zustand): они
      перерисовывают только тех, чья часть изменилась, плюс дают middleware для эффектов и DevTools.
    links:
      - https://react.dev/reference/react/useContext#optimizing-re-renders-when-passing-objects-and-functions

  - id: react-019
    topic: React
    level: middle
    question: |
      Что в React до сих пор нельзя сделать на хуках, без классового компонента?
    options:
      - text: 'Error Boundary'
        correct: true
        why: 'Нужны `componentDidCatch` или `getDerivedStateFromError`. Без класса — только через библиотеку вроде react-error-boundary (внутри неё класс).'
      - text: '`getSnapshotBeforeUpdate`'
        correct: true
        why: 'Хука для снимка DOM прямо перед коммитом нет. Позицию скролла приходится сохранять иначе.'
      - text: 'Состояние компонента'
        why: '`useState` и `useReducer`.'
      - text: 'Код после монтирования'
        why: '`useEffect` с пустым массивом зависимостей.'
      - text: 'Пропуск лишних рендеров'
        why: '`React.memo` вместо `shouldComponentUpdate`.'
    explanation: |
      Жизненный цикл класса: монтирование (`constructor`, `getDerivedStateFromProps`, `render`, `componentDidMount`),
      обновление (`shouldComponentUpdate`, `render`, `getSnapshotBeforeUpdate`, `componentDidUpdate`),
      размонтирование (`componentWillUnmount`), ошибки (`getDerivedStateFromError`, `componentDidCatch`). Почти всё
      заменили хуки, кроме границ ошибок и снимка перед обновлением.
    links:
      - https://react.dev/reference/react/Component#catching-rendering-errors-with-an-error-boundary

  - id: react-020
    topic: React
    level: middle
    question: |
      Что появилось в React 18?
    options:
      - text: 'Автоматический батчинг в промисах и таймерах'
        correct: true
        why: 'До 18 обновления группировались только в обработчиках событий React.'
      - text: '`useTransition` и `useDeferredValue`'
        correct: true
        why: 'Хуки конкурентного рендеринга.'
      - text: '`useId`'
        correct: true
        why: 'Стабильные id для SSR.'
      - text: 'Хуки `useState` и `useEffect`'
        why: 'Хуки появились в React 16.8 (2019).'
      - text: 'Автоматическая мемоизация вместо `useMemo` и `useCallback`'
        why: 'Это React Compiler — отдельный инструмент, стабильный с 2025 года. React 18 сам ничего не мемоизирует.'
    explanation: |
      React 16 (2017) — Fiber, Error Boundaries, порталы, фрагменты; 16.3 — новый Context API; 16.8 — хуки. React 17
      (октябрь 2020) — «мостовой» релиз: новый JSX transform, события на корне приложения. React 18 (март 2022) —
      `createRoot`, конкурентный рендеринг, автоматический батчинг, Streaming SSR. React 19 (декабрь 2024) — Actions,
      `useActionState`, `useOptimistic`, `use`, `ref` как проп.
    links:
      - https://react.dev/blog/2022/03/29/react-v18

  - id: react-021
    topic: React
    level: middle
    question: |
      Что изменил новый JSX transform в React 17?
    options:
      - text: 'JSX больше не требует `import React`'
        correct: true
        why: 'Компилятор подставляет импорт функции `jsx` из `react/jsx-runtime` сам.'
      - text: 'JSX стал выполняться на сервере'
        why: 'Это Server Components — другая история и другая версия.'
      - text: 'JSX стал компилироваться в HTML'
        why: 'JSX по-прежнему превращается в вызовы функций, а не в HTML.'
      - text: 'В JSX стало можно писать `class` вместо `className`'
        why: 'Атрибуты не менялись — по-прежнему `className`.'
    explanation: |
      Раньше `<div />` компилировался в `React.createElement('div')`, поэтому `React` должен был быть в области
      видимости. Новый transform вызывает `jsx()` из `react/jsx-runtime` и сам добавляет импорт. React 17 был без
      новых фич для разработчиков — готовил почву для React 18.
    links:
      - https://legacy.reactjs.org/blog/2020/09/22/introducing-the-new-jsx-transform.html

  - id: react-022
    topic: React
    level: middle
    question: |
      Почему хуки нельзя вызывать внутри условий и циклов?
    options:
      - text: 'React находит состояние хука по порядку вызова'
        correct: true
        why: 'У хуков нет имён — первое `useState` получает первую ячейку и так далее. Условие сдвинет порядок, и данные перепутаются.'
      - text: 'Условия в JSX выполняются асинхронно'
        why: 'Условия синхронные. Проблема в разном количестве вызовов между рендерами.'
      - text: 'Хуки внутри `if` не видят пропсы компонента'
        why: 'Пропсы видны везде в теле функции.'
      - text: 'ESLint запрещает это только ради единого стиля'
        why: 'ESLint лишь ловит нарушение. Само правило — следствие устройства хуков.'
    explanation: |
      Правила хуков: вызывать только на верхнем уровне компонента или кастомного хука — не в условиях, циклах,
      вложенных функциях, обработчиках; только в функциональных компонентах и кастомных хуках; имя кастомного хука
      начинается с `use`. Нарушения ловит `eslint-plugin-react-hooks`.
    links:
      - https://react.dev/reference/rules/rules-of-hooks

  - id: react-023
    topic: React
    level: middle
    question: |
      Нужно измерить высоту элемента и сразу поставить по ней позицию тултипа без мигания. Какой хук подойдёт?
    options:
      - text: '`useLayoutEffect`'
        correct: true
        why: 'Он выполняется после изменения DOM, но до отрисовки. Пользователь увидит уже правильную позицию.'
      - text: '`useEffect`'
        why: 'Обычно срабатывает после отрисовки — тултип мелькнёт в старом месте.'
      - text: '`useInsertionEffect`'
        why: 'Он срабатывает до изменения DOM и не даёт доступа к ref — измерять нечего.'
      - text: '`useMemo`'
        why: 'Он выполняется во время рендера, когда DOM ещё не обновлён.'
    explanation: |
      `useLayoutEffect` выполняется синхронно после рендера и изменения DOM, но до того, как браузер нарисует кадр, —
      и блокирует отрисовку, поэтому тяжёлое в нём не делают. `useEffect` — асинхронно, обычно после отрисовки.
      Ref-ы привязываются в фазе коммита — до `useLayoutEffect`.
    links:
      - https://react.dev/reference/react/useLayoutEffect

