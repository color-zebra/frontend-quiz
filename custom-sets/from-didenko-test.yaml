  - id: arch-011
    topic: Архитектура
    level: middle
    question: |
      Какой принцип SOLID нарушает класс `Ostrich extends Bird`, у которого `fly()` бросает исключение?
    options:
      - text: 'Принцип подстановки Лисков'
        correct: true
        why: 'Код, работающий с любым `Bird`, сломается на страусе — подкласс нельзя подставить вместо базового.'
      - text: 'Принцип единственной ответственности'
        why: 'У класса не много обязанностей — проблема в нарушении контракта базового класса.'
      - text: 'Принцип открытости/закрытости'
        why: 'OCP — про расширение без изменения существующего кода.'
      - text: 'Принцип инверсии зависимостей'
        why: 'DIP — про зависимость от абстракций, а не от конкретных реализаций.'
    explanation: |
      SOLID: SRP — одна причина для изменения; OCP — открыт для расширения, закрыт для изменения; LSP — подкласс
      заменяет базовый без поломок; ISP — клиент не зависит от методов, которыми не пользуется; DIP — модули зависят
      от абстракций. Исправление здесь — отдельный `FlyingBird`, а страус наследует только `Bird`.
    links:
      - https://en.wikipedia.org/wiki/Liskov_substitution_principle

  - id: arch-012
    topic: Архитектура
    level: middle
    question: |
      Компонент `UserProfile` сам загружает данные из API, ведёт форму редактирования и рисует UI. Какой принцип
      нарушен и как исправить?
    options:
      - text: 'SRP: загрузку — в `useUserData`, форму — в `UserForm`'
        correct: true
        why: 'У компонента три причины меняться — API, форма, вёрстка. Разделение даёт каждой части одну.'
      - text: 'OCP: добавить компоненту больше пропсов для настройки'
        why: 'Пропсы не уберут смешение трёх обязанностей.'
      - text: 'ISP: передавать в компонент меньше полей `user`'
        why: 'Лишние поля — отдельная проблема, а тут смешаны обязанности.'
      - text: 'DIP: переписать компонент на классовый'
        why: 'Классовость к инверсии зависимостей отношения не имеет.'
    explanation: |
      SOLID в React: SRP — разделение на хуки и компоненты; OCP — расширение через пропсы, композицию, HOC, хуки (как
      `variant` у `Button`); LSP — совместимые интерфейсы пропсов; ISP — не передавать объект с 10 полями, если нужны
      2, дробить хуки и контексты; DIP — компонент получает зависимость (например, `fetcher`) снаружи и легко
      тестируется с моком.
    links:
      - https://en.wikipedia.org/wiki/Single-responsibility_principle

  - id: arch-013
    topic: Архитектура
    level: middle
    question: |
      Что утверждает теорема CAP?
    options:
      - text: 'При разделении сети приходится выбирать между согласованностью и доступностью'
        correct: true
        why: 'Распределённая система не может избежать разрывов связи (P), поэтому реальный выбор — C или A в момент разрыва.'
      - text: 'Любая база данных обеспечивает все три свойства одновременно'
        why: 'Все три одновременно при разрыве сети недостижимы.'
      - text: 'Системы делятся на SQL и NoSQL'
        why: 'CAP — про распределённые системы, а не про модель данных.'
      - text: 'Без разделения сети нужно выбирать между задержкой и согласованностью'
        why: 'Это дополнение из PACELC, а не сама CAP.'
    explanation: |
      CAP: Consistency — все узлы видят одни данные, Availability — любой запрос получает ответ, Partition tolerance —
      система работает при потере связи между узлами. Упрощённо — «можно только два из трёх». PACELC расширяет: при
      разделении (P) — выбор между A и C, иначе (E) — между задержкой (L) и согласованностью (C).
    links:
      - https://en.wikipedia.org/wiki/CAP_theorem

  - id: arch-014
    topic: Архитектура
    level: middle
    question: |
      Чем шардинг отличается от репликации?
    options:
      - text: 'Шардинг делит данные, репликация копирует их'
        correct: true
        why: 'Шардинг — масштабирование объёма и записи, репликация — отказоустойчивость и масштабирование чтения.'
      - text: 'Шардинг копирует данные, репликация делит'
        why: 'Наоборот.'
      - text: 'Это два названия одного приёма'
        why: 'Цели и механика разные.'
      - text: 'Шардинг для SQL, репликация для NoSQL'
        why: 'Оба приёма есть и там, и там.'
    explanation: |
      System design: архитектура, выбор технологий, масштабируемость, безопасность, производительность, данные,
      интеграции. Хранение: SQL (ACID, схема), NoSQL (гибкость, горизонтальное масштабирование), шардинг по ключу
      (id, география), репликация. Масштабирование: вертикальное (мощнее сервер) и горизонтальное (больше серверов) с
      балансировщиком (round robin, IP hash), кэш, CDN, очереди сообщений.
    links:
      - https://en.wikipedia.org/wiki/Shard_(database_architecture)

