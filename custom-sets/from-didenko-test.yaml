# Свой набор: тестовые вопросы по конспектам Диденко к собеседованию на фронтенд.
# Формат — как у любого стороннего набора (см. examples/README.md). В сборку приложения не входит.
title: From Didenko — тест
questions:
  # ===================== HTML =====================
  - id: html-001
    topic: HTML
    level: middle
    question: |
      Что из этого по смыслу стоит разметить тегом `<article>`, а не `<section>`?
    options:
      - text: 'Комментарий пользователя'
        correct: true
        why: 'Комментарий — независимая единица: его можно вынуть со страницы и показать отдельно, смысл не потеряется.'
      - text: 'Карточку товара в каталоге'
        correct: true
        why: 'Карточка самодостаточна и переносима — её показывают и в каталоге, и в рекомендациях.'
      - text: 'Пост в блоге'
        correct: true
        why: 'Классический пример `<article>`: отдельная статья со своим заголовком и автором.'
      - text: 'Главу внутри длинной статьи'
        why: 'Глава — смысловой раздел целого, отдельно от статьи она не живёт. Это `<section>`.'
      - text: 'Панель одной вкладки на странице настроек'
        why: 'Вкладка — раздел документа, не отделяемый от него. Это `<section>`.'
    explanation: |
      `<section>` — смысловой раздел документа, который не отделяется от него: главы, вкладки. `<article>` —
      независимая, отделяемая смысловая единица: комментарий, твит, статья, карточка, виджет. Проверка простая:
      если блок можно показать в другом месте или в RSS и он будет понятен сам по себе — это `<article>`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Element/article

  - id: html-002
    topic: HTML
    level: middle
    question: |
      Что делает `<link rel="preconnect" href="https://cdn.example.com">`?
    options:
      - text: 'Заранее устанавливает соединение с сервером'
        correct: true
        why: 'Браузер заранее делает DNS-запрос, TCP-рукопожатие и TLS, но сами файлы не скачивает.'
      - text: 'Заранее скачивает главный файл с сервера'
        why: 'Скачивание заранее — это `preload` (для текущей страницы) или `prefetch` (для будущей).'
      - text: 'Скачивает ресурсы для следующей страницы в фоне'
        why: 'Это `prefetch`. `preconnect` только готовит соединение.'
      - text: 'Разрешает загрузку ресурсов с этого домена по CORS'
        why: 'CORS настраивает сервер заголовками ответа, `<link>` его не разрешает.'
    explanation: |
      Три подсказки браузеру загружать заранее. `preload` — важный ресурс текущей страницы, который понадобится
      скоро (шрифт, ключевой скрипт). `prefetch` — ресурс, который понадобится в будущем, например на следующей
      странице, с низким приоритетом. `preconnect` — заранее установить соединение: DNS, TCP и TLS.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Attributes/rel/preconnect

  - id: html-003
    topic: HTML
    level: middle
    question: |
      Шрифт нужен для первого экрана текущей страницы, но браузер узнаёт о нём поздно — только из CSS. Какую
      подсказку поставить?
    options:
      - text: '`rel="preload"`'
        correct: true
        why: 'Preload говорит: этот ресурс точно понадобится текущей странице скоро, начни качать сейчас с высоким приоритетом.'
      - text: '`rel="prefetch"`'
        why: 'Prefetch — для будущих страниц, с низким приоритетом. Для первого экрана он опоздает.'
      - text: '`rel="preconnect"`'
        why: 'Preconnect только откроет соединение — сам шрифт браузер всё равно начнёт качать, когда дойдёт до CSS.'
      - text: '`rel="dns-prefetch"`'
        why: 'Это ещё меньше, чем preconnect: только DNS-запрос заранее.'
    explanation: |
      Preload нужен для ресурсов, которые браузер обнаружит поздно: шрифты из CSS, картинки из CSS, скрипты,
      подключаемые другими скриптами. Шрифтам в preload ставят `as="font"` и `crossorigin`, иначе браузер скачает
      их дважды.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Attributes/rel/preload

  - id: html-004
    topic: HTML
    level: middle
    question: |
      Какой файл загрузит браузер на устройстве с `devicePixelRatio = 2`?
    code: |
      <img
        alt="An image"
        width="500"
        height="500"
        src="/image-500.jpg"
        srcset="/image-500.jpg 1x, /image-1000.jpg 2x, /image-1500.jpg 3x"
      >
    codeLang: html
    options:
      - text: '`/image-1000.jpg`'
        correct: true
        why: 'Дескриптор `2x` — для экранов, где на один CSS-пиксель приходятся два пикселя устройства.'
      - text: '`/image-500.jpg`'
        why: 'Это вариант для DPR 1. На экране с DPR 2 он будет мыльным.'
      - text: '`/image-1500.jpg`'
        why: 'Это вариант для DPR 3. Браузер берёт кандидата под свой DPR, а не самый большой.'
      - text: 'Все три, а покажет подходящий'
        why: '`srcset` нужен как раз затем, чтобы скачать один подходящий файл, а не все.'
    explanation: |
      DPR — соотношение пикселей устройства. С iPhone 4 один CSS-пиксель стал двумя пикселями устройства по каждой оси, и
      картинка той же CSS-ширины требует вдвое больше реальных пикселей. Дескрипторы `1x`, `2x`, `3x` в `srcset`
      подходят, когда картинка показывается одним размером на всех экранах.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Element/img#srcset

  - id: html-005
    topic: HTML
    level: middle
    question: |
      Какой файл выберет браузер при ширине окна 400px и DPR 1?
    code: |
      <img
        src="/image-500.jpg"
        srcset="/image-500.jpg 500w, /image-1000.jpg 1000w, /image-1500.jpg 1500w"
        sizes="(min-width: 768px) 500px, 100vw"
        alt="An image"
      >
    codeLang: html
    options:
      - text: '`/image-500.jpg`'
        correct: true
        why: 'Окно меньше 768px, значит, по `sizes` картинка займёт `100vw` = 400px. Самый маленький подходящий кандидат — 500w.'
      - text: '`/image-1000.jpg`'
        why: 'Он нужен при отображаемой ширине около 1000 реальных пикселей — например, 500px при DPR 2.'
      - text: '`/image-1500.jpg`'
        why: 'Для 400px он избыточен втрое — `sizes` и нужен, чтобы не качать лишнего.'
      - text: 'Никакой: при окне меньше 768px картинка не показывается'
        why: 'Условие в `sizes` выбирает ширину отображения, а не прячет картинку. Для узких окон сработает запасное `100vw`.'
    explanation: |
      Дескрипторы ширины (`500w`) говорят браузеру реальную ширину файлов, а `sizes` — какой ширины картинка будет
      на странице в CSS-пикселях. Браузер проверяет условия `sizes` по порядку, получает ширину отображения,
      умножает на DPR и выбирает подходящий файл.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Element/img#sizes

  - id: html-006
    topic: HTML
    level: middle
    multiple: true
    question: |
      Что делает атрибут `loading="lazy"` у `<img>`?
    options:
      - text: 'Откладывает загрузку, пока картинка не приблизится к экрану'
        correct: true
        why: 'Браузер сам решает, когда начать загрузку, — обычно когда пользователь до неё докручивает.'
      - text: 'Загружает картинку после события `load` всей страницы'
        why: 'Ленивая загрузка привязана к прокрутке, а не к событию `load`.'
      - text: 'Откладывает декодирование уже загруженной картинки'
        why: 'Декодирование управляется атрибутом `decoding`, а `loading` — сама загрузка.'
      - text: 'Загружает картинку в низком качестве, а потом в полном'
        why: 'Такой приём делают вручную — например, через `decode()`. Атрибут `loading` качество не меняет.'
    explanation: |
      По умолчанию браузер ставит в загрузку все `<img>`, которые находит в HTML (`loading="eager"`). `lazy`
      подсказывает: эти не загружай, пока пользователь до них не докрутит. Атрибут работает как прогрессивное
      улучшение: старый браузер просто загрузит картинку сразу. Картинку первого экрана ленивой делать не стоит —
      это ухудшит LCP.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Element/img#loading

  - id: html-007
    topic: HTML
    level: middle
    multiple: true
    question: |
      Зачем у `<img>` атрибут `decoding="async"`?
    options:
      - text: 'Чтобы декодирование картинки не задерживало отрисовку остального'
        correct: true
        why: 'Декодирование больших картинок может занять сотни миллисекунд. С `async` браузер займётся им позже, когда важное уже нарисовано.'
      - text: 'Чтобы картинка загружалась параллельно с HTML'
        why: 'Загрузка и так идёт параллельно. `decoding` касается перевода байтов в пиксели после загрузки.'
      - text: 'Чтобы картинка загружалась только при прокрутке к ней'
        why: 'Это `loading="lazy"`.'
      - text: 'Чтобы картинку можно было расшифровать из base64'
        why: 'Декодирование тут — это превращение JPEG или PNG в пиксели, а не base64.'
    explanation: |
      Перед показом браузер декодирует картинку — превращает набор байтов в набор пикселей. Атрибут `decoding`
      подсказывает, как это делать: `async` — можно попозже, `sync` — прямо сейчас, `auto` — на усмотрение браузера.
      Как и `loading`, это прогрессивное улучшение.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Element/img#decoding

  - id: html-008
    topic: HTML
    level: middle
    question: |
      Что возвращает метод `HTMLImageElement.decode()`?
    options:
      - text: 'Промис, который выполнится после декодирования'
        correct: true
        why: 'После этого картинку можно вставить в DOM, и она покажется сразу, без задержки кадра.'
      - text: 'Массив пикселей картинки после декодирования'
        why: 'Пиксели достают через `<canvas>` и `getImageData`, а `decode()` только готовит картинку к показу.'
      - text: 'Строку base64 с содержимым загруженной картинки'
        why: 'В base64 картинку переводят через canvas (`toDataURL`) или `FileReader`.'
      - text: '`true`, если картинка уже загружена'
        why: 'Для такой проверки есть свойство `complete`. `decode()` асинхронный и возвращает промис.'
    explanation: |
      `decode()` полезен для подмены превью: показываем миниатюру низкого качества, создаём новый `Image` с полной
      картинкой, ждём `await img.decode()` и только потом меняем. Так не будет ни пустого места, ни подвисания кадра.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/HTMLImageElement/decode

  - id: html-009
    topic: HTML
    level: middle
    question: |
      Что из внешнего документа доходит до элементов внутри Shadow DOM?
    options:
      - text: 'Наследуемые свойства хоста, например `color` и `font-family`'
        correct: true
        why: 'Наследование идёт по дереву через границу shadow root: если у хоста задан шрифт, внутренние элементы его унаследуют.'
      - text: 'CSS-переменные (`--name`)'
        correct: true
        why: 'Custom properties наследуются, поэтому ими и настраивают веб-компоненты снаружи.'
      - text: 'Правила документа вида `p { color: blue }`'
        why: 'Селекторы документа внутрь shadow-дерева не проникают — это и есть инкапсуляция стилей.'
      - text: 'Поиск через `document.querySelector`'
        why: '`document.querySelector` не видит элементы внутри shadow root. Искать надо через `host.shadowRoot.querySelector`.'
    explanation: |
      Shadow DOM — изолированное поддерево, прикреплённое к элементу-хосту. Стили изнутри не «вытекают» наружу, а
      селекторы документа не проникают внутрь. При этом наследуемые свойства и CSS-переменные проходят — через них
      компонент и настраивают снаружи.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Web_components/Using_shadow_DOM

  - id: html-010
    topic: HTML
    level: middle
    question: |
      Что вернёт `host.shadowRoot`?
    code: |
      const host = document.querySelector('#host');
      host.attachShadow({ mode: 'closed' });
      console.log(host.shadowRoot);
    codeLang: js
    options:
      - text: '`null`'
        correct: true
        why: 'В режиме `closed` shadow root не доступен через `element.shadowRoot`. Ссылку на него получает только тот, кто вызвал `attachShadow`.'
      - text: 'Объект `ShadowRoot`'
        why: 'Так было бы в режиме `open`.'
      - text: '`undefined`'
        why: 'Свойство `shadowRoot` есть у всех элементов, и для закрытого корня оно возвращает `null`.'
      - text: 'Ошибку доступа'
        why: 'Ошибки нет: закрытый корень просто не отдаётся.'
    explanation: |
      Режим `open` — shadow root доступен из внешнего JS через `element.shadowRoot`. Режим `closed` — недоступен
      извне. Используется редко, потому что ограничивает гибкость, а настоящей защиты не даёт.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Element/shadowRoot

  - id: html-011
    topic: HTML
    level: middle
    multiple: true
    question: |
      Зачем в веб-компоненте нужен `<slot>`?
    options:
      - text: 'Чтобы вставить внутрь Shadow DOM разметку, переданную снаружи'
        correct: true
        why: 'Slot — «дырка» в shadow-дереве: контент из `<my-card><span slot="title">…</span></my-card>` показывается на месте `<slot name="title">`.'
      - text: 'Чтобы объявить свойство компонента для JavaScript'
        why: 'Свойства описывают в классе компонента, а `<slot>` — место для разметки.'
      - text: 'Чтобы подключить к компоненту внешний CSS-файл'
        why: 'Стили подключают через `<style>` или `<link>` внутри shadow root, `<slot>` тут ни при чём.'
      - text: 'Чтобы зарезервировать место под рекламный блок'
        why: 'Это просто совпадение названий. `<slot>` — часть Web Components.'
    explanation: |
      Web Components держатся на трёх технологиях: Custom Elements, Shadow DOM и HTML Templates. Слоты позволяют
      компоненту принимать пользовательский контент. Внутри `<slot>` можно написать содержимое по умолчанию — оно
      покажется, если снаружи ничего не передали.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Element/slot

  - id: html-012
    topic: HTML
    level: middle
    multiple: true
    question: |
      Что делает `aria-hidden="true"` на видимой кнопке?
    options:
      - text: 'Прячет её от скринридера, но она остаётся видимой и фокусируемой'
        correct: true
        why: 'ARIA меняет только дерево доступности. Получается ловушка: Tab попадает на кнопку, а скринридер о ней молчит.'
      - text: 'Прячет её и с экрана, и от скринридера, как `display: none`'
        why: 'С экрана прячут CSS (`display: none`) или атрибут `hidden`. ARIA на отрисовку не влияет.'
      - text: 'Убирает её из порядка Tab, но скринридер её объявляет'
        why: 'Фокус ARIA не трогает — нужен `tabindex="-1"` или `inert`.'
      - text: 'Блокирует нажатия на неё и показывает её неактивной'
        why: 'Кнопка продолжает работать — для блокировки есть `disabled`.'
    explanation: |
      ARIA-атрибуты ничего не меняют в поведении элемента, только в том, что о нём узнают ассистивные технологии.
      `aria-hidden` хорош для декоративных иконок. На фокусируемых элементах он опасен — их надо прятать целиком
      или не прятать вовсе.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Attributes/aria-hidden

  - id: html-013
    topic: HTML
    level: middle
    question: |
      Сообщение об ошибке формы должно прозвучать в скринридере сразу, прервав то, что он читает. Что подойдёт?
    options:
      - text: '`role="alert"`'
        correct: true
        why: 'Роль `alert` — живой регион с `aria-live="assertive"`: изменение объявляется немедленно.'
      - text: '`aria-live="polite"`'
        why: 'Polite дождётся паузы в чтении. Подходит для уведомлений вроде «Товар добавлен в корзину».'
      - text: '`aria-live="off"`'
        why: 'Off — изменения вообще не объявляются.'
      - text: '`aria-busy="true"`'
        why: 'Busy говорит, что регион обновляется и пока объявлять не надо.'
    explanation: |
      Живые регионы нужны для динамического контента. `aria-live` задаёт, как объявлять изменения: `off`,
      `polite`, `assertive`. `aria-atomic` — читать регион целиком или только изменения, `aria-relevant` — какие
      изменения отслеживать, `aria-busy` — регион ещё обновляется. Роли `status` и `alert` — готовые живые
      регионы.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/alert_role

  - id: html-014
    topic: HTML
    level: middle
    multiple: true
    question: |
      Чем `aria-labelledby` отличается от `aria-describedby`?
    options:
      - text: 'Первый даёт элементу имя, второй — дополнительное описание'
        correct: true
        why: 'Скринридер прочитает имя из `labelledby` как название элемента, а текст из `describedby` — после него, как пояснение.'
      - text: 'Первый даёт элементу описание, второй — имя'
        why: 'Наоборот: label — метка, имя элемента, description — описание.'
      - text: 'Первый принимает текст, второй — id другого элемента'
        why: 'Оба принимают id. Текст напрямую принимает `aria-label`.'
      - text: 'Ничем, это синонимы'
        why: 'Они заполняют разные поля: accessible name и accessible description.'
    explanation: |
      `aria-label` — краткая метка текстом прямо в атрибуте. `aria-labelledby` — ссылка на элемент, чей текст станет
      именем. `aria-describedby` — ссылка на подробное описание, например подсказку к полю «Введите имя и фамилию».
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Attributes/aria-describedby

  - id: html-015
    topic: HTML
    level: middle
    question: |
      Что нужно добавить кастомному чекбоксу на `<div>`, чтобы он был доступен?
    options:
      - text: '`role="checkbox"`'
        correct: true
        why: 'Без роли скринридер увидит обычный блок, а не чекбокс.'
      - text: '`aria-checked="true|false"`'
        correct: true
        why: 'Состояние надо сообщать — и менять атрибут при каждом переключении.'
      - text: '`tabindex="0"`'
        correct: true
        why: '`<div>` не фокусируется сам, а без фокуса нет клавиатурной навигации.'
      - text: '`aria-hidden="true"`'
        why: 'Это спрячет чекбокс от скринридера целиком.'
      - text: '`alt="чекбокс"`'
        why: '`alt` работает только у картинок. Подпись даётся через `aria-labelledby` или `aria-label`.'
    explanation: |
      Первое правило ARIA: не используйте ARIA, если можно использовать нативный HTML. `<input type="checkbox">`
      уже умеет всё сам. Если без кастомного не обойтись, роль, состояние, фокус, подпись и обработку клавиши
      пробела придётся сделать вручную.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/checkbox_role

  - id: html-016
    topic: HTML
    level: middle
    question: |
      Какой минимальный контраст обычного текста с фоном требует WCAG (уровень AA)?
    options:
      - text: '`4.5:1`'
        correct: true
        why: 'Для обычного текста уровень AA — 4.5:1.'
      - text: '`3:1`'
        why: 'Так можно для крупного текста (от 24px или от 18.66px жирным) и для элементов интерфейса.'
      - text: '`7:1`'
        why: 'Это более строгий уровень AAA.'
      - text: '`2:1`'
        why: 'Такого порога в WCAG нет — это слишком бледно.'
    explanation: |
      Доступность — возможность пользоваться сайтом всем людям: слабовидящим, слабослышащим, с моторными и
      когнитивными нарушениями, пожилым. Обязательный минимум: `alt` у картинок, контраст текста, клавиатурная
      навигация, ARIA для кастомных виджетов, семантические теги. Контраст проверяют в DevTools или WebAIM Contrast
      Checker.
    links:
      - https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html

  - id: html-017
    topic: HTML
    level: middle
    question: |
      Какие пары «тег — неявная ARIA-роль» верны (для тегов на верхнем уровне страницы)?
    options:
      - text: '`<header>` — `banner`'
        correct: true
        why: 'Шапка страницы — landmark `banner`. Внутри `<article>` или `<section>` у `<header>` этой роли нет.'
      - text: '`<aside>` — `complementary`'
        correct: true
        why: 'Боковая панель с дополнительным контентом.'
      - text: '`<footer>` — `contentinfo`'
        correct: true
        why: 'Подвал с информацией о странице.'
      - text: '`<section>` — `main`'
        why: 'Роль `main` у тега `<main>`. `<section>` с доступным именем получает роль `region`.'
      - text: '`<nav>` — `menu`'
        why: '`<nav>` — это `navigation`. Роль `menu` — для меню приложения, как в десктопных программах.'
    explanation: |
      Landmark-роли — ключевые области страницы, по которым скринридер даёт быстро прыгать: `banner`, `navigation`,
      `main`, `complementary`, `contentinfo`, `search`, `form`, `region`. Семантические теги дают их бесплатно,
      поэтому `<div role="navigation">` пишут только там, где нельзя поставить `<nav>`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles#landmark_roles

  - id: html-018
    topic: HTML
    level: middle
    question: |
      Какой метатег поисковики сегодня практически игнорируют?
    options:
      - text: '`<meta name="keywords">`'
        correct: true
        why: 'Им слишком злоупотребляли: Google официально объявил в 2009 году, что не учитывает его при ранжировании.'
      - text: '`<meta name="description">`'
        why: 'Description часто показывается в сниппете выдачи и влияет на кликабельность.'
      - text: '`<meta name="robots">`'
        why: 'Robots управляет индексацией (`noindex`, `nofollow`) — поисковики его соблюдают.'
      - text: '`<meta name="viewport">`'
        why: 'Viewport нужен для мобильной вёрстки, а без него Google считает страницу не адаптированной к телефонам.'
    explanation: |
      Метатеги — служебные элементы в `<head>` с информацией о странице. Браузеру без них страница всё равно
      откроется, но для поиска и соцсетей они важны: `<title>` (отдельный элемент) и `description` формируют сниппет, `robots`
      управляет индексацией, Open Graph — превью в соцсетях. Кодировку задают `<meta charset="utf-8">`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta

  - id: html-019
    topic: HTML
    level: middle
    question: |
      Что будет, если не написать `<!DOCTYPE html>` в начале страницы?
    options:
      - text: 'Браузер включит режим совместимости (quirks mode)'
        correct: true
        why: 'Без doctype браузер считает страницу старой и имитирует ошибки браузеров 90-х — например, другую блочную модель.'
      - text: 'Браузер покажет ошибку, страница не откроется'
        why: 'Откроется — браузеры прощают почти любой HTML.'
      - text: 'Браузер обработает страницу как XML-документ'
        why: 'Как XML страница обрабатывается по MIME-типу `application/xhtml+xml`, doctype на это не влияет.'
      - text: 'Ничего не изменится: в HTML5 doctype не нужен'
        why: 'Нужен — именно `<!DOCTYPE html>` включает стандартный режим.'
    explanation: |
      Базовая структура: `<!DOCTYPE html>` — служебная строка для браузера. Дальше `<html lang="ru">`, в нём `<head>`
      с описанием страницы, подключением стилей и скриптов (на экран не выводится) и `<body>` — разметка, которую
      видит пользователь.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Quirks_Mode_and_Standards_Mode

  - id: html-020
    topic: HTML
    level: middle
    question: |
      Чем `<strong>` отличается от `<b>`?
    options:
      - text: '`<strong>` — важность, `<b>` — выделение без важности'
        correct: true
        why: 'Оба по умолчанию жирные, но смысл несёт только `<strong>`. Так же `<em>` — смысловое ударение, а `<i>` — просто курсив.'
      - text: '`<strong>` — устаревший тег, `<b>` — его замена'
        why: 'Наоборот, оба тега живы, просто с разным смыслом.'
      - text: '`<strong>` — блочный элемент, `<b>` — строчный'
        why: 'Оба строчные.'
      - text: '`<strong>` — жирный, `<b>` — полужирный'
        why: 'Начертание по умолчанию одинаковое — разница в смысле, а не в стиле.'
    explanation: |
      Семантическая вёрстка опирается на смысловое предназначение каждого блока и логическую структуру документа, а
      не на то, как он выглядит. Правильные теги нужны поисковикам, скринридерам и разработчикам: `<header>`,
      `<nav>`, `<main>`, `<article>`, `<section>`, `<aside>`, `<footer>`, заголовки `<h1>`–`<h6>`, `<button>` вместо
      `<div>`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Element/strong

  # ===================== CSS =====================
  - id: css-001
    topic: CSS
    level: middle
    question: |
      Какой вес у селектора `.orange a span` (в записи `inline, id, классы, теги`)?
    code: |
      .orange a span { color: orange; }
    codeLang: css
    options:
      - text: '`0,0,1,2`'
        correct: true
        why: 'Один класс (`.orange`) и два тега (`a`, `span`): ноль в разряде inline, ноль id, единица в классах, двойка в тегах.'
      - text: '`0,0,2,1`'
        why: 'Классов тут один, а тегов два — разряды перепутаны местами.'
      - text: '`0,1,0,2`'
        why: 'Второй разряд — id. В селекторе нет ни одного `#id`.'
      - text: '`0,0,0,3`'
        why: 'Так весил бы селектор из трёх тегов. Класс считается в своём разряде и весит больше любого числа тегов.'
    explanation: |
      Вес селектора считают по разрядам: inline-стиль, id, классы (вместе с атрибутами и псевдоклассами), теги
      (вместе с псевдоэлементами). Сравнивают слева направо: `li` — `0,0,0,1`, `ul li` — `0,0,0,2`, `.orange` —
      `0,0,1,0` и уже весит больше любого количества тегов, `.orange a span` — `0,0,1,2`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/Specificity

  - id: css-002
    topic: CSS
    level: middle
    question: |
      Какой вес у селектора по атрибуту, например `[data-role="tab"]`?
    options:
      - text: 'Как у класса'
        correct: true
        why: 'Селекторы атрибутов считаются в одном разряде с классами и псевдоклассами: `0,0,1,0`.'
      - text: 'Как у тега'
        why: 'В разряде тегов считаются только теги и псевдоэлементы, атрибут весит больше.'
      - text: 'Как у id'
        why: 'Атрибут `[id="x"]` тоже весит как класс — вес id даёт только запись `#x`.'
      - text: 'Нулевой'
        why: 'Нулевой вес у `*` и у самой обёртки `:where()`, а атрибут добавляет единицу в разряд классов.'
    explanation: |
      Атрибутные селекторы — `[attr]`, `[attr="value"]`, `[attr^="value"]` и другие — весят как класс. Поэтому
      `[id="main"]` слабее, чем `#main`, хотя выбирает тот же элемент.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/Specificity

  - id: css-003
    topic: CSS
    level: middle
    question: |
      Какие свойства создают новый BFC (Block Formatting Context)?
    options:
      - text: '`overflow: hidden`'
        correct: true
        why: 'Любой `overflow`, кроме `visible` (и `clip`), создаёт BFC — это старый способ «вылечить» float.'
      - text: '`display: flow-root`'
        correct: true
        why: 'Это значение придумано ровно для того, чтобы создать BFC без побочных эффектов.'
      - text: '`float: left`'
        correct: true
        why: 'Плавающий элемент сам становится BFC для своего содержимого.'
      - text: '`position: relative`'
        why: 'Элемент остаётся в обычном потоке и только сдвигается — нового контекста форматирования нет.'
      - text: '`position: sticky`'
        why: 'Sticky-элемент остаётся в потоке и BFC не создаёт.'
    explanation: |
      BFC — изолированная область, «мини-страница», внутри которой блоки раскладываются по своим правилам: она
      вмещает float-ы целиком, и отступы детей не схлопываются через её границу. Создают BFC корень `<html>`, float,
      `position: absolute` и `fixed`, `display: inline-block`, `table-cell`, `flow-root`, `overflow` не `visible`,
      `contain: layout`, `content` или `paint`, многоколоночный блок (`column-count` не `auto`) и `column-span: all`.
      `display: flex` и `grid` создают свой flex- и grid-контекст.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_display/Block_formatting_context

  - id: css-004
    topic: CSS
    level: middle
    question: |
      Почему для создания BFC советуют `display: flow-root`, а не `overflow: hidden`?
    options:
      - text: 'У него нет побочных эффектов'
        correct: true
        why: '`flow-root` только создаёт BFC. `overflow: hidden` попутно обрезает всё, что выходит за блок: тени, выпадающие меню, подсказки.'
      - text: 'Он работает и в старых браузерах'
        why: 'Наоборот, `flow-root` — новое значение, а `overflow: hidden` работает везде.'
      - text: 'Он создаёт ещё и контекст наложения'
        why: 'Контекст наложения `flow-root` не создаёт, и это было бы не плюсом, а лишним эффектом.'
      - text: 'Он убирает элемент из потока'
        why: 'Элемент с `flow-root` остаётся обычным блоком в потоке.'
    explanation: |
      Создать BFC можно многими свойствами, но у каждого старого способа есть своя основная работа: `overflow`
      обрезает содержимое, `float` меняет раскладку, `inline-block` делает блок строчным. `display: flow-root`
      появился как «чистый» способ: блок остаётся обычным блоком и просто становится корнем BFC.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/display

  - id: css-005
    topic: CSS
    level: middle
    question: |
      Какая будет ширина видимой коробки (вместе с рамкой) у такого блока?
    code: |
      div {
        width: 200px;
        padding: 20px;
        border: 5px solid;
        margin: 10px;
      }
    codeLang: css
    options:
      - text: '`250px`'
        correct: true
        why: 'По умолчанию `box-sizing: content-box`: `width` — это только содержимое, к нему добавляются padding (40) и border (10).'
      - text: '`200px`'
        why: 'Так было бы с `box-sizing: border-box`, а по умолчанию стоит `content-box`.'
      - text: '`270px`'
        why: 'Это место вместе с margin. Margin — внешний отступ, в видимую коробку он не входит.'
      - text: '`240px`'
        why: 'Здесь учтён только padding, а рамка в 5px с каждой стороны тоже добавляется к ширине.'
    explanation: |
      Каждый элемент — коробка из слоёв: содержимое, padding, border, margin. При `content-box` `width` задаёт
      ширину содержимого, а padding и border прибавляются сверху: `200 + 40 + 10 = 250px`. С margin элемент
      занимает `270px`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/box-sizing

  - id: css-006
    topic: CSS
    level: middle
    question: |
      Какая будет ширина содержимого у блока с `box-sizing: border-box`?
    code: |
      div {
        box-sizing: border-box;
        width: 200px;
        padding: 20px;
        border: 5px solid;
      }
    codeLang: css
    options:
      - text: '`150px`'
        correct: true
        why: 'При `border-box` `width` — общая ширина. Из неё вычитаются padding (40) и border (10): `200 - 50 = 150px`.'
      - text: '`200px`'
        why: '200px — это вся коробка вместе с padding и рамкой, а не содержимое.'
      - text: '`160px`'
        why: 'Здесь вычтен только padding, рамка тоже съедает место внутри `width`.'
      - text: '`250px`'
        why: 'Столько была бы вся коробка при `content-box`. При `border-box` она не растёт.'
    explanation: |
      `box-sizing: border-box` меняет способ расчёта: `width` и `height` включают padding и border, и коробка
      не «распухает», когда добавляешь отступы. Поэтому его часто ставят всем элементам в начале стилей.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/box-sizing

  - id: css-007
    topic: CSS
    level: middle
    question: |
      Какое расстояние будет между двумя блоками?
    code: |
      <div style="margin-bottom: 30px">Первый</div>
      <div style="margin-top: 20px">Второй</div>
    codeLang: html
    options:
      - text: '`30px`'
        correct: true
        why: 'Вертикальные отступы соседних блоков схлопываются в один, равный наибольшему из них.'
      - text: '`50px`'
        why: 'Так было бы, если бы отступы складывались, а соседние margin-top и margin-bottom в обычном потоке схлопываются.'
      - text: '`20px`'
        why: 'При схлопывании берётся больший отступ, а не меньший.'
      - text: '`25px`'
        why: 'Отступы не усредняются — побеждает наибольший.'
    explanation: |
      Схлопывание отступов: margin-top и margin-bottom блоков в обычном потоке иногда объединяются в один с размером
      наибольшего. Так бывает у соседей и у родителя с первым или последним ребёнком, если между ними нет padding,
      border или содержимого. Горизонтальные отступы не схлопываются никогда.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_box_model/Mastering_margin_collapsing

  - id: css-008
    topic: CSS
    level: middle
    question: |
      У каких элементов вертикальные отступы НЕ схлопываются?
    options:
      - text: 'У float-элементов'
        correct: true
        why: 'Отступы плавающих элементов никогда не схлопываются.'
      - text: 'У абсолютно позиционированных'
        correct: true
        why: 'Абсолютный элемент вынут из потока, его margin ни с кем не объединяется.'
      - text: 'У детей flex- или grid-контейнера'
        correct: true
        why: 'Схлопывание — правило обычного блочного потока, а во flex и grid отступы элементов складываются. Поэтому `display: flex/grid` у родителя — способ его избежать.'
      - text: 'У соседних блоков в обычном потоке'
        why: 'Это как раз классический случай схлопывания: остаётся больший из двух отступов.'
      - text: 'У родителя и первого ребёнка без padding и border между ними'
        why: 'Тоже схлопываются: margin-top ребёнка «вываливается» наружу и объединяется с отступом родителя.'
    explanation: |
      Схлопываются только вертикальные отступы блоков в обычном потоке. Float, абсолютное позиционирование, элементы
      flex и grid выключают это правило, а BFC не даёт отступам родителя схлопываться с отступами детей. Ещё один практический способ — договориться давать
      элементам только нижний отступ.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_box_model/Mastering_margin_collapsing

  - id: css-009
    topic: CSS
    level: middle
    question: |
      Как расположатся элементы по оси Z?
    code: |
      .parent  { position: relative; z-index: 1; }
      .child1  { position: absolute; z-index: 5; }  /* внутри .parent */
      .child2  { position: absolute; z-index: 10; } /* внутри .parent */
      .sibling { position: relative; z-index: 2; }  /* сосед .parent */
    codeLang: css
    options:
      - text: '`.sibling` над `.parent` и всеми его детьми'
        correct: true
        why: '`.parent` с `z-index: 1` создал контекст наложения и сравнивается с `.sibling` целиком: 1 < 2, поэтому весь он со всеми детьми ниже.'
      - text: '`.child1` и `.child2` над `.sibling`, `.parent` под ним'
        why: 'Дети не выходят из контекста родителя: их 5 и 10 сравниваются только между собой внутри `.parent`.'
      - text: '`.child2` над `.sibling`, `.child1` под ним'
        why: 'Ни один ребёнок не сравнивается с `.sibling` напрямую — сравниваются `.parent` и `.sibling`.'
      - text: '`.parent` и все его дети над `.sibling`'
        why: 'У `.sibling` z-index больше (2 против 1), значит, выше он.'
    explanation: |
      Контекст наложения — изолированная группа элементов по оси Z. Элемент с `position` и `z-index` не `auto`
      создаёт свой контекст, и снаружи вся группа сравнивается как одно целое по z-index её корня. Поэтому ребёнок
      с `z-index: 9999` внутри контекста с `z-index: 1` всё равно окажется под соседом с `z-index: 2`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_positioned_layout/Stacking_context

  - id: css-010
    topic: CSS
    level: middle
    question: |
      Какие свойства создают новый контекст наложения (stacking context)?
    options:
      - text: '`opacity: 0.99`'
        correct: true
        why: 'Любая `opacity` меньше 1 создаёт контекст наложения.'
      - text: '`transform: translate(0)`'
        correct: true
        why: 'Любой `transform`, кроме `none`, создаёт контекст — даже нулевой сдвиг.'
      - text: '`isolation: isolate`'
        correct: true
        why: 'Это свойство существует ровно для того, чтобы создать контекст без других эффектов.'
      - text: '`z-index: 1` у элемента flex-контейнера'
        correct: true
        why: 'Flex- и grid-элементы с z-index не `auto` создают контекст даже без `position`.'
      - text: '`position: relative` без z-index'
        why: 'Позиционирование создаёт контекст только вместе с z-index не `auto` (кроме `fixed` и `sticky` — они создают всегда).'
      - text: '`overflow: hidden`'
        why: 'Это свойство создаёт BFC, но не контекст наложения.'
    explanation: |
      Контекст наложения создают: корень `<html>`, `position` с z-index не `auto`, `fixed` и `sticky`, `opacity`
      меньше 1, `transform`, `filter`, `perspective`, `clip-path`, `mask`, `mix-blend-mode` не `normal`,
      `isolation: isolate`, `will-change` с такими свойствами, `contain: layout` или `paint`, flex- и grid-элементы
      с z-index не `auto`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_positioned_layout/Stacking_context

  - id: css-011
    topic: CSS
    level: middle
    question: |
      Где окажется `.child` с `z-index: -1`?
    code: |
      .parent { opacity: 0.9; }
      .child  { position: relative; z-index: -1; } /* внутри .parent */
    codeLang: css
    options:
      - text: 'Над фоном `.parent`, но под его обычным содержимым'
        correct: true
        why: '`opacity` сделал `.parent` контекстом наложения. Отрицательный z-index опускает ребёнка на нижний слой внутри этого контекста — сразу над фоном самого `.parent`.'
      - text: 'Под фоном `.parent`, как и задумано'
        why: 'Уйти под фон родителя можно, только если родитель не создаёт контекст. Тут его создал `opacity`.'
      - text: 'Над всем содержимым `.parent`'
        why: 'Отрицательный z-index работает, просто в пределах контекста родителя — ребёнок уходит вниз, а не наверх.'
      - text: 'В обычном слое: z-index без контекста игнорируется'
        why: 'У `.child` есть `position`, поэтому z-index действует.'
    explanation: |
      Внутри одного контекста элементы рисуются слоями. Отрицательный z-index ставит элемент на самый нижний слой
      контекста, но не ниже фона корня этого контекста. Поэтому трюк «спрятать псевдоэлемент под карточку» работает,
      только если сама карточка контекст не создаёт.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_positioned_layout/Stacking_context

  - id: css-012
    topic: CSS
    level: middle
    question: |
      В каком порядке снизу вверх рисуются слои внутри одного контекста наложения?
    options:
      - text: 'Фон, z-index < 0, блоки, float, inline, z-index 0/auto, z-index > 0'
        correct: true
        why: 'Это порядок из спецификации: блочные элементы ниже float, а строчные (текст) — над float.'
      - text: 'Фон, z-index < 0, inline, блоки, float, z-index 0/auto, z-index > 0'
        why: 'Строчные элементы рисуются выше блоков и float — поэтому текст обтекает float, а не прячется под ним.'
      - text: 'Фон, блоки, float, inline, z-index < 0, z-index 0/auto, z-index > 0'
        why: 'Отрицательный z-index рисуется ниже всех обычных элементов, сразу над фоном.'
      - text: 'z-index < 0, фон, блоки, inline, float, z-index 0/auto, z-index > 0'
        why: 'Фон и рамка корня контекста — самый нижний слой. Отрицательный z-index под фон своего контекста не уходит.'
    explanation: |
      Слои снизу вверх: фон и рамка корня контекста, элементы с отрицательным z-index, блочные элементы в потоке,
      float, строчные элементы, позиционированные элементы с `z-index: auto` или `0`, элементы с положительным
      z-index. Внутри слоя — в порядке появления в HTML.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_positioned_layout/Stacking_context

  - id: css-013
    topic: CSS
    level: middle
    question: |
      Как ведёт себя элемент с `position: sticky`?
    options:
      - text: 'Прилипает при прокрутке ближайшего прокручиваемого предка, но не выходит за родителя'
        correct: true
        why: 'Sticky ведёт себя как `relative`, пока не дойдёт до порога (`top` и т. п.), потом прилипает — но только в границах своего родителя.'
      - text: 'Прилипает к краю окна, как `fixed`, и не зависит от того, где его родитель'
        why: 'Sticky ограничен родителем: когда родитель уезжает из видимой области, элемент уезжает вместе с ним.'
      - text: 'Работает, только если у родителя задан `position: relative`, иначе как `static`'
        why: 'Родителю `relative` не нужен. Sticky не срабатывает из-за другого: не задан порог или у предка `overflow: hidden`.'
      - text: 'Вынимается из потока, как `absolute`, и прилипает к позиционированному предку'
        why: 'Sticky остаётся в потоке и занимает своё место, как `relative`.'
    explanation: |
      Позиционирование: `static` — по умолчанию, элемент в потоке. `relative` — в потоке, но сдвигается через
      `top/right/bottom/left`. `absolute` — вынут из потока, отсчитывается от ближайшего предка с `position` не
      `static`. `fixed` — привязан к окну и не двигается при прокрутке. `sticky` — смесь `relative` и `fixed`:
      прилипает при прокрутке, но живёт в пределах родителя.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/position

  - id: css-014
    topic: CSS
    level: middle
    question: |
      Относительно чего отсчитываются `top` и `left` у элемента с `position: absolute`?
    options:
      - text: 'Ближайшего предка с `position` не `static`'
        correct: true
        why: 'Это его containing block. Если такого предка нет, отсчёт идёт от начального блока документа. Точкой отсчёта станет и предок с `transform`, `filter` или `contain`, даже без `position`.'
      - text: 'Всегда непосредственного родителя'
        why: 'Родитель с `position: static` пропускается — поиск идёт дальше вверх по дереву.'
      - text: 'Всегда окна браузера'
        why: 'Так ведёт себя `position: fixed`, а не `absolute`.'
      - text: 'Своего места в обычном потоке'
        why: 'Так сдвигается `position: relative`. Absolute своего места в потоке не занимает.'
    explanation: |
      Absolute «выдёргивается» из потока: соседи ведут себя так, будто его нет. Координаты считаются от ближайшего
      позиционированного предка — поэтому родителю часто ставят `position: relative`, чтобы привязать к нему
      абсолютного ребёнка.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/position

  - id: css-015
    topic: CSS
    level: middle
    question: |
      Какие имена классов соответствуют BEM?
    options:
      - text: '`menu__item`'
        correct: true
        why: 'Элемент `item` блока `menu` — через двойное подчёркивание.'
      - text: '`button--active`'
        correct: true
        why: 'Модификатор `active` блока `button` — через двойной дефис.'
      - text: '`menu__item--active`'
        correct: true
        why: 'Модификатор элемента: сначала блок и элемент, потом модификатор.'
      - text: '`menu__item__link`'
        why: 'Элемент элемента в BEM не пишут: ссылка — тоже элемент блока, `menu__link`, сколько бы уровней ни было в HTML.'
      - text: '`menu--item`'
        why: 'Двойной дефис — для модификатора. Элемент отделяется двойным подчёркиванием.'
    explanation: |
      BEM — Block, Element, Modifier. Блок — независимый компонент со смыслом сам по себе (кнопка, меню). Элемент —
      часть блока, отдельно не используется (`menu__item`). Модификатор меняет вид или поведение
      (`button--active`). Строгая схема имён нужна, чтобы классы не конфликтовали в больших проектах.
    links:
      - https://en.bem.info/methodology/naming-convention/

  - id: css-016
    topic: CSS
    level: middle
    question: |
      Чем normalize.css отличается от CSS reset?
    options:
      - text: 'Выравнивает различия браузеров, сохраняя полезные стили'
        correct: true
        why: 'Normalize исправляет баги и расхождения браузеров, а заголовки, списки и прочее оставляет как есть.'
      - text: 'Обнуляет все стили браузера, включая заголовки и списки'
        why: 'Это описание reset: «уберём всё, а потом добавим сами».'
      - text: 'Расставляет вендорные префиксы для старых браузеров'
        why: 'Префиксы — работа Autoprefixer, а не normalize.'
      - text: 'Ничем: это два названия одного файла'
        why: 'У них противоположная философия: reset всё сносит, normalize сохраняет и чинит.'
    explanation: |
      Reset — «жёсткий сброс» браузерных стилей до нуля: убирает margin и padding, точки у списков, размеры
      заголовков. Даёт полный контроль, но всё базовое приходится писать заново. Normalize — «нормализация»:
      исправляет баги и расхождения браузеров, учитывает доступность и сохраняет полезные стили, поэтому кода
      меньше.
    links:
      - https://necolas.github.io/normalize.css/

  - id: css-017
    topic: CSS
    level: middle
    question: |
      Какие возможности даёт Sass/SCSS?
    options:
      - text: 'Миксины с параметрами (`@mixin` и `@include`)'
        correct: true
        why: 'Миксин — как функция для CSS: генерирует повторяющийся кусок кода.'
      - text: 'Наследование через `@extend` и placeholder `%name`'
        correct: true
        why: '`@extend` объединяет селекторы в одно правило, `%name` сам в CSS не попадает.'
      - text: 'Циклы и условия (`@each`, `@if`)'
        correct: true
        why: 'Логика на этапе компиляции — то, чего в обычном CSS нет.'
      - text: 'Переменные через `$`'
        correct: true
        why: 'Sass-переменные подставляются при компиляции, в отличие от CSS-переменных `--name`.'
      - text: 'Выполнение кода в браузере без компиляции'
        why: 'Браузер SCSS не понимает: препроцессор заранее компилирует его в обычный CSS.'
      - text: 'Чтение состояния DOM из стилей'
        why: 'Препроцессор работает при сборке и ничего не знает о странице.'
    explanation: |
      Препроцессор принимает код на своём расширенном языке и превращает его в обычный CSS, который понимает браузер.
      Sass/SCSS, Less, Stylus дают вложенность, переменные, миксины, наследование, разбиение на файлы, математику и
      функции. Минусы: лишний шаг сборки, отладка через source maps, разбухание CSS при бездумном `@extend` и
      глубокой вложенности.
    links:
      - https://sass-lang.com/documentation/

  - id: css-018
    topic: CSS
    level: middle
    question: |
      Что получится в CSS после компиляции этого SCSS?
    code: |
      %message-shared {
        border: 1px solid #ccc;
        padding: 10px;
      }
      .message { @extend %message-shared; }
      .success { @extend %message-shared; border-color: green; }
    codeLang: scss
    options:
      - text: 'Общее правило `.message, .success` и отдельное `.success`'
        correct: true
        why: '`@extend` группирует селекторы в одно правило, а placeholder `%message-shared` в итоговый CSS не попадает.'
      - text: 'Копия свойств в `.message` и в `.success` по отдельности'
        why: 'Копирует свойства миксин (`@include`). `@extend` дописывает селектор к общему правилу.'
      - text: 'Класс `.message-shared` и два класса, которые на него ссылаются'
        why: 'Placeholder `%` не компилируется в класс — это его смысл.'
      - text: 'Ошибка компиляции: `%` нельзя использовать в `@extend`'
        why: 'Placeholder-селекторы как раз и придуманы для `@extend`.'
    explanation: |
      Наследование в Sass: `@extend` добавляет селектор к правилу, которое расширяют. Получается
      `.message, .success { border: …; padding: … }`, а потом `.success { border-color: green }`. Placeholder
      `%name` описывает общий кусок, который без `@extend` в CSS не попадает.
    links:
      - https://sass-lang.com/documentation/at-rules/extend/

  - id: css-019
    topic: CSS
    level: middle
    question: |
      В какой селектор скомпилируется `&:hover`?
    code: |
      .nav {
        a {
          color: white;
          &:hover { color: yellow; }
        }
      }
    codeLang: scss
    options:
      - text: '`.nav a:hover`'
        correct: true
        why: '`&` подставляет весь родительский селектор (`.nav a`) и приклеивает к нему `:hover` без пробела.'
      - text: '`.nav a :hover`'
        why: 'С пробелом получился бы любой потомок в состоянии hover. `&` приклеивает без пробела.'
      - text: '`.nav:hover a`'
        why: '`&` — это весь путь до текущего правила, а не только верхний `.nav`.'
      - text: '`a:hover`'
        why: 'Вложенность сохраняется: `&` включает и `.nav`.'
    explanation: |
      Вложенность в препроцессорах повторяет структуру HTML и избавляет от повторения родительских селекторов. `&`
      ссылается на родительский селектор целиком — им пишут состояния (`&:hover`), модификаторы (`&--active`) и
      псевдоэлементы.
    links:
      - https://sass-lang.com/documentation/style-rules/parent-selector/

  - id: css-020
    topic: CSS
    level: middle
    question: |
      Что вернёт `window.matchMedia('(max-width: 768px)')`?
    options:
      - text: 'Объект `MediaQueryList`'
        correct: true
        why: 'У него есть `matches` (подходит ли сейчас), `media` (сам запрос) и событие `change` для подписки.'
      - text: '`true` или `false`'
        why: 'Булево значение лежит в свойстве `matches` возвращённого объекта.'
      - text: '`Promise` с результатом проверки'
        why: 'Проверка синхронная, промиса нет.'
      - text: 'Строку медиа-запроса'
        why: 'Строка хранится в свойстве `media`, а сам метод возвращает объект.'
    explanation: |
      `matchMedia()` проверяет CSS медиа-запрос из JavaScript. `mql.matches` говорит, подходит ли он сейчас, а
      `mql.addEventListener('change', …)` сообщает об изменениях — без постоянного слушателя `resize`. Так делают
      хук `useMediaQuery` в React.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Window/matchMedia

  - id: css-021
    topic: CSS
    level: middle
    multiple: true
    question: |
      Чем отзывчивый дизайн (responsive) отличается от адаптивного (adaptive)?
    options:
      - text: 'Responsive тянется под любую ширину, adaptive переключает заранее готовые макеты'
        correct: true
        why: 'Responsive — «резиновая» вёрстка плюс медиа-запросы. Adaptive — несколько фиксированных вариантов под устройства, иногда даже разный HTML.'
      - text: 'Responsive переключает готовые макеты, adaptive тянется под любую ширину'
        why: 'Наоборот: «резиновый» — responsive, набор фиксированных макетов — adaptive.'
      - text: 'Responsive делается на CSS, adaptive возможен только на JavaScript'
        why: 'Adaptive тоже можно сделать медиа-запросами с фиксированными ширинами, а можно отдавать разный HTML с сервера.'
      - text: 'Ничем: это два перевода одного термина'
        why: 'Термины часто путают, но подходы разные: плавная подстройка против переключения вариантов.'
    explanation: |
      Отзывчивый дизайн — fluid-вёрстка (проценты, flex, grid, `clamp()`) плюс медиа-запросы: страница плавно
      подстраивается под любую ширину. Адаптивный — набор заранее подготовленных макетов под конкретные ширины или
      устройства, которые определяются на сервере или клиенте. На практике их часто комбинируют.
    links:
      - https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/CSS_layout/Responsive_Design

  - id: css-022
    topic: CSS
    level: middle
    question: |
      Какой будет `font-size` у `h1` при ширине окна 1000px (`1rem = 16px`)?
    code: |
      h1 { font-size: clamp(1.5rem, 4vw, 3rem); }
    codeLang: css
    options:
      - text: '`40px`'
        correct: true
        why: '`4vw` при 1000px — 40px. Это между минимумом 24px и максимумом 48px, поэтому берётся как есть.'
      - text: '`24px`'
        why: 'Минимум (`1.5rem`) включается, только когда `4vw` меньше 24px — при ширине окна меньше 600px.'
      - text: '`48px`'
        why: 'Максимум (`3rem`) включается при `4vw` больше 48px — при окне шире 1200px.'
      - text: '`64px`'
        why: '`4vw` — это 4% ширины окна, а не 4 rem.'
    explanation: |
      `clamp(MIN, ИДЕАЛ, MAX)` берёт идеальное значение, но не даёт ему выйти за границы. Так делают fluid-типографику:
      шрифт плавно растёт с шириной окна без медиа-запросов.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/clamp

  - id: css-023
    topic: CSS
    level: middle
    question: |
      Что делает такая сетка?
    code: |
      .container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      }
    codeLang: css
    options:
      - text: 'Ставит столько колонок, сколько влезет по 250px, и растягивает их'
        correct: true
        why: 'Колонка не уже 250px, а остаток ширины делится поровну (`1fr`). Число колонок меняется само, без медиа-запросов.'
      - text: 'Ставит колонки по 250px, а лишнее место оставляет пустым'
        why: 'Верхняя граница `1fr` растягивает колонки на свободное место.'
      - text: 'Делает ровно одну колонку шириной от 250px до всей ширины'
        why: '`repeat(auto-fit, …)` создаёт столько колонок, сколько поместится.'
      - text: 'Ставит колонки по 1fr, а при ширине меньше 250px прячет их'
        why: '`minmax` задаёт минимальную ширину колонки, а не условие её показа.'
    explanation: |
      `auto-fit` + `minmax()` — адаптивная сетка без медиа-запросов: колонки переносятся сами, когда им не хватает
      места. Медиа-запросы и container queries нужны, когда меняется сама раскладка, а не только число колонок.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/repeat

  - id: css-024
    topic: CSS
    level: middle
    question: |
      Чем container queries (`@container`) отличаются от медиа-запросов?
    options:
      - text: 'Проверяют размер контейнера, а не окна'
        correct: true
        why: 'Компонент подстраивается под место, которое ему дали: одна и та же карточка выглядит по-разному в узкой колонке и на всю ширину.'
      - text: 'Проверяют ориентацию устройства, а не ширину'
        why: 'Ориентацию проверяет медиа-запрос `(orientation: portrait)`.'
      - text: 'Работают только в JavaScript через `matchMedia`'
        why: '`@container` — правило CSS. `matchMedia` — про медиа-запросы.'
      - text: 'Ничем, это новый синтаксис тех же медиа-запросов'
        why: 'Медиа-запрос знает только про окно и устройство, контейнерный — про размер конкретного предка.'
    explanation: |
      Чтобы использовать `@container`, предку ставят `container-type: inline-size`. После этого
      `@container (min-width: 400px)` срабатывает по ширине этого предка. Медиа-запросы проверяют ширину окна,
      поэтому компонент на них не знает, сколько места ему досталось.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_containment/Container_queries

  - id: css-025
    topic: CSS
    level: middle
    question: |
      Какие способы центрируют блок сразу по вертикали и горизонтали?
    options:
      - text: 'flex у родителя с `justify-content` и `align-items: center`'
        correct: true
        why: '`justify-content` центрирует по главной оси, `align-items` — по поперечной.'
      - text: '`display: grid; place-items: center` у родителя'
        correct: true
        why: '`place-items` — сокращение для `align-items` и `justify-items` сразу.'
      - text: 'absolute с `top/left: 50%` и `translate(-50%, -50%)`'
        correct: true
        why: 'Старый способ: сдвиг левого верхнего угла в центр, потом обратно на половину своего размера.'
      - text: '`margin: 0 auto` у блока с заданной шириной'
        why: 'Центрирует только по горизонтали: вертикальные `auto` в обычном потоке дают ноль.'
      - text: '`text-align: center` и `vertical-align: middle` у родителя'
        why: '`text-align` центрирует только строчное содержимое по горизонтали, а `vertical-align` у родителя-блока ничего не делает: оно работает у строчных элементов и ячеек таблицы.'
    explanation: |
      По горизонтали: строчные элементы — `text-align: center` у родителя, блочные — `margin: 0 auto` с заданной
      шириной. По вертикали одна строка текста центрируется `line-height`, равным высоте контейнера. По обеим осям
      проще всего flex или grid, старый способ — абсолютное позиционирование с `transform`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/Layout_cookbook/Center_an_element

  - id: css-026
    topic: CSS
    level: middle
    question: |
      Какие элементы выберет селектор `h2 ~ p`?
    options:
      - text: 'Все `p` после `h2` на том же уровне'
        correct: true
        why: '`~` выбирает всех следующих соседей, а не только первого.'
      - text: 'Только `p` сразу после `h2`'
        why: 'Это `h2 + p` — соседний селектор выбирает одного непосредственного соседа.'
      - text: 'Все `p` внутри `h2`'
        why: 'Это селектор потомков `h2 p`.'
      - text: 'Все `p`, у которых есть `h2` на странице'
        why: '`~` смотрит только на соседей одного родителя, которые идут после `h2`.'
    explanation: |
      Комбинаторы: пробел — любой потомок, `>` — прямой ребёнок, `+` — соседний элемент сразу после, `~` — все
      следующие соседи на том же уровне. Их комбинируют с селекторами по тегу, классу, id, атрибуту, псевдоклассами
      и псевдоэлементами.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/Subsequent-sibling_combinator

  # ===================== JavaScript =====================
  - id: js-001
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      const items = [1, 2, 3];

      async function run() {
        items.forEach(async (n) => {
          await null;
          console.log(n);
        });
        console.log('done');
      }

      run();
    codeLang: js
    options:
      - text: '`done`, `1`, `2`, `3`'
        correct: true
        why: '`forEach` не ждёт промисы, которые возвращает async-колбэк: все три колбэка дошли до `await` и встали на паузу, а `done` вывелся синхронно.'
      - text: '`1`, `2`, `3`, `done`'
        why: 'Так было бы с `for...of` и `await` внутри `run`. `forEach` про промисы колбэка ничего не знает.'
      - text: '`1`, `done`, `2`, `3`'
        why: '`forEach` не останавливается на первом `await` — он синхронно запускает все три колбэка подряд.'
      - text: 'Только `done`'
        why: 'Колбэки не отменяются — они продолжатся после `await` в микрозадачах.'
    explanation: |
      `await` работает внутри `for...of`, обычного `for` и `while` — цикл ждёт на каждой итерации. `forEach`, `map`,
      `filter` вызывают колбэк и не ждут его промис. Главное правило: `for...of` — для последовательности,
      `Promise.all(items.map(...))` — для параллельного запуска, `forEach` с `await` — избегать.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/forEach

  - id: js-002
    topic: JavaScript
    level: middle
    question: |
      Сколько элементов вернёт этот `filter`?
    code: |
      [1, 2, 3].filter(async (x) => x > 1).length
    codeLang: js
    options:
      - text: '`3`'
        correct: true
        why: 'Async-функция всегда возвращает промис, а любой промис — truthy. Поэтому `filter` оставит все элементы.'
      - text: '`2`'
        why: 'Так было бы без `async`. `filter` не ждёт промис и не смотрит, чем он выполнится.'
      - text: '`0`'
        why: 'Промис — объект, а объект в логическом контексте всегда `true`.'
      - text: 'Ошибка: `filter` не принимает async-функции'
        why: 'Принимает любую функцию — просто результат получается бессмысленным.'
    explanation: |
      `filter`, `some`, `every`, `find` смотрят на возвращённое значение синхронно. С async-колбэком это всегда
      промис, то есть truthy. Асинхронную фильтрацию делают в два шага: `await Promise.all(items.map(check))`, потом
      синхронный `filter` по полученным флагам.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/filter

  - id: js-003
    topic: JavaScript
    level: middle
    question: |
      Какие недостатки есть у runtime CSS-in-JS (styled-components, emotion)?
    options:
      - text: 'Стили генерируются во время выполнения и нагружают CPU'
        correct: true
        why: 'При изменении пропсов CSS пересчитывается прямо в браузере, а статический CSS парсится один раз.'
      - text: 'Для SSR нужны дополнительные шаги по сбору стилей'
        correct: true
        why: 'Стили надо собрать на сервере и совпасть с клиентом, иначе будет «моргание» без стилей.'
      - text: 'Библиотека увеличивает JS-бандл'
        correct: true
        why: 'Сам рантайм библиотеки едет в бандле, например styled-components весит порядка 12–15 KB gzip.'
      - text: 'Стили нельзя менять в зависимости от пропсов'
        why: 'Наоборот, динамика от пропсов и темы — главный плюс CSS-in-JS.'
      - text: 'Стили глобальные и конфликтуют между компонентами'
        why: 'Наоборот, CSS-in-JS изолирует стили: классы генерируются уникальными.'
    explanation: |
      CSS-in-JS — стили пишутся в JavaScript и генерируются по состоянию компонента. Плюсы: изоляция, темы,
      динамика. Минусы: производительность в рантайме, хэшированные классы в DevTools, сложности с SSR, привязка к
      библиотеке. Альтернативы — CSS Modules, Tailwind или обычные CSS-файлы.
    links:
      - https://styled-components.com/docs/basics

