      - text: 'Сохранится: `Counter` на том же месте'
        why: 'Позиция одинакова, но родитель другого типа — для React это другое дерево.'
      - text: 'Сохранится, если у `Counter` есть `key`'
        why: 'Ключ не спасёт: пересоздаётся весь родитель с детьми.'
