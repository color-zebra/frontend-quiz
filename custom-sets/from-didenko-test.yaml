      - text: '`2`'
        why: 'Так будет с функцией-обновителем: `setCount((c) => c + 1)` дважды.'
      - text: '`0`'
        why: 'Обновление применится — просто оба раза одинаковое.'
      - text: 'Зависит от того, сработал ли батчинг'
