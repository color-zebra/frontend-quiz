        correct: true
        why: 'Ключ `0` теперь у бывшего второго элемента. React думает, что удалён последний, и состояние первого поля достаётся не тому элементу.'
      - text: 'Пропадёт вместе с удалённым элементом'
        why: 'Так было бы со стабильным ключом из данных (`key={item.id}`).'
      - text: 'Переедет в последнее поле'
        why: 'С индексами удаляется последний компонент, а состояние остаётся на своих позициях.'
      - text: 'React выбросит предупреждение и не обновит список'
        why: 'Индекс — валидный ключ. Предупреждение бывает только без ключа или при одинаковых ключах.'
    explanation: |
      `key` — подсказка React, какой элемент какой между рендерами. Индекс плох, когда порядок меняется: при вставке,
      удалении, сортировке ключи «переезжают» к другим данным, а состояние и DOM-узлы остаются на прежних ключах.
      Лучший ключ — стабильный id из данных.
