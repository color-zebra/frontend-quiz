    explanation: |
      Экосистема JS: ECMAScript — стандарт языка; движок (V8, SpiderMonkey) превращает код в машинный; среда
      выполнения (браузер, Node.js, Deno, Bun) даёт API и глобальные объекты: DOM и `window` или `fs` и `global`.
      Код разбивается на токены, по ним строится AST, его выполняет интерпретатор, а горячий код компилирует JIT.
    links:
      - https://v8.dev/docs

  - id: js-064
    topic: JavaScript
    level: middle
    question: |
      В каком порядке выведутся числа?
    code: |
      setTimeout(() => console.log('1'), 0);
      console.log('2');

      new Promise((resolve, reject) => {
        console.log('3');
        setTimeout(() => {
          console.log('4');
          resolve('5');
          reject('6');
          console.log('7');
        });
      })
        .finally(() => {
          console.log('8');
          return '9';
        })
        .then(console.log)
        .catch(console.log)
        .then(() => console.log('10'));

      console.log('11');
      setTimeout(() => console.log('12'), 0);
    codeLang: js
    options:
      - text: '`2 3 11 1 4 7 8 5 10 12`'
        correct: true
        why: 'Синхронно — 2, 3 (тело промиса), 11. Потом таймеры по порядку: 1, затем 4 и 7, после этого таймера — микрозадачи 8, 5, 10, и последним таймер 12.'
      - text: '`2 3 11 1 4 7 8 9 10 12`'
        why: 'Значение из `finally` игнорируется — дальше идёт `''5''` из `resolve`.'
      - text: '`2 3 11 1 4 7 8 5 6 10 12`'
        why: '`reject` после `resolve` ничего не делает: промис уже выполнен, и `catch` пропускается.'
      - text: '`2 3 11 1 4 8 5 10 7 12`'
        why: '`7` выводится синхронно в том же колбэке таймера. Микрозадачи начнутся только после него.'
    explanation: |
      Синхронный код идёт первым, включая тело `new Promise`. Колбэки таймеров — макрозадачи, по одной за раз, в
      порядке постановки. После каждой макрозадачи выполняются все микрозадачи (`then`, `catch`, `finally`).
      Промис меняет состояние один раз, а `finally` пропускает исходное значение дальше.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Event_loop

  - id: js-065
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль (код — ES-модуль)?
    code: |
      function debounce(func, delay) {
        let timeoutId;
        return (...args) => {
          clearTimeout(timeoutId);
          timeoutId = setTimeout(() => func.apply(this, args), delay);
        };
      }

      const obj = {
        name: 'obj',
        log: debounce(function () {
          console.log(this);
        }, 100),
      };

      obj.log();
    codeLang: js
    options:
      - text: '`undefined`'
        correct: true
        why: 'Возвращаемая обёртка — стрелочная, её `this` берётся из вызова `debounce`, где он `undefined`. Чтобы сохранить `obj`, обёртка должна быть обычной функцией.'
      - text: '`{ name: ''obj'', log: ƒ }`'
        why: 'Так было бы, если бы обёртка была `function (...args)` — тогда `this` пришёл бы из вызова `obj.log()`.'
      - text: '`window`'
        why: 'В модуле код строгий, и `this` вне метода — `undefined`, а не `window`.'
      - text: 'Ничего не выведется'
        why: 'Таймер сработает через 100 мс и вызовет функцию.'
    explanation: |
      Debounce откладывает вызов, пока вызовы не прекратятся на `delay` мс, и выполняет только последний. Каждый
      новый вызов сбрасывает таймер. Чтобы обёртку можно было использовать как метод, её пишут обычной функцией и
      передают дальше `this` и аргументы.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/Arrow_functions

  - id: js-066
    topic: JavaScript
    level: middle
    question: |
      `d` вызвали три раза подряд за 10 мс. Сколько раз и с каким аргументом вызовется `save`?
    code: |
      const d = debounce(save, 300);
      d(1);
      d(2);
      d(3);
    codeLang: js
    options:
      - text: 'Один раз, с `3`'
        correct: true
        why: 'Каждый вызов сбрасывает таймер. Через 300 мс после последнего вызова выполнится только он.'
      - text: 'Один раз, с `1`'
        why: 'Так работает «leading»-вариант или throttle. Классический debounce берёт последний вызов.'
      - text: 'Три раза, с `1`, `2`, `3`'
        why: 'Debounce как раз схлопывает частые вызовы в один.'
      - text: 'Ни разу'
        why: 'Последний таймер не сбрасывается — вызов произойдёт.'
    explanation: |
      Debounce — «подожди тишины»: поиск по мере ввода, сохранение черновика, `resize`. Throttle — «не чаще раза в N
      мс». В React есть хук `useDebounce(value, delay)`: `setTimeout` в `useEffect` с очисткой при смене `value`.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/Debounce

  - id: js-067
    topic: JavaScript
    level: middle
    question: |
      Что вернёт `createCategoryTree(flatList)`?
    code: |
      const flatList = [
        { title: 'Root', parent: null },
        { title: 'Child1', parent: 'Root' },
        { title: 'Child2', parent: 'Root' },
        { title: 'Grandchild1', parent: 'Child1' },
      ];

      const createCategoryTree = (arr) => {
        const obj = {};
        arr.forEach((item) => {
          obj[item.title] = item;
        });
        arr.forEach((item) => {
          if (obj[item.parent]) {
            (obj[item.parent].children ??= []).push(item);
          }
        });
        return Object.values(obj).filter((value) => value.parent === null);
      };
    codeLang: js
    options:
      - text: 'Массив из одного `Root` с вложенными `children`'
        correct: true
        why: 'Первый проход строит словарь по `title`, второй кладёт каждого ребёнка в `children` родителя. В конце остаются только корни.'
      - text: 'Массив из всех четырёх элементов с `children`'
        why: 'Фильтр в конце оставляет только элементы с `parent === null`.'
      - text: 'Объект-словарь `{ Root: …, Child1: … }`'
        why: 'Словарь — промежуточный шаг. Вернётся `filter` по его значениям — массив.'
      - text: 'Пустой массив: дети не найдутся'
        why: 'Найдутся: словарь заполняется целиком до второго прохода.'
    explanation: |
      Построение дерева из плоского списка за `O(n)`: сначала индекс по id (здесь по `title`), потом каждому элементу
      ищется родитель в индексе. Побочный эффект — исходные объекты мутируются (им дописывается `children`), а не
      копируются.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/values

  - id: js-068
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      const a = {};
      const b = {};

      const obj = {};
      obj[a] = 1;
      obj[b] = 2;

      const map = new Map();
      map.set(a, 1);
      map.set(b, 2);

      console.log(Object.keys(obj).length, map.size);
    codeLang: js
    options:
      - text: '`1 2`'
        correct: true
        why: 'Ключи обычного объекта приводятся к строке — оба становятся `''[object Object]''`. `Map` хранит сами объекты как разные ключи.'
      - text: '`2 2`'
        why: 'Объект не умеет хранить объект-ключ: оба превратились в одну строку.'
      - text: '`1 1`'
        why: '`Map` сравнивает ключи по ссылке, `a` и `b` — разные объекты.'
      - text: '`0 2`'
        why: 'Запись в `obj` прошла — под строковым ключом `''[object Object]''`.'
    explanation: |
      `Map` лучше объекта, когда ключи не строки, важен порядок, часто добавляют и удаляют, нужен `size` или частый
      перебор. Объект — когда ключи строки, структура известна заранее, нужен JSON. `Set` хранит уникальные
      значения и быстро проверяет наличие.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Map

  - id: js-069
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      console.log(new Set([1, '1', 1, NaN, NaN]).size);
    codeLang: js
    options:
      - text: '`3`'
        correct: true
        why: 'Уникальные значения — `1`, `''1''` и `NaN`. Сравнение как в `SameValueZero`: `NaN` равен `NaN`, а число и строка разные.'
      - text: '`2`'
        why: 'Число `1` и строка `''1''` — разные значения, `Set` их не приводит.'
      - text: '`4`'
        why: '`Set` считает `NaN` равным `NaN`, поэтому второй не добавится.'
      - text: '`5`'
        why: 'Повторы `1` и `NaN` не добавляются.'
    explanation: |
      `Set` — коллекция уникальных значений. Сравнение — SameValueZero: как `===`, только `NaN` равен себе. Объекты
      сравниваются по ссылке. Частый приём — `[...new Set(arr)]` для удаления дубликатов.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Set

  - id: js-070
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      function nonStrict(a) {
        a = 100;
        console.log(arguments[0]);
      }

      function strict(a) {
        'use strict';
        a = 100;
        console.log(arguments[0]);
      }

      nonStrict(1);
      strict(1);
    codeLang: js
    options:
      - text: '`100`, `1`'
        correct: true
        why: 'В обычном режиме `arguments` связан с параметрами: изменение `a` видно в `arguments[0]`. В strict mode связи нет.'
      - text: '`1`, `1`'
        why: 'Без strict mode `arguments` и параметры — живые синонимы.'
      - text: '`100`, `100`'
        why: 'В strict mode `arguments` — снимок переданных значений.'
      - text: '`1`, `100`'
        why: 'Наоборот: связь есть только в нестрогом режиме.'
    explanation: |
      `arguments` — массивоподобный объект со всеми переданными аргументами. Он есть только в обычных функциях,
      стрелочные берут `arguments` внешней функции. Методов массива нет, превращают через `Array.from` или
      `[...arguments]`. `arguments.callee` запрещён в strict mode. В новом коде вместо `arguments` пишут rest
      `...args`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/arguments

  # ===================== TypeScript =====================
  - id: ts-001
    topic: TypeScript
    level: middle
    question: |
      Чему равен тип `R`?
    code: |
      type FirstArg<T> = T extends (first: infer A, ...rest: any[]) => any ? A : never;

      type R = FirstArg<(id: number, name: string) => void>;
    codeLang: ts
    options:
      - text: '`number`'
        correct: true
        why: '`infer A` стоит на месте первого параметра — TypeScript выводит его тип из переданной функции.'
      - text: '`string`'
        why: '`string` — тип второго параметра, он попадает в `...rest`.'
      - text: '`[number, string]`'
        why: 'Кортеж всех параметров даёт `Parameters<T>`, а здесь вытаскивается только первый.'
      - text: '`never`'
        why: '`never` получился бы, если бы `T` не была функцией. Здесь условие выполняется.'
    explanation: |
      `infer` работает только внутри условного типа: `T extends Pattern<infer U> ? U : never`. Если `T` подходит под
      шаблон, TypeScript «достаёт» тип на месте `infer U`. Так устроены встроенные `ReturnType`, `Parameters`,
      `Awaited`. Популярный кейс — вытащить параметр функции или тип элемента массива.
    links:
      - https://www.typescriptlang.org/docs/handbook/2/conditional-types.html#inferring-within-conditional-types

  - id: ts-002
    topic: TypeScript
    level: middle
    question: |
      Чему равен тип `Z`?
    code: |
      type ArrayElement<T> = T extends (infer U)[] ? U : never;

      type Z = ArrayElement<string>;
    codeLang: ts
    options:
      - text: '`never`'
        correct: true
        why: '`string` — не массив, условие `extends (infer U)[]` ложно, срабатывает ветка `never`.'
      - text: '`string`'
        why: 'Так было бы для `ArrayElement<string[]>`.'
      - text: '`unknown`'
        why: 'Если шаблон не совпал, `U` никуда не подставляется — берётся ветка «иначе».'
      - text: 'Ошибка компиляции'
        why: 'Ограничения на `T` нет, любой тип допустим.'
    explanation: |
      Условный тип — тернарный оператор на уровне типов: `T extends U ? X : Y`. Ветка `never` — способ сказать «такого
      значения быть не может». Для объединений условный тип применяется к каждому члену по отдельности.
    links:
      - https://www.typescriptlang.org/docs/handbook/2/conditional-types.html

  - id: ts-003
    topic: TypeScript
    level: middle
    question: |
      Какая строка не скомпилируется?
    code: |
      const colors = {
        red: [255, 0, 0],
        green: '#00ff00',
      } satisfies Record<string, string | number[]>;
      colors.green.toUpperCase(); // строка 5

      const colors2: Record<string, string | number[]> = {
        red: [255, 0, 0],
        green: '#00ff00',
      };
      colors2.green.toUpperCase(); // строка 11
    codeLang: ts
    options:
      - text: 'Строка 11'
        correct: true
        why: 'Аннотация сузила знания до `string | number[]`, а у массива нет `toUpperCase`. С `satisfies` TS помнит, что `green` — строка.'
      - text: 'Строка 5'
        why: '`satisfies` проверяет совместимость, но тип значения оставляет выведенным: `green` — `string`.'
      - text: 'Обе строки'
        why: 'Строка 5 проходит: тип `colors` выведен из литерала.'
      - text: 'Обе компилируются'
        why: 'В строке 11 TypeScript знает только тип из аннотации.'
    explanation: |
      `satisfies` (TypeScript 4.9) проверяет, что значение соответствует типу, но не меняет и не расширяет тип самого
      значения. Аннотация `: Type` делает переменную этим типом и теряет подробности. `satisfies` удобен для
      конфигов: проверка формы плюс точные типы полей.
    links:
      - https://www.typescriptlang.org/docs/handbook/release-notes/typescript-4-9.html#the-satisfies-operator

  - id: ts-004
    topic: TypeScript
    level: middle
    question: |
      Что выведет этот код после компиляции?
    code: |
      const x = 'hello' as unknown as number;
      console.log(typeof x);
    codeLang: ts
    options:
      - text: '`string`'
        correct: true
        why: '`as` — указание компилятору, а не преобразование. В рантайме в `x` по-прежнему строка.'
      - text: '`number`'
        why: 'Приведение типа в TS не меняет значение — после компиляции `as` просто исчезает.'
      - text: '`NaN`'
        why: '`typeof` возвращает строку с названием типа. Число из строки никто не делал.'
      - text: 'Ошибка компиляции'
        why: 'Через `unknown` можно привести что угодно. Прямой `''hello'' as number` был бы ошибкой.'
    explanation: |
      Приведение (type assertion, `as`) переопределяет тип для компилятора, например когда библиотека даёт неверные
      типы. Оно ничего не проверяет и не конвертирует. Компилятор разрешает `as` только между пересекающимися
      типами, а двойное `as unknown as T` — явный признак «я беру ответственность на себя».
    links:
      - https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#type-assertions

  - id: ts-005
    topic: TypeScript
    level: middle
    question: |
      Какой тип у `x` внутри функции и что будет при вызове `liveDangerously()`?
    code: |
      function liveDangerously(x?: number | null) {
        console.log(x!.toFixed());
      }

      liveDangerously();
    codeLang: ts
    options:
      - text: '`number | null | undefined`, при вызове — `TypeError`'
        correct: true
        why: '`?` добавляет `undefined` к типу. `!` убирает `null` и `undefined` только для компилятора — проверки в рантайме нет.'
      - text: '`number`, при вызове — `TypeError`'
        why: 'Сам параметр остаётся `number | null | undefined`. Узким его делает только `!` в выражении.'
      - text: '`number | null | undefined`, ошибка компиляции'
        why: 'С `!` компилятор не ругается — в этом и опасность.'
      - text: '`number | null`, выведется `undefined`'
        why: '`?` делает параметр необязательным, то есть добавляет `undefined`. А вызов `toFixed` у `undefined` падает.'
    explanation: |
      `?` помечает параметр или свойство необязательным. `!` (non-null assertion) говорит компилятору «здесь точно не
      `null` и не `undefined`» — берём участок кода под свой контроль. Если мы ошиблись, будет ошибка в рантайме.
      Безопаснее сузить тип проверкой или `?.`.
    links:
      - https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#non-null-assertion-operator-postfix-

  - id: ts-006
    topic: TypeScript
    level: middle
    question: |
      Какие присваивания скомпилируются при `strictFunctionTypes: true`?
    code: |
      class Animal { name = 'a'; }
      class Dog extends Animal { bark() {} }

      interface Producer<T> { produce: () => T; }
      interface Consumer<T> { consume: (arg: T) => void; }

      declare let animalProducer: Producer<Animal>;
      declare let dogProducer: Producer<Dog>;
      declare let animalConsumer: Consumer<Animal>;
      declare let dogConsumer: Consumer<Dog>;
    codeLang: ts
    options:
      - text: '`animalProducer = dogProducer`'
        correct: true
        why: 'Возвращаемое значение ковариантно: кто ждёт животное, получит собаку — и не сломается.'
      - text: '`dogConsumer = animalConsumer`'
        correct: true
        why: 'Аргументы контравариантны: функция, которая умеет любых животных, справится и с собакой.'
      - text: '`animalConsumer = dogConsumer`'
        why: 'Вызывающий может передать кошку, а функция внутри вызовет `bark()` — TS это запрещает.'
      - text: '`dogProducer = animalProducer`'
        why: 'Кто ждёт собаку, может получить произвольное животное без `bark`.'
    explanation: |
      Ковариантность — сложный тип сохраняет направление совместимости: `Dog extends Animal`, значит
      `Producer<Dog>` подходит как `Producer<Animal>`. Так ведут себя выходные позиции: свойства только для чтения и
      возвращаемые значения. Контравариантность — направление разворачивается: так ведут себя входные позиции,
      аргументы функций.
    links:
      - https://www.typescriptlang.org/docs/handbook/2/generics.html#variance-annotations

  - id: ts-007
    topic: TypeScript
    level: middle
    question: |
      Какая строка не скомпилируется при `strict: true`?
    code: |
      class Animal { name = 'a'; }
      class Dog extends Animal { bark() {} }

      interface WithMethod { handle(a: Animal): void; }
      interface WithProp { handle: (a: Animal) => void; }

      const m: WithMethod = { handle(d: Dog) { d.bark(); } };      // строка 7
      const p: WithProp = { handle: (d: Dog) => d.bark() };        // строка 8
    codeLang: ts
    options:
      - text: 'Только строка 8'
        correct: true
        why: '`strictFunctionTypes` проверяет параметры строго только у свойств-функций. Параметры методов остаются бивариантными.'
      - text: 'Только строка 7'
        why: 'Наоборот: метод (`handle(a): void`) проверяется мягко, а свойство-функция — строго.'
      - text: 'Обе строки'
        why: 'Для синтаксиса метода TypeScript по-прежнему допускает более узкий параметр — даже в строгом режиме.'
      - text: 'Обе компилируются'
        why: 'Свойство-функция с более узким параметром — ошибка при `strictFunctionTypes`.'
    explanation: |
      Бивариантность — тип одновременно ко- и контравариантен. Из-за легаси (например, методов массивов) параметры
      методов и конструкторов в TypeScript бивариантны всегда. `strictFunctionTypes` делает строго контравариантными
      все функциональные типы, кроме методов и конструкторов, например свойства вида `handle: (a: Animal) => void`. Отсюда совет: в интерфейсах описывать
      колбэки свойствами.
    links:
      - https://www.typescriptlang.org/tsconfig/#strictFunctionTypes

  - id: ts-008
    topic: TypeScript
    level: middle
    question: |
      Какие минусы TypeScript реальны?
    options:
      - text: 'Типы проверяются только при сборке, в рантайме проверок нет'
        correct: true
        why: 'Ответ API может не совпасть с типом — TS об этом не узнает. Для данных снаружи нужна валидация (zod и т. п.).'
      - text: 'Компиляция замедляется в больших проектах'
        correct: true
        why: 'Проверка типов — дорогая операция, её часто выносят в отдельный процесс.'
      - text: 'Типы библиотек бывают устаревшими или отсутствуют'
        correct: true
        why: '`@types/xxx` пишет сообщество, и они могут отставать от библиотеки.'
      - text: 'Код в браузере работает медленнее, чем на JavaScript'
        why: 'В браузер попадает обычный JavaScript, типы стираются. Скорость выполнения та же.'
      - text: 'Нельзя подключать библиотеки, написанные на JavaScript'
        why: 'Можно — с декларациями `.d.ts` или без типов через `any`.'
    explanation: |
      Минусы TypeScript: дольше писать, два языка вместо одного, сложный `tsconfig`, медленная компиляция, ложное
      чувство безопасности, сложный рефакторинг типов, проблемы с типами библиотек и динамическими данными. Может
      мешать в маленьких проектах, прототипах и при жёстких дедлайнах. Альтернативы — JSDoc, PropTypes (в React 19 удалены), постепенная
      типизация.
    links:
      - https://www.typescriptlang.org/docs/handbook/typescript-in-5-minutes.html

  - id: ts-009
    topic: TypeScript
    level: middle
    question: |
      Чему равен тип `Result`?
    code: |
      type Clean<T> = {
        -readonly [P in keyof T]-?: T[P];
      };

      type Result = Clean<{ readonly id: number; name?: string }>;
    codeLang: ts
    options:
      - text: '`{ id: number; name: string }`'
        correct: true
        why: '`-readonly` снимает `readonly`, `-?` — необязательность. Остаются обычные обязательные свойства.'
      - text: '`{ readonly id: number; name?: string }`'
        why: 'Минусы перед модификаторами их удаляют, а не сохраняют.'
      - text: '`{ id: number; name?: string }`'
        why: '`-?` убирает и `?` — `name` становится обязательным.'
      - text: '`{ readonly id: number; name: string }`'
        why: '`-readonly` убирает `readonly` у всех ключей.'
    explanation: |
      Модификаторы в mapped types: `readonly` и `?` добавляют, `-readonly` и `-?` удаляют, `+` — явное добавление.
      На этом построены `Readonly`, `Partial`, `Required`. Похожий самописный `Mutable<T>` — `-readonly` без
      `-?`.
    links:
      - https://www.typescriptlang.org/docs/handbook/2/mapped-types.html#mapping-modifiers

  - id: ts-010
    topic: TypeScript
    level: middle
    question: |
      Какие утверждения про enum верны (TypeScript 5+)?
    options:
      - text: 'Числовой enum даёт обратный маппинг: `Status[0]`'
        correct: true
        why: 'Компилятор генерирует объект, где есть и `Status.Active`, и `Status[0]`. Это лишний код в бандле.'
      - text: '`const enum` инлайнится и не оставляет объекта'
        correct: true
        why: 'Значения инлайнятся при компиляции, обращения к объекту в JS нет.'
      - text: 'Union строковых литералов не даёт кода в JS'
        correct: true
        why: '`type Status = ''active'' | ''pending''` целиком стирается при сборке — поэтому его и предлагают вместо enum.'
      - text: '`let s: Status = 999` компилируется без ошибок в TS 5'
        why: 'С TS 5.0 литерал вне значений enum — ошибка. Но `number`-переменную в числовой enum присвоить всё ещё можно.'
      - text: 'Строковый enum тоже даёт обратный маппинг'
        why: 'Обратный маппинг генерируется только для числовых членов.'
    explanation: |
      Enum критикуют: числовые генерируют лишний код с обратным маппингом, хуже поддаются tree shaking, числовые
      принимают любое `number` из переменной. Альтернативы — union types, объект `as const` с типом из его значений,
      `const enum` с оговорками.
    links:
      - https://www.typescriptlang.org/docs/handbook/enums.html

  - id: ts-011
    topic: TypeScript
    level: middle
    question: |
      Почему `declare const enum` из `.d.ts` библиотеки ломается в проектах, где код транспилирует Babel, esbuild или
      SWC?
    options:
      - text: 'Они транспилируют по файлу и не видят значений из других'
        correct: true
        why: 'Подставить значение из другого файла пофайловый транспилятор (`isolatedModules`) не может, а объекта для ambient-enum в рантайме нет.'
      - text: 'Они вообще не поддерживают синтаксис `enum` в TypeScript'
        why: 'Обычные enum они транспилируют, а локальный `const enum` превращают в обычный объект. Проблема в ambient-объявлении без кода.'
      - text: 'Они удаляют все типы при сборке, а enum — это только тип'
        why: 'Обычный enum — значение в рантайме. `const enum` исчезает из-за инлайнинга, а не потому что он тип.'
      - text: 'Они требуют выключить строгий режим флагом `strict: false`'
        why: '`strict` тут ни при чём — важна пофайловая сборка.'
    explanation: |
      `const enum` — оптимизированная версия: компилятор встраивает значения в места использования, объекта в JS нет.
      Ограничения: нет обратного маппинга, в отладке видны «магические числа», при пофайловой транспиляции (Next.js,
      Vite) локальный `const enum` становится обычным объектом, а `declare const enum` из `.d.ts` ломается. Флаг `preserveConstEnums` оставляет объект в выводе.
    links:
      - https://www.typescriptlang.org/docs/handbook/enums.html#const-enum-pitfalls

  - id: ts-012
    topic: TypeScript
    level: middle
    question: |
      Какие из этих утилит встроены в TypeScript?
    options:
      - text: '`Partial<T>`'
        correct: true
        why: 'Делает все свойства необязательными.'
      - text: '`Record<K, V>`'
        correct: true
        why: 'Объект с ключами `K` и значениями `V`.'
      - text: '`NonNullable<T>`'
        correct: true
        why: 'Убирает `null` и `undefined`.'
      - text: '`ReturnType<T>`'
        correct: true
        why: 'Тип возвращаемого значения функции.'
      - text: '`Nullable<T>`'
        why: 'Такой утилиты нет. Пишут сами: `type Nullable<T> = T | null`.'
      - text: '`Optional<T>`'
        why: 'Тоже нет — это самописное `T | undefined`.'
    explanation: |
      Встроенные утилиты: `Partial`, `Required`, `Readonly`, `Record`, `Pick`, `Omit`, `Exclude`, `Extract`,
      `NonNullable`, `Parameters`, `ConstructorParameters`, `ReturnType`, `InstanceType`, `Awaited`,
      `ThisParameterType`, `OmitThisParameter`, `ThisType`, строковые `Uppercase`, `Lowercase`, `Capitalize`,
      `Uncapitalize`.
    links:
      - https://www.typescriptlang.org/docs/handbook/utility-types.html

  - id: ts-013
    topic: TypeScript
    level: middle
    question: |
      Чему равны типы `E` и `X`?
    code: |
      type E = Exclude<'a' | 'b' | 'c', 'a' | 'b'>;
      type X = Extract<'a' | 'b' | 'c', 'a' | 'd'>;
    codeLang: ts
    options:
      - text: '`E = ''c''`, `X = ''a''`'
        correct: true
        why: '`Exclude` убирает из объединения указанные члены, `Extract` оставляет только общие. `''d''` в исходном объединении нет.'
      - text: '`E = ''c''`, `X = ''a'' | ''d''`'
        why: '`Extract` не добавляет новых членов — только те, что есть в первом объединении.'
      - text: '`E = ''a'' | ''b''`, `X = ''a''`'
        why: '`Exclude` возвращает то, что осталось после исключения, а не исключённое.'
      - text: '`E = ''c''`, `X = never`'
        why: '`''a''` есть в обоих объединениях — значит, `Extract` его оставит.'
    explanation: |
      `Exclude` и `Extract` работают с объединениями, `Omit` и `Pick` — с ключами объектов. Все четыре построены на
      условных типах, которые применяются к каждому члену объединения по отдельности.
    links:
      - https://www.typescriptlang.org/docs/handbook/utility-types.html#excludeuniontype-excludedmembers

  - id: ts-014
    topic: TypeScript
    level: middle
    question: |
      Чему равен тип `A`?
    code: |
      type A = Awaited<Promise<Promise<string>>>;
    codeLang: ts
    options:
      - text: '`string`'
        correct: true
        why: '`Awaited` разворачивает промисы рекурсивно — так же, как `await` в рантайме.'
      - text: '`Promise<string>`'
        why: '`Awaited` снимает все уровни вложенности, а не один.'
      - text: '`Promise<Promise<string>>`'
        why: 'Утилита как раз разворачивает промис.'
      - text: '`unknown`'
        why: 'Тип внутри промисов известен — `string`.'
    explanation: |
      `Awaited<T>` — тип, который получится после `await`. Часто вместе с `ReturnType`: `Awaited<ReturnType<typeof
      getData>>` — что вернёт async-функция после ожидания.
    links:
      - https://www.typescriptlang.org/docs/handbook/utility-types.html#awaitedtype

  - id: ts-015
    topic: TypeScript
    level: middle
    question: |
      Какая строка не скомпилируется?
    code: |
      class Pigeon { sound = 'coos'; }
      class Penguin { sound = 'peeps'; swim() {} }

      let a: Pigeon = new Penguin();                   // строка 4
      let b: Penguin = new Pigeon();                   // строка 5
    codeLang: ts
    options:
      - text: 'Строка 5'
        correct: true
        why: 'У `Pigeon` нет `swim`, а `Penguin` его требует.'
      - text: 'Строка 4'
        why: 'У `Penguin` есть всё, что нужно `Pigeon` (`sound`). Лишний `swim` не мешает — типизация структурная.'
      - text: 'Обе строки: это разные классы'
        why: 'TypeScript сравнивает форму, а не имя класса.'
      - text: 'Обе компилируются'
        why: 'Строке 5 не хватает метода `swim`.'
    explanation: |
      В TypeScript структурная («утиная») типизация: если объект выглядит как утка и крякает как утка — это утка.
      Совместимость определяется набором свойств, а не именем типа. Исключение — объектный литерал с лишним
      свойством: для него работает отдельная проверка excess property.
    links:
      - https://www.typescriptlang.org/docs/handbook/type-compatibility.html

  - id: ts-016
    topic: TypeScript
    level: middle
    question: |
      Какие утверждения про `interface` и `type` верны?
    options:
      - text: 'Слияние деклараций есть только у `interface`'
        correct: true
        why: 'Два `interface User` сольются в один. Два `type` с одним именем — ошибка «Duplicate identifier».'
      - text: 'Объединение `A | B` можно описать только через `type`'
        correct: true
        why: 'Интерфейс описывает форму объекта, а union, примитивы и кортежи — только `type`.'
      - text: 'Класс может реализовать (`implements`) и тот и другой'
        correct: true
        why: 'Если `type` описывает объект, `implements` работает с ним так же, как с интерфейсом.'
      - text: 'Интерфейс не может расширять `type`'
        why: 'Может: `interface B extends A {}`, если `A` — объектный тип.'
      - text: '`type` предназначен для объектов, `interface` — только для классов'
        why: 'Оба подходят для объектов и классов. Различие — в слиянии и в том, что `type` умеет union и примитивы.'
    explanation: |
      `interface` расширяется через `extends` и умеет слияние деклараций — им дополняют чужие типы (например,
      `Window`). `type` — псевдоним для любого типа: union, пересечение `&`, примитив, кортеж, условный и mapped тип.
      Для объектов подходят оба.
    links:
      - https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#differences-between-type-aliases-and-interfaces

  - id: ts-017
    topic: TypeScript
    level: middle
    question: |
      Что скажет компилятор?
    code: |
      interface User { name: string; }
      interface User { age: number; }

      const user: User = { name: 'Alice' };
    codeLang: ts
    options:
      - text: 'Ошибка: нет свойства `age`'
        correct: true
        why: 'Два объявления `User` слились в одно `{ name; age }`, и `age` обязателен.'
      - text: 'Ошибка: интерфейс `User` объявлен дважды'
        why: 'Повторное объявление интерфейса — не ошибка, а слияние.'
      - text: 'Всё скомпилируется: действует последнее объявление'
        why: 'Последнее не заменяет первое — они складываются.'
      - text: 'Всё скомпилируется: действует первое объявление'
        why: 'Свойства обоих объявлений объединяются.'
    explanation: |
      Merge интерфейсов (declaration merging): несколько объявлений с одним именем объединяются, и итоговый интерфейс
      содержит все свойства. Так расширяют глобальные типы и типы библиотек — например, добавляют поле в `Window`
      или атрибуты в `HTMLAttributes`.
    links:
      - https://www.typescriptlang.org/docs/handbook/declaration-merging.html

  - id: ts-018
    topic: TypeScript
    level: middle
    question: |
      Какие строки не скомпилируются?
    code: |
      const a: any = 'text';
      const u: unknown = 'text';

      a.toUpperCase();                                  // строка 4
      u.toUpperCase();                                  // строка 5
      if (typeof u === 'string') u.toUpperCase();       // строка 6
      const n: number = a;                              // строка 7
    codeLang: ts
    multiple: true
    options:
      - text: 'Строка 5'
        correct: true
        why: '`unknown` запрещает любые операции без проверки типа.'
      - text: 'Строка 4'
        why: '`any` отключает проверку: компилятор пропустит любой вызов.'
      - text: 'Строка 6'
        why: '`typeof` сузил `unknown` до `string` — вызов разрешён.'
      - text: 'Строка 7'
        why: '`any` присваивается куда угодно, даже в `number`. Поэтому он и опасен.'
    explanation: |
      `any` — отключает проверку типов и «заражает» всё, к чему прикасается. `unknown` — безопасный аналог: значение
      может быть чем угодно, но использовать его можно только после проверки. Поэтому для данных снаружи
      (`JSON.parse`, ответ API) лучше `unknown`. `void` — функция ничего не возвращает, `never` — не возвращает
      управление никогда (бросает ошибку или бесконечный цикл).
    links:
      - https://www.typescriptlang.org/docs/handbook/2/functions.html#unknown

  - id: ts-019
    topic: TypeScript
    level: middle
    question: |
      Зачем в `default` здесь переменная типа `never`?
    code: |
      type Shape = { kind: 'circle' } | { kind: 'square' } | { kind: 'triangle' };

      function area(s: Shape) {
        switch (s.kind) {
          case 'circle': return 1;
          case 'square': return 2;
          default: {
            const exhaustive: never = s;
            return exhaustive;
          }
        }
      }
    codeLang: ts
    options:
      - text: 'Чтобы компилятор упал, если какой-то вариант не обработан'
        correct: true
        why: 'Здесь забыт `triangle`: в `default` остаётся `{ kind: ''triangle'' }`, а в `never` его не присвоить — ошибка.'
      - text: 'Чтобы функция бросала исключение в рантайме'
        why: 'Присваивание в `never` ничего не бросает — это проверка только при компиляции.'
      - text: 'Чтобы тип возврата функции стал `never`'
        why: 'Тип возврата — объединение веток, в нормальном случае `number`.'
      - text: 'Это обход ошибки «not all code paths return a value»'
        why: 'Смысл в проверке полноты, а не в возврате значения.'
    explanation: |
      `never` — тип, у которого нет значений. В него можно присвоить только `never`. Если все варианты объединения
      обработаны, в `default` остаётся `never`, и присваивание проходит. Добавили новый вариант и забыли обработать —
      компилятор укажет место.
    links:
      - https://www.typescriptlang.org/docs/handbook/2/narrowing.html#exhaustiveness-checking

  - id: ts-020
    topic: TypeScript
    level: middle
    question: |
      Что делает возвращаемый тип `person is Woman` у функции?
    code: |
      function isWoman(person: Man | Woman): person is Woman {
        return 'braSize' in person;
      }
    codeLang: ts
    options:
      - text: 'Сужает тип `person` в ветке, где функция вернула `true`'
        correct: true
        why: 'После `if (isWoman(p))` внутри блока `p` — `Woman`, а в `else` — `Man`.'
      - text: 'Проверяет тип в рантайме автоматически'
        why: 'Проверку пишет разработчик — TypeScript верит возвращённому `boolean`.'
      - text: 'Превращает `person` в `Woman`, добавляя недостающие поля'
        why: 'Значение не меняется, сужается только тип для компилятора.'
      - text: 'Делает функцию доступной только для `Woman`'
        why: 'Параметр принимает `Man | Woman` — функция как раз их различает.'
    explanation: |
      Type guard — функция с возвращаемым типом-предикатом `x is T`. Её результат TypeScript использует для
      сужения. Встроенные защитники — `typeof`, `instanceof`, `in`, сравнение с литералом. Если предикат соврёт,
      компилятор этого не заметит.
    links:
      - https://www.typescriptlang.org/docs/handbook/2/narrowing.html#using-type-predicates

  - id: ts-021
    topic: TypeScript
    level: middle
    question: |
      Какой вызов не скомпилируется?
    code: |
      function getLength<T extends { length: number }>(value: T): number {
        return value.length;
      }
    codeLang: ts
    options:
      - text: '`getLength(42)`'
        correct: true
        why: 'У числа нет `length`, а ограничение `extends { length: number }` его требует.'
      - text: '`getLength(''hello'')`'
        why: 'У строки есть `length`.'
      - text: '`getLength([1, 2, 3])`'
        why: 'У массива есть `length`.'
      - text: '`getLength({ length: 0 })`'
        why: 'Объект подходит по форме.'
    explanation: |
      Дженерики делают код пригодным для повторного использования: функция работает с любым типом и сохраняет связь
      между входом и выходом. `extends` ограничивает, какие типы подходят. Дженерики используют в функциях,
      классах, интерфейсах, утилитных типах, в React — `useState<T>`.
    links:
      - https://www.typescriptlang.org/docs/handbook/2/generics.html#generic-constraints

  - id: ts-022
    topic: TypeScript
    level: middle
    question: |
      Какой вызов не скомпилируется?
    code: |
      function greet(name: string): string;
      function greet(name: string, age: number): string;
      function greet(name: string, age?: number | string): string {
        return age === undefined ? `Привет, ${name}!` : `Привет, ${name}, тебе ${age}!`;
      }
    codeLang: ts
    options:
      - text: '`greet(''Алекс'', ''25'')`'
        correct: true
        why: 'Снаружи видны только сигнатуры перегрузки. Сигнатура реализации с `string` наружу не попадает.'
      - text: '`greet(''Алекс'')`'
        why: 'Подходит первая перегрузка.'
      - text: '`greet(''Алекс'', 25)`'
        why: 'Подходит вторая перегрузка.'
      - text: 'Все компилируются'
        why: 'Вызов со строкой вторым аргументом не совпадает ни с одной перегрузкой.'
    explanation: |
      Перегрузка — несколько сигнатур для одной функции и одна реализация, которая покрывает их все. Вызывающий код
      видит только сигнатуры перегрузки, поэтому реализация может быть шире, но шире она не станет для вызовов.
    links:
      - https://www.typescriptlang.org/docs/handbook/2/functions.html#function-overloads

  - id: ts-023
    topic: TypeScript
    level: middle
    question: |
      Какие ключи будут у типа `UserGetters`?
    code: |
      type GenerateGetters<T> = {
        [K in keyof T as `get${Capitalize<K & string>}`]: () => T[K];
      };

      interface UserState {
        id: string;
        isPremium: boolean;
      }

      type UserGetters = GenerateGetters<UserState>;
    codeLang: ts
    options:
      - text: '`getId`, `getIsPremium`'
        correct: true
        why: '`as` переименовывает ключ по шаблону, а `Capitalize` поднимает первую букву.'
      - text: '`getid`, `getisPremium`'
        why: '`Capitalize` делает первую букву заглавной.'
      - text: '`id`, `isPremium`, `getId`, `getIsPremium`'
        why: '`as` заменяет ключ, а не добавляет новый рядом со старым.'
      - text: '`GetId`, `GetIsPremium`'
        why: 'Префикс `get` пишется в шаблоне как есть, с маленькой буквы.'
    explanation: |
      Здесь сразу три механизма: mapped type (`[K in keyof T]`) перебирает ключи, template literal type
      (`` `get${...}` ``) строит строку на уровне типов, `as` переименовывает ключ. `K & string` нужен, потому что
      ключи бывают ещё числами и символами.
    links:
      - https://www.typescriptlang.org/docs/handbook/2/mapped-types.html#key-remapping-via-as

  - id: ts-024
    topic: TypeScript
    level: middle
    question: |
      Что делает такой файл `images.d.ts`?
    code: |
      declare module '*.svg' {
        const content: string;
        export default content;
      }
    codeLang: ts
    options:
      - text: 'Говорит TS, что импорт `.svg` даёт строку'
        correct: true
        why: 'Теперь `import logo from ''./logo.svg''` компилируется, и `logo` — `string`. Сам импорт обрабатывает сборщик.'
      - text: 'Учит браузер загружать SVG как модуль'
        why: 'Файлы `.d.ts` вообще не попадают в JavaScript и ничего не делают в рантайме.'
      - text: 'Встраивает все SVG в бандл строкой'
        why: 'Встраиванием занимается сборщик (Vite, webpack). Декларация описывает только тип.'
      - text: 'Генерирует компонент React для каждого SVG'
        why: 'Это делают плагины вроде SVGR, а не декларации.'
    explanation: |
      Declaration-файлы `.d.ts` описывают только типы, без реализации, и не компилируются в JS. Они бывают для
      библиотек (`@types/lodash`), глобальных объектов (`declare global { interface Window {…} }`), модулей и ресурсов
      (`*.svg`, `*.module.css`). Генерируются автоматически при `declaration: true` или пишутся вручную. Риск —
      устаревшие или неверные декларации.
    links:
      - https://www.typescriptlang.org/docs/handbook/declaration-files/introduction.html

  # ===================== React =====================
  - id: react-001
    topic: React
    level: middle
    question: |
      Что из этого — HOC (Higher-Order Component)?
    options:
      - text: '`React.memo`'
        correct: true
        why: 'Принимает компонент и возвращает новый — мемоизированный.'
      - text: '`withRouter` из старого React Router'
        correct: true
        why: 'Оборачивает компонент и прокидывает в него данные роутера.'
      - text: '`withAuth(Component)` с проверкой входа'
        correct: true
        why: 'Классический HOC: общая логика вокруг любого компонента.'
      - text: '`useMemo`'
        why: 'Это хук: он мемоизирует значение внутри компонента, а не оборачивает компонент.'
      - text: '`createContext`'
        why: 'Создаёт объект контекста, компонент не принимает.'
    explanation: |
      HOC — функция, которая принимает компонент и возвращает новый компонент с дополнительной функциональностью. Это
      техника повторного использования логики: вместо дублирования проверки авторизации в каждом компоненте её
      выносят в `withAuth`. Сейчас чаще используют хуки, а HOC — для обёрток, библиотек (`connect` в Redux) и
      классовых компонентов.
    links:
      - https://legacy.reactjs.org/docs/higher-order-components.html

  - id: react-002
    topic: React
    level: middle
    question: |
      Какие утверждения про архитектуру Fiber верны?
    options:
      - text: 'Фазу рендера можно прервать и продолжить позже'
        correct: true
        why: 'Работа разбита на единицы (fiber-узлы), и React может уступить поток более срочной задаче.'
      - text: 'Обновления получают приоритеты'
        correct: true
        why: 'Ввод пользователя обрабатывается раньше, чем фоновые обновления — на этом держатся `startTransition` и `useDeferredValue`.'
      - text: 'Фаза коммита выполняется синхронно и не прерывается'
        correct: true
        why: 'Изменения в DOM применяются целиком за один проход, иначе пользователь увидел бы полуобновлённый интерфейс.'
      - text: 'Фаза коммита асинхронная: DOM обновляется частями между кадрами'
        why: 'Прерывается только рендер. Коммит всегда синхронный.'
      - text: 'Fiber появился в React 18 вместе с хуками'
        why: 'Fiber — React 16 (сентябрь 2017), хуки — React 16.8 (2019). В React 18 на Fiber появился конкурентный рендеринг.'
    explanation: |
      Fiber — архитектура согласования (reconciliation) с React 16, заменившая Stack Reconciler. В фазе рендера React
      строит новое дерево и сравнивает со старым — её можно приостановить. В фазе коммита изменения применяются к DOM
      синхронно. Планирует работу собственный планировщик React. На Fiber построены Suspense, конкурентный рендеринг
      и Server Components.
    links:
      - https://react.dev/learn/render-and-commit

  - id: react-003
    topic: React
    level: middle
    question: |
      Перерисуется ли `MemoizedChild`, когда меняется `state` у `Parent` (проект без React Compiler)?
    code: |
      const Parent = () => {
        const [state, setState] = useState(0);
        const config = { color: 'red', size: 'large' };
        const onClick = () => console.log('click');

        return <MemoizedChild config={config} onClick={onClick} />;
      };
    codeLang: jsx
    options:
      - text: 'Да, при каждом рендере `Parent`'
        correct: true
        why: '`config` и `onClick` создаются заново на каждом рендере. `React.memo` сравнивает пропсы поверхностно, по ссылке, и видит новые значения.'
      - text: 'Нет: пропсы по содержимому не изменились'
        why: '`React.memo` не сравнивает содержимое объектов — только ссылки.'
      - text: 'Только первый раз, потом `memo` закэширует'
        why: 'Кэш сбрасывается при каждом новом пропсе, а новые ссылки приходят каждый раз.'
      - text: 'Нет: `memo` вообще не реагирует на функции в пропсах'
        why: 'Функции сравниваются по ссылке, как и объекты.'
    explanation: |
      `React.memo` пропускает рендер, если пропсы поверхностно равны. Чтобы он работал, ссылки должны быть
      стабильными: объекты — через `useMemo`, функции — через `useCallback`, или передавать примитивы. Вторым
      аргументом `memo` можно передать свою функцию сравнения.
    links:
      - https://react.dev/reference/react/memo

  - id: react-004
    topic: React
    level: middle
    question: |
      Что означает `true`, которое возвращает функция сравнения во втором аргументе `React.memo`?
    code: |
      const UserProfile = React.memo(
        ({ user, settings }) => <div>{user.name} - {settings.theme}</div>,
        (prevProps, nextProps) =>
          prevProps.user.name === nextProps.user.name &&
          prevProps.settings.theme === nextProps.settings.theme,
      );
    codeLang: jsx
    options:
      - text: 'Пропсы равны — рендер пропустить'
        correct: true
        why: 'Функция отвечает на вопрос «равны ли пропсы». `true` — равны, React возьмёт прошлый результат.'
      - text: 'Пропсы изменились — нужно перерисовать'
        why: 'Это наоборот: так работал `shouldComponentUpdate`, где `true` значит «рендерить».'
      - text: 'Сравнение прошло без ошибок'
        why: 'Результат — это ответ «равны ли пропсы», а не статус проверки.'
      - text: 'Компонент нужно размонтировать'
        why: 'Функция сравнения влияет только на то, пропустить ли рендер.'
    explanation: |
      У `React.memo` и `shouldComponentUpdate` противоположный смысл возвращаемого значения: `arePropsEqual` вернул
      `true` — рендера не будет; `shouldComponentUpdate` вернул `true` — рендер будет. Своя функция сравнения нужна,
      когда важна только часть пропсов.
    links:
      - https://react.dev/reference/react/memo#specifying-a-custom-comparison-function

  - id: react-005
    topic: React
    level: middle
    question: |
      Кто покажет запасной интерфейс, если чанк `React.lazy`-компонента не загрузился из-за ошибки сети?
    options:
      - text: 'Ближайший Error Boundary'
        correct: true
        why: 'Ошибка загрузки — это ошибка рендера. Suspense умеет только ждать, а ошибки ловит граница ошибок.'
      - text: 'Ближайший `Suspense` через `fallback`'
        why: '`fallback` показывается, пока загрузка идёт. После ошибки Suspense её не обработает.'
      - text: '`React.lazy` сам покажет пустой компонент'
        why: '`lazy` пробрасывает ошибку дальше, а не прячет её.'
      - text: 'Браузер повторит загрузку автоматически'
        why: 'Повторную попытку делают вручную, React этого не делает.'
    explanation: |
      `React.lazy(() => import('./MyComponent'))` загружает код компонента при первом рендере — так уменьшают
      начальный бандл (code splitting). `Suspense` (с React 16.6) показывает `fallback`, пока загрузка идёт, и
      поддерживает вложенность. Ошибки загрузки и рендера обрабатывает Error Boundary — Suspense их не заменяет.
    links:
      - https://react.dev/reference/react/lazy

  - id: react-006
    topic: React
    level: middle
    multiple: true
    question: |
      В списке неуправляемых `<input>` (без `value`) стоит `key={index}`. Пользователь ввёл текст в первое поле и удалил первый элемент списка. Что
      произойдёт с введённым текстом?
