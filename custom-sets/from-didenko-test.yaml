  - id: js-052
    topic: JavaScript
    level: middle
    question: |
      Чем `stopImmediatePropagation()` отличается от `stopPropagation()`?
    options:
      - text: 'Ещё и не пускает другие обработчики этого элемента'
        correct: true
        why: '`stopPropagation` останавливает путь события к другим элементам, а остальные обработчики текущего элемента выполнятся.'
      - text: 'Ещё и отменяет действие браузера по умолчанию'
        why: 'Действие по умолчанию отменяет только `preventDefault()`, распространение тут ни при чём.'
      - text: 'Останавливает только погружение, а не всплытие'
        why: 'Оба метода останавливают распространение в любой фазе.'
      - text: 'Ничем, это старое название того же метода'
        why: 'Это разные методы с разным поведением.'
    explanation: |
      Событие идёт в три фазы: погружение от `window` к цели, фаза цели, всплытие обратно. `stopPropagation`
      останавливает движение дальше, `stopImmediatePropagation` — ещё и остальные обработчики на текущем элементе,
      `preventDefault` — действие браузера (переход по ссылке, отправку формы).
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Event/stopImmediatePropagation

  - id: js-053
    topic: JavaScript
    level: middle
    question: |
      В каком порядке сработают обработчики при клике на `button`?
    code: |
      // <div id="parent"><button id="child">Нажми</button></div>
      parent.addEventListener('click', () => console.log('parent bubble'));
      parent.addEventListener('click', () => console.log('parent capture'), true);
      child.addEventListener('click', () => console.log('child'));
    codeLang: js
    options:
      - text: '`parent capture`, `child`, `parent bubble`'
        correct: true
        why: 'Сначала погружение сверху вниз (обработчик с `true`), потом цель, потом всплытие вверх.'
      - text: '`child`, `parent bubble`, `parent capture`'
        why: 'Обработчик с `true` срабатывает при погружении — до цели.'
      - text: '`parent bubble`, `parent capture`, `child`'
        why: 'Порядок фаз не зависит от порядка `addEventListener`.'
      - text: '`child`, `parent capture`, `parent bubble`'
        why: 'Погружение идёт раньше фазы цели.'
    explanation: |
      `addEventListener(type, handler, true)` или `{ capture: true }` — обработчик на фазе погружения. По умолчанию
      (`false`) — на фазе всплытия. Погружение идёт от `window` вниз к цели, всплытие — от цели вверх.
    links:
      - https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting/Event_bubbling

  - id: js-054
    topic: JavaScript
    level: middle
    question: |
      Где `...` работает как rest, а не как spread?
    options:
      - text: '`function f(...args) {}`'
        correct: true
        why: 'В параметрах `...` собирает оставшиеся аргументы в настоящий массив.'
      - text: '`const [first, ...others] = arr`'
        correct: true
        why: 'В левой части деструктуризации — тоже сбор остатка.'
      - text: '`const { id, ...props } = obj`'
        correct: true
        why: 'Rest в деструктуризации объекта собирает оставшиеся свойства.'
      - text: '`Math.max(...numbers)`'
        why: 'При вызове `...` разворачивает массив в аргументы — это spread.'
      - text: '`const copy = [...arr]`'
        why: 'В литерале массива — spread, разворачивание.'
    explanation: |
      Синтаксис один, смысл зависит от места. Spread разворачивает массив или объект: в вызове функции, литерале
      массива или объекта. Rest собирает: в параметрах функции и в левой части деструктуризации.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/rest_parameters

  - id: js-055
    topic: JavaScript
    level: middle
    question: |
      С какой ошибкой отклонится промис fetch, если вызвать `controller.abort()`?
    code: |
      const controller = new AbortController();
      fetch('/api/data', { signal: controller.signal })
        .catch((error) => console.log(error.name));
      controller.abort();
    codeLang: js
    options:
      - text: '`AbortError`'
        correct: true
        why: 'Прерванный fetch отклоняется с `DOMException` по имени `AbortError` — по нему отличают отмену от сетевой ошибки.'
      - text: '`TypeError`'
        why: 'TypeError fetch даёт при сетевой ошибке, а отмена — отдельная ошибка.'
      - text: '`TimeoutError`'
        why: 'Так называется ошибка `AbortSignal.timeout()`, а ручной `abort()` даёт `AbortError`.'
      - text: 'Ничего: промис останется ждать'
        why: 'После `abort()` промис сразу отклоняется.'
    explanation: |
      `AbortController` — современный способ прервать fetch. Это API окружения (браузера и Node), а не часть
      ECMAScript. Сигнал передают в запрос, `abort()` его прерывает. Тот же сигнал понимают `addEventListener` и
      многие библиотеки. У XHR есть свой метод `xhr.abort()`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/AbortController

