      Что такое Partial Hydration (архитектура островов)?
    options:
      - text: 'Статичный HTML, JS оживляет только «острова»'
        correct: true
        why: 'Почти ноль JS на клиенте, гидрируются отдельные компоненты — например, в Astro при появлении в видимой области (`client:visible`).'
      - text: 'Гидратация всей страницы частями сверху вниз'
        why: 'Острова гидрируются независимо, остальная страница не гидрируется вовсе.'
      - text: 'Рендеринг всей страницы только на клиенте'
        why: 'Острова рендерятся на сервере, на клиенте только оживают.'
      - text: 'Разделение страницы между микрофронтендами'
        why: 'Это про команды и деплой, а не про гидратацию.'
    explanation: |
      Проблема классического SSR и SSG: HTML пришёл, но страница «мертва», пока не скачан и не выполнен весь JS для
      гидратации — страдает INP. Решения: острова (Astro), Streaming SSR с селективной гидратацией (React 18+), Server
      Components.
    links:
      - https://docs.astro.build/en/concepts/islands/

  - id: arch-020
    topic: Архитектура
    level: middle
    question: |
      Что даёт селективная гидратация в Streaming SSR (React 18+)?
    options:
      - text: 'Части оживают по мере прихода, кликнутая первой'
        correct: true
        why: 'React не ждёт весь HTML и JS. Если пользователь кликнул по ещё не гидрированному блоку, его приоритет повышается.'
      - text: 'Гидратация отключается для всей страницы'
        why: 'Без гидратации не будет интерактивности.'
      - text: 'Сервер ждёт все данные и отдаёт страницу целиком'
        why: 'Это классический SSR «всё или ничего», от которого стриминг избавляет.'
      - text: 'Гидратация идёт строго сверху вниз по документу'
        why: 'Порядок определяется приходом данных и действиями пользователя.'
    explanation: |
      Streaming SSR: сервер сразу отдаёт оболочку страницы, медленные части в `<Suspense>` дописывает в поток по
      готовности, а браузер гидрирует пришедшие части независимо. Это решает проблемы «белого экрана» и «мёртвой»
      страницы классического SSR.
    links:
      - https://github.com/reactwg/react-18/discussions/37

  - id: arch-021
    topic: Архитектура
    level: middle
    question: |
      К какой группе запахов кода относится Shotgun Surgery — когда любое изменение требует мелких правок во многих
      классах?
    options:
      - text: 'Утяжелители изменений'
        correct: true
        why: 'Одна обязанность размазана по множеству мест — каждое изменение превращается в выстрел дробью.'
      - text: 'Раздувальщики'
        why: 'Это про слишком большие методы, классы и списки параметров.'
      - text: 'Замусориватели'
        why: 'Это про лишнее: мёртвый код, дубли, ленивые классы.'
      - text: 'Опутыватели связями'
        why: 'Это про излишнюю связанность: Feature Envy, цепочки вызовов, посредники.'
    explanation: |
      Группы запахов: раздувальщики (Long Method, Large Class, Primitive Obsession, Long Parameter List, Data Clumps),
      нарушители ООП (Switch Statements, Temporary Field, Refused Bequest), утяжелители изменений (Divergent Change,
      Shotgun Surgery, Parallel Inheritance Hierarchies), замусориватели (Comments, Duplicate Code, Lazy Class, Dead
      Code, Speculative Generality), опутыватели связями (Feature Envy, Inappropriate Intimacy, Message Chains, Middle
      Man).
    links:
      - https://refactoring.guru/refactoring/smells

  - id: arch-022
    topic: Архитектура
    level: middle
    question: |
      Какие утверждения про сборщики верны?
    options:
      - text: 'Webpack выносит общий код через SplitChunksPlugin'
        correct: true
        why: 'Это автоматическое разделение помимо entry points и динамических `import()`.'
      - text: 'Динамический `import()` создаёт отдельный чанк'
        correct: true
        why: 'Это основной механизм code splitting.'
      - text: 'Tree shaking надёжно работает только с ES-модулями'
        correct: true
        why: 'Статический анализ надёжен на `import`/`export`. Webpack 5 частично разбирает CommonJS, но рассчитывать на это не стоит.'
      - text: 'Vite делает tree shaking и в dev-режиме'
        why: 'В разработке Vite отдаёт модули браузеру без сборки, вырезание неиспользуемого — только при продакшн-сборке.'
      - text: 'Webpack делает tree shaking в режиме `development`'
        why: 'Удаление неиспользуемого включается в `production`, когда работает минификатор.'
    explanation: |
      Webpack: tree shaking в production (пометка неиспользуемых экспортов + удаление минификатором), code splitting
      через entry, `import()` и SplitChunksPlugin. Vite: dev-сервер на нативных ES-модулях, продакшн-сборка на Rollup
      (в Vite 8 — Rolldown). Rollup силён в tree shaking и для библиотек. esbuild очень быстрый, code splitting —
      только для формата ESM.
    links:
      - https://vite.dev/guide/features

  - id: arch-023
    topic: Архитектура
    level: middle
    question: |
      Где хранить фильтры и сортировку списка, которыми пользователь хочет поделиться ссылкой?
    options:
      - text: 'В query-параметрах URL'
        correct: true
        why: 'Ссылка становится единственным источником правды: её можно отправить, и откроется то же состояние.'
      - text: 'В глобальном сторе Redux'
        why: 'Состояние не попадёт в ссылку и пропадёт при перезагрузке.'
      - text: 'В локальном `useState` компонента'
        why: 'Тоже не переживёт ссылку и перезагрузку.'
      - text: 'В кэше TanStack Query'
        why: 'Это кэш серверных данных, а не состояние интерфейса.'
    explanation: |
      Четыре вида состояния: серверное — TanStack Query или RTK Query (кэш, ревалидация, дедупликация); глобальное
      клиентское — Zustand, Redux Toolkit, Effector, MobX (тема, сессия, локаль); локальное — `useState`,
      `useReducer` (шторки, табы); URL — `useSearchParams` (фильтры, поиск). Связанные сущности нормализуют по `id`.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/overview

  - id: arch-024
    topic: Архитектура
    level: middle
    multiple: true
    question: |
      Когда микрофронтенды оправданы?
    options:
      - text: 'Части продукта делают независимые команды со своими релизами'
        correct: true
        why: 'Главная выгода — независимый деплой и автономия команд. Ради неё платят сложностью инфраструктуры.'
      - text: 'Небольшое приложение, над которым работают 3 человека'
        why: 'Затраты на инфраструктуру не окупятся — хватит монолита или монорепозитория.'
      - text: 'Нужно уменьшить размер бандла'
        why: 'Микрофронтенды часто, наоборот, дублируют зависимости.'
      - text: 'Хочется быстрее запустить новый проект'
        why: 'Старт с микрофронтендами дольше: нужно настроить инфраструктуру.'
    explanation: |
      Микрофронтенды (Module Federation, Web Components): хост подключает удалённые приложения (`remotes`), удалённые
      отдают модули (`exposes`), общие зависимости объявляют в `shared` (лучше синглтонами). Плюсы — автономия,
      независимые релизы, изоляция ошибок. Минусы — долгий старт, дубли зависимостей, сложные интеграционные тесты и
      онбординг. Монорепозиторий (Nx, Turborepo) — альтернатива для одной большой команды.
    links:
      - https://webpack.js.org/concepts/module-federation/

  - id: arch-025
    topic: Архитектура
    level: middle
    question: |
      Какой принцип ООП показывает массив животных, у каждого из которых свой `speak()`?
    code: |
      const animals = [new Dog('Рекс'), new Cat('Мурка')];
      animals.forEach((animal) => animal.speak());
    codeLang: js
    options:
      - text: 'Полиморфизм'
        correct: true
        why: 'Разные объекты отвечают на один и тот же вызов по-своему через общий интерфейс.'
      - text: 'Инкапсуляция'
        why: 'Инкапсуляция — скрытие внутреннего устройства и данных.'
      - text: 'Наследование'
        why: 'Наследование здесь есть, но смысл примера — единый вызов с разным поведением.'
      - text: 'Абстракция'
        why: 'Абстракция — выделение существенного интерфейса и сокрытие сложности.'
    explanation: |
      Четыре принципа ООП: инкапсуляция (`#balance` и доступ через методы), наследование (`class Dog extends Animal`),
      полиморфизм (общий интерфейс — разное поведение), абстракция (наружу только нужный интерфейс). Полиморфизм бывает
      подтипов (через наследование и интерфейсы), параметрический (дженерики) и ad-hoc (перегрузка, приведение типов).
    links:
      - https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Advanced_JavaScript_objects/Object-oriented_programming

  - id: arch-026
    topic: Архитектура
    level: middle
    question: |
      Какая парадигма лежит в основе подхода React «описываем, как UI выглядит при данном состоянии»?
    options:
      - text: 'Декларативная'
        correct: true
        why: 'Описываем результат, а не шаги по изменению DOM — их делает React.'
      - text: 'Императивная'
        why: 'Императивно — вручную вызывать `appendChild` и `setAttribute` по шагам.'
      - text: 'Процедурная'
        why: 'Это императивная программа, разбитая на процедуры.'
      - text: 'Объектно-ориентированная'
        why: 'Функциональные компоненты React — не про классы и объекты.'
    explanation: |
      Императивная — конкретные шаги по порядку. Процедурная — то же, разбитое на функции. Функциональная — функции
      без побочных эффектов. Декларативная — описываем что, а не как. ООП — сущности как объекты. Событийно-
      ориентированная — выполнение определяют события. Реактивная — изменения распространяются по зависимостям, как
      формулы в Excel.
    links:
      - https://react.dev/learn/reacting-to-input-with-state

  - id: arch-027
    topic: Архитектура
    level: middle
    question: |
      Какому паттерну соответствует описание «упрощённый интерфейс к сложной подсистеме»?
    options:
      - text: 'Facade'
        correct: true
        why: 'Как оплата Apple Pay: одно касание телефоном, а внутри много шагов.'
      - text: 'Adapter'
        why: 'Адаптер согласует несовместимые интерфейсы, как переходник для розетки.'
      - text: 'Decorator'
        why: 'Декоратор добавляет поведение обёрткой, не упрощая систему.'
      - text: 'Singleton'
        why: 'Синглтон гарантирует один экземпляр класса.'
    explanation: |
      GoF делит паттерны на порождающие (Singleton, Builder, Factory Method, Abstract Factory, Prototype), структурные
      (Facade, Adapter, Decorator) и поведенческие (Observer, Template Method, Iterator). GRASP — общие принципы
      распределения обязанностей: информационный эксперт, низкая связанность и высокое зацепление, контроллер,
      полиморфизм, чистая выдумка, перенаправление, устойчивость к изменениям.
    links:
      - https://refactoring.guru/design-patterns/facade

  - id: arch-028
    topic: Архитектура
    level: middle
    question: |
      Где по модели «трофея тестирования» сосредоточена основная масса фронтенд-тестов?
    options:
      - text: 'В интеграционных тестах'
        correct: true
        why: 'Компонент + стейт + API-клиент с замоканной сетью (RTL и MSW) дают больше всего уверенности на единицу затрат.'
      - text: 'В E2E-тестах'
        why: 'Они дают максимум уверенности, но медленные и нестабильные — их держат для критических сценариев.'
      - text: 'В unit-тестах каждого UI-компонента'
        why: 'Такие тесты хрупкие: ломаются от смены вёрстки при работающем приложении.'
      - text: 'В ручном тестировании'
        why: 'Ручное тестирование не масштабируется на каждый коммит.'
    explanation: |
      Трофей снизу вверх: статика (TypeScript, ESLint) — фундамент; unit — для функций с плотной логикой; integration —
      основной слой, тест «как пользователь»; E2E (Playwright, Cypress) — 10–30 ключевых сценариев. Хорошие тесты
      переживают рефакторинг без правок. Shift Left — тестировать на всех этапах разработки.
    links:
      - https://kentcdodds.com/blog/the-testing-trophy-and-testing-classifications

  - id: arch-029
    topic: Архитектура
    level: middle
    question: |
      Зачем отдавать клиенту DTO, а не объект сущности целиком?
    options:
      - text: 'Чтобы передать только нужные поля и не утечь лишним'
        correct: true
        why: 'Например, хэш пароля и служебные поля сущности не должны уйти в ответ API.'
      - text: 'Чтобы на клиенте работали методы бизнес-логики сущности'
        why: 'DTO — только данные, методов в нём нет.'
      - text: 'Чтобы данные нельзя было сериализовать'
        why: 'Наоборот, DTO легко сериализуется в JSON.'
      - text: 'Чтобы хранить данные в базе'
        why: 'В базе живут сущности, DTO — для передачи между слоями.'
    explanation: |
      DTO (Data Transfer Object) — простой объект для передачи данных между слоями или клиентом и сервером: только
      данные, обычно неизменяемый, сериализуемый. DDD (Domain-Driven Design) — подход, где в центре моделирование
      предметной области вместе с экспертами бизнеса.
    links:
      - https://martinfowler.com/eaaCatalog/dataTransferObject.html

  - id: arch-030
    topic: Архитектура
    level: middle
    question: |
      Что делает `switchMap` в этом потоке поиска?
    code: |
      fromEvent(searchInput, 'input')
        .pipe(
          map((event) => event.target.value),
          debounceTime(300),
          distinctUntilChanged(),
          filter((query) => query.length >= 3),
          switchMap((query) => fetch(`/api/search?q=${query}`).then((r) => r.json())),
        )
        .subscribe(displayResults);
    codeLang: js
    options:
      - text: 'Переключается на новый запрос и игнорирует ответ прошлого'
        correct: true
        why: 'Устаревший результат не попадёт в `displayResults`. Но сам `fetch` не прерывается — для настоящей отмены нужен `AbortController` или `fromFetch`.'
      - text: 'Ставит запросы в очередь и выполняет по одному'
        why: 'Очередь — это `concatMap`.'
      - text: 'Запускает все запросы параллельно и отдаёт все ответы'
        why: 'Это `mergeMap`.'
      - text: 'Игнорирует новые запросы, пока не закончился текущий'
        why: 'Это `exhaustMap`.'
    explanation: |
      Реактивное программирование — потоки данных и распространение изменений: «когда это происходит, сделай то»,
      как формулы в Excel. RxJS даёт Observable и операторы: `debounceTime` — пауза, `distinctUntilChanged` — без
      повторов, `filter`, `switchMap`. Нужен при сложной асинхронности, отмене, комбинировании потоков, real-time. Для
      одного клика и одного запроса — избыточен.
    links:
      - https://rxjs.dev/api/operators/switchMap
