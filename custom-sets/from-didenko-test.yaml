    explanation: |
      Порядок проверен на React 19: рендер-фаза идёт от родителя к детям; в коммите сначала привязываются ref-ы и
      выполняются layout-эффекты (от детей к родителю), затем, после отрисовки, — обычные эффекты (тоже от детей к
      родителю).
    links:
      - https://react.dev/learn/render-and-commit

  - id: react-025
    topic: React
    level: middle
    question: |
      Компонент смонтировался, вывел `Render: 0`, `useLayoutEffect: 0`, `useEffect: 0`. Потом вызвали `setCount(1)`.
      Что выведется дальше?
