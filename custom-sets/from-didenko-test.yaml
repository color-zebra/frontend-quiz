        });

        return <div>{count}</div>;
      };
    codeLang: jsx
    options:
      - text: '`Render: 1`, `Cleanup useLayoutEffect: 0`, `useLayoutEffect: 1`, `Cleanup useEffect: 0`, `useEffect: 1`'
        correct: true
        why: 'Сначала рендер. Потом в коммите очистка старого layout-эффекта и новый layout-эффект. После отрисовки — очистка старого обычного эффекта и новый.'
      - text: '`Cleanup useLayoutEffect: 0`, `Cleanup useEffect: 0`, `Render: 1`, `useLayoutEffect: 1`, `useEffect: 1`'
        why: 'Очистка не идёт перед рендером: React сначала вычисляет новый результат, а чистит уже в коммите.'
      - text: '`Render: 1`, `Cleanup useLayoutEffect: 0`, `Cleanup useEffect: 0`, `useLayoutEffect: 1`, `useEffect: 1`'
        why: 'Очистка обычного эффекта откладывается вместе с ним — на после отрисовки, а не сразу.'
      - text: '`Render: 1`, `useLayoutEffect: 1`, `useEffect: 1`, `Cleanup useLayoutEffect: 0`, `Cleanup useEffect: 0`'
        why: 'Очистка старого эффекта всегда идёт перед запуском нового.'
    explanation: |
      Для каждого эффекта правило «очистка старого → запуск нового». Layout-эффекты (вместе с их очистками)
      выполняются синхронно в коммите, до отрисовки. Обычные эффекты и их очистки — после отрисовки. Порядок
      проверен на React 19.
    links:
      - https://react.dev/reference/react/useEffect#how-to-handle-the-effect-firing-twice-in-development

  - id: react-026
