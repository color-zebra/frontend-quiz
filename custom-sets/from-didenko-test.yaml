    explanation: |
      Батчинг — React группирует несколько обновлений состояния в один рендер. До React 18 только в обработчиках
      событий, с React 18 — везде, включая промисы и `setTimeout`. Отключить точечно можно через `flushSync`. Для
      обновления на основе предыдущего значения нужна функция: `setCount((c) => c + 1)`.
    links:
      - https://react.dev/learn/queueing-a-series-of-state-updates

  - id: react-028
    topic: React
    level: middle
    question: |
      Что такое reconciliation в React?
    options:
      - text: 'Сравнение нового дерева элементов с предыдущим'
        correct: true
        why: 'React сравнивает два виртуальных дерева и вычисляет минимальные изменения для реального DOM.'
      - text: 'Сравнение виртуального DOM с реальным DOM в браузере'
        why: 'Реальный DOM React не читает для сравнения — сравниваются старое и новое виртуальные деревья.'
      - text: 'Полная перерисовка DOM при каждом изменении состояния'
        why: 'Наоборот, цель — менять только то, что изменилось.'
      - text: 'Синхронизация состояния между вкладками браузера'
        why: 'Это вообще не про React.'
    explanation: |
      Virtual DOM — лёгкое представление интерфейса в объектах. Алгоритм сравнения опирается на две эвристики:
      элементы разных типов дают разные деревья (ветка пересоздаётся целиком), а `key` помогает узнавать элементы при
      перестановке. Это даёт `O(n)` вместо дорогого поиска оптимальной разницы.
    links:
      - https://legacy.reactjs.org/docs/reconciliation.html

  - id: react-029
    topic: React
