  # ===================== Next.js =====================
  - id: next-001
    topic: Next.js
    level: middle
    multiple: true
    question: |
      Что делает файл `app/dashboard/loading.js` в App Router?
    options:
      - text: 'Оборачивает страницу маршрута в `<Suspense>` со своим содержимым как fallback'
        correct: true
        why: 'Клиент сразу получает скелетон из `loading.js`, а контент страницы досылается потоком, когда данные готовы.'
      - text: 'Показывает индикатор загрузки только при переходе на клиенте'
        why: 'Он работает и при первом запросе страницы: сервер стримит fallback первым.'
      - text: 'Загружает данные для страницы до рендера'
        why: 'Данные загружает сама страница, `loading.js` — только UI на время ожидания.'
      - text: 'Включает статическую генерацию маршрута'
