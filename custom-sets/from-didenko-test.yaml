      - text: 'Сборщик мусора и куча'
        correct: true
        why: 'Управление памятью — часть движка.'
      - text: 'libuv'
        why: 'libuv — библиотека Node.js для асинхронного ввода-вывода, не часть V8.'
      - text: 'DOM API'
