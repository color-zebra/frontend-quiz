    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/null

  - id: js-025
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      console.log(JSON.stringify({ a: 1, b: 2, c: 3 }, ['a', 'c']));
    codeLang: js
    options:
      - text: '`{"a":1,"c":3}`'
        correct: true
        why: 'Массив во втором аргументе — белый список ключей: в результат попадут только `a` и `c`.'
      - text: '`{"b":2}`'
        why: 'Массив перечисляет, что оставить, а не что выкинуть.'
      - text: '`{"a":1,"b":2,"c":3}`'
        why: 'Второй аргумент не игнорируется — это replacer.'
      - text: '`["a","c"]`'
        why: 'Сериализуется объект, а массив только фильтрует его ключи.'
    explanation: |
      Второй аргумент `JSON.stringify` — replacer. Это массив разрешённых ключей или функция `(key, value)`: что она
      вернёт, то и попадёт в JSON, а `undefined` выкинет свойство. Так, например, убирают пароль. Третий аргумент —
      отступ для красивого вывода.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/JSON/stringify

  - id: js-026
    topic: JavaScript
    level: middle
    question: |
      Какие утверждения о свойстве-символе верны?
    code: |
      const id = Symbol('id');
      const user = { [id]: 1, name: 'Ann' };
    codeLang: js
    options:
      - text: '`Object.keys(user)` вернёт только `[''name'']`'
        correct: true
        why: 'Символьные ключи не попадают в `Object.keys`, `for...in` и `JSON.stringify`.'
      - text: '`Object.getOwnPropertySymbols(user)` найдёт `id`'
        correct: true
        why: 'Символы не секретны — их показывают `getOwnPropertySymbols` и `Reflect.ownKeys`.'
      - text: '`Symbol(''id'') === id` — `false`'
        correct: true
        why: 'Каждый вызов `Symbol()` создаёт уникальное значение, описание лишь подпись для отладки.'
      - text: '`JSON.stringify(user)` вернёт `{"name":"Ann","id":1}`'
        why: 'JSON пропускает символьные ключи, будет `{"name":"Ann"}`.'
      - text: '`user.id` вернёт `1`'
        why: '`user.id` — это строковый ключ `''id''`, а не символ. Нужно `user[id]`.'
    explanation: |
      Symbol — примитивный тип, значения создаются вызовом `Symbol()`, каждый символ уникален. Символьные свойства
      не видны при обычных операциях перебора и не конфликтуют с чужими ключами. Встроенные «хорошо известные»
      символы вроде `Symbol.iterator` задают поведение объекта.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Symbol

  - id: js-027
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      function multiply(a, b) {
        return a * b;
      }

      const double = multiply.bind(null, 2);
      console.log(double(3));
    codeLang: js
    options:
      - text: '`6`'
        correct: true
        why: '`bind` зафиксировал первый аргумент `a = 2`, а `3` при вызове пришло вторым — в `b`.'
      - text: '`NaN`'
        why: 'Оба аргумента числа: `2` из `bind` и `3` из вызова.'
      - text: '`3`'
        why: '`null` здесь — контекст `this`, а не аргумент. Первым аргументом стал `2`.'
      - text: '`TypeError`'
        why: '`this` функции не нужен, поэтому `null` в качестве контекста ничего не ломает.'
    explanation: |
      `call` вызывает функцию с подменой `this`, аргументы — через запятую. `apply` — то же, но аргументы массивом.
      `bind` не вызывает функцию, а возвращает «обёртку» с привязанным `this` и, если переданы, первыми
      аргументами — это частичное применение.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/bind

  - id: js-028
