    topic: Архитектура
    level: middle
    question: |
      Балансировщик использует IP hash: хэш адреса клиента 155, серверов 3. На какой сервер пойдёт запрос (нумерация
      с нуля)?
    options:
      - text: '`2`'
        correct: true
        why: '`155 % 3 = 2`. Один и тот же клиент всегда попадает на один сервер.'
      - text: '`1`'
        why: '`155 = 3 × 51 + 2`, остаток 2.'
      - text: '`0`'
        why: '155 не делится на 3 без остатка.'
      - text: 'На следующий по кругу'
        why: 'Так работает round robin, а не IP hash.'
    explanation: |
      Балансировка распределяет нагрузку между серверами с одной функцией; бывает аппаратной, на уровне DNS или
      прокси. Round robin — по очереди. IP hash — по хэшу адреса, удобно для «липких» сессий. Ещё — least connections
      и взвешенные варианты.
    links:
      - https://nginx.org/en/docs/http/load_balancing.html

  - id: arch-016
    topic: Архитектура
    level: middle
    question: |
      В каком порядке идут шаги цикла TDD?
    options:
      - text: 'Тест → код → рефакторинг'
        correct: true
        why: 'Red → Green → Refactor: сначала фиксируем ожидание, потом удовлетворяем его, потом улучшаем код под защитой теста.'
      - text: 'Код → тест → рефакторинг'
        why: 'Тест после кода — обычная разработка, а не TDD.'
      - text: 'Рефакторинг → тест → код'
        why: 'Рефакторить нечего, пока нет кода.'
      - text: 'Тест → рефакторинг → код'
        why: 'Рефакторинг идёт после того, как тест позеленел.'
    explanation: |
      TDD (Test-Driven Development) — тесты до кода: ранние баги, тесты как документация, безопасный рефакторинг;
      минусы — медленнее на простом, сложно для UI. BDD (Behavior-Driven Development) — сценарии поведения на общем
      языке Given / When / Then, понятные бизнесу и QA; минусы — поддержка шагов, медленные и хрупкие E2E.
    links:
      - https://martinfowler.com/bliki/TestDrivenDevelopment.html

  - id: arch-017
    topic: Архитектура
    level: middle
    question: |
      Какие причины мешают tree shaking вырезать неиспользуемый код?
    options:
      - text: 'Модули скомпилированы в CommonJS до бандлинга'
        correct: true
        why: '`require` и `module.exports` динамические — сборщик не может статически понять, что не используется.'
      - text: 'Побочные эффекты при импорте модуля'
        correct: true
        why: 'Например, полифил меняет `Array.prototype` — удалить такой модуль нельзя. Помогает `"sideEffects": false` в `package.json`.'
      - text: 'Экспорт одного большого объекта с методами'
        correct: true
        why: 'Свойства объекта не вырезаются по отдельности — объект остаётся целиком.'
      - text: 'Именованные экспорты отдельных функций'
        why: 'Наоборот, это идеальный вариант для tree shaking.'
      - text: 'Использование TypeScript с `module: ESNext`'
        why: 'Так импорты остаются ES-модулями, и tree shaking работает.'
    explanation: |
      Tree shaking строит граф зависимостей от точки входа по статическим `import`/`export`, помечает использованное и
      отбрасывает остальное. В webpack включается в `production`. Минификатору можно подсказать комментарием
      `/*@__PURE__*/`, что вызов без побочных эффектов.
    links:
      - https://webpack.js.org/guides/tree-shaking/

