  - id: js-005
    topic: JavaScript
    level: middle
    question: |
      Что выведет последняя строка?
    code: |
      (function () {
        const x = 5;
        console.log(x);
      })();

      console.log(x);
    codeLang: js
    options:
      - text: '`ReferenceError`'
        correct: true
        why: '`x` живёт только внутри IIFE: функция создала свою область видимости, снаружи переменной нет.'
      - text: '`5`'
        why: '`const` внутри функции наружу не утекает.'
      - text: '`undefined`'
        why: 'Обращение к необъявленной переменной — ошибка, а не `undefined`.'
      - text: '`TypeError`'
        why: 'TypeError — это когда значение не того типа. Здесь переменной просто нет — это ReferenceError.'
    explanation: |
      IIFE (Immediately Invoked Function Expression) — функция-выражение, которая вызывается сразу после
      определения. Она создаёт локальную область видимости: переменные не конфликтуют с глобальными и остаются
      приватными. До ES-модулей так делали модули и разовую инициализацию.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/IIFE

  - id: js-006
    topic: JavaScript
    level: middle
    question: |
      Какие утверждения о хранилищах браузера верны?
    options:
      - text: 'Cookie браузер сам отправляет на сервер с запросами'
        correct: true
        why: 'Подходящие по домену и пути куки уходят в заголовке `Cookie` автоматически.'
      - text: '`sessionStorage` у каждой вкладки свой'
        correct: true
        why: 'Даже две вкладки одного сайта не видят `sessionStorage` друг друга, а при закрытии вкладки он очищается.'
      - text: 'В `localStorage` помещается около 5 МБ'
        correct: true
        why: 'Обычный лимит браузеров — порядка 5 МБ на источник, у cookie — около 4 КБ.'
      - text: 'Срок жизни `sessionStorage` задаётся через `max-age`'
        why: '`expires` и `max-age` — атрибуты cookie. `sessionStorage` живёт, пока открыта вкладка.'
      - text: 'Cookie с флагом `HttpOnly` можно прочитать через `document.cookie`'
        why: '`HttpOnly` как раз прячет куку от JavaScript — это защита от кражи через XSS.'
    explanation: |
      `localStorage` хранит данные бессрочно, `sessionStorage` — пока открыта вкладка, оба доступны только на
      клиенте и только своему источнику. Cookie маленькие и уходят на сервер, атрибуты задают срок, домен, путь и
      безопасность. IndexedDB — встроенная база для больших объёмов и офлайн-приложений.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Web_Storage_API

  - id: js-007
    topic: JavaScript
    level: middle
    question: |
      Какой атрибут cookie защищает её от чтения через `document.cookie`?
    options:
      - text: '`HttpOnly`'
        correct: true
        why: 'Такую куку браузер отправляет на сервер, но JavaScript её не видит — украсть токен через XSS не получится.'
      - text: '`Secure`'
        why: '`Secure` отправляет куку только по HTTPS, но из JavaScript она читается.'
      - text: '`SameSite=Strict`'
        why: '`SameSite` решает, уходит ли кука в кросс-сайтовых запросах — защита от CSRF, а не от чтения.'
      - text: '`Domain`'
        why: '`Domain` задаёт, на какие домены отправляется кука.'
    explanation: |
      Атрибуты cookie: `Expires` и `Max-Age` — срок жизни, `Domain` и `Path` — где действует, `Secure` — только
      HTTPS, `HttpOnly` — недоступна JavaScript (защита от XSS), `SameSite` — отправка в кросс-сайтовых запросах
      (защита от CSRF). Токены авторизации кладут в `HttpOnly` + `Secure` + `SameSite`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies

  - id: js-008
    topic: JavaScript
    level: middle
    question: |
      Когда для отправки cookie нужно `withCredentials: true` (или `credentials: 'include'` у fetch)?
    options:
      - text: 'При запросе на другой источник'
        correct: true
        why: 'Для кросс-доменных запросов браузер по умолчанию куки не отправляет — их надо разрешить явно, и сервер тоже должен ответить `Access-Control-Allow-Credentials: true`.'
      - text: 'При любом запросе, иначе куки не уйдут'
        why: 'На свой же источник fetch и XHR отправляют куки и без этого флага.'
      - text: 'Только для куки с флагом `HttpOnly`'
        why: 'Флаг запроса не зависит от атрибутов куки.'
      - text: 'Только при запросах по HTTP без шифрования'
        why: 'Протокол тут ни при чём — важно, тот же источник или другой.'
    explanation: |
      Same-origin запросы отправляют куки автоматически. Для cross-origin по умолчанию их нет: клиент должен
      попросить (`withCredentials` у XHR и axios, `credentials: 'include'` у fetch), а сервер — разрешить
      заголовком `Access-Control-Allow-Credentials: true` с конкретным `Access-Control-Allow-Origin`, не `*`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/XMLHttpRequest/withCredentials

  - id: js-009
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      console.log([typeof NaN, NaN === NaN, Number.isNaN('abc'), isNaN('abc')]);
    codeLang: js
    options:
      - text: '`[''number'', false, false, true]`'
        correct: true
        why: '`NaN` — число и не равно самому себе. `Number.isNaN` проверяет без приведения, а глобальный `isNaN` сначала приводит `''abc''` к числу и получает `NaN`.'
      - text: '`[''NaN'', false, true, true]`'
        why: 'Типа `NaN` нет — `typeof NaN` даёт `''number''`.'
      - text: '`[''number'', true, false, true]`'
        why: '`NaN` — единственное значение, которое не равно самому себе.'
      - text: '`[''number'', false, true, true]`'
        why: '`Number.isNaN` не приводит строку к числу: `''abc''` — не `NaN`, это строка.'
    explanation: |
      `NaN` — специальное числовое значение «не число», `typeof NaN === 'number'`. Сравнение через `===` его не
      находит, поэтому проверяют `Number.isNaN(x)` или `Object.is(x, NaN)`. Старый глобальный `isNaN` сначала
      приводит аргумент к числу и потому возвращает `true` для любой нечисловой строки.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Number/isNaN

  - id: js-010
    topic: JavaScript
    level: middle
    question: |
      Чем `Object.create(Proto.prototype)` отличается от `new Proto()`?
    options:
      - text: 'Не вызывает функцию-конструктор'
        correct: true
        why: 'Прототип у объекта тот же, но код конструктора не выполняется и собственных полей нет.'
      - text: 'Создаёт объект без прототипа'
        why: 'Без прототипа будет только `Object.create(null)`. Здесь прототип — `Proto.prototype`.'
      - text: 'Копирует методы прототипа в сам объект'
        why: 'Ничего не копируется — объект ссылается на прототип и ищет методы по цепочке.'
      - text: 'Ничем, это синоним'
        why: '`new` ещё вызывает конструктор с `this`, равным новому объекту, и может вернуть другой объект.'
    explanation: |
      `new` — создание объекта через функцию-конструктор. `Object.create(proto)` — создание объекта с указанным
      прототипом без вызова конструктора. Классы ES6 — синтаксический сахар над функцией-конструктором и
      `prototype`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/create

  - id: js-011
    topic: JavaScript
    level: middle
    question: |
      Какие операции над объектом можно перехватить через `Proxy`?
    options:
      - text: '`Object.keys(proxy)`'
        correct: true
        why: 'Ловушка `ownKeys` (вместе с `getOwnPropertyDescriptor`) управляет тем, какие ключи увидит `Object.keys`.'
      - text: '`''name'' in proxy`'
        correct: true
        why: 'Оператор `in` перехватывает ловушка `has`.'
      - text: '`delete proxy.name`'
        correct: true
        why: 'Ловушка `deleteProperty`.'
      - text: '`typeof proxy`'
        why: '`typeof` не перехватывается: он смотрит на сам target — функция это или объект.'
      - text: '`proxy === target`'
        why: 'Сравнение по ссылке не перехватывается, и прокси никогда не равен своему target.'
    explanation: |
      Proxy — «обёртка», которая перехватывает базовые операции через ловушки: `get`, `set`, `has`,
      `deleteProperty`, `ownKeys`, `apply`, `construct`, `getPrototypeOf` и другие. На этом построены реактивность
      Vue 3, валидация, логирование, значения по умолчанию. Не перехватываются `typeof`, сравнение `===` и
      внутренние слоты встроенных объектов.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Proxy

  - id: js-012
    topic: JavaScript
    level: middle
    question: |
      Что произойдёт на последней строке?
    code: |
      const { proxy, revoke } = Proxy.revocable({ name: 'Ivan' }, {});
      revoke();
      proxy.name;
    codeLang: js
    options:
      - text: '`TypeError`'
        correct: true
        why: 'После `revoke()` любая операция с прокси бросает TypeError.'
      - text: 'Вернётся `''Ivan''`'
        why: 'Отозванный прокси больше не проксирует ничего.'
      - text: 'Вернётся `undefined`'
        why: 'Это была бы «тихая» неудача, а отзыв делает операции ошибкой.'
      - text: '`ReferenceError`'
        why: 'Переменная `proxy` есть — ошибка в том, что прокси отозван.'
    explanation: |
      `Proxy.revocable` возвращает прокси и функцию `revoke`. Так дают временный доступ к объекту: после отзыва
      ссылка на прокси остаётся, но пользоваться ею нельзя.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Proxy/revocable

  - id: js-013
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      const obj = {
        name: 'Petr',
        get greeting() {
          return `Hello, ${this.name}`;
        },
      };

      console.log(Reflect.get(obj, 'greeting', { name: 'Anna' }));
    codeLang: js
    options:
      - text: '`Hello, Anna`'
        correct: true
        why: 'Третий аргумент `receiver` становится `this` внутри геттера.'
      - text: '`Hello, Petr`'
        why: 'Так было бы без receiver. С ним геттер вызывается от переданного объекта.'
      - text: '`Hello, undefined`'
        why: 'У receiver есть `name` — `''Anna''`.'
      - text: '`undefined`'
        why: 'Свойство `greeting` есть, это геттер — `Reflect.get` его вызовет.'
    explanation: |
      Reflect — набор функций, которые делают то же, что встроенные операции: `Reflect.get` — чтение,
      `Reflect.set` — запись (возвращает `true` или `false`), `Reflect.has` — `in`, `Reflect.deleteProperty`,
      `Reflect.construct`, `Reflect.apply`. Его методы совпадают с ловушками Proxy, поэтому в ловушке пишут
      `return Reflect.get(target, prop, receiver)` — стандартное поведение с правильным `this`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Reflect/get

  - id: js-014
    topic: JavaScript
    level: middle
    question: |
      Что произойдёт при выполнении кода?
    code: |
      const arrayLike = { 0: 'a', 1: 'b', length: 2 };

      for (const item of arrayLike) {
        console.log(item);
      }
    codeLang: js
    options:
      - text: '`TypeError`: объект не итерируемый'
        correct: true
        why: '`for...of` вызывает `obj[Symbol.iterator]()`, а у array-like объекта этого метода нет.'
      - text: 'Выведутся `a` и `b`'
        why: 'Индексы и `length` не делают объект итерируемым. Сработает `Array.from(arrayLike)`.'
      - text: 'Выведутся ключи `0`, `1`, `length`'
        why: 'Так перебирает ключи `for...in`, а не `for...of`.'
      - text: 'Ничего: цикл пройдёт ноль раз'
        why: 'Цикла не будет вовсе — ошибка ещё до первой итерации.'
    explanation: |
      `for...of` вызывает `obj[Symbol.iterator]()`, получает итератор и вызывает `next()`, пока не придёт
      `done: true`, беря `value`. Встроенный итератор есть у массивов, строк, `Map`, `Set`, `NodeList`,
      `arguments`. Array-like объект с индексами и `length` превращают в массив через `Array.from`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Iteration_protocols

  - id: js-015
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      const source = {
        [Symbol.iterator]() {
          return {
            next() {
              return { value: 'data', done: false };
            },
            return() {
              console.log('cleanup');
              return { done: true };
            },
          };
        },
      };

      for (const item of source) {
        console.log(item);
        break;
      }
    codeLang: js
    options:
      - text: '`data`, `cleanup`'
        correct: true
        why: 'При досрочном выходе из `for...of` (`break`, `return`, исключение) вызывается метод `return()` итератора.'
      - text: '`data`'
        why: '`return()` вызывается автоматически именно при `break` — чтобы освободить ресурсы.'
      - text: '`cleanup`, `data`'
        why: '`return()` вызывается после того, как тело цикла выполнилось и сработал `break`.'
      - text: 'Бесконечный вывод `data`'
        why: '`break` останавливает цикл после первой итерации.'
    explanation: |
      Итератор обязан иметь `next()`, возвращающий `{ value, done }`. Необязательный `return()` вызывается при
      досрочном прерывании — там закрывают файлы и соединения. `throw()` нужен для обработки ошибок и используется
      редко, в основном генераторами.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Iteration_protocols#the_iterator_protocol

  - id: js-016
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      function* generator() {
        yield 1;
        yield 2;
        yield 3;
      }

      const gen = generator();
      console.log(gen.next());
      console.log(gen.return(99));
      console.log(gen.next());
    codeLang: js
    options:
      - text: '`{value: 1, done: false}`, `{value: 99, done: true}`, `{value: undefined, done: true}`'
        correct: true
        why: '`return(99)` досрочно завершает генератор с этим значением. Дальше любой `next()` — `done: true`.'
      - text: '`{value: 1, done: false}`, `{value: 99, done: true}`, `{value: 2, done: false}`'
        why: 'После `return()` генератор завершён навсегда и к `yield 2` не вернётся.'
      - text: '`{value: 1, done: false}`, `{value: 2, done: false}`, `{value: 3, done: false}`'
        why: '`return(99)` не равен `next()` — он завершает генератор.'
      - text: '`{value: 1, done: false}`, `{value: 99, done: false}`, `{value: 2, done: false}`'
        why: '`return` ставит `done: true`, и генератор больше не продолжается.'
    explanation: |
      Генератор — функция с паузой: вызов возвращает итератор, `next()` выполняет код до следующего `yield`.
      `next(value)` передаёт значение внутрь — оно станет результатом выражения `yield`. `return(value)` завершает
      досрочно, `throw(error)` бросает ошибку в точку паузы.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Generator/return

  - id: js-017
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      function* dialog() {
        const name = yield 'Как вас зовут?';
        yield `Привет, ${name}!`;
      }

      const gen = dialog();
      console.log(gen.next('Борис').value);
      console.log(gen.next('Анна').value);
    codeLang: js
    options:
      - text: '`Как вас зовут?`, `Привет, Анна!`'
        correct: true
        why: 'Значение из первого `next()` пропадает: ещё нет `yield`, который бы его принял. Второй `next(''Анна'')` становится результатом первого `yield`.'
      - text: '`Как вас зовут?`, `Привет, Борис!`'
        why: 'Первый `next` только запускает генератор до первого `yield` — его аргумент некуда передать.'
      - text: '`Борис`, `Анна`'
        why: '`next()` возвращает то, что отдал `yield`, а не свой аргумент.'
      - text: '`Как вас зовут?`, `Привет, undefined!`'
        why: '`name` получает аргумент второго `next` — `''Анна''`.'
    explanation: |
      `yield` работает в обе стороны: отдаёт значение наружу и принимает значение из следующего `next(x)`. На этом
      раньше строили асинхронный код (как `co` и redux-saga), пока не появился `async/await`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Generator/next

  - id: js-018
    topic: JavaScript
    level: middle
    question: |
      Что доступно внутри обычного Web Worker?
    options:
      - text: '`fetch`'
        correct: true
        why: 'Сетевые запросы из воркера работают.'
      - text: '`setTimeout` и `setInterval`'
        correct: true
        why: 'Таймеры в воркере есть.'
      - text: 'IndexedDB'
        correct: true
        why: 'Асинхронная база доступна и в воркере.'
      - text: '`WebSocket`'
        correct: true
        why: 'Соединение можно держать прямо в воркере и отдавать в основной поток уже обработанные данные.'
      - text: '`document`'
        why: 'DOM в воркере нет: элементы трогает только основной поток.'
      - text: '`localStorage`'
        why: '`localStorage` синхронный и в воркерах недоступен.'
    explanation: |
      Web Worker — скрипт в фоновом потоке. С основным потоком он общается сообщениями: `postMessage` и
      `onmessage`. Внутри можно считать, работать с данными, сетью, таймерами, IndexedDB, WebAssembly. Нельзя —
      DOM, `window`, `localStorage`, `alert`. Shared Worker общий для нескольких вкладок, Service Worker — отдельная
      технология для прокси между страницей и сетью.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Using_web_workers

  - id: js-019
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль (обычный скрипт, не strict mode)?
    code: |
      const s = 'abc';
      s.foo = 1;
      console.log(s.length, s.foo);
    codeLang: js
    options:
      - text: '`3 undefined`'
        correct: true
        why: 'Для чтения `length` и для записи `foo` создаются разные временные обёртки `String`. Запись ушла во временный объект и пропала.'
      - text: '`3 1`'
        why: 'Примитив не хранит свойства: `foo` записалось во временную обёртку, которая сразу исчезла.'
      - text: '`undefined undefined`'
        why: '`length` у строки есть — он читается через временную обёртку `String`.'
      - text: '`TypeError`'
        why: 'Ошибка будет только в strict mode. В обычном режиме запись молча теряется.'
    explanation: |
      Автобоксинг — механизм, который временно оборачивает примитив (string, number, boolean, symbol, bigint) в
      объект-обёртку, когда к нему обращаются как к объекту. Поэтому у строк есть методы, но сохранить на
      примитиве своё свойство нельзя: обёртка живёт одну операцию.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/Primitive

  - id: js-020
    topic: JavaScript
    level: middle
    question: |
      Какие утверждения о сложности алгоритмов верны?
    options:
      - text: 'Пузырьковая сортировка — `O(n²)`'
        correct: true
        why: 'Два вложенных прохода по массиву.'
      - text: 'Быстрая сортировка в среднем — `O(n log n)`'
        correct: true
        why: 'Массив делится опорным элементом примерно пополам, уровней — `log n`, на каждом — `n` сравнений.'
      - text: 'Быстрая сортировка в худшем случае — `O(n²)`'
        correct: true
        why: 'Если опорный элемент каждый раз крайний (например, последний в уже отсортированном массиве), деления пополам не выходит.'
      - text: 'Бинарный поиск по отсортированному массиву — `O(n)`'
        why: 'Бинарный поиск каждый шаг отбрасывает половину — это `O(log n)`.'
      - text: 'Сортировка выбором в среднем случае — `O(n log n)`'
        why: 'Выбор минимума из оставшихся для каждой позиции — это `O(n²)`.'
    explanation: |
      Временная сложность показывает, как растёт время работы с ростом входных данных. `O(1)` — без циклов, `O(n)` —
      один цикл, `O(n²)` — два вложенных, `O(log n)` — «разделяй и властвуй», как бинарный поиск, `O(n!)` —
      перебор всех перестановок. Пузырёк и выбор — `O(n²)`, быстрая сортировка — `O(n log n)` в среднем.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/Algorithm

  - id: js-021
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      console.log([10, 1, 3, 2].sort());
    codeLang: js
    options:
      - text: '`[1, 10, 2, 3]`'
        correct: true
        why: 'Без функции сравнения `sort` сравнивает элементы как строки: `''10''` меньше `''2''`, потому что `''1'' < ''2''`.'
      - text: '`[1, 2, 3, 10]`'
        why: 'Так будет с `sort((a, b) => a - b)`. По умолчанию числа сравниваются как строки.'
      - text: '`[10, 3, 2, 1]`'
        why: 'По умолчанию порядок возрастающий, и сравнение строковое.'
      - text: '`[10, 1, 3, 2]`'
        why: '`sort` сортирует — и к тому же меняет исходный массив.'
    explanation: |
      `sort` мутирует массив и по умолчанию сравнивает строковые представления. Свою сортировку задают
      функцией-компаратором: отрицательное число — `a` раньше `b`, положительное — позже, ноль — равны. Без мутации
      есть `toSorted()`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/sort

  - id: js-022
    topic: JavaScript
    level: middle
    question: |
      Что произойдёт при загрузке этого кода?
    code: |
      class A {
        #secret = 1;
      }

      class B extends A {
        read() {
          return this.#secret;
        }
      }
    codeLang: js
    options:
      - text: '`SyntaxError` ещё до выполнения'
        correct: true
        why: '`#secret` объявлен в `A`, а в теле `B` такого приватного имени нет. Это проверяется при разборе кода.'
      - text: '`read()` вернёт `1`'
        why: 'Приватные `#`-поля не видны наследникам — это не `protected`.'
      - text: '`read()` вернёт `undefined`'
        why: 'Обращение к необъявленному `#`-имени — синтаксическая ошибка, а не `undefined`.'
      - text: '`TypeError` при вызове `read()`'
        why: 'TypeError бывает, когда `#`-поле объявлено в классе, а объект не его экземпляр. Здесь же поле в `B` не объявлено вовсе — ошибка раньше.'
    explanation: |
      В JavaScript есть публичные поля и методы (по умолчанию), приватные с `#` (только внутри своего класса) и
      статические с `static` (принадлежат классу). Модификатора `protected` в JS нет — он есть в TypeScript, где
      проверяется только при компиляции.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Classes/Private_properties

  - id: js-023
    topic: TypeScript
    level: middle
    question: |
      Кому доступен `protected`-член класса в TypeScript?
    options:
      - text: 'Самому классу и его наследникам'
        correct: true
        why: 'Снаружи (через экземпляр) обращение запрещено, а в подклассе — можно.'
      - text: 'Только самому классу'
        why: 'Так работает `private`.'
      - text: 'Всем, как `public`'
        why: 'Снаружи обращение к protected-полю через экземпляр — ошибка компиляции.'
      - text: 'Только экземплярам класса снаружи'
        why: 'Наоборот, снаружи protected как раз недоступен.'
    explanation: |
      `public` — доступен везде, по умолчанию. `protected` — в классе и наследниках. `private` — только в самом
      классе. В TypeScript это проверки компилятора: в JavaScript после сборки поля обычные. Настоящую приватность в
      рантайме дают `#`-поля ES2022.
    links:
      - https://www.typescriptlang.org/docs/handbook/2/classes.html#member-visibility

