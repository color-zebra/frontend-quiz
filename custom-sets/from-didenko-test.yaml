      - text: '`function () {}`'
        why: 'Функция — объект, хоть `typeof` и даёт `''function''`.'
    explanation: |
      В JS 8 типов: 7 примитивов — number, string, boolean, null, undefined, symbol, bigint — и object. Примитивы
      неизменяемы и сравниваются по значению. BigInt — целые произвольной длины, нужны для чисел за пределами безопасного диапазона number
      (больше `2^53 − 1`).
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Data_structures

  - id: js-057
    topic: JavaScript
    level: middle
    question: |
      Какой оператор окажется в корне дерева выражения при разборе `const x = 10 + 5 * 2` в AST?
    options:
      - text: '`+`'
        correct: true
        why: 'У `*` приоритет выше, поэтому `5 * 2` — вложенный узел, а корень выражения — сложение `10 + (5 * 2)`.'
      - text: '`*`'
        why: 'Умножение выполняется первым, поэтому оно вложено глубже, а не стоит в корне.'
      - text: '`=`'
        why: 'В `const` нет оператора присваивания: это `VariableDeclarator` с `id` и `init`.'
      - text: 'Корня нет: числа лежат списком'
        why: 'AST — дерево. Порядок вычислений задаётся вложенностью узлов.'
    explanation: |
      AST — древовидное представление кода, каждый узел — конструкция языка. Код сначала разбивается на токены,
      из них строится AST. С ним работают Babel (транспиляция, JSX в `createElement`), ESLint (правила), Prettier,
      TypeScript, бандлеры для tree shaking.
    links:
      - https://astexplorer.net/

  - id: js-058
    topic: JavaScript
    level: middle
    multiple: true
    question: |
      Чем `requestAnimationFrame` лучше `setTimeout(fn, 16)` для анимации?
    options:
      - text: 'Синхронизирован с отрисовкой кадров и засыпает в фоновой вкладке'
        correct: true
        why: 'Колбэк вызывается прямо перед отрисовкой, с частотой экрана. Кадры не рвутся и не тратятся впустую.'
      - text: 'Выполняется в отдельном потоке и не нагружает основной'
        why: 'rAF работает в основном потоке. Отдельный поток — это Web Worker.'
      - text: 'Вызывается раньше всех микрозадач'
        why: 'Микрозадачи выполняются сразу после текущей задачи, rAF — только перед отрисовкой.'
      - text: 'Гарантирует ровно 60 вызовов в секунду'
        why: 'Частота зависит от экрана (60, 120, 144 Гц) и нагрузки — кадры могут пропускаться.'
    explanation: |
      rAF планирует функцию перед следующей перерисовкой. Это не макро- и не микрозадача: колбэки выполняются на
      шаге отрисовки, который браузер делает между задачами, когда пора рисовать кадр. Остановить —
      `cancelAnimationFrame(id)`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Window/requestAnimationFrame

  - id: js-059
    topic: JavaScript
    level: middle
    question: |
      Что в strict mode бросает ошибку, хотя в обычном режиме работает молча?
    options:
      - text: 'Присваивание необъявленной переменной'
        correct: true
        why: 'В обычном режиме создастся глобальная переменная, в строгом — ReferenceError.'
      - text: 'Запись в свойство с `writable: false`'
        correct: true
        why: 'В обычном режиме запись просто теряется, в строгом — TypeError.'
      - text: 'Запись свойства в примитив, например `''abc''.foo = 1`'
        correct: true
        why: 'В обычном режиме пишется во временную обёртку и пропадает, в строгом — TypeError.'
      - text: 'Добавление нового свойства в обычный объект'
        why: 'Это нормальная операция в любом режиме.'
      - text: 'Вызов функции без контекста'
        why: 'Ошибки нет: `this` просто будет `undefined`, а не `window`.'
    explanation: |
      Strict mode делает код безопаснее и предсказуемее: запрещает неявные глобальные переменные, дублирующиеся
      параметры, `delete` переменных, `with`, превращает «тихие» неудачи в ошибки. `this` в функции без контекста —
      `undefined`. Классы и ES-модули всегда строгие.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Strict_mode

  - id: js-060
    topic: JavaScript
    level: middle
    question: |
      Что выведется в консоль?
    code: |
      function P1() {
        this.a = 1;
        return 5;
      }

      function P2() {
        this.a = 1;
        return { b: 2 };
      }

      console.log(new P1(), new P2());
    codeLang: js
    options:
      - text: '`P1 { a: 1 }` и `{ b: 2 }`'
        correct: true
        why: 'Если конструктор возвращает объект, `new` отдаёт его. Примитив в `return` игнорируется — возвращается созданный объект.'
      - text: '`5` и `{ b: 2 }`'
        why: 'Примитив из конструктора `new` игнорирует.'
      - text: '`P1 { a: 1 }` и `P2 { a: 1 }`'
        why: 'Возвращённый объект заменяет созданный `new`.'
      - text: '`5` и `P2 { a: 1 }`'
        why: 'Наоборот: объект из `return` побеждает, примитив игнорируется.'
    explanation: |
      `new` делает четыре шага: создаёт пустой объект, ставит ему прототип `Constructor.prototype`, вызывает
      конструктор с `this` на этот объект, возвращает его — или объект, который вернул конструктор. Без `new`
      `this` будет `window` (в строгом режиме — `undefined`, и запись упадёт).
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/new

  - id: js-061
    topic: JavaScript
    level: middle
    question: |
      Что будет при вызове в Chrome или Node.js?
    code: |
      function sum(n, acc = 0) {
        return n === 0 ? acc : sum(n - 1, acc + n);
      }

      sum(100000);
    codeLang: js
    options:
      - text: '`RangeError`'
        correct: true
        why: 'Рекурсия хвостовая, но V8 не делает оптимизацию хвостовых вызовов — каждый вызов занимает кадр стека.'
      - text: '`5000050000`'
        why: 'Так было бы с оптимизацией хвостовых вызовов. Она есть в стандарте ES2015, но реализована только в Safari.'
      - text: '`Infinity`'
        why: 'Сумма помещается в number, проблема в глубине стека.'
      - text: '`undefined`'
        why: 'Функция всегда возвращает число или падает.'
    explanation: |
      Хвостовая рекурсия — функция заканчивается вызовом самой себя без дополнительных операций. В языках с
      оптимизацией хвостовых вызовов это не растит стек. В JS такую оптимизацию поддерживает только Safari, поэтому
      глубокую рекурсию переписывают в цикл.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/Recursion

  - id: js-062
    topic: JavaScript
    level: middle
    question: |
      Какие из функций — чистые?
    options:
      - text: '`(a, b) => a + b`'
        correct: true
        why: 'Результат зависит только от аргументов, побочных эффектов нет.'
      - text: '`(arr) => arr.slice(1)`'
        correct: true
        why: '`slice` возвращает новый массив и не трогает исходный.'
      - text: '`(arr) => arr.splice(0, 1)`'
        why: '`splice` мутирует переданный массив — побочный эффект.'
      - text: '`() => Date.now()`'
        why: 'Каждый вызов даёт разный результат.'
      - text: '`(x) => { console.log(x); return x; }`'
        why: 'Вывод в консоль — побочный эффект.'
    explanation: |
      Чистая функция при одних и тех же аргументах всегда возвращает один и тот же результат и не имеет побочных
      эффектов: не меняет внешние данные, не пишет в консоль и сеть, не читает время и случайные числа. Классический
      пример — `slice` (чистая) против `splice` (мутирует).
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/Pure_function

  - id: js-063
    topic: JavaScript
