      Какие утверждения про Server Components в Next.js App Router верны?
    options:
      - text: 'По умолчанию все компоненты серверные'
        correct: true
        why: 'Клиентским компонент делает директива `''use client''` в начале файла.'
      - text: 'Их код и зависимости не попадают в клиентский бандл'
        correct: true
        why: 'Тяжёлые библиотеки, нужные только для рендера, остаются на сервере.'
      - text: 'В них нельзя использовать `useState` и обработчики событий'
        correct: true
        why: 'Интерактивность — только в клиентских компонентах.'
      - text: 'Они повторно выполняются в браузере при гидратации'
        why: 'Гидрируются только клиентские компоненты. Серверные на клиенте не выполняются.'
      - text: 'Это другое название SSR, только с новыми файлами'
        why: 'SSR рендерит в HTML и клиентские компоненты тоже. Server Components выполняются только на сервере и никогда не загружаются на клиент.'
    explanation: |
      На клиент уходят HTML и специальный поток данных RSC (RSC payload) — описание дерева для React. Клиентский
      JavaScript скачивается только для компонентов с `'use client'`. Это похоже на островную архитектуру: статичная
      страница и интерактивные «острова», которые гидрируются отдельно.
    links:
      - https://nextjs.org/docs/app/getting-started/server-and-client-components

  - id: next-004
    topic: Next.js
    level: middle
    question: |
      Какой режим рендеринга получит маршрут в App Router (Next.js 15+), если страница вызывает `cookies()`?
    options:
      - text: 'Динамический: рендер на каждый запрос'
        correct: true
        why: 'Куки известны только во время запроса, поэтому Next.js не может отрендерить страницу заранее.'
      - text: 'Статический: страница собирается при билде'
        why: 'При билде запроса ещё нет — куки взять неоткуда.'
      - text: 'ISR с пересборкой раз в 60 секунд'
        why: 'ISR включают `revalidate`, а не `cookies()`.'
      - text: 'Клиентский: страница рендерится только в браузере'
        why: '`cookies()` — серверная функция, она переводит маршрут в серверный динамический рендеринг.'
    explanation: |
      В App Router вместо `getStaticProps` и `getServerSideProps` режим выбирается сам. Обращение к данным запроса
      (`cookies()`, `headers()`, `searchParams`) делает маршрут динамическим. `fetch` с `next: { revalidate: 60 }`
      даёт ISR, `cache: 'no-store'` — свежие данные на каждый запрос. С Next.js 15 `fetch` по умолчанию не кэшируется,
      в 13–14 кэшировался навсегда. В Next.js 16 с `cacheComponents` статическая оболочка пререндерится, а часть с
      `cookies()` рендерится на запрос внутри `<Suspense>`.
    links:
      - https://nextjs.org/docs/app/api-reference/functions/cookies

  # ===================== Node.js =====================
  - id: node-001
    topic: Node.js
    level: middle
    multiple: true
    question: |
      Node.js выполняет JavaScript в одном потоке. Как приложение на нём использует все ядра процессора?
    options:
      - text: 'Запускают несколько процессов через `cluster` или pm2'
        correct: true
        why: 'Каждый процесс — отдельная копия V8 со своим event loop. Главный процесс раздаёт входящие соединения дочерним.'
      - text: 'V8 сам раскладывает функции по ядрам'
        why: 'JavaScript-код одного процесса выполняется в одном потоке, сам движок его не параллелит.'
      - text: 'Event loop работает на всех ядрах одновременно'
        why: 'Event loop один на процесс и крутится в одном потоке.'
      - text: 'Никак: Node.js всегда использует одно ядро'
        why: 'Одно ядро — у одного процесса. Несколько процессов или `worker_threads` задействуют остальные.'
    explanation: |
      Node.js — среда выполнения JavaScript на V8 с асинхронной событийной архитектурой: один поток JS и
      неблокирующий ввод-вывод. Это держит тысячи соединений без затрат на потоки, но тяжёлые вычисления блокируют
      event loop. Для нескольких ядер — `cluster` или pm2, для тяжёлых вычислений внутри процесса — `worker_threads`.
    links:
      - https://nodejs.org/api/cluster.html

  - id: node-002
    topic: Node.js
    level: middle
    question: |
      Какие пары «база данных — тип» верны?
    options:
      - text: 'Redis — ключ-значение'
        correct: true
        why: 'Хранит данные в памяти по ключу: кеш, сессии, очереди, лидерборды.'
      - text: 'MongoDB — документная'
        correct: true
        why: 'Хранит JSON-подобные документы (BSON), схема заранее не обязательна.'
      - text: 'ClickHouse — колоночная'
        correct: true
        why: 'Хранит данные по колонкам — быстрые агрегаты по миллиардам строк для аналитики.'
      - text: 'Neo4j — реляционная'
        why: 'Neo4j — графовая: узлы и связи, «друзья друзей», рекомендации.'
      - text: 'PostgreSQL — документная'
        why: 'PostgreSQL — реляционная, хоть и умеет хранить JSON.'
    explanation: |
      Реляционные (PostgreSQL, MySQL, SQLite) — таблицы и связи через ключи, транзакции; для финансов, заказов, CRM.
      NoSQL бывают документные (MongoDB), ключ-значение (Redis), колоночные (ClickHouse), wide-column (Cassandra), графовые
      (Neo4j), временные ряды (InfluxDB, TimescaleDB). Типичная связка для веб-приложения — PostgreSQL плюс Redis
      для кеша.
    links:
      - https://www.mongodb.com/resources/basics/databases/nosql-explained

  - id: node-003
    topic: Node.js
    level: middle
    question: |
      Какое значение у опции `credentials` в `fetch` по умолчанию?
    options:
      - text: '`''same-origin''`'
        correct: true
        why: 'Куки отправляются только на свой источник. На другой домен — только с `''include''`.'
      - text: '`''omit''`'
        why: '`omit` вообще не отправляет куки, даже на свой домен. Его надо указать явно.'
      - text: '`''include''`'
        why: 'Отправка кук на чужой источник по умолчанию была бы опасна.'
      - text: '`''none''`'
        why: 'Такого значения нет. `none` бывает у атрибута куки `SameSite`.'
    explanation: |
      У `fetch` три значения `credentials`: `omit` — никогда не отправлять куки, `same-origin` (по умолчанию) — только
      на свой источник, `include` — всегда, в том числе на другие домены. В axios и XHR то же самое включается флагом
      `withCredentials: true`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/RequestInit#credentials

  - id: node-004
    topic: Node.js
    level: middle
    question: |
      Фронт на `https://frontend.com`, API на `https://api.other.com`. Что нужно, чтобы куки API уходили с запросами
      фронта?
    options:
      - text: '`credentials: ''include''` (или `withCredentials: true`) на клиенте'
        correct: true
        why: 'Без этого браузер не отправит куки на другой источник.'
      - text: '`Access-Control-Allow-Credentials: true` в ответе сервера'
        correct: true
        why: 'Иначе браузер не отдаст ответ коду страницы.'
      - text: '`Access-Control-Allow-Origin: https://frontend.com` — конкретный источник'
        correct: true
        why: 'Со звёздочкой запрос с куками браузер заблокирует.'
      - text: 'Кука с `SameSite=None; Secure`'
        correct: true
        why: 'Домены разных сайтов — без `SameSite=None` кука в такие запросы не попадёт, а `None` требует `Secure`.'
      - text: '`Access-Control-Allow-Origin: *` для простоты'
        why: 'Звёздочка с куками запрещена: браузер выдаст CORS-ошибку.'
    explanation: |
      Запрос с куками на чужой домен требует согласия обеих сторон: клиент просит (`credentials: 'include'`), сервер
      разрешает (`Access-Control-Allow-Credentials: true` плюс конкретный origin), а сама кука должна иметь
      подходящие атрибуты. Safari по умолчанию режет сторонние куки — надёжнее держать API на поддомене того же сайта
      или ходить через свой BFF.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS#requests_with_credentials

  - id: node-005
    topic: Node.js
    level: middle
    question: |
      Защищает ли сайт от CSRF то, что его собственный фронт не ставит `credentials: 'include'`?
    options:
      - text: 'Нет: атакующая страница сама выберет, слать ли куки'
        correct: true
        why: 'Флаг выставляет код того сайта, который делает запрос. От CSRF защищают `SameSite`, CSRF-токены и проверка `Origin` на сервере.'
      - text: 'Да: без флага браузер никогда не отправит куки'
        why: 'Флаг ставит не ваш фронт, а страница злоумышленника — и обычная HTML-форма тоже отправляет куки.'
      - text: 'Да, если на сервере настроен CORS'
        why: 'CORS запрещает читать ответ, но не мешает отправить запрос с побочным эффектом.'
      - text: 'Нет, но защищает HttpOnly у куки'
        why: 'HttpOnly прячет куку от JavaScript, но браузер всё равно прикладывает её к запросам.'
    explanation: |
      CSRF — злой сайт заставляет браузер жертвы отправить запрос на ваш сайт с её куками. Защита: `SameSite=Lax` или
      `Strict` у кук, CSRF-токен в форме или заголовке, проверка `Origin` и `Referer`. HttpOnly защищает от кражи
      куки через XSS, Secure — от перехвата по HTTP.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Security/Attacks/CSRF

  - id: node-006
    topic: Node.js
    level: middle
    question: |
      Пользователь с ролью `user` отправил верный токен на эндпоинт только для админов. Какой статус вернуть?
    options:
      - text: '`403 Forbidden`'
        correct: true
        why: 'Кто он — известно (аутентификация пройдена), но прав не хватает (авторизация не пройдена).'
      - text: '`401 Unauthorized`'
        why: '401 — когда пользователь не опознан: нет токена или он протух.'
      - text: '`404 Not Found`'
        why: 'Иногда так прячут существование ресурса, но по смыслу это 403.'
      - text: '`400 Bad Request`'
        why: 'Запрос корректен, проблема в правах.'
    explanation: |
      Аутентификация — «кто ты?» (логин и пароль, токен). Авторизация — «что тебе можно?» (роли и права). Несмотря на
      название, 401 Unauthorized — про аутентификацию, а 403 Forbidden — про авторизацию. На фронте авторизация — это
      показ кнопок и роутов по роли, но настоящая проверка всегда на беке.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/403

  - id: node-007
    topic: Node.js
    level: middle
    question: |
      Что сделает этот запрос?
    code: |
      UPDATE users SET name = 'Johnny';
    codeLang: text
    options:
      - text: 'Переименует всех пользователей'
        correct: true
        why: 'Без `WHERE` изменение применяется ко всем строкам таблицы.'
      - text: 'Переименует первого пользователя'
        why: 'SQL не выбирает «первую» строку сам — без `WHERE` затронуты все.'
      - text: 'Ничего: без `WHERE` запрос не выполнится'
        why: 'Запрос синтаксически корректен и выполнится.'
      - text: 'Создаст пользователя с именем Johnny'
        why: 'Создаёт `INSERT`, а `UPDATE` меняет существующие строки.'
    explanation: |
      CRUD в SQL: `SELECT` — читать, `INSERT` — создать, `UPDATE` — обновить, `DELETE` — удалить. `UPDATE` и `DELETE`
      без `WHERE` затрагивают всю таблицу — главная опасность. Ещё советы: не писать `SELECT *` в продакшене,
      строки брать в кавычки, индексы ставить на поля из `WHERE`.
    links:
      - https://www.postgresql.org/docs/current/sql-update.html

  - id: node-008
    topic: Node.js
    level: middle
    question: |
      Сколько строк вернут запросы, если у John 2 заказа, у Jane 1, у Bob — ни одного?
    code: |
      -- запрос 1
      SELECT users.name, orders.total FROM users
      JOIN orders ON users.id = orders.user_id;

      -- запрос 2
      SELECT users.name, orders.total FROM users
      LEFT JOIN orders ON users.id = orders.user_id;
    codeLang: text
    options:
      - text: '3 и 4'
        correct: true
        why: '`JOIN` (INNER) — только пары с совпадением: 2 + 1. `LEFT JOIN` добавит Bob с `NULL` в полях заказа.'
      - text: '3 и 3'
        why: '`LEFT JOIN` сохраняет всех из левой таблицы, даже без заказов.'
      - text: '4 и 3'
        why: 'Наоборот: строк больше у `LEFT JOIN`.'
      - text: '3 и 9'
        why: '9 строк дал бы `CROSS JOIN` — все пары пользователь × заказ.'
    explanation: |
      `INNER JOIN` возвращает строки, где совпадение есть в обеих таблицах. `LEFT JOIN` — все строки левой таблицы, а
      поля правой без совпадения будут `NULL`. Аналогия в JS: `users.map(u => ({ ...u, orders: orders.filter(o =>
      o.userId === u.id) }))`.
    links:
      - https://www.postgresql.org/docs/current/tutorial-join.html

  - id: node-009
    topic: Node.js
    level: middle
    question: |
      Какие строки вернёт `SELECT * FROM users ORDER BY id LIMIT 10 OFFSET 20`?
    options:
      - text: 'С 21-й по 30-ю'
        correct: true
        why: '`OFFSET 20` пропускает 20 строк, `LIMIT 10` берёт следующие 10 — это третья страница по 10.'
      - text: 'С 20-й по 30-ю'
        why: 'Пропускаются первые 20, значит, начало — с 21-й.'
      - text: 'С 10-й по 20-ю'
        why: '`LIMIT` — сколько взять, `OFFSET` — сколько пропустить, а не наоборот.'
      - text: 'С 1-й по 10-ю'
        why: '`OFFSET 20` сдвигает начало выборки.'
    explanation: |
      `LIMIT` и `OFFSET` — простая пагинация, аналог `slice`. На больших таблицах большой `OFFSET` медленный: база всё
      равно проходит пропущенные строки. Тогда используют пагинацию по курсору (`WHERE id > последний_id`).
    links:
      - https://www.postgresql.org/docs/current/queries-limit.html

  - id: node-010
    topic: Node.js
    level: middle
    question: |
      Что вернёт запрос для таблицы `orders` с `user_id` = 1, 1, 2?
    code: |
      SELECT user_id, COUNT(*) AS order_count
      FROM orders
      GROUP BY user_id;
    codeLang: text
    options:
      - text: 'Две строки: `(1, 2)` и `(2, 1)`'
        correct: true
        why: '`GROUP BY` собирает строки с одинаковым `user_id` в группу, а `COUNT(*)` считает строки в каждой.'
      - text: 'Одну строку: `3`'
        why: 'Так было бы без `GROUP BY` — общий `COUNT(*)`.'
      - text: 'Три строки: `(1, 1)`, `(1, 1)` и `(2, 1)`'
        why: 'Одинаковые `user_id` схлопываются в одну группу.'
      - text: 'Ошибку: `COUNT` нельзя с другими колонками'
        why: 'Можно — если эти колонки перечислены в `GROUP BY`.'
    explanation: |
      Агрегаты: `COUNT`, `SUM`, `AVG`, `MAX`, `MIN`. Без `GROUP BY` считают по всей выборке, с `GROUP BY` — по каждой
      группе. Это основа аналитических запросов: сколько заказов и на какую сумму у каждого пользователя.
    links:
      - https://www.postgresql.org/docs/current/tutorial-agg.html

  - id: node-011
    topic: Node.js
    level: middle
    question: |
      Какие утверждения про индексы в базе данных верны?
    options:
      - text: 'Ускоряют поиск по полям из `WHERE`'
        correct: true
        why: 'Без индекса база просматривает всю таблицу, с индексом — находит нужное быстро, как по оглавлению.'
      - text: 'Замедляют вставку и обновление'
        correct: true
        why: 'При каждой записи индекс тоже нужно обновить.'
      - text: 'Занимают дополнительное место'
        correct: true
        why: 'Индекс — отдельная структура данных рядом с таблицей.'
      - text: 'Ставятся автоматически на все колонки'
        why: 'Автоматически — обычно только на первичный ключ и уникальные поля. Остальные создают вручную.'
      - text: 'Меняют результат запроса'
        why: 'Индекс влияет только на скорость, результат тот же.'
    explanation: |
      Таблица — набор однотипных записей, строка — одна запись, колонка — поле. Первичный ключ уникально определяет
      строку, внешний — ссылается на строку другой таблицы. Индекс — как оглавление: ставят на поля, по которым
      часто ищут и сортируют.
    links:
      - https://www.postgresql.org/docs/current/indexes-intro.html

  - id: node-012
    topic: Node.js
    level: middle
    question: |
      Что выведет этот код в Node.js, запущенный как основной CommonJS-скрипт (`.js` без `"type": "module"`)? Укажи,
      что гарантировано.
    code: |
      setTimeout(() => console.log('timeout'), 0);
      setImmediate(() => console.log('immediate'));
      Promise.resolve().then(() => console.log('promise'));
      process.nextTick(() => console.log('nextTick'));
      console.log('sync');
    codeLang: js
    options:
      - text: '`sync`, `nextTick`, `promise`, дальше `timeout` и `immediate` в любом порядке'
        correct: true
        why: 'Очередь `nextTick` опустошается раньше промисов. Порядок таймера и `setImmediate` из основного модуля зависит от того, успел ли истечь таймер к началу цикла.'
      - text: '`sync`, `promise`, `nextTick`, `timeout`, `immediate`'
        why: '`process.nextTick` в Node.js приоритетнее промисов.'
      - text: '`sync`, `nextTick`, `promise`, всегда `timeout`, потом `immediate`'
        why: 'Из основного модуля этот порядок не гарантирован. Гарантирован он внутри I/O-колбэка — там `setImmediate` всегда раньше.'
      - text: '`nextTick`, `sync`, `promise`, `timeout`, `immediate`'
        why: '`nextTick` откладывается до конца текущей синхронной операции — `sync` выводится первым.'
    explanation: |
      В Node.js event loop построен на libuv и идёт по фазам: timers (`setTimeout`, `setInterval`), pending callbacks,
      poll (ожидание ввода-вывода), check (`setImmediate`), close callbacks. Микрозадачи — два уровня: сначала очередь
      `process.nextTick`, затем промисы и `queueMicrotask`. Обе опустошаются после каждого колбэка. В ES-модуле порядок
      другой: тело модуля само выполняется как промис, поэтому `promise` выведется раньше `nextTick`.
    links:
      - https://nodejs.org/en/learn/asynchronous-work/event-loop-timers-and-nexttick

  - id: node-013
    topic: Node.js
    level: middle
    question: |
      Что выведет этот код в Node.js?
    code: |
      const fs = require('fs');

      fs.readFile(__filename, () => {
        setTimeout(() => console.log('timeout'), 0);
        setImmediate(() => console.log('immediate'));
      });
    codeLang: js
    options:
      - text: '`immediate`, `timeout` — всегда'
        correct: true
        why: 'Колбэк чтения выполняется в фазе poll. Следующая фаза — check с `setImmediate`, а таймеры будут только на следующем круге.'
      - text: '`timeout`, `immediate` — всегда'
        why: 'После фазы poll цикл идёт в check, а не обратно в timers.'
      - text: 'В любом порядке'
        why: 'Неопределённость есть только при вызове из основного модуля. Внутри I/O-колбэка порядок фиксирован.'
      - text: 'Только `immediate`'
        why: 'Таймер тоже сработает — просто на следующем круге.'
    explanation: |
      `setImmediate` — «сделай в следующем обороте, после ввода-вывода» (фаза check). `process.nextTick` — «сделай
      сразу после текущей операции», ещё до продолжения цикла. Рекурсивный `nextTick` может уморить цикл голодом
      (starvation): до I/O и таймеров дело не дойдёт.
    links:
      - https://nodejs.org/en/learn/asynchronous-work/understanding-setimmediate

  - id: node-014
    topic: Node.js
    level: middle
    question: |
      Что выведет этот код в Node.js 22?
    code: |
      setTimeout(() => {
        console.log('t1');
        Promise.resolve().then(() => console.log('p1'));
      }, 0);

      setTimeout(() => {
        console.log('t2');
        Promise.resolve().then(() => console.log('p2'));
      }, 0);
    codeLang: js
    options:
      - text: '`t1`, `p1`, `t2`, `p2`'
        correct: true
        why: 'С Node.js 11 микрозадачи выполняются после каждого отдельного колбэка таймера — как в браузере.'
      - text: '`t1`, `t2`, `p1`, `p2`'
        why: 'Так было до Node.js 11: микрозадачи ждали, пока закончатся все таймеры фазы.'
      - text: '`p1`, `p2`, `t1`, `t2`'
        why: 'Промисы создаются внутри таймеров — раньше таймеров они выполниться не могут.'
      - text: '`t1`, `p1`, `p2`, `t2`'
        why: '`p2` появляется только во втором таймере.'
    explanation: |
      Главное изменение Node.js 11 — микрозадачи (`nextTick` и промисы) опустошаются после каждого колбэка в фазе, а
      не в конце всей фазы. Порядок «промис раньше таймера» для кода из основного скрипта был и раньше.
    links:
      - https://nodejs.org/en/learn/asynchronous-work/event-loop-timers-and-nexttick

  - id: node-015
    topic: Node.js
    level: middle
    question: |
      Чем отличается ошибка, брошенная внутри `queueMicrotask`, от ошибки внутри `Promise.then`?
    options:
      - text: 'Первая — uncaughtException, вторая — rejected-промис'
        correct: true
        why: 'Ошибка в `then` превращает следующий промис в rejected (`unhandledRejection`), а в `queueMicrotask` — сразу `uncaughtException`.'
      - text: 'Обе — отклонённые промисы, `unhandledRejection`'
        why: '`queueMicrotask` не создаёт промис — ошибке некуда превратиться.'
      - text: 'Первая молча теряется, вторая — rejected-промис'
        why: 'Ошибка из `queueMicrotask` не теряется — она всплывает как обычное необработанное исключение.'
      - text: 'Ничем — у них одна и та же очередь микрозадач'
        why: 'Очередь одна, но `then` оборачивает колбэк в промис, а `queueMicrotask` — нет.'
    explanation: |
      `queueMicrotask` и `Promise.then` попадают в одну очередь микрозадач, но `queueMicrotask` легче: не создаёт
      промис. `process.nextTick` — отдельная очередь Node.js с приоритетом выше. Рекурсивно поставленные микрозадачи
      и `nextTick` блокируют переход к следующей фазе.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Window/queueMicrotask

  - id: node-016
    topic: Node.js
    level: middle
    question: |
      Чем event loop в Node.js отличается от браузерного?
    options:
      - text: 'Фазы libuv для I/O, `setImmediate` и `process.nextTick`'
        correct: true
        why: 'В браузере нет фаз libuv, `setImmediate` и `nextTick`. Зато есть отрисовка и `requestAnimationFrame`.'
      - text: 'В Node.js микрозадачи выполняются после макрозадач фазы'
        why: 'С Node.js 11 микрозадачи идут после каждого колбэка, как в браузере.'
      - text: 'В Node.js нет микрозадач, только макрозадачи'
        why: 'Промисы и `queueMicrotask` в Node.js есть, плюс отдельная очередь `nextTick`.'
      - text: 'Node.js выполняет колбэки в нескольких потоках'
        why: 'JS-код по-прежнему в одном потоке. Пул потоков libuv работает внутри для файлов, DNS и криптографии.'
    explanation: |
      Общее — один поток JS, очереди задач и микрозадач, неблокирующая асинхронность. Браузер нацелен на плавный
      интерфейс: между задачами — отрисовка и `requestAnimationFrame`. Node.js — на ввод-вывод: файлы, сеть, БД через
      libuv (библиотека на C). `fetch` в Node.js тоже есть — глобально с 18-й версии.
    links:
      - https://nodejs.org/en/learn/asynchronous-work/event-loop-timers-and-nexttick

  - id: node-017
    topic: Node.js
    level: middle
    question: |
      Зачем проверять данные на бэкенде, если фронт уже валидирует форму?
    options:
      - text: 'Запрос можно отправить в обход фронта'
        correct: true
        why: 'Postman, curl или скрипт шлют что угодно. Бэкенд — последняя линия обороны.'
      - text: 'Фронтовая валидация не работает в старых браузерах'
        why: 'Дело не в браузерах: даже идеальная проверка на фронте не защищает от прямых запросов.'
      - text: 'Иначе база данных не примет запрос'
        why: 'База примет почти всё, что пройдёт её типы. Бизнес-правила проверяет приложение.'
      - text: 'Незачем: двойная проверка — это дублирование'
        why: 'Фронт проверяет ради удобства пользователя, бэк — ради безопасности. Это разные задачи.'
    explanation: |
      Никогда не доверяйте данным от клиента. Валидация на беке проверяет типы, обязательность, форматы (email,
      телефон), диапазоны, длину строк и уникальность, и отвечает `400` со списком ошибок. Инструменты — Zod
      (TypeScript-first, тип выводится из схемы), Joi, class-validator с NestJS.
    links:
      - https://zod.dev/

  - id: node-018
    topic: Node.js
    level: middle
    question: |
      Что даёт BFF (Backend For Frontend)?
    options:
      - text: 'Собирает данные нескольких сервисов в один ответ'
        correct: true
        why: 'Фронт делает один запрос вместо пяти, BFF ходит в сервисы параллельно.'
      - text: 'Хранит токены внешних API на сервере'
        correct: true
        why: 'Фронт получает только HttpOnly-куку сессии — через XSS украсть нечего.'
      - text: 'Отдаёт данные в формате, удобном для UI'
        correct: true
        why: 'Переименование полей, удаление лишнего, форматирование — на BFF, а не в компонентах.'
      - text: 'Заменяет базу данных и хранит данные фронтенда'
        why: 'BFF — прослойка-API, данные по-прежнему в основных сервисах.'
      - text: 'Обязателен для любого приложения с бэкендом'
        why: 'Для простого монолита, прототипа или статики он лишний.'
    explanation: |
      BFF — отдельный бэкенд-слой под конкретный клиент (веб, iOS, Android) между фронтом и основными сервисами. Он
      агрегирует и преобразует данные, хранит токены, кеширует, переживает падение отдельных сервисов, скрывает
      внутреннюю архитектуру, упрощает CORS, логирование и rate limiting.
    links:
      - https://learn.microsoft.com/en-us/azure/architecture/patterns/backends-for-frontends

  - id: node-019
    topic: Node.js
    level: middle
    question: |
      От чего НЕ защищает атрибут `HttpOnly` у куки?
    options:
      - text: 'От CSRF'
        correct: true
        why: 'Браузер прикладывает HttpOnly-куку к запросам с чужого сайта так же, как к любым другим. Против CSRF — `SameSite`.'
      - text: 'От перехвата по HTTP без шифрования'
        correct: true
        why: 'Это задача `Secure` и HTTPS.'
      - text: 'От чтения куки через `document.cookie` при XSS'
        why: 'Как раз от этого HttpOnly и защищает.'
      - text: 'От доступа к куке из любого скрипта на странице'
        why: 'Это та же защита от чтения из JavaScript — HttpOnly её даёт.'
    explanation: |
      HttpOnly — против кражи токена через XSS. Secure — против перехвата (MITM). SameSite — против CSRF. BFF решает
      другую задачу: токены внешних API и микросервисов вообще не попадают в браузер. Эти механизмы дополняют друг
      друга, а не заменяют.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Cookies#security

  - id: node-020
    topic: Node.js
    level: middle
    question: |
      Форма отправляется `POST`, сервер отвечает редиректом. Какой код сохранит метод `POST` при переходе?
    options:
      - text: '`307`'
        correct: true
        why: '307 Temporary Redirect, как и 308, требует повторить запрос тем же методом и телом.'
      - text: '`302`'
        why: 'Браузеры исторически меняют `POST` на `GET` при 302.'
      - text: '`303`'
        why: '303 See Other специально говорит: иди на новый адрес методом `GET`. Так делают после отправки формы.'
      - text: '`301`'
        why: 'Постоянный редирект, и `POST` при нём тоже обычно превращается в `GET`.'
    explanation: |
      Редиректы: 301 — навсегда, 302 — временно, 303 — «иди на другой URL через GET» (после POST), 304 — не изменился,
      бери из кеша, 307 и 308 — как 302 и 301, но с сохранением метода.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/307

  - id: node-021
    topic: Node.js
    level: middle
    question: |
      Какие пары «код — смысл» верны?
    options:
      - text: '`204` — успех без тела ответа'
        correct: true
        why: 'Например, после `DELETE`. Читать тело ответа не надо.'
      - text: '`409` — конфликт с текущим состоянием'
        correct: true
        why: 'Например, редактирование устаревшей версии данных.'
      - text: '`429` — слишком много запросов'
        correct: true
        why: 'Сработал rate limit. Сколько ждать — в заголовке `Retry-After`.'
      - text: '`502` — сервер не реализовал метод'
        why: '502 Bad Gateway — прокси получил плохой ответ от вышестоящего сервера. «Не реализовано» — 501.'
      - text: '`422` — тело запроса слишком большое'
        why: '422 — данные по формату верны, но не прошли бизнес-правила. Слишком большое тело — 413.'
    explanation: |
      2xx — успех, 3xx — редиректы, 4xx — ошибка клиента, 5xx — ошибка сервера. Главные: 200, 201, 204, 301, 304,
      400, 401, 403, 404, 409, 422, 429, 500, 502, 503. На 503 и 429 смотрят `Retry-After`, на 502 и 504 можно
      повторить запрос.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status

  - id: node-022
    topic: Node.js
    level: middle
    question: |
      Зачем у миграции базы данных функция `down`?
    options:
      - text: 'Чтобы откатить изменение схемы'
        correct: true
        why: '`up` вносит изменение, `down` — отменяет его, например удаляет созданную таблицу.'
      - text: 'Чтобы удалить все данные перед деплоем'
        why: 'Миграции меняют структуру, а не чистят базу.'
      - text: 'Чтобы понизить версию Node.js'
        why: 'Миграции касаются только схемы базы.'
      - text: 'Чтобы выключить базу на время обновления'
        why: 'Ничего не выключается — меняется схема.'
    explanation: |
      Миграции — файлы с изменениями структуры БД, «Git для схемы базы»: создать таблицу, добавить колонку. Все
      изменения в коде, у всех одна версия схемы, есть откат, CI/CD применяет их автоматически. ORM (TypeORM,
      Prisma) умеют генерировать миграции из моделей.
    links:
      - https://www.prisma.io/docs/orm/prisma-migrate

  - id: node-023
    topic: Node.js
    level: middle
    question: |
      Что разумно делать в обработчике `process.on('uncaughtException')`?
    options:
      - text: 'Залогировать ошибку и завершить процесс'
        correct: true
        why: 'Состояние приложения после такой ошибки непредсказуемо. Процесс перезапустит pm2 или systemd.'
      - text: 'Залогировать и продолжить работу как ни в чём не бывало'
        why: 'Могли остаться недописанные данные и открытые соединения — продолжать опасно.'
      - text: 'Повторить последний запрос пользователя'
        why: 'Обработчик не знает, какой запрос сломался, и повтор может навредить.'
      - text: 'Ничего: Node.js сам восстановит состояние'
        why: 'Node.js ничего не восстанавливает — без обработчика процесс просто упадёт.'
    explanation: |
      По документации Node.js после `uncaughtException` продолжать работу небезопасно: состояние приложения не
      определено. Обработчик нужен для синхронной очистки и логирования, затем `process.exit(1)`, а перезапуск делает
      менеджер процессов. Ошибки в асинхронном коде идут через колбэк `(err, data)` или `catch` промиса. В Express и NestJS — центральный
      error-handling middleware. Наружу — понятный JSON и правильный статус: 404 с кодом ошибки, 500 «что-то пошло не
      так», без деталей стека.
    links:
      - https://nodejs.org/api/process.html#event-uncaughtexception

  - id: node-024
    topic: Node.js
    level: middle
    question: |
      Какой встроенный модуль подойдёт, чтобы посчитать тяжёлую задачу, не блокируя event loop процесса?
    options:
      - text: '`worker_threads`'
        correct: true
        why: 'Запускает JS в отдельном потоке со своим event loop. Основной поток продолжает отвечать на запросы.'
      - text: '`process.nextTick` — отложить расчёт'
        why: 'Расчёт всё равно выполнится в главном потоке и заблокирует его, только чуть позже.'
      - text: '`setImmediate`'
        why: 'Он лишь откладывает код. Тяжёлый расчёт всё равно выполнится в главном потоке.'
      - text: '`async/await`'
        why: 'Асинхронность не делает вычисления параллельными: CPU-работа всё так же блокирует поток.'
    explanation: |
      Node.js плохо подходит для сложных вычислений — они блокируют event loop. Решения: `worker_threads` внутри
      приложения, несколько процессов через `cluster` или pm2, очередь задач (BullMQ и Redis, RabbitMQ) с отдельными
      воркерами, микросервис на другом языке (Go, Rust).
    links:
      - https://nodejs.org/api/worker_threads.html

  - id: node-025
    topic: Node.js
    level: middle
    question: |
      Сервер подтвердил транзакцию, и сразу отключилось питание. После перезапуска данные на месте. Какое свойство
      ACID это гарантирует?
    options:
      - text: 'Durability'
        correct: true
        why: 'Надёжность: подтверждённые изменения переживают сбой.'
      - text: 'Atomicity'
        why: 'Атомарность — транзакция выполняется целиком или никак.'
      - text: 'Consistency'
        why: 'Согласованность — транзакция переводит базу из одного корректного состояния в другое.'
      - text: 'Isolation'
        why: 'Изоляция — параллельные транзакции не мешают друг другу.'
    explanation: |
      ACID — требования к транзакциям: Atomicity (всё или ничего), Consistency (из корректного состояния в
      корректное), Isolation (параллельные транзакции не влияют друг на друга), Durability (подтверждённое не
      теряется). Это сильная сторона реляционных баз.
    links:
      - https://en.wikipedia.org/wiki/ACID

  - id: node-026
    topic: Node.js
    level: middle
    question: |
      Какого типа поток `zlib.createGzip()` в Node.js?
    options:
      - text: 'Transform'
        correct: true
        why: 'Принимает данные на вход и отдаёт преобразованные (сжатые) на выход.'
      - text: 'Readable'
        why: 'Readable только отдаёт данные, а в gzip их ещё и пишут.'
      - text: 'Writable'
        why: 'Writable только принимает. Gzip ещё и отдаёт результат.'
      - text: 'Duplex без связи входа и выхода'
        why: 'Transform — частный случай Duplex, где выход вычисляется из входа. У сокета вход и выход независимы.'
    explanation: |
      Stream — обработка данных по частям, без загрузки всего в память. Четыре типа: readable, writable, duplex,
      transform. Классика — чтение большого файла через `fs.createReadStream(...).pipe(zlib.createGzip()).pipe(res)`,
      видео, построчная обработка CSV и JSONL.
    links:
      - https://nodejs.org/api/stream.html#types-of-streams

  - id: node-027
    topic: Node.js
    level: middle
    multiple: true
    question: |
      Зачем в бэкенде брокер сообщений (Kafka, RabbitMQ)?
    options:
      - text: 'Чтобы сервисы обменивались сообщениями асинхронно и ничего не терялось'
        correct: true
        why: 'Сообщение ждёт в очереди, даже если получатель временно недоступен, а пики нагрузки сглаживаются.'
      - text: 'Чтобы распределять HTTP-запросы пользователей между серверами'
        why: 'Это задача балансировщика нагрузки (Nginx, AWS ELB).'
      - text: 'Чтобы хранить основные данные приложения вместо базы'
        why: 'Брокер — транспорт сообщений, а не основное хранилище.'
      - text: 'Чтобы ускорить ответы за счёт кеша в памяти'
        why: 'Это задача Redis или Memcached.'
    explanation: |
      Микросервисная архитектура — приложение как набор небольших независимых сервисов со своей логикой и часто своей
      базой; общаются через API (REST, gRPC) или брокер сообщений. Балансировщик распределяет входящие запросы между
      серверами. Кеш (Redis) ускоряет чтение, а инвалидация кеша — удаление устаревших данных после изменения в базе.
    links:
      - https://www.rabbitmq.com/tutorials

  # ===================== Git =====================
  - id: git-001
    topic: Git
    level: middle
    multiple: true
    question: |
      Что делает `git cherry-pick <хэш>`?
    options:
      - text: 'Применяет выбранный коммит к текущей ветке новым коммитом'
        correct: true
        why: 'Изменения коммита переносятся в текущую ветку, но коммит получает новый хэш — это копия, а не перенос.'
      - text: 'Переносит коммит из другой ветки, удаляя его там'
        why: 'Исходная ветка не меняется, коммит в ней остаётся.'
      - text: 'Сливает всю ветку, где лежит этот коммит'
        why: 'Это `merge`. `cherry-pick` берёт только выбранные коммиты.'
      - text: 'Переключает HEAD на выбранный коммит'
        why: 'Так делает `git checkout <хэш>` или `git switch --detach`.'
    explanation: |
      `cherry-pick` выборочно применяет коммиты к текущей ветке HEAD. Типичный случай — перенести исправление из одной
      ветки в другую, не сливая всё остальное. Конфликты разрешаются так же, как при merge.
    links:
      - https://git-scm.com/docs/git-cherry-pick

  - id: git-002
    topic: Git
    level: middle
    question: |
      Чем `git fetch` отличается от `git pull`?
    options:
      - text: '`fetch` только скачивает, `pull` ещё и вливает в ветку'
        correct: true
        why: '`pull` = `fetch` + `merge` (или `rebase` с флагом). После `fetch` рабочие файлы не меняются.'
      - text: '`fetch` скачивает и вливает, `pull` только скачивает'
        why: 'Наоборот: только скачивает именно `fetch`.'
      - text: '`fetch` работает с одной веткой, `pull` — со всеми сразу'
        why: 'Разница не в числе веток, а в том, вливаются ли изменения.'
      - text: '`pull` отправляет коммиты на сервер, `fetch` получает'
        why: 'Отправляет `push`. И `pull`, и `fetch` получают.'
    explanation: |
      `git fetch` получает все отсутствующие данные с удалённого репозитория и обновляет удалённые ветки
      (`origin/main`), не трогая ваши. `git pull` после этого сливает удалённую ветку в текущую. Безопасный путь —
      сначала `fetch`, посмотреть разницу, потом решить.
    links:
      - https://git-scm.com/docs/git-pull

  - id: git-003
    topic: Git
    level: middle
    question: |
      Для чего нужен `git bisect`?
    options:
      - text: 'Найти коммит, который сломал поведение'
        correct: true
        why: 'Git делит историю пополам между «хорошим» и «плохим» коммитами, вы отмечаете каждый — и за `log n` шагов находится виновник.'
      - text: 'Разделить большой коммит на несколько'
        why: 'Это делают через `rebase -i` с `edit` и `reset`.'
      - text: 'Разбить репозиторий на два'
        why: 'Для этого `git subtree split` или `filter-repo`.'
      - text: 'Сравнить две ветки построчно'
        why: 'Это `git diff`.'
    explanation: |
      Сценарий: `git bisect start`, `git bisect bad` (текущий сломан), `git bisect good <хэш>` (здесь работало). Git
      переключается на середину — проверяете и отмечаете `good` или `bad`. В конце `git bisect reset`. Проверку
      можно автоматизировать: `git bisect run <скрипт>`.
    links:
      - https://git-scm.com/docs/git-bisect

  - id: git-004
    topic: Git
    level: middle
    question: |
      Чем `git stash pop` отличается от `git stash apply`?
    options:
      - text: '`pop` применяет изменения и удаляет запись, `apply` — оставляет'
        correct: true
        why: 'После `apply` запись остаётся в `git stash list`, её можно применить ещё раз или удалить `drop`.'
      - text: '`apply` применяет и удаляет, `pop` — оставляет запись'
        why: 'Наоборот: «вытолкнуть» (`pop`) значит забрать из стека.'
      - text: '`pop` применяет только к текущей ветке, `apply` — к любой'
        why: 'Оба применяют к текущей ветке.'
      - text: 'Ничем, это синонимы'
        why: 'Разница в судьбе записи в stash.'
    explanation: |
      `git stash` сохраняет незакоммиченные изменения в локальное хранилище и очищает рабочую копию. `git stash list`
      — список записей, `git stash push -m "имя"` — с подписью (`stash save` устарел), `pop` — применить и удалить,
      `apply` — применить и оставить, `drop` — удалить запись, `clear` — удалить все.
    links:
      - https://git-scm.com/docs/git-stash

  - id: git-005
    topic: Git
    level: middle
    multiple: true
    question: |
      Что хранит коммит в Git?
    options:
      - text: 'Снимок дерева файлов, ссылки на родителей, автора, время и сообщение'
        correct: true
        why: 'Коммит указывает на tree — состояние всех файлов проекта, а не только изменённых. Разница вычисляется сравнением снимков.'
      - text: 'Только изменённые файлы и ссылку на один предыдущий коммит'
        why: 'Хранится снимок всего проекта (неизменённые файлы переиспользуются), а у merge-коммита родителей два.'
      - text: 'Построчную разницу (diff) с предыдущим коммитом'
        why: 'Git хранит снимки, а диффы показывает, вычисляя их на лету.'
      - text: 'Копию всего репозитория вместе с историей'
        why: 'История — это цепочка коммитов через ссылки на родителей, а не копия внутри каждого.'
    explanation: |
      Коммит — объект с хэшем: ссылка на дерево (tree), ссылки на родительские коммиты, автор и коммитер с метками
      времени, сообщение. История — граф, где каждый коммит ссылается на родителей. Одинаковые файлы хранятся один раз
      — поэтому снимки не раздувают репозиторий.
    links:
      - https://git-scm.com/book/en/v2/Git-Internals-Git-Objects

  - id: git-006
    topic: Git
    level: middle
    question: |
      Последний коммит ещё не отправлен. Какая команда отменит его, но оставит изменения в индексе, готовыми к новому
      коммиту?
    options:
      - text: '`git reset --soft HEAD~`'
        correct: true
        why: 'Ветка сдвигается на коммит назад, а изменения остаются в индексе — можно сразу закоммитить заново.'
      - text: '`git reset --hard HEAD~`'
        why: 'Сотрёт и коммит, и изменения в файлах.'
      - text: '`git revert HEAD`'
        why: 'Создаст новый коммит с обратными изменениями — для уже опубликованной истории.'
      - text: '`git reset HEAD~`'
        why: 'Это `--mixed`: коммит отменится, изменения останутся в файлах, но не в индексе.'
    explanation: |
      `reset` двигает ветку: `--soft` — изменения остаются в индексе, `--mixed` (по умолчанию) — в рабочих файлах,
      `--hard` — удаляются. Ещё вариант — `git rebase -i` и `drop` нужного коммита. Для опубликованных коммитов
      историю не переписывают — используют `git revert`.
    links:
      - https://git-scm.com/docs/git-reset

  - id: git-007
    topic: Git
    level: middle
    question: |
      Как увидеть список файлов, изменённых в конкретном коммите?
    options:
      - text: '`git show --name-only <хэш>`'
        correct: true
        why: 'Покажет коммит и только имена изменённых файлов, без построчной разницы.'
      - text: '`git status <хэш>`'
        why: '`status` показывает текущее состояние рабочей копии, коммиты не принимает.'
      - text: '`git branch --contains <хэш>`'
        why: 'Покажет ветки, где есть коммит, а не его файлы.'
      - text: '`git diff --cached <хэш>`'
        why: 'Сравнит текущий индекс с этим коммитом, а не покажет изменения самого коммита.'
    explanation: |
      `git log` — найти нужный коммит, `git show <хэш>` — увидеть его изменения целиком, `--name-only` или
      `--stat` — только список файлов. Ещё вариант — `git diff-tree --no-commit-id --name-only -r <хэш>`.
    links:
      - https://git-scm.com/docs/git-show

  - id: git-008
    topic: Git
    level: middle
    question: |
      Каким хуком запускают линтер и тесты перед каждым коммитом?
    options:
      - text: '`pre-commit`'
        correct: true
        why: 'Срабатывает до создания коммита. Если проверка упала, коммит не создаётся.'
      - text: '`post-commit`'
        why: 'Выполняется уже после коммита — остановить его не может.'
      - text: '`pre-push`'
        why: 'Срабатывает перед отправкой на сервер, а не перед коммитом.'
      - text: '`commit-msg`'
        why: 'Проверяет текст сообщения коммита, а не код.'
    explanation: |
      Хуки лежат в `.git/hooks` и в репозиторий не попадают, поэтому их ставят через husky, lefthook или
      `core.hooksPath`. Вместе с husky часто используют lint-staged — проверять только изменённые файлы.
    links:
      - https://git-scm.com/book/en/v2/Customizing-Git-Git-Hooks

  - id: git-009
    topic: Git
    level: middle
    multiple: true
    question: |
      Что делает `git rm -r --cached build/`?
    options:
      - text: 'Перестаёт отслеживать папку, но оставляет её на диске'
        correct: true
        why: '`--cached` убирает файлы из индекса. На диске они остаются, а в следующем коммите будут удалены из репозитория.'
      - text: 'Удаляет папку и с диска, и из репозитория'
        why: 'Так работает `git rm -r` без `--cached`.'
      - text: 'Очищает кеш Git для этой папки'
        why: 'Здесь `cached` — это индекс, а не кеш.'
      - text: 'Добавляет папку в `.gitignore`'
        why: 'В `.gitignore` надо дописать вручную, иначе папка снова попадёт в индекс при `git add .`.'
    explanation: |
      Индекс (stage) — область, где собирается следующий коммит. Unstaged — изменения в файлах, ещё не добавленные в
      индекс. `git rm --cached` — частый приём, когда в репозиторий случайно закоммитили папку сборки или секреты (для
      секретов этого мало: они остаются в истории).
    links:
      - https://git-scm.com/docs/git-rm

  - id: git-010
    topic: Git
    level: middle
    multiple: true
    question: |
      Что происходит при `git rebase main`, если вы стоите на ветке `feature`?
    options:
      - text: 'Коммиты `feature` пересоздаются поверх `main` с новыми хэшами'
        correct: true
        why: 'Rebase переносит ваши коммиты на новую базу. История выглядит линейной, а старые коммиты больше не в ветке.'
      - text: 'Создаётся коммит слияния, история остаётся как есть'
        why: 'Это `merge`.'
      - text: 'Ветка `main` удаляется после переноса'
        why: 'Rebase ничего не удаляет: `main` не меняется вовсе.'
      - text: 'Коммиты `main` переносятся в начало `feature`'
        why: 'Переносятся коммиты текущей ветки, а не `main`.'
    explanation: |
      Merge сохраняет историю как есть и добавляет коммит слияния — больше коммитов, видны ветвления. Rebase
      переписывает историю: коммиты пересоздаются, история линейная. Поэтому опубликованные общие ветки не
      ребейзят — у коллег останутся старые коммиты.
    links:
      - https://git-scm.com/book/en/v2/Git-Branching-Rebasing

  - id: git-011
    topic: Git
    level: middle
    question: |
      Как поменять адрес удалённого репозитория `origin`?
    options:
      - text: '`git remote set-url origin <новый-url>`'
        correct: true
        why: 'Меняет ссылку существующего remote. Проверить — `git remote -v`.'
      - text: '`git remote add origin <новый-url>`'
        why: '`origin` уже существует — команда упадёт. `add` — для нового remote.'
      - text: '`git clone <новый-url> origin`'
        why: 'Склонирует новый репозиторий в папку `origin`, текущий не изменится.'
      - text: '`git push --set-upstream <новый-url>`'
        why: 'Настраивает отслеживаемую ветку, а не адрес remote.'
    explanation: |
      `git remote -v` — посмотреть ссылки, `git remote add origin <url>` — добавить, `git remote set-url origin <url>`
      — изменить. Похожие повседневные команды: переименовать текущую ветку — `git branch -m <новое>`, любую — `git
      branch -m <старое> <новое>`.
    links:
      - https://git-scm.com/docs/git-remote

  - id: git-012
    topic: Git
    level: middle
    question: |
      Как склеить три последних коммита в один?
    options:
      - text: '`git rebase -i HEAD~3` и `squash` у двух коммитов'
        correct: true
        why: 'В интерактивном rebase у коммитов, которые надо влить в предыдущий, ставят `s` (squash) или `f` (fixup).'
      - text: '`git merge --squash HEAD~3` в текущей ветке'
        why: '`merge --squash` сжимает чужую ветку при слиянии, а не последние коммиты текущей.'
      - text: '`git commit --amend HEAD~3` с новым сообщением'
        why: '`--amend` меняет только последний коммит.'
      - text: '`git stash` три раза и `git stash pop`'
        why: 'Stash работает с незакоммиченными изменениями, а не с коммитами.'
    explanation: |
      `git rebase -i HEAD~N` открывает список последних N коммитов: `pick` — оставить, `squash` — склеить с предыдущим
      и объединить сообщения, `fixup` — склеить и выкинуть сообщение, `drop` — удалить, `reword` — поменять
      сообщение. Альтернатива — `git reset --soft HEAD~3` и один новый коммит.
    links:
      - https://git-scm.com/book/en/v2/Git-Tools-Rewriting-History

  - id: git-013
    topic: Git
    level: middle
    question: |
      Какая команда покажет ветки, уже влитые в текущую?
    options:
      - text: '`git branch --merged`'
        correct: true
        why: 'Покажет ветки, чьи коммиты уже есть в истории текущей. Их можно безопасно удалить.'
      - text: '`git branch --no-merged`'
        why: 'Наоборот — ещё не влитые ветки.'
      - text: '`git merge --status`'
        why: 'Такого флага нет.'
      - text: '`git log --branches`'
        why: 'Покажет историю всех веток, но не ответит, влита ли ветка.'
    explanation: |
      `git branch --merged` и `--no-merged` помогают чистить старые ветки. Проверить конкретную ветку можно через
      `git merge-base --is-ancestor feature main`.
    links:
      - https://git-scm.com/docs/git-branch

  - id: git-014
    topic: Git
    level: middle
    question: |
      Какие утверждения про Git Flow и trunk-based development верны?
    options:
      - text: 'В Git Flow фичи отводятся от `develop` и вливаются в `develop`'
        correct: true
        why: 'Ветка `develop` копит изменения к следующему релизу.'
      - text: 'В Git Flow `release` и `hotfix` вливаются и в `master`, и в `develop`'
        correct: true
        why: 'Чтобы исправления не потерялись в следующих релизах.'
      - text: 'В trunk-based ветки фич короткие и быстро вливаются в основную'
        correct: true
        why: 'Цель — непрерывная интеграция без долгих веток и тяжёлых конфликтов.'
      - text: 'В trunk-based у каждого разработчика своя долгоживущая ветка'
        why: 'Наоборот: все работают в одной ветке (trunk), отдельные ветки живут часы или дни.'
      - text: '`hotfix` в Git Flow отводится от `develop`'
        why: '`hotfix` чинит продакшен, поэтому отводится от `master`.'
    explanation: |
      Git Flow (Винсент Дриссен, 2010): `master` — стабильные релизы с тегами, `develop` — разработка, `feature` —
      задачи, `release` — подготовка выпуска, `hotfix` — срочные исправления. Подходит для версионных релизов.
      Trunk-based: одна основная ветка, короткие ветки фич, релизные ветки с тегами отводятся от `master`. Подходит
      для частых деплоев с хорошими тестами и feature-флагами.
    links:
      - https://nvie.com/posts/a-successful-git-branching-model/

  - id: git-015
    topic: Git
    level: middle
    multiple: true
    question: |
      Чем аннотированный тег отличается от лёгкого?
    options:
      - text: 'Хранит автора, дату и сообщение как отдельный объект'
        correct: true
        why: '`git tag -a v1.0 -m "..."` создаёт объект тега. Его используют для релизов.'
      - text: 'Его нельзя удалить'
        why: 'Удаляется так же: `git tag -d`.'
      - text: 'Он двигается вместе с веткой'
        why: 'Теги не двигаются — это неподвижная метка на коммите.'
      - text: 'Он автоматически отправляется при `git push`'
        why: 'Теги отправляют явно: `git push --tags` или `git push origin v1.0`.'
    explanation: |
      Тег — способ поставить постоянную точку в истории, обычно версию релиза. Лёгкий тег (`git tag v1.0`) — просто
      ссылка на коммит. Аннотированный (`git tag -a`) — полноценный объект с метаданными, его можно подписать.
    links:
      - https://git-scm.com/book/en/v2/Git-Basics-Tagging

  - id: git-016
    topic: Git
    level: middle
    question: |
      Склонировали проект с подмодулем — папка подмодуля пустая. Что нужно сделать?
    options:
      - text: '`git submodule update --init`'
        correct: true
        why: 'Инициализирует подмодуль и извлекает коммит, зафиксированный в основном проекте. При клонировании можно сразу `--recurse-submodules`.'
      - text: '`git pull` в основном проекте'
        why: '`pull` скачает изменения, но не заполнит подмодуль.'
      - text: '`git submodule add <url>` ещё раз'
        why: '`add` добавляет новый подмодуль, а он уже есть.'
      - text: 'Скопировать файлы подмодуля вручную'
        why: 'Подмодуль — отдельный репозиторий, его содержимое управляется Git.'
    explanation: |
      Подмодуль — Git-репозиторий внутри другого, в подкаталоге; основной проект хранит ссылку на конкретный коммит.
      После `git pull` основного проекта подмодуль тоже надо обновить — `git submodule update`. Внутри подмодуля
      работают как в обычном репозитории, а `git diff --submodule` показывает его изменения.
    links:
      - https://git-scm.com/book/en/v2/Git-Tools-Submodules

  # ===================== Сети и браузер =====================
  - id: net-001
    topic: Сети и браузер
    level: middle
    question: |
      Как Content Security Policy защищает от XSS?
    options:
      - text: 'Ограничивает источники скриптов и другого контента'
        correct: true
        why: 'Например, `script-src ''self''` запретит внедрённые inline-скрипты и скрипты с чужих доменов.'
      - text: 'Экранирует пользовательский ввод на сервере и клиенте'
        why: 'Экранирование — отдельная мера в коде. CSP работает в браузере и ограничивает источники.'
      - text: 'Шифрует ответы сервера перед отправкой в браузер'
        why: 'Шифрование — задача HTTPS/TLS.'
      - text: 'Запрещает отправку кук на сторонние сайты'
        why: 'Это `SameSite` у кук.'
    explanation: |
      CSP — HTTP-заголовок `Content-Security-Policy`, который говорит браузеру, из каких источников можно грузить и
      выполнять скрипты, стили, картинки, фреймы. Пример: `default-src 'self'; script-src 'self'
      https://trusted.cdn.com`. Это второй рубеж защиты от XSS — первый всё равно экранирование и санитизация.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP

  - id: net-002
    topic: Сети и браузер
    level: middle
    question: |
      Какие пороги «хорошо» у Core Web Vitals верны?
    options:
      - text: 'LCP — до 2,5 секунды'
        correct: true
        why: 'Самый крупный видимый элемент должен отрисоваться за 2,5 с, хуже 4 с — плохо.'
      - text: 'CLS — до 0,1'
        correct: true
        why: 'Суммарное смещение макета меньше 0,1 — хорошо, больше 0,25 — плохо.'
      - text: 'INP — до 200 мс'
        correct: true
        why: 'Задержка до следующей отрисовки после взаимодействия; больше 500 мс — плохо.'
      - text: 'FID — главная метрика отзывчивости с 2024 года'
        why: 'В марте 2024 года FID заменили на INP: FID мерил только первое взаимодействие и только задержку до обработчика.'
      - text: 'TTFB входит в Core Web Vitals'
        why: 'TTFB — вспомогательная метрика. Core Web Vitals — LCP, INP и CLS.'
    explanation: |
      Core Web Vitals — метрики Google: LCP (загрузка), INP (отзывчивость), CLS (визуальная стабильность). Вспомогательные
      — FCP (первый контент, до 1,8 с), TTFB, TBT (суммарное время блокировки потока). Измеряют библиотекой
      `web-vitals` или `PerformanceObserver`.
    links:
      - https://web.dev/articles/vitals

  - id: net-003
    topic: Сети и браузер
    level: middle
    question: |
      Что поможет улучшить LCP, если LCP-элемент — большая картинка на первом экране?
    options:
      - text: '`fetchpriority="high"` и `<link rel="preload">` для картинки'
        correct: true
        why: 'Браузер начнёт качать её раньше и с высоким приоритетом.'
      - text: 'Адаптивные размеры через `srcset` и `sizes`'
        correct: true
        why: 'Меньше байт — быстрее загрузка на мобильных.'
      - text: '`loading="lazy"` у этой картинки'
        why: 'Ленивая загрузка картинки первого экрана задержит её — LCP станет хуже.'
      - text: 'Блокирующий `<script>` в `<head>` перед картинкой'
        why: 'Блокирующий скрипт откладывает разбор страницы и отрисовку.'
    explanation: |
      LCP ускоряют: оптимизация и предзагрузка главной картинки, удаление блокирующего JS (`async`, `defer`), SSR,
      CDN для статики. CLS лечат размерами у картинок (`width`/`height` или `aspect-ratio`), местом под рекламу,
      `font-display`, анимациями через `transform`. INP — разбиением длинных задач, Web Worker, ленивым импортом.
    links:
      - https://web.dev/articles/optimize-lcp

  - id: net-004
    topic: Сети и браузер
    level: middle
    question: |
      Что из этого вызывает смещение макета (CLS)?
    options:
      - text: '`<img>` без `width` и `height`'
        correct: true
        why: 'Пока картинка не загружена, место под неё не зарезервировано — контент прыгает.'
      - text: 'Рекламный блок, который вставляется без заранее отведённого места'
        correct: true
        why: 'Контент неизвестного размера сдвигает всё, что ниже.'
      - text: 'Анимация через `transform: translateX()`'
        why: '`transform` не меняет раскладку и в CLS не считается.'
      - text: 'Смещение сразу после клика пользователя'
        why: 'Сдвиги в течение 500 мс после ввода пользователя в CLS не учитываются — их ожидают.'
    explanation: |
      CLS — сумма неожиданных смещений макета. Оценка одного сдвига — доля видимой области, которую задело, умноженная
      на относительное расстояние сдвига. Защита — резервировать место, грузить шрифты с `font-display`, анимировать
      `transform` вместо `top` и `margin`.
    links:
      - https://web.dev/articles/cls

  - id: net-005
    topic: Сети и браузер
    level: middle
    question: |
      Что выполняется после завершения текущей макрозадачи в браузере?
    options:
      - text: 'Все микрозадачи, затем при необходимости отрисовка'
        correct: true
        why: 'Очередь микрозадач опустошается целиком, потом браузер может выполнить rAF и нарисовать кадр, и только потом берёт следующую задачу.'
      - text: 'Одна микрозадача, затем следующая макрозадача из очереди'
        why: 'Микрозадачи выполняются все, включая добавленные по ходу.'
      - text: 'Все оставшиеся макрозадачи, потом микрозадачи'
        why: 'Макрозадачи берутся по одной, между ними — микрозадачи.'
      - text: 'Всегда отрисовка, потом микрозадачи'
        why: 'Микрозадачи раньше отрисовки, а сама отрисовка бывает не после каждой задачи.'
    explanation: |
      Event loop не часть V8 — его реализует окружение (браузер, Node.js с libuv). Макрозадачи: таймеры, события,
      сообщения. Микрозадачи: колбэки промисов, `queueMicrotask`, `MutationObserver`. Отрисовка с
      `requestAnimationFrame` бывает примерно раз в кадр.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/HTML_DOM_API/Microtask_guide

  - id: net-006
    topic: Сети и браузер
    level: middle
    question: |
      Какие утверждения про версии HTTP верны?
    options:
      - text: 'HTTP/2 мультиплексирует много запросов в одном TCP-соединении'
        correct: true
        why: 'Запросы и ответы идут параллельными потоками по одному соединению.'
      - text: 'HTTP/3 работает поверх QUIC на UDP'
        correct: true
        why: 'QUIC сам обеспечивает надёжность и встроенный TLS 1.3.'
      - text: 'HTTP/2 передаёт данные в бинарном формате и сжимает заголовки HPACK'
        correct: true
        why: 'В HTTP/3 для заголовков — QPACK.'
      - text: 'В HTTP/1.1 соединение закрывается после каждого запроса'
        why: 'В HTTP/1.1 соединения постоянные (keep-alive) по умолчанию. Но запросы в одном соединении идут по очереди.'
      - text: 'HTTP/2 полностью избавляет от head-of-line blocking'
        why: 'На уровне TCP блокировка осталась: потерянный пакет тормозит все потоки. Её убрал QUIC в HTTP/3.'
    explanation: |
      HTTP/1.1 — текстовый, запросы в соединении по очереди, браузер открывает до 6 соединений на домен. HTTP/2 (2015) —
      бинарный, мультиплексирование, HPACK. HTTP/3 (2022) — QUIC поверх UDP, быстрее устанавливает соединение и не
      блокируется потерей одного пакета; хорош для мобильных сетей. Server push из HTTP/2 браузеры отключили.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Evolution_of_HTTP

  - id: net-007
    topic: Сети и браузер
    level: middle
    question: |
      Какие утверждения про JWT верны?
    options:
      - text: 'Payload закодирован в Base64Url, но не зашифрован'
        correct: true
        why: 'Его может прочитать любой, поэтому секреты в payload не кладут.'
      - text: 'Подпись не даёт изменить payload незаметно'
        correct: true
        why: 'Без секретного ключа нельзя пересчитать подпись под изменённые данные.'
      - text: 'Выданный токен нельзя отозвать без дополнительных механизмов'
        correct: true
        why: 'Токен валиден до `exp`. Отзыв — через короткий срок жизни, refresh-токены или чёрный список.'
      - text: 'Сервер хранит каждый выданный JWT в своей базе'
        why: 'JWT — stateless: серверу достаточно проверить подпись и срок.'
      - text: 'Payload зашифрован секретом сервера'
        why: 'Шифрования нет — только подпись. Зашифрованные токены — это JWE.'
    explanation: |
      JWT (RFC 7519) — три части через точку: header (алгоритм), payload (claims: `sub`, `exp`, `iss`, `aud` и свои),
      signature. Клиент отправляет его в `Authorization: Bearer <token>`. Access-токен живёт минуты, refresh — дни.
      Хранить лучше в HttpOnly-куке, а не в localStorage. Альтернативы — opaque-токены, сессии, PASETO.
    links:
      - https://jwt.io/introduction

  - id: net-008
    topic: Сети и браузер
    level: middle
    question: |
      Какие HTTP-методы идемпотентны?
    options:
      - text: '`PUT`'
        correct: true
        why: 'Повтор того же `PUT` оставит ресурс в том же состоянии.'
      - text: '`DELETE`'
        correct: true
        why: 'Удалить уже удалённое — состояние то же (ответ может отличаться).'
      - text: '`GET`'
        correct: true
        why: 'Чтение не меняет состояние.'
      - text: '`POST`'
        why: 'Два одинаковых `POST` обычно создадут два ресурса.'
      - text: '`PATCH`'
        why: 'Не гарантированно: например, «увеличь счётчик на 1» при повторе даст другой результат.'
    explanation: |
      REST — архитектурный стиль (Рой Филдинг, 2000). RESTful API работает с ресурсами через методы HTTP: `GET` —
      получить, `POST` — создать, `PUT` — заменить целиком, `PATCH` — частично, `DELETE` — удалить, `HEAD` — только
      заголовки, `OPTIONS` — возможности (на нём preflight CORS). Идемпотентность важна для безопасных повторов
      запросов.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/Idempotent

  - id: net-009
    topic: Сети и браузер
    level: middle
    question: |
      Что умеет `EventSource` (Server-Sent Events) из коробки?
    options:
      - text: 'Сам переподключается после обрыва'
        correct: true
        why: 'Задержку задаёт поле `retry:` в потоке.'
      - text: 'Отправляет `Last-Event-ID` при переподключении'
        correct: true
        why: 'Сервер узнаёт, с какого сообщения продолжить.'
      - text: 'Отправлять сообщения от клиента серверу'
        why: 'SSE однонаправленный: только сервер → клиент. Клиент шлёт данные обычными запросами.'
      - text: 'Передавать бинарные данные'
        why: 'SSE текстовый, бинарное — через WebSocket или Base64.'
    explanation: |
      SSE работает поверх обычного HTTP, сообщения — строки `data:`, `event:`, `id:` с пустой строкой в конце.
      Подходит для ленты, уведомлений, метрик. На HTTP/1.1 браузер держит до 6 соединений на домен — несколько
      вкладок с SSE быстро упираются в лимит; на HTTP/2 этого ограничения практически нет.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events

  - id: net-010
    topic: Сети и браузер
    level: middle
    question: |
      Как ведёт себя страница с ISR (`revalidate: 60`), когда прошло больше 60 секунд с генерации?
    options:
      - text: 'Отдаётся старая версия, а в фоне генерируется новая'
        correct: true
        why: 'Это stale-while-revalidate: первый запрос после истечения получает устаревшую страницу и запускает пересборку.'
      - text: 'Пользователь ждёт, пока сервер сгенерирует новую'
        why: 'Ожидания нет — новую версию получат следующие запросы.'
      - text: 'Страница пересобирается ровно каждые 60 секунд по таймеру'
        why: 'Пересборку запускает запрос, а не таймер. Нет запросов — нет пересборки.'
      - text: 'Отдаётся 404 до конца пересборки'
        why: 'Старая версия остаётся доступной.'
    explanation: |
      SSG собирает HTML на этапе билда — быстро, дёшево, хорошо для SEO; подходит для блогов, документации, каталогов.
      ISR добавляет фоновое обновление по `revalidate`, on-demand ревалидация (`res.revalidate()` или
      `revalidatePath`) обновляет страницу по событию, например из CMS.
    links:
      - https://nextjs.org/docs/pages/guides/incremental-static-regeneration

  - id: net-011
    topic: Сети и браузер
    level: middle
    question: |
      Что даёт SSR по сравнению с рендерингом только на клиенте?
    options:
      - text: 'Готовый HTML сразу, быстрее первый контент и SEO'
        correct: true
        why: 'Пользователь и поисковик видят содержимое без ожидания загрузки JS.'
      - text: 'Полную защиту от XSS-атак на клиенте'
        why: 'SSR от XSS не защищает: экранировать данные всё равно нужно, а сериализация состояния в HTML сама бывает источником XSS.'
      - text: 'Интерактивность кнопок и форм без загрузки JavaScript'
        why: 'Для кнопок и форм страницу всё равно нужно гидрировать — загрузить и выполнить JS.'
      - text: 'Нулевую нагрузку на сервер при каждом запросе'
        why: 'Наоборот, сервер рендерит страницу на каждый запрос.'
    explanation: |
      SSR — HTML формируется на сервере для каждого запроса и отправляется клиенту, потом гидрируется. Плюсы: быстрее
      первый контент, SEO, полноценная страница сразу. Минусы: нагрузка на сервер, TTFB выше, чем у статики.
    links:
      - https://web.dev/articles/rendering-on-the-web

  - id: net-012
    topic: Сети и браузер
    level: middle
    question: |
      Чем long polling отличается от обычного polling?
    options:
      - text: 'Сервер держит запрос, пока не появятся данные'
        correct: true
        why: 'Клиент получает сообщение без задержки и сразу открывает новый запрос.'
      - text: 'Клиент опрашивает сервер реже'
        why: 'Дело не в частоте: запрос просто висит, пока не появится ответ.'
      - text: 'Используется отдельный протокол поверх TCP'
        why: 'Long polling — обычные HTTP-запросы.'
      - text: 'Сервер может слать несколько сообщений в одном ответе подряд'
        why: 'Это поток SSE. При long polling один ответ — и новый запрос.'
    explanation: |
      Обычный polling — спрашиваем каждые N секунд, много пустых ответов. Long polling — запрос висит до события, потом
      клиент сразу шлёт новый; при таймауте (502 или 504 от прокси) — переподключение. SSE — один постоянный поток
      от сервера. WebSocket — двусторонний канал.
    links:
      - https://javascript.info/long-polling

  - id: net-013
    topic: Сети и браузер
    level: middle
    question: |
      Каким кодом сервер отвечает на успешное рукопожатие WebSocket по HTTP/1.1?
    options:
      - text: '`101 Switching Protocols`'
        correct: true
        why: 'После него по тому же TCP-соединению идут кадры WebSocket.'
      - text: '`200 OK`'
        why: 'С 200 соединение осталось бы HTTP, и клиент счёл бы рукопожатие неудачным.'
      - text: '`204 No Content`'
        why: 'Это успешный ответ без тела, к смене протокола отношения не имеет.'
      - text: '`426 Upgrade Required`'
        why: 'Это отказ: сервер требует другой протокол или версию.'
    explanation: |
      WebSocket (RFC 6455, 2011) — двусторонний обмен по одному TCP-соединению. Начинается как HTTP-запрос с
      `Upgrade: websocket`, дальше идут бинарные кадры без накладных расходов HTTP. Минусы: сложнее настройка, нет
      HTTP-кэша, переподключение и авторизацию пишут сами.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API

  - id: net-014
    topic: Сети и браузер
    level: middle
    question: |
      Access-токен WebSocket-соединения истёк. Какие решения разумны?
    options:
      - text: 'Обновить токен по HTTP и переподключиться'
        correct: true
        why: 'Простой и надёжный путь: сервер закрывает соединение своим кодом, клиент обновляет токен и подключается заново.'
      - text: 'Обновить токен по HTTP и прислать его в сокет'
        correct: true
        why: 'Без разрыва соединения: сервер проверит токен и обновит его для этого сокета.'
      - text: 'Продолжать слать сообщения со старым токеном'
        why: 'Сервер, проверяющий срок токена, такие сообщения отвергнет или закроет соединение. Открытое соединение не продлевает токен.'
      - text: 'Ничего: WebSocket сам обновляет токены соединения'
        why: 'Встроенной поддержки токенов в WebSocket нет.'
    explanation: |
      Токен передают при подключении: в query-параметре (рискованно — попадает в логи), в cookie или первым
      сообщением. Свои коды закрытия берут из диапазона 4000–4999 — например, 4001 «токен истёк»; код 1001 означает
      «уходим» (going away).
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/CloseEvent/code

  - id: net-015
    topic: Сети и браузер
    level: middle
    question: |
      Какие утверждения про Service Worker верны?
    options:
      - text: 'Работает как прокси между страницей и сетью и может отдавать ответы из кэша'
        correct: true
        why: 'Событие `fetch` позволяет перехватить запрос и ответить из Cache Storage — основа офлайн-режима.'
      - text: 'Требует HTTPS (кроме localhost)'
        correct: true
        why: 'Перехват сети слишком мощная возможность, чтобы давать её по HTTP.'
      - text: 'Не имеет доступа к DOM'
        correct: true
        why: 'Со страницей он общается сообщениями.'
      - text: 'Работает постоянно, пока открыт браузер'
        why: 'Он запускается по событиям (`fetch`, `push`, `sync`) и засыпает в простое — хранить состояние в переменных нельзя.'
      - text: 'Может читать `localStorage`'
        why: '`localStorage` синхронный и в воркерах недоступен; есть Cache Storage и IndexedDB.'
    explanation: |
      Service Worker регистрируется через `navigator.serviceWorker.register('/sw.js')`, проходит `install` и `activate`.
      Даёт кэширование и офлайн, push-уведомления, фоновую синхронизацию — основа PWA. Стратегии кэша: cache first,
      network first, stale-while-revalidate (Workbox).
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Service_Worker_API

  - id: net-016
    topic: Сети и браузер
    level: middle
    multiple: true
    question: |
      Что такое проблема N+1 в GraphQL и чем её решают?
    options:
      - text: '100 вложенных резолверов делают 100 запросов в базу — их группирует DataLoader'
        correct: true
        why: 'DataLoader собирает обращения за один тик и делает один пакетный запрос.'
      - text: 'Клиент делает N+1 HTTP-запрос — решается кэшем браузера'
        why: 'Проблема на сервере в резолверах, клиент делает один запрос.'
      - text: 'Схема растёт на одно поле с каждой версией — решается версионированием'
        why: 'N+1 — про количество запросов к источникам данных.'
      - text: 'Запрос глубже N уровней падает — решается увеличением лимита'
        why: 'Лимит глубины — отдельная защита от тяжёлых запросов.'
    explanation: |
      GraphQL: схема — контракт, запросы описывают, какие поля нужны, резолверы достают данные. Решает over-fetching
      (лишние поля) и under-fetching (много запросов), схема эволюционирует без версий. Сложности — кэширование (один
      эндпоинт), тяжёлые запросы (лимиты глубины и сложности), N+1. Есть мутации и подписки.
    links:
      - https://graphql.org/learn/performance/

  - id: net-017
    topic: Сети и браузер
    level: middle
    question: |
      Что передаётся в колбэк `requestIdleCallback`?
    options:
      - text: 'Объект `deadline` с `timeRemaining()`'
        correct: true
        why: 'По нему задача понимает, сколько свободного времени осталось, и уступает поток, когда оно кончилось.'
      - text: 'Метка времени следующего кадра'
        why: 'Метку времени получает колбэк `requestAnimationFrame`.'
      - text: 'Событие простоя с координатами курсора'
        why: 'Это не событие ввода.'
      - text: 'Ничего, колбэк вызывается без аргументов'
        why: 'Аргумент есть — `deadline`.'
    explanation: |
      `requestIdleCallback` планирует некритичную работу на время простоя: аналитика, предзагрузка, фоновая обработка.
      Не годится для анимаций, срочных задач и тяжёлой работы с DOM. Опция `timeout` гарантирует вызов не позже срока.
      React вдохновлялся этой идеей, но использует свой планировщик.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Window/requestIdleCallback

  - id: net-018
    topic: Сети и браузер
    level: middle
    question: |
      Какой заголовок обязателен в любом запросе HTTP/1.1?
    options:
      - text: '`Host`'
        correct: true
        why: 'На одном IP живёт много сайтов — сервер должен знать, к какому обращаются.'
      - text: '`User-Agent`'
        why: 'Желателен, но не обязателен.'
      - text: '`Content-Type`'
        why: 'Нужен, только когда есть тело, и то не строго.'
      - text: '`Accept`'
        why: 'Без него сервер вернёт формат по умолчанию.'
    explanation: |
      Запрос — стартовая строка (метод, путь, версия), заголовки, пустая строка, тело. В HTTP/2 и HTTP/3 хост
      передаётся псевдозаголовком `:authority`. Тело бывает JSON, `application/x-www-form-urlencoded`,
      `multipart/form-data` (файлы), text, XML.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Host

  - id: net-019
    topic: Сети и браузер
    level: middle
    multiple: true
    question: |
      Чем отличаются `<script async>` и `<script defer>`?
    options:
      - text: '`async` выполняется сразу после загрузки, `defer` — после разбора HTML по порядку'
        correct: true
        why: 'Оба качаются параллельно с разбором. `defer` выполняются до `DOMContentLoaded` в порядке в документе.'
      - text: '`defer` выполняется сразу после загрузки, `async` — после разбора HTML'
        why: 'Наоборот.'
      - text: 'Оба блокируют разбор HTML до загрузки'
        why: 'Блокирует обычный `<script>` без атрибутов.'
      - text: '`async` гарантирует порядок выполнения, `defer` — нет'
        why: 'Порядок гарантирует `defer`. `async` — кто первый загрузился.'
    explanation: |
      Обычный скрипт останавливает разбор HTML до загрузки и выполнения. `async` — для независимых скриптов (счётчики,
      реклама). `defer` — для скриптов, которым нужен весь DOM и важен порядок. Модули (`type="module"`) по умолчанию
      ведут себя как `defer`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Element/script#defer

  - id: net-020
    topic: Сети и браузер
    level: middle
    question: |
      Изменение какого свойства обычно вызывает только перекраску (repaint), без перерасчёта раскладки?
    options:
      - text: '`color`'
        correct: true
        why: 'Цвет не меняет размеров и положения — пересчитывать геометрию не нужно.'
      - text: '`width`'
        why: 'Размер меняет геометрию — будет reflow, а затем repaint.'
      - text: '`margin-top`'
        why: 'Сдвигает элемент и соседей — нужен reflow.'
      - text: '`font-size`'
        why: 'Меняет размеры текста, а значит, и раскладку.'
    explanation: |
      Конвейер: DOM и CSSOM → дерево рендера → layout (reflow, геометрия) → paint (repaint, команды отрисовки) →
      composite (слои склеиваются в отдельном потоке композитора). `transform` и `opacity` обычно меняются только на
      этапе композиции, поэтому анимации делают ими.
    links:
      - https://web.dev/articles/rendering-performance

  - id: net-021
    topic: Сети и браузер
    level: middle
    question: |
      Что за «14 КБ» вспоминают, когда говорят о первой загрузке страницы?
    options:
      - text: 'Примерный объём начального окна TCP slow start'
        correct: true
        why: 'Сервер в первом «раунде» может отправить около 10 сегментов (~14 КБ), дальше окно растёт. Поэтому критичный HTML и CSS стараются уместить туда.'
      - text: 'Максимальный размер одного TCP-пакета'
        why: 'Сегмент — около 1,4 КБ. 14 КБ — это примерно 10 сегментов.'
      - text: 'Лимит размера HTML-страницы в браузерах'
        why: 'Такого лимита нет.'
      - text: 'Размер кэша DNS'
        why: 'К DNS это не относится.'
    explanation: |
      Путь запроса: DNS (домен → IP, кэшируется на время TTL в браузере и ОС), TCP-рукопожатие, TLS-рукопожатие для
      HTTPS, запрос HTML. Браузер парсит HTML потоком, не дожидаясь конца, а сканер предзагрузки заранее находит CSS,
      скрипты и шрифты.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Performance/Guides/How_browsers_work

  - id: net-022
    topic: Сети и браузер
    level: middle
    question: |
      Чем асинхронность отличается от параллельности?
    options:
      - text: 'Асинхронность — не ждать, параллельность — одновременно'
        correct: true
        why: 'Один повар варит суп и режет салат, пока суп варится, против двух поваров на двух плитах.'
      - text: 'Асинхронность — это всегда несколько потоков ОС'
        why: 'JS асинхронен в одном потоке — через event loop.'
      - text: 'Параллельность — то же, что конкурентность'
        why: 'Конкурентность — задачи перемежаются за период времени, параллельность — буквально одновременно.'
      - text: 'Синонимы — разница только в названии'
        why: 'Асинхронный код в одном потоке не выполняет две задачи в один момент.'
    explanation: |
      Асинхронность — неблокирующие операции, событийная модель, колбэки, промисы, async/await. Параллельность —
      несколько потоков или процессов (Web Workers, `worker_threads`) с настоящим одновременным выполнением и
      проблемами синхронизации: гонки, дедлоки.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/Thread

  - id: net-023
    topic: Сети и браузер
    level: middle
    question: |
      Какая мера защищает от clickjacking?
    options:
      - text: 'CSP с `frame-ancestors ''self''`'
        correct: true
        why: 'Запрещает встраивать страницу во фреймы чужих сайтов. Старый аналог — `X-Frame-Options: DENY` или `SAMEORIGIN`.'
      - text: 'Атрибут `HttpOnly` у куки'
        why: 'Защищает куку от чтения JS, а не страницу от встраивания.'
      - text: 'Заголовок `X-Content-Type-Options: nosniff`'
        why: 'Запрещает угадывать MIME-тип — это от MIME sniffing.'
      - text: 'Заголовок `Strict-Transport-Security`'
        why: 'HSTS заставляет использовать HTTPS — это против MITM.'
    explanation: |
      OWASP-шпаргалка: XSS — экранирование, санитизация (DOMPurify), CSP; CSRF — `SameSite`, CSRF-токены;
      clickjacking — `frame-ancestors` и `X-Frame-Options`; MIME sniffing — `nosniff`; MITM — HTTPS, HSTS, SRI;
      prototype pollution — не сливать пользовательский ввод в объекты, `Object.create(null)`, проверка ключей
      `__proto__` и `constructor`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Security/Attacks/Clickjacking

  - id: net-024
    topic: Сети и браузер
    level: middle
    question: |
      Чем опасна CORS-настройка, где сервер отражает любой `Origin` и ставит `Access-Control-Allow-Credentials: true`?
    options:
      - text: 'Любой сайт прочитает ответы API с куками пользователя'
        correct: true
        why: 'Злой сайт сделает запрос с `credentials: ''include''`, браузер приложит куки жертвы, а сервер разрешит прочитать ответ.'
      - text: 'Сервер перестанет принимать запросы с других доменов'
        why: 'Наоборот, он разрешит всем.'
      - text: 'Ничем: CORS защищает только от чтения без кук'
        why: 'С куками это худший вариант — доступ к данным пользователя от имени любого сайта.'
      - text: 'Браузер заблокирует такой ответ'
        why: 'Отражённый конкретный origin браузер примет. Блокируется только `*` вместе с credentials.'
    explanation: |
      `Access-Control-Allow-Origin: *` для публичных данных без кук безопасен: со звёздочкой браузер не пускает
      запросы с credentials. Опасно отражать Origin без проверки по белому списку, особенно с
      `Allow-Credentials: true`.
    links:
      - https://portswigger.net/web-security/cors

  - id: net-025
    topic: Сети и браузер
    level: middle
    question: |
      Какие запросы вызовут preflight `OPTIONS`?
    options:
      - text: '`PUT` на другой источник'
        correct: true
        why: 'Простые методы — только `GET`, `HEAD`, `POST`.'
      - text: '`POST` с `Content-Type: application/json`'
        correct: true
        why: 'Простые типы тела — только `text/plain`, `application/x-www-form-urlencoded`, `multipart/form-data`.'
      - text: '`GET` с заголовком `Authorization`'
        correct: true
        why: '`Authorization` не входит в список простых заголовков.'
      - text: '`GET` с `credentials: ''include''` без своих заголовков'
        why: 'Сами по себе куки preflight не вызывают — запрос остаётся простым.'
      - text: '`POST` формы с `multipart/form-data`'
        why: 'Это простой тип — preflight не нужен.'
    explanation: |
      Политика одного источника (same-origin policy) запрещает читать ответы с чужих источников, а CORS позволяет
      серверу ослабить её заголовками. Для непростых запросов браузер сначала шлёт `OPTIONS` с
      `Access-Control-Request-Method` и `-Headers`; сервер отвечает `Access-Control-Allow-*`, а `Max-Age` кэширует
      ответ. Ошибку CORS выдаёт браузер.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS#simple_requests

  - id: net-026
    topic: Сети и браузер
    level: middle
    question: |
      Какой метод History API меняет URL без новой записи в истории?
    options:
      - text: '`history.replaceState()`'
        correct: true
        why: 'Заменяет текущую запись — кнопка «назад» не вернёт на старый URL.'
      - text: '`history.pushState()`'
        why: 'Добавляет новую запись.'
      - text: '`history.go(0)`'
        why: 'Перезагружает текущую страницу.'
      - text: '`location.assign()`'
        why: 'Делает настоящий переход с загрузкой страницы и новой записью.'
    explanation: |
      Web API — интерфейсы браузера: DOM, Fetch, Storage, Canvas, Web Audio, WebRTC (P2P-звонки, но для соединения
      нужен сигнальный сервер и STUN/TURN), Service Workers, Intersection Observer, MediaDevices, History. На History
      API (`pushState`, `replaceState`, событие `popstate`) построены роутеры SPA.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/History_API

  - id: net-027
    topic: Сети и браузер
    level: middle
    question: |
      Что такое трёхстороннее рукопожатие?
    options:
      - text: 'Установка TCP-соединения: SYN, SYN-ACK, ACK'
        correct: true
        why: 'Стороны обмениваются начальными номерами последовательностей и подтверждают их.'
      - text: 'Обмен ключами TLS в три сообщения'
        why: 'TLS-рукопожатие — отдельный этап после TCP, и сообщений там больше.'
      - text: 'Уязвимость TLS, при которой атакующий встаёт между клиентом и сервером'
        why: 'Это атака Triple Handshake (2014) — у неё похожее название, но это не то же самое, что TCP-рукопожатие.'
      - text: 'Проверка CORS: OPTIONS, ответ, основной запрос'
        why: 'Это preflight, к TCP он отношения не имеет.'
    explanation: |
      Клиент шлёт SYN со своим начальным номером, сервер отвечает SYN-ACK (свой номер и подтверждение номера клиента
      +1), клиент подтверждает ACK. После этого для HTTPS идёт TLS-рукопожатие. Каждое рукопожатие — это время
      (RTT), поэтому помогают keep-alive, `preconnect`, TLS 1.3 и QUIC.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/TCP_handshake

  - id: net-028
    topic: Сети и браузер
    level: middle
    question: |
      Чем `Cache-Control: no-cache` отличается от `no-store`?
    options:
      - text: '`no-cache` — хранить и проверять, `no-store` — не хранить вовсе'
        correct: true
        why: 'С `no-cache` браузер спросит сервер (`If-None-Match`), и при `304` возьмёт копию из кэша.'
      - text: '`no-cache` — не хранить вовсе, `no-store` — хранить и проверять'
        why: 'Названия обманчивы, но запрет хранения — именно `no-store`.'
      - text: '`no-cache` — для прокси, `no-store` — для браузера'
        why: 'Оба действуют на все кэши.'
      - text: 'Ничем — это синонимы одной директивы'
        why: 'Разница принципиальная: проверка против полного запрета.'
    explanation: |
      Стратегия для SPA: файлы сборки с хэшем в имени — `max-age=31536000, immutable`, `index.html` — `no-cache`,
      чтобы новый релиз подхватывался сразу. Проверка — через `ETag` и `If-None-Match` (или `Last-Modified`), ответ
      `304 Not Modified` без тела. `no-store` — для личных и финансовых данных.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Cache-Control

  - id: net-029
    topic: Сети и браузер
    level: middle
    question: |
      Какая стратегия Service Worker сразу отдаёт копию из кэша и параллельно обновляет её из сети?
    options:
      - text: 'Stale-while-revalidate'
        correct: true
        why: 'Мгновенный ответ из кэша, а свежая версия пригодится в следующий раз.'
      - text: 'Cache first'
        why: 'Идёт в сеть только если в кэше пусто — для шрифтов и иконок.'
      - text: 'Network first'
        why: 'Сначала сеть, кэш — только при офлайне; для свежих данных.'
      - text: 'Network only'
        why: 'Кэш не используется вовсе.'
    explanation: |
      Типы кэшей: HTTP-кэш (заголовки `Cache-Control`, `ETag`), кэш Service Worker (Cache Storage, стратегии Workbox),
      DNS-кэш (адреса доменов на время TTL в браузере и ОС), а также CDN и кэш на сервере.
    links:
      - https://developer.chrome.com/docs/workbox/caching-strategies-overview

  - id: net-030
    topic: Сети и браузер
    level: middle
    question: |
      Какие события загрузки срабатывают до того, как загрузятся все картинки страницы?
    options:
      - text: '`DOMContentLoaded`'
        correct: true
        why: 'HTML разобран и DOM построен, `defer`-скрипты выполнены, но картинки могут ещё грузиться.'
      - text: '`readystatechange` со значением `interactive`'
        correct: true
        why: '`interactive` наступает чуть раньше `DOMContentLoaded`: DOM построен, но `defer`-скрипты ещё не выполнены.'
      - text: '`load` на `window`'
        why: '`load` ждёт все ресурсы, включая картинки.'
      - text: '`readystatechange` со значением `complete`'
        why: '`complete` — всё загружено, как `load`.'
    explanation: |
      Другие события: `beforeunload` — предупредить о несохранённом, `pagehide` и `pageshow` (с `persisted` для
      back/forward-кэша), `visibilitychange` — вкладка скрыта или видна. `unload` ненадёжен и мешает back/forward-кэшу —
      вместо него `pagehide` и `visibilitychange`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Document/DOMContentLoaded_event

  # ===================== Архитектура =====================
  - id: arch-001
    topic: Архитектура
    level: middle
    question: |
      Что ускорит CI-пайплайн большого фронтенд-монорепозитория?
    options:
      - text: 'Кэш зависимостей с ключом от хэша lock-файла'
        correct: true
        why: 'Если `pnpm-lock.yaml` не менялся, `node_modules` или стор pnpm восстанавливаются из кэша за секунды.'
      - text: 'Удалённый кэш Turborepo или Nx'
        correct: true
        why: 'Неизменившиеся пакеты не собираются и не тестируются заново — готовый результат скачивается по хэшу исходников.'
      - text: 'Шардинг тестов: `vitest --shard=1/4` на нескольких машинах'
        correct: true
        why: 'Тесты делятся на параллельные куски, общее время падает в разы.'
      - text: 'Запуск линтера и `tsc` строго друг за другом в одной джобе'
        why: 'Они независимы — их запускают параллельно в разных джобах.'
      - text: 'Полная очистка всех кэшей перед каждой сборкой'
        why: 'Это гарантирует самую медленную сборку из возможных.'
    explanation: |
      CI/CD — автоматизация сборки, тестирования и доставки. Быстрый пайплайн держится на изоляции, кэшировании и
      параллельности: валидация PR (husky и lint-staged локально, параллельные линт, типы и шарды тестов, E2E на
      Playwright с шардингом), сборка с кэшем, поставка — неизменяемые сборки в хранилище и CDN, атомарное
      переключение, канареечные релизы с автооткатом.
    links:
      - https://turborepo.com/docs/core-concepts/remote-caching

  - id: arch-002
    topic: Архитектура
    level: middle
    question: |
      Зачем при деплое фронтенда класть каждую сборку в свою папку и переключать версию атомарно?
    options:
      - text: 'Чтобы старые вкладки не ловили `ChunkLoadError`'
        correct: true
        why: 'Старые чанки остаются доступны, а новая версия включается одним переключением ссылки или конфигурации CDN.'
      - text: 'Чтобы сборка на CI шла заметно быстрее'
        why: 'На скорость сборки это не влияет — речь о безопасной выкладке.'
      - text: 'Чтобы браузер никогда не кэшировал файлы сборки'
        why: 'Наоборот, неизменяемые файлы с хэшем кэшируются навсегда.'
      - text: 'Чтобы обойтись без CDN и хранилища'
        why: 'Такую схему обычно и раздают через CDN.'
    explanation: |
      Immutability при деплое: файлы сборки не перезаписываются, каждая версия живёт отдельно (например,
      `/builds/<commit-sha>/`). Это даёт мгновенный откат и защиту от ситуации, когда старые JS-файлы уже удалены,
      а новые ещё не догрузились. Канареечный релиз раскатывает версию на 1–5% пользователей и следит за ошибками в
      Sentry.
    links:
      - https://martinfowler.com/bliki/CanaryRelease.html

  - id: arch-003
    topic: Архитектура
    level: middle
    question: |
      Какой способ code splitting даст самый заметный эффект в типичном SPA?
    options:
      - text: 'Разделение по маршрутам'
        correct: true
        why: 'Каждая страница — свой чанк: пользователь качает только код той страницы, на которой находится.'
      - text: 'Один большой бандл на всё приложение'
        why: 'Это отсутствие code splitting.'
      - text: 'Отдельный чанк на каждую утилиту'
        why: 'Сотни мелких чанков дадут лишние запросы и накладные расходы.'
      - text: 'Перенос всего кода в inline-скрипты HTML'
        why: 'Это увеличит HTML и лишит браузер кэша для JS.'
    explanation: |
      Code splitting — разделение кода на несколько чанков, чтобы уменьшить начальную загрузку, грузить код по
      требованию и параллельно. Подходы: по маршрутам, по тяжёлым компонентам (по клику или при прокрутке), вынос
      библиотек (`node_modules`) в отдельные чанки. Механизм — динамический `import()`.
    links:
      - https://web.dev/articles/reduce-javascript-payloads-with-code-splitting

  - id: arch-004
    topic: Архитектура
    level: middle
    question: |
      Что хранит система с Event Sourcing вместо текущего состояния?
    options:
      - text: 'Журнал всех событий, из которых собирается состояние'
        correct: true
        why: 'Как банковская выписка: баланс получается суммой всех операций.'
      - text: 'Только последнее событие по каждой сущности'
        why: 'Из одного события состояние не восстановить — нужна вся история.'
      - text: 'Снимки текущего состояния без истории изменений'
        why: 'Снимки бывают как оптимизация, но основа — именно журнал событий.'
      - text: 'Только запросы на чтение, без записи'
        why: 'Это смешение с CQRS, где разделены запись и чтение.'
    explanation: |
      Event Sourcing — храним не состояние, а историю событий (`DEPOSIT`, `PURCHASE`). CQRS — разделяем модель записи
      (валидация, бизнес-логика) и модель чтения (быстрые запросы и отчёты). Вместе: команда → событие → event store →
      обновление read model → UI. На фронте похоже на Redux-actions или XState. Не нужно для простого CRUD.
    links:
      - https://martinfowler.com/eaaDev/EventSourcing.html

  - id: arch-005
    topic: Архитектура
    level: middle
    question: |
      Какие импорты разрешены в Feature-Sliced Design?
    options:
      - text: 'Фича импортирует сущность'
        correct: true
        why: '`features` выше `entities` — верхний слой может брать из нижних.'
      - text: 'Виджет импортирует фичу и сущность'
        correct: true
        why: 'Виджет — композиционный слой над фичами и сущностями.'
      - text: 'Любой слой импортирует из `shared`'
        correct: true
        why: '`shared` — самый нижний, его используют все.'
      - text: 'Сущность импортирует фичу'
        why: 'Снизу вверх нельзя: сущности не знают о фичах.'
      - text: 'Фича `like-post` импортирует фичу `add-comment`'
        why: 'Срезы одного слоя не используют друг друга напрямую — их соединяет слой выше.'
    explanation: |
      Слои FSD сверху вниз: `app`, `processes` (устарел), `pages`, `widgets`, `features`, `entities`, `shared`.
      Импорт только вниз. Слои делятся на срезы (slices) по бизнес-смыслу, срезы — на сегменты (`ui`, `model`, `api`,
      `lib`, `config`). Каждый срез наружу отдаёт публичный API — `index`-файл. Чем ниже модуль, тем опаснее его
      рефакторинг: от него зависит всё сверху.
    links:
      - https://feature-sliced.design/docs/reference/layers

  - id: arch-006
    topic: Архитектура
    level: middle
    question: |
      Какие слои FSD обязательны в проекте?
    options:
      - text: 'Никакие: обычно есть хотя бы `app`, `pages`, `shared`'
        correct: true
        why: 'Документация FSD советует добавлять слои, только когда они приносят пользу.'
      - text: 'Все семь слоёв, включая `processes`'
        why: '`processes` вообще объявлен устаревшим.'
      - text: '`app`, `pages`, `shared` и `widgets`: всегда'
        why: 'Виджеты тоже добавляют по необходимости.'
      - text: 'Только `features` и `entities`, остальные по желанию'
        why: 'Наоборот, это слои, которые часто опускают в небольших проектах.'
    explanation: |
      `shared` — переиспользуемый код без бизнес-специфики (UI-kit, утилиты, API-клиент): его можно перенести в
      другой проект. `entities` — бизнес-сущности (User, Product). `features` — действия пользователя с
      бизнес-ценностью (AddToCart). `widgets` — самостоятельные блоки (Header). `pages` — страницы. `app` —
      провайдеры, стили, роутинг. У `app` и `shared` нет срезов — сразу сегменты.
    links:
      - https://feature-sliced.design/docs/reference/layers

  - id: arch-007
    topic: Архитектура
    level: middle
    question: |
      Какой принцип нарушает код, написанный «на будущее», которое может и не наступить?
    options:
      - text: 'YAGNI'
        correct: true
        why: 'You Aren''t Gonna Need It — не писать то, в чём сейчас нет потребности.'
      - text: 'DRY'
        why: 'DRY — про дублирование кода.'
      - text: 'KISS'
        why: 'KISS — про простоту решения. Близко, но «на будущее» — это именно YAGNI.'
      - text: 'SRP'
        why: 'SRP — одна причина для изменения у модуля.'
    explanation: |
      KISS (keep it simple, stupid) — простая система работает лучше всего, простота — ключевая цель проектирования.
      DRY (don't repeat yourself) — повторяющийся код выносят в функцию. YAGNI (you aren't gonna need it) — не пишут
      код, который может пригодиться, но сейчас не нужен.
    links:
      - https://martinfowler.com/bliki/Yagni.html

