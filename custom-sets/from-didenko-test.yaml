      В App Router стриминг настраивается файлами. `loading.js` в папке маршрута — Suspense на уровне всей страницы.
      Для точечного стриминга медленные части страницы оборачивают в `<Suspense fallback={…}>` прямо в коде: быстрый
      контент уходит сразу, медленный «довпрыскивается» в тот же поток HTML.
