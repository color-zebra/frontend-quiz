  - id: js-051
    topic: JavaScript
    level: middle
    question: |
      Обработчик клика висит на `<ul>`, пользователь нажал на `<li>` внутри. Чем будут `event.target` и
      `event.currentTarget`?
    options:
      - text: '`target` — `<li>`, `currentTarget` — `<ul>`'
        correct: true
        why: '`target` — где произошло событие, `currentTarget` — элемент, на котором висит сработавший обработчик.'
      - text: '`target` — `<ul>`, `currentTarget` — `<li>`'
        why: 'Наоборот: источник клика — `<li>`, обработчик — на `<ul>`.'
      - text: 'Оба — `<li>`'
        why: 'Обработчик висит на `<ul>`, поэтому `currentTarget` — `<ul>`.'
      - text: 'Оба — `<ul>`'
        why: '`target` не меняется при всплытии — это всегда исходный элемент.'
    explanation: |
      На этом строится делегирование событий: один обработчик на родителе и `event.target.closest(...)`, чтобы
