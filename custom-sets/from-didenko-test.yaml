    question: |
      Что из этого — принципы offline-first?
    options:
      - text: 'Приложение загружается без сети из кэша'
        correct: true
        why: 'Оболочка приложения и ресурсы лежат в кэше Service Worker.'
      - text: 'Данные сохраняются локально, если сети нет'
        correct: true
        why: 'Например, в IndexedDB.'
      - text: 'Синхронизация при восстановлении соединения с осознанным разрешением конфликтов'
        correct: true
        why: 'Изменения уходят на сервер позже, конфликты решают по правилам, а не как получится.'
      - text: 'Без сети приложение показывает только заглушку «Нет соединения»'
        why: 'Это как раз противоположность offline-first.'
    explanation: |
      Offline-first — приложение работает в первую очередь с локальными данными, а сервер синхронизируется при
      наличии связи. Основа — Service Worker, Cache Storage, IndexedDB, Background Sync.
    links:
      - https://web.dev/learn/pwa/offline-data

  - id: arch-009
    topic: Архитектура
