    explanation: |
      Optimistic update — UI меняется сразу, не дожидаясь ответа; запрос идёт в фоне, при ошибке — откат. Хорошо для
      лайков, избранного, переключателей. Плохо для финансов и операций, где важен точный порядок. Помогают временные
      id, версии, индикация «в процессе». Готовые решения — TanStack Query, SWR, Apollo, `useOptimistic` в React 19.
    links:
