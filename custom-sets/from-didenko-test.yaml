  - id: react-027
    topic: React
    level: middle
    question: |
      Какой будет `count` после одного клика?
    code: |
      function Counter() {
        const [count, setCount] = useState(0);

        const handleClick = () => {
          setCount(count + 1);
          setCount(count + 1);
        };

        return <button onClick={handleClick}>Count: {count}</button>;
      }
