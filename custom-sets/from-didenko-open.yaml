  # ===================== HTML =====================
  - id: open-html-001
    topic: HTML
    level: middle
    question: |
      Что такое ARIA? Какие атрибуты используются чаще всего?
    answer: |
      ARIA — набор атрибутов, которые сообщают ассистивным технологиям (скринридерам) то, чего не может сказать сам
      HTML. Делятся на 4 категории: роли — что это за элемент (`role="tab"`, `role="dialog"`); свойства —
      характеристики элемента (`aria-label`, `aria-controls`); состояния — текущее состояние (`aria-expanded`,
      `aria-checked`); атрибуты живых регионов — для динамического контента (`aria-live`).

      Самые частые: `aria-label` — краткая метка; `aria-labelledby` — ссылка на элемент с текстом метки;
      `aria-describedby` — подробное описание; `aria-hidden="true"` — скрыть от скринридера; `aria-live="polite"` —
      объявлять динамические обновления; `aria-expanded` — раскрыто или свёрнуто; `aria-controls` — каким элементом
      управляет; `aria-checked` — состояние чекбокса (`true`, `false`, `mixed`); `aria-selected` — выбрано;
      `aria-invalid` — ошибка валидации.

      Landmark-роли — ключевые области страницы: `banner` (как `<header>`), `navigation` (как `<nav>`), `main`,
      `complementary` (как `<aside>`), `contentinfo` (как `<footer>`), `search`, `form`. Живые регионы:
      `aria-live` — как объявлять изменения (`off`, `polite`, `assertive`), `aria-atomic` — весь регион или только
      изменения, `aria-busy` — регион обновляется; готовые роли — `status` и `alert`.

      Главное правило: не используйте ARIA, если можно использовать нативный HTML. `<div role="button">` хуже, чем
      `<button>`. ARIA не меняет поведение элемента — только то, что о нём узнает скринридер.
    points:
      - 'Четыре категории: роли, свойства, состояния, живые регионы'
      - '`aria-label`, `aria-labelledby`, `aria-describedby`'
      - '`aria-expanded`, `aria-checked`, `aria-hidden`'
      - '`aria-live` polite и assertive'
      - Нативный HTML лучше ARIA

  - id: open-html-002
    topic: HTML
    level: middle
    question: |
      Что такое Shadow DOM и зачем он нужен?
    answer: |
      Shadow DOM — веб-стандарт, который позволяет инкапсулировать структуру DOM, стили и логику внутри отдельного
      изолированного поддерева, прикреплённого к элементу, но отделённого от основного дерева документа. Аналогия —
      iframe, отдельная страница внутри страницы. Shadow DOM похож, но менее строгий — это «капсула» внутри обычного
      элемента, которая защищает его внутренности от внешнего вмешательства и наоборот.

      Основные идеи. Инкапсуляция стилей: стили внутри не «вытекают» наружу, а внешние не проникают внутрь — кроме
      наследуемых свойств вроде шрифтов и цветов и CSS-переменных. Изоляция DOM: элементы внутри не находятся
      обычным `document.querySelector()`. И это одна из ключевых технологий Web Components — вместе с Custom
      Elements и HTML Templates.

      Создаётся через `host.attachShadow({ mode: 'open' })`. В режиме `open` shadow root доступен через
      `element.shadowRoot`, в `closed` — недоступен извне (используется редко, ограничивает гибкость). Для вставки
      контента снаружи есть slots — «дырки» в Shadow DOM. В DevTools Shadow DOM виден как отдельное поддерево.

      Зачем: изоляция компонентов (виджет работает одинаково в любом окружении), защита от CSS-конфликтов, сокрытие
      реализации.
    code: |
      const host = document.querySelector('#host');
      const shadow = host.attachShadow({ mode: 'open' });

      shadow.innerHTML = `
        <style>
          p { color: red; } /* не повлияет на <p> вне shadow DOM */
        </style>
        <p>Текст внутри Shadow DOM</p>
      `;
    codeLang: js
    points:
      - Изолированное поддерево у элемента-хоста
      - Стили не вытекают и не втекают, кроме наследуемых и CSS-переменных
      - Режимы `open` и `closed`
      - Слоты для внешнего контента
      - Основа Web Components

  - id: open-html-003
    topic: HTML
    level: middle
    question: |
      Из чего состоит базовая структура HTML-документа?
    answer: |
      Простейшая HTML-страница состоит как минимум из трёх тегов.

      `<html>` — корень, здесь указывается язык: `lang="ru"`.

      `<head>` — обычно содержит заголовок, описание страницы, в общем, информацию о сайте. Данные этого блока не
      отображаются на странице, а служат для её описания, подключения стилей и скриптов.

      `<body>` — основное место, где строится разметка. Данные этого блока обрабатываются и выводятся в браузер.

      Перед ними — `<!DOCTYPE html>`, служебная строка для браузера: она говорит, что это современный HTML, и
      включает стандартный режим. Без неё браузер уходит в режим совместимости (quirks mode).
    points:
      - '`<!DOCTYPE html>` — стандартный режим'
      - '`<html lang>`, `<head>`, `<body>`'
      - '`<head>` не отображается — мета, стили, скрипты'

  - id: open-html-004
    topic: HTML
    level: middle
    question: |
      Какие есть способы оптимизации изображений на уровне HTML?
    answer: |
      `srcset` — список возможных источников, из которых браузер выбирает. С дескриптором плотности (`1x`, `2x`,
      `3x`) браузер берёт файл под DPR экрана — соотношение пикселей устройства. На iPhone 4 один CSS-пиксель стал
      двумя пикселями устройства по каждой оси (то есть четырьмя физическими), поэтому для чёткой картинки нужен файл вдвое шире.

      `sizes` — когда размер картинки меняется с макетом. В `srcset` пишут реальную ширину файлов (`500w`, `1000w`),
      а в `sizes` — какой ширины картинка будет на странице при каких условиях: `(min-width: 768px) 500px, 100vw`.
      Браузер сам выберет подходящий файл.

      `loading="lazy"` — не загружать картинку, пока пользователь до неё не докрутит. По умолчанию `eager` —
      немедленно. Работает как улучшение: если браузер не поддерживает, ничего не сломается.

      `decoding` — перед показом браузер декодирует картинку, превращает байты в пиксели. Для больших изображений
      это сотни миллисекунд. `async` — декодировать попозже, `sync` — прямо сейчас, `auto` — браузер решает сам.

      Метод `decode()` у `HTMLImageElement` возвращает `Promise`, который выполнится, когда картинка декодирована.
      Так делают подмену: показываем миниатюру низкого разрешения, грузим полную, ждём `decode()` и меняем — без
      задержки кадра.
    code: |
      <img
        src="/image-500.jpg"
        srcset="/image-500.jpg 500w, /image-1000.jpg 1000w, /image-1500.jpg 1500w"
        sizes="(min-width: 768px) 500px, 100vw"
        loading="lazy"
        decoding="async"
        alt="An image"
      >
    codeLang: html
    points:
      - '`srcset` с `x` — под DPR экрана'
      - '`srcset` с `w` + `sizes` — под ширину макета'
      - '`loading="lazy"` — грузить при прокрутке'
      - '`decoding="async"` и `decode()` — не тормозить отрисовку'

  - id: open-html-005
    topic: HTML
    level: middle
    question: |
      Чем отличается `<article>` от `<section>`?
    answer: |
      `<section>` — смысловой раздел документа. Не отделяемый, в отличие от `<article>`: главы, вкладки.

      `<article>` — независимая, отделяемая смысловая единица: комментарий, твит, статья, виджет. Его можно вынуть и
      показать в другом месте — он останется понятен сам по себе.
    points:
      - '`section` — раздел целого, отдельно не живёт'
      - '`article` — самостоятельная единица, можно переиспользовать'

  - id: open-html-006
    topic: HTML
    level: middle
    question: |
      Что такое preload, prefetch, preconnect?
    answer: |
      Это способы оптимизации загрузки ресурсов, чтобы ускорить рендеринг и улучшить пользовательский опыт. Задаются
      через `<link>`. Основная идея — загружать ресурсы (шрифты, скрипты, стили) заранее, до того как они
      понадобятся. Различаются по приоритету и цели.

      Preload — директива, которая позволяет браузеру заранее загрузить важные ресурсы, необходимые для текущей
      страницы, ещё до того, как они понадобятся при рендеринге: `<link rel="preload" href="…" as="font">`.

      Prefetch — загрузить ресурсы, которые понадобятся в будущем, например на следующей странице или при следующем
      действии пользователя. Приоритет низкий: `<link rel="prefetch" href="…">`.

      Preconnect — заранее установить сетевое соединение с сервером: DNS, TCP и TLS. Сами файлы не качаются:
      `<link rel="preconnect" href="…">`.
    points:
      - Preload — нужное текущей странице, высокий приоритет
      - Prefetch — для будущей навигации, низкий приоритет
      - Preconnect — только соединение (DNS, TCP, TLS)

  - id: open-html-007
    topic: HTML
    level: middle
    question: |
      Что такое доступность (a11y) и чем она отличается от семантики?
    answer: |
      Доступность — обеспечение возможности использовать сайт всем людям: незрячим и слабовидящим (скринридеры),
      слабослышащим (субтитры), людям с когнитивными нарушениями (простой интерфейс), с моторными (клавиатурная
      навигация), пожилым (крупный текст, контраст).

      Семантическая вёрстка — правильные HTML-теги: `<button>` вместо `<div>`. Цель — читаемость кода и SEO.
      Доступность — комплексный подход: добавить `aria-label`, управлять фокусом, озвучивать изменения. Её используют
      скринридеры, клавиатура и ассистивные технологии. Семантика — база доступности, но её мало: модалке нужны
      `role="dialog"`, `aria-modal`, `aria-labelledby` и удержание фокуса внутри.

      Правило ARIA: не используйте ARIA, если можно использовать нативный HTML. ARIA — для случаев, когда HTML
      недостаточно, например кастомный чекбокс: `role="checkbox"`, `aria-checked`, `tabindex="0"`.

      Обязательно: `alt` у картинок, контраст текста (минимум 4.5:1), клавиатурная навигация, ARIA для кастомных
      виджетов, семантические теги. Дополнительно: skip links, управление фокусом в модалках, `aria-live`, достаточное
      время на действия, без мигания (опасно для эпилептиков). Проверяют скринридерами (NVDA, VoiceOver), Lighthouse и
      вкладкой Accessibility в DevTools, `eslint-plugin-jsx-a11y`, `@axe-core/react`, WebAIM Contrast Checker.
    points:
      - Сайт для всех, включая скринридеры и клавиатуру
      - Семантика — правильные теги, доступность — шире
      - Не ARIA, если есть нативный HTML
      - '`alt`, контраст 4.5:1, клавиатура, фокус в модалках'
      - NVDA, VoiceOver, Lighthouse, axe

  - id: open-html-008
    topic: HTML
    level: middle
    question: |
      Что такое метатеги?
    answer: |
      Метатеги — служебные элементы с информацией о странице. Обычно располагаются в `<head>`. С точки зрения работы
      сайта они не обязательны: страница загрузится и без них. Но если важно продвижение, они нужны: `<title>` и
      `description` (сам `<title>` — отдельный элемент, а не `<meta>`) формируют сниппет в выдаче и влияют на посещаемость, `robots` управляет индексацией.

      Ещё бывают `<meta charset="utf-8">` — кодировка, `viewport` — для мобильной вёрстки, Open Graph — превью в
      соцсетях, `http-equiv` — аналоги HTTP-заголовков вроде `Content-Type`. `keywords` поисковики давно не
      учитывают.
    points:
      - Служебная информация в `<head>`, на экран не выводится
      - '`title`, `description`, `robots` — для поиска'
      - '`charset`, `viewport`, Open Graph'
      - '`keywords` поисковики игнорируют'

  - id: open-html-009
    topic: HTML
    level: middle
    question: |
      Что такое семантика в вёрстке? Какие теги семантические?
    answer: |
      Семантическая вёрстка — подход к разметке, который опирается не на внешний вид, а на смысловое предназначение
      каждого блока и логическую структуру документа.

      Структурные теги: `<header>` — шапка страницы или раздела, `<footer>` — подвал, `<nav>` — навигационные ссылки,
      `<main>` — основное содержимое, `<article>` — независимый контент, `<section>` — раздел документа, `<aside>` —
      контент сбоку от основного (боковые панели).

      Текстовые: `<h1>`–`<h6>` — заголовки разного уровня, `<h1>` самый важный; `<p>` — абзац; `<strong>` — важный
      текст, `<em>` — смысловое ударение (жирный и курсив — только их вид по умолчанию); `<blockquote>` — цитата;
      списки `<ol>`, `<ul>`, `<li>`; `<figure>` и `<figcaption>` — иллюстрация с подписью.

      Формы: `<form>`, `<input>`, `<textarea>`, `<button>`, `<select>` и `<option>`, `<label>`. Таблицы: `<table>`,
      `<tr>`, `<td>`, `<th>`, `<thead>`, `<tbody>`, `<tfoot>`. Медиа: `<video>`, `<audio>`, `<canvas>`, `<svg>`.

      Семантика нужна поисковикам, скринридерам и разработчикам: по тегам понятно, что где на странице.
    points:
      - Разметка по смыслу, а не по виду
      - '`header`, `nav`, `main`, `article`, `section`, `aside`, `footer`'
      - '`strong` и `em` — про смысл, а не про стиль'
      - Нужна для SEO, доступности и читаемости кода

  # ===================== CSS =====================
  - id: open-css-001
    topic: CSS
    level: middle
    question: |
      Что такое блочная модель (box model)? Как считается размер элемента и что меняет `box-sizing: border-box`?
    answer: |
      Box model — это концепция, по которой каждый элемент на странице — прямоугольная коробка из нескольких слоёв.
      От внутреннего к внешнему: содержимое (content), внутренний отступ (padding), граница (border), внешний
      отступ (margin). Эти слои определяют, сколько места элемент занимает и как взаимодействует с соседями.

      По умолчанию стоит `content-box`: `width` — это только ширина содержимого, padding и border прибавляются
      сверху. Блок с `width: 200px`, `padding: 20px` и `border: 5px` будет шириной `200 + 40 + 10 = 250px`, а с
      `margin: 10px` займёт `270px`.

      `box-sizing: border-box` меняет расчёт: `width` становится общей шириной вместе с padding и border, они
      вычитаются из неё. У того же блока содержимое будет `200 - 40 - 10 = 150px`, а вся коробка останется 200px.
    points:
      - Слои — content, padding, border, margin
      - '`content-box` по умолчанию: padding и border прибавляются к `width`'
      - '`border-box`: padding и border входят в `width`'
      - Margin в размер коробки не входит

  - id: open-css-002
    topic: CSS
    level: middle
    question: |
      Что такое BFC (Block Formatting Context) и как его создать?
    answer: |
      BFC — это изолированная область на странице, внутри которой элементы располагаются по своим правилам. Это как
      «мини-страница» внутри основной: она целиком вмещает свои float-ы, и отступы её детей не схлопываются с её собственными через её границу (с соседями её отступ по-прежнему схлопывается).

      BFC создают: корень `<html>`, плавающие элементы (`float`), абсолютно и фиксированно позиционированные
      (`absolute`, `fixed`), `display: inline-block`, `table-cell`, `table-caption`, `overflow` кроме `visible`,
      `contain: layout`, `content` или `paint`, многоколоночный блок (`column-count` не `auto`), `column-span: all`.
      `display: flex` и `grid` создают свой контекст — flex- и grid-.

      Современный способ — `display: flow-root`: чистый, без побочных эффектов. `overflow: hidden` тоже создаёт
      BFC, но заодно обрезает всё, что выходит за блок.
    points:
      - Изолированная «мини-страница» со своими правилами раскладки
      - Вмещает float-ы, отступы детей не схлопываются через её границу
      - Создают float, absolute/fixed, inline-block, overflow не visible
      - '`display: flow-root` — чистый способ без побочных эффектов'

  - id: open-css-003
    topic: CSS
    level: middle
    question: |
      Чем отличаются CSS reset и normalize.css?
    answer: |
      Reset — это «жёсткий сброс» всех стилей браузера до нуля. Философия: «уберём все стили браузера, а потом сами
      добавим нужные». Убирает все margin и padding, стили списков (точки у `ul`, цифры у `ol`), стили заголовков
      (`h1`–`h6` становятся как обычный текст), сбрасывает таблицы, иногда подчёркивание у ссылок. Плюсы: полный
      контроль, одинаково во всех браузерах, нет сюрпризов от браузерных стилей.

      Normalize — это «нормализация» стилей браузера к единому стандарту. Философия: «исправим различия между
      браузерами, но сохраним полезные стили». Исправляет баги разных браузеров, улучшает доступность, сохраняет
      полезные браузерные стили — заголовки остаются заголовками. Кода меньше: не нужно восстанавливать базовые
      стили.
    points:
      - Reset — снести всё и написать заново
      - Normalize — выровнять браузеры и сохранить полезное
      - Normalize чинит баги и учитывает доступность

  - id: open-css-004
    topic: CSS
    level: middle
    question: |
      Что такое `window.matchMedia()` и зачем он нужен?
    answer: |
      `matchMedia()` — метод, который позволяет проверять CSS медиа-запросы в JavaScript и реагировать на их
      изменения. Он возвращает объект `MediaQueryList`: в `matches` лежит `true` или `false` — подходит ли запрос
      сейчас, в `media` — сам запрос. Подписаться на изменения можно через `addEventListener('change', …)`,
      отписаться — через `removeEventListener`.

      Запрос может быть любым: размеры экрана, ориентация, тема (`prefers-color-scheme: dark`), уменьшение анимаций
      (`prefers-reduced-motion`), плотность пикселей, тип устройства (`hover: hover`, `pointer: coarse`). В React
      на нём делают хук `useMediaQuery`.
    code: |
      const mediaQuery = window.matchMedia('(max-width: 768px)');

      console.log(mediaQuery.matches); // true или false

      mediaQuery.addEventListener('change', (event) => {
        console.log('Состояние изменилось:', event.matches);
      });
    codeLang: js
    points:
      - Возвращает `MediaQueryList`, а не boolean
      - '`matches` — текущее состояние, событие `change` — изменения'
      - Любые медиа-запросы — ширина, тема, ориентация, hover

  - id: open-css-005
    topic: CSS
    level: middle
    question: |
      Как реализовать адаптивность сайта?
    answer: |
      Отзывчивый дизайн (responsive) — «резиновая» вёрстка плюс медиа-запросы: страница плавно подстраивается под
      любую ширину. Адаптивный (adaptive) — заранее подготовленные варианты под разные устройства, вплоть до разного
      HTML, который определяется на сервере или клиенте. Часто их комбинируют.

      На CSS основной метод — media queries, обычно mobile first: базовые стили для телефона, а `min-width` добавляет
      правила для планшета и десктопа. Flexbox с `flex-wrap` и `flex: 1 1 300px` переносит элементы сам. Grid с
      `repeat(auto-fit, minmax(250px, 1fr))` сам меняет число колонок. Container queries адаптируют элемент к размеру
      контейнера, а не окна. CSS-переменные можно переопределять в медиа-запросах, а `clamp()` даёт fluid-типографику.

      В React — хук `useMediaQuery` на `matchMedia`, контекст с размером окна, библиотеки (react-responsive,
      брейкпоинты MUI и Chakra), медиа-запросы в CSS-in-JS. В Sass — миксин для брейкпоинтов.
    points:
      - Responsive — тянется, adaptive — переключает готовые варианты
      - Media queries, mobile first
      - Flex с переносом, grid с `auto-fit` и `minmax`
      - Container queries — по размеру контейнера
      - '`clamp()` для шрифтов, хук `useMediaQuery` в React'

  - id: open-css-006
    topic: CSS
    level: middle
    question: |
      Как отцентрировать блок по вертикали и горизонтали?
    answer: |
      По горизонтали: строчные элементы — `text-align: center` на родителе. Блочные — `margin: 0 auto`, ширина должна
      быть задана. С flexbox — `justify-content: center` на родителе.

      По вертикали: для одной строки текста — `line-height`, равный высоте контейнера. С flexbox — `align-items:
      center` на родителе. С grid — `place-items: center`.

      По обеим осям: flexbox (`display: flex; justify-content: center; align-items: center`) — рекомендуемый способ,
      или grid (`display: grid; place-items: center`). Старый способ — абсолютное позиционирование: родителю
      `position: relative`, элементу `position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%)`.
    points:
      - '`text-align: center` и `margin: 0 auto` — только по горизонтали'
      - Flex — `justify-content` + `align-items`
      - 'Grid — `place-items: center`'
      - Absolute + `translate(-50%, -50%)` — старый способ

  - id: open-css-007
    topic: CSS
    level: middle
    question: |
      Что такое специфичность селектора? Как посчитать вес селектора?
    answer: |
      Специфичность — вес селектора. Когда к элементу подходят несколько правил, побеждает более тяжёлый селектор,
      а при равном весе — тот, что ниже в коде.

      Вес считают по разрядам: inline-стиль, id, классы, теги. `li` — `0,0,0,1`, селектор по тегу. `ul li` —
      `0,0,0,2`, селектор с двумя тегами весит больше, чем с одним. `.orange` — `0,0,1,0`, селектор с классом весит
      больше, чем селектор с тегом. `.orange a span` — `0,0,1,2`, перевесит предыдущий, потому что помимо класса
      содержит два тега.

      Селектор по атрибуту, в том числе кастомному (`[data-role="tab"]`), весит как класс. Псевдоклассы тоже идут в
      разряд классов, псевдоэлементы — в разряд тегов.
    points:
      - Разряды — inline, id, классы, теги
      - Сравниваются слева направо, класс тяжелее любого числа тегов
      - Атрибут и псевдокласс весят как класс
      - При равном весе побеждает правило ниже

  - id: open-css-008
    topic: CSS
    level: middle
    question: |
      Что такое контекст наложения (stacking context)?
    answer: |
      Это фундаментальная концепция CSS, которая определяет, как элементы накладываются друг на друга по оси Z.
      Каждый контекст наложения — изолированная группа элементов, которые накладываются друг на друга независимо от
      других контекстов. Снаружи контекст сравнивается как целое — по z-index своего корня.

      Новый контекст создаёт: корень `<html>`; `position` + `z-index` не `auto` (`fixed` и `sticky` — всегда);
      `opacity` меньше 1; `transform`, `filter`, `perspective`, `clip-path`; flex- и grid-элемент с `z-index` не
      `auto`; `isolation: isolate`, `will-change`, `contain: layout paint`, `mix-blend-mode` не `normal`, `mask`.

      Внутри контекста слои снизу вверх: фон и границы корня, отрицательный z-index, блочные элементы, float,
      строчные элементы, позиционированные с `z-index: 0` или `auto`, положительный z-index.

      Ключевое правило — изоляция. Если у родителя `z-index: 1`, а у его соседа `z-index: 2`, то сосед будет над
      родителем и над всеми его детьми, даже над ребёнком с `z-index: 9999`. А если родитель создал контекст через
      `opacity`, ребёнок с `z-index: -1` не уйдёт под фон родителя — останется внутри его контекста.
    points:
      - Изолированная группа, снаружи сравнивается целиком
      - Создают position + z-index, opacity < 1, transform, isolation
      - Ребёнок не выпрыгнет над чужим контекстом, сколько ни ставь z-index
      - Порядок слоёв — фон, минус, блоки, float, inline, 0/auto, плюс

  - id: open-css-009
    topic: CSS
    level: middle
    question: |
      Какие есть типы позиционирования в CSS?
    answer: |
      `static` — значение по умолчанию, элемент находится в обычном потоке.

      `relative` — элемент в потоке, но его можно сдвинуть через `top`, `right`, `bottom`, `left`. Его место в
      потоке при этом сохраняется.

      `absolute` — выдёргивается из потока, расположение отсчитывается от ближайшего позиционированного предка —
      первого, у которого `position` не `static`.

      `fixed` — похоже на абсолютное, но всегда привязывается к краям окна браузера и остаётся на месте при
      прокрутке. Исключение — предок с `transform` или `filter`: тогда `fixed` привязывается к нему.

      `sticky` — смесь `relative` и `fixed`: элемент остаётся в потоке, а при прокрутке ближайшего прокручиваемого
      предка прилипает к заданному порогу (`top: 0`), но не выходит за пределы родителя. Родителю `relative` для
      этого не нужен.
    points:
      - '`static` — по умолчанию, в потоке'
      - '`relative` — в потоке, сдвигается'
      - '`absolute` — из потока, от позиционированного предка'
      - '`fixed` — к окну'
      - '`sticky` — прилипает при прокрутке в пределах родителя'

  - id: open-css-010
    topic: CSS
    level: middle
    question: |
      Что такое BEM?
    answer: |
      BEM (Block, Element, Modifier) — популярная методология организации CSS-классов и структуры HTML. Она упрощает
      разработку и поддержку больших проектов за счёт строгой структуры имён классов. Нужна, чтобы не возникало
      коллизий.

      Блок — независимый компонент страницы, который можно переиспользовать и который имеет смысл сам по себе:
      кнопка, меню. Элемент — часть блока, которая не используется отдельно от него. Связывается с блоком двойным
      подчёркиванием: `menu__item`. Модификатор — свойство, которое меняет внешний вид или поведение блока или
      элемента. Обозначается двойным дефисом: `button--active`.
    points:
      - Блок — самостоятельный компонент
      - Элемент — часть блока, `block__element`
      - Модификатор — вариант вида или состояния, `block--modifier`
      - Цель — избежать коллизий имён

  - id: open-css-011
    topic: CSS
    level: middle
    question: |
      Что такое CSS-препроцессоры и зачем они нужны?
    answer: |
      Препроцессор — инструмент, который принимает код на своём расширенном языке и превращает его в обычный валидный
      CSS, который понимают браузеры. Самые популярные — Sass/SCSS, Less, Stylus.

      Что дают. Вложенность — иерархия как в HTML, не надо повторять родительские селекторы, `&` ссылается на
      родителя. Переменные — цвет или размер меняешь в одном месте, обновляется везде. Миксины — как «функции» для
      CSS, генерируют повторяющиеся куски, например вендорные префиксы. Наследование через `@extend` и placeholder
      `%name` — селекторы группируются в одно правило. Импорт и модульность — много маленьких файлов, а браузер
      получает один CSS. Операторы и функции — математика, работа с цветами.

      Компиляция настраивается в сборщике: Webpack, Vite, Gulp. Недостатки: лишний шаг сборки, отладка сложнее
      (решается source maps), CSS может разбухнуть от бездумного `@extend` и глубокой вложенности.

      Обычный CSS уже получил переменные, `calc()` и вложенность, но препроцессоры не устарели: миксины и циклы
      есть только у них, а условия и функции в CSS только появляются (`if()`, `@function` в Chrome). Тот же Bootstrap 4 и 5 написан на Sass.
    points:
      - Компилируется в обычный CSS, браузер SCSS не понимает
      - Вложенность, переменные, миксины, `@extend`, модули, функции
      - Минусы — шаг сборки, отладка через source maps, разбухание CSS
      - Нативный CSS догоняет, но миксинов и циклов в нём нет

  - id: open-css-012
    topic: CSS
    level: middle
    question: |
      Что такое селектор? Какие существуют?
    answer: |
      Селектор выбирает элементы на странице по определённому признаку, чтобы применить к ним стили.

      Универсальный `*` — все элементы. По тегу (`div`, `p`). По классу (`.className`). По id (`#idName`). По
      атрибуту: `[attribute]` — есть атрибут, `[attribute="value"]` — точное значение, `^=` — начинается с, `$=` —
      заканчивается на, `*=` — содержит.

      Потомки и дети: `parent > child` — только прямые дети, `ancestor descendant` — все вложенные. Соседи: `prev +
      next` — элемент сразу после, `prev ~ siblings` — все следующие соседи на том же уровне.

      Псевдоклассы — состояние или положение: `:hover`, `:focus`, `:nth-child(n)`, `:first-child`, `:last-child`,
      `:not()`. Псевдоэлементы — часть элемента: `::before`, `::after`, `::first-letter`, `::first-line`.

      Селекторы можно комбинировать для более сложных правил.
    points:
      - Универсальный, тег, класс, id, атрибут
      - Комбинаторы — пробел, `>`, `+`, `~`
      - Псевдоклассы — состояние, псевдоэлементы — часть элемента

  - id: open-css-013
    topic: CSS
    level: middle
    question: |
      Что такое схлопывание отступов и как его предотвратить?
    answer: |
      Отступы `margin-top` и `margin-bottom` иногда объединяются в один с размером, равным наибольшему из них. Так
      бывает у соседних блоков и у родителя с первым или последним ребёнком, если между ними нет padding, border или
      содержимого. Отступы плавающих и абсолютных элементов никогда не схлопываются, горизонтальные — тоже.

      Как предотвратить: назначить родительскому элементу `display: grid` или `flex` — у их детей отступы не
      схлопываются. Или договориться назначать элементам только нижний отступ.
    points:
      - Вертикальные отступы, побеждает наибольший
      - Не схлопываются у float, absolute, детей flex и grid
      - Способы — flex/grid у родителя или только нижние отступы

  # ===================== JavaScript =====================
  - id: open-js-001
    topic: JavaScript
    level: middle
    question: |
      Как работает `await` в циклах? В каких циклах он ждёт, а в каких — нет?
    answer: |
      Ждёт на каждой итерации — то есть идёт последовательно — в `for...of`, обычном `for`, `while` и `do...while`.

      Не ждёт `forEach`: все операции запускаются сразу, `await` внутри колбэка не остановит следующую итерацию.
      `map` сам по себе тоже не ждёт — он возвращает массив промисов, и чтобы их дождаться, нужен
      `Promise.all(promises)`. `filter`, `some`, `every` с async-колбэками работают неправильно: колбэк
      возвращает промис, а он всегда truthy.

      Для параллельного выполнения — `await Promise.all(items.map(item => process(item)))`: все операции запускаются
      сразу, ждём все вместе.

      Главное правило: `for...of` — для последовательности, `Promise.all()` — для параллелизма, `forEach` с `await` —
      избегать.
    points:
      - '`for...of`, `for`, `while` — ждут, последовательно'
      - '`forEach` не ждёт промисы колбэка'
      - '`map` + `Promise.all` — параллельно'
      - '`filter` с async-колбэком оставит всё'

  - id: open-js-002
    topic: JavaScript
    level: middle
    question: |
      Что такое CSS-in-JS и какие у него минусы?
    answer: |
      CSS-in-JS — подход, при котором стили пишутся в JavaScript (styled-components, emotion, JSS) и генерируются
      динамически на основе состояния компонента. Удобно для изоляции стилей и интеграции с React, но есть минусы.

      Производительность: стили создаются в рантайме и пересчитываются при изменении пропсов, это нагружает CPU;
      библиотека увеличивает бандл (styled-components — около 12–15 KB gzip). Отладка: в DevTools видны хэшированные
      классы вроде `sc-abc123`, сложно найти источник стиля; CSS не кэшируется как отдельный файл. SSR: стили нужно
      собрать на сервере и совпасть с клиентом, иначе «моргание» без стилей. Экосистема: stylelint и Sass напрямую
      не работают, миграция требует рефакторинга. Ещё — привязка к библиотеке и кривая обучения.

      Хорош для динамических интерфейсов с темами и анимациями. Альтернативы — CSS Modules, Tailwind CSS, обычные
      CSS-файлы.
    points:
      - Стили в JS, генерируются от пропсов и темы
      - Минусы — рантайм, размер бандла, SSR, отладка
      - Альтернативы — CSS Modules, Tailwind

  - id: open-js-003
    topic: JavaScript
    level: middle
    question: |
      С какими нововведениями ES6 знаком?
    answer: |
      ES6, он же ECMAScript 2015, сделал язык удобнее и современнее.

      `let` и `const` — блочная область видимости вместо `var`. `let` — для переменных, которые меняются, `const` —
      нельзя переназначить (но можно менять содержимое объекта или массива). Стрелочные функции — короткий синтаксис
      и без собственного `this`, берут его из окружения. Шаблонные строки в обратных кавычках с подстановкой
      `${name}`. Деструктуризация массивов и объектов. Модули — `import` и `export`. Операторы `...`: spread
      разворачивает, rest собирает. Классы — синтаксический сахар над прототипами. Промисы вместо вложенных колбэков
      (callback hell). Итераторы и генераторы — функции, которые можно приостанавливать и возобновлять.

      Ещё появились `Map`, `Set`, `Symbol`, параметры по умолчанию. А вот `async/await` — уже ES2017.
    points:
      - '`let`/`const`, стрелочные, шаблонные строки'
      - Деструктуризация, spread и rest
      - Классы, модули, промисы
      - Итераторы, генераторы, `Map`, `Set`, `Symbol`

  - id: open-js-004
    topic: JavaScript
    level: middle
    question: |
      Что такое IIFE и зачем она нужна?
    answer: |
      IIFE (Immediately Invoked Function Expression) — выражение функции, которое вызывается сразу после
      определения. Оно создаёт локальную область видимости для переменных и функций, чтобы избежать конфликтов имён
      и сохранить приватность данных.

      Обычно использовалась для создания модулей, эмуляции блока со своей областью видимости и разовой
      инициализации при загрузке страницы. Сейчас эти задачи чаще решают ES-модули и `let`/`const`.
    code: |
      (function () {
        const x = 5;
        console.log(x); // 5
      })();

      console.log(x); // ReferenceError
    codeLang: js
    points:
      - Функция-выражение, вызванная сразу
      - Своя область видимости, приватные переменные
      - Раньше — модули, сейчас — ES-модули

  - id: open-js-005
    topic: JavaScript
    level: middle
    question: |
      Чем отличаются localStorage, sessionStorage, cookie и IndexedDB?
    answer: |
      localStorage хранит данные бессрочно, очищается только из JavaScript или при очистке данных сайта. Около 5 МБ.
      Работает по правилу одного источника (same origin policy) — данные доступны только своему источнику.

      sessionStorage хранит данные, пока открыта вкладка: закрыли — данные пропали. У каждой вкладки свои данные,
      даже у двух вкладок одного сайта. Тоже около 5 МБ.

      Cookie — данные, которые браузер сам отправляет на сервер в заголовках. Около 4 КБ. Срок жизни задаётся при
      создании: `Expires` (точная дата) или `Max-Age` (в секундах). `Domain` и `Path` — где кука действует. `Secure`
      — только по HTTPS. `HttpOnly` — недоступна из JavaScript, только сервер (защита от XSS, важно для токенов).
      `SameSite` — отправлять ли в кросс-сайтовых запросах (защита от CSRF). Для запросов на другой источник куки
      нужно разрешить явно: `withCredentials: true` или `credentials: 'include'`.

      IndexedDB — встроенная база данных, мощнее localStorage, асинхронная, для больших объёмов и офлайн-приложений.
      Технически данные хранятся в профиле браузера пользователя.
    points:
      - localStorage — бессрочно, ~5 МБ, только клиент
      - sessionStorage — пока открыта вкладка, своя у каждой вкладки
      - Cookie — ~4 КБ, уходят на сервер, атрибуты HttpOnly, Secure, SameSite
      - IndexedDB — база для больших данных и офлайна

  - id: open-js-006
    topic: JavaScript
    level: middle
    question: |
      Чем отличаются `new`, `Object.create()` и классы ES6?
    answer: |
      `new` — создание объекта через функцию-конструктор: создаётся объект, ему ставится прототип
      `Constructor.prototype`, вызывается конструктор с `this` на этот объект.

      `Object.create(proto)` — создание объекта с указанным прототипом, без вызова конструктора.
      `Object.create(null)` даёт объект совсем без прототипа.

      Классы ES6 — синтаксический сахар над функцией-конструктором и `prototype`, плюс строгий режим, запрет вызова
      без `new`, `extends` и `super`.
    points:
      - '`new` — конструктор + прототип'
      - '`Object.create` — только прототип, конструктор не вызывается'
      - Классы — сахар над конструктором

  - id: open-js-007
    topic: JavaScript
    level: middle
    question: |
      Что такое Proxy и где его используют?
    answer: |
      Proxy — «обёртка» над объектом, которая может перехватывать и изменять его базовые операции. Простая аналогия:
      переводчик между вами и объектом — вы говорите с Proxy, а он решает, как обработать запрос.

      Создаётся так: `new Proxy(target, handler)`, где `target` — исходный объект, `handler` — объект с
      методами-ловушками. Основные ловушки: `get` — чтение свойства (логирование, проверка доступа), `set` — запись
      (валидация, реактивность), `has` — оператор `in`, `deleteProperty` — `delete`, `ownKeys` — `Object.keys` и
      перебор ключей, `apply` — вызов функции, `construct` — `new`, `getPrototypeOf`.

      Примеры: валидация данных, логирование, значения по умолчанию, объект только для чтения, массив с
      отрицательными индексами как в Python. Внутри ловушек часто используют Reflect для стандартного поведения.
      Прокси можно отозвать через `Proxy.revocable` — после `revoke()` любая операция бросает TypeError.

      Где используют: реактивность Vue 3, валидация форм, мемоизация, ленивая загрузка свойств, ORM. Ограничения: не
      перехватываются `typeof`, сравнение `===` и внутренние слоты встроенных объектов; производительность чуть ниже,
      чем у обычных объектов.
    code: |
      const user = new Proxy({}, {
        set(target, prop, value) {
          if (prop === 'age' && (typeof value !== 'number' || value < 0)) {
            throw new Error('Возраст должен быть положительным числом');
          }
          target[prop] = value;
          return true;
        },
      });

      user.age = 25; // ОК
      user.age = -5; // Ошибка!
    codeLang: js
    points:
      - Обёртка с ловушками над базовыми операциями
      - '`get`, `set`, `has`, `deleteProperty`, `ownKeys`, `apply`, `construct`'
      - Vue 3, валидация, логирование, значения по умолчанию
      - В паре с Reflect

  - id: open-js-008
    topic: JavaScript
    level: middle
    question: |
      Что такое Reflect API и зачем он нужен?
    answer: |
      Reflect — встроенный объект (ES6) с функциями, которые выполняют внутренние операции языка: «зеркальное
      отражение» обычных действий с объектами. Вместо `obj.prop = value` — `Reflect.set(obj, 'prop', value)`, вместо
      `delete obj.prop` — `Reflect.deleteProperty(obj, 'prop')`. То же самое, но в функциональном стиле.

      Основные методы: `Reflect.get` (с третьим аргументом receiver — это `this` для геттера), `Reflect.set`
      (возвращает `true` или `false`), `Reflect.has` — как `in`, `Reflect.deleteProperty`, `Reflect.construct` — как
      `new`, `Reflect.apply` — вызов функции с контекстом.

      Набор методов Reflect совпадает с ловушками Proxy, поэтому они идеальные компаньоны: в ловушке пишут
      `return Reflect.get(target, property, receiver)` и получают стандартное поведение с правильным `this`.
      Применение — Proxy-ловушки, валидация, наблюдение за объектами, метапрограммирование. В обычном коде лучше
      классический синтаксис — он читаемее.
    points:
      - Функции для встроенных операций над объектами
      - '`set` и `deleteProperty` возвращают успех булевым значением'
      - Методы совпадают с ловушками Proxy
      - receiver — правильный `this` для геттеров

  - id: open-js-009
    topic: JavaScript
    level: middle
    question: |
      Что такое `Symbol.iterator` и как сделать объект итерируемым?
    answer: |
      `Symbol.iterator` — встроенный символ, который указывает на метод, возвращающий итератор. Он делает объект
      итерируемым (перебираемым) в `for...of` и в spread `...`.

      Как работает `for...of`: вызывает `obj[Symbol.iterator]()`, получает итератор, вызывает `.next()`, пока
      `done !== true`, и берёт `value` из каждого результата. Итератор — объект с методом `next()`, который
      возвращает `{ value, done }`. Ещё у итератора может быть `return()` — его вызовут при досрочном выходе из
      цикла, чтобы освободить ресурсы, — и редко используемый `throw()`.

      Итератор по умолчанию есть у массивов, строк, `Map`, `Set`, `NodeList`. Array-like объект (индексы и
      `length`) без `Symbol.iterator` в `for...of` не работает — его превращают через `Array.from`. Проверить
      итерируемость: `typeof obj[Symbol.iterator] === 'function'`.

      С генератором проще: `*[Symbol.iterator]() { yield … }`. Используют для кастомных коллекций (очередь, стек,
      дерево), ленивых и бесконечных последовательностей, потоковой обработки. Для простых объектов хватит
      `Object.keys` и `Object.values`.
    code: |
      const range = {
        from: 1,
        to: 5,
        *[Symbol.iterator]() {
          for (let i = this.from; i <= this.to; i++) {
            yield i;
          }
        },
      };

      console.log([...range]); // [1, 2, 3, 4, 5]
    codeLang: js
    points:
      - Метод `[Symbol.iterator]` возвращает итератор
      - '`next()` возвращает `{ value, done }`'
      - '`return()` — при `break`'
      - Генератор — самый короткий способ
      - Array-like без итератора — через `Array.from`

  - id: open-js-010
    topic: JavaScript
    level: middle
    question: |
      Что такое Web Worker? Что он может и чего не может?
    answer: |
      Web Worker — JavaScript-скрипт, который выполняется в фоновом потоке, параллельно с основным. Позволяет делать
      тяжёлые вычисления без блокировки интерфейса.

      Общение — только сообщениями: основной поток создаёт `new Worker('worker.js')`, отправляет данные через
      `postMessage` и получает результат в `onmessage`; воркер так же слушает `self.onmessage` и отвечает
      `self.postMessage`. Ошибки ловят в `onerror`.

      Типы: Dedicated Worker — для одной страницы, самый распространённый; Shared Worker — общий для нескольких
      вкладок, общение через `port`; Service Worker — отдельная технология; Audio Worklet — для обработки звука.

      Может: вычисления, обработку больших данных, WebSocket, fetch, таймеры, IndexedDB, WebAssembly. Не может: DOM,
      `window`, `document`, `localStorage`, `alert`/`confirm`/`prompt`.

      Примеры: обработка изображений (данные `getImageData` в воркер, фильтр, обратно в canvas), парсинг больших
      данных с прогрессом, WebSocket в воркере с отдачей в основной поток уже обработанных данных.
    points:
      - Фоновый поток, не блокирует интерфейс
      - Общение через `postMessage` и `onmessage`
      - Dedicated, Shared, Service Worker
      - Нет DOM, `window`, `localStorage`

  - id: open-js-011
    topic: JavaScript
    level: middle
    question: |
      Что такое автобоксинг?
    answer: |
      Автобоксинг (autoboxing) — механизм, который автоматически и временно преобразует примитивное значение
      (string, number, boolean, symbol, bigint) в соответствующий объект-обёртку (`String`, `Number`, `Boolean`,
      `Symbol`, `BigInt`), когда мы пытаемся использовать методы или свойства, доступные только объектам.

      Поэтому работает `'abc'.toUpperCase()`. Обёртка живёт одну операцию: записать примитиву своё свойство нельзя —
      `s.foo = 1` в обычном режиме молча пропадёт, в строгом бросит TypeError. У `null` и `undefined` обёрток нет,
      поэтому у них методы не вызываются.
    points:
      - Временная обёртка вокруг примитива
      - Нужна, чтобы вызывать методы у примитивов
      - Свойство в примитив не сохраняется
      - У `null` и `undefined` обёрток нет

  - id: open-js-012
    topic: JavaScript
    level: middle
    question: |
      Какие алгоритмы сортировки знаешь? Какая у них сложность?
    answer: |
      Пузырьковая сортировка — простая: сравнивает соседние элементы и меняет их местами, если они в неправильном
      порядке. Повторяет проходы, пока массив не отсортирован. Сложность `O(n²)`.

      Сортировка выбором — на каждом шаге находит минимальный элемент в неотсортированной части и ставит его в
      начало. Сложность `O(n²)`.

      Быстрая сортировка (quick sort) — рекурсивная: выбирает опорный элемент (pivot), делит массив на части меньше и
      больше него и рекурсивно сортирует их. Сложность `O(n log n)` в среднем, `O(n²)` в худшем случае — когда опорный
      элемент каждый раз крайний.

      Встроенный `Array.prototype.sort` в V8 — TimSort, `O(n log n)` и стабильный.
    points:
      - Пузырёк — соседи меняются местами, `O(n²)`
      - Выбор — минимум в начало, `O(n²)`
      - Quick sort — pivot и рекурсия, `O(n log n)` в среднем, `O(n²)` в худшем

  - id: open-js-013
    topic: JavaScript
    level: middle
    question: |
      Какие модификаторы доступа есть в JavaScript и TypeScript? Чем отличаются public, protected и private?
    answer: |
      Модификаторы доступа определяют, откуда можно обращаться к членам класса. Public (по умолчанию) — доступен
      везде: в классе, в подклассах и снаружи. Protected — в классе и в подклассах, но не снаружи. Private — только
      внутри самого класса, даже подклассы доступа не имеют.

      В TypeScript есть все три (`public`, `protected`, `private`), но это проверки компилятора — после сборки поля
      обычные.

      В JavaScript: публичные поля и методы — по умолчанию; приватные — с `#` (ES2022), доступ только внутри класса
      как `this.#password`, наследники их не видят; статические — `static`, принадлежат классу, а не экземпляру
      (`Class.method()`); бывают и статические приватные — `static #secret`. Геттеры и сеттеры (`get`/`set`) дают
      доступ как к свойству. `protected` в JS нет.

      Когда что: public — интерфейс класса, protected — внутренняя логика для подклассов, private — чувствительные
      данные и детали реализации (инкапсуляция).
    points:
      - Public — везде, protected — класс и наследники, private — только класс
      - В TS это проверки компилятора
      - В JS — `#` для приватного, `static` для класса
      - '`protected` в JS нет'

  - id: open-js-014
    topic: JavaScript
    level: middle
    question: |
      В чём отличие `null` от `undefined`?
    answer: |
      `null` — явное указание на отсутствие значения или объекта. Его назначает разработчик вручную, часто для
      инициализации переменных, которые ждут объект.

      `undefined` — результат автоматического присваивания: переменная объявлена, но не инициализирована, свойства
      нет, функция ничего не вернула.

      В логическом контексте оба ложные. `null == undefined` — `true`, а `null === undefined` — `false`. `typeof
      null` — `'object'` (историческая ошибка), `typeof undefined` — `'undefined'`.
    points:
      - '`null` — явно «пусто», ставит разработчик'
      - '`undefined` — «ещё не присвоено», ставит язык'
      - '`==` равны, `===` нет'
      - '`typeof null === ''object''`'

  - id: open-js-015
    topic: JavaScript
    level: middle
    question: |
      Что такое второй аргумент `JSON.stringify`?
    answer: |
      Второй аргумент `JSON.stringify` — replacer, заменитель. Это функция или массив, которые позволяют
      контролировать, что и как попадёт в JSON.

      Функция `(key, value)` вызывается для каждого свойства: что она вернёт, то и запишется, а `undefined` исключит
      свойство — так, например, убирают пароль. Массив — белый список ключей. Третий аргумент — отступ для
      красивого вывода.
    code: |
      const json = JSON.stringify(user, (key, value) => {
        if (key === 'password') {
          return undefined; // исключаем пароль
        }
        return value;
      });
    codeLang: js
    points:
      - Replacer — функция или массив ключей
      - '`undefined` из функции выкидывает свойство'
      - Третий аргумент — отступ

  - id: open-js-016
    topic: JavaScript
    level: middle
    question: |
      Зачем нужен тип данных `symbol`?
    answer: |
      Symbol — примитивный тип, значения которого создаются вызовом функции `Symbol()`. Каждый созданный символ
      уникален, даже с одинаковым описанием. Символы используют как имена свойств объектов.

      Символьные свойства не видны при обычных операциях: их нет в `Object.keys`, `for...in` и `JSON.stringify`.
      Прочитать их можно прямым обращением `obj[sym]`, через `Object.getOwnPropertySymbols` и `Reflect.ownKeys`.
      Поэтому символы хороши для «скрытых» служебных ключей, которые не конфликтуют с чужими.

      Ещё есть встроенные символы, которые задают поведение объекта: `Symbol.iterator` — итерируемость,
      `Symbol.toPrimitive` — приведение к примитиву.
    points:
      - Уникальный примитив
      - Ключи свойств без конфликтов
      - Не видны в `Object.keys`, `for...in`, JSON
      - Встроенные символы — `Symbol.iterator` и другие

  - id: open-js-017
    topic: JavaScript
    level: middle
    question: |
      Как задать контекст функции? Чем отличаются `call`, `apply` и `bind`?
    answer: |
      `call` — вызов функции с подменой контекста `this`. Аргументы функции передаются вторым и дальше, через
      запятую.

      `apply` — то же самое, но аргументы передаются массивом. Удобно, когда их число переменное.

      `bind` — создаёт «обёртку» над функцией, которая подменяет её контекст. В отличие от `call` и `apply`, не
      вызывает функцию, а возвращает обёртку, которую можно вызвать позже. Можно зафиксировать и первые
      аргументы — частичное применение.

      У стрелочных функций своего `this` нет, поэтому `call`, `apply` и `bind` его не поменяют — сами функции
      вызываются, но `this` остаётся внешним.
    code: |
      function multiply(a, b) {
        return a * b;
      }

      const double = multiply.bind(null, 2);
      console.log(double(3)); // 6
    codeLang: js
    points:
      - '`call` — вызов, аргументы через запятую'
      - '`apply` — вызов, аргументы массивом'
      - '`bind` — новая функция, не вызывает'
      - '`bind` с аргументами — частичное применение'

  - id: open-js-018
    topic: JavaScript
    level: middle
    question: |
      Как работает `instanceof` под капотом?
    answer: |
      Он проверяет, присутствует ли `Constructor.prototype` в цепочке `[[Prototype]]` проверяемого объекта. То есть
      идёт от объекта вверх по прототипам до `null` и сравнивает каждый с `Constructor.prototype`.

      Поэтому `Object.create(Foo.prototype) instanceof Foo` — `true`, хотя конструктор не вызывался. А объект из
      другого iframe не пройдёт проверку `instanceof Array` — у того окна свой `Array.prototype`; для массивов
      надёжнее `Array.isArray`.
    points:
      - Ищет `C.prototype` в цепочке прототипов
      - Конструктор не важен — важен прототип
      - Для массивов — `Array.isArray`

  - id: open-js-019
    topic: JavaScript
    level: middle
    question: |
      Как работает сборщик мусора в JS?
    answer: |
      Раньше сборщики работали подсчётом ссылок: нет ссылок — объект удаляется. Но это давало утечки, когда объекты
      ссылаются друг на друга по кругу.

      Сейчас работает mark-and-sweep: если объект недоступен по ссылкам из корней (глобальный объект, стек вызовов),
      он удаляется. Сборщик периодически запускается и обходит граф объектов.

      В V8 память делится на стек и кучу. Объекты живут в куче, там и работает сборщик. V8 опирается на гипотезу
      поколений — большинство объектов живут недолго. New Space (молодое поколение, 1–64 МБ) очищается часто быстрым
      алгоритмом Scavenge: зона делится на две половины, живые объекты копируются компактно в другую половину,
      мусор выбрасывается, половины меняются ролями. Пережив две очистки, объект переезжает в Old Space. Его чистят
      реже тяжёлым Mark-Sweep-Compact: маркировка достижимого от корней, удаление немаркированного, уплотнение,
      чтобы память не была как швейцарский сыр.

      Раньше сборка полностью замораживала JS (stop-the-world). Сейчас V8 маркирует инкрементально и параллельно в
      фоновых потоках, чтобы не было просадок FPS.
    points:
      - Mark-and-sweep — достижимость от корней
      - Циклические ссылки не мешают удалению
      - Поколения — молодое (Scavenge) и старое (Mark-Sweep-Compact)
      - Инкрементальная и фоновая маркировка

  - id: open-js-020
    topic: JavaScript
    level: middle
    question: |
      Какие причины утечек памяти на фронтенде и как их искать?
    answer: |
      Утечка — объект приложению больше не нужен, но на него по ошибке осталась ссылка из корня, и сборщик не может
      его удалить.

      Причины. Ненужные глобальные переменные — живут, пока открыта страница. Забытые таймеры и интервалы:
      `setInterval` держит колбэк, а колбэк через замыкание — данные или целый компонент; лечится `clearInterval` и
      `clearTimeout` при размонтировании. Замыкания в долгоживущих функциях, например в глобальном обработчике.
      Забытые обработчики событий на `window`, `document`, `body` — лечится `removeEventListener` или передачей
      `AbortSignal` в `addEventListener`, чтобы снять всё одним вызовом. Отсоединённые DOM-узлы: узел удалён со
      страницы, но на него ссылается переменная — обнулять такие ссылки. Неконтролируемые `Map` и `Set` — для кэшей
      и метаданных объектов брать `WeakMap` и `WeakSet`.

      Как искать: вкладка Memory в Chrome DevTools. Heap Snapshot — снимок, действия в интерфейсе, удаление
      компонента, второй снимок, сравнение через Comparison, поиск оставшихся классов и `Detached HTMLElement`.
      Allocation Instrumentation on Timeline — если синие столбики выделения не исчезают после сборки, есть утечка.
    points:
      - Глобальные переменные, таймеры, обработчики
      - Замыкания и отсоединённые DOM-узлы
      - Растущие `Map`/`Set` — `WeakMap`
      - Memory в DevTools — Heap Snapshot, Comparison

  - id: open-js-021
    topic: JavaScript
    level: middle
    question: |
      Как скопировать объект? Чем поверхностная копия отличается от глубокой?
    answer: |
      Поверхностная копия (shallow copy) копирует только верхний уровень: spread `{ ...obj }` и `Object.assign()`.
      Вложенные объекты остаются общими.

      Глубокая копия (deep copy). `JSON.parse(JSON.stringify(obj))` — простой способ с ограничениями: не копирует
      функции и `undefined`, превращает `Date` в строку, `RegExp` — в пустой объект, ломается на циклических ссылках.
      `structuredClone()` — современный API: поддерживает большинство типов, включая `Date`, `Map`, `Set` и
      циклические ссылки, доступен в браузерах и Node.js 17+; функции не копирует — бросает ошибку. Рекурсивная
      функция — для своего глубокого копирования с нужными типами.
    points:
      - Поверхностная — spread и `Object.assign`
      - JSON — теряет функции, `undefined`, даты
      - '`structuredClone` — даты, `Map`, циклы, но не функции'
      - Своя рекурсия — для особых случаев

  - id: open-js-022
    topic: JavaScript
    level: middle
    question: |
      Как создать объект без прототипа и зачем? Как изменить прототип объекта?
    answer: |
      `Object.create(null)` создаёт объект без прототипа. У него нет ни `toString`, ни `hasOwnProperty` —
      `cleanObject.hasOwnProperty('key')` бросит TypeError. Зато никакие ключи не конфликтуют с унаследованными, и
      такой объект удобен как чистый словарь.

      Альтернатива — `Map`: у неё есть прототип с методами, но ключи хранятся отдельно от свойств и с ними не
      смешиваются.

      Изменить прототип существующего объекта можно через `Object.setPrototypeOf` или `__proto__`, но это бьёт по
      производительности — движок сбрасывает оптимизации. Лучше сразу создавать объекты с нужным прототипом через
      `Object.create` или конструкторы.
    points:
      - '`Object.create(null)` — чистый словарь'
      - Нет методов `Object.prototype`
      - Альтернатива — `Map`
      - '`setPrototypeOf` медленный — лучше задавать прототип сразу'

  - id: open-js-023
    topic: JavaScript
    level: middle
    question: |
      Как сравнить два объекта в JS?
    answer: |
      `===` сравнивает объекты по ссылке: два одинаковых по содержимому объекта не равны.

      Глубокое сравнение — рекурсией. Если значения строго равны (примитивы или одна ссылка) — `true`. Если одно из
      них `null` или не объект — `false`. Иначе сравниваем количество ключей и для каждого ключа проверяем, что он
      есть во втором объекте и значения рекурсивно равны.

      Простой способ для объектов без ссылок — сравнить `JSON.stringify` обоих. Ограничения: порядок свойств имеет
      значение, не работает с функциями, `undefined` и Symbol, не обрабатывает циклические ссылки. В проектах часто
      берут готовый `isEqual` из lodash.
    points:
      - '`===` — по ссылке'
      - Рекурсивный `deepEqual` по ключам
      - JSON — зависит от порядка ключей

  - id: open-js-024
    topic: JavaScript
    level: middle
    question: |
      Как устроена асинхронность в JS? Чем отличаются `Promise.all`, `allSettled`, `race` и `any`?
    answer: |
      Выполнение JS-кода однопоточное: в конкретный момент движок выполняет не больше одной строки, и вторая не
      начнётся, пока не закончится первая. Асинхронные операции (таймеры, сеть) выполняет окружение, а результаты
      возвращаются через очереди event loop. Промисы — способ работать с такими результатами.

      `Promise.all` — выполнится, когда выполнятся все промисы, или отклонится при первой ошибке. Остальные промисы
      при этом не прерываются — они продолжают работать, просто их результат никто не ждёт.

      `Promise.allSettled` — выполнится, когда все промисы завершатся (успешно или с ошибкой), с массивом
      результатов `{ status, value }` или `{ status, reason }`. Ошибка одного его не останавливает.

      `Promise.race` — результат первого завершившегося промиса, успех или ошибка.

      `Promise.any` — результат первого успешного. Если отклонились все — ошибка `AggregateError` со всеми причинами.
    points:
      - JS однопоточный, асинхронность — через окружение и event loop
      - '`all` — все или первая ошибка, остальные не отменяются'
      - '`allSettled` — все, с отчётом'
      - '`race` — первый завершившийся, `any` — первый успешный'

  - id: open-js-025
    topic: JavaScript
    level: middle
    question: |
      Какие методы строк знаешь?
    answer: |
      Регистр — `toLowerCase`, `toUpperCase`. Объединение и разбиение — `concat`, `split` (вторым аргументом лимит
      элементов), `repeat`. Поиск — `charAt` (символ по индексу), `includes`, `indexOf` и `lastIndexOf`,
      `startsWith`, `endsWith`, `search` (по строке или регулярке, возвращает индекс).

      Части строки — `slice` (понимает отрицательные индексы), `substring` (между двумя индексами, отрицательные
      считает нулём), `substr` (стартовая позиция и длина, устарел). Замена — `replace` (первое вхождение или по
      регулярке), `replaceAll` (все вхождения, как `replace` с флагом `g`).

      Дополнение и обрезка — `padStart` и `padEnd` (добавляют символы до заданной длины, например `padStart(3, '0')`),
      `trim`, `trimStart`, `trimEnd` (обрезают пробелы). Коды — `charCodeAt` (числовое значение Юникода),
      `String.fromCharCode` (из кодов в символы). `String.raw` — теговая функция для шаблонных строк, которая
      возвращает строку без обработки escape-последовательностей вроде `\n`.

      Строки неизменяемы: методы, которые «меняют» строку, возвращают новую, а поисковые возвращают число или boolean.
    points:
      - Поиск — `includes`, `indexOf`, `startsWith`
      - Части — `slice`, `substring`
      - Замена — `replace`, `replaceAll`
      - '`padStart`, `trim`, `split`, `String.raw`'
      - Строки неизменяемы

  - id: open-js-026
    topic: JavaScript
    level: middle
    question: |
      Какие методы массивов знаешь? Какие из них мутируют массив?
    answer: |
      Мутируют исходный массив: `push` (в конец, возвращает новую длину), `pop` (из конца), `shift` (из начала),
      `unshift` (в начало), `splice` (удаляет и вставляет), `sort` (по умолчанию сравнивает как строки, можно
      передать функцию сравнения), `reverse`, `fill`. Немутирующие аналоги из ES2023 — `toSorted`, `toReversed`, `toSpliced`, `with`.

      Возвращают новое: `slice` (кусок массива), `concat` (соединение), `map`, `filter` (пустой массив, если ничего не
      нашлось), `flat` (по умолчанию разворачивает один уровень), `join` (в строку).

      Поиск: `indexOf`, `lastIndexOf`, `includes` — как у строк; `find` — первый элемент по условию или `undefined`;
      `findIndex` и `findLastIndex` — индекс. Проверки: `some` — хотя бы один подходит, `every` — все. Перебор и
      свёртка: `forEach`, `reduce` и `reduceRight` с аккумулятором и начальным значением. `Array.isArray` — проверка
      на массив. Многие методы принимают последним аргументом `thisArg` — контекст для колбэка.
    points:
      - Мутируют — push, pop, shift, unshift, splice, sort, reverse
      - Новый массив — slice, concat, map, filter, flat
      - Поиск — find, findIndex, includes, some, every
      - '`reduce` с начальным значением'

  - id: open-js-027
    topic: JavaScript
    level: middle
    question: |
      Какие методы объектов (`Object.*`) знаешь?
    answer: |
      `Object.create()` — создаёт объект с указанным прототипом. `Object.keys()`, `Object.values()`,
      `Object.entries()` — массивы ключей, значений и пар «ключ — значение». `Object.assign()` — копирует свойства из
      одного объекта в другой.

      `Object.freeze()` — запрещает изменять, добавлять и удалять свойства. `Object.seal()` — запрещает добавлять и
      удалять, но разрешает менять существующие. Оба поверхностные.

      `Object.getPrototypeOf()` — внутренний `[[Prototype]]` объекта, тот же, что виден через `__proto__`.
      `Object.defineProperty()` и `defineProperties()` — добавляют свойства с дескриптором; флаги по умолчанию
      `false`, поэтому такое свойство не видно в `Object.keys`. `Object.getOwnPropertyNames()` — все собственные
      строковые ключи, перечисляемые и нет. `Object.getOwnPropertySymbols()` — символьные ключи.
    points:
      - '`keys`, `values`, `entries`, `assign`'
      - '`freeze` и `seal`'
      - '`create`, `getPrototypeOf`'
      - '`defineProperty` — флаги по умолчанию `false`'

  - id: open-js-028
    topic: JavaScript
    level: middle
    question: |
      Что такое область видимости и лексическое окружение (Lexical Environment)?
    answer: |
      Область видимости — зона доступа переменных и функций. Глобальная — переменные доступны везде. Локальная —
      только внутри функции. Блочная — вводится `let` и `const`, блок — всё, что в фигурных скобках.

      Lexical Environment — механизм из спецификации ECMAScript, который управляет областями видимости. Это не объект,
      доступный в коде, а абстрактная структура, которую реализует движок. Состоит из двух частей: Environment Record —
      хранит привязки переменных, функций и параметров; и ссылки на внешнее окружение — то, где функция была
      определена, а не вызвана.

      Окружение создаётся при входе в глобальный код, функцию или блок. При обращении к переменной движок ищет её в
      текущей записи, потом во внешней, и так по цепочке; не нашёл — `ReferenceError`. Когда функция завершается,
      окружение умирает — но сохраняется, если на него есть ссылки, например из вложенной функции. Это и есть
      замыкание.
    code: |
      function outer() {
        let a = 1;
        function inner() {
          let b = 2;
          console.log(a); // ищет в inner (нет) -> outer (нашёл)
        }
        inner();
      }
      outer();
    codeLang: js
    points:
      - Глобальная, функциональная, блочная области
      - Окружение — запись + ссылка на внешнее
      - Внешнее — по месту объявления
      - Поиск по цепочке, иначе ReferenceError

  - id: open-js-029
    topic: JavaScript
    level: middle
    question: |
      Что такое проваливание промисов? Что выведет код?
    code: |
      Promise.resolve('foo')
        .then(Promise.resolve('bar'))
        .then((result) => console.log(result));
    codeLang: js
    answer: |
      Выведет `foo`. В `then` передан не колбэк, а промис — `Promise.resolve('bar')` вызывается сразу, и в `then`
      уходит уже готовый объект.

      По спецификации, если аргумент `then` не функция, он заменяется на «функцию идентичности» `x => x` (для ошибок —
      на проброс ошибки дальше). Поэтому значение `'foo'` проваливается в следующий `then`, а `'bar'` никуда не
      попадает.

      Это частая причина багов: вместо функции случайно передают результат её вызова. Всегда оборачивайте:
      `promise.then(() => Promise.resolve('something'))`.
    points:
      - Не-функция в `then` заменяется на `x => x`
      - Значение проваливается дальше
      - Передавать функцию, а не результат вызова

  - id: open-js-030
    topic: JavaScript
    level: middle
    question: |
      Что такое прототипное наследование? Чем отличаются `[[Prototype]]`, `__proto__` и `prototype`?
    answer: |
      Прототипы — механизм наследования в JS, основанный на объектах. Каждый объект имеет скрытую ссылку на другой
      объект — прототип, и так образуется цепочка для поиска свойств. Классы ES6 — синтаксический сахар над этим.

      `[[Prototype]]` — внутренняя ссылка «под капотом». `__proto__` — устаревший геттер и сеттер для доступа к
      `[[Prototype]]`. `prototype` — свойство функций-конструкторов: объект, который станет `[[Prototype]]` для
      экземпляров, созданных через `new`. Аналогия: `[[Prototype]]` — ДНК организма, `__proto__` — микроскоп, чтобы
      её увидеть, `prototype` — чертёж на заводе для новых объектов.

      Поиск свойства: сначала собственные свойства, потом вверх по цепочке, до `null`; не нашлось — `undefined`.
      Запись создаёт свойство на самом объекте, прототип не трогает. Методы наследуются, но `this` — объект, который
      вызвал метод. Это делегирование, а не копирование: изменения прототипа видят все наследники.

      `class A extends B` устанавливает `A.prototype.[[Prototype]] = B.prototype`. Задать прототип можно через
      `Object.create()`, `Object.setPrototypeOf()` или `__proto__`, но менять его на лету дорого. Менять встроенные
      прототипы (`Object.prototype.x = …`) — антипаттерн. `instanceof` проверяет наличие `prototype` в цепочке.
    code: |
      class Animal {
        constructor(name) { this.name = name; }
        eat() { console.log(`${this.name} ест`); }
      }

      class Rabbit extends Animal {
        jump() { console.log(`${this.name} прыгает`); }
      }

      const rabbit = new Rabbit('Бакс');
      console.log(rabbit.__proto__ === Rabbit.prototype);           // true
      console.log(rabbit.__proto__.__proto__ === Animal.prototype); // true
    codeLang: js
    points:
      - Цепочка объектов до `null`
      - '`[[Prototype]]` — ссылка, `__proto__` — доступ к ней, `prototype` — у конструктора'
      - Делегирование, а не копирование
      - Запись идёт в сам объект

  - id: open-js-031
    topic: JavaScript
    level: middle
    question: |
      Чем Function Declaration отличается от Function Expression?
    answer: |
      Function Declaration — `function sum(a, b) {}`. Function Expression — функция как значение выражения:
      `const sum = function (a, b) {}`, в том числе с именем — Named Function Expression.

      Главное отличие — поднятие (hoisting). Declaration поднимается полностью, её можно вызвать до объявления.
      Expression — нет: с `var` до присваивания в переменной `undefined` (вызов — TypeError), с `let` и `const` —
      временная мёртвая зона (ReferenceError).

      Declaration создаёт переменную в текущей области видимости. Expression создаёт функцию как значение — её
      можно передать, присвоить, вызвать сразу. Имя Named Function Expression видно только внутри самой функции —
      удобно для рекурсии, а снаружи будет ReferenceError. Стрелочные функции — всегда expressions. `typeof` у обеих
      — `'function'`, `.name` у выражения в переменной берётся из имени переменной.

      Declaration удобна для основных и утилитарных функций и когда нужен hoisting. Expression — для колбэков,
      условного создания функций, методов объектов, IIFE.
    points:
      - Declaration поднимается целиком
      - Expression — значение переменной, до присваивания не вызвать
      - Имя NFE видно только внутри
      - Стрелочные — всегда expression

  - id: open-js-032
    topic: JavaScript
    level: middle
    question: |
      В чём разница между `event.target` и `event.currentTarget`?
    answer: |
      `event.target` — элемент, на котором произошло событие, его источник. Не меняется, пока событие всплывает.

      `event.currentTarget` — элемент, на котором висит обработчик, сработавший сейчас. При всплытии он меняется
      вместе с текущим элементом.

      На этой разнице строится делегирование событий: один обработчик на родителе, а по `target` понимаем, какой
      ребёнок нажат. Ещё есть `event.stopPropagation()` — остановить всплытие, и `event.stopImmediatePropagation()` —
      ещё и не вызывать остальные обработчики на этом же элементе.
    points:
      - '`target` — где случилось'
      - '`currentTarget` — где висит обработчик'
      - Делегирование событий
      - '`stopImmediatePropagation` — и соседние обработчики тоже'

  - id: open-js-033
    topic: JavaScript
    level: middle
    question: |
      В чём разница между spread-оператором и rest-оператором?
    answer: |
      Синтаксис один — `...`, смысл зависит от места.

      Spread разворачивает элементы массива или свойства объекта. Используется, чтобы создать новый массив или объект
      с элементами исходного (`[...arr, 3]`, `{ ...obj }`), объединить массивы и объекты или передать элементы
      массива в функцию как отдельные аргументы (`Math.max(...nums)`).

      Rest собирает. В параметрах функции — оставшиеся аргументы в настоящий массив (`function f(first, ...rest)`).
      В деструктуризации — оставшиеся элементы или свойства (`const { id, ...props } = obj`).
    points:
      - Spread — разворачивает
      - Rest — собирает
      - Rest — в параметрах и деструктуризации

  - id: open-js-034
    topic: JavaScript
    level: middle
    question: |
      В чём разница между классическим ООП и прототипным наследованием?
    answer: |
      В классическом ООП (Java, C++, C#) класс — это чертёж, объект — экземпляр чертежа. Наследование — копирование
      структуры класса: у объекта своя копия полей и ссылка на методы класса (vtable). Иерархия классов фиксирована
      при компиляции, типизация статическая.

      В прототипном (JavaScript) прототип — живой объект-образец, а объект ссылается на другой объект. Наследование —
      делегирование по ссылке: `dog` не нашёл метод у себя — идёт в `animal`, потом в `Object.prototype`, потом
      `null`. Цепочка ищется в рантайме и может меняться (`setPrototypeOf`), типизация динамическая. `super` ищет
      метод через внутреннюю ссылку `[[HomeObject]]` и её прототип.

      Итог: в JS классов в классическом смысле нет — есть объекты, связанные через `[[Prototype]]`. `class` — сахар над
      функциями-конструкторами и `prototype`. ООП в JS — это не «классы и экземпляры», а «объекты, делегирующие
      поведение другим объектам».
    points:
      - Класс — чертёж, прототип — живой объект
      - Копирование против делегирования
      - Цепочка ищется и может меняться в рантайме
      - '`class` в JS — сахар'

  - id: open-js-035
    topic: JavaScript
    level: middle
    question: |
      С помощью чего можно прервать запрос?
    answer: |
      `AbortController` — современный способ для fetch. Это API браузера (и Node.js), а не часть ECMAScript. Создаём
      контроллер, передаём его `signal` в запрос, вызываем `controller.abort()`. Промис fetch отклоняется с ошибкой
      `AbortError` — по имени ошибки отмену отличают от сетевого сбоя. Плюс в универсальности: тот же сигнал понимают
      `addEventListener`, многие библиотеки и свои асинхронные функции. Для таймаута есть `AbortSignal.timeout(ms)` — тогда ошибка называется `TimeoutError`, а не `AbortError`.

      `XMLHttpRequest.abort()` — для старого XHR и legacy-кода.
    code: |
      const controller = new AbortController();

      fetch('https://api.example.com/data', { signal: controller.signal })
        .then((response) => response.json())
        .catch((error) => {
          if (error.name === 'AbortError') {
            console.log('Запрос прерван');
          }
        });

      setTimeout(() => controller.abort(), 1000);
    codeLang: js
    points:
      - '`AbortController` и `signal`'
      - Ошибка `AbortError`
      - Сигнал понимают и другие API
      - '`xhr.abort()` для XHR'

  - id: open-js-036
    topic: JavaScript
    level: middle
    question: |
      Что такое временная сложность алгоритма? Какие бывают?
    answer: |
      Временная сложность показывает, как растёт время выполнения функции с ростом размера входных данных.

      `O(1)`, постоянное время — действие в один шаг, без циклов. `O(n)`, линейное — один цикл: массив из 100
      элементов — 100 итераций. `O(n²)`, квадратичное — два вложенных цикла по одним данным, три вложенных — `O(n³)`;
      например, пузырьковая сортировка и сортировка вставками. `O(log n)`, логарифмическое — стратегия «разделяй и
      властвуй», как бинарный поиск; хороший показатель. `O(n log n)` — хорошие сортировки. `O(n!)`, факториальное —
      самое тяжёлое, перебор всех перестановок.
    points:
      - Как время растёт с размером данных
      - '`O(1)`, `O(log n)`, `O(n)`, `O(n log n)`, `O(n²)`, `O(n!)`'
      - Вложенные циклы — степень, деление пополам — логарифм

  - id: open-js-037
    topic: JavaScript
    level: middle
    question: |
      Какие есть способы объявления переменных и чем они отличаются?
    answer: |
      `var` — функциональная или глобальная область видимости. В глобальном контексте становится свойством
      глобального объекта (`window` в браузере). Поднимается со значением `undefined`, можно объявить повторно.

      `let` и `const` — блочная область видимости. В глобальном контексте свойствами глобального объекта не
      становятся. Тоже поднимаются, но не инициализируются: до строки объявления они в временной мёртвой зоне
      (Temporal Dead Zone, TDZ), обращение даёт ReferenceError. `const` нельзя переприсвоить, но объект в нём менять
      можно.
    points:
      - '`var` — функция, `let`/`const` — блок'
      - '`var` поднимается с `undefined`, у `let`/`const` — TDZ'
      - '`var` на верхнем уровне — свойство `window`'
      - '`const` — запрет переприсваивания'

  - id: open-js-038
    topic: JavaScript
    level: middle
    question: |
      Чем стрелочные функции отличаются от обычных?
    answer: |
      Синтаксис: обычная функция использует ключевое слово `function` и требует `return`; стрелочная короче и может
      вернуть выражение без `return` и фигурных скобок.

      Контекст `this`: у обычной функции `this` зависит от того, как она вызвана (в методе — объект). У стрелочной
      своего `this` нет — она берёт его из внешнего окружения. Поэтому `call`, `apply` и `bind` не меняют `this`
      стрелочной функции.

      `arguments`: у обычной есть, у стрелочной нет — она видит `arguments` внешней функции.

      `new`: обычную можно использовать как конструктор, стрелочную — нельзя, у неё нет свойства `prototype`.

      Hoisting: Function Declaration поднимается, стрелочные — это выражения, не поднимаются. Стрелочные короче, но
      обычные гибче: методы объектов, конструкторы, функции с динамическим `this`.
    points:
      - Нет своего `this` — берётся снаружи, `bind` не поможет
      - Нет `arguments`
      - Нельзя с `new`, нет `prototype`
      - Короткий синтаксис и неявный `return`

  - id: open-js-039
    topic: JavaScript
    level: middle
    question: |
      Какие структуры данных есть в JS?
    answer: |
      Встроенные. Array — динамический массив с доступом по индексу: доступ `O(1)`, вставка и удаление не в конце —
      `O(n)`; используют для списков, очередей и стеков. Object — коллекция «ключ — значение» (хэш-таблица), вставка
      и поиск `O(1)` в среднем. Map — улучшенная версия для пар «ключ — значение»: ключи любого типа, порядок
      сохраняется. Set — уникальные значения. WeakMap и WeakSet — варианты, где ключи держатся слабо и могут быть
      собраны сборщиком мусора — для кэшей. TypedArray (например, `Uint8Array`) — бинарные данные, WebGL, файлы.

      Деревьев и графов из коробки нет, их делают на классах, массивах и объектах. Стек — на массиве (`push` и
      `pop`). Очередь — на массиве (`push` и `shift`). Связный список — узлы со ссылкой `next`. Дерево — узлы с
      `left` и `right`, например бинарное дерево поиска. Граф — `Map` со списками смежности.
    points:
      - Array, Object, Map, Set, WeakMap, WeakSet, TypedArray
      - Сложность — доступ к массиву `O(1)`, поиск по ключу `O(1)`
      - Стек, очередь, список, дерево, граф — своими руками

  - id: open-js-040
    topic: JavaScript
    level: middle
    question: |
      Что такое TC39 и ECMAScript?
    answer: |
      Ecma International TC39 — комитет из разработчиков JavaScript, авторов движков, исследователей и других
      участников, который развивает язык вместе с сообществом.

      ECMAScript — стандарт скриптового языка, а JavaScript — его самая популярная реализация. ES6 и ES2015 — одно и
      то же. С 2016 года стандарт выходит каждый год, а новые возможности проходят стадии предложений от 0 до 4 (с промежуточной 2.7):
      стадия 4 — фича войдёт в ближайший стандарт.

      В ES6 появились spread и rest, `let` и `const`, стрелочные функции, модули, деструктуризация. `async` и `await`
      пришли позже, в ES2017. Пример свежего — `Promise.try()`, который единообразно обрабатывает и синхронные, и
      асинхронные функции; в работе предложения для точной десятичной арифметики.
    points:
      - TC39 — комитет, развивающий язык
      - ECMAScript — стандарт, JS — реализация
      - ES6 = ES2015, дальше — ежегодно
      - Стадии предложений 0–4

  - id: open-js-041
    topic: JavaScript
    level: middle
    question: |
      Какие типы данных есть в JS?
    answer: |
      В спецификации данные делятся на объекты и не-объекты. Примитив — базовые «кирпичики» данных, включая числа и
      текст, которые не могут меняться.

      Всего 8 типов: number, string, boolean, null (`typeof null` — `'object'`, это историческая ошибка), undefined,
      symbol, bigint (целые произвольной длины — нужны, когда число выходит за ±(`2^53 − 1`)) — это 7 примитивов, и
      object — всё остальное, включая массивы и функции.

      `NaN` — тоже number: `typeof NaN === 'number'`. Он не равен самому себе, поэтому проверять его надо через
      `Number.isNaN()`.
    points:
      - 7 примитивов + object
      - '`typeof null === ''object''`'
      - bigint — целые произвольной длины, за пределами ±`2^53 − 1`
      - '`NaN` — number, проверка `Number.isNaN`'

  - id: open-js-042
    topic: JavaScript
    level: middle
    question: |
      Что такое флаги и дескрипторы свойств объекта?
    answer: |
      Помимо значения `value`, у свойства есть три флага. `writable` — если `true`, свойство можно изменить, иначе
      оно только для чтения. `enumerable` — если `true`, свойство видно в циклах и `Object.keys`. `configurable` —
      если `true`, свойство можно удалить и менять его флаги.

      `Object.getOwnPropertyDescriptor(obj, 'name')` возвращает полную информацию о свойстве. Задают дескрипторы через
      `Object.defineProperty(obj, prop, descriptor)` — и у него флаги по умолчанию `false`. При обычном
      присваивании все флаги `true`.

      Вместо `value` дескриптор может содержать `get` и `set` — тогда свойство работает как функция, например
      вычисляемое `fullName` из имени и фамилии.
    code: |
      const user = { firstName: 'Вася', surname: 'Петров' };

      Object.defineProperty(user, 'fullName', {
        get() {
          return `${this.firstName} ${this.surname}`;
        },
        set(value) {
          [this.firstName, this.surname] = value.split(' ');
        },
      });

      user.fullName = 'Петя Иванов';
      console.log(user.firstName); // Петя
    codeLang: js
    points:
      - '`writable`, `enumerable`, `configurable`'
      - '`getOwnPropertyDescriptor` и `defineProperty`'
      - У `defineProperty` флаги по умолчанию `false`
      - Аксессоры `get` и `set`

  - id: open-js-043
    topic: JavaScript
    level: middle
    question: |
      Что такое функции высшего порядка?
    answer: |
      Функции высшего порядка — функции, которые принимают другие функции как аргументы или возвращают функции как
      результат. В JS функции — обычные значения, поэтому это мощный инструмент для гибкого и модульного кода.

      Примеры: колбэки — функция передаётся внутрь другой и вызывается там (`setTimeout`, `addEventListener`); методы
      массивов `map`, `filter`, `reduce`; функции, которые возвращают функции — `bind`, `debounce`, каррирование,
      декораторы, HOC в React.
    points:
      - Принимает или возвращает функцию
      - Колбэки, `map`/`filter`/`reduce`
      - '`debounce`, каррирование, декораторы'

  - id: open-js-044
    topic: JavaScript
    level: middle
    question: |
      Что такое функция-генератор и где её используют?
    answer: |
      Генератор — функция, которая может приостанавливать выполнение и возобновлять его позже, возвращая несколько
      значений по очереди. Объявляется через `function*`.

      Как работает: при вызове генератор не выполняется, а возвращает итератор. Каждый `next()` выполняет код до
      следующего `yield`. `yield` приостанавливает выполнение и отдаёт значение, `return` завершает генератор.

      Методы: `next(value)` — возобновить, переданное значение станет результатом `yield`; `return(value)` —
      завершить досрочно; `throw(error)` — бросить ошибку в генератор. `yield*` делегирует другому генератору.
      Генераторы — итерируемые объекты, их можно перебирать `for...of` и разворачивать spread.

      Применение: бесконечные последовательности, генераторы id, обход дерева, батчи данных, собственные итераторы
      (`*[Symbol.iterator]()`), Redux Saga, раньше — асинхронный код до появления `async/await`. Плюсы — ленивые
      вычисления и экономия памяти, контроль потока. Минусы — сложнее отлаживать и читать.
    code: |
      function* numberGenerator() {
        yield 1;
        yield 2;
        yield 3;
      }

      const gen = numberGenerator();
      gen.next(); // { value: 1, done: false }
      gen.next(); // { value: 2, done: false }
      gen.next(); // { value: 3, done: false }
      gen.next(); // { value: undefined, done: true }
    codeLang: js
    points:
      - Функция с паузой, вызов возвращает итератор
      - '`next`, `return`, `throw`, `yield*`'
      - Ленивые и бесконечные последовательности
      - Redux Saga, свои итераторы

  - id: open-js-045
    topic: JavaScript
    level: middle
    question: |
      Что такое Map и Set, чем они отличаются? Когда Map лучше объекта? Что такое WeakMap и WeakSet?
    answer: |
      Set — коллекция уникальных значений любого типа, без ключей. Быстро проверяет наличие, добавляет и удаляет.
      Map — коллекция пар «ключ — значение», ключи любого типа, включая объекты.

      Map лучше объекта, когда ключи не строки, важен порядок добавления, часто добавляют и удаляют элементы, нужен
      размер (`size`) и частый перебор. Объект лучше, когда ключи — строки или символы, структура известна и
      фиксирована (конфиг), нужен JSON, методы и прототипы, совместимость со старым кодом.

      WeakSet хранит только объекты и держит их слабо — объект может быть удалён сборщиком мусора. Не итерируемый,
      есть только `add`, `has`, `delete`. WeakMap: ключи только объекты или незарегистрированные символы (другой примитив — ошибка), ключи не мешают сборке
      мусора, а запись исчезает вместе с ключом. Только `set`, `get`, `has`, `delete`, без `size`, `clear` и
      итераторов — ключи могут пропасть в любой момент. Обычные Map и Set держат объекты в памяти и могут приводить к
      утечкам.
    points:
      - Set — уникальные значения, Map — пары с любыми ключами
      - Map — нестроковые ключи, порядок, `size`, частые изменения
      - Weak-версии — только объекты, слабые ссылки, без перебора
      - Weak — для кэшей и метаданных

  - id: open-js-046
    topic: JavaScript
    level: middle
    question: |
      Что такое `arguments`?
    answer: |
      `arguments` — массивоподобный объект, доступный внутри обычных функций (не стрелочных), который содержит все
      переданные аргументы.

      Это не настоящий массив: `typeof` — `'object'`, `Array.isArray` — `false`, есть `length` и индексы, есть
      итератор (работает `for...of`), но нет методов массива. В массив превращают через `Array.from(arguments)`,
      `[...arguments]` или старым `Array.prototype.slice.call(arguments)`.

      В стрелочных функциях своего `arguments` нет — они видят `arguments` внешней функции. `arguments.callee` —
      ссылка на саму функцию, устарела и запрещена в strict mode. В нестрогом режиме `arguments` связан с
      параметрами (поменял `a` — поменялся `arguments[0]`), в строгом — нет. При параметрах по умолчанию в
      `arguments` попадает только реально переданное.

      Применение: функции с переменным числом аргументов, проксирование вызова `fn.apply(this, arguments)`,
      декораторы, полифилы. Минусы: хуже оптимизируется, хуже читается. Современная замена — rest-параметры
      `...args`, это настоящий массив.
    points:
      - Массивоподобный объект, не массив
      - Нет в стрелочных функциях
      - Связь с параметрами только в нестрогом режиме
      - Замена — rest `...args`

  - id: open-js-047
    topic: JavaScript
    level: middle
    question: |
      Что такое AST-дерево и где оно используется?
    answer: |
      AST (Abstract Syntax Tree, абстрактное синтаксическое дерево) — древовидное представление структуры исходного
      кода, где каждый узел — конструкция языка: оператор, выражение, объявление. Например, `const x = 10 + 5 * 2`
      станет объявлением переменной с идентификатором `x` и выражением сложения, у которого справа вложено
      умножение.

      Где используется. Транспиляция — Babel парсит код в AST, преобразует (например, стрелочные функции в обычные) и
      генерирует обратно. Генерация кода — JSX превращается в `React.createElement`. Статический анализ — правила
      ESLint обходят узлы, например ищут вызовы `console.log`. Оптимизация — бандлеры и Terser по AST делают tree
      shaking и минификацию. Инструменты разработки — TypeScript Language Service для автодополнения, рефакторинга и
      поиска ссылок.

      AST — фундамент всех современных JS-инструментов: от Babel и ESLint до TypeScript и Webpack.
    points:
      - Дерево конструкций кода
      - Babel, ESLint, Prettier, TypeScript, бандлеры
      - JSX → `createElement`, tree shaking

  - id: open-js-048
    topic: JavaScript
    level: middle
    question: |
      Что такое `requestAnimationFrame` и как он связан с event loop?
    answer: |
      `requestAnimationFrame` — метод, который планирует выполнение функции перед следующей перерисовкой экрана
      (обычно 60 раз в секунду, в зависимости от дисплея). Он нужен для плавных анимаций: синхронизирован с частотой
      обновления и не делает лишних вычислений. Для анимации функция вызывает `requestAnimationFrame` сама себя на
      каждом кадре. Остановить — `cancelAnimationFrame` с id, который вернул вызов.

      Связь с event loop. rAF не кладёт задачу ни в очередь микрозадач (как `Promise.then`), ни в очередь макрозадач
      (как `setTimeout`). Его колбэки выполняются на шаге отрисовки: браузер берёт одну макрозадачу, выполняет все
      микрозадачи и, если пора рисовать кадр, вызывает колбэки rAF, считает стили и раскладку и рисует. Отрисовка
      бывает не после каждой задачи, а примерно раз в кадр. Если браузер занят тяжёлыми вычислениями, кадры
      пропускаются. В фоновой вкладке rAF засыпает.
    points:
      - Колбэк перед следующей отрисовкой
      - Не макро- и не микрозадача — шаг рендеринга
      - Задача → микрозадачи → (иногда) отрисовка
      - '`cancelAnimationFrame`, засыпает в фоне'

  - id: open-js-049
    topic: JavaScript
    level: middle
    question: |
      Что такое strict mode?
    answer: |
      Строгий режим — инструмент для выявления потенциальных проблем, который делает код безопаснее и
      предсказуемее. Включается строкой `'use strict'`, а в классах и ES-модулях действует всегда.

      Что меняет. Запрещает неявное создание глобальных переменных (присваивание необъявленной — ReferenceError).
      Запрещает дублирование параметров функции и `delete` переменных. Запрещает зарезервированные слова в качестве
      имён и `with`. Если вызвать функцию без контекста, `this` будет `undefined`, а не `window`. Запись в свойство
      только для чтения, добавление свойства в нерасширяемый объект и запись свойства в примитив бросают ошибку, а не
      проходят молча.
    points:
      - Нет неявных глобальных переменных
      - '`this` без контекста — `undefined`'
      - Тихие неудачи становятся ошибками
      - В классах и модулях — всегда

  - id: open-js-050
    topic: JavaScript
    level: middle
    question: |
      Что такое всплытие и погружение события?
    answer: |
      В DOM событие распространяется в три фазы, которые определяют порядок вызова обработчиков.

      Сначала погружение (capturing phase) — событие движется сверху вниз, от корня (`window`, `document`) к целевому
      элементу. Затем фаза цели (target phase) — событие достигает целевого элемента. Затем всплытие (bubbling phase) —
      событие движется снизу вверх, от целевого элемента к корню.

      `element.addEventListener('click', handler, true)` — обработчик сработает на фазе погружения.
      `element.addEventListener('click', handler, false)` — на фазе всплытия, это по умолчанию. Остановить
      распространение — `event.stopPropagation()`. Некоторые события не всплывают, например `focus`.
    points:
      - Погружение → цель → всплытие
      - '`true` третьим аргументом — погружение'
      - По умолчанию — всплытие
      - '`stopPropagation`'

  - id: open-js-051
    topic: JavaScript
    level: middle
    question: |
      Что такое замыкание?
    code: |
      function outerFunction() {
        var outerVar = 'Я внешняя переменная';

        function innerFunction() {
          console.log(outerVar); // Я внешняя переменная
        }

        return innerFunction;
      }

      var myInnerFunction = outerFunction();
      myInnerFunction();
    codeLang: js
    answer: |
      Замыкание — комбинация функции и её лексического окружения. Замыкания — это функции, которые запоминают
      переменные из своей лексической области и имеют к ним доступ даже после того, как внешняя функция завершилась.

      В примере `outerFunction` уже отработала, но `innerFunction` всё ещё видит `outerVar`: функция хранит ссылку на
      окружение, в котором создана, и это окружение не удаляется, пока на него ссылаются.

      На практике замыкания — это обработчики событий и колбэки, фабрики функций, приватные данные, `debounce`,
      мемоизация. Ловушки — утечки памяти и «устаревшее» значение, например `var` в цикле с таймерами.
    points:
      - Функция + лексическое окружение
      - Помнит переменные после завершения внешней функции
      - Фабрики, приватные данные, debounce
      - Ловушки — утечки и устаревшие значения

  - id: open-js-052
    topic: JavaScript
    level: middle
    question: |
      Что такое оператор `new` и как он работает?
    answer: |
      `const obj = new ConstructorFunction(args)` делает четыре шага. Создаётся новый пустой объект. Его прототипом
      становится `ConstructorFunction.prototype`. Вызывается конструктор с `this`, указывающим на созданный объект, и с
      переданными аргументами. Если конструктор явно вернул объект, результатом `new` будет этот объект, иначе —
      созданный на первом шаге.

      Если вызвать конструктор без `new` (`const bob = Person('Bob')`), `this` внутри будет глобальным объектом (в
      строгом режиме — `undefined`, и запись свойства упадёт), а `bob` будет `undefined`. Это ведёт к ошибкам и
      побочным эффектам. Класс без `new` вызвать нельзя вовсе.
    code: |
      function myNew(constructor, ...args) {
        const obj = {};                                      // 1. новый объект
        Object.setPrototypeOf(obj, constructor.prototype);  // 2. прототип
        const result = constructor.apply(obj, args);         // 3. вызов с this = obj
        return (typeof result === 'object' && result !== null) || typeof result === 'function' ? result : obj; // 4
      }
    codeLang: js
    points:
      - Новый объект
      - Прототип — `Constructor.prototype`
      - Вызов конструктора с `this` = объект
      - Возврат объекта или того, что вернул конструктор

  - id: open-js-053
    topic: JavaScript
    level: middle
    question: |
      Что такое хвостовая рекурсия?
    answer: |
      Это частный вид рекурсии, при котором функция заканчивается вызовом самой себя без дополнительных операций.
      Промежуточный результат передаётся аргументом-аккумулятором. В языках с оптимизацией хвостовых вызовов это
      позволяет не хранить цепочку кадров и экономит память — стек не растёт.

      Обычная рекурсия `n + sum(n - 1)` должна дождаться результата вложенного вызова, поэтому `sum(100000)` падает
      с «Maximum call stack size exceeded». Хвостовая — `sum(n - 1, s + n)`.

      Важно: в JS оптимизация хвостовых вызовов есть в стандарте ES2015, но реализована только в Safari. В Chrome и
      Node.js хвостовой вариант упадёт так же, поэтому глубокую рекурсию переписывают в цикл.
    code: |
      // Обычная
      function sum(n) {
        return n === 0 ? 0 : n + sum(n - 1);
      }

      // Хвостовая
      function sumTail(n, s = 0) {
        return n === 0 ? s : sumTail(n - 1, s + n);
      }
    codeLang: js
    points:
      - Последнее действие — вызов себя
      - Результат копится в аргументе
      - В V8 оптимизации нет — стек всё равно растёт
      - Глубокую рекурсию — в цикл

  - id: open-js-054
    topic: JavaScript
    level: middle
    question: |
      Что такое чистая функция?
    answer: |
      Чистая функция не имеет побочных эффектов и при одних и тех же аргументах всегда возвращает один и тот же
      результат. Пример — `slice` и `splice`: `slice` возвращает новый массив и ничего не меняет, а `splice` мутирует
      исходный.

      Побочные эффекты — изменение внешних данных и аргументов, запросы в сеть, вывод в консоль, чтение времени и
      случайных чисел. Чистые функции легко тестировать и кэшировать. В React компоненты и редьюсеры должны быть
      чистыми.
    points:
      - Нет побочных эффектов
      - Одинаковый вход — одинаковый выход
      - '`slice` чистый, `splice` нет'

  - id: open-js-055
    topic: JavaScript
    level: middle
    question: |
      Расскажи про экосистему JavaScript: каким языком он является и из каких частей она состоит?
    answer: |
      Изначально JS был чисто интерпретируемым, но со временем движки перешли на JIT-компиляцию. JIT — часть кода
      после анализа преобразуется в машинный код прямо во время выполнения, а интерпретация выполняет код как есть,
      по шагам.

      Основные части. ECMAScript — набор правил о том, как писать код и как он должен себя вести; стандарт языка.
      Движок — превращает наш код в машинный: V8, SpiderMonkey. Среда выполнения (runtime) — окружение, где
      выполняется код: браузер, Node.js, Deno, Bun. Связующее звено между движком и средой — event loop: он работает,
      только когда движок и среда работают вместе.

      Что происходит с кодом до интерпретатора: код разбивается на лексемы (токены), по ним строится AST, и уже его
      получает интерпретатор. В V8 основные части — парсер, интерпретатор Ignition, JIT-компилятор TurboFan, сборщик
      мусора и куча.

      Среда выполнения — это API (DOM в браузере, `fs` в Node) и глобальные объекты (`window` и `global`). Браузер и
      Node отличаются API, реализацией асинхронности (в браузере event loop и Web API, в Node event loop на libuv) и
      событиями (DOM-события против `EventEmitter`).

      Вокруг — экосистема: пакетные менеджеры (npm, yarn, pnpm, Bun), сборщики и транспиляторы (Webpack, Vite,
      esbuild, SWC, Babel, Rollup), фреймворки (React, Vue, Angular, Svelte; Express, NestJS, Fastify; Next.js, Nuxt,
      Remix, Astro; React Native, Ionic, Capacitor), инструменты качества (TypeScript, ESLint, Prettier, Jest,
      Vitest, Playwright, Cypress, Storybook), мониторинг (Sentry, Datadog), хостинг (Vercel, Netlify, AWS,
      Cloudflare).
    points:
      - JIT вместо чистой интерпретации
      - ECMAScript, движок, среда выполнения, event loop
      - Токены → AST → интерпретатор → JIT
      - V8 — Ignition, TurboFan, GC
      - Браузер и Node — разные API и асинхронность

  - id: open-js-056
    topic: JavaScript
    level: middle
    question: |
      В каком порядке выведутся числа? Объясни почему.
    code: |
      function timeouts() {
        setTimeout(() => console.log('1'), 0);
        console.log('2');

        new Promise((resolve, reject) => {
          console.log('3');
          setTimeout(() => {
            console.log('4');
            resolve('5');
            reject('6');
            console.log('7');
          });
        })
          .finally(() => {
            console.log('8');
            return '9';
          })
          .then(console.log)
          .catch(console.log)
          .then(() => console.log('10'));

        console.log('11');
        setTimeout(() => console.log('12'), 0);
      }

      timeouts();
    codeLang: js
    answer: |
      Ответ: `2 3 11 1 4 7 8 5 10 12`.

      Синхронно: `2`, затем `3` — тело `new Promise` выполняется сразу, затем `11`. Таймеры встают в очередь в
      порядке постановки: «1», внутренний таймер промиса, «12».

      Первый таймер — `1`. Второй — внутренний: `4`, потом `resolve('5')`; `reject('6')` уже ничего не делает —
      промис меняет состояние один раз; `7` выводится синхронно в том же колбэке. После этой макрозадачи выполняются
      все микрозадачи: `finally` — `8`, его `return '9'` игнорируется, и дальше идёт `'5'`, которое печатает
      `then(console.log)`; `catch` пропускается; последний `then` — `10`. И последним — таймер `12`.
    points:
      - Синхронный код и тело промиса — первыми
      - Таймеры по одному, после каждого — все микрозадачи
      - Промис меняет состояние один раз
      - '`finally` не меняет значение'

  - id: open-js-057
    topic: JavaScript
    level: middle
    question: |
      Напиши простой EventEmitter с методами `on`, `off` и `emit`.
    code: |
      class EventEmitter {
        constructor() {
          this.events = {};
        }

        on(eventName, callback) {
          if (!this.events[eventName]) {
            this.events[eventName] = [];
          }
          this.events[eventName].push(callback);
          return this;
        }

        off(eventName, callback) {
          if (this.events[eventName]) {
            this.events[eventName] = this.events[eventName].filter((cb) => cb !== callback);
          }
          return this;
        }

        emit(eventName, data) {
          if (this.events[eventName]) {
            this.events[eventName].forEach((callback) => callback(data));
          }
          return this;
        }
      }

      const cb = () => null;
      new EventEmitter().on('test', cb).off('test', cb);
    codeLang: js
    answer: |
      Хранилище событий — объект, где ключ — имя события, а значение — массив подписчиков.

      `on` добавляет колбэк в массив события, создавая массив при первой подписке. `off` убирает конкретный колбэк
      фильтром — поэтому отписаться можно только той же ссылкой на функцию, что подписывали. `emit` вызывает всех
      подписчиков события с переданными данными.

      Каждый метод возвращает `this`, чтобы вызовы можно было собирать в цепочку: `emitter.on(...).off(...)`. Можно
      добавить `once` — подписку, которая снимает себя после первого вызова.
    points:
      - Словарь «событие → массив колбэков»
      - '`off` — по той же ссылке на функцию'
      - '`return this` для цепочки'
      - Можно добавить `once`

  - id: open-js-058
    topic: JavaScript
    level: middle
    question: |
      Как построить дерево из плоского массива, где у каждого элемента указан родитель?
    code: |
      const flatList = [
        { title: 'Root', parent: null },
        { title: 'Child1', parent: 'Root' },
        { title: 'Child2', parent: 'Root' },
        { title: 'Grandchild1', parent: 'Child1' },
        { title: 'Grandchild2', parent: 'Child1' },
        { title: 'Child3', parent: 'Root' },
        { title: 'Grandchild3', parent: 'Child3' },
      ];

      const createCategoryTree = (arr) => {
        const obj = {};

        arr.forEach((item) => {
          obj[item.title] = item;
        });

        arr.forEach((item) => {
          if (obj[item.parent]) {
            (obj[item.parent].children ??= []).push(item);
          }
        });

        return Object.values(obj).filter((value) => value.parent === null);
      };
    codeLang: js
    answer: |
      В два прохода за `O(n)` — если детей дописывать через `push`; копирование `[...children, item]` на каждом шаге дало бы квадратичную сложность для родителя с множеством детей. Первый проход строит словарь: ключ — `title`, значение — сам элемент. Второй проход для
      каждого элемента находит родителя в словаре и дописывает элемент в его `children`. В конце возвращаем только
      корни — элементы с `parent === null`; всё остальное уже висит внутри них.

      Без словаря пришлось бы для каждого элемента искать родителя перебором — `O(n²)`. Нюанс: решение мутирует
      исходные объекты (дописывает им `children`); если это нежелательно, в первом проходе кладут в словарь копии.
    points:
      - Словарь по ключу — первый проход
      - Привязка к родителю — второй проход
      - Корни — `parent === null`
      - '`O(n)` вместо `O(n²)`, мутация исходных объектов'

  - id: open-js-059
    topic: JavaScript
    level: middle
    question: |
      Что такое debounce? Напиши функцию `debounce` и хук `useDebounce`.
    code: |
      function debounce(func, delay) {
        let timeoutId;
        return function (...args) {
          clearTimeout(timeoutId);
          timeoutId = setTimeout(() => func.apply(this, args), delay);
        };
      }

      function useDebounce(value, delay) {
        const [debouncedValue, setDebouncedValue] = useState(value);

        useEffect(() => {
          const handler = setTimeout(() => setDebouncedValue(value), delay);
          return () => clearTimeout(handler);
        }, [value, delay]);

        return debouncedValue;
      }
    codeLang: jsx
    answer: |
      Debounce откладывает вызов функции, пока вызовы не прекратятся на `delay` миллисекунд, и выполняет только
      последний. Каждый новый вызов сбрасывает таймер. Применение — поиск по мере ввода, сохранение черновика,
      обработка `resize`.

      Функция `debounce` хранит id таймера в замыкании: при вызове очищает старый таймер и ставит новый. Обёртку
      лучше писать обычной функцией, а не стрелочной: тогда `this` придёт из вызова и передастся через `apply`.

      Хук `useDebounce` возвращает значение с задержкой: в `useEffect` ставится таймер, который обновит состояние, а
      очистка эффекта снимает таймер, если `value` изменилось раньше.
    points:
      - Выполняется последний вызов после паузы
      - Таймер в замыкании, каждый вызов сбрасывает
      - Обычная функция-обёртка, чтобы не потерять `this`
      - '`useDebounce` — таймер в эффекте с очисткой'

  - id: open-js-060
    topic: JavaScript
    level: middle
    question: |
      Как превратить вложенный объект в плоский с ключами-путями через точку?
    code: |
      const tree = {
        a: { b: 'one', c: { d: 'two', e: ['three?'] } },
        f: { g: 'four' },
        m: 'eight',
      };

      // Ожидаемый результат:
      // { 'a.b': 'one', 'a.c.d': 'two', 'a.c.e': ['three?'], 'f.g': 'four', 'm': 'eight' }
    codeLang: js
    answer: |
      Рекурсивный обход с префиксом. Функция принимает объект, текущий префикс и объект-результат. Для каждой пары
      `[key, value]` из `Object.entries` собираем путь: `prefix ? prefix + '.' + key : key`. Если значение — обычный
      объект (не `null` и не массив), рекурсивно спускаемся в него с новым путём. Иначе записываем в результат
      `result[path] = value`.

      Массивы считаем листьями, поэтому `['three?']` остаётся массивом. Тот же обход можно сделать без рекурсии —
      стеком пар «объект — префикс», это защищает от переполнения стека на очень глубоких объектах.
    points:
      - Рекурсия с префиксом пути
      - Объект — спускаемся, остальное — лист
      - Массив — лист
      - Можно стеком вместо рекурсии

  # ===================== TypeScript =====================
  - id: open-ts-001
    topic: TypeScript
    level: middle
    question: |
      Что такое `infer` и где он используется?
    answer: |
      `infer` — ключевое слово для автоматического вывода типа из другого типа. Оно позволяет «достать» тип из сложной
      структуры — массива, функции, промиса — без явного указания. Работает только внутри условных типов.

      Синтаксис: `T extends SomePattern<infer U> ? U : never` — если `T` подходит под шаблон, то `U` — выведенный тип.
      Например, `type ArrayElement<T> = T extends (infer U)[] ? U : never`: для `string[]` получится `string`.

      Популярный кейс — вытащить параметр функции или возвращаемое значение. Так устроены встроенные `ReturnType`,
      `Parameters`, `Awaited`.
    code: |
      type ArrayElement<T> = T extends (infer U)[] ? U : never;
      type Element = ArrayElement<string[]>; // string

      type FirstArg<T> = T extends (first: infer A, ...rest: any[]) => any ? A : never;
      type Id = FirstArg<(id: number) => void>; // number
    codeLang: ts
    points:
      - Вывод типа по шаблону
      - Только внутри условного типа
      - '`ReturnType`, `Parameters`, `Awaited` — на `infer`'

  - id: open-ts-002
    topic: TypeScript
    level: middle
    question: |
      Что такое `satisfies` и чем он отличается от аннотации типа?
    answer: |
      `satisfies` — оператор из TypeScript 4.9 (ноябрь 2022). Он проверяет, что значение соответствует типу, но не
      меняет и не расширяет тип самого значения. Если не соответствует — ошибка компиляции.

      Разница с аннотацией: `const obj: Type = …` делает переменную типом `Type`, и подробности теряются. `const obj =
      … satisfies Type` проверяет форму, но оставляет выведенный, более точный тип. Например, в конфиге
      `{ red: [255, 0, 0], green: '#00ff00' } satisfies Record<string, string | number[]>` TypeScript помнит, что
      `green` — строка, и разрешит `colors.green.toUpperCase()`. С аннотацией там был бы `string | number[]`.
    points:
      - Проверка без изменения типа
      - Сохраняет выведенный тип
      - Удобно для конфигов и словарей

  - id: open-ts-003
    topic: TypeScript
    level: middle
    question: |
      Что такое приведение типов (type casting) в TypeScript?
    answer: |
      При работе с типами бывают случаи, когда нужно переопределить тип переменной — например, библиотека даёт неверные
      типы или мы знаем о значении больше, чем компилятор. Приведение — процесс переопределения типа: `x as string`.

      Важно: это указание компилятору, а не преобразование. В рантайме значение не меняется, `as` просто стирается при
      сборке. Компилятор разрешает `as` только между пересекающимися типами; `as unknown as T` обходит и это — явный
      знак, что ответственность на разработчике.
    code: |
      let x: unknown = 'hello';
      console.log((x as string).length);
    codeLang: ts
    points:
      - '`as` — указание компилятору'
      - В рантайме ничего не меняется
      - '`as unknown as T` — обход проверки'

  - id: open-ts-004
    topic: TypeScript
    level: middle
    question: |
      Зачем нужны `?` и `!` в TypeScript?
    answer: |
      Вопросительный знак помечает аргумент функции или свойство как необязательное: `function f(x?: number)` — тип
      `x` становится `number | undefined`.

      Восклицательный знак (non-null assertion) берёт участок кода под собственный контроль: говорит компилятору, что
      значение точно не `null` и не `undefined`. Помогает избежать ошибки «Возможно, значение равно undefined». Но
      проверки в рантайме нет: если мы ошиблись, будет TypeError. Безопаснее сузить тип проверкой или `?.`.
    code: |
      function liveDangerously(x?: number | null) {
        console.log(x!.toFixed()); // компилятор молчит, но liveDangerously() упадёт
      }
    codeLang: ts
    points:
      - '`?` — необязательный параметр, добавляет `undefined`'
      - '`!` — «точно не null», только для компилятора'
      - Ошибка с `!` всплывёт в рантайме

  - id: open-ts-005
    topic: TypeScript
    level: middle
    question: |
      Что такое ковариантность и контравариантность?
    answer: |
      Эти термины описывают, как совместимость сложных типов (объектов, функций) зависит от совместимости их базовых
      типов. Пусть `Dog extends Animal`: собаку можно записать туда, где ждут животное.

      Ковариантность — прямое направление: если `Dog extends Animal`, то и `Complex<Dog>` подходит как
      `Complex<Animal>`. Работает в свойствах и возвращаемых значениях. `Producer<Dog>` можно присвоить в
      `Producer<Animal>`: кто вызовет `produce()`, ждёт животное и получит собаку — ничего не сломается.

      Контравариантность — обратное направление: `Complex<Animal>` подходит как `Complex<Dog>`. Работает в аргументах
      функций при включённом `strictFunctionTypes`. `Consumer<Animal>` можно присвоить в `Consumer<Dog>`: функция,
      которая умеет любых животных, справится и с собакой. Наоборот нельзя: вызывающий передаст кошку, а внутри
      `dogConsumer` вызовет `bark()` — ошибка в рантайме.

      Итог: выходные данные (read-only, возвращаемые значения) ковариантны — требования можно сужать; входные
      (аргументы) контравариантны — требования можно только расширять. Бивариантность — одновременно и то и другое.
      Параметры методов и конструкторов в TypeScript бивариантны всегда, по легаси-причинам — даже со
      `strictFunctionTypes`. Строгую контравариантность флаг включает для всех функциональных типов — колбэков, переменных и свойств-функций, — кроме методов и конструкторов.
    points:
      - Ковариантность — направление сохраняется, выходы
      - Контравариантность — разворачивается, аргументы
      - '`strictFunctionTypes` — для свойств-функций'
      - Методы бивариантны всегда

  - id: open-ts-006
    topic: TypeScript
    level: middle
    question: |
      Какие минусы у TypeScript?
    answer: |
      Основные недостатки. Замедляет разработку — нужно писать типы и интерфейсы. Сложность обучения — два языка
      вместо одного (JS и система типов). Сложная конфигурация — `tsconfig.json` с десятками опций. Медленная
      компиляция в больших проектах. Ложное чувство безопасности — проверки только при компиляции, не в рантайме.
      Каскад правок — изменение типа тянет правки во многих местах (зато компилятор все их показывает). Дороже разработка — нужны люди, знающие
      TS. Проблемы с библиотеками — нет типов или они устарели. Сложности с динамическими данными — ответы API, JSON.
      И никакой выгоды по производительности: в браузере всё равно JavaScript.

      Когда TS больше мешает, чем помогает: маленькие проекты (скрипты, лендинги), быстрые прототипы, команда не
      знает TS, много динамических данных, жёсткие дедлайны.

      Альтернативы: JSDoc — документация и подсказки в IDE; PropTypes для React (в React 19 их проверки удалены); чистый JS с хорошими тестами;
      постепенная типизация — TS там, где действительно нужно.
    points:
      - Время на типы и обучение
      - Проверки только при сборке
      - Сложный конфиг, медленная сборка, типы библиотек
      - Мешает в прототипах и маленьких проектах
      - JSDoc и постепенная типизация как альтернатива

  - id: open-ts-007
    topic: TypeScript
    level: middle
    question: |
      Что такое модификаторы в mapped types (`readonly`, `?`, `-readonly`, `-?`)?
    answer: |
      Модификаторы сопоставления — инструмент для трансформации типов в mapped types (`[P in keyof T]`). Они позволяют
      добавлять или удалять `readonly` и необязательность `?` у всех свойств сразу.

      `readonly` делает свойства только для чтения — так устроен `Readonly<T>`. `?` делает свойства необязательными —
      `Partial<T>`. `-?` удаляет необязательность, свойства становятся обязательными — `Required<T>`. `-readonly`
      удаляет `readonly` — самописный `Mutable<T>`. Знак `+` — явное добавление, по умолчанию он и подразумевается.
    code: |
      type Mutable<T> = {
        -readonly [P in keyof T]: T[P];
      };

      type Required<T> = {
        [P in keyof T]-?: T[P];
      };
    codeLang: ts
    points:
      - Работают в mapped types
      - '`readonly` и `?` — добавить'
      - '`-readonly` и `-?` — убрать'
      - '`Readonly`, `Partial`, `Required` устроены так'

  - id: open-ts-008
    topic: TypeScript
    level: middle
    question: |
      Почему критикуют enum? Какие есть альтернативы?
    answer: |
      Enum — способ определить набор именованных констант, «список вариантов» для переменной.

      Критика. Числовые enum генерируют дополнительный JS-код для обратного маппинга (`Enum[Enum.Key]`), это
      увеличивает бандл. Enum сложно выкинуть tree shaking'ом, в отличие от union types. Многие случаи проще решаются
      union types — `type Status = 'active' | 'pending' | 'rejected'` — они легче и не дают кода. Типобезопасность
      неоднозначна: в числовой enum можно присвоить любое `number` из переменной (литерал вне значений с TS 5.0 уже
      ошибка). И с enum трудно мигрировать, если они широко разошлись по проекту.

      Альтернативы: union types — для простых наборов; объект `as const` — когда нужны значения в рантайме; `const
      enum` — enum без runtime-кода: компилятор встраивает значения прямо в места использования. Но у `const enum`
      свои ограничения: нет обратного маппинга; в отладке видны «магические числа»; при пофайловой транспиляции
      (Babel, esbuild, SWC, `isolatedModules`, как в Next.js) локальный `const enum` превращается в обычный объект, а
      ambient `declare const enum` из `.d.ts` библиотеки ломается — объекта в рантайме нет. Флаг `preserveConstEnums`
      оставляет объект в выводе. А в режиме «стирания типов» (TS в Node.js без сборки, флаг `erasableSyntaxOnly`)
      enum не поддерживается вовсе — он даёт код в рантайме.
    points:
      - Лишний код и обратный маппинг
      - Хуже tree shaking
      - Union types и `as const` вместо enum
      - '`const enum` инлайнится, но ломается при `isolatedModules`'

  - id: open-ts-009
    topic: TypeScript
    level: middle
    question: |
      Какие утилитные типы TypeScript знаешь?
    answer: |
      Для свойств объекта: `Partial<T>` — все необязательные; `Required<T>` — все обязательные; `Readonly<T>` — все
      только для чтения; `Record<Keys, Type>` — объект с ключами `Keys` и значениями `Type`; `Pick<T, K>` — только
      указанные ключи; `Omit<T, K>` — все, кроме указанных.

      Для объединений: `Exclude<Union, Excluded>` — убрать члены (`Exclude<'a' | 'b' | 'c', 'a' | 'b'>` — `'c'`);
      `Extract<Type, Union>` — оставить общие; `NonNullable<T>` — убрать `null` и `undefined`.

      Для функций и классов: `Parameters<F>` — кортеж параметров; `ConstructorParameters<C>` — параметры
      конструктора; `ReturnType<F>` — возвращаемый тип; `InstanceType<C>` — тип экземпляра;
      `ThisParameterType<F>` — тип `this` функции; `OmitThisParameter<F>` — функция без `this`; `ThisType<T>` —
      маркер, который задаёт `this` внутри методов объектного литерала. `Awaited<T>` — тип после `await`, разворачивает
      промисы рекурсивно.

      Для строк: `Uppercase`, `Lowercase`, `Capitalize`, `Uncapitalize`. А вот `Nullable<T>` и `Optional<T>` во
      встроенных нет — их пишут сами: `T | null` и `T | undefined`.
    points:
      - '`Partial`, `Required`, `Readonly`, `Record`, `Pick`, `Omit`'
      - '`Exclude`, `Extract`, `NonNullable`'
      - '`Parameters`, `ReturnType`, `InstanceType`, `Awaited`'
      - Строковые — `Uppercase`, `Capitalize`

  - id: open-ts-010
    topic: TypeScript
    level: middle
    question: |
      Что такое утиная (структурная) типизация?
    answer: |
      Это приём, при котором мы обрабатываем разные типы данных одним обработчиком, если у них есть нужные свойства.
      «Если выглядит как утка и крякает как утка — значит, утка». Например, массив и строку можно одинаково
      обрабатывать по индексу и `length`.

      TypeScript использует структурную типизацию: совместимость определяется набором свойств, а не именем класса.
      `Pigeon` и `Owl` с одинаковым полем `sound` взаимозаменяемы. `Penguin` с лишним методом `swim` можно записать в
      `Pigeon`. А `Pigeon` в `Penguin` нельзя — у него нет `swim`, это ошибка компиляции.
    code: |
      class Pigeon { sound = 'coos'; }
      class Owl { sound = 'hoots'; }
      class Penguin { sound = 'peeps'; swim() {} }

      let pigeon: Pigeon = new Owl();      // Works
      let pigeon2: Pigeon = new Penguin(); // Works
      let penguin: Penguin = new Pigeon(); // Compile time error
    codeLang: ts
    points:
      - Совместимость по форме, а не по имени
      - Лишние свойства не мешают
      - Не хватает свойства — ошибка

  - id: open-ts-011
    topic: TypeScript
    level: middle
    question: |
      Чем отличаются `interface` и `type`? Что такое merge интерфейсов?
    answer: |
      Оба описывают форму объекта, и класс может реализовать (`implements`) любой из них.

      `interface` расширяется через `extends` и умеет декларативное слияние: можно несколько раз объявить один и тот же
      интерфейс, докидывая новые свойства, и получится один. Так дополняют чужие типы — `Window`, `HTMLAttributes`.

      `type` — псевдоним для любого типа: можно назвать примитив (`type OrderNumber = string`), объединить
      (`type Animal = Dog | Cat`), пересечь (`type Order = OrderIdentifier & OrderStatus` — сюда можно сложить и
      интерфейсы), описать кортеж, условный или mapped тип. Повторно объявить `type` с тем же именем нельзя.
    code: |
      interface User {
        name: string;
      }

      interface User {
        age: number;
      }

      // Теперь User включает оба свойства: name и age
      const user: User = { name: 'Alice', age: 30 };
    codeLang: ts
    points:
      - Оба — для объектов и `implements`
      - Слияние деклараций — только `interface`
      - Union, примитивы, кортежи — только `type`
      - '`extends` у interface, `&` у type'

  - id: open-ts-012
    topic: TypeScript
    level: middle
    question: |
      Что такое `any`, `unknown`, `void`, `never`? Почему `unknown` лучше `any`? Чем `never` отличается от `void`?
    answer: |
      `void` указывается как возвращаемый тип функций, которые ничего не возвращают. `never` — когда функция
      гарантированно не возвращает управление: внутри бесконечный цикл, завершение процесса или выброс исключения.
      Ещё `never` — тип без значений: он остаётся, когда все варианты объединения разобраны, и на этом строят
      проверку полноты `switch`.

      `any` отключает проверку типов: с ним можно делать что угодно, и он «заражает» всё вокруг. `unknown` запрещает
      любые операции без предварительной проверки типа (`typeof`, `instanceof`, type guard). Поэтому для данных
      снаружи — `JSON.parse`, ответа API — лучше `unknown`: компилятор заставит проверить, прежде чем использовать.
    points:
      - '`void` — ничего не возвращает'
      - '`never` — не возвращает управление никогда'
      - '`any` — без проверок'
      - '`unknown` — сначала проверь, потом используй'

  - id: open-ts-013
    topic: TypeScript
    level: middle
    question: |
      Что такое declaration-файлы (`.d.ts`) и зачем они нужны?
    answer: |
      Declaration — файл `.d.ts`, который описывает только типы, без реализации. Это как «интерфейс» для
      JavaScript-кода и мостик между JS и TS. В JavaScript такие файлы не компилируются.

      Виды: декларации для библиотек (`@types/lodash`, `jquery.d.ts`); глобальные декларации (`declare const VERSION:
      string`, `declare global { interface Window { myApp: … } }`); декларации модулей (`declare module 'my-module'`)
      и ресурсов (`declare module '*.svg'`, `'*.module.css'`, `'*.png'`) — чтобы импорт картинок и CSS-модулей имел
      тип.

      Создаются автоматически при компиляции (`declaration: true`, `declarationMap`, `declarationDir`), вручную для
      JS-библиотек и сообществом (`@types/xxx` в npm). Применяют ещё для типизации `process.env` и нестандартных
      атрибутов JSX через расширение модуля `react` (атрибуты с дефисом вроде `data-testid` TS пропускает и так).

      Риски: устаревшие декларации (библиотека обновилась, `@types` — нет), неправильные (в декларации `User`, а
      функция возвращает `Promise`), отсутствующие — тогда пишут свои, используют `any` или отправляют PR.
    points:
      - Только типы, без реализации, не попадают в JS
      - Библиотеки, глобальные объекты, модули и ресурсы
      - Генерируются (`declaration`), пишутся вручную, `@types`
      - Риск — устаревшие и неверные декларации

  - id: open-ts-014
    topic: TypeScript
    level: middle
    question: |
      Что такое type guard?
    answer: |
      Type guard — функция, которая проверяет тип в рантайме и сообщает результат компилятору. Её возвращаемый тип —
      предикат `person is Woman`. Если функция вернула `true`, в этой ветке TypeScript сужает тип до `Woman`, в
      `else` — до остального.

      Встроенные способы сужения — `typeof`, `instanceof`, оператор `in`, сравнение с литералом. Свой type guard
      нужен для сложных проверок. Важно: TypeScript верит функции на слово — если проверка написана неверно,
      компилятор этого не заметит.
    code: |
      interface Man { age: number; pantsSize: number | undefined; }
      interface Woman { age: number; braSize: number; }

      function isWoman(person: Man | Woman): person is Woman {
        return 'braSize' in person;
      }

      function getSize(person: Man | Woman): number {
        if (isWoman(person)) {
          return person.braSize;
        }
        return person.pantsSize ?? 0;
      }
    codeLang: ts
    points:
      - Возвращаемый тип — `x is T`
      - Сужает тип в ветках
      - '`typeof`, `instanceof`, `in` — встроенные'
      - Компилятор верит проверке на слово

  - id: open-ts-015
    topic: TypeScript
    level: middle
    question: |
      Что такое дженерики и где они используются?
    answer: |
      Дженерики делают код пригодным для повторного использования. Они позволяют написать универсальную функцию, класс
      или тип, которые работают с любым типом данных и при этом сохраняют связь между входом и выходом:
      `function identity<T>(value: T): T`.

      Ограничения через `extends` задают, какие типы подходят: `<T extends { length: number }>` примет строку и
      массив, но не число. Используются в функциях-утилитах, классах коллекций, интерфейсах ответов API
      (`ApiResponse<T>`), утилитных типах (`Partial<T>`), в React — `useState<T>`, `useRef<T>`, пропсы компонентов.
    points:
      - Параметр типа — универсальность без потери типов
      - '`extends` — ограничение'
      - Утилиты, коллекции, API, React-хуки

  - id: open-ts-016
    topic: TypeScript
    level: middle
    question: |
      Что такое перегрузка функций?
    answer: |
      Перегрузка (function overloading) — механизм, который позволяет описать одну функцию несколькими сигнатурами.
      Функция может принимать разные комбинации параметров (по типу и количеству) и возвращать разные типы в
      зависимости от вызова. Это делает код типобезопаснее и выразительнее.

      Сначала пишутся сигнатуры перегрузки, затем одна реализация, которая должна покрывать их все. Снаружи видны
      только сигнатуры перегрузки — сигнатура реализации наружу не попадает, даже если она шире.
    code: |
      function greet(name: string): string;
      function greet(name: string, age: number): string;

      function greet(name: string, age?: number): string {
        if (age !== undefined) {
          return `Привет, ${name}, тебе ${age} лет!`;
        }
        return `Привет, ${name}!`;
      }

      greet('Алекс');     // "Привет, Алекс!"
      greet('Алекс', 25); // "Привет, Алекс, тебе 25 лет!"
    codeLang: ts
    points:
      - Несколько сигнатур, одна реализация
      - Реализация покрывает все сигнатуры
      - Снаружи видны только перегрузки

  - id: open-ts-017
    topic: TypeScript
    level: middle
    question: |
      Что такое условные типы, mapped types и template literal types? Приведи пример, где они работают вместе.
    answer: |
      Условные типы (conditional types) работают как тернарный оператор на уровне типов: `T extends U ? X : Y`.
      Часто используются вместе с `infer`, который «выуживает» скрытый тип — тип аргумента функции или значение внутри
      промиса.

      Сопоставляемые типы (mapped types) создают новые типы на основе старых, перебирая ключи: `{ [K in keyof T]: T[K]
      }`. Это `Array.prototype.map` для объектных типов. Модификаторами `+` и `-` можно массово добавлять и убирать
      `readonly` и `?`.

      Шаблонные строковые типы (template literal types) комбинируют строки на уровне типов, как шаблонные строки в JS:
      `` `hello ${World}` ``. Вместе с `Uppercase`, `Lowercase`, `Capitalize` дают огромные возможности для
      типизации строк.

      Пример вместе: генерация типа геттеров для стейта. Mapped type перебирает ключи, через `as` и шаблон имя ключа
      превращается в `getИмя`, `Capitalize` поднимает первую букву, значение — функция, возвращающая `T[K]`. Из `{ id:
      string; age: number }` получится `{ getId: () => string; getAge: () => number }`. Добавив условный тип с
      `infer`, можно разворачивать результат, если в стейте лежат async-функции.
    code: |
      type GenerateGetters<T> = {
        [K in keyof T as `get${Capitalize<K & string>}`]: () => T[K];
      };

      type UnwrapResult<T> = T extends (...args: any[]) => Promise<infer R>
        ? R
        : T extends (...args: any[]) => infer R
          ? R
          : T;
    codeLang: ts
    points:
      - Условные — `extends ? :` и `infer`
      - Mapped — перебор ключей, модификаторы
      - Template literal — строки на уровне типов
      - Вместе — переименование ключей через `as`

  # ===================== React =====================
  - id: open-react-001
    topic: React
    level: middle
    question: |
      Что такое HOC (Higher-Order Component) и когда его использовать?
    answer: |
      HOC — продвинутая техника для повторного использования логики компонентов. Это функция, которая принимает
      компонент и возвращает новый компонент с дополнительной функциональностью.

      Пример: без HOC логика проверки авторизации дублируется в `UserProfile` и `Dashboard`. С HOC пишем
      `withAuth(WrappedComponent)`: внутри общая логика (проверить токен, загрузить пользователя), если не авторизован —
      заглушка, иначе рендерим исходный компонент и прокидываем ему `user`. Дальше `const UserProfile =
      withAuth(...)`.

      Когда использовать: нужно обернуть компонент (модалки, тултипы); работаете с библиотеками (`connect` в Redux,
      `withRouter` из React Router v5); нужен паттерн «провайдер — потребитель» до появления Context API; работаете с классовыми
      компонентами, где хуки недоступны. В остальных случаях логику сейчас чаще выносят в кастомные хуки. `React.memo`
      — тоже HOC.
    code: |
      function withAuth(WrappedComponent) {
        return function (props) {
          const user = useCurrentUser();
          if (!user) return <div>Please login to continue</div>;
          return <WrappedComponent {...props} user={user} />;
        };
      }

      const UserProfile = withAuth(({ user }) => <div>Welcome, {user.name}!</div>);
    codeLang: jsx
    points:
      - Функция «компонент → новый компонент»
      - Переиспользование логики вокруг компонента
      - '`connect`, `withRouter` (v5), `React.memo`'
      - Сейчас чаще кастомные хуки

  - id: open-react-002
    topic: React
    level: middle
    question: |
      Что такое React Fiber?
    answer: |
      React Fiber — архитектура согласования (reconciliation), введённая в React 16 (сентябрь 2017). Она заменила
      старый Stack Reconciler и сделала рендеринг гибким и способным к асинхронной работе. Это не библиотека, а
      внутренний механизм React, который обрабатывает обновления пошагово, не блокируя основной поток.

      Ключевые особенности. Прерываемый рендеринг: работа разбита на небольшие «волокна» (fibers), которые можно
      приостанавливать и возобновлять. Приоритеты: клик или ввод обрабатываются раньше фоновых обновлений. Error
      Boundaries для ошибок в поддеревьях. Основа для Suspense, конкурентного рендеринга и Server Components.

      Как работает. Фаза рендера (reconciliation): React строит новое дерево и сравнивает с предыдущим, выявляя
      изменения, — её можно прервать. Фаза коммита: изменения применяются к реальному DOM синхронно, одним проходом,
      без прерываний — иначе пользователь увидел бы полуобновлённый интерфейс. Работу планирует собственный
      планировщик React, который отдаёт управление браузеру между кусками.
    points:
      - React 16, замена Stack Reconciler
      - Работа разбита на единицы, есть приоритеты
      - Рендер прерываемый, коммит синхронный
      - Основа Suspense и конкурентного рендеринга

  - id: open-react-003
    topic: React
    level: middle
    question: |
      Что такое `React.memo` и какие у него нюансы?
    answer: |
      `React.memo` — HOC, который мемоизирует результат рендеринга компонента. Если пропсы не изменились, React
      использует прошлый результат вместо повторного рендера.

      Главный нюанс — поверхностное сравнение пропсов (shallow equality), по ссылке. Объект `config = { color: 'red'
      }` и функция `onClick = () => …`, созданные в теле родителя, новые на каждом рендере — и мемоизированный ребёнок
      будет перерисовываться всегда. Решение: `useMemo` для объектов и массивов, `useCallback` для функций, примитивы в
      пропсах там, где можно.

      Вторым аргументом можно передать свою функцию сравнения `(prevProps, nextProps) => boolean` — когда важна только
      часть пропсов. `true` значит «пропсы равны, НЕ рендерить», `false` — «разные, рендерить». Это противоположно
      `shouldComponentUpdate`.
    points:
      - Пропускает рендер при равных пропсах
      - Сравнение поверхностное, по ссылке
      - Стабильные ссылки — `useMemo`, `useCallback`
      - Второй аргумент — `true` значит «не рендерить»

  - id: open-react-004
    topic: React
    level: middle
    question: |
      Что такое Suspense и lazy loading в React?
    answer: |
      Lazy loading — отложенная загрузка ресурсов только тогда, когда они нужны. В React — через `React.lazy(() =>
      import('./MyComponent'))`: компонент загружается при первом рендере. Это уменьшает начальный бандл и ускоряет
      загрузку. Полезно для роутов и больших компонентов. Требует code splitting (Webpack, Vite делают его по
      динамическому `import()`).

      Suspense — компонент (с React 16.6), который «ловит» ожидание и показывает fallback-UI — спиннер или скелетон,
      пока асинхронная операция не завершится, а потом переключается на реальный контент. Работает с `lazy`, с
      данными через совместимые библиотеки и фреймворки, с конкурентным рендерингом. Можно вкладывать Suspense для
      разных частей UI.

      Вместе: lazy загружает код, Suspense управляет UI во время ожидания. Типичный пример — `Suspense` вокруг
      `<Routes>` с lazy-страницами. Ограничения: fallback должен быть простым; ошибки загрузки Suspense не ловит —
      нужен Error Boundary.
    code: |
      const Home = lazy(() => import('./Home'));
      const About = lazy(() => import('./About'));

      function App() {
        return (
          <Suspense fallback={<div>Loading page...</div>}>
            <Routes>
              <Route path="/" element={<Home />} />
              <Route path="/about" element={<About />} />
            </Routes>
          </Suspense>
        );
      }
    codeLang: jsx
    points:
      - '`lazy` — загрузка кода компонента по требованию'
      - Suspense — fallback на время ожидания
      - Вместе — code splitting по роутам
      - Ошибки — в Error Boundary

  - id: open-react-005
    topic: React
    level: middle
    question: |
      Зачем нужен `key` и почему нельзя использовать индекс?
    answer: |
      `key` — специальный атрибут элементов списка. Это подсказка для React, которая помогает понять, какие элементы
      изменились, добавились или удалились.

      Индекс плох, когда порядок меняется: при удалении или вставке индексы сдвигаются, ключи «переезжают» к другим
      данным. React перерисует лишнее, а состояние и DOM-узлы (например, введённый текст) останутся у старых ключей —
      то есть окажутся не у тех элементов. Индекс допустим только для статичного списка.

      Смена `key` — это размонтирование и новое монтирование, а не перерисовка. Это мощный механизм: для сброса
      состояния — меняйте ключ, для сохранения — держите ключ стабильным, в списках — уникальные и стабильные ключи из
      данных.
    points:
      - Ключ сопоставляет элементы между рендерами
      - Индекс ломается при вставке, удалении, сортировке
      - Смена ключа — пересоздание компонента
      - Стабильный id из данных

  - id: open-react-006
    topic: React
    level: middle
    question: |
      Для чего нужны порталы?
    answer: |
      Порталы позволяют рендерить дочерние элементы в DOM-узел, который находится вне DOM-иерархии родительского
      компонента: `createPortal(children, document.body)`. Нужны для всплывающих окон, попапов, модалок, тултипов —
      чтобы им не мешали `overflow: hidden` и контексты наложения родителей.

      В дереве React портал остаётся ребёнком своего компонента: работают контекст и состояние, а события всплывают по
      дереву React, а не по DOM.
    points:
      - Рендер в другой DOM-узел
      - Модалки, попапы, тултипы
      - Контекст и всплытие — по дереву React

  - id: open-react-007
    topic: React
    level: middle
    question: |
      Почему React полагается на иммутабельность?
    answer: |
      React использует поверхностное сравнение, чтобы понять, изменилось ли состояние: сравнивает ссылки на объекты, а
      не их содержимое.

      Если мутировать старый объект (`state.name = 'New'`), ссылка останется прежней — React не увидит изменения и не
      запустит перерисовку. Если создать новый объект (`setState({ ...state, name: 'New' })`), появится новая ссылка, и
      React перерисует компонент.

      Плюсы: сравнение ссылок намного быстрее глубокого сравнения всех вложенных свойств, а иммутабельные обновления
      делают поток данных предсказуемым и легче отлаживаемым. Кратко: React «видит» изменение только по новой ссылке.
    points:
      - Сравнение по ссылке
      - Мутация не вызывает рендер
      - Новый объект — новая ссылка — рендер
      - Быстро и предсказуемо

  - id: open-react-008
    topic: React
    level: middle
    question: |
      Как срочно обновить DOM в React? Чем `flushSync` отличается от `forceUpdate`?
    answer: |
      Для мгновенного отражения изменений в DOM — `flushSync`: внутри него React синхронно делает рендер и коммит.
      Например, добавили элемент и сразу хотим к нему прокрутить.

      Перерисовать компонент без изменения данных — `forceUpdate` в классах или искусственный `useReducer` в функциях:
      только рендер, состояние не меняется. Обновить UI при изменении внешних данных — хранить их в `useState` или
      `useReducer`, или подписаться через `useSyncExternalStore`: React реагирует только на своё состояние.
      Синхронизация с нативным API — `flushSync` плюс `useLayoutEffect`, чтобы DOM был готов.

      Коротко: `forceUpdate` — «попросить React перерисовать компонент», `flushSync` — «заставить перерисовать прямо
      сейчас и обновить DOM».
    points:
      - '`flushSync` — синхронный рендер и коммит'
      - '`forceUpdate` — только запрос рендера'
      - Внешние данные — через состояние или `useSyncExternalStore`

  - id: open-react-009
    topic: React
    level: middle
    question: |
      Как происходит рендер в React? Когда рендерится ребёнок?
    answer: |
      React рендерит компоненты сверху вниз — от родителя к детям. А эффекты после рендера, включая
      `useLayoutEffect` до отрисовки, выполняются снизу вверх — от детей к родителю.

      Ребёнок рендерится, если перерисовался родитель (по умолчанию, без оптимизаций — даже с теми же пропсами),
      изменилось его состояние или контекст, на который он подписан. Не рендерится, если обёрнут в `React.memo` и
      пропсы не изменились, если родитель не перерисовывался, или если `shouldComponentUpdate` вернул `false`.

      Редкий случай связи снизу вверх — `useImperativeHandle`: родитель через ref вызывает методы ребёнка, например
      `focus()`, после рендера ребёнка.
    points:
      - Рендер — сверху вниз
      - Эффекты — снизу вверх
      - Ребёнок рендерится вместе с родителем, если не `memo`
      - '`useImperativeHandle` — связь снизу вверх'

  - id: open-react-010
    topic: React
    level: middle
    question: |
      Какие бывают хуки в React?
    answer: |
      Базовые: `useState` — состояние; `useEffect` — побочные эффекты после рендера, с очисткой и зависимостями;
      `useContext` — значение контекста без пропсов.

      Дополнительные: `useReducer` — сложное состояние с логикой обновлений, как в Redux; спасает, когда `useState` с
      вложенным объектом превращается в громоздкие спреды. `useMemo` — мемоизация значения, `useCallback` — мемоизация
      функции; пересчитываются только при изменении зависимостей. `useRef` — ссылка на DOM и изменяемое значение, не
      вызывает рендер. `useImperativeHandle` — настроить, что родитель получит через ref. `useLayoutEffect` — эффект до
      отрисовки, для измерений DOM. `useDebugValue` — подпись кастомного хука в DevTools. `useInsertionEffect` — ещё
      раньше, до изменений DOM: почти единственная задача — вставлять стили CSS-in-JS до того, как layout-эффекты
      начнут читать размеры; не имеет доступа к ref и не обновляет состояние.

      Конкурентные и специальные: `useTransition` — несрочные обновления; `useDeferredValue` — отложенное значение при
      быстром вводе; `useId` — уникальные id, стабильные при SSR; `useSyncExternalStore` — подписка на внешние сторы.
      В React 19 добавились `use`, `useActionState`, `useOptimistic`, `useFormStatus`.
    points:
      - '`useState`, `useEffect`, `useContext`'
      - '`useReducer`, `useMemo`, `useCallback`, `useRef`'
      - '`useLayoutEffect`, `useInsertionEffect`, `useImperativeHandle`'
      - '`useTransition`, `useDeferredValue`, `useId`, `useSyncExternalStore`'

  - id: open-react-011
    topic: React
    level: middle
    question: |
      Когда лучше использовать контекст, а когда стейт-менеджер?
    answer: |
      Context — встроенный механизм передачи данных через дерево без явной передачи пропсов на каждом уровне.

      Используйте Context, когда вы устали от prop drilling — пропс идёт через 5+ компонентов, которым он не нужен:
      тема, язык, текущий пользователь. Когда данные относительно статичны и меняются нечасто. Когда общее состояние не
      слишком сложное. Важный нюанс: при изменении значения React перерисовывает всех потребителей контекста, даже если
      они используют лишь часть объекта. При частых изменениях это бьёт по производительности — тогда контекст
      разделяют.

      Используйте стейт-менеджер, когда состояние очень часто меняется (игра, биржевые данные, сложные формы) — они
      оптимизированы, чтобы перерисовывать только тех, чья часть изменилась. Когда состояние сложное и взаимосвязанное.
      Когда нужны производные данные (Redux с Reselect). Когда нужны побочные эффекты — middleware Redux Thunk, Redux
      Saga или встроенное в Zustand. Когда важны отладка и DevTools.
    points:
      - Context — против prop drilling, для редко меняющихся данных
      - Все потребители перерисовываются при изменении
      - Стейт-менеджер — частые изменения, сложное состояние
      - Селекторы, middleware, DevTools

  - id: open-react-012
    topic: React
    level: middle
    question: |
      Какие методы жизненного цикла есть у классового компонента?
    answer: |
      Монтирование — компонент создаётся и добавляется в DOM: `constructor(props)` — инициализация состояния и
      привязка методов; `static getDerivedStateFromProps(props, state)` — синхронизация state с props, редко;
      `render()` — возвращает JSX; `componentDidMount()` — после рендера, идеально для запросов и подписок.

      Обновление — при изменении props или state: `getDerivedStateFromProps`; `shouldComponentUpdate(nextProps,
      nextState)` — оптимизация, вернуть `true` или `false`; `render()`; `getSnapshotBeforeUpdate(prevProps,
      prevState)` — снимок DOM перед обновлением, например позиции скролла; `componentDidUpdate(prevProps, prevState,
      snapshot)` — эффекты, зависящие от изменений.

      Размонтирование: `componentWillUnmount()` — очистка: отписки, таймеры.

      Обработка ошибок в дочерних компонентах: `static getDerivedStateFromError(error)` — обновить state при ошибке,
      `componentDidCatch(error, info)` — логирование.
    points:
      - Монтирование — constructor, render, componentDidMount
      - Обновление — shouldComponentUpdate, getSnapshotBeforeUpdate, componentDidUpdate
      - Размонтирование — componentWillUnmount
      - Ошибки — getDerivedStateFromError, componentDidCatch

  - id: open-react-013
    topic: React
    level: middle
    question: |
      Расскажи про основные версии React и что в них появилось.
    answer: |
      React 16 (сентябрь 2017) — переход на Fiber: новый алгоритм согласования, прерываемый рендеринг. Error
      Boundaries, порталы; в 16.2 — фрагменты `<></>`; в 16.3 — новый Context API; в 16.6 — `lazy` и Suspense; в 16.8
      (2019) — хуки, состояние и жизненный цикл в функциональных компонентах.

      React 17 (октябрь 2020) — «мостовой» релиз без новых фич для разработчиков. Новый JSX transform — JSX не требует
      `import React`. Обработчики событий вешаются на корень приложения, а не на `document`. Готовил почву для React 18.

      React 18 (март 2022) — конкурентный рендеринг: React может приостанавливать работу ради срочного ввода, основа —
      `startTransition` и `useDeferredValue`. Автоматический батчинг везде, включая промисы и таймеры. Suspense на
      сервере и Streaming SSR. Новые хуки `useId`, `useTransition`, `useDeferredValue`, `useSyncExternalStore`. Strict
      Mode в разработке монтирует компоненты дважды, чтобы ловить побочные эффекты. Автоматической мемоизации в React 18
      нет — это React Compiler, отдельный инструмент.

      React 19 (декабрь 2024) — Server Components стабильны: выполняются только на сервере, на клиент уходит HTML и
      RSC payload, их код не попадает в бандл. Actions для мутаций и форм, хуки `useActionState` (бывший
      `useFormState`), `useOptimistic`, `useFormStatus`, `use`; `ref` как обычный проп.

      Server Components против SSR: SSR — рендер всего приложения на сервере в HTML, который потом гидрируется на
      клиенте. Server Components выполняются только на сервере и никогда не загружаются на клиент.
    points:
      - 16 — Fiber, 16.8 — хуки
      - 17 — новый JSX transform
      - 18 — конкурентный рендеринг, батчинг, `useTransition`
      - 19 — Server Components, Actions, `use`
      - RSC ≠ SSR

  - id: open-react-014
    topic: React
    level: middle
    question: |
      Какие правила использования хуков?
    answer: |
      Первое: вызывайте хуки только на верхнем уровне компонентов или кастомных хуков — не внутри циклов, условий,
      вложенных функций и обработчиков событий. Так хуки вызываются в одном и том же порядке при каждом рендере. Это
      важно, потому что React связывает состояние с хуком по порядку вызова. Исключение — хук `use` из React 19: его можно вызывать в условиях и циклах.

      Второе: используйте хуки только в функциональных компонентах или кастомных хуках — не в классах, обычных функциях
      и модулях.

      Третье: имена хуков начинаются с `use` (`useCustomHook`). Это соглашение позволяет `eslint-plugin-react-hooks`
      автоматически проверять правила.
    points:
      - Только на верхнем уровне
      - Только в компонентах и кастомных хуках
      - Имена с `use`
      - Порядок вызова — ключ к состоянию

  - id: open-react-015
    topic: React
    level: middle
    question: |
      В чём разница между `useLayoutEffect` и `useEffect`?
    answer: |
      `useLayoutEffect` выполняется синхронно после рендера и изменения DOM, но до того, как браузер отрисует экран.
      Он блокирует отрисовку, поэтому подходит для измерений DOM и правок, которые нельзя показывать «в промежуточном
      виде», — позиция тултипа, скролл.

      `useEffect` выполняется асинхронно, обычно после того, как браузер отрисовал компонент. Для всего остального:
      запросы, подписки, логирование.

      Ref-ы React привязывает в фазе коммита, когда DOM-элемент уже создан и до запуска `useLayoutEffect`, — поэтому в
      layout-эффекте `ref.current` уже указывает на узел.
    points:
      - '`useLayoutEffect` — до отрисовки, синхронно'
      - '`useEffect` — после отрисовки'
      - Измерения DOM — в layout-эффекте
      - Ref готов к моменту layout-эффекта

  - id: open-react-016
    topic: React
    level: middle
    question: |
      В каком порядке срабатывают хуки при обновлении компонента?
    answer: |
      Компонент обновляется (setState или новые пропсы).

      Рендер-фаза — сверху вниз по дереву. В теле компонента хуки отдают значения: `useState` и `useReducer` — новое
      состояние, `useContext` — текущее значение, `useRef` — тот же объект, `useMemo` и `useCallback` пересчитываются,
      только если изменились зависимости. Эффекты в этот момент только регистрируются.

      Коммит-фаза — после рендера всего дерева. React применяет изменения к DOM и привязывает ref-ы. Затем синхронно,
      до отрисовки: сначала все очистки старых `useLayoutEffect` по дереву, затем все новые запуски (от детей к родителю). Браузер рисует кадр. После
      этого: сначала все очистки старых `useEffect`, затем все новые запуски (тоже от детей к родителю).

      Правила: порядок хуков фиксирован; сначала все рендеры, потом все эффекты; для каждого эффекта — очистка старого,
      потом новый; layout-эффекты → отрисовка → обычные эффекты. `useRef` не вызывает рендер; ref-колбэк при удалении
      узла вызывается с `null`, если не вернул функцию очистки.
    code: |
      // Обновление count с 0 на 1:
      // Render: 1
      // Cleanup useLayoutEffect: 0
      // useLayoutEffect: 1
      // Cleanup useEffect: 0
      // useEffect: 1
    codeLang: text
    points:
      - Рендер сверху вниз, эффекты снизу вверх
      - Очистка старого эффекта перед новым
      - Layout-эффекты до отрисовки, обычные — после
      - Очистка идёт после рендера, а не до

  - id: open-react-017
    topic: React
    level: middle
    question: |
      Что выведется в консоль при монтировании и после клика по toggle?
    code: |
      const FirstComponent = () => {
        console.log('function body 1');
        useEffect(() => {
          console.log('useEffect 1');
          return () => console.log('cleanup useEffect 1');
        }, []);
        useLayoutEffect(() => {
          console.log('useLayoutEffect 1');
          return () => console.log('cleanup useLayoutEffect 1');
        }, []);
        return <div ref={() => console.log('ref first')}>first</div>;
      };

      const SecondComponent = () => {
        console.log('function body 2');
        useEffect(() => {
          console.log('useEffect 2');
          return () => console.log('cleanup useEffect 2');
        }, []);
        useLayoutEffect(() => {
          console.log('useLayoutEffect 2');
          return () => console.log('cleanup useLayoutEffect 2');
        }, []);
        return <div ref={() => console.log('ref second')}>second</div>;
      };

      export const ConsoleOrder = () => {
        const [state, setState] = useState(true);
        console.log('function body 3');
        useEffect(() => console.log('useEffect 3'), []);
        useLayoutEffect(() => console.log('useLayoutEffect 3'));

        return (
          <>
            {state && (
              <>
                <FirstComponent />
                <SecondComponent />
              </>
            )}
            <button onClick={() => setState((prev) => !prev)}>toggle</button>
          </>
        );
      };
    codeLang: jsx
    answer: |
      При монтировании: `function body 3`, `function body 1`, `function body 2`, `ref first`, `useLayoutEffect 1`,
      `ref second`, `useLayoutEffect 2`, `useLayoutEffect 3`, `useEffect 1`, `useEffect 2`, `useEffect 3`.

      Сначала все рендеры сверху вниз. Потом коммит: для каждого поддерева ref дочернего `div` (он глубже) и
      layout-эффект компонента, родитель последним. После отрисовки — обычные эффекты в том же порядке.

      После клика (дети размонтируются): `function body 3`, `cleanup useLayoutEffect 1`, `ref first`, `cleanup
      useLayoutEffect 2`, `ref second`, `useLayoutEffect 3`, `cleanup useEffect 1`, `cleanup useEffect 2`.

      Рендерится только родитель. При удалении узлов вызываются очистки layout-эффектов, а ref-колбэки — с `null`
      (поэтому `ref first` и `ref second` выводятся снова). `useLayoutEffect 3` без массива зависимостей срабатывает на
      каждом рендере. Потом очистки обычных эффектов. `useEffect 3` с `[]` повторно не запускается. Порядок проверен на
      React 19.
    points:
      - Все рендеры — потом коммит
      - Ref ребёнка-узла раньше layout-эффекта компонента
      - Эффекты от детей к родителю
      - При удалении — очистки и ref-колбэк с `null`

  - id: open-react-018
    topic: React
    level: middle
    question: |
      Какие хуки есть у React Router?
    answer: |
      Основные. `useNavigate` — навигация: `navigate('/about')`, `{ replace: true }` — заменить запись в истории,
      `navigate(-1)` — назад, `{ state: { id: 1 } }` — передать состояние. `useParams` — параметры пути: для маршрута
      `/user/:id/:name` вернёт `{ id: '123', name: 'john' }`, значения всегда строки. `useLocation` — текущий
      location: `pathname`, `search`, `hash`, `state`, `key`. `useSearchParams` — query-параметры как
      `URLSearchParams`: `searchParams.get('q')`, `setSearchParams({ q: 'react' })`. `useRoutes` — маршруты
      объектом, с вложенными `children`.

      Специальные. `useOutlet` — элемент текущего дочернего маршрута. `useOutletContext` — контекст, который родитель
      передал через `<Outlet context={…} />`. `useResolvedPath` — разрешить относительный путь. `useMatch` — проверить,
      совпадает ли текущий URL с шаблоном, и получить его параметры (иначе `null`). `useHref` — сгенерировать URL для
      обычного `<a>`.
    points:
      - '`useNavigate`, `useParams`, `useLocation`, `useSearchParams`'
      - Параметры пути — строки
      - '`useRoutes`, `useOutlet`, `useOutletContext`'
      - '`useMatch`, `useResolvedPath`, `useHref`'

  - id: open-react-019
    topic: React
    level: middle
    question: |
      Что вызывает ререндер компонента?
    answer: |
      Изменение состояния — вызов `setState` из `useState` или `dispatch` из `useReducer` с новым значением.

      Новые пропсы — не самостоятельная причина: ребёнок рендерится, потому что отрендерился родитель. Сравнение пропсов
      по ссылке важно только для `React.memo`: новый объект или массив сломает его, даже если значения те же.

      Изменение контекста — все компоненты, подписанные через `useContext`, перерисуются при новом значении в
      провайдере.

      Ререндер родителя — по умолчанию все дети перерисовываются вместе с ним, даже если их пропсы не изменились.

      Другое — `forceUpdate()` в классах. Батчинг в React 18 группирует обновления в один рендер, но не отменяет его.
      Запись в `ref.current` и мутация объекта без `setState` рендер не вызывают.
    points:
      - Состояние
      - Ререндер родителя (пропсы — следствие)
      - Контекст
      - '`forceUpdate`; `ref` — нет'

  - id: open-react-020
    topic: React
    level: middle
    question: |
      Что нельзя заменить хуками в функциональных компонентах?
    answer: |
      Error Boundaries — `componentDidCatch` и `getDerivedStateFromError` перехватывают ошибки рендера в дочерних
      компонентах и показывают запасной UI. Хука для этого нет: хуки не имеют доступа к ошибкам рендера детей. Решение
      — классовый компонент или библиотека `react-error-boundary`.

      `getSnapshotBeforeUpdate` — снимает состояние DOM прямо перед обновлением (позиция скролла) и передаёт его в
      `componentDidUpdate`. Хука нет; `useLayoutEffect` срабатывает уже после изменений DOM.

      С оговорками: `getDerivedStateFromProps` — прямого аналога нет, но можно вычислять значение прямо в рендере или
      обновлять состояние во время рендера по сравнению с прошлыми пропсами. `shouldComponentUpdate` — заменяется
      `React.memo` с функцией сравнения, но это обёртка, а не метод внутри компонента. Наследование компонентов
      (`class MyComp extends AnotherComp`) — у функций его нет, вместо него композиция, HOC и хуки.
    points:
      - Error Boundary — только класс
      - '`getSnapshotBeforeUpdate` — хука нет'
      - '`shouldComponentUpdate` → `React.memo`'
      - Наследование → композиция

  - id: open-react-021
    topic: React
    level: middle
    question: |
      Что такое batching в React?
    answer: |
      Batching (группировка обновлений) — оптимизация, при которой несколько изменений состояния объединяются в одно
      обновление DOM. React не перерисовывает после каждого `setState`, а собирает изменения в «батч» и применяет за
      один раз. Это сокращает число рендеров и делает интерфейс плавнее.

      Важный нюанс: батчинг меняет число рендеров, но не значения. Если дважды вызвать `setCount(count + 1)`, оба
      вызова возьмут `count` из одного замыкания, и итог будет `count + 1`, а не `count + 2`. Для двух прибавлений нужна
      функция-обновитель: `setCount((c) => c + 1)`.

      История: в React 17 и раньше батчинг работал только внутри обработчиков событий React. В промисах и `setTimeout`
      каждый `setState` давал отдельный рендер. С React 18 и `createRoot` батчинг автоматический везде. Принудительно
      обновить без батчинга — `flushSync()`.
    code: |
      const handleClick = () => {
        setCount(count + 1);
        setCount(count + 1);
        // один рендер, count станет count + 1
      };
    codeLang: jsx
    points:
      - Несколько `setState` — один рендер
      - Значения из замыкания не накапливаются
      - Функция-обновитель для накопления
      - React 18 — батчинг везде, `flushSync` — выход

  - id: open-react-022
    topic: React
    level: middle
    question: |
      Что такое virtual DOM и как React обновляет DOM?
    answer: |
      Virtual DOM — легковесное представление интерфейса в объектах JavaScript. При изменении состояния сначала строится
      новое виртуальное дерево, затем вычисляются минимальные изменения для реального DOM. Так сокращается число
      дорогих операций с DOM.

      Reconciliation (согласование) — процесс, в котором React сравнивает новое виртуальное дерево с предыдущим (а не с
      реальным DOM) и применяет найденные изменения.

      Алгоритм сравнения (diffing) эвристический и опирается на два предположения. Элементы разных типов дают разные
      деревья: если `<div>` сменился на `<span>`, React уничтожает старое поддерево и создаёт новое. Элементы одного
      типа сравниваются по атрибутам, а дети — рекурсивно. Второе — `key`: он позволяет быстро понять, какие элементы
      списка добавлены, удалены или переставлены, и двигать существующие узлы, а не перерисовывать весь список.

      Благодаря этим эвристикам сравнение линейное, `O(n)`, вместо поиска оптимальной разницы, который был бы очень
      долгим.
    points:
      - Дерево объектов вместо прямой работы с DOM
      - Сравниваются старое и новое виртуальные деревья
      - Разный тип — пересоздание ветки
      - '`key` для списков, итог `O(n)`'

  # ===================== Redux =====================
  - id: open-redux-001
    topic: Redux
    level: middle
    question: |
      Что такое Redux и как он работает? Что даёт Redux Toolkit?
    answer: |
      Redux — стейт-менеджер с одним хранилищем на всё приложение и однонаправленным потоком данных. Redux Toolkit (RTK)
      — официальный рекомендуемый способ работать с Redux: упрощает настройку, убирает boilerplate и добавляет лучшие
      практики из коробки.

      Основные концепции RTK. Store — хранилище состояния. Slices — модули состояния: `createSlice` описывает начальное
      состояние и редьюсеры и сам генерирует действия. Actions — объекты, описывающие, что произошло. Reducers —
      чистые функции, которые по действию возвращают новое состояние; в слайсе можно писать «мутирующий» код, Immer
      превратит его в неизменяемое обновление. Async Thunks — асинхронные операции: `createAsyncThunk` сам
      диспатчит `pending`, `fulfilled` и `rejected`.

      Как работает: пользователь взаимодействует с UI → компонент диспатчит действие через `useDispatch` → store
      передаёт его редьюсерам → редьюсер возвращает новое состояние → store обновляется → компоненты, подписанные на
      свою часть через `useSelector`, перерисовываются, если выбранное значение изменилось по ссылке → UI обновлён.
    points:
      - Один store, однонаправленный поток
      - '`dispatch(action)` → reducer → новое состояние → `useSelector`'
      - RTK — `createSlice`, Immer, `createAsyncThunk`
      - Редьюсеры — чистые функции

  # ===================== Next.js =====================
  - id: open-next-001
    topic: Next.js
    level: middle
    question: |
      Как в Next.js App Router настраивается Streaming SSR?
    answer: |
      В App Router рендеринг и стриминг вынесены на уровень файловой системы и `<Suspense>` — вручную настраивать
      потоки не нужно.

      Вариант А — вся страница: файл `loading.js` в папке маршрута (например, `app/dashboard/loading.js`). Next.js
      оборачивает `page.js` в `<Suspense>` с этим файлом как fallback. Клиент мгновенно получает скелетон из
      `loading.js`, а тяжёлый контент страницы стримится по мере готовности данных.

      Вариант Б — точечно: если на странице есть быстрые данные (профиль) и медленные (аналитика за 5 лет), медленный
      компонент оборачивают в `<Suspense fallback={<AnalyticsSkeleton />}>`. Сервер не ждёт аналитику: отдаёт профиль и
      скелетон сразу, а когда данные загрузятся, «довпрыскивает» HTML аналитики в тот же поток.
    code: |
      export default function DashboardPage() {
        return (
          <main>
            <UserProfile />
            <Suspense fallback={<AnalyticsSkeleton />}>
              <HeavyAnalytics />
            </Suspense>
          </main>
        );
      }
    codeLang: jsx
    points:
      - '`loading.js` — Suspense на всю страницу'
      - '`<Suspense>` — точечный стриминг'
      - Быстрое уходит сразу, медленное дописывается в поток

  - id: open-next-002
    topic: Next.js
    level: middle
    question: |
      Что такое Server Components в Next.js и как App Router выбирает статический или динамический рендеринг?
    answer: |
      По умолчанию все компоненты в App Router серверные (React Server Components). Они выполняются только на сервере,
      их код и зависимости — тяжёлые библиотеки, нужные для рендера, — вообще не попадают в клиентский бандл. На клиент
      уходят HTML и специальный поток данных RSC с описанием дерева. Клиентский JavaScript скачивается только для
      компонентов с `'use client'` в начале файла — интерактивные кнопки, формы, `useState`. Это похоже на островную
      архитектуру: статичная страница и интерактивные «острова» (в отличие от Astro, гидрация общая — в одном React-дереве).

      Вместо старых `getStaticProps` и `getServerSideProps` Next.js сам определяет режим по тому, как запрашиваются
      данные. `fetch` с `next: { revalidate: 60 }` — ISR: страница ведёт себя как статика и пересобирается в фоне раз в
      60 секунд. `fetch` с `cache: 'no-store'` — данные свежие на каждый запрос. Чтение `cookies()` или `headers()`
      переводит маршрут в динамический рендеринг (SSR). Важно про версии: в Next.js 13–14 `fetch` по умолчанию
      кэшировался навсегда, а с Next.js 15 по умолчанию не кэшируется; маршрут без обращений к данным запроса всё
      равно может собраться статически.
    points:
      - Компоненты серверные по умолчанию, `'use client'` — граница
      - Код RSC не попадает в бандл
      - '`revalidate` — ISR, `no-store` и `cookies()` — динамика'
      - С Next.js 15 `fetch` не кэшируется по умолчанию

  # ===================== Node.js =====================
  - id: open-node-001
    topic: Node.js
    level: middle
    question: |
      Что такое Node.js и в чём его особенности? Как однопоточный Node.js использует все ядра процессора?
    answer: |
      Node.js — среда выполнения JavaScript на движке V8, построенная на асинхронной событийно-ориентированной
      архитектуре. Главная особенность — однопоточность в сочетании с неблокирующим вводом-выводом. Это позволяет
      обрабатывать тысячи одновременных соединений без накладных расходов на создание потоков, но нагружать CPU
      тяжёлыми задачами не стоит.

      Сам по себе основной поток Node.js выполняет JS на одном ядре (для CPU-задач внутри процесса есть `worker_threads`, а libuv держит пул потоков для файлов, DNS и криптографии). Чтобы задействовать все, запускают несколько
      процессов через модуль `cluster` или оркестратор (pm2). Главный процесс распределяет соединения между дочерними.
      Каждый дочерний — отдельная копия V8 со своим event loop.
    points:
      - V8 + событийная архитектура
      - Один поток JS, неблокирующий I/O
      - Тысячи соединений, но не CPU-задачи
      - '`cluster` или pm2 — процессы на все ядра'

  - id: open-node-002
    topic: Node.js
    level: middle
    question: |
      Чем отличаются SQL и NoSQL базы данных? Какие бывают NoSQL?
    answer: |
      Базы данных делятся на два больших класса: реляционные (SQL) и нереляционные (NoSQL).

      Реляционные хранят данные в таблицах, а строки связаны через ключи — «Excel на стероидах». PostgreSQL — крупные
      проекты, финансы, геоданные; MySQL — веб-проекты, CMS; SQLite — файловая база без сервера, для мобилок и
      десктопа; MS SQL Server и Oracle — корпоративный сектор.

      Нереляционные бывают разных видов. Документные (MongoDB, CouchDB, Firestore) хранят документы как JSON, схему
      заранее знать не нужно — каталоги, блоги, профили. Ключ-значение (Redis, DynamoDB, Memcached) — как словарь:
      кеш, сессии, очереди. Колоночные (ClickHouse) хранят данные по колонкам и быстро
      агрегируют миллиарды строк — аналитика, логи, метрики. Wide-column (Cassandra, ScyllaDB) — огромные объёмы
      записи по ключу партиции, без единой точки отказа. Графовые (Neo4j) — узлы и связи: соцсети, рекомендации,
      антифрод. Временные ряды (InfluxDB, Prometheus, TimescaleDB) — метрики и IoT.

      Выбор зависит от задачи: для финансов и складского учёта — SQL, для блога или каталога — документная, для кеша —
      ключ-значение. Для типичного веб-приложения — PostgreSQL (надёжность, ACID, транзакции) плюс Redis для кеша, для
      прототипа без сложных связей — MongoDB.
    points:
      - SQL — таблицы, связи, транзакции
      - Документные, ключ-значение, колоночные, графовые, временные ряды
      - Выбор по задаче
      - Типичная связка — PostgreSQL + Redis

  - id: open-node-003
    topic: Node.js
    level: middle
    question: |
      Что такое `withCredentials: true` и что нужно настроить, чтобы куки ходили на другой домен?
    answer: |
      `withCredentials: true` (в fetch — `credentials: 'include'`) — флаг запроса, который говорит браузеру:
      «отправь куки и другие учётные данные, даже если запрос на другой домен». Без него браузер не отправляет куки
      при кросс-доменных запросах. Типичный симптом: логин прошёл, сервер поставил куку, а следующий запрос получает
      401, потому что кука не ушла.

      В fetch у `credentials` три значения: `omit` — никогда не отправлять, `same-origin` (по умолчанию) — только на
      свой источник, `include` — всегда. В axios — `withCredentials: true` (можно глобально или в `axios.create`), в
      XHR — `xhr.withCredentials = true`.

      Сервер тоже должен разрешить: CORS с конкретным origin (не `*`) и `credentials: true`, то есть заголовок
      `Access-Control-Allow-Credentials: true`. Для кросс-сайтовых кук — `SameSite=None; Secure`. Safari по умолчанию
      блокирует сторонние куки — надёжнее держать API на поддомене того же сайта или ходить через BFF на том же
      домене.

      Важно: защиту от CSRF даёт не отсутствие флага у вашего фронта — атакующая страница сама решает, отправлять ли
      куки. Защищают `SameSite`, CSRF-токены и проверка `Origin`.
    points:
      - Флаг «отправь куки на чужой домен»
      - '`credentials` — `omit`, `same-origin` (умолч.), `include`'
      - Сервер — конкретный origin и `Allow-Credentials`
      - Кука — `SameSite=None; Secure`

  - id: open-node-004
    topic: Node.js
    level: middle
    question: |
      Чем аутентификация отличается от авторизации?
    answer: |
      Аутентификация — подтверждение личности, вопрос «кто ты?»: ввод логина и пароля, проверка токена.
      Авторизация — проверка прав, вопрос «что тебе можно?»: роль admin или user.

      На беке: при логине находим пользователя, сравниваем хэш пароля (`bcrypt.compare`); неверно — `401`. На защищённом
      действии middleware проверяет роль; прав нет — `403`. Запомнить: `401 Unauthorized` — не аутентифицирован (нет
      токена, протух), `403 Forbidden` — аутентифицирован, но нет прав.

      На фронте авторизация — это показ и скрытие кнопок, роутов и меню по роли, а аутентификация — логин, который
      отправляется на бек. Настоящая проверка прав всегда на беке.
    points:
      - Аутентификация — кто ты
      - Авторизация — что можно
      - 401 против 403
      - На фронте только UI, проверка на беке

  - id: open-node-005
    topic: Node.js
    level: middle
    question: |
      Какие базовые операции SQL ты знаешь? Чем INNER JOIN отличается от LEFT JOIN?
    answer: |
      База данных хранит данные в таблицах, SQL — язык, на котором с ней говорят. Таблица — набор однотипных записей
      (как массив объектов), строка — запись, колонка — поле. Первичный ключ (`id`) уникально определяет строку,
      внешний (`user_id`) ссылается на другую таблицу.

      CRUD: `SELECT` — получить (`WHERE` как `filter`, `ORDER BY` как `sort`, `LIMIT` и `OFFSET` для пагинации,
      `DISTINCT` — без повторов, `COUNT`, `SUM`, `AVG`, `MAX`, `MIN`); `INSERT INTO … VALUES` — добавить; `UPDATE …
      SET … WHERE` — обновить; `DELETE FROM … WHERE` — удалить. Главная опасность — `UPDATE` и `DELETE` без
      `WHERE`: изменят всю таблицу. `GROUP BY` — группировка для агрегатов: сколько заказов у каждого пользователя.

      `INNER JOIN` возвращает только строки, где есть совпадение в обеих таблицах. `LEFT JOIN` — все строки левой
      таблицы, даже без совпадения; поля правой тогда `NULL`. Например, `LEFT JOIN` покажет пользователей без заказов,
      `INNER` — только с заказами.

      Хорошие привычки: не писать `SELECT *` в продакшене, строки в кавычках, индексы на поля из `WHERE`. Индекс — как
      оглавление книги: без него база читает всю таблицу.
    points:
      - SELECT, INSERT, UPDATE, DELETE
      - '`WHERE` обязательно в UPDATE и DELETE'
      - INNER — совпадения, LEFT — вся левая таблица
      - GROUP BY, LIMIT/OFFSET, индексы

  - id: open-node-006
    topic: Node.js
    level: middle
    question: |
      В чём разница event loop браузера и Node.js?
    answer: |
      Общая модель одна: один поток выполнения, очередь задач и очередь микрозадач, event loop, который проверяет,
      есть ли что выполнить. И там и там асинхронность не блокирует поток.

      Цели разные. Браузер — плавный интерфейс: между задачами браузер отрисовывает кадр, есть `requestAnimationFrame`
      и `requestIdleCallback`. Макрозадачи — таймеры, события, сеть, `MessageChannel`; микрозадачи — промисы,
      `queueMicrotask`, `MutationObserver`.

      Node.js — файлы, сеть, БД. Циклом управляет libuv (библиотека на C), он идёт по фазам: timers (`setTimeout`,
      `setInterval`), pending callbacks, poll (ожидание I/O), check (`setImmediate`), close callbacks. Микрозадачи в два
      уровня: сначала очередь `process.nextTick` (собственная очередь Node.js, высший приоритет), затем промисы и
      `queueMicrotask` (исключение — тело ES-модуля: оно само выполняется как промис, поэтому там промисы основного кода
      обгоняют `nextTick`). Обе опустошаются после каждого отдельного колбэка — так с Node.js 11, раньше микрозадачи ждали
      конца фазы таймеров.

      Порядок `setTimeout(0)` и `setImmediate` из основного модуля не гарантирован, а внутри I/O-колбэка `setImmediate`
      всегда первым. `queueMicrotask` легче, чем `Promise.then` (не создаёт промис), и ошибка в нём — обычное
      исключение, а не rejected-промис. Рекурсивный `nextTick` может заморозить цикл: до I/O и таймеров дело не
      дойдёт.
    points:
      - Общее — один поток, задачи и микрозадачи
      - Браузер — отрисовка, rAF
      - Node — фазы libuv, `setImmediate`, `nextTick`
      - '`nextTick` раньше промисов, микрозадачи после каждого колбэка'

  - id: open-node-007
    topic: Node.js
    level: middle
    question: |
      В чём разница между `setImmediate` и `process.nextTick`?
    answer: |
      `process.nextTick` выполняется сразу после завершения текущей операции, до продолжения event loop. Если вызывать
      его рекурсивно, цикл «умрёт с голоду» (starvation): до I/O и таймеров дело не дойдёт.

      `setImmediate` выполняется в фазе check — после того как обработан ввод-вывод, давая I/O-событиям пройти раньше.

      Запомнить просто: `nextTick` — «сделай это прямо сейчас, но после синхронного кода»; `setImmediate` — «сделай
      это в следующем обороте цикла». Названия получились наоборот, это признают и сами авторы Node.js.
    points:
      - '`nextTick` — сразу после текущей операции'
      - '`setImmediate` — фаза check, после I/O'
      - Рекурсивный `nextTick` — starvation

  - id: open-node-008
    topic: Node.js
    level: middle
    question: |
      Зачем нужна валидация на бэкенде и чем её делают?
    answer: |
      Валидация — проверка того, что пришло от клиента, перед сохранением в БД или передачей дальше.

      Никогда не доверяйте данным от клиента: фронт может быть взломан, запрос можно отправить из Postman или скрипта.
      Валидация на беке — последняя линия обороны. Фронт валидирует ради отзывчивого интерфейса, бек — всегда, даже
      то, что фронт уже проверил.

      Проверяют типы полей, обязательность, форматы (email, телефон), диапазоны (возраст, цена), длину строк и
      уникальность (email не занят). При ошибках — `400` со списком ошибок по полям, и только после валидации —
      сохранение.

      Инструменты: Zod — самый популярный, TypeScript-first, из схемы выводится тип; Joi — классика с множеством
      правил; class-validator — декораторы для классов, хорошо с NestJS.
    points:
      - Клиенту доверять нельзя
      - Фронт — для UX, бек — для безопасности
      - Типы, форматы, диапазоны, уникальность
      - Zod, Joi, class-validator

  - id: open-node-009
    topic: Node.js
    level: middle
    question: |
      Что такое BFF и для чего он нужен?
    answer: |
      BFF (Backend For Frontend) — архитектурный паттерн, при котором под каждый клиент (веб, iOS, Android) создаётся
      свой бэкенд-слой между фронтом и основными сервисами. Фронт общается только со своим BFF, а BFF сам ходит в
      сервисы, собирает данные и отдаёт в удобном виде. Главная идея: универсальный бэкенд не может быть одинаково
      удобным для всех клиентов.

      Зачем. Агрегация — один эндпоинт собирает данные из нескольких сервисов параллельно, фронт делает 1 запрос
      вместо 5. Трансформация — поля переименованы, лишнее убрано, даты отформатированы. Безопасность — токены
      хранятся только на BFF, фронт получает HttpOnly-куку, XSS украсть нечего. Кеширование частых запросов.
      Устойчивость — упал сервис рекомендаций, BFF отдаёт остальное с пометкой. Сокрытие внутренней архитектуры —
      фронт стучится в одни и те же эндпоинты, пока внутри всё меняется. Плюс один домен для CORS, единая точка
      логирования, rate limiting, поддержка старых версий API для мобилок.

      Когда не нужен: простой монолит с одним фронтом, прототип, статический сайт, serverless-платформа, где роль BFF
      уже играют функции.
    points:
      - Слой под конкретный клиент
      - Агрегация и трансформация
      - Токены на сервере, HttpOnly на клиенте
      - Кеш, устойчивость, сокрытие архитектуры

  - id: open-node-010
    topic: Node.js
    level: middle
    question: |
      Зачем BFF для защиты токенов, если есть HttpOnly-куки?
    answer: |
      HttpOnly-кука действительно защищает от XSS — JavaScript не может её прочитать. Но это не панацея. Она уязвима
      для CSRF (поэтому нужен `SameSite`), для перехвата (поэтому нужен `Secure` и HTTPS), для XST (поэтому отключают
      метод TRACE).

      Главное: если мы работаем со сторонними API (Google, Stripe, GitHub) или микросервисами, HttpOnly-кука не решает
      проблему хранения токенов. Токен Google нужен для запросов к API Google — в HttpOnly-куку его не положить, а в
      localStorage его украдёт XSS. Между микросервисами кука тоже не работает — нужны токены для каждого сервиса.

      BFF решает именно это: принимает от фронта HttpOnly-куку сессии, по ней находит нужные токены и сам
      подставляет их в запросы. Access token (15 минут) и refresh token (30 дней) живут только на BFF, а в браузере —
      только кука сессии. Украли куку — вред ограничен её сроком, а настоящие токены сервер не покидают.

      Итог: BFF и HttpOnly-куки — взаимодополняющие механизмы, а не взаимозаменяемые.
    points:
      - HttpOnly — от XSS, но не от CSRF и перехвата
      - Токены внешних API в куку не положить
      - BFF держит токены, браузер — только сессию
      - Механизмы дополняют друг друга

  - id: open-node-011
    topic: Node.js
    level: middle
    question: |
      Как вы будете кешировать данные и что такое cache invalidation?
    answer: |
      Кеширование помещает часто запрашиваемые данные в быстрое хранилище — например, Redis или Memcached — чтобы не
      ходить каждый раз в основную базу или внешний сервис: курсы валют, список стран, профили.

      Cache invalidation (инвалидация кеша) — удаление или перезапись устаревших данных в кеше, чтобы клиент не
      получал неактуальную информацию после изменения данных в основной БД. Способы: время жизни (TTL), удаление
      ключа при записи в базу, версии ключей. Это одна из «двух сложных вещей в программировании».
    points:
      - Redis или Memcached для частых данных
      - Инвалидация — убрать устаревшее
      - TTL, удаление при записи, версии ключей

  - id: open-node-012
    topic: Node.js
    level: middle
    question: |
      Как обрабатывать ошибки в Node.js?
    answer: |
      Все ошибки в асинхронном коде должны идти через колбэк `(err, data)` или ловиться в `catch` промиса. Для
      веб-фреймворков (Express, NestJS) — центральный error-handling middleware.

      Принцип для API: никогда не падать и всегда возвращать понятный JSON с правильным статусом. Оборачивать
      асинхронный код в `try/catch`, проверять существование данных перед доступом к полям (не нашли — `404` с кодом
      ошибки), ошибку валидации — `400` со списком полей, внутреннюю — логировать на сервере, а клиенту отдавать `500`
      с общим «что-то пошло не так», без стека.

      На уровне приложения подписываются на `process.on('uncaughtException')` и `unhandledRejection` — но только чтобы
      залогировать и корректно завершить процесс, а не продолжать. После `uncaughtException` состояние
      непредсказуемо: могли остаться недописанные данные и открытые соединения. Лучше перезапустить процесс через pm2
      или systemd.
    points:
      - Колбэк с `err` или `catch`
      - Центральный error middleware
      - Понятный JSON и правильный статус
      - '`uncaughtException` — залогировать и выйти'

  - id: open-node-013
    topic: Node.js
    level: middle
    question: |
      Как решать проблему CPU-тяжёлых задач в Node.js?
    answer: |
      Node.js плохо подходит для сложных вычислений: они блокируют event loop, и сервер перестаёт отвечать всем.

      Решения. Вынести в `worker_threads` — встроенный модуль, отдельный поток со своим event loop. Запустить
      несколько процессов через `cluster` или pm2. Отправить задачу в очередь (BullMQ и Redis, RabbitMQ), а
      обрабатывают её выделенные воркеры. Или написать микросервис на другом языке (Go, Rust).

      Коротко: `worker_threads` для параллельных вычислений внутри одного приложения, при высокой нагрузке — очередь
      и отдельные воркеры.
    points:
      - Тяжёлый расчёт блокирует event loop
      - '`worker_threads`'
      - '`cluster`, pm2'
      - Очередь задач или другой язык

  - id: open-node-014
    topic: Node.js
    level: middle
    question: |
      Какие HTTP-коды ответов нужно знать и что с ними делать на фронте?
    answer: |
      2xx — успех. `200 OK` — данные в ответе. `201 Created` — ресурс создан, адрес бывает в `Location`. `202 Accepted`
      — принят в обработку, можно опрашивать. `204 No Content` — успех без тела, например после `DELETE`. `206` — часть
      данных, для видео и больших файлов.

      3xx — редиректы. `301` — навсегда, `302` — временно, `303` — «иди GET-ом на другой URL» после `POST`, `304 Not
      Modified` — бери из кеша, `307` и `308` — как 302 и 301, но метод сохраняется.

      4xx — ошибка клиента. `400` — неверный запрос, валидация. `401` — нет аутентификации: на логин или обновить токен.
      `403` — нет прав. `404` — не найдено. `405` — метод не поддерживается. `409` — конфликт версий: «данные
      изменились, обновите». `410` — удалено навсегда. `413` — слишком большое тело. `415` — не тот `Content-Type`.
      `422` — формат верный, но не прошли бизнес-правила (email занят). `429` — rate limit, ждать `Retry-After`.

      5xx — ошибка сервера. `500` — необработанная ошибка: «попробуйте позже». `501` — не реализовано. `502 Bad Gateway`
      — прокси получил плохой ответ от сервера, `503` — перегрузка или обслуживание, `504` — прокси не дождался ответа;
      их можно повторить.

      Мнемоника: 1xx — информация, 2xx — успех, 3xx — иди в другое место, 4xx — накосячил клиент, 5xx — накосячил
      сервер.
    points:
      - 200, 201, 204
      - 301, 302, 304, 307
      - 400, 401, 403, 404, 409, 422, 429
      - 500, 502, 503, 504

  - id: open-node-015
    topic: Node.js
    level: middle
    question: |
      Что такое миграции базы данных?
    answer: |
      Миграции — файлы с изменениями структуры БД: создать таблицу, добавить колонку, переименовать поле. Это как Git
      для схемы базы: каждая миграция — шаг изменения. Функция `up` вносит изменение, `down` — откатывает его.

      Без миграций базу правят вручную на сервере, непонятно, у кого какая версия схемы, откатить нельзя, на
      продакшене страшно. С миграциями все изменения в коде и в гите, каждый разработчик просто запускает миграции,
      есть откат, а CI/CD применяет их автоматически.

      На фронте прямого аналога нет — меняем код и деплоим. На беке изменение структуры БД — критическая операция, и
      миграции делают её безопасной и управляемой. ORM (TypeORM, Prisma) генерируют миграции из моделей.
    points:
      - Версионирование схемы БД
      - '`up` — изменение, `down` — откат'
      - Всё в гите, применяет CI/CD
      - ORM генерируют миграции

  - id: open-node-016
    topic: Node.js
    level: middle
    question: |
      Что означает аббревиатура ACID?
    answer: |
      Это требования к транзакциям в базах данных, которые обеспечивают их надёжность.

      Atomicity (атомарность) — транзакция выполняется целиком или не выполняется вообще. Consistency
      (согласованность) — транзакция переводит БД из одного корректного состояния в другое. Isolation (изоляция) —
      параллельные транзакции не влияют друг на друга. Durability (надёжность) — подтверждённые изменения остаются в
      системе даже после сбоя.
    points:
      - Atomicity — всё или ничего
      - Consistency — корректное состояние
      - Isolation — параллельные не мешают
      - Durability — переживает сбой

  - id: open-node-017
    topic: Node.js
    level: middle
    question: |
      Что такое балансировщик нагрузки, брокер сообщений и микросервисная архитектура?
    answer: |
      Балансировщик нагрузки (Load Balancer) — сервер или сервис (Nginx, AWS ELB), который принимает входящие запросы
      и распределяет их между несколькими серверами бэкенда. Это предотвращает перегрузку отдельных машин и даёт
      высокую доступность.

      Брокеры сообщений (Kafka, RabbitMQ) позволяют частям бэкенда обмениваться сообщениями асинхронно. Сообщения
      лежат в очереди, доставка гарантирована даже при временном отказе сервиса, пиковые нагрузки сглаживаются.

      Микросервисная архитектура — приложение строится не как единый монолит, а как набор небольших независимых
      сервисов. Каждый отвечает за свою бизнес-логику, общается с другими через API (REST, gRPC) или брокер и может
      иметь свою базу данных.
    points:
      - Балансировщик — распределяет запросы
      - Брокер — асинхронные сообщения, очередь
      - Микросервисы — независимые сервисы со своей логикой

  - id: open-node-018
    topic: Node.js
    level: middle
    question: |
      Что такое поток (Stream) в Node.js и зачем он нужен?
    answer: |
      Stream — способ обработки данных по частям, без загрузки всего объекта в память. В Node.js четыре типа: readable
      (источник), writable (приёмник), duplex (и то и другое, независимо — как сокет), transform (выход вычисляется из
      входа — как сжатие gzip).

      Классический пример — чтение большого файла через `fs.createReadStream` и передача через `pipe` в ответ или
      проксирование запросов между клиентом и API. Когда использовать: файлы больше 100–200 МБ, видео и аудио, работа
      с CSV и JSONL построчно.
    points:
      - Данные по частям, без загрузки в память
      - readable, writable, duplex, transform
      - Большие файлы, видео, построчная обработка

  # ===================== Git =====================
  - id: open-git-001
    topic: Git
    level: middle
    question: |
      Что такое `git cherry-pick`?
    answer: |
      `git cherry-pick` — команда, с помощью которой можно выборочно применить коммиты к текущей ветке HEAD. С её
      помощью можно взять коммит из одной ветки и применить его к другой — например, перенести исправление, не сливая
      всё остальное. Коммит копируется с новым хэшем, исходная ветка не меняется.
    points:
      - Выборочно применить коммит к текущей ветке
      - Копия с новым хэшем
      - Перенос исправления без слияния ветки

  - id: open-git-002
    topic: Git
    level: middle
    question: |
      В чём разница между `git pull` и `git fetch`?
    answer: |
      `git fetch` получает все отсутствующие данные с удалённого репозитория, но не сливает их — ваши ветки и файлы не
      меняются, обновляются только удалённые ветки вроде `origin/main`.

      `git pull` получает изменения и сразу вливает их в текущую ветку: это `fetch` плюс `merge` (или `rebase`, если так
      настроено).
    points:
      - '`fetch` — только скачать'
      - '`pull` = `fetch` + `merge`'

  - id: open-git-003
    topic: Git
    level: middle
    question: |
      За что отвечают команды `git bisect` и `git config`?
    answer: |
      `git bisect` — поиск коммита, сломавшего логику. `git bisect start`, `git bisect bad` — текущее состояние
      сломано, `git bisect good <хэш>` — здесь работало. Дальше Git делит историю пополам, вы отмечаете каждый шаг, и
      за несколько шагов находится виновник. Закончить — `git bisect reset`.

      `git config` позволяет работать с конфигурацией Git: на уровне репозитория, пользователя (`--global`) или
      системы — имя и почта автора, редактор, алиасы, поведение `pull`.
    points:
      - '`bisect` — двоичный поиск сломавшего коммита'
      - '`start`, `bad`, `good`, `reset`'
      - '`config` — настройки на трёх уровнях'

  - id: open-git-004
    topic: Git
    level: middle
    question: |
      За что отвечает `git stash`?
    answer: |
      Команда сохраняет текущие незакоммиченные изменения в локальное хранилище и очищает рабочую копию — например,
      чтобы быстро переключиться на другую задачу.

      `git stash list` — список всех записей. `git stash` или `git stash push -m "имя"` — сохранить (старое `stash
      save` устарело). `git stash pop` — выгрузить изменения в текущую ветку и удалить запись. `git stash apply` —
      выгрузить, но не удалять. `git stash drop` — удалить запись. `git stash clear` — удалить все записи. Неотслеживаемые файлы по умолчанию не прячутся — для них нужен `git stash -u`.
    points:
      - Временно убрать незакоммиченное
      - '`pop` — применить и удалить'
      - '`apply` — применить и оставить'
      - '`list`, `drop`, `clear`'

  - id: open-git-005
    topic: Git
    level: middle
    question: |
      Из чего состоит коммит?
    answer: |
      Коммит — объект с хэшем, который ссылается на снимок дерева файлов (tree) и на предыдущий коммит. Так
      получается цепочка — история. У merge-коммита родителей два. Ещё в коммите указаны автор и коммитер с метками
      времени и сообщение.

      Git хранит снимок всего проекта, а не только изменённые файлы. Неизменённые файлы переиспользуются из прошлых
      снимков, а разница между коммитами вычисляется на лету.
    points:
      - Снимок дерева файлов
      - Ссылки на родителей (у merge — два)
      - Автор, время, сообщение

  - id: open-git-006
    topic: Git
    level: middle
    question: |
      Как отменить коммит, если он ещё не был опубликован?
    answer: |
      Вариант 1 — интерактивный rebase: `git rebase -i`, у нужного коммита поставить `drop`.

      Вариант 2 — `git reset`: `git reset --soft HEAD~` отменит последний коммит, а изменения оставит в индексе;
      `git reset HEAD~` (это `--mixed`) — оставит изменения в рабочих файлах; `git reset --hard HEAD~` — удалит
      коммит вместе с изменениями.

      Если коммит уже опубликован, историю не переписывают — делают `git revert`, который создаёт новый коммит с
      обратными изменениями.
    points:
      - '`rebase -i` + `drop`'
      - '`reset --soft`, `--mixed`, `--hard`'
      - Опубликованный — только `revert`

  - id: open-git-007
    topic: Git
    level: middle
    question: |
      Как найти список файлов, которые изменились в определённом коммите?
    answer: |
      Загружаем список коммитов — `git log` — и находим нужный хэш. Открываем изменения коммита — `git show <хэш>`.
      Чтобы увидеть только имена файлов без построчной разницы — `git show --name-only <хэш>` или `--stat` со
      статистикой.
    points:
      - '`git log` — найти коммит'
      - '`git show <хэш>`'
      - '`--name-only` или `--stat`'

  - id: open-git-008
    topic: Git
    level: middle
    question: |
      Как настроить репозиторий, чтобы инструменты проверки кода запускались перед каждым коммитом?
    answer: |
      С помощью хука `pre-commit`. Код проверки прописывается в файле `.git/hooks/pre-commit`, и Git запускает его
      перед каждым коммитом; если проверка упала, коммит не создаётся.

      Папка `.git/hooks` не попадает в репозиторий, поэтому хуки обычно ставят через husky — он подключает их у всех
      разработчиков после установки зависимостей. Вместе с ним используют lint-staged, чтобы проверять только
      изменённые файлы.
    points:
      - Хук `pre-commit` в `.git/hooks`
      - Упала проверка — нет коммита
      - husky + lint-staged

  - id: open-git-009
    topic: Git
    level: middle
    question: |
      Какие повседневные команды Git для веток и удалённых репозиториев ты знаешь?
    answer: |
      Переименовать текущую ветку — `git branch -m <new-name>`, любую — `git branch -m <old-name> <new-name>`.

      Посмотреть ссылки на удалённый репозиторий — `git remote -v`. Добавить — `git remote add origin <url>`.
      Изменить — `git remote set-url origin <url>`.

      Узнать, было ли слияние ветки, — `git branch --merged` (ветки, уже влитые в текущую), и `--no-merged` для
      обратного.

      Убрать файл или папку из репозитория, оставив на диске, — `git rm -r --cached <путь>` и дописать путь в
      `.gitignore`.
    points:
      - '`branch -m` — переименовать'
      - '`remote -v`, `add`, `set-url`'
      - '`branch --merged`'
      - '`rm --cached` + `.gitignore`'

  - id: open-git-010
    topic: Git
    level: middle
    question: |
      Как соединить несколько коммитов в один?
    answer: |
      Открываем интерактивный rebase: `git rebase -i HEAD~<число коммитов>`. У коммитов, которые хотим влить в
      предыдущий, ставим `s` (squash) — их изменения и сообщения объединятся. `f` (fixup) — то же, но сообщение
      выкидывается.

      Альтернатива — `git reset --soft HEAD~<число>` и один новый коммит. Опубликованные коммиты так не трогают: это
      переписывание истории.
    points:
      - '`rebase -i HEAD~N`'
      - '`squash` или `fixup`'
      - Или `reset --soft` и новый коммит

  - id: open-git-011
    topic: Git
    level: middle
    question: |
      В чём отличие merge от rebase?
    answer: |
      Merge сохраняет историю как есть: изменения другой ветки вливаются, появляется новый коммит слияния, видно, где
      ветки расходились. Коммитов больше, история «ветвистая», зато ничего не переписывается.

      Rebase переписывает историю: коммиты текущей ветки пересоздаются поверх новой базы с новыми хэшами. История
      линейная и чище, но коммиты — уже другие объекты. Никакая ветка при этом не удаляется.

      Правило: свою локальную ветку можно ребейзить на свежий `main`, а опубликованные общие ветки — нет: у коллег
      останутся старые коммиты, и начнётся путаница.
    points:
      - Merge — коммит слияния, история как есть
      - Rebase — коммиты пересоздаются, история линейная
      - Ветки не удаляются
      - Публичные ветки не ребейзят

  - id: open-git-012
    topic: Git
    level: middle
    question: |
      Что такое Git Flow и trunk-based development?
    answer: |
      Git Flow — модель ветвления Винсента Дриссена (2010). Строгий набор правил для создания и слияния веток, чтобы
      много людей могли организованно готовить релизы.

      Основные ветки: `master` — стабильная версия, готовая к выпуску, с тегами версий; `develop` — основная ветка
      разработки. Вспомогательные: `feature` — отводятся от `develop` под задачу и вливаются обратно; `release` —
      подготовка выпуска (исправления, документация), потом вливаются в `master` и в `develop`; `hotfix` — срочные
      исправления продакшена, отводятся от `master` и вливаются в `master` и `develop`.

      Trunk-based — все работают в одной основной ветке (часто `master`). Если и создают ветки фич, то короткие: как
      только код собрался и прошёл тесты, он вливается в основную. Релизные ветки с тегами отводятся от основной.
      Разработка действительно непрерывная, а тяжёлых конфликтов слияния меньше. Требует хороших тестов и
      feature-флагов.
    points:
      - Git Flow — master, develop, feature, release, hotfix
      - release и hotfix вливаются в обе основные
      - Trunk-based — одна ветка, короткие фичи
      - Trunk-based требует тестов и feature-флагов

  - id: open-git-013
    topic: Git
    level: middle
    question: |
      Что такое stage, unstage и index? Что такое tag?
    answer: |
      Index (stage, индекс) — область, где собирается следующий коммит: файлы, которые готовы к нему. Unstaged —
      изменения в рабочих файлах, ещё не добавленные в индекс. Добавить — `git add`, убрать из индекса — `git restore
      --staged`.

      Tag — способ поставить постоянную точку в истории, обычно версию релиза. `git tag <имя>` — лёгкий тег, просто
      ссылка на коммит. `git tag -a <имя> -m "описание"` — аннотированный: отдельный объект с автором, датой и
      сообщением. Теги не двигаются и отправляются явно — `git push --tags`.
    points:
      - Индекс — готовое к коммиту
      - Unstaged — изменено, но не добавлено
      - Тег — неподвижная метка
      - Лёгкий и аннотированный теги

  - id: open-git-014
    topic: Git
    level: middle
    question: |
      Что такое подмодули в Git?
    answer: |
      Подмодули позволяют хранить один Git-репозиторий как подкаталог другого. Можно подключить в проект другой
      репозиторий, но коммиты хранить отдельно; основной проект помнит конкретный коммит подмодуля. Добавить —
      `git submodule add <url>`.

      При клонировании проекта с подмодулями каталоги подмодулей пустые. Нужно `git submodule init` (инициализировать
      локальный конфиг) и `git submodule update` (получить данные и извлечь нужный коммит), или сразу `git clone
      --recurse-submodules`.

      Работа: чтобы обновить подмодуль, заходим в его каталог, делаем `git fetch` и `git merge`; в основном проекте
      `git diff --submodule` покажет новые коммиты. Когда коллега обновил подмодуль, простого `git pull` мало: он
      скачает изменения подмодуля, но не обновит его — `git status` покажет подмодуль как изменённый. Нужно ещё `git
      submodule update`.
    points:
      - Репозиторий в репозитории, ссылка на коммит
      - После клона — `init` и `update`
      - После `pull` — тоже `submodule update`

  # ===================== Сети и браузер =====================
  - id: open-net-001
    topic: Сети и браузер
    level: middle
    question: |
      Что такое Content Security Policy?
    answer: |
      CSP — HTTP-заголовок, по которому браузер ограничивает источники, откуда можно загружать и выполнять контент:
      скрипты, стили, изображения, фреймы. Это политика безопасности против XSS-атак, инъекций кода и других
      уязвимостей.

      Например, `Content-Security-Policy: default-src 'self'; script-src 'self' https://trusted.cdn.com` разрешит
      скрипты только со своего домена и доверенного CDN, а внедрённые inline-скрипты не выполнятся. CSP — второй
      рубеж: экранировать и санитизировать пользовательский ввод всё равно нужно.
    points:
      - Заголовок со списком разрешённых источников
      - Защита от XSS и инъекций
      - Блокирует inline и чужие скрипты
      - Дополняет экранирование, а не заменяет

  - id: open-net-002
    topic: Сети и браузер
    level: middle
    question: |
      Что такое Core Web Vitals? Какие ещё метрики производительности знаешь?
    answer: |
      Core Web Vitals — главные метрики пользовательского опыта от Google.

      LCP (Largest Contentful Paint) — когда отрисовался самый крупный видимый элемент: картинка, текстовый блок,
      постер видео, фоновое изображение. Хорошо — до 2,5 с, плохо — больше 4 с. Улучшают оптимизацией и предзагрузкой
      главной картинки (`srcset`, `fetchpriority="high"`, `preload`), удалением блокирующего JS (`async`, `defer`), SSR,
      CDN.

      INP (Interaction to Next Paint) — задержка от взаимодействия до следующей отрисовки, по всем взаимодействиям
      страницы. Хорошо — до 200 мс. В марте 2024 года заменил FID, который мерил только первое взаимодействие (хорошо
      — до 100 мс). Улучшают code splitting и ленивым импортом, Web Workers, debounce и throttle, разбиением длинных
      задач.

      CLS (Cumulative Layout Shift) — визуальная стабильность, сумма неожиданных смещений макета. Хорошо — до 0,1,
      плохо — больше 0,25. Причины — картинки без размеров, реклама и виджеты без места, динамический контент,
      веб-шрифты. Лечат `width`/`height` или `aspect-ratio`, резервом места, `font-display: optional` или `size-adjust` (`swap` спасает от невидимого текста, но сам даёт сдвиг),
      анимациями через `transform`.

      Другие метрики: FCP (первый контент, до 1,8 с), TTI (время до интерактивности), TBT (суммарное время
      блокировки основного потока, хорошо — до 200 мс), TTFB. Измеряют библиотекой `web-vitals` (`onLCP`, `onINP`,
      `onCLS`) или через `PerformanceObserver`.
    points:
      - LCP до 2,5 с — загрузка
      - INP до 200 мс — отзывчивость (заменил FID)
      - CLS до 0,1 — стабильность
      - FCP, TBT, TTFB, `web-vitals`

  - id: open-net-003
    topic: Сети и браузер
    level: middle
    question: |
      Как работает event loop в браузере?
    answer: |
      Event loop — механизм, который позволяет JavaScript обрабатывать асинхронные операции (запросы, таймеры) без
      блокировки основного потока. Он координирует стек вызовов, очередь задач и Web API браузера. Цикл бесконечно
      проверяет, пуст ли стек, и если да — берёт задачу из очереди.

      Порядок на каждом «тике»: выполняется текущая задача (синхронный код скрипта или колбэк макрозадачи); затем
      все микрозадачи — колбэки промисов, `MutationObserver`, `queueMicrotask`; затем, если браузер решил рисовать
      кадр, — колбэки `requestAnimationFrame` и рендеринг; потом следующая макрозадача.

      Макрозадачи: `setTimeout`, `setInterval`, события UI (клики, скролл), сообщения, завершение сетевых операций.
      Микрозадачи: `then`, `catch`, `finally`, `queueMicrotask`, `MutationObserver` (в Node.js ещё
      `process.nextTick`). Сам event loop не часть движка V8 — его реализует окружение: браузер или Node.js через
      libuv.
    points:
      - Один поток, стек и очереди
      - Задача → все микрозадачи → (иногда) rAF и отрисовка
      - Макро — таймеры, события; микро — промисы
      - Цикл реализует окружение, не V8

  - id: open-net-004
    topic: Сети и браузер
    level: middle
    question: |
      Чем отличаются HTTP/1.1, HTTP/2 и HTTP/3?
    answer: |
      HTTP — протокол обмена данными между клиентом и сервером. Основные версии: HTTP/1.1 (1997), HTTP/2 (2015), HTTP/3
      (2022).

      HTTP/1.1 — текстовый протокол. Соединения постоянные (keep-alive), но запросы в одном соединении идут по
      очереди: медленный ответ задерживает остальные (head-of-line blocking). Поэтому браузер открывает до 6
      соединений на домен. Заголовки не сжимаются. Медленно для страниц с множеством ресурсов.

      HTTP/2 — бинарный формат, мультиплексирование: много запросов и ответов одновременно по одному TCP-соединению;
      сжатие заголовков HPACK. Блокировка осталась на уровне TCP: потеря пакета тормозит все потоки. Server push в
      спецификации есть, но браузеры его отключили. Браузеры используют HTTP/2 только поверх TLS.

      HTTP/3 — работает поверх QUIC на UDP со встроенным TLS 1.3. Потеря пакета блокирует только свой поток, соединение
      устанавливается быстрее (меньше round trip), сжатие заголовков — QPACK. Лучше в мобильных сетях с потерями и
      высокой задержкой.
    points:
      - 1.1 — текст, keep-alive, запросы по очереди
      - 2 — бинарный, мультиплексирование, HPACK
      - 3 — QUIC на UDP, TLS 1.3, без блокировки потоков
      - HOL blocking — главная причина эволюции

  - id: open-net-005
    topic: Сети и браузер
    level: middle
    question: |
      Что такое JWT и как его безопасно использовать?
    answer: |
      JWT — стандарт (RFC 7519) для токенов доступа: информация передаётся в виде JSON-объекта. Токен самодостаточен —
      содержит нужные данные о пользователе и подписан для проверки целостности.

      Структура: `header.payload.signature`. Header — алгоритм подписи (`HS256`, `RS256`) и тип. Payload — утверждения
      (claims): зарегистрированные `iss` (издатель), `exp` (срок), `sub` (обычно id пользователя), `aud` (получатель),
      `iat`, а также свои (`role`). Обе части в Base64Url — это кодирование, а не шифрование: прочитать может любой.
      Signature — подпись заголовка и payload секретным ключом.

      Как работает: сервер выпускает токен после входа, клиент присылает его в `Authorization: Bearer <token>`, сервер
      проверяет подпись, срок и данные.

      Плюсы: stateless — серверу не нужно хранить сессии; самодостаточность; подпись не даёт изменить данные. Минусы:
      нельзя отозвать до истечения срока; украденный токен работает до `exp`; размер больше id сессии.

      Практики: только HTTPS; короткий срок access-токена (15–30 минут) и refresh-токен на дни; хранить в HttpOnly-куке,
      а не в localStorage (XSS); сильные секреты из переменных окружения (для HS256 — от 32 байт); не класть секреты в
      payload; отзыв — через чёрный список (например, в Redis до `exp`). Альтернативы — opaque-токены, PASETO,
      серверные сессии.
    points:
      - header.payload.signature
      - Base64Url — не шифрование
      - Stateless, но нельзя отозвать
      - Короткий access + refresh, HttpOnly-кука
      - Сильный секрет, чёрный список

  - id: open-net-006
    topic: Сети и браузер
    level: middle
    question: |
      Что такое REST и какие HTTP-методы ты знаешь?
    answer: |
      REST (Representational State Transfer) — архитектурный стиль для распределённых систем, описанный в диссертации
      Роя Филдинга в 2000 году. RESTful API — веб-сервис, который через HTTP позволяет получать, создавать, обновлять и
      удалять ресурсы стандартными методами.

      Методы: `GET` — получить данные, не меняя состояние. `POST` — отправить данные, создать ресурс (формы). `PUT` —
      заменить ресурс по URI; идемпотентен: несколько одинаковых запросов дают тот же эффект, что один. `PATCH` —
      частичное изменение. `DELETE` — удалить. `HEAD` — как `GET`, но только заголовки и статус. `OPTIONS` — описать
      возможности ресурса; на нём работает preflight CORS. `CONNECT` — туннель, например для HTTPS через прокси.
      `TRACE` — диагностика, эхо запроса (обычно отключают).

      Preflight — автоматический `OPTIONS`-запрос, который браузер шлёт перед «сложным» кросс-доменным запросом
      (`PUT`, `DELETE`, `POST` с JSON, нестандартные заголовки), чтобы убедиться, что сервер его разрешает. Ответил «да» — уходит
      основной запрос, нет — ошибка CORS.
    points:
      - Стиль Филдинга, ресурсы через HTTP
      - GET, POST, PUT, PATCH, DELETE
      - HEAD, OPTIONS, CONNECT, TRACE
      - PUT идемпотентен, POST нет
      - Preflight — OPTIONS перед сложным запросом

  - id: open-net-007
    topic: Сети и браузер
    level: middle
    question: |
      Чем отличаются Server-Sent Events, long polling и WebSocket?
    answer: |
      SSE — сервер отправляет данные клиенту в одном направлении через обычное HTTP-соединение. В браузере это класс
      `EventSource`: он сам переподключается (задержка настраивается `retry:`), при переподключении отправляет
      `Last-Event-ID`, хранит состояние в `readyState`. Сообщения — текст: строки `data:`, `event:`, `id:` и пустая
      строка в конце. Плюсы — простота, проходит через файрволы. Ограничения — только сервер → клиент, только текст, на
      HTTP/1.1 не больше 6 соединений на домен. Для лент, уведомлений, метрик, счёта матча. Аналогия: вместо звонков
      другу каждые 5 секунд «ты уже вышел?» один раз попросить «напиши, когда выйдешь».

      Long polling — клиент отправляет запрос, сервер не закрывает соединение, пока у него не появится сообщение,
      отвечает, и браузер сразу делает новый запрос. Это гораздо лучше обычных опросов: сообщения приходят без
      задержки. Если прокси оборвал долгий запрос (502 или 504), клиент просто переподключается.

      WebSocket (RFC 6455, 2011) — двусторонний (full-duplex) обмен по одному TCP-соединению. Начинается с HTTP-запроса
      с `Upgrade: websocket`, сервер отвечает `101`, дальше бинарные и текстовые кадры без накладных расходов HTTP.
      Плюсы — реальное время, мало трафика, обе стороны пишут когда угодно. Минусы — сложнее настройка, нет HTTP-кэша,
      переподключение и авторизацию пишут сами.

      Токены и WebSocket: токен передают при подключении. Когда access-токен истёк — либо получить новый по HTTP и
      переподключиться (сервер закрывает соединение своим кодом из диапазона 4000–4999), либо прислать новый токен
      сообщением в открытый сокет. Refresh-токен через сокет не гоняют — только в HTTP-эндпоинт.
    points:
      - SSE — сервер → клиент, текст, авто-переподключение
      - Long polling — висящий запрос и сразу новый
      - WebSocket — двусторонний, `101 Switching Protocols`
      - Токен WebSocket — переподключение или сообщение

  - id: open-net-008
    topic: Сети и браузер
    level: middle
    question: |
      Что такое SSG и ISR?
    answer: |
      SSG (Static Site Generation) — сборка сайта в статические HTML-файлы на этапе билда, а не при каждом запросе.
      При SSR сервер каждый раз генерирует HTML заново; при SSG HTML готов заранее и раздаётся как статика.

      В Next.js (Pages Router) данные для страницы загружаются при билде в `getStaticProps`, а для динамических
      маршрутов `getStaticPaths` перечисляет страницы для генерации (`fallback: false | true | 'blocking'`).

      Разновидности. Классический SSG — всё при билде. ISR (Incremental Static Regeneration) — `revalidate: 60`:
      страница статична, но после истечения срока первый запрос получает старую версию и запускает фоновую
      пересборку, следующие получают новую. On-demand ревалидация — API вызывает `res.revalidate('/blog/post-1')`,
      например при обновлении контента в CMS.

      Плюсы SSG: мгновенная загрузка, дешёвый статический хостинг, нет сервера — меньше поверхность атаки, хорошее SEO.
      Подходит для блогов, документации, лендингов, портфолио, каталогов. Не подходит для соцсетей, чатов,
      персональных панелей, поиска в реальном времени.
    points:
      - HTML на этапе билда
      - ISR — stale-while-revalidate по `revalidate`
      - On-demand ревалидация из CMS
      - Блоги и доки — да, чаты и дашборды — нет

  - id: open-net-009
    topic: Сети и браузер
    level: middle
    question: |
      Что такое SSR?
    answer: |
      SSR — техника, при которой веб-приложение рендерится на сервере, а не в браузере. Когда пользователь запрашивает
      страницу, сервер формирует HTML с учётом данных и шаблонов и отправляет его клиенту. Затем страница
      гидрируется — JS «оживляет» готовую разметку.

      Плюсы: контент отображается быстрее — важно для мобильных устройств и медленного интернета; поисковики лучше
      видят контент — SEO; пользователь сразу получает полноценную страницу, меньше отказов.

      Минусы: нагрузка на сервер на каждый запрос, TTFB выше, чем у статики, а интерактивность всё равно ждёт
      загрузки JS. От XSS SSR сам по себе не защищает — экранировать данные нужно всегда.
    points:
      - HTML на сервере на каждый запрос
      - Быстрый первый контент и SEO
      - Гидрация на клиенте
      - Нагрузка на сервер

  - id: open-net-010
    topic: Сети и браузер
    level: middle
    question: |
      Что такое Service Worker и для чего он используется?
    answer: |
      Service Worker — специальный скрипт, который работает в фоне браузера отдельно от страницы и действует как прокси
      между ней и сетью: может перехватывать и подменять запросы. Доступа к DOM и `localStorage` у него нет, со
      страницей он общается сообщениями.

      Регистрация — `navigator.serviceWorker.register('/sw.js')`. Жизненный цикл: `install` (обычно кэширование
      ресурсов), `activate`, дальше обработка событий. Работает он не постоянно: браузер будит его на события
      (`fetch`, `push`, `sync`) и усыпляет в простое. Требует HTTPS (кроме localhost).

      Применение. Кэширование и офлайн: событие `fetch` отдаёт ответ из Cache Storage, если сети нет. Push-уведомления
      — даже когда сайт закрыт. Фоновая синхронизация — отправить данные, когда сеть вернётся. Оптимизация — быстрые
      повторные загрузки из кэша. Это основа PWA.
    code: |
      self.addEventListener('install', (event) => {
        event.waitUntil(
          caches.open('my-cache').then((cache) => cache.addAll(['/index.html', '/style.css'])),
        );
      });

      self.addEventListener('fetch', (event) => {
        event.respondWith(
          caches.match(event.request).then((response) => response || fetch(event.request)),
        );
      });
    codeLang: js
    points:
      - Прокси между страницей и сетью
      - install, activate, события
      - Просыпается по событиям, засыпает в простое
      - Офлайн, push, фоновая синхронизация, PWA

  - id: open-net-011
    topic: Сети и браузер
    level: middle
    question: |
      Что такое GraphQL? Какие проблемы он решает и какие создаёт?
    answer: |
      GraphQL — подход, при котором клиент сам описывает, какие данные ему нужны. Аналогия: REST — бизнес-ланч с
      фиксированным набором блюд, GraphQL — ресторан, где ты сам составляешь заказ.

      Три кита. Схема — контракт между клиентом и сервером: какие данные можно запрашивать, какие операции выполнять,
      как данные связаны. Запросы (queries) — клиент перечисляет нужные поля и связи, сервер собирает всё и отдаёт
      одной порцией. Резолверы — функции на сервере, которые знают, где взять каждый кусочек данных. Ещё есть мутации
      (изменение данных) и подписки (обновления в реальном времени).

      Что решает: over-fetching — не получать лишние поля; under-fetching — один запрос вместо 5–10; версионирование —
      схема эволюционирует, новые поля не ломают старые запросы. Экосистема: GraphiQL, Apollo, GraphQL Code Generator
      для TypeScript-типов, DataLoader.

      Сложности: кэширование (один эндпоинт, ключ кэша — сам запрос), тяжёлые запросы (лимиты глубины и сложности),
      проблема N+1 (на 100 пользователей — 100 запросов за постами; решается DataLoader, который группирует
      обращения). Хорошо подходит для сложных связанных данных, многих клиентов, часто меняющихся требований,
      фасада над микросервисами. Плохо — для простого CRUD и когда важны простота и скорость разработки.
    points:
      - Клиент сам выбирает поля
      - Схема, запросы, резолверы, мутации, подписки
      - Решает over- и under-fetching, версии
      - Сложности — кэш, тяжёлые запросы, N+1

  - id: open-net-012
    topic: Сети и браузер
    level: middle
    question: |
      Что такое `requestIdleCallback`?
    answer: |
      `requestIdleCallback` — API браузера, которое планирует фоновые задачи на периоды простоя, когда основной поток
      не занят важной работой (рендерингом, обработкой событий). Браузер как бы говорит: «у меня есть свободное время,
      выполни некритичную задачу, но будь готов прерваться».

      В колбэк приходит `deadline`: пока `deadline.timeRemaining() > 0`, выполняем порцию работы; если не успели —
      планируем продолжение новым `requestIdleCallback`. Отменить — `cancelIdleCallback(handle)`. Опция `timeout`
      гарантирует вызов не позже срока.

      Хорошие кандидаты: аналитика и логи, предзагрузка следующей страницы, фоновая обработка данных, некритичная
      синхронизация. Не подходит для анимаций и ввода, работы с DOM, вызывающей перерисовку, и срочных задач. React
      Fiber вдохновлялся этой идеей, но использует собственный планировщик.
    points:
      - Задачи в простое браузера
      - '`deadline.timeRemaining()` и дробление работы'
      - Аналитика, предзагрузка — да; анимации и DOM — нет
      - React — свой планировщик по той же идее

  - id: open-net-013
    topic: Сети и браузер
    level: middle
    question: |
      Из чего состоит HTTP-запрос?
    answer: |
      Четыре части. Стартовая строка: метод, путь и версия — `GET /api/users HTTP/1.1`. Заголовки. Пустая строка —
      разделитель. Тело — для `POST`, `PUT`, `PATCH`; у `GET` обычно нет, у `HEAD` никогда.

      Заголовки бывают общие (`Connection`, `Cache-Control`, `Date`), запроса (`Authorization` — Bearer или Basic,
      `User-Agent`, `Accept`, `Accept-Language`, `Accept-Encoding`, `Cookie`, `Origin`, CORS-заголовки
      `Access-Control-Request-*`, `Host`, `Referer`) и описывающие тело (`Content-Type`, `Content-Length`,
      `Content-Encoding`).

      Форматы тела: JSON — самый популярный; `application/x-www-form-urlencoded` — форма `key=value&key2=value2`;
      `multipart/form-data` — файлы, части через boundary; text/plain; XML.

      Обязателен в HTTP/1.1 только заголовок `Host`: на одном IP может жить много сайтов. В HTTP/2 и HTTP/3 хост
      передаётся псевдозаголовком `:authority`. Если есть тело — нужен `Content-Length` или `Transfer-Encoding:
      chunked`. HTTP/1.1 — текстовый протокол, HTTP/2 и 3 — бинарные.
    points:
      - Стартовая строка, заголовки, пустая строка, тело
      - Host обязателен в HTTP/1.1
      - JSON, form-urlencoded, multipart
      - Authorization, Content-Type, Accept

  - id: open-net-014
    topic: Сети и браузер
    level: middle
    question: |
      Как работает браузер от отправки запроса до отрисовки? Что такое критический путь рендеринга?
    answer: |
      Критический путь рендеринга — минимальная цепочка шагов до первого кадра: HTML → DOM, CSS → CSSOM, дерево
      рендеринга, layout, paint. CSS блокирует отрисовку и выполнение скриптов, поэтому критичный CSS делают маленьким и
      грузят первым.

      DNS: сначала браузер узнаёт IP-адрес домена. Ответ кэшируется на время TTL в браузере и ОС, чтобы не спрашивать
      DNS снова. Затем TCP-рукопожатие — стороны договариваются о параметрах соединения. Для HTTPS — ещё
      TLS-рукопожатие (раньше SSL), чтобы соединение было защищённым.

      Затем GET за HTML. По механизму TCP slow start сервер в первом «раунде» может отправить около 14 КБ, дальше
      окно растёт вдвое, пока не упрётся в пропускную способность. Поэтому критичный контент стараются уместить в
      первые 14 КБ. Браузер начинает разбирать HTML, как только получает первые данные.

      Первый шаг — построение DOM: дерево объектов, представляющее страницу. Картинки и CSS не останавливают разбор.
      Обычный `<script>` без `async` и `defer` блокирует разбор до загрузки и выполнения. Сканер предзагрузки заранее
      находит CSS, скрипты и шрифты и начинает их качать, не дожидаясь парсера. `async` — скрипт выполняется сразу
      после загрузки, порядок не гарантирован, для независимых скриптов (счётчики). `defer` — выполняется после разбора
      HTML, в порядке документа, до `DOMContentLoaded`.

      Второй шаг — CSSOM, то же для стилей; параллельно компиляция JS и дерево доступности. Третий — DOM и CSSOM
      объединяются в дерево рендеринга. Четвёртый — layout (reflow): геометрия каждого узла. `display: none` в нём не
      участвует, а `visibility: hidden` и псевдоэлементы с `content` — участвуют. Изменение размеров вызывает reflow,
      и чем глубже элемент, тем больше он задевает. Затем paint (repaint) — записи о том, как рисовать: цвет, фон,
      `visibility` меняют только перекраску. Наконец composite — элементы группируются по слоям, растрируются
      плитками в потоке композитора и склеиваются; поэтому анимации делают через `transform` и `opacity`, которые
      меняются на этапе композиции, часто с помощью GPU.

      События загрузки: `DOMContentLoaded` — DOM построен; `load` — загружены все ресурсы; `readystatechange`
      (`loading`, `interactive`, `complete`); `beforeunload`; `pagehide` и `pageshow`; `visibilitychange`.
    points:
      - DNS → TCP → TLS → HTML
      - DOM, CSSOM, render tree
      - async и defer, сканер предзагрузки
      - layout → paint → composite
      - transform и opacity для анимаций

  - id: open-net-015
    topic: Сети и браузер
    level: middle
    question: |
      Какие есть методы оптимизации загрузки страницы?
    answer: |
      Минификация файлов. Уменьшение числа HTTP-запросов: объединение CSS и JS, inline-картинки в CSS, SVG-спрайты (на
      HTTP/2 это менее критично). Кэширование. Сжатие изображений и современные форматы. CDN — сеть серверов по всему
      миру с копиями файлов: пользователь получает данные с ближайшего, и скорость растёт.

      Оптимизация кода: CSS в начале страницы, скрипты в конце или с `defer`, чтобы браузер начал рисовать до запуска
      скриптов. Ленивая загрузка — контент грузится, когда нужен: при прокрутке, клике или в фоне. Уменьшение влияния
      стороннего кода: плееры, виджеты соцсетей, реклама, скрипты метрик. Ещё — code splitting, tree shaking, сжатие
      gzip и Brotli, `preload` и `preconnect`.

      Чтобы проверить сайт в плохих условиях, в DevTools есть сетевой тротлинг: он искусственно замедляет интернет и
      помогает найти проблемы загрузки.
    points:
      - Минификация, сжатие, меньше запросов
      - Кэш и CDN
      - CSS сверху, скрипты с `defer`
      - Lazy loading, меньше стороннего кода
      - Тротлинг в DevTools для проверки

  - id: open-net-016
    topic: Сети и браузер
    level: middle
    question: |
      В чём разница между асинхронностью и параллельностью?
    answer: |
      Простая аналогия: параллельность — два повара готовят на разных плитах одновременно; асинхронность — один повар
      ставит суп вариться, пока он варится, режет овощи для салата, потом возвращается к супу.

      Асинхронность — выполнение задач без блокировки основного потока: задачи стартуют, продолжаются в фоне
      (например, сетевой запрос делает окружение), а результат обрабатывается позже. Обычно один поток выполнения,
      неблокирующие операции, событийная архитектура, колбэки, промисы, async/await, event loop.

      Параллельность (parallelism) — несколько задач выполняются буквально одновременно на разных ядрах: несколько
      потоков или процессов, Web Workers, `worker_threads`. Отсюда проблемы синхронизации — гонки и дедлоки — и
      разделяемая память или обмен сообщениями. Конкурентность (concurrency) шире: задачи перемежаются за один период
      времени, но не обязательно в один момент.
    points:
      - Асинхронность — не ждать, один поток
      - Параллельность — одновременно на ядрах
      - Конкурентность — перемежение задач
      - Гонки и дедлоки — проблемы параллельности

  - id: open-net-017
    topic: Сети и браузер
    level: middle
    question: |
      Какие уязвимости веб-приложений (OWASP) ты знаешь и как от них защищаться?
    answer: |
      OWASP — открытый проект по безопасности веб-приложений.

      XSS — внедрение вредоносного скрипта, который выполняется в браузере жертвы. Защита: экранирование (React
      экранирует `{userInput}` сам), не использовать `dangerouslySetInnerHTML` и `innerHTML` без санитизации
      (DOMPurify), `textContent` вместо `innerHTML`, валидация на сервере, CSP. DOM-based XSS — когда опасные данные
      (например, из `location`) попадают в `innerHTML` или `eval`.

      CSRF — злоумышленник заставляет браузер жертвы отправить запрос на доверенный сайт. Защита: CSRF-токен,
      сгенерированный сервером и присланный в форме или заголовке `X-CSRF-Token`, плюс `SameSite` у кук.

      Clickjacking — страницу встраивают в невидимый iframe и обманом заставляют кликнуть. Защита: `X-Frame-Options:
      DENY` или `SAMEORIGIN`, либо CSP `frame-ancestors 'self'`; frame-busting на JS ненадёжен. Для своих iframe —
      атрибут `sandbox`.

      Prototype pollution — пользовательский ввод с ключом `__proto__` попадает в слияние объектов и меняет
      `Object.prototype`. Защита: не сливать ввод в объекты без проверки ключей (`__proto__`, `constructor`,
      `prototype`), `Object.create(null)`, обновлённые библиотеки.

      MIME sniffing — браузер «угадывает» тип и исполняет текст как скрипт. Защита: правильный `Content-Type` и
      `X-Content-Type-Options: nosniff`.

      MITM — перехват трафика. Защита: HTTPS везде, без mixed content, HSTS (`Strict-Transport-Security`) против
      понижения до HTTP, SRI (`integrity`) для скриптов с CDN.

      Неверная CORS-настройка — сервер отражает любой Origin с `Allow-Credentials: true`, и чужой сайт читает данные
      пользователя. Защита: белый список origin. `*` допустим для публичных данных без кук.

      Web Storage — localStorage и sessionStorage читаются любым скриптом при XSS, поэтому токены и пароли там не
      хранят — только HttpOnly-куки. Шифрование на клиенте не спасает: ключ тоже на клиенте.
    points:
      - XSS — экранирование, санитизация, CSP
      - CSRF — токены и SameSite
      - Clickjacking — frame-ancestors, X-Frame-Options
      - Prototype pollution, MIME sniffing, MITM
      - CORS — белый список, токены не в Storage

  - id: open-net-018
    topic: Сети и браузер
    level: middle
    question: |
      Что такое CORS? Что такое простые и непростые запросы и preflight?
    answer: |
      По умолчанию браузер действует по политике одного источника (same-origin policy) и не даёт скрипту читать ответы
      с другого источника. CORS (Cross-Origin Resource Sharing) — механизм, которым сервер заголовками разрешает
      конкретным источникам доступ к своим ресурсам. Ошибку CORS всегда выдаёт браузер клиента.

      Простые запросы уходят без проверки, браузер добавляет `Origin` и смотрит на `Access-Control-Allow-Origin` в
      ответе. Простой — когда метод `GET`, `HEAD` или `POST`; заголовки только из безопасного списка (`Accept`,
      `Accept-Language`, `Content-Language`, `Content-Type`, `Range`); `Content-Type` — только
      `application/x-www-form-urlencoded`, `multipart/form-data` или `text/plain`.

      Непростые — методы `PUT`, `DELETE`, `PATCH`; заголовки вроде `Authorization`, `X-API-Key`; `Content-Type:
      application/json`. Перед ними браузер шлёт preflight — `OPTIONS` с `Origin`, `Access-Control-Request-Method` и
      `Access-Control-Request-Headers`. Сервер отвечает `Access-Control-Allow-Origin`, `-Methods`, `-Headers`,
      `-Credentials` (разрешает куки и авторизацию) и `-Max-Age` (кэш preflight, например на час; Chromium больше 2 часов не держит). Если ответ
      подходит — уходит основной запрос, иначе ошибка.

      Сами по себе куки (`credentials: 'include'`) preflight не вызывают, но требуют `Allow-Credentials: true` и
      конкретного origin вместо `*`. Где можно, запросы делают простыми, чтобы не тратить лишний round trip.
    points:
      - Same-origin policy, CORS её ослабляет
      - Простые — GET/HEAD/POST и безопасные заголовки
      - JSON, Authorization, PUT/DELETE — preflight
      - Allow-Origin, -Methods, -Headers, -Credentials, -Max-Age

  - id: open-net-019
    topic: Сети и браузер
    level: middle
    question: |
      Что такое Web API браузера? Какие знаешь?
    answer: |
      Браузерные Web API — набор встроенных интерфейсов, через которые JS взаимодействует с браузером, ОС, железом и
      внешними ресурсами. Доступны через `window`, `navigator`, `document`, описаны стандартами W3C и WHATWG.

      DOM API — создавать, менять и удалять элементы. Fetch API — HTTP-запросы на промисах, заменил XMLHttpRequest.
      Geolocation — координаты пользователя, с его разрешения. Web Storage — `localStorage` и `sessionStorage`.
      Canvas — 2D и 3D графика. Web Audio — воспроизведение, синтез, эффекты. WebRTC — видео- и аудиозвонки и P2P;
      для установки соединения всё равно нужен сигнальный сервер и STUN/TURN. Service Workers — кэш, офлайн, push.
      Intersection Observer — видимость элементов, ленивая загрузка. MediaDevices — камера и микрофон через
      `getUserMedia`.

      History API — управление историей без перезагрузки: `pushState` добавляет запись и меняет URL, `replaceState`
      заменяет текущую, `back`, `forward`, `go`, событие `popstate` при навигации. На нём построены роутеры SPA.
    points:
      - DOM, Fetch, Storage
      - Canvas, Audio, WebRTC, MediaDevices
      - Service Workers, Intersection Observer
      - History — `pushState`, `replaceState`, `popstate`

  - id: open-net-020
    topic: Сети и браузер
    level: middle
    question: |
      Что такое трёхстороннее рукопожатие?
    answer: |
      Это установка TCP-соединения в три шага. Клиент отправляет серверу SYN со случайным начальным номером
      последовательности. Сервер отвечает SYN-ACK: свой начальный номер и подтверждение — номер клиента плюс один.
      Клиент отправляет ACK — номер сервера плюс один. Теперь обе стороны знают параметры и могут обмениваться
      данными.

      Для HTTPS после этого идёт ещё TLS-рукопожатие. Каждое рукопожатие стоит времени (round trip), поэтому помогают
      keep-alive, `preconnect`, TLS 1.3 и QUIC в HTTP/3.

      Не путать с атакой Triple Handshake (2014) — это уязвимость TLS, при которой злоумышленник вставал между
      клиентом и сервером. Защита от неё — обновлённые реализации TLS; к TCP-рукопожатию она отношения не имеет.
    points:
      - SYN → SYN-ACK → ACK
      - Обмен начальными номерами
      - Потом TLS для HTTPS
      - Triple Handshake — другая история, атака на TLS

  - id: open-net-021
    topic: Сети и браузер
    level: middle
    question: |
      Что такое кеширование в браузере, какие бывают кеши? Чем `no-cache` отличается от `no-store`?
    answer: |
      Кеширование — сохранение ресурсов (HTML, JS, CSS, картинок) для повторного использования без новой загрузки.

      Типы. HTTP-кэш — сервер вместе с ответом присылает заголовки (`Cache-Control`), которые говорят, как долго и при
      каких условиях хранить ресурс; при повторном запросе браузер сначала смотрит в кэш. Кэш Service Worker —
      программное управление кэшем. DNS-кэш — адрес домена хранится на время TTL (например, 3600 секунд) в браузере и
      ОС, и повторного запроса к DNS нет.

      `no-store` — абсолютный запрет: ни браузер, ни прокси, ни CDN не сохраняют ответ, каждый раз полный запрос. Для
      личных и финансовых данных. `no-cache` — хранить можно, но перед использованием надо спросить сервер, не
      изменился ли файл; ответ `304 Not Modified` — берём из кэша. Для файлов, которые меняются в любой момент.

      Стратегия для SPA. Файлы сборки с хэшем в имени (`main.a8f2b3.js`) — `Cache-Control: public, max-age=31536000,
      immutable`: новый код получит новое имя, а старый файл можно кэшировать «намертво». `index.html` — `no-cache`
      (или `max-age=0, must-revalidate`): в нём ссылки на актуальные чанки, его проверяют при каждом визите. Сервер
      понимает, изменился ли файл, по `ETag`: браузер присылает его в `If-None-Match`, совпало — `304` без тела.

      Service Worker и Workbox: cache first — для шрифтов и иконок; network first — для свежих данных; stale-while-
      revalidate — мгновенно из кэша и обновление в фоне.
    points:
      - HTTP-кэш, кэш Service Worker, DNS-кэш
      - '`no-store` — не хранить, `no-cache` — хранить и проверять'
      - Хэшированные файлы — `immutable`, `index.html` — `no-cache`
      - ETag и 304
      - Cache first, network first, SWR

  # ===================== Архитектура =====================
  - id: open-arch-001
    topic: Архитектура
    level: middle
    question: |
      Что такое CI/CD и как настроить оптимальный пайплайн для крупного фронтенда?
    answer: |
      CI/CD (непрерывная интеграция и непрерывная доставка) — автоматизация сборки, тестирования и доставки новых
      версий продукта всем заинтересованным: разработчикам, QA, заказчику, пользователям. Принципы: распределение
      ответственности, сокращение рисков, быстрая обратная связь, общая рабочая среда. Этапы: написание кода и
      интеграция в основную ветку, автоматическая сборка и тесты (Jenkins или другой CI-сервер), ручное
      тестирование, релиз, развёртывание, поддержка и мониторинг, планирование — и цикл заново.

      Скорость пайплайна влияет на time-to-market: если сборка ветки идёт 40 минут — это провал. Оптимальный пайплайн
      держится на изоляции, кэшировании и параллельности, и я делю его на три слоя.

      Валидация (PR, 3–5 минут): локальные проверки husky и lint-staged ещё до пуша; линтер и `tsc --noEmit` в
      параллельных джобах; unit- и интеграционные тесты, поделённые на шарды через матрицу (`vitest --shard=1/4`);
      E2E на Playwright с шардингом, логи и скриншоты ошибок — в артефакты.

      Сборка: кэш пакетного менеджера по хэшу lock-файла; Turborepo или Nx с удалённым кэшем — неизменённые пакеты не
      собираются, готовый результат скачивается по хэшу исходников; кэш компиляторов (`.next/cache`).

      Поставка: статика по принципу неизменяемости — каждая сборка в своей папке в объектном хранилище по id коммита;
      атомарное переключение версии на CDN, чтобы пользователи не ловили `ChunkLoadError`; канареечные релизы на 1–5%
      пользователей с мониторингом ошибок в Sentry и автоматическим откатом.
    points:
      - Автоматизация сборки, тестов, доставки
      - Валидация — параллельные линт, типы, шарды тестов
      - Сборка — кэш по lock-файлу, удалённый кэш Turborepo/Nx
      - Поставка — неизменяемые сборки, атомарный релиз, canary

  - id: open-arch-002
    topic: Архитектура
    level: middle
    question: |
      Что такое code splitting?
    answer: |
      Разделение кода приложения на несколько отдельных файлов — чанков.

      Зачем: уменьшить размер начальной загрузки, загружать код по мере необходимости (ленивая загрузка), загружать
      части параллельно.

      Типичные подходы: по страницам (маршрутам) — каждая страница свой чанк; по компонентам — тяжёлые компоненты
      загружаются по клику; по библиотекам — React, Lodash выносятся отдельно. Пример: главная страница — 100 КБ, а
      страница «О нас» (50 КБ) скачивается, только когда пользователь туда перешёл. Механизм — динамический
      `import()`, в React — `React.lazy`.
    points:
      - Код на чанки
      - Меньше начальная загрузка, ленивая подгрузка
      - По маршрутам, компонентам, библиотекам
      - '`import()` и `React.lazy`'

  - id: open-arch-003
    topic: Архитектура
    level: middle
    question: |
      Что такое Event Sourcing и CQRS?
    answer: |
      Event Sourcing — хранение не состояния, а истории событий. Обычное приложение хранит баланс счёта, Event
      Sourcing — банковскую выписку со всеми операциями: «пополнение +1000», «покупка −300», «перевод −200». Чтобы
      получить баланс, события суммируют.

      CQRS (Command Query Responsibility Segregation) — разделение операций записи и чтения. Команда меняет данные,
      запрос их получает. Модель записи оптимизирована для валидации и бизнес-логики, модель чтения — для быстрых
      запросов и отчётов.

      Вместе: пользователь → команда → событие → сохранение в event store → обновление модели чтения → UI. Например,
      «Добавить в корзину»: модель команд проверяет, можно ли; создаётся событие `ITEM_ADDED_TO_CART`; модель чтения
      обновляет «корзину пользователя»; UI показывает её.

      На фронте похожие идеи: Redux-actions как события и селекторы как модель чтения, XState с событиями, RxJS как
      поток событий. Использовать стоит в сложных приложениях, где нужна история действий, коллаборация (редакторы,
      доски), воспроизводимость. Не стоит — для простого CRUD и когда важна простота.
    points:
      - Event Sourcing — журнал событий вместо состояния
      - CQRS — раздельные модели записи и чтения
      - Команда → событие → read model → UI
      - Не для простого CRUD

  - id: open-arch-004
    topic: Архитектура
    level: middle
    question: |
      Что такое Feature-Sliced Design?
    answer: |
      В FSD проект состоит из слоёв (layers), слой — из срезов (slices), срез — из сегментов (segments). Ключевая
      особенность — иерархия: верхние слои могут использовать только нижние. Сущности не используют фичи, фичи — виджеты
      и страницы. При этом чем ниже модуль, тем опаснее его рефакторинг: от него зависит всё, что выше.

      Слои сверху вниз. `app` — настройки, стили, провайдеры для всего приложения. `processes` — сложные сценарии на
      несколько страниц, слой устарел. `pages` — сборка страниц. `widgets` — самостоятельные блоки из сущностей и фич
      (лента, шапка, окно чата). `features` — действия пользователя с бизнес-ценностью (отправить комментарий,
      добавить в корзину). `entities` — бизнес-сущности (пользователь, товар, заказ). `shared` — переиспользуемый код без
      бизнес-специфики: UI-kit, утилиты, API-клиент; если функцию можно взять и в интернет-магазин, и в онлайн-
      бухгалтерию, — это `shared`. Обязательных слоёв нет: обычно есть хотя бы `app`, `pages` и `shared`.

      Срезы — подкаталоги внутри слоя по бизнес-смыслу. Срезы одного слоя не используют друг друга напрямую,
      композицию делает слой выше. У `app` и `shared` срезов нет. Сегменты делят срез по техническому назначению: `ui`,
      `model` (бизнес-логика, стор, эффекты), `lib`, `config`, `api`.

      У каждого среза есть публичный API — `index`-файл, через который с ним взаимодействуют снаружи.
    points:
      - Слои → срезы → сегменты
      - Импорт только вниз
      - app, pages, widgets, features, entities, shared
      - Срезы одного слоя не импортируют друг друга
      - Публичный API среза

  - id: open-arch-005
    topic: Архитектура
    level: middle
    question: |
      Что такое KISS, DRY, YAGNI?
    answer: |
      KISS (keep it simple, stupid — «делай проще») — любая система работает лучше всего, если она проста. Простота
      должна быть ключевой целью проектирования. Например, сложное условие `(a && b) || (!a && c && d)` лучше вынести в
      функцию с понятным именем.

      DRY (don't repeat yourself — «не повторяйся») — вместо копирования одного и того же кода в нескольких местах
      вынести его в функцию.

      YAGNI (you aren't gonna need it — «вам это не понадобится») — не нужно писать код, который может пригодиться в
      будущем, но сейчас в нём потребности нет.
    points:
      - KISS — простота
      - DRY — без дублирования
      - YAGNI — без кода «на будущее»

  - id: open-arch-006
    topic: Архитектура
    level: middle
    question: |
      Что такое offline-first архитектура?
    answer: |
      Подход, при котором приложение работает в первую очередь с локальными данными, а синхронизация с сервером
      происходит при наличии соединения.

      Принципы: приложение загружается без сети из кэша; данные сохраняются локально, когда сети нет; синхронизация
      происходит при восстановлении соединения; конфликты данных разрешаются осознанно. Инструменты — Service Worker
      и Cache Storage, IndexedDB, фоновая синхронизация.
    points:
      - Сначала локальные данные
      - Загрузка без сети
      - Синхронизация при появлении связи
      - Осознанное разрешение конфликтов

  - id: open-arch-007
    topic: Архитектура
    level: middle
    question: |
      Что такое optimistic updates?
    answer: |
      Оптимистичное обновление — паттерн, при котором UI обновляется сразу при действии пользователя, не дожидаясь
      ответа сервера. Если запрос завершится ошибкой, UI откатывается к предыдущему состоянию.

      Принципы: мгновенный отклик, откат при ошибке, запрос в фоне. Реализация: запомнить прошлое состояние, обновить
      UI, отправить запрос; при ошибке — вернуть прошлое состояние и показать сообщение.

      Сложности: конфликт изменений (два пользователя редактируют одновременно), порядок операций, сложный откат,
      расхождение UI и сервера. Решения: временные id с префиксом для новых записей, версии для разрешения конфликтов,
      debounce для массовых операций, визуальная индикация «в процессе».

      Хорошо для лайков, избранного, переключателей, быстрых форм. Избегать для финансовых операций, критичных данных,
      сложных транзакций и когда важен точный порядок. Готовые решения — TanStack Query, SWR, Apollo Client, а в
      React 19 — `useOptimistic`.
    points:
      - UI меняется сразу, запрос в фоне
      - Откат и сообщение при ошибке
      - Временные id, версии, индикация
      - Не для финансов и транзакций

  - id: open-arch-008
    topic: Архитектура
    level: middle
    question: |
      Что такое PWA? Какие у него плюсы и минусы?
    answer: |
      PWA (Progressive Web App) — технология, которая визуально и функционально превращает сайт в приложение.
      Пользователь может установить его на смартфон или компьютер как обычное приложение. От мобильной версии сайта
      отличается тем, что работает офлайн, адаптируется под устройство и выглядит почти нативно.

      Три базовые технологии: Service Worker — прокси, который кэширует ресурсы и даёт push-уведомления, поэтому
      приложение работает без интернета; HTTPS — обязательное условие для Service Worker; Web App Manifest — JSON-файл
      с названием, иконками и режимом отображения.

      Плюсы: установка в обход сторов, работа офлайн, быстрая загрузка, небольшой вес, повышение лояльности, адаптация
      под устройство, привычный вид.

      Минусы: доступ не ко всем возможностям устройства (полный доступ к контактам, NFC, Bluetooth зависит от браузера и
      ОС, хотя ограничения постепенно уходят — push-уведомления на iOS появились в 2023 году); сложнее распространять —
      пользователи ищут приложения в сторах; хуже для тяжёлых вычислений вроде обработки видео.

      Чтобы сделать офлайн-приложение, регистрируют Service Worker и при установке кэшируют в нём статические файлы.
    points:
      - Сайт, который ставится как приложение
      - Service Worker, HTTPS, Manifest
      - Офлайн, push, без сторов
      - Ограниченный доступ к устройству, распространение

  - id: open-arch-009
    topic: Архитектура
    level: middle
    question: |
      Что такое SOLID? Приведи примеры на JS и в React.
    answer: |
      Пять принципов проектирования для гибких, расширяемых и поддерживаемых систем.

      S — принцип единственной ответственности: у класса одна причина для изменения. Нарушение — класс `User` сам
      сохраняет себя в базу и печатает; исправление — `User`, `UserRepository`, `UserPrinter`. В React нарушение —
      `UserProfile` сам грузит данные, ведёт форму и рисует UI; исправление — хук `useUserData`, `UserForm` и
      отображающий `UserProfile`.

      O — открытости/закрытости: открыт для расширения, закрыт для изменения. Нарушение — `AreaCalculator` с
      `instanceof` на каждую фигуру; исправление — у каждой фигуры свой `area()`. В React — расширение через пропсы
      (`variant` у `Button`), композицию, HOC (`withConfirmation`), хуки.

      L — подстановки Лисков: подкласс должен заменять базовый без поломок. Нарушение — `Ostrich extends Bird` бросает
      ошибку в `fly()`; исправление — отдельный `FlyingBird`. В React — совместимые интерфейсы пропсов.

      I — разделения интерфейса: клиент не зависит от методов, которые не использует. Нарушение — `OldPrinter`
      вынужден реализовать `scan` и `fax`; исправление — отдельные `Printer`, `Scanner`, `Fax`. В React — не передавать
      объект `user` с десятком полей, если нужны имя и аватар; дробить хуки и контексты.

      D — инверсии зависимостей: модули верхнего уровня не зависят от нижнего, оба зависят от абстракций. Нарушение —
      `UserService` сам создаёт `MySQLDatabase`; исправление — база передаётся в конструктор. В React — компонент
      получает `fetcher` снаружи: в продакшене API, в тестах мок.
    points:
      - SRP — одна причина изменения
      - OCP — расширение без изменения
      - LSP — подкласс заменяет базовый
      - ISP — не зависеть от лишнего
      - DIP — зависеть от абстракций

  - id: open-arch-010
    topic: Архитектура
    level: middle
    question: |
      Что такое system design? Какие темы в нём важны?
    answer: |
      System design — процесс проектирования архитектуры, компонентов, модулей и интерфейсов сложной системы, обычно в
      начале проекта. Важно: архитектура и связи компонентов, выбор технологий, масштабируемость, безопасность,
      производительность, управление данными, интеграции, тестирование, документация.

      Хранение данных. SQL (MySQL, PostgreSQL, Oracle, SQL Server) — таблицы, связи через ключи, ACID-транзакции;
      плюсы — структура, целостность, SQL, права доступа; минусы — сложное проектирование и масштабирование, жёсткая
      схема. NoSQL (MongoDB, Cassandra, Redis, DynamoDB) — документы, ключ-значение, wide-column, графы; плюсы — гибкость,
      горизонтальное масштабирование; минусы — слабее транзакции и язык запросов. Шардинг — данные делятся на части
      по ключу (id, география) и лежат на разных серверах. Репликация — копии базы на нескольких серверах для
      отказоустойчивости и быстрого чтения.

      Передача данных: TCP/IP (IP доставляет пакеты, TCP — надёжное соединение), DNS (домен → IP), HTTP (запрос и
      ответ: строка, заголовки, тело), REST, WebSocket, очереди сообщений (RabbitMQ и другие) — отправитель кладёт
      сообщение в очередь, получатель забирает, когда готов.

      Масштабирование: вертикальное (мощнее сервер), горизонтальное (больше серверов), балансировка нагрузки (round
      robin — по очереди, IP hash — `хэш IP % число серверов`), кэширование, CDN.

      CAP: Consistency — все узлы видят одни данные, Availability — любой запрос обработан, Partition tolerance —
      работа при потере связи между узлами. Упрощённо — «только два из трёх»; точнее — при разрыве сети приходится
      выбирать между C и A. PACELC добавляет: при разрыве (P) — A или C, иначе (E) — задержка (L) или
      согласованность (C).
    points:
      - Архитектура, масштабирование, безопасность, данные
      - SQL vs NoSQL, шардинг, репликация
      - TCP/IP, DNS, HTTP, REST, WebSocket, очереди
      - Балансировка, кэш, CDN
      - CAP и PACELC

  - id: open-arch-011
    topic: Архитектура
    level: middle
    question: |
      Что такое TDD и BDD? Чем они отличаются?
    answer: |
      TDD (Test-Driven Development) — разработка через тестирование. Аналогия: обычная разработка — построить дом и
      проверить; TDD — нарисовать чертёж (тест), построить по нему и проверить по чертежу. Цикл: красный — пишем
      падающий тест; зелёный — минимальный код, чтобы тест прошёл; рефакторинг — улучшаем код, тесты должны
      проходить.

      BDD (Behavior-Driven Development) — разработка через поведение. TDD отвечает на вопрос «что тестировать»
      (технические детали), BDD — «зачем» (бизнес-ценность, поведение). Формат: Given — начальное состояние, When —
      действие пользователя, Then — ожидаемый результат.

      TDD: плюсы — раннее обнаружение багов, тесты как документация, продуманный интерфейс, безопасный рефакторинг;
      минусы — медленнее на простых задачах, сложно новичкам, лишние тесты тривиального кода, сложно для часто
      меняющегося UI.

      BDD: плюсы — общий язык с бизнесом и QA, фокус на поведении, `.feature`-файлы как спецификация, приёмочные тесты
      можно показывать заказчику; минусы — поддержка шагов и сценариев, медленные E2E, хрупкость, нужна инфраструктура.
    points:
      - TDD — Red → Green → Refactor
      - BDD — Given / When / Then
      - TDD про технику, BDD про поведение
      - Плюсы и минусы каждого

  - id: open-arch-012
    topic: Архитектура
    level: middle
    question: |
      Что такое tree shaking и когда он даёт сбой?
    answer: |
      Tree shaking — удаление неиспользуемого кода при сборке. Сборщик «трясёт» модуль библиотеки и отбрасывает
      функции, которые никто не импортирует, — бандл меньше и быстрее.

      Как работает: опирается на статический анализ ES-модулей (`import`/`export`). В отличие от CommonJS
      (`require`), где импорт может быть внутри `if`, ESM-импорты известны до выполнения. Сборщик строит граф
      зависимостей от точки входа, помечает использованное, остальное не попадает в бандл.

      Настройка в webpack: ES-модули, `mode: 'production'` и поле `"sideEffects": false` в `package.json` (или список
      файлов с эффектами, например `["*.css"]`).

      Когда ломается. Побочные эффекты при импорте — модуль меняет `window`, прототипы, вешает слушатели: сборщик
      боится его удалять. IIFE и вызовы на верхнем уровне — помогает комментарий `/*@__PURE__*/`. Экспорт одного
      большого объекта вместо отдельных функций — объект не режется по свойствам. Транспиляция в CommonJS до
      бандлинга — следить, чтобы в `tsconfig.json` `module` был `ESNext` или подобный. Пример выгоды — импорт одной
      функции из lodash-es вместо всей библиотеки.
    points:
      - Удаление неиспользуемых экспортов
      - Только ES-модули, статический анализ
      - '`"sideEffects": false`'
      - Ломают — эффекты, объекты-экспорты, CommonJS

  - id: open-arch-013
    topic: Архитектура
    level: middle
    question: |
      Какие архитектуры фронтенда ты знаешь?
    answer: |
      MVC — модель (данные и логика), представление (UI), контроллер (обработка ввода). Чёткое разделение, но много
      boilerplate и сложно масштабировать. Backbone, AngularJS.

      MVVM — ViewModel связывает модель и представление, часто двусторонней привязкой. Vue, Knockout. Меньше кода для
      динамических форм, сложнее отлаживать.

      Flux — однонаправленный поток: action → dispatcher → store → view. Redux, Vuex, NgRx. Предсказуемость и
      time-travel отладка, но boilerplate.

      Компонентная — приложение из переиспользуемых компонентов с UI, логикой и состоянием. React, Vue, Angular,
      Svelte. Риск prop drilling.

      Atomic Design — атомы, молекулы, организмы, шаблоны, страницы. Для дизайн-систем, избыточно для маленьких
      проектов.

      Микрофронтенды — независимые части UI у разных команд (single-spa, Module Federation). Независимые релизы, но
      сложная интеграция.

      SSR и SSG — рендеринг на сервере или при сборке (Next.js, Nuxt, Gatsby). SEO и скорость, но гидратация и сервер.

      FSD — слои по бизнес-смыслу (`app`, `pages`, `widgets`, `features`, `entities`, `shared`), импорт только вниз. Для
      больших приложений с множеством фич.

      Луковая (чистая) — в центре домен без зависимостей, вокруг application, infrastructure, presentation;
      зависимости направлены внутрь. Тестируемость, но много абстракций.

      Модульная — общий принцип: независимые модули с публичным API (`index`), слабая связанность и высокое
      зацепление. Применяется внутри других подходов.
    points:
      - MVC, MVVM, Flux
      - Компонентная, Atomic Design
      - Микрофронтенды, SSR/SSG
      - FSD, луковая, модульная

  - id: open-arch-014
    topic: Архитектура
    level: middle
    question: |
      В чём разница между SSR, SSG, ISR и Partial Hydration? Какие проблемы решает Streaming SSR?
    answer: |
      Стратегия рендеринга — баланс между нагрузкой на сервер, скоростью отображения (TTFB, LCP) и интерактивностью.

      SSR — на каждый запрос сервер генерирует HTML со свежими данными. Плюсы — актуальность и SEO; минусы — нагрузка на
      сервер и TTFB выше, чем у статики. SSG — HTML собирается один раз при билде и раздаётся с CDN: минимальный TTFB,
      почти нулевая нагрузка, но данные устаревают, а изменения требуют пересборки. ISR — компромисс: статика с
      `revalidate`; после истечения срока пользователь получает старый кэш, а сервер в фоне собирает новую версию для
      следующих.

      Проблема гидратации: клиент получает готовый HTML, но страница «мёртвая», пока не скачан весь JS и не прошла
      гидратация — клики не работают, страдает INP. Partial Hydration (острова, Astro): страница — статичный HTML,
      почти ноль JS, а JS оживляет только интерактивные острова, причём можно откладывать — например, `client:visible`.

      Streaming SSR (React 18+, Next.js App Router через `<Suspense>`) снимает принцип «всё или ничего» классического
      SSR, где сервер ждёт все данные, а браузер — весь HTML и JS. Сервер сразу отдаёт оболочку страницы потоком,
      медленные части дописывает в тот же поток по готовности, а браузер подменяет лоадеры на контент. Селективная
      гидратация: оживают уже пришедшие части, а если пользователь кликнул по ещё не гидрированному блоку, React
      повышает его приоритет.
    points:
      - SSR — на запрос, SSG — при сборке, ISR — фоновое обновление
      - Гидратация делает страницу «мёртвой» до загрузки JS
      - Острова — JS только для интерактивных частей
      - Streaming — поток по готовности и селективная гидратация

  - id: open-arch-015
    topic: Архитектура
    level: middle
    question: |
      Что такое запахи кода? Какие знаешь?
    answer: |
      Запахи кода — признаки того, что код пора рефакторить. Их группируют.

      Раздувальщики: Long Method (метод длиннее ~10 строк — повод задуматься), Large Class, Primitive Obsession
      (примитивы вместо маленьких объектов для денег, диапазонов, телефонов; константы для кодирования ролей), Long
      Parameter List (больше 3–4 параметров), Data Clumps (одинаковые группы переменных — пора в класс).

      Нарушители ООП: Switch Statements, Temporary Field (поле нужно только иногда), Refused Bequest (подкласс
      использует малую часть родителя), Alternative Classes with Different Interfaces.

      Утяжелители изменений: Divergent Change (одно изменение — правки многих методов класса), Shotgun Surgery (одно
      изменение — мелкие правки во многих классах), Parallel Inheritance Hierarchies.

      Замусориватели: множество поясняющих комментариев, Duplicate Code, Lazy Class, Data Class (только поля и
      геттеры-сеттеры), Dead Code, Speculative Generality (код «на будущее»).

      Опутыватели связями: Feature Envy (метод больше работает с чужими данными), Inappropriate Intimacy, Message
      Chains (`a.b().c().d()`), Middle Man (класс только делегирует).

      Ещё — Incomplete Library Class: библиотека перестала удовлетворять требованиям, а изменить её нельзя.
    points:
      - Раздувальщики — длинные методы, классы, параметры
      - Нарушители ООП — switch, refused bequest
      - Утяжелители изменений — shotgun surgery
      - Замусориватели — дубли, мёртвый код
      - Связи — feature envy, цепочки вызовов, посредники

  - id: open-arch-016
    topic: Архитектура
    level: middle
    question: |
      Как code splitting и tree shaking работают в разных сборщиках?
    answer: |
      Webpack. Tree shaking — в production: помечает использованные экспорты, а минификатор (Terser) удаляет
      неиспользуемый код; требует ES-модулей. Code splitting — тремя способами: entry points, динамический `import()`,
      SplitChunksPlugin, который сам выносит общие зависимости и `node_modules` и следит за дублированием.

      Vite. В разработке отдаёт браузеру нативные ES-модули без сборки — tree shaking там нет. Продакшн-сборка на
      Rollup (в Vite 8 — на Rolldown): агрессивный tree shaking, автоматическое разделение по динамическим импортам и
      `node_modules`, вынос общего кода.

      Rollup — специализируется на библиотеках, tree shaking — основная фича и один из самых точных. Динамические
      импорты автоматически дают чанки, с `output.dir` вместо одного файла получается каталог чанков.

      esbuild — сверхбыстрый, tree shaking попроще, code splitting только для формата ESM и долго считался
      экспериментальным.
    points:
      - Webpack — production, SplitChunksPlugin
      - Vite — без сборки в dev, Rollup/Rolldown в prod
      - Rollup — библиотеки, точный tree shaking
      - esbuild — скорость, splitting только для ESM

  - id: open-arch-017
    topic: Архитектура
    level: middle
    question: |
      Как организовать стейт-менеджмент в масштабируемом приложении?
    answer: |
      Главная ошибка — складывать все данные в один глобальный стор. Стейт делят по природе и жизненному циклу на
      четыре слоя.

      Серверный стейт — данные с бэкенда, которые кэшируются и обновляются: списки, корзина, каталог. Управляют им
      TanStack Query или RTK Query: кэш с stale-while-revalidate, дедупликация запросов, пагинация, бесконечная
      прокрутка, ошибки, оптимистичные обновления. Глобальный стор здесь не нужен.

      Глобальный клиентский — нужен в несвязанных частях: тема, сессия, локаль, уведомления. Zustand — дефолт для
      большинства SPA: минимум бойлерплейта, хуки, хороший TypeScript, без провайдера, подписка через селекторы.
      Redux Toolkit — большие enterprise-проекты со строгой стандартизацией, middleware и DevTools с time travel, или
      легаси на Redux. MobX и Valtio — proxy-подход для огромного числа часто меняющихся связанных данных (котировки,
      редакторы): перерисовываются только компоненты, чьё свойство изменилось, но «магию» легко сломать. Effector —
      сверхсложная бизнес-логика, отделённая от UI, событийная модель, высокий порог входа.

      Локальный — живёт с компонентом: шторка, валидность поля, выбранный таб. `useState` и `useReducer`. Не поднимать
      выше, чем нужно.

      URL — фильтры, сортировка, поиск, открытые модалки, которыми хотят поделиться ссылкой. Через роутер
      (`useSearchParams`), ссылка — единственный источник правды.

      Паттерны: нормализация связанных сущностей по `id` (в RTK — `createEntityAdapter`), изоляция модулей — у каждой
      фичи свой слайс, чужой стейт меняют только через публичный API.
    points:
      - Серверный — TanStack Query / RTK Query
      - Глобальный — Zustand, RTK, MobX, Effector
      - Локальный — useState
      - URL — фильтры и поиск
      - Нормализация и изоляция модулей

  - id: open-arch-018
    topic: Архитектура
    level: middle
    question: |
      Как спроектировать крупное фронтенд-приложение с нуля?
    answer: |
      Я разбиваю на четыре этапа: анализ требований и макро-архитектура, внутренняя структура, работа с данными,
      инфраструктура.

      Макро-архитектура зависит от структуры команд и релизных циклов. Монорепозиторий (Nx, Turborepo) — когда
      приложение крупное, но работает одна большая команда или несколько смежных: общие библиотеки (UI-kit, утилиты,
      core), контроль связей, быстрый CI за счёт кэша. Микрофронтенды (Module Federation, Web Components) — только
      если проект делят независимые команды со своими релизами, бэклогом и, возможно, стеком; минус — сложная
      инфраструктура, шаринг зависимостей и сквозное тестирование.

      Внутренняя структура — FSD, чтобы не было «спагетти» из импортов: `shared`, `entities`, `features`, `widgets`,
      `pages`, `app`, импорт только вниз.

      Данные: разделение серверного стейта (React Query, RTK Query) и минимального клиентского. Контракты — TypeScript-
      типы, генерируемые из спецификации бэкенда (`openapi-typescript` по Swagger), чтобы фронт и бэк не
      рассинхронизировались.

      Инфраструктура: ESLint с правилами на импорты (плагин FSD), Prettier, husky и lint-staged; статика через CDN с
      правильным кэшированием и failover; мониторинг ошибок (Sentry) и RUM-метрик производительности.
    points:
      - Монорепо или микрофронтенды — по командам
      - FSD внутри
      - Серверный и клиентский стейт, типы из OpenAPI
      - Линт, CDN, Sentry, RUM

  - id: open-arch-019
    topic: Архитектура
    level: middle
    question: |
      Что такое микрофронтенды и Module Federation?
    answer: |
      Module Federation — плагин, изначально для webpack, который позволяет делить код между несколькими независимыми
      приложениями и динамически загружать его в браузере. Сценарии: несколько приложений должны работать вместе,
      приложение слишком большое, нужна загрузка только нужного кода, общие компоненты для нескольких приложений.

      Хостовое приложение в конфиге получает имя `host`, в `remotes` указывается удалённое приложение и адрес его
      `remoteEntry.js`, в `shared` — общие зависимости (React, ReactDOM). Удалённое — имя `remote`, в `exposes` — что оно
      отдаёт (например, `./Button`), те же `shared` и `publicPath`, откуда грузить его файлы.

      Что дают микрофронтенды: проще координация — у каждой команды своя зона; независимое развёртывание; короче цикл
      поставки; части меньше монолита и проще для понимания; изоляция ошибок.

      Против монолита: дольше старт (нужна инфраструктура), возможны дубли зависимостей (если не делать их
      синглтонами), сложный hot reload между проектами, сложнее интеграционные тесты, много сервисов в деплое,
      обновление зависимостей в каждом проекте, дольше онбординг.
    code: |
      // хост
      new ModuleFederationPlugin({
        name: 'host',
        remotes: { remote: 'remote@http://localhost:3001/remoteEntry.js' },
        shared: ['react', 'react-dom'],
      });

      // удалённое приложение
      new ModuleFederationPlugin({
        name: 'remote',
        exposes: { './Button': './src/Button' },
        shared: ['react', 'react-dom'],
      });
    codeLang: js
    points:
      - Код делится между приложениями в рантайме
      - host — remotes, remote — exposes, оба — shared
      - Автономия команд и независимый деплой
      - Цена — инфраструктура, дубли, тесты

  - id: open-arch-020
    topic: Архитектура
    level: middle
    question: |
      Расскажи о принципах ООП. Что такое ad-hoc полиморфизм?
    answer: |
      Четыре принципа. Инкапсуляция — скрытие внутренней реализации и защита данных: `#balance` меняется только через
      `deposit`. Наследование — новые классы на основе существующих: `class Dog extends Animal`. Полиморфизм — объекты
      разных классов обрабатываются через общий интерфейс: у собаки и кошки свой `speak()`, а вызываем одинаково.
      Абстракция — сокрытие сложности: у двигателя наружу только `start()`.

      Ad-hoc полиморфизм — перегрузка функций и операторов: одна функция ведёт себя по-разному в зависимости от типов
      аргументов (`add` для чисел и строк, `operator+` в C++). Он разрешается при компиляции, а не в рантайме; в C++
      компилятор фактически создаёт разные функции. Это полиморфизм функций, а не объектов: нет единого интерфейса, и
      новый тип требует новой перегрузки. В TypeScript перегрузки — только сигнатуры для проверки типов, а реализация
      одна. Поэтому ad-hoc иногда называют «ненастоящим», в отличие от универсального: полиморфизма подтипов (общий
      интерфейс, позднее связывание, новый класс добавляется без изменения старого кода) и параметрического
      (дженерики).

      В JavaScript перегрузки нет, но оператор `+` сам выбирает поведение по типам в рантайме — это динамическая
      типизация и приведение типов.
    points:
      - Инкапсуляция, наследование, полиморфизм, абстракция
      - Ad-hoc — перегрузка, решается при компиляции
      - Подтипов — общий интерфейс, позднее связывание
      - Параметрический — дженерики

  - id: open-arch-021
    topic: Архитектура
    level: middle
    question: |
      Какие парадигмы программирования ты знаешь?
    answer: |
      Императивное — даём конкретные шаги в нужном порядке, компьютер их выполняет. Процедурное — производное от
      императивного, код делится на функции для модульности. Функциональное — программы из функций, модульность и
      отсутствие побочных эффектов. Декларативное — описываем, какой результат нужен, а не как его получить; React
      декларативен: мы описываем, как выглядит UI при данном состоянии, а обновление DOM делает React.
      Объектно-ориентированное — понятия разделяются на сущности-объекты, широко используются классы.
      Событийно-ориентированное — выполнение определяется событиями: объекты подписываются на уведомления, реагируют
      и публикуют свои; на фронте события — клики, отправка форм, касания. Реактивное — обработка делится на небольшие
      задачи, каждая завершается событием, на которое реагирует следующая; пример — таблица Excel: при изменении
      ячейки зависимые пересчитываются сами.
    points:
      - Императивное и процедурное
      - Функциональное
      - Декларативное — React
      - ООП, событийное, реактивное

  - id: open-arch-022
    topic: Архитектура
    level: middle
    question: |
      Какие паттерны проектирования ты знаешь? Что такое GRASP и GoF?
    answer: |
      Паттерны можно делить по двум подходам: GRASP и GoF (банда четырёх).

      GRASP — не конкретные решения, а общие принципы распределения обязанностей. Информационный эксперт — обязанность
      получает объект, у которого больше всего нужной информации. Низкая связанность и высокое зацепление — модули
      слабо зависят друг от друга, а внутри модуля всё связано. Устойчивость к изменениям — точки, которые часто
      меняются, закрывают интерфейсами. Контроллер — обрабатывает входящие системные события и делегирует работу.
      Полиморфизм — альтернативное поведение по типу через общий интерфейс. Чистая выдумка — искусственный класс ради
      низкой связанности. Перенаправление — посредник между классами.

      GoF делит паттерны на три группы. Порождающие — создание объектов: Singleton (один экземпляр на приложение —
      менеджер сессии, подключение к БД), Builder (пошаговая сборка сложного объекта — SQL-запросы, фикстуры в
      тестах), Factory Method (создание объектов разной реализации одного интерфейса, например клиент для REST, SOAP
      или сокета), Prototype, Abstract Factory. Поведенческие — взаимодействие объектов: Observer (подписчики слушают
      события без привязки к конкретному источнику), Template Method (скелет алгоритма, шаги переопределяют подклассы),
      Iterator (перебор коллекции без раскрытия устройства). Структурные — композиция объектов: Facade (простой
      интерфейс к сложной системе, как оплата Apple Pay), Adapter (совместить несовместимые интерфейсы, как
      переходник для розетки), Decorator (добавить поведение обёрткой без изменения исходного объекта).
    points:
      - GRASP — принципы распределения обязанностей
      - Порождающие — Singleton, Builder, Factory
      - Поведенческие — Observer, Template Method, Iterator
      - Структурные — Facade, Adapter, Decorator

  - id: open-arch-023
    topic: Архитектура
    level: middle
    question: |
      Как выстроить стратегию тестирования фронтенда? Пирамида или трофей?
    answer: |
      Для крупного фронтенда слепо следовать классической пирамиде — антипаттерн. Практичнее «трофей тестирования»:
      фокус не на изоляции мелких функций, а на интеграции и реальном пользовательском опыте. Цель — максимум
      уверенности при минимуме затрат на написание и поддержку.

      Статика — фундамент: TypeScript в строгом режиме, ESLint, Stylelint ловят опечатки, нарушения границ импортов и
      несоответствие типов до запуска тестов.

      Unit (~30%, Vitest, Jest) — только там, где высокая плотность логики: чистые функции, парсеры, калькуляторы,
      валидаторы, хуки с бизнес-логикой. Тестировать, что кнопка рендерит текст, — хрупко.

      Интеграционные (~60%, React Testing Library + MSW) — основной слой: «компонент + стор + API-клиент», а сеть
      мокается на уровне запросов через MSW. Тестируем как пользователь: найти кнопку, кликнуть, проверить счётчик.

      E2E (~10%, Playwright, Cypress) — реальный браузер и окружение, только критические сценарии (вход → поиск →
      корзина → оплата), обычно 10–30 штук: медленные и бывают нестабильными. Плюс визуальная регрессия скриншотами.

      Главный признак правильной стратегии: если внутренности компонента полностью переписаны, а поведение не
      изменилось, тесты проходят без правок.
    points:
      - Трофей вместо пирамиды
      - Статика — фундамент
      - Интеграционные — основной слой (RTL + MSW)
      - Unit — для плотной логики, E2E — для критических путей
      - Тесты переживают рефакторинг

  - id: open-arch-024
    topic: Архитектура
    level: middle
    question: |
      Какие виды тестирования бывают? Что такое Shift Left и A/B-тестирование?
    answer: |
      Тесты делятся на функциональные — модульные (unit), интеграционные, end-to-end — и нефункциональные: нагрузочные,
      безопасности, доступности. Регрессионное (повторная проверка после изменений) бывает и тем и другим. TypeScript — тоже своего рода тестирование на ранних этапах.

      Модульные — мелкие функции и хелперы (Jest, Vitest). Скриншотные — Storybook и Loki. Интеграционные — связки
      компонентов или классов (React Testing Library). E2E — ключевая функциональность на реальном проекте:
      регистрация, оплата (WebdriverIO, Playwright, Cypress). Пропорции зависят от выбранной модели — пирамиды или
      трофея.

      Shift Left — дефекты дешевле найти рано, поэтому тестирование смещается «влево», на все этапы разработки.
      Тестировщики участвуют с самого начала: понимают требования и архитектуру, задают вопросы и предотвращают
      дефекты, а не только ловят их. Отсюда практика «трёх амиго» — встреча аналитика, разработчика и тестировщика,
      чтобы устранить пробелы в понимании требований.

      A/B-тестирование (сплит-тест) — сравнение двух вариантов, например страницы: половина аудитории видит старую
      версию, половина — новую, и решение принимается по данным, а не по мнениям. Пример: конверсия 5%, гипотеза —
      синяя кнопка «Купить» вместо зелёной даст больше; через три недели у новой версии 7,5% — кнопку меняют.
    points:
      - Функциональные и нефункциональные
      - Unit, скриншотные, интеграционные, E2E
      - Shift Left и три амиго
      - A/B — решение по данным

  - id: open-arch-025
    topic: Архитектура
    level: middle
    question: |
      Что такое DTO и DDD?
    answer: |
      DTO (Data Transfer Object) — простой объект для передачи данных между слоями приложения, особенно между клиентом
      и сервером. Аналогия: заказывая пиццу, вы получаете не весь ресторан с кухней и поварами, а коробку с пиццей —
      это и есть DTO.

      Характеристики: только данные, без бизнес-логики; обычно неизменяемый; сериализуемый в JSON; обычно плоский.
      Зачем: вместо сущности `User` с паролем и методами клиенту отдают `UserDTO` только с нужными полями — пароль не
      уйдёт, даты превращены в строки.

      Document DTO (термин не устоявшийся — по сути это агрегирующий ответ под сценарий, как в BFF) — разновидность: самодостаточный документ со всеми данными для конкретного сценария, без ссылок на
      другие ресурсы. Решает проблему множества запросов: вместо `/users/123`, `/users/123/orders`,
      `/users/123/profile` — один `/users/123/document`. Особенно полезно для мобильных приложений.

      DDD (Domain-Driven Design, предметно-ориентированное проектирование) — подход, который фокусируется на понимании и
      моделировании предметной области, чтобы продукт соответствовал реальным потребностям бизнеса. Ключевые понятия: единый язык (ubiquitous language) с экспертами, ограниченный контекст (bounded context), сущности, объекты-значения, агрегаты. Цель — чтобы продукт отвечал потребностям бизнеса и пользователей.
    points:
      - DTO — только данные для передачи
      - Скрывает лишнее и чувствительное
      - Document DTO — всё в одном ответе
      - DDD — моделирование предметной области

  - id: open-arch-026
    topic: Архитектура
    level: middle
    question: |
      Что такое реактивное программирование и как оно связано с RxJS?
    answer: |
      Реактивное программирование — парадигма, ориентированная на потоки данных и распространение изменений.
      Императивно — «сделай это, потом то», реактивно — «когда это происходит, сделай то». Пример — Excel: без формул
      после изменения A1 ячейка C1 = A1 + B1 остаётся старой, с формулами пересчитывается сама.

      RxJS (Reactive Extensions for JavaScript) — библиотека для реактивного программирования: Observable, Subject,
      BehaviorSubject, `fromEvent` и операторы `map`, `filter`, `debounceTime`, `switchMap`.

      Пример — поиск. Обычный подход — ручной таймер в обработчике `input`, проверка длины, `fetch` и проверка, не
      устарел ли ответ. В RxJS это цепочка: `fromEvent(input, 'input')` → `map` в значение → `debounceTime(300)` →
      `distinctUntilChanged()` → `filter` по длине ≥ 3 → `switchMap` на запрос → `subscribe`. `switchMap` переключается
      на новый запрос и игнорирует ответ предыдущего; чтобы сам `fetch` реально прервался, нужен `AbortController`
      или `fromFetch`.

      Использовать — при сложной асинхронности, отмене операций, комбинировании потоков, сложном состоянии с
      эффектами, real-time. Не использовать — для простого обработчика клика, одного запроса, маленького проекта и
      когда команда не знает RxJS.
    points:
      - Потоки данных и распространение изменений
      - Excel с формулами — пример
      - RxJS — Observable и операторы
      - '`switchMap` игнорирует устаревший ответ'
      - Для сложной асинхронности, не для простых случаев
