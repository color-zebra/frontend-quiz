  - id: 'speech-fsd-a-a5-1-001'
    level: 'senior'
    question: 'Спроектируй дашборд с 50k строк, фильтрами и общими итогами. Передача занимает секунды, пользователь долго прокручивает и возвращается к прежним данным. Как разделишь работу?'
    answer: "Измерю отдельно передачу, разбор, память, вычисление и DOM на целевых устройствах. Если доминирует полный ответ, введу серверную фильтрацию и частичные страницы, а общий итог получу агрегатом по той же выборке. Нельзя выдавать сумму загруженной страницы за сумму полного результата. Для малого фиксированного отчёта локальная обработка могла бы быть проще и быстрее.\n\nВидимое окно отделю от кеша страниц. Виртуализация ограничит DOM, а eviction — память данных; это разные механизмы. Ограничу удержание неактивных страниц, сохраню параметры, продолжение и якорь для повторного чтения. Выбор и несохранённый ввод не должны исчезнуть вместе с удалённой страницей.\n\nПроверю cold load, длительную прокрутку и возврат, а не только первый экран. Цена серверной обработки — API и сетевые задержки новых фильтров; цена полной локальной копии — передача, память и возраст данных."
    points:
      - 'Измерены разные ограничения'
      - 'Фильтр и агрегат относятся к полной выборке'
      - 'DOM и кеш ограничены отдельно'
