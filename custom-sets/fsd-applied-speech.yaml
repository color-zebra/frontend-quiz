  - id: 'speech-fsd-a-a7-1-001'
    level: 'senior'
    question: 'Спроектируй границы безопасности критической формы: цена и роль приходят с клиента, сессия cookie-based, пользовательский rich text показывается в нескольких маршрутах. Что проверяют сервер и UI?'
    answer: "Сервер не принимает цену и роль как доказательства. По аутентифицированной сессии он проверяет доступ к объекту и пересчитывает бизнес-условия перед фиксацией. UI использует роли для доступных действий и объясняет отказ, но открытая вкладка не сохраняет отозванные полномочия.\n\nДля cookie-сессии выберу Secure/HttpOnly и согласованную политику SameSite и CSRF-защиты изменяющих запросов. HttpOnly ограничивает чтение секрета из JS, но не делает XSS безопасным: скрипт всё ещё может действовать в контексте страницы.\n\nRich text имеет ограниченный формат и один проверенный путь обработки на всех опасных выводах, включая SSR и поиск. Данные из собственной БД остаются пользовательскими. Логи и URL не получают секретов и полных форм. Проверю обход UI прямым запросом, отзыв роли и альтернативный путь отображения, сохраняя только разрешённый ввод при отказе."
    points:
      - 'Серверная authz и инварианты обязательны'
      - 'Роль не фиксируется сроком вкладки'
      - 'Хранение секрета и CSRF имеют разные меры'
      - 'Rich text безопасен на всех путях вывода'
      - 'Локальная работа и телеметрия учитывают чувствительность'
