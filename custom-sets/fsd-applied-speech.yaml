  - id: 'speech-fsd-a-a6-3-001'
    level: 'senior'
    question: 'Как выкатить новую версию приложения, если вкладки живут сутками, код разделён на chunks, а API меняет форму ответа?'
    answer: "Согласую окно поддержки поколений. Новые ассеты получают новые хешированные URL; старые сохраняю достаточно долго для ленивых разделов старого runtime. HTML обновляется по своей политике, приватные данные и query-кеш — по своей. Кеш кода не гарантирует свежесть заказов.\n\nAPI сначала расширю совместимыми полями, затем переведу клиентов и по наблюдению завершу поддержку старого контракта. Rolling deploy не означает синхронный переход открытых вкладок. Контрактные проверки охватывают допустимые сочетания версий.\n\nДля уже неподдерживаемого клиента блокирую небезопасные команды, предлагаю разрешённое сохранение ввода и обновление. Ошибка загрузки старого chunk имеет такой же контролируемый путь, без бесконечного reload. Проверю старую вкладку после deploy, новый lazy-маршрут и несохранённую форму. Цена — хранение версий и переходная сложность API."
    points:
      - 'Ассеты, HTML и данные имеют разные кеши'
      - 'Старые chunks живут в окне поддержки'
      - 'API изменяется совместимой последовательностью'
      - 'Проверяются поколения клиента и сервера'
      - 'Обновление защищает несохранённый ввод'
