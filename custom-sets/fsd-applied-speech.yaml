title: 'FSD Applied Architecture — устные'
kind: 'speech'
questions:
  - id: 'speech-fsd-a-a1-1-001'
    level: 'middle'
    question: 'Спроектируй загрузку кабинета: счета нужны сразу, аудит открывается редко, отчёт создаётся по кнопке. Холодный вход содержит последовательные независимые чтения и полные документы вместо метаданных. Как изменишь границы?'
    answer: "Сниму диаграмму старта чтений, объём передачи и момент появления пригодных счетов. Независимые запросы с известными входами начну параллельно, реальные зависимости от ответов сохраню. Для списка согласую лёгкую проекцию, полные документы получу при открытии. Цена — дополнительный API-договор и второе чтение деталей.\n\nСчета загружаются eager, аудит — on-demand при открытии. Подготовку аудита введу только при достаточной вероятности использования и свободном бюджете сети. Уже полезную таблицу можно обновлять в фоне с согласованным возрастом данных. Отчёт остаётся отдельной командой со своим ожиданием и ошибками.\n\nСравню холодный time-to-content, байты, число запросов и нагрузку от параллелизма. Проверю также открытие деталей: ускорение списка не должно прятать неприемлемую задержку основного действия."
    points:
      - 'Независимость чтений проверена'
      - 'Проекция устраняет overfetching до передачи'
      - 'Eager/on-demand/background по сценариям'
      - 'Создание отчёта не связано с refetch'
      - 'Измеряются задержка, байты и нагрузка'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.1 Fetching strategy'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/request-waterfalls'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/prefetching'
  - id: 'speech-fsd-a-a1-2-001'
    level: 'middle'
    question: 'Два экрана проектов делят кешируемую таблицу. Фильтр и сортировка меняются, аккаунт можно переключить без закрытия приложения. Определи ключ, владельца, сроки и гарантии fresh.'
    answer: "Кеш размещу на уровне сессии. Ключ включает безопасные ID аккаунта и проекта, канонические фильтр и сортировку, страницу и версию проекции. Эквивалентные запросы должны делить запись, разные области доступа — разделяться. Токены в идентичность не входят.\n\nЗадам отдельно допустимый возраст и удаление неактивных данных по бюджету памяти. Fresh разрешает локальное чтение, но не обещает отсутствия изменений на сервере. При logout очищу приватные записи и через поколение сессии отсеку поздние ответы: одной очистки недостаточно.\n\nПроверю переходы между проектами, разные сортировки и гонку logout с запросом. Общий кеш уменьшает повторную передачу, но увеличивает время хранения чувствительных данных и цену корректной изоляции."
    points:
      - 'Scope по сессии'
      - 'Ключ покрывает зависимости ответа'
      - 'Свежесть отдельно от хранения'
      - 'Поздний ответ не переживает logout'
      - 'Кеш не заменяет авторизацию'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.2 Cache architecture'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/query-keys'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/important-defaults'
  - id: 'speech-fsd-a-a1-3-001'
    level: 'senior'
    question: 'Справочник тарифов можно показать старым, расчёт покупки должен учитывать новый тариф. Во время сохранения идёт refetch. Обоснуй TTL, invalidation, фоновые проверки и защиту от старого ответа.'
    answer: "Разделю чтение справочника и критичный расчёт по цене устаревания. Справочник покажу из кеша, обозначив обновление. Смена тарифа инвалидирует зависимые расчёты; активный расчёт проверю снова, а не просто обновлю ему временную метку. Покупку всё равно подтверждает сервер.\n\nХранение копии настрою отдельно от fresh-периода. Возврат фокуса полезен после отсутствия, но не гарантирует свежесть постоянно открытой страницы. Короткий активный бюджет потребует таймера или событий с восстановлением.\n\nКеш не примет версию старше подтверждённой мутации. Старый запрос по возможности отменю, сохранив контроль применения. Сопоставлю возраст показанных данных и сетевую цену: частая проверка редко меняющегося справочника может быть неоправданной."
    points:
      - 'Политики по цене устаревания'
      - 'Различены TTL/SWR/invalidation/focus/push'
      - 'Зависимые расчёты проверяются'
      - 'Версии не регрессируют'
      - 'Измеряется возраст и цена сети'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.3 Freshness & invalidation'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/query-invalidation'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/window-focus-refetching'
  - id: 'speech-fsd-a-a1-4-001'
    level: 'middle'
    question: 'На странице есть совпадающие чтения, поиск с ответами не по порядку и предсказуемые переходы. Где применишь deduplication, batch, take-latest и prefetch?'
    answer: "Одинаковые чтения с полным общим ключом разделят in-flight запрос. Его отмена учитывает всех потребителей. Для разных карточек batch возможен лишь при серверном контракте размера пакета и поэлементных исходов; он не даёт общего снимка автоматически.\n\nУ поисковой выдачи проверю поколение запроса и применю только результат текущего намерения. Отменю ненужное ожидание, не обещая отмену серверных эффектов.\n\nPrefetch включу для вероятных переходов с ограничением сети и конкурентности. Результат должен оставаться пригодным и переиспользоваться тем же ключом. Проверю долю использованных подготовок, лишние байты и задержку перехода. Параллельность может ускорять экран без уменьшения количества запросов; это отдельные метрики."
    points:
      - 'Один ключ — общая in-flight работа'
      - 'Batch имеет частичные исходы'
      - 'Take-latest не отменяет запись'
      - 'Prefetch по вероятности и бюджету'
      - 'Задержка и число запросов различены'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.4 Coordination & prefetch'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/query-cancellation'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/prefetching'
  - id: 'speech-fsd-a-a1-5-001'
    level: 'senior'
    question: 'Спроектируй пагинацию журнала событий и неизменяемого отчёта. В журнал постоянно добавляют записи, фильтры меняются, пользователь возвращается назад. Как различаются гарантии и восстановление?'
    answer: "Журналу с последовательным просмотром предложу cursor по полному порядку, например времени и ID. Уточню изменения ключа сортировки, удаления и срок жизни продолжения. Для точного согласованного просмотра потребуется snapshot: курсор его не создаёт. Повторы удалю по ID, но не объявлю это устранением пропусков.\n\nДля закреплённого отчёта с переходом по номеру допустим offset внутри snapshotId с известным total. Проверю цену больших смещений на реальном источнике.\n\nСмена фильтра создаёт новую цепочку страниц; старый ответ может заполнить только старый кеш. Для Back сохраню параметры, порядок, снимок и якорь строки. При недоступном снимке заново получу набор и сообщу об изменении позиции. Так UX согласован с гарантиями API."
    points:
      - 'Пагинация по изменчивости и операциям'
      - 'Cursor не означает snapshot'
      - 'Dedup не восстанавливает пропуски'
      - 'Reset и старые ответы изолированы'
      - 'Возврат включает контекст и якорь'
    topic: 'A1. Data retrieval & caching'
    subtopic: 'A1.5 Pagination consistency'
    links:
      - 'https://www.postgresql.org/docs/current/queries-limit.html'
      - 'https://www.elastic.co/docs/reference/elasticsearch/rest-apis/paginate-search-results'
  - id: 'speech-fsd-a-a2-1-001'
    level: 'senior'
    question: 'У формы есть заменяемый расчёт доставки, команды добавления единиц и сохранение документа несколькими операторами. Выбери координацию для каждого пути и объясни границы отмены.'
    answer: "Расчёт связан с поколением выбранного адреса: старый ответ не меняет текущую цену, ненужное чтение по возможности отменяется. Это take-latest для отображения. Каждое добавление единицы значимо, поэтому локально отправляю их последовательно с отдельным исходом. Для общего документа использую expectedVersion и явный конфликт, потому что очередь одного браузера не защищает от другого оператора.\n\nЕсли API задаёт независимое добавление меток, допустим серверный merge операций вместо замены массива. Возможность объединения должна следовать из инвариантов, а не из удобства клиента.\n\nAbort закрывает ожидание, но не отменяет уже принятый POST. При потере ответа узнаю результат по операции; повтор с новой идентичностью без проверки может удвоить эффект. Проверю обратный порядок ответов, отказ первой команды и чужую запись между чтением и сохранением."
    points:
      - 'Take-latest только для заменяемого результата'
      - 'Serialize сохраняет значимые команды'
      - 'Version-check защищает базу записи'
      - 'Merge зависит от семантики операции'
      - 'Abort не является серверной отменой'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.1 Race conditions & ordering'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/query-cancellation'
  - id: 'speech-fsd-a-a2-2-001'
    level: 'senior'
    question: 'Спроектируй optimistic cart с двумя быстрыми изменениями количества. Первое отклонено, второе может быть принято, сервер пересчитывает скидку. Как согласовать UI без потери второго намерения?'
    answer: "Храню подтверждённую корзину и pending-операции с ID. Прогноз привязан к конкретным попыткам; ответ сообщает их исход и нормализованные значения сервера. Количество можно показать оптимистически, а окончательную цену и оплату подтверждает API.\n\nПри отказе A не возвращаю весь объект к снимку до неё: так исчезнет результат B. Для независимых обратимых операций можно удалить только слой A. При сложном пересчёте скидки выясню исходы пересекающихся отправок и перечитаю итоговую базу. Pending-операции накладываю поверх refetch лишь при известном наборе уже включённых эффектов, иначе возможен двойной учёт. Пока результат не выяснен, показываю ожидание без обещания точного итога; неотправленный новый ввод храню отдельно.\n\nПроверю перестановку ответов, нормализацию и отказ A при успешной B. Неопределённый исход не превращаю в известный отказ. Цена решения — модель отдельных попыток и дополнительные чтения там, где локальное обращение эффекта недостоверно."
    points:
      - 'Подтверждённая база отделена от optimistic-слоёв'
      - 'Каждая попытка имеет ID и собственный исход'
      - 'Отказ первой мутации не откатывает успешную вторую'
      - 'Pending накладываются на refetch лишь при известном наборе включённых операций'
      - 'Серверная цена и оплата не объявлены локальным успехом'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.2 Optimistic mutations'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/optimistic-updates'
  - id: 'speech-fsd-a-a2-3-001'
    level: 'senior'
    question: 'Форма создаёт заказ, подтверждение может потеряться, а сервер хранит ключ повтора сутки. Спроектируй повтор и восстановление через минуту и через два дня.'
    answer: "Перед отправкой назначу логической попытке устойчивый ID и сохраню нужный для восстановления контекст в разрешённом хранилище. Пока ответ ожидается, UI показывает отправку. При обрыве или timeout не выставляю failed автоматически: заказ мог создаться.\n\nВ пределах суток повторю то же намерение с тем же ключом и телом согласно серверному контракту. Изменённая покупка — новая попытка, а не переиспользование ключа. Дедупликация должна работать на сервере атомарно и в правильной области аккаунта.\n\nЧерез два дня ключ уже не даёт обещанной защиты. Сначала запрошу состояние по бизнес-ID либо предложу явный путь поддержки. Не выдам кнопку нового заказа как безопасный retry. Для чтений допустима отдельная более простая политика повторов; свежесть нового ответа и безопасность побочного эффекта — разные вопросы."
    points:
      - 'Одна логическая попытка имеет один ключ'
      - 'Pending отличается от неопределённого исхода'
      - 'Повтор сохраняет тело и scope'
      - 'Срок ключа ограничивает гарантию'
      - 'Есть путь выяснения бизнес-результата'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.3 Idempotency & retries'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html'
      - 'https://docs.stripe.com/api/idempotent_requests'
  - id: 'speech-fsd-a-a2-4-001'
    level: 'senior'
    question: 'Несколько операторов редактируют карточку. Для независимых настроек допустим merge, для договорного текста потеря запрещена. Предложи версионирование и UX конфликта.'
    answer: "Согласую единицу конфликта с API: весь документ или отдельные поля. Для целостного текста отправляю ожидаемую версию, например If-Match со сильным ETag; сервер проверяет её вместе с записью. Устаревшую базу отклоняет, клиент сохраняет черновик и показывает новую версию для явного решения.\n\nНастройки можно объединять patch-операциями лишь при независимых полях и соответствующих серверных проверках. Если поля связаны общим правилом, мелкие версии не должны обходить этот инвариант. Last-write-wins допустим там, где потеря предыдущего значения принята продуктом.\n\nСогласованный UI не доказывает корректность внешних операций: резерв или лимит проверяет владелец данных. Проверю конфликт того же поля, независимые правки и отказ предусловия. Автоматическая подстановка нового ETag в старое тело не считается разрешением конфликта."
    points:
      - 'Определена единица конфликта'
      - 'Проверка версии атомарна с записью'
      - 'Черновик переживает отказ'
      - 'Merge только для независимых операций'
      - 'Рендер не заменяет серверный инвариант'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.4 Versioning & conflicts'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html#section-13.1.1'
  - id: 'speech-fsd-a-a2-5-001'
    level: 'senior'
    question: 'Таблица заказов имеет фильтры, пагинацию и карточку. Изменение статуса возвращает неполный ответ и меняет принадлежность спискам; ответы двух правок приходят наоборот. Как согласовать кеш? Определи также ключи кеша с учётом аккаунта, фильтра и страниц; объясни reset цепочки, изменение состава после правки и ограничения дедупликации.'
    answer: "Свяжу попытки с ID и версией сущности. Поздний успех старой правки завершит её pending-статус, но не перезапишет более новую подтверждённую карточку. Если версии несравнимы, перечитаю авторитетное состояние вместо выбора по времени доставки.\n\nЧастичный ответ можно применить к известному полю только при доказанной актуальности версии; без сравнимой версии безопаснее refetch. Даже актуального поля недостаточно для пересчёта всех страниц, total и агрегатов. Инвалидирую затронутые выборки по параметрам и обновлю активные по политике. Для полного ответа детали допустима прямая замена с проверкой версии.\n\nКопии связываются ID и картой зависимостей; нормализация возможна, но не решает автоматически фильтрацию и порядок. Проверю изменение статуса между страницами, открытые одновременно списки и гонку refetch с мутацией. Цена invalidation — дополнительные чтения, цена прямого обновления — сложность точного знания серверной формы.\n\nКлюч страницы включает безопасный контекст аккаунта и проекта, канонические фильтр и сортировку, версию проекции и договорную позицию или snapshot. Секретный токен в ключ не входит. Деталь и списки имеют разные формы, а ID связывает зависимости. Смена аккаунта требует очистки приватного контекста и отсечения поздних ответов.\n\nПри смене фильтра начинаю новую цепочку и не подмешиваю в неё старый cursor или запоздалую страницу. Изменение статуса может поменять состав, порядок и границы живых страниц, поэтому пересчитываю их через согласованное чтение, включая total. Дедупликация по ID убирает повтор, но не восстанавливает пропуски. Если нужен точный просмотр одного момента, договариваюсь о snapshot и его продолжении; переход на новый снимок показываю пользователю, а не смешиваю две базы."
    points:
      - 'Исход попытки отдельно от свежести снимка'
      - 'Старый ответ не регрессирует версию'
      - 'Форма ответа определяет прямое обновление'
      - 'Списки и total инвалидируются по зависимостям'
      - 'Нормализация не вычисляет серверный состав'
      - 'Ключ покрывает доступ, параметры и контекст страницы'
      - 'Пагинация не смешивает разные фильтры и снимки'
      - 'Дедупликация не доказывает полноту коллекции'
    topic: 'A2. Mutations & consistency'
    subtopic: 'A2.5 Cache reconciliation'
    links:
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/updates-from-mutation-responses'
      - 'https://tanstack.com/query/latest/docs/framework/react/guides/invalidations-from-mutations'
  - id: 'speech-fsd-a-a3-1-001'
    level: 'middle'
    question: 'Спроектируй карту ошибок формы: сеть отсутствует, чтение вернуло 503, дата не прошла проверку, сессия истекла, запись конфликтует с новой версией, ответ создания потерян. Какие пути восстановления покажешь?'
    answer: "Сохраню категории транспорта и договорных ошибок отдельно. При отсутствии сети покажу недоступность отправки, не выводя конкретный HTTP-статус из браузерного флага. Чтение с временным 503 можно повторять ограниченно; validation требует исправления поля с сохранённым вводом. Истёкшая сессия ведёт к повторному входу, после которого заново проверяется возможность операции.\n\nПри конфликте версии оставлю черновик и покажу новую базу для согласования. Потерянный ответ создания — неопределённый исход: сначала статус операции или безопасный повтор по серверному контракту, а не новая команда.\n\nRecoverable означает наличие понятного пути для человека, не обязательный фоновый цикл. Проверю, что ошибки не стирают ввод, сообщения не обещают ложного успеха и действия не обходят проверки доступа или версии. Одинаковая плашка «попробуйте позже» не заменяет эту карту."
    points:
      - 'Различены транспорт и HTTP-ответ'
      - 'Validation/auth/conflict имеют разные действия'
      - 'Неизвестный исход не равен transient failure'
      - 'Ввод сохраняется по требованиям безопасности'
      - 'Повтор зависит от эффекта и контракта'
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.1 Failure taxonomy'
    links:
      - 'https://www.rfc-editor.org/rfc/rfc9110.html'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Navigator/onLine'
  - id: 'speech-fsd-a-a3-2-001'
    level: 'middle'
    question: 'При временном отказе API одновременно восстанавливаются тысячи открытых страниц. В SDK и UI уже есть retry. Спроектируй политику, которая не усиливает сбой и не скрывает неопределённый исход записи.'
    answer: "Определю владельца повторов и общий deadline действия. Уберу несогласованные вложенные циклы, буду учитывать реальные сетевые попытки. Для временно неуспешных безопасных чтений применю ограниченный exponential backoff с jitter и верхней задержкой, учитывая Retry-After. Ненужные после ухода чтения остановлю.\n\nЗапись с потерянным ответом сначала требует выяснения результата или подтверждённой серверной идемпотентности. Backoff регулирует нагрузку, но не предотвращает двойной эффект. Validation, отсутствие прав и конфликт не отправляются в тот же автоматический цикл.\n\nПосле исчерпания бюджета покажу состояние и ручное восстановление с актуальным контекстом. Метрики должны различать действия пользователей, сетевые попытки, восстановление и рост нагрузки. Проверю массовый reconnect, повторные клики и вложенный SDK retry под отказом."
    points:
      - 'Один сквозной бюджет'
      - 'Backoff и jitter имеют разные роли'
      - 'Учитывается Retry-After'
      - 'Повторы не исправляют семантику записи'
      - 'Есть конечный статус и ручной путь'
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.2 Retry policy'
    links:
      - 'https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/retry-backoff.html'
      - 'https://www.rfc-editor.org/rfc/rfc9110.html#section-10.2.3'
  - id: 'speech-fsd-a-a3-3-001'
    level: 'senior'
    question: 'Спроектируй autosave редактора на нестабильной сети: пользователь продолжает ввод во время сохранения и может уйти или закрыть браузер. Какие редакции и статусы нужны?'
    answer: "Храню текущую локальную редакцию, отправленную попытку и последнюю подтверждённую редакцию. Saved относится к текущему тексту только при совпадении с подтверждением. Если во время сохранения введён новый текст, он остаётся dirty, даже когда старый ack успешен. Известный отказ и конфликт версии имеют разные действия, а потеря ответа оставляет неопределённый исход попытки.\n\nDebounce — только триггер. Порядок обеспечу сериализацией допустимых записей или версиями API, с защитой от устаревшего ack. При разрешённом локальном хранении сохраняю черновик заранее, сообщая отдельно о локальном и серверном состоянии.\n\nНа управляемой навигации предложу дождаться актуального сохранения или явно уйти с риском потери. Hidden использую как дополнительный сигнал, но не опираюсь на beforeunload как гарантию. При запрете локальных копий пределы аварийного восстановления согласую честно. Проверю ввод после отправки, поздний ack и закрытие без события."
    points:
      - 'Редакция определяет saved'
      - 'Debounce не является протоколом'
      - 'Порядок и конфликты заданы API'
      - 'Локальная и серверная сохранность различены'
      - 'Lifecycle не даёт финального гарантированного события'
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.3 Autosave lifecycle'
    links:
      - 'https://developer.chrome.com/docs/web-platform/page-lifecycle-api'
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Window/beforeunload_event'
  - id: 'speech-fsd-a-a3-4-001'
    level: 'senior'
    question: 'Нужен offline-ввод заявок: часть пользователей хочет лишь сохранить итоговый черновик, другая должна отложить несколько зависимых команд. Как различишь модели и восстановишь их после refresh?'
    answer: "Для итогового текста достаточно долговечного разрешённого черновика. После reconnect пользователь проверяет свежую базу и отправляет его; журнал каждого промежуточного ввода не нужен. Если отдельные команды имеют смысл и зависимости, храню очередь с ID операции, входами, владельцем, состоянием и порядком. Сообщаю о локальном принятии лишь после успешной записи.\n\nПосле refresh восстанавливаю сессию и права, затем выясняю неизвестные исходы с сохранённой идентичностью. Зависимые действия ждут подтверждения создающей операции; независимые могут продолжаться по контракту. Потеря локального хранилища или ошибка квоты не скрывается под статусом queued.\n\nПри постоянном конфликте останавливаю соответствующую цепочку, сохраняю допустимый ввод и даю редактирование, экспорт или отмену. Локальная очередь не означает серверное выполнение и не заменяет полноценную синхронизацию между устройствами."
    points:
      - 'Черновик отличается от очереди команд'
      - 'Принятие после успешной записи'
      - 'ID и зависимости переживают refresh'
      - 'Возобновление проверяет права и исходы'
      - 'Застрявшие цепочки имеют явный путь'
    topic: 'A3. Reliability & recovery'
    subtopic: 'A3.4 Persistence & offline queue'
    links:
      - 'https://developer.mozilla.org/en-US/docs/Web/API/Storage_API/Storage_quotas_and_eviction_criteria'
