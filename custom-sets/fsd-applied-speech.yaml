  - id: 'speech-fsd-a-a6-2-001'
    level: 'senior'
    question: 'Статья имеет тяжёлый hero, редкий редактор диаграмм и поздние комментарии. Предложи границы загрузки и бюджет ресурсов без универсального «разбить всё».'
    answer: "Определю, какие ресурсы нужны до полезного первого контента. Известный поздно обнаруживаемый hero можно preload, если измерение подтверждает выигрыш и не страдают более важные ресурсы. Редкий редактор выделю из общего начального кода и загружу по потребности; вероятные переходы можно prefetch в свободном бюджете, а не с обязательным высоким приоритетом.\n\nКомментарии отделю от статьи по ожиданию и ошибкам. Если их код и данные независимы, начну оба у известной границы, убрав последовательный waterfall. Слишком мелкое разбиение на chunks проверю на накладные расходы.\n\nСравню критические байты, момент полезного текста, готовность действий и задержку открытия комментариев. Сумма всех файлов на диске не является метрикой первого экрана. Цена решения — дополнительные границы, обработка ошибок chunks и возможная лишняя подготовка."
    points:
