  - id: 'speech-fsd-a-a6-4-001'
    level: 'senior'
    question: 'Спроектируй навигацию из фильтруемого списка в карточку и обратно: ссылка должна работать у коллеги, Back сохраняет применённый поиск, оболочка не исчезает при ошибке карточки.'
    answer: "Несекретные канонические параметры поиска и сортировки помещу в URL; доступ коллеги проверит сервер по его сессии. Задам разбор и значения по умолчанию, чтобы ссылка не зависела от памяти отправителя. Промежуточный ввод можно держать локально, применение создаёт шаг истории; возврат восстанавливает выбранный адрес, а не старый текущий store.\n\nОболочку навигации отделю от данных карточки и её ошибки. Независимые загрузки не должны ждать всех возможных отчётов. При этом проверю, не создают ли вложенные loader лишний waterfall.\n\nДля Back сохраню ключ выборки, выбранные ID, редакции и якорь позиции с фокусом. Если запись исчезла или данные изменились, восстановлю ближайший понятный контекст без обещания прежнего DOM. Проверю прямое открытие, refresh, чужой аккаунт и возврат после удаления строки."
