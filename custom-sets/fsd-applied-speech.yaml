  - id: 'speech-fsd-a-a5-3-001'
    level: 'senior'
    question: 'Фильтр большого локального набора мешает вводу. Сравни уменьшение работы, chunking, worker, debounce и приоритет UI. Как докажешь успех?'
    answer: "Сначала разложу задержку: сколько занимает передача данных, фильтрация, подготовка и рендер. Проверю, нельзя ли уменьшить набор или получить агрегат у источника. Это может убрать больше работы, чем перенос полного расчёта. Для независимой CPU-задачи сравню worker, учитывая передачу данных и стоимость запуска.\n\nЕсли перенос дорог, разобью расчёт на порции с настоящей уступкой планировщику. Защищу итог ID задачи: новый ввод делает старый результат неприменимым. Debounce уменьшает частоту запуска поиска, throttle подходит непрерывному сопровождению, приоритет рендера помогает текстовому вводу, но не делает тяжёлый синхронный цикл автоматически прерываемым.\n\nЗафиксирую бюджет p95 взаимодействия на целевом устройстве и объёме, сравню до/после, память и полное время завершения. Быстрый ввод при слишком долгом итоговом расчёте тоже может не соответствовать UX."
    points:
      - 'Сначала уменьшается лишний объём'
      - 'Worker учитывает передачу и отсутствие DOM'
