  - id: 'speech-fsd-a-a5-4-001'
    level: 'senior'
    question: 'Спроектируй выбор и редактирование серверно фильтруемой таблицы: частичная загрузка, eviction, «выбрать всё кроме», новые записи во время работы. Как определить смысл массовой операции?'
    answer: "Выбор и dirty-редакции храню по стабильным ID вне страниц и DOM. Удаление страницы из кеша не отменяет намерения, но удаление сущности или потеря прав требует отдельной обработки. Видимое окно и полная выборка — разные области.\n\nДля всех результатов использую модель контекста плюс исключённые ID. Уточню, относится ли команда к живому фильтру или к снимку на момент выбора. Если новые записи не должны включаться, API должен поддержать закреплённый token или эквивалентный серверный список, а не только повторить фильтр позже. Сервер всё равно проверяет текущие права и инварианты.\n\nПри смене фильтра сброшу выбор или явно предложу перенос, не расширяя его молча. Покажу понятное количество и область действия перед массовой командой. Проверю прокрутку, eviction, сортировку и возврат к редактору. Это дороже флагов в строках, но делает поведение предсказуемым на неполных данных."
    points:
