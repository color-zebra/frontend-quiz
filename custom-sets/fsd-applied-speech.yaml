  - id: 'speech-fsd-a-a6-4-002'
    level: 'senior'
    question: 'Спроектируй поисковую выдачу корпоративных документов: фильтры делятся ссылкой, ответы поиска могут приходить не по порядку, список подгружается страницами, код экрана и API независимы. Есть бюджет мобильного трафика; часть следующих страниц востребована редко. Объясни загрузку, кеш, координацию, пагинацию, prefetch и возврат из документа.'
    answer: "Согласую у API поисковую проекцию с ID, порядком, продолжением и различимыми исходами. Известные код и данные начну на границе маршрута параллельно, не откладывая чтение до монтирования тяжёлого экрана. Пустая выдача, первая загрузка, обновление и отказ следующей страницы имеют разные области UI.\n\nПрименённые несекретные фильтры и сортировку представлю каноническим URL, черновой ввод держу отдельно. Запрос связан с поколением и ключом параметров; поздний ответ старого поиска не меняет текущую выдачу, хотя может заполнить свой кеш. Совпадающие чтения делят in-flight работу, а отмена учитывает оставшихся потребителей. Ключ включает область доступа, параметры и форму результата без секретов.\n\nСмена фильтра сбрасывает цепочку продолжений. Cursor использую по договорному порядку; для стабильного состава нужен snapshot, а не одно название cursor. Не переношу старое продолжение в новый набор и не считаю удаление дублей защитой от пропусков. Для возврата сохраняю параметры и контекст списка, проверяю пригодность кеша и доступность прежней позиции; истёкший снимок восстанавливаю новым чтением с понятным сообщением.\n\nPrefetch включаю для вероятного перехода, когда ожидаемые лишние байты укладываются в бюджет, результат успевает и переиспользуется. Редкую тяжёлую страницу читаю по действию. Проверю холодную загрузку, быструю смену фильтра, поздний ответ и Back; измерю задержку полезной выдачи, трафик и возраст данных. Так ускорение не покупается смешиванием выборок или скрытым ростом передачи."
    points:
      - 'Границы загрузки устраняют лишний waterfall'
      - 'URL и поколение запроса связаны с выдачей'
      - 'Кеш учитывает доступ и параметры'
      - 'Reset и восстановление не смешивают продолжения'
      - 'Prefetch имеет решение по вероятности и байтам'
      - 'Проверены отказ страницы, поздний ответ и Back'
