  - id: 'speech-fsd-a-a4-3-001'
    level: 'senior'
    question: 'Поток уведомлений доставляет дубли, у событий есть ID и позиция внутри подписки. Отдельно приходят транспортные ack и read-события. Предложи обработку и статусы.'
    answer: "ID использую для повторной доставки, позицию — для порядка и обнаружения gap только в пределах того потока, где обещана непрерывность. Увеличение счётчика по одному событию нельзя выполнить дважды. Хранение обработанной границы или ID согласую с replay-окном и переходом на snapshot.\n\nЕсли ожидаемая позиция пропущена, не продвигаю контрольную точку поверх неизвестных изменений. Буферизую допустимое количество и запрашиваю replay либо новый снимок. Случайный UUID не использую как версию.\n\nТранспортный ack означает лишь оговорённый приём. Сохранение, доставка устройству и read требуют отдельных гарантий; статус интерфейса повторяет их смысл. Проверю дубль после reconnect, gap, две независимые подписки и ситуацию, когда ack пришёл, а бизнес-обработка ещё не завершилась."
    points:
      - 'ID, версия и позиция имеют разные роли'
      - 'Повтор не применяет эффект дважды'
      - 'Gap не перепрыгивается watermark'
      - 'Scope последовательности ограничен'
      - 'Ack не превращается автоматически в read или durable-save'
