  - id: 'speech-fsd-a-a4-5-001'
    level: 'senior'
    question: 'Спроектируй UX чата с optimistic sending, echo раньше HTTP-ответа, typing и большим потоком сообщений. Как согласовать ID, статусы и частоту показа?'
    answer: "Назначу отправке clientMessageId и передам его серверу для корреляции. Временная строка и серверный echo с тем же ID объединяются, независимо от порядка echo и ответа команды. Успех сохранения, доставка и read отражают отдельные договорные подтверждения.\n\nTyping и presence считаю эфемерными оценками с ограниченным сроком, потому что клиент может исчезнуть без stop. Read не выводится из presence и не исчезает от закрытия канала.\n\nСообщения добавляю пакетами с сохранением всех самостоятельных элементов; typing можно коалесцировать до последнего состояния. Контролирую размер буфера, отставание и бюджет задержки показа. При невозможности догнать поток запрашиваю восстановление и показываю это пользователю, а не случайно отбрасываю историю."
    points:
      - 'Временный ID коррелирует с серверным echo'
      - 'Согласование не зависит от порядка доставки'
      - 'Presence/typing имеют срок'
      - 'Статусы не повышают гарантию ack'
      - 'Batch сообщений отличается от coalescing состояния'
