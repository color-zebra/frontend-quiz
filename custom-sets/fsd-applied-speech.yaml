  - id: 'speech-fsd-a-a4-2-001'
    level: 'senior'
    question: 'Чат должен переживать разрыв сети, background и смену аккаунта. Спроектируй жизненный цикл канала отдельно от готовности данных.'
    answer: "Модель канала включает connecting, connected, reconnecting и остановку; данные отдельно могут быть синхронизированы или требовать восстановления. После разрыва применю backoff с jitter и бюджетом. Handshake не отмечает чат актуальным, пока не закрыт gap событий.\n\nКонтрольную позицию связываю с потоком и аккаунтом. При смене сессии прекращаю старую подписку, очищаю приватный контекст и отклоняю поздние события прежнего поколения. Обновление auth следует протоколу сервера, а не только изменению UI.\n\nHidden и возможная заморозка ограничивают предположение о непрерывной обработке. После возврата проверю позицию и при необходимости выполню replay или snapshot. Если транспорт не восстанавливается, покажу деградацию. Проверю logout во время reconnect, событие старого канала и возврат после длительного отсутствия."
    points:
      - 'Канал и готовность данных разделены'
      - 'Reconnect ограничен и имеет jitter'
      - 'Позиция привязана к сессии'
      - 'Поздние старые события отсекаются'
      - 'Resume проверяет gap'
