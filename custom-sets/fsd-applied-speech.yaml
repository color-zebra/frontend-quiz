  - id: 'speech-fsd-a-a5-2-001'
    level: 'senior'
    question: 'Выбираешь виртуализацию редактируемой таблицы с динамическими строками, sticky-колонками и клавиатурной навигацией. Как проверишь необходимость и ограничения?'
    answer: "Подтвержу измерением, что ограничение именно в DOM и отрисовке. Сравню виртуальное окно с пагинацией; если проблема в передаче, сначала сокращу данные. Для окна проверю переменные высоты, инвалидацию измерений, overscan и восстановление по стабильному якорю.\n\nРедакции и выбор хранятся по ID вне жизненного цикла строки. При уходе активного редактора за окно либо временно удерживаю его, либо явно завершаю действие с сохранением ввода и предсказуемым фокусом. Индекс переиспользуемой строки не является идентичностью записи.\n\nПрототип проверю с реальными объединениями ячеек, sticky и двумя осями. Клавиатура и скринридер должны получать согласованный логический порядок; одной роли grid недостаточно. Измерю задержку взаимодействия и память, затем проверю возврат и длинную сессию. Если доступность или геометрия не укладываются, выберу более простую пагинацию."
    points:
