  - id: 'speech-fsd-a-a3-5-001'
    level: 'middle'
    question: 'Критическая форма не сохраняется после нескольких попыток, а у пользователя большой объём ввода. Предложи восстановление с немедленным откликом, ограниченными повторами и учётом чувствительности данных.'
    answer: "После нажатия покажу отправку и предотвращу неконтролируемые повторные клики, не объявляя финальный успех. При известном временном отказе применю ограниченную политику; при потерянном ответе сначала выясню исход. Черновик и подтверждённую базу держу раздельно, поэтому refetch не стирает новые поля.\n\nПосле бюджета попыток покажу, какая работа не подтверждена, и предложу ручной повтор, исправление причины либо разрешённый способ сохранить содержимое. Экспорт и локальная копия доступны только при соответствующей политике. Для секретных данных не обещаю восстановление после закрытия без допустимого места хранения.\n\nНа навигации предупреждаю о риске и позволяю остаться. Проверяю восстановление сессии, возвращение сети и доступность действий с клавиатуры. Метрика успеха — не исчезновение плашки, а подтверждение нужной редакции или осознанное решение пользователя."
    points:
      - 'Отклик не равен успеху'
      - 'Неопределённый исход выясняется'
      - 'Refetch не стирает черновик'
      - 'Автоповторы ограничены'
      - 'Путь сохранения соответствует безопасности'
