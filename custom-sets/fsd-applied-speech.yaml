  - id: 'speech-fsd-a-a7-2-001'
    level: 'middle'
    question: 'Спроектируй доступный сценарий: виртуальная таблица подгружает строки, из неё открывают форму в диалоге, после сохранения запись исчезает из текущего фильтра. Какие контракты нужны?'
    answer: "Таблица имеет логические ID и порядок, согласованные с загрузкой и фокусом. Переход клавиатурой за DOM-окно должен подготовить нужную запись, а не перескочить к переиспользованной строке. Если виртуализатор этого не обеспечивает, сравню пагинацию.\n\nДиалог получает доступное имя, осмысленный начальный фокус, правила Tab и закрытия; основной экран не должен оставаться доступным как параллельная модальная область. Ошибки формы объявляются понятно и не стирают ввод.\n\nПосле успеха старая кнопка может исчезнуть, поэтому экран задаёт логическую цель возврата, например следующую запись или заголовок обновлённого списка. Подгрузка объявляет краткий итог, не перечитывая весь grid. Эти требования проверю клавиатурой и скринридером до выбора общего компонента: исправление одной роли после релиза не реализует сценарий."
    points:
      - 'Навигация согласована с логическим порядком'
      - 'Диалог владеет поведением, не только ARIA'
      - 'Ошибки и загрузка имеют доступные статусы'
      - 'Возврат фокуса учитывает исчезновение инициатора'
      - 'Выбор компонентов включает a11y-проверку'
    topic: 'A7. Cross-cutting requirements'
    subtopic: 'A7.2 Accessibility architecture'
    links:
      - 'https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/'
      - 'https://www.w3.org/WAI/ARIA/apg/patterns/grid/'
      - 'https://www.w3.org/TR/WCAG22/#status-messages'
  - id: 'speech-fsd-a-a7-3-001'
    level: 'senior'
    question: 'Спроектируй наблюдаемость критической формы с несколькими API и retry, не отправляя чувствительное содержимое. Как связать продуктовую регрессию с серверной причиной?'
    answer: "Введу ID пользовательского действия, а отдельные запросы и повторы сохраню как связанные попытки и spans. Контекст трассировки передаётся только согласованным получателям; traceparent не содержит бизнес-текст и не даёт полномочий. Для cross-origin учту разрешённые заголовки и границу доверия.\n\nОтдельно измерю воронку завершения, время ключевого взаимодействия, JS errors и сетевые исходы. Конверсия может падать без исключений, а число HTTP-ошибок расти из-за retry без роста числа неуспешных действий. У метрик будут понятные знаменатели и сегменты версий.\n\nСобытия имеют allowlist полей: технический код, этап, версия, обезличенный контекст по политике. Тело формы, токены, секреты URL и произвольный baggage не отправляю. Фильтрация выполняется до передачи; хеш не считаю универсальной анонимизацией. Проверю payload и путь поддержки по ID, а также сроки хранения и доступ к данным."
    points:
      - 'Действие связано с попытками и трассировкой'
      - 'Четыре вида метрик не подменяют друг друга'
      - 'Контекст переносится доверенно'
      - 'Минимизация до отправки'
      - 'Диагностика проверена реальным сценарием'
    topic: 'A7. Cross-cutting requirements'
    subtopic: 'A7.3 Observability'
    links:
      - 'https://www.w3.org/TR/trace-context/'
      - 'https://opentelemetry.io/docs/languages/js/propagation/'
      - 'https://opentelemetry.io/docs/security/handling-sensitive-data/'
  - id: 'speech-fsd-a-a7-4-001'
    level: 'senior'
    question: 'Выбери тесты и rollout нового пути условного сохранения формы: есть версии, autosave и открытые старые клиенты. Что должно быть проверяемо до включения?'
    answer: "Запишу инварианты: новый ввод не подтверждается старым ack, конфликт не затирает черновик, потерянный ответ не превращается в новую опасную команду. Unit проверяют переходы, integration — конкуренцию ввода и ответов, contract — версии и машинные ошибки API, E2E — навигацию и восстановление значимого пути. Не дублирую все ветки на самом дорогом уровне.\n\nКод поставлю за флагом со стабильной когортой. До включения определю события завершения, хвост времени, частоту конфликтов, потери работы и сетевую цену. Задам пороги остановки и сравнение поколений клиентов.\n\nВыключение флага направляет новые действия, но не отменяет in-flight запись. API и сохранённое состояние должны переживать переход. При несовместимости предложу безопасное обновление с сохранением разрешённого ввода. Проверю rollback как сценарий, а не только значение конфигурации."
    points:
      - 'Уровень теста связан с риском'
      - 'Контракт покрывает версии и ошибки'
      - 'Когорта стабильна'
      - 'Есть метрики и критерии остановки'
      - 'Rollback учитывает эффекты и старые вкладки'
    topic: 'A7. Cross-cutting requirements'
    subtopic: 'A7.4 Testability & rollout'
    links:
      - 'https://martinfowler.com/articles/feature-toggles.html'
      - 'https://www.w3.org/TR/trace-context/'
      - 'https://reactrouter.com/start/framework/data-loading'
  - id: 'speech-fsd-a-a7-4-002'
    level: 'senior'
    question: 'Нужно безопасно выкатить новую форму заявки с autosave и повтором после timeout. Есть чувствительный ввод, старые вкладки, staged rollout на аккаунты. Защити решение: гарантии, проверки, телеметрия и выключение.'
    answer: "Сначала определю, что значит сохранить текущую редакцию и завершить создание заявки. Autosave подтверждает конкретный текст; старый ack не снимает dirty у нового ввода. После потерянного ответа создания выясняю исход или повторяю ту же логическую попытку по серверному контракту, не создавая новый ID вслепую. Локальное сохранение чувствительного текста допускается только по политике.\n\nUnit проверяют модель, integration — гонки и отказ, contract — версии и идентичность повторов, E2E — путь человека с навигацией и восстановлением. Добавлю доступные статусы и управление фокусом после ошибок. Сервер проверяет права и инварианты независимо от флага.\n\nТелеметрия связывает действие и попытки без тела формы и секретов. Сравниваю завершение, задержки, конфликты и сетевую нагрузку по версиям и когортам. Флаг стабилен для аккаунта, API поддерживает старые вкладки. Выключение блокирует новые включения, но не отменяет уже принятую запись: in-flight результат завершается по прежнему контракту, ввод сохраняется разрешённым способом. Пороги остановки и сам переход проверены заранее."
    points:
      - 'Подтверждение относится к редакции'
      - 'Timeout записи требует выяснения'
      - 'Чувствительный ввод и статусы защищены'
      - 'Тесты и метрики отражают риски'
      - 'Выключение не подменяет серверную отмену'
    topic: 'A7. Cross-cutting requirements'
    subtopic: 'A7.4 Testability & rollout'
    links:
      - 'https://martinfowler.com/articles/feature-toggles.html'
      - 'https://www.w3.org/TR/trace-context/'
      - 'https://reactrouter.com/start/framework/data-loading'
