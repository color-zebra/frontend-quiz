  - id: 'speech-fsd-a-a4-4-001'
    level: 'senior'
    question: 'Спроектируй старт и восстановление live-дашборда: snapshot приходит по HTTP, события могут появиться во время чтения, replay хранится час, а пользователь может вернуться через сутки.'
    answer: "Потребую общий серверный watermark. Снимок состояния до позиции W соединю с replay после W, тогда события во время чтения не пропадут. Если сначала открывается поток, ограниченно буферизую и применяю только изменения после включённой в snapshot границы. Иначе возможно двойное приращение.\n\nПосле короткого разрыва использую сохранённую непрерывную позицию. Через сутки журнал может быть недоступен: получаю новый снимок и его продолжение, не продвигаю cursor вручную поверх старой базы. Во время восстановления UI отличает подключённый канал от актуальных данных.\n\nОбласть refetch зависит от повреждения: одну карточку можно восстановить отдельно, неизвестные изменения состава списка требуют шире перечитать зависимые данные. Локальный ввод сохраняю раздельно. Проверю событие между snapshot и подпиской, дубль из буфера, переполнение буфера и истёкший replay."
    points:
      - 'Snapshot и поток имеют общую границу'
      - 'Включённые эффекты не применяются повторно'
