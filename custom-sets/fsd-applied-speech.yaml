  - id: 'speech-fsd-a-a4-1-001'
    level: 'middle'
    question: 'Нужно показывать статус сборок в корпоративной сети: редкие серверные события, команды по кнопке, часть прокси режет потоки. Сравни polling, long polling, SSE и WebSocket и предложи fallback.'
    answer: "Зафиксирую направления и бюджет: команды можно отправлять обычным HTTP, события нужны сервер→клиент. При поддержке потока SSE проще двустороннего протокола WebSocket. WebSocket оправдан при частом обмене в обе стороны, а не самим словом real-time. Long polling уменьшает холостые ответы, удерживая запрос до события или таймаута; он тоже зависит от допустимости долгих соединений.\n\nПри широком бюджете достаточно polling с запасом на время чтения. Для заблокированных потоков включу согласованный опрос snapshot и покажу более редкое обновление. Число параллельных механизмов и попыток ограничу.\n\nПроверю частоту изменений, стоимость пустых ответов, соединений и восстановление после прокси-таймаута. Ни один транспорт не даёт сам по себе replay пропущенных событий или бизнес-подтверждение команды: это отдельный прикладной контракт."
    points:
      - 'Выбор по направлению и задержке'
      - 'Long polling удерживает и возобновляет запрос'
      - 'SSE не требует WebSocket для редких команд'
      - 'Fallback имеет согласованный бюджет'
      - 'Транспорт не подменяет протокол восстановления'
