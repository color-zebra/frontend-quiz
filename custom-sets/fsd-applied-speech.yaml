  - id: 'speech-fsd-a-a6-1-001'
    level: 'senior'
    question: 'Выбери rendering/delivery для статей, каталога с допустимым кратким отставанием и закрытого редактора. Объясни цену hydration, streaming и частичной интерактивности.'
    answer: "Для статей, меняющихся при публикации, выберу SSG с обновлением HTML и CDN. Каталогу при допустимом старом результате подходит регенерация кешированного HTML, если платформа обещает нужные сроки и ошибки обновления видны. Для требования актуального содержания в каждом первом HTML понадобился бы SSR без неподходящего stale-кеша. Закрытому редактору допустим CSR, если измерены первоначальная загрузка и устройства.\n\nHydration требует клиентского кода и согласования первого представления; HTML может быть видим раньше готовности действий. Streaming позволяет не держать статью за независимым медленным блоком, но не уменьшает автоматически серверную работу и не создаёт атомарный snapshot. Частичная интерактивность ограничивает активируемые области, добавляя архитектурные границы.\n\nГибрид увеличивает число путей кеширования и наблюдения, поэтому проверю time-to-content, готовность ключевых действий, стоимость сервера и обновление контента. Персональные ответы не попадают в публичный общий кеш."
    points:
      - 'Стратегия по требованиям маршрута'
      - 'ISR имеет платформенный контракт обновления'
      - 'SSR учитывает runtime-затраты'
      - 'HTML и интерактивность различены'
      - 'Гибрид имеет цену и защищает приватность'
