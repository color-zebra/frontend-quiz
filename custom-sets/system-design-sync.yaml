    explanation: |
      Проектирование офлайн-режима начинают со сценариев. Без сети честно работает то, что человек делает сам и в чём
      устройство уверено. То, что требует решения сервера или других людей, — общий календарь, назначение, оплата, —
      без сети недоступно или показывается с оговоркой.
    links:
