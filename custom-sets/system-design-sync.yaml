  - id: sds-local-first-004
    topic: Офлайн прежде всего
    subtopic: Локальная модель данных
    level: senior
    question: |
      Новая версия приложения выездного мастера меняет формат заявок в IndexedDB: открывает базу с новым номером
      версии и переносит данные в событии `upgradeneeded`. У части мастеров после обновления приложение зависает
      на заставке: мастер обновил приложение в одной вкладке, а в другой осталась открытой старая версия. Как
      исправить?
    options:
      - text: 'Перед миграцией удалять базу и загружать заявки заново с сервера'
        why: 'Без сети загрузить нечего, а неотправленные отметки мастера пропадут вместе с базой.'
      - text: 'Старая вкладка по versionchange закрывает базу, новая объясняет ожидание'
        correct: true
        why: 'Обновление ждёт, пока старая вкладка держит базу. Получив versionchange, она должна закрыть соединение и предложить перезагрузку, а новая — показать, чего она ждёт.'
      - text: 'Открывать базу в новой версии со старым номером, чтобы не будить старую вкладку'
        why: 'Тогда событие upgradeneeded не случится, и данные останутся в старом формате, с которым новый код не умеет работать.'
      - text: 'Хранить заявки в кэше Service Worker, где версий базы нет'
        why: 'Данные в кэше Service Worker неудобно читать и менять, а формат ответов всё равно придётся переносить.'
    explanation: |
      Миграция локальных данных в IndexedDB идёт по номеру версии базы: новая версия открывает базу с большим номером
      и переносит данные в `upgradeneeded`. Пока старая вкладка держит базу, обновление ждёт: старая получает
      `versionchange` и должна закрыть соединение; если не закрыла, новая получает `blocked`. Сам перенос идёт одной
      транзакцией: если он прервётся, база останется в старой версии и перенос повторится.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/IDBOpenDBRequest/blocked_event

  - id: sds-local-first-005
    topic: Офлайн прежде всего
    subtopic: Локальная модель данных
    level: senior
    multiple: true
    question: |
      Кладовщики работают с приложением складского учёта на iPad, часто в зонах без сети, и закрывают приложение,
      уходя из зоны. Накопленные операции должны уйти на сервер как можно раньше, а кладовщик должен знать, сколько
      их ещё не ушло. Какие решения нужны?
    options:
      - text: 'Положиться на Background Sync: Service Worker отправит всё, когда появится сеть'
        why: 'В Safari, а значит, на iPad, Background Sync нет. Операции не уйдут, пока приложение закрыто.'
      - text: 'Отправлять накопленное при открытии приложения и по событию online'
        correct: true
        why: 'Это работает во всех браузерах. Без Background Sync операции уйдут, как только кладовщик откроет приложение со связью.'
      - text: 'Хранить операции в кэше Service Worker, а не в IndexedDB'
        why: 'Кэш Service Worker предназначен для ответов на запросы. Операции в нём неудобно читать, менять и отправлять по порядку.'
      - text: 'Показывать на главном экране число неотправленных операций'
        correct: true
        why: 'На iPad операции уйдут только при открытии приложения, и кладовщик должен это видеть, а не думать, что всё отправлено.'
      - text: 'Держать вкладку открытой в фоне, чтобы она отправила всё сама'
        why: 'Кладовщики закрывают приложение, а фоновую вкладку на iPad браузер может заморозить или выгрузить.'
    explanation: |
      Service Worker может отправить накопленное в фоне через Background Sync, но по caniuse это работает только
      в браузерах на Chromium. В Safari и Firefox его нет, поэтому основа — отправка при открытии приложения и по
      событию `online`, а Background Sync — ускорение там, где он есть. Обещать «уйдёт, как только появится связь»
      на iPad нельзя — честнее показать, что ждёт отправки.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Background_Synchronization_API

  - id: sds-oplog-001
    topic: Офлайн прежде всего
    subtopic: Надёжный журнал операций
    level: junior
    question: |
      Почтовый клиент без сети записывает действия в журнал операций. В записи «перенести письмо в папку „Счета“»
      кроме идентификатора операции хранится версия письма, которую видел человек. Зачем она?
    options:
      - text: 'Чтобы сервер понял, менялось ли письмо после того, что видел человек'
        correct: true
        why: 'Пока устройство было без сети, письмо могли изменить с другого устройства. По версии сервер это увидит и решит, применять ли действие.'
      - text: 'Чтобы сервер не применил одно и то же действие дважды при повторе'
        why: 'От дублей защищает идентификатор операции. Версия говорит о другом — на какое состояние письма опиралось действие.'
      - text: 'Чтобы отправлять действия журнала по порядку'
        why: 'Порядок задают зависимости и последовательность записей, а не версия письма.'
      - text: 'Чтобы журнал сам удалял запись, когда версия письма на сервере устареет'
        why: 'Запись удаляют, когда сервер её подтвердил. Устаревшая версия — повод для проверки на сервере, а не для удаления.'
    explanation: |
      Запись журнала хранит всё, чтобы надёжно её отправить и разобраться при сбое: идентификатор операции против
      дублей, данные, версию, на которую опиралась операция, зависимости и состояние. Версия особенно важна после долгого
      офлайна: по ней сервер видит, что объект с тех пор изменили, как в курсе 2, уроке «Версии и конфликты».
    links:
      - https://doc.replicache.dev/concepts/how-it-works

  - id: sds-oplog-002
    topic: Офлайн прежде всего
    subtopic: Надёжный журнал операций
    level: middle
    question: |
      В почтовом клиенте человек без сети написал письмо с вложением на 20 МБ и нажал «Отправить». Вложение
      загружается отдельно, а команда «отправить письмо» — маленький запрос. Когда связь вернулась, письмо ушло
      без вложения: команда дошла раньше, чем загрузился файл. В журнале обычно десятки писем, и люди ждут, что
      короткие уйдут сразу, а не после чужого большого вложения. Как исправить?
    options:
      - text: 'Записать в журнале, что «отправить» зависит от загрузки вложения'
        correct: true
        why: 'Журнал отправит команду, только когда сервер подтвердит загрузку вложения, и письмо уйдёт целиком.'
      - text: 'Отправлять вложение внутри команды «отправить письмо»'
        why: 'Двадцать мегабайт в одном запросе по плохой сети будут обрываться снова и снова. Большие файлы грузят отдельно, а команда ссылается на них.'
      - text: 'Отправлять команду «отправить» через минуту после начала загрузки'
        why: 'Загрузка по плохой сети может длиться и десять минут. Пауза наугад не гарантирует порядок.'
      - text: 'Отправлять все операции журнала строго по одной, по времени создания'
        why: 'Порядок соблюдётся, но одна долгая загрузка задержит все письма. Зависимость нужна только между этой командой и её вложением.'
    explanation: |
      Порядок по объекту знает последовательность команд, но не знает, что команда ждёт загрузку файла. Поэтому
      зависимости записывают явно: операция уходит, только когда подтверждены те, от которых она зависит. Большие файлы
      грузят отдельно, а операция ссылается на загруженный файл.
    links:
      - https://doc.replicache.dev/concepts/how-it-works

  - id: sds-oplog-006
    topic: Офлайн прежде всего
    subtopic: Надёжный журнал операций
    level: middle
    question: |
      Мобильная CRM торгового представителя работает без сети. За час в одной сделке он трижды поправил поле
      «комментарий» и отметил «начал встречу» и «закончил встречу» — по этим отметкам считают время встреч для его
      премии. Связи всё ещё нет, ничего не отправлено. Какие записи журнала можно сжать до последней перед отправкой?
    options:
      - text: 'Три правки комментария — до последней из них'
        correct: true
        why: 'Промежуточные тексты комментария никому не нужны: важно, каким он стал. Записи ещё не отправлены, и их можно заменить одной.'
      - text: 'Отметки начала и конца встречи — до одной последней'
        why: 'По обеим отметкам считают время встречи. Если оставить одну, длительность встречи потеряется.'
      - text: 'Все пять записей, включая отметки, — до одного итогового состояния сделки'
        why: 'Сжатие убьёт отметки начала и конца, а вместе с ними и время встречи для премии.'
      - text: 'Ничего: записи журнала объединять нельзя'
        why: 'Можно, если записи ещё не отправлены и промежуточные значения никому не нужны. Три правки комментария — ровно такой случай.'
    explanation: |
      Сжатие журнала — замена нескольких неотправленных изменений одной и той же вещи последним значением. Его
      применяют только там, где промежуточные значения никому не нужны: текст, сумма до отправки. Отметки, где важен
      каждый шаг и его время, не сжимают, а уже отправленные записи не трогают.
    links:
      - https://doc.replicache.dev/concepts/how-it-works

  - id: sds-oplog-004
    topic: Офлайн прежде всего
    subtopic: Надёжный журнал операций
    level: senior
    question: |
      В приложении выездного мастера операция «приложить фото к акту» десятый раз подряд получает ответ 413: файл
      больше допустимого размера. Остальные операции этого мастера уходят нормально. Что делать с этой операцией?
    options:
      - text: 'Повторять с растущей паузой, пока сервер её не примет'
        why: 'Ответ 413 на этот файл не изменится, сколько ни повторяй. Это окончательный отказ для этих данных.'
      - text: 'Удалить её из журнала, чтобы она не мешала остальным операциям'
        why: 'Фото знает только устройство мастера. Удалив операцию молча, его потеряют навсегда.'
      - text: 'Пометить «нужно внимание» и предложить мастеру сжать фото'
        correct: true
        why: 'Отказ окончательный для этого файла: повтор бесполезен, а удаление теряет данные. Мастер видит причину и может отправить фото поменьше.'
      - text: 'Остановить весь журнал мастера, пока операция не пройдёт'
        why: 'Застрявшая операция должна держать только свои зависимые. Остальные операции мастера к фото не относятся.'
    explanation: |
      Застрявшая операция держит только свои зависимые, её не удаляют молча, а окончательный отказ отличают
      от временного. 413 на конкретный файл — окончательный: повторять бессмысленно, нужен выход для человека. Если же
      временный сбой повторяется много раз, операцию тоже помечают «нужно внимание», и о ней узнаёт поддержка.
    links:
      - https://doc.replicache.dev/concepts/how-it-works

  - id: sds-oplog-005
    topic: Офлайн прежде всего
    subtopic: Надёжный журнал операций
    level: senior
    multiple: true
    question: |
      После дня без сети почтовый клиент отправляет журнал из 60 операций по 15 разным письмам. Сервер, как
      у Replicache, сообщает номер последней применённой операции клиента. Какие правила отправки верны?
    options:
      - text: 'Операции разных писем отправлять параллельно, внутри письма — по зависимостям'
        correct: true
        why: 'Письма между собой не связаны, и задержка одного не должна держать остальные.'
      - text: 'Всё с номером не больше последней применённой операции считать подтверждённым'
        correct: true
        why: 'Сервер применил эти операции. Клиент убирает их из журнала, а повтор уже применённого сервер узнает и пропустит.'
      - text: 'Отправлять все 60 операций строго по одной, чтобы не нарушить порядок'
        why: 'Порядок нужен только внутри зависимых операций. Строгая очередь заставит 14 писем ждать самое медленное.'
      - text: 'Повторять операцию с окончательным отказом, пока она не пройдёт'
        why: 'Окончательный отказ не изменится. Его показывают человеку, а не повторяют.'
      - text: 'Удалять операцию из журнала, как только запрос ушёл'
        why: 'Запрос мог потеряться. Операцию убирают только после подтверждения сервера.'
    explanation: |
      Журнал отправляет независимые цепочки параллельно, а внутри цепочки соблюдает зависимости. Подтверждённым считается
      то, что сервер применил, — его удобно сообщать номером последней применённой операции клиента. Окончательные
      отказы не повторяют, а неподтверждённое не удаляют.
    links:
      - https://doc.replicache.dev/concepts/how-it-works

  - id: sds-sync-001
    topic: Офлайн прежде всего
    subtopic: Синхронизация после долгого офлайна
    level: junior
    question: |
      Приложение для учёта семейных расходов синхронизируется в три шага: отправить свои операции, получить чужие
      изменения, свести. Что происходит на шаге «получить чужие изменения»?
    options:
      - text: 'Клиент запрашивает изменения после курсора и получает новый курсор'
        correct: true
        why: 'Курсор отмечает, до какого места клиент уже знает данные сервера. Сервер отдаёт изменения после него и новый курсор для следующего раза.'
      - text: 'Клиент отправляет серверу все свои неподтверждённые операции'
        why: 'Это первый шаг — отправить своё. Здесь клиент получает чужое.'
      - text: 'Клиент каждый раз загружает все расходы целиком, с нуля'
        why: 'Целиком загружают, только если курсор слишком старый. Обычно приходят лишь изменения после курсора.'
      - text: 'Клиент удаляет из журнала операции, которые сам считает устаревшими'
        why: 'Из журнала убирают только операции, которые подтвердил сервер, — это часть сведения, и решает сервер, а не возраст.'
    explanation: |
      Протокол синхронизации в общих чертах: отправить свои операции (push), получить чужие изменения с курсора (pull)
      и свести — применить изменения сервера и заново наложить ещё не подтверждённые свои. Курсор родственен позиции
      в потоке из курса «Реальное время и большие списки»: он говорит серверу, что клиенту уже известно.
    links:
      - https://doc.replicache.dev/concepts/how-it-works

  - id: sds-sync-002
    topic: Офлайн прежде всего
    subtopic: Синхронизация после долгого офлайна
    level: middle
    question: |
      Календарь хранит изменения для синхронизации 30 дней. Человек не открывал приложение на ноутбуке 45 дней,
      а потом открыл и запросил изменения со своего старого курсора. Что должен сделать сервер?
    options:
      - text: 'Отдать изменения за последние 30 дней, которые у него есть'
        why: 'Изменения за первые 15 дней потеряны, и копия на ноутбуке молча останется неполной.'
      - text: 'Сообщить, что курсор устарел, и отдать снимок с новым курсором'
        correct: true
        why: 'Догнать по изменениям нельзя: часть стёрта. Снимок даёт полное текущее состояние, а новый курсор — точку для следующей синхронизации.'
      - text: 'Отказать в синхронизации, пока человек не переустановит приложение'
        why: 'Переустановка сотрёт неотправленные изменения на ноутбуке. Снимок решает задачу без этого.'
      - text: 'Продлить хранение изменений до 45 дней для этого клиента'
        why: 'Изменения за первые дни уже стёрты, вернуть их нельзя. Да и следующий человек может не заходить 60 дней.'
    explanation: |
      Курсор работает, пока сервер хранит изменения после него. Если курсор слишком старый, сервер честно говорит об этом
      и отдаёт снимок целиком с новым курсором — как перечитывание снимка в курсе «Реальное время и большие списки».
      Неотправленные операции клиента при этом сохраняются и отправляются, как обычно.
    links:
      - https://doc.replicache.dev/concepts/how-it-works

  - id: sds-sync-003
    topic: Офлайн прежде всего
    subtopic: Синхронизация после долгого офлайна
    level: middle
    question: |
      Приложение заметок поменяло формат операции «изменить заметку»: появилось поле с цветом. В день выпуска сервер
      перестал принимать операции старого формата. Люди, которые неделю писали заметки без сети в походе, вернулись,
      и все их правки получили отказ. Как надо было выпускать изменение?
    options:
      - text: 'Версия формата в операциях и приём старого дольше самого долгого офлайна'
        correct: true
        why: 'Сервер отличит старую операцию от сломанной новой и примет её, подставив цвет по умолчанию. Люди после похода ничего не потеряют.'
      - text: 'Выпускать новый формат ночью, когда люди спят и не правят заметки'
        why: 'Правки, накопленные без сети, лежат на устройствах независимо от времени выпуска. Ночь их не спасёт.'
      - text: 'Перед выпуском удалять у всех пользователей неотправленные операции старого формата'
        why: 'Неделя записей в походе пропадёт молча — ровно то, чего нельзя допускать.'
      - text: 'Принимать старые операции от тех, кто обновится в день выпуска'
        why: 'Кто был без сети, обновится позже. Как раз их правки и нужно принять.'
    explanation: |
      Формат данных может смениться, пока операции лежат на устройствах. Поэтому у каждой операции есть версия формата,
      сервер принимает старый формат дольше самого долгого возможного офлайна, а клиент переводит операции в новый
      формат сам, только если перевод однозначен. Старый и новый код какое-то время работают одновременно.
    links:
      - https://www.inkandswitch.com/essay/local-first/

  - id: sds-sync-004
    topic: Офлайн прежде всего
    subtopic: Синхронизация после долгого офлайна
    level: senior
    question: |
      Кладовщик полдня без сети пересчитывал товар и отметил: «В ячейке 12 — 37 штук». Операция опиралась на версию
      остатка, где было 40. За это время сервер провёл продажи: по его данным в ячейке 35. Связь вернулась. Как
      обработать пересчёт?
    options:
      - text: 'Отклонить пересчёт: он опирался на устаревшую версию остатка'
        why: 'Пересчёт — факт, который знает только устройство: кладовщик видел 37 штук. Выбросив его, система потеряет единственную правду о ячейке.'
      - text: 'Записать в остаток 37, заменив данные сервера'
        why: 'Продажи, прошедшие после пересчёта, пропадут из учёта. Факт устройства не должен молча затирать факты сервера.'
      - text: 'Принять пересчёт как факт и пометить расхождение для человека'
        correct: true
        why: 'Оба факта настоящие: кладовщик насчитал 37, а продажи действительно были. Сервер сохраняет оба и передаёт расхождение человеку.'
      - text: 'Сравнить время на устройстве и на сервере и оставить более позднее'
        why: 'Часы устройств расходятся, а главное — оба значения верны каждое в своё время. Выбор одного теряет второе.'
    explanation: |
      После долгого расхождения конфликты разбирают по заранее решённому правилу, чьё слово главное. Факты, которые знает
      только устройство, — пересчёт, полученные деньги, передача заказа — сервер не выбрасывает, даже если они
      противоречат его данным. Он принимает факт и помечает расхождение для человека.
    links:
      - https://doc.replicache.dev/concepts/how-it-works

  - id: sds-sync-005
    topic: Офлайн прежде всего
    subtopic: Синхронизация после долгого офлайна
    level: senior
    multiple: true
    question: |
      После недели без сети приложение заметок синхронизировалось. 120 операций прошли, 3 не удалось ни применить,
      ни разрешить автоматически. Что должен увидеть и получить человек?
    options:
      - text: 'Итог со списком трёх операций, причинами и действиями: в поддержку, повторить, удалить'
        correct: true
        why: 'Человек понимает, что именно не дошло и что с этим сделать.'
      - text: 'Возможность работать дальше с синхронизированными заметками'
        correct: true
        why: 'Три проблемные операции не должны блокировать остальные 120 и всю работу.'
      - text: 'Сохранённые три операции — на устройстве и в журнале ошибок на сервере'
        correct: true
        why: 'Ничего не теряется молча: операции ждут решения, а поддержка видит то же, что и человек.'
      - text: 'Автоматический повтор трёх операций при каждом запуске, пока не пройдут'
        why: 'Без решения человека или поддержки повтор даст тот же отказ, а человек так и не узнает об этих операциях. Повторяют вручную — после того, как что-то изменили.'
      - text: 'Короткое «Ошибка синхронизации» и кнопку «Повторить»'
        why: 'Человек не знает, что не дошло, а повтор неразрешимых операций ничего не изменит.'
    explanation: |
      Частично неразрешимые конфликты — нормальная часть долгого офлайна. Правила: ничего не теряется молча, человек
      видит итог со списком и выходом, работа не блокируется, а поддержка видит то же, что и человек.
    links:
      - https://doc.replicache.dev/concepts/how-it-works
