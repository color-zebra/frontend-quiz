title: 'Системный дизайн: синхронизация и офлайн'
lessons:
  - id: sds-intro
    topic: Введение
    subtopic: Одни данные в разных местах
    title: Когда одни данные меняют в нескольких местах
    body: |
      ## Какую проблему решаем

      В курсе «Реальное время и большие списки» у данных был один хозяин — сервер. Он знал правду, а клиент её
      догонял: получал события, переподключался, перечитывал снимок. Сам клиент данные почти не менял, а если менял —
      отправлял запрос и ждал ответа.

      Теперь сервис доставки вырос ещё немного, и жалобы снова другие:

      - **менеджер ресторана:** «У меня кабинет открыт в трёх вкладках, и на каждый новый заказ звонок звучит трижды»;
      - **покупатель:** «Добавил пиццу в корзину на ноутбуке, а на телефоне её нет, и оттуда я оформил заказ без неё»;
      - **менеджер:** «Нажал „Закрыть ресторан на вечер“, блюда ушли в стоп-лист, а заказы продолжают приходить»;
      - **организатор группового заказа:** «Коллега добавил салат, пока я оплачивал, и салат пропал — или он
        оплачен, или нет, никто не понимает»;
      - **маркетолог:** «Мы с владельцем правили описание ресторана одновременно, и мои правки исчезли»;
      - **курьер:** «Полдня ездил по области без связи, а вечером половина моих отметок „доставил“ не дошла».

      Во всех этих историях одни и те же данные меняют в нескольких местах сразу. Об этом курс.

      ## Четыре расстояния

      Места, где живут копии одних данных, удобно расположить по расстоянию — и по тому, как долго копии могут жить
      порознь.

      1. **Несколько вкладок одного браузера.** Копии разделены миллисекундами: у вкладок общие хранилища, и они
         могут сообщить друг другу об изменении почти мгновенно. Но каждая держит свою память и свои соединения.
      2. **Несколько устройств одного человека и разные люди.** Копии разделены сетью и секундами: чужое изменение
         клиент узнаёт, только когда спросит сервер или сервер ему сообщит.
      3. **Несколько людей в одном документе одновременно.** Правки идут непрерывно и с нескольких сторон, и каждая
         должна встать на своё место, даже если двое пишут в одной строке.
      4. **Устройство без сети.** Копии живут порознь часами и днями. За это время на сервере успевает измениться всё,
         а на устройстве накапливаются десятки действий.

      Чем дальше расстояние, тем дольше копии расходятся, тем больше успевает накопиться и тем труднее их свести.
      Поэтому курс идёт от близкого к далёкому.

      ## Что будет в курсе

      **Согласованность между клиентами** — когда копии расходятся ненадолго.
      - Несколько вкладок: как вкладки сообщают друг другу об изменениях и как выбрать одну, которая держит соединение.
      - Другие устройства и другие люди: черновик на устройстве против сохранённого на сервере и что делать,
        когда твоя копия устарела.
      - Несколько связанных изменений: одно нажатие — несколько шагов, и часть из них не прошла.

      **Совместная работа** — когда правят одно и то же одновременно.
      - Что значит «работать вместе»: какие бывают требования и какова единица конфликта.
      - Блокировки, версии и «последняя запись побеждает» — где их хватает.
      - Совместный текст: преобразование операций (OT) и CRDT — какие бывают алгоритмы и чем они отличаются.
      - Когда связь вернулась: новый участник, расхождение копий, смена прав посреди работы.

      **Офлайн прежде всего** — когда копии расходятся надолго.
      - Данные живут на устройстве: что должно работать без сети и сколько данных хранить.
      - Журнал операций: зависимости между действиями и застрявшие операции.
      - Синхронизация после долгого офлайна: протокол, конфликты и смена формата данных.

      ## Как курс опирается на прошлые

      Здесь не будет заново объяснено то, что уже разобрано подробно. Если урок опирается на прошлый материал,
      он напоминает его одной-двумя фразами и называет урок.

      - Кто владелец данных и почему двусторонняя синхронизация почти всегда ломается — курс 1, «Кто главный
        по данным». Весь этот курс — о случаях, когда без нескольких копий не обойтись.
      - Версии, ответ 409 и четыре способа разрешить конфликт — курс 2, «Версии и конфликты».
      - Очередь действий, «сначала записать, потом отправить» и идентификатор операции — курс 2, «Работа без сети
        и очередь действий». Здесь — что ломается, когда офлайн длится не минуты, а дни.
      - Service Worker и оболочка приложения — курс «Доставка и качество», «Service Worker и обновления».
      - Номера событий, версии, надгробия, снимок и догоняющие события, присутствие — курс «Реальное время и большие
        списки».

      ## Что нового в сервисе доставки

      - **кабинет ресторана в нескольких вкладках** и на нескольких устройствах;
      - **корзина покупателя** на телефоне и ноутбуке одновременно;
      - **кнопка «Закрыть ресторан на вечер»**, за которой стоят три изменения;
      - **групповой заказ в офис:** ссылка на общую корзину, до 20 участников добавляют блюда одновременно;
      - **описание ресторана** и **регламенты поддержки**, которые правят несколько человек;
      - **приложение курьера**, которое работает целую смену без сети и обновляется посреди неё.

      ## Типичные ошибки

      - **Считать, что вкладка у человека одна.** Звонок звучит трижды, а правка в одной вкладке затирается старой
        копией из другой.
      - **Решать любую совместность одним приёмом.** Для корзины на двух устройствах хватает версии, а для текста,
        который пишут пятеро, нужен совсем другой механизм.
      - **Делать офлайн «очередью на минутку» для дней без сети.** То, что работает при обрыве на две минуты,
        ломается, когда за смену накопилось сорок действий и вышла новая версия приложения.
      - **Терять правки молча.** Когда свести копии не удалось, человек должен узнать об этом и получить свою работу
        обратно.

      ## Как спрашивают на интервью

      - «Спроектируйте приложение заметок, которое работает без сети и синхронизируется между устройствами» —
        разговор о локальной копии, журнале операций и протоколе синхронизации.
      - «Спроектируйте совместный редактор документов» — требования к совместной работе, OT или CRDT, восстановление
        после обрыва.
      - «Пользователь открыл приложение в двух вкладках. Что может пойти не так?» — координация вкладок.

      ## Коротко

      - Курс о данных, которые меняют сразу в нескольких местах: во вкладках, на устройствах, у разных людей и без сети.
      - Чем дальше места друг от друга, тем дольше копии живут порознь и тем труднее их свести, поэтому курс идёт
        от вкладок к долгому офлайну.
      - Цель везде одна: свести изменения без потерь, а если не удалось, честно сказать человеку и вернуть ему его
        работу.
      - Курс опирается на версии и конфликты, очередь действий, Service Worker и поток событий из прошлых курсов
        и напоминает их одной-двумя фразами.

      ## Источники

      - [Local-first software — Ink & Switch](https://www.inkandswitch.com/essay/local-first/)
      - [Broadcast Channel API — MDN](https://developer.mozilla.org/en-US/docs/Web/API/Broadcast_Channel_API)

  - id: sds-tabs
    topic: Согласованность между клиентами
    subtopic: Координация вкладок
    title: Несколько вкладок
    body: |
      ## Какую проблему решаем

      Менеджер ресторана держит кабинет открытым в трёх вкладках: доска заказов, меню, отчёты. Доска заказов живёт
      в шапке каждой вкладки — счётчик новых заказов и звук. В курсе «Реальное время и большие списки» мы сделали
      так, что новые заказы приходят по SSE со звуком. Каждая вкладка сделала это сама: на сервере три соединения
      от одного человека, а на каждый новый заказ звонок звучит трижды, вразнобой.

      Вторая беда тише. Менеджер поменял цену «Маргариты» во вкладке «Меню» и закрыл её. Через час он открывает меню
      во второй вкладке, где оно было открыто с утра, видит старую цену и правит в ней описание. Сохранение получает
      ответ 409 (курс 2, «Версии и конфликты»): версия устарела. Защита сработала, но менеджер не понимает, почему
      «кто-то» изменил блюдо, если это был он сам.

      Вкладки одного сайта — это не одно приложение, а несколько копий, которые живут рядом. Урок о том, как им
      договориться.

      ## Что у вкладок общее, а что своё

      **Общее** у всех вкладок одного сайта (точнее, одного источника — origin, сочетания протокола, домена и порта):
      - хранилища: `localStorage`, IndexedDB, куки, кэш Service Worker;
      - сам Service Worker, если он есть.

      **Своё** у каждой вкладки:
      - память JavaScript: состояние React, клиентский кэш вроде TanStack Query, переменные;
      - соединения: SSE, WebSocket, запросы в полёте;
      - таймеры и жизненный цикл: одна вкладка видна, другая скрыта, третью браузер мог заморозить.

      Отсюда главное: если данные лежат в памяти, каждая вкладка видит свою копию, и копии расходятся. Если данные
      лежат в общем хранилище, вкладки видят одно, но не узнают сами, что оно изменилось.

      ## Четыре способа договориться

      ### Сообщить остальным

      **`BroadcastChannel`** — канал сообщений между вкладками, окнами и воркерами одного сайта. Вкладка отправляет
      сообщение, и его получают все остальные, кто открыл канал с тем же именем. Сам объект канала, через который
      отправили сообщение, его не получает; другой объект с тем же именем, даже в той же вкладке, получит.

      ```js
      const channel = new BroadcastChannel('menu');
      channel.postMessage({ type: 'dish-changed', dishId: 'd-12', version: 8 });  // после сохранения
      channel.onmessage = (e) => queryClient.invalidateQueries({ queryKey: ['dish', e.data.dishId] });
      ```

      Старый способ того же — **событие `storage`**: когда одна вкладка меняет `localStorage`, браузер присылает
      событие `storage` остальным вкладкам этого сайта (той, что изменила, — нет). Им пользуются, когда нужно
      и сохранить значение, и оповестить: например, «человек вышел из аккаунта».

      Цена обоих: сообщение никто не хранит. Вкладка, которая в этот момент закрыта, ещё не открыта или выгружена
      браузером из памяти (так телефоны поступают с фоновыми вкладками), его не получит. Замороженная вкладка
      получит его с опозданием, когда её разморозят: по описанию Chrome, задачи замороженной страницы откладываются
      до разморозки. Доставку никто не гарантирует. Поэтому сообщение — подсказка «перечитай», а не
      единственный источник правды.

      ### Перечитать при возврате

      Самый простой и надёжный способ: когда человек возвращается на вкладку, она перепроверяет данные у сервера.
      Это перезапрос при возврате из курса 2, урок «Когда данные устаревают». Он не мгновенный, зато ловит всё —
      и изменения из другой вкладки, и с другого устройства, и пропущенные сообщения.

      ### Общий фоновый скрипт

      **`SharedWorker`** — воркер, один на все вкладки сайта: вкладки подключаются к нему и обмениваются
      сообщениями. Он может держать одно соединение с сервером на всех. Цена: поддержка. Safari поддерживает его
      с версии 16, а в Chrome для Android его годами не было, и поддержка появилась только недавно — проверяйте
      по caniuse. Поэтому без запасного пути на него не опираются. Кроме того, воркер живёт, пока открыта хотя бы одна вкладка,
      и умирает вместе с последней.

      ### Одна вкладка ведущая

      **Ведущая вкладка** (leader) — одна из вкладок, которую выбрали держать общий ресурс: соединение, звук,
      фоновую синхронизацию. Остальные — ведомые: они получают от неё события через `BroadcastChannel`.

      Выбрать ведущую надёжно помогает **Web Locks API** — блокировки, общие для всех вкладок и воркеров сайта.
      Каждая вкладка просит одну и ту же блокировку. Получает её одна, остальные встают в очередь. Блокировка
      держится, пока не завершится обещание, которое вернула функция, — или пока вкладку не закроют. Тогда
      блокировку получает следующая в очереди. Web Locks API и `BroadcastChannel` есть во всех основных браузерах,
      в Safari — с версии 15.4.

      ```js
      const board = new BroadcastChannel('board');
      navigator.locks.request('board-leader', async () => {
        // Эта вкладка — ведущая, пока не закроется
        const source = new EventSource('/restaurants/r-7/live');
        source.onmessage = (e) => { board.postMessage(e.data); handleOrder(e.data); };
        await new Promise(() => {});   // держать блокировку, пока вкладка жива
      });
      ```

      Цена — ведущая вкладка тоже вкладка. Мобильный браузер может приостановить фоновую вкладку целиком:
      блокировку она при этом не отдаёт, а работать перестаёт. Chrome на компьютере в режиме энергосбережения
      не замораживает вкладку, которая держит блокировку, нужную другим вкладкам, а в описании жизненного цикла
      страницы советует самой странице отпускать блокировки по событию `freeze`, когда её замораживают. Поэтому
      ведущая отпускает блокировку и закрывает соединение по `freeze` (это событие есть в браузерах на Chromium),
      а после разморозки снова просит блокировку и встаёт в очередь ведомой. Следующая вкладка из очереди тем временем
      становится ведущей. Safari такого события не присылает: там ведущую могут приостановить без предупреждения.
      Если ведущую приостановили без предупреждения, ведомые её не сменят: у Web Locks API есть опция `steal`, которая отбирает блокировку,
      но спецификация предупреждает: код прежнего владельца не останавливается и дальше работает «без гарантий» —
      он узнает о потере, только если сам следит за обещанием, которое отклоняется при отборе. Поэтому
      ведущая шлёт ведомым пинг через `BroadcastChannel`, а ведомые, не слыша её, хотя бы перечитывают данные
      сами при возврате на вкладку.

      ![Три вкладки кабинета. Ведущая держит блокировку board-leader и единственное соединение SSE с сервером, играет звук и пересылает события двум другим вкладкам через BroadcastChannel. Ниже — ведущую закрыли: блокировку получает следующая вкладка из очереди, открывает своё соединение и становится ведущей](images/sds-tabs.png "Одна вкладка держит соединение и звук, остальные получают события от неё")

      ## Правки из двух вкладок

      Даже если вкладки оповещают друг друга, одна может отправить правку раньше, чем получит сообщение от другой.
      Поэтому последней защитой остаётся проверка версии из курса 2: сервер отклонит сохранение по устаревшей версии.
      Координация вкладок нужна не вместо неё, а чтобы до неё доходило реже, и чтобы человек понимал, что произошло:
      «Это блюдо изменили в другой вкладке» вместо безличного «данные устарели».

      Отдельный случай — вход и выход. Человек вышел из аккаунта в одной вкладке, а в другой продолжает работать
      со старой сессией. Выход сообщают остальным вкладкам сразу (`BroadcastChannel` или событие `storage`), и они
      переходят на экран входа. Обновление токена в нескольких вкладках разобрано в курсе 2, в уроке «Сессия
      и обновление токена».

      ## Пример целиком: кабинет ресторана в трёх вкладках

      1. **Доска заказов.** Каждая вкладка при открытии просит блокировку `board-leader`. Её получает первая,
         открывает соединение SSE и играет звук. Две другие ждут в очереди и получают события через канал
         `BroadcastChannel('board')`. Соединение одно, звонок один.
      2. **Ведущую закрыли.** Блокировка освобождается, следующая вкладка из очереди становится ведущей, открывает
         соединение и догоняет пропущенное с последнего номера события (курс «Реальное время и большие списки»,
         урок «Снимок и догоняющие события»).
      3. **Меню.** После сохранения блюда вкладка отправляет в канал `menu` сообщение «блюдо d-12 изменилось,
         версия 8». Другие вкладки сбрасывают кэш этого блюда и перечитывают его, если оно у них на экране.
      4. **Пропущенное сообщение.** На планшете браузер выгрузил фоновую вкладку из памяти, и сообщения она
         не получила. При возврате она загружается заново, и перезапрос показывает свежее меню.
      5. **Недописанная правка.** Если во второй вкладке это блюдо открыто на редактировании с несохранёнными
         изменениями, данные под ней молча не меняются: появляется плашка «Блюдо изменили в другой вкладке»
         с выбором, что оставить. Как выбирать стратегию, — следующий урок.
      6. **Выход.** Менеджер вышел в одной вкладке — две другие сразу показывают экран входа.

      ## Варианты и их цена

      - **Ничего не координировать**
        - Подходит: данные только для чтения и редко меняются.
        - Цена: копии расходятся, ресурсы дублируются.
      - **Перечитать при возврате**
        - Подходит: почти всегда как основа.
        - Цена: изменение видно не сразу, а при возврате.
      - **`BroadcastChannel` или `storage`**
        - Подходит: быстро сообщить об изменении.
        - Цена: сообщения не хранятся и могут потеряться.
      - **`SharedWorker`**
        - Подходит: один общий ресурс там, где он поддерживается.
        - Цена: поддержка в браузерах, нужен запасной путь.
      - **Ведущая вкладка через Web Locks**
        - Подходит: одно соединение, один звук, одна фоновая работа.
        - Цена: приостановленная ведущая не отдаёт блокировку; нужны `freeze`, пинг и перезапрос.

      ## Типичные ошибки

      - **Каждая вкладка держит своё соединение и свой звук.** Сервер получает в разы больше соединений, человек —
        звонок на каждую вкладку.
      - **Считать сообщение между вкладками гарантированным.** Вкладка, которую браузер выгрузил из памяти или которая
        ещё не была открыта, его не получит и останется со старыми данными.
      - **Хранить общее состояние только в памяти.** Каждая вкладка видит свою копию.
      - **Отбирать блокировку через `steal`, не думая о прежнем владельце.** Две вкладки одновременно считают себя
        ведущими.
      - **Обновлять данные под недописанной правкой.** Человек теряет то, что печатал.
      - **Забыть о выходе из аккаунта.** Вторая вкладка продолжает работать под чужой или закончившейся сессией.

      ## Как спрашивают на интервью

      - «Пользователь открыл приложение в нескольких вкладках. Как синхронизировать данные между ними?» — ждут
        `BroadcastChannel`, перезапрос при возврате и проверку версии как последнюю защиту.
      - «Как сделать, чтобы WebSocket был один на все вкладки?» — ждут ведущую вкладку через Web Locks или
        `SharedWorker` и что делать, когда ведущая пропала.
      - «Что будет, если сообщение между вкладками не дошло?» — ждут перечитывание как страховку.

      ## Коротко

      - У вкладок одного сайта общие хранилища, но своя память и свои соединения, поэтому данные в памяти у каждой
        вкладки — отдельная копия.
      - `BroadcastChannel` и событие `storage` быстро сообщают другим вкладкам об изменении, но сообщения не хранятся
        и могут потеряться, поэтому это подсказка «перечитай», а не источник правды.
      - Перезапрос при возврате на вкладку — простая и надёжная основа: он ловит и пропущенные сообщения,
        и изменения с других устройств.
      - Один общий ресурс — соединение, звук, фоновую работу — держит ведущая вкладка, выбранная блокировкой
        Web Locks; когда её закрывают, блокировку получает следующая.
      - Ведущая отпускает блокировку по событию `freeze`; приостановленная без предупреждения её не отдаёт, а `steal`
        не останавливает её код, поэтому ведущей нужен пинг, а ведомым — перезапрос как страховка.
      - Проверка версии на сервере остаётся последней защитой от правок из устаревшей вкладки.

      ## Источники

      - [Broadcast Channel API — MDN](https://developer.mozilla.org/en-US/docs/Web/API/Broadcast_Channel_API)
      - [Web Locks API — MDN](https://developer.mozilla.org/en-US/docs/Web/API/Web_Locks_API)
      - [SharedWorker — caniuse](https://caniuse.com/sharedworkers)

  - id: sds-devices
    topic: Согласованность между клиентами
    subtopic: Другие устройства и пользователи
    title: Другие устройства и другие люди
    body: |
      ## Какую проблему решаем

      Покупатель вошёл в аккаунт на ноутбуке и на телефоне. Корзина после входа хранится на сервере (курс 1), поэтому
      она одна на оба устройства. Вечером он добавил пиццу на ноутбуке, а потом взял телефон, где корзина была открыта
      с обеда, добавил колу и нажал «Оформить». Пиццы в заказе не оказалось: телефон показывал старую копию корзины
      и отправил на сервер её целиком — «в корзине кола».

      В кабинете ресторана похожая история с людьми. Два менеджера правят одно блюдо: один с ноутбука меняет цену,
      другой с планшета — описание. Проверка версии из курса 2 не даёт затереть чужое молча, но второй менеджер видит
      «Данные устарели, обновите страницу» — и теряет описание, которое писал пять минут. Похожую историю разбирал
      курс 2, урок «Версии и конфликты»; там же сказано, что ввод при конфликте не выбрасывают. Здесь — как планшет
      узнаёт об изменении раньше, чем человек нажмёт «Сохранить».

      В прошлом уроке копии жили в одном браузере и могли предупредить друг друга мгновенно. Здесь между ними сеть:
      другое устройство узнаёт об изменении, только когда спросит сервер или сервер ему сообщит.

      ## Черновик и сохранённое — у них разные хозяева

      Вспомним курс 1, урок «Кто главный по данным»: у каждых данных один владелец, остальные держат копии. Здесь
      важно различать два вида данных на экране:

      - **сохранённое** — то, что уже на сервере: корзина, цена блюда. Хозяин — сервер, а на устройстве лежит копия,
        которая может устареть;
      - **черновик** — то, что человек ввёл и ещё не сохранил: недописанное описание, количество, которое он
        набирает. Хозяин — это устройство и этот человек. Сервер о черновике не знает.

      Ошибки начинаются, когда их путают. Телефон отправил копию корзины так, будто это черновик, который можно
      сохранить целиком, — и затёр сохранённое. Планшет менеджера, наоборот, выбросил черновик описания, потому что
      сохранённое изменилось.

      ## Как узнать о чужом изменении

      Есть три момента, когда устройство может узнать, что его копия устарела.

      1. **При сохранении.** Клиент отправляет версию, которую видел, и сервер отвечает 409, если она устарела
         (курс 2, «Версии и конфликты»). Узнаёт поздно, зато ничего не затирается.
      2. **При возврате.** Человек вернулся на вкладку или в приложение — клиент перечитывает данные (перезапрос при
         возврате из курса 2). Дёшево и ловит почти всё, но между возвратами копия может быть старой.
      3. **По сигналу сервера.** Сервер сообщает: «корзина изменилась». Это может быть само изменение по потоку
         событий (курс «Реальное время и большие списки») или только подсказка без данных: «перечитай». Библиотека
         синхронизации Replicache называет такую подсказку **poke** («тычок»): он ничего не несёт, а только просит
         клиента запросить изменения пораньше. Подсказку удобно рассылать: она маленькая, а сами данные клиент
         возьмёт обычным запросом, со всеми проверками доступа.

      Обычно их сочетают: сигнал или возврат обновляют копию заранее, а проверка версии при сохранении ловит то, что
      проскочило.

      ## Отправлять действие, а не копию целиком

      Корзина потерялась потому, что телефон отправил состояние: «корзина = [кола]». Курс 1 («Чтение, запись
      и реакция интерфейса») и курс 2 («Гонки запросов») уже учили отправлять **намерение, а не результат**:
      «добавить колу» вместо «вот вся корзина». Тогда сервер добавил бы колу к корзине, где уже лежит пицца.
      С несколькими устройствами это правило становится главным: правки разных устройств затрагивают разные части
      и складываются сами, а конфликт возникает, только когда двое меняют одно и то же.

      Новое здесь — что показывать на экране, пока свои действия ещё не подтверждены, а свежие данные с сервера уже
      пришли. Библиотеки синхронизации делают так: неподтверждённые действия хранятся на устройстве, а когда приходит
      свежее состояние с сервера, клиент берёт его и **заново применяет поверх него свои неподтверждённые действия**.
      В документации Replicache это называют перебазированием (rebase). Человек видит и чужие изменения, и свои ещё
      не подтверждённые, и ничего не мигает. Когда сервер подтвердит действие, его убирают из списка
      неподтверждённых: результат уже есть в свежем состоянии. Этот приём понадобится ещё дважды — когда участник
      совместной сессии возвращается после обрыва и когда устройство синхронизируется после долгого офлайна.

      ## Что показать человеку: по цене потери

      Когда копия устарела, клиент решает, что делать с экраном. Решение зависит от того, что человек потеряет.

      - **Своих правок нет** — например, корзина просто открыта.
        - Что делать: тихо обновить.
        - Цена ошибки: почти нет.
      - **Правки маленькие и их легко повторить** — количество одной позиции.
        - Что делать: применить свежие данные и наложить сверху свои действия, сообщить коротко: «Корзина обновлена
          на другом устройстве».
        - Цена ошибки: человек повторит одно действие.
      - **Черновик, в который вложен труд,** — описание блюда, письмо, отчёт.
        - Что делать: не трогать черновик, показать плашку «Блюдо изменили: Анна, 2 минуты назад» и дать выбор —
          посмотреть изменения, слить по полям, оставить своё (курс 2, четыре способа разрешить конфликт).
        - Цена ошибки: потерянные минуты работы и доверие.
      - **Критичное действие на основе устаревших данных** — оплата, отправка.
        - Что делать: перед действием сверить с сервером и остановить, если изменилось: «Корзина изменилась на другом
          устройстве — проверьте перед оплатой».
        - Цена ошибки: деньги и неверный заказ.

      Обратите внимание: молча не теряется ничего. Либо изменения складываются сами, либо человек видит, что
      произошло.

      ## Пример целиком: корзина и блюдо

      **Корзина на двух устройствах.**
      1. Покупатель берёт телефон — при возврате на вкладку корзина перечитывается и уже показывает пиццу
         с ноутбука.
      2. Телефон отправляет не корзину целиком, а действия: `POST /cart/items` «добавить колу» с идентификатором
         операции. Пока ответа нет, кола показана поверх свежей корзины.
      3. Сервер добавляет колу к корзине и возвращает корзину целиком с новой версией. Если за это время на ноутбуке
         добавили ещё что-то, телефон показывает и это, и подсказку «Корзина обновлена на другом устройстве».
      4. «Оформить» отправляет версию корзины, которую видел человек. Если она устарела, сервер не оформляет заказ,
         а клиент показывает свежую корзину: «Пока вас не было, корзина изменилась — проверьте». Цены сервер
         пересчитывает в любом случае (курс 1).

      **Блюдо и два менеджера.**
      1. Планшет держит черновик описания отдельно от сохранённого блюда.
      2. Ноутбук сохранил новую цену. Сервер рассылает кабинету подсказку «блюдо d-12 изменилось». Планшет
         перечитывает блюдо, но черновик описания не трогает: над формой появляется «Цену изменил Олег только что».
      3. Менеджер сохраняет описание. Клиент отправляет только изменённое поле и версию. Поля разные, и сервер сливает
         их по полям (курс 2) — описание сохраняется, цена Олега остаётся.
      4. Если бы оба поменяли описание, сервер ответил бы 409, а клиент показал бы оба текста рядом и дал выбрать.

      ## Варианты и их цена

      - **Узнавать только при сохранении**
        - Плюсы: проще всего, ничего не затирается.
        - Цена: человек узнаёт поздно и злится на «данные устарели».
      - **Перечитывать при возврате**
        - Плюсы: дёшево, ловит почти всё.
        - Цена: между возвратами копия старая.
      - **Подсказка от сервера (poke) или поток изменений**
        - Плюсы: узнаёт почти сразу.
        - Цена: нужен канал от сервера и его переподключение.
      - **Отправлять действия вместо состояния**
        - Плюсы: правки разных устройств складываются сами.
        - Цена: API из маленьких операций, а не «сохранить объект».

      ## Типичные ошибки

      - **Отправлять копию целиком.** Устаревшая копия затирает чужие правки, сделанные после неё.
      - **Обновлять экран под черновиком.** Человек теряет то, что печатал, из-за чужой правки соседнего поля.
      - **Показывать безличное «данные устарели».** Человек не понимает, что случилось и что ему делать.
      - **Совершать критичное действие на основе старой копии.** Оплачивают корзину, которой уже нет.
      - **Рассылать в подсказке сами данные без проверки доступа.** Подсказка «перечитай» безопаснее: данные клиент
        возьмёт обычным запросом.

      ## Как спрашивают на интервью

      - «Пользователь меняет корзину на телефоне и на ноутбуке. Как не потерять изменения?» — ждут действия вместо
        состояния, версию и проверку перед оплатой.
      - «Как клиент узнаёт, что данные изменил кто-то другой?» — ждут сохранение с версией, перезапрос при возврате
        и сигнал от сервера.
      - «Что показать человеку, если его данные устарели?» — ждут выбор по цене потери.

      ## Коротко

      - Сохранённое принадлежит серверу, а на устройстве лежит его копия; черновик принадлежит устройству и человеку,
        и сервер о нём не знает — их нельзя путать.
      - О чужом изменении клиент узнаёт при сохранении (версия и 409), при возврате (перезапрос) или по сигналу
        сервера; обычно их сочетают.
      - Подсказку «перечитай» без данных удобно рассылать: сами данные клиент возьмёт обычным запросом с проверкой
        доступа.
      - Отправлять действие («добавить колу»), а не копию целиком: тогда правки с разных устройств складываются сами,
        а свои неподтверждённые действия клиент заново применяет поверх свежих данных сервера (перебазирование).
      - Что делать с устаревшей копией, решают по цене потери: без своих правок — тихо обновить, с черновиком —
        не трогать его и показать, что изменилось, перед критичным действием — сверить с сервером.
      - Молча не теряется ничего: изменения либо складываются, либо человек видит, что произошло.

      ## Источники

      - [How Replicache Works — Replicache](https://doc.replicache.dev/concepts/how-it-works)
      - [HTTP conditional requests — MDN](https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Conditional_requests)

  - id: sds-compound
    topic: Согласованность между клиентами
    subtopic: Составные изменения
    title: Несколько связанных изменений
    body: |
      ## Какую проблему решаем

      В пятницу в 21:00 у пиццерии сломалась печь. Менеджер нажимает в кабинете «Закрыть ресторан на вечер». За этой
      кнопкой три изменения:

      1. все блюда — в стоп-лист, это до 300 позиций;
      2. приём новых заказов — на паузу;
      3. покупателям, у которых в корзине блюда этого ресторана, — сообщение «Ресторан закрылся на сегодня».

      Первая версия делала это тремя запросами из браузера, по очереди. Первый прошёл. На втором у менеджера пропал
      Wi-Fi, запрос ушёл в тайм-аут. Третий не отправился вовсе. На экране — «Не удалось закрыть ресторан». Блюда
      в стоп-листе, а заказы продолжают приходить: покупатели видят ресторан открытым и оплачивают заказ, который
      никто не приготовит.

      Команда добавила «откат»: если шаг не прошёл, клиент возвращает блюда из стоп-листа. Стало хуже: повар успел
      вручную поставить в стоп-лист три закончившихся блюда, а «откат» вернул в продажу и их.

      Урок о том, как проектировать действие, за которым стоят несколько зависимых изменений, и что делать, если
      прошла только часть.

      ## Понятия

      - **Составное изменение** — одно действие человека, за которым стоят несколько изменений данных.
      - **Частичный успех** — часть шагов прошла, часть нет (курс 1, «Загрузка, пустота, ошибка и всё между ними»).
        Для составного изменения это самый опасный исход: данные оказываются в состоянии, которого никто не задумывал.
      - **Транзакция** — гарантия сервера и базы данных «всё или ничего»: шаги внутри одной транзакции применяются
        вместе или не применяются вовсе. Работает, когда все данные в одной базе.
      - **Компенсация** (compensating action) — отдельное действие, которое отменяет последствия уже выполненного
        шага: «вернуть блюда из стоп-листа», «отменить бронь». Это не откат транзакции: шаг уже применился, и другие
        могли успеть его увидеть или поменять данные поверх.
      - **Сага** (saga) — длинная операция из нескольких шагов, у каждого из которых есть компенсация. Если шаг
        не удался, выполняются компенсации уже сделанных шагов. Шаблон описан, например, в руководстве Microsoft
        по архитектуре.

      ## Транзакция на сервере против компенсации на клиенте

      Это разные гарантии, и их легко спутать.

      **Транзакция** делает промежуточное состояние невидимым: никто не увидит ресторан, у которого блюда в стоп-листе,
      а заказы ещё принимаются. Если что-то пошло не так, база откатывает всё сама.

      **Компенсация** работает уже после того, как шаг применился, и у неё три слабости. Руководство Microsoft
      о шаблоне компенсирующей транзакции перечисляет их прямо:
      - она не возвращает данные в исходное состояние, а отменяет последствия своего шага — и при этом не должна
        затереть то, что успели сделать другие. «Откат» стоп-листа в примере вернул в продажу блюда, которые повар
        поставил туда сам;
      - она сама может не пройти, поэтому её шаги делают **идемпотентными**: повтор не должен вредить;
      - прогресс операции нужно где-то надёжно записывать, чтобы продолжить с места сбоя.

      Компенсация с клиента слабее вдвойне: браузер могут закрыть, сеть может пропасть между шагом и компенсацией,
      и тогда некому довести дело до конца.

      Отсюда правило: **если шаги связаны, их выполняет сервер одной операцией.** Клиент отправляет одну команду
      с идентификатором операции (курс 2, «Повторы без двойных списаний»), а сервер выполняет шаги — в одной
      транзакции, если данные в одной базе, или сагой с компенсациями, если шаги идут в разные сервисы. Клиент
      получает итог по каждому шагу. Если операция долгая, это асинхронная команда с прогрессом (курс 1, «Чтение,
      запись и реакция интерфейса»).

      ![Слева — три запроса из браузера: стоп-лист прошёл, пауза заказов упала по тайм-ауту, уведомления не отправлены; клиент пытается компенсировать и возвращает в продажу и блюда, которые повар закрыл сам. Справа — одна команда на сервер: стоп-лист и пауза заказов в одной транзакции, уведомления поставлены в очередь в той же транзакции; клиент получает итог по каждому шагу и может повторить команду с тем же идентификатором операции](images/sds-compound.png "Связанные шаги выполняет сервер одной операцией")

      ## Если шаги всё же на клиенте

      Иногда несколько запросов с клиента неизбежны: загрузка файла в хранилище перед созданием записи, чужой API,
      к которому у сервера нет доступа. Тогда:

      - **необратимое — последним.** Руководство Microsoft советует определить «точку невозврата»: шаги, которые
        нельзя отменить (оплата, отправка письма), выполняются только после всех проверок и обратимых шагов;
      - **план — на устройство.** Клиент записывает, какие шаги сделаны, в IndexedDB (как очередь действий в курсе 2),
        чтобы после перезагрузки продолжить, а не начать заново;
      - **каждый шаг идемпотентен,** со своим идентификатором операции, чтобы повтор не создал второй экземпляр;
      - **частичный успех — человеку.** Показать, что прошло и что нет, и дать кнопку «Довести до конца» или
        «Отменить сделанное». Решение о компенсации, которое меняет деньги или обещания людям, лучше оставить
        человеку — Microsoft советует то же для дорогих и неоднозначных случаев.

      ## Зависимые изменения и причинность

      Отдельная беда — изменения, где второе опирается на первое. Менеджер создаёт категорию «Сезонное» и сразу
      переносит в неё пять блюд. Перенос ссылается на категорию, которой на сервере ещё нет: у неё пока временный id
      (курс 2, «Оптимистичные обновления»).

      **Причинность** (causality) здесь значит: перенос блюд не должен примениться раньше, чем создана категория,
      от которой он зависит. Её легко нарушить:

      - **подтверждения пришли не по порядку.** Ответ на перенос пришёл раньше ответа на создание — клиент не должен
        считать перенос сделанным, пока не подтверждена категория;
      - **переподключение и повтор.** Связь пропала, клиент повторяет неподтверждённое — и отправляет перенос раньше
        создания, потому что взял их из хранилища в другом порядке;
      - **временный id.** Сервер получает перенос в категорию `tmp-7`, о которой ничего не знает.

      Что помогает:
      - отправлять зависимые изменения строго по порядку внутри одной цепочки — это порядок «по объекту» из курса 2,
        где команды одного объекта идут друг за другом;
      - указывать в зависимом изменении, от чего оно зависит: «перенос, зависит от операции создания категории».
        Сервер, не найдя такую операцию, отвечает отказом, а не применяет перенос в никуда;
      - а лучше — сделать всё одной командой: «создать категорию и перенести в неё эти блюда».

      ## Пример целиком: «Закрыть ресторан на вечер»

      1. Кнопка отправляет одну команду: `POST /restaurants/r-7/close-for-tonight` с `operationId`.
      2. Сервер в одной транзакции ставит в стоп-лист все блюда и ставит на паузу приём заказов. В той же транзакции
         он записывает задачу «разослать сообщения покупателям» в очередь отправки — так задача не потеряется, даже
         если сервер упадёт сразу после транзакции. Приём называют transactional outbox. Это не клиентская очередь
         из курса 2, хотя её тоже зовут outbox: здесь исходящие задачи хранит сервер в своей базе.
      3. Ответ: «Стоп-лист: 300 блюд. Приём заказов: на паузе. Сообщения: 47 покупателям, отправляются».
      4. Если ответ не пришёл, клиент повторяет команду с тем же `operationId`: сервер узнает её и вернёт тот же
         итог, не делая ничего второй раз.
      5. Утром «Открыть ресторан» — тоже одна команда. Она снимает с паузы приём заказов и возвращает в продажу
         только те блюда, которые закрыла вчерашняя команда, а не те, что повар закрыл вручную. Для этого сервер
         запомнил, какие блюда поставила в стоп-лист именно она.

      ## Варианты и их цена

      - **Несколько запросов с клиента без плана**
        - Плюсы: просто написать.
        - Цена: частичный успех при любом сбое, некому довести до конца.
      - **Несколько запросов с клиента, план на устройстве, компенсации**
        - Плюсы: работает, когда шаги нельзя унести на сервер.
        - Цена: сложный клиент; компенсация может затереть чужие изменения и сама не пройти.
      - **Одна команда, транзакция на сервере**
        - Плюсы: всё или ничего, промежуточного состояния никто не видит.
        - Цена: нужна серверная операция; работает в пределах одной базы.
      - **Одна команда, сага на сервере**
        - Плюсы: шаги в разных сервисах, прогресс и компенсации под контролем сервера.
        - Цена: временная несогласованность, компенсации пишут под каждый шаг.

      ## Типичные ошибки

      - **Склеивать составное действие из запросов в браузере.** Сбой посередине оставляет данные в состоянии, которого
        никто не задумывал.
      - **«Откатывать» записью старого состояния.** Компенсация затирает то, что успели сделать другие.
      - **Необратимый шаг первым.** Деньги списаны, а заказ не создан.
      - **Отправлять зависимое раньше того, от чего оно зависит.** Перенос в категорию, которой ещё нет.
      - **Скрывать частичный успех.** «Не удалось», хотя половина шагов прошла и данные уже изменились.

      ## Как спрашивают на интервью

      - «Пользователь нажимает одну кнопку, а меняются три сущности. Что, если упадёт второй запрос?» — ждут одну
        серверную операцию, транзакцию или сагу и идемпотентный повтор.
      - «Чем компенсация отличается от отката транзакции?» — ждут, что компенсация работает после применения шага,
        может затереть чужое и сама может не пройти.
      - «Как сохранить порядок зависимых изменений при повторной отправке?» — ждут порядок внутри цепочки
        и явную зависимость.

      ## Коротко

      - Составное изменение — одно действие, за которым несколько изменений данных; самый опасный его исход —
        частичный успех.
      - Транзакция на сервере применяет шаги вместе или никак и прячет промежуточное состояние; компенсация отменяет
        последствия уже применённого шага, может затереть чужие изменения и сама может не пройти.
      - Связанные шаги выполняет сервер одной командой с идентификатором операции — в транзакции или сагой; клиент
        получает итог по каждому шагу.
      - Если шаги неизбежно на клиенте, необратимое делают последним, план хранят на устройстве, каждый шаг делают
        идемпотентным, а частичный успех показывают человеку.
      - Зависимое изменение не должно примениться раньше того, от которого зависит: их отправляют по порядку,
        указывают зависимость или объединяют в одну команду.

      ## Источники

      - [Compensating Transaction pattern — Microsoft Azure Architecture Center](https://learn.microsoft.com/en-us/azure/architecture/patterns/compensating-transaction)
      - [Saga distributed transactions pattern — Microsoft Azure Architecture Center](https://learn.microsoft.com/en-us/azure/architecture/patterns/saga)

  - id: sds-collab-reqs
    topic: Совместная работа
    subtopic: Требования к совместной работе
    title: Что значит «работать вместе»
    body: |
      ## Какую проблему решаем

      Сервис доставки запускает групповой заказ в офис. Организатор выбирает ресторан, указывает адрес и время
      и отправляет коллегам ссылку. До 20 человек добавляют блюда в общую корзину до 12:30, потом организатор
      закрывает сбор и оплачивает.

      Первая версия была устроена как обычная корзина: весь групповой заказ — один объект, и каждый участник при
      изменении сохранял его целиком. Двое добавили блюда в одну секунду, и салат одного из них пропал. Организатор
      нажал «Оплатить», пока коллега добавлял пирог, — и никто не понимал, оплачен пирог или нет.

      Продакт-менеджер предложил: «Сделаем как в Google Docs — все правят одновременно и видят друг друга». Это дорого,
      и для корзины, скорее всего, лишнее. Прежде чем выбирать технику, нужно ответить, что именно значит «работать
      вместе» для этого продукта.

      ## Три уровня совместности

      Под «совместной работой» скрываются три разных требования, и у каждого своя цена: присутствие почти ничего
      не стоит, одновременная правка требует правил слияния, а строгая согласованность заставляет действие ждать
      сервер и не даёт выполнить его без сети.

      - **Совместное присутствие** (co-presence) — люди видят, что другие здесь: аватары «в заказе сейчас 7 человек»,
        курсоры, «Анна смотрит этот раздел». Сами данные при этом каждый меняет в своей части, и конфликтов почти нет.
        Это присутствие из курса «Реальное время и большие списки», урок «Чат и статусы присутствия».
      - **Одновременное редактирование** (concurrent editing) — несколько человек меняют одни и те же данные в одно
        время. Копии на секунды расходятся, а правила слияния сводят их к одному состоянию. Это и есть «как
        в Google Docs».
      - **Строгая согласованность** (strong consistency) — действие проходит через одно место, сервер,
        и применяется только к последнему подтверждённому состоянию. Совершить его по устаревшей копии нельзя,
        а после подтверждения его видят все следующие чтения. Экраны людей при этом могут на миг отставать:
        строгость касается действия, а не картинки. Нужна там, где ошибка стоит денег: последнее место в самолёте,
        оплата. Цена: каждое такое действие ждёт сервер, без сети оно не работает.

      Обычно в одном продукте нужны разные уровни для разных действий. В групповом заказе добавлять блюда можно
      одновременно и с расхождением на секунду, а оплата требует строгой согласованности: человек платит за ту
      корзину, которую видел.

      ## Единица конфликта

      **Единица конфликта** — наименьший кусок данных, который сводят как одно целое. Если двое меняют одну единицу,
      это конфликт; если разные — правки складываются.

      - **Весь документ или объект** — проще всего, но любые две правки конфликтуют. Так была устроена первая версия
        группового заказа.
      - **Запись или строка** — позиция в корзине, карточка задачи. Двое конфликтуют, только если правят одну строку.
      - **Поле объекта** — цена и описание блюда независимы. Так работает слияние по полям из курса 2.
        Figma устроена так же: единица конфликта — одно свойство одного объекта. Двое меняют цвет и размер одной
        фигуры — оба изменения сохраняются; двое меняют цвет — побеждает последнее значение, которое получил сервер.
      - **Блок или символ текста** — абзац или буква. Нужна, когда несколько человек пишут в одном тексте, и требует
        особых алгоритмов (урок «Совместный текст: OT и CRDT»).

      Чем мельче единица, тем реже конфликты и тем сложнее механизм. Поэтому единицу выбирают как можно крупнее —
      но так, чтобы обычная работа людей не превращалась в конфликты.

      Ещё один сильный приём — **дать каждой части хозяина** (курс 1, «Кто главный по данным»). Если участник правит
      только свои строки, а общие поля меняет только организатор, конфликтовать почти нечему.

      ## Продуктовые вопросы до техники

      Прежде чем выбирать модель слияния, отвечают на вопросы о продукте:

      1. **Как быстро другие должны видеть изменения?** За доли секунды, как в редакторе, или за несколько секунд.
      2. **Нужно ли работать без сети?** Если да, копии могут расходиться часами, и слияние должно это выдержать.
      3. **Какое расхождение допустимо?** Можно ли двоим секунду видеть разную сумму? Можно ли потерять правку,
         если её сразу переписали?
      4. **Какие действия требуют строгой согласованности?** Обычно немногие: оплата, бронирование, публикация.
      5. **Кто может менять что?** Права определяют, где вообще возможен конфликт.

      Ответы часто показывают, что сложная техника не нужна. Figma объясняет, что не стала использовать
      преобразование операций (OT): для их задачи оно было излишне сложным.

      ## Пример целиком: групповой заказ

      **Ответы на продуктовые вопросы.** Изменения других видны за 1–2 секунды; работать без сети не нужно;
      сумма может на секунду расходиться у разных участников; оплата — строго по закрытой корзине; адрес и время
      меняет только организатор.

      **Решение.**

      1. **Уровень:** присутствие («в заказе сейчас 7 человек») и одновременное редактирование своих строк; строгая
         согласованность — только у закрытия сбора и оплаты.
      2. **Единица конфликта — позиция участника.** Каждый правит только свои позиции, у каждой позиции хозяин —
         добавивший её участник. Двое никогда не правят одну строку.
      3. **Общие поля** — ресторан, адрес, время — меняет только организатор.
      4. **Сумму считает сервер** из позиций: это производное значение (курс 1, «Вычислять или хранить»), его никто
         не правит.
      5. **Транспорт** — WebSocket, как чат в курсе «Реальное время и большие списки»: изменения позиций и присутствие
         приходят всем участникам. Каждое изменение — действие («добавить позицию»), а не корзина целиком.
      6. **Закрытие сбора** — команда организатора. После неё сервер принимает только оплату, а добавления отклоняет
         с понятным сообщением. Оплата отправляется с версией закрытой корзины.

      Сложной модели слияния здесь не понадобилось: хватило правильной единицы конфликта и хозяина у каждой части.

      ## Варианты и их цена

      - **Только присутствие**
        - Подходит: каждый работает в своей части, но важно видеть других.
        - Цена: почти ничего, кроме канала присутствия.
      - **Одновременное редактирование записей и полей**
        - Подходит: формы, корзины, доски, свойства объектов.
        - Цена: правила слияния; короткое расхождение копий.
      - **Одновременное редактирование текста**
        - Подходит: документы, заметки, код.
        - Цена: OT или CRDT, сложная библиотека и сервер.
      - **Строгая согласованность**
        - Подходит: оплата, бронирование, последний экземпляр.
        - Цена: каждое действие ждёт сервер, без сети не работает.

      ## Типичные ошибки

      - **Начинать с техники.** «Сделаем CRDT» до ответа на вопрос, что люди правят одновременно.
      - **Единица конфликта — весь объект.** Любые две правки конфликтуют, и правки теряются.
      - **Строгая согласованность везде.** Каждое добавление блюда ждёт сервер и блокирует остальных.
      - **Нет строгой согласованности там, где деньги.** Оплачивают корзину, которая уже изменилась.
      - **Общие поля без хозяина.** Двое меняют адрес доставки, и курьер едет не туда.

      ## Как спрашивают на интервью

      - «Спроектируйте групповую корзину или совместный список» — ждут вопросы о требованиях, единицу конфликта
        и хозяина у частей.
      - «Нужен ли здесь CRDT?» — ждут ответ через продуктовые требования, а не через моду.
      - «Какие действия требуют строгой согласованности?» — ждут деньги, бронирование, публикацию.

      ## Коротко

      - «Совместная работа» — это три разных требования: видеть друг друга, править одно и то же одновременно
        и совершать действие только по последнему подтверждённому состоянию; у каждого своя цена, и в одном
        продукте для разных действий нужны разные.
      - Единица конфликта — наименьший кусок данных, который сводят как целое: документ, запись, поле, блок или
        символ; чем она мельче, тем реже конфликты и тем сложнее механизм.
      - Единицу выбирают как можно крупнее, но так, чтобы обычная работа не превращалась в конфликты; хозяин у каждой
        части убирает конфликты почти совсем.
      - До выбора техники отвечают на продуктовые вопросы: как быстро видны изменения, нужен ли офлайн, какое
        расхождение допустимо, где нужна строгая согласованность и кто что может менять.
      - Строгая согласованность нужна там, где ошибка стоит денег, — оплата, бронирование; остальное может
        расходиться на секунды.

      ## Источники

      - [How Figma's multiplayer technology works — Figma](https://www.figma.com/blog/how-figmas-multiplayer-technology-works/)

  - id: sds-merge
    topic: Совместная работа
    subtopic: Модели слияния
    title: Блокировки, версии и последняя запись
    body: |
      ## Какую проблему решаем

      Описание ресторана — до 1500 знаков с форматированием — правят двое: владелец и маркетолог. Обычно в разное
      время, но иногда одновременно. Первая версия кабинета сохраняла описание целиком, и побеждала последняя запись.
      Маркетолог полчаса переписывала абзац о доставке, владелец за это время поправил телефон в последней строке
      и сохранил первым. Маркетолог сохранила свою версию, где телефон старый, — и телефон откатился. Никто ничего
      не заметил, пока покупатели не начали звонить на старый номер.

      В прошлом уроке мы выбрали единицу конфликта и уровень совместности. Этот урок — о самих моделях слияния, кроме
      посимвольного слияния текста: блокировках, версиях и правиле «последняя запись побеждает». Они проще, чем OT
      и CRDT, и в большинстве продуктов их хватает.

      ## Блокировка на время правки

      Курс 2, урок «Версии и конфликты», уже назвал **пессимистичную блокировку** (pessimistic locking): пока один
      человек правит, другие не могут, а в интерфейсе — «Редактирует Ольга». И её противоположность — оптимистичную,
      при которой данные никто не запирает, а конфликт обнаруживают при сохранении по версии. Конфликтов
      у пессимистичной блокировки нет в принципе: в каждый момент правит один. Здесь — как сделать её надёжной
      в совместной работе и чего она стоит.

      Цена блокировки:
      - **брошенные блокировки.** Анна открыла редактор и закрыла ноутбук. Поэтому блокировку выдают на время
        (lease, «аренда»): например, на 2 минуты, и клиент продлевает её, пока человек работает. Перестал продлевать —
        блокировка истекает сама;
      - **проверка при сохранении.** Если блокировка истекла и её взял другой, сохранение с истёкшей блокировкой
        сервер должен отклонить. Поэтому вместе с блокировкой клиент получает её номер и отправляет его при сохранении.
        Такой номер называют fencing token, «номер-ограда»: сервер не пустит запись со старым номером;
      - **ожидание.** Второй человек не может работать, пока первый не закончит. Для длинных документов, которые
        правят часами, это неприемлемо;
      - **не работает без сети:** получить блокировку можно только у сервера.

      Есть мягкий вариант — **предупреждающая блокировка** (advisory lock): «Сейчас редактирует Анна», но править
      не запрещено. Она снижает число конфликтов, а сами конфликты ловит проверка версии.

      ## Сохранение с версией

      Это механизм из курса 2, урок «Версии и конфликты»: клиент отправляет правку с версией, которую видел, и сервер
      отвечает 409, если версия устарела. Дальше — один из четырёх способов: отказ с перечитыванием, последняя запись
      побеждает, слияние по полям или выбор человеком.

      Для совместной работы с записями и формами этого часто достаточно: конфликт — редкость, правки сохраняют целиком
      по кнопке, и человек может разобрать конфликт сам. Здесь добавляется одно: если двое правят один длинный
      текст, человеку нужно показать, что именно изменилось у другого. Вики-движок MediaWiki при конфликте правок
      показывает текущий сохранённый текст и под ним разницу с правкой человека, а правки в разных частях страницы
      сливает автоматически и сообщает о конфликте, только когда правили одни и те же строки. Такое слияние по строкам
      знакомо по git.

      ## Последняя запись побеждает

      **«Последняя запись побеждает»** (last-write-wins, LWW) — из двух значений остаётся то, которое сервер получил
      последним. Курс 2 разобрал её для записей. В совместной работе у неё две стороны.

      **Хорошо работает для неделимых значений.** Цвет, размер, цена, статус, позиция на холсте — значение заменяется
      целиком, и смешивать два значения бессмысленно. Если единица конфликта — свойство объекта, LWW теряет только
      одно из двух одновременных значений одного свойства, и это обычно приемлемо. Так устроена Figma: сервер помнит
      последнее значение каждого свойства каждого объекта, а изменения разных свойств не конфликтуют.

      **Теряет правки в тексте.** Текст — не неделимое значение: двое правят разные слова, но LWW сохраняет одну версию
      целиком. Figma прямо пишет, что у неё одновременная правка одного текстового поля даёт «AB» или «BC», но никогда
      «ABC». Для подписи в одну строку это терпимо. Для абзаца, который полчаса переписывали, — нет.

      Отсюда граница: LWW годится для свойств, но не для общего длинного текста. Если в продукте двое правят один
      текст одновременно и часто, нужны модели из следующего урока.

      ## Сравнение

      - **Блокировка на время правки**
        - Подходит: длинная правка одним человеком, редкие одновременные попытки.
        - Цена: брошенные блокировки, ожидание, не работает без сети.
      - **Предупреждающая блокировка и версия**
        - Подходит: редкие одновременные правки, которые человек может разобрать сам.
        - Цена: конфликт всё же бывает, и его нужно показать понятно.
      - **Версия и слияние по полям или строкам**
        - Подходит: формы, записи, тексты, которые правят в разных местах.
        - Цена: правила слияния; конфликт в одном месте разбирает человек.
      - **Последняя запись побеждает по свойствам**
        - Подходит: неделимые значения — цвет, позиция, статус.
        - Цена: теряется одно из двух одновременных значений; для текста не годится.

      ## Пример целиком: описание ресторана

      **Требования.** Двое правят описание редко одновременно; правка длится до получаса; терять текст нельзя;
      без сети описание не правят.

      **Решение.**

      1. **Предупреждающая блокировка.** Открыв редактор, владелец получает отметку «редактирует» на 2 минуты
         и продлевает её, пока печатает. Маркетолог, открыв описание, видит: «Сейчас редактирует Олег». Править ей
         не запрещено, но обычно она подождёт.
      2. **Сохранение с версией.** Описание сохраняется с версией, которую видел человек.
      3. **Слияние по абзацам.** Если версия устарела, сервер пытается слить правки: владелец менял последнюю строку,
         маркетолог — абзац о доставке, части разные, слияние проходит само.
      4. **Конфликт в одном абзаце.** Если оба правили один абзац, сервер отвечает 409, а редактор показывает
         сохранённый текст и разницу с правкой маркетолога — как в MediaWiki. Её текст не теряется.
      5. **CRDT не нужен.** Одновременная правка одного абзаца здесь редкость, и человек разберёт её за минуту.

      Телефон из начала урока больше не откатится: правка владельца и правка маркетолога затрагивают разные абзацы.

      ## Типичные ошибки

      - **«Последняя запись побеждает» для общего текста.** Одна правка молча затирает другую.
      - **Блокировка без срока.** Закрытый ноутбук держит документ запертым до вечера.
      - **Не проверять блокировку при сохранении.** Истёкшая блокировка уже у другого, а сохранение проходит поверх.
      - **Блокировка для долгой работы многих людей.** Все ждут одного.
      - **Конфликт без разницы.** «Документ изменился, ваша правка не сохранена» без возможности увидеть и сохранить
        свой текст.

      ## Как спрашивают на интервью

      - «Двое правят одну запись. Блокировка или версия?» — ждут цену каждой: ожидание и брошенные блокировки против
        конфликтов при сохранении.
      - «Когда last-write-wins приемлем?» — ждут неделимые значения и единицу конфликта «свойство объекта».
      - «Почему LWW не годится для совместного текста?» — ждут потерю правок разных слов одного текста.

      ## Коротко

      - Блокировка на время правки убирает конфликты, но требует срока и продления, проверки при сохранении,
        заставляет других ждать и не работает без сети.
      - Предупреждающая блокировка только сообщает, что другой правит, а конфликты ловит проверка версии.
      - Сохранение с версией и слиянием по полям или строкам хватает для форм, записей и текстов, которые правят
        в разных местах; конфликт в одном месте показывают человеку с разницей, не теряя его текст.
      - «Последняя запись побеждает» хорошо работает для неделимых значений — цвета, позиции, статуса — при единице
        конфликта «свойство объекта», как в Figma.
      - Для общего длинного текста LWW теряет правки, поэтому при частой одновременной правке текста нужны OT или CRDT.

      ## Источники

      - [How Figma's multiplayer technology works — Figma](https://www.figma.com/blog/how-figmas-multiplayer-technology-works/)
      - [Help:Edit conflict — MediaWiki](https://www.mediawiki.org/wiki/Help:Edit_conflict)

  - id: sds-crdt
    topic: Совместная работа
    subtopic: Модели слияния
    title: 'Совместный текст: OT и CRDT'
    body: |
      ## Какую проблему решаем

      У поддержки сервиса доставки есть регламенты — общая база сценариев: что отвечать покупателю при опоздании,
      при отмене, при сбое оплаты. Во время сбоя пять-десять операторов одновременно правят регламент «Сбой оплаты»:
      дописывают новые случаи, исправляют формулировки, иногда в одном и том же абзаце.

      Модели из прошлого урока здесь не справляются. Блокировка заставит девятерых ждать одного. Слияние по абзацам
      каждую минуту даёт конфликт: правят один абзац. «Последняя запись побеждает» молча теряет текст. Нужно, чтобы
      каждая буква каждого оператора встала на своё место, а у всех получился один и тот же текст.

      Для этого есть два семейства алгоритмов: **преобразование операций** (OT) и **CRDT**. Урок объясняет идею каждого,
      даёт обзор основных алгоритмов — без деталей реализации, чтобы узнавать их по названию и понимать, чем они
      отличаются, — и отвечает на главный вопрос: когда эта сложность не нужна.

      ## Почему текст — самый трудный случай

      Правка текста обычно описывается позицией: «вставить в позицию 0», «удалить символ в позиции 4». Беда в том,
      что правки сдвигают позиции друг друга.

      В документе слово «Пицца». Одновременно:
      - Анна вставляет в позицию 0 слово «Большая » (8 символов);
      - Борис удаляет символ в позиции 4 — последнюю «а», чтобы получилось «Пицц» для другой формы слова.

      У Анны сначала применилась её вставка: «Большая Пицца». Потом приходит правка Бориса «удалить позицию 4», и Анна
      удаляет «ш»: «Боль**ш**ая» превращается в «Больая Пицца». У Бориса всё наоборот: сначала удаление, потом вставка,
      и получилось «Большая Пицц». Копии разошлись, и обе неправильные по-разному.

      Итог должен быть один у всех — это требование называют **сходимостью** (convergence) — и должен сохранять
      намерение каждого: Борис хотел удалить последнюю «а» в слове «Пицца», а не какую-то букву в позиции 4.

      ## Преобразование операций (OT)

      Идея **OT** (operational transformation): прежде чем применить чужую операцию, её **преобразуют** с учётом
      операций, которые уже применены. Если перед удалением в позиции 4 кто-то вставил 8 символов в позицию 0,
      удаление сдвигают в позицию 12. Тогда у Анны получится «Большая Пицц» — как у Бориса.

      Самый распространённый вариант — **OT с центральным сервером** (подход системы Jupiter, на нём строился Google
      Wave; Google Docs тоже использует OT с центральным сервером). Сервер задаёт единый порядок операций. Клиент применяет свои правки сразу, отправляет их
      на сервер, а каждую пришедшую с сервера операцию преобразует относительно своих ещё не подтверждённых.
      Сервер — единственный арбитр, поэтому правила преобразования остаются обозримыми.

      Плюсы OT:
      - **мало служебных данных:** операции — это позиции и текст, документ хранится как обычный текст;
      - **зрелость:** на OT десятилетиями работают крупные редакторы.

      Цена:
      - **нужен центральный сервер,** который упорядочивает операции. Варианты OT без центра существуют, но их правила
        преобразования намного сложнее, и доказать их правильность трудно;
      - **долгий офлайн:** если две копии долго правили порознь, свести их значит преобразовать тысячи операций
        относительно тысяч. Авторы алгоритма Eg-walker (Gentle и Kleppmann, 2025) пишут, что OT медленно сливает
        сильно разошедшиеся копии.

      ## CRDT: данные, которые сходятся сами

      Идея **CRDT** (conflict-free replicated data type, «бесконфликтный реплицируемый тип данных»): устроить данные
      так, чтобы правки можно было применять **в любом порядке** и всё равно получить одно и то же. Тогда не нужны
      ни центральный арбитр, ни преобразование: каждая копия применяет все правки, какие получила, и копии сходятся.

      Для текста приём такой: вместо позиций у каждого символа есть **уникальный идентификатор**, и правка ссылается
      на идентификаторы, а не на номера. Анна вставляет «Большая » перед символом «П» с идентификатором `b:1`; Борис
      удаляет символ «а» с идентификатором `b:5`. Эти правки не мешают друг другу: что бы ни вставили до, символ `b:5`
      остаётся тем же символом.

      Если двое вставили текст в одно и то же место, порядок решает правило, одинаковое на всех копиях: сравнивают
      метки вставок. Метка — не время на часах телефона (часы расходятся, курс 2, «Версии и конфликты»), а **логическая
      метка**: счётчик, который каждая копия при правке ставит больше всех, что видела, плюс идентификатор копии
      на случай равенства.

      ![Слева — правки по позициям: Анна вставляет «Большая » в позицию 0, Борис удаляет позицию 4; у Анны получается «Больая Пицца», у Бориса «Большая Пицц» — копии разошлись. Справа — правки по идентификаторам символов: вставка перед символом b:1 и удаление символа b:5; у обоих получается «Большая Пицц»](images/sds-crdt.png "По позициям правки мешают друг другу, по идентификаторам — нет")

      Удалённый символ при этом обычно не стирают совсем, а помечают удалённым — это **надгробие** из курса «Реальное
      время и большие списки», урок «События: дубли и порядок». На него может ссылаться чужая правка, пришедшая позже.

      Плюсы CRDT:
      - **не нужен центральный сервер для слияния:** копии сходятся при любом порядке доставки — удобно для офлайна
        и прямой связи между устройствами;
      - **долгий офлайн не страшен:** правки просто применяются.

      Цена:
      - **служебные данные:** идентификаторы символов и надгробия занимают память. Авторы Eg-walker пишут, что CRDT
        медленно загружаются и потребляют много памяти. Современные реализации сильно сократили эти расходы:
        например, у Fugue служебные данные в сохранённом документе — около 60 % от объёма самого текста;
      - **сложность:** писать свой CRDT для текста — исследовательская задача.

      ## Обзор алгоритмов

      Названия ниже встречаются в документации библиотек и на интервью. Детали реализации здесь не нужны — важно
      понимать, чем они отличаются.

      ### Семейства CRDT

      - **CRDT состояния** (state-based) — копии обмениваются своим состоянием целиком (или его частью), а функция
        слияния устроена так, что порядок и повторы не важны. Плюс: годится любая доставка, даже с дублями
        и перестановками. Цена: пересылать много.
      - **CRDT операций** (operation-based) — копии обмениваются операциями. Плюс: пересылаются маленькие операции.
        Цена: доставка должна гарантировать, что каждая операция дойдёт и будет применена один раз и после тех,
        от которых зависит.

      Оба подхода формально описали Шапиро и соавторы в 2011 году; тогда же закрепилось название conflict-free
      replicated data type.

      ### Простые CRDT для данных, а не текста

      **Регистр** — ячейка с одним значением, которое заменяют целиком. Некоторые знакомые по прошлым урокам приёмы —
      тоже простые CRDT:
      - **счётчик** — каждая копия считает свои прибавления, итог — сумма. В Automerge счётчик сливается сложением всех
        одновременных операций. Так счётчик лайков не теряет лайки двоих;
      - **регистр «последняя запись побеждает»** (LWW-register) — значение с логической меткой, побеждает бо́льшая
        метка. Это LWW из прошлого урока: там роль метки играет порядок, в котором значения пришли на сервер;
      - **регистр нескольких значений** (multi-value register) — при одновременной записи хранит оба значения и даёт
        человеку выбрать. Это «выбор человеком» из курса 2;
      - **множество** (например, OR-set) — элементы можно добавлять и удалять, а при одновременном добавлении
        и удалении одного элемента побеждает добавление.

      ### CRDT для текста и списков

      - **Logoot и LSEQ** — каждому символу дают «дробную» позицию между соседями, как дробные позиции в курсе 1,
        урок «Вычислять или хранить» (так же упорядочивает объекты Figma). Плюс: идея простая, надгробия не нужны. Цена: идентификаторы растут, и эти алгоритмы особенно
        склонны к **перемешиванию**: если двое одновременно печатают в одном месте «Привет» и «Пока», буквы могут
        перемешаться — «ППроиквеат».
      - **RGA** — каждый символ помнит, после какого символа его вставили, а одновременные вставки упорядочиваются
        по логической метке. На RGA основаны списки в Automerge. Перемешивания при наборе слева направо не бывает
        (это доказано), а при наборе в обратном направлении — может быть.
      - **YATA** — каждый символ помнит соседей слева и справа на момент вставки. Его модифицированную версию реализует
        Yjs, одна из самых популярных библиотек.
      - **Fugue** (Вайднер и Клеппман, 2023) — алгоритм, придуманный против перемешивания. Для его варианта FugueMax
        доказано минимальное перемешивание, а по скорости он сравним с современными библиотеками.
      - **Peritext** — CRDT для текста с форматированием: как сливать одновременное выделение жирным и правку текста.
        На нём построен текст в Automerge.

      Авторы Fugue проверили известные алгоритмы и пишут, что перемешиванием в той или иной форме страдают почти все,
      и CRDT, и OT.

      ### Гибриды

      **Eg-walker** (Джозеф Джентл и Мартин Клеппман, EuroSys 2025) соединяет сильные стороны обоих подходов: хранит
      историю правок, а состояние, нужное для слияния, строит только когда сливает одновременные ветки. По словам
      авторов, в обычной работе он потребляет на порядок меньше памяти, чем CRDT, загружается на порядки быстрее,
      а длинные ветки сливает на порядки быстрее, чем OT.

      ## Когда эта сложность не нужна

      OT и CRDT для текста оправданы, когда несколько человек **часто** пишут в **одном** тексте одновременно — или
      правят его без сети. В остальных случаях хватает прошлого урока:
      - **формы и записи** — поля и версии;
      - **свойства объектов** — «последняя запись побеждает» по свойству, как в Figma;
      - **редкие одновременные правки длинного текста** — версии, слияние по абзацам и разница при конфликте.

      И если OT или CRDT нужны, берут **готовую библиотеку**: Yjs, Automerge или серверный редактор с OT. Сервер
      при этом всё равно нужен — проверять права, хранить документ, пересылать правки и рассылать присутствие.

      ## Пример целиком: регламенты поддержки

      1. **Требования.** До 10 операторов правят один регламент одновременно, часто в одном абзаце; изменения других
         видны за секунду; без сети не правят; терять текст нельзя.
      2. **Выбор.** Нужно посимвольное слияние текста. Центральный сервер у сервиса есть, но долгой работы без сети нет,
         поэтому подошли бы и OT, и CRDT. Команда выбирает Yjs: у него есть готовые связки с популярными редакторами
         текста и готовые модули для пересылки и хранения.
      3. **Сервер.** Принимает WebSocket от операторов, проверяет доступ к регламенту, пересылает обновления Yjs
         остальным участникам и сохраняет их. Порядок обновлений для Yjs не важен.
      4. **Присутствие.** Курсоры и выделения других операторов — через механизм присутствия библиотеки, как
         «печатает» в курсе «Реальное время и большие списки»: его можно терять.
      5. **История.** Раз в несколько минут сервер сохраняет снимок регламента как версию: можно посмотреть, кто что
         поменял, и откатиться.

      Описание ресторана из прошлого урока осталось на версиях и слиянии по абзацам: двое правят его редко.

      ## Варианты и их цена

      - **OT с центральным сервером**
        - Подходит: онлайн-редакторы с постоянной связью.
        - Цена: нужен сервер-арбитр; долгий офлайн сводится медленно.
      - **CRDT (Yjs, Automerge)**
        - Подходит: совместный текст, офлайн, связь без центрального сервера.
        - Цена: служебные данные и надгробия; сложная внутренняя модель.
      - **Свой алгоритм**
        - Подходит: почти никогда.
        - Цена: месяцы работы и тонкие ошибки слияния, которые находят годами.

      ## Типичные ошибки

      - **Писать свой OT или CRDT.** Даже опубликованные алгоритмы годами находили с перемешиванием и ошибками.
      - **Брать CRDT для форм и свойств.** Сложность без пользы там, где хватает версий и LWW по полям.
      - **Считать, что CRDT отменяет сервер.** Права, хранение и пересылка остаются на сервере.
      - **Применять правки по позициям без преобразования.** Копии расходятся, как «Больая Пицца».
      - **Забыть о памяти.** Документ с долгой историей правок и надгробиями растёт, его нужно сжимать или хранить
        снимками.

      ## Как спрашивают на интервью

      - «Спроектируйте совместный редактор вроде Google Docs» — ждут проблему позиций, OT или CRDT с их ценой,
        сервер для прав и хранения и присутствие.
      - «Чем OT отличается от CRDT?» — ждут: OT преобразует операции и обычно опирается на центральный сервер,
        CRDT сходится при любом порядке за счёт идентификаторов и служебных данных.
      - «Когда CRDT не нужен?» — ждут формы, свойства и редкие правки.

      ## Коротко

      - Правки текста по позициям мешают друг другу: вставка сдвигает позиции, и копии расходятся; нужны сходимость
        и сохранение намерения каждого.
      - OT преобразует чужую операцию с учётом уже применённых; обычно опирается на центральный сервер (как Google
        Docs), хранит мало служебных данных, но медленно сводит долго расходившиеся копии.
      - CRDT даёт каждому символу идентификатор и ссылается на него, а не на позицию, поэтому правки сходятся в любом
        порядке без арбитра; цена — служебные данные и надгробия.
      - CRDT бывают состояния (пересылают состояние, терпят любую доставку) и операций (пересылают операции, требуют
        надёжной доставки); простые CRDT — счётчик, LWW-регистр, регистр нескольких значений, множество; LWW и выбор
        человеком уже встречались в курсе.
      - Текстовые CRDT различаются тем, как упорядочивают одновременные вставки: у дробных позиций (Logoot, LSEQ)
        растут идентификаторы и буквы чаще перемешиваются, на RGA и YATA стоят Automerge и Yjs, а Fugue придуман,
        чтобы перемешивание было минимальным.
      - Посимвольное слияние нужно, только когда несколько человек часто пишут в одном тексте или правят без сети;
        тогда берут готовую библиотеку, а права и хранение остаются на сервере.

      ## Источники

      - [The Art of the Fugue: Minimizing Interleaving in Collaborative Text Editing — Weidner, Kleppmann](https://arxiv.org/abs/2305.00583)
      - [Yjs — README](https://github.com/yjs/yjs)
      - [Eg-walker: Better, Faster, Smaller — Gentle, Kleppmann](https://arxiv.org/abs/2409.14252)

  - id: sds-collab-recovery
    topic: Совместная работа
    subtopic: Восстановление совместной сессии
    title: Когда связь вернулась
    body: |
      ## Какую проблему решаем

      Групповой заказ в офис, 12:28. Дима заходит в лифт с телефоном и добавляет в заказ «Цезарь» — приложение сразу
      показывает салат в списке (локальное эхо из курса «Реальное время и большие списки»). Связи в лифте нет.
      В 12:30 организатор закрывает сбор и оплачивает заказ. В 12:31 Дима выходит из лифта, телефон отправляет
      «Цезарь». Что должно произойти?

      Первая версия приняла салат: сервер не проверял, закрыт ли заказ. Курьер привёз салат, который никто не оплатил.
      Вторая версия молча отклоняла запоздавшие правки: Дима до обеда был уверен, что салат едет.

      В тот же день в 12:20 к заказу присоединилась новая сотрудница — ей нужна была вся корзина сразу. А организатор
      удалил из заказа сотрудника из другого офиса, у которого в этот момент была открыта корзина с недобавленными
      блюдами.

      Урок о трёх ситуациях, которые совместная сессия должна переживать: новый участник, участник вернулся после
      обрыва, права поменялись посреди работы.

      ## Новый участник

      Новый участник должен получить всё, что сделали до него, и дальше — все новые правки. Это **снимок плюс поток
      изменений** из курса «Реальное время и большие списки», урок «Снимок и догоняющие события»: снимок сообщает
      позицию, а подписка начинается с неё. В совместной работе изменения идут от всех участников, но схема та же.

      Библиотеки совместной работы делают это сами, но по той же идее. В протоколе синхронизации Yjs клиент сначала
      отправляет **вектор состояния** — сводку «что у меня уже есть» — и получает в ответ только недостающие
      обновления, а дальше обменивается правками по одной. Тот же обмен работает и для нового участника (у него нет
      ничего), и для вернувшегося (у него есть почти всё).

      ## Участник вернулся после обрыва

      Пока связи не было, участник продолжал работать: его правки показаны сразу и копятся на устройстве. В это время
      другие тоже работали. Копии **разошлись** (divergence) — и их нужно свести.

      Сведение идёт в две стороны:
      1. **Получить чужое.** Клиент догоняет пропущенное — по позиции, вектору состояния или перечитав снимок.
      2. **Отправить своё.** Накопленные правки уходят на сервер с идентификаторами операций, чтобы повтор
         не создал дубль (курс 2, «Повторы без двойных списаний»).

      Как свести чужое и своё на экране, зависит от модели слияния:
      - **CRDT** сводит сам: правки применяются в любом порядке;
      - **с сервером-арбитром** клиент берёт свежее состояние сервера и заново применяет поверх него свои
        неподтверждённые действия — перебазирование из урока «Другие устройства и другие люди».

      Главное — что делать, если своё действие **больше нельзя применить**: заказ закрыт, задачу удалили, ячейку
      заперли. Сервер отклоняет его с понятной причиной, а клиент **не теряет его молча**: показывает, что не прошло
      и почему, и даёт выход — скопировать, перенести, создать заново.

      С CRDT есть тонкость: отклонить одну правку нельзя, клиент уже применил её в своей копии. Поэтому, если
      правка оказалась недопустимой — например, пока участник был без сети, документ закрыли для правки, — клиент
      сохраняет текст участника отдельно, сбрасывает свою копию документа и загружает её с сервера заново.

      Пока связи нет, человек должен это видеть: «Нет связи. Ваши изменения отправятся, когда связь вернётся», а для
      данных, которые меняют другие, — «данные на 12:28». Тогда отказ после возврата не будет сюрпризом.

      ## Права поменялись посреди сессии

      Совместная сессия длинная, и права в ней меняются: участника удалили, перевели в «только чтение», закрыли
      документ для правки.

      **Сервер проверяет права на каждую правку, а не только при подключении.** Это продолжение правила из курса
      «Реальное время и большие списки», урок «Соединение: обрывы и возвраты»: соединение не должно жить дольше права
      на него. Сервер отклоняет правки от того, у кого права больше нет, и сообщает клиенту, что права изменились.

      **Клиент реагирует так, чтобы человек ничего не потерял:**
      - перестаёт принимать правки — редактор становится «только для чтения» или закрывается;
      - объясняет почему: «Организатор удалил вас из заказа», «Документ закрыт для правки»;
      - сохраняет неотправленные правки и даёт их забрать — скопировать текст, перенести блюда в свою корзину.
        С CRDT клиент поступает так же, как с недопустимой правкой после обрыва: сохраняет текст отдельно
        и загружает документ заново;
      - если доступ отобран совсем, перестаёт показывать данные, к которым доступа больше нет.

      ## Пример целиком: групповой заказ после лифта

      1. **12:20, новая участница.** Открывает ссылку, получает снимок заказа с позицией и подписывается на изменения
         с неё. Видит все 14 позиций и «в заказе сейчас 8 человек».
      2. **12:28, лифт.** Дима добавляет «Цезарь». Позиция показана сразу с пометкой «ждёт отправки», над заказом —
         «Нет связи. Сбор закрывается в 12:30».
      3. **12:30.** Организатор закрывает сбор и оплачивает заказ. Сервер переводит заказ в «закрыт».
      4. **12:31, связь вернулась.** Телефон Димы догоняет пропущенное: заказ закрыт. Затем отправляет «добавить Цезарь»
         с идентификатором операции. Сервер отклоняет: «Сбор закрыт в 12:30».
      5. **Что видит Дима.** Салат помечен «Не добавлен: сбор закрыт до того, как вернулась связь», рядом кнопка
         «Заказать отдельно» — она переносит салат в его личную корзину.
      6. **Удалённый участник.** Организатор удалил сотрудника из другого офиса. Сервер закрывает ему доступ
         к заказу и отклоняет его правки; клиент показывает «Организатор удалил вас из заказа» и предлагает перенести
         его недобавленные блюда в личную корзину.

      ## Варианты и их цена

      - **Принимать запоздавшие правки без проверки состояния**
        - Плюсы: ничего не теряется.
        - Цена: правки применяются к тому, что уже нельзя менять, — неоплаченный салат в закрытом заказе.
      - **Молча отклонять запоздавшие правки**
        - Плюсы: данные корректны.
        - Цена: человек уверен, что правка прошла, и узнаёт о потере слишком поздно.
      - **Отклонять с причиной и давать выход**
        - Плюсы: данные корректны, человек знает, что случилось, и может спасти работу.
        - Цена: нужно продумать сообщение и выход для каждого вида отказа.
      - **Проверять права только при подключении**
        - Плюсы: просто.
        - Цена: удалённый участник продолжает править до переподключения.

      ## Типичные ошибки

      - **Не проверять, можно ли ещё применить правку.** Запоздавшая правка меняет закрытый заказ.
      - **Терять отклонённые правки молча.** Человек узнаёт о потере, когда уже поздно.
      - **Не показывать, что связи нет.** Человек не знает, что его правки ещё не ушли.
      - **Права только при подключении.** Удалённый участник продолжает менять данные.
      - **Новому участнику — только поток без снимка.** Он видит правки, но не то, что было до него.

      ## Как спрашивают на интервью

      - «Как новый участник получает текущее состояние документа?» — ждут снимок плюс поток или обмен «что у меня
        есть — что мне не хватает».
      - «Участник правил без сети и вернулся. Что происходит?» — ждут получение чужого, отправку своего
        с идентификаторами и обработку правок, которые больше нельзя применить.
      - «У пользователя отобрали доступ посреди редактирования. Что делать?» — ждут проверку прав на каждую правку
        и сохранение его несохранённой работы.

      ## Коротко

      - Новый участник получает снимок с позицией и поток изменений после неё; библиотеки делают то же через обмен
        «что у меня есть — чего не хватает», как вектор состояния в Yjs.
      - После обрыва копии разошлись: клиент догоняет чужое и отправляет своё с идентификаторами операций, а CRDT
        или повторное применение своих действий поверх свежего состояния сводит их на экране.
      - Правку, которую больше нельзя применить, сервер отклоняет с причиной, а клиент показывает её человеку и даёт
        выход, а не теряет молча.
      - Пока связи нет, человек видит это и знает, что его правки ещё не отправлены.
      - Сервер проверяет права на каждую правку, а клиент при их потере перестаёт принимать правки, объясняет причину
        и даёт забрать несохранённую работу.

      ## Источники

      - [Yjs sync and awareness protocol — y-protocols](https://github.com/yjs/y-protocols/blob/master/PROTOCOL.md)
      - [How Replicache Works — Replicache](https://doc.replicache.dev/concepts/how-it-works)

  - id: sds-local-first
    topic: Офлайн прежде всего
    subtopic: Локальная модель данных
    title: Данные живут на устройстве
    body: |
      ## Какую проблему решаем

      Сервис доставки начал возить в посёлки за городом. Смена курьера — 10 часов, и до трёх часов подряд он ездит там,
      где связи нет совсем.

      В курсе 2, в уроке «Работа без сети и очередь действий», приложение курьера научилось переживать короткие
      обрывы: отметки «доставил» копятся в очереди и уходят, когда связь вернётся. Но в посёлке курьер открыл
      приложение заново, и оно показало пустой экран: список заказов приложение каждый раз запрашивало у сервера.
      Адреса следующих заказов курьер не видел, телефон покупателя тоже.

      Очередь действий спасает то, что курьер **сделал**. Но чтобы работать без сети часами, ему нужно ещё и **видеть**
      нужные данные без сервера. Урок о том, как устроить приложение, у которого данные живут на устройстве.

      ## Офлайн прежде всего и local-first

      - **Офлайн прежде всего** (offline-first) — приложение читает и пишет локальную копию данных, а сеть нужна,
        чтобы синхронизировать её с сервером. Нет сети — приложение работает так же, только копия не обновляется.
        Главный по данным по-прежнему сервер.
      - **Local-first** («сначала локально») — шаг дальше: главная копия данных — на устройстве человека, а сервер
        лишь помогает синхронизировать устройства и хранить резервную копию. Так описывает этот подход статья
        исследовательской группы Ink & Switch «Local-first software»: данные человека работают без сети,
        переживают закрытие сервиса и принадлежат ему.

      Сервису доставки нужен первый вариант: заказы, адреса и отмены по-прежнему решает сервер, но курьер должен
      работать со своей копией, когда сервера не слышно.

      ## Что должно работать без сети

      Проектирование начинают не с хранилища, а со списка сценариев. Для каждого действия решают: работает ли оно
      без сети, и какие данные для этого нужны на устройстве.

      - **Можно делать без сети честно** — то, что человек делает сам и в чём устройство может быть уверено: открыть
        заказ, увидеть адрес и телефон, отметить «забрал» и «доставил», сфотографировать заказ у двери, записать
        полученные наличные.
      - **Нельзя честно сделать без сети** — то, что требует решения сервера или другого человека: принять новый заказ
        (его назначает диспетчер), узнать, не отменили ли заказ только что, подтвердить оплату картой. Такие действия
        либо недоступны, либо показывают оговорку: «Статус на 12:40 — его могли изменить».

      Отсюда список данных, которые нужно держать на устройстве: назначенные на смену заказы с адресами, телефонами
      и составом, отметки самого курьера, фото до отправки.

      ## Чьё слово главное

      Для каждого вида данных решают, чья копия главная, — и это продуктовое решение, а не техническое.

      - **Слово сервера главное** — для того, что решают другие: назначение заказа, отмена рестораном, адрес, который
        изменил покупатель. Копия на устройстве — кэш, и при синхронизации её заменяют данными сервера.
      - **Слово устройства главное** — для того, что делает сам человек: фото у двери, сумма наличных, время, когда
        он отдал заказ. Пока это не отправлено, только устройство знает правду, и потерять её нельзя (урок «Журнал
        операций»).
      - **Конфликт двух главных** — курьер без сети отметил «доставил», а ресторан за это время отменил заказ. Правило
        решает продукт: например, отметка курьера с фото принимается, а заказ уходит поддержке на разбор. Главное —
        решить заранее и не дать одной стороне молча затереть другую.

      ## Сколько хранить и как чистить

      Хранилище браузера не бездонное и не вечное.

      - **Квота.** По MDN, Chrome даёт сайту до 60 % диска, Firefox в обычном режиме — меньшее из 10 % диска и 10 ГиБ.
        Квоту считают от размера диска, а не от свободного места, так что на заполненном телефоне места меньше.
      - **Вытеснение.** По умолчанию данные хранятся «по возможности» (best-effort): когда места мало, браузер удаляет
        данные сайтов, которыми давно не пользовались. Сайт может попросить постоянное хранение вызовом
        `navigator.storage.persist()` (курс 2), и тогда браузер удалит данные, только если человек сам их очистит.
      - **Safari** при включённой защите от отслеживания удаляет данные, записанные скриптом, если с сайтом не было
        взаимодействия семь дней использования браузера (курс 2, «Работа без сети и очередь действий»). На приложение,
        установленное на экран «Домой», это правило не действует — ещё одна причина ставить курьерам PWA.

      Поэтому у локальной модели есть правила уборки: что удаляется и когда. Курьеру нужны заказы текущей смены;
      доставленные и отправленные заказы удаляются на следующий день, отправленные фото — сразу после подтверждения
      сервером. За смену фото набирается до 30 МБ.

      ## Когда меняется формат данных

      Новая версия приложения хранит данные иначе: например, у заказа появилось поле «способ передачи». Данные
      на устройстве при этом старого формата.

      IndexedDB для этого даёт номер версии базы. Приложение открывает базу с новым номером, браузер вызывает
      событие `upgradeneeded`, и в нём код переносит данные из старого формата в новый — это **миграция локальных
      данных**. Две тонкости:
      - так бывает, когда человек нажал «Обновить» в одной вкладке, а в другой осталась старая версия приложения.
        Пока она открыта, она держит базу, и обновление ждёт: старая вкладка получает
        событие `versionchange` и должна закрыть соединение с базой; если не закрыла, новая получает событие `blocked`;
      - весь перенос делают внутри `upgradeneeded`: это одна транзакция, и если телефон сядет посреди переноса, база
        останется в старой версии, а перенос повторится при следующем запуске. Ждать сеть внутри этой транзакции
        нельзя — она закроется раньше времени.

      Отдельная беда — когда в очереди лежат неотправленные действия старого формата. Это тема урока «Синхронизация
      после долгого офлайна».

      ## Service Worker как основа

      Чтобы приложение вообще открылось без сети, его файлы должны быть на устройстве. Это оболочка приложения
      и предварительное кэширование из курса «Доставка и качество», урок «Service Worker и обновления»: Service
      Worker — скрипт, который браузер запускает отдельно от страниц, — при установке кладёт в кэш HTML, скрипты
      и стили. Данные при этом живут не в кэше Service Worker, а в IndexedDB: так их можно читать, менять и мигрировать.

      Второе, что может Service Worker, — **отправить накопленное в фоне**. Background Sync API позволяет странице
      попросить: «когда появится связь, разбуди Service Worker событием `sync`». Тогда очередь уйдёт, даже если
      курьер закрыл приложение. Но по caniuse это работает только в браузерах на Chromium — Chrome, Edge, Chrome для
      Android, Samsung Internet, — а в Safari и Firefox его нет. Поэтому без запасного пути не обойтись: отправка
      при открытии приложения и при событии `online`, как в курсе 2.

      ## Пример целиком: смена курьера

      1. **Начало смены, связь есть.** Приложение загружает заказы смены — с адресами, телефонами и составом —
         в IndexedDB. Просит постоянное хранение.
      2. **Открытие без сети.** Оболочка приходит из кэша Service Worker, заказы — из IndexedDB. Над списком: «Нет
         связи. Данные на 10:15».
      3. **Работа без сети.** Отметки «забрал» и «доставил», фото и наличные записываются локально и попадают
         в журнал операций (следующий урок). Экран сразу показывает их, с пометкой «ждёт отправки».
      4. **Что недоступно.** «Взять новый заказ» неактивна: «Нужна связь — заказы назначает диспетчер». Статус чужих
         изменений подписан «на 10:15».
      5. **Связь вернулась.** В Chrome для Android Service Worker получает `sync` и отправляет журнал, даже если
         приложение закрыто. На iPhone журнал уходит, когда курьер откроет приложение. Затем приходят изменения
         сервера: отмены и новые назначения.
      6. **Уборка.** Отправленные фото удаляются после подтверждения, вчерашние заказы — на следующий день.

      ## Варианты и их цена

      - **Сначала сеть, кэш на случай обрыва**
        - Подходит: офлайн — редкое исключение.
        - Цена: без сети после перезапуска приложение пустое.
      - **Офлайн прежде всего, сервер главный**
        - Подходит: работа без сети часами, но решения принимает сервер — курьер, выездной мастер, склад.
        - Цена: локальная модель, синхронизация, уборка, миграции.
      - **Local-first, устройство главное**
        - Подходит: личные данные человека — заметки, документы, задачи.
        - Цена: синхронизация между устройствами, обычно через CRDT; сложно делать то, что требует решения сервера.

      ## Типичные ошибки

      - **Только очередь действий без локальных данных.** Курьер может отметить «доставил», но не видит адреса.
      - **Обещать без сети то, что требует сервера.** «Заказ принят», хотя его ещё никто не назначил.
      - **Хранить данные в кэше Service Worker.** Их неудобно читать и менять, и их не мигрировать.
      - **Никогда не чистить.** Фото за месяц заполняют телефон, и браузер начинает вытеснять данные сайта.
      - **Миграция без учёта старой вкладки.** Новая версия ждёт, пока старая отпустит базу, а пользователь видит
        зависшее приложение.
      - **Полагаться на Background Sync везде.** На iPhone он не сработает, и накопленное не уйдёт, пока приложение
        не откроют.

      ## Как спрашивают на интервью

      - «Спроектируйте приложение для курьеров или выездных мастеров, которое работает без сети» — ждут список
        сценариев, данные на устройстве, чья копия главная, Service Worker и уборку.
      - «Чем offline-first отличается от local-first?» — ждут, где главная копия данных.
      - «Как поменять формат данных, которые уже лежат на устройствах?» — ждут миграцию IndexedDB по номеру версии.

      ## Коротко

      - Очередь действий спасает то, что человек сделал без сети, но чтобы работать часами, ему нужно и видеть нужные
        данные: приложение читает и пишет локальную копию, а сеть лишь синхронизирует её.
      - Офлайн прежде всего оставляет главным сервер, local-first делает главной копию на устройстве человека.
      - Проектирование начинают со сценариев: что можно честно сделать без сети, а что требует сервера и показывается
        с оговоркой или недоступно.
      - Для каждого вида данных заранее решают, чья копия главная: решения других — за сервером, действия самого
        человека — за устройством до отправки.
      - Хранилище ограничено квотой и может быть вытеснено, поэтому у локальной модели есть правила уборки, а приложению,
        с которым работают каждый день, стоит запросить постоянное хранение; при смене формата данные переносят
        миграцией IndexedDB.
      - Service Worker открывает приложение без сети и может отправить накопленное в фоне через Background Sync, но тот
        работает только в Chromium, поэтому нужна отправка при открытии и возврате сети.

      ## Источники

      - [Local-first software — Ink & Switch](https://www.inkandswitch.com/essay/local-first/)
      - [Storage quotas and eviction criteria — MDN](https://developer.mozilla.org/en-US/docs/Web/API/Storage_API/Storage_quotas_and_eviction_criteria)
      - [Background Synchronization API — MDN](https://developer.mozilla.org/en-US/docs/Web/API/Background_Synchronization_API)

  - id: sds-oplog
    topic: Офлайн прежде всего
    subtopic: Надёжный журнал операций
    title: Журнал операций
    body: |
      ## Какую проблему решаем

      Вечер, курьер вернулся в город после смены в посёлках. За день на телефоне накопилось около 40 действий:
      принял заказ, забрал, фото у двери, доставил, получил наличные — по десятку заказов. Связь появилась, и очередь
      из курса 2 пошла на сервер — по одной внутри заказа, заказы независимо.

      Большая часть дошла. Но обнаружились три беды, которых при коротких обрывах не было видно.

      - **Доставка без фото.** Фото у двери грузится отдельно и долго, а отметка «доставил» по тому же заказу —
        маленький запрос. Она ушла и была принята раньше, чем загрузилось фото, хотя правило бизнеса требует фото
        до отметки. Очередь знала порядок команд заказа, но не знала, что отметка зависит от загрузки файла.
      - **Отметка по устаревшему заказу.** Пока курьер был без связи, покупатель поменял подъезд. Курьер отметил
        «доставил» по старой версии заказа, и сервер не мог понять, видел ли курьер новый адрес.
      - **Лишние операции.** Курьер трижды исправлял сумму наличных по одному заказу, пока пересчитывал сдачу,
        и все три правки ушли на сервер по очереди, хотя нужна была только последняя.

      Очередь из курса 2 рассчитана на минуты без сети. Здесь — часы и десятки связанных действий. Ей нужно стать
      журналом.

      ## Что уже известно из курса 2

      В уроке «Работа без сети и очередь действий» мы договорились:
      - действия без сети записываются в **очередь** в IndexedDB;
      - **сначала записать, потом отправить:** действие попадает в хранилище раньше, чем в сеть, иначе сбой между
        отправкой и записью его потеряет;
      - у каждого действия **идентификатор операции**, и повтор не создаёт дубль;
      - команды одного объекта идут по порядку, а разных — независимо; временный сбой повторяют, окончательный отказ
        показывают человеку.

      Этот урок — что добавляется, когда действий много, они зависят друг от друга и живут на устройстве часами.

      ## Журнал операций

      **Журнал операций** (operation log) — упорядоченный список действий на устройстве, где у каждой записи
      есть всё, чтобы надёжно её отправить и разобраться, если что-то пошло не так:

      - **идентификатор операции** — для защиты от дублей;
      - **тип и данные** — «доставил заказ 4812, в руки»;
      - **версия, на которую опиралась операция** — какой заказ видел курьер, когда отмечал. Сервер по ней поймёт,
        что заказ с тех пор изменился (курс 2, «Версии и конфликты»);
      - **зависимости** — каких операций эта ждёт: «доставил» ждёт «забрал» и фото;
      - **состояние** — ждёт отправки или отклонена с причиной, плюс число попыток и причина последней ошибки.
        Состояния «отправляется» нет (курс 2): всё неподтверждённое после перезапуска отправляют снова.
        Подтверждённые записи из журнала удаляют.

      Как и в курсе 2, запись в журнал и изменение локальной копии делают одной транзакцией IndexedDB: после
      внезапного выключения телефона не будет ни статуса без записи в журнале, ни записи без статуса.

      ## Зависимости и порядок отправки

      Порядок «по одной внутри заказа» из курса 2 держит последовательность команд, но не знает, что «доставил» ждёт
      фото, которое загружается отдельно, — или операцию другого объекта. Поэтому зависимости записывают явно,
      и журнал отправляет операцию, только когда все, от которых она зависит, подтверждены сервером.

      - **Зависимые операции** идут по порядку: «принял» → «забрал» → фото → «доставил».
      - **Независимые** — операции разных заказов — идут параллельно, и задержка одной не держит остальные.
      - **Большие данные** — фото — загружаются отдельно, по подписанной ссылке (курс 2, «Загрузка файлов»), а операция
        «доставил» ссылается на загруженное фото по его идентификатору.

      На сервере журнал удобно сверять номерами. Replicache, например, нумерует действия каждого клиента по порядку,
      а сервер помнит номер последнего применённого и сообщает его клиенту. Всё с номером не больше этого клиент
      считает подтверждённым и убирает из журнала, а повтор уже применённого сервер узнаёт и пропускает.

      Если приложение открыто в нескольких вкладках, журнал отправляет только одна из них: отправка идёт под
      блокировкой Web Locks, как ведущая вкладка в уроке «Несколько вкладок». Курс 2 оставил этот вопрос на потом.
      Идентификатор операции защищает от двойного выполнения, а блокировка — от двух отправок, которые обгоняют
      друг друга.

      ![Журнал курьера: три цепочки по заказам. Заказ 4810: принял, забрал, фото, доставил — всё подтверждено. Заказ 4812: принял, забрал подтверждены, фото отклонено — файл повреждён, «доставил» ждёт решения. Заказ 4815: принял и забрал подтверждены, фото загружается, «доставил» ждёт фото. Операции разных заказов идут независимо, отказ по 4812 не держит остальные](images/sds-oplog.png "Зависимые операции ждут друг друга, независимые идут параллельно")

      ## Застрявшая операция

      **Застрявшая операция** — та, что не может пройти: сервер окончательно отказал или временные сбои повторяются
      снова и снова. Правила обращения с ней:

      1. **Она держит только свои зависимые.** Отказ фото по заказу 4812 держит только «доставил» этого заказа
         и не останавливает операции других заказов — как и в курсе 2, где застрявшая команда держала только свой
         заказ.
      2. **Её не удаляют молча.** Фото и отметки курьера — факты, которые знает только устройство (урок «Данные живут
         на устройстве»). Застрявшую операцию показывают человеку с причиной и выходом — это правило тоже из курса 2.
      3. **Окончательный отказ отличают от временного.** «Файл повреждён» — окончательный: повторять бессмысленно,
         нужно решение. «Сервер недоступен» — временный: повторять с паузой. Если временный сбой повторяется много раз
         (например, фото не грузится десятый раз), операцию тоже помечают «нужно внимание».
      4. **О ней знает поддержка.** Застрявшие операции попадают в журнал ошибок на сервере (курс «Доставка
         и качество», урок «Что происходит у пользователей»), чтобы поддержка видела их раньше, чем позвонит
         ресторан.

      ## Сжатие журнала

      Если до отправки одна и та же вещь менялась несколько раз — курьер трижды исправлял сумму наличных, — можно
      отправить только последнее значение. Это **сжатие журнала**. Сжимают только неотправленное и только там, где
      промежуточные значения никому не нужны. Отметки о передаче заказа не сжимают: важен каждый шаг и его время.

      ## Пример целиком: журнал курьера за смену

      1. **Запись.** Каждая отметка — запись журнала: идентификатор операции, заказ, версия заказа, которую видел
         курьер, зависимости, время на устройстве. Запись и новый статус заказа в локальной копии — одной транзакцией
         IndexedDB.
      2. **Фото.** Фото у двери сохраняется на телефоне и загружается отдельно; «доставил» зависит от его загрузки.
      3. **Связь вернулась.** Журнал отправляет цепочки заказов параллельно, внутри цепочки — по порядку.
      4. **Заказ 4815.** Фото ещё грузится, «доставил» ждёт. Как только фото загружено, уходит отметка со ссылкой
         на него. Сервер больше не получает доставку без фото.
      5. **Заказ 4818.** Отметка «доставил» несёт версию заказа 3, а у сервера уже версия 4: покупатель сменил подъезд.
         Сервер принимает отметку — передача заказа уже случилась, — но помечает её для поддержки: «Доставлено, пока
         менялся адрес — проверьте с покупателем».
      6. **Заказ 4812.** Сервер окончательно отказывается принять фото у двери: файл повреждён при записи
         на телефоне. «Доставил» по этому заказу ждёт фото и тоже стоит. Остальные операции уходят без задержки.
         Курьер видит «Фото не принято: файл повреждён — переснимите или отметьте доставку через поддержку»,
         поддержка видит эту запись в своём кабинете.
      7. **Сумма наличных.** Три правки суммы по одному заказу ещё не ушли, поэтому журнал сжал их до последней,
         и на сервер ушло одно значение.
      8. **Уборка.** Подтверждённые записи удаляются из журнала; отклонённые хранятся, пока по ним не примут решение.

      ## Варианты и их цена

      - **Строгая общая очередь**
        - Подходит: минуты без сети, мало действий.
        - Цена: одна застрявшая команда держит все.
      - **Очередь по объектам**
        - Подходит: действия разных объектов независимы.
        - Цена: не знает о зависимостях между объектами и о больших файлах.
      - **Журнал с явными зависимостями**
        - Подходит: часы без сети, связанные действия, файлы.
        - Цена: сложнее хранить и отправлять, нужен разбор застрявших.

      ## Типичные ошибки

      - **Отправлять зависимое раньше, чем подтверждено то, от чего оно зависит.** Доставка уходит без фото.
      - **Не записывать, на какую версию опиралась операция.** Сервер не может понять, видел ли человек изменение.
      - **Удалять застрявшую операцию молча.** Факт, который знал только телефон, потерян навсегда.
      - **Повторять окончательный отказ.** Повреждённый файл не пройдёт и с сотой попытки.
      - **Хранить состояние «отправляется».** После выгрузки посреди запроса запись застрянет (курс 2).
      - **Сжимать отметки, где важен каждый шаг.** Пропадают время и последовательность передачи заказа.

      ## Как спрашивают на интервью

      - «Пользователь сделал 50 действий без сети. Как надёжно их отправить?» — ждут журнал с идентификаторами,
        «сначала записать», зависимости и параллельные независимые цепочки.
      - «Одна операция постоянно получает отказ. Что с ней делать?» — ждут различие окончательного и временного отказа
        и показ человеку без молчаливого удаления.
      - «Как сервер понимает, какие действия клиента уже применены?» — ждут идентификаторы или номер последнего
        применённого действия.

      ## Коротко

      - Журнал операций развивает очередь из курса 2: у каждой записи идентификатор операции, данные, версия, на которую
        она опиралась, зависимости и состояние.
      - Как и в курсе 2, запись в журнал и изменение локальной копии делают одной транзакцией IndexedDB, а состояния
        «отправляется» у записи нет; журнал отправляет одна вкладка — под блокировкой Web Locks.
      - Операция уходит, только когда подтверждены те, от которых она зависит; независимые цепочки идут параллельно,
        а большие файлы загружаются отдельно, и операция ссылается на них.
      - Застрявшая операция держит только свои зависимые, её не удаляют молча, окончательный отказ не повторяют,
        а показывают человеку и поддержке.
      - Сжимать журнал можно только неотправленные изменения, где промежуточные значения никому не нужны.

      ## Источники

      - [How Replicache Works — Replicache](https://doc.replicache.dev/concepts/how-it-works)
      - [Using IndexedDB — MDN](https://developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API/Using_IndexedDB)

  - id: sds-sync
    topic: Офлайн прежде всего
    subtopic: Синхронизация после долгого офлайна
    title: Синхронизация после долгого офлайна
    body: |
      ## Какую проблему решаем

      В 21:00 у курьера сел телефон. В журнале остались шесть неотправленных операций по двум последним заказам:
      «доставил», фото, «получил наличные 1450 ₽». Ночью произошло три вещи:
      - вышла новая версия приложения курьера: в операции «доставил» появилось обязательное поле «способ передачи» —
        в руки или у двери. Формат операций журнала сменился с версии 3 на версию 4;
      - поддержка оформила покупателю одного из этих заказов возврат 200 ₽ за опоздание: сумма к оплате изменилась;
      - диспетчер назначил курьеру три заказа на утро.

      В 8:00 курьер включает телефон. Открывается старая версия приложения из кэша, а новая скачивается и ждёт
      (курс «Доставка и качество», урок «Service Worker и обновления»). Сервер с ночи ждёт поле «способ передачи»,
      а в двух операциях «доставил» его нет. Сумма наличных в операции не совпадает с новой суммой заказа. Утренние заказы
      ещё не загружены.

      Это синхронизация после долгого офлайна: копии разошлись на ночь, и за это время поменялись не только данные,
      но и сам формат данных. Урок о том, как устроить протокол синхронизации, чтобы пережить и это.

      ## Протокол синхронизации

      **Протокол синхронизации** — договорённость между клиентом и сервером о том, как свести их копии. В общих чертах
      у него три шага.

      1. **Отправить своё** (push). Клиент отправляет неподтверждённые операции журнала (урок «Журнал операций»).
         Сервер применяет их — или отклоняет с причиной — и запоминает, какие операции этого клиента уже применил.
      2. **Получить чужое** (pull). Клиент просит изменения с **курсора синхронизации** — отметки, до какого места
         он уже знает данные сервера. Сервер отвечает изменениями после курсора и новым курсором.
      3. **Свести** (reconcile). Клиент применяет изменения сервера к своей копии, убирает из журнала подтверждённые
         операции, а ещё не подтверждённые заново применяет поверх свежих данных — это перебазирование из урока
         «Другие устройства и другие люди».

      Так устроена, например, библиотека Replicache. Клиент отправляет действия на точку push, а изменения получает
      с точки pull. Курсор там называется cookie, и это значение непрозрачное для клиента: оно лишь обозначает
      состояние сервера, которое у клиента уже есть. В ответе pull сервер сообщает и номер последней применённой
      операции этого клиента. По нему клиент понимает, что уже подтверждено.

      Курсор — родственник позиции в потоке из курса «Реальное время и большие списки», урок «Снимок и догоняющие
      события». И правило то же: если курсор слишком старый и сервер больше не хранит изменения после него, клиент
      получает снимок целиком вместо изменений.

      Обычно сначала отправляют своё, потом получают чужое: тогда ответ pull уже включает результат своих операций,
      и экран не мигает старым состоянием.

      ## Конфликты после долгого расхождения

      За ночь накапливаются конфликты, которых за минуту обрыва не бывает. Их разбирают по правилам из урока «Данные
      живут на устройстве»: для каждого вида данных заранее решено, чьё слово главное.

      - **Решения других** — назначение, отмена, адрес — побеждает сервер. Курьер получает утренние заказы как есть.
      - **Факты, которые знает только устройство,** — что заказ отдан, сколько денег получено — сервер не выбрасывает,
        даже если они противоречат его данным. Он принимает факт и помечает расхождение для человека.
      - **Операция, опиравшаяся на устаревшую версию,** — например, «получил 1450 ₽», а сумма к оплате с ночи
        1250 ₽. Ни одна сторона не может молча выиграть: курьер действительно получил 1450 ₽, а покупателю действительно
        оформили возврат. Сервер сохраняет оба факта, а поддержка решает, что вернуть покупателю.

      ## Когда меняется формат данных

      Новая версия приложения может прийти, пока на устройстве лежат операции старого формата. Хорошая новость: это
      предсказуемая беда, и к ней готовятся заранее.

      - **У каждой операции есть версия формата.** В записи журнала хранится не только версия объекта, но и версия
        формата самой операции: «доставил, формат 3».
      - **Сервер какое-то время принимает старый формат.** Это приём «расширить и сузить» из курса «Доставка
        и качество», урок «Кэш файлов и выкатка новой версии»: сервер сначала понимает оба формата, а старый убирают,
        только когда старые клиенты ушли. Срок решают по самому долгому возможному офлайну — если курьер может
        не выходить на связь до трёх дней, старый формат принимают хотя бы неделю — и по тому, сколько клиентов ещё
        присылают старую версию в заголовке запроса. Для старой
        операции сервер подставляет значение по умолчанию или помечает её для проверки.
      - **Клиент может перевести операции в новый формат сам** — тем же переносом, что и данные IndexedDB (урок
        «Данные живут на устройстве»), — если перевод однозначен. Если нет — например, «способ передачи» знал только
        курьер, — операцию отправляют в старом формате и полагаются на сервер.
      - **Новый код появляется не сразу.** Service Worker новой версии ждёт, пока закроются вкладки старой (курс
        «Доставка и качество», урок «Service Worker и обновления»), а старые файлы приложения хранятся на сервере ещё
        какое-то время. Значит, какое-то время старый и новый код работают одновременно, и сервер должен понимать оба.

      ## Частично неразрешимые конфликты

      Иногда после синхронизации остаются операции, которые не удалось ни применить, ни разрешить автоматически.
      Правила для них — продолжение прошлых уроков:
      - **ничего не теряется молча.** Неприменённые операции остаются на устройстве и на сервере в журнале ошибок;
      - **человек видит итог,** например: «Синхронизировано 46 действий, 2 требуют внимания» — со списком,
        причинами и действиями: отправить в поддержку, повторить, удалить вручную;
      - **работа не блокируется.** Остальные данные синхронизированы, и человек работает дальше, пока проблемные
        операции ждут решения;
      - **поддержка видит то же,** что и человек, и может разобраться без звонка.

      ## Пример целиком: утро курьера

      1. **8:00, запуск.** Открывается старая версия из кэша Service Worker, новая скачивается и ждёт. Шесть операций
         журнала — формата 3.
      2. **Отправить своё.** Журнал отправляет шесть операций. Сервер ещё принимает формат 3: для «доставил» без
         способа передачи он ставит «не указан» и принимает отметку. Фото уходит отдельно, как и раньше.
      3. **Расхождение.** «Получил наличные 1450 ₽» опиралась на версию заказа до возврата. Сервер принимает факт,
         отмечает расхождение «получено 1450 ₽, к оплате 1250 ₽» и отправляет его поддержке.
      4. **Получить чужое.** Клиент запрашивает изменения с курсора вчерашнего вечера и получает три утренних заказа,
         новую сумму по заказу с возвратом и номер последней применённой операции. Подтверждённые операции уходят
         из журнала.
      5. **Что видит курьер.** «Синхронизировано: 6 действий. 1 расхождение передано в поддержку». В списке — три
         новых заказа.
      6. **Обновление.** Курьер нажимает «Доступна новая версия — обновить». Новая версия переносит данные IndexedDB
         в новый формат. Неотправленных операций старого формата к этому времени уже нет, а если бы были, они ушли бы
         в формате 3.
      7. **Через неделю** сервер перестаёт принимать операции формата 3: самое долгое время без связи у курьеров —
         три дня, запаса хватает.

      ## Варианты и их цена

      - **Только последнее состояние, без журнала**
        - Подходит: данные, где важна лишь последняя версия, а не каждый шаг.
        - Цена: нельзя понять, что сделал человек и в каком порядке.
      - **Журнал, push и pull с курсором**
        - Подходит: долгий офлайн, связанные действия, сервер главный.
        - Цена: протокол на клиенте и сервере, хранение изменений для курсоров.
      - **CRDT и синхронизация между устройствами**
        - Подходит: local-first, личные данные, правка без сервера.
        - Цена: служебные данные, сложная проверка прав и бизнес-правил.
      - **Поддержка старого формата на сервере**
        - Подходит: формат меняется, а устройства бывают офлайн днями.
        - Цена: сервер какое-то время живёт с двумя форматами.

      ## Типичные ошибки

      - **Менять формат без версии в операциях.** Сервер не отличает старую операцию от сломанной новой.
      - **Отказываться от старого формата в день выпуска.** Все, кто был офлайн, теряют накопленное.
      - **Выбрасывать факт устройства, противоречащий серверу.** Курьер получил деньги, а в системе об этом нет следа.
      - **Курсор без запасного пути.** Сервер стёр старые изменения, а клиент ждёт их и не получает ничего.
      - **Блокировать работу из-за двух проблемных операций.** Курьер не может взять утренние заказы.
      - **Сообщать «Ошибка синхронизации» без списка.** Человек не знает, что именно не дошло.

      ## Как спрашивают на интервью

      - «Спроектируйте синхронизацию приложения, которое работает офлайн днями» — ждут push, pull с курсором,
        сведение и правила для конфликтов.
      - «Что будет с данными на устройстве, если вы поменяете формат API?» — ждут версию формата в операциях,
        поддержку старого формата на сервере и миграцию на клиенте.
      - «Что показывать пользователю, если часть изменений не синхронизировалась?» — ждут итог со списком, причинами
        и выходом без блокировки работы.

      ## Коротко

      - Протокол синхронизации в общих чертах: отправить свои операции (push), получить чужие изменения с курсора
        (pull) и свести — применить изменения сервера и заново наложить ещё не подтверждённые свои.
      - Курсор отмечает, до какого места клиент знает данные сервера; если он слишком старый, клиент получает снимок
        целиком.
      - Конфликты после долгого расхождения разбирают по заранее решённому правилу, чьё слово главное; факты, которые
        знает только устройство, сервер не выбрасывает, а помечает расхождение для человека.
      - У каждой операции есть версия формата, сервер принимает старый формат дольше самого долгого возможного
        офлайна, а клиент переводит операции в новый формат, только если перевод однозначен.
      - Неразрешимые операции не теряются молча и не блокируют работу: человек и поддержка видят список с причинами
        и выходом.

      ## Что вы теперь умеете

      - Координировать несколько вкладок: сообщать об изменениях, выбирать ведущую вкладку и страховаться перезапросом.
      - Узнавать о чужих изменениях с других устройств и выбирать, что показать человеку, по цене потери.
      - Проектировать составные изменения: одна серверная операция, транзакция или сага, причинность при повторе.
      - Формулировать требования к совместной работе и выбирать единицу конфликта.
      - Выбирать между блокировкой, версиями, «последняя запись побеждает», OT и CRDT и объяснять разницу между
        основными алгоритмами.
      - Восстанавливать совместную сессию после обрыва и при смене прав.
      - Проектировать офлайн прежде всего: локальная модель, журнал операций, протокол синхронизации и смена формата.

      ## Что дальше

      Следующий курс — «Большие приложения». До сих пор мы проектировали одно приложение и его данные. Там вопрос
      в другом: как делить большое приложение между командами, когда выбирать модульный монолит, а когда
      микрофронтенды, как постепенно переезжать со старой архитектуры и как обращаться с техническим долгом.
      Из этого курса там пригодятся версии форматов и поддержка двух версий сразу — без них не обходится ни одна
      постепенная миграция.

      ## Источники

      - [How Replicache Works — Replicache](https://doc.replicache.dev/concepts/how-it-works)
      - [Local-first software — Ink & Switch](https://www.inkandswitch.com/essay/local-first/)

questions:
  - id: sds-intro-001
    topic: Введение
    subtopic: Одни данные в разных местах
    level: junior
    question: |
      В приложении «Список покупок» человек добавил молоко на ноутбуке, а через минуту открыл список на телефоне —
      молока там нет, пока он не потянет список вниз. Сеть на обоих устройствах есть. К какой части курса относится
      эта проблема?
    options:
      - text: 'Согласованность между клиентами'
        correct: true
        why: 'Одни данные открыты на двух устройствах одного человека, и одно не узнало об изменении на другом. Это расхождение ненадолго, тема первой части курса.'
      - text: 'Совместная работа'
        why: 'Совместная работа — когда одно и то же правят одновременно, часто несколько людей. Здесь правка одна, и проблема только в том, что второе устройство о ней не узнало.'
      - text: 'Офлайн прежде всего'
        why: 'Сеть на обоих устройствах есть. Офлайн — это когда копии живут порознь часами и днями.'
      - text: 'Ни к какой: это ошибка кэша на сервере'
        why: 'Сервер правку получил: ноутбук её сохранил. Телефон просто не знает, что его копия устарела.'
    explanation: |
      Курс идёт по расстояниям между копиями: вкладки, устройства и люди, совместная правка, долгий офлайн. Здесь
      копии на двух устройствах разошлись на минуту при живой сети — это согласованность между клиентами: как
      устройство узнаёт о чужом изменении и что показывает человеку.
    links:
      - https://www.inkandswitch.com/essay/local-first/

  - id: sds-intro-002
    topic: Введение
    subtopic: Одни данные в разных местах
    level: middle
    question: |
      В онлайн-редакторе документов шестеро сотрудников одновременно печатают в одном абзаце. Сейчас редактор
      сохраняет абзац целиком, и побеждает тот, кто сохранил последним. Люди жалуются, что их буквы и слова
      пропадают. Какой урок курса разбирает, как это исправить?
    options:
      - text: 'Несколько вкладок'
        why: 'Здесь шесть разных людей и устройств, а не вкладки одного человека.'
      - text: 'Другие устройства и другие люди'
        why: 'Этот урок о том, как узнать о чужом изменении записи и что показать человеку. Одновременный набор текста в одном абзаце требует других механизмов.'
      - text: 'Совместный текст: OT и CRDT'
        correct: true
        why: 'Когда несколько человек пишут в одном тексте, каждая правка сдвигает позиции других. Алгоритмы OT и CRDT для этого и придуманы.'
      - text: 'Журнал операций'
        why: 'Журнал операций — про действия, накопленные без сети. Здесь все в сети, а правки теряются из-за модели слияния.'
    explanation: |
      «Последняя запись побеждает» для общего текста теряет правки всех, кроме последнего. Для одновременного набора
      текста нужны модели слияния, которые сводят правки посимвольно, — преобразование операций (OT) или CRDT.
      Их разбирает урок «Совместный текст: OT и CRDT».
    links:
      - https://www.inkandswitch.com/essay/local-first/

  - id: sds-intro-003
