  - id: sds-local-first-001
    topic: Офлайн прежде всего
    subtopic: Локальная модель данных
    level: junior
    question: |
      Приложение заметок хранит все заметки человека на его устройствах, работает без сети как обычно, а сервер
      нужен только чтобы передавать изменения между ноутбуком и телефоном и держать резервную копию. Если сервис
      закроется, заметки останутся у человека. Как называется такой подход?
    options:
      - text: 'Local-first: главная копия — на устройстве человека'
        correct: true
        why: 'Сервер лишь помогает синхронизировать устройства и хранит резервную копию, а данные принадлежат человеку и живут у него.'
      - text: 'Офлайн прежде всего, где главный по данным — сервер'
        why: 'При офлайн прежде всего приложение тоже работает с локальной копией, но главная копия — на сервере. Здесь сервер может исчезнуть, а заметки останутся.'
      - text: 'Сначала сеть, а кэш на устройстве — на случай обрыва связи'
        why: 'В таком приложении без сети после перезапуска нечего было бы показать. Здесь оно работает без сети как обычно.'
      - text: 'Очередь действий для коротких обрывов связи'
        why: 'Очередь спасает действия на время обрыва, но не делает устройство хозяином данных.'
    explanation: |
      Офлайн прежде всего — приложение работает с локальной копией, а сеть её синхронизирует; главный по данным остаётся
      сервер. Local-first идёт дальше: главная копия на устройстве человека, а сервер — помощник для синхронизации
      и резервной копии. Так этот подход описывает статья Ink & Switch.
    links:
      - https://www.inkandswitch.com/essay/local-first/

  - id: sds-local-first-002
    topic: Офлайн прежде всего
    subtopic: Локальная модель данных
    level: middle
    question: |
      Приложение выездного мастера складывает отметки о работах в очередь и отправляет их, когда появится связь.
      Мастер в подвале без сети закрыл приложение, открыл снова — и увидел пустой список: адреса и описания заявок
      приложение каждый раз берёт с сервера. Что нужно добавить?
    options:
      - text: 'Увеличить тайм-аут запроса заявок, чтобы дождаться слабой сети'
        why: 'Сети в подвале нет совсем, и сколько ни жди, ответа не будет.'
      - text: 'Хранить заявки смены на устройстве и показывать их оттуда'
        correct: true
        why: 'Очередь спасает то, что мастер сделал, но чтобы работать без сети, ему нужно и видеть данные. Заявки смены загружают в IndexedDB заранее и читают оттуда.'
      - text: 'Отправлять очередь отметок чаще, чтобы она не копилась'
        why: 'Очередь здесь ни при чём: без сети её не отправить, а пустой экран — из-за того, что данных нет на устройстве.'
      - text: 'Показывать при пустом списке сообщение «Нет связи, попробуйте позже»'
        why: 'Сообщение честнее пустоты, но мастер всё равно не увидит адрес следующей заявки и не сможет работать.'
    explanation: |
      Чтобы работать без сети часами, мало сохранять действия: нужны и данные, с которыми человек работает. Офлайн
      прежде всего — приложение читает и пишет локальную копию, а сеть её синхронизирует. Данные, нужные для работы,
      загружают на устройство заранее, пока связь есть.
    links:
      - https://www.inkandswitch.com/essay/local-first/

  - id: sds-local-first-003
    topic: Офлайн прежде всего
    subtopic: Локальная модель данных
    level: middle
    question: |
      Выездной мастер работает весь день без сети. Какое действие приложение не может честно выполнить без связи
      с сервером?
    options:
      - text: 'Сфотографировать результат работы и приложить к заявке'
        why: 'Фото делает сам мастер, и оно хранится на устройстве до отправки. Сервер для этого не нужен.'
      - text: 'Записать клиента на повторный визит в свободное окно'
        correct: true
        why: 'Свободные окна делят все мастера и диспетчер. Без сервера нельзя знать, не занято ли окно, поэтому запись либо недоступна, либо явно помечена как предварительная.'
      - text: 'Отметить время начала и окончания работы по заявке'
        why: 'Это факт, который знает только мастер. Его записывают локально и отправляют позже.'
      - text: 'Открыть адрес и описание заявки, загруженной утром'
