    options:
      - text: 'Мастер весь день работал в подвалах без связи, вечером часть отметок о работах не дошла'
        correct: true
        why: 'Устройство долго жило без сети и накопило действия. Как их хранить и надёжно отправить, разбирает офлайн-часть курса.'
      - text: 'После обновления приложения отчёты, накопленные без сети, перестали отправляться'
        correct: true
        why: 'Смена формата данных, пока действия лежали на устройстве, — типичная беда долгого офлайна.'
      - text: 'Диспетчер открыл расписание в двух вкладках, и правка в одной не видна во второй'
        why: 'Это вкладки одного браузера при живой сети — первая часть курса, координация вкладок.'
      - text: 'Два диспетчера одновременно перенесли один и тот же визит на разное время'
        why: 'Конфликт двух людей при живой сети — тема согласованности между клиентами и моделей слияния.'
      - text: '«Закрыть смену» прошло наполовину: смена закрыта, а итоговый отчёт не создан'
        why: 'Несколько связанных изменений с частичным успехом — первая часть курса, и сеть здесь не пропадала.'
    explanation: |
      Отличить части курса помогает вопрос: как долго и почему копии жили порознь? Миллисекунды между вкладками
      и секунды между людьми — согласованность и совместная работа. Часы и дни без сети, накопленные действия
      и обновление приложения посреди этого — офлайн прежде всего.
    links:
      - https://www.inkandswitch.com/essay/local-first/

  - id: sds-tabs-001
    topic: Согласованность между клиентами
    subtopic: Координация вкладок
    level: junior
    question: |
      Веб-почта открыта в двух вкладках. Список писем каждая вкладка держит в клиентском кэше TanStack Query. Человек
      прочитал письмо в первой вкладке, а во второй оно по-прежнему выделено жирным как непрочитанное. Почему?
    options:
      - text: 'Клиентский кэш живёт в памяти каждой вкладки отдельно'
        correct: true
        why: 'Память JavaScript у каждой вкладки своя. Вторая вкладка держит свою копию списка и не знает, что в первой что-то изменилось.'
      - text: 'У каждой вкладки своё хранилище localStorage'
        why: 'localStorage у вкладок одного сайта общий. Своя у каждой вкладки — память JavaScript, где и живёт кэш.'
      - text: 'Сервер помнит прочитанное отдельно для каждой открытой вкладки'
        why: 'Сервер ничего не знает о вкладках: письмо прочитано для аккаунта. Устарела копия во второй вкладке.'
      - text: 'Браузер запрещает двум вкладкам читать одни данные'
        why: 'Такого запрета нет. Вкладки могут читать одни данные, но каждая держит свою копию в памяти.'
    explanation: |
      У вкладок одного сайта общие хранилища — `localStorage`, IndexedDB, куки, — но своя память, свои соединения
      и таймеры. Данные в памяти, например клиентский кэш, у каждой вкладки — отдельная копия. Чтобы копии сходились,
      вкладки сообщают друг другу об изменениях (`BroadcastChannel`) или перечитывают данные при возврате.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Broadcast_Channel_API

  - id: sds-tabs-002
    topic: Согласованность между клиентами
    subtopic: Координация вкладок
    level: middle
    question: |
      Трекер задач получает уведомления по WebSocket, и каждая открытая вкладка держит своё соединение. Люди держат
      по пять вкладок с разными досками, и каждое уведомление звучит пять раз. Нужно одно соединение и один звук
      на браузер. Половина пользователей сидит на iPhone с iOS 15.4–15.8. Что предпочтительнее?
    options:
      - text: 'Ведущая вкладка через Web Locks, остальным — события через BroadcastChannel'
        correct: true
        why: 'Блокировку получает одна вкладка — она держит соединение и звук. Когда её закроют, блокировка перейдёт к следующей. Оба API есть в Safari с версии 15.4.'
      - text: 'Держать соединение в SharedWorker, общем для всех вкладок'
        why: 'Это решило бы задачу там, где SharedWorker есть, но в Safari он появился только с 16-й версии. Половина пользователей осталась бы без уведомлений.'
      - text: 'Первая вкладка ставит в localStorage флаг «соединение есть», остальные его проверяют'
        why: 'Если вкладка с флагом упадёт или закроется без уборки, флаг останется, и соединения не будет ни у кого. Блокировка Web Locks освобождается сама.'
      - text: 'Оставить соединение в каждой вкладке, а звук играть только в видимой'
        why: 'Звук станет один, но на сервере останется по пять соединений на человека. А если все вкладки скрыты, звука не будет вовсе.'
    explanation: |
      Общий ресурс — соединение, звук, фоновую работу — удобно отдать одной ведущей вкладке. Выбирают её блокировкой
      Web Locks API: блокировку держит одна вкладка, остальные ждут в очереди, а при закрытии вкладки блокировка
      переходит к следующей. События ведущая пересылает остальным через `BroadcastChannel`. `SharedWorker` делает
      то же проще, но поддерживается не везде.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Web_Locks_API

  - id: sds-tabs-003
    topic: Согласованность между клиентами
    subtopic: Координация вкладок
    level: middle
    question: |
      Онлайн-редактор документов после переименования файла отправляет остальным вкладкам сообщение через
      `BroadcastChannel`. Человек переименовал файл в одной вкладке, а вторая всё это время была в фоне на телефоне,
      и браузер выгрузил её из памяти. Вернувшись, человек видит, как вкладка загружается заново и показывает старое
      название из копии на устройстве. Что исправить?
    options:
      - text: 'Повторять сообщение о переименовании каждые несколько секунд'
        why: 'Выгруженная вкладка не получит и повторы: пока человек не вернулся, её просто нет. А сколько повторять, неизвестно.'
      - text: 'При открытии и возврате на вкладку перечитывать данные с сервера'
        correct: true
        why: 'Сообщения между вкладками не хранятся, и выгруженная вкладка их пропускает. Перезапрос при открытии и возврате ловит всё, что изменилось, откуда бы ни пришло изменение.'
      - text: 'Отправлять сообщение через событие storage вместо BroadcastChannel'
        why: 'Событие storage тоже получают только открытые вкладки. Выгруженная пропустит его так же.'
      - text: 'Запретить браузеру выгружать вкладку редактора из памяти'
        why: 'Сайт не управляет выгрузкой вкладок: это решение браузера ради батареи и памяти.'
    explanation: |
      Сообщение между вкладками — подсказка «перечитай», а не гарантированная доставка: его никто не хранит, и вкладка,
      которую браузер выгрузил или которая ещё не была открыта, его не получит. Поэтому основа согласованности — перезапрос при возврате
      на вкладку, а сообщения лишь ускоряют обновление для тех вкладок, что были живы.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Broadcast_Channel_API

  - id: sds-tabs-004
    topic: Согласованность между клиентами
    subtopic: Координация вкладок
    level: senior
    question: |
      Веб-почта выбирает ведущую вкладку блокировкой Web Locks; ведущая держит соединение и раз в 5 секунд шлёт
      остальным пинг. В мобильном браузере ведущая вкладка иногда оказывается в фоне, и браузер её приостанавливает. Разработчик предлагает:
      если пинга нет 15 секунд, ведомая вкладка забирает блокировку опцией `steal`. Какой риск у этого решения нужно
      закрыть?
    options:
      - text: 'Опция steal не работает, если владелец блокировки приостановлен'
        why: 'steal отбирает блокировку независимо от состояния владельца. Проблема в том, что происходит с прежним владельцем потом.'
      - text: 'Проснувшись, прежняя ведущая продолжит работу, и ведущих станет две'
        correct: true
        why: 'Спецификация предупреждает: код прежнего владельца не останавливается и работает «без гарантий». Он должен сам следить за отклонением своего запроса блокировки и закрывать соединение, иначе соединений и звуков станет два.'
      - text: 'После steal блокировку уже никто не сможет получить, пока не перезапустить браузер'
        why: 'Отобранная блокировка просто переходит новому владельцу и освобождается обычным образом, когда его вкладку закроют.'
      - text: 'steal закрывает вкладку прежнего владельца, и человек теряет её содержимое'
        why: 'steal не закрывает вкладки. Он только забирает блокировку — и в этом риск: вкладка с прежним владельцем живёт дальше.'
    explanation: |
      Опция `steal` отбирает блокировку и сразу отдаёт её новому владельцу, а у прежнего лишь отклоняет запрос
      с ошибкой `AbortError`. Его код продолжает работать. Если ведущую сместили, пока она была приостановлена, после
      пробуждения она должна заметить потерю и закрыть соединение. Иначе ведущих станет две. Поэтому проще и надёжнее,
      когда ведомые не отбирают блокировку, а сами перечитывают данные при возврате на вкладку.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Web_Locks_API

  - id: sds-tabs-005
    topic: Согласованность между клиентами
    subtopic: Координация вкладок
    level: senior
    multiple: true
    question: |
      В трекере задач одна задача открыта на редактирование в двух вкладках. Человек поменял срок в первой вкладке
      и сохранил, а во второй у него остались несохранённые правки описания этой же задачи. Обе вкладки открыты
      в двух окнах рядом на большом мониторе и всё время видны. Второе окно должно показать изменение сразу после
      сохранения в первом, ещё до того, как человек к нему перейдёт, и ничего не должно потеряться молча. Какие
      решения нужны?
    options:
      - text: 'Сообщать другим вкладкам через BroadcastChannel, что задача изменилась, с её новой версией'
        correct: true
        why: 'Перезапрос при возврате сработает, только когда человек перейдёт во второе окно, а изменение нужно показать сразу. Это и делает сообщение между вкладками.'
      - text: 'Не менять данные под несохранёнными правками молча, а показать «Задачу изменили в другой вкладке»'
        correct: true
        why: 'Иначе обновление затрёт то, что человек печатал. Плашка даёт решить, что оставить.'
      - text: 'Проверять версию на сервере при сохранении из второй вкладки'
        correct: true
        why: 'Сообщение могло не дойти. Проверка версии — последняя защита: сервер не даст сохранить правку поверх изменения, о котором вкладка не знала.'
      - text: 'Сохранять из второй вкладки поверх, без проверки: последняя запись побеждает'
        why: 'Сохранение поверх затрёт новый срок из первой вкладки, и человек этого не заметит.'
    explanation: |
      Координация вкладок не заменяет защиту на сервере, а дополняет её. Сообщение между вкладками быстро подсказывает,
      что данные изменились, но может потеряться. Несохранённую правку нельзя затирать молча — человеку показывают,
      что произошло. А проверка версии при сохранении остаётся последней защитой от правки из устаревшей вкладки.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Broadcast_Channel_API

  - id: sds-devices-001
    topic: Согласованность между клиентами
    subtopic: Другие устройства и пользователи
    level: junior
    question: |
      В календаре человек открыл встречу на редактирование и начал менять описание, но ещё не нажал «Сохранить».
      Чьё это недописанное описание и где его настоящая копия?
    options:
      - text: 'Черновик этого устройства и человека; сервер о нём не знает'
        correct: true
        why: 'Пока правка не сохранена, её хозяин — устройство и человек. Если клиент её потеряет, восстановить её неоткуда.'
      - text: 'Это сохранённые данные: настоящая копия уже на сервере'
        why: 'На сервер правка уйдёт только при сохранении. Сейчас на сервере старое описание.'
      - text: 'Это копия с сервера: её можно в любой момент перечитать'
        why: 'С сервера можно перечитать только сохранённое. Недописанное описание при перечитывании пропадёт.'
      - text: 'Это общие данные всех участников встречи, они видят их сразу'
        why: 'Участники увидят описание только после сохранения. Пока это работа одного человека.'
    explanation: |
      На экране лежат два вида данных. Сохранённое принадлежит серверу, а на устройстве — его копия, которая может
      устареть и которую можно перечитать. Черновик принадлежит устройству и человеку: сервер о нём не знает,
      и перечитать его неоткуда. Поэтому обновление сохранённого не должно молча затирать черновик.
    links:
      - https://doc.replicache.dev/concepts/how-it-works

  - id: sds-devices-006
    topic: Согласованность между клиентами
    subtopic: Другие устройства и пользователи
    level: middle
    question: |
      Семейный список покупок отправляет на сервер действия, а не весь список. У жены на телефоне висит ещё
      не подтверждённое сервером «добавить хлеб» — связь медленная. В этот момент приходит свежий список с сервера,
      где муж только что добавил молоко, а хлеба ещё нет. Что показать на её экране?
    options:
      - text: 'Свежий список, а поверх него — её неподтверждённый хлеб'
        correct: true
        why: 'Клиент берёт свежее состояние сервера и заново применяет поверх него свои неподтверждённые действия. Жена видит и молоко мужа, и свой хлеб, и ничего не мигает.'
      - text: 'Только свежий список, пока сервер не подтвердит хлеб'
        why: 'Хлеб на время пропадёт с экрана, и жена, решив, что он не добавился, добавит его второй раз.'
      - text: 'Свой список без изменений, пока сервер не подтвердит хлеб'
        why: 'Жена не увидит молоко, которое добавил муж, хотя данные о нём уже пришли.'
      - text: 'Свежий список и плашку «Ваши изменения отменены»'
        why: 'Хлеб не отменён: действие ещё в пути, и сервер его, скорее всего, примет.'
    explanation: |
      Когда свежие данные приходят раньше подтверждения своих действий, клиент перебазирует их: берёт состояние
      сервера и заново применяет поверх него неподтверждённые действия. Так делают библиотеки синхронизации вроде
      Replicache. Когда сервер подтвердит действие, его убирают из списка неподтверждённых — результат уже есть
      в свежем состоянии.
    links:
      - https://doc.replicache.dev/concepts/how-it-works

  - id: sds-devices-003
    topic: Согласованность между клиентами
    subtopic: Другие устройства и пользователи
    level: middle
    question: |
      В CRM менеджер десять минут пишет длинную заметку к карточке клиента. В это время коллега с другого устройства
      меняет в той же карточке телефон, и сервер присылает подсказку «карточка изменилась». Что должен сделать
      экран менеджера?
    options:
      - text: 'Тихо перечитать карточку и показать её свежую версию целиком'
        why: 'Перечитанная карточка затрёт недописанную заметку. Тихое обновление годится, только когда своих правок нет.'
      - text: 'Перечитать карточку, не трогая черновик, и показать, кто что изменил'
        correct: true
        why: 'Черновик — труд менеджера, его не трогают. Плашка «Телефон изменил Олег» объясняет, что произошло, а при сохранении заметки сервер сольёт поля.'
      - text: 'Запретить сохранение заметки, пока менеджер сам не перезагрузит страницу'
        why: 'После перезагрузки заметка пропадёт. Менеджер потеряет десять минут работы из-за чужой правки соседнего поля.'
      - text: 'Сразу сохранить черновик заметки, чтобы опередить коллегу'
        why: 'Сохранять недописанное без ведома человека нельзя, а опередить уже некого: коллега свою правку сохранил.'
    explanation: |
      Что делать с устаревшей копией, решают по цене потери. Без своих правок экран тихо обновляют. Если у человека
      черновик, в который вложен труд, его не трогают, а показывают, кто и что изменил, и дают решить. Если правки
      затрагивают разные поля, сервер сольёт их по полям при сохранении.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Conditional_requests

  - id: sds-devices-004
    topic: Согласованность между клиентами
    subtopic: Другие устройства и пользователи
    level: senior
    question: |
      В календаре участник видит приглашение на встречу в 15:00 и нажимает «Подтвердить». Вкладка открыта и видна
      с утра, а за минуту до нажатия организатор со своего телефона перенёс встречу на 17:00. Сервер умеет рассылать
      подсказки об изменениях, но подсказка может не дойти. Как не допустить, чтобы человек подтвердил время,
      которого уже нет?
    options:
      - text: 'Перечитывать приглашение каждый раз при возврате на вкладку'
        why: 'Человек никуда не уходил: вкладка видна с утра, и перезапрос при возврате не сработает.'
      - text: 'Полагаться на подсказку от сервера об изменении'
        why: 'Подсказка ускоряет обновление, но может не дойти, а условие требует не допустить ошибку.'
      - text: 'Отправлять подтверждение с версией приглашения, при отказе — новое время'
        correct: true
        why: 'Подтверждение — критичное действие. Сервер проверит, что человек видел актуальную версию, и откажет, если её перенесли. Человек увидит 17:00 и решит заново.'
      - text: 'Подтверждать «встречу» без указания времени, чтобы перенос ничему не мешал'
        why: 'Человек соглашался на 15:00. Подтвердить за него 17:00, которое он мог и не видеть, — именно то, чего нужно избежать.'
    explanation: |
      Сигнал от сервера и перезапрос при возврате обновляют копию заранее, но не гарантируют свежесть. Перед
      критичным действием — оплатой, подтверждением, отправкой — клиент сверяет с сервером то, что видел человек:
      отправляет версию, а сервер отказывает, если она устарела. Тогда действие никогда не совершается на основе
      старой копии.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Conditional_requests

  - id: sds-devices-005
    topic: Согласованность между клиентами
    subtopic: Другие устройства и пользователи
    level: senior
    multiple: true
    question: |
      В CRM сервер при изменении карточки рассылает всем открытым экранам с этой карточкой короткое сообщение
      «карточка 42 изменилась» без самих данных, а клиент в ответ перечитывает карточку обычным запросом. Какие
      утверждения об этой схеме верны?
    options:
      - text: 'Данные клиент получает обычным запросом, где сервер проверяет доступ'
        correct: true
        why: 'Подсказка ничего не раскрывает. Если доступ к карточке отобрали, перечитать её не получится.'
      - text: 'Подсказка дойдёт до всех экранов, поэтому проверку при возврате можно убрать'
        why: 'Подсказка может не дойти: соединение оборвалось, вкладка спала. Поэтому её дополняют перезапросом при возврате и проверкой версии.'
      - text: 'Проверка версии при сохранении всё равно нужна'
        correct: true
        why: 'Подсказка только ускоряет обновление. Правку на основе устаревшей копии ловит проверка версии на сервере.'
      - text: 'Надёжнее класть в подсказку всю карточку, чтобы не перепроверять её запросом'
        why: 'Это возможно, но тогда каждую рассылку нужно проверять на права каждого получателя, и надёжности это не добавляет: сообщение так же может потеряться.'
    explanation: |
      Подсказку «перечитай» без данных (в Replicache она называется poke) удобно рассылать: она маленькая и ничего
      не раскрывает, а данные клиент возьмёт обычным запросом со всеми проверками. Но подсказка лишь ускоряет
      обновление: она может потеряться, поэтому её сочетают с перезапросом при возврате и проверкой версии при
      сохранении.
    links:
      - https://doc.replicache.dev/concepts/how-it-works

  - id: sds-compound-001
    topic: Согласованность между клиентами
    subtopic: Составные изменения
    level: junior
    question: |
      В складском учёте оформление поставки списывает товар с одного склада и зачисляет на другой. Если зачисление
      не удалось, система выполняет отдельное действие «вернуть списанное на первый склад». Как называется такое
      действие и чем оно отличается от отката транзакции?
    options:
      - text: 'Компенсация: шаг уже применился, его последствия отменяет новое действие'
        correct: true
        why: 'Списание уже произошло, его могли увидеть и поменять поверх. Компенсация отменяет его последствия новым действием, а не делает вид, что его не было.'
      - text: 'Откат транзакции: база сама вернёт данные, как будто списания и не было'
        why: 'Откат транзакции работает, пока шаги внутри неё не применены окончательно. Здесь списание уже прошло, и возвращают его отдельным действием.'
      - text: 'Повтор: система заново выполняет списание, пока зачисление не пройдёт'
        why: 'Повтор пытается довести операцию до конца. Здесь же отменяют уже сделанный шаг.'
      - text: 'Оптимистичное обновление: интерфейс заранее показал результат и откатил его'
        why: 'Оптимистичное обновление — про экран, а не про данные на сервере. Списание на складе — настоящее изменение данных.'
    explanation: |
      Транзакция делает промежуточное состояние невидимым и при сбое откатывает всё сама. Компенсация работает после
      того, как шаг уже применился: она отдельным действием отменяет его последствия. Поэтому она не всегда возвращает
      исходное состояние, может затереть изменения, сделанные за это время, и сама может не пройти.
    links:
      - https://learn.microsoft.com/en-us/azure/architecture/patterns/compensating-transaction

  - id: sds-compound-002
    topic: Согласованность между клиентами
    subtopic: Составные изменения
    level: middle
    question: |
      В онлайн-банке перевод другу в евро с рублёвого счёта делает два запроса из браузера: сначала обменять рубли
      на евро, потом перевести евро. Иногда обмен проходит, а перевод — нет, и у человека на счёте остаются евро,
      которые ему не нужны. Счета и курсы — в одной базе банка. Что предпочтительнее?
    options:
      - text: 'Если перевод не прошёл, браузер сразу отправляет обратный обмен евро в рубли'
        why: 'Курс за это время изменится, и человек потеряет на двух обменах. А если вкладку закроют, обратный обмен не отправится вовсе.'
      - text: 'Одна команда «перевести с обменом» на сервер, оба шага — в одной транзакции'
        correct: true
        why: 'Данные в одной базе, поэтому сервер может выполнить обмен и перевод вместе или не выполнить ничего. Промежуточного состояния никто не увидит.'
      - text: 'Повторять оба запроса с новыми идентификаторами, пока перевод не пройдёт'
        why: 'Новый идентификатор при повторе обмена создаст второй обмен. Повторять можно только с тем же идентификатором операции.'
      - text: 'Перед переводом показывать подтверждение «Обмен выполнен, продолжить?»'
        why: 'Человек узнает о промежуточном шаге, но частичный успех останется: перевод всё так же может не пройти после обмена.'
    explanation: |
      Если шаги связаны, их выполняет сервер одной командой с идентификатором операции. Когда данные в одной базе,
      хватает транзакции: всё или ничего. Компенсация с клиента — самый слабый вариант: она работает после применения
      шага, не возвращает исходное состояние (курс уже другой) и не выполнится, если вкладку закрыли.
    links:
      - https://learn.microsoft.com/en-us/azure/architecture/patterns/saga

  - id: sds-compound-003
    topic: Согласованность между клиентами
    subtopic: Составные изменения
    level: middle
    question: |
      В трекере задач человек без сети создаёт проект «Запуск» (у него пока временный id) и переносит в него пять
      задач. Изменения копятся на устройстве. После возврата сети клиент отправляет всё накопленное параллельно,
      и сервер отвечает на переносы «проект не найден»: они пришли раньше создания проекта. Как исправить?
    options:
      - text: 'Повторять переносы, пока проект не появится на сервере'
        why: 'Переносы в итоге пройдут, но порядок зависит от случая, а лишние запросы и отказы останутся. Зависимость нужно соблюдать, а не обходить повторами.'
      - text: 'Отправлять переносы только после подтверждения создания проекта'
        correct: true
        why: 'Перенос опирается на проект, поэтому зависимые изменения идут друг за другом внутри одной цепочки, а в переносы подставляют настоящий id проекта из ответа сервера (курс 2, «Оптимистичные обновления»). Так переносы никогда не опередят создание.'
      - text: 'Отправлять всё параллельно, но создание проекта ставить первым в пачке'
        why: 'Первым ушёл — не значит первым обработан: ответы и обработка на сервере могут идти в другом порядке.'
      - text: 'Сначала отправлять переносы, а проект создавать последним'
        why: 'Тогда переносам точно не во что переносить. Порядок обратный нужному.'
    explanation: |
      Причинность — зависимое изменение не должно примениться раньше того, от которого зависит. Её нарушают
      параллельная отправка, ответы не по порядку и повторы после переподключения. Помогает отправка по порядку
      внутри цепочки, явное указание зависимости, на которое сервер отвечает отказом, а не применяет изменение
      в никуда, — или одна команда «создать проект и перенести задачи».
    links:
      - https://learn.microsoft.com/en-us/azure/architecture/patterns/saga

  - id: sds-compound-004
    topic: Согласованность между клиентами
    subtopic: Составные изменения
    level: senior
    question: |
      В сервисе складского учёта оформление отгрузки неизбежно идёт с клиента в три шага: зарезервировать товар
      на своём сервере (резерв можно снять), загрузить файл накладной в хранилище (файл можно удалить) и списать
      оплату с карты клиента через платёжный сервис (вернуть деньги можно только возвратом через несколько дней).
      В каком порядке выполнять шаги?
    options:
      - text: 'Сначала списать оплату, чтобы не резервировать товар зря'
        why: 'Если потом не пройдёт резерв или загрузка, у клиента будут списаны деньги, а вернуть их можно лишь возвратом через несколько дней.'
      - text: 'Все три шага параллельно, чтобы оформление отгрузки шло быстрее'
        why: 'При сбое любого шага остальные, включая списание, уже могли пройти. Порядок нужен, чтобы необратимое шло последним.'
      - text: 'Резерв, затем накладная, а списание оплаты — последним шагом'
        correct: true
        why: 'Необратимый шаг выполняется только после того, как обратимые прошли. Если сорвётся резерв или загрузка, их легко отменить, а деньги не тронуты.'
      - text: 'Загрузка накладной, затем оплата, а резерв товара последним'
        why: 'Если товара не окажется в наличии, оплата уже списана. Необратимый шаг стоит не в конце.'
    explanation: |
      Если шаги приходится выполнять с клиента, необратимое делают последним — руководство Microsoft называет это
      точкой невозврата. До неё все шаги обратимы, и частичный успех легко компенсировать. Ещё нужны план на устройстве,
      чтобы продолжить после перезагрузки, и идемпотентные шаги со своими идентификаторами операций.
    links:
      - https://learn.microsoft.com/en-us/azure/architecture/patterns/compensating-transaction

  - id: sds-compound-005
    topic: Согласованность между клиентами
    subtopic: Составные изменения
    level: senior
    multiple: true
    question: |
      В складском учёте операция «перемещение партии» идёт сагой: списать со склада А, зачислить на склад Б, обновить
      документы. Если шаг не удался, выполняются компенсации сделанных шагов. Команда пишет правила для компенсаций.
      Какие правила верны?
    options:
      - text: 'Компенсация списания возвращает списанное количество, а не записывает остаток «как было»'
        correct: true
        why: 'Пока шла сага, на склад А могли прийти другие поставки. Запись старого остатка затёрла бы их, а возврат своего количества — нет.'
      - text: 'Шаги компенсации делают идемпотентными, чтобы повтор не вернул товар дважды'
        correct: true
        why: 'Компенсация сама может не пройти и повториться. Повтор не должен вернуть то же количество второй раз.'
      - text: 'Прогресс саги записывают надёжно, чтобы продолжить с места сбоя'
        correct: true
        why: 'Если сервер упадёт посреди компенсации, без записи о прогрессе неизвестно, что уже отменено.'
      - text: 'Компенсация гарантирует, что никто не увидел промежуточного состояния'
        why: 'Нет: шаг уже применился, и его могли увидеть. Скрывает промежуточное состояние только транзакция.'
      - text: 'Компенсацию надёжнее запускать из браузера сразу после ошибки шага'
        why: 'Браузер могут закрыть, сеть может пропасть. Компенсации надёжнее выполнять на сервере, где хранится прогресс саги.'
    explanation: |
      Руководство Microsoft о компенсирующей транзакции перечисляет её свойства: она отменяет последствия своего шага,
      а не возвращает исходное состояние, потому что данные могли измениться; она сама может не пройти, поэтому её
      шаги идемпотентны; прогресс записывают, чтобы продолжить с места сбоя. Промежуточное состояние при этом видно
      другим — это цена саги по сравнению с транзакцией.
    links:
      - https://learn.microsoft.com/en-us/azure/architecture/patterns/compensating-transaction

  - id: sds-collab-reqs-001
    topic: Совместная работа
    subtopic: Требования к совместной работе
    level: junior
    question: |
      В онлайн-таблице каждый сотрудник заполняет свой лист, но вверху видны аватары тех, кто сейчас открыл файл,
      а рядом с листом — кто на нём находится. Одну и ту же ячейку двое не правят никогда. Какой это уровень
      совместной работы?
    options:
      - text: 'Только совместное присутствие'
        correct: true
        why: 'Люди видят, что другие здесь, но данные каждый меняет в своей части. Конфликтов почти нет, и сложная модель слияния не нужна.'
      - text: 'Одновременное редактирование'
        why: 'Одновременное редактирование — когда несколько человек меняют одни и те же данные в одно время. Здесь каждый правит свой лист.'
      - text: 'Строгая согласованность данных'
        why: 'Строгая согласованность нужна, когда действие должно основываться на текущем состоянии, как при оплате. Здесь видно только, кто где.'
      - text: 'Совместный текст с CRDT'
        why: 'CRDT нужен, когда несколько человек пишут в одном тексте. Здесь никто не правит чужое.'
    explanation: |
      Под совместной работой скрываются три требования: присутствие (видеть других), одновременное редактирование
      (менять одно и то же) и строгая согласованность (действие применяется только к последнему подтверждённому
      состоянию). У каждого своя цена. Если люди
      только видят друг друга, а правят свои части, достаточно присутствия.
    links:
      - https://www.figma.com/blog/how-figmas-multiplayer-technology-works/

  - id: sds-collab-reqs-002
    topic: Совместная работа
    subtopic: Требования к совместной работе
    level: middle
    question: |
      В совместном плейлисте друзья добавляют и удаляют треки. Сейчас приложение при любом изменении сохраняет весь
      плейлист целиком, и если двое добавили трек почти одновременно, один трек пропадает. Какую единицу конфликта
      выбрать?
    options:
      - text: 'Весь плейлист, но с проверкой версии при сохранении'
        why: 'Трек перестанет пропадать молча, но любые две правки будут конфликтовать, и второй человек получит отказ на ровном месте.'
      - text: 'Отдельную запись трека в плейлисте'
        correct: true
        why: 'Добавление и удаление разных треков затрагивают разные записи и складываются сами. Конфликт останется, только если двое трогают один трек.'
      - text: 'Каждую букву в названии трека'
        why: 'Названия треков никто не правит вместе. Такая мелкая единица потребует сложного механизма ради проблемы, которой нет.'
      - text: 'Плейлист целиком, но сохранять реже, раз в минуту'
        why: 'Сохранять реже — значит чаще терять: за минуту одновременных правок станет больше.'
    explanation: |
      Единица конфликта — наименьший кусок данных, который сводят как целое. Если она слишком крупная, любые две правки
      конфликтуют; если слишком мелкая, нужен сложный механизм без пользы. Её выбирают как можно крупнее, но так,
      чтобы обычная работа людей — здесь добавление разных треков — не превращалась в конфликт.
    links:
      - https://www.figma.com/blog/how-figmas-multiplayer-technology-works/

  - id: sds-collab-reqs-003
    topic: Совместная работа
    subtopic: Требования к совместной работе
    level: middle
    question: |
      Отдел готовит в онлайн-таблице бюджет корпоратива: несколько человек одновременно правят строки расходов,
      пишут комментарии и видят, кто где. Когда бюджет готов, руководитель нажимает «Отправить на утверждение» —
      директор утверждает ровно те суммы, которые получил. Какому действию нужна строгая согласованность?
    options:
      - text: 'Правке суммы в строке расходов'
        why: 'Строки можно править одновременно: если копии на секунду разойдутся, правила слияния их сведут. Строгая согласованность сделала бы каждую правку медленной.'
      - text: 'Комментарию к строке расходов'
        why: 'Комментарии не мешают друг другу и могут появиться у других на секунду позже.'
      - text: 'Отправке бюджета на утверждение'
        correct: true
        why: 'Директор должен утвердить ровно то, что видел руководитель. Отправка идёт с версией таблицы, и если её изменили, сервер откажет.'
      - text: 'Показу, кто из коллег сейчас в таблице'
        why: 'Присутствие — приблизительная информация, которую можно терять и обновлять с задержкой.'
    explanation: |
      В одном продукте разным действиям нужны разные уровни совместности. Большинство правок могут на секунды
      расходиться, а строгая согласованность нужна там, где ошибка стоит денег или обещаний: оплата, бронирование,
      отправка на утверждение. Её цена — действие ждёт сервер и основано только на текущем состоянии.
    links:
      - https://www.figma.com/blog/how-figmas-multiplayer-technology-works/

  - id: sds-collab-reqs-004
    topic: Совместная работа
    subtopic: Требования к совместной работе
    level: senior
    question: |
      В совместной доске для планёрок участники двигают стикеры, меняют их цвет и пишут на них короткие подписи в одну
      строку. Подписи почти никогда не правят вдвоём. Продакт-менеджер просит «как в Google Docs, чтобы ничего
      не терялось». Что предпочтительнее?
    options:
      - text: 'CRDT для всего: и для позиций, и для цвета, и для каждой буквы каждой подписи'
        why: 'Посимвольное слияние подписей решает проблему, которой почти нет, а платить за него придётся сложной библиотекой и сервером.'
      - text: 'Единица — свойство стикера; одно свойство вдвоём — побеждает последнее'
        correct: true
        why: 'Разные свойства и разные стикеры складываются сами, а одно свойство вдвоём правят редко. Так устроена Figma: она отказалась от OT как излишне сложного для своих задач.'
      - text: 'Блокировать всю доску, пока кто-то двигает стикер'
        why: 'Двигать стикеры одновременно — обычная работа на планёрке. Блокировка всей доски её остановит.'
      - text: 'Сохранять всю доску целиком при каждом изменении'
        why: 'Единица конфликта — вся доска: два перемещения разных стикеров будут затирать друг друга.'
    explanation: |
      До выбора техники отвечают, что люди правят одновременно. На доске это разные стикеры и разные свойства, а текст
      подписей вдвоём почти не пишут. Значит, единица конфликта — свойство объекта, и «последняя запись побеждает»
      для одного свойства не теряет ничего важного. Посимвольное слияние нужно, когда несколько человек пишут в одном
      тексте.
    links:
      - https://www.figma.com/blog/how-figmas-multiplayer-technology-works/

  - id: sds-collab-reqs-005
    topic: Совместная работа
    subtopic: Требования к совместной работе
    level: senior
    multiple: true
    question: |
      Команда проектирует общий график дежурств в онлайн-таблице. Какие вопросы нужно задать о продукте до выбора
      модели слияния?
    options:
      - text: 'Как быстро другие участники должны видеть изменения'
        correct: true
        why: 'От этого зависит, хватит ли перечитывания раз в минуту или нужен постоянный канал.'
      - text: 'Нужно ли править график без сети'
        correct: true
        why: 'Если да, копии расходятся часами, и слияние должно это выдержать. Если нет, многое упрощается.'
      - text: 'Какие действия требуют строгой согласованности'
        correct: true
        why: 'Например, обмен дежурствами двух людей должен основываться на текущем графике. Остальное может на секунды расходиться.'
      - text: 'Какая библиотека CRDT быстрее на тестах производительности'
        why: 'Это вопрос о технике, а не о продукте. Сначала нужно понять, нужен ли CRDT вообще.'
      - text: 'Какой транспорт выбрать — WebSocket или SSE'
        why: 'Это тоже решение о технике: оно следует из требований к скорости и направлению данных, а не задаётся до них.'
      - text: 'В каком формате показывать даты в ячейках графика'
        why: 'Это вопрос отображения: на то, как сводить одновременные правки, он не влияет.'
    explanation: |
      Техника следует из требований продукта: как быстро видны изменения, нужен ли офлайн, какое расхождение допустимо,
      где нужна строгая согласованность и кто что может менять. Часто ответы показывают, что сложная модель слияния
      не нужна, — так Figma отказалась от OT.
    links:
      - https://www.figma.com/blog/how-figmas-multiplayer-technology-works/

  - id: sds-merge-001
    topic: Совместная работа
    subtopic: Модели слияния
    level: junior
    question: |
      В совместном графическом редакторе для каких данных правило «последняя запись побеждает» подходит лучше всего,
      если единица конфликта — свойство объекта?
    options:
      - text: 'Для цвета заливки выбранной фигуры'
        correct: true
        why: 'Цвет — неделимое значение: смешать два цвета бессмысленно. Если двое одновременно поменяли цвет, остаётся последний, и это обычно приемлемо.'
      - text: 'Для длинного текста заметки к макету'
        why: 'Двое могут править разные слова одного текста, а LWW сохранит одну версию целиком и потеряет правки другого.'
      - text: 'Для истории версий макета'
        why: 'История копится, а не заменяется: каждая версия должна сохраниться. LWW оставил бы одну.'
      - text: 'Для комментариев к фигуре'
        why: 'Комментарии добавляют независимо. LWW для всего списка выбросил бы комментарий одного из двоих.'
    explanation: |
      «Последняя запись побеждает» хорошо работает для неделимых значений — цвета, размера, позиции, статуса — если
      единица конфликта мелкая, например свойство объекта. Так устроена Figma. Для текста, списков и истории LWW теряет
      данные: их правят частями, а LWW сохраняет одно значение целиком.
    links:
      - https://www.figma.com/blog/how-figmas-multiplayer-technology-works/

  - id: sds-merge-002
    topic: Совместная работа
    subtopic: Модели слияния
    level: middle
    question: |
      В CRM карточку сделки можно править только одному человеку за раз: открывший редактор получает блокировку.
      Менеджер открыл сделку и ушёл домой, закрыв ноутбук. Утром коллеги не могут поправить сделку: «Сейчас
      редактирует Иван». Как устроить блокировку?
    options:
      - text: 'Снимать блокировку только вручную, через администратора'
        why: 'Администратор станет узким местом, и каждый брошенный редактор будет стоить заявки и ожидания.'
      - text: 'Выдавать блокировку на пару минут и продлевать, пока человек работает'
        correct: true
        why: 'Пока Иван печатал, клиент продлевал блокировку. Закрыл ноутбук — продления прекратились, и через пару минут блокировка истекла сама.'
      - text: 'Оставить вечную блокировку, но показать время её взятия'
        why: 'Коллеги узнают, что блокировка вчерашняя, но править всё равно не смогут.'
      - text: 'Убрать блокировки и сохранять сделку целиком: последняя запись побеждает'
        why: 'Брошенных блокировок не станет, но одновременные правки разных полей будут затирать друг друга.'
    explanation: |
      Главная цена блокировки — брошенные блокировки. Поэтому её выдают на время (аренда, lease) и продлевают, пока
      человек работает. Перестал продлевать — блокировка истекает сама. Вместе с ней клиент получает номер блокировки
      и отправляет его при сохранении, чтобы сервер отклонил правку по уже истёкшей блокировке.
    links:
      - https://www.mediawiki.org/wiki/Help:Edit_conflict

  - id: sds-merge-003
    topic: Совместная работа
    subtopic: Модели слияния
    level: middle
    question: |
      В онлайн-редакторе документов сохранение идёт с версией. Двое часто правят один документ в одно время, но почти
      всегда разные абзацы, и каждый раз второй получает «Документ изменился, перечитайте». Правка одного абзаца
      вдвоём — редкость. Команда не хочет подключать сложные библиотеки. Что предпочтительнее?
    options:
      - text: 'При устаревшей версии автоматически сливать разные абзацы'
        correct: true
        why: 'Правки в разных частях текста не мешают друг другу и сливаются сами. Конфликт останется только при правке одного абзаца, а это редкость.'
      - text: 'Сохранять документ целиком: последняя запись побеждает'
        why: 'Отказов не станет, но правка второго человека будет молча затирать правку первого.'
      - text: 'Запирать весь документ, пока один человек его правит'
        why: 'Двое правят одновременно часто, и блокировка заставит одного всё время ждать.'
      - text: 'Перейти на посимвольное слияние всего текста с помощью CRDT'
        why: 'Сработает, но одновременная правка одного абзаца — редкость, а команда не хочет сложных библиотек. Слияния по абзацам здесь хватает.'
    explanation: |
      Сохранение с версией — основа, но отказ на каждую одновременную правку раздражает. Если люди правят разные части
      текста, правки можно слить автоматически, как это делает MediaWiki и git, а конфликт показывать только при правке
      одного места — с разницей, чтобы человек не потерял свой текст.
    links:
      - https://www.mediawiki.org/wiki/Help:Edit_conflict

  - id: sds-merge-004
    topic: Совместная работа
    subtopic: Модели слияния
    level: senior
    question: |
      В CRM блокировку на правку сделки выдают на 2 минуты и продлевают, пока человек печатает. Менеджер открыл
      редактор, отошёл на десять минут, блокировка истекла, её взяла коллега, поправила сумму и сохранила. Менеджер
      вернулся и нажал «Сохранить» — и сумма коллеги пропала. Чего не хватает в схеме?
    options:
      - text: 'Блокировку нужно выдавать на 10 минут, а не на 2'
        why: 'Менеджер мог отойти и на 15 минут. Срок блокировки не решает того, что сохранение проходит без неё.'
      - text: 'При сохранении сверять, что блокировка всё ещё у этого клиента'
        correct: true
        why: 'Клиент отправляет номер своей блокировки, и сервер отклоняет сохранение по истёкшей. Менеджер увидит, что сделку уже изменили, и сумма коллеги не пропадёт.'
      - text: 'Запретить истечение блокировки, пока вкладка с редактором открыта'
        why: 'Тогда брошенная вкладка снова будет держать сделку весь день.'
      - text: 'Продлевать блокировку, даже когда человек отошёл и не печатает'
        why: 'Отошедший человек держал бы блокировку бесконечно, и коллеги не смогли бы работать.'
    explanation: |
      Блокировка с арендой может истечь, пока человек отошёл. Если сервер не проверяет её при сохранении, правка
      по истёкшей блокировке пройдёт поверх чужой. Поэтому вместе с блокировкой клиент получает её номер и отправляет
      его при сохранении, а сервер принимает правку, только если эта блокировка ещё действует. На практике её дополняют
      проверкой версии.
    links:
      - https://www.mediawiki.org/wiki/Help:Edit_conflict

  - id: sds-merge-005
    topic: Совместная работа
    subtopic: Модели слияния
    level: senior
    multiple: true
    question: |
      Графический редактор устроен как Figma: сервер хранит последнее значение каждого свойства каждого объекта,
      а клиенты присылают изменения свойств. Какие утверждения о таком редакторе верны?
    options:
      - text: 'Если один меняет цвет фигуры, а другой — её размер, сохранятся оба изменения'
        correct: true
        why: 'Это разные свойства, а единица конфликта — одно свойство. Изменения разных свойств не конфликтуют.'
      - text: 'Если двое одновременно меняют цвет одной фигуры, останется значение, полученное сервером последним'
        correct: true
        why: 'Для одного свойства действует «последняя запись побеждает» по порядку получения на сервере.'
      - text: 'Если двое одновременно печатают в одной текстовой надписи, их правки сольются посимвольно'
        why: 'Значение надписи заменяется целиком. Figma прямо пишет: результат будет «AB» или «BC», но не «ABC».'
      - text: 'Чтобы определить последнюю запись, сервер сравнивает время на часах устройств'
        why: 'Последнее — то, что последним получил сервер. Часы устройств расходятся и для этого не годятся.'
    explanation: |
      При единице конфликта «свойство объекта» правки разных свойств и разных объектов складываются, а для одного
      свойства побеждает последнее значение, полученное сервером. Это хорошо работает для неделимых значений, но текст
      в такой модели — тоже одно значение, и одновременные правки одной надписи не сливаются.
    links:
      - https://www.figma.com/blog/how-figmas-multiplayer-technology-works/

  - id: sds-crdt-001
    topic: Совместная работа
    subtopic: Модели слияния
    level: junior
    question: |
      В редакторе кода для совместных собеседований двое правят одну строку одновременно. Редактор устроен на преобразовании операций
      (OT). Что он делает с чужой правкой, прежде чем применить её?
    options:
      - text: 'Сдвигает её позицию с учётом правок, которые уже применены'
        correct: true
        why: 'Если перед удалением в позиции 4 кто-то вставил 8 символов в начало, удаление сдвигают в позицию 12. Так правка попадает туда, куда её задумали.'
      - text: 'Заменяет ею всю строку: побеждает последняя запись'
        why: 'Это LWW, и он потерял бы правку одного из двоих. OT как раз сохраняет обе.'
      - text: 'Откладывает её, пока строку не освободит другой человек'
        why: 'Это блокировка. OT позволяет править одновременно.'
      - text: 'Ищет символ по его уникальному идентификатору, а не по позиции'
        why: 'Так работают CRDT для текста. OT оперирует позициями и преобразует их.'
    explanation: |
      Правки текста по позициям мешают друг другу: вставка сдвигает позиции. OT решает это преобразованием: чужую
      операцию пересчитывают с учётом уже применённых, и она попадает туда, куда её задумал автор. Обычно порядок
      операций задаёт центральный сервер, как в Google Docs.
    links:
      - https://arxiv.org/abs/2305.00583

  - id: sds-crdt-002
    topic: Совместная работа
    subtopic: Модели слияния
    level: middle
    question: |
      Приложение заметок работает прежде всего без сети: человек правит одну заметку на ноутбуке в самолёте
      и на телефоне в метро, а устройства синхронизируются, когда видят друг друга в домашней сети, даже без связи
      с сервером. Одновременные правки одного абзаца на двух устройствах бывают часто. Какой механизм подходит?
    options:
      - text: 'OT с центральным сервером, который упорядочивает правки'
        why: 'Устройства должны сводить правки и без сервера, а OT обычно опирается на сервер-арбитр. Кроме того, копии расходятся надолго, а OT медленно сводит сильно разошедшиеся копии.'
      - text: 'Готовый текстовый CRDT на устройствах, например Automerge'
        correct: true
        why: 'Правки CRDT сходятся в любом порядке без арбитра, поэтому устройства могут обмениваться ими напрямую и после долгого офлайна.'
      - text: 'Сохранение заметки целиком, где побеждает последняя запись'
        why: 'Правки одного абзаца на двух устройствах бывают часто, и LWW будет терять одну из них целиком.'
      - text: 'Блокировка заметки на устройстве, которое начало правку'
        why: 'Без связи устройства не могут договориться о блокировке, а без сервера её некому выдать.'
    explanation: |
      CRDT устраивает данные так, что правки сходятся при любом порядке доставки: у каждого символа свой идентификатор,
      и правка ссылается на него, а не на позицию. Поэтому не нужен центральный арбитр и не страшен долгий офлайн.
      Цена — служебные данные и надгробия, а писать CRDT самим не стоит: берут готовую библиотеку.
    links:
      - https://github.com/yjs/yjs

  - id: sds-crdt-003
    topic: Совместная работа
    subtopic: Модели слияния
    level: middle
    question: |
      В онлайн-редакторе документов двое одновременно начали печатать в одном и том же месте: одна «Привет», другой
      «Пока». После слияния в документе получилось «ППроиквеат». Как называется эта проблема и какой алгоритм
      придуман, чтобы её свести к минимуму?
    options:
      - text: 'Расхождение копий; лечится переходом на «последняя запись побеждает»'
        why: 'Копии здесь сошлись — у обоих одинаковое «ППроиквеат». А LWW потерял бы одно из слов целиком.'
      - text: 'Перемешивание одновременных вставок; против него придуман Fugue'
        correct: true
        why: 'Одновременно вставленный текст перемешался по буквам. Авторы Fugue показали, что этим страдают почти все алгоритмы, и для FugueMax доказали минимальное перемешивание.'
      - text: 'Утечка надгробий; лечится удалением старых удалённых символов'
        why: 'Надгробия влияют на память, а не на порядок вставленных букв. Здесь ничего не удаляли.'
      - text: 'Конфликт версий; лечится проверкой версии и ответом 409'
        why: 'Посимвольное слияние не отказывает в правках, а сводит их. Проблема в том, как оно упорядочило буквы.'
    explanation: |
      Перемешивание (interleaving) — когда одновременно вставленные в одно место куски текста смешиваются по буквам.
      Им в той или иной форме страдают почти все известные алгоритмы, и CRDT, и OT; особенно склонны Logoot и LSEQ.
      Fugue (Вайднер и Клеппман, 2023) придуман против этой проблемы: для его варианта FugueMax доказано минимальное
      перемешивание.
    links:
      - https://arxiv.org/abs/2305.00583

  - id: sds-crdt-004
    topic: Совместная работа
    subtopic: Модели слияния
    level: senior
    question: |
      Стартап делает приложение общих заметок: правят их и по очереди, и иногда вместе. Тимлид предлагает: «Напишем свой CRDT
      для текста — так мы не зависим от библиотек, а раз CRDT сходится сам, сервер нам не нужен, устройства будут
      обмениваться правками напрямую». Заметки приватные, их видят только приглашённые. Участники редко бывают в сети
      одновременно, а заметку каждый должен видеть свежей сразу после открытия. Что предпочтительнее?
    options:
      - text: 'Свой CRDT и прямой обмен между устройствами, как и предлагает тимлид'
        why: 'Свой CRDT для текста — исследовательская задача: даже опубликованные алгоритмы годами находили с ошибками. А проверять права приглашённых без сервера некому.'
      - text: 'Готовая библиотека CRDT, а права, хранение и пересылка — на сервере'
        correct: true
        why: 'Слияние текста берёт на себя проверенная библиотека вроде Yjs или Automerge. CRDT не отменяет сервер: он проверяет, кто приглашён, хранит заметки и пересылает правки.'
      - text: 'Готовая библиотека CRDT и прямой обмен правками между устройствами'
        why: 'Слияние будет надёжным, но участники редко в сети одновременно, и правкам между ними некуда деться: нужен сервер, который их хранит, пересылает и проверяет права.'
      - text: 'Свой OT с центральным сервером вместо любого CRDT'
        why: 'Сервер появится, но писать свой OT не проще, чем свой CRDT: преобразования тоже полны тонких ошибок.'
    explanation: |
      Если продукту нужно посимвольное слияние, берут готовую библиотеку — Yjs, Automerge или серверный редактор
      с OT: свой алгоритм — месяцы работы и ошибки, которые находят годами. И CRDT не отменяет сервер: проверка прав,
      хранение и пересылка правок остаются на нём, меняется только то, что сервер не обязан быть арбитром слияния.
    links:
      - https://github.com/yjs/yjs

  - id: sds-crdt-005
    topic: Совместная работа
    subtopic: Модели слияния
    level: senior
    multiple: true
    question: |
      Команда совместной доски обсуждает CRDT. На доске есть счётчик голосов за каждую идею, цвет стикера и текст
      стикеров. Какие утверждения верны?
    options:
      - text: '«Последняя запись побеждает» для цвета стикера — это тоже простой CRDT, LWW-регистр'
        correct: true
        why: 'Значение с логической меткой, побеждает бо́льшая метка, и копии сходятся в любом порядке. Это один из простейших CRDT.'
      - text: 'CRDT состояния терпит дубли и перестановки при доставке'
        correct: true
        why: 'Копии обмениваются состоянием, а функция слияния устроена так, что порядок и повторы не важны.'
      - text: 'CRDT операций терпит потерю операций при доставке'
        why: 'Наоборот: CRDT операций требует, чтобы каждая операция дошла и применилась один раз и в правильном порядке относительно тех, от которых зависит.'
      - text: 'Голоса надёжнее хранить LWW-регистром с итоговым числом'
        why: 'Если двое проголосуют одновременно, LWW оставит одно из двух чисел, и голос пропадёт. Для этого есть счётчик-CRDT, который складывает прибавления каждой копии.'
      - text: 'Текстовый CRDT обходится без служебных данных'
        why: 'Идентификаторы символов и надгробия — главная цена CRDT для текста.'
    explanation: |
      CRDT бывают состояния (пересылают состояние, терпят любую доставку) и операций (пересылают операции, требуют
      надёжной доставки). Простые CRDT — счётчик, LWW-регистр, множество — подходят для голосов, свойств и тегов.
      Текстовые CRDT сложнее и платят за сходимость служебными данными.
    links:
      - https://arxiv.org/abs/2305.00583

  - id: sds-collab-recovery-001
    topic: Совместная работа
    subtopic: Восстановление совместной сессии
    level: junior
    question: |
      На совместной доске уже работают шесть человек, на ней 200 стикеров. Седьмой участник открывает ссылку. Что ему
      нужно получить, чтобы видеть доску правильно и дальше?
    options:
      - text: 'Поток новых правок с момента подключения, без истории доски'
        why: 'Он увидит изменения, но не увидит 200 стикеров, которые создали до него.'
      - text: 'Снимок доски с позицией и поток правок после этой позиции'
        correct: true
        why: 'Снимок даёт всё, что сделано до него, а поток с позиции снимка — всё, что сделают дальше, без пропусков между ними.'
      - text: 'Снимок доски, а дальше перечитывать его раз в минуту'
        why: 'Правки других будут видны с опозданием до минуты, а между перечитываниями копия устареет.'
      - text: 'Копию доски у кого-то из участников по прямой связи'
        why: 'Копия участника может быть неполной или устаревшей, а проверять права и отдавать данные должен сервер.'
    explanation: |
      Новый участник получает снимок с позицией и подписку на изменения с этой позиции — как в курсе «Реальное время
      и большие списки». Библиотеки совместной работы делают то же через обмен «что у меня есть — чего не хватает»:
      в Yjs клиент отправляет вектор состояния и получает недостающие обновления.
    links:
      - https://github.com/yjs/y-protocols/blob/master/PROTOCOL.md

  - id: sds-collab-recovery-002
    topic: Совместная работа
    subtopic: Восстановление совместной сессии
    level: middle
    question: |
      В трекере задач человек в поезде без сети перенёс задачу в колонку «Готово» — экран сразу это показал. Пока
      он ехал, администратор удалил задачу. Связь вернулась, клиент отправил перенос, сервер ответил «задача удалена».
      Что должен сделать клиент?
    options:
      - text: 'Тихо убрать задачу с экрана: раз её удалили, переносить нечего'
        why: 'Человек уверен, что задача перенесена, и не узнает, что его правка не прошла и почему.'
      - text: 'Повторять перенос, пока сервер его не примет'
        why: 'Задача удалена, и сервер не примет перенос никогда. Повторы ничего не изменят.'
      - text: 'Показать, что перенос не прошёл и почему, и дать выход'
        correct: true
        why: 'Правку, которую больше нельзя применить, не теряют молча. Человек видит причину и может, например, восстановить задачу или попросить администратора.'
      - text: 'Восстановить задачу на сервере и применить перенос'
        why: 'Клиент не может отменять решение администратора без спроса. Это и есть правка поверх чужого изменения.'
    explanation: |
      После обрыва копии разошлись, и часть накопленных правок может оказаться неприменимой: объект удалён, заказ
      закрыт, права отобраны. Сервер отклоняет такую правку с причиной, а клиент показывает её человеку и даёт выход —
      скопировать, перенести, создать заново. Молчаливая потеря хуже отказа.
    links:
      - https://doc.replicache.dev/concepts/how-it-works

  - id: sds-collab-recovery-003
    topic: Совместная работа
    subtopic: Восстановление совместной сессии
    level: middle
    question: |
      В онлайн-редакторе документов права проверяются, когда участник подключается к документу. Владелец перевёл
      сотрудника в «только чтение», а у того документ открыт уже час, и он продолжает вносить правки, которые видят
      все. Что исправить?
    options:
      - text: 'Проверять права на сервере при каждой правке, сообщая о смене'
        correct: true
        why: 'Совместная сессия длинная, и права в ней меняются. Сервер отклонит правку без права, а клиент переведёт редактор в «только чтение» и объяснит почему.'
      - text: 'Скрывать кнопки правки в интерфейсе у тех, кто может лишь читать'
        why: 'Клиент открыт уже час и о смене прав не знает. А проверка только в интерфейсе ничего не защищает: правку можно отправить и без кнопки.'
      - text: 'Переподключать всех участников документа раз в час'
        why: 'Час правок без права всё равно пройдёт. Права должны проверяться при каждой правке, а не по расписанию.'
      - text: 'Попросить владельца менять права только когда сотрудник не в документе'
        why: 'Владелец не может знать, кто сейчас в документе, а правило, которое держится на дисциплине людей, нарушится.'
    explanation: |
      Совместная сессия живёт часами, и права в ней меняются. Сервер проверяет права на каждую правку, а не только при
      подключении, — как соединение в курсе «Реальное время и большие списки» не должно жить дольше права на него.
      Клиент, узнав о смене прав, перестаёт принимать правки, объясняет причину и даёт забрать несохранённую работу.
    links:
      - https://github.com/yjs/y-protocols/blob/master/PROTOCOL.md

  - id: sds-collab-recovery-004
    topic: Совместная работа
    subtopic: Восстановление совместной сессии
    level: senior
    question: |
      Совместная доска устроена с сервером-арбитром, как у Replicache: клиент показывает свои действия сразу и хранит
      неподтверждённые. Участник 10 минут работал без сети: создал пять стикеров и передвинул три чужих. За это время
      другие тоже меняли доску. Связь вернулась. Как свести экран клиента?
    options:
      - text: 'Выбросить свои неподтверждённые действия и показать свежее состояние сервера'
        why: 'Десять минут работы участника пропадут без следа.'
      - text: 'Отправить серверу свою копию доски целиком, чтобы он её сохранил'
        why: 'Копия участника десятиминутной давности затрёт всё, что за это время сделали другие.'
      - text: 'Взять свежее состояние сервера и заново применить поверх него свои действия'
        correct: true
        why: 'Человек видит и чужие изменения, и свои ещё не подтверждённые. Действия уходят на сервер с идентификаторами, а неприменимые сервер отклонит с причиной.'
      - text: 'Спросить человека о каждом из восьми действий, применять ли его'
        why: 'Большинство действий применяются без конфликта. Вопрос о каждом утомит и не нужен: спрашивать стоит только об отклонённых.'
    explanation: |
      С сервером-арбитром расхождение сводят так: клиент берёт свежее состояние сервера и заново применяет поверх
      него свои неподтверждённые действия — так делает Replicache. Действия уходят на сервер с идентификаторами
      операций, а те, что больше нельзя применить, сервер отклоняет, и клиент показывает их человеку.
    links:
      - https://doc.replicache.dev/concepts/how-it-works

