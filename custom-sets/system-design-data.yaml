    body: |
      ## Какую проблему решаем

      В кабинете ресторана меню правят два менеджера — Ольга и Борис. В 10:00 оба открывают карточку блюда «Борщ»:
      цена 350 ₽, описание «Со сметаной». Ольга поднимает цену до 390 ₽ и нажимает «Сохранить». Через минуту Борис,
      у которого карточка открыта с 10:00, дописывает в описание «и пампушками» и тоже сохраняет.

      Форма Бориса отправляет на сервер карточку целиком — так устроены многие формы: что на экране, то и уходит.
      На экране у Бориса до сих пор цена 350 ₽, ведь он загрузил карточку раньше, чем Ольга её поменяла. Сервер
      записывает присланное, и цена возвращается к 350 ₽. Правка Ольги пропала.

      Хуже всего то, что никто ничего не заметил. Ольга видела «Сохранено», Борис видел «Сохранено». Покупатели весь
      вечер заказывают борщ по старой цене, и выясняется это только при сверке выручки.

      Такая ситуация называется **потерянным обновлением** (lost update): один человек перезаписывает изменение
      другого, потому что правил устаревшую копию. Этот урок о том, как сервер и клиент вместе замечают такой
      конфликт и что делать, когда он случился.

      ## Чем это отличается от гонки запросов

      В уроке «Гонки запросов» ответы одного клиента приходили не в том порядке, и экран показывал старое. Здесь
      порядок идеальный: запрос Ольги пришёл первым и выполнился первым, запрос Бориса — вторым. Беда в другом:
      Борис принимал решение, глядя на данные, которые к моменту сохранения уже устарели. Никакой порядок запросов
      этого не исправит — нужно знать, с какой версии записи человек начинал правку.

      Полезно различать два свойства:

      - **Локальная согласованность отображения** — экран не противоречит сам себе. После сохранения Борис видит
        ровно то, что отправил, и счётчики сходятся с карточкой. С этим у Бориса всё в порядке.
      - **Серверная корректность операции** — изменение применено к тому состоянию, которое человек видел, и не
        уничтожило чужих данных. Вот это и нарушено.

      Первое клиент может обеспечить сам. Второе — нет: только сервер знает, какая версия записи сейчас текущая.
      Поэтому проверку конфликта делает сервер, а задача клиента — сообщить ему, на какой версии основана правка.

      ## Версия записи и ETag

      **Версия** — метка состояния записи, которая меняется при каждом изменении. Это может быть счётчик (7, потом 8),
      время последнего изменения или хеш содержимого — короткий «отпечаток», вычисленный по самим данным. Важно одно: если запись
      изменилась, метка стала другой.

      В HTTP для этого есть заголовок ответа **ETag** (entity tag, «метка сущности»). Сервер присылает его вместе
      с данными:

      ```http
      HTTP/1.1 200 OK
      ETag: "v7"
      Content-Type: application/json

      { "id": 57, "name": "Борщ", "price": 350, "description": "Со сметаной" }
      ```

      Метка **непрозрачная** (opaque): клиент не разбирает, что внутри, а только хранит и возвращает её серверу.
      Сегодня там номер версии, завтра хеш — клиента это не касается.

      Бывают **сильные** и **слабые** метки. Слабая начинается с `W/` (`W/"v7"`) и означает «содержимое по смыслу
      то же, хотя байты могут отличаться». Для обнаружения конфликтов годится только сильная: стандарт HTTP требует
      сравнивать метки в `If-Match` строгим способом, а при строгом сравнении слабая метка не совпадает ни с чем,
      даже сама с собой. Если сервер отдаёт только слабые метки, условное сохранение будет всегда отказывать.

      ## Условный запрос: «сохрани, только если ничего не менялось»

      **Условный запрос** (conditional request) — запрос с предусловием: сервер выполняет его, только если условие
      истинно. Для сохранения нужен заголовок **If-Match**: «примени изменение, только если текущая метка записи
      совпадает с этой».

      ```http
      PUT /dishes/57 HTTP/1.1
      If-Match: "v7"
      Content-Type: application/json

      { "name": "Борщ", "price": 350, "description": "Со сметаной и пампушками" }
      ```

      Если метка на сервере уже другая, сервер не выполняет запрос и отвечает **412 Precondition Failed**
      («предусловие не выполнено»). Запись остаётся нетронутой. Это та самая проверка версии из урока «Гонки
      запросов», её же называют **оптимистичной блокировкой** (optimistic locking): читать и править могут все сразу,
      а проверка происходит в момент записи. Первое сохранение на основе текущей версии проходит, остальные,
      основанные на устаревшей, получают отказ.

      Её противоположность — **пессимистичная блокировка** (pessimistic locking): человек открывает карточку
      и «захватывает» её, а остальные видят «Редактирует Ольга» и не могут сохранить. Конфликтов не бывает, но
      появляются свои беды: Ольга ушла обедать с открытой вкладкой, и блюдо заблокировано на час. Приходится
      придумывать, сколько держится захват, и кнопку «забрать». Для веб-форм чаще выбирают оптимистичную блокировку:
      настоящие конфликты редки, а ждать никто не хочет.

      Несколько похожих заголовков, которые легко перепутать:

      - **`If-Match: "v7"`** — при сохранении (PUT, PATCH, DELETE): выполни, только если метка всё ещё `"v7"`,
        иначе 412.
      - **`If-Match: *`** — при сохранении: выполни, если запись вообще существует. Версию не проверяет и от
        конфликтов не защищает.
      - **`If-None-Match: "v7"`** — при чтении (GET): пришли данные, только если метка уже не `"v7"`, иначе ответ
        304 Not Modified. Это про кэш, а не про конфликты.
      - **`If-None-Match: *`** — при создании (PUT): создай, только если такой записи ещё нет, чтобы два клиента
        не создали одно и то же.

      Сервер может и потребовать условный запрос: на сохранение без `If-Match` он ответит **428 Precondition
      Required**. Это защищает от старых клиентов, которые о версиях не знают.

      ## Версия в теле запроса и ответ 409

      Не всякий API работает с заголовками. В GraphQL, например, один запрос может менять несколько записей, и
      одной метки на ответ не хватит. Тогда версия едет в теле: клиент получает `"version": 7` вместе с данными и
      отправляет его обратно при сохранении. Сервер сравнивает и при несовпадении отвечает ошибкой — обычно
      **409 Conflict**. Стандарт HTTP описывает 409 именно так: запрос конфликтует с текущим состоянием записи,
      и в ответе стоит дать достаточно сведений, чтобы человек понял причину конфликта.

      Механизм тот же самый, отличается только место, где лежит версия. Какой вариант выбран, записывают
      в контракт API — об этом урок «Контракт API глазами фронтенда».

      Одна практическая ловушка. Если API живёт на другом домене, браузер по умолчанию не даёт скрипту прочитать
      заголовок `ETag`: в ответах на запросы к чужому домену коду видны только несколько «безопасных» заголовков
      вроде `Content-Type` и `Last-Modified`, и `ETag` в их число не входит. Во вкладке «Сеть» в инструментах
      разработчика заголовок есть, а `response.headers.get('ETag')` возвращает `null`. Лечится на сервере: он
      должен добавить `Access-Control-Expose-Headers: ETag`. Ни `credentials: 'include'`, ни другие настройки
      `fetch` этот список не расширяют: открыть заголовок может только сервер. И в обратную сторону: чтобы браузер
      разрешил отправить заголовок `If-Match` на чужой домен, сервер должен перечислить его
      в `Access-Control-Allow-Headers`, иначе сохранение упадёт с `TypeError`.

      ## Пример целиком: две правки одного блюда

      Повторим историю Ольги и Бориса, но теперь API требует `If-Match`.

      1. **10:00.** Ольга и Борис открывают карточку. Оба получают цену 350 ₽ и `ETag: "v7"`. Клиент каждого
         запоминает метку рядом с данными формы.
      2. **10:05.** Ольга сохраняет цену 390 ₽ с `If-Match: "v7"`. Метка совпадает, сервер записывает и отвечает
         200 с новой меткой `ETag: "v8"`.
      3. **10:06.** Борис сохраняет описание с `If-Match: "v7"`. На сервере уже `"v8"`, поэтому ответ — 412.
         Цена Ольги цела.
      4. **Что видит Борис.** Сообщение: «Пока вы редактировали, блюдо изменил другой сотрудник». Его текст
         «и пампушками» остаётся в поле — ничего не стёрто.

      Конфликт обнаружен. Но что делать дальше? Тут начинается выбор.

      ## Четыре способа разрешить конфликт

      ### Отказ с перечитыванием

      **Отказ с перечитыванием** (reject and refresh): сервер отказал, клиент загружает свежую версию и просит
      человека повторить правку уже поверх неё. Борис видит новую цену 390 ₽, ещё раз дописывает «и пампушками»
      и сохраняет с меткой `"v8"`.

      Это самый простой и самый честный способ: решение принимает человек, глядя на актуальные данные. Цена —
      повторная работа. Если в форме было три поля, это пустяк. Если человек полчаса писал описание, а мы его
      стёрли, он нас возненавидит. Поэтому при перечитывании ввод не выбрасывают: его можно показать рядом
      с новой версией и дать скопировать.

      ### Последняя запись побеждает

      **Last-write-wins** («побеждает последняя запись»): никакой проверки, кто сохранил позже, тот и прав.
      Это и было поведение без версий из начала урока.

      Звучит как ошибка проектирования, но для части данных это правильный выбор. Человек выбрал тёмную тему
      на телефоне, а потом светлую на ноутбуке — пусть останется последняя, потеря стоит одного нажатия.
      Запись правит один человек, и конфликт возможен только между его же устройствами — тоже подходит.
      Главное — выбирать last-write-wins осознанно, там, где потерянная правка ничего не стоит.

      Одна оговорка: «последняя» — это та, что последней пришла на сервер, или та, у которой больше номер версии
      на сервере. Сравнивать по часам устройств нельзя: у одного телефона часы спешат на пять минут, и его старая
      правка «победит» новую.

      ### Слияние по полям

      **Слияние по полям** (field-level merge): если люди меняли разные поля, применить обе правки. Ольга меняла
      цену, Борис — описание; пересечения нет, и обе правки могут жить.

      Это не то слияние, что в уроке «Гонки запросов». Там меняли саму форму операции («добавь одну пиццу» вместо
      «поставь три»), чтобы порядок запросов перестал быть важен. Здесь операции обычные, а сравниваются две
      версии одной записи.

      Для этого нужно знать, что именно человек изменил. Клиент помнит **базовую версию** — ту, с которой начинал
      правку, — и сравнивает с ней форму. Дальше два пути:

      - Отправлять только изменённые поля, например `PATCH` с `{ "description": "…" }`. Тогда правки разных полей
        не мешают друг другу даже без проверки версии. Но две правки одного поля по-прежнему молча перезапишут
        друг друга — это last-write-wins на уровне поля.
      - Делать **трёхстороннее слияние** (three-way merge): сравнить базовую версию, свою и текущую серверную.
        Поле меняли только мы — берём своё. Меняли только они — берём их. Меняли обе стороны по-разному —
        настоящий конфликт, решать человеку.

      Слабое место слияния — **связанные поля**. Допустим, у блюда есть цена и цена по акции, и акционная всегда
      меньше обычной. Ольга снизила обычную цену до 300 ₽, Борис в это же время поставил акционную 320 ₽. Каждая
      правка по отдельности правильная, а вместе они нарушают правило. Поэтому поля, связанные таким правилом,
      сливают как одно целое: изменилось любое из них у другой стороны — это конфликт.

      ### Выбор человеком

      **Ручное разрешение** (user resolution): показать обе версии и дать человеку выбрать. Допустим, Борис тоже
      поменял цену — на 420 ₽. Тогда он увидит: «Ваша цена: 420 ₽. Сохранено Ольгой в 10:05: 390 ₽. Оставить вашу /
      оставить сохранённую». Подходит для важных данных, где машина не может решить за людей, кто прав: цены,
      остатки, суммы в договоре.

      Цена — сложный интерфейс, который надо продумать и протестировать, и человек, который должен понять, что
      произошло. Поэтому ручное разрешение обычно оставляют для полей, где ошибка дорога, а остальное сливают
      автоматически.

      ## Как выбрать

      - **Отказ с перечитыванием**
        - Когда подходит: маленькие формы, конфликты редки.
        - Цена: правку повторяют заново.
      - **Последняя запись побеждает**
        - Когда подходит: потеря правки ничего не стоит.
        - Цена: чужое пропадает молча.
      - **Слияние по полям**
        - Когда подходит: люди правят разные поля.
        - Цена: нужна базовая версия.
      - **Выбор человеком**
        - Когда подходит: ошибка стоит денег.
        - Цена: сложный интерфейс.

      На практике способы сочетают. Для карточки блюда разумно так: описание и фото сливать по полям, цену
      и акционную цену при конфликте показывать человеку, а признак «блюдо в избранном у менеджера» хранить
      по принципу last-write-wins.

      Предупреждение заранее тоже помогает: «Это блюдо сейчас открыто у Ольги». Оно снижает число конфликтов, но
      не заменяет проверку версии при сохранении — люди не всегда читают предупреждения. Как показывать
      присутствие других людей, разбирается в курсе «Синхронизация и офлайн», в теме «Совместная работа».

      ## Где граница темы

      Здесь речь о записях и формах: карточка блюда, профиль, заказ. Сохранение происходит по кнопке или
      автоматически, и правки сравниваются целиком или по полям. Совсем другая задача — когда несколько человек
      одновременно печатают в одном тексте, как в онлайн-документах, и каждая буква должна встать на своё место.
      Для неё есть отдельные алгоритмы, они разбираются в курсе «Синхронизация и офлайн», в теме «Совместная работа».

      ## Типичные ошибки

      - **Отправлять форму целиком без версии.** Это и есть потерянное обновление из начала урока: всё работает,
        пока два человека не откроют одну запись.
      - **Проверять версию на клиенте.** Клиент делает GET, сравнивает метку и, если совпала, делает PUT. Между
        проверкой и записью кто-то успевает сохранить своё, и проверка ничего не дала. Сравнение и запись должны
        происходить на сервере за одну операцию.
      - **На 412 тихо повторить с новой меткой.** Клиент получил отказ, перечитал запись, взял свежий ETag
        и отправил прежнее тело. Это ровно last-write-wins, только с лишним запросом: правка Ольги снова затёрта.
      - **Терять ввод при конфликте.** Сообщение «Данные устарели», и форма перезагружена с сервера. Человек
        потерял свою работу и в следующий раз будет копировать текст в блокнот перед сохранением.
      - **Сливать связанные поля по отдельности.** Каждая правка верна, а вместе они нарушают правило.
      - **Слабые метки в If-Match.** Сохранение отказывает всегда, и разработчики в итоге отключают проверку.

      ## Как спрашивают на интервью

      - «Два администратора одновременно редактируют карточку товара. Что произойдёт и как это предотвратить?» —
        ждут потерянное обновление, проверку версии через `If-Match` и выбор способа разрешить конфликт.
      - «Сервер ответил 412 на сохранение. Что увидит пользователь и что станет с его вводом?»
      - «Чем оптимистичная блокировка отличается от пессимистичной? Когда выбрать каждую?»

      ## Коротко

      - Потерянное обновление: человек сохраняет правку поверх устаревшей копии и молча стирает чужое изменение. От
        гонки запросов оно отличается тем, что порядок здесь идеальный, а беда в том, с какой версии начиналась
        правка.
      - Локальную согласованность отображения клиент обеспечивает сам, а серверную корректность операции — только
        сервер, потому что лишь он знает текущую версию. Задача клиента — сообщить, на какой версии основана правка.
      - Версию передают меткой ETag, и клиент считает её непрозрачной. Для проверки конфликтов годится только сильная
        метка: слабая (`W/`) при строгом сравнении не совпадает ни с чем.
      - Условный запрос с `If-Match` выполняется, только если метка не изменилась, иначе сервер отвечает 412: это
        оптимистичная блокировка. Версию можно передавать и в теле запроса, и тогда при несовпадении сервер обычно
        отвечает 409.
      - Пессимистичная блокировка исключает конфликты, но держит запись, пока её не отпустят. Для веб-форм чаще
        выбирают оптимистичную: настоящие конфликты редки, а ждать никто не хочет.
      - Способ разрешения выбирают по цене потерянной правки: отказ с перечитыванием без потери ввода — для маленьких
        форм, last-write-wins — только там, где потеря ничего не стоит, и «последней» считают запись по серверу, а не
        по часам устройств.
      - Если люди правили разные поля, сливают по полям от базовой версии, а поля, связанные правилом, — как одно
        целое. Для дорогих полей вроде цены обычно показывают обе версии и дают выбрать человеку, и на практике
        способы сочетают в одной форме.
      - Если API на другом домене, сервер должен открыть `ETag` через `Access-Control-Expose-Headers` и разрешить
        `If-Match` в `Access-Control-Allow-Headers`, иначе клиент не прочитает метку и не отправит условие.

      ## Источники

      - [RFC 9110 (HTTP Semantics), раздел 13.1.1 If-Match](https://www.rfc-editor.org/rfc/rfc9110.html#section-13.1.1)
      - [ETag — MDN](https://developer.mozilla.org/ru/docs/Web/HTTP/Reference/Headers/ETag)

  - id: sdd-reconcile
    topic: Изменения и согласованность
    subtopic: Сверка кэша после изменений
    title: Кэш после изменения
    audio: https://color-zebra.github.io/frontend-quiz-audio/system-design-data/sdd-reconcile.mp3
    body: |
      ## Какую проблему решаем

      Менеджер ресторана переименовывает блюдо «Борщ» в «Борщ с пампушками». Он правит название в карточке блюда,
      нажимает «Сохранить», сервер отвечает «готово». Карточка показывает новое название. Менеджер возвращается
      к списку «Супы» — а там по-прежнему «Борщ». В блоке «Популярное» на главной кабинета — тоже «Борщ».

      Менеджер решает, что сохранение не сработало, и переименовывает ещё раз. Потом пишет в поддержку. Сервер всё
      это время хранил правильное название — ошибся клиент: он обновил одну копию данных и забыл про остальные.

      В уроке «Как устроен клиентский кэш» мы разобрали, что клиент держит копии серверных данных в кэше, по записи
      на каждый ключ: список «Супы», список «Популярное», карточка блюда 57. Одно и то же блюдо лежит в трёх
      записях. Этот урок о том, что делать с этими копиями, когда изменение прошло: какие записи обновить, как
      и чем, чтобы не показать человеку старое и не затереть новое.

      ## Два основных способа

      После успешного изменения у клиента есть два пути.

      **Инвалидация** из урока «Когда данные устаревают» — пометить записи устаревшими и загрузить заново. Клиент
      не пытается угадать, как изменились данные: он спрашивает сервер. После собственного изменения важно одно
      уточнение: `invalidateQueries` сразу перезапрашивает только записи, которые сейчас на экране. Остальные лишь
      помечаются устаревшими и перезапросятся, когда понадобятся, — лишних запросов за невидимыми списками не будет.

      **Прямое обновление кэша** (direct cache update) — записать новые данные в кэш самому, без запроса. Чаще всего
      их берут из ответа сервера: на сохранение карточки сервер обычно возвращает её новую версию целиком. В TanStack
      Query для этого есть `setQueryData` — записать данные по одному ключу — и `setQueriesData` — по всем ключам,
      подходящим под фильтр.

      Сравним их:

      - **Инвалидация**
        - Запросы: один на каждую затронутую запись.
        - Скорость: новое появится через время ответа.
        - Точность: посчитал сервер.
        - Что нужно знать клиенту: какие ключи затронуты.
      - **Прямое обновление**
        - Запросы: ни одного.
        - Скорость: мгновенно.
        - Точность: клиент повторяет логику сервера.
        - Что нужно знать клиенту: как изменилась каждая запись.

      Есть ещё третий подход — **нормализованный кэш** (normalized cache). О нём ниже, после главного примера.

      ## Когда что выбирать: смотрите на форму данных

      Решение зависит от того, насколько легко клиенту без ошибки повторить то, что сделал сервер.

      **Карточка одной записи, ответ сервера содержит её целиком** — прямое обновление. Ответ и есть новое
      состояние, остаётся положить его в кэш по ключу карточки. Лишний запрос за тем, что уже пришло, не нужен.

      **Поле записи поменялось, а сама запись в списках остаётся на месте** — тоже прямое обновление. Переименовали
      блюдо — найти его по `id` во всех загруженных списках и заменить название.

      **Изменение влияет на то, какие записи попадают в список и в каком порядке**, — инвалидация. Блюдо подорожало,
      а список отсортирован по цене. Блюдо стало вегетарианским, а на экране фильтр «Вегетарианское». Чтобы обновить
      такой список самому, клиенту пришлось бы повторить сортировку и фильтры сервера. А если список разбит на
      страницы, клиент вообще не знает, где проходят их границы: новое место блюда может оказаться на странице,
      которую он не загружал.

      **Создание новой записи** — почти всегда инвалидация списков. Куда встанет новый ресторан в списке,
      отсортированном по рейтингу, знает только сервер.

      **Удаление** — запись можно убрать из всех загруженных списков самому, это просто. Но счётчики («в меню
      24 блюда») и соседние страницы лучше перезапросить.

      **Сводные значения** — суммы, счётчики, «всего непрочитанных» — инвалидация. Пересчитать их по загруженным
      данным нельзя: на клиенте обычно лежит только первая страница. Если же разница известна точно (письмо
      прочитано — непрочитанных на одно меньше), счётчик можно сдвинуть сразу, а потом уточнить инвалидацией.

      Короткое правило: если клиент может обновить запись, просто заменив поля по `id`, обновляйте напрямую. Если
      для этого нужно повторить логику сервера — сортировку, фильтры, подсчёт, разбиение на страницы, — инвалидируйте.

      ## Одна сущность в нескольких местах

      Главная трудность — найти все копии. Блюдо 57 может лежать в карточке, в списке своей категории, в «Популярном»,
      в результатах поиска и в стоп-листе.

      Здесь помогает договорённость о том, как устроены ключи кэша (сами ключи разобраны в уроке «Как устроен
      клиентский кэш»). Если все ключи блюд начинаются с одного слова, а списки и карточки различаются вторым, то
      затронутые записи легко выбрать по началу ключа — TanStack Query умеет находить записи именно так:

      ```ts
      ['dishes', 'detail', 57]                        // карточка блюда
      ['dishes', 'list', { category: 'soups' }]       // список «Супы»
      ['dishes', 'list', { popular: true }]           // «Популярное»
      ['dishes', 'list', { search: 'борщ' }]          // результаты поиска
      ```

      Инвалидация по началу ключа `['dishes', 'list']` затронет все списки блюд сразу, а `['dishes', 'detail', 57]` —
      только карточку. Без такой договорённости каждое изменение превращается в поиск по всему приложению: «где ещё
      показывается блюдо?» — и что-нибудь обязательно забудут.

      Оборотная сторона инвалидации по началу ключа — лишняя нагрузка. Если у менеджера открыто пять списков блюд, одно
      переименование вызовет пять запросов. Обычно это приемлемо, но если пометить устаревшим вообще весь кэш
      приложения, каждое мелкое изменение будет вызывать шквал запросов.

      ## Не затереть новое старым

      Ответ сервера кажется самым свежим источником, но это не всегда так. Вот как это ломается.

      1. Менеджер меняет цену блюда с 350 на 390 ₽. Уходит запрос А.
      2. Пока он идёт, в фоне начинается плановый перезапрос карточки (из урока «Когда данные устаревают»). Назовём
         его Ф. Сервер обрабатывает его до запроса А и готовит ответ с ценой 350 ₽.
      3. Менеджер передумал и ставит 420 ₽. Уходит запрос Б.
      4. Ответы приходят так: А (390), Б (420), и последним — задержавшийся Ф с ценой 350 ₽.

      Если клиент просто записывает в кэш каждый пришедший ответ, на экране окажется 350 ₽ — цена, которой уже
      нет. Менеджер увидит, что его правка «откатилась». Общий механизм таких ошибок разобран в уроке «Гонки
      запросов»; здесь он проявляется при записи в кэш.

      Что помогает:

      - **Версия в данных.** Если сервер отдаёт у записи номер версии или время изменения, клиент записывает ответ
        в кэш, только когда его версия не старше той, что уже лежит в кэше. Ответ Ф с версией 7 придёт после
        ответа Б с версией 9 и будет отброшен. Это самый надёжный способ: он работает при любом порядке ответов.
        Сравнивают только метки, которые поставил сервер. Время по часам телефона для этого не годится: часы
        устройства и сервера расходятся, иногда на минуты.
        Фоновый перезапрос TanStack Query кладёт ответ в кэш сам, поэтому сравнение делают в функции загрузки:
        если версия пришедших данных старше той, что лежит в кэше (её читают через `queryClient.getQueryData`),
        функция возвращает данные из кэша.
      - **Отмена фоновых перезапросов перед изменением.** Отменить перезапросы этого ключа, которые уже идут,
        чтобы их ответы не легли поверх. В TanStack Query для этого есть `cancelQueries`; тот же приём используют
        в уроке «Оптимистичные обновления». Отмена касается только запросов, которые идут в этот момент: перезапрос,
        начатый позже, остановит уже сравнение версий.
      - **Одна итоговая инвалидация** после серии быстрых изменений, а не после каждого — как в уроке
        «Оптимистичные обновления».

      И ещё одно правило TanStack Query, которое легко нарушить: данные в кэше нельзя менять на месте. Обновление
      должно создавать новый объект (`{ ...old, name: 'Борщ с пампушками' }`), иначе библиотека может не заметить
      изменения, и экран не перерисуется.

      ## Пример целиком: переименование и новая цена

      Менеджер в кабинете ресторана меняет у блюда 57 название и цену. Сервер на `PATCH /dishes/57` возвращает блюдо
      целиком с новой версией 8. Посмотрим, что делает клиент.

      1. **Перед отправкой** отменяет фоновые перезапросы карточки блюда 57, которые уже идут, чтобы их старые
         ответы не легли поверх. Перезапрос, который начнётся во время сохранения, отменой не остановить — его
         старый ответ отсечёт сравнение версий в шаге 2.
      2. **Карточка блюда.** Ответ сервера — это и есть новая карточка. Клиент кладёт его в `['dishes', 'detail', 57]`,
         если версия 8 новее той, что в кэше. Без лишнего запроса.
      3. **Списки блюд.** Клиент проходит по всем загруженным спискам `['dishes', 'list', …]` и заменяет в них блюдо
         с `id` 57 на новое. Менеджер сразу видит новое название везде.
      4. **Порядок и состав списков.** Цена изменилась, а «Популярное» и поиск могут быть отсортированы по цене.
         Поэтому, кроме прямой замены, клиент инвалидирует списки блюд: сервер пришлёт правильный порядок через
         долю секунды. Прямое обновление дало мгновенный результат, инвалидация — точный.
      5. **Сводные данные.** На главной кабинета есть сводка меню: «24 блюда, средняя цена 410 ₽». Она зависит
         от цен, и пересчитывать её на клиенте не из чего. Клиент её инвалидирует.

      Что получилось: менеджер видит новое название и цену сразу во всех местах, через мгновение списки уточняются
      сервером, а задержавшийся старый ответ не может откатить цену.

      ## Нормализованный кэш

      До сих пор каждая запись кэша хранила свою копию блюда. Есть другой подход. **Нормализованный кэш** хранит
      каждую сущность один раз, под ключом из её типа и `id` (например, `Dish:57`), а списки хранят не копии,
      а ссылки на неё. Нормализацию данных мы разбирали в уроке «Вычислять или хранить»; так, например, устроен
      кэш Apollo Client для GraphQL.

      Плюс очевиден: сервер вернул блюдо 57 с новым названием — оно поменялось во всех списках, потому что копия
      одна. Ничего искать не надо.

      Но нормализация решает только половину задачи. Она обновляет **поля** существующих сущностей. А вот **состав
      и порядок** списков — появилась новая запись, исчезла удалённая, запись переехала в другой фильтр или должна
      встать на другое место при сортировке — нормализованный кэш сам не узнает: список хранит прежний набор
      ссылок в прежнем порядке. Документация Apollo прямо говорит: новый объект не добавляется автоматически
      в списки, где он должен появиться. Для этого всё равно пишут код обновления или перезапрашивают затронутые списки.

      ## Сравнение подходов

      - **Инвалидация**
        - Когда подходит: сортировка, страницы, счётчики, новые записи.
        - Цена: лишние запросы, новое появляется не сразу.
      - **Прямое обновление**
        - Когда подходит: карточка, замена полей по `id`.
        - Цена: нужно найти все копии и не затереть новое.
      - **Оба вместе**
        - Когда подходит: нужно и мгновенно, и точно.
        - Цена: больше кода.
      - **Нормализованный кэш**
        - Когда подходит: одни и те же сущности на многих экранах.
        - Цена: состав и порядок списков всё равно обновляют вручную.

      ## Типичные ошибки

      - **Обновить только тот экран, где было действие.** Карточка показывает новое, список — старое, человек
        думает, что сохранение не сработало, и повторяет его.
      - **Записывать в кэш любой пришедший ответ.** Задержавшийся ответ возвращает старое значение, и правка
        «откатывается» на глазах у человека.
      - **Вставлять новую запись в отсортированный список вручную.** Она встаёт не на своё место, а при подгрузке
        следующей страницы появляется второй раз.
      - **Считать сводные значения по загруженным данным.** На клиенте только первая страница, и счётчик врёт.
      - **Инвалидировать весь кэш.** Каждое мелкое изменение вызывает десятки запросов.
      - **Менять объект в кэше на месте.** Экран не перерисовывается или перерисовывается не везде.

      ## Как спрашивают на интервью

      - «Пользователь переименовал задачу в карточке, а в списке осталось старое название. Как вы устроите обновление
        данных после изменения?» — ждут выбора между прямым обновлением
        и инвалидацией по форме данных и защиты от опоздавшего ответа.
      - «Чем инвалидация отличается от прямого обновления кэша? Когда вы выберете каждое?»
      - «Одна и та же сущность показывается в пяти местах. Как сделать, чтобы после изменения везде было одинаково?»

      ## Коротко

      - После успешного изменения обновляют все копии сущности в кэше, а не только экран, где было действие. Иначе
        человек решит, что сохранение не сработало, и повторит его.
      - Инвалидация помечает записи устаревшими и сразу перезапрашивает те, что на экране: точно, но с задержкой. При
        прямом обновлении клиент сам записывает в кэш новые данные (`setQueryData`, `setQueriesData`), обычно из
        ответа сервера: мгновенно, но приходится повторять логику сервера.
      - Если запись можно обновить, просто заменив поля по `id`, её обновляют напрямую. Если для этого пришлось бы
        повторить сортировку, фильтры, подсчёт или разбиение на страницы, инвалидируют, а создание новой записи почти
        всегда означает инвалидацию списков.
      - Способы сочетают: прямое обновление даёт мгновенный результат, а следом инвалидация — точный.
      - Копии находят по договорённости о ключах: общее начало вроде `['dishes', 'list']` позволяет инвалидировать все
        списки блюд сразу. А если пометить устаревшим весь кэш, каждое мелкое изменение вызовет шквал запросов.
      - Задержавшийся ответ не должен затирать новое: в кэш пишут ответ, только если его серверная версия не старше
        лежащей. Идущие перезапросы отменяют перед изменением (`cancelQueries`), а начатые позже отсекает сравнение
        версий.
      - В TanStack Query данные в кэше не меняют на месте, а создают новый объект, иначе экран может не
        перерисоваться.
      - Нормализованный кэш хранит сущность один раз и сам обновляет её поля во всех списках, но состав и порядок
        списков всё равно обновляют вручную или перезапросом.

      ## Источники

      - [Updates from Mutation Responses — TanStack Query](https://tanstack.com/query/latest/docs/framework/react/guides/updates-from-mutation-responses)
      - [Query Invalidation — TanStack Query](https://tanstack.com/query/latest/docs/framework/react/guides/query-invalidation)
      - [Mutations: Updating local data — Apollo Client](https://www.apollographql.com/docs/react/data/mutations#updating-local-data)

  - id: sdd-forms
    topic: Изменения и согласованность
    subtopic: Формы и валидация
    title: Формы и валидация
    audio: https://color-zebra.github.io/frontend-quiz-audio/system-design-data/sdd-forms.mp3
    body: |
      ## Какую проблему решаем

      Ресторан хочет подключиться к сервису доставки. Владелец заполняет форму в три шага: «О ресторане», «Адрес
      и часы работы», «Реквизиты». Вот что с ним может случиться в плохо спроектированной форме:

      - он начинает вводить телефон, и после первой же цифры поле краснеет: «Неверный формат»;
      - короткое имя для ссылки на ресторан форма показала как «свободно», а при отправке оказалось, что оно занято;
      - на третьем шаге он нажимает «Назад», и всё, что было на первом, пропало;
      - сервер ответил ошибкой, и над формой появилось «Ошибка 422», а какое поле не так — непонятно;
      - после ошибки форма очистилась, и всё надо вводить заново.

      Каждый пункт — не опечатка в коде, а решение, которое никто не принял осознанно. Этот урок о том, как
      проектировать формы: кто и где проверяет данные, когда показывать ошибки, как проверять на сервере, не
      путаясь в ответах, и как вести человека через несколько шагов, ничего не потеряв.

      ## Две проверки — две разные задачи

      **Валидация** (validation) — проверка введённых данных по правилам: поле заполнено, телефон похож на телефон,
      имя не занято. Проверять можно в двух местах, и у каждого своя роль.

      **Проверка на клиенте** — подсказка человеку. Она мгновенная и не требует запроса: человек узнаёт об ошибке,
      пока помнит, что вводил. Но защитой она не является. MDN прямо предупреждает: клиентскую проверку легко обойти,
      а запрос к серверу можно отправить вообще в обход формы — из консоли браузера или любой программы.

      **Проверка на сервере** — окончательное решение. Сервер проверяет всё, что пришло, независимо от того, что
      проверил клиент. Кроме того, многие правила может проверить только он: свободно ли имя, существует ли
      компания с таким ИНН, входит ли адрес в зону доставки.

      Как это делится на примере формы подключения ресторана:

      - **Поле «Название» заполнено**
        - На клиенте: да, чтобы подсказать сразу.
        - На сервере: да, чтобы не принять пустое.
      - **Телефон в правильном формате**
        - На клиенте: да.
        - На сервере: да.
      - **Короткое имя для ссылки свободно**
        - На клиенте: подсказка с запросом к серверу.
        - На сервере: да, в момент сохранения.
      - **Компания с таким ИНН существует**
        - На клиенте: нет, проверять не из чего.
        - На сервере: да.
      - **Адрес в зоне доставки**
        - На клиенте: нет.
        - На сервере: да.

      Одно правило, записанное в двух местах, может разъехаться. Если клиент строже сервера, человек не может
      отправить правильные данные: например, проверка телефона на клиенте не пропускает скобки и пробелы, а сервер
      их принимает. Поэтому окончательный текст правила — серверный. Клиентская проверка — его упрощённая копия
      для быстрой подсказки, и лучше, чтобы она была мягче, а не строже. Иногда обе стороны берут правила из одной
      общей схемы — например, JSON Schema или схемы Zod, общей для клиента и сервера на TypeScript. Тогда
      расхождения не будет.

      ### Что умеет сам браузер

      В HTML есть встроенная проверка: атрибуты `required` (обязательное поле), `type="email"`, `minlength`,
      `pattern` (регулярное выражение). Браузер не даст отправить форму, пока поля не пройдут проверку,
      и покажет своё сообщение. Из кода состояние поля видно через **API проверки ограничений** (Constraint
      Validation API): свойство `validity` говорит, какое правило нарушено, а `setCustomValidity` задаёт своё
      сообщение.

      Встроенные всплывающие сообщения у разных браузеров выглядят по-разному и пропадают через пару секунд.
      Поэтому часто к форме добавляют атрибут `novalidate`: браузер перестаёт показывать свои сообщения, а сайт
      выводит собственные под полями, по-прежнему используя встроенные правила. Подробности и примеры — в статье
      [«Валидация форм на стороне клиента» на MDN](https://developer.mozilla.org/ru/docs/Learn_web_development/Extensions/Forms/Form_validation).

      ## Когда показывать ошибки

      Проверить поле можно в три момента:

      - **При вводе** (on input) — после каждого нажатия клавиши.
        - Что даёт: исправил — ошибка сразу исчезла.
        - Цена: ругается на недописанное.
      - **При уходе из поля** (on blur) — когда человек перешёл к следующему полю.
        - Что даёт: дописал — сразу узнал об ошибке.
        - Цена: исправленная ошибка висит, пока человек снова не уйдёт из поля.
      - **При отправке** (on submit) — когда нажата кнопка «Отправить» или «Далее».
        - Что даёт: не мешает заполнять.
        - Цена: все ошибки разом в конце.

      Например, при проверке на каждом нажатии поле телефона краснеет после первой же цифры. При проверке только
      на уходе исправленная ошибка висит, пока человек снова не уйдёт из поля.

      Хорошо работает сочетание. Пока человек впервые заполняет поле, его не трогают. Когда он уходит из поля,
      проверяют и при ошибке показывают её. Если ошибка показана, поле перепроверяют при каждом вводе, чтобы она
      исчезла сразу после исправления. При отправке проверяют всю форму, включая поля, до которых человек не
      дошёл. В библиотеке React Hook Form такое поведение включается режимом `onTouched`.

      Для этого форма помнит про каждое поле два признака. **Тронутое** (touched) — человек уже заходил в поле
      и уходил из него. **Изменённое** (dirty) — значение отличается от исходного. Поле, которое не тронуто, не
      краснеет до отправки.

      Есть и исключения. Проверку при вводе оставляют там, где она помогает, а не мешает: подсказка о надёжности
      пароля, счётчик оставшихся символов, проверка, свободно ли имя. А для полей вроде даты, наоборот, проверка при
      вводе бесполезна: пока дата не дописана, она почти всегда «неверная». Так советует и руководство W3C
      по доступности форм.

      ### Как ошибка должна выглядеть

      Как сообщать об ошибке действия вообще, разобрано в уроке курса 1 «Загрузка, пустота, ошибка и всё между ними».
      У форм есть свои правила. Руководство W3C о сообщениях в формах (WAI Forms Tutorial) даёт несколько, которые
      полезны всем, а не только людям с экранным диктором:

      - **сообщение рядом с полем** и с подсказкой, как исправить: не «Неверный формат», а «Введите 10 или 12 цифр ИНН»;
      - **не только цветом**: красная рамка плюс значок и текст — цвет различают не все;
      - **сообщение связано с полем** атрибутом `aria-describedby`, а само поле помечено `aria-invalid`, чтобы
        экранный диктор прочитал ошибку вместе с полем;
      - **при отправке с ошибками** — список ошибок над формой со ссылками на поля и фокус на первом неверном поле,
        чтобы человек сразу начал исправлять.

      ## Асинхронная проверка без гонок

      **Асинхронная проверка** — проверка, для которой нужен запрос к серверу. Пример — короткое имя ресторана
      для ссылки `eda.example/r/pelmeni`. Свободно ли оно, знает только сервер.

      Владелец быстро печатает «pelmen», потом «pelmeni». Ушло два запроса. Ответ на «pelmen» задержался и пришёл
      вторым: «свободно». На экране под полем «pelmeni» — зелёная галочка, хотя это имя давно занято. Это гонка
      ответов из урока «Гонки запросов», только в форме.

      Паузу перед запросом и отмену прежнего запроса мы разобрали в уроке «Лишние и одинаковые запросы»; для формы
      к ним добавляется третье правило — **сверка значения**: применять ответ, только если проверенное значение
      совпадает с тем, что сейчас в поле. Ответ «pelmen — свободно» не относится к «pelmeni» и отбрасывается. Это
      самая надёжная защита: она не зависит от порядка ответов.

      У такой проверки не два исхода, а четыре: «проверяем…», «свободно», «занято» и «не удалось проверить».
      Последний — не ошибка человека: связь пропала или сервис проверки не ответил, а имя, возможно, свободно.
      Галочку «свободно» в этом случае не ставят — это было бы обещание без оснований. Но и отправку формы из-за
      него не блокируют: при сохранении сервер всё равно проверит имя сам.

      И главное: зелёная галочка — только подсказка. Между проверкой и отправкой формы может пройти десять минут,
      и за это время имя займёт кто-то другой. Поэтому сервер обязан проверить уникальность ещё раз в момент
      сохранения и, если имя уже занято, вернуть ошибку этого поля.

      ## Серверные ошибки у полей

      Ошибка валидации — самый дружелюбный сбой: человек может всё исправить сам, если ему показали, что именно
      (виды сбоев разберём в уроке «Какие бывают сбои»). Для этого нужен договор с сервером о формате ошибок.
      Удобный вариант — формат «problem details» из [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457.html#section-3),
      о котором шла речь в уроке «Контракт API глазами фронтенда». Сервер отвечает кодом 422 и списком ошибок, где
      у каждой есть указатель на поле:

      ```json
      {
        "type": "https://eda.example/problems/validation",
        "title": "Проверьте данные",
        "errors": [
          { "pointer": "#/slug", "detail": "Это имя уже занято" },
          { "pointer": "#/requisites/inn", "detail": "Компания с таким ИНН не найдена" }
        ]
      }
      ```

      Указатель `#/requisites/inn` — путь к полю в отправленных данных (так записываются указатели JSON Pointer).
      Клиент по нему находит поле формы и показывает текст ошибки под ним, так же, как показывал бы свою.

      Что важно:

      - **Ввод остаётся на месте.** Ничего не очищать, не перезагружать с сервера. Исключение — поля, которые
        нельзя хранить, например пароль: его очищают, а остальное оставляют. Подробнее о том, как не терять ввод, —
        в уроке «Как не потерять работу пользователя».
      - **Фокус — на первое поле с ошибкой.**
      - **Ошибки без поля** («ресторан с этим ИНН уже подключён, обратитесь в поддержку») показывают в общем блоке
        над кнопкой отправки.
      - **Ошибка валидации — не сбой сети.** 422 означает «исправьте данные», и кнопка «Повторить» здесь
        бесполезна. При сбое сети или 5xx данные, скорее всего, верны, но запись могла пройти. Что делать
        дальше — повторить с тем же ключом идемпотентности или сначала выяснить исход, — разобрано в уроках «Повторы
        без двойных списаний» и «Когда и как повторять».
      - **Повторное нажатие.** Кнопку блокируют сразу при первом нажатии, до ответа сервера, а от двойной отправки
        на сервере защищает ключ идемпотентности — урок «Повторы без двойных списаний».

      ## Многошаговая форма

      Длинную форму разбивают на шаги, чтобы человек не пугался сорока полей сразу. Но у шагов свои ловушки.

      **Где хранить ввод.** Если каждый шаг хранит свои данные в собственном состоянии, то при переходе на следующий
      шаг компонент предыдущего исчезает вместе с данными. Поэтому данные всей формы держат на уровне выше шагов —
      в общем состоянии формы, а шаг только показывает свою часть. Тогда «Назад» возвращает человека к заполненным
      полям.

      **Что проверять на «Далее».** Только поля текущего шага: нельзя ругаться на реквизиты, когда человек ещё
      на первом шаге. Всю форму целиком окончательно проверяет сервер при последней отправке.

      **Серверная ошибка на прошлом шаге.** Сервер вернул ошибку поля `slug`, а оно на первом шаге, человек же
      сейчас на третьем. Клиент переходит на нужный шаг, показывает сообщение у поля и ставит на него фокус.
      Данные остальных шагов при этом сохраняются. Удобно, когда каждое поле знает, на каком оно шаге, — тогда
      переход делается по указателю из ответа.

      **Шаг в адресе страницы.** Если номер шага записан в адресе (`?step=2`), кнопка «Назад» в браузере
      возвращает на прошлый шаг, а не уводит из формы. Об адресе как части состояния — урок «Что переживает
      перезагрузку».

      **Переживёт ли ввод перезагрузку.**

      - **В памяти страницы**
        - Что переживёт: переходы между шагами.
        - Цена: пропадёт при перезагрузке.
      - **В хранилище браузера**
        - Что переживёт: перезагрузку и закрытие вкладки.
        - Цена: видно всем, кто сядет за это устройство.
      - **Черновик на сервере**
        - Что переживёт: смену устройства.
        - Цена: нужны API и хранение.

      Из-за второго пункта пароли и данные карт в хранилище браузера не пишут никогда, даже ради удобства.

      **Предупреждение о несохранённом.** Если человек закрывает вкладку посреди формы, браузер может спросить
      «Покинуть сайт?» через событие `beforeunload`; переходы внутри приложения перехватывает роутер. Как работает
      это событие и почему на телефоне нельзя полагаться на предупреждение, разобрано в уроке курса 1 «Что
      переживает перезагрузку». Для форм важно одно: предупреждать, только если форма изменена, то есть в ней есть
      поля, отличающиеся от исходных.

      ## Пример целиком: подключение ресторана

      Соберём всё вместе. Форма из трёх шагов, данные лежат в общем состоянии формы, номер шага — в адресе, черновик
      сохраняется в хранилище браузера (реквизиты банка туда не пишем).

      1. **Шаг 1.** Владелец вводит название, телефон и короткое имя. Телефон проверяется при уходе из поля;
         он ошибся в одной цифре — под полем «Введите 10 цифр после +7». Исправляет, и ошибка исчезает на первом же
         нажатии.
      2. **Короткое имя.** Владелец вводит «pelmeni»; через 400 мс после паузы уходит проверка, ответ — «занято».
         Он дописывает «-na», задумывается — уходит проверка «pelmeni-na»; дописывает «-lesnoy» — уходит ещё одна.
         Ответ на «pelmeni-na» задержался и пришёл последним: отменить его не успели, он уже был в пути. Его
         отбросила сверка значения — оно не совпадает с полем. Под полем «pelmeni-na-lesnoy — свободно».
      3. **«Далее».** Проверяются только поля шага 1. Адрес меняется на `?step=2`.
      4. **Шаг 2 и шаг 3.** Владелец вводит адрес и часы работы, потом реквизиты. На шаге 3 он нажимает «Назад» —
         шаг 2 заполнен, ничего не пропало.
      5. **Отправка.** Кнопка блокируется сразу при нажатии. Сервер отвечает 422: имя `pelmeni-na-lesnoy` заняли
         пять минут назад, а ИНН не найден.
      6. **Ответ сервера.** Клиент показывает список из двух ошибок над формой и переходит на шаг 1, к первой из них.
         Под полем имени — «Это имя уже занято», фокус в поле. Ошибка ИНН ждёт на шаге 3. Всё остальное на месте.
      7. **Исправление.** Владелец меняет имя, переходит к реквизитам, исправляет ИНН и отправляет снова. Успех —
         черновик в хранилище браузера удаляется.

      ## Типичные ошибки

      - **Считать клиентскую проверку защитой.** Запрос в обход формы пройдёт мимо неё. Окончательно решает сервер.
      - **Клиент строже сервера.** Человек не может отправить правильные данные, потому что регулярное выражение
        на клиенте не знает про скобки в телефоне.
      - **Ругаться на недописанное.** Ошибка после первой буквы раздражает и учит не читать сообщения.
      - **Показывать результат любого пришедшего ответа асинхронной проверки.** Устаревший ответ ставит галочку
        «свободно» под чужим значением.
      - **Считать галочку «свободно» гарантией.** Без повторной проверки на сервере два человека получат одно имя.
      - **Выводить ошибку сервера одной строкой сверху.** «Ошибка 422» не говорит, что исправлять.
      - **Очищать форму после ошибки.** Второй раз заполнять станут не все.
      - **Хранить данные шага внутри шага.** «Назад» стирает введённое.

      ## Как спрашивают на интервью

      - «Спроектируйте форму регистрации с проверкой, свободен ли логин. Какие проблемы вы видите?» — ждут гонку
        ответов проверки, сверку значения и повторную проверку на сервере при сохранении.
      - «Где вы будете проверять данные формы: на клиенте или на сервере? Почему?»
      - «Как вы покажете ошибки, которые вернул сервер, в многошаговой форме?»

      ## Коротко

      - Проверка на клиенте — мгновенная подсказка, а не защита: её легко обойти. Окончательно решает сервер, и многие
        правила может проверить только он: свободно ли имя, существует ли компания с таким ИНН, входит ли адрес в зону
        доставки.
      - Правило в двух местах может разъехаться, поэтому его текст — серверный, а клиентскую копию лучше делать мягче,
        а не строже. Иногда расхождение снимают общей схемой вроде JSON Schema или Zod.
      - Хорошо работает сочетание: пока поле впервые заполняют, его не трогают, при уходе из поля проверяют, а
        показанную ошибку перепроверяют при каждом вводе (режим `onTouched` в React Hook Form). Исключения —
        подсказки, полезные при вводе, например надёжность пароля или свободное имя.
      - Хорошее сообщение стоит рядом с полем, говорит, как исправить, и держится не только на цвете. Оно связано с
        полем через `aria-describedby` и `aria-invalid`, а при отправке с ошибками фокус уходит на первое неверное
        поле.
      - Асинхронную проверку защищают от гонки сверкой значения: ответ применяют, только если проверенное значение
        совпадает с тем, что сейчас в поле. Галочка «свободно» — подсказка, и сервер проверяет уникальность ещё раз
        при сохранении.
      - Серверные ошибки приходят с указателем на поле, например в формате problem details с кодом 422, и показываются
        под нужным полем. Ввод остаётся на месте, а кнопка «Повторить» при ошибке проверки бесполезна.
      - В многошаговой форме данные держат выше шагов, на «Далее» проверяют только текущий шаг, а к серверной ошибке
        на прошлом шаге переходят сами.

      ## Источники

      - [Валидация форм на стороне клиента — MDN](https://developer.mozilla.org/ru/docs/Learn_web_development/Extensions/Forms/Form_validation)
      - [Forms Tutorial: User Notifications — W3C WAI](https://www.w3.org/WAI/tutorials/forms/notifications/)

  - id: sdd-failures
    topic: Надёжность и восстановление
    subtopic: Виды отказов
    title: Какие бывают сбои
    audio: https://color-zebra.github.io/frontend-quiz-audio/system-design-data/sdd-failures.mp3
    body: |
      ## Какую проблему решаем

      Вечер пятницы, человек оформляет заказ в сервисе доставки еды. Он едет в метро, связь то появляется, то
      пропадает. Нажимает «Оформить заказ» — и через пятнадцать секунд видит красную плашку «Что-то пошло не так».

      Что ему теперь делать? Заказ создан или нет? Если нажать ещё раз, не получится ли два заказа? А если
      не нажимать, приедет ли еда? Плашка не отвечает ни на один из этих вопросов. Человек звонит
      в поддержку или просто уходит к конкуренту.

      Беда здесь не в том, что произошёл сбой: сбои в сети неизбежны, об этом был вводный урок этого курса, «Почему сеть
      всё усложняет». Беда в том, что приложение сложило очень разные ситуации в одну. «Нет сети», «сервер перегружен»,
      «в адресе нет номера дома» и «запрос ушёл, но ответ не дошёл» требуют разного поведения — и от приложения,
      и от человека. Этот урок учит их различать. Следующие уроки опираются на это различение: в уроке «Когда и как
      повторять» мы решим, какие сбои стоит повторять сами, а в уроке «Как не потерять работу пользователя» — что
      показывать человеку.

      ## Где может сломаться запрос

      Каждый запрос проходит три участка, и сломаться может любой:

      1. **Устройство.** Телефон в самолёте, Wi-Fi без интернета, браузер заблокировал запрос. Запрос даже не ушёл.
      2. **Путь.** Запрос ушёл, но связь медленная или оборвалась посреди дороги. Ответ задерживается или не приходит
         совсем.
      3. **Сервер.** Запрос дошёл, и сервер ответил — но ответил отказом: «так нельзя», «я сломался», «попробуй
         позже».

      От участка зависит главное — знаем ли мы, что произошло на сервере. Если запрос не ушёл, сервер точно ничего не
      сделал. Если пришёл ответ, сервер сказал нам, что сделал. А если запрос ушёл и ответ потерялся, мы не знаем ничего.

      ## Виды сбоев

      Разберём сбои, которые фронтенд встречает чаще всего. Для каждого — как он выглядит в коде и что он значит.

      ### Нет сети

      **Офлайн** (offline) — устройство не может достучаться до сервера. В коде это выглядит так: промис `fetch`
      отклоняется с ошибкой `TypeError` вместо того, чтобы вернуть ответ.

      Есть тонкость: с той же ошибкой `TypeError` `fetch` отклоняется и при других проблемах — сервер не нашёлся по
      имени, соединение сбросилось, браузер отказал по правилам CORS. Поэтому по самой ошибке нельзя уверенно сказать
      «у человека нет интернета». Подсказкой служит свойство `navigator.onLine` и события `online` и `offline`, но
      и они ненадёжны. Если `navigator.onLine` равно `false`, сети, скорее всего, действительно нет. Если `true` — это
      значит лишь, что устройство подключено к какой-то сети, например к домашнему роутеру, у которого самого нет
      интернета. MDN прямо советует не отключать функции по этому признаку, а использовать его только как подсказку
      человеку.

      ### Тайм-аут

      **Тайм-аут** (timeout) — ответ не пришёл за отведённое время, и клиент перестал ждать. Важно: у `fetch` нет
      своего тайм-аута. Если его не задать, запрос может висеть минутами, пока не сдастся браузер или операционная
      система, а человек всё это время смотрит на крутящийся значок. Тайм-аут задают явно, например через
      `AbortSignal.timeout(10000)`: по истечении времени запрос отменяется с ошибкой `TimeoutError`.

      Главное свойство тайм-аута: **клиент не знает, что произошло на сервере.** Запрос мог не дойти. Мог дойти
      и выполниться, а потерялся ответ. Мог всё ещё выполняться. Отмена ожидания на клиенте не отменяет работу
      на сервере — об этом подробно в уроке «Гонки запросов».

      ### Сервер ответил ошибкой клиента: 4xx

      Коды **4xx** (ошибки клиента) означают: сервер получил запрос и отказался его выполнять, потому что с запросом
      что-то не так. Повторять тот же запрос без изменений бессмысленно — сервер ответит то же самое. Что-то должно
      измениться: данные, права, вход в систему.

      В коде такой ответ выглядит иначе, чем офлайн: промис `fetch` не отклоняется, а возвращает ответ, у которого
      `response.ok` равно `false`, а в `response.status` лежит код. То же верно и для кодов 5xx ниже. Поэтому
      проверять `response.ok` нужно самому — без этой проверки код примет ответ с ошибкой за успех.

      Внутри этой группы стоит различать несколько случаев, потому что исправляет их разный человек.

      - **400, 422**
        - Что значит: данные неверны — не заполнено поле, неправильный формат.
        - Кто исправит: пользователь, если сервер сказал, какое поле.
      - **401**
        - Что значит: сервер не знает, кто вы, — вход истёк.
        - Кто исправит: приложение обновит доступ или попросит войти снова.
      - **403**
        - Что значит: сервер знает, кто вы, но вам нельзя.
        - Кто исправит: обычно никто прямо сейчас.
      - **404**
        - Что значит: того, к чему обращаетесь, нет.
        - Кто исправит: обычно никто — ресторан удалён, ссылка устарела.
      - **409, 412**
        - Что значит: конфликт, данные успели измениться.
        - Кто исправит: приложение перечитает данные, человек решит заново.
        - Исключение: 409 на повтор с ключом идемпотентности, пока первая попытка ещё выполняется (урок «Повторы без
          двойных списаний»). Это «подождите»: повторить позже с тем же ключом. Различают по телу ответа — сервер
          сообщает тип ошибки.
      - **429**
        - Что значит: слишком много запросов.
        - Кто исправит: время — подождать и повторить.

      **Ошибка валидации** (validation error) — отдельный и самый дружелюбный случай: сервер проверил данные и сообщил,
      какие поля неверны. Обычно это 400 или 422 с перечнем полей. Человек может всё исправить сам, если ему показали,
      что именно. Как показать серверные ошибки рядом с полями и не стереть ввод — в уроке «Формы и валидация».

      **Конфликт версий** — сервер отказал, потому что данные на нём изменились с тех пор, как клиент их прочитал.
      Например, два менеджера ресторана одновременно правят одно блюдо. Код 409 (Conflict) или 412 (Precondition
      Failed). Повтор того же запроса не поможет: надо перечитать свежие данные. Как такие конфликты находят и решают —
      в уроке «Версии и конфликты». С кодом 401 и обновлением доступа разбирается урок «Сессия и обновление токена».

      Код 429 выбивается из группы: запрос в порядке, просто клиент спешит. Поможет время, а не исправление. Обычно
      его отдаёт ограничитель частоты на входе в сервис — ещё до того, как операция началась. Поэтому 429 обычно
      можно повторить после паузы даже для записи; подробно — в уроке «Когда и как повторять».

      ### Сервер сломался: 5xx

      Коды **5xx** (ошибки сервера) означают: запрос, возможно, был правильным, но сервер не смог его обработать.

      - **500** (Internal Server Error) — внутренняя ошибка, чаще всего баг или упавшая база.
      - **502** (Bad Gateway) — промежуточный сервер (шлюз) получил от сервера за ним неправильный ответ.
      - **503** (Service Unavailable) — сервер перегружен или на обслуживании; обычно это ненадолго.
      - **504** (Gateway Timeout) — шлюз не дождался ответа от сервера за ним.

      Многие 5xx — **временные сбои** (transient failures): через несколько секунд тот же запрос пройдёт. Сервер
      перезапустился, нагрузка спала. Поэтому запросы на чтение после 5xx, в отличие от 4xx, имеет смысл повторить.

      С записью у 5xx есть ловушка. 502 и 504 отдаёт не тот сервер, который выполняет операцию, а промежуточный —
      тот, что стоит перед ним. 504 значит «я не дождался ответа», а не «операция не выполнялась»: сервер за шлюзом
      вполне мог довести её до конца. С 500 похоже: сервер мог сломаться на середине работы — заказ уже записан,
      а ответить не успел. Даже 503 иногда отдаёт балансировщик нагрузки, когда связь с сервером за ним оборвалась
      уже после того, как запрос ушёл дальше. Поэтому для записи любой ответ 5xx, если API не обещает иного, —
      **неизвестный исход**: операция могла выполниться, а могла нет. Подробнее о нём — ниже, а что делать с записью
      с ключом идемпотентности после каждого из этих кодов, — в следующем уроке, «Когда и как повторять».

      ## Два вопроса к любому сбою

      Список кодов полезен, но решения принимают по двум вопросам.

      **Вопрос 1. Поможет ли повтор того же запроса?** Если сбой временный — да: сеть вернётся, сервер оживёт. Если
      постоянный (permanent) — нет: неверные данные останутся неверными, удалённый ресторан не появится.

      **Вопрос 2. Кто может это исправить?** С точки зрения человека сбой бывает **исправимым** (recoverable) — он может
      что-то сделать и всё-таки достичь цели: подождать, исправить поле, войти заново, выйти из подвала. Или
      **неисправимым** (unrecoverable) — сделать ничего нельзя: доступа нет, блюдо сняли с продажи. Человеку не нужен
      код ошибки. Ему нужно понять, что случилось, что сохранилось и что делать дальше.

      Вот как отвечают на эти вопросы для каждого вида сбоя.

      - **Нет сети, запрос не ушёл.** Повтор поможет, когда сеть вернётся. Приложение ждёт сеть.
      - **Тайм-аут или 5xx при чтении.** Повтор, скорее всего, поможет. Приложение повторяет с паузой.
      - **Тайм-аут, обрыв или 5xx при записи.** Неизвестно, выполнилась ли операция. Приложение выясняет исход, а не
        повторяет вслепую.
      - **Валидация.** Повтор не поможет, пока человек не исправит данные. Приложение показывает ошибки у полей.
      - **Конфликт.** Повтор не поможет. Приложение перечитывает данные.
      - **429.** Повтор поможет после паузы, которую назвал сервер. Приложение ждёт и повторяет.
      - **403, 404 и другие отказы по существу.** Повтор не поможет. Приложение прекращает попытки.

      Что при этом показать человеку и какой путь восстановления ему дать, — в уроке «Как не потерять работу
      пользователя».

      ## Неизвестный исход записи

      Для **чтения** (загрузить меню, список ресторанов) неизвестный исход не страшен. Мы не знаем, дошёл ли запрос, —
      ну и пусть: повторный запрос ничего не меняет на сервере, просто спросим ещё раз.

      Для **записи** (создать заказ, оплатить, отправить сообщение) всё иначе. В уроке «Повторы без двойных списаний»
      мы разобрали, что у записи три исхода — успех, отказ и «неизвестно», — и как выяснить правду с помощью ключа
      идемпотентности и проверки статуса. Здесь важно, какие сбои попадают в «неизвестно»: тайм-аут, обрыв связи
      посреди запроса и любые ответы 5xx — 500, 502, 504 и даже 503, — если API не обещает иного.

      Чем неизвестный исход отличается от временного сбоя? Временный сбой лечится повтором. Неизвестный исход записи
      повтором не лечится, пока сервер не умеет узнавать повторы: второй запрос может выполнить операцию второй раз.
      Поэтому это отдельный вид сбоя, а не разновидность «ошибки», и показывают его отдельным сообщением.

      ## Медленная сеть — тоже сбой

      Медленная сеть коварнее, чем пропавшая. Офлайн видно сразу, а медленный запрос выглядит как нормальный — только
      бесконечный. Человек не понимает, ждать ли дальше, и начинает нажимать кнопку снова.

      Проектируя поведение на медленной сети, отвечают на три вопроса.

      **Сколько ждать.** Тайм-аут выбирают по операции: загрузка меню и оплата живут по-разному. Слишком короткий
      тайм-аут обрывает запросы, которые вот-вот завершились бы, особенно у людей на плохой мобильной связи. Слишком
      длинный оставляет человека перед вечным индикатором. Хорошая отправная точка — время, за которое запрос
      укладывается у самых медленных пользователей, с запасом.

      **Что показывать, пока ждём.** Якоб Нильсен из Nielsen Norman Group называет три границы
      ([Response Times: The 3 Important Limits](https://www.nngroup.com/articles/response-times-3-important-limits/)):
      до 0,1 секунды реакция кажется мгновенной; после 1 секунды нужен знак, что система работает; после 10 секунд
      человек теряет внимание, и ему нужен показатель прогресса и способ прервать операцию. Отсюда ступенчатая
      индикация: сначала ничего, через секунду — индикатор, через несколько секунд — текст «Связь медленная, всё ещё
      отправляем».

      Индикатор показывают с задержкой, а кнопку блокируют сразу, в момент первого нажатия, — почему, разобрано
      в уроке «Повторы без двойных списаний».

      **Что сохранить.** Введённое человеком не должно пропасть ни при каком исходе. Адрес, комментарий курьеру, текст
      отзыва остаются в полях, пока сервер не подтвердил сохранение. Подробно — в уроке «Как не потерять работу
      пользователя».

      ## Как отличить сбои в коде

      Чтобы интерфейс мог вести себя по-разному, код должен различать сбои. Удобно свести всё в одну функцию, которая
      превращает любой исход запроса в понятную категорию. Остальной код смотрит уже на категорию, а не на коды
      и исключения.

      ```ts
      type Failure =
        | { kind: 'aborted' }      // отменили сами (человек ушёл с экрана) — ничего не показываем
        | { kind: 'network' }      // ответа нет: офлайн, DNS, CORS, обрыв
        | { kind: 'timeout' }      // ответа нет: не дождались
        | { kind: 'validation'; fields: Record<string, string> }
        | { kind: 'unauthorized' }
        | { kind: 'conflict' }
        | { kind: 'in-progress' }  // 409 на повтор с ключом: первая попытка ещё выполняется
        | { kind: 'rate-limited'; retryAfter: string | null }
        | { kind: 'server'; status: number }   // для записи — неизвестный исход
        | { kind: 'fatal'; status: number };

      // fetch отклонился — ответа от сервера нет
      function classifyError(error: unknown): Failure {
        if (error instanceof DOMException && error.name === 'AbortError') return { kind: 'aborted' };
        if (error instanceof DOMException && error.name === 'TimeoutError') return { kind: 'timeout' };
        return { kind: 'network' };
      }

      // ответ пришёл, но response.ok === false
      function classifyResponse(response: Response, body: { code?: string; fields?: Record<string, string> }): Failure {
        const status = response.status;
        if (status === 400 || status === 422) return { kind: 'validation', fields: body.fields ?? {} };
        if (status === 401) return { kind: 'unauthorized' };
        if (status === 409 && body.code === 'idempotency_in_progress') return { kind: 'in-progress' };
        if (status === 409 || status === 412) return { kind: 'conflict' };
        if (status === 429) return { kind: 'rate-limited', retryAfter: response.headers.get('Retry-After') };
        if (status >= 500) return { kind: 'server', status };
        return { kind: 'fatal', status }; // 403, 404 и прочие
      }
      ```

      Это набросок, а не готовая библиотека. Важна идея: два входа — «ответа нет» и «ответ с ошибкой» — разобраны
      отдельно, потому что промис `fetch` отклоняется только в первом случае, а во втором возвращает ответ
      с `response.ok`, равным `false`. Собственная отмена (`AbortError`) отделена от сбоя сети, `timeout` — от
      `network`, валидация — от прочих 4xx, а разбор формы ответа сервера живёт в одном месте. Формат ошибок,
      который удобно разбирать клиенту, — тема урока курса 1 «Контракт API глазами фронтенда».

      ## Пример целиком: кнопка «Оформить заказ»

      Вернёмся к человеку в метро. Экран оформления отправляет запрос на создание заказа. Перед отправкой клиент
      создаёт идентификатор операции, и сервер по нему узнаёт повторы этого запроса — так устроено в уроке
      «Повторы без двойных списаний». Оплата идёт следующим шагом, и для неё действуют те же правила. Разберём,
      что приложение делает при каждом исходе.

      1. **Устройство офлайн до нажатия.** `navigator.onLine` равно `false`. Кнопка остаётся доступной, но рядом
         подсказка «Нет связи». Если человек всё же нажал, запрос не уходит или сразу падает с `TypeError`. Сервер
         точно ничего не сделал. Пишем: «Нет связи, заказ не отправлен. Корзина и адрес сохранены».
      2. **Запрос ушёл, связь медленная.** Кнопка блокируется сразу, в момент нажатия, чтобы не было второго
         запроса. Через секунду на ней появляется «Отправляем…», через пять секунд добавляется строка «Связь
         медленная, не закрывайте страницу».
      3. **Тайм-аут через 15 секунд.** Исход неизвестен. Приложение не пишет «Ошибка» и не предлагает просто нажать
         ещё раз. Оно показывает «Проверяем, создан ли заказ» и повторяет запрос с тем же идентификатором операции:
         если первый запрос успел выполниться, сервер узнает повтор и вернёт тот же заказ, а не создаст второй.
         Ответ сервера «заказа пока нет» окончательным не считают: первый запрос мог застрять в пути и выполниться
         через минуту. Только когда сервер ответил окончательно — заказ создан или точно отклонён, — приложение
         пишет, что произошло.
      4. **422 «в адресе нет номера дома».** Сервер ничего не создал. Подсвечиваем поле адреса, остальное не трогаем.
      5. **409 «цена блюда изменилась».** Перечитываем корзину, показываем новую сумму и просим подтвердить.
      6. **503 «сервис перегружен».** Для записи это может быть и неизвестный исход, но запрос несёт идентификатор
         операции, поэтому его можно повторить с паузой — как именно, разберём в следующем уроке. Если повторы
         не помогли: «Сервис перегружен, попробуйте через минуту. Корзина сохранена».
      7. **Отказ по существу: ресторан только что закрылся.** Сервер отвечает ошибкой 4xx с причиной. Повторять
         бесполезно, ждать тоже. Объясняем причину и ведём к выбору другого ресторана.

      Обратите внимание: в каждом сообщении человек узнаёт три вещи — что произошло, что сохранилось и что делать.
      Как формулировать такие сообщения, разобрано в уроке курса 1 «Загрузка, пустота, ошибка и всё между ними».

      ## Типичные ошибки

      - **Одно сообщение на все случаи.** «Что-то пошло не так» после оплаты заставляет человека гадать и звонить
        в поддержку.
      - **Любое отклонение `fetch` считать отсутствием интернета.** Та же ошибка бывает из-за CORS и DNS. Человек
        с отличной связью видит «Проверьте подключение» и ищет проблему у себя.
      - **Верить `navigator.onLine`, когда оно равно `true`.** Подключение к роутеру не означает доступ к серверу.
      - **Не задавать тайм-аут.** Без него индикатор на медленной сети крутится минутами.
      - **Считать тайм-аут или 500 на запись отказом** и предлагать «Повторить» без защиты от дублей — путь
        к двойному заказу и двойному списанию. Считать их успехом — путь к заказу, которого нет.
      - **Блокировать кнопку с задержкой.** Двойной щелчок успевает раньше, и уходят два запроса.
      - **Повторять 4xx.** Сервер отказал по существу, повтор ничего не изменит и только нагрузит его.
      - **Стирать ввод при ошибке.** Человек заполнил форму, сервер упал, форма пустая — второй раз заполнять не станут.

      ## Как спрашивают на интервью

      - «Что увидит пользователь, если сеть пропала в момент отправки?» — ждут, что вы различите «не ушло» и «ушло,
        но ответа нет».
      - «Как вы будете обрабатывать ошибки API в этом приложении?» — хороший ответ начинается с видов сбоев и того,
        кто может их исправить, а не с «покажем тост».

      ## Коротко

      - Запрос ломается на устройстве, в пути или на сервере, и от этого зависит, знаем ли мы, что сделал сервер. Не
        ушёл — сервер точно ничего не сделал, пришёл ответ — сервер сказал, а потерялся ответ — мы не знаем ничего.
      - `fetch` отклоняется с `TypeError` не только без сети, но и при ошибках DNS, CORS и сбросе соединения.
        `navigator.onLine === true` не значит, что сервер доступен.
      - У `fetch` нет своего тайм-аута, его задают явно, например `AbortSignal.timeout`. Ответы 4xx и 5xx промис не
        отклоняют, поэтому `response.ok` проверяют сами.
      - 4xx значит, что сервер получил запрос и отказался, и повтор без изменений обычно не поможет: неверные данные
        (400, 422) исправляет человек, при 401 приложение обновляет доступ или просит войти, при конфликте (409, 412)
        перечитывает данные. 403 и 404 обычно не исправит никто.
      - 429 выбивается из группы: клиент просто спешит, а ограничитель обычно отвечает до начала операции, поэтому 429
        обычно можно повторить после паузы даже для записи. 409 на повтор с ключом, пока первая попытка выполняется, —
        тоже «подождите»: его повторяют позже с тем же ключом, а от 409-конфликта отличают по типу ошибки в теле
        ответа.
      - 5xx часто временные, и чтение после них повторяют. Тайм-аут, обрыв связи посреди запроса и любой 5xx на
        запись, если API не обещает иного, — неизвестный исход: приложение выясняет его, а не повторяет вслепую.
      - Решения принимают по двум вопросам: поможет ли повтор (временный или постоянный сбой) и кто может это
        исправить. Сообщение человеку говорит, что произошло, что сохранилось и что делать.
      - Медленная сеть — тоже сбой: тайм-аут выбирают по операции, а индикацию делают ступенчатой по границам Нильсена
        (0,1, 1 и 10 секунд). Кнопку при этом блокируют сразу, не дожидаясь индикатора.

      ## Источники

      - [Коды состояния ответа HTTP — MDN](https://developer.mozilla.org/ru/docs/Web/HTTP/Reference/Status)
      - [Использование Fetch: проверка успешности запроса — MDN](https://developer.mozilla.org/ru/docs/Web/API/Fetch_API/Using_Fetch#проверка_успешности_запроса)
      - [Navigator: onLine property — MDN](https://developer.mozilla.org/en-US/docs/Web/API/Navigator/onLine)

  - id: sdd-retry
    topic: Надёжность и восстановление
    subtopic: Политика повторов
    title: Когда и как повторять
    audio: https://color-zebra.github.io/frontend-quiz-audio/system-design-data/sdd-retry.mp3
    body: |
      ## Какую проблему решаем

      Пятница, 19:00, пик заказов в сервисе доставки еды. Сервер, который отдаёт меню ресторанов, перезапускается и
      десять секунд не отвечает. В этот момент меню открыто у 20 000 человек.

      Первая мысль разработчика — повторить запрос, если он упал. Временные сбои ведь проходят сами: сервер поднимется,
      и повтор удастся. Это правда. Но посмотрим, как именно повторять.

      **Вариант «сразу и до победы».** Каждый клиент повторяет запрос немедленно после неудачи, без паузы. Пока сервер
      лежит, каждый из 20 000 клиентов шлёт десятки запросов в секунду. Когда сервер поднимается, его встречает не
      обычная нагрузка, а стена из сотен тысяч запросов. Он снова падает под ней — и клиенты снова начинают долбить.
      Сбой, который длился бы десять секунд, растягивается на десятки минут.

      Это явление называют **лавиной повторов** (retry storm), а одновременный наплыв клиентов на только что
      поднявшийся сервер — **проблемой громового стада** (thundering herd). Повторы, задуманные как лекарство, сами
      становятся причиной сбоя.

      Политика повторов (retry policy) — это ответ на четыре вопроса: что повторять, сколько ждать между попытками,
      когда остановиться и где в системе повторять. Разберём их по очереди.

      ## Что повторять

      В уроке «Какие бывают сбои» мы разделили сбои на временные и постоянные. Автоматический повтор имеет смысл,
      только если выполнены три условия.

      1. **Сбой временный.** Повтор того же запроса может пройти: сеть вернётся, перегрузка спадёт. Ошибка валидации,
         отказ в доступе или конфликт версий от повтора не исчезнут.
      2. **Повтор безопасен.** Чтение (GET) можно повторять сколько угодно — оно ничего не меняет на сервере. Запись
         повторять можно, только если она **идемпотентна** (idempotent) — напомним, это значит, что повторный запрос
         даёт тот же эффект, что и первый. Спецификация HTTP относит к идемпотентным методы GET, PUT и DELETE, но
         не POST. Как сделать идемпотентной запись вроде оплаты с помощью ключа идемпотентности, разобрано в уроке
         «Повторы без двойных списаний».
      3. **Результат ещё кому-то нужен.** Если человек ушёл с экрана меню, повторять загрузку этого меню незачем.
         Повторы при уходе отменяют.

      Вот что из этого следует для разных сбоев:

      - **Сеть не ответила, тайм-аут**
        - Чтение: повторить.
        - Запись без защиты от дублей: не повторять — исход неизвестен.
      - **502, 503, 504**
        - Чтение: повторить.
        - Запись без защиты от дублей: не повторять — исход неизвестен.
      - **500**
        - Чтение: один-два раза, часто это баг.
        - Запись без защиты от дублей: не повторять — исход неизвестен.
      - **429**
        - Чтение: повторить после паузы, которую назвал сервер.
        - Запись без защиты от дублей: обычно можно, тоже после паузы.
      - **400, 403, 404, 409, 412, 422**
        - Чтение и запись: не повторять.
      - **401**
        - Чтение и запись: не повторять как есть — сначала обновить доступ.

      Если у записи есть ключ идемпотентности (урок «Повторы без двойных списаний»), правила другие:

      - **Тайм-аут, обрыв, 502, 503, 504** — повторить с тем же ключом, с паузой и лимитом: сервер узнает повтор.
      - **500** — не повторять, а выяснить исход запросом статуса: сервер мог сохранить этот 500 вместе с ключом
        и будет возвращать его на каждый повтор.
      - **409 «операция с этим ключом ещё выполняется»** — повторить позже с тем же ключом: это не отказ,
        а «подождите».

      Почему к 429 мягче, чем к 503, хотя оба значат «приходите позже»? Дело в том, кто их отдаёт. 429 обычно отдаёт
      ограничитель частоты на входе в сервис — ещё до того, как операция началась. 503 отдаёт не только сам
      перегруженный сервер, но и балансировщик или прокси перед ним, в том числе когда связь с сервером оборвалась
      уже после того, как запрос ушёл дальше. Поэтому про 503 на запись нельзя сказать, что операция точно не
      начиналась, — это неизвестный исход, как и 500, 502, 504 (урок «Какие бывают сбои»). Если API прямо обещает,
      что при 503 запрос не выполнялся, или если ваш 429 устроен иначе, правила меняются вслед за обещанием API.

      О коде 401 и обновлении доступа — урок «Сессия и обновление токена».

      Отдельный случай — **офлайн**. Если `navigator.onLine` равно `false`, тратить попытки бессмысленно: каждая
      заведомо упадёт. Лучше дождаться события `online` и только тогда повторить.

      ## Сколько ждать между попытками

      ### Постоянная пауза

      Самое простое — ждать каждый раз одинаково, например две секунды. Это лучше, чем без паузы, но плохо по двум
      причинам. Если сбой короткий, две секунды — лишнее ожидание для человека. Если долгий, клиенты продолжают давить
      на сервер с одной и той же частотой, сколько бы он ни лежал.

      ### Экспоненциальная задержка

      **Экспоненциальная задержка** (exponential backoff) — пауза удваивается с каждой попыткой: 0,5 секунды, потом 1,
      2, 4, 8. Первые повторы быстрые и хорошо справляются с короткими сбоями. Если сбой затянулся, клиенты всё реже
      беспокоят сервер и дают ему подняться.

      Паузу ограничивают сверху, иначе она быстро вырастет до бесконечности. Получается формула:

      ```
      пауза = min(потолок, база × 2^номер_попытки)
      ```

      С базой 0,5 секунды и потолком 8 секунд паузы будут 0,5; 1; 2; 4; 8; 8; 8 секунд.

      ### Случайный разброс

      Похожий приём мы уже встречали в уроке «Когда данные устаревают»: случайная пауза перед перезапросом, когда
      сервер разослал уведомление тысячам экранов. Здесь разберём его как следует.

      У экспоненциальной задержки есть скрытый изъян. Вернёмся к 20 000 клиентам, и пусть база паузы — 1 секунда.
      Сервер упал для всех в одну и ту же секунду, все они начали отсчёт одновременно — и все подождут одинаково:
      ровно секунду, потом ровно две, потом ровно четыре. Повторы придутся на 1-ю, 3-ю и 7-ю секунду после сбоя —
      не равномерно, а **пачками**: 20 000 запросов в одно мгновение, затем тишина, затем снова 20 000.

      Посчитаем. Пусть сервер выдерживает 5 000 запросов в секунду. Пачка в 20 000 запросов в одно мгновение вчетверо
      больше того, что он обработает за целую секунду. Около трёх четвертей запросов снова получат отказ или тайм-аут,
      и их отправители снова придут вместе.

      Лекарство — **случайный разброс** (jitter): каждый клиент ждёт не ровно вычисленную паузу, а случайное время
      в её пределах. Марк Брукер из AWS сравнил несколько вариантов разброса в статье «Exponential Backoff And Jitter».
      Самый простой из них — **полный разброс** (full jitter):

      ```
      пауза = случайное_число(0, min(потолок, база × 2^номер_попытки))
      ```

      Для третьего повтора потолок паузы — 4 секунды. Если 20 000 клиентов ждут случайное время от 0 до 4 секунд,
      за каждую секунду к серверу приходит в среднем 20 000 ÷ 4 = 5 000 запросов — ровно столько, сколько
      он выдерживает. Те же запросы, растянутые во времени, сервер обрабатывает, а собранные в пачку — нет.

      ![Два графика одной волны повторов у 20 000 клиентов с паузой 4 секунды. Сверху — без разброса: все 20 000 запросов приходят разом на 4-й секунде, столбец намного выше линии «сервер выдерживает 5 000 в секунду», до этого тишина. Снизу — с полным разбросом: около 5 000 запросов в каждую из четырёх секунд, вровень с этой линией](images/sdd-jitter.png "Повторы без разброса приходят пачками, с разбросом — равномерно")

      В моделировании Брукера разброс сократил общее число запросов к перегруженному ресурсу больше чем вдвое
      и ускорил завершение работы всех клиентов. Его вывод в одной фразе: решение не в том, чтобы убрать задержку,
      а в том, чтобы добавить к ней разброс. В той же статье есть и другие варианты — «равный» (equal jitter) и
      «декоррелированный» (decorrelated jitter) разброс. Полный в моделировании сделал меньше всего лишних запросов,
      декоррелированный закончил чуть быстрее; выбор между ними автор называет неочевидным. Для фронтенда полный
      разброс хорош тем, что его формула умещается в одну строку.

      ## Когда остановиться

      Повторы без предела — та же лавина, только растянутая. У политики повторов всегда есть **лимит**, и обычно не один.

      - **Число попыток.** Для запроса, которого ждёт человек, разумно три–пять попыток. Дальше вероятность успеха
        мала, а человек уже устал смотреть на индикатор.
      - **Общий срок.** «Повторяем, пока не пройдёт 20 секунд с первой попытки». Срок удобнее числа попыток, когда
        паузы случайные: он прямо говорит, сколько человек прождёт в худшем случае.
      - **Бюджет повторов** (retry budget). Повторы разрешены, пока их немного относительно обычных запросов. В статье
        AWS Builders' Library «Timeouts, retries, and backoff with jitter» описан приём с **корзиной жетонов** (token
        bucket): каждый повтор тратит жетон, жетоны медленно пополняются. Пока сбоев мало, жетонов хватает. При
        массовом отказе они быстро кончаются, и дальше клиент повторяет лишь с небольшой постоянной частотой, почти
        не добавляя нагрузки.

      Родственный приём — **предохранитель** (circuit breaker): после серии отказов клиент на время перестаёт
      обращаться к сервису вовсе и сразу показывает запасное поведение, а потом пробует одним запросом, ожил ли
      сервис. Подробнее — в курсе «Большие приложения», в теме «Архитектура под ограничениями».

      Когда лимит исчерпан, автоматика сдаётся, и решение переходит к человеку: «Не удалось загрузить меню»
      и кнопка «Повторить». Как сформулировать такое сообщение и не потерять ввод — в уроке «Как не потерять работу
      пользователя».

      ## Где повторять

      Запрос фронтенда часто проходит через несколько слоёв: браузер → промежуточный сервер для фронтенда (BFF, о нём
      урок курса 1 «Контракт API глазами фронтенда») → сервис меню → база данных. Если каждый слой повторяет сам,
      попытки перемножаются.

      Пусть фронтенд делает до 3 попыток, BFF на каждую из них — до 3 попыток к сервису меню, а сервис — до 3 попыток
      к базе. Если база лежит, одно открытие меню превращается в 3 × 3 × 3 = 27 запросов к ней. Двадцать тысяч человек —
      уже 540 000 запросов к и без того больной базе. В статье Builders' Library тот же расчёт для пяти слоёв даёт рост
      нагрузки в 243 раза (3⁵) и вывод: повторять лучше в одном месте цепочки.

      Для фронтендера отсюда практическое правило: договоритесь с бэкендом, кто повторяет. Если BFF уже повторяет
      запросы к сервисам, клиенту достаточно одной-двух попыток.

      ## Когда сервер сам говорит, сколько ждать

      Иногда сервер знает лучше клиента, когда приходить снова. Для этого есть заголовок ответа **`Retry-After`**.
      По спецификации HTTP (RFC 9110) сервер отправляет его с ответом 503, чтобы сказать, сколько он ещё будет
      недоступен. RFC 6585, который ввёл код 429, разрешает его и в ответе 429: сколько ждать до следующего запроса.
      Значение бывает двух видов:

      ```http
      Retry-After: 120
      Retry-After: Fri, 31 Dec 1999 23:59:59 GMT
      ```

      Первое — число секунд, второе — дата и время в формате HTTP. Подробнее — в справочнике
      [MDN о Retry-After](https://developer.mozilla.org/ru/docs/Web/HTTP/Reference/Headers/Retry-After).

      Как клиенту им пользоваться:

      - **Ждать не меньше, чем просит сервер.** Пауза из `Retry-After` заменяет собственную паузу, если она длиннее.
      - **Добавить небольшой разброс сверху.** Если сервер ответил `Retry-After: 30` всем 20 000 клиентам, без разброса
        все они придут ровно через 30 секунд — снова пачкой.
      - **Сравнить со сроком, который готов ждать человек.** Если сервер просит подождать час, держать человека перед
        индикатором бессмысленно. Честнее прекратить попытки и сказать: «Сервис на обслуживании, попробуйте позже».

      Есть техническая ловушка. Если API живёт на другом домене, скрипт видит не все заголовки ответа, а только
      немногие «безопасные» по правилам CORS, и `Retry-After` в их число не входит. Чтобы клиент мог его прочитать,
      сервер должен открыть заголовок: `Access-Control-Expose-Headers: Retry-After` — так же, как `ETag` в уроке
      «Версии и конфликты». Иначе `response.headers.get('Retry-After')` вернёт `null`, и клиент будет ждать по своей
      формуле. А если 429 отдаёт промежуточный сервер, который вообще не ставит заголовков CORS, браузер не отдаст
      скрипту даже сам ответ: `fetch` отклонится с `TypeError`, как при сбое сети.

      ## Пример целиком: загрузка меню

      Соберём политику повторов для экрана меню ресторана.

      - **Что повторяем:** загрузку меню (GET) при сетевой ошибке, тайм-ауте, 502, 503, 504 и 429. Ответы 4xx
        не повторяем. Если `navigator.onLine` равно `false`, ждём события `online`.
      - **Пауза:** полный разброс, база 0,5 секунды, потолок 8 секунд.
      - **Лимит:** 4 попытки или 20 секунд с первой — что наступит раньше.
      - **`Retry-After`:** соблюдаем, если пауза укладывается в оставшиеся 20 секунд, и добавляем до секунды разброса.
        Иначе сразу сдаёмся.
      - **Отмена:** человек ушёл с экрана — прерываем ожидание и запрос через `AbortController`.
      - **После лимита:** «Не удалось загрузить меню» и кнопка «Повторить». Нажатие начинает новую серию попыток.

      В коде это небольшая функция-обёртка:

      ```ts
      async function withRetry<T>(
        run: (signal: AbortSignal) => Promise<T>,
        isRetryable: (error: unknown) => boolean,
        retryAfterMs: (error: unknown) => number | undefined,
        signal: AbortSignal,
      ): Promise<T> {
        const base = 500, cap = 8000, maxAttempts = 4;
        const deadline = Date.now() + 20_000;             // общий срок — 20 секунд
        for (let attempt = 0; ; attempt++) {
          try {
            return await run(signal);
          } catch (error) {
            if (signal.aborted || attempt + 1 >= maxAttempts || !isRetryable(error)) throw error;
            const own = Math.random() * Math.min(cap, base * 2 ** attempt);   // полный разброс
            const fromServer = retryAfterMs(error);
            const delay = fromServer !== undefined
              ? Math.max(fromServer, own) + Math.random() * 1000  // не меньше, чем просит сервер, плюс разброс
              : own;
            if (Date.now() + delay > deadline) throw error;     // не укладываемся в срок — сдаёмся сразу
            await sleep(delay, signal);                         // прерывается, если человек ушёл
          }
        }
      }
      ```

      Кнопку «Оформить заказ» так просто не обернёшь. Создание заказа — запись, и автоматически повторять его можно
      только потому, что запрос несёт идентификатор операции и сервер узнаёт повторы (урок «Повторы без двойных
      списаний»). Без такого ключа автоматический повтор после тайм-аута мог бы создать второй заказ.

      ## Повторы в готовых библиотеках

      Многие библиотеки загрузки данных повторяют сами, и их настройки по умолчанию стоит знать. Например, TanStack
      Query повторяет упавший запрос на чтение три раза с паузой `min(1000 × 2^попытка, 30000)` миллисекунд —
      экспоненциальная задержка без случайного разброса. Изменения данных (мутации) по умолчанию не повторяются вовсе,
      а без сети повторы ставятся на паузу и продолжаются, когда связь вернётся. Учтите, что библиотека повторяет
      любую ошибку, которую бросила ваша функция загрузки, — в том числе 404 и 403, если функция бросает ошибку на
      такие ответы. Чтобы не повторять 4xx, в настройку `retry` передают функцию, которая смотрит на код ответа.
      И если у вашего сервиса тысячи клиентов, которые могут упасть одновременно, разброс стоит добавить
      в настройке `retryDelay` самостоятельно. Подробности — в
      [документации TanStack Query о повторах](https://tanstack.com/query/latest/docs/framework/react/guides/query-retries).

      ## Варианты и их цена

      - **Без повторов**
        - Что даёт: просто, ничего не усиливает.
        - Цена: каждый кратковременный сбой — ошибка на экране.
      - **Сразу и без лимита**
        - Что даёт: ничего.
        - Цена: лавина повторов, сбой затягивается.
      - **Постоянная пауза**
        - Что даёт: просто.
        - Цена: долгие сбои продолжают давить на сервер.
      - **Экспоненциальная задержка**
        - Что даёт: быстро при коротком сбое, бережно при долгом.
        - Цена: клиенты приходят пачками.
      - **Экспоненциальная задержка с разбросом и лимитом**
        - Что даёт: нагрузка растянута, ожидание ограничено.
        - Цена: немного сложнее, ожидание случайное.

      ## Типичные ошибки

      - **Повторять без паузы и без лимита.** Именно так сбой на десять секунд превращается в сбой на десятки минут.
      - **Экспоненциальная задержка без разброса** у тысяч клиентов, упавших одновременно: повторы приходят пачками.
      - **Повторять запись без защиты от дублей.** После тайм-аута оплаты автоматический повтор может списать деньги
        дважды.
      - **Повторять 4xx.** Неверные данные от повтора не станут верными, а сервер получит лишнюю нагрузку.
      - **Повторять на каждом слое.** Три слоя по три попытки — 27 запросов к упавшему сервису на одно действие.
      - **Игнорировать `Retry-After`** или, наоборот, слепо держать человека час перед индикатором.
      - **Повторять, когда результат никому не нужен:** человек ушёл с экрана, а клиент всё ещё долбит сервер.

      ## Как спрашивают на интервью

      - «Сервис лёг на минуту. Что произойдёт с вашим клиентом и с сервером, когда он поднимется?» — ждут лавину
        повторов, экспоненциальную задержку, разброс и лимит.
      - «Какие ошибки вы будете повторять автоматически, а какие нет?» — ждут связи с идемпотентностью и видом сбоя.

      ## Коротко

      - Повторы без паузы и лимита вызывают лавину повторов: клиенты встречают поднявшийся сервер стеной запросов
        (проблема громового стада), и короткий сбой растягивается на десятки минут.
      - Автоматически повторяют, только если сбой временный, повтор безопасен и результат ещё кому-то нужен. Если
        `navigator.onLine` равно `false`, попытки не тратят, а ждут события `online`.
      - Запись без защиты от дублей после тайм-аута, обрыва, 500, 502, 503 и 504 не повторяют: если API не обещает
        иного, исход неизвестен, и его выясняют, а не повторяют вслепую. 429 обычно можно повторить после паузы: его
        обычно отдаёт ограничитель частоты ещё до начала операции.
      - Запись с ключом идемпотентности после тайм-аута, обрыва, 502, 503 и 504 повторяют с тем же ключом, с паузой и
        лимитом, а после 409 «ещё выполняется» — позже с тем же ключом. После 500 не повторяют, а выясняют исход
        запросом статуса: сервер мог сохранить 500 вместе с ключом.
      - Экспоненциальная задержка удваивает паузу до потолка: `min(потолок, база × 2^попытка)`. Без случайного
        разброса упавшие одновременно клиенты приходят пачками, а полный разброс — случайная пауза от нуля до
        вычисленной — растягивает их равномерно; в сравнении Марка Брукера он дал меньше всего лишних запросов, хотя
        декоррелированный закончил чуть быстрее.
      - У повторов всегда есть лимит: число попыток (для запроса, которого ждёт человек, — три–пять), общий срок или
        бюджет повторов. После лимита решение переходит к человеку: сообщение и кнопка «Повторить».
      - Если каждый слой цепочки повторяет сам, попытки перемножаются (3 × 3 × 3 = 27), поэтому с бэкендом
        договариваются, кто повторяет.
      - `Retry-After` в ответах 503 и 429 говорит, сколько ждать: ждут не меньше, добавляют разброс и сдаются, если
        пауза длиннее, чем готов ждать человек. С другого домена заголовок виден, только если сервер открыл его в
        `Access-Control-Expose-Headers`.

      ## Источники

      - [Exponential Backoff And Jitter — Marc Brooker, AWS Architecture Blog](https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/)
      - [Timeouts, retries, and backoff with jitter — Marc Brooker, Amazon Builders' Library](https://builder.aws.com/content/3EumjoZascWd1oZiEgL8ORlv3qE/timeouts-retries-and-backoff-with-jitter)
      - [RFC 9110, раздел 10.2.3 «Retry-After»](https://www.rfc-editor.org/rfc/rfc9110.html#section-10.2.3)

  - id: sdd-autosave
    topic: Надёжность и восстановление
    subtopic: Автосохранение
    title: Автосохранение
    audio: https://color-zebra.github.io/frontend-quiz-audio/system-design-data/sdd-autosave.mp3
    body: |
      ## Какую проблему решаем

      В кабинете ресторана менеджер переписывает описание блюда: состав, вес, предупреждение об аллергенах. Кнопки
      «Сохранить» нет — изменения сохраняются сами, а в углу формы горит надпись «Сохранено». Вот три истории, которые
      случаются с такой формой, если её спроектировать небрежно.

      1. Менеджер пишет абзац, сворачивает браузер на телефоне, чтобы ответить на звонок. Через час возвращается —
         вкладка загружается заново, абзаца нет. Браузер выгрузил фоновую вкладку, а сохранение так и не успело уйти.
      2. Менеджер дописывает последнее предложение и сразу закрывает вкладку: в углу ведь было «Сохранено». Но надпись
         относилась к тексту двухсекундной давности. Последнее предложение не сохранилось.
      3. Связь медленная. Форма отправила две версии текста подряд, и старая дошла до сервера позже новой. На сервере
         оказался старый текст, а на экране по-прежнему «Сохранено».

      Во всех трёх случаях человек поверил интерфейсу и потерял работу. Автосохранение избавляет от кнопки, но берёт на
      себя её обещание: «то, что ты видишь, не пропадёт». Этот урок — о том, как сдержать это обещание.

      ## Черновик и автосохранение

      **Черновик** (draft) — изменения, которые человек сделал, но которые ещё не стали окончательными. Важно отличать
      две копии одного и того же текста: копию на экране, которую человек правит прямо сейчас, и копию на сервере —
      последнюю, которую сервер подтвердил. Подробно о том, почему черновик пользователя и серверная истина — разные
      вещи, говорилось в уроке курса 1 «Что переживает перезагрузку».

      **Автосохранение** (autosave) — отправка черновика на сервер без явной команды человека: по паузе в наборе, по
      таймеру, при уходе со страницы.

      Автосохранение черновика — не то же самое, что публикация. В кабинете ресторана новое описание блюда не должно
      сразу появиться у покупателей из-за того, что менеджер замер посреди фразы. Поэтому сохраняется черновик карточки,
      а «Опубликовать» остаётся отдельной явной кнопкой. Если же изменение и есть результат (заметка, документ
      в редакторе), сохранение и публикация совпадают.

      ## Статусы и что они обещают

      Надпись в углу формы — это обещание человеку. Каждое такое обещание должно быть правдой. Удобно описать
      автосохранение как набор состояний с переходами между ними — конечный автомат из урока курса 1 «Процесс как набор
      состояний».

      - **«Есть несохранённые изменения»**
        - Когда показываем: человек изменил текст, отправка ещё не началась.
        - Что обещаем: ничего — изменения пока только на этом устройстве.
      - **«Сохраняем…»**
        - Когда показываем: запрос ушёл, ответа нет.
        - Что обещаем: ничего — исход ещё неизвестен.
      - **«Сохранено»**
        - Когда показываем: сервер подтвердил **ровно ту версию, что на экране**.
        - Что обещаем: можно закрыть вкладку — ничего не пропадёт.
      - **«Не удалось сохранить»**
        - Когда показываем: попытки не удались, нет сети или сервер отказал.
        - Что обещаем: правки целы на устройстве. При временном сбое мы пробуем снова, а при отказе говорим,
          что сделать человеку; вкладку лучше не закрывать.
      - **«Конфликт»**
        - Когда показываем: пока вы правили, кто-то другой изменил этот же черновик.
        - Что обещаем: ваша версия не потеряна, но её нужно сравнить с чужой.

      Главное правило списка: **«Сохранено» показывают, только когда сервер подтвердил текущую версию**, а не «какую-то
      из недавних». Именно его нарушает вторая история из начала урока.

      Конфликт — частый спутник автосохранения: два менеджера открыли одно блюдо на разных компьютерах. Как сервер
      обнаруживает такой конфликт по версии и какие есть способы его разрешить, разобрано в уроке «Версии и конфликты».
      Здесь достаточно того, что у автомата есть такое состояние и интерфейс его показывает.

      ## Debounce — это триггер, а не протокол

      Отправлять запрос на каждое нажатие клавиши расточительно: менеджер наберёт абзац — и уйдёт сотня запросов.
      Поэтому здесь тоже работает debounce («устранение дребезга») из урока «Лишние и одинаковые запросы»: отправить,
      когда человек перестал печатать. Каждая правка сбрасывает таймер; менеджер остановился на секунду — уходит одно
      сохранение.

      Debounce хорошо отвечает на один вопрос: **когда** начать сохранение. Это **триггер** (trigger) — повод для
      отправки. Но надёжное автосохранение должно отвечать и на другие вопросы, а debounce на них не отвечает:

      - **Что, если предыдущее сохранение ещё не закончилось?** Debounce на 1 секунду и запрос, который на медленной сети
        идёт 3 секунды, — и в полёте одновременно два-три запроса.
      - **В каком порядке они дойдут?** Сеть не обещает порядка. Старая версия может дойти до сервера позже новой
        и затереть её — это третья история из начала урока. Такие гонки подробно разобраны в уроке «Гонки запросов».
      - **Что делать при ошибке?** Debounce не знает, что запрос упал, и не повторит его.
      - **Что, если человек печатает без пауз?** Таймер всё время сбрасывается, и сохранение не уходит пять минут.
        В lodash у функции `debounce` для этого есть параметр `maxWait`: вызвать функцию не позже, чем через
        столько-то времени, даже если события не прекращались ([документация lodash](https://lodash.com/docs/#debounce)).
        Если своя реализация такого не умеет, второй таймер «не реже раза в 10 секунд» легко добавить самому.
      - **Что, если человек уходит, пока таймер ещё тикает?** Отложенное сохранение просто не случится.

      Ответы на эти вопросы и составляют **протокол сохранения** — правила, по которым клиент и сервер договариваются,
      какая версия сохранена.

      ## Протокол сохранения

      Вот правила, на которых держится надёжное автосохранение.

      1. **Одно сохранение за раз.** Пока запрос в полёте, новый не отправляется. Если за это время появились правки,
         после ответа уходит одно сохранение с последней версией, а промежуточные пропускаются. Это очередь
         со схлопыванием из урока «Гонки запросов»: так нет гонок и нет лишних запросов.
      2. **Отправлять черновик целиком** и запросом, который заменяет его на сервере (PUT). Такая запись идемпотентна:
         если ответ потерялся, повтор запишет то же самое ещё раз. Значит, её можно повторять по правилам урока «Когда
         и как повторять». Если черновик огромный, отправляют изменения, но тогда повтор надо защищать отдельно.
      3. **Нумеровать версии.** Каждая правка увеличивает локальный счётчик — **номер ревизии** (revision). Запрос несёт
         номер версии, которую он сохраняет. Ответ сообщает, какой номер сохранён.
      4. **Сверять версию с сервером.** Клиент сообщает, от какой серверной версии он отталкивался, — например,
         заголовком `If-Match` с ETag. Если черновик успел изменить кто-то другой, сервер отказывает, и автомат
         переходит в «Конфликт». После каждого **своего** успешного сохранения клиент запоминает новый ETag из ответа:
         иначе следующее автосохранение придёт со старой версией и получит отказ из-за собственной прошлой правки.
         Тот же отказ бывает после потерянного ответа: первый PUT дошёл и сохранился, ответ пропал, а повтор ушёл
         со старым ETag и получил 412. Поэтому сначала сравнивают: если в ответе 412 сервер сообщает номер
         сохранённой ревизии и это наша ревизия, конфликта нет — просто берут новый ETag.
      5. **При временном сбое — повторять с паузой и не терять правки.** Черновик остаётся «несохранённым», статус
         честно говорит об этом, а копия лежит на устройстве (об этом ниже). Отказ сервера повтором не лечится:
         статус говорит, что не так, и правки по-прежнему не теряются (пути восстановления — урок «Как не потерять
         работу пользователя»).

      ## Устаревшее подтверждение

      **Устаревшее подтверждение** (stale acknowledgement) — ответ сервера «сохранено», который относится к более старой
      версии, чем та, что сейчас на экране. Сам по себе он правдив, но обманывает, если принять его за подтверждение
      текущего текста.

      Разберём по шагам. Ревизии нумеруются с единицы.

      1. Менеджер остановился, на экране ревизия 5. Уходит сохранение ревизии 5, статус «Сохраняем…».
      2. Пока запрос идёт, менеджер дописывает два слова — на экране ревизия 7.
      3. Приходит ответ: «ревизия 5 сохранена».

      Наивный код получает «успех» и пишет «Сохранено». Это ложь: ревизии 6 и 7 есть только на экране. Правильный код
      сравнивает номера: подтверждена 5, на экране 7 — значит, статус остаётся «Есть несохранённые изменения», и сразу
      уходит сохранение ревизии 7.

      ```ts
      let localRev = 0;   // номер последней правки на экране
      let savedRev = 0;   // последняя ревизия, которую подтвердил сервер
      let inFlight = false;
      let etag = initialEtag;   // версия сервера, от которой мы отталкиваемся

      function onEdit() {
        localRev++;
        setStatus('dirty');
        scheduleSave();   // debounce: 1 с после паузы, но не реже раза в 10 с
      }

      async function save() {
        if (inFlight || savedRev === localRev) return;
        inFlight = true;
        const rev = localRev;
        setStatus('saving');
        try {
          etag = await putDraft(getDraft(), rev, etag);   // PUT с If-Match: etag; ответ несёт новый ETag
          savedRev = rev;
        } catch (error) {
          if (isConflict(error) && isOwnRevision(error, rev)) {
            etag = error.currentEtag;   // 412 на свою же правку: первый PUT дошёл, потерялся только ответ
            savedRev = rev;
          } else {
            setStatus(isConflict(error) ? 'conflict' : 'error');
            if (isTemporary(error)) retryLater(save);   // только временные сбои (сеть, тайм-аут, 502–504, 429), с паузой
            return;
          }
        } finally {
          inFlight = false;
        }
        if (savedRev === localRev) setStatus('saved');
        else save();   // пока ждали ответа, появились новые правки
      }
      ```

      Если по каким-то причинам сохранения всё же идут параллельно, нужна защита и на сервере: он хранит номер
      сохранённой ревизии и отказывается записывать ревизию меньше той, что у него уже есть. Тогда опоздавший старый
      запрос не затрёт новый текст.

      ## Уход со страницы

      Самые болезненные потери случаются, когда человек уходит, а последние правки ещё не отправлены. Уйти можно
      по-разному, и каждый случай требует своего.

      ### Переход внутри приложения

      Менеджер нажал ссылку «Все блюда», и одностраничное приложение меняет экран без перезагрузки. Здесь код
      полностью под контролем: можно сразу отправить несохранённое, не дожидаясь таймера, и показать «Сохраняем…».
      Если сохранение не удалось, лучше спросить человека, чем молча бросить правки.

      ### Скрытие и закрытие вкладки

      Человек переключил вкладку, свернул браузер на телефоне, ответил на звонок. Почему скрытие страницы — последний
      момент, который разработчик надёжно замечает, и почему дальше вкладку могут заморозить и выгрузить без
      предупреждения, разобрано в уроке курса 1 «Что переживает перезагрузку». Для автосохранения из этого следует:
      в обработчике события `visibilitychange`, когда `document.visibilityState` становится `'hidden'`, делают две
      вещи.

      - **Кладут черновик в хранилище устройства** — например, в localStorage или IndexedDB. Если вкладку выгрузят,
        при возвращении черновик можно будет восстановить. Какое хранилище выбрать, разобрано в уроке «Работа без сети
        и очередь действий».
      - **Отправляют несохранённое на сервер** запросом, который браузер не оборвёт при закрытии страницы. Есть два
        способа. `fetch` с параметром `keepalive: true` доживает до конца, даже если страницу закрыли, и позволяет
        использовать любой метод, например PUT. `navigator.sendBeacon()` отправляет небольшой POST-запрос в фоне.
        Объём у них ограничен: 64 КиБ на все такие незавершённые запросы страницы вместе, а не на каждый. Большой
        черновик так целиком не отправить — поэтому важно, чтобы основная часть правок уже ушла обычным
        автосохранением.

      Тонкость `sendBeacon`: он возвращает `true`, когда браузер **поставил данные в очередь на отправку**, а не когда
      сервер их сохранил. Ответа сервера код вообще не увидит. Поэтому `true` от `sendBeacon` — не повод показать
      «Сохранено». Ответ на `fetch` с `keepalive` прочитать можно, но только если страница к тому времени ещё жива.

      ### Предупреждение при закрытии

      Событие `beforeunload` позволяет показать стандартный вопрос браузера «Покинуть сайт? Изменения могут не
      сохраниться». Что на телефонах оно часто не срабатывает, а `unload` и вовсе ненадёжен, говорилось в уроке
      курса 1 «Что переживает перезагрузку». Для автосохранения важно другое.

      - **Это предупреждение, а не способ сохранить.** Сохранять нужно раньше, при скрытии страницы.
      - **Текст вопроса задаёт браузер,** свой написать нельзя. Вопрос показывается, только если человек уже
        взаимодействовал со страницей.
      - **Подписываться — только пока есть несохранённые изменения,** и отписываться, как только всё сохранено. Так
        советуют MDN и Chrome. Постоянный обработчик спрашивает «Покинуть сайт?» и тогда, когда терять нечего, и люди
        привыкают нажимать «Покинуть», не читая. К тому же Firefox, по данным MDN, не кладёт страницу с обработчиком
        `beforeunload` в кэш «назад-вперёд», и возврат кнопкой «Назад» становится медленнее.

      ### Возвращение

      Когда человек вернулся или вкладка загрузилась заново, клиент сравнивает черновик с устройства с версией
      на сервере. Если на устройстве есть правки новее серверных, их не применяют молча и не выбрасывают, а предлагают:
      «Найдены несохранённые изменения от 14:32. Восстановить?» Как оформить такие пути восстановления — в уроке «Как
      не потерять работу пользователя».

      ## Пример целиком: описание блюда

      Соберём всё вместе для формы карточки блюда в кабинете ресторана.

      - **Триггер:** debounce 1 секунда после последней правки, но не реже раза в 10 секунд при непрерывном наборе.
        Плюс немедленное сохранение при переходе на другой экран и при скрытии вкладки.
      - **Протокол:** одно сохранение за раз; черновик карточки целиком запросом PUT; номер ревизии в запросе и ответе;
        `If-Match` с версией сервера.
      - **Статусы:** «Есть несохранённые изменения» → «Сохраняем…» → «Сохранено» (только если подтверждена ревизия
        на экране). При временном сбое — «Не удалось сохранить, пробуем снова» и повторы с паузой. При ответе 412 — «Это блюдо
        изменил другой менеджер» и сравнение версий.
      - **Уход:** при `visibilitychange` в `hidden` — черновик в localStorage и `fetch` с `keepalive`. `beforeunload` —
        только пока есть несохранённое.
      - **Публикация:** отдельная кнопка «Опубликовать», недоступная, пока черновик не сохранён.

      Посмотрим, как это работает на медленной сети. В 14:30:00 менеджер замер — через секунду уходит ревизия 12. Запрос
      идёт 4 секунды; за это время менеджер дописал ещё фразу, на экране ревизия 15. В 14:30:05 приходит «ревизия 12
      сохранена». Статус не меняется на «Сохранено»: 12 меньше 15. Сразу уходит ревизия 15, через 3 секунды приходит
      подтверждение, и только теперь в углу появляется «Сохранено».

      ## Варианты и их цена

      - **Только кнопка «Сохранить»**
        - Что даёт: просто.
        - Цена: забыл нажать — потерял.
      - **Запрос на каждое изменение**
        - Что даёт: почти нет потерь.
        - Цена: сотни запросов и гонки.
      - **Debounce без протокола**
        - Что даёт: мало запросов.
        - Цена: ложное «Сохранено», старое затирает новое.
      - **Debounce и протокол**
        - Что даёт: честные статусы, нет гонок.
        - Цена: сложнее — ревизии, очередь, копия на устройстве.
      - **Только копия на устройстве**
        - Что даёт: работает без сети, мгновенно.
        - Цена: на другом устройстве правок нет.

      Для формы, где потеря ввода дорого обходится человеку, разумный выбор — debounce и протокол. Для короткой формы
      из трёх полей часто достаточно кнопки «Сохранить» и предупреждения при уходе.

      ## Типичные ошибки

      - **Показывать «Сохранено» после любого успешного ответа,** не сверяя, какую ревизию он подтвердил.
      - **Считать debounce всем автосохранением:** параллельные запросы, старые версии поверх новых, никаких повторов.
      - **Сохранять только в `beforeunload` или `unload`.** На телефонах эти события часто не срабатывают.
      - **Верить `true` от `sendBeacon`** как подтверждению сохранения.
      - **Держать черновик только в памяти вкладки.** Фоновую вкладку браузер может выгрузить, и правки пропадут вместе
        с ней.
      - **Совмещать автосохранение с публикацией:** покупатели видят описание блюда, оборванное на полуслове.
      - **Постоянный обработчик `beforeunload`,** даже когда всё сохранено: человек привыкает к пустым предупреждениям
        и перестаёт их читать.

      ## Как спрашивают на интервью

      - «Спроектируйте автосохранение для редактора документов». Ждут статусы, debounce как триггер, очередь сохранений
        с ревизиями, конфликт и поведение при закрытии вкладки.
      - «Пользователь увидел „Сохранено“, закрыл вкладку, а правки пропали. Как такое могло случиться?» — ждут
        устаревшее подтверждение и потерю при уходе.

      ## Коротко

      - Автосохранение избавляет от кнопки, но берёт на себя её обещание: «то, что ты видишь, не пропадёт». Сохранение
        черновика — не публикация, поэтому для изменений, которые видят другие, «Опубликовать» остаётся отдельной
        кнопкой.
      - Статусы — это обещания, и «Сохранено» показывают, только когда сервер подтвердил ровно ту версию, что на
        экране. «Сохраняем…» ничего не обещает, а «Не удалось сохранить» и «Конфликт» говорят, что правки целы, но
        требуют внимания.
      - Debounce — триггер: он отвечает только на вопрос «когда начать сохранение», а при непрерывном наборе его
        дополняют пределом «не реже раза в N секунд» (в lodash — `maxWait`). Порядок, параллельные запросы, ошибки и
        уход со страницы решает протокол сохранения.
      - Протокол держится на очереди: одно сохранение за раз, а правки, появившиеся за это время, уходят следом одним
        запросом. Черновик отправляют целиком идемпотентным PUT с номером ревизии и `If-Match`, поэтому при временном
        сбое его повторяют с паузой, а статус честно говорит «не сохранено».
      - Устаревшее подтверждение — «ревизия 5 сохранена», когда на экране уже 7: статус остаётся «несохранённые
        изменения», и сразу уходит ревизия 7. Если на повтор пришёл 412, а сервер сообщает, что сохранена наша же
        ревизия, это не конфликт: просто берут новый ETag.
      - При скрытии вкладки черновик кладут в хранилище устройства и отправляют остаток через `fetch` с `keepalive`
        или `sendBeacon`. Общий лимит таких запросов на страницу — 64 КиБ, поэтому основная часть правок должна уйти
        обычным автосохранением раньше.
      - `true` от `sendBeacon` значит «поставлено в очередь», а не «сохранено». `beforeunload` — предупреждение, а не
        способ сохранить, и подписываются на него, только пока есть несохранённое. При возвращении найденные на
        устройстве правки предлагают восстановить, а не применяют молча.

      ## Источники

      - [Page Lifecycle API: рекомендации для каждого состояния — Chrome for Developers](https://developer.chrome.com/docs/web-platform/page-lifecycle-api#developer_recommendations_for_each_state)
      - [Navigator: sendBeacon() method — MDN](https://developer.mozilla.org/en-US/docs/Web/API/Navigator/sendBeacon)
      - [Window: beforeunload event — MDN](https://developer.mozilla.org/en-US/docs/Web/API/Window/beforeunload_event)

  - id: sdd-offline-queue
    topic: Надёжность и восстановление
    subtopic: Локальное хранение и офлайн-очередь
    title: Работа без сети и очередь действий
    audio: https://color-zebra.github.io/frontend-quiz-audio/system-design-data/sdd-offline-queue.mp3
    body: |
      ## Какую проблему решаем

      Курьер спускается в подвал бизнес-центра, чтобы отдать заказ в столовую на минус первом этаже. Связи там нет.
      Он отдаёт пакет, нажимает в приложении «Доставлено» — и видит бесконечный индикатор загрузки, а потом надпись
      «Нет соединения». Что дальше?

      - Курьер торопится к следующему заказу и забывает нажать кнопку ещё раз. Для системы заказ так и не доставлен:
        покупателю приходит «Курьер задерживается», поддержка звонит курьеру, а оплата за доставку откладывается.
      - Курьер нажимает кнопку пять раз подряд, пока не поднимется к выходу. Пять одинаковых запросов уходят, как только
        появляется сеть.
      - Курьер открывает камеру, чтобы сфотографировать чек, и телефон, которому не хватает памяти, выгружает браузер.
        Всё, что приложение держало в памяти, пропадает.

      Работа без сети — не экзотика, а обычный день курьера: подвалы, лифты, подъезды, метро. Если об этом не подумать
      заранее, действия пользователя теряются или выполняются дважды, а человек не понимает, что произошло.

      Нужна ли вообще работа без сети, решают при выяснении требований — это один из вопросов, которые меняют
      архитектуру (урок «Как выяснять требования» курса 1). Для приложения курьера ответ — да. Этот урок о том, как
      такое приложение устроить: что хранить на телефоне, где именно и в каком порядке потом отправлять на сервер.

      ## Черновик или очередь команд

      Есть два разных способа «не потерять» то, что человек сделал без сети, и важно их не путать.

      **Черновик** (draft) — сохранённое на устройстве текущее содержимое того, что человек вводит, но ещё не отправил.
      Черновик у формы один, и каждое новое сохранение перезаписывает предыдущее. Отправляет его сам человек, когда
      нажмёт «Отправить». Как черновик сохраняется по ходу ввода, разобрано в уроке «Автосохранение».

      **Команда** — просьба к серверу что-то изменить: «отметить заказ 512 доставленным в 14:03». Чем команда отличается
      от запроса на чтение, разобрано в уроке «Чтение, запись и реакция интерфейса» курса 1. **Очередь команд** (command
      queue, offline queue, ещё говорят outbox — «исходящие») — упорядоченный список команд, которые сохранены
      на устройстве и ждут отправки. Новая команда добавляется в конец, а приложение отправляет команды само, как только
      это становится возможно.

      Сравним их:

      - **Черновик**
        - Что хранится: текущее состояние формы.
        - Сколько записей: одна на форму, новая затирает старую.
        - Кто отправляет: человек, нажав «Отправить».
        - Что видит человек без сети: «Черновик сохранён, отправить пока нельзя».
        - Цена: почти ничего, одна запись в хранилище.
      - **Очередь команд**
        - Что хранится: список действий, которые человек уже совершил.
        - Сколько записей: много, каждая новая добавляется в конец.
        - Кто отправляет: приложение само, когда появится связь.
        - Что видит человек без сети: «Сделано, отправится, когда появится связь».
        - Цена: хранение, порядок, повторы, обработка отказов.

      Выбирают по одному вопросу: **должно ли действие считаться совершённым, пока сети нет?** Если человеку достаточно
      не потерять введённое, а отправит он потом сам — хватит черновика. Например, отзыв о ресторане: покупатель
      допишет его дома. Если человек должен продолжить работу так, будто действие уже выполнено, нужна очередь. Курьер
      не может стоять в подвале и ждать сети: он отметил доставку и идёт к следующему заказу.

      ### Какие действия нельзя ставить в очередь

      Очередь годится только для команд, которые сервер почти наверняка примет и которые не теряют смысла, если придут
      через полчаса. Отметка «доставлено» такая: курьер действительно отдал заказ, и сервер это примет.

      Есть действия, для которых нужен ответ прямо сейчас:

      - **оплата** — человеку важно знать, прошли ли деньги, прежде чем уйти;
      - **ограниченный ресурс** — «принять новый заказ», который предлагают нескольким курьерам сразу: через полчаса
        его заберёт другой, и команда из очереди получит отказ;
      - **действия, зависящие от свежих данных** — подтвердить цену, которая могла измениться.

      Для них без сети честнее показать «Нужна связь» и не принимать действие, чем принять его и потом отменить.

      ## Надёжное состояние: сначала записать, потом отправить

      **Надёжное состояние** (durable state) — данные, которые переживают перезагрузку страницы, закрытие вкладки,
      выгрузку браузера системой и перезапуск телефона. Переменные JavaScript, состояние React-компонентов, хранилище
      Redux живут в памяти вкладки и надёжными не являются. В уроке «Что переживает перезагрузку» курса 1 разобрано,
      почему фоновую вкладку на телефоне браузер может заморозить и выгрузить без предупреждения.

      Поэтому у очереди одно главное правило: **сначала записать команду на устройство, потом отправлять** (persist
      before send). Порядок такой:

      1. Человек нажал «Доставлено».
      2. Приложение записывает команду в хранилище браузера и ждёт, пока запись завершится.
      3. Только теперь интерфейс показывает «Доставлено, ждёт отправки».
      4. Приложение пробует отправить команду. Получилось — удаляет её из очереди. Не получилось — команда остаётся.

      Частая ошибка — делать наоборот: сначала отправить запрос и записать команду, только если запрос не удался. Пока
      запрос висит без ответа (а без сети он может висеть долго), команда существует только в памяти. Если в этот момент
      браузер выгрузят, команда пропадёт, хотя человек уже видел, что «всё сохранилось».

      Что лежит в записи о команде:

      ```ts
      type Command = {
        id: string;              // идентификатор операции, создаётся один раз
        type: 'markDelivered' | 'addComment';
        orderId: number;         // к какому заказу относится
        payload: { at: string; text?: string };
        createdAt: string;       // чтобы показать человеку, когда он это сделал
        status: 'pending' | 'failed';
        error?: string;          // почему сервер отказал, если отказал
      };
      ```

      ## Идентификатор операции

      **Идентификатор операции** (operation id) — уникальное имя команды, которое приложение придумывает, когда
      записывает её в очередь, и хранит вместе с ней. При каждой попытке он уходит на сервер как ключ идемпотентности.
      Как устроены такие ключи, почему ключ создают один раз на операцию и что они гарантируют, разобрано в уроке
      «Повторы без двойных списаний».

      В очереди без него не обойтись. Курьер выходит из подвала, сеть появилась на секунду. Команда ушла, сервер отметил
      заказ доставленным, а ответ потерялся: курьер снова зашёл в лифт. Приложение не знает, дошла ли команда, и через
      минуту отправляет её ещё раз. По тому же идентификатору сервер поймёт, что это повтор, и не выполнит её дважды.

      У очереди есть и своя особенность: команда может пролежать на устройстве долго, а сервер хранит ключи
      ограниченное время. Если курьер был без сети дольше этого срока, повтор со старым ключом сервер может принять
      за новую операцию. Поэтому для команд, пролежавших дольше срока хранения ключей, перед отправкой спрашивают
      у сервера статус операции — например, «отмечен ли заказ 512 доставленным».

      ## Порядок отправки

      Команды одного заказа должны дойти до сервера в том порядке, в котором их сделал человек. «Доставлено», пришедшее
      раньше «Забрал из ресторана», сервер отклонит или, хуже, поймёт неправильно. Есть два основных способа.

      - **Строго по одной**
        - Как работает: следующая команда уходит только после ответа на предыдущую.
        - Что даёт: просто, порядок гарантирован.
        - Цена: одна застрявшая команда держит всю очередь.
      - **По одной внутри сущности**
        - Как работает: команды одного заказа идут строго по порядку, команды разных заказов — независимо.
        - Что даёт: застрявший заказ не мешает остальным.
        - Цена: нужно знать, какие команды зависят друг от друга.

      Для курьера подходит второй способ: заказы разных покупателей между собой не связаны. Для простого приложения,
      где команд немного и они почти всегда проходят, хватает первого.

      ### Временный сбой и окончательный отказ

      Ответы сервера на команду из очереди делятся на четыре группы. Какие ошибки временные, а какие нет, подробно
      разобрано в уроке «Какие бывают сбои», а как правильно повторять — в уроке «Когда и как повторять».

      - **Успех** — команду удаляют из очереди.
      - **Временный сбой**: нет сети, тайм-аут, ошибки 502, 503, 504, «слишком много запросов» и 409 «операция
        с этим ключом ещё выполняется». Команда остаётся в очереди и уйдёт позже с тем же ключом, с паузой между
        попытками.
      - **Ответ 500**: сервер мог сохранить его вместе с ключом и будет возвращать на каждый повтор. Команду
        помечают «исход неизвестен» и выясняют исход запросом статуса, а не повтором (урок «Когда и как повторять»).
      - **Окончательный отказ**: сервер понял команду и отказался её выполнять. Например, ответил 409 «заказ отменён
        покупателем», пока курьер был без связи. Повторять такую команду бессмысленно: ответ будет тем же.

      Окончательный отказ — это и есть **неустранимый конфликт** (unresolvable conflict) в простом виде: то, что сделал
      человек на устройстве, противоречит тому, что уже произошло на сервере, и автоматически это не исправить. С ним
      поступают так:

      1. Помечают команду «не отправлена» и сохраняют причину отказа.
      2. Останавливают следующие команды **того же заказа**: они опирались на отклонённую.
      3. Продолжают отправлять команды остальных заказов.
      4. Показывают человеку, что именно не прошло и почему, и дают выбор: связаться с поддержкой или убрать команду.

      Молча удалить отклонённую команду нельзя: человек думает, что дело сделано. Повторять её бесконечно тоже нельзя:
      она навсегда займёт очередь. Как показать такую ошибку человеку, разобрано в следующем уроке, «Как не потерять
      работу пользователя». А сложную сверку после многих часов без сети, когда расходятся сотни изменений, разбирает
      курс «Синхронизация и офлайн».

      ## Когда отправлять: возобновление после перезагрузки и появления сети

      Очередь сама ничего не отправляет — её отправку запускает приложение. Поводы такие:

      - **запуск приложения**: после перезагрузки или выгрузки браузера очередь читается из хранилища, и отправка
        продолжается с того места, где остановилась;
      - **событие `online`** — браузер сообщает, что сеть, похоже, появилась;
      - **возврат во вкладку** (событие `visibilitychange`), если в очереди что-то есть;
      - **таймер**: пока очередь не пуста, раз в несколько десятков секунд, с увеличением паузы после неудач.

      Сигнал `online` ненадёжен: почему, разобрано в уроке «Какие бывают сбои». Поэтому он только повод попробовать,
      а настоящая проверка связи — попытка отправить команду.

      Поводов несколько, и они могут сработать почти одновременно: приложение запустилось, и тут же пришло `online`.
      Если обе отправки пойдут параллельно, вторая может отправить следующую команду заказа раньше, чем придёт ответ
      на предыдущую, и порядок нарушится. Поэтому правило — **одна отправка очереди за раз**: если она уже идёт,
      новый повод ничего не запускает.

      Набросок отправки очереди:

      ```ts
      let flushing = false;

      async function flushQueue() {
        if (flushing) return;                                // отправка уже идёт
        flushing = true;
        try {
          for (const cmd of await queue.pending()) {          // в порядке создания
            if (await queue.hasFailed(cmd.orderId)) continue;  // у этого заказа застряла команда
            let res;
            try {
              res = await send(cmd);                           // ключ идемпотентности = cmd.id
            } catch {
              return;                                          // нет сети: остальное тоже не уйдёт
            }
            if (res.ok) await queue.remove(cmd.id);
            else if (res.status === 500) await queue.markUnknown(cmd.id);  // выяснить исход запросом статуса
            else if (isTemporary(res)) return;     // 502–504, 429, 409 «ещё выполняется»: повторим позже, с паузой
            else await queue.markFailed(cmd.id, res.status);   // отказ навсегда: показать человеку
          }
        } finally {
          flushing = false;
        }
      }
      ```

      Обратите внимание: в записи о команде нет статуса «отправляется». Если браузер выгрузили посреди запроса, такой
      статус остался бы в хранилище навсегда, и команда считалась бы «в пути». Проще считать каждую команду в очереди
      неотправленной, пока сервер не подтвердил её, и после перезапуска отправлять её снова. Это безопасно именно потому,
      что у команды постоянный идентификатор операции.

      Ещё два случая только назовём. Если у человека открыто две вкладки приложения, обе могут начать отправлять одну
      очередь. Ключ идемпотентности защищает от двойного выполнения, а как договориться вкладкам между собой, разбирает
      курс «Синхронизация и офлайн». Там же — отправка накопленного в фоне, когда приложение закрыто, с помощью **Service Worker** — фонового
      скрипта сайта, который перехватывает его запросы и может работать, даже когда вкладка закрыта.

      ## Где хранить: хранилища браузера

      У браузера несколько хранилищ, и они сделаны для разных задач.

      - **`localStorage`** — хранилище пар «ключ — строка» для сайта. Живёт, пока его не очистят. Объём — около 5 МБ.
        Работает **синхронно** (synchronous): пока идёт чтение или запись, страница не реагирует на действия
        пользователя. Недоступно из **веб-воркеров** (web workers — скриптов, которые работают в отдельном потоке,
        не мешая странице) и из Service Worker.
      - **`sessionStorage`** — то же самое, но своё у каждой вкладки. Переживает перезагрузку страницы, но очищается,
        когда вкладку закрывают; та же страница в новой вкладке получает пустое хранилище.
      - **IndexedDB** — встроенная в браузер база данных. Работает **асинхронно** (asynchronous) и не блокирует
        страницу. Хранит не только строки, но и объекты, массивы, файлы. Поддерживает **транзакции** (transactions):
        группа записей выполняется целиком или не выполняется вовсе. Доступна из воркеров и Service Worker. Объём —
        обычно сотни мегабайт и больше. Цена — громоздкий API, поэтому её часто используют через небольшую обёртку
        с промисами, например idb ([учебник IndexedDB на learn.javascript.ru](https://learn.javascript.ru/indexeddb)).
      - **Cache Storage** (Cache API) — хранилище пар «запрос — ответ»: файлы приложения, картинки, ответы API.
        Обычно им пользуется Service Worker, чтобы открывать приложение без сети. Для команд оно не подходит: команда —
        не HTTP-ответ.
      - **Cookies** — маленькие записи (порядка нескольких килобайт), которые браузер отправляет на сервер с каждым
        запросом. Их назначение — идентификатор сессии и похожие служебные значения, а не хранение данных: каждый лишний
        байт в cookie замедляет каждый запрос.

      Коротко, что для чего подходит:

      - **`localStorage`** — небольшие настройки и маленький черновик: около 5 МБ, синхронный, из воркеров
        недоступен.
      - **`sessionStorage`** — временное состояние одной вкладки: живёт, пока вкладка открыта.
      - **IndexedDB** — очередь команд, данные для работы без сети, файлы: сотни мегабайт, асинхронная, доступна
        из воркеров.
      - **Cache Storage** — файлы приложения и ответы сервера для Service Worker.
      - **Cookies** — идентификатор сессии и служебные метки: несколько килобайт, уходят с каждым запросом.

      Для очереди курьера выбор — IndexedDB. Команды переживают закрытие вкладки и перезапуск телефона. К каждой
      отметке можно приложить фото, и места хватит. Запись не подвешивает интерфейс в момент, когда курьер торопится.
      Позже, если понадобится отправка в фоне, Service Worker сможет прочитать ту же очередь. А транзакция позволяет
      одним действием и добавить команду, и обновить сохранённую копию заказа: не будет состояния, где заказ на экране
      «доставлен», а команды в очереди нет.

      `localStorage` годится для маленького черновика одной формы — например, комментария к заказу. Для очереди с фото
      его не хватит: при переполнении запись бросит ошибку `QuotaExceededError`, и команда не сохранится.

      ## Хранилище устройства тоже может пропасть

      Данные сайта в браузере по умолчанию хранятся **«по возможности»** (best-effort). Браузер может удалить их сам:

      - **Когда на устройстве кончается место.** Браузер удаляет данные сайтов, которыми дольше всех не пользовались
        (политика LRU, least recently used — «давно не использованный первым»). Удаляется сразу всё, что хранил сайт,
        а не часть.
      - **В Safari — через семь дней без визитов.** При включённой защите от отслеживания (по умолчанию она включена)
        Safari удаляет данные, созданные скриптами сайта, если за последние семь дней работы браузера человек ни разу
        не нажал ничего на этом сайте. На веб-приложения, установленные на главный экран, это правило не действует.
      - **В приватном режиме** данные обычно удаляются, когда приватное окно закрывают.
      - И, конечно, их может стереть сам человек в настройках браузера.

      Сайт может попросить для своих данных **постоянное хранение** (persistent storage) вызовом
      `navigator.storage.persist()`. Такие данные браузер не удаляет при нехватке места — только сам человек. Chrome
      решает без вопросов, по признакам того, что сайт важен человеку: установлен ли он, есть ли в закладках, разрешены
      ли уведомления. Firefox спрашивает человека.

      Выводы для очереди. Устройство — временное место для команд, а не окончательное: команду нужно отправить как можно
      раньше. Ошибку записи, в том числе `QuotaExceededError`, нужно ловить и показывать: «Не удалось сохранить на
      телефоне». Приложению курьера, которым пользуются каждый день, стоит запросить постоянное хранение. А сколько
      команд ждёт отправки, человек должен видеть — тогда он не очистит браузер и не сменит телефон, пока они не ушли.

      ## Пример целиком: курьер в подвале

      Соберём всё вместе и пройдём один рабочий эпизод курьера.

      **14:00.** Курьер спускается в подвал, связи нет. Попытка обновить список заказов не удалась, и приложение
      показывает полосу: «Нет связи. Отметки сохранятся на телефоне и отправятся сами».

      **14:03.** Курьер отдаёт заказ 512 и нажимает «Доставлено». Приложение создаёт команду с идентификатором
      `7f3a…`, одной транзакцией записывает её в IndexedDB и помечает заказ доставленным в сохранённой копии. После
      записи заказ на экране получает статус «Доставлено» со значком часов — «ждёт отправки». Попытка отправить
      не удалась, команда осталась в очереди.

      **14:05.** У заказа 513 не работает домофон. Курьер начинает писать комментарий для поддержки. Пока текст не
      отправлен, это черновик: он сохраняется по ходу ввода и переживёт выгрузку. Курьер нажимает «Отправить» —
      черновик превращается в команду с идентификатором `c41b…` и встаёт в очередь.

      **14:07.** Курьер открывает камеру, и телефон выгружает браузер. В 14:12 курьер снова открывает приложение. Оно
      читает очередь из IndexedDB, показывает «2 действия ждут отправки» и пробует отправить. Сети по-прежнему нет.

      **14:16.** Курьер выходит на улицу, появляется связь. Команда `7f3a…` уходит, сервер отмечает доставку, но ответ
      не доходит: связь снова пропала. Через 10 секунд приложение отправляет `7f3a…` ещё раз. Сервер узнаёт ключ
      и возвращает прежний результат. Команду удаляют из очереди, значок часов у заказа 512 сменяется галочкой.

      **14:17.** На команду `c41b…` сервер отвечает 409: покупатель отменил заказ 513 в 14:10. Приложение не повторяет
      её, помечает «Не отправлено: заказ отменён покупателем» и показывает кнопки «Связаться с поддержкой» и «Убрать».
      Команды других заказов продолжают уходить.

      В этом эпизоде курьер ни разу не ждал сети и не нажимал кнопку дважды. Ни одно действие не потерялось
      и не выполнилось дважды, а единственное, которое не прошло, он увидел вместе с причиной.

      ## Как выбрать

      - **Без сети работать не нужно** — не принимать действие, честно сказать «Нужна связь», не терять введённое.
      - **Важно не потерять ввод, а отправит человек сам** — черновик: `localStorage` для маленького текста,
        IndexedDB, если есть файлы.
      - **Человек должен продолжать работу без сети** — очередь команд в IndexedDB, «сначала записать»,
        идентификатор операции.
      - **Команды разных объектов не зависят друг от друга** — порядок внутри объекта, застрявший объект не держит
        остальные.
      - **Действию нужен ответ сразу: оплата, ограниченный ресурс** — не ставить в очередь, выполнять только с сетью.

      ## Типичные ошибки

      - **Держать очередь в памяти** или в `sessionStorage`. Выгрузка браузера или закрытие вкладки — и команды
        пропали.
      - **Показывать «Готово» до записи на устройство** или записывать команду, только когда запрос не удался.
      - **Хранить в записи статус «отправляется».** После выгрузки браузера посреди запроса команда навсегда застрянет
        «в пути».
      - **Запускать несколько отправок очереди одновременно.** Две отправки обгоняют друг друга и нарушают порядок.
      - **Забывать, что сервер хранит ключи ограниченное время.** Команда, пролежавшая на телефоне дольше этого срока,
        может выполниться второй раз.
      - **Повторять окончательный отказ бесконечно** или останавливать из-за него всю очередь. Отклонённая команда
        одного заказа не должна держать остальные.
      - **Молча удалять отклонённую команду.** Человек уверен, что дело сделано.
      - **Ждать события `online`**, не пробуя отправить: сигнал ненадёжен, и очередь может простоять при живой сети.
      - **Ставить в очередь действия, которым нужен ответ сразу** (оплата, «принять заказ», бронь последнего места)
        или которые теряют смысл с опозданием.
      - **Считать хранилище устройства вечным**: не ловить ошибки записи, не показывать, сколько команд ждёт отправки.

      ## Как спрашивают на интервью

      - «Курьер теряет связь в подвале и в лифте. Как сделать, чтобы его отметки не терялись и не дублировались?»
      - «Где бы вы хранили офлайн-очередь и почему не в `localStorage`?»
      - «Приложение закрыли посреди отправки очереди. Что произойдёт при следующем запуске?»

      ## Коротко

      - Черновик хранит текущее содержимое формы, и отправляет его сам человек; очередь команд (outbox) хранит уже
        совершённые действия, и отправляет их приложение. Выбор зависит от одного вопроса: должно ли действие
        считаться совершённым, пока сети нет.
      - В очередь ставят только команды, которые сервер почти наверняка примет и которые не теряют смысла с
        опозданием. Оплату, ограниченный ресурс и действия по свежим данным без сети честнее не принимать: «Нужна
        связь».
      - Главное правило — сначала записать команду на устройство, потом отправлять (persist before send). «Готово»
        показывают только после записи, иначе выгрузка браузера во время запроса сотрёт команду.
      - У каждой команды постоянный идентификатор операции, он же ключ идемпотентности, и повтор после потерянного
        ответа безопасен. Для команд, пролежавших дольше срока хранения ключей, сначала спрашивают статус.
      - Команды одного объекта идут строго по порядку, а разных — независимо; в простом приложении хватает строгой
        очереди по одной. Временный сбой (нет сети, тайм-аут, 502–504, 429, 409 «ещё выполняется») оставляет команду:
        она уйдёт позже с тем же ключом и с паузой, а после 500 исход выясняют запросом статуса.
      - Окончательный отказ, например 409 «заказ отменён покупателем», — неустранимый конфликт: команду не повторяют и
        молча не удаляют, а показывают человеку с причиной. Следующие команды того же заказа останавливают, остальные
        отправляют дальше.
      - Поводы для отправки — запуск приложения, событие `online` (оно ненадёжно и служит лишь поводом попробовать),
        возврат во вкладку и таймер, но одновременно идёт только одна отправка очереди. Статуса «отправляется» в
        записи нет: всё неподтверждённое после перезапуска отправляют снова.
      - Для очереди выбирают IndexedDB: асинхронная, объёмная, с транзакциями и доступом из воркеров. Хранилище
        браузера живёт «по возможности», поэтому команды отправляют как можно раньше и показывают, сколько их ждёт, а
        ежедневному приложению вроде курьерского стоит запросить постоянное хранение.

      ## Источники

      - [Storage quotas and eviction criteria — MDN](https://developer.mozilla.org/en-US/docs/Web/API/Storage_API/Storage_quotas_and_eviction_criteria)
      - [Storage for the web — web.dev](https://web.dev/articles/storage-for-the-web)

  - id: sdd-recovery-ux
    topic: Надёжность и восстановление
    subtopic: Восстановление глазами пользователя
    title: Как не потерять работу пользователя
    audio: https://color-zebra.github.io/frontend-quiz-audio/system-design-data/sdd-recovery-ux.mp3
    body: |
      ## Какую проблему решаем

      Менеджер ресторана двадцать минут переписывает в кабинете ресторана карточку блюда «Том ям»: новый состав,
      аллергены, длинное примечание для кухни, цену. Нажимает «Сохранить». Через несколько секунд появляется красное
      уведомление «Произошла ошибка. Попробуйте позже» и через три секунды исчезает. А форма снова показывает старую
      карточку: страница перезагрузилась, чтобы «показать актуальные данные». Двадцать минут работы пропали, и менеджер
      даже не знает почему — то ли он что-то ввёл не так, то ли сломался сайт.

      Бывает и наоборот. Приложение не показывает ошибку вовсе: оно тихо повторяет сохранение в фоне, а на экране всё
      это время зелёная галочка. Менеджер закрывает вкладку и уходит домой. Утром выясняется, что в меню старый
      состав и старая цена.

      В первом случае пропал ввод. Во втором интерфейс солгал о том, что работа сохранена. Оба провала видны не в коде,
      а глазами человека. В предыдущих уроках мы разобрали механизмы: виды сбоев, повторы, автосохранение, очередь
      команд. Этот урок — о том, что человек видит, когда что-то пошло не так, и как он возвращает свою работу.

      Слово **работа пользователя** здесь значит всё, что человек ввёл или сделал, но что ещё не подтверждено сервером:
      текст в форме, отметки, перенесённые карточки, загруженные фото.

      ## Оптимизм с видимым статусом

      Что такое оптимистичный и пессимистичный интерфейс, когда оптимизм уместен и как откатывать изменение,
      разобрано в уроке «Оптимистичные обновления». Здесь важна другая сторона: что увидит человек, если обещание
      не сбылось. Одно из условий того урока здесь особенно важно: на ложное «готово» не должны опираться другие
      люди. Новую цену в меню увидят покупатели, и ложь обманет не одного человека, а многих.

      Между «показать сразу» и «показать после ответа» есть рабочая середина: результат показывают сразу, но рядом
      с ним — честный **статус** этой вещи. Так выглядит очередь команд из урока «Работа без сети и очередь действий»:
      заказ на экране курьера «Доставлено» со значком часов, пока сервер не подтвердил. Мессенджеры делают то же самое:
      сообщение сразу в ленте, а значок рядом говорит «отправляется», «доставлено» или «не отправлено — нажмите, чтобы
      повторить». В React для такого показа есть хук `useOptimistic`, и пример в его документации — как раз сообщение
      чата с пометкой «отправляется» ([ru.react.dev, useOptimistic](https://ru.react.dev/reference/react/useOptimistic)).

      У такого интерфейса три обязательства:

      - **отказ виден там же, где действие:** у самого сообщения, у самой карточки, а не в углу экрана;
      - **отказ не исчезает сам:** пометка «не отправлено» висит, пока человек не повторит действие или не уберёт его.
        Уведомление, которое пропадает через три секунды, легко пропустить, а вещь на экране при этом выглядит
        сохранённой;
      - **данные остаются:** текст сообщения, которое не ушло, не пропадает из ленты и не возвращается молча в поле
        ввода, где его затрёт следующее сообщение.

      ## Сообщать о несохранённой работе

      Первая из десяти эвристик удобства Якоба Нильсена — **видимость состояния системы** (visibility of system status):
      интерфейс всегда сообщает человеку, что происходит. Для работы пользователя это значит: человек в любой момент
      понимает, где сейчас его работа. Удобно различать три уровня.

      - **Только на странице, в памяти вкладки**
        - Что переживёт: сбой сети и повтор; пропадёт при перезагрузке и выгрузке вкладки.
        - Что сказать человеку: «Не сохранено».
      - **На этом устройстве, в хранилище браузера**
        - Что переживёт: перезагрузку и закрытие вкладки, но не другое устройство.
        - Что сказать человеку: «Сохранено на этом устройстве, отправится, когда появится связь».
      - **На сервере**
        - Что переживёт: всё.
        - Что сказать человеку: «Сохранено».

      Подробно о статусах черновика и о том, что каждый из них обещает, — в уроке «Автосохранение». Здесь — как
      показывать несохранённое во всём приложении.

      ### Рядом с вещью и в сводке

      Nielsen Norman Group различает **индикаторы** (indicators) — пометки рядом с конкретным элементом, например значок
      часов у заказа, — и **уведомления** (notifications) о событиях системы. Пассивное уведомление, которое не требует
      действия, легко пропустить. Поэтому о несохранённом говорят двумя способами сразу:

      - **индикатор рядом с вещью**: у блюда в списке пометка «Есть несохранённые изменения», у сообщения — «не
        отправлено»;
      - **сводка** в заметном месте: «3 изменения не сохранены» в шапке кабинета, по нажатию — список.

      Индикатор отвечает на вопрос «что с этой вещью», сводка — «всё ли у меня в порядке». Без сводки человек
      не узнает о несохранённой карточке, которая сейчас не на экране. Без индикатора — не найдёт, какая именно.

      ### Перед уходом

      Опасные моменты — когда человек уходит: закрывает вкладку, выходит из аккаунта, переключается на другой ресторан.

      - **Закрытие вкладки.** Браузер умеет показать свой вопрос «Покинуть сайт?», но на телефоне он часто
        не срабатывает, а сохранять работу нужно раньше — когда страница скрывается. Почему так, разобрано в уроке
        курса 1 «Что переживает перезагрузку», а как этим пользуется автосохранение — в уроке «Автосохранение».
      - **Выход из аккаунта.** Браузер тут не поможет, вопрос задаёт само приложение: «У вас 3 несохранённых
        изменения. Если выйти, они пропадут. Сохранить и выйти / Выйти без сохранения / Остаться». Если связи нет
        и сохранить нельзя, честный выбор — «Остаться» или «Выйти без них». Молча выйти и стереть их нельзя: человек
        уверен, что всё отправлено.
      - **Переключение ресторана или переход на другой экран** — тот же вопрос, и его тоже задаёт приложение,
        например через блокировку перехода в роутере.

      ## Не терять ввод

      Правило простое: **введённое человеком исчезает только тогда, когда он сам этого захотел или когда сервер
      подтвердил сохранение**. Из него следуют конкретные решения.

      - **Не очищать форму при ошибке.** Ни при сбое сети, ни при 500, ни при отказе в проверке. Сбросить форму
        можно после успешного ответа, не раньше.
      - **Не перезагружать страницу «для свежих данных»** поверх несохранённого ввода.
      - **Ошибку проверки показывать у поля** и оставлять остальной ввод на месте — подробно в уроке «Формы
        и валидация».
      - **Истёкшая сессия** посреди работы тоже не повод терять ввод: войти снова и продолжить — об этом урок «Сессия
        и обновление токена».
      - **Против перезагрузки и выгрузки вкладки** — копия на устройстве: черновик или очередь команд из урока
        «Работа без сети и очередь действий».
      - **Последний выход** — кнопка «Скопировать текст», если сохранить не получается никак. Длинное описание
        хотя бы останется у человека в буфере обмена.

      ### Когда хранить на устройстве нельзя

      Сохранить ввод на устройстве — решение не только о надёжности, но и о безопасности. Данные в хранилище браузера
      видит любой, кто сядет за этот компьютер, и любой скрипт этого сайта: если на сайте найдётся уязвимость, через
      которую выполняется чужой скрипт (XSS, межсайтовый скриптинг), он прочитает всё хранилище. Поэтому руководство
      по безопасности OWASP советует не хранить в `localStorage` ничего чувствительного. Отсюда правила:

      - **пароли, данные банковских карт, одноразовые коды** на устройстве не сохраняют никогда; после ошибки эти поля
        очищают, а остальную форму оставляют;
      - **на общих компьютерах** — в библиотеке, в регистратуре, на кассе — копия формы, оставленная в хранилище
        браузера, достанется следующему человеку. Разумный компромисс — держать ввод только в памяти страницы:
        он переживёт сбой сети и повтор, но исчезнет вместе с вкладкой. `sessionStorage` (OWASP советует его вместо
        `localStorage`, когда долгое хранение не нужно) переживёт перезагрузку и очистится при закрытии вкладки.
        Но на общем планшете или кассе вкладку весь день не закрывают, поэтому там он так же опасен: после отправки
        или ухода человека форму и хранилище очищают явно;
      - **при выходе из аккаунта** локальные черновики этого человека удаляют, а сами черновики с самого начала
        привязывают к пользователю, чтобы следующий вошедший их не увидел.

      Это и есть оговорка «если позволяют требования безопасности»: не терять ввод — цель, но не любой ценой.

      ## Явные пути восстановления

      **Путь восстановления** (recovery path) — понятное действие, которым человек может вернуть свою работу после
      сбоя: «Повторить», «Войти снова», «Посмотреть другую версию», «Скопировать текст». Девятая эвристика Нильсена
      так и называется: помогать людям замечать, понимать ошибки и **восстанавливаться** после них.

      Соблазн — вместо этого повторять в фоне бесконечно, «пока не получится», и ничего не говорить. Это плохо по трём
      причинам:

      - **Человек не знает, что работа не сохранена,** и уходит. Фоновые повторы умирают вместе с вкладкой.
      - **Многие ошибки повтором не лечатся.** Конфликт версий, отказ в правах, отменённый заказ, истёкшая сессия
        вернут тот же ответ и в сотый раз.
      - **Бесконечные повторы нагружают сервер** именно тогда, когда ему и так плохо, — об этом урок «Когда и как
        повторять».

      Поэтому автоматические повторы делают только для временных сбоев, с ограничением числа попыток. Когда попытки
      кончились или ошибка не временная, состояние становится **видимым**, а у человека появляются кнопки. Как
      сформулировать само сообщение об ошибке действия и где его поставить, разобрано в уроке курса 1 «Загрузка,
      пустота, ошибка и всё между ними». Здесь — какой путь восстановления дать при каждом виде сбоя. Сами виды сбоев
      разобраны в уроке «Какие бывают сбои».

      - **Нет сети**
        - Что видит человек: «Нет связи. Изменения сохранены на этом устройстве и отправятся сами».
        - Путь восстановления: «Повторить сейчас».
      - **Сервер не отвечает после нескольких попыток**
        - Что видит человек: «Не удалось сохранить: сервер не отвечает. Ваш текст на месте».
        - Путь восстановления: «Повторить», «Скопировать текст».
      - **Ошибка проверки**
        - Что видит человек: текст ошибки у поля с подсказкой, как исправить.
        - Путь восстановления: исправить поле и отправить снова.
      - **Конфликт версий**
        - Что видит человек: «Пока вы редактировали, блюдо изменил другой менеджер».
        - Путь восстановления: «Посмотреть его версию», «Оставить мою»; своя версия остаётся на экране.
      - **Исход записи неизвестен**
        - Что видит человек: «Проверяем, сохранилось ли».
        - Путь восстановления: сначала узнать исход — как в уроке «Повторы без двойных списаний».
      - **Сессия истекла**
        - Что видит человек: «Войдите снова — введённое сохранится».
        - Путь восстановления: «Войти».
      - **Действие отклонено окончательно**
        - Что видит человек: «Не отправлено: заказ отменён покупателем».
        - Путь восстановления: «Связаться с поддержкой», «Убрать».

      Обратите внимание: кнопка «Повторить» есть не везде. Для конфликта, окончательного отказа и истёкшей сессии
      повтор того же запроса вернёт ту же ошибку, поэтому путь там другой — сравнить версии, войти, убрать действие.
      Кнопка «Повторить», которая заведомо не поможет, — тоже ложное обещание.

      Важность сообщения подбирают по последствиям. Модальное окно, которое закрывает экран, — для серьёзных случаев,
      когда без решения человека дальше нельзя. Для «отправится, когда появится связь» хватит полосы или индикатора.

      ## Пример целиком: карточка блюда в кабинете ресторана

      Вернёмся к менеджеру и спроектируем, как должно было быть. В уроке «Автосохранение» мы спроектировали
      описание блюда: оно сохраняется само как черновик и выходит к покупателям по отдельной кнопке «Опубликовать».
      Цена, состав и аллергены устроены иначе: их видят покупатели сразу после сохранения, а ошибка в них стоит денег
      и здоровья. Поэтому для них в кабинете отдельная форма с явной кнопкой «Сохранить» — её и разберём.

      **Выбор интерфейса.** Цену и состав блюда видят покупатели, а от цены зависят деньги. Поэтому сохранение
      карточки — пессимистичное: «Сохранено» появляется только после ответа сервера.

      **Пока менеджер пишет.** Каждые несколько секунд черновик карточки записывается в IndexedDB, привязанный
      к аккаунту менеджера, к блюду и к версии блюда, с которой он начал правку. Под формой статус: «Черновик на этом
      устройстве». Рядом с блюдом в списке — пометка «Есть несохранённые изменения», в шапке — «1 изменение
      не сохранено».

      **Нажатие «Сохранить».** Кнопка меняется на «Сохраняем…» и не нажимается повторно, поля остаются на месте.
      Сохранение — запрос `PUT` с заголовком `If-Match`, то есть «замени карточку, только если её версия всё ещё та,
      с которой я начал» (урок «Версии и конфликты»). `PUT` идемпотентен: повтор той же замены даёт тот же результат,
      поэтому автоматически повторять его безопасно (урок «Когда и как повторять»): второго «Том яма» не появится.
      Сервер не отвечает 15 секунд. Приложение делает ещё две попытки с растущей паузой, статус — «Сохраняем,
      повторная попытка…». Одна тонкость: если первая попытка всё-таки дошла, повтор получит ответ 412 «версия
      изменилась» на собственную правку; что с этим делать, покажет утренний эпизод ниже.

      **Попытки кончились.** У формы, а не в углу экрана, появляется блок: «Не удалось сохранить блюдо „Том ям“: сервер
      не отвечает. Ваши изменения на месте и сохранены на этом устройстве». Кнопки: «Повторить» и «Скопировать
      изменения».

      **Менеджер закрывает вкладку** и уходит домой. Черновик остался в IndexedDB.

      **Утром.** Менеджер открывает кабинет и видит: «Есть несохранённая карточка „Том ям“ от 18:40. Восстановить или
      удалить?» Он нажимает «Восстановить» и «Сохранить». Сервер отвечает 412: версия блюда уже не та.

      Здесь важно не поспешить с выводом. Возможно, одна из вчерашних попыток всё-таки дошла до сервера, а ответ
      потерялся, — тогда новая версия и есть правка самого менеджера. Поэтому приложение загружает текущую карточку
      и сравнивает её с черновиком. Если они совпадают, черновик удаляют и показывают «Сохранено». В нашем случае
      не совпадают: вечером другой менеджер поменял цену. Приложение показывает обе версии рядом и даёт выбрать, что
      оставить; свои правки состава и примечания менеджер не теряет.

      **Итог.** За весь эпизод не пропал ни один введённый символ. Интерфейс ни разу не сказал «сохранено», когда это
      было не так. А на каждом шаге у менеджера было понятное действие.

      ## Типичные ошибки

      - **Очищать форму или перезагружать страницу при ошибке.** Человек вводит всё заново или бросает.
      - **Бесконечные фоновые повторы под зелёной галочкой.** Интерфейс лжёт, а работа пропадает вместе с вкладкой.
      - **Оптимизм без видимого отказа:** отказ сервера показан исчезающим уведомлением в углу, а элемент на экране
        выглядит сохранённым.
      - **Кнопка «Повторить» для ошибки, которую повтор не лечит:** конфликт, отказ в правах, отменённый заказ.
      - **Одна сводка без индикаторов или индикаторы без сводки.** Человек либо не находит несохранённое, либо
        не знает, что оно есть.
      - **Молча стирать несохранённое при выходе из аккаунта** или при переключении на другой ресторан.
      - **Модальное окно на каждую мелочь.** Человек привыкает закрывать их не читая и пропускает важное.
      - **Хранить на устройстве секретное** или не удалять черновики при выходе на общем компьютере.

      ## Как спрашивают на интервью

      - «Человек двадцать минут заполнял форму, а сохранение не удалось. Что он должен увидеть и что сможет сделать?»
        — ждут, что ввод останется на месте, ошибка будет у формы и появится понятный путь восстановления.
      - «Сообщение в чате не отправилось. Как это показать?»
      - «Как показать пользователю, что у него есть несохранённые или неотправленные изменения?»

      ## Коротко

      - Работа пользователя — всё, что человек ввёл или сделал, но что сервер ещё не подтвердил. Провалы глазами
        человека — пропавший ввод и интерфейс, который солгал, что работа сохранена.
      - Рабочая середина между оптимизмом и ожиданием — показать результат сразу, но с честным статусом рядом, если на
        ложное «готово» не опираются другие люди. Отказ виден там же, где действие, не исчезает сам, а данные
        остаются.
      - Человек в любой момент понимает, где его работа: только на странице, на этом устройстве или на сервере. Это
        первая эвристика Нильсена — видимость состояния системы.
      - О несохранённом говорят двумя способами сразу: индикатор рядом с вещью отвечает «что с этой вещью», сводка в
        заметном месте — «всё ли у меня в порядке». Перед выходом из аккаунта и переключением ресторана вопрос задаёт
        само приложение.
      - Введённое исчезает, только когда человек сам этого захотел или сервер подтвердил сохранение: форму не очищают
        и не перезагружают при ошибке. Последний выход — «Скопировать текст».
      - Не терять ввод — цель, но не любой ценой: пароли, данные карт и коды на устройстве не хранят, а на общих
        компьютерах форму и хранилище очищают явно после отправки или ухода человека.
      - Автоповторы ограничивают и делают только для временных сбоев, а потом показывают состояние и путь
        восстановления под вид сбоя. При конфликте сравнивают версии, при истёкшей сессии входят, при окончательном
        отказе обращаются в поддержку или убирают действие, а при неизвестном исходе сначала выясняют его.
      - «Повторить» там, где повтор не поможет, — тоже ложное обещание. Важность сообщения подбирают по последствиям:
        модальное окно — только когда без решения человека дальше нельзя.

      ## Источники

      - [10 Usability Heuristics for User Interface Design — Nielsen Norman Group](https://www.nngroup.com/articles/ten-usability-heuristics/)
      - [Indicators, Validations, and Notifications — Nielsen Norman Group](https://www.nngroup.com/articles/indicators-validations-notifications/)
      - [HTML5 Security Cheat Sheet, раздел Local Storage — OWASP](https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html#local-storage)

  - id: sdd-uploads
    topic: Надёжность и восстановление
    subtopic: Загрузка файлов
    title: Загрузка файлов
    audio: https://color-zebra.github.io/frontend-quiz-audio/system-design-data/sdd-uploads.mp3
    body: |
      ## Какую проблему решаем

      Менеджер ресторана обновляет меню из кабинета на телефоне. Он снял 30 новых блюд и выбирает все фото разом:
      в среднем каждое весит около 8 МБ, вместе — 240 МБ. Ещё он хочет добавить короткое видео о том, как готовят
      фирменную пиццу, — 450 МБ.

      Если сделать загрузку «в лоб», одним запросом со всеми файлами, случится вот что:

      - **Несколько минут ничего не происходит.** Кнопка нажата, на экране крутится спиннер, и непонятно, загрузилась
        уже половина или ничего. Менеджер нажимает «Сохранить» ещё раз.
      - **Связь пропала на 95 %.** Он зашёл в лифт — и всё начинается с нуля, хотя 400 МБ уже ушли в сеть.
      - **Часть фото не подходит.** Сервер принимает фото до 10 МБ, а несколько снимков с новой камеры весят по 12 МБ.
        Об этом менеджер узнаёт после того, как ждал пять минут.
      - **Серверу тяжело.** Сотни мегабайт идут через сервер приложения, который в это время должен быстро отвечать
        на запросы покупателей.

      Загрузка файла — не обычный запрос. Она долгая, тяжёлая и часто идёт по плохой мобильной сети. Поэтому её
      проектируют отдельно: что видит человек, что делать при обрыве, через кого идут байты и сколько файлов
      отправлять одновременно.

      ## Основные понятия

      - **Файл в браузере** — объект `File`: у него есть имя, размер в байтах, тип и дата изменения. Сам файл
        браузер не читает целиком в память, пока вы этого не попросите. `File` — разновидность `Blob` (двоичные данные
        без имени), и от него можно отрезать кусок методом `slice`, не копируя весь файл.
      - **Прогресс загрузки** — сколько байт уже отправлено из скольких. Браузер сообщает его событиями `progress`
        у `XMLHttpRequest.upload`. У `fetch` такого события для отправки на момент написания нет, поэтому полосу
        прогресса обычно делают на `XMLHttpRequest` (подробности —
        [MDN, «Отслеживание прогресса загрузки»](https://developer.mozilla.org/ru/docs/Web/API/XMLHttpRequest/Using_XMLHttpRequest#отслеживание_прогресса_загрузки)).
      - **Отмена загрузки** — прерывание запроса на клиенте (`xhr.abort()` или `AbortController` у `fetch`).
      - **Загрузка по частям** (chunked upload, у Amazon S3 — multipart upload) — файл режется на куски, и каждый
        уходит отдельным запросом.
      - **Возобновляемая загрузка** (resumable upload) — после обрыва клиент продолжает с того места, где сервер
        перестал получать данные, а не с начала. Это место называют **смещением** (offset): сколько байт сервер уже
        сохранил.
      - **Объектное хранилище** (object storage) — отдельный сервис для файлов, например Amazon S3 или совместимые
        с ним. Файлы там лежат по ключу — строке вроде `menu/42/pizza.jpg`.
      - **Подписанная ссылка** (presigned URL) — адрес в хранилище, в который сервер приложения заранее вписал
        разрешение: «по этому адресу можно один файл с таким ключом положить в течение 15 минут». Клиент отправляет
        файл прямо туда, минуя сервер приложения.

      ## Жизненный цикл одной загрузки

      У каждого файла свой путь, и удобно описать его состояниями, как в уроке «Процесс как набор состояний»:

      1. **Выбран** — человек выбрал файл, ничего ещё не отправлено.
      2. **Отклонён** — клиент проверил тип или размер и сразу сказал, что не так.
      3. **В очереди** — файл ждёт своей очереди на отправку (зачем очередь — ниже).
      4. **Отправляется** — идёт передача, видна полоса с процентами.
      5. **Обрабатывается** — все байты ушли, но сервер ещё проверяет файл, уменьшает фото, перекодирует видео.
      6. **Готово**, **ошибка** или **отменено** — конечные состояния.

      Главная ловушка здесь — между четвёртым и пятым шагом. **100 % на полосе — это не «готово».** Событие `progress`
      говорит, сколько байт браузер отправил в сеть, а не сколько сервер принял и сохранил. Учебник learn.javascript.ru
      прямо пишет, что это событие подходит только для индикатора, а не для решения «что уже загружено»
      ([«Возобновляемая загрузка файлов»](https://learn.javascript.ru/resume-upload)). Видео после отправки ещё
      несколько минут перекодируется, и показывать его в меню как опубликованное рано. Поэтому у файла есть отдельное
      состояние «обрабатывается», и «готово» наступает только после ответа сервера.

      Каждое состояние видно в интерфейсе: у файла в списке своя полоса, своя кнопка «Отменить» или «Повторить»
      и свой текст ошибки. Одна общая полоса на 30 файлов прячет главное — какой именно файл не загрузился.

      ## Проверка и предпросмотр на клиенте

      Проверить файл до отправки — значит сэкономить человеку минуты ожидания. Обычно проверяют:

      - **тип** — атрибут `accept="image/jpeg,image/png"` у поля выбора файла сужает список в окне выбора, а свойство
        `file.type` позволяет отклонить лишнее после выбора;
      - **размер** — `file.size` сравнивают с лимитом сервера;
      - **для картинок — размеры в пикселях**, если меню требует, например, не меньше 800 точек по ширине.

      Предпросмотр делают без загрузки на сервер: `URL.createObjectURL(file)` даёт временный адрес, который можно
      поставить в `<img>`. Пока такой адрес существует, браузер не может освободить связанный с ним файл, поэтому,
      когда превью больше не нужно, адрес освобождают вызовом `URL.revokeObjectURL` (см. [MDN, «Использование файлов
      в веб-приложениях»](https://developer.mozilla.org/ru/docs/Web/API/File_API/Using_files_from_web_applications)).
      Память съедают и сами показанные превью: браузер хранит каждую картинку раскодированной, по несколько байт
      на точку. Тридцать снимков с камеры в полном размере — заметная нагрузка на дешёвый телефон, поэтому превью
      показывают маленькими и по мере прокрутки.

      Клиентская проверка — подсказка, а не защита. Браузер определяет `file.type` по расширению имени и не читает
      содержимое: переименуйте программу в `photo.jpg`, и тип будет `image/jpeg`. А запрос в обход интерфейса можно
      отправить вообще без всяких проверок. Поэтому сервер проверяет файл сам — по содержимому, размеру и правам
      пользователя. Это тот же принцип, что в уроке «Формы и валидация»: клиент помогает человеку, сервер принимает
      окончательное решение.

      ## Через свой сервер или напрямую в хранилище

      Есть два пути, по которым байты могут попасть в хранилище.

      **Через сервер приложения.** Клиент отправляет файл на ваш API, сервер его принимает и сам кладёт в хранилище.
      Просто и всё под контролем: сервер видит файл целиком, может сразу его проверить. Но каждый мегабайт проходит
      через ваш сервер дважды — сначала внутрь, потом в хранилище. Сервер держит соединение всё время загрузки,
      а у серверов приложений обычно есть лимит на размер тела запроса.

      **Напрямую по подписанной ссылке.** Загрузка идёт в три шага:

      1. Клиент просит у API разрешение: «хочу загрузить `pizza.jpg`, 8 МБ, `image/jpeg`, для блюда 42». Сервер
         проверяет права, сам выбирает ключ файла и возвращает подписанную ссылку со сроком действия.
      2. Клиент отправляет файл по этой ссылке прямо в хранилище.
      3. Клиент сообщает API: «файл по ключу такому-то загружен». Сервер проверяет, что объект действительно появился,
         смотрит его настоящий размер и тип и только тогда привязывает фото к блюду.

      Сервер приложения при этом обрабатывает два коротких запроса вместо сотен мегабайт. Цена тоже есть:

      - **Ссылка работает как ключ от двери.** Документация S3 называет подписанные ссылки токенами на предъявителя
        (bearer token): кто знает ссылку, тот и загружает, причём несколько раз, пока не истёк срок. Поэтому срок
        делают коротким — минуты, а не дни.
      - **Размер на шаге 1 — со слов клиента.** Подписанная ссылка на `PUT` обычно не ограничивает размер файла
        (если длину не вписали в подпись): по ней можно отправить и 8 МБ, и 5 ГБ. Ограничить размер заранее позволяет
        другой вид подписи — форма `POST` с политикой, в которой есть условие `content-length-range` («от … до … байт»; см. [POST Policy в документации
        S3](https://docs.aws.amazon.com/AmazonS3/latest/API/sigv4-HTTPPOSTConstructPolicy.html)); файл больше лимита
        хранилище отклонит само. Иначе размер проверяют на шаге 3 и лишнее удаляют.
      - **Сервер не видит файл до того, как тот попал в хранилище.** Проверку содержимого он делает после загрузки,
        на шаге 3 или отдельной обработкой.
      - **Брошенные файлы.** Если клиент загрузил файл и закрыл вкладку до шага 3, в хранилище лежит объект, на который
        никто не ссылается. Такие объекты удаляет правило очистки в хранилище.
      - **Хранилище нужно настроить** так, чтобы оно принимало запросы со страниц вашего сайта (CORS), и тип файла
        в запросе должен совпадать с тем, что вписан в подпись (если сервер его туда вписал), иначе хранилище
        откажет.

      ## Большие файлы: по частям и с возобновлением

      Видео в 450 МБ на мобильной сети грузится несколько минут, и за это время связь почти наверняка мигнёт. Если
      загрузка идёт одним запросом, обрыв на 400-м мегабайте означает начать заново. Решение — резать файл на части
      и уметь продолжить.

      **Как это устроено.** Файл делится на части, например по 8 МБ: видео в 450 МБ — это 57 частей (56 полных и одна
      неполная). Каждая часть уходит отдельным запросом. Если запрос упал, повторяют только эту часть, а не весь файл.
      Чтобы продолжить после обрыва, клиент спрашивает у сервера, что у того уже есть, и досылает остальное.

      Решающий момент: **о том, что уже загружено, знает только сервер.** Клиент не может посчитать это сам по событиям
      прогресса: последний кусок мог уйти в сеть, но не дойти. Поэтому любое возобновление начинается с вопроса
      серверу.

      Два распространённых способа:

      - **Протокол tus** — открытый протокол возобновляемой загрузки поверх HTTP. Клиент создаёт загрузку запросом
        `POST` и получает её адрес. Потом отправляет байты запросами `PATCH` с заголовком `Upload-Offset` — с какого
        байта начинается кусок. После обрыва клиент делает `HEAD` и получает в ответе `Upload-Offset`: столько байт
        сервер уже сохранил. Если клиент пришлёт кусок не с того места, сервер ответит `409 Conflict` и ничего
        не испортит. Это тот же код, что при конфликте версий, но смысл здесь свой — «спроси смещение и продолжи
        с него»; поэтому клиент разбирает 409 в контексте запроса, а не по одному коду.
      - **Загрузка частями в S3** (multipart upload) — клиент или сервер начинает загрузку и получает её номер
        (upload ID). Части с номерами от 1 до 10 000 можно отправлять в любом порядке и параллельно, каждая — не меньше
        5 МБ, кроме последней. На каждую часть хранилище возвращает метку ETag; номер части и метку нужно запомнить.
        В конце отправляют запрос «собери файл» со списком всех номеров и меток. S3 советует такую загрузку для
        файлов от 100 МБ. Часто каждую часть отправляют по своей подписанной ссылке.

      **Возобновление после перезагрузки страницы.** Если человек обновил страницу, браузер забыл выбранный файл.
      Номер загрузки и список готовых частей стоит сохранить в хранилище браузера (localStorage или IndexedDB — о
      выборе хранилища в уроке «Работа без сети и очередь действий»). Когда человек снова выберет тот же файл, клиент
      узнает его по отпечатку — имени, размеру и дате изменения — и предложит продолжить. Сам файл тоже можно положить
      в IndexedDB, но это копия на сотни мегабайт на устройстве.

      **Незаконченные загрузки стоят денег.** Части в S3 хранятся и оплачиваются, пока загрузку не завершат или
      не отменят. Поэтому кнопка «Отменить» отправляет серверу запрос на удаление (в tus — `DELETE`, в S3 — отмена
      загрузки частями), а для брошенных загрузок в хранилище настраивают правило «удалять незавершённые через
      несколько дней». У отмены в S3 есть тонкость: части, которые ещё шли в момент отмены, могут успешно загрузиться
      и после неё. Поэтому сначала прерывают запросы частей, дожидаются, пока они завершатся, и только потом отменяют
      загрузку.

      ## Сколько файлов отправлять одновременно

      Кажется, что 30 фото быстрее всего отправить сразу все. Посчитаем. 30 фото по 8 МБ — 240 МБ. Пусть сеть
      отдаёт 10 Мбит/с, это примерно 1,25 МБ/с. Вся пачка уйдёт за 240 / 1,25 ≈ 190 секунд — как ни крути, канал
      один.

      - **Все 30 сразу:** канал делится на 30 частей, каждое фото идёт со скоростью около 0,04 МБ/с, и все они
        заканчиваются почти одновременно — примерно через 190 секунд. Три минуты менеджер не видит ни одного готового
        фото.
      - **По три за раз:** каждое фото идёт со скоростью около 0,42 МБ/с и загружается примерно за 19 секунд. Первые
        фото готовы через 19 секунд, дальше новые появляются каждые несколько секунд, а вся пачка уходит за те же
        190 секунд.

      Общее время одинаковое, а ощущение совсем разное. Кроме того, у очереди есть ещё плюсы: при обрыве под удар
      попадают три загрузки, а не тридцать; меньше памяти уходит на одновременные запросы; человек может переставить
      или отменить файлы, которые ещё ждут. Поэтому при выборе многих файлов делают **очередь с ограничением
      параллельности** (concurrency limit): одновременно идут две-четыре загрузки, остальные ждут.

      Браузер и сам не откроет по протоколу HTTP/1.1 больше шести соединений к одному адресу, так что «все 30 сразу»
      на деле превратятся в очередь из шести. Но это очередь, которую приложение не видит: в каком порядке пойдут
      файлы, что делать с отменой и что показывать у ждущих, решает не оно. Своя очередь отдаёт всё это вам.

      ## Отмена и повтор

      **Отмена.** Кнопка «Отменить» прерывает запрос на клиенте. Но, как в уроке «Гонки запросов», отмена ожидания
      не отменяет то, что уже произошло на сервере: часть байт или частей может быть уже сохранена. Поэтому
      отменённую загрузку явно удаляют на сервере, а у файла в интерфейсе состояние «отменено», а не «ошибка».

      **Повтор.** Временный сбой при отправке части повторяют с растущей задержкой и лимитом попыток — это правила
      из урока «Когда и как повторять». Повтор части безопасен: в S3 часть с тем же номером просто перезапишет
      прежнюю, а в tus сервер примет только кусок с правильным смещением. А вот последний шаг — «привяжи фото
      к блюду» — это команда с эффектом, и повторять её стоит с ключом идемпотентности из урока «Повторы без двойных
      списаний», иначе к блюду привяжутся два одинаковых фото.

      ## Пример целиком: фото и видео в кабинете ресторана

      Соберём всё вместе для менеджера с 30 фото и видео в 450 МБ.

      1. **Выбор.** Менеджер выбирает файлы. Клиент сразу показывает превью и отклоняет четыре фото по 12 МБ с понятным
         текстом: «Фото больше 10 МБ — уменьшите его или выберите другое». Видео проходит по типу и по лимиту в 1 ГБ.
      2. **Очередь.** 26 фото и видео встают в очередь, одновременно идут три загрузки. У каждого файла своя полоса
         и кнопка «Отменить».
      3. **Фото — по подписанным ссылкам.** Для каждого фото клиент получает у API ссылку на 15 минут, отправляет
         файл одним запросом прямо в хранилище и сообщает API, что файл на месте. Сервер сверяет настоящий размер
         и тип объекта и удаляет его, если тот больше 10 МБ: проверка при выборе — только подсказка.
      4. **Видео — частями.** Сервер начинает загрузку частями и выдаёт ссылки на части по 8 МБ. Клиент сохраняет
         номер загрузки и список готовых частей в IndexedDB.
      5. **Обрыв.** В лифте связь пропадает на 40 секунде видео. Части, которые не дошли, клиент повторяет с паузой,
         когда сеть возвращается. Всё, что уже сохранено, повторно не отправляется.
      6. **Перезагрузка.** Телефон выгрузил вкладку из памяти. Менеджер открывает кабинет и видит: «Видео загружено
         на 62 %. Выберите тот же файл, чтобы продолжить». Клиент узнаёт файл по отпечатку, спрашивает у сервера
         список готовых частей и досылает остальные.
      7. **Обработка.** После последней части видео переходит в «обрабатывается»: сервер собирает его и перекодирует.
         В меню оно появится, когда сервер ответит «готово».

      ## Какой способ выбрать

      - **Один запрос через свой сервер**
        - Когда подходит: небольшие файлы — аватар, документ на пару мегабайт; сервер всё равно сразу
          обрабатывает файл.
        - Цена: трафик идёт через сервер приложения; обрыв — загрузка с нуля.
      - **Один запрос по подписанной ссылке**
        - Когда подходит: фото и документы до десятков мегабайт, много пользователей.
        - Цена: три шага вместо одного, настройка хранилища, брошенные файлы, проверка размера и содержимого после
          загрузки (или подписанная форма с лимитом размера).
      - **По частям с возобновлением (tus или загрузка частями в S3)**
        - Когда подходит: видео и архивы на сотни мегабайт, мобильная сеть.
        - Цена: сложнее клиент и сервер, нужно хранить номер загрузки и чистить незавершённые.

      Ограничение параллельности и проверка на клиенте нужны в любом из вариантов, как только человек может выбрать
      много файлов.

      ## Типичные ошибки

      - **Считать 100 % на полосе готовым файлом.** Человек видит «загружено», а файл ещё обрабатывается или вовсе
        отклонён сервером.
      - **Одна полоса на всю пачку.** Непонятно, какой файл не загрузился и что повторить.
      - **Доверять клиентской проверке.** Тип по расширению подделывается переименованием, а сервер, который
        не проверяет сам, примет что угодно.
      - **Отправлять всё сразу.** Ни один файл не готов до самого конца, а обрыв бьёт по всем загрузкам.
      - **Возобновлять по своим подсчётам.** Клиент решает, что отправил 300 МБ, и продолжает с этого места, а сервер
        сохранил 290 МБ — файл получается битым.
      - **Считать, что подписанная ссылка ограничивает размер.** Ссылка на `PUT` примет файл любого размера; лимит
        держит подписанная форма с условием на размер или проверка на сервере после загрузки.
      - **Долгоживущие подписанные ссылки.** Ссылка на неделю — это неделя, в течение которой кто угодно, кто её
        увидел, может положить файл в ваше хранилище.
      - **Забыть про брошенные загрузки.** Незавершённые части и непривязанные файлы копятся в хранилище и стоят денег.

      ## Как спрашивают на интервью

      - «Спроектируйте загрузку фото в фотохостинг» или «загрузку больших файлов в облачное хранилище» — ждут прогресс
        по каждому файлу, очередь, проверку на клиенте и сервере, подписанные ссылки и возобновление.
      - «Пользователь загружает видео на 2 ГБ по мобильной сети, связь рвётся. Что вы сделаете?» — ждут загрузку
        по частям и то, что смещение берётся у сервера.
      - «Почему не отправить файл через наш API?» — ждут сравнения трафика, нагрузки на сервер и цены прямой загрузки.

      ## Коротко

      - Небольшой файл, который сервер сразу обрабатывает, отправляют одним запросом через свой сервер, фото и
        документы до десятков мегабайт при многих пользователях — по подписанной ссылке, а видео и архивы на сотни
        мегабайт по мобильной сети — частями с возобновлением.
      - Между «отправляется» и «готово» у файла есть состояние «обрабатывается»: 100 % на полосе — не «готово».
        Событие `progress` говорит, что отправил браузер, а «готово» наступает только после ответа сервера.
      - Прогресс отправки дают события `XMLHttpRequest.upload`, у `fetch` их на момент написания нет. У каждого файла
        своя полоса, кнопка и текст ошибки, а не одна общая полоса на пачку.
      - На клиенте проверяют тип и размер и показывают предпросмотр, чтобы сэкономить человеку ожидание. Это
        подсказка: `file.type` берётся из расширения, и окончательно файл проверяет сервер по содержимому.
      - Загрузка по подписанной ссылке разгружает сервер приложения: клиент получает у API ссылку, отправляет файл
        прямо в хранилище и сообщает API, что файл на месте. Сервер проверяет настоящий размер и тип и только потом
        привязывает файл, а брошенные файлы удаляет правило очистки хранилища.
      - Подписанная ссылка — токен на предъявителя, поэтому срок у неё короткий. `PUT` по ней обычно не ограничивает
        размер: лимит держит подписанная форма `POST` с `content-length-range` или проверка после загрузки.
      - Большие файлы режут на части и возобновляют после обрыва (tus или multipart upload в S3). Что уже загружено,
        знает только сервер, поэтому возобновление начинается с вопроса серверу, а незавершённые загрузки удаляют: они
        стоят денег.
      - При выборе многих файлов делают очередь с ограничением параллельности, две-четыре загрузки сразу: общее время
        то же, но первые файлы готовы быстро, а обрыв бьёт по немногим. Отменённую загрузку явно удаляют на сервере,
        потому что отмена на клиенте не отменяет сохранённого.

      ## Источники

      - [Resumable upload protocol — tus.io](https://tus.io/protocols/resumable-upload)
      - [Uploading and copying objects using multipart upload — документация Amazon S3](https://docs.aws.amazon.com/AmazonS3/latest/userguide/mpuoverview.html)
      - [Download and upload objects with presigned URLs — документация Amazon S3](https://docs.aws.amazon.com/AmazonS3/latest/userguide/using-presigned-url.html)

  - id: sdd-session
    topic: Надёжность и восстановление
    subtopic: Сессия и обновление токена
    title: Сессия и обновление токена
    audio: https://color-zebra.github.io/frontend-quiz-audio/system-design-data/sdd-session.mp3
    body: |
      ## Какую проблему решаем

      Менеджер ресторана сорок минут правит меню в кабинете: переписал описания пяти блюд, поменял цены, загрузил
      фото. Нажимает «Сохранить» — и вместо зелёной галочки его выкидывает на страницу входа. После входа он видит
      меню таким, каким оно было сорок минут назад. Работа пропала.

      Причина обычная: истёк срок действия доступа, сервер ответил `401`, а клиент на любой `401` отправлял человека
      на вход. А ведь ничего страшного не случилось: доступ можно было тихо продлить, и человек бы ничего не заметил.

      Бывает и наоборот. Главный экран кабинета при открытии делает шесть запросов: заказы, меню, отзывы, выручка,
      стоп-лист, уведомления. Доступ истёк, все шесть получают `401`, и каждый сам начинает продлевать доступ.
      Сервер видит шесть одновременных попыток продлить доступ с одними и теми же данными, принимает это за признак
      кражи и завершает сессию. Человек снова на странице входа, хотя ничего плохого не случилось.

      Этот урок — о том, как продлевать доступ незаметно, ровно один раз и как честно сказать человеку, когда продлить
      уже нельзя.

      ## Действующие лица: сессия и два токена

      - **Сессия** — период, в течение которого сервер помнит, что это вы: от входа до выхода или до тех пор, пока
        сервер её не завершит.
      - **Токен доступа** (access token) — строка, которую клиент прикладывает к каждому запросу к API, обычно
        в заголовке `Authorization: Bearer …`. Живёт недолго — как правило, минуты. Короткий срок нужен, чтобы
        украденный токен быстро стал бесполезен.
      - **Токен обновления** (refresh token) — долгоживущий токен, который нужен только для одного: получить новый
        токен доступа. Его отправляют не в API, а серверу авторизации. Так он описан в стандарте OAuth 2.0 (RFC 6749,
        раздел 1.5).
      - **Обновление токена** (token refresh) — запрос «вот мой токен обновления, дай новый токен доступа».
      - **Ротация токена обновления** (refresh token rotation) — при каждом обновлении сервер выдаёт и новый токен
        обновления, а старый перестаёт действовать. По RFC 6749 (раздел 6) клиент, получив новый токен обновления,
        обязан выбросить старый.
      - **Отзыв сессии** (revocation) — сервер завершил сессию раньше срока: человек нажал «Выйти на всех
        устройствах», сменил пароль, администратор отключил сотрудника.

      Не во всех приложениях токены видны коду клиента. Часто сессия живёт в cookie с флагом `HttpOnly`, который
      скрипт прочитать не может, а продление делает собственный сервер. Механика для фронтенда от этого почти
      не меняется: истёкший доступ всё так же приходит ответом `401`, и всё так же нужно продлить его один раз и
      повторить запросы.

      ## Где хранить токены — коротко

      Подробно безопасность разбирается в курсе «Доставка и качество», в теме «Сквозные требования». Здесь — главное. OWASP, открытое
      сообщество по безопасности веб-приложений, советует не хранить идентификаторы сессии в localStorage: всё, что
      там лежит, доступно любому скрипту на странице, и одна уязвимость XSS (внедрение чужого скрипта) позволит
      их украсть. Cookie с флагом `HttpOnly` скрипт прочитать не может. Поэтому распространённая схема такая: токен обновления — в `HttpOnly` cookie, токен доступа — в памяти
      вкладки. После перезагрузки страницы токен доступа пропадает, и клиент первым делом получает новый.

      ## Что на самом деле значит 401

      Сначала разберёмся, какой ответ что означает, — от этого зависит реакция.

      - **`401` от API**
        - Что значит: доступ не принят — токен истёк, испорчен или отозван.
        - Что делать: попробовать продлить доступ и повторить запрос.
      - **`403` от API**
        - Что значит: кто вы, сервер понял, но этого вам делать нельзя.
        - Что делать: не продлевать токен по кругу, а показать «нет доступа».
      - **Отказ при обновлении** (`400` с ошибкой `invalid_grant` или `401`)
        - Что значит: токен обновления недействителен — сессия истекла или отозвана.
        - Что делать: продлить нельзя, нужен вход заново.
      - **Сеть пропала или `5xx` при обновлении**
        - Что значит: неизвестно — сервер авторизации просто не ответил.
        - Что делать: сессия, скорее всего, жива, поэтому обновление повторяют позже.
        - Оговорка: при ротации обновление — запись с неизвестным исходом. Сервер мог уже выдать новую пару
          токенов, а потерялся только ответ; тогда повтор со старым токеном обновления сервер может принять
          за кражу и завершить сессию. Худший исход здесь — вход заново, поэтому несохранённый ввод берегут заранее.

      Про `403` есть оговорка. Обычно новый токен не даёт новых прав: сервер проверяет права по своей базе. Но если
      роли записаны прямо в токен доступа, выданные администратором права появятся только в новом токене. Тогда
      одно обновление по явной причине («вам открыли доступ, обновите страницу») уместно — но это не цикл «получил
      `403` — обновил — повторил».

      Важная деталь стандарта HTTP (RFC 9110): ответ `401` означает, что запрос **не был применён**. Сервер не стал
      его выполнять, потому что не принял доступ. Значит, после продления можно спокойно повторить даже запись —
      «Сохранить блюдо» не выполнится дважды. Если у команды есть ключ идемпотентности (урок «Повторы без двойных
      списаний»), при повторе отправляют тот же ключ.

      А вот по самому ответу `401` от API нельзя понять, истёк токен или сессию отозвали: в обоих случаях токен
      доступа не принят. Разница проявится на следующем шаге — при попытке обновления. Истёкший токен обновится,
      отозванная сессия — нет.

      ## Продлить незаметно и повторить

      Схема обработки `401` такая:

      1. Запрос к API вернул `401`.
      2. Клиент обновляет токен.
      3. Получилось — повторяет исходный запрос с новым токеном. Человек ничего не заметил.
      4. Не получилось из-за отказа сервера авторизации — сессия закончилась, нужен вход (как это показать — ниже).

      Три правила, без которых схема ломается:

      - **Каждый запрос повторяется не больше одного раза.** Если и после свежего токена пришёл `401`, дело не в сроке,
        и бесконечный круг «обновить — повторить» только нагрузит сервер.
      - **Сам запрос обновления не проходит через этот обработчик.** Иначе отказ при обновлении запустит новое
        обновление, и так по кругу.
      - **Ошибка сети при обновлении — не выход из сессии.** Сессия, скорее всего, жива: подождать и повторить
        обновление по правилам урока «Когда и как повторять». При ротации исход такого обновления неизвестен,
        поэтому приложение заранее готово к входу заново и бережёт ввод (оговорка выше).

      ## Одно обновление на пачку запросов

      Вернёмся к главному экрану с шестью запросами. Если каждый запрос, получив `401`, сам запускает обновление,
      уйдёт шесть обновлений с одним и тем же токеном обновления. При ротации первое из них получит новую пару токенов,
      а остальные пять предъявят уже недействительный токен.

      Что сервер сделает в этот момент, описано в рекомендациях по безопасности OAuth (RFC 9700, раздел 4.14.2). Если
      один и тот же токен обновления предъявили дважды, сервер считает, что его украли, и, не зная, кто из двоих
      настоящий, отзывает действующий токен обновления. Сессия честного пользователя завершается. Там же сказано,
      что сервер может отозвать токены обновления при смене пароля или выходе — это и есть отзыв сессии.

      Некоторые серверы авторизации дают короткое окно, в которое повтор только что заменённого токена прощается, —
      например, Rotation Overlap Period в Auth0, в API — `leeway`
      ([документация Auth0 о ротации](https://auth0.com/docs/secure/tokens/refresh-tokens/configure-refresh-token-rotation)).
      Но по умолчанию оно там выключено, и рассчитывать на него клиент не должен.

      Решение — **одно обновление в полёте** (single-flight): первый запрос, получивший `401`, запускает обновление,
      а все остальные ждут его результата и не начинают своё. Это та же дедупликация одинаковых запросов, что в уроке
      «Лишние и одинаковые запросы», только для обновления токена. Ждать должны и запросы, которые стартовали уже
      во время обновления: им незачем уходить со старым токеном и гарантированно получать `401`.

      ```ts
      let refreshing: Promise<string> | null = null;

      function refreshOnce(): Promise<string> {
        // Все, кто пришёл во время обновления, получают одно и то же обещание.
        refreshing ??= refreshToken().finally(() => { refreshing = null; });
        return refreshing;
      }

      async function request(url: string, init: RequestInit = {}): Promise<Response> {
        if (refreshing) await refreshing;            // новые запросы ждут идущего обновления
        const sentWith = currentToken();
        const res = await fetch(url, withToken(init, sentWith));
        if (res.status !== 401) return res;

        // Токен уже успели обновить, пока этот запрос был в пути, — просто повторяем.
        if (currentToken() === sentWith) await refreshOnce();
        return fetch(url, withToken(init, currentToken())); // ровно один повтор
      }
      ```

      Обратите внимание на сравнение `currentToken() === sentWith`. Это случай **опоздавшего ответа**: запрос ушёл
      со старым токеном, пока он был в пути, другой запрос уже успел обновить токен, и только потом пришёл `401`.
      Обновлять второй раз не нужно — достаточно повторить запрос с уже новым токеном. Без этой проверки опоздавший
      ответ запустит лишнее обновление, а при ротации — ещё и предъявит токен, который только что заменили.

      Если `refreshToken()` завершится отказом, все ожидающие запросы получат одну и ту же ошибку и один общий исход:
      «сессия закончилась». Человек увидит одно сообщение, а не шесть.

      **Несколько вкладок.** Две открытые вкладки кабинета — та же гонка, только между вкладками, и общая переменная
      в памяти её не решает. Обычно одна вкладка обновляет токен, а остальные узнают об этом через общий канал
      (`BroadcastChannel`) или ждут друг друга через Web Locks API. Подробно о координации вкладок — в курсе «Синхронизация и офлайн»,
      в теме «Согласованность между клиентами».

      ## Обновлять заранее или по ответу 401

      Токен доступа часто содержит время окончания, и клиент может обновить его заранее — например, за минуту до
      срока.

      - **По ответу `401`**
        - Что даёт: просто, работает при любых сроках и любых часах устройства.
        - Цена: первый запрос после истечения тратит лишний круг до сервера.
      - **Заранее, по таймеру**
        - Что даёт: запросы почти не встречают `401`, меньше задержек.
        - Цена: таймеры фоновой вкладки браузер замедляет, ноутбук засыпает, часы устройства могут спешить
          или отставать.

      Таймер — оптимизация, а не замена: после сна ноутбука или заморозки вкладки он сработает поздно, и запрос всё
      равно получит `401`. Поэтому обработка `401` нужна в любом случае, а обновление заранее добавляют сверху, если
      лишняя задержка заметна.

      ## Истёкший токен и отозванная сессия: что видит человек

      Это два разных исхода, и человеку о них говорят по-разному.

      **Истёкший токен** — штатная ситуация. Человек не должен её замечать: ни сообщений, ни перехода на вход, ни
      потерянного ввода. Запросы чуть дольше ждут ответа, пока идёт обновление, и всё.

      **Отозванная или истёкшая сессия** — продлить нельзя, нужен вход. Здесь важно не потерять работу:

      - **Сохранить несохранённое.** Всё, что человек ввёл, остаётся на экране, а если требования безопасности
        позволяют, — и в хранилище устройства, как черновик из урока «Автосохранение».
      - **Сказать понятно, что случилось.** Не «Ошибка 401», а «Сессия завершилась. Войдите снова — ваши изменения
        не пропадут». Если сервер сообщил причину («пароль изменён»), её стоит показать.
      - **Войти, не уходя со страницы.** Окно входа поверх текущего экрана или переход на вход с возвратом на тот же
        адрес. После входа отложенные действия отправляются снова.
      - **Проверить, что вошёл тот же человек.** Если после входа в кабинете другой аккаунт, отправлять чужой черновик
        от его имени нельзя. Его стоит показать и спросить, что с ним делать.

      Это частный случай урока «Как не потерять работу пользователя»: явный путь восстановления вместо молчаливой
      потери.

      ## Пример целиком: кабинет ресторана

      Токен доступа живёт 10 минут, токен обновления — 30 дней и меняется при каждом обновлении.

      1. Менеджер 40 минут правит меню; токен доступа за это время истекал несколько раз и каждый раз тихо
         обновлялся по первому `401`.
      2. Он нажимает «Сохранить». Одновременно уходят три запроса: сохранить блюда, привязать новые фото, обновить
         стоп-лист. Все три получают `401`.
      3. Первый запускает обновление, два других ждут того же обещания. Уходит одно обновление, приходит новая пара
         токенов.
      4. Все три запроса повторяются с новым токеном и проходят. Менеджер видит «Сохранено».

      Другой день. Владелец ресторана сменил пароль и завершил все сессии сотрудников.

      1. Менеджер нажимает «Сохранить», запрос получает `401`.
      2. Обновление возвращает `invalid_grant`: токен обновления отозван.
      3. Клиент сохраняет изменения меню как черновик на устройстве и показывает окно: «Сессия завершена, потому что
         изменился пароль. Войдите снова — изменения сохранены».
      4. Менеджер входит под новым паролем. Клиент видит тот же аккаунт и отправляет изменения. Если бы вошёл другой
         сотрудник, клиент показал бы черновик и спросил, сохранить его или удалить.

      И ещё одна связь с прошлым уроком. Подписанные ссылки на загрузку файлов проверяются хранилищем, а не API, и
      токен доступа на них не влияет. Но у них свой срок: если долгая загрузка частями переживёт срок ссылок,
      клиент просит у API новые ссылки для оставшихся частей — и этот запрос к API подчиняется тем же правилам `401`.

      ## Типичные ошибки

      - **Любой `401` — на страницу входа.** Истёкший токен, который можно было тихо продлить, стоит человеку
        сорока минут работы.
      - **Каждый запрос обновляет сам.** Несколько обновлений с одним токеном обновления при ротации выглядят как
        кража, и сервер завершает сессию.
      - **Обновлять на каждый `403`.** Обычно новый токен не даёт новых прав, а клиент крутится в цикле
        «обновить — повторить».
      - **Повторять без лимита.** После свежего токена снова `401` — значит, дело не в сроке.
      - **Считать ошибку сети при обновлении выходом из сессии.** Человек в метро теряет сессию из-за туннеля.
      - **Полагаться только на таймер.** Спящий ноутбук и замороженная вкладка просыпаются с истёкшим токеном.
      - **Хранить токены в localStorage «для удобства».** Одна уязвимость XSS — и токены у злоумышленника.
      - **Отправлять отложенные действия после входа, не проверив аккаунт.** Черновик одного сотрудника сохраняется
        от имени другого.

      ## Как спрашивают на интервью

      - «Пользователь заполняет длинную форму, а токен истекает. Как не потерять ввод?»
      - «На экране десять запросов одновременно получили `401`. Что произойдёт и как это исправить?» — ждут одно
        обновление в полёте, очередь ожидающих запросов и один повтор.
      - «Чем отличается истёкший токен от отозванной сессии и что увидит пользователь в каждом случае?»

      ## Коротко

      - Токен доступа короткий и прикладывается к каждому запросу к API, а токен обновления долгий и нужен, только
        чтобы получить новый токен доступа. При ротации каждое обновление выдаёт и новый токен обновления, а старый
        перестаёт действовать.
      - Распространённая схема хранения: токен обновления в `HttpOnly` cookie, токен доступа в памяти вкладки. OWASP
        советует не хранить идентификаторы сессии в `localStorage`: одна уязвимость XSS — и их украдут.
      - `401` от API — повод продлить доступ и повторить запрос, а `403` — показать «нет доступа», а не обновлять по
        кругу. Отказ при обновлении (`400` с `invalid_grant` или `401`) значит, что сессия закончилась и нужен вход.
      - `401` значит, что запрос не был применён, поэтому после продления можно повторить даже запись, с тем же ключом
        идемпотентности, если он есть.
      - Схема держится на трёх правилах: каждый запрос повторяют не больше одного раза, сам запрос обновления не
        проходит через обработчик `401`, а ошибка сети или 5xx при обновлении — не выход из сессии: её повторяют
        позже, но при ротации исход неизвестен, и повтор может завершить сессию, поэтому ввод берегут заранее.
      - Обновление делают одно на пачку запросов (single-flight): остальные ждут того же обещания, ведь несколько
        обновлений с одним токеном при ротации сервер принимает за кражу. Если `401` пришёл на запрос со старым
        токеном, а токен уже обновили, второй раз не обновляют, а просто повторяют запрос.
      - Обновление заранее по таймеру — оптимизация поверх обработки `401`, а не её замена: таймеры в фоне и после сна
        срабатывают поздно.
      - Истёкший токен человек не должен замечать. При отозванной сессии ввод сохраняют, понятно говорят, что
        случилось, дают войти, не уходя со страницы, и перед отправкой отложенного проверяют, что вошёл тот же
        человек.

      ## Что вы теперь умеете

      Это последний урок курса «Данные и надёжность». Курс 1 научил ставить задачу, делить систему на части и решать,
      кто владеет данными. Этот курс научил тому, что происходит, когда данные идут по сети, а сеть ведёт себя
      как сеть: медленно, с обрывами и не по порядку. Теперь вы умеете:

      - **Выбирать, когда и что загружать,** и замечать водопад запросов и лишние данные.
      - **Устраивать клиентский кэш:** ключ, владелец, срок свежести и срок хранения, инвалидация.
      - **Убирать лишние запросы** — дедупликацией, отменой, пакетами — и предзагружать то, что понадобится.
      - **Делать пагинацию живых списков** без дублей и пропусков и выбирать между страницами, «Показать ещё»
        и бесконечной прокруткой.
      - **Защищаться от гонок:** отбрасывать устаревшие ответы, выстраивать записи в очередь, проверять версию.
      - **Показывать изменения сразу** оптимистично и откатывать их, если сервер отказал.
      - **Повторять без двойных списаний** с ключом идемпотентности и обрабатывать неизвестный исход после тайм-аута.
      - **Находить конфликты правок** через версии и условные запросы и выбирать, как их разрешать.
      - **Сверять кэш после изменения,** не затирая более новые данные.
      - **Проектировать формы:** проверка на клиенте и на сервере, момент показа ошибок, многошаговые формы.
      - **Различать сбои и повторять разумно:** растущая задержка, случайный разброс, лимит попыток.
      - **Не терять работу человека:** автосохранение, очередь действий без сети, понятные пути восстановления.
      - **Загружать файлы** с прогрессом, отменой, возобновлением и напрямую в хранилище.
      - **Продлевать сессию** незаметно и один раз и честно говорить, когда продлить нельзя.

      ## Что дальше: курсы «Доставка и качество» и «Реальное время и большие списки»

      Следующие два курса опираются на оба первых, а друг от друга почти не зависят: их можно проходить в любом
      порядке.

      - **«Доставка и качество»** — как продукт доезжает до человека: метрики скорости (LCP, INP, CLS), выбор,
        где собирать страницу — в браузере, на сервере или заранее при сборке, разбиение кода, картинки и видео, кэш файлов и выкатка новой версии
        при открытых вкладках, Service Worker, маршруты. И требования, которые проходят через всё приложение:
        безопасность, доступность, наблюдаемость, тесты, флаги и постепенная выкатка, локализация.
      - **«Реальное время и большие списки»** — данные, которых много и которые меняются сами: списки на десятки
        тысяч строк, виртуализация, тяжёлые вычисления без зависаний, выбор «всех» в частично загруженном списке; опрос
        сервера, SSE или WebSocket, переподключение, повторные и пропущенные события, снимок данных плюс поток изменений,
        чаты, статусы «печатает» и «прочитано», уведомления.

      Многое из этого курса там пригодится сразу. Фото блюд, которые мы научились загружать, в курсе «Доставка
      и качество» нужно быстро отдать покупателю. А в курсе «Реальное время и большие списки» переподключение к серверу
      событий повторяет правила повторов, и живые обновления становятся ещё одним способом поддерживать кэш свежим.

      ## Источники

      - [RFC 6749 «The OAuth 2.0 Authorization Framework», раздел 6: Refreshing an Access Token](https://www.rfc-editor.org/rfc/rfc6749#section-6)
      - [RFC 9700 «Best Current Practice for OAuth 2.0 Security», раздел 4.14.2: Refresh Token Protection, Recommendations](https://www.rfc-editor.org/rfc/rfc9700#section-4.14.2)
      - [HTML5 Security Cheat Sheet, раздел Local Storage — OWASP](https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html#local-storage)

questions:
  - id: sdd-intro-001
    topic: Введение
    subtopic: Ненадёжная сеть
    level: junior
    question: |
      В трекере задач человек открыл доску 20 минут назад и с тех пор не обновлял страницу. Ошибок не было, сеть
      работает. Что верно о задачах, которые он видит на экране?
    options:
      - text: 'Это снимок на момент ответа сервера; с тех пор коллеги могли их изменить'
        correct: true
        why: 'Владелец задач — сервер, а на экране копия, сделанная в момент ответа. Пока клиент не спросит сервер снова, он не узнает об изменениях.'
      - text: 'Они совпадают с сервером, раз за 20 минут не было ни одной ошибки'
        why: 'Отсутствие ошибок говорит только о том, что запросы не падали. Об изменениях на сервере копия всё равно не знает.'
      - text: 'Они совпадают с сервером, пока вкладка открыта и есть связь'
        why: 'Открытая вкладка и работающая сеть сами ничего не обновляют: копия меняется, только когда клиент снова получает данные.'
      - text: 'Они могли устареть, только если человек уходил в другую вкладку'
        why: 'Оригинал на сервере меняется независимо от того, куда смотрит человек. Устареть копия может и на активной вкладке.'
    explanation: |
      Сервер — владелец данных, а клиент держит копии. Каждая копия — снимок на момент, когда сервер готовил ответ.
      Пока она лежит на экране, коллеги могут переносить и закрывать задачи, и копия об этом не узнает, пока клиент
      не запросит данные снова. Поэтому вопрос не «устарела ли копия», а «насколько ей можно доверять и когда её
      перепроверить» — этому посвящены уроки о кэше и свежести данных.
    links:
      - https://lasr.cs.ucla.edu/classes/188_winter15/readings/fallacies.pdf

  - id: sdd-intro-004
    topic: Введение
    subtopic: Ненадёжная сеть
    level: middle
    question: |
      Дашборд аналитики при открытии делает 12 запросов друг за другом: каждый следующий начинается, когда пришёл
      ответ на предыдущий. Каждый ответ весит 5 КБ. У пользователя мобильная сеть: полный круг запроса — 200 мс,
      скорость загрузки — 1 МБ в секунду. Что больше всего замедляет открытие дашборда?
    options:
      - text: 'Задержка: 12 кругов по 200 мс — около 2,4 секунды одного ожидания'
        correct: true
        why: 'Все 60 КБ при скорости 1 МБ/с передаются меньше чем за 0,1 секунды. Почти всё время уходит на 12 полных кругов, которые идут друг за другом.'
      - text: 'Пропускная способность: 60 КБ — много для мобильной сети'
        why: 'При 1 МБ/с 60 КБ передаются примерно за 0,06 секунды. Это малая доля от 2,4 секунды, которые уходят на круги запросов.'
      - text: 'Размер ответов: каждый ответ в 5 КБ стоит сжимать гораздо сильнее'
        why: 'Сжатие уменьшит и без того крошечное время передачи. Число кругов останется прежним, и дашборд почти не ускорится.'
      - text: 'Число соединений: браузер не откроет 12 соединений сразу'
        why: 'Запросы идут строго по одному, поэтому одновременных соединений здесь нет. Ограничение браузера на их число ни при чём.'
    explanation: |
      Задержка — время полного круга запроса, пропускная способность — сколько данных сеть передаёт за секунду.
      Для маленьких ответов решает задержка: 12 кругов по 200 мс дают 2,4 секунды, а сами 60 КБ при 1 МБ/с
      проходят за сотые доли секунды. Это заблуждение «задержка равна нулю»: на локальном сервере круг занимает
      миллисекунды, и цепочка из 12 запросов незаметна. Лечат его уменьшением числа кругов — об этом урок «Когда
      и что загружать».
    links:
      - https://lasr.cs.ucla.edu/classes/188_winter15/readings/fallacies.pdf

  - id: sdd-intro-003
    topic: Введение
    subtopic: Ненадёжная сеть
    level: senior
    multiple: true
    question: |
      Команда делает веб-карту для туристов. Ею пользуются в горах: мобильная связь слабая и часто пропадает,
      трафик в роуминге дорогой. Разработчики проверяли карту только на офисном Wi-Fi. В плане записаны допущения.
      Какие из них — заблуждения о сети, опасные для этих пользователей?
    options:
      - text: 'Фрагменты карты можно грузить по одному, друг за другом: каждый запрос быстрый'
        correct: true
        why: 'Это заблуждение «задержка равна нулю». На слабой мобильной сети каждый круг запроса — сотни миллисекунд, и цепочка из десятков запросов растянется на секунды.'
      - text: 'Если запрос не прошёл, человек нажмёт «Обновить», и всё загрузится'
        correct: true
        why: 'Это заблуждение «сеть надёжна». В горах связи может не быть часами, и кнопка «Обновить» не поможет: нужен план на случай без сети.'
      - text: 'Скачивать подробную карту всего района заранее ничего не стоит'
        correct: true
        why: 'Это заблуждение «транспорт бесплатен». Трафик в роуминге оплачивает пользователь, а лишние мегабайты ещё и долго грузятся.'
      - text: 'Ответ сервера может не прийти вовсе, даже если запрос с телефона ушёл'
        why: 'Это не заблуждение, а верное понимание: сеть ненадёжна. Опасно обратное допущение — что на каждый ушедший запрос придёт ответ.'
      - text: 'Скачанная заранее карта района займёт трафик, зато откроется без сети'
        why: 'Это честная оценка цены, а не заблуждение: здесь учтено, что транспорт не бесплатен. Решение принимают, зная эту цену.'
    explanation: |
      Восемь заблуждений о распределённых вычислениях — допущения, которые код делает молча, если его проверяли
      только на быстрой сети: сеть надёжна, задержка равна нулю, пропускная способность бесконечна, транспорт
      бесплатен и другие. Для туристов в горах опасны сразу три: длинные цепочки запросов, расчёт на то, что сеть
      вернётся по нажатию кнопки, и вера в бесплатный трафик. Утверждения «ответ может не прийти» и «заранее
      скачанная карта стоит трафика» звучат похоже, но это не заблуждения, а правильный учёт свойств сети.
    links:
      - https://lasr.cs.ucla.edu/classes/188_winter15/readings/fallacies.pdf

  - id: sdd-fetching-001
    topic: Получение и кэширование данных
    subtopic: Стратегия загрузки
    level: junior
    question: |
      В почтовом клиенте к письму приложен PDF на 5 МБ. Значок файла виден сразу под текстом письма, но открывают
      вложение примерно в одном письме из десяти — нажатием на значок. Когда загружать сам файл?
    options:
      - text: 'По требованию — когда человек нажмёт на значок файла'
        correct: true
        why: 'Файл нужен одному человеку из десяти и только после явного действия. Остальные девять не потратят 5 МБ трафика; цена — короткое ожидание после нажатия.'
      - text: 'Лениво — когда значок файла появится в видимой области'
        why: 'Значок виден сразу под текстом, то есть почти в каждом открытом письме. Ленивая загрузка скачает файл девяти людям из десяти, которым он не нужен.'
      - text: 'Сразу — вместе с текстом письма, одним общим ответом'
        why: 'Текст письма будет ждать 5 МБ, которые нужны немногим. Это избыточная загрузка: первый экран медленный, трафик потрачен впустую.'
      - text: 'В фоне — сразу после того, как текст письма показан'
        why: 'Человек не ждёт, но файл всё равно скачается в девяти письмах из десяти зря. Фоновая загрузка оправдана, когда данные почти наверняка понадобятся.'
    explanation: |
      Загрузку можно начать сразу, лениво, по требованию или в фоне. Лениво грузит само приложение по сигналу
      «скоро понадобится», например при прокрутке. По требованию грузят только после явного действия человека.
      Когда данные большие, а нужны немногим и только по нажатию, загрузка по требованию экономит больше всего:
      ни одного лишнего байта, а цена — ожидание после клика.
    links:
      - https://developer.mozilla.org/ru/docs/Web/Performance/Guides/Lazy_loading

  - id: sdd-fetching-002
    topic: Получение и кэширование данных
    subtopic: Стратегия загрузки
    level: junior
    question: |
      Экран «Уведомления» в онлайн-банке: три коротких списка настроек по 5–8 переключателей. Все три помещаются
      на первом экране телефона, и обычно человек что-то меняет в каждом. API отдаёт каждый список отдельным
      запросом. Как их загружать?
    options:
      - text: 'Запустить все три запроса сразу и одновременно при открытии экрана'
        correct: true
        why: 'Все списки нужны на первом экране, и экономить на них нечего. Одновременный старт даёт время самого долгого запроса, а не сумму трёх.'
      - text: 'Грузить каждый список лениво, когда он окажется в видимой области'
        why: 'Все три и так видны сразу, поэтому ленивая загрузка ничего не сэкономит, а только добавит ожидание сигнала о видимости.'
      - text: 'Грузить списки по очереди, чтобы не нагружать сервер тремя запросами'
        why: 'Это водопад: задержки трёх запросов сложатся. Три маленьких запроса для сервера не нагрузка, а человек будет ждать втрое дольше.'
      - text: 'Грузить каждый список по требованию, когда человек раскроет его заголовок'
        why: 'Человек меняет настройки в каждом списке, значит, ему придётся трижды нажимать и ждать. Загрузка по требованию хороша для того, что нужно немногим.'
    explanation: |
      Правильный ответ здесь — самый простой. Всё, без чего экран бесполезен, грузят сразу, и независимые запросы
      запускают одновременно: тогда время загрузки равно времени самого долгого запроса. Ленивая загрузка и загрузка
      по требованию нужны, чтобы не грузить то, до чего человек может не дойти. Если он дойдёт до всего, они только
      добавляют ожидание.
    links:
      - https://martinfowler.com/articles/data-fetch-spa.html#parallel-data-fetching

  - id: sdd-fetching-003
    topic: Получение и кэширование данных
    subtopic: Стратегия загрузки
    level: middle
    question: |
      Страница профиля в соцсети открывается по адресу `/users/17`. Компонент профиля загружает пользователя по id
      из адреса, а после ответа показывает компонент друзей, который загружает список друзей по тому же id. Каждый
      запрос идёт около 400 мс, список друзей виден на первом экране. API бэкенд в этом квартале не меняет. Что
      сократит время до полной страницы?
    code: |
      function ProfilePage({ userId }) {
        const user = useUser(userId);
        if (!user) return <Spinner />;
        return <Profile user={user}><Friends userId={userId} /></Profile>;
      }
    codeLang: tsx
    options:
      - text: 'Запускать оба запроса одновременно на уровне страницы, взяв id из адреса'
        correct: true
        why: 'Запросу друзей нужен только id, а он уже есть в адресе. Зависимость мнимая: если поднять оба запроса на уровень страницы, страница будет готова через 400 мс вместо 800.'
      - text: 'Показывать заготовку списка друзей, пока загружается профиль'
        why: 'Заготовка делает ожидание приятнее, но запрос друзей всё так же начнётся после ответа профиля. Полная страница появится через те же 800 мс.'
      - text: 'Сохранять ответ профиля в кэш, чтобы второе открытие было быстрым'
        why: 'Кэш поможет только при повторном визите. При первом открытии цепочка из двух запросов останется.'
      - text: 'Загружать друзей лениво, когда их блок окажется в видимой области'
        why: 'Блок друзей и так на первом экране, а ленивая загрузка запустит запрос ещё позже. Водопад останется и станет длиннее.'
    explanation: |
      Это водопад из вложенных компонентов: родитель показывает дочерний компонент только после своих данных,
      а дочерний начинает свой запрос, только когда появится. Если второму запросу на самом деле не нужен ответ
      первого, зависимость мнимая, и оба запроса поднимают на уровень страницы или маршрута (Parallel Data
      Fetching). Когда зависимость настоящая, её убирают в API, но в этом случае API менять не нужно.
    links:
      - https://martinfowler.com/articles/data-fetch-spa.html#parallel-data-fetching
      - https://tanstack.com/query/latest/docs/framework/react/guides/request-waterfalls

  - id: sdd-fetching-004
    topic: Получение и кэширование данных
    subtopic: Стратегия загрузки
    level: middle
    question: |
      Сервис бронирования показывает в результатах поиска 20 отелей карточками: фото, название, цена, рейтинг. API
      списка отдаёт у каждого отеля 30 фотографий в полном размере, описание и 50 последних отзывов. Ответ весит
      4 МБ, на мобильной сети результаты открываются около 15 секунд. Бэкенд готов менять API. Что сделать?
    options:
      - text: 'Отдавать в списке только поля карточки и одно уменьшенное фото'
        correct: true
        why: 'Это избыточная загрузка: экран показывает малую часть ответа. Если сменить границу ответа, список станет в десятки раз легче, а фото и отзывы придут при открытии отеля.'
      - text: 'Кэшировать ответ списка, чтобы повторный поиск открывался сразу'
        why: 'Кэш ускорит только повтор того же поиска. Первый поиск — а их большинство, ведь даты и город каждый раз другие — по-прежнему тянет 4 МБ.'
      - text: 'Загружать результаты в фоне, пока человек вводит даты поездки'
        why: 'Пока даты не введены, неизвестно, что искать. Даже угаданный запрос всё равно тянет 4 МБ, которые никто не увидит.'
      - text: 'Запрашивать отели по одному, чтобы карточки появлялись постепенно'
        why: 'Это 20 запросов вместо одного, и каждый по-прежнему несёт лишние фото и отзывы. Трафик не уменьшится, а задержек станет больше.'
    explanation: |
      Избыточная загрузка — ответ содержит больше, чем нужно экрану. Лечат её сменой границ загрузки: список
      отдаёт только то, что видно в карточке, а подробности — отдельный запрос при открытии. Цена — бэкенду
      поддерживать два ответа, а при открытии отеля появляется второй запрос, задержку которого можно спрятать
      предзагрузкой. Обратная беда — недостаточная загрузка: если в списке не хватает поля и его просят у каждого
      элемента отдельно, получается проблема N+1.
    links:
      - https://martinfowler.com/articles/data-fetch-spa.html

  - id: sdd-fetching-005
    topic: Получение и кэширование данных
    subtopic: Стратегия загрузки
    level: senior
    multiple: true
    question: |
      Страница видео в веб-версии для компьютера. На первом экране плеер с названием, справа рекомендации; API
      отдаёт их по id видео из адреса. Ниже — комментарии, до них долистывают около 15% зрителей. Под плеером
      кнопка «Нравится» со счётчиком. Какие решения о загрузке подходят?
    options:
      - text: 'Плеер, название и рекомендации запрашивать сразу и одновременно'
        correct: true
        why: 'Всё это видно на первом экране, а рекомендациям нужен только id из адреса. Одновременный старт не даёт им выстроиться в водопад.'
      - text: 'Комментарии загружать лениво, когда блок приближается к экрану'
        correct: true
        why: 'До комментариев доходят 15% зрителей. Ленивая загрузка не тратит трафик и сервер на остальных 85%, а начинается чуть раньше, чем блок станет виден.'
      - text: 'Рекомендации запрашивать после того, как загрузятся данные плеера'
        why: 'Это мнимая зависимость: id видео уже есть в адресе. Рекомендации будут ждать без причины, и появится водопад.'
      - text: 'После нажатия «Нравится» перезагружать данные всей страницы'
        why: 'Это загрузка действия, а не экрана. Ожидание должно быть на кнопке, а перезагрузка страницы ради одной цифры прервёт просмотр и потратит трафик.'
      - text: 'Комментарии загружать сразу вместе с плеером, одним Promise.all'
        why: 'Комментарии нужны 15% зрителей, а общий Promise.all ещё и уронит весь результат, если упадёт запрос комментариев.'
    explanation: |
      Загрузки различают по моменту и по назначению. Содержимое первого экрана грузят сразу и одновременно,
      проверяя, нет ли мнимых зависимостей. Блоки ниже, до которых доходит меньшинство, грузят лениво. Загрузка
      действия показывает ожидание на месте действия и не трогает остальной экран. А независимые блоки не связывают
      одним `Promise.all`: его ошибка общая для всех, поэтому упавший блок спрячет и то, что загрузилось.
    links:
      - https://martinfowler.com/articles/data-fetch-spa.html#parallel-data-fetching
      - https://learn.javascript.ru/promise-api

  - id: sdd-cache-001
    topic: Получение и кэширование данных
    subtopic: Устройство кэша
    level: junior
    question: |
      Каталог видеосервиса показывает список фильмов с фильтром по жанру и постраничным переходом. Функция запроса
      получает жанр и номер страницы. Что должно войти в ключ кэша этого списка?
    options:
      - text: 'Название списка, жанр и номер страницы'
        correct: true
        why: 'В ключе должно быть всё, от чего зависит ответ. Тогда каждая комбинация жанра и страницы хранится в своей записи и не путается с другими.'
      - text: 'Название списка и номер страницы'
        why: 'Жанр меняет ответ, но в ключ не попал. После смены жанра человек увидит фильмы прежнего жанра: для кэша это та же запись.'
      - text: 'Название списка, жанр, страница и текущее время'
        why: 'Время делает каждый ключ новым, и кэш никогда не находит сохранённую запись. Одинаковые ответы копятся в памяти, а запросы идут каждый раз.'
      - text: 'Название списка: жанр и страница уже есть в функции запроса'
        why: 'Кэш ищет запись по ключу, а не по функции. Все жанры и страницы лягут в одну запись, и человек увидит не тот список.'
    explanation: |
      Ключ кэша — имя записи: запросы с одинаковым ключом получают одну запись. Правило из документации TanStack
      Query: если функция запроса использует меняющуюся переменную, эта переменная должна быть в ключе. Слишком
      бедный ключ показывает данные для других параметров, слишком богатый (с временем или случайным числом) не даёт
      кэшу сработать.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/guides/query-keys

  - id: sdd-cache-002
    topic: Получение и кэширование данных
    subtopic: Устройство кэша
    level: middle
    question: |
      Дашборд склада показывает остатки товаров. Для этих данных срок свежести (`staleTime`) — 10 минут. Менеджер
      открыл карточку товара через 4 минуты после прошлого показа. Запроса к серверу не было, на экране «осталось
      5 штук». Что можно сказать об этой цифре?
    options:
      - text: 'Кэш счёл её свежей и не спросил сервер; на складе число могло уже измениться'
        correct: true
        why: 'Свежесть — решение кэша не перепроверять копию. О том, что происходило на складе за эти 4 минуты, она ничего не говорит.'
      - text: 'Она совпадает со складом: раз запроса не было, данные на сервере не менялись'
        why: 'Отсутствие запроса — следствие настройки кэша, а не сведений о сервере. Склад мог отгрузить товар минуту назад.'
      - text: 'Она совпадает со складом: свежая запись означает, что сервер недавно её подтвердил'
        why: 'Сервер подтвердил цифру 4 минуты назад, при последнем запросе. С тех пор его никто не спрашивал.'
      - text: 'Она станет верной, если менеджер уйдёт на другую вкладку и вернётся'
        why: 'Перепроверка при возврате на вкладку касается устаревших записей. Эта ещё свежая 6 минут, поэтому запроса не будет.'
    explanation: |
      Свежесть и согласованность — разные свойства. Свежая запись — та, которой кэш решил верить без нового запроса;
      в TanStack Query это время задаёт `staleTime`. Согласованная — та, что совпадает с оригиналом на сервере.
      Пока запись свежая, она может разойтись с сервером, и никто об этом не узнает. Поэтому кэш служит для показа,
      а там, где от цифры зависит решение — продать последние 5 штук, — проверяет сервер в момент действия.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/guides/caching

  - id: sdd-cache-003
    topic: Получение и кэширование данных
    subtopic: Устройство кэша
    level: middle
    question: |
      В трекере задач шапка и боковая панель показывают число задач, назначенных на человека. Шапка запрашивает его
      с ключом `['assigned-count']`, панель — с ключом `['my-tasks', 'count']`, обе ходят на один и тот же адрес API.
      Человек закрыл задачу: панель перезапросила число, а шапка показывает старое. Что исправить?
    options:
      - text: 'Брать число в обоих местах из одной записи под одним ключом'
        correct: true
        why: 'Одни данные — одна запись. Когда запись обновится, новое число получат оба компонента, и расходиться будет нечему.'
      - text: 'Копировать число из панели в шапку эффектом при каждом изменении'
        why: 'Копий по-прежнему две, а между ними появилась скрытая синхронизация. Стоит обновить шапку с другой стороны — числа снова разойдутся.'
      - text: 'Сделать срок свежести шапки нулевым, чтобы она чаще перезапрашивала'
        why: 'Нулевой срок свежести не запускает запрос сам по себе: шапка перепроверит число только при следующем поводе. До этого числа расходятся, а запросов станет больше.'
      - text: 'Добавить шапке свой перезапрос числа после каждого изменения задач'
        why: 'Копий по-прежнему две: шапка обновится, но любая другая правка числа, о которой шапка не знает, снова разведёт их. Лечится не ещё одним запросом, а одной записью под одним ключом.'
    explanation: |
      У кэша должен быть один владелец, а у каждых данных — одна запись под одним ключом. Тогда компоненты не держат
      свои копии, а подписываются на запись: в TanStack Query все экземпляры с одинаковым ключом получают одни
      и те же данные и обновляются вместе. Два ключа для одних данных — это две копии, и рано или поздно они
      покажут разное.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/guides/caching

  - id: sdd-cache-004
    topic: Получение и кэширование данных
    subtopic: Устройство кэша
    level: middle
    question: |
      В поликлинике врачи по очереди работают за одним компьютером. Выход и вход происходят внутри приложения,
      без перезагрузки страницы. Список пациентов лежит в кэше под ключом `['patients']`. После смены врача новый
      на секунду видит пациентов прежнего, затем список обновляется. Медицинские данные прежнего врача не должны
      быть доступны после его выхода — даже в памяти браузера на этом компьютере. Что сделать?
    options:
      - text: 'Очищать весь кэш данных при выходе из аккаунта'
        correct: true
        why: 'Очистка удаляет данные прежнего врача целиком: новый врач их не увидит, и в памяти вкладки их не останется. Это и требует правило.'
      - text: 'Добавить номер врача в ключ списка пациентов'
        why: 'Новый врач перестанет видеть чужой список, но записи прежнего врача останутся в памяти вкладки. Правило о данных после выхода нарушено.'
      - text: 'Сократить срок хранения неиспользуемых записей до минуты'
        why: 'Минуту после выхода данные прежнего врача всё ещё лежат в кэше, а если новый врач войдёт быстрее, он их увидит.'
      - text: 'При входе перезапрашивать список, показывая кэш до ответа'
        why: 'Так приложение и работает сейчас: до ответа сервера новый врач видит чужих пациентов.'
    explanation: |
      Если данные зависят от пользователя, у кэша две меры защиты. Номер пользователя в ключе не даёт показать
      человеку чужие записи. Очистка кэша при выходе удаляет их совсем: в TanStack Query это `queryClient.clear()`,
      а сохранённую на устройство копию тоже нужно стереть. Когда компьютер общий или данные чувствительные,
      без очистки не обойтись — номер в ключе оставляет чужие данные в памяти.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/guides/query-keys

  - id: sdd-cache-005
    topic: Получение и кэширование данных
    subtopic: Устройство кэша
    level: senior
    question: |
      Видеосервис сохраняет кэш данных в IndexedDB на 24 часа: главная открывается мгновенно и без сети показывает
      последние просмотренные видео — это важное требование. В новой версии длительность видео стала объектом
      вместо числа секунд. После выпуска у части людей главная падает при открытии. Формат данных будет меняться
      и дальше, несколько раз в год. Что сделать?
    options:
      - text: 'Хранить в сохранённом кэше версию формата и отбрасывать копии другой версии'
        correct: true
        why: 'Новый код больше не прочитает данные старого формата: копия с чужой версией отбрасывается целиком. Офлайн-режим сохраняется для всех копий текущего формата.'
      - text: 'Сократить срок хранения неиспользуемых записей в памяти'
        why: 'Срок хранения в памяти не влияет на копию в IndexedDB: при запуске приложение всё равно прочитает её в старом формате.'
      - text: 'Очищать сохранённый кэш при каждом запуске приложения'
        why: 'Падений не будет, но и мгновенного открытия без сети тоже: сохранённая копия исчезает раньше, чем понадобится.'
      - text: 'При запуске показывать сохранённую копию, а следом — свежую с сервера'
        why: 'Сначала на экран всё равно попадёт копия старого формата, и главная упадёт до прихода свежих данных.'
    explanation: |
      Кэш в памяти исчезает при перезагрузке, а сохранённый на устройство переживает выпуск новой версии. Поэтому
      в него добавляют версию: версию API, номер формата или сборки. У TanStack Query для сохранённого кэша есть
      параметр `buster`: если строка в копии не совпадает с текущей, копия отбрасывается. Так новый код не читает
      старый формат, а офлайн-режим работает, как только сохранится копия нового формата.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/plugins/persistQueryClient

  - id: sdd-freshness-001
    topic: Получение и кэширование данных
    subtopic: Свежесть и инвалидация
    level: junior
    question: |
      Приложение погоды хранит прогноз в кэше. Человек открывает экран прогноза, а копии в кэше уже пять минут, и она
      считается устаревшей. Приложение работает по схеме stale-while-revalidate. Что увидит человек?
    options:
      - text: 'Спиннер, пока сервер не пришлёт новый прогноз, а затем сам прогноз'
        why: 'Так ведёт себя срок свежести без stale-while-revalidate, например HTTP-кэш с одним max-age: устаревшая копия не показывается, и человек ждёт сеть. Stale-while-revalidate как раз избавляет от этого ожидания.'
      - text: 'Прогноз из кэша сразу, а через долю секунды — обновлённый с сервера'
        correct: true
        why: 'В этом суть приёма: устаревшую копию показывают немедленно и параллельно перепроверяют её в фоне. Пришёл новый ответ — копию на экране тихо заменяют.'
      - text: 'Прогноз из кэша, который не обновится, пока не пройдёт ещё один срок'
        why: 'Это поведение свежих данных: их показывают без запросов к серверу. Копия в условии уже устарела, поэтому её нужно перепроверить.'
      - text: 'Прогноз из кэша и кнопку, которая предлагает обновить его вручную'
        why: 'Перепроверка при stale-while-revalidate идёт сама, в фоне, без действия человека. Кнопка «Обновить» — другой, ручной способ.'
    explanation: |
      Stale-while-revalidate («устаревшее, пока идёт перепроверка») делит жизнь копии на две части. Пока копия свежая,
      её показывают без запросов. Когда устарела, её всё равно показывают сразу, но тут же в фоне спрашивают сервер
      и заменяют данные, когда придёт ответ. Человек не видит спиннер и почти сразу получает актуальные данные.
      Приём описан в RFC 5861 для HTTP-кэша, а TanStack Query и SWR используют его по умолчанию.
    links:
      - https://www.rfc-editor.org/rfc/rfc5861.html#section-3

  - id: sdd-freshness-002
    topic: Получение и кэширование данных
    subtopic: Свежесть и инвалидация
    level: middle
    question: |
      В онлайн-банке форма перевода за границу содержит выпадающий список стран. Список приходит с сервера, меняется
      примерно раз в год, а если страна в нём устарела, сервер всё равно отклонит перевод с понятной ошибкой. Форму
      открывают десятки тысяч раз в день. Какую стратегию свежести выбрать для списка стран?
    options:
      - text: 'Перепроверять список в фоне при каждом открытии формы перевода'
        why: 'Это stale-while-revalidate с нулевым сроком свежести. Работать будет, но каждое открытие формы — лишний запрос за данными, которые не менялись весь год.'
      - text: 'Подписать форму на push-события сервера об изменении списка стран'
        why: 'Push нужен, когда человек должен почти сразу видеть чужие изменения. Ради правки раз в год держать постоянное соединение с каждым клиентом слишком дорого.'
      - text: 'Перезапрашивать список при каждом возврате на вкладку с формой'
        why: 'Список меняется раз в год, а возвраты на вкладку бывают много раз за сеанс. Почти все эти запросы принесут то же самое.'
      - text: 'Считать список свежим несколько часов и раньше не перепроверять'
        correct: true
        why: 'Данные меняются редко, а цена устаревшей версии низкая: ошибку поймает сервер. Простой срок свежести экономит десятки тысяч запросов в день и ничего не стоит пользователю.'
    explanation: |
      Стратегию свежести выбирают по цене устаревших данных: как часто они меняются, что человек сделает со старой
      версией и поймает ли ошибку сервер. Справочник, который меняется раз в год, — случай, где простой срок свежести
      (TTL) в несколько часов подходит лучше всего. Перепроверка при каждом показе, перезапрос при возврате и push здесь
      работали бы правильно, но платили бы трафиком и нагрузкой за свежесть, которая никому не нужна.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/guides/important-defaults

  - id: sdd-freshness-003
    topic: Получение и кэширование данных
    subtopic: Свежесть и инвалидация
    level: middle
    question: |
      В личном трекере задач проекты меняет только их владелец. Человек переименовывает проект в окне настроек,
      сервер подтверждает изменение, но в боковом меню остаётся старое название — у списка проектов срок свежести
      пять минут. Человек всё это время остаётся на той же вкладке. Как сделать, чтобы новое название появилось
      в меню сразу?
    options:
      - text: 'Снизить срок свежести списка проектов с пяти минут до пяти секунд'
        why: 'Название обновится не сразу, а через несколько секунд, и то только при следующем показе меню. Зато список станет перезапрашиваться почти постоянно.'
      - text: 'Сразу после подтверждения сервера пометить список проектов устаревшим'
        correct: true
        why: 'Клиент точно знает, когда список изменился: человек сам его поменял. Инвалидация в этот момент перезапросит список, который сейчас на экране, и новое название появится сразу.'
      - text: 'Включить перезапрос списка проектов при возврате на вкладку'
        why: 'Человек никуда не уходит с вкладки, поэтому возврата не будет и перезапрос не сработает. Этот приём ловит изменения, случившиеся, пока вкладка была в фоне.'
      - text: 'Опрашивать сервер раз в десять секунд, пока открыто боковое меню'
        why: 'Название появится с задержкой до десяти секунд, а запросы будут идти всё время, хотя проекты меняет только этот человек и только в этом окне.'
    explanation: |
      Инвалидация — явная пометка «эти данные больше не свежие» в момент, когда клиент узнал об изменении. Самый частый
      повод — собственное действие пользователя: он переименовал, удалил, добавил. После пометки библиотека вроде
      TanStack Query перезапрашивает данные, которые показаны на экране. Срок свежести, опрос и перезапрос при возврате
      рассчитаны на изменения, о которых клиент не знает, поэтому собственную правку они показывают с задержкой.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/guides/query-invalidation

  - id: sdd-freshness-006
    topic: Получение и кэширование данных
    subtopic: Свежесть и инвалидация
    level: senior
    question: |
      Диспетчерская такси показывает статусы 3000 машин: «свободна», «едет к клиенту», «на заказе». После первой
      загрузки списка клиент к серверу за статусами больше не ходит: изменения приходят push-сообщениями, по одному
      на машину. Сервер не хранит уже разосланные сообщения. Ноутбук диспетчера ушёл в сон на 10 минут; после
      пробуждения соединение восстановилось само, но многие статусы на экране старые и исправляются, только когда
      по машине приходит новое сообщение, — у некоторых машин это бывает раз в час. Что изменить на клиенте?
    options:
      - text: 'Переподключаться к каналу событий быстрее, проверяя связь каждую секунду'
        why: 'Обрыв станет короче, но сообщения, разосланные во время сна, всё равно потеряны: сервер их не хранит. Экран останется старым, пока по каждой машине не придёт новое событие.'
      - text: 'После переподключения запросить у сервера пропущенные за сон сообщения'
        why: 'Это сработало бы, если бы сервер хранил разосланные сообщения. По условию он их не хранит, и запрашивать нечего.'
      - text: 'Сразу после переподключения перезапросить с сервера статусы всех машин'
        correct: true
        why: 'Пока соединения не было, сообщения терялись. Одна перепроверка в момент переподключения возвращает экран к правде, а дальше push снова держит его свежим.'
      - text: 'Отказаться от сообщений и опрашивать сервер о всех машинах каждую секунду'
        why: 'Экран станет верным, но ценой постоянной нагрузки: каждый открытый экран диспетчера — запрос в секунду весь день, хотя проблема возникает только после обрыва.'
    explanation: |
      Push держит данные свежими, только пока соединение живо. Во время обрыва сообщения рассылаются без клиента
      и теряются, а после переподключения экран показывает то, что было до обрыва, пока не придёт следующее событие.
      Поэтому сразу после восстановления соединения данные на экране перепроверяют у сервера: переподключение —
      тот самый повод перепроверить данные. Быстрое переподключение сокращает обрыв, но не возвращает потерянное.
      Опрос тоже решил бы проблему,
      но платил бы постоянной нагрузкой за редкое событие.
    links:
      - https://swr.vercel.app/docs/revalidation

  - id: sdd-freshness-005
    topic: Получение и кэширование данных
    subtopic: Свежесть и инвалидация
    level: senior
    multiple: true
    question: |
      Сайт сети кинотеатров продаёт билеты на сеансы. При оплате сервер заново проверяет, свободно ли место. Места
      на популярные сеансы раскупают за минуты, а человек, купивший билет, сразу хочет увидеть его в разделе «Мои
      билеты» на той же вкладке. Какие данные можно несколько часов показывать из кэша, не перепроверяя их?
    options:
      - text: 'Адреса кинотеатров и их часы работы'
        correct: true
        why: 'Меняются редко, а старая версия почти ничего не стоит человеку. Срок свежести в несколько часов здесь уместен.'
      - text: 'Описание фильма, постер и возрастное ограничение'
        correct: true
        why: 'Эти данные почти не меняются после выхода фильма, и на покупку билета они не влияют.'
      - text: 'Схему зала: ряды, номера мест и расположение экрана'
        correct: true
        why: 'Схема зала меняется только при перестройке зала. Занятость мест — другие данные, и для них нужна своя стратегия.'
      - text: 'Занятые и свободные места на сеанс через 20 минут'
        why: 'Места раскупают за минуты. Сервер поймает попытку купить занятое место, но человек будет раз за разом выбирать места, которых уже нет. Нужна частая перепроверка.'
      - text: 'Список «Мои билеты» после покупки на этой вкладке'
        why: 'Человек сам только что изменил эти данные и ждёт увидеть билет сразу. Здесь нужна инвалидация после покупки, а не срок свежести в несколько часов.'
    explanation: |
      Стратегию свежести выбирают для каждого вида данных отдельно, по цене его устаревания. Справочные данные —
      адреса, описания, схема зала — меняются редко, и старая версия почти никому не вредит: им подходит долгий срок
      свежести. Занятость мест меняется быстро, и устаревшая копия заставляет человека выбирать то, чего уже нет, даже
      если сервер не допустит ошибки при оплате. Собственная покупка человека требует инвалидации: клиент точно знает,
      что «Мои билеты» изменились.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/guides/important-defaults

  - id: sdd-coordination-001
    topic: Получение и кэширование данных
    subtopic: Координация запросов и предзагрузка
    level: junior
    question: |
      В мессенджере четыре компонента на экране — шапка, список чатов, меню настроек и окно поиска — при открытии
      приложения в одну и ту же секунду запрашивают профиль текущего пользователя с одним и тем же ключом. Включена
      дедупликация запросов. Что произойдёт?
    options:
      - text: 'Уйдут четыре запроса, и все компоненты возьмут ответ, пришедший первым'
        why: 'Это не дедупликация: сервер всё равно получит четыре одинаковых запроса. Дедупликация не отправляет повтор, пока такой же запрос уже в пути.'
      - text: 'Уйдёт один запрос, и профиль больше не запросится до перезагрузки'
        why: 'Дедупликация склеивает только одновременные запросы. Когда профиль устареет, его перепроверят по обычным правилам свежести.'
      - text: 'Уйдёт один запрос, и все четыре компонента получат его ответ'
        correct: true
        why: 'Ключ у запросов один, значит, запрос тоже один: остальные компоненты ждут ответа на уже отправленный.'
      - text: 'Запросы отложатся и уйдут одним пакетом вместе с другими данными'
        why: 'Это пакетная отправка — другой приём. Она объединяет разные мелкие запросы, а дедупликация просто не отправляет одинаковые.'
    explanation: |
      Дедупликация (deduplication) — если запрос с таким же ключом уже в пути, новый не отправляется, и все, кто его
      просил, получают один ответ. Ключ — тот же, что у кэша: адрес, параметры, пользователь. В документации SWR пример:
      пять аватаров с ключом /api/user дают один сетевой запрос. Приём уменьшает нагрузку на сервер и годится только
      для чтения: запросы на изменение не склеивают.
    links:
      - https://swr.vercel.app/docs/advanced/performance#deduplication

  - id: sdd-coordination-002
    topic: Получение и кэширование данных
    subtopic: Координация запросов и предзагрузка
    level: middle
    question: |
      Поле «Кому» в почтовом клиенте подсказывает адресатов по мере ввода: на каждое изменение строки уходит запрос.
      Сервер отвечает за разное время, и иногда под полем оказываются подсказки для начала строки, а не для всего
      введённого текста. Нагрузка на сервер команду не беспокоит, важно только, чтобы подсказки совпадали с полем.
      Что сделать?
    options:
      - text: 'Отправлять запрос только через 300 мс после последнего нажатия клавиши'
        why: 'Запросов станет меньше, но порядок ответов это не гарантирует: если человек задумался посередине, два запроса всё равно могут вернуться в обратном порядке.'
      - text: 'Отменять незавершённый запрос, когда уходит запрос для новой строки'
        correct: true
        why: 'Ответ на старую строку больше никогда не попадёт на экран, поэтому подсказки всегда соответствуют последнему введённому тексту. Заодно браузер не докачивает ненужный ответ.'
      - text: 'Склеивать одинаковые запросы подсказок в один с помощью дедупликации'
        why: 'У запросов для «ан» и «анна» разные ключи, поэтому склеивать нечего. Дедупликация убирает повторы, а не устаревшие ответы.'
      - text: 'Показывать ответ, пришедший первым, а остальные ответы отбрасывать'
        why: 'Первым может прийти как раз ответ на старую строку. Решает не то, какой ответ быстрее, а то, на какой запрос он отвечает.'
    explanation: |
      Ответы приходят в том порядке, в котором их отдал сервер, а не в котором ушли запросы. Чтобы на экране был
      результат для последней строки, ответ на устаревший запрос нужно отбросить: проверить при получении, что он
      последний, или отменить старый запрос через AbortController — тогда обещание fetch отклонится с AbortError.
      Пауза перед запросом (debounce) решает другую задачу — уменьшает число запросов, а порядок не гарантирует.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/AbortController
      - https://ru.react.dev/reference/react/useEffect#fetching-data-with-effects

  - id: sdd-coordination-003
    topic: Получение и кэширование данных
    subtopic: Координация запросов и предзагрузка
    level: middle
    question: |
      Видеоплеер отправляет на сервер аналитики каждое событие отдельным запросом: пауза, перемотка, смена качества,
      буферизация. В среднем выходит одно событие в секунду на зрителя, и каждое из них нужно аналитикам. Команда
      сервера просит сократить число запросов в десятки раз. Аналитикам не важно, если события придут с опозданием
      до минуты, но терять последние события при закрытии вкладки не хочется. Что сделать?
    options:
      - text: 'Склеивать одинаковые события одного зрителя с помощью дедупликации'
        why: 'События разные — у каждого свой тип и время, поэтому склеивать почти нечего. К тому же дедупликация рассчитана на чтение, а здесь каждое событие — новые данные.'
      - text: 'Отменять незавершённую отправку, когда наступает время следующего события'
        why: 'Число запросов от этого не уменьшится, а отменённые события могут потеряться, хотя аналитикам нужно каждое.'
      - text: 'Отправлять раз в 30 секунд только последнее событие, остальные выбрасывать'
        why: 'Запросов станет в 30 раз меньше, но почти все события пропадут, а по условию нужно каждое.'
      - text: 'Копить события и отправлять пачкой раз в 30 секунд и при скрытии страницы'
        correct: true
        why: 'Запросов становится в 30 раз меньше, все события доходят, а опоздание до 30 секунд аналитиков устраивает. Отправка при скрытии страницы спасает остаток.'
    explanation: |
      Пакетная отправка (batching) объединяет много мелких запросов в один. Её платят ожиданием — пакет уходит, когда
      закроется окно сбора, — поэтому окно выбирают по допустимой задержке: для аналитики хватит и 30 секунд, для
      ответа на нажатие кнопки нет. Накопленное нужно отправить, когда страница скрывается, иначе при закрытии вкладки
      оно пропадёт. И сервер должен уметь принимать пакет — это часть контракта API.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Navigator/sendBeacon
      - https://github.com/graphql/dataloader

  - id: sdd-coordination-004
    topic: Получение и кэширование данных
    subtopic: Координация запросов и предзагрузка
    level: senior
    question: |
      В галерее фотохостинга 50 миниатюр, полное фото весит около 2 МБ и сейчас открывается за полторы секунды — это
      главная жалоба пользователей. По аналитике за посещение галереи человек открывает в среднем одно фото, а из тех
      миниатюр, на которые он навёл курсор или которых коснулся пальцем, открывает около 60 %. От наведения или
      касания до открытия проходит в среднем 0,6 секунды. Многие заходят с телефона с платным трафиком. Какую
      предзагрузку выбрать?
    options:
      - text: 'Загружать все 50 полных фото в фоне сразу после открытия галереи'
        why: 'Это около 100 МБ на посещение, из которых пригодятся 2 МБ: 98 % работы впустую. На платном мобильном трафике это недопустимая цена.'
      - text: 'Загружать полное фото при наведении курсора или касании миниатюры'
        correct: true
        why: 'Сигнал попадает в цель в 60 % случаев. На одно открытие приходится примерно 1,7 предзагрузки, то есть около 1,3 МБ лишнего, а ожидание сокращается примерно с 1,5 до 0,9 секунды.'
      - text: 'Обойтись без предзагрузки: на мобильной сети это лишний трафик'
        why: 'Лишний трафик есть, но небольшой, а главная жалоба — ожидание. Отказ от предзагрузки оставляет проблему нерешённой, хотя есть сигнал с высокой вероятностью.'
      - text: 'После открытия фото предзагружать пять следующих фото галереи'
        why: 'Люди открывают в среднем одно фото, поэтому следующие почти не понадобятся. А первое открытие, на которое и жалуются, так и останется медленным.'
    explanation: |
      Предзагрузка (prefetch) — ставка: выигрыш получается, если данные понадобятся, а при промахе платят трафиком
      и нагрузкой. Решение строят на вероятности и цене лишней работы. Расчёт: загрузить всё — 50 × 2 МБ = 100 МБ
      ради одного фото. Загружать по наведению — при попадании 60 % на одно открытие уходит 1 / 0,6 ≈ 1,7 загрузки,
      то есть около 3,3 МБ вместо 2. Наведение курсора, фокус и начало касания — сигналы, которые опережают клик
      и почти всегда указывают на то, что человек собирается открыть. Здесь сигнал опережает открытие на 0,6 секунды:
      это время фото уже грузится, и из полутора секунд ожидания остаётся около 0,9.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/guides/prefetching

  - id: sdd-coordination-005
    topic: Получение и кэширование данных
    subtopic: Координация запросов и предзагрузка
    level: senior
    multiple: true
    question: |
      Веб-приложение карт показывает места — кафе, аптеки — в видимой области. Список мест слева и маркеры на карте
      запрашивают карточки одних и тех же мест каждый сам по себе. При открытии новой области уходит до 30 отдельных
      запросов карточек. Сервер умеет отдавать карточки пачкой по списку идентификаторов. Сервер перегружен,
      а продукт требует, чтобы никакая мера не задерживала появление данных больше чем на 100 мс. Какие меры уменьшат
      число запросов и уложатся в это требование?
    options:
      - text: 'Запрашивать карточку места один раз, даже если её ждут и список, и маркер'
        correct: true
        why: 'Это дедупликация: одинаковые запросы списка и маркера склеиваются в один. Ожидание не растёт, а запросов становится меньше.'
      - text: 'Собирать запросы карточек за 20 мс и отправлять их одним пакетом'
        correct: true
        why: 'Вместо 30 запросов уходит один. Окно сбора добавляет 20 мс задержки — это в пределах 100 мс.'
      - text: 'Запрашивать места области через 300 мс после остановки карты'
        why: 'Запросов при перетаскивании станет меньше, но пауза в 300 мс задерживает данные втрое сильнее, чем допускает требование.'
      - text: 'Отбрасывать пришедшие ответы для области, которую человек уже пролистал дальше'
        why: 'Это защищает от устаревших данных на экране, но число запросов не меняет: они уже отправлены.'
      - text: 'Заранее загружать места в соседних областях вокруг видимой части карты'
        why: 'Предзагрузка сокращает ожидание при сдвиге карты, но добавляет запросы, а сервер и так перегружен.'
    explanation: |
      Приёмы координации отвечают на разные цели: одни уменьшают число запросов, другие ожидание. Дедупликация
      уменьшает запросы и не замедляет. Пакетная отправка уменьшает запросы ценой окна сбора — здесь 20 мс. Пауза
      перед запросом (debounce) тоже уменьшает запросы, но добавляет свою длину к ожиданию. Игнор и отмена устаревших
      ответов делают результат верным, а число запросов не меняют. Предзагрузка сокращает ожидание и добавляет
      запросы. Сначала нужно понять, что именно улучшаете, потом выбирать приём.
    links:
      - https://swr.vercel.app/docs/advanced/performance#deduplication

  - id: sdd-pagination-001
    topic: Получение и кэширование данных
    subtopic: Пагинация изменчивых списков
    level: junior
    question: |
      Сайт объявлений показывает ленту «сначала новые» по 20 объявлений и запрашивает следующие страницы по смещению:
      offset=20, offset=40 и так далее. Человек читал первую страницу, а за это время на сайте опубликовали три новых
      объявления. Он запрашивает вторую страницу. Что он увидит в её начале?
    options:
      - text: 'Три последних объявления первой страницы, которые он уже видел минуту назад'
        correct: true
        why: 'Три новых объявления встали в начало ленты и сдвинули остальные на три места вниз. Смещение 20 теперь указывает на бывшие 18-е, 19-е и 20-е места.'
      - text: 'Три новых объявления, которые опубликовали, пока он читал'
        why: 'Новые объявления встали в самое начало ленты, на первую страницу. Вторая страница начинается с 21-го места, до них она не доходит.'
      - text: 'Продолжение ленты, но три объявления после первой страницы пропущены'
        why: 'Пропуски при смещении случаются, когда элементы выше удаляют и список сдвигается вверх. Здесь объявления добавились, и список сдвинулся вниз.'
      - text: 'Ровное продолжение ленты без повторов и пропусков'
        why: 'Так было бы, если бы список не менялся или вторую страницу просили по курсору «после последнего показанного». Смещение считает места, а они сдвинулись.'
    explanation: |
      Пагинация по смещению просит «пропусти N элементов и дай следующие». Если выше этого места что-то добавили,
      все элементы сдвигаются вниз, и на следующей странице повторяются последние элементы предыдущей — дубль. Если
      что-то удалили, список сдвигается вверх, и часть элементов не попадёт ни на одну страницу — пропуск. Курсор
      просит «после вот этого элемента» и от вставок выше не зависит.
    links:
      - https://slack.engineering/evolving-api-pagination-at-slack/

  - id: sdd-pagination-002
    topic: Получение и кэширование данных
    subtopic: Пагинация изменчивых списков
    level: middle
    question: |
      В бухгалтерской системе есть архив закрытых счетов за прошлый год — 48 000 записей, которые больше не меняются.
      Бухгалтер получает из отчёта номер страницы, на которой лежит нужный счёт, например «страница 37», и хочет
      перейти прямо туда, а также видеть, сколько всего страниц. Какую пагинацию выбрать?
    options:
      - text: 'Курсор и кнопку «Показать ещё», чтобы избежать дублей и пропусков'
        why: 'Дублей и пропусков здесь не будет и со смещением: архив не меняется. А перейти на страницу 37 курсор не позволит — пришлось бы нажать «Показать ещё» 36 раз.'
      - text: 'Смещение и номера страниц, а рядом показать общее число страниц'
        correct: true
        why: 'Архив не меняется, поэтому слабость смещения здесь не проявится. Зато оно даёт ровно то, что нужно: переход на страницу 37 и общее число страниц.'
      - text: 'Курсор и бесконечную прокрутку с запоминанием позиции'
        why: 'Курсор знает только «после кого», а не «на каком месте», поэтому прыжка на страницу 37 и общего числа страниц не будет.'
      - text: 'Загрузить весь архив одним ответом и листать страницы на клиенте'
        why: '48 000 счетов — тяжёлый ответ и долгое ожидание при каждом открытии архива, хотя бухгалтеру нужна одна страница.'
    explanation: |
      Курсор решает проблему изменчивых списков, но платит за это: нельзя перейти на страницу N и обычно нельзя узнать
      общее число страниц. Если список во время просмотра не меняется, слабость смещения не проявляется, а его плюсы
      остаются: номера страниц, переход к любой из них, простая ссылка вида ?page=37. Неизменный архив — тот случай,
      когда простое решение и есть правильное.
    links:
      - https://slack.engineering/evolving-api-pagination-at-slack/

  - id: sdd-pagination-003
    topic: Получение и кэширование данных
    subtopic: Пагинация изменчивых списков
    level: middle
    question: |
      На маркетплейсе человек долистал ленту товаров до пятой страницы: страницы загружаются по курсору кнопкой
      «Показать ещё». Затем он включает фильтр «С доставкой завтра». В это время ещё грузится шестая страница без
      фильтра. Иногда после включения фильтра в списке оказываются товары без доставки завтра. Как правильно
      обработать смену фильтра?
    options:
      - text: 'Отфильтровать уже загруженные товары на клиенте и дальше грузить по старому курсору'
        why: 'Курсор выдан для списка без фильтра, и следующие страницы снова принесут товары без доставки. Кроме того, на клиенте лежит только малая часть подходящих товаров.'
      - text: 'Оставить показанные товары сверху и дописывать к ним страницы с новым фильтром'
        why: 'Сверху останутся товары, которые фильтру не соответствуют, а поздний ответ шестой страницы без фильтра всё равно допишется в список.'
      - text: 'Выбросить страницы и курсор, отменить шестую страницу и запросить первую с фильтром'
        correct: true
        why: 'С новым фильтром это другой список: старые страницы и курсор к нему не относятся, а поздний ответ старой страницы иначе допишется в новый список.'
      - text: 'Передать текущий курсор вместе с новым фильтром и продолжить с того же места'
        why: 'Курсор привязан к сортировке и фильтру, с которыми его выдали. С другим фильтром позиция «после этого товара» ничего не значит.'
    explanation: |
      Смена фильтра или сортировки создаёт новый список. Значит, загруженные страницы и курсор старого нужно выбросить,
      загрузку старой страницы, которая ещё в пути, — отменить или проигнорировать, а новый список начать с первой
      страницы и прокрутить экран к началу. Фильтр входит в ключ кэша, поэтому при возврате к прежнему фильтру его
      страницы могут найтись в кэше.
    links:
      - https://relay.dev/graphql/connections.htm#sec-Cursor

  - id: sdd-pagination-004
    topic: Получение и кэширование данных
    subtopic: Пагинация изменчивых списков
    level: senior
    question: |
      Интернет-магазин электроники делает каталог ноутбуков с фильтрами. Покупатели сравнивают похожие модели, открывают
      карточку товара и возвращаются к списку, а ещё часто отправляют друзьям ссылку «посмотри, на этой странице».
      В подвале сайта — условия доставки и возврата, которые многие ищут перед покупкой. Каталог за день меняется
      мало. Какой способ листания выбрать?
    options:
      - text: 'Бесконечную прокрутку с восстановлением позиции после возврата'
        why: 'Позиция восстановится, но подвал с условиями доставки будет уезжать, а ссылкой на место в бесконечном списке не поделиться.'
      - text: 'Кнопку «Показать ещё», а загруженные порции держать только в памяти'
        why: 'Подвал доступен, но друг по ссылке получит только первую порцию, а не то место, которое ему хотели показать.'
      - text: 'Бесконечную прокрутку, а условия доставки перенести в боковое меню'
        why: 'Подвал больше не мешает, но делиться местом по-прежнему нельзя, а сравнивать модели в бесконечном потоке неудобно.'
      - text: 'Номера страниц, причём номер текущей страницы хранить в адресе'
        correct: true
        why: 'Номер в адресе даёт ссылку на место и возврат к нему, подвал доступен, страницы служат ориентирами при сравнении. Каталог меняется мало, поэтому смещение подходит.'
    explanation: |
      Способ листания выбирают по задачам людей. Бесконечная прокрутка удобна для однородных лент, которые листают без
      цели, но прячет подвал, мешает вернуться к месту и поделиться ссылкой. Кнопка «Показать ещё» — компромисс:
      подвал доступен, но ссылка на место требует отдельной работы. Номера страниц хуже для бесцельного листания,
      зато дают ссылку вида ?page=3, ориентиры для сравнения и простое восстановление места. Nielsen Norman Group
      не советует бесконечную прокрутку для целенаправленного поиска и сравнения товаров.
    links:
      - https://www.nngroup.com/articles/infinite-scrolling-tips/

  - id: sdd-pagination-005
    topic: Получение и кэширование данных
    subtopic: Пагинация изменчивых списков
    level: senior
    multiple: true
    question: |
      Комментарии под видео отсортированы по популярности: сначала с большим числом лайков, при равенстве — по id.
      Страницы загружаются по курсору, который хранит число лайков и id последнего показанного комментария. Пока
      человек читает, комментарии набирают и теряют лайки, появляются новые. Что всё равно может случиться при
      загрузке следующей страницы?
    options:
      - text: 'Непоказанный комментарий набрал лайков, поднялся выше курсора, и человек его не увидит'
        correct: true
        why: 'Курсор отдаёт то, что ниже него по порядку. Комментарий, который перебрался в уже просмотренную часть, не попадёт ни на одну следующую страницу — это пропуск.'
      - text: 'Показанный комментарий потерял лайки, опустился ниже курсора, и человек увидит его снова'
        correct: true
        why: 'Элемент переехал из просмотренной части в непросмотренную, и следующая страница вернёт его ещё раз. Такой дубль клиент убирает, сливая страницы по id.'
      - text: 'Новый комментарий без лайков сдвинет следующую страницу, и её первый элемент повторится'
        why: 'Новый комментарий без лайков встанет в конец списка, а не перед курсором. И вставки сами по себе следующую страницу при курсоре не сдвигают — это слабость смещения.'
      - text: 'Удаление уже показанного комментария сдвинет страницы, и один непоказанный пропадёт'
        why: 'Так ведёт себя смещение: оно считает места, и удаление сдвигает их. Курсор просит «после этого элемента», и удаление выше него на следующую страницу не влияет.'
    explanation: |
      Курсор защищает от вставок и удалений: следующая страница начинается сразу после последнего показанного
      элемента, сколько бы ни изменилось выше. Но он не делает список неподвижным. Если элемент меняет значение
      сортировки и переезжает через курсор, получится пропуск (переехал вверх) или дубль (переехал вниз). Дубли клиент
      убирает, сливая страницы по id. Пропуски так не лечатся: их принимают как цену живой сортировки или
      предлагают обновить список сверху.
    links:
      - https://relay.dev/graphql/connections.htm#sec-Cursor
      - https://slack.engineering/evolving-api-pagination-at-slack/

  - id: sdd-races-002
    topic: Изменения и согласованность
    subtopic: Гонки и порядок
    level: junior
    question: |
      Трекер задач: человек перетащил карточку в колонку «Готово» и через полсекунды передумал — вернул её в «В работе».
      Ушли два запроса: «колонка = Готово» и «колонка = В работе». После перезагрузки страницы карточка оказалась
      в «Готово». Что, скорее всего, произошло?
    options:
      - text: 'Сервер выполнил два запроса не в том порядке, в котором клиент их отправил'
        correct: true
        why: 'Два запроса шли к серверу независимо. Второй обогнал первый, и последним записалось «Готово». Порядок отправки не гарантирует порядок выполнения.'
      - text: 'Браузер взял ответ на первый запрос из кэша и не отправил второй запрос'
        why: 'Запросы на изменение браузер из кэша не берёт: оба запроса ушли на сервер. Дело в порядке их выполнения.'
      - text: 'Сервер объединил два запроса к одной карточке и оставил первый из них'
        why: 'Сервер не склеивает запросы на изменение: каждый выполняется сам по себе. И «первым» для него оказывается тот, что пришёл первым, а не тот, что раньше отправлен.'
      - text: 'Второй запрос отклонён: карточку нельзя переносить дважды за секунду'
        why: 'В условии нет такого правила, и при отказе клиент получил бы ошибку. Объяснение без лишних допущений — гонка двух записей.'
    explanation: |
      Это гонка конкурирующих записей. Отправка, выполнение на сервере и получение ответов — три разных порядка, и они
      не обязаны совпадать. Здесь второй запрос дошёл до сервера раньше первого, и сервер сохранил «Готово» последним.
      Перезагрузка не помогает: вред остался в данных. Защита — очередь: следующий запрос уходит после ответа
      на предыдущий.
    links:
      - https://ru.wikipedia.org/wiki/Состояние_гонки

  - id: sdd-races-003
    topic: Изменения и согласованность
    subtopic: Гонки и порядок
    level: middle
    question: |
      Видеосервис, страница настроек. Переключатель «Автовоспроизведение» при каждом нажатии отправляет PUT с новым
      значением. Люди иногда щёлкают им несколько раз подряд, и на сервере остаётся не то, что на экране. Настройки
      правит только сам человек, почти всегда с одного устройства. Дизайнеры просят, чтобы переключатель откликался
      на каждое нажатие сразу. Что сделать?
    options:
      - text: 'Отправлять следующий PUT после ответа на предыдущий, оставляя из ожидающих только последнее значение'
        correct: true
        why: 'Очередь со схлопыванием: сервер получает изменения по порядку, а промежуточные значения не отправляются вовсе. Переключатель при этом меняется на экране сразу.'
      - text: 'Отправлять каждый PUT сразу, а на экране применять только ответ на самый последний отправленный запрос'
        why: 'Так исправится только экран. Запросы по-прежнему идут параллельно, и сервер может выполнить старый последним.'
      - text: 'Отправлять каждый PUT сразу с номером версии настроек, а при отказе сервера перечитывать их'
        why: 'Человек будет конфликтовать сам с собой: второй запрос уйдёт с версией, которую первый уже изменил, и получит отказ. Проверка версии нужна, когда правят разные люди или устройства.'
      - text: 'Блокировать переключатель, пока не придёт ответ сервера, и показывать рядом индикатор загрузки'
        why: 'Гонка исчезнет, но переключатель перестанет откликаться на нажатия во время запроса, а дизайнеры просили обратного.'
    explanation: |
      Гонка здесь между записями одного человека в одной вкладке. Для такого случая подходит очередь (serialize):
      следующий запрос уходит после ответа на предыдущий. Чтобы очередь не тормозила, её схлопывают: пока один запрос
      в пути, клиент помнит только последнее желаемое значение. Приём «брать последнее» исправляет экран, но не данные
      на сервере, а проверка версии рассчитана на гонки с другими вкладками и людьми.
    links:
      - https://ru.wikipedia.org/wiki/Состояние_гонки

  - id: sdd-races-004
    topic: Изменения и согласованность
    subtopic: Гонки и порядок
    level: middle
    multiple: true
    question: |
      Фотохостинг. Команда хочет навести порядок с запросами и предлагает одно правило для всего приложения: при новом
      запросе того же вида отменять прежний и показывать только ответ на последний. Для каких действий этого правила
      достаточно, чтобы данные нигде не разошлись?
    options:
      - text: 'Переключение между альбомами в режиме просмотра фотографий'
        correct: true
        why: 'Это чтение. Опоздавший ответ портит только экран, а правило его отбрасывает. На сервере ничего не меняется.'
      - text: 'Подсказки при вводе тега в строке поиска по фото'
        correct: true
        why: 'Тоже чтение: каждый новый символ делает прежние подсказки ненужными. Правило «брать последнее» здесь и придумано.'
      - text: 'Переименование альбома, если название дважды исправили подряд'
        why: 'Это запись. Отмена ожидания не отменяет первое переименование на сервере, и оно может выполниться последним.'
      - text: 'Смена обложки альбома, если человек быстро выбрал два разных фото'
        why: 'Тоже запись. Экран покажет второе фото, но на сервере последним может записаться первое.'
      - text: 'Перемещение фото между альбомами с двух открытых вкладок'
        why: 'Запись, да ещё из двух вкладок. Правило работает внутри одной вкладки и о второй ничего не знает.'
    explanation: |
      «Брать последнее» (take-latest) — приём для чтения: он защищает экран от устаревших ответов. Для записей его мало.
      Отмена запроса отменяет только ожидание на клиенте, а запрос мог уже дойти до сервера и выполниться в любом
      порядке. Записям одной вкладки нужна очередь, записям из разных вкладок и от разных людей — проверка версии
      или слияние.
    links:
      - https://ru.react.dev/learn/synchronizing-with-effects#fetching-data
      - https://developer.mozilla.org/ru/docs/Web/API/AbortController

  - id: sdd-races-006
    topic: Изменения и согласованность
    subtopic: Гонки и порядок
    level: junior
    multiple: true
    question: |
      Фоторедактор, когда человек уходит с экрана альбома, отменяет через `AbortController` все запросы этого экрана,
      которые ещё в пути. Для каких из них после такой отмены исход на сервере остаётся неизвестным?
    options:
      - text: 'Переименование альбома, которое было в пути'
        correct: true
        why: 'Это запись. abort() прекращает только ожидание в браузере: запрос мог уже дойти до сервера, и альбом мог переименоваться.'
      - text: 'Удаление фото, которое было в пути'
        correct: true
        why: 'Тоже запись. Сервер не узнаёт, что клиент перестал ждать, и мог успеть удалить фото.'
      - text: 'Загрузка миниатюр фотографий альбома'
        why: 'Это чтение: на сервере оно ничего не меняет, поэтому прерванная загрузка ничего после себя не оставляет.'
      - text: 'Поиск фотографий по тегам'
        why: 'Поиск только читает данные. Отменили — значит, просто не узнали результат, а на сервере всё как было.'
      - text: 'Запрос списка альбомов человека'
        why: 'Чтение безвредно прерывать: оно не меняет данные, и вопроса «выполнилось ли» не возникает.'
    explanation: |
      Отмена ожидания на клиенте и отмена действия на сервере — разные вещи. Для чтения это неважно: прерванная
      загрузка ничего не меняет. Для записи важно всегда: запрос мог дойти и выполниться, а сервер об отмене не узнаёт.
      Поэтому после прерванной записи нельзя показывать ни «не сохранилось», ни «сохранено» — исход выясняют
      у сервера.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/AbortController

  - id: sdd-races-007
    topic: Изменения и согласованность
    subtopic: Гонки и порядок
    level: senior
    question: |
      Редакторы базы рецептов иногда одновременно правят поле «Название» одной и той же карточки, каждый со своего
      компьютера. Такое бывает редко, но молча потерять чужую правку нельзя: редакторы потом долго выясняют, чьё
      название верное. Как устроить сохранение названия?
    options:
      - text: 'Проверка версии: сохранять с версией карточки, а при отказе показать свежие данные'
        correct: true
        why: 'Сервер заметит, что карточку уже изменили, и откажет второму сохранению. Чужая правка не пропадёт молча, а редкие отказы здесь — приемлемая цена.'
      - text: 'Слияние: отправлять операцию «изменить название», чтобы сервер применил обе правки'
        why: 'Название нельзя «сложить» из двух правок: применится та, что пришла позже, и первая молча пропадёт.'
      - text: 'Очередь со схлопыванием: следующее сохранение уходит после ответа на предыдущее'
        why: 'Очередь упорядочивает правки одной вкладки. О правке на другом компьютере она ничего не знает.'
      - text: 'Брать последнее: принимать на экране только ответ на последний запрос'
        why: 'Это защищает от устаревших ответов на экране, но на сервере последняя пришедшая правка всё так же затирает чужую.'
    explanation: |
      Стратегию выбирают по инварианту: здесь это «чужая правка не пропадает молча». Слияние годится только для
      операций, которые можно переставлять, — счётчиков, отметок, наборов, а название к ним не относится. Очередь
      и «брать последнее» работают внутри одной вкладки. Остаётся проверка версии (оптимистичная блокировка): сервер
      отказывает правке, основанной на устаревшей версии, и человек решает, что делать.
    links:
      - https://developer.mozilla.org/ru/docs/Web/HTTP/Reference/Headers/ETag

  - id: sdd-optimistic-002
    topic: Изменения и согласованность
    subtopic: Оптимистичные изменения
    level: middle
    question: |
      Трекер задач. Перед каждым оптимистичным изменением клиент сохраняет снимок всего списка задач, а при ошибке
      возвращает его. Человек переименовал задачу A и сразу перетащил задачу B в другую колонку. Сервер принял
      перемещение B, а через секунду отклонил переименование A: не хватает прав. Что увидит человек после отката?
    options:
      - text: 'A вернёт старое имя, B — прежнюю колонку, хотя на сервере B уже перемещена'
        correct: true
        why: 'Снимок для переименования был сделан до перемещения B. Возвращая его, клиент стирает с экрана и успешное перемещение.'
      - text: 'Задача A вернёт старое имя, а задача B останется в новой колонке, как и на сервере'
        why: 'Так работала бы обратная операция: она отменяет только переименование. Снимок же возвращает весь список целиком.'
      - text: 'Обе задачи останутся как есть, и появится сообщение, что переименование не удалось'
        why: 'Откат снимком меняет экран: снимок возвращается целиком, и имя A, и колонка B становятся прежними.'
      - text: 'Задача A вернёт старое имя, а перемещение B тоже отменится на сервере'
        why: 'Откат на клиенте не отправляет на сервер никаких запросов. На сервере B остаётся в новой колонке — экран и сервер разошлись.'
    explanation: |
      Откат снимком (snapshot rollback) прост, но опасен, когда изменений несколько. Снимок хранит всё состояние
      на момент своего создания, включая то, что потом изменилось успешно. Обратная операция (inverse operation)
      отменяет только своё изменение: «вернуть задаче A старое имя». После отката полезно перечитать данные с сервера,
      чтобы окончательно совпасть с правдой.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/guides/optimistic-updates

  - id: sdd-optimistic-004
    topic: Изменения и согласованность
    subtopic: Оптимистичные изменения
    level: senior
    question: |
      Сервис заметок: удаление в одно касание, после него 10 секунд висит плашка «Заметка удалена. Отменить». Заметки
      синхронизируются между телефоном и компьютером, и удалённая на телефоне заметка должна сразу пропасть на
      компьютере: люди удаляют записи с паролями, увидев их на чужом экране. Сервер хранит удалённые заметки в корзине
      30 дней и умеет их восстанавливать. Как устроить отмену?
    options:
      - text: 'Сразу отправить удаление, а по «Отменить» отправить запрос на восстановление из корзины'
        correct: true
        why: 'Обратная операция: удаление сразу видно на всех устройствах, а мягкое удаление на сервере позволяет вернуть заметку целиком.'
      - text: 'Спрятать заметку на телефоне, а сам запрос на удаление отправить, когда пройдут 10 секунд'
        why: 'Отложенное выполнение: на компьютере заметка видна ещё 10 секунд, а при закрытии приложения удаление может не уйти вовсе.'
      - text: 'Сразу удалить заметку насовсем, а по «Отменить» создать новую с тем же текстом'
        why: 'У новой заметки будет другой идентификатор: пропадут история, ссылки на неё и место в папках. Сервер умеет восстанавливать — незачем пересоздавать.'
      - text: 'Сразу отправить удаление, а по «Отменить» вернуть снимок списка заметок на телефоне'
        why: 'Снимок меняет только экран телефона. На сервере заметка остаётся удалённой, и при следующей синхронизации она снова исчезнет.'
    explanation: |
      «Отменить» можно устроить двумя способами. Отложенное выполнение (deferred execution) ничего не делает на сервере
      до конца окна отмены: отмена точная, но другие устройства видят удаляемое, а при закрытии приложения действие
      может потеряться. Обратная операция сразу меняет данные на сервере, а отмена — второй запрос; для неё нужно
      мягкое удаление (soft delete). Требование «сразу пропасть на другом устройстве» решает выбор в пользу обратной
      операции.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/guides/optimistic-updates

  - id: sdd-optimistic-005
    topic: Изменения и согласованность
    subtopic: Оптимистичные изменения
    level: senior
    question: |
      Продажа билетов на популярный концерт. В первые минуты продаж около 40 % попыток выбрать место на схеме зала
      заканчиваются отказом: место за секунду до этого занял другой покупатель. В заказе можно до четырёх мест, и люди
      выбирают их быстро, одно за другим. Сейчас после нажатия схема около секунды не меняется, и человек нажимает
      на место повторно. Как показывать выбор места?
    options:
      - text: 'Сразу пометить место «бронируем…», а своим показать после ответа сервера'
        correct: true
        why: 'Человек сразу видит, что нажатие сработало, и не жмёт повторно, но приложение не обещает успех, который не сбудется в 40 % случаев.'
      - text: 'Сразу показать место своим, а при отказе откатить его обратной операцией'
        why: 'Обратная операция аккуратно отменит одно место, но откатывать придётся почти каждое второе нажатие. Беда в частоте отказов, а не в способе отката.'
      - text: 'Сразу показать место своим, а после ответа перечитать схему зала с сервера'
        why: 'Перечитывание покажет правду, но лишь после того, как человек почти в половине случаев увидит «ваше» место, которое ему не досталось.'
      - text: 'Блокировать всю схему зала до ответа сервера и показывать поверх неё спиннер'
        why: 'Повторных нажатий не будет, но пока ждём ответа, нельзя выбрать следующее место. Четыре места подряд превратятся в четыре паузы.'
    explanation: |
      Оптимистичное обновление оправдано, когда сервер соглашается почти всегда. При 40 % отказов «ваше место» оказывается
      ложным почти в половине случаев, и никакой способ отката этого не исправит. Честная середина — показать процесс,
      а не результат: место помечено «бронируем…», человек видит отклик на нажатие, а «ваше» появляется после
      подтверждения сервера.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/guides/optimistic-updates

  - id: sdd-optimistic-007
    topic: Изменения и согласованность
    subtopic: Оптимистичные изменения
    level: junior
    question: |
      Видеосервис: человек нажал «Нравится» под роликом, приложение сразу закрасило сердечко и отправило запрос.
      Ответа нет: через 15 секунд запрос завершился тайм-аутом. Как поступить с сердечком?
    options:
      - text: 'Не откатывать молча: пометить «проверяем» и перечитать отметку с сервера'
        correct: true
        why: 'Тайм-аут — неизвестный исход: отметка могла сохраниться, а потерялся только ответ. Правду знает сервер, у него и спрашивают.'
      - text: 'Откатить сердечко, как при отказе сервера, и показать «Не удалось»'
        why: 'Если отметка всё-таки сохранилась, экран покажет неправду, а человек нажмёт ещё раз и снимет её.'
      - text: 'Оставить сердечко закрашенным и больше ничего не делать'
        why: 'Если запрос не дошёл, человек будет уверен, что отметка стоит, хотя её нет. Исход надо выяснить, а не угадать.'
      - text: 'Повторять запрос без паузы, пока сервер не ответит'
        why: 'Повторы без паузы и лимита нагружают сервер, а человек так и не узнаёт, что с отметкой. Сначала выясняют исход, повторяют — по правилам повторов.'
    explanation: |
      У оптимистичного изменения три исхода: подтверждено, отказано и неизвестно. При явном отказе изменение
      откатывают и говорят об этом. При тайм-ауте или обрыве откатывать молча нельзя: изменение могло пройти. Клиент
      помечает его как ожидающее проверки и перечитывает данные с сервера.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/guides/optimistic-updates

  - id: sdd-optimistic-006
    topic: Изменения и согласованность
    subtopic: Оптимистичные изменения
    level: middle
    question: |
      Трекер задач: новая задача появляется в списке сразу, с временным идентификатором, а запрос на её создание
      ещё в пути. Человек передумал и нажимает «Удалить» у этой строки. Что сделать клиенту?
    options:
      - text: 'Дождаться подтверждения создания и отправить удаление с настоящим идентификатором'
        correct: true
        why: 'Сервер знает задачу только по идентификатору, который выдаст сам. Пока его нет, удалять на сервере нечего; после подтверждения удаление уйдёт по правильному адресу.'
      - text: 'Сразу отправить DELETE с временным идентификатором этой строки'
        why: 'Временный идентификатор придумал клиент, сервер о нём не знает и ответит «не найдено». А задача, которую он вот-вот создаст, останется.'
      - text: 'Удалить строку только на экране, а запрос создания не трогать'
        why: 'Сервер всё равно создаст задачу, и после перезагрузки она снова появится в списке.'
      - text: 'Отменить запрос создания через abort() и убрать строку'
        why: 'abort() отменяет только ожидание на клиенте. Если запрос уже дошёл, задача на сервере создастся, а клиент о ней забудет.'
    explanation: |
      Пока сервер не подтвердил создание, у строки только временный идентификатор, придуманный клиентом. Запросы,
      которые ссылаются на строку по идентификатору, сервер не поймёт. Поэтому либо действия у ожидающей строки
      недоступны, либо клиент дожидается подтверждения и отправляет их с настоящим идентификатором из ответа сервера.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/guides/optimistic-updates

  - id: sdd-idempotency-001
    topic: Изменения и согласованность
    subtopic: Идемпотентность и повторы
    level: junior
    question: |
      Приложение-календарь. Связь оборвалась раньше, чем пришёл ответ сервера. API следует смыслу методов HTTP
      и ключей идемпотентности не принимает. Какой из этих запросов клиент может повторить автоматически, не рискуя
      повторить эффект?
    options:
      - text: 'PUT /events/77 с полным описанием встречи: время, место, участники'
        correct: true
        why: 'PUT идемпотентен: он заменяет встречу целиком, и второй такой же запрос оставит её в том же виде.'
      - text: 'POST /events с описанием новой встречи на пятницу в 15:00'
        why: 'POST не идемпотентен: если первый запрос дошёл, повтор создаст вторую такую же встречу.'
      - text: 'POST /events/77/invitations, чтобы разослать участникам приглашения'
        why: 'Если первый запрос выполнился, повтор разошлёт приглашения ещё раз. Побочный эффект повторится.'
      - text: 'PATCH /events/77 с командой «продлить встречу на 15 минут»'
        why: 'PATCH по определению не идемпотентен, а эта команда вдобавок прибавляет: повтор продлит встречу ещё на 15 минут.'
    explanation: |
      По RFC 9110 идемпотентны методы, у которых несколько одинаковых запросов дают тот же эффект, что один: PUT,
      DELETE и безопасные (GET, HEAD, OPTIONS, TRACE). Их можно повторить автоматически после обрыва связи. POST
      и PATCH идемпотентными не считаются, и стандарт не советует повторять их автоматически, если нет способа
      узнать, что повтор безопасен. Смысл операции тоже важен: «поставить» повторяется безопасно, «прибавить» — нет.
    links:
      - https://www.rfc-editor.org/rfc/rfc9110.html#name-idempotent-methods

  - id: sdd-idempotency-002
    topic: Изменения и согласованность
    subtopic: Идемпотентность и повторы
    level: middle
    question: |
      Сервис донатов стримерам. Клиент отправляет пожертвование запросом POST с заголовком `Idempotency-Key`, а при
      обрыве связи повторяет запрос. Зрители часто жертвуют одному стримеру несколько раз за вечер. Когда клиенту
      создавать новый ключ?
    options:
      - text: 'Когда зритель нажал «Отправить» с суммой; повторы этого доната идут с тем же ключом'
        correct: true
        why: 'Один ключ — одно намерение. Повторы после обрыва сервер узнает по ключу, а следующий донат получит свой ключ и выполнится.'
      - text: 'Перед каждой отправкой запроса, включая повторы после обрыва связи, чтобы ключи не совпадали'
        why: 'Тогда у каждого повтора свой ключ, и сервер видит несколько разных операций. Это всё равно что не отправлять ключ вовсе.'
      - text: 'Когда зритель открыл страницу стримера; все донаты с этой страницы идут с этим ключом'
        why: 'Второй донат за вечер сервер примет за повтор первого и вернёт его старый результат, а если сумма другая — ошибку.'
      - text: 'Когда зритель вошёл в аккаунт; ключ хранится до выхода и подходит ко всем его донатам'
        why: 'Ключ, общий для многих операций, превращает каждый следующий донат в «повтор» самого первого. Деньги стример не получит.'
    explanation: |
      Ключ идемпотентности (idempotency key) нужен, чтобы сервер узнавал повторы одной и той же операции. Поэтому
      он создаётся один раз на намерение человека и переиспользуется во всех попытках его выполнить. Новый ключ
      на каждую попытку ломает защиту от повторов, а один ключ на много операций ломает сами операции: сервер вернёт
      сохранённый ответ первой. Stripe, например, ещё и сравнивает параметры и отвечает ошибкой, если по старому ключу
      пришла другая сумма.
    links:
      - https://docs.stripe.com/api/idempotent_requests

  - id: sdd-idempotency-003
    topic: Изменения и согласованность
    subtopic: Идемпотентность и повторы
    level: middle
    question: |
      Сервис оплаты коммунальных услуг: человек оплачивает счёт за электричество на 2 300 ₽. Запрос ушёл с ключом
      идемпотентности, но за 30 секунд ответа не было, и клиент прекратил ждать. Сервер хранит ключи сутки. Что
      показать человеку и что сделать?
    options:
      - text: 'Показать «Проверяем оплату…», повторить запрос с тем же ключом и показать то, что ответит сервер'
        correct: true
        why: 'Исход неизвестен, а повтор с тем же ключом безопасен: если оплата прошла, сервер вернёт сохранённый ответ, если нет — выполнит её один раз.'
      - text: 'Показать «Оплата не прошла» и кнопку «Повторить», которая отправит запрос с новым ключом'
        why: 'Первая оплата могла пройти — потерялся только ответ. Повтор с новым ключом сервер примет за новую операцию и спишет деньги второй раз.'
      - text: 'Показать «Оплата прошла», ведь почти все платежи успешны, и обновить статус позже'
        why: 'Это обещание без оснований: запрос мог не дойти до сервера. Человек решит, что счёт оплачен, и получит пени.'
      - text: 'Показать «Проверяем оплату…» и повторить запрос с новым ключом, чтобы он выполнился заново'
        why: 'Слова на экране честные, но новый ключ отключает защиту: если первый запрос прошёл, деньги спишутся дважды.'
    explanation: |
      Тайм-аут — решение клиента перестать ждать, а не ответ сервера. За ним может скрываться «не дошло», «выполнилось,
      но ответ потерялся» и «ещё выполняется». Поэтому после тайм-аута нельзя писать «не получилось» и начинать заново.
      Ключ идемпотентности позволяет безопасно повторить ту же операцию: сервер по ключу узнает повтор и вернёт
      прежний результат. Если операция с этим ключом ещё выполняется, сервер ответит конфликтом, и повтор можно
      сделать чуть позже. После ответа 500 этот путь не сработает: сервер вроде Stripe сохранил 500 вместе с ключом
      и вернёт его снова, поэтому исход выясняют запросом статуса.
    links:
      - https://docs.stripe.com/error-low-level#idempotency

  - id: sdd-idempotency-004
    topic: Изменения и согласованность
    subtopic: Идемпотентность и повторы
    level: middle
    multiple: true
    question: |
      Онлайн-кинотеатр, оформление подписки за 399 ₽ в месяц. Кнопка «Оформить» блокируется сразу при нажатии
      и остаётся недоступной, пока запрос в пути. Сервер ключей идемпотентности не поддерживает и не проверяет, есть ли у человека
      подписка. Что из этого всё ещё может привести к двум списаниям?
    options:
      - text: 'Человек обновил страницу во время ожидания и нажал «Оформить» снова'
        correct: true
        why: 'После перезагрузки кнопка снова доступна, а первый запрос мог уже выполниться. Блокировка жила только на прежней странице.'
      - text: 'Человек открыл подписку во второй вкладке и нажал «Оформить» там'
        correct: true
        why: 'Блокировка кнопки в одной вкладке ничего не знает о другой. На сервер уйдут два независимых запроса.'
      - text: 'Обёртка над fetch сама повторила запрос после обрыва связи'
        correct: true
        why: 'Обрыв мог случиться уже после списания, на пути ответа. Автоматический повтор POST без ключа выполнит оформление ещё раз.'
      - text: 'Человек дважды быстро щёлкнул по кнопке «Оформить»'
        why: 'От этого как раз защищает блокировка: после первого щелчка кнопка недоступна, и второй запрос не уходит.'
    explanation: |
      Двойная отправка (double submit) приходит из разных мест, и каждая защита закрывает только часть. Блокировка
      кнопки — слой интерфейса: она спасает от двойного щелчка, но не от перезагрузки, второй вкладки и повторов
      после обрыва. От них защищает сервер: ключ идемпотентности или проверка по смыслу («у человека уже есть
      подписка»). Надёжная защита — несколько слоёв вместе.
    links:
      - https://docs.stripe.com/api/idempotent_requests

  - id: sdd-idempotency-005
    topic: Изменения и согласованность
    subtopic: Идемпотентность и повторы
    level: senior
    question: |
      Бронирование отеля с предоплатой. Человек оплачивал 2 ночи с ключом идемпотентности K1, и запрос завершился
      тайм-аутом. Пока ждал, он решил остаться на 3 ночи и снова нажал «Оплатить» — уже с новой суммой. Сервер, как
      Stripe, хранит ключи сутки и отвечает ошибкой, если по старому ключу пришли другие параметры. У API есть запрос
      статуса брони. Что сделать клиенту?
    options:
      - text: 'Сначала узнать исход оплаты по K1, а потом оплатить недостающие ночи с новым ключом'
        correct: true
        why: 'Прошла оплата 2 ночей — доплачивается одна ночь, не прошла — оплачиваются три. В обоих случаях денег спишется ровно столько, сколько нужно.'
      - text: 'Оплатить 3 ночи с ключом K1: сервер узнает повтор и не спишет деньги дважды'
        why: 'Ключ защищает повторы одной операции, а это уже другая: сумма изменилась. Такой сервер ответит ошибкой несовпадения параметров.'
      - text: 'Сразу отправить оплату 3 ночей с новым ключом: изменились данные, значит, это новая операция'
        why: 'Если первая оплата прошла, человек заплатит за 2 ночи и ещё за 3. Новый ключ уместен только после того, как исход первой оплаты известен.'
      - text: 'Отправить оплату 3 ночей с ключом K1, а при ошибке несовпадения сразу повторить с новым ключом'
        why: 'Ошибка несовпадения ничего не говорит о судьбе первой оплаты. Повтор с новым ключом — тот же риск двойного списания, только на шаг позже.'
    explanation: |
      У ключа идемпотентности есть граница: один ключ — одна операция с одними параметрами. Изменили данные — это новая
      операция с новым ключом. Но сначала нужно выяснить исход прежней, иначе после неизвестного исхода можно оплатить
      обе. Stripe советует так же: прежде чем менять параметры, убедиться, что исходная операция не прошла и не
      выполняется, и только тогда брать новый ключ.
    links:
      - https://docs.stripe.com/error-low-level#idempotency

  - id: sdd-conflicts-001
    topic: Изменения и согласованность
    subtopic: Версии и конфликты
    level: junior
    question: |
      В CRM менеджер открыл карточку клиента и получил `ETag: "v3"`. Пока он правил телефон, коллега сохранил
      в этой карточке новый адрес, и на сервере теперь `ETag: "v4"`. Менеджер нажимает «Сохранить», и клиент
      отправляет `PUT` с заголовком `If-Match: "v3"`. Что ответит сервер, который поддерживает условные запросы?
    options:
      - text: 'Откажет с кодом 412 и оставит карточку без изменений'
        correct: true
        why: 'Предусловие «метка всё ещё v3» ложно, поэтому сервер не выполняет запрос и сообщает, что предусловие не выполнено. Адрес коллеги цел.'
      - text: 'Запишет новый телефон и вернёт в ответе метку v5'
        why: 'Так было бы без If-Match. Заголовок как раз и нужен, чтобы сервер не применял правку, основанную на устаревшей версии.'
      - text: 'Ответит 304 Not Modified, потому что метки не совпали'
        why: '304 — ответ на условное чтение с If-None-Match: «у вас актуальная копия». К сохранению с If-Match он не относится.'
      - text: 'Запишет телефон, а адрес коллеги оставит, потому что поля разные'
        why: 'Слияние по полям — отдельная логика, которую сервер должен уметь сам. If-Match проверяет версию записи целиком: метка не та — запрос не выполняется.'
    explanation: |
      Условный запрос выполняется, только если предусловие истинно. `If-Match: "v3"` значит «примени, если текущая
      метка — v3». Метка уже v4, поэтому сервер отвечает 412 Precondition Failed и ничего не меняет. Это оптимистичная
      блокировка: править могут все сразу, а конфликт обнаруживается в момент записи. Дальше клиент решает, как его
      разрешить: перечитать запись и дать человеку повторить правку, слить поля или показать обе версии.
    links:
      - https://www.rfc-editor.org/rfc/rfc9110.html#section-13.1.1
      - https://developer.mozilla.org/ru/docs/Web/HTTP/Reference/Headers/ETag

  - id: sdd-conflicts-002
    topic: Изменения и согласованность
    subtopic: Версии и конфликты
    level: middle
    question: |
      В складской системе карточку товара сохраняют целиком с `If-Match`. Чтобы люди реже видели ошибки, разработчик
      сделал так: при ответе 412 клиент молча перечитывает карточку, берёт из ответа новый ETag и отправляет прежнее
      тело запроса уже с ним. Чем плохо это решение?
    options:
      - text: 'Чужая правка затирается так же, как будто версии не сравнивались вовсе'
        correct: true
        why: 'Клиент отправляет те же данные, что собрал по старой версии, только с новой меткой. Сервер их примет и перезапишет изменение коллеги — это last-write-wins с лишним запросом.'
      - text: 'Повтор нужно отправлять через очередь, чтобы он не обогнал другие сохранения'
        why: 'Очередь упорядочит запросы одной вкладки, но тело всё равно собрано по старой версии: повтор пройдёт и затрёт правку коллеги.'
      - text: 'Новый ETag может оказаться слабым, и запрос снова получит 412'
        why: 'Если сервер отдаёт слабые метки, условные сохранения не работали бы с самого начала. Главная беда решения не в этом, а в том, что повтор проходит и затирает данные.'
      - text: 'Перечитывать карточку нужно через If-None-Match, иначе придёт старая копия'
        why: 'If-None-Match при чтении экономит трафик, когда данные не изменились. Здесь данные изменились, и обычный GET вернёт свежую версию — проблема не в чтении.'
    explanation: |
      Ответ 412 означает «вы правили устаревшую версию». Правильная реакция — показать человеку новую версию или слить
      изменения по полям, а не отправить старое тело с новой меткой. Такой «тихий повтор» превращает оптимистичную
      блокировку в last-write-wins: проверка формально есть, а правка коллеги всё равно пропадает. Если для данных
      допустим last-write-wins, честнее вовсе не проверять версию; если недопустим — конфликт должен дойти до
      человека или до логики слияния.
    links:
      - https://www.rfc-editor.org/rfc/rfc9110.html#section-13.1.1

  - id: sdd-conflicts-003
    topic: Изменения и согласованность
    subtopic: Версии и конфликты
    level: middle
    question: |
      В приложении для чтения книг размер шрифта и цвет фона синхронизируются между телефоном и планшетом одного
      человека. Другие люди эти настройки не видят и не меняют. Если сохранится не то значение, человек поправит его
      одним касанием. Как разрешать конфликт, когда настройку поменяли на двух устройствах почти одновременно?
    options:
      - text: 'Не сверять версии: остаётся значение, которое пришло на сервер последним'
        correct: true
        why: 'Потерянная правка здесь ничего не стоит, а конфликт возможен только между устройствами одного человека. Last-write-wins даёт нужное поведение без лишней работы.'
      - text: 'Сохранять с If-Match и при ответе 412 перечитывать настройки с сервера'
        why: 'Это работает, но человек увидит отказ и должен будет повторить действие ради настройки, потерю которой поправит одним касанием. Цена выше пользы.'
      - text: 'Показывать при конфликте обе версии настроек и просить выбрать одну'
        why: 'Ручной выбор оправдан для дорогих ошибок вроде цены. Для размера шрифта диалог только раздражает.'
      - text: 'Хранить базовую версию и сливать настройки трёхсторонним слиянием'
        why: 'Слияние полезно, когда разные люди правят разные поля большой карточки. Для двух личных настроек это заметная сложность без выигрыша.'
    explanation: |
      Last-write-wins — не всегда ошибка. Его выбирают осознанно, когда потерянная правка ничего не стоит: личные
      настройки, данные, которые правит один человек. «Последней» считается запись, последней пришедшая на сервер, —
      не по часам устройств, которые могут спешить. Проверку версий, слияние и ручной выбор оставляют для данных,
      где потеря чужой правки обходится дорого.
    links:
      - https://www.rfc-editor.org/rfc/rfc9110.html#section-13.1.1

  - id: sdd-conflicts-004
    topic: Изменения и согласованность
    subtopic: Версии и конфликты
    level: senior
    multiple: true
    question: |
      Админка интернет-магазина. В карточке товара есть описание, фотографии, цена и цена со скидкой; цена со скидкой
      всегда должна быть ниже обычной. Карточки правят три контент-менеджера, обычно разные поля. Ошибка в цене стоит
      денег, а повторно набирать длинное описание люди не хотят. Сервер отдаёт ETag, клиент помнит базовую версию.
      Какие решения подходят для сохранения при конфликте?
    options:
      - text: 'Автоматически сливать описание и фото, если другой человек их не менял'
        correct: true
        why: 'Это независимые поля, и люди обычно правят разные. Трёхстороннее слияние по базовой версии сохранит обе правки, и никому не придётся повторять работу.'
      - text: 'Цену и цену со скидкой сливать вместе: если другой поменял любую из них — спросить человека'
        correct: true
        why: 'Поля связаны правилом «скидочная ниже обычной», поэтому сливать их по отдельности нельзя. А ошибка в цене дорогая — решение по ней должен принимать человек.'
      - text: 'Цену и цену со скидкой сливать по отдельности, как описание и фото'
        why: 'Каждая правка может быть верной, а вместе они нарушат правило: один снизил обычную цену до 300, другой поставил скидочную 320.'
      - text: 'Сохранять карточку целиком по принципу last-write-wins: менеджеров всего трое'
        why: 'Даже при трёх людях конфликты случаются, и тогда молча пропадает правка цены, которая стоит денег.'
      - text: 'При конфликте перечитывать карточку и просить человека заново внести все свои правки'
        why: 'Цены это защитит, но человеку придётся заново набирать длинное описание, которое никто другой не менял. Условие прямо говорит, что так нельзя.'
    explanation: |
      Способы разрешения конфликтов сочетают внутри одной карточки. Независимые поля, которые люди обычно правят
      порознь, сливают автоматически по трём версиям: базовой, своей и серверной. Поля, связанные правилом, сливают
      как одно целое: изменилось любое из них у другой стороны — значит, конфликт. Дорогие поля при конфликте
      показывают человеку. Отказ с перечитыванием всей формы прост, но заставляет повторять работу, которую можно
      было сохранить.
    links:
      - https://www.rfc-editor.org/rfc/rfc9110.html#section-13.1.1

  - id: sdd-conflicts-005
    topic: Изменения и согласованность
    subtopic: Версии и конфликты
    level: senior
    question: |
      Внутренняя вики: интерфейс открывается с `wiki.example.com`, API работает на `api.example.com`. Сервер отдаёт
      ETag и на сохранение без `If-Match` отвечает 428 Precondition Required. Во вкладке «Сеть» ответ на GET страницы
      содержит заголовок `ETag`, но в коде `response.headers.get('ETag')` возвращает `null`, и каждое сохранение
      падает с 428. Что нужно сделать?
    options:
      - text: 'Добавить в ответы сервера заголовок Access-Control-Expose-Headers: ETag'
        correct: true
        why: 'API на другом домене, и браузер показывает коду только несколько безопасных заголовков ответа. ETag в их число не входит, пока сервер явно его не откроет.'
      - text: 'Отправлять запросы с credentials: include, чтобы браузер открыл все заголовки'
        why: 'Этот параметр управляет отправкой cookie и данных входа. Список заголовков ответа, доступных коду, он не расширяет.'
      - text: 'Отправлять If-Match: * — он подходит, когда точная метка неизвестна'
        why: 'If-Match: * означает «выполни, если запись существует». Ошибка 428 уйдёт, но проверка версии исчезнет, и правки снова начнут затирать друг друга.'
      - text: 'Добавить в GET заголовок Cache-Control: no-cache, чтобы пришёл ответ с меткой'
        why: 'Ответ с меткой и так приходит — это видно во вкладке «Сеть». Проблема не в кэше, а в том, что браузер не даёт коду прочитать этот заголовок.'
    explanation: |
      Когда страница и API на разных доменах, браузер ограничивает, какие заголовки ответа видит JavaScript: по
      умолчанию это несколько безопасных вроде `Content-Type` и `Last-Modified`. `ETag` в этот список не входит,
      поэтому сервер должен перечислить его в `Access-Control-Expose-Headers`. Подмена метки на `*` — частая
      «починка», которая молча выключает обнаружение конфликтов: сервер начинает принимать любое сохранение, если
      запись просто существует.
    links:
      - https://developer.mozilla.org/ru/docs/Web/HTTP/Reference/Headers/ETag
      - https://www.rfc-editor.org/rfc/rfc9110.html#section-13.1.1

  - id: sdd-reconcile-001
    topic: Изменения и согласованность
    subtopic: Сверка кэша после изменений
    level: junior
    question: |
      В трекере задач человек открыл карточку задачи и переименовал её. Сервер ответил 200 и вернул задачу с новым
      названием, карточка его показывает. Человек возвращается к списку задач спринта и видит старое название, хотя
      после перезагрузки страницы там новое. Список и карточка загружаются через клиентский кэш по разным ключам.
      В чём причина?
    options:
      - text: 'Ответ сервера записали только в кэш карточки, а запись списка не тронули'
        correct: true
        why: 'Список и карточка — две отдельные копии одной задачи. Ответ сервера положили только в одну, а вторую не обновили и не пометили устаревшей.'
      - text: 'Сервер сохранил новое название в карточке, но не успел обновить его в списке'
        why: 'После перезагрузки список показывает новое название — значит, сервер хранит его правильно. Ошибается клиент.'
      - text: 'Браузер взял ответ на запрос списка из своего HTTP-кэша, а не с сервера'
        why: 'Списка на экране нового запроса вообще не было: клиент показал то, что уже лежало в его собственном кэше. HTTP-кэш тут ни при чём.'
      - text: 'Компонент списка обёрнут в memo и поэтому не перерисовался после сохранения'
        why: 'memo пропускает перерисовку, только если входные данные не изменились. Здесь не изменились сами данные списка в кэше — это и надо исправить.'
    explanation: |
      Клиентский кэш хранит отдельную запись на каждый ключ, и одна сущность часто лежит в нескольких: в карточке,
      в списке, в поиске. После изменения нужно обновить или инвалидировать все записи, где она есть. Удобнее всего,
      когда ключи устроены единообразно (`['tasks', 'detail', id]`, `['tasks', 'list', …]`): тогда все списки задач
      можно выбрать по началу ключа.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/guides/query-invalidation

  - id: sdd-reconcile-002
    topic: Изменения и согласованность
    subtopic: Сверка кэша после изменений
    level: middle
    question: |
      Почтовый клиент. Человек открывает письмо, и оно помечается прочитанным; сервер отвечает `{ id, read: true }`.
      Это письмо может лежать в загруженных списках «Входящие» и «Важные». В боковом меню — счётчик непрочитанных
      по каждой папке, а в каждом списке загружена только первая страница. Папок у людей бывает по сорок. Как
      обновить кэш?
    options:
      - text: 'Поставить признак «прочитано» письму во всех загруженных списках, а счётчики перезапросить'
        correct: true
        why: 'Замена поля по id — простое прямое обновление, его видно сразу. Счётчик — сводное значение, посчитать его по первой странице нельзя, поэтому его спрашивают у сервера.'
      - text: 'Поставить признак «прочитано» письму в списке, откуда его открыли, а счётчики перезапросить'
        why: 'Счётчики будут верными, но в списке «Важные» то же письмо останется жирным. Признак нужно поменять во всех загруженных списках, где есть это письмо.'
      - text: 'Инвалидировать все списки всех папок и все счётчики, чтобы ничего не упустить'
        why: 'При сорока папках каждое открытое письмо вызовет шквал запросов. Признак у письма клиент может поменять сам, без сервера.'
      - text: 'Пересчитать счётчик непрочитанных по письмам, которые сейчас лежат в кэше'
        why: 'В кэше только первые страницы списков. Непрочитанные письма дальше в списке в подсчёт не попадут, и счётчик будет врать.'
    explanation: |
      Выбор между прямым обновлением и инвалидацией зависит от формы данных. Поменять поле у записи, найденной по id,
      клиент может сам — это быстро и точно. Сводные значения (счётчики, суммы) пересчитывать по загруженным
      страницам нельзя: их перезапрашивают, а если разница известна точно, сдвигают сразу и всё равно уточняют
      у сервера. Частое сочетание: поля — прямым обновлением, сводки — инвалидацией.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/guides/updates-from-mutation-responses
      - https://tanstack.com/query/latest/docs/framework/react/guides/query-invalidation

  - id: sdd-reconcile-003
    topic: Изменения и согласованность
    subtopic: Сверка кэша после изменений
    level: middle
    question: |
      Администратор отеля создаёт бронирование на 14 марта. Список бронирований отсортирован по дате заезда и разбит
      на страницы по 20; у администратора загружены страницы 1 и 2, а всего их 30. Сервер на создание возвращает новое
      бронирование целиком. Как обновить список?
    options:
      - text: 'Пометить списки бронирований устаревшими, чтобы клиент перезапросил их с сервера'
        correct: true
        why: 'Куда встанет новая запись и как сдвинутся границы страниц, знает только сервер. Перезапрос даёт правильный порядок без повторения его логики на клиенте.'
      - text: 'Вставить бронирование в загруженные страницы на нужное место по дате заезда'
        why: 'Место по дате может оказаться на странице, которая не загружена. А если вставить на загруженную, при подгрузке следующей страницы запись, сдвинутая на границе, появится второй раз.'
      - text: 'Добавить бронирование в начало первой страницы, чтобы администратор сразу его увидел'
        why: 'Список отсортирован по дате заезда, и 14 марта не обязательно первое. Запись окажется не на своём месте, а позже появится ещё и там, где ей положено быть.'
      - text: 'Положить ответ сервера в кэш карточки бронирования и больше ничего не менять'
        why: 'Карточка будет готова, но в списке нового бронирования не окажется, пока данные не устареют сами. Администратор решит, что бронирование не создалось.'
    explanation: |
      Когда изменение влияет на состав или порядок списка — новая запись, сортировка, фильтр, страницы, — прямое
      обновление требует повторить логику сервера на клиенте, а с частично загруженными страницами это невозможно.
      Здесь выбирают инвалидацию: списки помечаются устаревшими и перезапрашиваются. Ответ сервера при этом можно
      положить в кэш карточки, чтобы она открылась без запроса.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/guides/query-invalidation

  - id: sdd-reconcile-004
    topic: Изменения и согласованность
    subtopic: Сверка кэша после изменений
    level: senior
    question: |
      В приложении семейного бюджета у категории «Кафе» есть месячный лимит. Его меняют оба супруга, поэтому экран
      каждые 30 секунд перезапрашивает категории в фоне. Сервер отдаёт у каждой категории номер версии. Жалоба: человек
      быстро меняет лимит с 5000 на 7000, потом на 8000, и через секунду на экране снова 5000. В логах видно, что
      последним пришёл ответ фонового запроса, начатого ещё до первой правки. Какое правило записи в кэш устраняет
      ошибку?
    options:
      - text: 'Записывать ответ в кэш, только если его версия не старше той, что уже лежит в кэше'
        correct: true
        why: 'Фоновый ответ несёт версию до правок и будет отброшен, когда бы он ни пришёл. Правило не зависит от порядка ответов.'
      - text: 'Записывать ответ, только если время изменения в нём позже последней правки по часам телефона'
        why: 'Время в ответе ставят часы сервера, а правку отметили часы телефона. Они расходятся на секунды и минуты, и сравнение будет то пропускать старое, то отбрасывать новое.'
      - text: 'Отключить фоновые перезапросы на этом экране, чтобы они не мешали сохранению'
        why: 'Откат пропадёт, но перестанут подтягиваться изменения второго супруга, ради которых перезапросы и нужны.'
      - text: 'Блокировать поле лимита, пока не придёт ответ на предыдущее сохранение'
        why: 'Так свои сохранения пойдут по очереди, но фоновый запрос, начатый до первой правки, всё равно может прийти последним и откатить значение.'
    explanation: |
      Ответ сервера не всегда свежее того, что уже в кэше: фоновый перезапрос мог прочитать данные до изменения,
      а прийти после. Надёжная защита — версия в данных: клиент записывает ответ, только если его версия не старше
      кэшированной. Дополнительно перед изменением отменяют незавершённые фоновые перезапросы этого ключа
      (в TanStack Query — `cancelQueries`), чтобы их ответы не легли поверх.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/guides/updates-from-mutation-responses

  - id: sdd-reconcile-005
    topic: Изменения и согласованность
    subtopic: Сверка кэша после изменений
    level: middle
    multiple: true
    question: |
      Музыкальный сервис на GraphQL с нормализованным кэшем: каждый плейлист хранится один раз под ключом из типа
      и id, а списки ссылаются на него. Человек меняет у плейлиста название и обложку, и мутация возвращает плейлист
      с id, новым названием и обложкой. Код обновления кэша не написан. Что обновится на экране само?
    options:
      - text: 'Название и обложка в меню «Мои плейлисты» и на странице плейлиста'
        correct: true
        why: 'Меню и страница ссылаются на ту же единственную копию плейлиста, а её поля обновились из ответа мутации.'
      - text: 'Исчезновение плейлиста из результатов поиска по старому названию'
        why: 'Это изменение состава списка. Поиск хранит прежний набор ссылок, и нормализованный кэш не знает, что плейлист больше не подходит под запрос: в результатах он останется, только с новым названием.'
      - text: 'Появление плейлиста в разделе «Недавно изменённые»'
        why: 'Это изменение состава списка. Нормализованный кэш не знает, что плейлист теперь должен попасть в этот раздел, — нужен код обновления или перезапрос.'
      - text: 'Новое место плейлиста в списке, отсортированном по названию'
        why: 'Список хранит ссылки в прежнем порядке. Название в нём обновится, а пересортировку сделает только сервер при перезапросе.'
    explanation: |
      Нормализованный кэш хранит сущность один раз, а списки ссылаются на неё. Поэтому поля существующей сущности,
      пришедшие в ответе мутации, обновляются везде сразу. Но состав и порядок списков кэш сам не меняет: запись
      не попадёт в новый раздел и не исчезнет из поиска, где больше не подходит, а сортировка не пересчитается.
      Для этого пишут код обновления кэша или перезапрашивают затронутые списки.
    links:
      - https://www.apollographql.com/docs/react/data/mutations#updating-local-data

  - id: sdd-forms-002
    topic: Изменения и согласованность
    subtopic: Формы и валидация
    level: middle
    question: |
      В форме страховой компании 25 полей, среди них номер полиса из 10 цифр. Сейчас формат номера проверяется
      при каждом нажатии клавиши, и люди жалуются: ошибка «Неверный номер» появляется после первой же цифры.
      При этом они хотят узнавать об ошибке в номере сразу после того, как его ввели, а не в конце формы. Как
      изменить проверку?
    options:
      - text: 'Проверять при уходе из поля, а после показанной ошибки — при каждом вводе'
        correct: true
        why: 'Человек не видит ошибок, пока дописывает номер, узнаёт о них сразу после поля, а исправленная ошибка исчезает на первом же нажатии.'
      - text: 'Проверять номер только при отправке формы, вместе со всеми остальными полями'
        why: 'Недописанный номер ругать перестанут, но об ошибке человек узнает в конце формы из 25 полей, а условие требует сообщать сразу.'
      - text: 'Проверять при вводе, но через 300 мс после последнего нажатия на клавишу'
        why: 'Человек, который задумался посреди номера, всё равно увидит ошибку на недописанном значении. Задержка смягчает проблему, но не убирает её.'
      - text: 'Проверять при уходе из поля и при отправке, а при вводе не проверять вовсе'
        why: 'Ошибки после первой цифры исчезнут, но исправленная ошибка будет висеть, пока человек не уйдёт из поля, и он не поймёт, исправил ли.'
    explanation: |
      Каждый момент проверки — при вводе, при уходе из поля, при отправке — хорош для своего. Частое сочетание:
      первая проверка при уходе из поля, после показанной ошибки — перепроверка при каждом вводе, при отправке —
      проверка всей формы. Тогда форма не ругается на недописанное, сообщает об ошибке, пока человек помнит, что
      вводил, и сразу показывает, что ошибка исправлена. В React Hook Form это режим `onTouched`.
    links:
      - https://www.w3.org/WAI/tutorials/forms/notifications/

  - id: sdd-forms-006
    topic: Изменения и согласованность
    subtopic: Формы и валидация
    level: middle
    question: |
      В соцсети при регистрации ник проверяется на занятость, пока человек печатает. У одного человека проверка
      закончилась тайм-аутом: сервис проверки ников сейчас отвечает с перебоями. Остальные поля заполнены верно,
      и человек нажимает «Зарегистрироваться». Как должна повести себя форма?
    options:
      - text: 'Отправить форму: ник проверит сервер при регистрации и вернёт ошибку у поля'
        correct: true
        why: 'Проверка при вводе — только подсказка, окончательно ник проверяет сервер при сохранении. Сбой подсказки не повод останавливать человека.'
      - text: 'Не давать отправить форму, пока проверка ника не закончится успешно'
        why: 'Пока сервис проверки отвечает с перебоями, человек не сможет зарегистрироваться вовсе, хотя сама регистрация, возможно, прошла бы.'
      - text: 'Показать у ника галочку «свободно», раз проверка не нашла, что он занят'
        why: '«Не удалось проверить» — не то же, что «свободно». Галочка пообещает то, чего никто не проверял, и человек удивится отказу.'
      - text: 'Перед отправкой молча повторять проверку ника, пока сервис не ответит'
        why: 'При долгих перебоях человек будет ждать без объяснений, а окончательная проверка всё равно произойдёт на сервере при регистрации.'
    explanation: |
      У асинхронной проверки четыре исхода: «проверяем…», «свободно», «занято» и «не удалось проверить». Последний —
      не ошибка человека, поэтому галочку не ставят, но и форму не блокируют. Проверка при вводе лишь подсказывает,
      а решает сервер при сохранении: он обязан проверить уникальность ещё раз, потому что между подсказкой
      и отправкой имя могли занять, и при занятом имени вернёт ошибку этого поля.
    links:
      - https://developer.mozilla.org/ru/docs/Learn_web_development/Extensions/Forms/Form_validation

  - id: sdd-forms-004
    topic: Изменения и согласованность
    subtopic: Формы и валидация
    level: senior
    question: |
      Визовая анкета из трёх шагов: «Паспорт», «Поездка», «Контакты». Данные всех шагов хранятся в общем состоянии
      формы, сервер проверяет анкету целиком при отправке с последнего шага. Он ответил 422 с ошибкой
      `{ "pointer": "#/passport/number", "detail": "Паспорт недействителен" }`. Человек сейчас на шаге «Контакты».
      Что должен сделать клиент?
    options:
      - text: 'Перейти на шаг «Паспорт», показать ошибку у поля номера и поставить фокус'
        correct: true
        why: 'Человек сразу оказывается там, где надо исправлять, и видит, что именно не так. Данные остальных шагов остаются в общем состоянии формы.'
      - text: 'Показать над кнопкой «Отправить» общее сообщение «Паспорт недействителен»'
        why: 'Человек узнает о проблеме, но поле на другом шаге, и искать его ему придётся самому. Указатель в ответе нужен, чтобы клиент привёл его к полю.'
      - text: 'Отметить ошибку у поля на шаге «Паспорт» и оставить человека на шаге «Контакты»'
        why: 'Ошибка привязана к полю, но человек её не видит: он на другом шаге и может решить, что анкета ушла.'
      - text: 'Вернуть человека на шаг «Паспорт» и очистить шаги «Поездка» и «Контакты»'
        why: 'Ошибка касается только номера паспорта, остальные данные верны. Стирать их — заставить человека вводить всё заново.'
    explanation: |
      Серверная ошибка с указателем на поле показывается так же, как своя: под полем, с понятным текстом, с фокусом
      на нём. В многошаговой форме к этому добавляется переход на шаг, где лежит поле, — удобно, когда каждое поле
      знает свой шаг. Если ошибок несколько, полезен ещё список над формой со ссылками на поля. Введённое на всех
      шагах остаётся на месте.
    links:
      - https://www.w3.org/WAI/tutorials/forms/notifications/
      - https://www.rfc-editor.org/rfc/rfc9457.html#section-3

  - id: sdd-forms-005
    topic: Изменения и согласованность
    subtopic: Формы и валидация
    level: middle
    question: |
      В сервисе бронирования столиков сервер принимает телефон с плюсом, пробелами, скобками и дефисами и сам
      приводит его к цифрам. Клиентская проверка пропускает только цифры. Люди часто вставляют номер из адресной
      книги в виде «+7 (912) 345-67-89», видят «Неверный телефон» и бросают бронь. Опечатку в номере люди должны
      видеть до отправки. Что изменить?
    options:
      - text: 'Принимать на клиенте плюс, пробелы, скобки и дефисы, как принимает сервер'
        correct: true
        why: 'Клиент — упрощённая копия серверного правила, и строже сервера ему быть нельзя. Опечатки вроде лишней цифры он по-прежнему поймает до отправки.'
      - text: 'Убрать проверку телефона на клиенте и оставить только проверку на сервере'
        why: 'Правильные номера перестанут отвергаться, но об опечатке человек узнает только после отправки, а условие требует сообщать раньше.'
      - text: 'Добавить под полем пример формата, чтобы люди вводили номер одними цифрами'
        why: 'Номер вставляют из адресной книги со скобками и пробелами, и переписывать его вручную будут не все. Правило по-прежнему строже сервера.'
      - text: 'Ужесточить серверную проверку, чтобы она совпадала с клиентской'
        why: 'Расхождение исчезнет, но правильные номера начнут отвергаться ещё и сервером, в том числе из других приложений, которые шлют их со скобками.'
    explanation: |
      Одно правило в двух местах может разъехаться. Окончательное правило — серверное, а клиентское — его упрощённая
      копия для быстрой подсказки, и лучше ей быть мягче, а не строже. Если клиент строже, человек не может отправить
      правильные данные. Чтобы расхождений не было вовсе, обе стороны иногда берут правила из одной общей схемы.
    links:
      - https://developer.mozilla.org/ru/docs/Learn_web_development/Extensions/Forms/Form_validation

  - id: sdd-forms-007
    topic: Изменения и согласованность
    subtopic: Формы и валидация
    level: junior
    question: |
      Форма регистрации проверяет, свободен ли ник, через 300 мс после паузы в наборе. Человек ввёл «kot», задумался
      и дописал «kot_ivan». Ответ «kot — свободно» задержался и пришёл позже ответа «kot_ivan — занято». Что сделать
      с поздним ответом?
    options:
      - text: 'Применить ответ, только если проверенный ник совпадает с тем, что сейчас в поле'
        correct: true
        why: 'Ответ «kot — свободно» не относится к «kot_ivan» и отбрасывается. Такая сверка не зависит от порядка, в котором пришли ответы.'
      - text: 'Увеличить паузу перед проверкой с 300 мс до секунды'
        why: 'Запросов станет меньше, но человек, задумавшийся дольше секунды, снова получит два запроса в пути, и порядок ответов не гарантирован.'
      - text: 'Показывать под полем ответ, который пришёл последним'
        why: 'Последним как раз пришёл устаревший ответ: под полем «kot_ivan» появится галочка «свободно» для чужого значения.'
      - text: 'Блокировать поле ввода, пока не придёт ответ проверки'
        why: 'Гонки не будет, но человек не сможет печатать, пока идёт запрос, — форма станет раздражающе медленной.'
    explanation: |
      Асинхронная проверка — та же гонка ответов, что в уроке «Гонки запросов», только в форме. Пауза перед запросом
      уменьшает число запросов, отмена прежнего запроса помогает, если он ещё не вернулся, а самая надёжная защита —
      сверка значения: применять ответ, только если проверенное значение совпадает с тем, что сейчас в поле.
    links:
      - https://developer.mozilla.org/ru/docs/Learn_web_development/Extensions/Forms/Form_validation

  - id: sdd-failures-001
    topic: Надёжность и восстановление
    subtopic: Виды отказов
    level: junior
    question: |
      В трекере задач человек нажал «Сохранить». Сервер ответил кодом 422 и перечислил в ответе два поля: «срок раньше
      даты создания» и «не указан исполнитель». Что это за сбой и кто его исправит?
    options:
      - text: 'Ошибка валидации: человек исправит поля, которые назвал сервер'
        correct: true
        why: 'Сервер получил запрос, проверил данные и точно сказал, что не так. Повтор без изменений даст тот же ответ, а исправить поля может только человек — если приложение покажет ошибки рядом с ними.'
      - text: 'Временный сбой сервера: приложение повторит запрос через пару секунд'
        why: 'Временными бывают сбои 5xx, сеть и перегрузка. Код 422 — отказ по существу: данные неверны и через пару секунд верными не станут.'
      - text: 'Неизвестный исход: приложение спросит сервер, сохранилась ли задача'
        why: 'Исход неизвестен, когда ответа нет или сервер сломался: тайм-аут, обрыв, 5xx. Здесь сервер ответил по существу и прямо сказал, что задачу не сохранил.'
      - text: 'Отсутствие связи: приложение отправит задачу, когда появится сеть'
        why: 'Раз пришёл ответ с кодом, связь была. При отсутствии сети промис fetch отклоняется, и никакого кода нет.'
    explanation: |
      Коды 4xx означают, что сервер получил запрос и отказался его выполнять, потому что с запросом что-то не так.
      Ошибка валидации (обычно 400 или 422 с перечнем полей) — самый дружелюбный случай: человек может всё исправить сам,
      если увидит, какие поля неверны, и если его ввод не стёрли. Повторять такой запрос без изменений бессмысленно.
    links:
      - https://developer.mozilla.org/ru/docs/Web/HTTP/Reference/Status/422

  - id: sdd-failures-002
    topic: Надёжность и восстановление
    subtopic: Виды отказов
    level: middle
    question: |
      Видеосервис показывает плашку «Нет интернета, проверьте подключение» при любом отклонении промиса `fetch`. После
      переезда API на новый домен люди с исправной сетью видят эту плашку на каждом экране. В консоли — `TypeError`,
      `navigator.onLine` равно `true`. Какой вывод верен?
    options:
      - text: '`TypeError` бывает и при отказе по CORS, поэтому он не доказывает, что сети нет'
        correct: true
        why: 'fetch отклоняется с TypeError при любой сетевой проблеме: нет связи, не нашёлся домен, браузер заблокировал ответ по правилам CORS. После переезда на новый домен CORS — самая вероятная причина, и плашка «Нет интернета» вводит людей в заблуждение.'
      - text: 'Раз промис отклонился, сервер вернул код 5xx, и запрос нужно повторить'
        why: 'Ответ с кодом 5xx не отклоняет промис fetch: он возвращает ответ, у которого response.ok равно false. Отклонение значит, что ответа не было вовсе.'
      - text: 'Раз `navigator.onLine` равно `true`, интернет есть, и сбой на стороне сервера'
        why: 'Значение true говорит лишь о подключении к какой-то сети, например к роутеру без интернета. MDN называет это свойство ненадёжным и советует использовать его только как подсказку.'
      - text: 'Это тайм-аут: fetch отклоняется с `TypeError`, если ответ идёт слишком долго'
        why: 'У fetch нет своего тайм-аута. Его задают явно, например через AbortSignal.timeout, и тогда ошибка называется TimeoutError, а не TypeError.'
    explanation: |
      Промис `fetch` отклоняется, только если ответа нет: сеть пропала, домен не найден, соединение сброшено, браузер
      отказал по CORS. Во всех этих случаях ошибка одна — `TypeError`, поэтому по ней нельзя уверенно сказать «у вас нет
      интернета». Ответы с кодами 4xx и 5xx промис не отклоняют. `navigator.onLine` полезен как подсказка, но значение
      `true` не гарантирует доступ к серверу. Честнее писать «Не удалось связаться с сервером», а «Нет связи» — когда
      `navigator.onLine` равно `false`.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/Fetch_API/Using_Fetch#проверка_успешности_запроса
      - https://developer.mozilla.org/en-US/docs/Web/API/Navigator/onLine

  - id: sdd-failures-003
    topic: Надёжность и восстановление
    subtopic: Виды отказов
    level: middle
    question: |
      Человек бронирует место в кинотеатре: выбрал ряд 7, место 12 и нажал «Забронировать». Сервер ответил 409: место
      уже занято другим покупателем, пока человек выбирал. Как приложению поступить?
    options:
      - text: 'Перечитать схему зала, отметить место занятым и предложить выбрать другое'
        correct: true
        why: 'Конфликт значит, что данные на сервере изменились с момента чтения. Повтор того же запроса даст тот же отказ, а свежая схема зала даёт человеку путь к цели — другое место.'
      - text: 'Повторить бронь через пару секунд: конфликт часто проходит сам'
        why: 'Сам проходит временный сбой, например 503. Место занято по существу, и через пару секунд свободным не станет.'
      - text: 'Выяснить у сервера, прошла ли бронь: исход такого ответа неизвестен'
        why: 'Исход неизвестен, когда ответа нет или сервер сломался (5xx). Здесь сервер ответил по существу и прямо сообщил, что бронь не создана.'
      - text: 'Сохранить бронь на устройстве и отправить её снова при следующем входе в приложение'
        why: 'Так поступают с действием, которое не дошло из-за сети. Здесь запрос дошёл, и сервер отказал по существу: повторная отправка получит тот же 409.'
    explanation: |
      Конфликт (409 или 412) — отказ сервера потому, что данные изменились с тех пор, как клиент их прочитал. Повтор
      без изменений не поможет; помогает перечитать актуальное состояние и дать человеку решить заново. С точки зрения
      человека это исправимый сбой: цели — попасть на сеанс — он всё ещё может достичь. Как обнаруживать и решать
      конфликты правок — в уроке «Версии и конфликты».
    links:
      - https://developer.mozilla.org/ru/docs/Web/HTTP/Reference/Status/409

  - id: sdd-failures-006
    topic: Надёжность и восстановление
    subtopic: Виды отказов
    level: senior
    question: |
      Портал клиники: человек выбрал врача и время и нажал «Записаться». Через две секунды пришёл ответ
      `500 Internal Server Error`. Документация API ничего не обещает о том, что происходит с записью при ошибке
      сервера. Что известно о записи?
    options:
      - text: 'Неизвестно: сервер мог записать человека и сломаться, не успев ответить'
        correct: true
        why: 'Ошибка 500 может случиться на середине работы — после того, как запись уже сохранена. Раз API не обещает иного, для записи это неизвестный исход, как тайм-аут или 504.'
      - text: 'Записи нет: сервер сам ответил ошибкой, значит, ничего не сделал'
        why: 'Ответ с ошибкой говорит, что сервер не смог довести работу до конца, но не говорит, на каком шаге он сломался. Часть операции могла выполниться.'
      - text: 'Записи нет, и запрос можно повторить: 5xx — временный сбой'
        why: 'Для чтения повтор после 5xx уместен. Для записи без защиты от дублей повтор может создать вторую запись к врачу.'
      - text: 'Известно: раз пришёл код ответа, а не тайм-аут, сервер принял решение'
        why: 'Код ответа не всегда означает решение по существу. 500 — это сбой самого сервера, а не ответ «записал» или «отказал».'
    explanation: |
      Коды 4xx — отказ по существу: сервер решил не выполнять запрос. С 5xx на запись иначе. 502 и 504 отдаёт
      промежуточный сервер, который не дождался основного. 500 может случиться посреди работы, когда часть изменений
      уже сохранена. Поэтому для записи любой 5xx, если API не обещает иного, — неизвестный исход. Как выяснить правду
      и безопасно повторить — в уроке «Повторы без двойных списаний».
    links:
      - https://developer.mozilla.org/ru/docs/Web/HTTP/Reference/Status/500

  - id: sdd-failures-005
    topic: Надёжность и восстановление
    subtopic: Виды отказов
    level: senior
    multiple: true
    question: |
      Онлайн-школа, отправка домашнего эссе. У большинства учеников сохранение занимает полсекунды, у самых медленных
      на мобильной связи — до 8 секунд. Сервер не узнаёт повторную отправку и сохранит второе эссе как отдельную
      работу. Какие решения подходят для медленной сети?
    options:
      - text: 'Задать тайм-аут с запасом сверх 8 секунд, а не полагаться на fetch по умолчанию'
        correct: true
        why: 'У fetch нет своего тайм-аута, без него запрос может висеть минутами. Запас сверх 8 секунд нужен, чтобы не обрывать запросы самых медленных учеников, которые вот-вот завершились бы.'
      - text: 'Сразу заблокировать повторное нажатие, а индикатор показать через секунду'
        correct: true
        why: 'Двойной щелчок занимает доли секунды, поэтому кнопку блокируют в момент нажатия. Индикатор ждёт секунду, чтобы не мигать на быстрых отправках: раньше человек задержки не замечает.'
      - text: 'Оставить текст в поле, пока сервер не подтвердит сохранение'
        correct: true
        why: 'Пока подтверждения нет, текст может существовать только на устройстве. Стереть его раньше — рискнуть потерять работу при любом сбое.'
      - text: 'Поставить тайм-аут в 1 секунду: дольше ученик всё равно ждать не станет'
        why: 'Такой тайм-аут оборвёт отправку у всех, кому нужно больше секунды, — то есть у тех самых учеников на плохой связи.'
      - text: 'Через секунду ожидания показать индикатор и тогда же заблокировать кнопку'
        why: 'Индикатор через секунду уместен, а блокировка — нет: в первую секунду двойной щелчок успеет отправить эссе дважды, а сервер дубли не отсеивает.'
      - text: 'По тайм-ауту написать «Эссе не отправлено» и предложить отправить снова'
        why: 'После тайм-аута исход неизвестен: эссе могло сохраниться. Повторная отправка создаст вторую работу, а сообщение может оказаться неправдой.'
    explanation: |
      Медленная сеть — отдельный вид сбоя: запрос выглядит нормальным, только очень долгим. Поведение на ней проектируют
      по трём вопросам. Сколько ждать: тайм-аут задают явно и с запасом над временем самых медленных пользователей.
      Что показывать: по Нильсену, после секунды нужен знак работы, после десяти — прогресс и способ прервать; кнопку
      же блокируют сразу, иначе двойной щелчок проскочит. Что сохранить: ввод остаётся, пока сервер не подтвердил
      сохранение. А истёкший тайм-аут записи — неизвестный исход, а не отказ.
    links:
      - https://www.nngroup.com/articles/response-times-3-important-limits/
      - https://developer.mozilla.org/en-US/docs/Web/API/AbortSignal/timeout_static

  - id: sdd-retry-001
    topic: Надёжность и восстановление
    subtopic: Политика повторов
    level: junior
    question: |
      Онлайн-карта загружает фрагменты изображения запросами GET. Какой ответ сервера имеет смысл повторить
      автоматически, после паузы?
    options:
      - text: '503 Service Unavailable от сервера фрагментов'
        correct: true
        why: 'Сервер временно перегружен или на обслуживании. Чтение безопасно повторять, а через несколько секунд тот же запрос, скорее всего, пройдёт.'
      - text: '404 Not Found: фрагмента с такими координатами нет'
        why: 'Фрагмента нет на сервере, и через пару секунд он не появится. Повтор только добавит нагрузки.'
      - text: '403 Forbidden: у ключа API нет доступа к этому слою'
        why: 'Доступ не появится от повтора: нужен другой ключ или другие права. Это постоянный отказ.'
      - text: '400 Bad Request: в запросе неверный масштаб'
        why: 'С самим запросом что-то не так. Повтор того же запроса получит тот же ответ — нужно исправить запрос.'
    explanation: |
      Автоматический повтор имеет смысл, когда сбой временный, повтор безопасен и результат ещё нужен. Коды 502, 503 и 504
      обычно означают временную беду сервера, а GET ничего не меняет на сервере — такой запрос можно повторить
      с паузой. Коды 4xx говорят, что не так сам запрос, права или адрес: повтор без изменений ничего не даст.
    links:
      - https://developer.mozilla.org/ru/docs/Web/HTTP/Reference/Status/503

  - id: sdd-retry-002
    topic: Надёжность и восстановление
    subtopic: Политика повторов
    level: middle
    question: |
      Виджет биржевых котировок открыт у 12 000 человек, и у всех одновременно упал запрос. После перезапуска сервер
      выдерживает 3 000 запросов в секунду. Перед этой попыткой клиенты ждут случайное время от 0 до 4 секунд. Сколько
      запросов в секунду в среднем получит сервер и что было бы без разброса?
    options:
      - text: 'Около 3 000; без разброса все 12 000 пришли бы в одно мгновение'
        correct: true
        why: '12 000 запросов, равномерно растянутые на 4 секунды, дают 12 000 ÷ 4 = 3 000 в секунду — ровно по силам серверу. Без разброса все клиенты ждали бы одинаково и пришли бы пачкой.'
      - text: 'Около 6 000; средняя пауза — 2 секунды, значит, нагрузка делится на 2'
        why: 'Средняя пауза не определяет нагрузку. Запросы распределены по всему окну в 4 секунды, поэтому делить нужно на длину окна: 12 000 ÷ 4.'
      - text: 'Около 3 000; без разброса было бы столько же — задержка и так растягивает'
        why: 'Задержка без разброса одинакова у всех клиентов, упавших одновременно. Она откладывает пачку, но не растягивает её: все 12 000 придут в один момент.'
      - text: 'Около 12 000; разброс меняет моменты повторов, а не их число'
        why: 'Число повторов и правда то же, но нагрузка — это запросы за секунду. Растянутые на 4 секунды, они дают вчетверо меньше в каждую секунду.'
    explanation: |
      Экспоненциальная задержка без разброса оставляет клиентов синхронными: упали вместе — ждут одинаково — приходят
      пачкой. Случайный разброс (jitter) растягивает пачку на всё окно паузы. При полном разбросе (full jitter) пауза —
      случайное число от нуля до вычисленной задержки, и N запросов в окне длиной T дают в среднем N ÷ T запросов
      в секунду. Марк Брукер в моделировании показал, что разброс сокращает и общее число запросов, и время, за которое
      все клиенты завершают работу.
    links:
      - https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/

  - id: sdd-retry-003
    topic: Надёжность и восстановление
    subtopic: Политика повторов
    level: middle
    question: |
      Встраиваемый виджет погоды стоит на тысячах сайтов. Если свежих данных нет, он показывает прошлый прогноз
      с пометкой времени — минута ожидания людям не мешает. Своя политика виджета — повторы через 1, 2 и 4 секунды.
      API открывает заголовок `Retry-After` для чтения скриптом. Сервер ответил `429 Too Many Requests`
      с заголовком `Retry-After: 60`. Как поступить?
    options:
      - text: 'Подождать не меньше 60 секунд и добавить сверху небольшой разброс'
        correct: true
        why: 'Сервер назвал, когда приходить, и его пауза длиннее своей — она главнее. Разброс нужен потому, что тот же ответ получили тысячи виджетов, и без него все они придут через ровно 60 секунд.'
      - text: 'Повторить через 1, 2 и 4 секунды, как задано в собственной политике'
        why: 'Сервер прямо попросил минуту. Три повтора за семь секунд почти наверняка снова получат 429 и только добавят нагрузки на сервер, который и так просит притормозить.'
      - text: 'Подождать ровно 60 секунд: сервер назвал точное время, разброс лишний'
        why: 'Пауза соблюдена, но тысячи виджетов, получивших тот же ответ, придут в одну и ту же секунду — снова пачкой.'
      - text: 'Не повторять вовсе: 429 — ошибка клиента, как 400 или 422'
        why: 'В отличие от 400 и 422, запрос в порядке: клиент просто спешит. Поможет время, и сервер сам сказал, сколько ждать.'
    explanation: |
      Заголовок `Retry-After` говорит, сколько ждать до следующего запроса: по RFC 9110 его отправляют с 503 и 3xx,
      а RFC 6585 разрешает и в ответе 429. Значение — число секунд или дата. Клиент ждёт не меньше указанного,
      добавляет разброс, чтобы многие клиенты не пришли разом, и сравнивает паузу со сроком, который готов ждать
      человек. Здесь минута приемлема: виджет показывает прошлый прогноз.
    links:
      - https://developer.mozilla.org/ru/docs/Web/HTTP/Reference/Headers/Retry-After
      - https://www.rfc-editor.org/rfc/rfc9110.html#section-10.2.3

  - id: sdd-retry-004
    topic: Надёжность и восстановление
    subtopic: Политика повторов
    level: senior
    question: |
      Почтовый клиент открывает папку «Входящие». Запрос идёт так: приложение → BFF → сервис писем → хранилище. Приложение
      делает до 3 попыток, BFF на каждую из них — до 3 попыток к сервису писем, сервис писем на каждую — до 2 попыток
      к хранилищу. Хранилище лежит. Сколько запросов к нему вызовет одно открытие папки и как это исправить?
    options:
      - text: '18; оставить повторы в одном слое цепочки, а в остальных убрать'
        correct: true
        why: 'Попытки перемножаются: 3 × 3 × 2 = 18. Если повторяет только один слой, упавшее хранилище получает столько запросов, сколько попыток у этого слоя.'
      - text: '8 (3 + 3 + 2); при таком малом числе повторы на каждом слое безопасны'
        why: 'Каждая попытка верхнего слоя запускает все попытки нижнего, поэтому числа перемножаются, а не складываются.'
      - text: '18; добавить случайный разброс на каждом слое, и лишние запросы исчезнут'
        why: 'Разброс растягивает запросы во времени, но не уменьшает их число: упавшее хранилище всё равно получит 18 запросов на одно действие.'
      - text: '6 (3 × 2); повторы приложения до хранилища не доходят, их принимает BFF'
        why: 'Каждая попытка приложения — новый запрос в BFF, а он снова проходит всю цепочку со своими повторами. Попытки приложения тоже умножают нагрузку.'
    explanation: |
      Когда каждый слой цепочки повторяет сам, попытки перемножаются. В статье Builders' Library пять слоёв по три
      попытки дают рост нагрузки на базу в 243 раза (3⁵). Отсюда правило — повторять в одном месте цепочки и
      договориться с бэкендом, где именно. Разброс и лимиты нужны и там, но умножения они не отменяют.
    links:
      - https://builder.aws.com/content/3EumjoZascWd1oZiEgL8ORlv3qE/timeouts-retries-and-backoff-with-jitter

  - id: sdd-retry-005
    topic: Надёжность и восстановление
    subtopic: Политика повторов
    level: senior
    multiple: true
    question: |
      Сервис бронирования отелей. Сервер не поддерживает ключи идемпотентности и не узнаёт повторные POST. Какие
      запросы клиенту можно повторять автоматически, с паузой и лимитом?
    options:
      - text: 'GET списка отелей после ответа 503'
        correct: true
        why: 'Сбой временный, а чтение ничего не меняет на сервере. Повтор безопасен, и человек всё ещё ждёт список.'
      - text: 'GET цен на даты после ответа 429 с Retry-After: 5'
        correct: true
        why: 'Запрос в порядке, сервер просто просит подождать и сам назвал срок. Чтение безопасно повторить через 5 секунд с небольшим разбросом.'
      - text: 'POST создания брони после тайм-аута'
        why: 'Исход неизвестен: бронь могла создаться. Сервер не узнаёт повторов, поэтому автоматический повтор может забронировать номер дважды.'
      - text: 'POST создания брони после ответа 422 «дата выезда раньше заезда»'
        why: 'Сервер отказал по существу и ничего не создал. Повтор с теми же датами получит тот же отказ — исправить даты может только человек.'
      - text: 'GET карточки отеля после ответа 404'
        why: 'Отеля с таким адресом на сервере нет. Повтор не вернёт его, а только добавит запросов.'
      - text: 'GET цен на даты после того, как человек закрыл экран поиска'
        why: 'Сам запрос безопасен, но его результат больше никому не нужен. Повторы при уходе с экрана отменяют.'
    explanation: |
      Автоматический повтор оправдан, когда выполнены три условия: сбой временный, повтор безопасен и результат ещё
      нужен. Безопасно чтение; после 429 его повторяют, выждав паузу, которую назвал сервер. POST без ключа
      идемпотентности после тайм-аута повторять нельзя: исход неизвестен, и повтор может создать дубль. Ответы 4xx
      не повторяют: они говорят о проблеме, которую время не исправит.
    links:
      - https://www.rfc-editor.org/rfc/rfc9110.html#section-9.2.2

  - id: sdd-autosave-001
    topic: Надёжность и восстановление
    subtopic: Автосохранение
    level: junior
    question: |
      Приложение для заметок сохраняет текст само и показывает статус в углу экрана. В какой момент статус
      «Сохранено» будет правдой?
    options:
      - text: 'Когда сервер подтвердил ту версию заметки, что сейчас на экране'
        correct: true
        why: '«Сохранено» обещает, что можно закрыть приложение и ничего не пропадёт. Это правда, только если подтверждена именно текущая версия.'
      - text: 'Когда запрос сохранения ушёл на сервер без ошибок сети'
        why: 'Запрос ушёл, но ответа ещё нет: исход неизвестен. Честный статус в этот момент — «Сохраняем…».'
      - text: 'Когда сработал debounce и человек перестал печатать'
        why: 'Debounce лишь даёт повод начать сохранение. В этот момент текст ещё даже не отправлен.'
      - text: 'Когда пришёл успешный ответ на последний отправленный на сервер запрос'
        why: 'Пока запрос шёл, человек мог дописать текст. Тогда ответ подтверждает более старую версию, а новые правки есть только на экране.'
    explanation: |
      Статус автосохранения — обещание человеку. «Есть несохранённые изменения» и «Сохраняем…» ничего не обещают,
      а «Сохранено» обещает, что текст на экране не пропадёт. Поэтому его показывают, только когда сервер подтвердил
      ровно ту версию, которая сейчас на экране, — а не любую из недавних.
    links:
      - https://www.nngroup.com/articles/visibility-system-status/

  - id: sdd-autosave-002
    topic: Надёжность и восстановление
    subtopic: Автосохранение
    level: middle
    question: |
      Почтовый клиент автоматически сохраняет черновик письма. Каждая правка увеличивает номер ревизии, сохранение
      отправляет черновик целиком запросом PUT, и одновременно в полёте только один запрос. Ушло сохранение ревизии 8.
      Пока оно шло, человек дописал два слова — на экране ревизия 10. Пришёл ответ: «ревизия 8 сохранена». Что сделать?
    options:
      - text: 'Оставить статус «Есть несохранённые изменения» и сразу отправить ревизию 10'
        correct: true
        why: 'Подтверждена ревизия 8, а на экране 10 — значит, последние правки есть только на устройстве. Следующее сохранение отправит текущий черновик целиком.'
      - text: 'Показать «Сохранено»: ответ успешный, а остальное уйдёт по следующему таймеру'
        why: 'Это устаревшее подтверждение. Если человек закроет вкладку, поверив надписи, ревизии 9 и 10 пропадут.'
      - text: 'Показать «Конфликт»: номер ревизии в ответе не совпал с номером на экране'
        why: 'Конфликт — это когда черновик изменил кто-то другой. Здесь сервер подтвердил старую версию того же автора — обычная ситуация, а не конфликт.'
      - text: 'Отправить ревизии 9 и 10 по очереди, чтобы сервер получил каждую'
        why: 'Черновик отправляется целиком, поэтому промежуточная ревизия 9 не нужна: ревизия 10 уже содержит все правки.'
    explanation: |
      Устаревшее подтверждение — правдивый ответ «сохранено», который относится к более старой версии, чем на экране.
      Защита — номера ревизий: клиент помнит последнюю правку и последнюю подтверждённую ревизию и показывает
      «Сохранено», только когда они совпали. Если не совпали, сразу уходит сохранение текущей версии, а промежуточные
      пропускаются.
    links:
      - https://developer.mozilla.org/ru/docs/Web/HTTP/Reference/Methods/PUT

  - id: sdd-autosave-003
    topic: Надёжность и восстановление
    subtopic: Автосохранение
    level: middle
    question: |
      Конструктор опросов сохраняет текст вопроса через 800 мс после последнего нажатия клавиши (debounce). На медленной
      мобильной сети запрос сохранения идёт до 3 секунд. Иногда после перезагрузки страницы в вопросе оказывается
      более старый текст, чем человек успел набрать. В чём причина и что изменить?
    options:
      - text: 'Запросы идут параллельно, старый доходит позже; слать по одному за раз'
        correct: true
        why: 'При паузе 800 мс и запросе на 3 секунды в полёте оказываются сразу несколько сохранений. Сеть не обещает порядка, и опоздавшая старая версия затирает новую. Очередь из одного запроса убирает гонку.'
      - text: 'Пауза debounce слишком короткая; увеличить её до 5 секунд, чтобы запросы не пересекались'
        why: 'Гонок станет меньше, но они останутся: запрос на медленной сети может идти и дольше 5 секунд. А несохранённые правки будут дольше жить только на экране.'
      - text: 'Сервер отвечает медленно; добавить повторы с экспоненциальной задержкой'
        why: 'Повторы помогают при сбоях, но не наводят порядок между запросами. Лишние попытки даже добавят параллельных запросов.'
      - text: 'Debounce теряет нажатия; отправлять сохранение на каждое нажатие'
        why: 'Debounce ничего не теряет — он лишь откладывает отправку. Запрос на каждое нажатие умножит число параллельных запросов и гонок.'
    explanation: |
      Debounce отвечает на вопрос «когда начать сохранение» — это триггер. Он не решает, что делать, если предыдущее
      сохранение ещё в полёте, в каком порядке дойдут запросы и что делать при ошибке. Эти правила — протокол
      сохранения: одно сохранение за раз, черновик целиком, номер ревизии. Дополнительная защита на сервере — не
      принимать ревизию меньше уже сохранённой.
    links:
      - https://doka.guide/js/debounce/

  - id: sdd-autosave-006
    topic: Надёжность и восстановление
    subtopic: Автосохранение
    level: middle
    question: |
      Редактор статей блога сохраняет правки сам и показывает «Сохранено». Сразу после загрузки страницы он
      подписывается на `beforeunload`, чтобы предупреждать о несохранённом, и не отписывается до конца работы.
      Жалобы две: вопрос «Покинуть сайт?» появляется, даже когда всё давно сохранено, а в Firefox возврат на редактор
      кнопкой «Назад» заметно медленнее, чем на другие страницы. Что изменить?
    options:
      - text: 'Подписываться на beforeunload, только пока есть несохранённые правки'
        correct: true
        why: 'Так советуют MDN и Chrome. Вопрос появится только тогда, когда терять действительно есть что, и люди не привыкнут нажимать «Покинуть» не читая. А без обработчика Firefox снова сможет класть страницу в кэш «назад-вперёд».'
      - text: 'Оставить обработчик, но писать в нём «Всё сохранено, можно уходить»'
        why: 'Свой текст в этом окне браузер не покажет — только стандартный вопрос. И обработчик по-прежнему мешает кэшу «назад-вперёд» в Firefox.'
      - text: 'Убрать beforeunload и сохранять последние правки в обработчике unload'
        why: 'unload ещё ненадёжнее: на телефонах он часто не срабатывает, а сохранять нужно раньше — при скрытии страницы. Предупреждать о несохранённом он вообще не умеет.'
      - text: 'Оставить обработчик и отправлять в нём правки через sendBeacon'
        why: 'Ложные вопросы и медленный возврат останутся: проблема в том, что обработчик висит всегда, а не в способе отправки.'
    explanation: |
      Событие `beforeunload` — способ предупредить, а не сохранить: сохраняют раньше, по ходу работы и при скрытии
      страницы (урок курса 1 «Что переживает перезагрузку»). Подписываются на него, только пока есть несохранённые
      изменения, и отписываются, как только всё сохранено. Постоянный обработчик спрашивает и тогда, когда терять нечего,
      а Firefox, по данным MDN, не кладёт такую страницу в кэш «назад-вперёд».
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Window/beforeunload_event

  - id: sdd-autosave-005
    topic: Надёжность и восстановление
    subtopic: Автосохранение
    level: senior
    multiple: true
    question: |
      Онлайн-редактор документов при скрытии вкладки отправляет несохранённые правки через `navigator.sendBeacon()`
      и параллельно кладёт черновик в IndexedDB. Какие утверждения о такой отправке верны?
    options:
      - text: '`true` означает, что браузер поставил данные в очередь, а не что сервер их сохранил'
        correct: true
        why: 'По MDN, sendBeacon возвращает true, когда данные успешно поставлены в очередь на отправку. Дошли ли они и сохранил ли их сервер, этот ответ не говорит.'
      - text: 'Ответ сервера на этот запрос код страницы прочитать не сможет'
        correct: true
        why: 'sendBeacon не даёт доступа к ответу. Если ответ нужен, MDN советует fetch с keepalive — и то его можно прочитать, только пока страница жива.'
      - text: 'Если вернулось `true`, копию черновика в IndexedDB можно сразу удалить'
        why: 'Сохранение ещё не подтверждено. Если запрос не дойдёт или сервер откажет, удалённая копия была бы единственным спасением.'
      - text: 'Документ на 2 МБ уйдёт целиком: размер данных у sendBeacon не ограничен'
        why: 'Объём ограничен: 64 КиБ на все такие незавершённые запросы страницы вместе. Большой документ так не отправить — основная часть правок должна уйти раньше, обычным автосохранением.'
      - text: 'Надёжнее вызывать sendBeacon в unload: там страница точно закрывается'
        why: 'MDN и Chrome советуют противоположное: unload на телефонах часто не срабатывает, а visibilitychange со скрытием страницы — самый надёжный момент.'
    explanation: |
      `sendBeacon` отправляет небольшой POST-запрос, который браузер доставит в фоне, даже если страница закроется.
      Он возвращает `true`, когда данные поставлены в очередь, ответа сервера код не увидит, а объём ограничен 64 КиБ.
      Поэтому `true` от `sendBeacon` — не подтверждение сохранения: статус «Сохранено» не показывают, а копию
      на устройстве хранят, пока сервер не подтвердит версию при следующем открытии.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Navigator/sendBeacon

  - id: sdd-offline-queue-001
    topic: Надёжность и восстановление
    subtopic: Локальное хранение и офлайн-очередь
    level: junior
    question: |
      Кладовщики на складе сканируют товары телефоном; в дальних рядах связи нет. Каждая отметка — команда для
      сервера, к ней можно приложить фото повреждённой упаковки. За смену накапливается до двух тысяч отметок. Они
      должны пережить закрытие вкладки и перезапуск телефона, запись не должна подтормаживать сканирование, а позже
      команда хочет отправлять отметки в фоне из Service Worker. Где хранить очередь?
    options:
      - text: 'В IndexedDB'
        correct: true
        why: 'IndexedDB переживает закрытие вкладки, работает асинхронно и не блокирует страницу, хранит объекты и файлы, вмещает сотни мегабайт и доступна из Service Worker. Все четыре условия выполнены.'
      - text: 'В localStorage'
        why: 'Переживёт закрытие вкладки, но вмещает около 5 МБ — фото быстро его переполнят. К тому же он синхронный, то есть тормозит страницу при записи, и недоступен из Service Worker.'
      - text: 'В sessionStorage'
        why: 'Это хранилище своё у каждой вкладки и очищается, когда вкладку закрывают. Отметки пропадут, если кладовщик закроет вкладку.'
      - text: 'В Cache Storage'
        why: 'Cache Storage хранит пары «запрос — ответ»: файлы приложения и ответы сервера. Команда, которую ещё только предстоит отправить, — не HTTP-ответ.'
    explanation: |
      Хранилища браузера сделаны для разных задач. `localStorage` и `sessionStorage` — маленькие синхронные хранилища
      строк, причём второе живёт только пока открыта вкладка. Cache Storage — для файлов и ответов сервера, им обычно
      пользуется Service Worker. IndexedDB — встроенная база данных: асинхронная, с транзакциями, с большим объёмом,
      доступная из воркеров. Для очереди команд, которая должна пережить перезапуск и содержит файлы, подходит она.
    links:
      - https://web.dev/articles/storage-for-the-web

  - id: sdd-offline-queue-002
    topic: Надёжность и восстановление
    subtopic: Локальное хранение и офлайн-очередь
    level: middle
    question: |
      Социологи заполняют анкеты на телефоне в сёлах со слабой связью. Сейчас при нажатии «Готово» приложение
      отправляет анкету на сервер. Если запрос завершился ошибкой, анкета записывается в IndexedDB, и на экране
      появляется «Сохранено, отправится позже». Иногда без сети запрос висит минуту и дольше, а телефон в это время
      выгружает браузер, когда социолог переключается на камеру. Часть анкет пропадает. Что изменить?
    options:
      - text: 'Записывать анкету в IndexedDB до отправки и показывать «Сохранено» после окончания записи'
        correct: true
        why: 'Анкета оказывается на устройстве до того, как начался запрос. Выгрузка браузера во время запроса ей уже не страшна: после перезапуска приложение прочитает её из IndexedDB и отправит.'
      - text: 'При ошибке запроса записывать анкету в localStorage, ведь синхронная запись завершится сразу'
        why: 'Скорость записи тут ни при чём: анкета по-прежнему записывается только после ошибки. Пока запрос висит, она живёт в памяти и пропадает при выгрузке.'
      - text: 'Держать анкеты в памяти до появления сети и отправлять их по событию online'
        why: 'Память вкладки не переживает выгрузку браузера, так что теряться будет ещё больше анкет. К тому же событие online ненадёжно: локальная сеть без интернета тоже считается «онлайном».'
      - text: 'Повторять отправку анкеты каждые пять секунд, пока сервер не ответит успехом'
        why: 'Повторы не помогают, если анкета существует только в памяти: после выгрузки браузера повторять уже нечего.'
    explanation: |
      Правило очереди — сначала записать, потом отправить (persist before send). Пока команда есть только в памяти,
      её может уничтожить выгрузка вкладки, а без сети запрос может висеть долго. Поэтому команду сначала записывают
      в надёжное хранилище, ждут окончания записи и только потом говорят человеку «сохранено» и пробуют отправить.
      Удачная отправка удаляет запись, неудачная оставляет её в очереди.
    links:
      - https://web.dev/articles/storage-for-the-web

  - id: sdd-offline-queue-006
    topic: Надёжность и восстановление
    subtopic: Локальное хранение и офлайн-очередь
    level: middle
    question: |
      Инспекторы пожарной безопасности оформляют акты осмотра в приложении, которое работает без сети. Акты лежат
      в очереди в IndexedDB, у каждого постоянный ключ идемпотентности. Перед запросом приложение меняет статус записи
      с `pending` на `sending`, после ответа сервера удаляет её. При запуске оно отправляет записи в статусе `pending`.
      Инспекторы жалуются: часть актов неделями висит со значком «отправляется» и до сервера не доходит. Обычно это
      случается, когда телефон выгрузил браузер во время отправки. Что изменить?
    options:
      - text: 'Убрать статус `sending`: запись ждёт ответа сервера в `pending` и после запуска уходит с тем же ключом'
        correct: true
        why: 'Статус «в пути» после выгрузки браузера остаётся в хранилище навсегда, хотя запроса уже нет. Без него каждая неподтверждённая запись уходит снова, а постоянный ключ не даёт серверу выполнить её дважды.'
      - text: 'При запуске удалять записи в статусе `sending`: раз отправка началась, сервер их уже наверняка получил'
        why: 'Запрос мог оборваться до сервера: телефон выгрузил браузер на полпути. Тогда акт пропадёт, а инспектор будет уверен, что он отправлен.'
      - text: 'При запуске отправлять записи `sending` с новым ключом, чтобы сервер не принял их за повтор'
        why: 'Если первая попытка дошла, новый ключ превратит повтор в новую операцию, и акт появится на сервере дважды. Ключ нужен именно для того, чтобы сервер узнал повтор.'
      - text: 'Считать записи в статусе `sending` отправленными и показывать у акта галочку'
        why: 'Это обещание без подтверждения: часть таких актов до сервера так и не дошла.'
    explanation: |
      В записи о команде нет статуса «отправляется». Если браузер выгрузили посреди запроса, такой статус остался бы
      в хранилище, хотя самого запроса уже нет, и команда навсегда считалась бы «в пути». Проще и надёжнее считать
      каждую команду неотправленной, пока сервер её не подтвердил, и после перезапуска слать снова. Это безопасно,
      потому что идентификатор операции постоянный: сервер узнает повтор и не выполнит команду дважды.

  - id: sdd-offline-queue-004
    topic: Надёжность и восстановление
    subtopic: Локальное хранение и офлайн-очередь
    level: senior
    multiple: true
    question: |
      Приложение для участников конференции. В залах связь пропадает на десятки минут, поэтому часть действий будет
      работать без сети: интерфейс сразу показывает результат, а команда уходит из очереди, когда появится связь.
      Какие действия стоит пускать через очередь?
    options:
      - text: 'Добавить доклад, который начнётся через час, в своё расписание'
        correct: true
        why: 'Сервер примет такую команду и через полчаса, а человек сразу видит доклад в расписании. Ни с кем соревноваться за ресурс не нужно.'
      - text: 'Поставить прошедшему докладу оценку от одного до пяти'
        correct: true
        why: 'Оценка не теряет смысла, если придёт позже, и почти наверняка будет принята. Ждать сети ради неё незачем.'
      - text: 'Проголосовать за вопрос докладчику в сессии вопросов, которая идёт сейчас'
        why: 'Сервер голос примет, но через полчаса сессия закончится, и голос уже ни на что не повлияет. Действие теряет смысл с опозданием.'
      - text: 'Записаться на мастер-класс: 20 мест, достаются в порядке поступления'
        why: 'Пока команда ждёт в очереди, места могут кончиться. Человек узнает об отказе, когда уже рассчитывал прийти.'
      - text: 'Купить картой билет на вечеринку после конференции'
        why: 'Оплата требует ответа сразу: человек должен знать, прошли ли деньги. Без сети честнее сказать «нужна связь».'
    explanation: |
      Очередь годится для команд, которые выдерживают два условия: сервер почти наверняка их примет, и они не теряют
      смысла, если придут с опозданием. Голос в идущей сессии вопросов проходит первое условие, но не второе. Запись
      на мастер-класс с ограниченными местами и оплата не проходят первое: им нужен ответ прямо сейчас. Такие действия
      без сети не принимают и честно говорят, что нужна связь, — иначе интерфейс пообещает результат, который потом
      придётся отменять.
    links:
      - https://web.dev/articles/storage-for-the-web

  - id: sdd-offline-queue-005
    topic: Надёжность и восстановление
    subtopic: Локальное хранение и офлайн-очередь
    level: senior
    question: |
      Мобильный трекер задач работает без сети и отправляет команды из очереди строго по одной. Команды разных задач
      друг от друга не зависят, а команды одной задачи должны идти по порядку. Пока инженер был в самолёте, коллега
      удалил задачу T-17. Первая же команда к ней — «перенести в колонку „Готово“» — получает ответ 404 «задача
      не найдена». За ней в очереди ещё 40 команд, из них 3 — к той же T-17. Как поступить с очередью?
    options:
      - text: 'Пометить её, придержать прочие команды T-17, остальные отправлять и показать инженеру причину'
        correct: true
        why: 'Это окончательный отказ: повтор даст тот же ответ. Зависимые команды той же задачи тоже не пройдут, а независимые можно отправлять. Человек видит, что не ушло и почему, и решает сам.'
      - text: 'Повторять команду T-17 с растущей паузой, а остальные 40 придержать, чтобы не нарушить порядок'
        why: 'Ответ 404 не временный: задача удалена, и повтор ничего не изменит. Очередь будет стоять вечно, хотя 37 команд от T-17 не зависят.'
      - text: 'Удалить отклонённую команду из очереди и отправить все остальные, включая три команды T-17'
        why: 'Инженер не узнает, что перенос не прошёл, а три зависимые команды получат такие же отказы. Молча удалять отклонённую команду нельзя.'
      - text: 'Отправить все 40 команд параллельно, чтобы застрявшая задача не задерживала остальные'
        why: 'Независимые команды действительно перестанут ждать, но порядок внутри других задач нарушится, а отказ T-17 так и останется необработанным.'
    explanation: |
      Ответы на команды из очереди делятся на успех, временный сбой и окончательный отказ. Временный сбой (нет сети,
      5xx) повторяют позже. Окончательный отказ — неустранимый конфликт: действие на устройстве противоречит тому,
      что уже случилось на сервере. Команду помечают, останавливают зависящие от неё команды той же сущности,
      продолжают независимые и показывают человеку причину с вариантами действий. Так работает порядок «по одной
      внутри сущности»: застрявший объект не держит остальные.

  - id: sdd-recovery-ux-007
    topic: Надёжность и восстановление
    subtopic: Восстановление глазами пользователя
    level: junior
    question: |
      В чате поддержки интернет-магазина сообщение появляется в ленте сразу после нажатия «Отправить», а запрос
      к серверу уходит следом. Иногда сервер сообщение не принимает. Как показать человеку, что его сообщение не ушло?
    options:
      - text: 'Пометить сообщение в ленте «Не отправлено» и дать кнопку «Повторить»'
        correct: true
        why: 'Отказ виден там же, где действие, и не исчезает сам. Текст на месте, повторить можно одним нажатием.'
      - text: 'Показать на три секунды уведомление «Сообщение не отправлено» в углу экрана'
        why: 'Уведомление легко пропустить, а сообщение в ленте при этом выглядит отправленным. Человек будет ждать ответа на то, чего поддержка не получила.'
      - text: 'Убрать сообщение из ленты и вернуть чат к состоянию до отправки'
        why: 'Человек может не заметить, что сообщение исчезло, а его текст пропал вместе с ним. Набирать придётся заново.'
      - text: 'Открыть модальное окно «Сообщение не отправлено» с кнопкой «ОК»'
        why: 'Окно перекрывает экран ради несерьёзного сбоя, а после закрытия у сообщения нет ни пометки, ни способа повторить.'
    explanation: |
      Оптимистичный показ с видимым статусом: результат появляется сразу, а рядом с ним — честное состояние этой вещи.
      Если сервер отказал, пометка стоит у самого сообщения, не пропадает сама и ведёт к действию «Повторить», а текст
      остаётся. Так делают мессенджеры: «отправляется», «доставлено», «не отправлено — нажмите, чтобы повторить».
    links:
      - https://ru.react.dev/reference/react/useOptimistic

  - id: sdd-recovery-ux-009
    topic: Надёжность и восстановление
    subtopic: Восстановление глазами пользователя
    level: middle
    multiple: true
    question: |
      Сотрудники правят статьи внутренней базы знаний. Сохранение статьи не удалось, и приложение показывает
      человеку блок с объяснением у формы. При каких ответах в этом блоке уместна кнопка «Повторить»?
    options:
      - text: '503 «сервис недоступен» после того, как автоматические повторы закончились'
        correct: true
        why: 'Сбой временный: через минуту тот же запрос, скорее всего, пройдёт. Кнопка даёт человеку решить, когда попробовать снова.'
      - text: 'Нет сети, а изменения сохранены на этом устройстве и отправятся сами'
        correct: true
        why: 'Отправка и так случится, когда появится связь, а «Повторить сейчас» пригодится, если человек знает, что сеть уже вернулась.'
      - text: '412 «версия изменилась»: пока человек редактировал, статью изменил коллега'
        why: 'Повтор с той же версией получит тот же отказ. Путь восстановления здесь другой — посмотреть версию коллеги и решить, что оставить.'
      - text: '403 «нет прав»: доступ к разделу базы знаний у человека отозвали'
        why: 'Права от повтора не вернутся. Нужно объяснение и путь к тому, кто может дать доступ, а не кнопка, которая заведомо не поможет.'
      - text: 'Сервер отказал в обновлении токена: сессия завершена'
        why: 'Без нового входа любой повтор получит тот же отказ. Путь восстановления — «Войти», с сохранением введённого.'
    explanation: |
      Для каждого вида сбоя нужен свой путь восстановления. «Повторить» уместно, когда сбой временный: сервер
      перегружен, нет сети. Конфликт версий, окончательный отказ и истёкшая сессия повтором не лечатся — тот же запрос
      вернёт ту же ошибку, поэтому путь там другой: сравнить версии, получить доступ, войти. Кнопка «Повторить», которая
      заведомо не поможет, — тоже ложное обещание.
    links:
      - https://www.nngroup.com/articles/ten-usability-heuristics/

  - id: sdd-recovery-ux-003
    topic: Надёжность и восстановление
    subtopic: Восстановление глазами пользователя
    level: middle
    question: |
      В CRM менеджеры пишут заметки к сделкам. Если сохранение не удалось, приложение молча повторяет его каждые
      30 секунд, без ограничения числа попыток, а у заметки всё это время значок «Сохранено». Менеджеры жалуются, что
      после закрытия вкладки часть заметок пропадает. Заметки на устройстве не хранятся. Что изменить в первую очередь?
    options:
      - text: 'Ограничить фоновые повторы, затем показать у заметки «Не сохранено» и кнопку «Повторить»'
        correct: true
        why: 'Человек узнаёт правду, пока вкладка открыта, и может сам повторить или скопировать текст. Сервер не получает бесконечного потока повторов.'
      - text: 'Повторять каждые 2 секунды вместо 30, чтобы заметка успевала уйти до закрытия вкладки'
        why: 'Если сервер недоступен, частые повторы не помогут, а нагрузку увеличат. И значок по-прежнему лжёт, что заметка сохранена.'
      - text: 'Показывать модальное окно «Ошибка сохранения» после каждой неудачной попытки отправки'
        why: 'Человек узнает о сбое, но окно каждые 30 секунд мешает работать, и его быстро научатся закрывать не читая. Пути восстановления в нём нет.'
      - text: 'При ошибке перезагружать заметку с сервера, чтобы показать менеджеру актуальное состояние'
        why: 'Перезагрузка затрёт несохранённый текст — ровно то, что нужно было спасти.'
    explanation: |
      Бесконечные фоновые повторы опасны: человек не знает, что работа не сохранена, повторы умирают вместе
      с вкладкой, а многие ошибки повтором не лечатся. Автоматически повторяют только временные сбои и с ограничением
      попыток. Потом состояние становится видимым рядом с вещью, а у человека появляются явные пути восстановления:
      «Повторить», «Скопировать текст».
    links:
      - https://www.nngroup.com/articles/ten-usability-heuristics/

  - id: sdd-recovery-ux-004
    topic: Надёжность и восстановление
    subtopic: Восстановление глазами пользователя
    level: senior
    question: |
      Клиника ставит в холле планшеты, на которых пациенты перед приёмом заполняют анкету о самочувствии. За планшетом
      за день сменяются десятки людей. Связь в холле нестабильна, и анкеты иногда не отправляются с первого раза.
      Требование: при сбое сети пациент не должен заполнять анкету заново. Как это сделать?
    options:
      - text: 'Держать ответы только в памяти страницы, при ошибке оставлять их в форме с «Повторить»'
        correct: true
        why: 'Ввод переживает сбой сети и повтор, а на устройстве не остаётся. Следующий пациент не увидит чужие ответы ни после перезагрузки, ни после закрытия вкладки.'
      - text: 'Сохранять анкету в localStorage по ходу ввода, чтобы восстановить её даже после перезагрузки'
        why: 'Ввод действительно не потеряется, но медицинские ответы останутся на общем планшете и достанутся следующему пациенту.'
      - text: 'Записывать анкету в IndexedDB и при следующем открытии предлагать восстановить черновик'
        why: 'Это хорошо для личного устройства, но на общем планшете «восстановить черновик» предложат уже другому человеку.'
      - text: 'При ошибке отправки очищать форму, чтобы данные пациента нигде не задерживались'
        why: 'Безопасно, но нарушает требование: пациент заполняет анкету заново после каждого сбоя.'
    explanation: |
      Не терять ввод — цель, но не любой ценой. Хранилище браузера видит каждый, кто садится за это устройство, поэтому
      на общих компьютерах и для чувствительных данных копию на устройстве не делают. Компромисс — держать ввод в памяти
      страницы: он переживёт сбой сети и повтор, но исчезнет вместе с вкладкой. На личном телефоне врача решение было бы
      другим — там черновик в IndexedDB уместен.
    links:
      - https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html#local-storage

  - id: sdd-recovery-ux-006
    topic: Надёжность и восстановление
    subtopic: Восстановление глазами пользователя
    level: senior
    question: |
      На складе общий планшет на смену: кладовщики входят под своими учётками, а отметки о приёмке товара уходят через
      очередь команд в IndexedDB, привязанную к пользователю. Кладовщик заканчивает смену и нажимает «Выйти». В очереди
      три его неотправленные отметки, связи в этой части склада сейчас нет. Кладовщики работают вахтами: этот человек
      может не появиться неделю. Как должно повести себя приложение?
    options:
      - text: 'Предупредить, что 3 отметки не ушли, и предложить «Остаться» или «Выйти без них»'
        correct: true
        why: 'Человек узнаёт о неотправленном до ухода и решает сам: дойти до места со связью или уйти, понимая последствия. Ничего не пропадает молча.'
      - text: 'Выйти сразу и сохранить очередь до следующего входа этого кладовщика, а тогда отправить'
        why: 'Человек уверен, что всё отправлено, а отметки неделю лежат на планшете. Всё это время остатки на складе неверные, и никто об этом не знает.'
      - text: 'Выйти сразу, а очередь отправить, когда появится связь, уже под учёткой следующего кладовщика'
        why: 'Отметки припишутся чужому человеку. Очередь привязана к пользователю именно для того, чтобы чужие действия не уходили под его именем.'
      - text: 'Не давать выйти из аккаунта, пока очередь не опустеет и все отметки не уйдут'
        why: 'Человек заперт без выбора: смена кончилась, а следующий кладовщик не может войти. Путь восстановления должен оставлять решение человеку.'
    explanation: |
      Опасный момент для несохранённой работы — уход: закрытие вкладки, выход из аккаунта, переключение на другое
      рабочее место. Здесь вопрос задаёт само приложение и честно говорит, что будет с работой. Если сохранить сейчас
      нельзя, выбор — остаться или уйти без неё. Молча стирать нельзя, молча оставлять «до следующего раза» — тоже:
      человек должен знать, что работа не отправлена.
    links:
      - https://www.nngroup.com/articles/ten-usability-heuristics/

  - id: sdd-uploads-001
    topic: Надёжность и восстановление
    subtopic: Загрузка файлов
    level: junior
    question: |
      Автор загружает ролик на видеохостинг. Полоса прогресса дошла до 100 %, но сервер ещё перекодирует видео,
      и это займёт несколько минут. Что показать автору в этот момент?
    options:
      - text: 'Статус «Обрабатывается», пока сервер не сообщит, что ролик готов'
        correct: true
        why: 'Байты отправлены, но ролик ещё не опубликован. Отдельное состояние честно говорит, что работа идёт на сервере, и «готово» наступает только по его ответу.'
      - text: 'Надпись «Ролик загружен» и ссылку на страницу ролика сразу после 100 %'
        why: 'Событие прогресса говорит только о том, что браузер отправил байты. По ссылке автор увидит ролик, которого ещё нет, или ошибку обработки.'
      - text: 'Полосу прогресса, застывшую на 99 %, пока не придёт ответ сервера'
        why: 'Застывшая полоса выглядит как зависание. Автор не понимает, идёт ли работа, и может начать загрузку заново.'
      - text: 'Локальную копию ролика в списке опубликованных, как будто он уже готов'
        why: 'Если сервер отклонит ролик или перекодирование упадёт, автор будет думать, что ролик опубликован, а зрители его не увидят.'
    explanation: |
      У загрузки несколько состояний: в очереди, отправляется, обрабатывается, готово, ошибка, отменено. 100 % на полосе
      означает конец отправки, а не готовность файла: событие progress сообщает, сколько байт ушло в сеть, а не что
      сервер принял и сохранил. Для долгой обработки на сервере нужно отдельное состояние «обрабатывается», которое
      сменится на «готово» или «ошибка» только по ответу сервера.
    links:
      - https://learn.javascript.ru/resume-upload

  - id: sdd-uploads-002
    topic: Надёжность и восстановление
    subtopic: Загрузка файлов
    level: junior
    question: |
      Ученики онлайн-школы сдают домашние задания файлами PDF до 20 МБ. Поле выбора файла принимает только PDF,
      и перед отправкой клиент проверяет `file.type` и `file.size`. Ученик переименовал архив в `homework.pdf`.
      Что произойдёт и как к этому готовиться?
    options:
      - text: 'Клиент пропустит файл: тип он берёт из расширения. Сервер должен сам проверять содержимое'
        correct: true
        why: 'Браузер не читает содержимое файла, а определяет тип по имени. Клиентская проверка ловит честные ошибки, а окончательное решение принимает сервер.'
      - text: 'Клиент отклонит файл: браузер читает начало файла и видит, что это архив'
        why: 'Браузер так не делает: `file.type` для `homework.pdf` будет `application/pdf`, каким бы ни было содержимое.'
      - text: 'Клиент пропустит файл, но сервер может не проверять: запросы приходят только из интерфейса'
        why: 'Запрос можно отправить и в обход интерфейса, без всяких проверок. Сервер, который полагается на клиента, примет что угодно.'
      - text: 'Клиент отклонит файл: атрибут accept не даст выбрать файл с другим содержимым'
        why: 'Атрибут accept только сужает список в окне выбора по типу из имени. Переименованный файл он пропустит.'
    explanation: |
      Проверка на клиенте нужна, чтобы человек не ждал загрузки файла, который заведомо не подойдёт: слишком большого
      или с явно неверным расширением. Но браузер определяет тип по расширению имени и не читает байты файла,
      а запрос можно отправить в обход интерфейса. Поэтому сервер проверяет содержимое, размер и права сам —
      клиент подсказывает, сервер решает.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/File_API/Using_files_from_web_applications

  - id: sdd-uploads-003
    topic: Надёжность и восстановление
    subtopic: Загрузка файлов
    level: middle
    question: |
      Облачное хранилище документов: пользователи загружают файлы до 2 ГБ, файлы лежат в объектном хранилище,
      совместимом с S3. Серверы API в часы пик уже работают на пределе, а входящий трафик через них оплачивается
      отдельно и дорого. Как устроить загрузку?
    options:
      - text: 'API выдаёт ссылку в хранилище на 10 минут, клиент грузит файл туда и сообщает API о готовности'
        correct: true
        why: 'Байты идут прямо в хранилище, а через API проходят только два коротких запроса. Сервер по-прежнему проверяет права, когда выдаёт ссылку, а настоящий размер и тип объекта — когда клиент подтверждает загрузку.'
      - text: 'Клиент режет файл на части по 10 МБ и отправляет их на API, а сервер API собирает файл и кладёт в хранилище'
        why: 'Части спасают от обрыва, но все 2 ГБ всё равно проходят через серверы API — те самые перегруженные и с дорогим трафиком.'
      - text: 'API выдаёт ссылку на хранилище сроком на неделю, чтобы клиент мог загружать в неё файлы без лишних запросов'
        why: 'Подписанная ссылка работает как ключ на предъявителя и годится несколько раз до конца срока. Неделя — это неделя, когда кто угодно со ссылкой может класть файлы.'
      - text: 'Поднять лимит размера тела запроса на серверах API до 2 ГБ и отправлять файл одним запросом через API'
        why: 'Так весь трафик идёт через перегруженные серверы, они держат соединение на всё время загрузки, а обрыв означает начать заново.'
    explanation: |
      Загрузка по подписанной ссылке (presigned URL) идёт в три шага: клиент просит у API разрешение, API проверяет права,
      выбирает ключ и выдаёт ссылку с коротким сроком; клиент отправляет файл прямо в хранилище; клиент сообщает API,
      что файл на месте, и сервер проверяет настоящий размер и тип объекта. Размер, который клиент назвал на первом
      шаге, — только его слова: ссылка на PUT не ограничивает размер файла. Заранее его ограничивает подписанная
      форма POST с условием content-length-range, иначе — проверка после загрузки. Цена способа — настройка
      хранилища (CORS), проверка содержимого уже после загрузки и очистка брошенных файлов. Для файлов в гигабайты
      к этому добавляют загрузку частями, у каждой части своя ссылка.
    links:
      - https://docs.aws.amazon.com/AmazonS3/latest/userguide/using-presigned-url.html

  - id: sdd-uploads-004
    topic: Надёжность и восстановление
    subtopic: Загрузка файлов
    level: middle
    question: |
      В системе документооборота бухгалтер выбирает 60 сканов по 10 МБ. Канал отдаёт около 2,5 МБ/с, и его делят все
      одновременные загрузки поровну. Бухгалтер начинает проверять сканы, как только загрузится первый. Через сколько
      секунд будет готов первый скан, если отправлять все 60 сразу и если отправлять по три за раз?
    options:
      - text: 'Все сразу — примерно через 240 секунд, по три — примерно через 12 секунд'
        correct: true
        why: 'При 60 загрузках каждой достаётся 2,5 / 60 МБ/с, и 10 МБ идут 240 секунд. При трёх — по 2,5 / 3 МБ/с, и скан готов за 12 секунд.'
      - text: 'Все сразу — примерно через 4 секунды, по три — примерно через 12 секунд'
        why: '4 секунды — это время одного скана, если бы он занимал весь канал. Но канал делится между всеми 60 загрузками.'
      - text: 'Все сразу — примерно через 240 секунд, по три — тоже примерно через 240 секунд'
        why: 'Через 240 секунд в обоих случаях закончится вся пачка: 600 МБ при 2,5 МБ/с. Но с очередью первые сканы готовы намного раньше.'
      - text: 'Все сразу — примерно через 12 секунд, по три — примерно через 240 секунд'
        why: 'Здесь числа перепутаны местами. Чем больше одновременных загрузок, тем медленнее идёт каждая из них.'
    explanation: |
      Канал один, поэтому вся пачка уходит за одно и то же время при любой параллельности: 600 МБ / 2,5 МБ/с = 240 секунд.
      Меняется другое — когда появляются первые готовые файлы. Если отправлять всё сразу, файлы делят канал и заканчиваются
      почти одновременно, в самом конце. Очередь с ограничением параллельности (concurrency limit) отдаёт первые файлы
      через секунды, а при обрыве под удар попадают несколько загрузок, а не все.

  - id: sdd-uploads-005
    topic: Надёжность и восстановление
    subtopic: Загрузка файлов
    level: senior
    multiple: true
    question: |
      Мобильное веб-приложение фотографа отправляет архив на 3 ГБ в облако частями по 16 МБ с возобновлением. На 70 %
      связь пропала, а когда вернулась, вкладку браузер уже выгрузил, и фотограф открыл приложение заново. Что нужно
      клиенту, чтобы продолжить загрузку, а не начать её с начала?
    options:
      - text: 'Номер загрузки, сохранённый в хранилище браузера, и способ узнать тот же файл после повторного выбора'
        correct: true
        why: 'После перезагрузки браузер забыл выбранный файл. Номер загрузки связывает новый выбор с начатой загрузкой, а отпечаток (имя, размер, дата изменения) подтверждает, что файл тот же.'
      - text: 'Список частей или смещение, которые сервер сообщит в ответ на запрос о состоянии загрузки'
        correct: true
        why: 'Что сохранено, знает только сервер: последний кусок мог уйти в сеть и не дойти. Продолжать можно только с того места, которое назвал он.'
      - text: 'Число отправленных байт, сохранённое на устройстве по последнему событию progress'
        why: 'Событие progress считает байты, ушедшие в сеть, а не принятые сервером. Продолжение по этому числу может пропустить кусок, и файл получится битым.'
      - text: 'Новая загрузка с тем же именем файла, чтобы сервер дописал её к прежней'
        why: 'Новая загрузка получит новый номер и начнётся с нуля, а незавершённая прежняя останется лежать в хранилище и стоить денег.'
      - text: 'Повторная отправка всех частей, но с ключом идемпотентности, чтобы сервер пропустил дубли'
        why: 'Дублей не будет, но гигабайты снова пойдут по мобильной сети. Возобновление нужно как раз затем, чтобы не отправлять сохранённое второй раз.'
    explanation: |
      Возобновляемая загрузка (resumable upload) держится на двух вещах. Первая — номер загрузки, который клиент
      сохраняет в localStorage или IndexedDB, чтобы пережить перезагрузку, и отпечаток файла, по которому он узнаёт
      тот же файл при повторном выборе. Вторая — вопрос серверу «что у тебя уже есть»: в протоколе tus это запрос
      HEAD и заголовок Upload-Offset, в S3 — список частей. Клиент досылает только недостающее; о сохранённом знает
      только сервер.
    links:
      - https://tus.io/protocols/resumable-upload
      - https://learn.javascript.ru/resume-upload

  - id: sdd-session-001
    topic: Надёжность и восстановление
    subtopic: Сессия и обновление токена
    level: junior
    question: |
      В трекере задач администратор убрал сотрудника из проекта «Бюджет». Сотрудник, не перезагружая страницу,
      открывает доску этого проекта, и API отвечает `403`. Токен доступа при этом действителен ещё восемь минут.
      Как должен отреагировать клиент?
    options:
      - text: 'Показать на месте доски «Нет доступа к проекту», не завершая сессию'
        correct: true
        why: 'Ответ 403 значит: сервер понял, кто это, но это делать нельзя. Сессия в порядке, просто прав на проект больше нет, и об этом нужно сказать прямо.'
      - text: 'Обновить токен доступа и повторить запрос к доске уже с новым токеном'
        why: 'Новый токен не даёт новых прав: права убрал администратор. Повтор снова вернёт 403, а клиент рискует уйти в цикл.'
      - text: 'Завершить сессию и перевести сотрудника на страницу входа'
        why: 'Сессия жива: сотрудник по-прежнему работает в других проектах. Выход из приложения лишит его несохранённой работы без всякой причины.'
      - text: 'Повторить запрос через несколько секунд с растущей задержкой'
        why: '403 — не временный сбой. Права не вернутся сами собой, и повторы только нагрузят сервер.'
    explanation: |
      401 и 403 — разные ответы. 401 значит, что доступ не принят: токен истёк или отозван, и его стоит попробовать
      продлить. 403 значит, что сервер знает, кто вы, но это действие вам запрещено. Новый токен здесь не поможет
      (RFC 9110 советует не повторять такой запрос автоматически с теми же данными), поэтому клиент не продлевает
      и не выходит, а показывает понятное «нет доступа» на месте недоступного раздела.
    links:
      - https://www.rfc-editor.org/rfc/rfc9110#section-15.5.4

  - id: sdd-session-002
    topic: Надёжность и восстановление
    subtopic: Сессия и обновление токена
    level: middle
    question: |
      Дашборд аналитики при открытии загружает шесть виджетов отдельными запросами. Токен доступа истёк, и все шесть
      получили `401`. Сервер авторизации при каждом обновлении выдаёт новый токен обновления, а старый отменяет;
      повторное предъявление отменённого токена он считает кражей и завершает сессию. Одно обновление занимает около
      секунды, а если одна сессия обновляет токен чаще раза в 10 секунд, сервер отвечает `429`. Виджеты должны
      появиться не позже чем через две секунды после открытия. Как обработать эти ответы?
    options:
      - text: 'Первый 401 запускает обновление, остальные запросы ждут его результата, затем каждый повторяется один раз'
        correct: true
        why: 'Уходит ровно одно обновление, отменённый токен никто не предъявляет, а все виджеты получают данные примерно через секунду.'
      - text: 'Каждый виджет сам обновляет токен по своему 401 и повторяет свой запрос с полученным токеном'
        why: 'Шесть обновлений с одним токеном обновления: первое пройдёт, остальные пять предъявят уже отменённый токен, и сервер завершит сессию.'
      - text: 'Обновлять токен по очереди для каждого виджета, каждый раз передавая последний полученный токен обновления'
        why: 'Сессия уцелеет, но второе обновление сервер отклонит с 429, а даже без этого шесть обновлений по секунде — это шесть секунд вместо двух.'
      - text: 'Перезагрузить страницу целиком: при загрузке приложение само получит новый токен'
        why: 'Перезагрузка не уложится в две секунды и ничего не решает: после неё токен всё равно нужно обновить, а шесть запросов снова уйдут разом.'
    explanation: |
      Приём называется «одно обновление в полёте» (single-flight): первый запрос с ответом 401 запускает обновление
      и сохраняет его обещание, остальные ждут того же обещания, а потом каждый повторяется ровно один раз. Это
      дедупликация, только для обновления токена. При ротации токенов обновления (refresh token rotation) она нужна
      не только ради экономии: RFC 9700 описывает, что повторное предъявление отменённого токена сервер считает
      утечкой и отзывает действующий.
    links:
      - https://www.rfc-editor.org/rfc/rfc9700#section-4.14.2

  - id: sdd-session-003
    topic: Надёжность и восстановление
    subtopic: Сессия и обновление токена
    level: middle
    question: |
      Человек пишет длинное письмо в почтовом клиенте и едет в метро. Токен доступа истёк, клиент пытается его
      обновить, но запрос обновления падает по тайм-ауту: в туннеле нет связи. Что должен сделать клиент?
    options:
      - text: 'Считать сбой временным: оставить сессию и письмо, обновить токен, когда вернётся связь'
        correct: true
        why: 'Тайм-аут ничего не говорит о сессии: сервер просто не ответил. Сессия, скорее всего, жива, а обновление пройдёт, как только появится сеть.'
      - text: 'Считать сессию завершённой: сохранить письмо как черновик и сразу показать окно входа'
        why: 'Сессию никто не завершал. Человек будет вводить пароль в туннеле, где вход тоже не пройдёт, хотя через минуту всё заработало бы само.'
      - text: 'Сразу повторять обновление в цикле, пока сервер не ответит, без пауз между попытками'
        why: 'Это верная мысль о повторе, но без паузы и лимита. Цикл сажает батарею, а при массовом сбое такие клиенты добивают сервер авторизации.'
      - text: 'Очистить токены и локальные данные: неудачное обновление может означать кражу сессии'
        why: 'Кражу сервер обнаруживает по повторному предъявлению отменённого токена, а не по тайм-ауту. Очистка уничтожит письмо без причины.'
    explanation: |
      Надо различать два исхода обновления. Отказ сервера авторизации (invalid_grant) значит, что токен обновления
      недействителен и нужен вход. Тайм-аут, отсутствие сети или 5xx — временный сбой, который ничего не говорит
      о сессии. Его повторяют с растущей задержкой и лимитом попыток, а ввод человека остаётся на месте. Если считать
      любую ошибку обновления выходом из сессии, человек будет терять сессию в каждом туннеле.
    links:
      - https://www.rfc-editor.org/rfc/rfc6749#section-5.2

  - id: sdd-session-004
    topic: Надёжность и восстановление
    subtopic: Сессия и обновление токена
    level: senior
    question: |
      В онлайн-банке клиент обновляет токен один раз на пачку запросов. Запрос выписки ушёл с токеном A. Пока он был
      в пути, другой запрос получил `401`, обновил токен, и теперь действует токен B; токены обновления меняются при
      каждом обновлении. Через секунду выписка тоже вернула `401`. Что сделать с ним?
    options:
      - text: 'Повторить запрос с токеном B без нового обновления: он ушёл со старым токеном A'
        correct: true
        why: 'Токен уже обновлён, и 401 пришёл за старый. Достаточно повтора с действующим токеном; новое обновление не нужно.'
      - text: 'Запустить новое обновление, раз этот запрос получил 401, и повторить выписку с полученным токеном'
        why: 'Токен уже свежий, и обновление здесь лишнее. Если опоздавших ответов десять, обновлений будет десять, и каждое снова меняет пару токенов под ногами у остальных запросов.'
      - text: 'Не повторять запрос: 401 после обновления значит, что сессия отозвана, и показать окно входа'
        why: 'Этот 401 получен за токен A, выданный до обновления. О новом токене B он ничего не говорит, и сессия в порядке.'
      - text: 'Повторить запрос с токеном A ещё раз: возможно, сервер ответил 401 из-за сбоя'
        why: 'Токен A уже заменён, и повтор с ним гарантированно получит 401 снова.'
    explanation: |
      Это случай опоздавшего ответа. Запрос, отправленный до обновления, возвращает 401 уже после него. Поэтому
      обработчик запоминает, с каким токеном ушёл запрос, и сравнивает его с текущим: если токен уже другой, запрос
      просто повторяют с новым, не запуская обновление. Без этой проверки опоздавшие ответы вызывают лишние
      обновления, а при ротации токенов — ещё и риск завершить сессию.
    links:
      - https://www.rfc-editor.org/rfc/rfc6749#section-6

  - id: sdd-session-005
    topic: Надёжность и восстановление
    subtopic: Сессия и обновление токена
    level: middle
    multiple: true
    question: |
      В онлайн-редакторе документов хранить черновики на устройстве разрешено. Человек правил отчёт двадцать минут,
      нажимает «Сохранить», получает `401`, и обновление токена возвращает `invalid_grant`: он сменил пароль
      на другом устройстве. Что должен сделать клиент?
    options:
      - text: 'Сохранить несохранённые правки на устройстве и не убирать их с экрана'
        correct: true
        why: 'Продлить сессию нельзя, но работа человека не должна от этого пропасть. Хранить черновики на устройстве разрешено условием.'
      - text: 'Показать «Сессия завершена, войдите снова — правки сохранены» и дать войти, не уходя со страницы'
        correct: true
        why: 'Человек понимает, что случилось и что делать, а после входа остаётся в том же документе.'
      - text: 'После входа сравнить аккаунт с прежним и отправлять правки, только если вошёл тот же человек'
        correct: true
        why: 'Если вошёл другой человек, сохранить чужие правки от его имени нельзя. Черновик показывают и спрашивают, что с ним делать.'
      - text: 'Повторить обновление токена несколько раз с растущей задержкой, прежде чем просить вход'
        why: 'invalid_grant — окончательный отказ: токен обновления отозван. Повторы его не оживят, а человек дольше ждёт.'
      - text: 'Показать «Ошибка сети, попробуйте позже» и оставить кнопку «Сохранить» активной'
        why: 'Сеть в порядке, и «позже» ничего не изменится. Человек будет нажимать «Сохранить», не понимая, что нужно войти снова.'
    explanation: |
      Отозванная сессия — не штатное истечение токена, а конец сессии: продлить её нельзя, нужен вход. Задача
      клиента — не потерять работу и дать явный путь восстановления: сохранить ввод (если это разрешают требования
      безопасности), сказать по-человечески, что случилось, дать войти на месте, а после входа проверить, что это
      тот же аккаунт, и только тогда отправить отложенные правки. RFC 9700 прямо упоминает смену пароля как повод
      отозвать токены обновления.
    links:
      - https://www.rfc-editor.org/rfc/rfc9700#section-4.14.2
