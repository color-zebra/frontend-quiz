lessons:
  - id: sdd-intro
    topic: Введение
    subtopic: Ненадёжная сеть
    title: Почему сеть всё усложняет
    computer: true
    audio: https://color-zebra.github.io/frontend-quiz-audio/system-design-data/sdd-intro.mp3
    body: |
      ## Какую проблему решаем

      В первом курсе мы спроектировали сервис доставки еды: выяснили требования, разделили клиент на части, решили,
      где живёт каждое состояние и кто главный по каждым данным, описали контракт API. Почти везде молча
      предполагалось простое: клиент отправил запрос — сервер ответил.

      На компьютере разработчика так и бывает. Сервер запущен рядом, ответ приходит за пару миллисекунд, связь
      не рвётся. А настоящий покупатель открывает меню в электричке, где сеть то пропадает, то еле тянет. Нажимает
      «Оплатить» на входе в метро, и ответа нет. Курьер отмечает «доставлено» в лифте, где нет ни одной палочки
      связи.

      Для мобильного пользователя это не редкие аварии, а обычный день. Если не подумать о таких ситуациях заранее,
      человек увидит бесконечный спиннер, двойное списание денег, пропавший заказ или цену, которая давно
      изменилась. Второй курс — о том, как спроектировать клиент, который ведёт себя разумно в настоящей сети.

      ## Сервер — владелец, у клиента копии

      Начнём с действующих лиц. В уроке «Кто главный по данным» первого курса мы договорились: у каждого вида данных
      один владелец, его версия и есть истина. Для меню, цен, наличия блюд и заказов владелец — сервер.

      Всё, что человек видит на экране, — **копия**: снимок данных сервера на тот момент, когда сервер готовил ответ.
      Пока ответ шёл по сети и пока экран открыт, оригинал мог измениться: ресторан поставил блюдо в стоп-лист,
      поднял цену, курьер уже забрал заказ. Копия об этом не знает, пока клиент не спросит сервер снова.

      Из этого следуют три вещи, на которых держится весь курс:

      - **Копия всегда хоть немного устарела.** Вопрос не в том, устарела ли она, а в том, насколько ей можно
        доверять и когда её перепроверить.
      - **Изменить данные клиент сам не может.** Он просит владельца: отправляет команду, как в уроке «Чтение,
        запись и реакция интерфейса». Между просьбой и ответом стоит сеть, и с просьбой по дороге может случиться
        что угодно.
      - **Последнее слово — за сервером.** Если на экране цена 450 ₽, а на сервере уже 490 ₽, верна вторая.

      Клиент в браузере и сервер вместе образуют **распределённую систему** (distributed system) — несколько программ
      на разных компьютерах, которые работают сообща и обмениваются данными по сети. Даже если сервер один, это уже
      распределённая система. Поэтому к фронтенду относится всё, что инженеры за полвека узнали о трудностях таких
      систем.

      ## Восемь заблуждений о распределённых вычислениях

      В 1994 году Питер Дойч (L Peter Deutsch), инженер Sun Microsystems, записал семь допущений, которые
      разработчики распределённых систем делают молча и которые со временем оказываются ложными. Первые четыре
      до него сформулировали его коллеги по Sun, среди них Билл Джой. В 1997 году Джеймс Гослинг, автор Java,
      добавил восьмое. Список
      известен как **восемь заблуждений о распределённых вычислениях** (fallacies of distributed computing);
      по-русски он есть, например, [в Википедии](https://ru.wikipedia.org/wiki/%D0%97%D0%B0%D0%B1%D0%BB%D1%83%D0%B6%D0%B4%D0%B5%D0%BD%D0%B8%D1%8F_%D0%BE_%D1%80%D0%B0%D1%81%D0%BF%D1%80%D0%B5%D0%B4%D0%B5%D0%BB%D1%91%D0%BD%D0%BD%D1%8B%D1%85_%D0%B2%D1%8B%D1%87%D0%B8%D1%81%D0%BB%D0%B5%D0%BD%D0%B8%D1%8F%D1%85).

      Вслух никто так не скажет: каждое звучит как очевидная глупость. Но код, написанный и проверенный
      на локальной машине, опирается на них незаметно для автора. Вот как каждое выглядит во фронтенде.

      | Заблуждение | Как оно проявляется в клиенте |
      |---|---|
      | Сеть надёжна | Код ждёт ответа на каждый запрос и не знает, что делать, если ответ не пришёл |
      | Задержка равна нулю | Десять запросов подряд, каждый ждёт предыдущего |
      | Пропускная способность бесконечна | Экран тянет мегабайты, хотя показывает несколько строк |
      | Сеть безопасна | Данные идут без шифрования, а сервер верит цене, которую прислал клиент |
      | Топология не меняется | Приложение не замечает, что телефон перешёл с Wi-Fi на мобильную сеть |
      | Администратор один | Расчёт на то, что между браузером и сервером никто ничего не меняет и все обновляются разом |
      | Транспорт бесплатен | Опрос сервера каждую секунду, «потому что это просто» |
      | Сеть однородна | Проверка только на своём ноутбуке, в одном браузере и на одной сети |

      ### 1. Сеть надёжна

      Запрос может не дойти до сервера. Ответ может потеряться на обратном пути. Соединение может оборваться
      посреди загрузки. Арнон Ротем-Гал-Оз, который подробно разобрал все восемь заблуждений, перечисляет, к чему
      надо готовиться: повторять отправку, подтверждать важные сообщения, распознавать дубликаты, не зависеть
      от порядка доставки. Почти каждый пункт этого списка — отдельный урок нашего курса.

      Самое коварное здесь — молчание. Если ответа нет, клиент не знает, дошёл ли запрос до сервера. Об этом —
      ниже, в разделе о трёх исходах запроса.

      ### 2. Задержка равна нулю

      **Задержка** (latency) — время, за которое данные доходят от одной точки до другой. Обычно говорят о полном
      круге: запрос дошёл до сервера, ответ вернулся. На своём компьютере это единицы миллисекунд, на мобильной
      сети — десятки и сотни, в плохом месте — секунды.

      Задержку нельзя убрать: её ограничивает даже скорость света. Ротем-Гал-Оз приводит расчёт Инго Раммера: сигнал
      от Европы до США и обратно идёт не меньше 30 миллисекунд, даже если сервер отвечает мгновенно. Вывод из
      статьи прямой: делать как можно меньше обращений по сети. Пять запросов, каждый из которых ждёт предыдущего,
      по 300 мс — это полторы секунды чистого ожидания. Как этого избежать — в уроке «Когда и что загружать».

      ### 3. Пропускная способность бесконечна

      **Пропускная способность** (bandwidth) — сколько данных сеть передаёт за секунду. Задержку платят за каждый
      круг, сколько бы ни весил ответ, а время передачи растёт с размером ответа. Поэтому для маленьких ответов почти
      всё время уходит на задержку: 10 КБ на сети 250 КБ в секунду передаются за 0,04 секунды, а круг запроса
      на мобильной сети занимает 0,2–0,3 секунды. Для больших ответов, наоборот, решает пропускная способность.

      Меню с 40 фотографиями по 300 КБ — это 12 МБ. На сети 2 мегабита в секунду (около 250 КБ в секунду) они будут
      грузиться 48 секунд. Интересно, что два заблуждения тянут в разные стороны: из-за задержки хочется делать
      мало больших запросов, а из-за пропускной способности — передавать поменьше данных. Хорошее решение ищет
      баланс.

      ### 4. Сеть безопасна

      Запрос идёт через чужие сети: открытый Wi-Fi в кафе, оборудование провайдера. По дороге его можно
      подсмотреть и подменить, поэтому всё общение с сервером идёт только по HTTPS. Есть и вторая сторона: код
      клиента работает на устройстве человека, и тот может изменить его в своём браузере и отправить что угодно.
      Поэтому цену, скидку и право на действие проверяет сервер — в уроке «Контракт API глазами фронтенда» это было
      в списке гарантий, которые обязан дать сервер. Подробно о безопасности — в курсе «Доставка и качество», в теме
      «Сквозные требования».

      ### 5. Топология не меняется

      **Топология сети** — то, из каких узлов она состоит и как они соединены. Для сервера она меняется, когда
      добавляют машины или выкатывают новую версию. Для клиента — постоянно: телефон переходит с домашнего Wi-Fi
      на мобильную сеть, теряет её в тоннеле, подключается к вокзальному Wi-Fi со страницей входа. Каждый переход
      может оборвать запросы, которые были в пути.

      ### 6. Администратор один

      Между браузером и вашим сервером — много хозяев: мобильный оператор, корпоративный прокси, сеть доставки
      контента (CDN), платёжный сервис, API соседней команды. Каждый меняет свои настройки, не спрашивая вас:
      прокси обрывает долгие соединения, партнёр выпускает новую версию API. Ротем-Гал-Оз делает отсюда вывод
      о совместимости: части системы обновляются в разное время, поэтому публичный контракт меняют так, чтобы
      старые участники продолжали работать.

      Во фронтенде это видно особенно ясно. Вкладка, открытая вчера, работает со вчерашним кодом и говорит
      с сервером, который выкатили сегодня. Никакой «единый администратор» не перезагрузит её за человека.

      ### 7. Транспорт бесплатен

      У этого заблуждения два смысла. Первый — превратить данные в байты и обратно тоже стоит времени и ресурсов.
      Второй — сеть стоит денег. Мобильный трафик и заряд батареи оплачивает пользователь. Серверы, которые
      принимают запросы, оплачивает компания.

      Простой расчёт: 100 000 открытых вкладок опрашивают сервер раз в 5 секунд — это 20 000 запросов в секунду,
      даже когда ничего не меняется. Как выбрать частоту обновления — в уроке «Когда данные устаревают».

      ### 8. Сеть однородна

      У Ротем-Гал-Оза это заблуждение о разных платформах: в сети соседствуют разные операционные системы,
      устройства и протоколы, и договориться они могут только через общепринятые стандарты. Для фронтенда
      из этого следуют две вещи. Первая — опираться на стандартные форматы и возможности браузера, а не на
      особенности одного из них. Вторая — у пользователей разные сети, телефоны и браузеры: решение, проверенное
      только на быстром ноутбуке в одном браузере, может развалиться на дешёвом телефоне в метро.

      ## Как увидеть настоящую сеть у себя

      Хорошая новость: плохую сеть можно включить на своём компьютере. В инструментах разработчика браузера
      на панели «Сеть» есть [ограничение скорости и режим без сети](https://developer.chrome.com/docs/devtools/network/reference?hl=ru#throttling).
      Включите медленное соединение и пройдите свой сценарий: где появился бесконечный спиннер, где кнопка нажалась
      дважды, где экран пустой? Отключите сеть посреди отправки формы и посмотрите, что увидит человек.

      ## Три исхода запроса

      У запроса бывает не два исхода, а три: успех, отказ и **неизвестный исход**. Отказ — это когда сервер ответил,
      что не выполнил запрос, и назвал причину (неверные данные, нет прав, блюдо закончилось), или запрос точно
      не ушёл, потому что телефон был без сети. Неизвестный исход — когда клиент не знает, выполнил ли сервер запрос. Так
      бывает, если ответа нет совсем: истекло время ожидания, связь оборвалась после отправки. Но и ответ с ошибкой не всегда значит «ничего не изменилось». Если на запрос записи сервер ответил
      внутренней ошибкой (500) или промежуточный сервер сообщил, что не дождался основного (502, 504), операция
      могла успеть выполниться.

      Для чтения это безобидно: спросим меню ещё раз, сервер от этого не изменится. Для оплаты опасно: слепой
      повтор может списать деньги второй раз, а вывод «не прошло» заставит человека заплатить снова. Полностью этот
      разговор — в уроке «Повторы без двойных списаний». И ещё одно: если клиент перестал ждать ответа, это
      не отменяет действие на сервере — почему, разбирает урок «Гонки запросов».

      ## Пример целиком: один заказ в настоящей сети

      Пройдём по вечеру одного покупателя — Ани — и посмотрим, где вмешивается сеть и что не учли.

      1. **19:02, электричка, Аня открывает ресторан.** Шапка, меню, отзывы и похожие рестораны грузятся друг
         за другом, экран пустой полторы секунды. Не учли: задержка не равна нулю. Разбираем в уроке «Когда и что
         загружать».
      2. **19:03, листает меню.** Сорок фотографий в полном размере съедают трафик. Не учли: пропускная способность
         не бесконечна. Урок «Когда и что загружать».
      3. **19:05, возвращается к списку ресторанов.** Список снова грузится с нуля, хотя был открыт минуту назад.
         Не учли: ответ можно было переиспользовать. Урок «Как устроен клиентский кэш».
      4. **19:08, ресторан ставит «Маргариту» в стоп-лист.** У Ани на экране пицца всё ещё доступна. Не учли: копия
         устарела. Это не одно из восьми заблуждений, а прямое следствие того, что у клиента копия. Урок «Когда
         данные устаревают».
      5. **19:10, дважды быстро жмёт «+» у пиццы.** Ответы приходят в обратном порядке, в корзине не та цифра.
         Не учли: сеть не обещает порядка доставки. Урок «Гонки запросов».
      6. **19:15, жмёт «Оплатить» у входа в метро.** Ответа нет: прошла ли оплата? Не учли: сеть ненадёжна. Урок
         «Повторы без двойных списаний».
      7. **19:16, выходит из метро и пробует снова.** Не спишутся ли деньги дважды? Не учли то же самое. Урок «Когда
         и как повторять».
      8. **20:05, курьер в подвале отмечает «доставлено».** Связи нет, отметка не уходит. Не учли: сеть ненадёжна.
         Урок «Работа без сети и очередь действий».

      Ни один из этих моментов не ошибка программиста в обычном смысле: код делает ровно то, что написано. Ошибка
      в допущении, что сеть ведёт себя как на ноутбуке.

      ## Как думать о каждом виде данных

      Обращаться со всеми данными одинаково осторожно — дорого: приложение станет медленным и сложным. Обращаться
      со всеми одинаково беспечно — опасно. Поэтому для каждого вида данных задают три вопроса:

      - **Чем плохо, если копия устарела?** Что увидит человек и что он сделает на её основе.
      - **Чем плохо, если запрос потерялся?** Что пропадёт и заметит ли это кто-нибудь.
      - **Чем плохо, если запрос выполнится дважды?** Будет ли вред от повтора.

      Вот как отвечают на них для четырёх видов данных сервиса доставки.

      - **Список ресторанов**
        - Устаревшая копия: почти безвредно — свежий список покажем через минуту.
        - Потерянный запрос: покажем ошибку и кнопку «Повторить».
        - Двойной запрос: безвредно, это чтение.
      - **Наличие блюда**
        - Устаревшая копия: неприятно — человек выберет то, чего уже нет.
        - Потерянный запрос: безвредно, это чтение.
        - Двойной запрос: безвредно.
      - **Оплата заказа**
        - Устаревшая копия: сумму всё равно пересчитывает сервер при оформлении.
        - Потерянный запрос: человек не знает, оплачен ли заказ.
        - Двойной запрос: двойное списание — недопустимо.
      - **Отметка курьера «доставлено»**
        - Устаревшая копия: покупатель видит старый статус.
        - Потерянный запрос: заказ «висит» недоставленным.
        - Двойной запрос: обычно безвредно — статус тот же.

      По этим ответам и выбирают механизмы курса: где хватит простого кэша, где нужен перезапрос, где — ключ
      идемпотентности и очередь действий. Чем выше цена ошибки, тем больше сложности оправдано.

      ## Что будет в курсе

      Курс разбит на три темы, от чтения данных к их изменению и к сбоям.

      - **Получение и кэширование данных** — как получить копии быстро и не тащить лишнего:
        - «Когда и что загружать» — сразу, лениво, по требованию или в фоне; водопад запросов;
        - «Как устроен клиентский кэш» — где хранить копии и под каким именем;
        - «Когда данные устаревают» — как долго доверять копии и как её обновлять;
        - «Лишние и одинаковые запросы» — дедупликация, отмена, предзагрузка;
        - «Пагинация живых списков» — страницы списка, который меняется, пока его листают.
      - **Изменения и согласованность** — как менять данные владельца через ненадёжную сеть:
        - «Гонки запросов», «Оптимистичные обновления», «Повторы без двойных списаний»;
        - «Версии и конфликты», «Кэш после изменения», «Формы и валидация».
      - **Надёжность и восстановление** — что делать, когда что-то пошло не так:
        - «Какие бывают сбои», «Когда и как повторять», «Автосохранение»;
        - «Работа без сети и очередь действий», «Как не потерять работу пользователя»;
        - «Загрузка файлов», «Сессия и обновление токена».

      Сквозной пример тот же — сервис доставки еды. В этом курсе мы разберём меню и список ресторанов (загрузка,
      кэш, пагинация), корзину (оптимистичные изменения и гонки), оформление и оплату (формы и защита от двойного
      списания), кабинет ресторана (конфликты правок меню, загрузка фото блюд, автосохранение) и приложение курьера
      (работа без сети).

      ## Типичные ошибки

      - **Проверять только на быстрой сети.** Всё работает на ноутбуке и разваливается у первого пользователя
        в метро.
      - **Считать, что нет ответа — значит, ничего не произошло.** Запрос мог выполниться, а потеряться — ответ.
      - **Доверять копии как оригиналу.** Показывать сумму из памяти браузера как окончательную и не давать серверу
        её пересчитать.
      - **Повторять любой неудачный запрос.** Повтор чтения безопасен, повтор оплаты — нет.
      - **Делать много мелких запросов подряд.** Каждый добавляет полный круг задержки.
      - **Сводить все сбои к одному сообщению «Что-то пошло не так».** Человек не понимает, повторить ли действие
        или подождать.

      ## Как спрашивают на интервью

      - «Что произойдёт, если связь пропадёт в момент нажатия "Оплатить"?» — ждут, что вы назовёте неизвестный исход
        и не предложите слепой повтор.
      - «Как ваш экран поведёт себя на медленной мобильной сети?» — ждут разговора о числе запросов, их порядке
        и объёме данных.
      - Иногда прямо: «Какие допущения о сети опасны для клиентского приложения?»

      ## Коротко

      - Сервер — владелец данных, а на экране всегда копия, которая хоть немного устарела. Изменить данные клиент
        может только просьбой к владельцу, и последнее слово за сервером.
      - Клиент и сервер вместе — распределённая система, и код, проверенный на ноутбуке, незаметно опирается на восемь
        заблуждений о ней (Питер Дойч и коллеги по Sun), от «сеть надёжна» и «задержка равна нулю» до «сеть
        однородна». Ошибка обычно не в коде, а в допущении, что сеть ведёт себя как на ноутбуке.
      - Из-за задержки хочется делать мало больших запросов, а из-за пропускной способности — передавать поменьше
        данных. Эти требования тянут в разные стороны, и хорошее решение ищет баланс.
      - У запроса три исхода: успех, отказ и неизвестный исход. Нет ответа — не значит «ничего не произошло», и ответ
        500, 502 или 504 на запись тоже не доказывает, что операция не выполнилась, поэтому такую запись нельзя слепо
        повторять и нельзя писать «не прошло».
      - Для каждого вида данных задают три вопроса: чем плохо, если копия устарела, если запрос потерялся и если он
        выполнится дважды. Чем выше цена ошибки, тем больше сложности оправдано.

      ## Источники

      - [Fallacies of Distributed Computing Explained — Arnon Rotem-Gal-Oz (PDF)](https://lasr.cs.ucla.edu/classes/188_winter15/readings/fallacies.pdf)
      - [Fallacies of distributed computing, раздел History — Wikipedia](https://en.wikipedia.org/wiki/Fallacies_of_distributed_computing#History)

  - id: sdd-fetching
    topic: Получение и кэширование данных
    subtopic: Стратегия загрузки
    title: Когда и что загружать
    audio: https://color-zebra.github.io/frontend-quiz-audio/system-design-data/sdd-fetching.mp3
    body: |
      ## Какую проблему решаем

      Откроем в сервисе доставки экран ресторана. На нём четыре блока:

      - **шапка** — название, рейтинг, время доставки;
      - **меню** — 8 категорий и 80 блюд с названием, ценой и фотографией;
      - **отзывы** — ниже меню, до них доходит меньшинство;
      - **похожие рестораны** — в самом низу страницы.

      Есть два простых способа всё это загрузить, и оба плохи.

      Первый — загрузить всё одним большим запросом при открытии. Человек ждёт, пока придут отзывы и похожие
      рестораны, хотя хотел только посмотреть меню. Мегабайты трафика уходят на блоки, до которых он, скорее всего,
      не долистает.

      Второй — пусть каждый блок сам загружает свои данные, когда появится на экране. Так пишут чаще всего, потому что
      это удобно: компонент сам знает, что ему нужно. Но если блоки вложены друг в друга, запросы выстраиваются
      в очередь. Меню ждёт шапку, отзывы ждут меню, и экран собирается по кусочку полторы секунды.

      В уроке «Почему сеть всё усложняет» мы видели, откуда эти проблемы: каждый запрос стоит полного круга задержки,
      а пропускная способность мобильной сети ограничена. Этот урок — о том, как решить, **когда** начинать каждую
      загрузку и **что** в неё положить.

      ## Четыре момента загрузки

      Загрузку можно начать в один из четырёх моментов. Названия на английском стоит запомнить: по ним ищут статьи
      и о них спрашивают на собеседованиях.

      - **Сразу** (eager loading, «жадная» загрузка) — при открытии экрана, ничего не дожидаясь. Так грузят то, без
        чего экран бесполезен: шапку и меню ресторана.
        - Когда подходит: для содержимого первого экрана.
        - Что даёт: главное видно без лишнего ожидания.
        - Цена: если так грузить всё подряд, первый экран медленный, а трафик уходит на то, до чего человек
          не дойдёт.
      - **Лениво** (lazy loading, ленивая загрузка) — когда часть экрана вот-вот понадобится, но человек об этом
        явно не просил. Обычно сигнал — блок приближается к видимой области при прокрутке. Браузер умеет
        сообщать об этом сам: картинкам хватает атрибута `loading="lazy"`, для остального есть
        [Intersection Observer](https://developer.mozilla.org/ru/docs/Web/API/Intersection_Observer_API). Подробнее —
        в [статье MDN о ленивой загрузке](https://developer.mozilla.org/ru/docs/Web/Performance/Guides/Lazy_loading).
        - Когда подходит: для блоков ниже первого экрана и картинок длинных списков.
        - Что даёт: не грузим то, до чего человек не долистает.
        - Цена: короткое ожидание, когда блок появляется.
      - **По требованию** (on-demand) — только после явного действия человека: нажал «Показать все отзывы», открыл
        карточку блюда, нажал «Скачать чек».
        - Когда подходит: для подробностей, которые нужны немногим.
        - Что даёт: ни одного лишнего запроса.
        - Цена: ожидание после каждого нажатия.
      - **В фоне** (background fetching) — данные грузятся, пока человек ничего не ждёт. Либо заранее, на случай если
        понадобятся (это **предзагрузка**, prefetch), либо чтобы обновить то, что уже на экране. Предзагрузку подробно
        разбирает урок «Лишние и одинаковые запросы», фоновое обновление — урок «Когда данные устаревают».
        - Когда подходит: для того, что почти наверняка откроют следующим.
        - Что даёт: данные готовы раньше, чем понадобились.
        - Цена: трафик и нагрузка на сервер, если данные не пригодятся.

      Разница между «лениво» и «по требованию» тонкая, но важная. Ленивую загрузку запускает само приложение,
      угадывая, что блок скоро понадобится. Загрузку по требованию запускает человек, и до его действия данные не
      нужны вовсе.

      ## Водопад запросов

      **Водопад запросов** (request waterfall) — ситуация, когда запрос начинается только после того, как закончился
      другой. На панели «Сеть» в инструментах разработчика такие запросы выстраиваются лесенкой, отсюда и название.

      Водопад дорог, потому что задержки складываются. Допустим, каждый запрос на мобильной сети занимает 300 мс.
      Четыре запроса друг за другом — это 1200 мс. Те же четыре запроса, запущенные одновременно, закончатся
      примерно через 300 мс — столько, сколько идёт самый долгий из них. Документация TanStack Query считает
      так же: при задержке 250 мс цепочка из четырёх кругов стоит секунду только на ожидании сети.

      ![Сверху водопад: запросы шапки, меню, отзывов и похожих ресторанов идут друг за другом лесенкой, экран готов через 1200 мс. Снизу параллельная загрузка: те же четыре запроса начинаются одновременно, экран готов примерно через 300 мс](images/sdd-waterfall.png "Водопад запросов против параллельной загрузки")

      ### Откуда берутся водопады

      **1. Настоящая зависимость.** Второму запросу нужны данные из первого. Например, адрес страницы содержит
      короткое имя ресторана (`/r/pizza-na-uglu`), а меню API отдаёт только по числовому номеру. Приходится сначала
      узнать номер, а потом просить меню.

      **2. Вложенные компоненты.** Родитель показывает дочерний компонент только после того, как получил свои
      данные, а дочерний начинает свой запрос только когда появится. Именно этот пример разбирает статья
      Цзюньтао Цю на сайте Мартина Фаулера: профиль пользователя и список его друзей.

      ```tsx
      function RestaurantPage({ slug }) {
        const restaurant = useRestaurant(slug);   // запрос 1
        if (!restaurant) return <Spinner />;
        // Menu появится и начнёт запрос 2 только после ответа на запрос 1
        return <Menu restaurantId={restaurant.id} />;
      }
      ```

      Здесь зависимость мнимая: если API умеет отдавать меню по короткому имени, меню ничто не мешает грузить сразу.

      **3. Ленивый код.** Код экрана часто грузится отдельным куском (code splitting, разделение кода), чтобы
      не тащить всё приложение сразу. Тогда цепочка удлиняется: сначала скачивается код, потом он запускается,
      и только потом просит данные. Документация TanStack Query показывает пример, где до появления графика нужно
      пять кругов к серверу.

      ### Как убирать водопады

      - **Поднять запросы выше.** Начинать все независимые запросы в одном месте — на уровне страницы или маршрута, —
        а не в каждом вложенном компоненте. В статье на сайте Фаулера этот приём называется
        [параллельной загрузкой данных](https://martinfowler.com/articles/data-fetch-spa.html#parallel-data-fetching)
        (Parallel Data Fetching).
      - **Начинать загрузку данных вместе с загрузкой кода.** Многие маршрутизаторы умеют запускать запрос
        при переходе на адрес, не дожидаясь, пока скачается и отрисуется компонент. Приём называют загрузкой данных
        на уровне маршрута (route loaders). Так устроены, например,
        [загрузчики в React Router](https://reactrouter.com/start/data/data-loading): функция `loader` вызывается
        при переходе, ещё до отрисовки компонента маршрута. Похожий приём в React с Suspense называют
        render-as-you-fetch: запрос стартует при переходе, а экран рисуется сразу, с заглушками на месте данных.
      - **Убрать зависимость в API.** Попросить бэкенд отдавать меню по короткому имени или сделать один запрос
        под экран, как в уроке «Контракт API глазами фронтенда» первого курса. TanStack Query советует то же:
        если запросы зависят друг от друга, лучше изменить API так, чтобы получить всё одним запросом.
      - **Смириться с настоящей зависимостью, но укоротить цепочку.** Некоторые водопады неизбежны. Тогда важно,
        чтобы цепочка была одна и короткая, а не ветвилась дальше.

      Запустить независимые запросы одновременно в коде — просто:

      ```ts
      const [restaurant, menu] = await Promise.all([
        fetchRestaurant(slug),
        fetchMenu(slug),
      ]);
      ```

      Но у `Promise.all` есть свойство, о котором стоит помнить: если упадёт любой из запросов, упадёт и общий
      результат. Для шапки и меню это нормально — экран без них бесполезен. А отзывы не должны ронять меню. Для
      независимых блоков лучше дать каждому свой статус загрузки и ошибки или использовать `Promise.allSettled`,
      который дожидается всех запросов и сообщает исход каждого
      ([learn.javascript.ru, Promise API](https://learn.javascript.ru/promise-api)). Почему один упавший блок
      не должен прятать весь экран, разбиралось в уроке первого курса «Загрузка, пустота, ошибка и всё между ними».

      ## Лишние данные и недостающие данные

      Водопад — проблема того, **когда** грузить. Вторая проблема — **что** лежит в одном ответе.

      **Избыточная загрузка** (overfetching) — ответ содержит больше, чем нужно экрану. Например, запрос меню
      возвращает у каждого из 80 блюд полный состав, пищевую ценность и пять фотографий в исходном размере. Экран
      же показывает название, цену и одну маленькую картинку. Человек платит трафиком и временем за то, чего
      не видит.

      **Недостаточная загрузка** (underfetching) — обратная беда: в ответе не хватает данных, и клиент добирает их
      отдельными запросами. Если меню пришло без рейтингов блюд, а рейтинг каждого блюда просят по одному,
      получится 80 дополнительных запросов. Такой узор называют **проблемой N+1**: один запрос за списком и N
      запросов за подробностями каждого элемента.

      Обе беды решаются одним способом — **сменить границы загрузки**, то есть договориться, что приходит в каком
      ответе:

      - список отдаёт только поля карточки и уменьшенную картинку, а подробности — отдельный запрос при открытии;
      - недостающее поле, которое нужно в каждой строке, добавляют в ответ списка, а не просят по одному;
      - для экрана с особыми нуждами делают отдельный ответ под этот экран.

      Цена — больше разных ответов, которые бэкенду надо поддерживать, и второй запрос при открытии подробностей.
      Задержку этого второго запроса можно спрятать предзагрузкой — об этом урок «Лишние и одинаковые запросы».

      ## Экран, ресурс и действие

      Ещё один полезный способ разложить загрузки — по тому, чему они служат.

      - **Загрузка экрана** — данные, без которых экран не показать: шапка и меню ресторана. Начинается при переходе
        на адрес. Если она не удалась, человек видит ошибку на месте экрана.
      - **Загрузка ресурса** — данные одного блока или одной сущности: отзывы, похожие рестораны, состав блюда.
        Ресурс может понадобиться на нескольких экранах. У него свой индикатор ожидания и своя ошибка, и его
        неудача не ломает экран.
      - **Загрузка действия** — запрос в ответ на действие человека: «Добавить в корзину», «Применить промокод».
        Ожидание показывают там, где человек нажал, — на кнопке или в строке, а не на весь экран. Если запрос
        не удался, это ошибка действия, а не ошибка показа.

      Зачем их различать? У них разный момент запуска, разный индикатор и разная реакция на сбой. Частая ошибка —
      смешать их: после нажатия «Добавить в корзину» перезагрузить данные всего экрана и закрыть его спиннером.
      Человек теряет место в меню, хотя изменилась одна цифра в корзине.

      ## Пример целиком: экран ресторана

      Соберём решения для экрана ресторана. Допустим, мы знаем по аналитике: до отзывов долистывают около 30 %
      посетителей, карточку блюда с составом открывают в одном визите из пяти, на первом экране телефона видно
      6 блюд из 80.

      - **Шапка ресторана**
        - Когда грузить: сразу.
        - Почему: загрузка экрана — без неё непонятно, где человек.
      - **Меню: названия, цены, адреса картинок**
        - Когда грузить: сразу, вместе с шапкой.
        - Почему: загрузка экрана — ради меню экран и открывают.
      - **Фотографии блюд**
        - Когда грузить: лениво, по мере прокрутки.
        - Почему: ресурс — видно 6 из 80, остальные могут не понадобиться.
      - **Состав и пищевая ценность**
        - Когда грузить: по требованию, при открытии карточки.
        - Почему: ресурс — нужен одному посетителю из пяти.
      - **Отзывы**
        - Когда грузить: лениво, когда блок близко к экрану.
        - Почему: ресурс — до них доходят 30 %.
      - **Похожие рестораны**
        - Когда грузить: лениво, в самом низу.
        - Почему: ресурс — нужны ещё меньшему числу людей.
      - **«Добавить в корзину»**
        - Когда грузить: по нажатию.
        - Почему: действие — ожидание показывают только на кнопке.

      Теперь сравним время до появления меню.

      **Было.** Код страницы — 300 мс, затем шапка по короткому имени — 300 мс, затем меню по номеру ресторана —
      300 мс. Меню видно через 900 мс. Следом сами собой стартуют отзывы и похожие рестораны, ещё 600 мс — весь экран
      собран через полторы секунды, как в начале урока. И все эти блоки грузятся, даже если человек не долистает.

      **Стало.** Бэкенд научился отдавать меню по короткому имени. Маршрутизатор при переходе одновременно запускает
      загрузку кода страницы, шапки и меню. Меню видно примерно через 300–400 мс. Отзывы и похожие рестораны
      грузятся лениво, а состав блюда — только когда его открыли.

      Обратите внимание: мы не сделали ни одну загрузку быстрее. Мы перестали заставлять их ждать друг друга
      и перестали грузить то, что никто не смотрит.

      ## Как выбрать

      Для каждого блока задайте вопросы по порядку:

      1. **Без этого экран бесполезен?** Грузить сразу и одновременно с остальным главным.
      2. **Это ниже первого экрана, но многие туда доходят?** Грузить лениво.
      3. **Это нужно немногим и только после явного действия?** Грузить по требованию.
      4. **Это почти наверняка понадобится следующим, а сеть сейчас свободна?** Грузить в фоне.
      5. **Ответ несёт лишнее или клиент добирает недостающее по одному?** Менять границы загрузки.

      Крайности стоят дорого с обеих сторон. «Всё сразу» — медленный первый экран и потраченный трафик. «Всё
      лениво» — человек ждёт на каждом шаге прокрутки, а ленивые блоки внутри ленивых блоков дают тот же водопад.

      ## Типичные ошибки

      - **Каждый компонент грузит своё, когда появится.** Вложенные компоненты выстраивают запросы лесенкой.
      - **Ожидание мнимой зависимости.** Второй запрос ждёт первого, хотя нужные ему параметры уже есть в адресе.
      - **Один `Promise.all` на независимые блоки.** Упали отзывы — пропало и меню.
      - **Ленивая загрузка главного содержимого.** Меню, которое грузится лениво, только откладывает то, ради чего
        пришёл человек.
      - **Один ответ «на все случаи».** Список тянет подробности каждого элемента, которые видны только в карточке.
      - **Запросы по одному для каждой строки списка.** Проблема N+1 превращает один экран в сотню запросов.
      - **Спиннер на весь экран после действия.** Действие перезагружает экран вместо того, чтобы показать ожидание
        на кнопке.

      ## Как спрашивают на интервью

      - «Экран открывается медленно, в панели "Сеть" запросы идут лесенкой. Что будете делать?» — ждут слова
        «водопад», разделения настоящих и мнимых зависимостей и переноса запросов на уровень страницы.
      - «Что загрузить сразу, а что потом на странице товара (видео, профиля)?» — ждут разделения первого экрана,
        ленивых блоков и загрузки по требованию с обоснованием через то, сколько людей до блока доходит.
      - «Ответ API весит 3 МБ, а экран показывает список из 20 строк. Как быть?» — ждут разговора об избыточной
        загрузке и границах ответа.

      ## Коротко

      - Сразу грузят то, без чего экран бесполезен, лениво — то, что ниже первого экрана, но до чего доходят многие,
        по требованию — подробности, нужные немногим после явного действия, а в фоне — то, что почти наверняка откроют
        следующим, если сеть сейчас свободна. Ленивую загрузку запускает приложение, угадывая, а загрузку по
        требованию — человек.
      - Водопад запросов — это когда запрос стартует только после окончания другого, и задержки складываются: четыре
        запроса по 300 мс подряд — 1200 мс, а одновременно — около 300 мс.
      - Независимые запросы поднимают на уровень страницы или маршрута и начинают вместе с загрузкой кода, а не в
        каждом вложенном компоненте после родителя. Настоящую зависимость убирают, изменив API, а если это нельзя,
        держат цепочку одной и короткой.
      - `Promise.all` падает целиком, если упал любой запрос. Независимым блокам дают свой статус или используют
        `Promise.allSettled`, чтобы отзывы не роняли меню.
      - Избыточная загрузка — в ответе больше, чем показывает экран; недостаточная — данные добирают по одному, и это
        проблема N+1. Обе лечат сменой границ загрузки: список отдаёт поля карточки, подробности приходят отдельным
        запросом.
      - Загрузки экрана, ресурса и действия различаются моментом запуска, индикатором и реакцией на сбой. Ожидание
        действия показывают на кнопке, а не спиннером на весь экран.
      - Крайности дороги с обеих сторон: «всё сразу» замедляет первый экран и тратит трафик, а «всё лениво» заставляет
        ждать на каждом шаге прокрутки.

      ## Источники

      - [Data Fetching Patterns in Single-Page Applications — Juntao Qiu, martinfowler.com](https://martinfowler.com/articles/data-fetch-spa.html)
      - [Performance & Request Waterfalls — TanStack Query](https://tanstack.com/query/latest/docs/framework/react/guides/request-waterfalls)

  - id: sdd-cache
    topic: Получение и кэширование данных
    subtopic: Устройство кэша
    title: Как устроен клиентский кэш
    audio: https://color-zebra.github.io/frontend-quiz-audio/system-design-data/sdd-cache.mp3
    body: |
      ## Какую проблему решаем

      Покупатель в сервисе доставки открыл список пиццерий, зашёл в одну, посмотрел меню и нажал «Назад». Список
      снова пустой, снова спиннер, снова запрос — хотя он видел этот список десять секунд назад. Переключил фильтр
      с пиццы на суши и обратно — ещё два запроса за тем, что уже было на экране. На мобильной сети каждый такой
      круг — заметная пауза.

      Естественная мысль — запоминать ответы и показывать их повторно. Это и есть кэш. Но наивный кэш приносит
      свои беды:

      - человек сменил город, а видит рестораны прежнего города — ответ сохранили под одним именем на все города;
      - на общем компьютере один человек вышел, другой вошёл — и на миг увидел чужие заказы;
      - после выпуска новой версии приложение падает: оно читает из сохранённого кэша ответ в старом формате;
      - в шапке 12 непрочитанных сообщений, в боковой панели — 11: у двух компонентов свои копии.

      Все эти беды — от того, что на четыре вопроса не ответили заранее: кто управляет кэшем, кому он виден, сколько
      хранится запись и под каким именем лежит каждый ответ. Этот урок — про эти четыре вопроса и про пятый, самый
      коварный: насколько копии из кэша можно верить.

      ## Что такое клиентский кэш

      **Кэш** (cache) — сохранённая копия ответа, которую можно показать повторно, не спрашивая сервер. **Клиентский
      кэш данных** — такие копии в памяти приложения: список ресторанов, меню, заказы.

      В уроке «Почему сеть всё усложняет» мы договорились, что сервер — владелец данных, а у клиента копии. Кэш —
      место, где эти копии живут. В уроке «Кто главный по данным» первого курса кэш был назван отдельно от основных
      и производных данных: это не источник истины, а запомненный ответ источника.

      Кэшей в браузере несколько, и их полезно не путать:

      - **HTTP-кэш браузера** хранит ответы на запросы целиком. Управляет им сервер — заголовками `Cache-Control`
        ([MDN](https://developer.mozilla.org/ru/docs/Web/HTTP/Guides/Caching)).
      - **Кэш Service Worker** хранит файлы и ответы для работы без сети. Управляет им код Service Worker; о нём —
        в следующих курсах.
      - **Кэш данных приложения** хранит данные, которые показывают экраны. Управляет им код приложения или
        библиотека вроде TanStack Query.

      Дальше речь о третьем — кэше данных приложения. Его единица — **запись кэша** (cache entry): данные, время,
      когда их получили, и состояние (грузится, готово, ошибка). Каждая запись лежит под своим **ключом**.

      ## Кто управляет кэшем

      **Владелец кэша** — тот, кто решает, когда записать, обновить и удалить запись. Хорошо, когда он один: модуль
      работы с данными или библиотека. Компоненты не хранят копии сами, а просят: «дай данные по такому-то ключу»
      и подписываются на изменения.

      Посмотрим, что бывает без единого владельца. Шапка почтового клиента и боковая панель показывают число
      непрочитанных писем. Каждая загрузила его сама и держит в своём состоянии. Человек прочитал письмо, боковая
      панель перезапросила число, а шапка — нет. На экране 12 и 11 одновременно.

      С единым владельцем обе части спрашивают одну запись. В документации TanStack Query это показано на примере:
      если второй компонент запрашивает данные с тем же ключом, он сразу получает уже сохранённую запись, а когда
      запись обновляется, новые данные получают оба. Правило простое: **одни данные — одна запись — один ключ**.
      Два разных ключа для одних и тех же данных — это снова две копии, которые разойдутся.

      ## Кому виден кэш

      **Область действия** (scope) кэша — кто может прочитать запись.

      - **Один компонент** — данные лежат в состоянии компонента.
        - Что даёт: ничего общего, нечего путать.
        - Риск: каждый компонент делает свой запрос, и копии расходятся.
      - **Вся вкладка** — общий кэш в памяти.
        - Что даёт: любой экран переиспользует уже полученный ответ.
        - Риск: всё пропадает при перезагрузке страницы.
      - **Все вкладки и после перезагрузки** — копия в IndexedDB или localStorage.
        - Что даёт: экран открывается мгновенно, даже без сети.
        - Риск: данные переживают выход пользователя и выпуск новой версии приложения.
      - **Много пользователей** — общий кэш на прокси или в сети доставки контента (CDN).
        - Что даёт: один ответ служит тысячам людей.
        - Риск: личные данные одного человека увидит другой.

      Чем шире область, тем больше пользы и тем больше способов показать не те данные. Личные данные никогда не кладут
      в общий кэш для многих пользователей: сервер помечает такие ответы заголовком `Cache-Control: private`, чтобы
      их сохранял только браузер самого человека.

      ## Сколько хранится запись

      **Срок хранения** записи — как долго запись, которую никто не показывает, остаётся в кэше, прежде чем её
      удалят. Кэш в памяти вкладки в любом случае пропадает при перезагрузке страницы, а внутри вкладки библиотеки
      ещё и убирают ненужные записи, чтобы не копить память. В TanStack Query запись, которую не показывает
      ни один компонент, удаляется через время `gcTime` — по умолчанию 5 минут. У сохранённого на устройство кэша
      свой предел: в TanStack Query это `maxAge`, по умолчанию 24 часа, после чего старая копия молча
      отбрасывается.

      Срок хранения отвечает на вопрос «когда запись удалить». Его легко спутать с другим вопросом — «когда запись
      перепроверить». Это разные настройки, и разницу мы разберём ниже, в разделе о свежести.

      ## Ключ кэша

      **Ключ кэша** (cache key) — имя записи. Два запроса с одинаковым ключом получают одну и ту же запись. Главное
      правило: **в ключе должно быть всё, от чего зависит ответ**. Документация TanStack Query формулирует это так:
      если функция запроса использует переменную, которая меняется, эта переменная должна быть в ключе.

      Что обычно попадает в ключ — три группы.

      ### Параметры запроса

      Номер сущности, фильтры, сортировка, номер страницы, город, язык. Если город влияет на ответ, а в ключе его
      нет, список Москвы и список Казани лягут в одну запись, и человек после смены города увидит старый.

      ```ts
      // Плохо: город и кухня меняют ответ, но в ключ не попали
      useQuery({
        queryKey: ['restaurants'],
        queryFn: () => fetchRestaurants({ city, cuisine }),
      });

      // Хорошо: каждый набор фильтров — своя запись
      useQuery({
        queryKey: ['restaurants', { city, cuisine, sort }],
        queryFn: () => fetchRestaurants({ city, cuisine, sort }),
      });
      ```

      Тонкость из документации TanStack Query: порядок полей внутри объекта в ключе не важен, а порядок элементов
      массива — важен. `['restaurants', { city, cuisine }]` и `['restaurants', { cuisine, city }]` — одна запись,
      а `['restaurants', city, cuisine]` и `['restaurants', cuisine, city]` — две разные.

      ### Пользователь

      Если ответ зависит от того, кто спрашивает, — заказы, адреса, личные скидки, рекомендации, — у данных есть
      хозяин-пользователь. Тут работают две меры, и они дополняют друг друга:

      - **номер пользователя в ключе** (`['orders', userId]`) не даёт показать одному человеку записи другого, если
        они сменились в одной вкладке без перезагрузки;
      - **очистка кэша при выходе** удаляет данные прежнего человека совсем. У TanStack Query для этого есть метод
        `queryClient.clear()`. Если кэш сохраняется на устройство, убедитесь, что при выходе стирается и эта копия.

      Номер в ключе без очистки оставляет чужие данные в памяти вкладки, а в сохранённом кэше — на диске. Если
      компьютер общий или данные чувствительные, очищать при выходе нужно обязательно.

      ### Версия данных

      Новая версия приложения может ждать данные в новом формате: например, время доставки было числом минут,
      а стало объектом с границами «от» и «до». Кэш в памяти исчезнет при перезагрузке, а вот сохранённый
      на устройство переживёт выпуск, и новый код прочитает старый формат.

      Поэтому в ключ или в сохранённый кэш добавляют **версию**: версию API, номер формата или номер сборки
      приложения. У TanStack Query для сохранённого кэша есть параметр `buster`: если строка в сохранённой копии
      не совпадает с текущей, копия отбрасывается целиком.

      ### Чего в ключе быть не должно

      Ключ может быть не только слишком бедным, но и слишком богатым. Если положить в него текущее время, случайное
      число или объект с полями, которые на ответ не влияют, кэш перестанет находить записи. Каждый запрос будет
      новым, а одинаковые данные лягут в память много раз.

      ## Свежесть — не то же, что согласованность

      Это самое коварное место урока.

      **Свежесть** (freshness) — решение кэша: «этой копии можно верить без нового запроса». Запись, которой кэш
      пока верит, называют **свежей**, а ту, которую пора перепроверить, — **устаревшей** (stale). Сколько времени
      после получения запись остаётся свежей, задаёт **срок свежести**; в TanStack Query это `staleTime`. Пока
      запись свежая, библиотека не идёт за ней в сеть ни по одному автоматическому поводу — ни когда экран открыли
      снова, ни когда человек вернулся на вкладку (если не включён опрос по таймеру — о нём в уроке «Когда данные
      устаревают»). Заставить перепроверить свежую запись можно только явно —
      об этом (инвалидация) и о том, когда и как перепроверяют устаревшую копию, разбирает урок «Когда данные
      устаревают».

      **Согласованность** (consistency) — копия совпадает с оригиналом на сервере и с другими копиями тех же данных.

      Свежая запись не обязательно согласована. «Свежая» значит только одно: мы решили пока не проверять. Ресторан
      поднял цену минуту назад; если `staleTime` пять минут, копия на телефоне свежая — и неверная. То же с другой
      стороны: отсутствие запроса не говорит, что данные свежие. Запроса могло не быть, потому что телефон без сети
      или потому что экран просто никто не открывал.

      И ещё одна грань: две записи об одном и том же могут разойтись. Блюдо лежит и в записи меню, и в записи
      карточки блюда. Если карточку перезапросили, а меню нет, цены в них различаются. Как сверять такие копии
      после изменений — тема урока «Кэш после изменения».

      Две настройки, которые легко спутать:

      - **Срок свежести** — когда перепроверить запись. В TanStack Query — `staleTime`.
      - **Срок хранения** — когда удалить ненужную запись. В TanStack Query — `gcTime`, для сохранённого кэша —
        `maxAge`.

      Вывод для проектирования: кэш служит для **показа**. Там, где от правильности зависят деньги или обещания, —
      сумма заказа, наличие товара, право на действие, — решение принимает сервер в момент действия. Если цена
      изменилась, сервер вернёт новую сумму, а клиент покажет человеку «Цена изменилась» вместо того, чтобы молча
      списать другую сумму. Как выбирать срок свежести для разных данных, разбирает урок «Когда данные устаревают».

      ## Пример целиком: кэш в сервисе доставки

      Пройдём по вечеру покупателя и посмотрим, что лежит в кэше. Пусть срок свежести списка — 1 минута, а срок
      хранения записей, которые никто не показывает, — 5 минут.

      1. **Открыл список: Москва, пицца.** Записи нет — запрос, спиннер, затем список.
         ```ts
         ['restaurants', { city: 'msk', cuisine: 'pizza' }]
         ```
      2. **Зашёл в ресторан 42.** Записи нет — запрос, спиннер, затем меню.
         ```ts
         ['menu', 42]
         ```
      3. **Через 40 секунд нажал «Назад».** Запись списка пиццерий есть и ещё свежая — запроса нет, список
         появляется мгновенно.
      4. **Переключил на суши.** Это другой ключ, записи нет — запрос, спиннер, затем суши.
         ```ts
         ['restaurants', { city: 'msk', cuisine: 'sushi' }]
         ```
      5. **Через 3 минуты вернулся к пицце.** Запись есть, но устарела. TanStack Query по умолчанию показывает
         такую копию сразу и перепроверяет её в фоне: человек видит старый список, а через мгновение — обновлённый.
      6. **Открыл «Мои заказы».** Записи нет — запрос, спиннер, затем заказы.
         ```ts
         ['orders', 'user-7']
         ```
      7. **Вышел из аккаунта.** Кэш очищен целиком, на экране — вход.
      8. **Вошёл другой человек и открыл заказы.** Записи нет — запрос и его заказы, без следа прежних.
         ```ts
         ['orders', 'user-9']
         ```

      На шаге 5 видно, чем свежесть отличается от хранения. Запись уже не свежая, но ещё хранится: её показали
      сразу и заодно перепроверили. Если бы человек вернулся через 10 минут, запись успела бы удалиться, и он увидел
      бы спиннер.

      Теперь соберём решения по всем видам данных:

      - **Список городов**
        - Срок свежести: часы.
        - Что в ключе: язык, версия формата.
      - **Список ресторанов**
        - Срок свежести: минута.
        - Что в ключе: город, адрес, кухня, сортировка.
      - **Меню ресторана**
        - Срок свежести: 30 секунд.
        - Что в ключе: номер ресторана, язык.
      - **Мои заказы**
        - Срок свежести: короткий, статусы меняются.
        - Что в ключе: номер пользователя.
      - **Данные карты для оплаты**
        - Не кэшируются вовсе.

      Где хранить и сколько: список городов меняется редко, его можно сохранить на устройстве на сутки. Остальное
      лежит только в памяти вкладки, а записи, которые никто не показывает, хранятся несколько минут. Заказы видны
      только текущему человеку и стираются при выходе из аккаунта.

      ## Как реализовать

      - **Состояние компонента**
        - Что даёт: просто, ничего лишнего.
        - Цена: общего кэша нет, каждый компонент запрашивает своё, и копии расходятся.
      - **Своё хранилище как кэш** (например, Redux)
        - Что даёт: полный контроль.
        - Цена: ключи, удаление, перепроверку и очистку при выходе пишете сами.
      - **Библиотека серверного состояния** (TanStack Query, SWR, RTK Query)
        - Что даёт: ключи, общие записи, срок хранения и срок свежести из коробки.
        - Цена: ещё одна зависимость, и её модель надо понять.
      - **Только HTTP-кэш браузера**
        - Что даёт: писать ничего не надо.
        - Цена: им управляет сервер; приложение не видит записей и не узнаёт об их обновлении.

      Документация TanStack Query называет её библиотекой **серверного состояния**: она управляет копиями данных
      сервера и не заменяет хранилище для состояния интерфейса — открытых панелей, введённого текста. Виды состояния
      разбирались в уроке «Какое бывает состояние» первого курса. Библиотека — реализация, а не решение: владельца,
      область, сроки и ключи всё равно выбираете вы.

      ## Типичные ошибки

      - **Ключ беднее ответа.** Фильтр, город или страница не попали в ключ — человек видит данные для других
        параметров.
      - **Ключ богаче ответа.** В ключе время или случайное число — кэш никогда не срабатывает.
      - **Два ключа для одних данных.** Два компонента хранят одно и то же под разными именами, и числа на экране
        расходятся.
      - **Кэш переживает выход пользователя.** Следующий человек видит чужие заказы или находит их на диске.
      - **Сохранённый кэш без версии.** После выпуска новый код читает старый формат и падает.
      - **«Свежий» принимают за «верный».** Сумму из кэша считают окончательной и не дают серверу её пересчитать.
      - **Личные данные в общем кэше.** Сервер разрешил хранить ответ с личными данными всем (`Cache-Control:
        public`), прокси его сохранил и отдаёт другим людям.

      ## Как спрашивают на интервью

      - «Как устроите кэш данных в этом приложении?» — ждут ответа про ключи с параметрами и пользователем, сроки
        свежести и хранения и то, что происходит при выходе.
      - «Человек сменил фильтр и увидел старые результаты. Где ошибка?» — ждут: параметр фильтра не попал в ключ.
      - «Данные свежие — значит, им можно верить?» — ждут разницы между свежестью и согласованностью и того,
        что окончательное решение принимает сервер.

      ## Коротко

      - Клиентский кэш данных — сохранённые копии ответов, которые экраны показывают повторно без запроса. Это не
        источник истины, а запомненный ответ источника; HTTP-кэш браузера и кэш Service Worker — другие кэши со своими
        хозяевами.
      - У кэша должен быть один владелец, обычно библиотека или модуль данных, а компоненты просят запись по ключу и
        подписываются на неё. Правило: одни данные — одна запись — один ключ.
      - Чем шире область действия кэша — от компонента до общего кэша для многих пользователей, — тем больше пользы и
        тем больше способов показать не те данные. Личные ответы сервер помечает `Cache-Control: private`.
      - В ключе должно быть всё, от чего зависит ответ: параметры запроса и, если ответ личный, номер пользователя.
        Время и случайные числа в ключ не кладут, иначе кэш ничего не находит.
      - Номер пользователя в ключе защищает от чужих записей в той же вкладке, а очистка кэша при выходе, включая
        сохранённую на устройство копию, удаляет их совсем. Для сохранённого кэша добавляют и версию формата — в ключ
        или в сам сохранённый кэш, — чтобы новая версия приложения не читала старый формат.
      - Срок свежести (`staleTime`) отвечает на вопрос «когда перепроверить», срок хранения (`gcTime`, `maxAge`) —
        «когда удалить». Устаревшую, но ещё хранящуюся запись TanStack Query по умолчанию показывает сразу и
        перепроверяет в фоне.
      - Свежая запись — не обязательно верная: «свежая» значит только «решили пока не проверять». Кэш служит для
        показа, а решения о деньгах и наличии сервер принимает в момент действия.
      - Библиотека серверного состояния вроде TanStack Query даёт ключи, общие записи и сроки из коробки, но
        владельца, область, сроки и состав ключа всё равно выбираете вы.

      ## Источники

      - [Query Keys — TanStack Query](https://tanstack.com/query/latest/docs/framework/react/guides/query-keys)
      - [Caching Examples — TanStack Query](https://tanstack.com/query/latest/docs/framework/react/guides/caching)

  - id: sdd-freshness
    topic: Получение и кэширование данных
    subtopic: Свежесть и инвалидация
    title: Когда данные устаревают
    audio: https://color-zebra.github.io/frontend-quiz-audio/system-design-data/sdd-freshness.mp3
    body: |
      ## Какую проблему решаем

      Вечер пятницы, 19:00. Покупатель открывает в сервисе доставки меню тайского ресторана, листает его и уходит
      посмотреть корзину. В 19:02 на кухне заканчиваются креветки, и ресторан ставит «Том ям» в **стоп-лист** — список
      блюд, которые сейчас нельзя заказать. В 19:03 покупатель возвращается в меню. Что он увидит?

      Если приложение показывает меню из кэша и не спрашивает сервер, «Том ям» по-прежнему выглядит доступным.
      Человек добавляет его в корзину, доходит до оплаты и получает «Блюдо недоступно». Обидно: пять минут потрачено
      впустую, а впечатление такое, будто сервис сломан.

      Можно пойти в другую крайность и загружать меню заново при каждом показе. Тогда при каждом возвращении человек
      смотрит на спиннер, телефон тратит трафик и батарею, а сервер ресторанов получает в несколько раз больше
      запросов, хотя меню почти всегда то же самое.

      Между этими крайностями и лежит тема урока. В уроке «Как устроен клиентский кэш» мы разобрали, что кэш на клиенте —
      это копия данных, владелец которых — сервер. Теперь ответим на следующий вопрос: **когда считать копию устаревшей
      и что делать, когда она устарела**.

      Напомним одной фразой урок «Как устроен клиентский кэш»: **свежей** (fresh) копии мы верим без нового запроса,
      а **устаревшую** (stale) пора перепроверить у сервера — она может совпадать с ним, а может и нет. Сам запрос,
      который выясняет, изменились ли данные, и приносит новую версию, называют **перепроверкой** (revalidation).

      ## Пять способов следить за свежестью

      Есть пять устоявшихся приёмов. Их часто сочетают, но каждый отвечает на свой вопрос.

      ### Фиксированный срок свежести

      **Срок свежести** (TTL, time to live) — копия считается свежей заданное время после получения, а потом
      устаревает. В HTTP это заголовок `Cache-Control: max-age=600`: десять минут ответ свежий. В TanStack Query срок
      свежести задаёт `staleTime`. Не путайте его со **сроком хранения** из урока «Как устроен клиентский кэш»: срок
      свежести отвечает, когда копию перепроверить, а срок хранения — когда удалить запись, которую никто не показывает.

      Это самый простой способ: ни сервер, ни клиент ничего не отслеживают, достаточно часов. Но у него две слабости.
      Пока срок не вышел, изменения на сервере не видны вовсе. А когда вышел, следующий показ ждёт сети — человек
      снова видит спиннер. Так ведёт себя HTTP-кэш, если в `Cache-Control` есть только `max-age`. Клиентские
      библиотеки вроде TanStack Query по умолчанию сочетают срок свежести с приёмом из следующего раздела, поэтому
      спиннера там нет.

      Срок свежести хорош для данных, которые меняются редко и предсказуемо: список кухонь, справочник городов, условия
      доставки.

      ### Показать старое и перепроверить

      **Stale-while-revalidate** (SWR, «устаревшее, пока идёт перепроверка») — когда данные устарели, мы всё равно
      сразу показываем копию из кэша, а параллельно, в фоне, спрашиваем сервер. Пришёл новый ответ — тихо заменяем
      копию на экране.

      Название пришло из HTTP. Его описывает RFC 5861 — дополнение к стандарту кэширования. Пример оттуда:

      ```http
      Cache-Control: max-age=600, stale-while-revalidate=30
      ```

      Ответ свежий 600 секунд. Следующие 30 секунд кэш ещё может отдавать его, но при этом должен перепроверить ответ
      в фоне, не заставляя клиента ждать. Если окно в 30 секунд закончилось, а перепроверки так и не было, следующий
      запрос ждёт сервер, как обычно.

      ![Шкала времени: ответ получен, затем отрезок «свежий» длиной max-age, когда копия отдаётся без запросов; затем окно stale-while-revalidate, когда копия отдаётся сразу и в фоне идёт перепроверка; после окна запрос ждёт сервер](images/sdd-swr.png "Как stale-while-revalidate делит время после получения ответа")

      Клиентские библиотеки взяли эту идею за основу. TanStack Query и библиотека SWR (её назвали в честь приёма)
      по умолчанию работают именно так: при новом показе экрана отдают то, что есть в кэше, и сразу перепроверяют его
      в фоне. Человек не видит спиннер, а через долю секунды видит актуальные данные.

      Цена приёма — короткое время на экране висит старая версия. Если данные важны, заменять их нужно аккуратно:
      не двигать список под пальцем и не прятать то, что человек уже начал делать.

      ### Инвалидация

      **Инвалидация** (invalidation, «признание недействительным») — явная пометка: «эти данные больше не свежие».
      Обычно после неё данные, которые сейчас на экране, тут же перезапрашиваются. Так ведёт себя TanStack Query:
      инвалидация помечает запрос устаревшим, даже если срок свежести ещё не вышел, и в фоне перезапрашивает те, что
      показаны на экране.

      Инвалидацию запускает событие, о котором клиент знает. Чаще всего это собственное действие пользователя:
      он переименовал адрес доставки — список адресов больше не свеж. Как правильно обновлять кэш после изменения,
      подробно разберём в уроке «Кэш после изменения».

      Инвалидация точна: перезапрос идёт ровно тогда, когда данные действительно изменились. Но она работает только
      для изменений, о которых клиент узнал. Если меню поменял ресторан, клиент покупателя об этом сам не узнает.

      ### Перезапрос при возврате

      **Перезапрос при возврате на вкладку** (refetch on focus) — устаревшие данные перепроверяются, когда человек
      возвращается в окно или на вкладку. Рядом стоит **перезапрос при восстановлении сети** (refetch on reconnect):
      связь пропала и вернулась — данные перепроверяются.

      Идея простая: пока вкладка в фоне, на неё никто не смотрит, и обновлять её незачем. А когда человек вернулся,
      самое время убедиться, что он видит правду.

      Важно понимать, что устаревшая запись в библиотеке не перепроверяется сама по себе, просто потому что срок
      вышел. Нужен повод. В TanStack Query по умолчанию поводов три: на экране появился компонент, которому нужны эти
      данные; человек вернулся на вкладку; вернулась сеть. Свежую запись эти поводы не трогают — она остаётся как есть.
      В библиотеке SWR перезапрос при возврате и при восстановлении сети тоже включены по умолчанию, а возврат на
      вкладку вызывает перепроверку не чаще раза в пять секунд (настройка `focusThrottleInterval` в
      [справочнике SWR](https://swr.vercel.app/docs/api)).

      Близкий родственник — **опрос** (polling): перезапрашивать данные по таймеру, например раз в 15 секунд, пока экран
      открыт. В SWR опрос по умолчанию выключен и в скрытой вкладке не работает.

      ### Уведомление от сервера

      **Push-обновления** (push — «толкать») — сервер сам сообщает клиенту об изменении по постоянному соединению.
      Получив сообщение «меню ресторана 42 изменилось», клиент либо обновляет кэш данными из сообщения, либо
      инвалидирует меню и перезапрашивает его.

      Это единственный способ узнавать о чужих изменениях почти сразу и при этом не опрашивать сервер каждую секунду.
      Но он самый дорогой: нужно постоянное соединение, серверная часть, которая рассылает события, и план на случай
      обрыва.

      Обрыв здесь — главная ловушка. Пока соединения не было (ноутбук уснул, поезд въехал в тоннель), события
      рассылались без вас и потерялись. Соединение восстановилось, но экран об этом не знает и показывает то, что было
      до обрыва, пока не придёт следующее событие, — а оно может не прийти часами. Поэтому сразу после переподключения
      данные на экране нужно перепроверить у сервера. Как устроены WebSocket и другие каналы живых обновлений, —
      в курсе «Реальное время и большие списки», в теме «Системы реального времени».

      ## Сравнение способов

      - **Срок свежести**
        - Чужое изменение видно: когда истечёт срок.
        - Нагрузка: низкая.
      - **Stale-while-revalidate**
        - Чужое изменение видно: при следующем показе.
        - Нагрузка: запрос на каждый показ устаревших данных.
      - **Инвалидация**
        - Чужое изменение видно: только если клиент о нём узнал.
        - Нагрузка: запрос при изменении.
      - **Перезапрос при возврате**
        - Чужое изменение видно: при возврате на вкладку или в сеть.
        - Нагрузка: запрос на каждый возврат.
      - **Опрос**
        - Чужое изменение видно: не позже интервала опроса.
        - Нагрузка: постоянная, растёт с числом открытых экранов.
      - **Push**
        - Чужое изменение видно: почти сразу.
        - Нагрузка: постоянное соединение и запросы по событиям.

      От сервера все эти способы ничего особенного не требуют, кроме push: ему нужен канал событий.

      ## Как выбирать: цена устаревших данных

      Главный вопрос при выборе звучит так: **что случится, если человек увидит старую версию?** Это и есть **цена
      устаревших данных**. Ответ раскладывается на три вопроса поменьше.

      1. **Как часто данные меняются?** Список кухонь — раз в месяц, стоп-лист — несколько раз за вечер, статус заказа —
         каждые несколько минут.
      2. **Что человек сделает на основе старых данных?** Посмотрит на неактуальный рейтинг ресторана — почти ничего
         не потеряет. Закажет блюдо из стоп-листа — потеряет время и доверие.
      3. **Поймает ли ошибку сервер?** Если сервер всё равно проверит наличие блюда при оформлении, устаревшее меню
         не приведёт к неверному заказу, а только к неприятному отказу.

      Третий пункт важен. Как мы уже говорили в уроке «Как устроен клиентский кэш», кэш служит для показа, а решающую
      проверку — цена, наличие, свободное место — делает сервер в момент операции: между последней перепроверкой
      и нажатием «Оплатить» данные всё равно могут измениться. Поэтому свежесть на клиенте решает другую задачу: как
      **редко** человек натыкается на отказ сервера. Чем дороже такой отказ для человека, тем свежее должны быть данные.

      Посмотрим, что получается для сервиса доставки.

      - **Список кухонь, города доставки.**
        - Цена старой версии: почти нулевая.
        - Способ: срок свежести в несколько часов.
      - **Описания и фото блюд.**
        - Цена старой версии: низкая.
        - Способ: stale-while-revalidate.
      - **Цены и стоп-лист.**
        - Цена старой версии: отказ при оформлении.
        - Способ: stale-while-revalidate и перезапрос при возврате; окончательно проверяет сервер.
      - **Адреса покупателя.**
        - Цена старой версии: человек не видит свою же правку.
        - Способ: инвалидация после изменения.
      - **Статус заказа.**
        - Цена старой версии: человек не знает, где еда.
        - Способ: опрос раз в 30 секунд. В курсе 1 так решили из требования «новый статус — в пределах минуты»;
          push понадобился бы, если бы статус нужно было показывать за секунды.

      Заметьте: дорогие способы нужны только там, где старая версия действительно вредит, а человек ждёт изменений
      от других людей. Для всего остального хватает простых приёмов.

      ## Пример целиком: стоп-лист в меню

      Соберём решение для меню ресторана.

      **Что известно.** Ресторан меняет стоп-лист несколько раз за вечер. Покупатель обычно смотрит меню 3–5 минут,
      переходит в корзину и обратно, иногда сворачивает приложение. Сервер при оформлении заказа всё равно проверяет
      каждое блюдо.

      **Решение.**

      1. Меню хранится в кэше по ключу «меню ресторана 42». Срок свежести — 30 секунд: при быстрых переходах туда
         и обратно сеть не трогаем.
      2. Когда срок вышел, работает stale-while-revalidate: меню показывается сразу из кэша, в фоне уходит запрос.
      3. Включён перезапрос при возврате на вкладку и при восстановлении сети: человек свернул приложение на десять
         минут — при возврате меню перепроверится.
      4. Если покупатель вошёл, корзина хранится на сервере, и при добавлении блюда сервер ответил «блюдо недоступно», клиент инвалидирует меню: раз сервер знает
         больше нас, наша копия точно устарела.
      5. Push для меню не делаем: ради нескольких изменений за вечер держать соединение с каждым покупателем дорого,
         а цена ошибки невысока — её всё равно ловит сервер.

      **Как это выглядит во времени.** В 19:00 меню загружено. В 19:02 ресторан ставит «Том ям» в стоп-лист. В 19:03
      покупатель возвращается из корзины в меню: срок свежести вышел, поэтому меню показывается мгновенно, а через
      300 миллисекунд приходит ответ сервера, и «Том ям» становится серым с подписью «Закончилось». Если же блюдо уже
      лежало в корзине, рядом с ним появляется предупреждение. Человек узнаёт об этом сейчас, а не на оплате.

      Сравните со сроком свежести в десять минут без перепроверки: «Том ям» выглядел бы доступным до 19:10.

      ## Что может пойти не так при обновлениях

      Перезапросы сами по себе создают проблемы. Вот три, о которых стоит подумать заранее.

      ### Лавина перезапросов

      Возврат на вкладку перепроверяет все устаревшие данные на экране. Если на экране 12 виджетов, каждый со сроком
      свежести ноль, каждый возврат — это 12 запросов. Человек, который переключается между вкладками раз в минуту,
      сам по себе почти не нагружает сервер, но тысячи таких людей — заметно.

      Ещё опаснее push. Сервер разослал «меню изменилось» десяти тысячам открытых экранов, и все они в одну и ту же
      секунду пошли за меню. Сервер получает пик, который сам себе и устроил.

      Что помогает:
      - **разумный срок свежести** — свежие данные при возврате не перезапрашиваются;
      - **ограничение частоты** — не чаще одного перезапроса за несколько секунд;
      - **случайный разброс** (jitter) — каждый клиент перед перезапросом по push ждёт свою случайную паузу,
        и запросы приходят к серверу не одной волной, а растянутыми во времени. Как выбирать паузу и считать нагрузку,
        разберём в уроке «Когда и как повторять».

      ### Старый ответ затирает новый

      Фоновая перепроверка ушла в 19:03:00. В 19:03:01 человек сам изменил данные, и кэш уже показывает новую версию.
      В 19:03:02 приходит ответ фоновой перепроверки — с данными на момент её отправки, то есть старыми. Если записать
      его в кэш, правка человека на экране «откатится».

      Правило: ответ, который начали ждать раньше последнего изменения, не должен перезаписывать более новые данные.
      Как это обеспечить, — в уроках «Гонки запросов» и «Кэш после изменения».

      ### Экран дёргается

      Фоновая замена данных может сдвинуть список под пальцем: человек целился в одно блюдо, а нажал на соседнее.
      Важные изменения лучше показывать на месте (блюдо стало серым), а не перестраивать весь список.

      ## Типичные ошибки

      - **Один способ на всё.** Push для справочника городов или срок свежести в час для статуса заказа. Способ выбирают
        для каждого вида данных по цене его устаревания.
      - **Считать свежий кэш гарантией.** «Мы перепроверили меню 10 секунд назад, значит, блюдо есть» — нет. Окончательно
        решает сервер в момент заказа.
      - **Нулевой срок свежести везде.** Каждый показ и каждый возврат на вкладку превращается в запрос. Трафик и нагрузка
        растут, а пользы нет.
      - **Забыть о своих правках.** Человек изменил адрес, а список адресов ещё пять минут показывает старый, потому что
        срок свежести не вышел. Собственные изменения требуют инвалидации, а не ожидания.
      - **Push без перепроверки после обрыва.** Пока соединения не было, события терялись; без перепроверки экран
        останется устаревшим до следующего события.
      - **Путать срок свежести и срок хранения.** Долгое хранение неиспользуемой записи не делает её свежей.

      ## Как спрашивают на интервью

      - «Как сделать, чтобы человек видел актуальные цены и наличие, но приложение не грузило всё заново на каждом
        экране?» Ждут разговор о цене устаревших данных, stale-while-revalidate и проверке на сервере.
      - «Что такое stale-while-revalidate и чем он лучше обычного срока свежести?»
      - «Вы получили по WebSocket сообщение, что данные изменились. Что сделает клиент и что будет, если таких клиентов
        сто тысяч?»

      ## Коротко

      - Свежей копии верят без запроса, устаревшую перепроверяют у сервера. Фиксированный срок свежести (TTL,
        `max-age`, `staleTime`) прост и хорош для данных, которые меняются редко и предсказуемо, но пока он не вышел,
        изменения не видны вовсе.
      - Stale-while-revalidate: устаревшую копию показывают сразу и перепроверяют в фоне. Так по умолчанию работают
        TanStack Query и SWR, а цена в том, что короткое время на экране висит старая версия.
      - Инвалидация — явная пометка «эти данные больше не свежие», после которой показанные данные обычно сразу
        перезапрашивают. Она точна, но работает только для изменений, о которых клиент узнал, прежде всего для
        собственных правок человека.
      - Устаревшая запись не перепроверяется сама, ей нужен повод: в TanStack Query по умолчанию это появление
        компонента, возврат на вкладку и возврат сети. Опрос по таймеру — постоянная нагрузка, которая растёт с числом
        открытых экранов.
      - Push — единственный способ узнавать о чужих изменениях почти сразу без частого опроса, но самый дорогой.
        События, разосланные во время обрыва, потеряны, поэтому сразу после переподключения данные на экране
        перепроверяют.
      - Способ выбирают по цене устаревших данных: как часто они меняются, что человек сделает на основе старой версии
        и поймает ли ошибку сервер. Свежесть на клиенте решает, как редко человек натыкается на отказ сервера, а
        окончательная проверка всё равно у сервера.
      - Лавину перезапросов гасят разумный срок свежести, ограничение частоты и случайный разброс. Ответ, который
        начали ждать раньше последнего изменения, не должен перезаписывать более новые данные.
      - Важные фоновые изменения лучше показывать на месте (блюдо стало серым), а не перестраивают весь список, чтобы
        он не сдвигался под пальцем.

      ## Источники

      - [RFC 5861: HTTP Cache-Control Extensions for Stale Content, раздел 3 — stale-while-revalidate](https://www.rfc-editor.org/rfc/rfc5861.html#section-3)
      - [TanStack Query: Important Defaults — что и когда библиотека перезапрашивает по умолчанию](https://tanstack.com/query/latest/docs/framework/react/guides/important-defaults)
      - [SWR: Automatic Revalidation — перезапрос при возврате, по таймеру и после восстановления сети](https://swr.vercel.app/docs/revalidation)

  - id: sdd-coordination
    topic: Получение и кэширование данных
    subtopic: Координация запросов и предзагрузка
    title: Лишние и одинаковые запросы
    audio: https://color-zebra.github.io/frontend-quiz-audio/system-design-data/sdd-coordination.mp3
    body: |
      ## Какую проблему решаем

      Откроем в сервисе доставки список ресторанов и посмотрим на вкладку «Сеть» в инструментах разработчика.
      Картина знакомая многим проектам:

      - аватар в шапке, значок корзины и блок «Ваш адрес» — три разных компонента, и каждый сам запрашивает профиль
        покупателя. Три одинаковых запроса за одну и ту же секунду;
      - на каждой из 20 карточек ресторанов есть строка «доставка 30–40 минут», и каждая карточка запрашивает её
        отдельно. Ещё 20 запросов;
      - человек вводит в поиск «пицца», и на каждую букву уходит запрос: «п», «пи», «пиц», «пицц», «пицца». Ответ на
        «пиц» пришёл последним, и на экране результаты для «пиц», хотя в поле написано «пицца».

      Вместе с запросом самого списка ресторанов это почти 30 запросов там, где хватило бы четырёх, и ещё неверный
      результат поиска. А когда человек нажимает на ресторан, меню грузится с нуля, хотя приложение могло догадаться
      заранее, что он туда пойдёт.

      В уроке «Когда и что загружать» мы решали, **какие** данные и в какой момент нужны экрану. Этот урок — о том, как
      **согласовать между собой** запросы, которые уже решено отправить: не слать одинаковые, не ждать ненужные,
      объединять мелкие и начинать нужные заранее.

      ## Две разные цели

      Прежде чем выбирать приём, решите, что именно вы улучшаете. Целей две, и они разные.

      - **Меньше запросов.** Это нагрузка на сервер, трафик и батарея телефона. Здесь важно общее число запросов
        и объём данных.
      - **Меньше ожидания.** Это **задержка** (latency) — сколько времени человек ждёт ответа. Здесь важно, когда
        данные оказываются на экране, а число запросов вторично.

      Цели могут спорить. Предзагрузка сокращает ожидание, но добавляет запросы, часть которых окажется лишней.
      Пакетная отправка сокращает число запросов, но может добавить ожидания. Дальше для каждого приёма отметим,
      что он даёт и чем за это платит.

      ## Дедупликация: один запрос вместо нескольких одинаковых

      **Дедупликация** (deduplication, «удаление повторов») — если такой же запрос уже в пути, новый не отправляется:
      все, кто его просил, ждут один ответ.

      Как понять, что запросы одинаковые? По **ключу** — тому же ключу кэша, который мы разобрали в уроке «Как устроен
      клиентский кэш»: адрес, параметры, пользователь. Три компонента просят «профиль текущего пользователя» —
      ключ один, запрос один.

      Суть механизма помещается в несколько строк:

      ```js
      const inFlight = new Map(); // ключ → обещание ответа

      function load(key, fetcher) {
        if (inFlight.has(key)) return inFlight.get(key); // уже в пути — ждём тот же ответ
        const promise = fetcher().finally(() => inFlight.delete(key));
        inFlight.set(key, promise);
        return promise;
      }
      ```

      В готовых библиотеках это уже есть. В документации SWR пример: пять аватаров на странице с одним ключом
      `/api/user` дают один сетевой запрос. Кроме того, SWR не повторяет запрос с тем же ключом ещё две секунды после
      предыдущего — это настраиваемое окно дедупликации.

      **Где дедупликация не работает:**

      - **Разные ключи для одних данных.** `?city=msk&sort=rating` и `?sort=rating&city=msk` — один и тот же запрос
        для сервера, но разные строки для кэша. Ключ нужно приводить к единому виду.
      - **Изменения.** Дедуплицируют только чтение. Два нажатия «Добавить в корзину» — это, возможно, два намерения
        человека, а возможно, случайный двойной клик. Разбираться с этим — задача урока «Повторы без двойных
        списаний», а не дедупликации.

      Дедупликация уменьшает число запросов и заодно немного ускоряет экран: второй компонент получает ответ, который
      уже на подходе.

      ## Отмена и игнор устаревших ответов

      Вернёмся к поиску. Человек ввёл «пиц», потом «пицца». Запрос для «пиц» больше никому не нужен, но он уже ушёл.
      С ним можно поступить двумя способами.

      **Проигнорировать ответ.** Запрос идёт своим чередом, но когда ответ приходит, мы проверяем: это ответ на
      последний запрос? Если нет — выбрасываем его. Так поступает пример из документации React: эффект заводит флаг
      `ignore`, а при сбросе эффекта ставит его в `true`, и пришедший поздно ответ уже не попадает в состояние
      (см. [«Получение данных в эффекте» на ru.react.dev](https://ru.react.dev/reference/react/useEffect#fetching-data-with-effects)).

      **Отменить запрос.** Браузер умеет обрывать запрос с помощью **AbortController** — объекта, который передаёт в
      `fetch` сигнал отмены:

      ```js
      const controller = new AbortController();
      fetch(`/api/search?q=${encodeURIComponent(query)}`, { signal: controller.signal })
        .then((r) => r.json())
        .then(showResults)
        .catch((e) => { if (e.name !== 'AbortError') showError(e); });

      // человек ввёл следующую букву:
      controller.abort(); // обещание fetch отклонится с ошибкой AbortError
      ```

      Отмена делает то же, что игнор, и вдобавок освобождает соединение и трафик: ответ на «пиц» не будет докачиваться.
      Но отмена — действие на стороне клиента: сервер, получивший запрос, его выполнит. Для поиска это неважно,
      для записи — разберём в уроке «Гонки запросов».

      Есть тонкость у библиотек. TanStack Query по умолчанию **не отменяет** запрос, если компонент исчез с экрана:
      запрос доходит до конца, и ответ попадает в кэш — пригодится, если человек вернётся. Отмена срабатывает, только
      если ваша функция загрузки передаёт полученный от библиотеки сигнал в `fetch`.

      ### Пауза перед запросом

      Игнор и отмена отвечают за правильность: на экране результат для того, что сейчас в поле. Но запросов меньше
      не становится — на каждую букву по-прежнему уходит запрос. Число запросов сокращает **debounce** (дословно
      «устранение дребезга») — отправить запрос, только когда человек перестал печатать, например через 300 мс после
      последнего нажатия клавиши. «Пицца», набранная быстро, — один запрос вместо пяти. Как написать такую функцию,
      показано в статье [«Debounce на примере формы поиска» в «Доке»](https://doka.guide/js/debounce/).

      Цена паузы — сама пауза: результат появится как минимум на 300 мс позже. И пауза не защищает от порядка
      ответов: если человек сделал перерыв после «пиц», а потом дописал, два запроса всё равно могут прийти не по
      порядку. Поэтому паузу и отмену ставят вместе: первая сокращает число запросов, вторая гарантирует, что на
      экране последний результат.

      ## Пакетная отправка: один запрос вместо многих мелких

      **Пакетная отправка** (batching) — собрать несколько мелких запросов и отправить одним. Вместо 20 запросов
      «время доставки ресторана 17» — один запрос «время доставки ресторанов 1, 2, …, 20».

      Пакеты собирают двумя способами:

      - **за короткое окно** — все запросы, сделанные за несколько миллисекунд, уходят одним. Так устроена известная
        библиотека DataLoader для GraphQL: она объединяет все загрузки, сделанные за один проход цикла событий;
      - **по объёму или по времени** — события аналитики копятся и уходят пачкой раз в 10 секунд или каждые 20 штук,
        что наступит раньше.

      Чем платим:

      - **Ожиданием.** Пакет уходит не сразу, а когда окно закроется. Для времени доставки окно в 10 мс незаметно,
        для аналитики 10 секунд не важны, а для ответа на нажатие кнопки даже 200 мс уже ощутимы.
      - **Контрактом.** Сервер должен уметь принимать пакет. Это изменение API, его согласуют с бэкендом.
      - **Частичными исходами.** В пакете из 20 ресторанов для двух время могло не посчитаться. Ответ должен
        сообщать результат по каждому элементу, а интерфейс — показать 18 оценок и прочерк у двух. О частичных
        исходах говорили в уроке «Загрузка, пустота, ошибка и всё между ними».
      - **Потерей при уходе.** Накопленные события аналитики пропадут, если человек закроет вкладку до отправки.
        Остаток нужно отправить, когда страница скрывается; как поймать этот момент, разбирали в уроке курса 1
        «Что переживает перезагрузку».

      Пакетная отправка уменьшает число запросов. Ожидание она может как увеличить (окно сбора), так и уменьшить:
      один ответ на 20 элементов часто приходит быстрее, чем 20 отдельных, которые конкурируют за соединения.

      ## Предзагрузка: начать до того, как попросили

      **Предзагрузка** (prefetch) — загрузить данные заранее, до того как человек их запросил, чтобы в нужный момент
      они уже лежали в кэше. Человек навёл курсор на карточку ресторана — начинаем грузить меню. К моменту клика
      часть ожидания уже позади, а иногда и всё.

      Предзагрузка — это ставка. Выиграли, если человек действительно пошёл туда, куда мы готовились. Проиграли — и
      заплатили трафиком, батареей и нагрузкой на сервер за данные, которые никто не увидит. Поэтому решение строят
      на двух величинах:

      - **вероятность**, что данные понадобятся;
      - **цена лишней работы**, если не понадобятся: насколько тяжёлый ответ, платный ли у человека трафик,
        дорог ли запрос для сервера.

      Сравните варианты для списка из 20 ресторанов, где человек открывает в среднем один:

      - **Все 20 меню сразу** — 20 запросов на одно открытие, из них 19 лишних, то есть 95 %.
      - **При наведении или касании** — 1–2 запроса, лишних мало.
      - **Только по клику** — 1 запрос, лишних нет, но нет и выигрыша.

      Наведение даёт мало лишних запросов, потому что наводят обычно на то, что и собираются открыть.

      Сигналы с высокой вероятностью — наведение курсора, фокус с клавиатуры, начало касания на телефоне (оно
      опережает отпускание пальца, после которого и случается «клик»), приближение к концу списка перед загрузкой
      следующей страницы.

      Ещё два правила:

      - **Предзагрузка уважает свежесть.** Если данные в кэше свежие, повторно их не грузят. В документации TanStack
        Query прямо сказано: предзагрузка срабатывает, только если данные старше срока свежести. И наоборот: если
        у данных нулевой срок свежести, экран при открытии всё равно перепроверит их — часть выигрыша пропадёт.
      - **Только чтение.** Предзагружать можно то, что безопасно запросить и не использовать. Действия с последствиями
        не предзагружают никогда.

      ## Что даёт каждый приём

      - **Дедупликация**
        - Запросов: меньше.
        - Ожидание: чуть меньше.
      - **Игнор устаревших ответов**
        - Запросов: столько же.
        - Ожидание: столько же, зато результат верный.
      - **Отмена**
        - Запросов: столько же, но меньше трафика.
        - Ожидание: столько же.
      - **Пауза перед запросом**
        - Запросов: меньше.
        - Ожидание: больше на длину паузы.
      - **Пакетная отправка**
        - Запросов: меньше.
        - Ожидание: больше на окно сбора или меньше за счёт одного ответа.
      - **Предзагрузка**
        - Запросов: больше.
        - Ожидание: меньше.

      Цена каждого приёма разобрана в его разделе выше.

      ## Пример целиком: список ресторанов и меню

      Применим всё к экрану, с которого начали.

      1. **Профиль покупателя.** Три компонента запрашивают его по одному ключу `["me"]`. Дедупликация в библиотеке
         превращает три запроса в один. Работы на сервере для этого не нужно.
      2. **Время доставки на карточках.** Договариваемся с бэкендом о запросе `POST /delivery-estimates` со списком
         из 20 ресторанов. Карточки по-прежнему просят время каждая для себя, а слой загрузки за 10 мс собирает эти
         просьбы в один пакет. В ответе — время для каждого ресторана или пометка «не удалось посчитать».
         Было 20 запросов, стал один.
      3. **Поиск.** Запрос уходит через 300 мс после последнего нажатия клавиши, а предыдущий незавершённый запрос
         отменяется. «Пицца» — один запрос, и на экране точно результаты для «пицца».
      4. **Меню.** При наведении курсора или начале касания карточки запускаем предзагрузку меню. У меню срок
         свежести 30 секунд (из урока «Когда данные устаревают»), поэтому открытый через секунду экран берёт
         предзагруженное меню и не перепроверяет его.

      **Что получилось.** На открытии списка вместо 24 запросов (3 профиля, 20 оценок времени, сам список) — три.
      Поиск не показывает чужие результаты. Меню при переходе в большинстве случаев появляется сразу. Цена — один
      новый метод API и иногда одно лишнее меню, загруженное при наведении.

      ## Типичные ошибки

      - **Лечить порядок ответов паузой.** Debounce уменьшает число запросов, но не гарантирует, что последний ответ
        придёт последним. Нужен игнор или отмена.
      - **Дедуплицировать изменения.** Два одинаковых запроса на запись склеиваются в один, и одно действие
        человека пропадает. Дедупликация — для чтения.
      - **Ключи в разном виде.** Одинаковые данные под разными ключами не дедуплицируются и лежат в кэше дважды.
      - **Предзагружать всё.** «Пусть всё будет в кэше» на телефоне с платным трафиком превращается в мегабайты
        лишних данных и нагрузку на сервер, причём большая часть ни разу не будет показана.
      - **Предзагрузка с нулевым сроком свежести.** Данные загружены заранее, но экран при открытии всё равно идёт
        за ними в сеть.
      - **Пакет без частичных исходов.** Один сбойный элемент роняет весь пакет, и 19 карточек остаются без данных.
      - **Путать цели.** Сокращать число запросов, когда жалуются на медленный экран, и наоборот.

      ## Как спрашивают на интервью

      - «Как устроить автодополнение в поиске, чтобы не заваливать сервер и не показывать устаревшие результаты?»
        Ждут паузу перед запросом, отмену или игнор, кэш по строке запроса.
      - «Несколько компонентов на странице запрашивают одни и те же данные. Что вы сделаете?»
      - «Как ускорить переход со списка на детальную страницу?» Ждут предзагрузку по сигналу с высокой вероятностью
        и разговор о её цене.

      ## Коротко

      - Сначала решают, что улучшать: число запросов (нагрузка, трафик, батарея) или ожидание. Цели спорят:
        предзагрузка сокращает ожидание, но добавляет запросы, а пакетная отправка сокращает число запросов, но может
        добавить ожидание.
      - Дедупликация: если такой же запрос уже в пути, новый не отправляют, и все ждут один ответ. Одинаковость
        определяет ключ, поэтому его приводят к единому виду, а изменения не дедуплицируют.
      - Устаревший ответ можно проигнорировать (флаг `ignore` в эффекте) или отменить запрос через `AbortController`,
        что заодно экономит трафик. Отмена действует только на клиенте: сервер полученный запрос выполнит.
      - Debounce отправляет запрос, когда человек перестал печатать, и сокращает число запросов, но не защищает от
        порядка ответов. Поэтому паузу ставят вместе с отменой или игнором.
      - Пакетная отправка собирает мелкие запросы в один за короткое окно или по объёму, а платят за неё ожиданием
        окна и изменением API. Ответ на пакет сообщает результат по каждому элементу, а накопленное по времени, как
        аналитику, досылают, когда страница скрывается.
      - Предзагрузка — ставка: её делают, когда вероятность, что данные понадобятся, высока, а лишняя работа дёшева.
        Сигналы с высокой вероятностью — наведение, фокус, начало касания, приближение к концу списка.
      - Предзагрузка уважает срок свежести: при нулевом сроке экран всё равно перепроверит данные. Предзагружают
        только чтение.

      ## Источники

      - [SWR: Performance, раздел Deduplication — один запрос для нескольких компонентов](https://swr.vercel.app/docs/advanced/performance#deduplication)
      - [AbortController — MDN (на русском)](https://developer.mozilla.org/ru/docs/Web/API/AbortController)
      - [TanStack Query: Prefetching — предзагрузка по событиям и срок свежести](https://tanstack.com/query/latest/docs/framework/react/guides/prefetching)

  - id: sdd-pagination
    topic: Получение и кэширование данных
    subtopic: Пагинация изменчивых списков
    title: Пагинация живых списков
    audio: https://color-zebra.github.io/frontend-quiz-audio/system-design-data/sdd-pagination.mp3
    body: |
      ## Какую проблему решаем

      В большом городе сервис доставки работает с двумя тысячами ресторанов. Загрузить их все одним ответом нельзя:
      это мегабайты данных и долгое ожидание на мобильной сети, а человек всё равно посмотрит первые двадцать-сорок.
      Поэтому список отдают частями по 20 — сначала первые, потом следующие.

      Пока человек листает, список живёт своей жизнью. Открылся новый ресторан, у другого поменялся рейтинг, третий
      закрылся на ремонт. И тут начинаются странности: ресторан, который человек только что видел, появляется
      в списке второй раз, а другой бесследно пропадает. Человек не понимает, что происходит, а если в списке были
      заказы или платежи, дубль или пропуск выглядит как ошибка в деньгах.

      Причина не в баге конкретного экрана, а в том, **как именно** клиент просит «следующие 20». Об этом урок.

      ## Понятия

      **Пагинация** (pagination) — выдача длинного списка частями. Часть называют **страницей** (page), её размер —
      **лимитом** (limit).

      **Изменчивый список** — такой, в который во время просмотра добавляют, из которого удаляют и в котором
      переставляют элементы. Лента отзывов, входящие письма, список заказов в кабинете ресторана — изменчивые.
      Архив счетов за прошлый год — нет.

      Есть два основных способа просить следующую страницу.

      **Пагинация по смещению** (offset pagination) — «пропусти первые N элементов и дай следующие 20»:

      ```http
      GET /restaurants?sort=rating&offset=20&limit=20
      ```

      Номер страницы — та же идея: страница 3 при лимите 20 — это смещение 40.

      **Пагинация по курсору** (cursor pagination) — «дай 20 элементов после вот этого»:

      ```http
      GET /restaurants?sort=rating&limit=20&after=eyJyIjo0LjgsImlkIjo1MTd9
      ```

      **Курсор** (cursor) — метка позиции в списке, которую выдаёт сервер. Клиент получает её вместе со страницей
      и передаёт обратно, чтобы получить следующую. Внутри курсор обычно хранит значения сортировки последнего
      показанного элемента: «рейтинг 4,8, id 517». Но клиент в него не заглядывает и сам его не собирает: курсор
      **непрозрачный** (opaque). Спецификация пагинации в GraphQL (Cursor Connections) прямо говорит, что клиент
      должен считать курсор непрозрачным. Тогда сервер может поменять его устройство, и клиенты этого не заметят. Slack,
      например, кодирует курсор в Base64 и внутри разных методов API хранит в нём разные вещи.

      Вместе со страницей сервер сообщает, есть ли продолжение: курсор следующей страницы или признак «больше нет».
      О признаке продолжения в ответе говорили в уроке «Контракт API глазами фронтенда».

      ## Как появляются дубли и пропуски

      Разберём по шагам, что случается со смещением.

      1. Человек загрузил первую страницу: рестораны на местах 1–20. Последний из них — «Сакура».
      2. Пока он читал, открылся новый ресторан, и по рейтингу он встал на место 3. Все, кто был ниже, сдвинулись на
         одно место вниз. «Сакура» теперь на месте 21.
      3. Клиент просит `offset=20&limit=20` — места 21–40. Первой в ответе приходит «Сакура», которую человек уже
         видел. Это **дубль**.

      ![Две ленты ресторанов до и после вставки нового ресторана на третье место: при запросе offset=20 вторая страница начинается с «Сакуры», последней на первой странице, и она показывается дважды; при запросе по курсору «после Сакуры» вторая страница начинается со следующего ресторана](images/sdd-offset-cursor.png "Почему смещение даёт дубль, а курсор — нет")

      С удалением наоборот. Если ресторан с места 5 закрылся, все сдвинулись вверх, и бывший 21-й стал 20-м. Запрос
      мест 21–40 его не вернёт — это **пропуск**: человек его не увидит вовсе.

      Чем чаще меняется список, тем чаще это случается. Slack описывает ту же проблему для сообщений: при частых
      записях окно страницы «плывёт», и клиент пропускает элементы или получает их дважды.

      Курсор устроен иначе. Запрос «после «Сакуры»» не зависит от того, сколько ресторанов стоит выше неё: сервер
      находит место «Сакуры» по значениям сортировки и отдаёт тех, кто идёт следом. Вставка и удаление выше курсора
      на вторую страницу не влияют.

      ### Чего курсор не исправляет

      Курсор не делает список неподвижным. Две ситуации остаются.

      - **Элемент переехал через границу.** Ресторан со второй страницы поднял рейтинг и перебрался в уже
        просмотренную часть. Следующая страница его не вернёт — пропуск. Обратное движение — из просмотренной части
        в непросмотренную — даёт дубль.
      - **Новое выше курсора не видно.** Ресторан, открывшийся на месте 3, человек увидит, только если обновит список
        сверху. Поэтому ленты показывают плашку «Есть новые» или обновляют список при потягивании вниз.

      Отсюда два правила:

      - **Порядок должен быть строгим.** У двух ресторанов может быть одинаковый рейтинг. Если сортировать только
        по рейтингу, их порядок между запросами может меняться, и курсор «после рейтинга 4,8» станет
        неоднозначным. Добавляют уникальное поле для ничьих: «по рейтингу, при равенстве — по id».
      - **Клиент сливает страницы по id.** Добавляя новую страницу в список, клиент пропускает элементы с id, которые
        уже показаны. Это не лечит пропуски, но убирает дубли, откуда бы они ни взялись, и заодно предупреждение
        React о двух элементах с одинаковым ключом.

      ## Смещение или курсор

      У курсора есть цена. Slack перечисляет её прямо: нельзя перейти сразу на страницу N и нельзя узнать общее число
      страниц, потому что курсор знает только «после кого», а не «на каком месте».

      | | Смещение | Курсор |
      |---|---|---|
      | Вставки и удаления | Дубли и пропуски | Не мешают |
      | Переход на страницу 37 | Есть | Нет |
      | Общее число страниц | Есть | Обычно нет |
      | Дальние страницы | Медленнее | Так же быстро |
      | Ссылка на страницу | Простая | Длинная, устаревает |

      Пояснения к таблице. Ссылка со смещением выглядит как `?page=3`. У курсора есть только «следующая»
      и «предыдущая» страницы. Дальние страницы со смещением
      медленнее, потому что базе данных приходится пройти все пропущенные строки. Курсор в адресе страницы
      возможен, но он длинный и со временем перестаёт работать.

      **Когда хватает смещения.** Список почти не меняется во время просмотра, а человеку нужны номера страниц
      и переход к конкретной: архив документов, справочник, таблица закрытых заказов за прошлый месяц. Ещё один
      честный вариант — смещение по **закреплённому снимку**: сервер запоминает результаты поиска на момент запроса
      и отдаёт страницы из этого снимка, поэтому сдвигаться в нём нечему. Цена — снимок постепенно устаревает.

      **Когда нужен курсор.** Список меняется, пока его листают: ленты, отзывы, сообщения, новые заказы. И не нужен
      переход на страницу N — человек листает подряд.

      ## Смена фильтра и возврат к месту

      ### Смена фильтра — список с начала

      Человек долистал до 80-го ресторана и включил фильтр «Только с бесплатной доставкой». Получился другой
      список, и всё загруженное к нему не относится. Правильная последовательность:

      1. Выбросить загруженные страницы и курсор старого списка. Курсор привязан к сортировке и фильтру, с которыми
         его выдали: с новым фильтром «после «Сакуры»» ничего не значит.
      2. Отменить или проигнорировать загрузку следующей страницы старого списка, если она ещё идёт. Иначе её ответ
         придёт позже и допишется в новый список (как это делается — в уроке «Лишние и одинаковые запросы»).
      3. Запросить первую страницу с новым фильтром и прокрутить экран к началу.

      Фильтр входит в ключ кэша (урок «Как устроен клиентский кэш»). Тогда при возврате к прежнему фильтру его
      страницы могут найтись в кэше, а не загружаться заново.

      ### Возврат к месту

      Человек долистал до 60-го ресторана, открыл его, посмотрел меню и нажал «Назад». Он ждёт, что окажется на том же
      месте. Если список при возврате загружается с первой страницы, а прокрутка встаёт в начало, человек теряет
      место и, скорее всего, бросает поиск. Исследователи Nielsen Norman Group отмечают, что в бесконечном списке
      и так трудно запомнить, где был нужный элемент, и вернуться к нему.

      Чтобы вернуть человека на место, нужно сохранить три вещи:

      - **загруженные страницы** — в кэше, по ключу с фильтром и сортировкой. При возврате список отрисовывается сразу,
        до всяких запросов;
      - **сколько страниц было загружено** или курсор последней — чтобы восстановить список, если кэш пропал;
      - **позицию** — лучше не в пикселях, а как id элемента вверху экрана: высота карточек может измениться.

      Где хранить позицию? Для «Назад» в той же вкладке подходит запись в истории браузера (`history.state`): она
      привязана именно к этой точке истории. Для ссылки, которой делятся, — адрес страницы. Что переживает
      перезагрузку и переход по истории, разбирали в уроке «Что переживает перезагрузку».

      Браузер сам умеет восстанавливать прокрутку при «Назад», но только если к этому моменту на странице уже есть
      содержимое нужной высоты. Если список приходит из сети через полсекунды, восстанавливать прокрутку придётся
      самим. Тогда автоматическое восстановление выключают — `history.scrollRestoration = 'manual'` — и после
      отрисовки списка прокручивают к сохранённому элементу. Иначе браузер и ваш код будут прокручивать страницу
      каждый по-своему, и экран прыгнет. Подробнее — на странице
      [History: scrollRestoration в MDN](https://developer.mozilla.org/en-US/docs/Web/API/History/scrollRestoration)
      (русской версии нет).

      ## Номера страниц, «Показать ещё» или бесконечная прокрутка

      Как человек будет листать — тоже архитектурное решение: от него зависят API, адрес страницы и хранение позиции.

      - **Номера страниц** — внизу ряд «1 2 3 … 37». Каждая страница заменяет предыдущую.
      - **Кнопка «Показать ещё»** (load more) — следующая порция дописывается в конец по нажатию.
      - **Бесконечная прокрутка** (infinite scroll) — следующая порция дописывается сама, когда человек приближается
        к концу.

      Выбирают по задаче пользователя: вернуться к месту после перехода, дойти до подвала страницы (контакты,
      справка), поделиться ссылкой на место в списке, сравнивать и искать конкретное или просто листать без цели.

      ### Номера страниц

      - **Удобно:** вернуться к месту — номер страницы лежит в адресе; поделиться ссылкой `?page=3`; дойти до
        подвала; сравнивать и искать — есть ориентиры вроде «на третьей странице».
      - **Неудобно:** листать без цели — на каждую страницу нужен клик.
      - **Пагинация на сервере:** смещение.

      ### «Показать ещё»

      - **Удобно:** подвал доступен; листать без цели терпимо — одно нажатие на порцию.
      - **Неудобно:** вернуться к месту — нужно сохранять загруженные страницы и позицию; поделиться ссылкой на место
        сложно; сравнивать средне.
      - **Пагинация на сервере:** курсор или смещение.

      ### Бесконечная прокрутка

      - **Удобно:** листать без цели, как ленту, — удобнее всего.
      - **Неудобно:** до подвала почти не дойти — он всё время уезжает; вернуться к месту — нужно сохранять страницы
        и позицию; поделиться ссылкой на место сложно; искать и сравнивать неудобно.
      - **Пагинация на сервере:** курсор.

      ### Что советуют исследования

      Nielsen Norman Group советует бесконечную прокрутку для однородных потоков, которые листают без цели, — лент
      соцсетей, новостей — и не советует для поиска конкретного товара или сравнения. Кнопку «Показать ещё» там же
      называют компромиссом: подвал остаётся доступным, а человек сам решает, грузить ли дальше.

      Ещё один подвох бесконечной прокрутки — **иллюзия конца**: следующая порция грузится, а индикатора нет, и человек
      решает, что список закончился. Индикатор загрузки внизу обязателен.

      ## Пример целиком: список ресторанов и история заказов

      **Список ресторанов для покупателя.** Его листают с телефона, почти без цели: что бы такое заказать. Список
      меняется вечером: рестораны открываются, закрываются, ставят паузу на приём заказов. Внизу экрана — подвал со
      справкой и условиями доставки.

      - **API:** курсор и строгий порядок.

        ```http
        GET /restaurants?cuisine=pizza&sort=rating&limit=20&after=<курсор>

        { "items": [ … ], "nextCursor": "eyJyIjo0LjYsImlkIjo4OH0" }
        ```

        `nextCursor: null` означает, что продолжения нет. Сортировка — по рейтингу, при равенстве — по id.
      - **Интерфейс:** «Показать ещё». Листать удобно, подвал доступен.
      - **Склейка:** новые страницы сливаются по id, дубли отбрасываются.
      - **Фильтр:** смена кухни сбрасывает страницы и курсор, отменяет загрузку старой страницы и прокручивает к началу.
      - **Возврат:** страницы лежат в кэше по ключу «пицца, по рейтингу», а id ресторана вверху экрана — в записи
        истории. После «Назад» список отрисовывается из кэша и прокручивается к этому ресторану.

      **История заказов в кабинете ресторана.** Менеджер ищет конкретный заказ за прошлый месяц, чтобы разобраться
      с жалобой, и отправляет коллеге ссылку «посмотри на четвёртой странице». Прошлые заказы уже не меняются.

      - **API:** смещение с общим числом заказов: `GET /orders?month=2026-09&page=4&limit=50`.
      - **Интерфейс:** номера страниц, номер — в адресе.
      - Дублей и пропусков не будет: за прошлый месяц новые заказы не появляются.

      Два списка в одном продукте получили разные решения, потому что у них разные данные и разные задачи людей.

      ## Типичные ошибки

      - **Смещение для живой ленты.** Дубли и пропуски появляются у пользователей под нагрузкой, а у разработчика на
        тестовых данных их нет.
      - **Курсор там, где нужен переход на страницу 37.** Бухгалтеру, который ищет счёт по номеру страницы из отчёта,
        «Показать ещё» тридцать шесть раз не поможет.
      - **Нестрогий порядок.** Сортировка по рейтингу без уникального поля для ничьих: элементы с одинаковым рейтингом
        скачут между страницами.
      - **Не сбросить список при смене фильтра.** К новому фильтру дописывается поздний ответ старого, или курсор
        старого списка уходит с новым фильтром.
      - **Собирать свой курсор на клиенте** из id последнего элемента. Сервер поменяет устройство курсора, и клиент
        сломается.
      - **Бесконечная прокрутка над важным подвалом.** Контакты и справка недоступны, пока не кончится список, а он
        не кончается.
      - **Терять место при «Назад».** Человек возвращается к началу списка и бросает поиск.

      ## Как спрашивают на интервью

      - «Спроектируйте ленту новостей» — почти всегда спрашивают, как вы будете подгружать ленту и что будет
        с новыми постами, которые появились, пока человек листал.
      - «Чем курсорная пагинация лучше пагинации по смещению? Когда смещение всё-таки лучше?»
      - «Бесконечная прокрутка или номера страниц для каталога интернет-магазина?» Ждут выбор по задачам людей.

      ## Коротко

      - Пагинация по смещению просит «пропусти N и дай 20», по курсору — «дай 20 после вот этого». Курсор выдаёт
        сервер, и клиент считает его непрозрачным: не заглядывает внутрь и не собирает сам.
      - В изменчивом списке смещение даёт дубли (вставка выше сдвигает элементы вниз) и пропуски (удаление сдвигает
        вверх), а курсор от того, что стоит выше него, не зависит.
      - Курсор не делает список неподвижным: элемент, переехавший через границу страницы, пропадёт или повторится, а
        новое выше курсора видно только при обновлении сверху.
      - Порядок должен быть строгим, с уникальным полем для ничьих («по рейтингу, при равенстве — по id»), а клиент
        сливает страницы по id, отбрасывая дубли.
      - С курсором нельзя перейти сразу на страницу N и узнать число страниц. Поэтому смещение подходит списку,
        который почти не меняется, если нужны номера страниц, а курсор — живым лентам, которые листают подряд.
      - При смене фильтра выбрасывают загруженные страницы и курсор, отменяют или игнорируют загрузку старой страницы,
        запрашивают первую страницу с новым фильтром и прокручивают к началу.
      - Чтобы вернуть человека на место после «Назад», хранят страницы в кэше, а позицию — как id элемента вверху
        экрана, например в `history.state`. Если список приходит из сети, прокрутку восстанавливают сами
        (`history.scrollRestoration = 'manual'`).
      - Бесконечная прокрутка подходит однородным лентам, которые листают без цели, а номера страниц — когда ищут
        конкретное, сравнивают и делятся ссылкой. «Показать ещё» — компромисс, при котором подвал остаётся доступным.

      ## Источники

      - [Evolving API Pagination at Slack — Slack Engineering](https://slack.engineering/evolving-api-pagination-at-slack/)
      - [GraphQL Cursor Connections Specification, раздел Cursor — непрозрачный курсор](https://relay.dev/graphql/connections.htm#sec-Cursor)
      - [Infinite Scrolling: When to Use It, When to Avoid It — Nielsen Norman Group](https://www.nngroup.com/articles/infinite-scrolling-tips/)

  - id: sdd-races
    topic: Изменения и согласованность
    subtopic: Гонки и порядок
    title: Гонки запросов
    audio: https://color-zebra.github.io/frontend-quiz-audio/system-design-data/sdd-races.mp3
    body: |
      ## Какую проблему решаем

      Покупатель собирает заказ в сервисе доставки. Он вошёл в аккаунт, поэтому корзина хранится на сервере и видна
      на всех его устройствах. В корзине лежит одна «Маргарита», он хочет три и быстро дважды нажимает «+». Приложение
      на каждое нажатие отправляет серверу запрос «поставь количество»: сначала «2», потом «3».
      На экране сразу видно «3», всё выглядит хорошо.

      Через секунду на экране вдруг появляется «2». Покупатель не понимает, что произошло, нажимает «+» ещё раз и в итоге
      оформляет заказ не на то количество, которое хотел. А если открыть корзину на другом устройстве, там может оказаться
      вообще другое число.

      Причина в том, что два запроса ушли почти одновременно и шли к серверу и обратно независимо друг от друга. Ответ
      на первый запрос пришёл позже ответа на второй и затёр его. Никто в коде не ошибся в одной строке: ошибка в том,
      что программа молча рассчитывала на порядок, которого никто не обещал.

      В этом уроке разберём, откуда берутся такие ошибки, почему отмена запроса не отменяет действие на сервере
      и какие есть четыре способа навести порядок.

      ## Что такое гонка

      **Состояние гонки** (race condition) — ситуация, когда результат зависит от того, в каком порядке завершатся
      несколько одновременных операций, а этот порядок никто не контролирует. Если повезло с порядком — всё работает,
      не повезло — данные портятся. Поэтому гонки так трудно ловить: на быстром рабочем компьютере в офисе их почти
      не видно, а на телефоне в метро они случаются каждый день.

      Почему порядок не гарантирован? Браузер отправляет несколько запросов параллельно, и каждый идёт своим путём.
      Один запрос может задержаться в сети, попасть на загруженный сервер или дождаться медленного ответа базы данных.
      В итоге есть три разных порядка, и они не обязаны совпадать:

      1. порядок, в котором клиент **отправил** запросы;
      2. порядок, в котором сервер их **выполнил**;
      3. порядок, в котором клиент **получил** ответы.

      Гонки бывают двух видов, и вред от них разный.

      - **Устаревший ответ** (stale response) — ответ на запрос, который уже не отражает текущее желание пользователя.
        Человек ввёл в поиске «пи», потом дописал «пицца», а список «для пи» пришёл последним и встал поверх
        правильного.
        - Где вред: только на экране этого человека, на сервере ничего не испортилось.
        - Поможет ли перезагрузка страницы: да.
        - Где встречается: поиск, смена вкладки, фильтр.
      - **Конкурирующие записи** (concurrent writes) — два изменения одних и тех же данных, отправленные до того, как
        подтвердилось первое. Их могут отправить одна вкладка (два быстрых нажатия), две вкладки или два разных человека.
        - Где вред: в данных на сервере — сохранится не то значение, и это увидят все.
        - Поможет ли перезагрузка страницы: нет, на сервере уже не то значение.
        - Где встречается: количество в корзине, название блюда, статус задачи.

      С устаревшими ответами на чтение вы уже знакомы по уроку «Лишние и одинаковые запросы»: там разобрано, как
      отменять ненужные запросы и игнорировать ответы, которые опоздали. Документация React показывает тот же приём
      для загрузки в эффекте: функция очистки ставит флаг `ignore`, и ответ для прежнего значения отбрасывается, даже
      если пришёл позже нового ([раздел «Получение данных»](https://ru.react.dev/learn/synchronizing-with-effects#fetching-data)).
      Здесь мы сосредоточимся на том, что этого приёма недостаточно, когда запрос что-то меняет.

      ## Отменить ожидание — не значит отменить действие

      В браузере запрос можно прервать: `AbortController` передаёт в `fetch` сигнал, и после вызова `abort()` промис
      запроса отклоняется с ошибкой `AbortError`. Легко решить, что это и есть отмена операции. Это не так.

      `abort()` говорит браузеру: «я больше не жду ответа». Но запрос к этому моменту мог уже дойти до сервера, и сервер
      мог его выполнить. Сервер не узнаёт, что клиент передумал ждать, и не откатывает сделанное. Отменяется
      **ожидание на клиенте**, а не **эффект на сервере** — то изменение, которое запрос успел произвести.

      Пример из доставки. Покупатель сменил адрес доставки, запрос завис, и он нажал «Отмена». Если после этого
      показать «Адрес не изменился», это может оказаться неправдой: сервер, возможно, уже сохранил новый адрес, и курьер
      поедет туда. Честное состояние после прерванной записи — «неизвестно». Правильный следующий шаг — спросить у
      сервера, какой адрес сейчас сохранён, и показать именно его.

      То же верно для любого другого способа перестать ждать. Клиент прервал запрос по тайм-ауту, человек закрыл
      вкладку, телефон потерял сеть — во всех этих случаях заканчивается только ожидание на клиенте. Если запрос
      успел уйти, сервер мог его получить и выполнить, а мог ещё выполнять в тот момент, когда клиент сдался.

      Для чтения это неважно: прерванная загрузка списка ничего не меняет. Для записи важно всегда. Отсюда правило:
      **после прерванной записи нельзя показывать ни «не сохранилось», ни «сохранено» — нужно выяснить у сервера**.
      Какие ещё сбои дают такой неизвестный исход, как его выяснять и как безопасно повторять записи, разберём в уроке
      «Повторы без двойных списаний».

      ## Почему для записей мало «взять последний ответ»

      Вернёмся к корзине. Допустим, мы применили приём из урока «Лишние и одинаковые запросы»: экран принимает только
      ответ на последний запрос, а ответ на «2» игнорирует. На экране теперь правильно — «3». Но что на сервере?

      Запросы «2» и «3» шли независимо. Если запрос «3» добрался до сервера раньше, сервер сначала сохранит «3», а потом
      «2». В базе останется два, хотя на экране три. Покупатель обновит страницу или откроет корзину на телефоне — и
      увидит «2». Мы исправили картинку, но не данные.

      Вывод: в гонке записей нужно навести порядок там, где данные хранятся, а не только там, где они показываются.

      ## Четыре стратегии

      Способов навести порядок четыре. Какой выбрать, зависит от **инварианта** (invariant) — правила, которое должно
      выполняться всегда, что бы ни случилось с сетью. Например: «на экране то же количество, что на сервере»; «правка
      одного менеджера не должна молча стереть правку другого»; «отметка одного человека в списке не стирает отметку
      другого».

      ### Брать последнее

      **Брать последнее** (take-latest): из нескольких запросов важен только последний, ответы на все предыдущие
      отбрасываются, а сами запросы по возможности отменяются. В библиотеке RxJS так работает оператор
      [`switchMap`](https://rxjs.dev/api/operators/switchMap): получив новое значение, он перестаёт выдавать результаты
      прежнего запроса и переключается на новый. Поэтому приём иногда так и называют.

      Гарантирует одно: экран показывает ответ на последний запрос. Подходит для чтения: поиск, фильтры, переключение
      вкладок, выбор ресторана в списке. Для записей защищает только экран, как мы видели выше.

      ### Очередь

      **Очередь** (serialize — «выполнять по одному»): следующий запрос уходит только после того, как пришёл ответ на
      предыдущий. Гарантия: сервер получает изменения одной вкладки ровно в том порядке, в каком их сделал человек.

      Наивная очередь медленная: десять быстрых нажатий превратятся в десять запросов подряд, и последний уйдёт через
      несколько секунд. Поэтому очередь обычно **схлопывают** (coalesce): пока один запрос в пути, клиент помнит только
      последнее желаемое значение, а промежуточные выбрасывает. В пути всегда не больше одного запроса и в ожидании —
      не больше одного значения.

      Очередь наводит порядок только внутри одной вкладки. Второй вкладке и другому человеку она не поможет — они
      ничего не знают о вашей очереди.

      ### Проверка версии

      **Проверка версии** (version check): у данных на сервере есть номер версии, который растёт при каждом изменении.
      Клиент отправляет вместе с изменением номер версии, которую он видел. Если на сервере версия уже другая, значит,
      кто-то успел изменить данные раньше, и сервер отказывает. Клиент перечитывает свежие данные и решает, что делать
      дальше. Такой подход называют **оптимистичной блокировкой** (optimistic locking, или optimistic concurrency
      control): данные никто не блокирует заранее, конфликт обнаруживают в момент записи. Гарантия: никто не
      перезапишет чужое изменение молча.

      Проверка версии ловит гонки между вкладками, устройствами и людьми — там, где очередь бессильна. Цена — отказы:
      если правок много, люди будут часто видеть «данные изменились, обновите». Как устроены версии в HTTP и что
      показывать человеку при конфликте, подробно разобрано в уроке «Версии и конфликты».

      ### Слияние

      **Слияние** (merge): изменения устроены так, что их порядок не важен, и сервер просто применяет все. Вместо
      «поставь количество 3» клиент шлёт «добавь одну пиццу»; вместо «вот весь список отмеченных пунктов» — «отметь
      пункт 7». Два таких изменения в любом порядке дают один и тот же результат. Такие операции называют
      **коммутативными** — их можно переставлять местами. Гарантия: применяются все изменения, в каком бы порядке
      они ни пришли.

      Не путайте это со «слиянием по полям» из урока «Версии и конфликты»: там сравнивают две версии одной записи, а здесь
      заранее меняют форму операции, чтобы сравнивать ничего не пришлось.

      Цена — не всё можно так выразить: название блюда нельзя «сложить» из двух разных правок. И у операций вида «добавь
      одну» есть опасность: если запрос повторится из-за сбоя сети, пицц станет на одну больше. Об этом — в уроке
      «Повторы без двойных списаний».

      ### Сравнение

      - **Брать последнее**
        - Когда подходит: чтение — поиск, фильтры.
        - Цена: записи на сервере не упорядочены.
      - **Очередь**
        - Когда подходит: быстрые правки одного человека.
        - Цена: задержка; помогает только внутри одной вкладки.
      - **Проверка версии**
        - Когда подходит: правки разных людей и устройств.
        - Цена: отказы при частых правках.
      - **Слияние**
        - Когда подходит: счётчики, отметки, наборы.
        - Цена: подходит не для всех данных; повторы опасны.

      Стратегии сочетаются. Очередь внутри вкладки и проверка версии на сервере хорошо дополняют друг друга: первая
      убирает гонки с самим собой, вторая — с другими.

      ## Пример целиком: количество в корзине

      Разберём корзину от начала до конца. Условия: покупатель часто нажимает «+» несколько раз подряд; мобильная сеть
      отвечает за 300–900 миллисекунд; покупатель вошёл в аккаунт, и корзину иногда открывают с двух устройств;
      сервер — владелец корзины, а клиент хранит её копию (об этом — урок курса 1 «Кто главный по данным»).

      ### Что происходит без защиты

      Покупатель трижды нажимает «+» за полсекунды: количество 1 → 2 → 3 → 4. Уходят три запроса: «поставь 2»,
      «поставь 3», «поставь 4».

      | Время | Событие |
      |---|---|
      | 0 мс | Ушёл запрос «2» |
      | 200 мс | Ушёл запрос «3» |
      | 400 мс | Ушёл запрос «4» |
      | 600 мс | Пришёл ответ на «2» — экран показывает 2 |
      | 900 мс | Пришёл ответ на «4» — экран показывает 4 |
      | 1300 мс | Пришёл ответ на «3» — экран показывает 3 |

      Запрос «3» где-то задержался. Если он задержался по дороге к серверу, то и на сервере последним записалось «3».
      Покупатель хотел четыре пиццы, видит три, и на сервере тоже три.

      ![Схема: клиент слева, сервер справа; запросы «поставь 3» и «поставь 4» уходят по порядку, но запрос «3» задерживается; сервер сначала сохраняет 4, потом 3; ответ «3» приходит последним и затирает на экране «4»](images/sdd-race.png "Два ответа пришли не в том порядке")

      ### Решение по шагам

      **Шаг 1. Экран показывает намерение сразу.** Число на экране меняется при нажатии, не дожидаясь сервера. Так
      устроены оптимистичные обновления — им посвящён следующий урок.

      **Шаг 2. Очередь со схлопыванием.** Первый запрос «2» уходит сразу. Пока он в пути, покупатель нажимает ещё дважды;
      клиент запоминает только последнее значение — «4». Когда пришёл ответ на «2», уходит «4». Вместо трёх запросов —
      два, и сервер получает их по порядку.

      **Шаг 3. Не принимать устаревший ответ сервера.** Ответ на «2» приходит, когда покупатель уже хочет «4». Если
      показать этот ответ, число на экране мигнёт назад. Поэтому ответ применяется, только если за время ожидания
      не появилось нового значения.

      **Шаг 4. Другие устройства.** Очередь не знает о втором телефоне. Если корзину правят на двух устройствах, к
      запросу добавляется версия **этой строки** корзины. Правки разных строк с двух устройств не мешают друг другу,
      а две правки одной строки сервер заметит и откажет второй; при отказе клиент перечитывает корзину и показывает
      свежие данные.

      Набросок шагов 2 и 3 — без обработки ошибок, она появится в следующем уроке:

      ```ts
      let inFlight = false;            // запрос сейчас в пути
      let pending: number | null = null; // последнее значение, которое ещё не отправлено

      function setQuantity(qty: number) {
        pending = qty;                 // запоминаем только последнее желание
        if (!inFlight) flush();
      }

      async function flush() {
        if (pending === null) return;
        const qty = pending;
        pending = null;
        inFlight = true;
        try {
          const cart = await api.putQuantity(itemId, qty);
          if (pending === null) showCart(cart); // новее желания нет — показываем ответ сервера
        } finally {
          inFlight = false;
          flush();                     // пока ждали, появилось новое значение — отправляем его
        }
      }
      ```

      ### Почему не слияние

      Можно было бы отправлять «добавь одну» вместо «поставь 4»: порядок тогда не важен, и очередь не нужна. Но
      у корзины есть кнопка «−», есть ограничение «не больше 10 порций», а главное — повтор такого запроса после сбоя
      добавит лишнюю пиццу. Для корзины «поставь N» с очередью проще и надёжнее. Для счётчика лайков под отзывом,
      наоборот, слияние подошло бы лучше: там важна сумма всех нажатий всех людей.

      Это не противоречит правилу курса 1 из урока «Чтение, запись и реакция интерфейса»: команда несёт намерение,
      а не результат. «Поставь количество 4 у строки „Маргарита“» — тоже намерение: оно касается одной строки,
      а не всей корзины, и не стирает строки, добавленные с другого устройства. Результатом была бы команда «вот вся
      корзина целиком» — именно она теряла пиццу или салат в примере курса 1.

      ## Типичные ошибки

      - **Рассчитывать, что ответы придут в порядке отправки.** На быстрой сети так обычно и бывает, поэтому ошибку
        не видно, пока не придут жалобы с телефонов.
      - **Считать, что `abort()` отменил изменение.** Он отменил только ожидание. После прерванной записи исход
        неизвестен, и его нужно узнать у сервера.
      - **Защищать записи приёмом для чтения.** «Показывать только последний ответ» исправляет экран, но на сервере
        может остаться старое значение.
      - **Надеяться на задержку перед отправкой.** Если отправлять изменение через полсекунды после последнего нажатия
        (debounce из урока «Лишние и одинаковые запросы»), запросов станет меньше, но гонка останется: человек
        сделает паузу, нажмёт ещё раз — и два запроса снова окажутся в пути одновременно.
      - **Очередь без схлопывания.** Каждое нажатие ждёт своей очереди, и последнее значение доходит до сервера через
        несколько секунд.
      - **Очередь вместо проверки версии там, где правят разные люди.** Очередь одной вкладки ничего не знает о других.

      ## Как спрашивают на интервью

      - «Пользователь быстро нажимает „+“, а количество на экране прыгает. Что происходит и как это исправить?» — ждут,
        что вы различите гонку ответов и гонку записей и предложите очередь со схлопыванием.
      - «Чем отмена запроса через `AbortController` отличается от отмены операции?»
      - «Два менеджера одновременно меняют одно и то же поле. Какие есть стратегии и как вы выберете?»

      ## Коротко

      - Состояние гонки — это ситуация, когда результат зависит от порядка завершения одновременных операций, а этот
        порядок никто не обещал. Порядок отправки, выполнения на сервере и получения ответов не обязаны совпадать.
      - Устаревший ответ портит только экран и лечится перезагрузкой, а конкурирующие записи портят данные на сервере,
        и это видят все.
      - `abort()` отменяет ожидание на клиенте, а не эффект на сервере. После прерванной записи нельзя показывать ни
        «сохранено», ни «не сохранилось» — исход выясняют у сервера.
      - «Брать последний ответ» исправляет экран, но не данные: если запросы пришли на сервер не по порядку, там
        останется старое значение. Порядок в записях наводят там, где данные хранятся.
      - Стратегию выбирают по инварианту: брать последнее (take-latest) — для чтения, очередь со схлопыванием — для
        быстрых правок одного человека в одной вкладке, проверку версии (оптимистичная блокировка) — для правок разных
        людей и устройств, ценой отказов.
      - Слияние коммутативными операциями вроде «добавь одну» подходит счётчикам, отметкам и наборам, но такая
        операция опасна при повторе после сбоя. Очередь и проверка версии хорошо дополняют друг друга: первая убирает
        гонки с самим собой, вторая — с другими.
      - Debounce перед записью гонку не убирает: после паузы два запроса снова могут оказаться в пути одновременно.
      - Команда несёт намерение, а не результат, и «поставь количество N у строки» — тоже намерение: оно касается
        одной строки и не стирает строки, добавленные с другого устройства.

      ## Источники

      - [Синхронизация с эффектами, раздел «Получение данных» — документация React](https://ru.react.dev/learn/synchronizing-with-effects#fetching-data)
      - [AbortController — MDN](https://developer.mozilla.org/ru/docs/Web/API/AbortController)

  - id: sdd-optimistic
    topic: Изменения и согласованность
    subtopic: Оптимистичные изменения
    title: Оптимистичные обновления
    audio: https://color-zebra.github.io/frontend-quiz-audio/system-design-data/sdd-optimistic.mp3
    body: |
      ## Какую проблему решаем

      Покупатель в сервисе доставки листает меню и нажимает «В корзину» у «Маргариты». На мобильной сети ответ сервера
      приходит через 600–800 миллисекунд. Если всё это время на кнопке крутится спиннер, а счётчик корзины не меняется,
      человек решает, что нажатие не сработало, и нажимает ещё раз. В корзине оказываются две пиццы. Даже если
      он подождёт, приложение ощущается вязким: каждое действие — маленькая пауза.

      Сервер при этом соглашается почти всегда: блюдо добавляется в корзину в подавляющем большинстве случаев. Возникает
      естественная идея — не ждать: сразу показать пиццу в корзине, а запрос отправить в фоне. Если сервер подтвердит,
      ничего делать не нужно. Если откажет — вернуть всё как было и сказать об этом.

      Идея простая, но в ней много подвохов. Что именно «вернуть как было», если за это время человек добавил ещё
      колу? Что делать, если ответа нет вовсе? А главное — какие действия так делать нельзя? Этим и займёмся.

      ## Понятия

      - **Мутация** (mutation) — так в библиотеках работы с данными называют запрос на изменение: добавить, удалить,
        переименовать. Слово пригодится при чтении документации TanStack Query и похожих библиотек.
      - **Пессимистичное обновление** (pessimistic update) — интерфейс меняется только после того, как сервер
        подтвердил изменение. Честно, но медленно.
      - **Оптимистичное обновление** (optimistic update) — интерфейс меняется сразу, в расчёте на то, что сервер
        согласится, а запрос идёт в фоне. Быстро, но иногда приходится признаваться, что показали неправду.
      - **Подтверждение** (confirmation) — ответ сервера о том, что изменение принято, обычно с итоговыми данными:
        настоящим идентификатором, пересчитанной суммой, временем.
      - **Откат** (rollback) — возврат интерфейса к правде, когда сервер отказал.

      Важно помнить урок курса 1 «Кто главный по данным»: владелец корзины — сервер. Оптимистичное изменение — это
      предположение клиента о том, что скажет владелец, а не новое решение. Последнее слово всегда за сервером.

      ## Жизненный цикл оптимистичного изменения

      У оптимистичного изменения есть чёткие шаги. Пропуск любого из них даёт свою, узнаваемую ошибку.

      1. **Намерение.** Человек нажал кнопку.
      2. **Подготовка.** Остановить загрузки этих же данных, которые сейчас в пути: иначе старый ответ придёт позже и
         затрёт оптимистичное изменение. Это та же гонка, что в уроке «Гонки запросов». Заодно запомнить, как
         откатиться, если сервер откажет.
      3. **Применение.** Изменить то, что видит человек. Хорошо пометить такие данные как «ожидающие»: строку
         чуть бледнее или с маленьким значком.
      4. **Отправка** запроса на сервер.
      5. **Исход.** Их три:
         - **подтверждено** — заменить оптимистичные данные ответом сервера: сервер мог что-то пересчитать (скидку,
           итог) и выдал настоящий идентификатор;
         - **отказано** — сервер ответил отказом с понятной причиной: блюдо в стоп-листе, нет прав, неверные данные.
           Откатиться, понятно сообщить, что не получилось, и, если причина устранима, предложить повторить. Как
           показать такую ошибку действия, разобрано в уроке курса 1 «Загрузка, пустота, ошибка и всё между ними»;
         - **неизвестно** — ответа нет (тайм-аут, обрыв связи) или сервер ответил внутренней ошибкой вроде 500,
           после которой непонятно, что он успел сделать. Молча откатывать нельзя: изменение могло пройти.
           Нужно узнать правду у сервера. Подробно — в уроке «Повторы без двойных списаний».
      6. **Сверка.** После любого исхода перечитать данные с сервера, чтобы копия на клиенте совпала с правдой.
         Как сделать это аккуратно, не затерев более новые данные, — урок «Кэш после изменения».

      Шаги «ожидает → подтверждено, отказано или неизвестно» — это маленький конечный автомат, о которых шла речь
      в уроке курса 1 «Процесс как набор состояний».

      ### Где живёт оптимистичное изменение

      Документация TanStack Query описывает два места.

      - **Только в интерфейсе.** Компонент, который отправил запрос, сам рисует «ожидающую» строку из отправленных
        данных, пока запрос в пути. Запрос закончился — временная строка исчезает, и её место занимают настоящие
        данные. Откатывать ничего не нужно.
      - **В кэше данных.** Клиент сразу меняет общую копию данных, и изменение видят все компоненты, которые её
        читают. При отказе копию нужно вернуть самому.

      | | Только в интерфейсе | В кэше данных |
      |---|---|---|
      | Откат | Не нужен | Нужен |
      | Где видно | В одном месте | Везде: список, счётчик, итог |
      | Код | Проще | Сложнее |

      Если изменение видно в одном месте, проще первый вариант. Для корзины, где добавленная пицца должна сразу появиться
      и в списке, и в счётчике, и в итоговой сумме, нужен второй. В React есть хук `useOptimistic`: он показывает
      оптимистичное состояние, пока выполняется действие, и возвращается к настоящему, когда действие закончено.

      ## Три способа откатиться

      Если сервер отказал, интерфейс нужно вернуть к правде. Способов три.

      **Снимок** (snapshot rollback). Перед изменением сохранить копию данных целиком, при отказе вернуть её. Так
      по умолчанию предлагает делать документация TanStack Query: в обработчике начала мутации сохраняется предыдущее
      значение, в обработчике ошибки оно возвращается.

      **Обратная операция** (inverse operation). Отменить только это изменение: добавили строку — удалить именно её;
      увеличили счётчик — уменьшить; переименовали — вернуть старое имя.

      **Перечитывание** (refetch). Ничего не вычислять самому, а спросить у сервера, как на самом деле.

      Сравним их:

      - **Снимок**
        - Что даёт: просто.
        - Цена: стирает и соседние успешные изменения.
      - **Обратная операция**
        - Что даёт: отменяет ровно одно изменение.
        - Цена: для каждого действия нужна своя отмена.
      - **Перечитывание**
        - Что даёт: показывает правду сервера.
        - Цена: задержка; без сети не работает; экран мигает.

      На практике способы сочетают: сразу откатиться снимком или обратной операцией, чтобы человек не видел неправду,
      а затем перечитать данные, чтобы убедиться.

      ### Когда изменений несколько

      Самое коварное место — несколько оптимистичных изменений одновременно.

      **Снимок стирает чужое.** Покупатель добавил «Маргариту» — снимок корзины A сохранён (пустая корзина). Через
      секунду добавил колу — снимок B сохранён (корзина с «Маргаритой»). Сервер добавил колу, а «Маргариту» отклонил:
      её только что поставили в стоп-лист. Клиент возвращает снимок A — пустую корзину. Кола исчезла с экрана, хотя на
      сервере она есть. Обратная операция «убрать строку „Маргарита“» такой ошибки не даёт.

      **Перечитывание мигает.** Первое изменение подтвердилось, клиент перечитывает корзину, а второе ещё в пути.
      Сервер отдаёт корзину без второго изменения, и оно на мгновение пропадает с экрана, а потом возвращается.
      Доминик Дорфмайстер, один из разработчиков TanStack Query, советует перечитывать данные только тогда, когда
      закончилось последнее из изменений этих данных.

      ## Где оптимизм уместен, а где опасен

      Оптимистичное обновление — это обещание, которое иногда приходится взять назад. Поэтому вопрос не «быстрее ли»,
      а «что будет, если обещание не сбудется».

      Оптимизм уместен, когда:
      - сервер соглашается почти всегда;
      - ложный успех на пару секунд ничего не стоит и легко исправляется;
      - результат известен заранее, его не вычисляет сервер;
      - человек не сделает ничего необратимого, поверив, что действие удалось;
      - на ложный успех не опираются другие люди и реальный мир: увидев изменение, никто ничего не закажет, не начнёт
        готовить и никуда не поедет.

      Оптимизм опасен, когда нарушено хотя бы одно из этих условий.

      Как это выглядит в сервисе доставки:

      - **Блюдо в корзину или в избранное** — да: почти всегда успешно.
      - **Переименовать адрес «Дом»** — да: ошибка ничего не стоит.
      - **Применить промокод** — нет: скидку считает сервер.
      - **Оплатить заказ** — нет: поверив «Оплачено», человек уйдёт.
      - **Занять слот доставки на 19:00** — нет: отказы часты, слоты разбирают.
      - **Ресторан поставил блюдо в стоп-лист** — нет: покупатели продолжат заказывать.

      Последний пункт — про кабинет ресторана. У повара кончилось тесто, и сотрудник ставит пиццу в стоп-лист. Если
      экран сразу показал «В стоп-листе», а запрос не прошёл, сотрудник займётся другими делами, а покупатели продолжат
      заказывать пиццу, которую не из чего приготовить. На это изменение опирается не только тот, кто нажал, но и
      другие люди.

      Для опасных действий есть честная середина: показать не результат, а процесс — «Оплачиваем…», «Проверяем
      промокод…». Человек видит, что нажатие сработало, и не нажимает ещё раз, но приложение не врёт об итоге. О том,
      как такие состояния помогают не терять работу пользователя, — урок «Как не потерять работу пользователя».

      ## Отмена действия: кнопка «Отменить»

      Раньше перед удалением спрашивали «Вы уверены?». Люди привыкают нажимать «Да» не читая, и вопрос перестаёт
      защищать. Удобнее другое: сразу удалить и на несколько секунд показать плашку «Позиция удалена. Отменить».
      Пример — [«Отмена отправки» в Gmail](https://support.google.com/mail/answer/2819488?hl=ru): в настройках
      выбирают окно в 5, 10, 20 или 30 секунд. Google не описывает, как это устроено внутри. Но достать письмо
      из чужого почтового ящика нельзя, поэтому такая отмена возможна только как отложенная отправка — первый
      из двух способов ниже.

      Это тоже оптимистичное изменение: строка исчезает с экрана сразу. Устроить отмену можно двумя способами.

      **Отложенное выполнение** (deferred execution). Клиент прячет строку у себя, а запрос на удаление отправляет
      только тогда, когда окно отмены закрылось. Нажали «Отменить» — строка возвращается, сервер ни о чём не узнал.

      **Обратная операция.** Клиент сразу отправляет удаление. «Отменить» отправляет второй запрос — «восстановить».
      Для этого сервер должен удалять **мягко** (soft delete): ставить пометку «удалено», а не стирать запись,
      и уметь эту пометку снимать.

      Сравним оба способа:

      - **Отложенное выполнение**
        - Отмена: точная, сервер ничего не делал.
        - От сервера: ничего нового не нужно.
        - Другие люди: ещё несколько секунд видят то, что удаляют.
        - Закрыли вкладку: действие может потеряться.
        - Следующее действие: сначала нужно выполнить отложенное.
        - Письма и уведомления: ещё не ушли.
      - **Обратная операция**
        - Отмена: второй запрос, который может не пройти.
        - От сервера: мягкое удаление.
        - Другие люди: видят изменение сразу.
        - Закрыли вкладку: ничего не теряется.
        - Следующее действие: можно сразу.
        - Письма и уведомления: уже ушли.

      Пункт «Следующее действие» важен. Пока окно отмены открыто, на сервере ничего не изменилось. Если следующее
      действие человека зависит от удаления — оформление заказа, отправка, выгрузка отчёта, — клиент сначала досрочно
      отправляет все отложенные изменения, дожидается ответа и только потом выполняет новое действие.

      Отложенное выполнение — единственный вариант, когда действие нельзя взять назад: отправленное письмо из чужого
      ящика не достать. Обратная операция нужна, когда изменение должны сразу увидеть другие: ресторан убрал блюдо
      из меню — покупатели не должны успеть его заказать.

      Если выбрали отложенное выполнение, заранее решите, что будет при закрытии вкладки. Можно попытаться отправить
      запрос при уходе со страницы, но надёжной гарантии это не даёт. Значит, действие должно быть таким, что его потеря
      не страшна.

      ## Пример целиком: позиция в корзине

      Соберём всё на корзине. Условия: покупатель вошёл в аккаунт, и корзина хранится на сервере; добавление почти
      всегда проходит; изредка блюдо оказывается в стоп-листе; покупатель часто добавляет несколько блюд подряд;
      итог со скидкой считает сервер.

      **Добавление — оптимистично, в кэше, с обратной операцией.**

      1. Покупатель нажимает «В корзину» у «Маргариты» за 695 ₽. Клиент останавливает загрузку корзины, если она
         в пути.
      2. В корзину сразу добавляется строка с временным идентификатором и пометкой «ожидает». Счётчик в шапке — «1»,
         итог — «695 ₽», но итог помечен «уточняется»: скидку посчитает сервер.
      3. Через полсекунды покупатель добавляет колу — второе изменение, вторая временная строка.
      4. Сервер подтверждает колу: клиент заменяет временную строку настоящей, с идентификатором от сервера.
      5. Сервер отклоняет «Маргариту»: она в стоп-листе. Клиент убирает именно эту строку (обратная операция) и
         показывает «„Маргарита“ закончилась». Кола остаётся.
      6. Когда изменений в пути больше нет, клиент перечитывает корзину и показывает итог от сервера.

      ```ts
      async function addToCart(dish: Dish) {
        const tempId = crypto.randomUUID();
        cart.addLine({ ...dish, id: tempId, pending: true });  // сразу показываем
        try {
          const line = await api.addLine(dish.id);              // отправляем
          cart.replaceLine(tempId, line);                       // подтверждено: берём данные сервера
        } catch (error) {
          if (isRejected(error)) {
            cart.removeLine(tempId);                            // отказ: убираем только эту строку
            toast(`Не удалось добавить «${dish.name}»`);
          } else {
            cart.markUnknown(tempId);                           // ответа нет: исход неизвестен, выясняем
          }
        } finally {
          if (noMutationsInFlight()) cart.refetch();            // сверка, когда всё закончилось
        }
      }
      ```

      Обратите внимание на временный идентификатор. Пока сервер не ответил, строку нельзя, например, удалить запросом
      по её идентификатору: сервер такого не знает. Либо кнопки у ожидающей строки недоступны, либо клиент дожидается
      подтверждения и потом отправляет удаление с настоящим идентификатором.

      **Удаление позиции — с «Отменить» и отложенным выполнением.** Корзину видит только сам покупатель, а потеря
      удаления при закрытой вкладке безвредна: позиция просто останется в корзине, и человек увидит её при следующем
      открытии. Поэтому окно в 5 секунд и запрос после него.

      И одно обязательное правило. Покупатель удалил колу и тут же нажал «Оформить». Окно отмены ещё открыто, и
      на сервере кола по-прежнему в корзине. Если оформить заказ сразу, сервер оформит и колу, которую человек уже
      убрал. Поэтому кнопка «Оформить» сначала отправляет все отложенные удаления, ждёт ответа и только потом создаёт
      заказ. Плашка «Отменить» при этом закрывается: передумать после оформления уже нельзя.

      **Оформление и оплата — без оптимизма.** Кнопка показывает «Оплачиваем…» и ждёт сервера. Почему именно так и как
      не списать деньги дважды — следующий урок.

      ## Типичные ошибки

      - **Не остановить загрузки, которые уже в пути.** Старый ответ приходит после оптимистичного изменения и стирает
        его — изменение «пропадает» на глазах.
      - **Снимок при нескольких изменениях подряд.** Откат одного стирает с экрана остальные, успешные.
      - **Откатывать молча.** Сердечко «лайка» тихо погасло, человек этого не заметил и уверен, что лайк стоит.
      - **Принимать тайм-аут за отказ.** Изменение могло пройти, а клиент его откатил и предложил «повторить» — и вот
        уже два одинаковых изменения.
      - **Не заменять оптимистичные данные ответом сервера.** На экране остаются временный идентификатор и итог без
        скидки, следующий запрос ссылается на несуществующую строку.
      - **Оптимизм там, где результат решает сервер** — оплата, промокод, бронь последнего места.
      - **«Отменить» с отложенным выполнением без плана на закрытие вкладки.**
      - **Отложенное удаление и сразу следующее действие.** Человек удалил позицию и нажал «Оформить», пока окно
        отмены открыто, — заказ уходит с позицией, которую он убрал.

      ## Как спрашивают на интервью

      - «Как сделать „лайк“ мгновенным? Что будет, если запрос не прошёл?» — ждут
        откат с понятным сообщением и отдельный ответ на случай, когда исход неизвестен.
      - «Человек удалил письмо и нажал „Отменить“. Как это устроено на клиенте и на сервере?»
      - «Какие действия вы не стали бы делать оптимистично и почему?»

      ## Коротко

      - Оптимистичное обновление меняет интерфейс сразу, в расчёте на согласие сервера, а запрос идёт в фоне. Это
        предположение о решении владельца, а не новое решение: последнее слово за сервером.
      - Перед применением останавливают загрузки этих же данных, чтобы старый ответ не затёр изменение, и запоминают,
        как откатиться. После любого исхода данные сверяют с сервером.
      - При подтверждении оптимистичные данные заменяют ответом сервера (настоящий id, пересчитанный итог), а при
        отказе откатываются и понятно сообщают об этом. При неизвестном исходе молча не откатывают — изменение могло
        пройти, — а выясняют правду у сервера.
      - Изменение, видное в одном месте, можно держать только в интерфейсе, и откат не нужен. Изменение, видное везде
        — в списке, счётчике и итоге, — меняют в кэше и откатывают сами.
      - При нескольких изменениях подряд откат снимком стирает соседние успешные, поэтому берут обратную операцию.
        Перечитывают данные, только когда закончилось последнее изменение этих данных.
      - Оптимизм уместен, когда сервер почти всегда соглашается, ложный успех дёшев, результат известен заранее и на
        этот успех не опираются ни необратимые действия, ни другие люди. Для оплаты, промокода и стоп-листа показывают
        процесс: «Оплачиваем…».
      - «Отменить» вместо «Вы уверены?» делают отложенным выполнением, если действие нельзя взять назад, и обратной
        операцией с мягким удалением на сервере, если изменение должны сразу увидеть другие. Отложенное может
        потеряться при закрытии вкладки, поэтому его потеря должна быть не страшна.
      - Пока окно отмены открыто, на сервере ничего не изменилось, поэтому перед зависимым действием, например
        «Оформить», отложенные изменения сначала отправляют.

      ## Источники

      - [Optimistic Updates — документация TanStack Query](https://tanstack.com/query/latest/docs/framework/react/guides/optimistic-updates)
      - [useOptimistic — документация React](https://ru.react.dev/reference/react/useOptimistic)
      - [Concurrent Optimistic Updates in React Query — Dominik Dorfmeister](https://tkdodo.eu/blog/concurrent-optimistic-updates-in-react-query)

  - id: sdd-idempotency
    topic: Изменения и согласованность
    subtopic: Идемпотентность и повторы
    title: Повторы без двойных списаний
    audio: https://color-zebra.github.io/frontend-quiz-audio/system-design-data/sdd-idempotency.mp3
    body: |
      ## Какую проблему решаем

      Покупатель оформил заказ на 1 840 ₽ и нажал «Оплатить», стоя в лифте. Связь пропала, спиннер крутится, через
      30 секунд приложение пишет «Ошибка сети. Попробуйте ещё раз». Он выходит из лифта и нажимает «Оплатить» снова.
      Через минуту приходят две эсэмэски от банка: списано 1 840 ₽, списано 1 840 ₽.

      Что произошло? Первый запрос дошёл до сервера, и оплата прошла. Потерялся только ответ — по дороге обратно.
      Приложение решило, что ничего не получилось, и предложило повторить. Повтор честно выполнил оплату ещё раз.

      Та же беда случается и без лифта: человек дважды щёлкнул по кнопке, нажал Enter и тут же кнопку мышью, вернулся
      «Назад» и отправил форму снова, а библиотека запросов сама повторила запрос после обрыва связи. Курс 1 в уроке
      «Контракт API глазами фронтенда» говорил, что однократная оплата — гарантия сервера, а не фронтенда. Здесь
      разберём, как эта гарантия устроена и что должен сделать клиент, чтобы ею воспользоваться.

      ## Безопасные и идемпотентные запросы

      Начнём с того, какие запросы повторять можно. Стандарт HTTP (RFC 9110) делит методы по двум свойствам.

      **Безопасный метод** (safe method) — запрос только читает данные: клиент не просит сервер ничего менять.
      Безопасные методы — `GET`, `HEAD`, `OPTIONS` и `TRACE`.

      **Идемпотентный метод** (idempotent method) — несколько одинаковых запросов дают на сервере тот же эффект, что
      один. Идемпотентны `PUT`, `DELETE` и все безопасные методы. Слово пришло из математики. Устоявшийся бытовой
      пример приводит [статья «Idempotence» в Википедии](https://en.wikipedia.org/wiki/Idempotence#Applied_examples) —
      кнопка вызова лифта: нажмёте её второй раз, и лифт не приедет дважды. Где пример ломается: у лифта кнопка
      загорается, и видно, что вызов принят. Клиент после обрыва связи как раз не видит, дошёл ли запрос, — в этом
      и вся трудность.

      Тонкость: одинаковым должен быть **эффект**, а не ответ. Первый `DELETE /addresses/7` удалит адрес и ответит
      «удалено», второй ответит «не найдено» — но в обоих случаях адреса больше нет. А `POST` и `PATCH` идемпотентными
      по определению не считаются: `POST /orders` дважды — это два заказа.

      **Побочный эффект** (side effect) — изменение, которое остаётся после запроса: списанные деньги, созданный заказ,
      отправленное письмо. Повторять запросы с побочным эффектом опасно, если не знать, выполнился ли первый.

      Стандарт прямо говорит, зачем нужно это деление. Идемпотентный запрос можно автоматически повторить, если связь
      оборвалась раньше, чем клиент прочитал ответ: результат будет тем же, даже если первый запрос прошёл.
      А неидемпотентный запрос клиенту **не следует** повторять автоматически, если он не знает, что повтор безопасен,
      или не может проверить, что первый запрос не выполнился.

      Важно: идемпотентность — обещание сервера, а не свойство слова в начале запроса. Если сервер на `PUT` делает
      «добавить одну», повтор добавит ещё одну. Поэтому смысл операции важнее метода: «поставь количество 3»
      идемпотентно, «добавь одну» — нет (вспомните слияние из урока «Гонки запросов»).

      ## Три исхода запроса

      Когда клиент отправил запрос на изменение, возможны три исхода.

      | Исход | Что видит клиент | Что на сервере |
      |---|---|---|
      | Успех | Ответ «готово» | Сделано |
      | Отказ | Ответ с причиной | Не сделано |
      | Неизвестно | Нет ответа, 5xx | Что угодно |

      **Успех** — сервер ответил, что изменение сделано (коды 2xx).

      **Отказ** — сервер ответил, что запрос не выполнил, и назвал причину: неверные данные, нет прав, карта отклонена,
      блюдо закончилось. Обычно это ответы с кодами 4xx. Исключение — 409, которым сервер отвечает на повтор с ключом,
      пока первая попытка ещё выполняется: это не отказ, а «подождите» (см. ниже, шаг 5 работы ключа). В остальных
      случаях клиент знает, что ничего не изменилось, и может честно написать «не получилось» и объяснить почему.
      Так же ясно, что ничего не изменилось, если запрос заведомо не отправлялся: например, приложение само не стало
      его отправлять, потому что сети не было.

      **Неизвестный исход** — клиент не знает, выполнил ли сервер запрос. Сюда попадает:

      - **тайм-аут** (timeout) — клиент сам решил перестать ждать, как с `abort()` из урока «Гонки запросов»; сервер
        об этом ничего не знает;
      - **обрыв связи** — `fetch` отклонился с сетевой ошибкой, но связь могла оборваться уже после того, как запрос
        ушёл: потерялся только ответ;
      - **500** — сервер сломался посреди работы и мог успеть что-то сделать. Документация Stripe прямо советует считать
        такой ответ на запрос оплаты неопределённым исходом;
      - **502 и 504** — ответил не сам сервер приложения, а промежуточный: шлюз или балансировщик. 504 значит, что он
        не дождался ответа основного сервера, 502 — что получил от него негодный ответ. Основной сервер при этом мог
        операцию выполнить.

      Для записи безопаснее считать неизвестным исходом любой ответ 5xx, если API прямо не обещает обратного.

      За неизвестным исходом могут скрываться три разные истории:

      1. запрос не дошёл до сервера — ничего не произошло;
      2. запрос дошёл и выполнился, но потерялся ответ — деньги списаны;
      3. запрос ещё выполняется — деньги вот-вот спишутся.

      Клиент не может отличить их друг от друга. Отсюда главное правило: **после неизвестного исхода нельзя показывать
      ни «не получилось», ни «готово» и нельзя предлагать начать заново**. Честно показать «Проверяем оплату…»
      и выяснить правду. Как именно — разберём ниже, после ключа идемпотентности.

      ## Ключ идемпотентности

      **Ключ идемпотентности** (idempotency key) — уникальная строка, которую клиент придумывает для одной операции
      и отправляет вместе с запросом, обычно в заголовке `Idempotency-Key`. Сервер по ключу узнаёт повторы одной и
      той же операции. В курсе 1, в уроке «Процесс как набор состояний», это был идентификатор операции
      (`operationId`) в запросе оформления заказа; здесь разберём, как такой ключ работает на сервере и где его
      границы.

      Как это работает на примере Stripe — платёжного сервиса, чья документация считается образцом:

      1. Клиент создаёт ключ — например, случайный UUID версии 4 — и отправляет `POST` с этим ключом.
      2. Сервер начинает выполнять запрос и запоминает: «ключ такой-то — вот ответ, код и тело». Запоминается и ответ
         с ошибкой, даже 500.
      3. Пришёл запрос с тем же ключом. Сервер не выполняет операцию заново, а возвращает сохранённый ответ.
      4. Если параметры повтора отличаются от первого запроса (другая сумма), сервер отвечает ошибкой: один ключ — одна
         операция.
      5. Если запрос с этим ключом ещё выполняется, второй получает ответ 409 «конфликт». Это не отказ, а «подождите»:
         запрос можно повторить чуть позже с тем же ключом.
      6. Ключ хранится не меньше 24 часов (так в основной версии API Stripe; у других сервисов срок свой). Запрос
         со старым ключом после этого может выполниться как новая операция.

      ![Схема: клиент создаёт ключ K и отправляет «оплатить, ключ K»; ответ теряется по дороге; клиент повторяет запрос с тем же ключом K; сервер находит K в журнале ключей и возвращает сохранённый ответ «оплачено», не списывая деньги второй раз](images/sdd-idempotency.png "Путь ключа идемпотентности")

      На клиенте это выглядит так:

      ```ts
      // Ключ создаётся один раз — когда человек начал оплату этого заказа.
      // Каждая попытка оплатить этот же заказ использует тот же ключ.
      async function pay(orderId: string, amount: number, key: string) {
        const response = await fetch(`/api/orders/${orderId}/payments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Idempotency-Key': key },
          body: JSON.stringify({ amount }),
        });
        return response.json();
      }
      ```

      Единого стандарта для этого заголовка нет, но приём используют многие платёжные и не только платёжные API.
      Stripe, например, помечает повторно отданный ответ заголовком `Idempotent-Replayed: true`.

      ### Как выяснить неизвестный исход

      Способов два, и работают они в разных случаях.

      **Повтор с тем же ключом.** Подходит после тайм-аута, обрыва связи и ответов 502–504. Если первый запрос не дошёл, сервер выполнит
      операцию сейчас — один раз. Если выполнил, вернёт сохранённый ответ. Если ещё выполняет, ответит конфликтом
      (409), и через паузу можно повторить снова.

      **Запрос статуса.** Клиент спрашивает у сервера не «оплати», а «оплачен ли заказ № 5521?». Без него не обойтись
      в трёх случаях:

      - **после ответа 500.** Сервер вроде Stripe сохранил этот ответ вместе с ключом, и повтор с тем же ключом вернёт
        [тот же сохранённый 500](https://docs.stripe.com/error-low-level#server-errors). Повторять бесполезно:
        клиент будет вечно показывать «Проверяем оплату…»;
      - **если API ключей не принимает;**
      - **если ключ уже мог истечь** — например, приложение открыли через двое суток.

      У статуса есть ловушка. Ответ «оплаты нет» ещё не окончательный: первый запрос мог застрять у сервера и выполниться
      через минуту. Окончательным он становится, когда сервер прямо сообщает, что попытка завершена («оплата не прошла»),
      или когда прошло время, за которое сервер гарантированно завершает или отменяет операцию. Это время — часть
      контракта API, его стоит обсудить с бэкендом. До тех пор интерфейс показывает «Проверяем…» и спрашивает ещё раз.

      И главное: **новый ключ берут только тогда, когда исход прежней попытки известен.** Новый ключ — это новая
      операция, и если старая тоже прошла, деньги спишутся дважды. Так советует и документация Stripe.

      ## Границы ключа

      Ключ идемпотентности защищает не от всего. Вот его границы — и что из них следует для клиента.

      - **Один ключ — одно намерение.** Ключ создаётся, когда человек решил выполнить операцию, и один и тот же
        используется во всех повторах. Новый ключ на каждую попытку — то же самое, что никакого ключа.
      - **Изменили данные — это новая операция.** Человек решил оплатить заказ другой картой — это другие
        параметры. Старый ключ с новыми параметрами сервер отклонит. Но и новый ключ нельзя брать сразу: сначала
        нужно выяснить, чем кончилась первая попытка — прошла, отказана или ещё выполняется. Иначе заказ оплатят
        дважды, с обеих карт.
      - **Ключ должен пережить перезагрузку.** Если ключ живёт только в памяти страницы, человек обновит её посреди
        оплаты — и получит новый ключ. Ключ хранят вместе с операцией: в хранилище браузера рядом с номером заказа или
        выводят из идентификатора, который уже есть у сервера. Stripe предлагает и такой способ: строить ключ
        из идентификатора объекта, например корзины.
      - **Срок хранения ключа.** Повтор через двое суток с тем же ключом сервер может принять за новую операцию. Если
        исход так и не выяснился, нужно узнать его другим путём — запросом статуса.
      - **Это механизм сервера.** Если API ключи не поддерживает, клиент один сделать операцию идемпотентной не может.
        Он может только снизить вероятность повтора и проверять статус перед повтором. Значит, требование «ключ
        идемпотентности для оплаты и создания заказа» нужно согласовать с командой бэкенда при проектировании API.

      ### Естественная идемпотентность

      Иногда отдельный ключ не нужен: операцию можно сформулировать так, что повтор безвреден по смыслу. «Оплатить
      заказ № 5521» — сервер знает, что заказ уже оплачен, и второй раз не спишет. «Поставь количество 3» вместо «добавь
      одну». «Отметь уведомление 42 прочитанным». Это хороший первый шаг, но для создания новых объектов — заказа,
      перевода, сообщения — без ключа не обойтись: у ещё не созданного объекта нет номера, по которому сервер узнает
      повтор.

      ## Двойная отправка

      **Двойная отправка** (double submit) — одно намерение человека превращается в два запроса. Источники разные,
      и каждый способ защиты закрывает только часть из них.

      - **Двойной щелчок, Enter и кнопка мышью**
        - Блокировка кнопки: защищает.
        - Ключ идемпотентности: защищает.
      - **Повтор после обрыва связи**
        - Блокировка кнопки: не защищает.
        - Ключ идемпотентности: защищает.
      - **Перезагрузка и новое нажатие**
        - Блокировка кнопки: не защищает.
        - Ключ идемпотентности: защищает, если ключ сохранён.
      - **Вторая вкладка с тем же заказом**
        - Блокировка кнопки: не защищает.
        - Ключ идемпотентности: защищает, если ключ общий для вкладок.

      Ключ общий для двух вкладок, если он выведен из номера заказа или лежит в `localStorage`, которое видят все
      вкладки сайта. У `sessionStorage` своё содержимое в каждой вкладке.

      **Блокировка кнопки** — самый простой слой. Кнопку блокируют **сразу при первом нажатии**, в том же обработчике,
      ещё до отправки запроса. Двойной щелчок занимает доли секунды, и кнопка, которая блокируется «через секунду
      ожидания», успеет отправить два запроса. Надпись «Оплачиваем…» можно показать с небольшой задержкой, чтобы она
      не мигала на быстрых ответах, но сама блокировка не ждёт. Человек видит, что нажатие сработало, и не жмёт второй
      раз. Но это только интерфейс: от повторов после обрыва, перезагрузки и второй вкладки блокировка не спасает.

      **Ключ идемпотентности** — главный слой: сервер узнаёт повтор, откуда бы он ни пришёл.

      **Проверка статуса** — слой на случай неизвестного исхода: прежде чем предлагать «Оплатить ещё раз», спросить
      у сервера, оплачен ли заказ.

      Надёжная защита — все три слоя вместе.

      ## Пример целиком: оплата заказа

      Соберём оплату в сервисе доставки. Условия: связь у покупателей бывает плохой; API поддерживает ключи
      идемпотентности и отдаёт статус заказа; оплата идёт через платёжный сервис.

      1. Покупатель нажимает «Оформить». Клиент создаёт ключ K1 и отправляет `POST /orders` с ключом. Даже двойной
         щелчок не создаст два заказа. Сервер отвечает: заказ № 5521, статус «создан», 1 840 ₽.
      2. Покупатель нажимает «Оплатить». Клиент создаёт ключ K2 и сохраняет его рядом с номером заказа в хранилище
         браузера. Кнопка становится недоступной сразу, в момент нажатия, на ней — «Оплачиваем…».
      3. Клиент отправляет `POST /orders/5521/payments` с ключом K2. Покупатель в лифте: через 15 секунд клиент
         прекращает ждать.
      4. Интерфейс пишет не «Ошибка», а «Проверяем оплату…». Клиент повторяет тот же запрос с тем же ключом K2 —
         один раз сразу, потом с паузами, когда связь вернётся (как выбирать паузы — урок «Когда и как повторять»).
         Если бы вместо тайм-аута пришёл ответ 500, повтор с K2 вернул бы тот же 500. Тогда клиент сразу спрашивает
         статус заказа № 5521 и повторяет вопрос, пока статус не станет окончательным.
      5. Связь вернулась. Сервер видит ключ K2: оплата уже прошла, вот сохранённый ответ «оплачено». Деньги второй
         раз не списываются. Интерфейс показывает «Заказ оплачен».
      6. Если бы первый запрос не дошёл, сервер выполнил бы оплату сейчас — тоже один раз.
      7. Если покупатель, пока ждал, решил оплатить другой картой, клиент сначала узнаёт статус заказа № 5521.
         Оплачен — вторая оплата не нужна. Если сервер подтвердил, что попытка с K2 завершилась без оплаты, для
         оплаты другой картой создаётся новый ключ. Пока статус не окончательный, новый ключ не создаётся.

      Покупатель может и закрыть приложение на шаге 4. Когда он вернётся, клиент найдёт в хранилище ключ K2 и номер
      заказа, спросит статус и покажет правду, а не пустую корзину с кнопкой «Оплатить».

      ## Варианты и их цена

      - **Блокировка кнопки сразу при нажатии**
        - От чего защищает: двойной щелчок.
        - Цена: почти ничего не стоит, но не спасает от повторов, перезагрузки и второй вкладки.
      - **Ключ идемпотентности**
        - От чего защищает: любые повторы одной операции, откуда бы они ни пришли.
        - Цена: нужна поддержка сервера; ключ надо хранить и вовремя менять; после сохранённого 500 повтор не поможет.
      - **Естественная идемпотентность**
        - От чего защищает: повторы операций над уже существующим объектом.
        - Цена: не годится для создания новых объектов.
      - **Проверка статуса**
        - От чего защищает: повтор уже выполненной операции; выручает после 500 и истёкшего ключа.
        - Цена: нужен запрос статуса в API; ответ «нет» не окончателен, пока операция может ещё выполняться.

      ## Типичные ошибки

      - **Новый ключ на каждую попытку.** Сервер видит разные операции и выполняет каждую.
      - **Ключ только в памяти страницы.** После перезагрузки — новый ключ и новая оплата.
      - **Одна блокировка кнопки.** Защищает от двойного щелчка, но не от повтора после обрыва связи.
      - **Блокировка с задержкой.** Кнопка блокируется через секунду ожидания — двойной щелчок успевает отправить два
        запроса.
      - **Бесконечный повтор после 500 с тем же ключом.** Сервер каждый раз возвращает сохранённый 500. Выяснить исход
        можно только запросом статуса.
      - **Автоматический повтор `POST` без ключа.** Обёртки над запросами и библиотеки повторов иногда повторяют любые
        запросы при сетевой ошибке. Для записи без ключа это прямой путь к двойному списанию.
      - **«Ошибка, попробуйте ещё раз» после тайм-аута.** Исход неизвестен, а кнопка предлагает начать новую операцию.
      - **Тот же ключ для другой операции.** Сумма изменилась, а ключ прежний: сервер вернёт ошибку несовпадения или,
        если сравнивать параметры не умеет, — старый результат.
      - **Вера в метод.** «Это же `PUT`, значит, повторять можно» — только если сервер действительно делает «поставь»,
        а не «добавь».

      ## Как спрашивают на интервью

      - «Как сделать так, чтобы деньги не списались дважды, если человек дважды нажал „Оплатить“?» —
        ждут три слоя: блокировку кнопки, ключ идемпотентности и проверку статуса.
      - «Запрос оплаты завершился тайм-аутом. Что показать пользователю и что делать дальше?»
      - «Какие методы HTTP идемпотентны и что это значит на практике?»

      ## Коротко

      - Безопасный метод только читает, идемпотентный даёт тот же эффект при повторе (`PUT`, `DELETE` и все
        безопасные). `POST` и `PATCH` стандарт не считает идемпотентными, и автоматически их не повторяют, если повтор
        не защищён.
      - Идемпотентность — обещание сервера про эффект, а не свойство метода и не одинаковый ответ: «поставь 3»
        идемпотентно, «добавь одну» — нет.
      - Неизвестный исход записи дают тайм-аут, обрыв связи, 500, 502 и 504, а если API прямо не обещает обратного,
        безопаснее считать так любой 5xx. После него нельзя показывать ни «не получилось», ни «готово» и нельзя
        предлагать начать заново: честно показать «Проверяем оплату…» и выяснить исход.
      - Ключ идемпотентности — уникальная строка одной операции, обычно в заголовке `Idempotency-Key`. Сервер по ключу
        узнаёт повтор и возвращает сохранённый ответ; Stripe сохраняет даже 500 и отклоняет тот же ключ с другими
        параметрами, а сервер, который параметры не сравнивает, вернёт старый результат.
      - Пока первая попытка выполняется, сервер отвечает на повтор 409, и это не отказ, а «подождите»: через паузу
        повторяют с тем же ключом. Ключ хранится ограниченное время, у Stripe — не меньше суток.
      - После тайм-аута, обрыва и 502–504 исход выясняют повтором с тем же ключом, а запросом статуса — после 500, а
        также когда API ключей не принимает или ключ мог истечь. Ответ «оплаты нет» окончателен, только когда сервер
        сообщил, что попытка завершена, или прошло обещанное API время.
      - Один ключ — одно намерение, и новый ключ берут, только когда исход прежней попытки известен. Ключ хранят так,
        чтобы он пережил перезагрузку, а поддержку ключей согласуют с бэкендом при проектировании API.
      - От двойной отправки защищают три слоя вместе: блокировка кнопки сразу при нажатии (только от двойного щелчка),
        ключ идемпотентности (любые повторы, после перезагрузки — если ключ сохранён, во второй вкладке — если он
        общий) и проверка статуса перед новой попыткой.

      ## Источники

      - [RFC 9110, раздел 9.2.2 «Idempotent Methods»](https://www.rfc-editor.org/rfc/rfc9110.html#name-idempotent-methods)
      - [Idempotent requests — документация Stripe API](https://docs.stripe.com/api/idempotent_requests)
      - [Advanced error handling, раздел «Idempotency» — документация Stripe](https://docs.stripe.com/error-low-level#idempotency)

