title: 'Системный дизайн: практика'
lessons:
  - id: sdp-intro
    topic: Введение
    subtopic: Архитектурное интервью
    title: Как устроено архитектурное интервью
    body: |
      ## Какую проблему решаем

      За шесть курсов вы узнали десятки механизмов: кэш и его свежесть, версии и конфликты, виртуализацию, SSE
      и WebSocket, журнал операций, предохранитель, микрофронтенды. Но на собеседовании вас не спросят «что такое
      stale-while-revalidate». Вам скажут: «Спроектируйте ленту новостей», — и дадут час.

      Знание механизмов здесь необходимо, но его мало. Типичная неудача выглядит так. Кандидат знает всё, но через
      минуту после условия начинает рисовать компоненты, через десять минут спорит о выборе библиотеки
      состояния, а за пять минут до конца выясняет, что лента должна работать без сети, — и схему приходится
      перечёркивать. Каждое его утверждение по отдельности верно, а интервью провалено.

      Этот курс — практика: как провести архитектурный разговор по незнакомой задаче. Новых механизмов здесь
      нет, есть умение применить известные.

      ## Что такое архитектурное интервью

      **Архитектурное интервью по фронтенду** (front end system design interview) — разговор на 45–60 минут,
      в котором кандидат проектирует клиентскую часть продукта, а интервьюер играет роль заказчика и коллеги:
      отвечает на вопросы, добавляет условия, спорит. Кода обычно почти нет — обсуждают решения и их цену.

      Чем такой дизайн отличается от бэкенда, уже было в курсе 1, в уроке «Что такое системный дизайн фронтенда»:
      главные ограничения — сеть, слабое устройство и возможности браузера, а сервер обычно остаётся чёрным ящиком,
      о гарантиях которого нужно договориться. Поэтому на фронтенд-интервью обычно не ждут схемы базы данных,
      выбора между SQL и NoSQL и масштабирования серверов — так прямо пишет Front End Interview Handbook.

      Задачи бывают двух видов:

      - **компонент** — выбор даты, строка поиска с подсказками, модальное окно, таблица данных. Здесь важны
        API компонента, состояния, доступность и поведение на краях;
      - **приложение** — лента новостей, чат, совместный редактор, сервис бронирования. Здесь важны части системы,
        данные и их владелец, контракт API, работа с сетью и сбоями.

      ## Что оценивает интервьюер

      Правильного ответа у задачи нет: подходящих решений несколько, и у каждого своя цена (курс 1, «Как
      сравнивать решения»). Поэтому оценивают не ответ, а ход рассуждения. Руководство GreatFrontEnd называет
      шесть шкал оценки:

      1. **Исследование задачи** — уточнил ли кандидат требования и границы, прежде чем проектировать.
      2. **Архитектура** — разбита ли система на части с понятной ответственностью и связями.
      3. **Техническая грамотность** — верно ли применены механизмы фронтенда: сеть, скорость, доступность,
         безопасность.
      4. **Варианты и компромиссы** — названы ли альтернативы, их плюсы и минусы, и выбрано ли решение по условиям.
      5. **Продуктовое чутьё** — подумал ли кандидат о человеке: загрузка, ошибки, медленная сеть, телефон,
         клавиатура.
      6. **Общение** — понятно ли кандидат объясняет, слушает ли интервьюера и меняет ли решение по его доводам.

      Там же сказано главное правило: интервьюер оценивает только то, что произнесено вслух. Если вы подумали
      о компромиссе, но не сказали о нём, для оценки его не было.

      ## Как выглядит час

      Обычный ход разговора:

      - **первые минуты** — знакомство и условие задачи, нарочно короткое и неполное;
      - **основная часть** — кандидат уточняет требования, рисует схему, описывает данные и API, разбирает трудные
        сценарии. Интервьюер по ходу добавляет условия: «А если пользователей в сто раз больше?», «А если сеть
        пропадает?»;
      - **последние минуты** — вопросы кандидата о компании и команде.

      Как распределить время внутри основной части — урок «План ответа и время». Как отвечать на новые условия
      и возражения — урок «Защита решения».

      ## Как устроен курс

      - **Два урока о ведении интервью:** план ответа и время, защита решения.
      - **Семь разборов кейсов,** от компонента до растущего продукта. Каждый разбор — одна задача, решённая
        целиком по плану ответа. Механизмы в разборах не объясняются заново: разбор называет механизм и урок
        прошлого курса, где он объяснён. Вопросы после разбора проверяют решения в ключевых точках.
      - **Отдельный устный набор «Системный дизайн: практика — устные кейсы»:** задачи для самостоятельного решения. Решите задачу
        вслух или на бумаге, потом откройте эталонный план ответа и оцените себя по тезисам. Это тренировка,
        а не учебник: эталон — сжатый вывод, и учиться по нему с нуля не выйдет.

      ## Типичные ошибки

      - **Проектировать, не уточнив требования.** Через полчаса выясняется, что решалась другая задача.
      - **Молчать.** Интервьюер не видит рассуждений и оценивает только сказанное.
      - **Искать «правильный ответ».** Кандидат угадывает, что хочет услышать интервьюер, вместо того чтобы
        вывести решение из условий.
      - **Уходить в инструменты.** Спор «Redux или Zustand» съедает время и не показывает архитектурного мышления.
      - **Рисовать только счастливый путь.** Медленная сеть, ошибки и сбои — то, ради чего фронтенду нужен
        системный дизайн.

      ## Как спрашивают на интервью

      - «Спроектируйте компонент выбора даты для дизайн-системы» — задача на компонент.
      - «Спроектируйте ленту новостей» или «Спроектируйте чат» — задача на приложение.
      - «Как бы вы это изменили, если…» — проверка того, как кандидат адаптирует решение.

      ## Коротко

      - Архитектурное интервью по фронтенду — разговор на 45–60 минут, где кандидат проектирует клиентскую часть
        продукта, а интервьюер играет заказчика и добавляет условия. Задачи бывают на компонент и на приложение.
      - Правильного ответа нет, поэтому оценивают ход рассуждения: исследование задачи, архитектуру, техническую
        грамотность, варианты и компромиссы, продуктовое чутьё и общение.
      - Интервьюер оценивает только то, что сказано вслух: рассуждения, допущения и компромиссы нужно проговаривать.
      - Схема базы данных и масштабирование серверов на фронтенд-интервью обычно не нужны, а сеть, устройство,
        данные на клиенте, контракт API и сбои — нужны.

      ## Источники

      - [Evaluation axes — GreatFrontEnd, Front End System Design Playbook](https://www.greatfrontend.com/front-end-system-design-playbook/evaluation-axes)
      - [Front End System Design — Front End Interview Handbook](https://www.frontendinterviewhandbook.com/front-end-system-design)

  - id: sdp-framing
    topic: Как вести интервью
    subtopic: План ответа и время
    title: План ответа и время
    body: |
      ## Какую проблему решаем

      Час на интервью кажется большим сроком, но кончается быстро. Вот как его часто тратят: десять минут — на
      рассказ о компонентах, которые никто не просил, пятнадцать — на спор о библиотеке состояния, ещё десять —
      на оптимизацию картинок. До трудных сценариев — обрыва сети, конфликтов, нагрузки — кандидат не доходит,
      а именно по ним интервьюер понимает, какого он уровня.

      Урок о плане ответа: в каком порядке вести разговор, сколько времени давать каждой части, как делать
      допущения и как возвращать разговор к главному.

      ## Пять частей ответа

      В курсе 1, во вводном уроке, уже был назван план RADIO из руководства GreatFrontEnd и Front End Interview
      Handbook: требования (Requirements), схема (Architecture), модель данных (Data model), интерфейсы (Interface)
      и оптимизации с углублением (Optimizations). Этот курс пользуется тем же порядком, только последнюю часть
      делит на две: трудные места разбирают отдельно от компромиссов.

      1. **Требования.** Что делает человек и что важно в продукте. Функции — главные сценарии; качества —
         скорость, работа на медленной сети и без неё, устройства, доступность, языки; масштаб — сколько людей,
         данных, событий. В конце — что входит в первую версию, а что откладываем. Как спрашивать — курс 1, уроки
         «Как выяснять требования», «Как превратить „быстро“ в цифры» и «Что войдёт в первую версию».
      2. **Схема.** Части клиента и их связи: кто за что отвечает, откуда приходят данные, где граница с сервером.
         Сервер — чёрный ящик, но у каждой стрелки есть подпись (курс 1, «Как рисовать архитектуру»). Схему сразу
         проверяют: проходят по ней главные сценарии из требований.
      3. **Данные и контракт API.** Какие сущности есть, кто владелец каждой и где она живёт на клиенте (курс 1,
         «Кто главный по данным»). Какие запросы и ответы, как устроены списки и ошибки, что гарантирует сервер
         (курс 1, «Контракт API глазами фронтенда»).
      4. **Критические сценарии.** Два–четыре места, где эта система ломается: медленная сеть, обрыв, гонка
         запросов, большой объём данных, конфликт правок, отказ сервиса. Руководство GreatFrontEnd советует брать
         то, что особенно важно для этого продукта, а не общий список оптимизаций.
      5. **Компромиссы.** Что выбрали, чем заплатили, какая была альтернатива и при каком условии решение
         пересмотрели бы — формула из курса 1, «Как сравнивать решения».

      Порядок — не закон. Если на третьем шаге выяснилось новое требование, возвращаются к схеме: GreatFrontEnd
      прямо советует пересматривать прошлые шаги, когда появилось новое понимание.

      ![План ответа на 45 минут: требования — 5 минут, схема — 10, данные и API — 10, критические сценарии и компромиссы — 15–20, запас — до 5; под каждой частью — что должно остаться на доске: список требований и первая версия, схема с подписанными стрелками, сущности с владельцами и запросы, два-четыре сценария с решением и ценой](images/sdp-framing.png "План ответа и время")

      ## Сколько времени на что

      Руководство GreatFrontEnd предлагает такие доли: требования — около 10 %, схема — около 20 %, модель данных —
      около 10 %, интерфейсы — около 20 %, углубление — около 40 %. Для 45 минут чистого времени это выглядит так:

      | Часть | Минуты |
      |---|---|
      | Требования | 5 |
      | Схема | 10 |
      | Данные и API | 10 |
      | Сценарии и компромиссы | 15–20 |
      | Запас | до 5 |

      Главное здесь — пропорция, а не точные минуты. Почти половина времени уходит на трудные места, потому что
      именно они показывают уровень. Требования занимают мало времени, но их нельзя пропустить: без них остальные
      сорок минут могут уйти на другую задачу.

      Время проверяют по ходу: «Прошло 15 минут, а мы ещё в схеме — сокращаю API до главных запросов».

      ## Допущения без ложной точности

      Интервьюер часто не даёт чисел. Тогда кандидат называет допущение сам — и говорит, что от него зависит.

      - **Плохо:** «У нас будет 12 437 запросов в секунду». Точное число, взятое из воздуха, звучит как выдумка
        и ничего не объясняет.
      - **Хорошо:** «Допустим, одновременно открыто десятки тысяч экранов. Тогда опрос раз в 30 секунд даст порядка
        тысячи запросов в секунду — это уже повод подумать о SSE. Если экранов сотни, хватит опроса». Нагрузка
        опроса — число экранов, делённое на интервал, — уже была в курсе 1, «Как превратить „быстро“ в цифры».

      Хорошее допущение состоит из трёх частей: порядок величины, что от него зависит в решении и что изменится,
      если оно неверно. Порядка величины — десятки, тысячи, миллионы — почти всегда достаточно.

      ## Как возвращать разговор к главному

      Разговор уходит в сторону сам: интервьюер задал уточняющий вопрос, кандидат увлёкся деталью. Помогают
      три приёма.

      - **Отложить вслух.** «Кэш картинок — интересная тема, запишу её в „потом“ и вернусь, если останется время».
        На доске заводят колонку для отложенного.
      - **Связать с требованием.** «Это важно, потому что главное требование — работа на слабом телефоне. Значит,
        дальше разберём размер JavaScript». Деталь, которую не к чему привязать, обычно и не нужна.
      - **Спросить интервьюера.** «Я могу углубиться в синхронизацию или в доступность — что вам интереснее?»
        Интервьюер часто сам подскажет, что хочет проверить.

      ## Пример целиком: первые 15 минут

      Задача: «Спроектируйте страницу ресторана в сервисе доставки». Сервис вам знаком по прошлым курсам, поэтому
      удобно смотреть именно на ход разговора.

      **Минуты 0–5, требования.** Кандидат спрашивает:
      - «Кто открывает страницу и откуда?» — «Покупатели, в основном с телефонов; много переходов из поиска
        и из мессенджеров по ссылке».
      - «Что на ней главное?» — «Меню и добавление в корзину».
      - «Как часто меняется меню?» — «Цены и стоп-лист — несколько раз в день, описание — редко».
      - «Есть ли цели скорости?» — «Страница должна быстро открываться на телефоне».

      Кандидат записывает: главное — меню и корзина; переходы из поиска и мессенджеров — значит, важны поисковики
      и превью ссылки; LCP до 2,5 секунды на телефоне; стоп-лист меняется в течение дня. Первая версия — без отзывов
      и рекомендаций.

      **Минуты 5–15, схема.** Страница, корзина, слой данных, сервер; рядом — CDN. Кандидат проводит по схеме
      сценарий «открыть страницу и добавить блюдо» и замечает пропущенное звено: страницу видят поисковики, значит,
      HTML нужно отдавать готовым. Он говорит вслух: «Здесь есть выбор — собирать на сервере или заранее. Меню
      меняется несколько раз в день, поэтому склоняюсь к заранее собранной странице с перепроверкой стоп-листа
      на клиенте. Вернусь к этому в компромиссах».

      Через 15 минут на доске — список требований, первая версия, схема с подписанными стрелками и одна отложенная
      развилка с названными вариантами. Дальше — данные и API, затем трудные места: устаревший стоп-лист, медленная
      сеть, корзина гостя.

      ## Варианты и их цена

      - **Полный план на приложение**
        - Подходит: задача на приложение — лента, чат, сервис бронирования.
        - Цена: на компонент он слишком тяжёл — часть «схема» почти пустая.
      - **План на компонент**
        - Как: требования → API компонента (свойства, события, состояния) → поведение на краях → доступность →
          компромиссы.
        - Подходит: выбор даты, автодополнение, таблица.
        - Цена: легко забыть данные и сеть, если компонент ходит на сервер.
      - **Узкий вопрос** («как бы вы сделали бесконечную прокрутку?»)
        - Подходит: интервьюер сам задал фокус.
        - Цена: полный план здесь отнимет время; GreatFrontEnd прямо предостерегает от того, чтобы насильно
          натягивать план на узкий вопрос.

      ## Типичные ошибки

      - **Пропустить требования.** Решение отвечает на вопрос, который никто не задавал.
      - **Застрять в схеме.** Полчаса на квадраты, и на трудные места времени не остаётся.
      - **Точные числа из воздуха.** «12 437 запросов» вместо порядка величины и того, что от него зависит.
      - **Общий список оптимизаций.** «Сожмём картинки, добавим кэш, сделаем ленивую загрузку» — без связи
        с этим продуктом.
      - **Не возвращаться назад.** Новое требование меняет схему, а кандидат делает вид, что ничего не изменилось.

      ## Как спрашивают на интервью

      - «С чего вы начнёте?» — ждут уточнения требований, а не рисования.
      - «Сколько у вас пользователей?» в ответ на допущение — ждут порядок величины и то, что от него зависит.
      - «Давайте углубимся в…» — интервьюер сам выбирает трудное место; план гибкий.

      ## Коротко

      - План ответа: требования → схема → данные и контракт API → критические сценарии → компромиссы. Это порядок
        RADIO, где углубление разделено на трудные места и компромиссы. К прошлым шагам возвращаются, когда
        появилось новое понимание.
      - Почти половину времени отдают трудным местам этого продукта: по ним видно уровень. Требования занимают
        минуты, но без них остальное время может уйти на другую задачу.
      - Схему проверяют сразу, проводя по ней главные сценарии: так находят пропущенное звено.
      - Допущение называют порядком величины, говорят, что от него зависит в решении и что изменится, если
        оно неверно. Точные числа из воздуха звучат как выдумка.
      - Разговор возвращают к главному: откладывают деталь вслух, связывают её с требованием или спрашивают
        интервьюера, что ему интереснее.
      - Для компонента план другой: API компонента, поведение на краях и доступность вместо схемы системы, а узкий
        вопрос не требует полного плана.

      ## Источники

      - [The RADIO framework — GreatFrontEnd, Front End System Design Playbook](https://www.greatfrontend.com/front-end-system-design-playbook/framework)
      - [Front End System Design — Front End Interview Handbook](https://www.frontendinterviewhandbook.com/front-end-system-design)

  - id: sdp-defense
    topic: Как вести интервью
    subtopic: Защита решения
    title: Защита решения
    body: |
      ## Какую проблему решаем

      На тридцатой минуте интервьюер говорит: «Хорошо. А теперь пользователей стало в сто раз больше». Или:
      «А сервер не гарантирует порядок событий». Или просто: «Почему не WebSocket?»

      Кандидаты обычно ошибаются одним из двух способов. Первый — испугаться и начать схему заново, будто всё
      прошлое было неверным. Второй — упереться: «Моё решение правильное, в условии этого не было». В первом
      случае пропадают полчаса работы, во втором — шкала общения и продуктового чутья.

      Новые условия и возражения — не ловушка, а главная часть интервью: так интервьюер проверяет, понимает ли
      кандидат своё решение. Урок о том, как отвечать на них.

      ## Понятия

      - **Новое условие** — требование, которое интервьюер добавляет посреди разговора, чтобы проверить, как
        решение адаптируется.
      - **Неизвестная гарантия бэкенда** — то, от чего зависит решение, но что знает только сервер: сохраняет ли
        он порядок событий, защищает ли от повторов, отдаёт ли версию записи.
      - **Сценарий отказа** (failure mode) — что именно произойдёт, если часть системы откажет или поведёт себя
        не так, как ожидалось.
      - **Защита решения** — объяснение, почему выбран этот вариант, через требования, ограничения, инварианты,
        сценарии отказа и отвергнутые альтернативы.

      ## Новое условие: менять точечно

      Хорошо проведённые границы делают изменения дешёвыми (курс 1, «Как делить систему на части»), и на интервью
      это видно сразу. На новое условие отвечают по шагам:

      1. **Повторить и уточнить.** «В сто раз больше — это одновременно открытых экранов или заказов в день?»
         От ответа часто зависит, что вообще меняется.
      2. **Найти, что затронуто.** Пройти по схеме: какие стрелки и части касаются нового условия. Обычно это одна-две.
      3. **Сказать, что остаётся.** «Корзина, оформление и меню на CDN не меняются». Так интервьюер видит, что
         кандидат понимает границы своего решения.
      4. **Предложить точечное изменение и назвать его цену.**
      5. **Если условие несовместимо с прошлыми требованиями** — сказать об этом прямо и спросить, что важнее.
         Невозможные комбинации разобраны в курсе «Большие приложения», урок «Когда требования спорят».

      ## Неизвестная гарантия: назвать развилку

      Многие решения на клиенте зависят от того, что обещает сервер. На интервью сервер — чёрный ящик, и честный
      ответ звучит так: «Это зависит от гарантии сервера. Если она есть — так, если нет — иначе. Мне нужен вот такой
      контракт». Частые развилки:

      - **порядок событий:** если сервер не гарантирует порядок, клиент применяет событие по версии сущности
        и отбрасывает старое (курс «Реальное время и большие списки», урок «События: дубли и порядок»);
      - **защита от повторов:** если сервер принимает ключ идемпотентности, клиент повторяет запись после
        тайм-аута с тем же ключом; если нет — исход выясняют, а не повторяют вслепую (курс 2, «Повторы без двойных
        списаний»);
      - **версия записи:** если сервер отдаёт версию или `ETag`, правку отправляют с проверкой версии и ловят
        конфликт (курс 2, «Версии и конфликты»);
      - **продолжение списка:** курсор вместо номера страницы, если список меняется во время просмотра (курс 2,
        «Пагинация живых списков»).

      Сказать «нужен такой контракт» — не слабость, а сильный ход: кандидат показывает, что видит, где кончается
      ответственность клиента. Ошибкой было бы молча предположить удобную гарантию.

      ## Защита через доводы, а не через упорство

      Решение защищают четырьмя видами доводов:

      - **требования и ограничения:** «Страницу видят поисковики, поэтому HTML нужен готовым»;
      - **инварианты:** «Двойного заказа быть не может, поэтому повтор — только с тем же идентификатором операции»;
      - **сценарии отказа:** «Если сервис рекомендаций упадёт, каталог откроется без блока — он не на главном
        пути»;
      - **отвергнутые альтернативы:** «WebSocket рассматривал. Данные идут только от сервера к клиенту, а SSE
        работает поверх обычного HTTP, и для такого потока его хватает. Пересмотрю, если клиенту понадобится часто
        отправлять данные».

      Как отличить защиту от упрямства. Если интервьюер приносит **новый факт** — меняются условия, и решение
      пересматривают. Если он просто спрашивает «почему не Y?», это проверка: сравните X и Y по требованиям
      и скажите, при каком условии выбрали бы Y. Если довод интервьюера верен — признайте это: «Вы правы, при этом
      условии Y лучше, меняю». Поменять решение по доводу — плюс по шкале общения, а не минус.

      ## Пример целиком: два поворота

      Задача — экран отслеживания заказа в сервисе доставки. Кандидат предложил опрос статуса раз в 30 секунд:
      по требованию «узнать о смене статуса в пределах минуты» этого хватает.

      **Поворот 1.** Интервьюер: «А если одновременно открытых экранов станет в сто раз больше?»
      - Уточнение: «Сейчас в пик 20 тысяч экранов? Значит, будет два миллиона».
      - Что затронуто: только стрелка «экран → сервер статусов». Опрос дал бы 2 000 000 / 30 ≈ 67 тысяч запросов
        в секунду, почти все впустую — статус меняется раз в несколько минут.
      - Что остаётся: экран, его состояния, карта, контракт статуса.
      - Изменение: сервер сам присылает новые статусы через SSE, опрос остаётся запасным путём. Цена — открытые
        соединения на сервере и переподключение. Это та же история, что в курсе «Реальное время и большие списки»,
        урок «Как доставлять живые данные».

      **Поворот 2.** Интервьюер: «Сервер не гарантирует порядок событий».
      - Развилка: «Тогда событие „в пути“ может прийти раньше „готовится“. Если в событии есть версия заказа,
        клиент применяет только более новую и отбрасывает старую. Если версии нет — прошу её добавить в контракт:
        без неё клиент не отличит новое от старого».
      - Интервьюер: «А почему бы не сортировать по времени события?» Кандидат: «Часы серверов могут расходиться,
        а версию назначает один владелец заказа. Если сервер гарантирует единые часы, время подойдёт».

      Ни разу кандидат не начинал заново: каждый поворот затронул одну стрелку схемы.

      ## Варианты ответа и их цена

      - **Начать заново**
        - Когда уместно: условие ломает главное допущение всей схемы.
        - Цена: потерянное время; обычно это знак, что границы проведены неудачно.
      - **Точечное изменение**
        - Когда уместно: почти всегда.
        - Цена: нужно знать, какие части затронуты, — это и проверяют.
      - **Назвать развилку**
        - Когда уместно: решение зависит от гарантии, которой вы не знаете.
        - Цена: две ветки решения вместо одной; зато нет ложного допущения.
      - **Сказать о противоречии**
        - Когда уместно: новое условие несовместимо с прошлыми.
        - Цена: неловкость; зато честно и показывает понимание компромиссов.

      ## Типичные ошибки

      - **Перерисовать всё** на первое же новое условие.
      - **«Этого не было в условии».** Новые условия — нормальная часть интервью.
      - **Молча предположить удобную гарантию сервера.** Решение держится на том, чего, возможно, нет.
      - **Защищать решение «потому что так принято».** Довод должен опираться на требования, а не на привычку.
      - **Не признать верный довод.** Упорство против факта хуже, чем смена решения.

      ## Как спрашивают на интервью

      - «А если пользователей станет в сто раз больше?» — ждут, какие части затронуты и что меняется точечно.
      - «А если сервер не гарантирует порядок или может прислать дубль?» — ждут развилку и нужный контракт.
      - «Почему не X?» — ждут сравнение по требованиям и условие, при котором выбрали бы X.

      ## Коротко

      - Новые условия и возражения — главная часть интервью: так проверяют, понимает ли кандидат своё решение.
      - На новое условие отвечают точечно: уточнить, найти затронутые части схемы, сказать, что остаётся,
        и предложить изменение с ценой. Если условие несовместимо с прошлыми — сказать об этом и спросить, что важнее.
      - Если решение зависит от неизвестной гарантии сервера — порядка событий, защиты от повторов, версии
        записи, — называют развилку и контракт, который нужен, а не предполагают удобное молча.
      - Решение защищают требованиями и ограничениями, инвариантами, сценариями отказа и отвергнутыми
        альтернативами с условием пересмотра.
      - Новый факт — повод пересмотреть решение, вопрос «почему не Y?» — повод сравнить по требованиям. Поменять
        решение по верному доводу — плюс, а не минус.

      ## Источники

      - [Evaluation axes — GreatFrontEnd, Front End System Design Playbook](https://www.greatfrontend.com/front-end-system-design-playbook/evaluation-axes)
      - [The RADIO framework — GreatFrontEnd, Front End System Design Playbook](https://www.greatfrontend.com/front-end-system-design-playbook/framework)

  - id: sdp-datepicker
    topic: Разборы кейсов
    subtopic: Выбор даты
    title: 'Разбор: выбор даты'
    body: |
      ## Условие

      «Спроектируйте компонент выбора даты для дизайн-системы».

      Это задача на компонент, поэтому план ответа — вариант для компонента из урока «План ответа и время»:
      требования → API компонента → поведение на краях → доступность → компромиссы. Схема системы здесь почти
      не нужна, зато важны значение, события и клавиатура.

      ## Уточняем требования

      Кандидат спрашивает, интервьюер отвечает:

      - «Где будет использоваться?» — «Сервис продажи билетов на концерты. Компонент возьмут три команды
        на двенадцати экранах: фильтр концертов по дате, дата рождения в профиле, выбор дня в кабинете
        организатора».
      - «Одна дата или диапазон?» — «Пока одна».
      - «Можно ли вводить дату с клавиатуры текстом или только выбирать в календаре?» — «Нужно и то и другое».
      - «Какие языки и часовые пояса?» — «Русский и английский. Концерты в разных городах и поясах».
      - «Бывают ли недоступные даты?» — «Да: нельзя выбрать прошлое для концерта и будущее для даты рождения;
        у организатора есть дни, когда площадка занята».
      - «Требования к доступности?» — «Работа с клавиатуры и с экранным чтецом обязательна».
      - «Телефоны?» — «Больше половины покупателей — с телефонов».

      **Почему эти вопросы.** Каждый ответ двигает конкретное решение:
      - «Где будет использоваться?» — двенадцать экранов и три команды делают API публичным контрактом, который
        дорого менять;
      - «Одна дата или диапазон?» — решает тип значения, самое дорогое в API;
      - «Ввод текстом?» — добавляет разбор ввода и состояние ошибки;
      - «Языки и пояса?» — решает, в каком формате хранить значение и кто считает «сегодня»;
      - «Недоступные даты?» — решает, как компонент узнаёт правила, не зная продукта.

      **Первая версия:** одна дата; ввод текстом и выбор в календаре; минимальная и максимальная дата;
      отключённые дни по правилу, которое передаёт экран; русский и английский; клавиатура и экранный чтец.
      **Отложено:** диапазон дат, время, несколько календарей рядом.

      ## Оценки и допущения

      - **Двенадцать экранов и три команды** — значит, это публичный интерфейс модуля, и менять его потом дорого
        (курс 1, «Компонент как контракт»). API продумывают сразу.
      - **Половина покупателей на телефонах** — компонент не должен тащить тяжёлую библиотеку дат. Допущение:
        форматирование и названия месяцев берём у встроенного `Intl.DateTimeFormat` (курс «Доставка
        и качество», урок «Языки, валюты и часовые пояса»), а не у библиотеки с собственными локалями.
      - **Концерты в разных поясах** — значит, «8 марта» в фильтре — дата по месту концерта, как часы работы
        ресторана считают по ресторану (там же). Компонент о поясах не знает: он работает с календарной датой,
        а «сегодня» для `min` ему передаёт экран, посчитав его в поясе площадки. Когда в Москве 23:30,
        в Новосибирске уже 3:30 следующего дня: для концерта там «сегодня» — уже завтрашняя дата. Для фильтра
        по многим городам экран берёт самое раннее «сегодня» среди поясов, где есть концерты, а прошедшие концерты
        отсеивает сервер по моменту начала.

      ## Устройство компонента

      Компонент состоит из трёх частей:

      - **поле ввода** — дата текстом в формате языка интерфейса, с подсказкой формата;
      - **кнопка** «Выбрать дату» рядом с полем — открывает календарь;
      - **всплывающий календарь** — диалог с сеткой дней, переключением месяцев и годов.

      Внутри у компонента два вида состояния. **Значение** — выбранная дата, ею владеет экран, если компонент
      управляемый. **Состояние показа** — какой месяц открыт и на каком дне стоит фокус; оно живёт внутри
      компонента и никому снаружи не нужно.

      ![Экран передаёт компоненту value, min, max, isDateDisabled и locale и сам считает «сегодня» в поясе площадки; компонент возвращает onChange с календарной датой строкой; сетка и клавиатура — во внутреннем модуле, общем с компонентом диапазона](images/sdp-datepicker.png "Выбор даты: что идёт в компонент и обратно")

      ## API компонента

      ```ts
      type CalendarDate = string;          // '2026-03-08' — календарная дата без времени и пояса

      interface DatePickerProps {
        value?: CalendarDate | null;       // управляемый режим
        defaultValue?: CalendarDate | null;// неуправляемый режим
        onChange(value: CalendarDate | null): void;
        min?: CalendarDate;
        max?: CalendarDate;
        isDateDisabled?(date: CalendarDate): boolean;
        locale?: string;                   // по умолчанию — язык интерфейса
        label: string;                     // подпись для чтеца и для глаз
        error?: string;
      }
      ```

      Главные решения в этом API:

      - **Значение — календарная дата строкой, а не объект `Date`.** «8 марта» — это день в календаре, а не момент
        времени. Объект `Date` хранит момент — число миллисекунд от 1 января 1970 года по UTC. Своего часового пояса
        у него нет: при показе дату и время считают в поясе того устройства, где работает код. Почему это опасно —
        в первом критическом сценарии ниже.
      - **Оба режима — управляемый и неуправляемый,** но без переключения на ходу, как учит курс 1, урок
        «Компонент как контракт».
      - **Отключённые дни — функцией,** а не списком. Экран сам решает, какие дни недоступны: для даты рождения —
        будущее, для организатора — занятые дни. Так компонент не знает ни одного API продукта — это тот же
        приём, что `loadSuggestions` у поля адреса в курсе 1.
      - **`onChange` вызывается, когда дата выбрана или введена полностью,** а не на каждую букву в поле. Момент
        события — тоже часть контракта.

      ## Критические сценарии

      **1. Дата съезжает на день.** В JavaScript строка `'2026-03-08'` при разборе через `new Date()` считается
      полночью по UTC — так записано в стандарте, и MDN приводит это прямо. У человека в Нью-Йорке (UTC−5)
      такой объект при показе в местном времени превращается в 7 марта, 19:00. Если компонент хранит `Date`
      и показывает местную дату, покупатель выбрал 8-е, а в фильтр ушло 7-е. Решение — хранить и передавать
      календарную дату строкой и не превращать её в момент. Если для расчётов нужен объект, его строят из частей
      (`new Date(2026, 2, 8)` — местная полночь) и сразу возвращают строку.

      **2. Клавиатура и экранный чтец.** Как должен вести себя такой виджет, описывает пример Date Picker Dialog
      в WAI-ARIA Authoring Practices:
      - календарь — диалог с подписью, сетка дней — таблица с ролью `grid`;
      - стрелки двигают фокус по дням и неделям, Page Up и Page Down листают месяцы, с Shift — годы;
      - Home и End — начало и конец недели, Enter и пробел выбирают день, Escape закрывает;
      - фокус при открытии — на выбранной дате или на сегодняшней, при закрытии — обратно на кнопку;
      - в сетке фокусируема одна ячейка (`tabindex="0"`), остальные — `-1`, и скрипт переставляет это по ходу.
      Сам пример предупреждает, что это иллюстрация, а не готовый код, и что поддержка в разных браузерах
      и чтецах, особенно на телефонах, различается. Поэтому сценарии проходят руками (курс «Доставка
      и качество», «Доступность в архитектуре»). Начало недели и названия дней берут из языка: в России неделя
      начинается с понедельника, в США — с воскресенья.

      **3. Ввод текстом.** Человек печатает «8.3.26» или «08/03/2026». Компонент разбирает ввод по формату языка,
      а при ошибке показывает её рядом с полем и не вызывает `onChange` с мусором. Невалидная или отключённая
      дата — состояние ошибки, а не молчаливая подмена.

      **4. Телефон.** На телефоне всплывающая сетка мелкая. Можно показывать её на весь экран снизу или отдать
      выбор встроенному `<input type="date">` — о цене этого варианта ниже.

      ## Компромиссы и альтернативы

      - **Встроенный `<input type="date">`**
        - Плюсы: родной выбор даты на телефоне, клавиатура и чтец — от браузера, ноль кода.
        - Цена: внешний вид почти не настраивается, а формат показа задаёт браузер по своему языку, а не язык
          интерфейса сервиса; отключать отдельные дни нельзя — только `min` и `max`.
      - **Своя реализация**
        - Плюсы: полный контроль вида и поведения, отключённые дни функцией.
        - Цена: доступность, клавиатура и разбор ввода — на вас, и это месяцы работы.
      - **Готовая доступная библиотека компонентов**
        - Плюсы: клавиатура и роли уже сделаны и проверены.
        - Цена: зависимость, её вес и её API, которое придётся спрятать за своим.

      Выбор для первой версии: своя обёртка с API выше поверх готовой доступной библиотеки — команды получают один
      контракт, а библиотеку можно заменить, не трогая двенадцать экранов. Пересмотреть, если библиотека
      перестанет развиваться или её вес выйдет за бюджет страницы.

      ## Интервьюер меняет условия

      **«Нужен выбор диапазона, а занятые дни площадки приходят с сервера».**

      - **Диапазон.** Значение становится парой `{ start, end }`, а выбор — двумя нажатиями с подсветкой будущего
        диапазона при наведении. Лучше отдельный компонент `DateRangePicker` с общей сеткой внутри, чем флаг
        `range` в старом: флаг меняет тип значения, и `value` начинает зависеть от `range`. Это родственник
        тревожного признака из курса 1, «Компонент как контракт», — свойства, которые имеют смысл только в паре
        с другим. Сетку дней и клавиатуру выносят во внутренний общий модуль обоих компонентов, а публичные API
        остаются раздельными. Старый компонент и его двенадцать экранов не меняются.
      - **Занятые дни с сервера.** Компонент по-прежнему не ходит в сеть сам. Экран передаёт функцию загрузки,
        например `loadDisabledDates(month)`, а компонент вызывает её для открытого месяца. Дальше — механизмы
        курса 2: ответы кэшируют по месяцу («Как устроен клиентский кэш»), следующий месяц можно загрузить заранее,
        а при быстром листании берут только ответ для последнего открытого месяца («Гонки запросов»). Пока дни
        грузятся, сетка показывает их неактивными с пометкой загрузки, а не разрешёнными.

      Что не меняется: поле, клавиатура, формат значения, обычный выбор одной даты.

      ## Типичные ошибки кандидатов

      - **Хранить значение как `Date`.** Дата съезжает на день у людей в других поясах.
      - **Забыть клавиатуру и чтец** или пообещать «добавить потом» — это ломает контракт.
      - **Зашить запрос к API в компонент.** Двенадцать экранов с разными источниками дат — двенадцать флагов.
      - **Флаг `range` в существующем компоненте,** меняющий тип значения.
      - **Тяжёлая библиотека дат ради форматирования,** которое умеет `Intl`.
      - **Считать «сегодня» по часам покупателя** для концерта в другом поясе.

      ## Коротко

      - На задаче про компонент план ответа — требования, API, поведение на краях, доступность и компромиссы,
        а не схема системы.
      - Значение компонента выбора даты — календарная дата строкой «ГГГГ-ММ-ДД», а не объект `Date`: строка
        без времени при разборе считается полуночью по UTC, и у людей западнее Гринвича дата съезжает на день.
      - Значением владеет экран, а открытый месяц и день в фокусе живут внутри компонента. Компонент
        поддерживает оба режима, но не переключается между ними на ходу.
      - Отключённые дни и данные с сервера компонент получает снаружи функцией, как порт, и сам в сеть не ходит.
      - Клавиатуру и роли берут из примера Date Picker Dialog в WAI-ARIA Authoring Practices и проверяют руками:
        поддержка в чтецах и на телефонах различается.
      - Встроенный `<input type="date">` даёт доступность даром, но почти не настраивается и отключает дни только
        через `min` и `max`. Своя обёртка над доступной библиотекой даёт один контракт для всех экранов.
      - Новое условие вроде диапазона лучше решать новым компонентом рядом, чем флагом, который меняет тип значения.

      ## Источники

      - [Date Picker Dialog Example — WAI-ARIA Authoring Practices](https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/examples/datepicker-dialog/)
      - [Date.parse() — MDN](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/parse)
      - [input type="date" — MDN](https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/input/date)

  - id: sdp-autocomplete
    topic: Разборы кейсов
    subtopic: Строка поиска с подсказками
    title: 'Разбор: строка поиска с подсказками'
    body: |
      ## Условие

      «Спроектируйте строку поиска с подсказками для интернет-магазина».

      Это компонент, но он ходит на сервер, поэтому здесь важны и API компонента, и данные, и сеть.

      ## Уточняем требования

      - «Что за магазин и сколько товаров?» — «Товары для дома, около двух миллионов позиций».
      - «Что показываем в подсказках?» — «Популярные запросы, категории и до трёх товаров с маленьким фото».
      - «Где строка?» — «В шапке на всех страницах».
      - «Кто ищет?» — «Две трети — с телефонов, часто на мобильной сети».
      - «Как быстро должны появляться подсказки?» — «Пока человек печатает, без заметной задержки».
      - «Нужна ли история поиска?» — «Да, последние запросы, когда поле пустое».
      - «Подсказки одинаковы для всех или персональные?» — «Одинаковы, персональных пока нет».
      - «Если подсказки не работают, поиск должен работать?» — «Конечно, поиск — главное».
      - «Исправление опечаток?» — «Это делает сервер поиска, он уже есть».
      - «Доступность?» — «Клавиатура и экранный чтец обязательны».

      **Почему эти вопросы:**
      - «Сколько товаров?» — решает, можно ли искать на клиенте: тысячу запросов можно унести на устройство,
        два миллиона товаров — нет;
      - «Что показываем?» — решает форму ответа и его вес: фото товаров на мобильной сети должны быть маленькими;
      - «Кто ищет?» — мобильная сеть решает, насколько важны пауза в наборе, размер ответа и гонки ответов;
      - «Подсказки одинаковы для всех?» — решает, можно ли кэшировать ответы на CDN;
      - «Если подсказки не работают, поиск должен работать?» — решает, что главное, а что второстепенное.

      **Первая версия:** подсказки запросов, категорий и товаров; последние запросы на устройстве; клавиатура
      и чтец. **Отложено:** голосовой поиск, подсказки по фото.

      ## Оценки и допущения

      - Допустим, полмиллиона поисков в день. Если отправлять запрос на каждую букву, а в запросе в среднем
        десять букв, — пять миллионов запросов в день. Если ждать паузы в наборе, выходит около трёх запросов
        на поиск — полтора миллиона в день, в среднем около 17 в секунду, в пик раз в пять больше. Это порядок
        величины, и его хватает для решения: пауза в наборе нужна, а кэш на CDN для популярных начал запросов
        снимет ещё часть нагрузки.
      - На мобильной сети ответ может идти секунду. Значит, ответы будут приходить не в том порядке, в котором
        уходили запросы.

      ## Схема

      - **Поле поиска** — ввод и клавиатура; показывает список.
      - **Список подсказок** — запросы, категории, товары, последние запросы.
      - **Служба подсказок** — ждёт паузу в наборе, отменяет устаревший запрос, кэширует ответы, следит, чтобы
        на экран попал ответ для текущего текста.
      - **Хранилище последних запросов** — `localStorage` на устройстве.
      - **Сервер подсказок** — чёрный ящик, перед ним CDN.

      ![Строка поиска: поле с ролью combobox и список подсказок; служба подсказок между полем и сервером — пауза 250 мс, отмена прошлого запроса, кэш по тексту запроса, сверка «ответ для текущего текста?»; последние запросы в localStorage; запрос GET /suggest?q= через CDN к серверу подсказок](images/sdp-autocomplete.png "Между полем и сервером — служба подсказок")

      ## Данные и контракт API

      ```http
      GET /suggest?q=подушка&limit=8
      ```

      ```json
      {
        "q": "подушка",
        "items": [
          { "type": "query", "text": "подушка ортопедическая" },
          { "type": "category", "text": "Подушки", "url": "/c/pillows" },
          { "type": "product", "text": "Подушка 50×70 бамбук", "url": "/p/48213",
            "image": "https://cdn.example.com/p/48213-64.webp", "price": { "amount": 129000, "currency": "RUB" } }
        ]
      }
      ```

      - **Ответ повторяет `q`.** По нему клиент проверяет, к какому тексту относится ответ.
      - **Цена — целым числом в копейках с валютой,** как в курсе 1, «Контракт API глазами фронтенда».
      - **Фото — маленькое,** 64 пикселя: в подсказке больше не нужно, а сеть мобильная.
      - **Ответ кэшируется на CDN** на несколько минут: подсказки для «подушка» одинаковы для всех. Персональные
        подсказки так не закэшируешь — их в первой версии нет.

      ## Критические сценарии

      **1. Гонка ответов.** Человек напечатал «под», потом «подушка». Ответ на «под» пришёл позже и затёр
      подсказки для «подушка». Защита из курса 2, урок «Лишние и одинаковые запросы»: прошлый запрос отменяют через
      `AbortController` или игнорируют его ответ. Отмена и игнор оба решают гонку на клиенте, отмена вдобавок бережёт
      трафик. Сверка `q` из ответа с текущим текстом — запасной пояс: она работает и тогда, когда отмену забыли
      в одном месте кода или ответ пришёл не из отменяемого запроса, а из кэша.

      **2. Лишние запросы.** Запрос отправляют не на каждую букву, а после паузы в наборе — debounce из курса 2,
      урок «Лишние и одинаковые запросы». Пауза 200–300 мс почти не заметна и в разы сокращает число запросов.
      Ещё два приёма: не спрашивать сервер, пока введено меньше двух букв, и держать ответы в кэше по тексту
      запроса — человек стёр букву и вернул её, ответ уже есть.

      **3. Доступность.** Шаблон combobox из WAI-ARIA Authoring Practices: у поля роль `combobox`,
      `aria-expanded` показывает, открыт ли список, `aria-controls` указывает на список с ролью `listbox`,
      а `aria-autocomplete="list"` говорит чтецу, что подсказки показываются списком, а текст в поле сам
      не дописывается. Фокус всегда остаётся в поле, а выбранную подсказку поле сообщает чтецу
      через `aria-activedescendant`. Стрелка вниз открывает список и ходит по подсказкам, Enter выбирает,
      Escape закрывает. Сколько подсказок нашлось, объявляет живая область (курс «Доставка и качество»,
      «Доступность в архитектуре»).

      **4. Пусто, медленно, ошибка.** «Ничего не найдено» показывают только после ответа, а не пока он идёт.
      Пока новый ответ в пути, на экране остаются прошлые подсказки — они лучше пустоты. Если сервер подсказок
      упал, строка поиска продолжает работать: Enter ведёт на страницу результатов. Подсказки — второстепенное,
      сам поиск — главное (курс 1, «Загрузка, пустота, ошибка и всё между ними»).

      ## Компромиссы и альтернативы

      - **Пауза в наборе: 150 или 300 мс.** Короче — подсказки живее, но запросов больше. Начать с 250 мс
        и подстроить по данным о скорости и нагрузке.
      - **Подсказки на клиенте или на сервере.** Можно скачать тысячу популярных запросов и фильтровать их
        на устройстве — мгновенно и без сети. Но два миллиона товаров на клиент не унести. Выбор: популярные
        запросы и последние поиски — на устройстве для мгновенного первого ответа, остальное — с сервера.
      - **Кэш на CDN или без него.** Кэш снимает нагрузку и ускоряет популярные запросы, но подсказки отстают
        от каталога на несколько минут. Для подсказок это приемлемо: товар, закончившийся минуту назад, покажет
        страница товара.

      Пересмотреть, если появятся персональные подсказки: их нельзя класть в общий кэш CDN. Тогда ответ делят
      на две части — общие подсказки по тексту по-прежнему идут с CDN, а персональные приходят отдельным запросом
      с заголовком `Cache-Control: private`: такой ответ может кэшировать только браузер самого покупателя.

      ## Интервьюер меняет условия

      **«Товаров теперь тридцать миллионов, и много людей на медленной сети».**

      - Индекс поиска — забота сервера: на клиенте тридцать миллионов не меняют ничего, контракт тот же.
      - Медленная сеть меняет клиент: ответ должен быть маленьким (восемь подсказок, фото 64 пикселя), первая
        реакция — мгновенной из локальных данных (последние поиски и популярные запросы на устройстве), а ответ
        сервера дополняет список, когда придёт.
      - У запроса появляется тайм-аут: если подсказки не пришли за пару секунд, остаются локальные, а не спиннер.
      - Кэш на CDN становится важнее: при медленной сети каждый ответ из ближнего узла заметно быстрее.

      Не меняются: поле, клавиатура, сверка ответа с текущим текстом, пауза в наборе.

      ## Типичные ошибки кандидатов

      - **Запрос на каждую букву** без паузы и без кэша.
      - **Показывать любой пришедший ответ.** Старый ответ затирает новые подсказки.
      - **Считать, что отмена снижает нагрузку на сервер.** Запрос уже ушёл, и сервер его обработает: нагрузку
        снижает пауза в наборе.
      - **Фокус в списке подсказок.** Человек не может продолжить печатать, а шаблон combobox держит фокус в поле.
      - **Ошибка подсказок ломает поиск.** Без подсказок поиск должен работать.

      ## Коротко

      - Подсказки не отправляют на каждую букву: после паузы в наборе 200–300 мс, с минимальной длиной запроса
        и с кэшем ответов по тексту. Это в разы снижает нагрузку.
      - Устаревший ответ не должен затереть новый: прошлый запрос отменяют или игнорируют его ответ, а сервер
        повторяет текст запроса в ответе, и клиент сверяет его с полем. Отмена бережёт трафик, но не нагрузку
        на сервер.
      - Доступность — шаблон combobox из WAI-ARIA Authoring Practices: фокус остаётся в поле, выбранная подсказка
        передаётся через `aria-activedescendant`, число найденного объявляет живая область.
      - Подсказки — второстепенное: при сбое сервера подсказок строка поиска продолжает вести на результаты,
        а «ничего не найдено» показывают только после ответа.
      - Одинаковые для всех подсказки можно кэшировать на CDN, персональные — нельзя.
      - При медленной сети первая реакция берётся из локальных данных, ответ сервера маленький и дополняет список.

      ## Источники

      - [Combobox Pattern — WAI-ARIA Authoring Practices](https://www.w3.org/WAI/ARIA/apg/patterns/combobox/)
      - [AbortController — MDN](https://developer.mozilla.org/ru/docs/Web/API/AbortController)

  - id: sdp-feed
    topic: Разборы кейсов
    subtopic: Лента новостей
    title: 'Разбор: лента новостей'
    body: |
      ## Условие

      «Спроектируйте ленту новостей».

      Это задача на приложение: план ответа полный — требования, схема, данные и API, критические сценарии,
      компромиссы.

      ## Уточняем требования

      - «Что за продукт?» — «Соцсеть для соседей: районы, дома, объявления, „кто видел кота“».
      - «Что в посте?» — «Текст, до десяти фото, лайки и число комментариев».
      - «В каком порядке посты?» — «Новые сверху, без алгоритма рекомендаций».
      - «Сколько людей и откуда?» — «Около трёхсот тысяч в день, три четверти — с телефонов».
      - «Можно ли писать посты?» — «Да, и ставить лайки».
      - «Как появляются новые посты?» — «Достаточно увидеть их при обновлении или по кнопке».
      - «Доступность?» — «Клавиатура и экранный чтец».

      **Почему эти вопросы:**
      - «В каком порядке посты?» — хронология позволяет курсор по времени; алгоритм рекомендаций потребовал бы
        другого контракта;
      - «Сколько людей и откуда?» — три четверти с телефонов: главное — вес картинок и длина ленты в документе;
      - «Как появляются новые посты?» — решает транспорт: «по кнопке» — хватает опроса, «сразу» — нужен поток;
      - «Можно ли писать посты?» — добавляет загрузку фото и защиту от двойной публикации.

      **Первая версия:** лента своего района с бесконечной прокруткой, посты с фото, лайки, создание поста,
      кнопка «Новые посты». **Отложено:** комментарии внутри ленты, видео, рекомендации, живое появление постов.

      ## Оценки и допущения

      - Пост с фото весит в основном картинками: текст — килобайты, а десять фото без нарезки размеров — мегабайты.
        Значит, главное для скорости — картинки и то, сколько постов грузить разом.
      - Человек пролистывает за вечер сотни постов. Если держать их все в документе, телефон начнёт тормозить:
        это предел «документ страницы» из курса «Реальное время и большие списки»,
        урок «Когда данных слишком много».
      - Пока человек читает, в районе появляются новые посты: список живой, и это влияет на пагинацию.
      - Допустим, вечером одновременно открыто 30 тысяч лент. Опрос «сколько новых» раз в минуту — 30 000 / 60 =
        500 запросов в секунду, лёгких: сервер просто считает посты района новее заданного. Это терпимо, поэтому для
        первой версии хватает опроса.

      ## Схема

      - **Экран ленты** — список, кнопка «Новые посты», окно создания поста.
      - **Карточка поста** — текст, фото, лайк, переход к посту.
      - **Слой данных** — кэш страниц ленты, оптимистичные лайки.
      - **API ленты** и **CDN картинок** с изменением размера на лету.

      Проверка сценарием «открыть ленту → пролистать → открыть пост → вернуться» находит пропущенное звено:
      при возврате нужно вернуть человека на то же место, иначе он потеряет, где читал.

      ![Схема ленты: экран с виртуализацией и кнопкой «Новые посты» получает страницы по курсору от слоя данных с окном страниц в кэше и оптимистичным лайком; слой данных шлёт в API ленты запросы страниц, «сколько новых», лайки и создание поста с идентификатором операции; картинки нужной ширины приходят с CDN](images/sdp-feed.png "Лента: какие запросы куда идут")

      ## Данные и контракт API

      ```http
      GET /feed?district=d-12&cursor=eyJ0Ijoi...&limit=20
      ```

      ```json
      {
        "items": [
          { "id": "p-9031", "author": { "id": "u-17", "name": "Ольга" }, "text": "Кто видел рыжего кота?",
            "photos": [{ "url": "https://img.example.com/p-9031/1", "width": 1600, "height": 1200 }],
            "likes": 12, "likedByMe": false, "comments": 3, "createdAt": "2026-10-22T18:40:00Z" }
        ],
        "nextCursor": "eyJ0IjoiMjAyNi0xMC0yMlQxODozOTowMFoiLCJpZCI6InAtOTAzMCJ9"
      }
      ```

      - **Курсор, а не номер страницы** — список живой (курс 2, «Пагинация живых списков»). Порядок строгий:
        по времени, при равенстве — по id.
      - **У фото есть ширина и высота** — чтобы зарезервировать место до загрузки.
      - **Лайк — установка состояния, а не переключение:** `PUT /posts/p-9031/like` ставит лайк, `DELETE` убирает.
        Повтор после тайм-аута не превращает лайк в его отмену — это идемпотентная запись из курса 2, «Повторы
        без двойных списаний».
      - **Новые посты:** `GET /feed/new-count?district=d-12&after=p-9031` — сколько постов появилось выше первого
        показанного.
      - **Создание поста:** `POST /posts { text, photoIds }` с идентификатором операции; фото загружаются заранее
        и передаются ссылками.

      ## Критические сценарии

      **1. Дубли и пропуски при прокрутке.** Пока человек читает, сверху появляются новые посты. Со смещением
      («пропусти 20») следующая страница повторила бы посты, съехавшие вниз. Курсор («дай 20 после p-9011»)
      от вставок сверху не зависит. Страницы клиент сливает по id и отбрасывает дубли.

      **2. Сотни постов в документе.** Через полчаса прокрутки в документе тысячи элементов, и телефон тормозит.
      Решение — виртуализация из курса «Реальное время и большие списки»: в документе только видимые карточки
      и запас. Высота постов разная, поэтому библиотека работает с оценкой и измерением, а ключ карточки — её id.
      Есть и цена: поиск по странице браузера видит только то, что в документе, а для доступности лента должна
      сообщать о догрузке. Для настоящих лент WAI-ARIA Authoring Practices описывает шаблон feed (курс «Доставка
      и качество», «Доступность в архитектуре»). Отдельно от документа есть предел памяти: за вечер в кэше
      накапливаются сотни страниц. Его лечит другое — окно из нескольких страниц в кэше, дальние выбрасывают
      (курс «Реальное время и большие списки», «Когда данных слишком много»). Путать эти пределы — ошибка «лечить
      не тот предел» из того же урока.

      **3. Новые посты не сдвигают читаемое.** Вставить новые посты сверху, пока человек читает середину ленты, —
      значит сдвинуть текст у него из-под глаз. Поэтому новые посты не вставляют сами: клиент раз в минуту
      спрашивает `new-count` и показывает кнопку «Новые посты: 3». По нажатию лента прокручивается наверх
      и загружает первую страницу заново.

      **4. Картинки.** Фото отдают нужной ширины через `srcset` и `sizes`, в WebP или AVIF; место под фото
      резервируют по `width` и `height` из ответа, чтобы лента не прыгала. Фото первого поста грузят сразу,
      остальные — лениво (курс «Доставка и качество», «Картинки и видео»).

      **5. Лайк без задержки.** Лайк — оптимистичное обновление: сердечко и счётчик меняются сразу, запрос идёт
      в фоне. Ложный успех дёшев, сервер почти всегда соглашается — классический случай из курса 2, «Оптимистичные
      обновления». При отказе сердечко возвращается с коротким сообщением.

      **6. Возврат в ленту.** Человек открыл пост и нажал «Назад». Страницы ленты берут из кэша, а позицию хранят
      как id поста вверху экрана и восстанавливают после отрисовки. В виртуальном списке восстанавливают сами,
      по id первой видимой карточки (курс «Реальное время и большие списки», «Виртуализация»; курс 2,
      «Пагинация живых списков»).

      **7. Свой пост.** Человек публикует пост с пятью фото с телефона. Фото загружаются до публикации, прямо
      в хранилище и с возобновлением после обрыва (курс 2, «Загрузка файлов»). Сам пост — один запрос
      с идентификатором операции, чтобы повтор после тайм-аута не создал второй (курс 2, «Повторы без двойных
      списаний»). Свой пост автор видит сверху сразу: это его собственное действие, и правило «не сдвигать
      читаемое» к нему не относится.

      ## Компромиссы и альтернативы

      - **Бесконечная прокрутка или «Показать ещё».** Лента соседей — однородный поток, который листают без цели,
        поэтому бесконечная прокрутка уместна. Цена — подвал недоступен с клавиатуры. Компромисс — догружать
        автоматически первые несколько страниц, а дальше показывать кнопку «Показать ещё».
      - **Виртуализация сразу или после замера.** Виртуализация держит документ маленьким, но ломает поиск
        по странице и требует работы с высотами. Можно начать без неё и включить, если замеры на слабых телефонах
        покажут проблему. Окно страниц в кэше нужно в любом случае — против памяти.
      - **Кнопка «Новые посты» или живое появление.** Кнопка проще и не сдвигает читаемое, но новое видно
        с задержкой до минуты. Для ленты соседей задержка приемлема.

      ## Интервьюер меняет условия

      **«Новые посты должны появляться сразу, без обновления».**

      - Затронута одна стрелка — как клиент узнаёт о новых постах. Вместо опроса `new-count` раз в минуту сервер
        присылает события о новых постах района через SSE: данные идут только от сервера (курс «Реальное время
        и большие списки», «Как доставлять живые данные»). Опрос остаётся запасным путём.
      - Что остаётся: правило «не сдвигать читаемое». Если человек вверху ленты, новый пост вставляют сразу;
        если он в середине — растёт счётчик на кнопке.
      - Цена: открытые соединения на каждую открытую ленту, переподключение и догоняющие события после обрыва
        (там же, «Соединение: обрывы и возвраты» и «Снимок и догоняющие события»). Дубли событий отсекают по id
        поста.

      Не меняются: курсор, карточки, картинки, лайки.

      ## Типичные ошибки кандидатов

      - **Пагинация по номеру страницы** в живой ленте: дубли и пропуски.
      - **Вставлять новые посты сверху,** пока человек читает.
      - **Тысячи карточек в документе** без виртуализации.
      - **Лечить документ окном страниц в кэше,** а память — виртуализацией: это разные пределы.
      - **Фото в полном размере** и без резерва места: тяжело и прыгает.
      - **Лайк-переключатель,** который при повторе после тайм-аута снимает лайк.
      - **Потерянная позиция** после возврата из поста.

      ## Коротко

      - Живую ленту листают по курсору, а не по номеру страницы: курсор не зависит от вставок сверху, а страницы
        сливают по id, отбрасывая дубли.
      - Новые посты не вставляют над тем, что человек читает: показывают кнопку «Новые посты» и вставляют сразу,
        только если он вверху.
      - Документ длинной ленты держат маленьким виртуализацией, а память — окном из нескольких страниц в кэше:
        это разные пределы. У виртуализации своя цена — поиск по странице и работа с высотами.
      - Лента весит в основном картинками: нужная ширина через `srcset` и `sizes`, современные форматы, резерв
        места по размерам и ленивая загрузка всего ниже первого экрана.
      - Лайк — оптимистичное обновление и идемпотентная установка состояния, а не переключатель.
      - Позицию после возврата хранят как id поста вверху экрана и восстанавливают после отрисовки.
      - Живое появление постов меняет только транспорт — SSE вместо опроса, — а правило «не сдвигать читаемое»
        остаётся.

      ## Источники

      - [Feed Pattern — WAI-ARIA Authoring Practices](https://www.w3.org/WAI/ARIA/apg/patterns/feed/)
      - [Responsive images — MDN](https://developer.mozilla.org/en-US/docs/Web/HTML/Guides/Responsive_images)

  - id: sdp-chat
    topic: Разборы кейсов
    subtopic: Чат с переподключением
    title: 'Разбор: чат с переподключением'
    body: |
      ## Условие

      «Спроектируйте веб-чат, который переживает обрывы связи».

      ## Уточняем требования

      - «Что за чат?» — «Рабочий мессенджер для небольших компаний: личные сообщения и каналы до 200 человек».
      - «Что можно отправлять?» — «Текст; файлы — позже».
      - «Какие статусы нужны?» — «„Отправляется“, „отправлено“, „прочитано“; кто сейчас печатает; кто в сети».
      - «Откуда пишут?» — «С компьютеров и телефонов в браузере; связь бывает плохой — поезд, метро».
      - «Что важнее всего?» — «Не терять и не дублировать сообщения и не путать их порядок».
      - «История?» — «Вся, листать вверх».
      - «Уведомления?» — «Когда вкладка не на экране».

      **Почему эти вопросы:**
      - «Какие статусы нужны?» — «печатает» и «прочитано» идут от клиента постоянно: это довод за двусторонний канал;
      - «Откуда пишут?» — плохая связь в поезде и метро решает, сколько сил тратить на переподключение, догоняющие события и очередь
        отправки;
      - «Что важнее всего?» — «не терять, не дублировать, не путать порядок» прямо задаёт номера событий,
        временные id и отсев дублей;
      - «Уведомления?» — решает, что делать, когда вкладка скрыта, и кто из вкладок показывает уведомление.

      **Первая версия:** личные сообщения и каналы, текст, статусы отправки и прочтения, «печатает», история,
      уведомления. **Отложено:** файлы, реакции, треды.

      ## Оценки и допущения

      - Допустим, одновременно в сети десятки тысяч человек. Каждый держит одно соединение.
      - Сообщение в канал на 200 человек — 200 событий: рассылку делает сервер, клиенту важно только, что события
        приходят часто и в обе стороны: сообщения, «печатает», «прочитано».
      - Обрыв на минуту в метро — нормальная ситуация, а не авария. За эту минуту в каналах могли появиться
        десятки сообщений.

      ## Схема

      - **Экран чата** — список разговоров, лента сообщений, поле ввода.
      - **Менеджер соединения** — одно соединение, пинг, переподключение, догоняющие события.
      - **Хранилище сообщений** — сообщения по разговорам в порядке серверного номера.
      - **Очередь отправки** — свои сообщения, которые ещё не подтверждены.
      - **Уведомления** — когда вкладка скрыта.
      - **Сервер** — чёрный ящик: принимает, нумерует и рассылает.

      ![Схема чата: экран со списком разговоров и лентой; менеджер соединения с WebSocket, пингом раз в 25 секунд и переподключением с разбросом; хранилище сообщений по номеру seq; очередь отправки с временными id и статусом «отправляется»; после переподключения клиент сообщает последний номер, сервер досылает пропущенное или велит перечитать снимок](images/sdp-chat.png "Чат: одно соединение, номера от сервера, очередь своих сообщений")

      ## Данные и контракт API

      **Транспорт — WebSocket.** Данные идут часто и в обе стороны, поэтому по правилу курса «Реальное время
      и большие списки», урок «Как доставлять живые данные», здесь нужен двусторонний канал. Запасной путь —
      опрос, если прокси режет соединение.

      События от сервера:

      ```json
      { "type": "message", "seq": 58213, "conversationId": "c-7", "id": "m-991", "clientId": "tmp-4f2a",
        "author": "u-3", "text": "Созвон в 15:00?", "createdAt": "2026-10-22T11:58:03Z" }
      { "type": "read", "seq": 58214, "conversationId": "c-7", "userId": "u-5", "upTo": 58213 }
      { "type": "typing", "conversationId": "c-7", "userId": "u-5", "expiresIn": 6 }
      ```

      - **`seq`** — номер события от сервера, единый для всего, что клиент получает. По нему клиент знает порядок
        и место, откуда догонять.
      - **`clientId`** — временный id, который клиент дал своему сообщению. Он же ключ идемпотентности.
      - **«Прочитано»** — метка «прочитано до номера», которая только растёт (курс «Реальное время и большие
        списки», «Чат и статусы присутствия»).
      - **«Печатает»** — событие со сроком действия: его можно потерять, оно само истечёт.
      - **История** — обычным запросом: `GET /conversations/c-7/messages?before=58000&limit=50`.

      ## Критические сценарии

      **1. Соединение умерло молча.** В туннеле соединение может оборваться без ошибки, и браузер долго будет
      считать его живым. Встроенные ping и pong WebSocket JavaScript не видит, поэтому нужен свой пинг
      на уровне приложения: сервер шлёт его, скажем, раз в 25 секунд, и после двух интервалов тишины клиент
      считает соединение мёртвым. Переподключение — с экспоненциальной паузой, случайным разбросом и потолком
      (курс «Реальное время и большие списки», «Соединение: обрывы и возвраты»). При возврате на вкладку
      и при событии `online` клиент проверяет соединение сразу, не дожидаясь таймера.

      **2. Пропущенное за минуту в метро.** После переподключения клиент сообщает последний полученный `seq`,
      и сервер досылает всё, что было после. Если история на сервере уже стёрта или пропущено слишком много,
      сервер отвечает «перечитай снимок»: клиент загружает свежие последние сообщения разговоров и подписывается
      с новой позиции (урок «Снимок и догоняющие события»). Пока догоняет, экран показывает «Подключаемся…»,
      а не делает вид, что всё свежее.

      **3. Дубли и порядок.** Одно событие может прийти дважды — например, до обрыва и в догоняющих. Клиент
      пропускает событие с `seq` не больше последнего применённого, а своё сообщение узнаёт по `clientId`. Порядок
      в ленте задаёт `seq` от сервера, а не часы телефона: часы устройств расходятся (урок «События: дубли
      и порядок»).

      **4. Отправка без связи.** Человек нажал «Отправить» в метро. Сообщение сразу появляется в ленте с временным
      id и пометкой «отправляется» и попадает в очередь отправки. Когда связь вернулась, очередь отправляет его
      с тем же `clientId`. Если первая попытка всё же дошла, сервер узнает `clientId` и не создаст дубль, а клиент
      узнает своё сообщение в потоке и заменит временное настоящим — локальное эхо из курса «Реальное время
      и большие списки», урок «Чат и статусы присутствия». Свои неподтверждённые сообщения стоят внизу ленты. Если отправить не удалось
      окончательно, сообщение остаётся с пометкой «Не отправлено» и кнопкой «Повторить» — текст не теряется.
      Чтобы очередь пережила закрытие вкладки, её хранят на устройстве (курс 2, «Работа без сети и очередь
      действий»).

      **5. Длинная история.** Ленту листают вверх, догружая старые сообщения по 50. Чтобы экран не прыгал, после
      догрузки сохраняют положение сообщения, которое было вверху. Документ держат маленьким виртуализацией,
      а память — окном страниц в кэше, как в разборе ленты.

      **6. Уведомления.** Пока вкладка на экране, новое сообщение видно в ленте. Когда вкладка скрыта,
      показывают уведомление — и только из одной вкладки (курс «Реальное время и большие списки», урок
      «Уведомления»).

      ## Компромиссы и альтернативы

      - **WebSocket или SSE с обычными запросами.** SSE проще и сам переподключается, а отправку можно делать
        обычным `POST`. Но «печатает» и «прочитано» идут от клиента постоянно, и двусторонний канал экономит
        запросы. Пересмотреть, если инфраструктура режет WebSocket: тогда SSE и запросы.
      - **Догонять по номеру или всегда перечитывать снимок.** Догонять дешевле, но серверу нужно хранить историю
        событий. Перечитывать проще, но после каждого обрыва это лишняя нагрузка — а обрывы здесь обычное дело.
      - **Очередь отправки на устройстве или только в памяти.** В памяти проще, но закрытая вкладка теряет
        неотправленное. Для рабочего чата потеря сообщения дороже, чем запись в IndexedDB.

      ## Интервьюер меняет условия

      **«Чат открыт в трёх вкладках и ещё на телефоне».**

      - **Три вкладки.** Три соединения и три уведомления на каждое сообщение — та же беда, что с тремя звонками
        в кабинете ресторана (курс «Синхронизация и офлайн», урок «Несколько вкладок»). Одна ведущая вкладка
        держит соединение и показывает уведомления, её выбирают через Web Locks, а остальные получают события
        через `BroadcastChannel`. Очередь отправки общая: отправляет только ведущая.
      - **Телефон.** У каждого устройства своё соединение. «Прочитано» на телефоне должно погасить счётчик
        непрочитанных на компьютере: метку «прочитано до» хранит сервер и рассылает всем устройствам человека.
        Владелец метки — сервер, а не вкладка.

      Не меняются: номера, отсев дублей, очередь с временными id, догоняющие события.

      ## Типичные ошибки кандидатов

      - **Полагаться на событие `close`.** Соединение умирает молча, без пинга это не заметить.
      - **Переподключаться без разброса.** После перезапуска сервера все клиенты возвращаются в одну секунду.
      - **Сортировать по времени с устройства.** Часы расходятся, сообщения перемешиваются.
      - **Отправлять без временного id.** Повтор после обрыва создаёт дубль.
      - **Делать вид, что данные свежие,** пока клиент ещё догоняет пропущенное.
      - **Отдельное соединение и уведомления в каждой вкладке.**

      ## Коротко

      - Чату с частыми событиями в обе стороны нужен WebSocket, а запасной путь — опрос. Переподключение,
        номера и досылку пропущенного делает приложение.
      - Соединение может умереть молча, поэтому нужен свой пинг на уровне приложения, а при возврате на вкладку
        и в сеть соединение проверяют сразу. Переподключаются с экспоненциальной паузой и разбросом.
      - После переподключения клиент сообщает последний номер события, и сервер досылает пропущенное; если история
        стёрта — перечитывают снимок и подписываются с новой позиции.
      - Порядок задаёт номер от сервера, дубли отсекают по id, а «печатает» можно терять — у него срок действия.
      - Своё сообщение показывают сразу с временным id, хранят в очереди на устройстве и повторяют с тем же id:
        он служит ключом идемпотентности. Неотправленное остаётся с кнопкой «Повторить».
      - Несколько вкладок — одна ведущая держит соединение и уведомления; несколько устройств — у каждого своё
        соединение, а метку «прочитано» хранит и рассылает сервер.

      ## Источники

      - [WebSocket API — MDN](https://developer.mozilla.org/ru/docs/Web/API/WebSockets_API)
      - [Broadcast Channel API — MDN](https://developer.mozilla.org/en-US/docs/Web/API/Broadcast_Channel_API)

  - id: sdp-booking
    topic: Разборы кейсов
    subtopic: Бронирование жилья
    title: 'Разбор: бронирование жилья'
    body: |
      ## Условие

      «Спроектируйте фронтенд сервиса посуточной аренды жилья: поиск, карточка, бронирование».

      ## Уточняем требования

      - «Кто ищет и откуда?» — «Путешественники; две трети — с телефонов. Много приходят из поисковиков
        на страницы вроде „Квартиры в Казани“ и по ссылкам из мессенджеров на конкретную квартиру».
      - «Что в поиске?» — «Город, даты, гости, фильтры по цене и удобствам, список и карта».
      - «Что в карточке?» — «До 30 фото, описание, удобства, календарь свободных дат, цена за выбранные даты».
      - «Сколько квартир?» — «Около двухсот тысяч; в крупном городе — тысячи на одни даты».
      - «Как часто меняются цена и занятость?» — «Занятость — постоянно, цена — несколько раз в день; описание
        и фото — редко».
      - «Как идёт бронирование?» — «Вход, оплата картой, подтверждение».
      - «Скорость?» — «Карточка должна быстро открываться на телефоне: от этого зависят бронирования».

      **Почему эти вопросы:**
      - «Кто ищет и откуда?» — поисковики и мессенджеры требуют готового HTML у страниц городов и карточек;
      - «Сколько квартир?» — тысячи на одни даты: фильтры и страницы — на сервере, точки на карте — группами;
      - «Как часто меняются цена и занятость?» — описание можно собрать заранее, а цену и даты — нет;
      - «Как идёт бронирование?» — оплата задаёт инварианты: не списать больше показанного, не забронировать
        дважды.

      **Первая версия:** поиск со списком и картой, карточка, бронирование с оплатой. **Отложено:** отзывы
      в карточке, избранное, чат с хозяином.

      ## Оценки и допущения

      - Тысячи квартир на одни даты в городе — фильтрует, сортирует и отдаёт страницами сервер (курс «Реальное
        время и большие списки», «Когда данных слишком много»).
      - Карта с тысячами меток на телефоне будет тормозить, а метки сольются в кашу. Значит, точки группирует сервер
        под текущий масштаб.
      - Тридцать фото в карточке — несколько мегабайт, если грузить все сразу. Главное фото — элемент LCP.

      ## Схема

      Главное архитектурное решение здесь — способ рендеринга для каждой страницы (курс «Доставка и качество»,
      «Где собирать страницу»):

      - **Страницы городов** («Квартиры в Казани») — заранее собранные (SSG) с пересборкой (ISR): их ищут
        поисковики, а содержимое одинаково для всех.
      - **Карточка квартиры** — заранее собранная с пересборкой при изменении описания и фото: её открывают
        из поисковиков и мессенджеров, и превью ссылки должно показать фото и название. Цена и свободные даты
        на выбранные даты догружаются на клиенте: они зависят от дат и постоянно меняются.
      - **Поиск с фильтрами** — на сервере при каждом запросе (SSR) для первой страницы: результат зависит
        от параметров, а ссылкой на поиск делятся. Дальнейшие страницы и перемещения карты — запросами с клиента.
      - **Бронирование и оплата** — в браузере (CSR) за входом: личные, поисковикам не нужны.

      Части клиента: поиск (форма, список, карта), карточка (галерея, календарь, блок цены), бронирование, слой
      данных с кэшем результатов. Сервер — чёрный ящик.

      ![Схема сервиса аренды: страницы городов и карточки квартир собраны заранее и лежат на CDN, поиск собирается на сервере по параметрам из адреса, бронирование и оплата — в браузере за входом; в карточке цена и свободные даты догружаются на клиенте; перед оплатой — расчёт цены с номером и сроком действия, бронирование с идентификатором операции](images/sdp-booking.png "Рендеринг по страницам и проверка цены перед оплатой")

      ## Данные и контракт API

      - **Параметры поиска — в адресе:** город, даты, гости и фильтры, например
        `/search?city=kazan&checkin=2026-11-14&guests=2`. Адрес переживает перезагрузку и «Назад» и уходит вместе со ссылкой (курс 1, «Что переживает
        перезагрузку»). Даты — календарные строки, как в разборе выбора даты.
      - **Поиск:** `GET /search?…&cursor=…` возвращает квартиры страницами по курсору с краткими полями (фото
        обложки, название, цена за даты) и `nextCursor`.
      - **Карта:** `GET /search/map?…&bbox=…&zoom=12` возвращает группы точек под масштаб: «здесь 37 квартир».
        `bbox` — границы видимой области карты.
      - **Цена и свободные даты:** `GET /listings/l-512/availability?from=…&to=…`.
      - **Расчёт цены перед оплатой:** `POST /quotes { listingId, checkin, checkout, guests }` →
        `{ quoteId, total: { amount: 1260000, currency: "RUB" }, expiresAt }`. Расчёт действует 15 минут.
      - **Бронирование:** `POST /bookings { quoteId }` с идентификатором операции. Если цена изменилась или даты
        заняли, сервер отвечает понятной ошибкой с новой ценой или с предложением других дат — как ошибка «цена
        изменилась» из курса 1, «Контракт API глазами фронтенда».

      ## Критические сценарии

      **1. Смена фильтра посреди загрузки.** Человек поменял цену, пока грузилась вторая страница старого поиска.
      Загруженные страницы и курсор выбрасывают, загрузку старой страницы игнорируют, запрашивают первую страницу
      с новым фильтром и прокручивают к началу (курс 2, «Пагинация живых списков»). Адрес обновляют через
      `replaceState`, пока человек двигает ползунок цены, и через `pushState`, когда он применил фильтр.

      **2. Карта и список.** Человек двигает карту — меняются границы, и список должен показать квартиры в новой
      области. Запрос отправляют после паузы в движении карты, а пришедший ответ показывают, только если он
      относится к текущим границам — та же сверка, что в разборе строки поиска.

      **3. Скорость карточки.** Главное фото — в HTML с `fetchpriority="high"`, нужной ширины через `srcset`,
      в AVIF или WebP; место под галерею зарезервировано; остальные 29 фото грузятся лениво, когда человек листает
      галерею (курс «Доставка и качество», «Картинки и видео»). Календарь и блок цены — отдельные куски кода,
      загружаемые после главного содержимого.

      **4. Цена изменилась к оплате.** На карточке человек видел 6 000 ₽ за ночь — 12 000 ₽ за две ночи и 600 ₽
      сбор сервиса, а пока он вводил данные карты, хозяин поднял цену. Инвариант из курса «Большие приложения»,
      урок «Когда требования спорят»: не списать больше показанного перед оплатой.
      Поэтому перед оплатой клиент запрашивает расчёт цены с номером и сроком действия, показывает итог, и сервер
      бронирует только по этому расчёту. Если цена изменилась, человек видит новую сумму до списания и решает сам.

      **5. Двойное бронирование.** Нажатие «Оплатить» на медленной сети, тайм-аут, повтор — бронирование не должно
      создаться дважды. Запрос идёт с идентификатором операции, и повтор с ним вернёт тот же результат (курс 2,
      «Повторы без двойных списаний»). А что двое не забронируют одни даты, проверяет сервер в самом действии.

      ## Компромиссы и альтернативы

      - **Карточка: заранее собранная или SSR.** Заранее собранная дешевле и быстрее — одну страницу видят тысячи
        людей, — но цена и даты в ней устаревают, поэтому их догружают на клиенте. SSR отдал бы свежую цену сразу,
        но платит за каждое открытие. Выбор — заранее собранная: описание меняется редко, а цену всё равно
        окончательно считает расчёт перед оплатой.
      - **Группы точек на сервере или на клиенте.** На клиенте проще, но тысячи точек сначала надо скачать.
        На сервере ответ маленький, но нужен отдельный запрос карты.
      - **Расчёт перед оплатой или сумма с экрана на сверку.** В курсе 1, в уроке «Чтение, запись и реакция
        интерфейса», клиент отправлял `shownTotal`, а сервер сравнивал его со своим расчётом и при расхождении
        отказывал с новой суммой. Это проще и обходится без лишнего запроса. Расчёт выбран потому, что итог
        складывается из цены за ночи, сборов и скидок, которые считает только сервер, и человек должен увидеть
        ровно ту сумму, что спишут, ещё до ввода карты. Пересмотреть, если итог станет простым.
      - **Срок действия расчёта: 5 или 15 минут.** Короче — меньше шанс оплатить устаревшую цену, длиннее —
        меньше людей увидят «цена изменилась» посреди ввода карты.

      ## Интервьюер меняет условия

      **«Распродажа: на один вечер трафик в двадцать раз выше обычного».**

      - Страницы городов и карточки и так лежат на CDN — их почти не затрагивает.
      - Поиск на сервере — главная нагрузка. Популярные поиски («Казань, эти выходные, двое») можно на вечер
        кэшировать на CDN на минуту: они одинаковы для всех. Цена в результатах может отстать на минуту — это
        допустимо, потому что окончательную цену даёт расчёт перед оплатой.
      - Свободные даты на карточке можно показывать примерно — «осталось мало дат» — и обновлять реже.
      - Не меняются инварианты: расчёт перед оплатой и проверка занятости в самом действии — без кэша
        и без упрощений (курс «Большие приложения», «Когда требования спорят»).
      - Второстепенное — например, блок «Похожие квартиры» — на вечер выключают флагом.

      ## Типичные ошибки кандидатов

      - **Один способ рендеринга на всё приложение.** Либо поисковики видят пустые страницы, либо сервер платит
        за каждое открытие одинаковых карточек.
      - **Фильтры только в памяти.** Ссылкой на поиск не поделиться, «Назад» теряет фильтры.
      - **Тысячи меток на карте** без группировки.
      - **Цена с экрана — сразу в оплату.** Человек платит не ту сумму, что видел, или сервер списывает больше.
      - **Повтор бронирования без идентификатора операции.**

      ## Коротко

      - Способ рендеринга выбирают по странице: публичные одинаковые страницы городов и карточки — заранее
        собранные с пересборкой, поиск по параметрам — на сервере, бронирование и оплата — в браузере за входом.
      - Изменчивое на заранее собранной странице — цену и свободные даты — догружают на клиенте, а окончательное
        решение принимает сервер в момент действия.
      - Параметры поиска живут в адресе: поиском делятся ссылкой, а «Назад» возвращает фильтры. При смене фильтра
        выбрасывают загруженные страницы и курсор.
      - Карта с тысячами квартир получает от сервера группы точек под масштаб, а ответ на движение карты
        сверяют с текущими границами.
      - Главное фото карточки — в HTML с высоким приоритетом и нужной ширины, остальные фото галереи — лениво.
      - Перед оплатой — расчёт цены с номером и сроком действия: сервер бронирует только по нему, и человек
        не заплатит больше, чем видел. Повтор бронирования идёт с идентификатором операции.

      ## Источники

      - [Rendering on the Web — web.dev](https://web.dev/articles/rendering-on-the-web)
      - [Optimize Largest Contentful Paint — web.dev](https://web.dev/articles/optimize-lcp)

  - id: sdp-collab
    topic: Разборы кейсов
    subtopic: Совместный документ без сети
    title: 'Разбор: совместный документ без сети'
    body: |
      ## Условие

      «Спроектируйте редактор документов, где два человека правят один документ, в том числе без сети».

      ## Уточняем требования

      - «Что за документы?» — «Планы уроков для учителей: заголовок, разделы, текст с форматированием, список
        заданий. До двадцати страниц».
      - «Кто правит?» — «Обычно учитель и методист, иногда одновременно, иногда по очереди».
      - «Насколько без сети?» — «В сельских школах связь бывает раз в несколько дней. Учитель может неделю править
        план без сети, а методист в это время — тот же план из города».
      - «На каких устройствах?» — «Ноутбук в школе, планшет дома; часто план открыт в нескольких вкладках».
      - «Видеть друг друга?» — «Желательно видеть, где сейчас курсор коллеги, если оба в сети».
      - «Кто может открыть план?» — «Автор и те, кому он дал доступ».
      - «Что важнее всего?» — «Не потерять ни одной правки — ни учителя, ни методиста».

      **Почему эти вопросы:**
      - «Кто правит?» — «иногда одновременно» решает, нужна ли совместная правка вообще или хватит версий;
      - «Насколько без сети?» — неделя без связи отсекает блокировки и центральный арбитр: копии должны сходиться
        сами;
      - «Что важнее всего?» — «не потерять ни одной правки» отсекает «последняя запись побеждает»;
      - «Кто может открыть план?» — права проверяет сервер, и это влияет на то, что делать с отклонёнными правками.

      **Первая версия:** совместная правка текста, работа без сети, курсоры коллег, несколько вкладок.
      **Отложено:** комментарии, права «только чтение», история версий с откатом.

      ## Оценки и допущения

      - Документ — десятки килобайт текста; правок за неделю — тысячи. Объём небольшой, но долгое расхождение копий
        — главное условие задачи.
      - Два человека пишут в одном тексте и могут неделю не видеть друг друга. По курсу «Синхронизация и офлайн»,
        урок «Совместный текст: OT и CRDT», это и есть случай, когда нужно посимвольное слияние.

      ## Схема

      - **Редактор** — текст, разделы, курсоры коллег.
      - **Документ CRDT** — состояние документа в готовой библиотеке, например Yjs: каждая правка — операция,
        которая сходится с чужими в любом порядке.
      - **Локальное хранилище** — состояние документа и неотправленные изменения в IndexedDB.
      - **Синхронизация** — WebSocket к серверу документов: обмен «что у меня есть — чего не хватает».
      - **Сервер документов** — хранит и рассылает изменения, проверяет права на каждую правку.
      - **Обычный API** — список документов, доступы, название, владелец.

      ![Схема редактора: редактор поверх документа CRDT; документ сохраняется в IndexedDB на устройстве; синхронизация через WebSocket обменивается векторами состояния с сервером документов, который хранит и рассылает изменения и проверяет права; ведущая вкладка держит соединение, остальные получают изменения через BroadcastChannel; список документов и доступы — обычным API](images/sdp-collab.png "Документ живёт на устройстве и сходится через сервер")

      ## Данные и контракт API

      - **Документ** — состояние CRDT. Сервер хранит снимок и изменения после него и умеет ответить на вопрос
        «вот вектор состояния — какие изменения мне нужны?» (курс «Синхронизация и офлайн», урок «Когда связь
        вернулась»).
      - **Изменения** — от клиента к серверу и обратно по WebSocket. Каждое изменение несёт идентификатор, поэтому
        повтор после обрыва безопасен. Неотправленные изменения — это и есть журнал операций на устройстве (курс
        «Синхронизация и офлайн», урок «Журнал операций»); с CRDT порядок их отправки неважен.
      - **Присутствие** — курсоры коллег, отдельно от документа и без сохранения: их можно терять, у них срок
        действия.
      - **Метаданные** — название, владелец, доступы — обычным API с версиями и проверкой при сохранении (курс 2,
        «Версии и конфликты»). Тексту CRDT нужен, а названию и доступам — нет.
      - **Версия формата** — у документа и у изменений, на случай обновления приложения.

      ## Критические сценарии

      **1. Двое пишут в одном абзаце.** CRDT даёт каждому символу идентификатор и вставляет по ссылке на соседа,
      а не по позиции, поэтому правки сходятся у обоих одинаково. Блокировка абзаца или «последняя запись
      побеждает» здесь не подходят: блокировка мешает работать без сети, а последняя запись теряет чужой текст
      (урок «Блокировки, версии и последняя запись»).

      **2. Неделя без сети.** Все правки учителя сразу пишутся в документ на устройстве и в IndexedDB — данные
      живут на устройстве (урок «Данные живут на устройстве»). Приложение просит постоянное хранение через
      `navigator.storage.persist()`, чтобы браузер не вытеснил неделю работы. Над документом видно: «Нет связи.
      Правки сохранены на устройстве и отправятся позже». Когда связь вернулась, клиент и сервер обмениваются
      векторами состояния и досылают друг другу недостающее, и CRDT сводит копии.

      **3. Слияние верно технически, но странно по смыслу.** Учитель и методист за неделю оба переписали одно
      задание. CRDT сохранит оба текста, и в абзаце окажутся две версии подряд — ни одна правка не потеряна,
      но читать это неудобно. Поэтому после долгого расхождения редактор подсвечивает изменения коллеги
      за время офлайна, чтобы человек сам решил, что оставить. Алгоритм гарантирует сходимость, а смысл решает
      человек.

      **4. Доступ отобрали, пока учитель был без сети.** Сервер проверяет права на каждую правку и отклонит изменения
      учителя. Клиент не теряет их молча: показывает причину, сохраняет текст отдельно и даёт забрать — например,
      скопировать в новый документ. Свою копию документа он сбрасывает и загружает с сервера заново: отменить одну
      уже применённую правку CRDT нельзя (урок «Когда связь вернулась»).

      **5. Приложение обновилось за неделю.** В новой версии появился новый тип блока. Изменения старой версии
      сервер принимает дольше самого долгого возможного офлайна (урок «Синхронизация после долгого офлайна»), а старый клиент, встретив незнакомый блок,
      показывает его заглушкой, а не падает — терпимый читатель из курса «Большие приложения», урок «Эволюция
      контрактов и данных».

      **6. Несколько вкладок.** Одна ведущая вкладка держит соединение, остальные получают изменения через
      `BroadcastChannel`, а состояние в IndexedDB общее (урок «Несколько вкладок»).

      ## Компромиссы и альтернативы

      - **CRDT или OT.** OT обычно опирается на центральный сервер и медленно сводит долго расходившиеся копии;
        CRDT сходится без арбитра в любом порядке. Неделя без сети решает в пользу CRDT.
      - **CRDT или версии со слиянием по разделам.** Если бы план правили по очереди и без долгого офлайна, хватило
        бы версий и слияния по разделам с выбором человека при конфликте: проще и без служебных данных. Пересмотреть
        выбор, если окажется, что одновременной правки почти нет.
      - **Цена CRDT:** служебные данные и надгробия удалённого текста растут, поэтому сервер время от времени
        сжимает историю в снимок; библиотека добавляет вес к странице; сервер почти не может проверять смысл
        правок — только права.

      ## Интервьюер меняет условия

      **«Появились комментарии и права „только чтение“».**

      - **Комментарий** привязан к фрагменту текста. Если запомнить его позицией «символы 120–140», любая вставка
        выше сдвинет его не туда. Поэтому якорь комментария — относительная позиция: ссылка на идентификаторы
        символов CRDT, которая не зависит от чужих правок (в Yjs это называется relative position). Сами комментарии
        — отдельные записи у сервера: автор, текст, якорь, статус «решён».
      - **Только чтение.** Право проверяет сервер на каждом изменении и не принимает правки от читателя. Клиент
        читателя открывает документ без возможности ввода и не копит правки офлайн — иначе через неделю они все
        будут отклонены.
      - Что не меняется: документ CRDT, хранение на устройстве, синхронизация, вкладки.

      ## Типичные ошибки кандидатов

      - **«Последняя запись побеждает» для текста.** Неделя работы одного из двоих пропадает.
      - **Блокировка документа** при условии работы без сети.
      - **Писать свой CRDT на интервью** вместо готовой библиотеки и разговора о том, что вокруг неё.
      - **Доверять клиенту права.** Проверять их может только сервер, на каждой правке.
      - **Хранить офлайн-правки только в памяти.** Закрытая вкладка — потерянная неделя.
      - **Комментарий по номеру символа** — он уезжает после первой же чужой правки.

      ## Коротко

      - Когда двое правят один текст, в том числе неделю без сети, нужно посимвольное слияние, и берут готовую
        библиотеку CRDT. Блокировка мешает работать без сети, а «последняя запись побеждает» теряет чужой текст.
      - Документ живёт на устройстве: правки сразу пишутся в IndexedDB, приложение просит постоянное хранение,
        а при возврате связи клиент и сервер обмениваются векторами состояния и досылают недостающее.
      - Сходимость гарантирует алгоритм, а смысл — человек: после долгого расхождения редактор подсвечивает
        изменения коллеги.
      - Права проверяет сервер на каждой правке. Отклонённые правки не теряются молча: человек видит причину
        и может забрать текст.
      - CRDT нужен тексту, а метаданным — названию, доступам — хватает обычного API с версиями. Цена CRDT —
        служебные данные, надгробия и вес библиотеки.
      - Комментарий привязывают относительной позицией к идентификаторам символов, а не номером символа, иначе он
        уезжает после чужих правок.

      ## Источники

      - [Relative Positions — Yjs Docs](https://docs.yjs.dev/api/relative-positions)
      - [Local-first software — Ink & Switch](https://www.inkandswitch.com/essay/local-first/)

  - id: sdp-growth
    topic: Разборы кейсов
    subtopic: Растущий продукт
    title: 'Разбор: растущий продукт'
    body: |
      ## Условие

      «Наш продукт вырос. Как бы вы перестроили фронтенд?»

      Это задача не на новый продукт, а на развитие существующего. План ответа тот же, но требования здесь —
      это боли сегодняшнего дня, а схема — переход от того, что есть, к тому, что нужно.

      ## Уточняем требования

      - «Что за продукт?» — «Сервис записи к врачу: пациенты ищут врача и записываются, клиники ведут расписание.
        Три года назад его делали восемь человек, сейчас — шесть команд, около сорока фронтендеров».
      - «Как устроен фронтенд сейчас?» — «Одно приложение на React для пациентов и клиник, один репозиторий,
        одна выкатка раз в день. Кабинет клиники внутри написан на старой версии нашего же кода, его все боятся
        трогать».
      - «Что болит?» — «Выкатка ломается чужими изменениями, и откатывают всех. Сборка с тестами — 50 минут.
        Кабинет клиники медленный. Когда падает сервис отзывов о врачах, не открывается страница врача».
      - «Кто какие части делает?» — «Команды по слоям: „Интерфейс“, „Данные“, „Платформа“, а также „Пациенты“,
        „Клиники“ и „Платежи“ — смешанно».
      - «Что важно бизнесу?» — «Запись к врачу должна работать всегда: это деньги клиник и здоровье людей».
      - «Ограничения?» — «Нельзя остановить разработку на полгода».

      **Почему эти вопросы:**
      - «Как устроен фронтенд сейчас?» — задача про развитие, а не про новый продукт: решение — переход от того,
        что есть;
      - «Что болит?» — отделяет организационные боли (общий откат) от технических (медленная сборка) — у них разное
        лечение;
      - «Кто какие части делает?» — команды по слоям — первый кандидат на перестройку;
      - «Что важно бизнесу?» — задаёт главный путь, который должен работать при отказах;
      - «Ограничения?» — «нельзя остановить разработку» отсекает переписывание разом.

      **Первый шаг:** границы команд и владельцы, независимый откат функций, страница врача без зависимости
      от отзывов. **Потом:** переезд кабинета клиники, ускорение сборки, долг.

      ## Оценки и допущения

      - Шесть команд и одна выкатка в день — проблема организационная: команды мешают друг другу общим графиком
        и общими файлами, а не фреймворком (курс «Большие приложения», урок «Когда приложение делают много
        команд»).
      - Сборка 50 минут — проблема техническая. Её лечат инструментами, а не перестановкой команд.
      - Запись к врачу — главный сценарий, и её отказ дороже любого другого. Это задаёт приоритеты при отказах
        и нагрузке.

      ## Схема: куда переходим

      - **Команды по предметным областям** вместо слоёв: «Поиск и запись» (пациенты), «Кабинет клиники»,
        «Платежи», «Отзывы и рейтинги»; «Платформа» — сборка, выкатка, вход, клиент API; «Дизайн-система».
        Обычная задача — «добавить онлайн-приём» — теперь целиком в одной команде (курс «Большие приложения»,
        «Границы между командами»).
      - **Два приложения по адресам:** для пациентов и для клиник. Они почти не пересекаются на экране, у них разные
        люди и разные требования к скорости. Внутри каждого — **модульный монолит** с проверяемыми границами
        и владельцами в CODEOWNERS, а не микрофронтенды внутри страницы: общих экранов у команд почти нет
        («Модульный монолит или микрофронтенды»).
      - **Общее** — пакеты дизайн-системы и входа с версиями по semver.

      ![Два приложения по адресам — для пациентов и для клиник — с модульным монолитом внутри; приложение пациентов идёт в API записи и к серверу отрисовки страницы врача, тот зовёт сервис отзывов с коротким тайм-аутом, своим пределом и предохранителем; разделы кабинета клиники прокси на входе отправляет в старое или новое приложение](images/sdp-growth.png "Рост: к чему переходим")

      ## Данные и контракты

      - **Контракты между модулями** — публичные интерфейсы, проверяемые линтером; общие компоненты —
        у «Дизайн-системы», клиент API — у «Платформы» (курс «Большие приложения», «Контракты между командами»).
      - **Контракт API** меняют только последовательно совместимо: у API теперь два приложения-потребителя
        и мобильные приложения пациентов (урок «Эволюция контрактов и данных»).
      - **Флаги функций** — на сервере, одинаковые для человека; новая функция выходит за флагом и откатывается
        флагом, не трогая чужие изменения (курс «Доставка и качество», «Проверки и выкатка»).

      ## Критические сценарии

      **1. Чужое изменение откатывает всех.** Каждая новая функция выходит за флагом, и откат — выключение флага,
      а не выкатки. Выкатку делают чаще и меньше, и каждая команда отвечает за свои флаги. Это снимает большую
      часть боли сразу, без смены архитектуры. Изменения общего кода и зависимостей за флаг не спрячешь — для них
      нужны границы и владельцы.

      **2. Страница врача падает вместе с отзывами.** Отзывы — второстепенное. Сервер отрисовки страницы врача
      зовёт их с коротким тайм-аутом по важности и через отдельный предел соединений, а за серией отказов
      предохранитель перестаёт их звать, и страница выходит без блока отзывов (курс «Большие приложения»,
      «Отказы и деградация»). Запись — главный путь, и от отзывов она не зависит.

      **3. Старый кабинет клиники.** Его переводят на новый код по разделам: прокси на входе отправляет каждый
      раздел в старое или новое приложение, первым идёт раздел, где ошибка недорога, а расписание — последним
      и с выкаткой по шагам. Пока возможен откат, новое пишет данные в формате, понятном старому, а критерий
      окончания и владелец записаны заранее («Постепенная миграция»).

      **4. Сборка 50 минут.** Проверки только по затронутым модулям и кэш сборки — техническое масштабирование.
      Разрезать приложение ради скорости сборки было бы лечением не той болезни («Границы между командами»).

      **5. Кабинет клиники медленный.** Сначала измерить по данным реальных пользователей и разложить метрики:
      браузер, сеть или сервер. Скорее всего, расписание на неделю для двадцати врачей — тысячи ячеек
      в документе, и тогда помогает виртуализация или показ одного дня. Решать по замеру, а не по догадке
      («Где узкое место»).

      ## Компромиссы и альтернативы

      - **Модульный монолит или микрофронтенды.** Микрофронтенды дали бы независимую выкатку, но флаги и проверки
        по затронутым модулям решают общий откат дешевле, а цена микрофронтендов — размер, версии и эксплуатация.
        Пересмотреть, если через три месяца откаты всё ещё задевают чужие команды.
      - **Переписать кабинет клиники или переезжать по частям.** Переписать разом — полгода без новых функций
        и один рискованный день. По частям — дольше, но польза приходит по ходу, а остановить разработку нельзя.
      - **Решение — в ADR** с контекстом, альтернативами, последствиями и условием пересмотра (курс 1, «Риски
        и развитие решения»; «Технический долг как решение»).

      ## Интервьюер меняет условия

      **«Через месяц запуск в новой стране, а команда „Отзывы и рейтинги“ уходит на другой проект».**

      - **Новая страна.** Языки, валюта и часовые пояса — подготовка интернационализации: тексты по ключам, `Intl`
        для дат и денег, время приёма в поясе клиники (курс «Доставка и качество», «Языки, валюты и часовые
        пояса»). Месяц — мало, поэтому первая версия — только для пациентов, а кабинет клиники переводят позже.
        Это решение записывают вслух как компромисс.
      - **Уходит команда.** У модуля отзывов должен остаться владелец: его передают другой команде, в CODEOWNERS
        меняется строка. Если модуль не передать, он станет общим без хозяина — то, от чего уходили. Благодаря
        тому, что отзывы уже второстепенны и изолированы предохранителем, их временное замораживание не угрожает
        записи.

      Не меняются: границы приложений, флаги, переезд кабинета.

      ## Типичные ошибки кандидатов

      - **«Перепишем всё на микрофронтенды».** Решение дорогое и не лечит ни сборку, ни зависимость от отзывов.
      - **Переписать кабинет разом,** остановив разработку.
      - **Лечить медленную сборку перестановкой команд** или общую выкатку — быстрой сборкой.
      - **Оставить модуль без владельца,** когда команда уходит.
      - **Ускорять кабинет без замера.**

      ## Коротко

      - На задаче про растущий продукт требования — это сегодняшние боли, а схема — переход от того, что есть,
        к тому, что нужно, без остановки разработки.
      - Организационные боли — общий откат и чужие файлы — лечат границами по предметным областям, владельцами
        и флагами функций; техническую — медленную сборку — проверками по затронутым модулям и кэшем.
      - Два приложения по адресам с модульным монолитом внутри обычно дешевле микрофронтендов внутри страницы,
        если общих экранов у команд почти нет.
      - Второстепенный сервис не должен ронять главный путь: тайм-аут по важности, отдельный предел соединений
        и предохранитель.
      - Старую часть переводят по разделам за общим входом, с точками отката, форматом данных, понятным старому
        коду, и заранее записанным критерием окончания.
      - Ускоряют то, что показал замер, а решения записывают в ADR с альтернативами и условием пересмотра.
      - Когда команда уходит, у её модуля назначают нового владельца: модуль без хозяина снова становится общим
        для всех.

      ## Что вы теперь умеете

      - Проводить архитектурное интервью по плану: требования, схема, данные и API, критические сценарии,
        компромиссы — и распределять время так, чтобы дойти до трудных мест.
      - Делать допущения порядком величины, отвечать на новые условия точечно и называть развилки по гарантиям
        сервера.
      - Защищать решение требованиями, инвариантами, сценариями отказа и альтернативами и менять его по верному
        доводу.
      - Решать задачи на компонент и на приложение, применяя механизмы всех шести курсов: от контракта компонента
        до синхронизации без сети и развития большого продукта.

      ## Что дальше

      Теория закончилась. Дальше — устный набор «Системный дизайн: практика — устные кейсы» в каталоге: задачи для
      самостоятельного решения с эталонным планом ответа. Решайте вслух и с таймером на 45 минут, потом сверяйтесь
      с эталоном по тезисам. Лучше всего — с другом, который сыграет интервьюера и будет менять условия.

      ## Источники

      - [Micro Frontends — Cam Jackson, martinfowler.com](https://martinfowler.com/articles/micro-frontends.html)
      - [Strangler Fig Application — Martin Fowler](https://martinfowler.com/bliki/StranglerFigApplication.html)

questions:
  - id: sdp-intro-001
    topic: Введение
    subtopic: Архитектурное интервью
    level: junior
    question: |
      На интервью кандидату дали задачу «Спроектируйте экран тренировок для фитнес-приложения». Он 20 минут рисует
      схему, изредка называя блоки, потом показывает готовый результат. Схема хорошая, но интервьюер ставит низкую оценку
      по нескольким шкалам. Почему?
    options:
      - text: 'Интервьюер оценивает только сказанное вслух, а рассуждений он не услышал'
        correct: true
        why: 'Ход рассуждения — главный предмет оценки. Без него интервьюер не знает, уточнял ли кандидат требования и видел ли альтернативы.'
      - text: 'Архитектурное интервью начинают с кода ключевых компонентов, а схему рисуют в самом конце'
        why: 'Кода на архитектурном интервью обычно почти нет. Беда не в порядке, а в том, что рассуждений не слышно.'
      - text: 'Двадцати минут на схему мало: по плану на неё отводят большую часть часа интервью'
        why: 'Время на схему здесь ни при чём. Интервьюер не может оценить то, что кандидат не произнёс.'
      - text: 'Интервьюеру нужна была ещё схема базы данных, а кандидат нарисовал только клиентскую часть'
        why: 'На фронтенд-интервью схему базы данных обычно не ждут: в центре клиентская часть.'
    explanation: |
      Правильного ответа у архитектурной задачи нет, поэтому оценивают ход рассуждения: какие вопросы кандидат
      задал, какие допущения сделал, какие варианты сравнил. Руководство GreatFrontEnd формулирует это прямо:
      интервьюер оценивает только то, что произнесено вслух. Рассуждать вслух — часть работы на интервью.
    links:
      - https://www.greatfrontend.com/front-end-system-design-playbook/evaluation-axes

  - id: sdp-intro-002
    topic: Введение
    subtopic: Архитектурное интервью
    level: middle
    question: |
      На интервью по фронтенду в онлайн-кинотеатре кандидат 15 минут из часа объясняет, как бы он разделил базу
      фильмов на шарды и масштабировал серверы рекомендаций. Про экран каталога, загрузку постеров и медленную
      сеть он почти ничего не сказал. Что, скорее всего, отметит интервьюер?
    options:
      - text: 'Сильную техническую грамотность: кандидат хорошо разбирается в масштабировании серверов'
        why: 'Масштабирование серверов на фронтенд-интервью обычно не ждут. Время ушло не на ту задачу.'
      - text: 'Хорошее исследование задачи: кандидат сам нашёл самое трудное место системы'
        why: 'Исследование задачи — это уточнение требований к продукту, а не выбор, о чём удобнее рассказать.'
      - text: 'Время ушло на сервер, а клиент — сеть, данные, экраны — остался нераскрытым'
        correct: true
        why: 'На фронтенд-интервью в центре клиент: сеть, устройство, данные на клиенте, контракт API. Сервер обычно чёрный ящик, о гарантиях которого договариваются.'
      - text: 'Плюс за техническую грамотность, но минус за время: тема верная, просто рассказ затянулся'
        why: 'Тема не та: шардирование и масштабирование серверов на фронтенд-интервью обычно не ждут. Дело не в длине рассказа, а в том, что клиент остался нераскрытым.'
    explanation: |
      Фронтенд-интервью — про клиентскую часть: главные ограничения там — сеть, слабое устройство и браузер.
      Front End Interview Handbook прямо пишет, что схемы базы данных и масштабирования серверов обычно не ждут.
      Сервер остаётся чёрным ящиком, а кандидат решает, какие гарантии и какой API ему от сервера нужны.
    links:
      - https://www.frontendinterviewhandbook.com/front-end-system-design

  - id: sdp-intro-003
    topic: Введение
    subtopic: Архитектурное интервью
    level: senior
    question: |
      На интервью «Спроектируйте приложение онлайн-банка для переводов» кандидат предложил хорошую схему. Интервьюер
      возразил: «Половина клиентов открывает приложение в метро без связи». Кандидат ответил: «Это не входило
      в условие, моё решение и так верное» — и продолжил. По каким шкалам оценки это минус?
    multiple: true
    options:
      - text: 'Общение: кандидат не принял довод интервьюера и не стал менять решение'
        correct: true
        why: 'Шкала общения проверяет, слушает ли кандидат и меняет ли решение по доводам. Здесь новое условие отброшено.'
      - text: 'Продуктовое чутьё: работа без связи — прямая забота о человеке'
        correct: true
        why: 'Клиент в метро без связи — продуктовая ситуация. Отмахнуться от неё — не подумать о человеке.'
      - text: 'Архитектура: интервьюер ждал, что схема с самого начала будет рассчитана на работу без сети'
        why: 'Условия про метро не было в начале, и хорошую схему не наказывают за то, о чём не спрашивали. Минус — в реакции на новое условие.'
      - text: 'Техническая грамотность: кандидат не знает, как работать без сети'
        why: 'Из ответа этого не видно: кандидат не показал ни знания, ни незнания — он просто отказался обсуждать.'
      - text: 'Исследование задачи: кандидат не уточнил, что значит работа без связи для переводов'
        correct: true
        why: 'Шкала проверяет, уточняет ли кандидат требования. Новое условие — повод спросить, что нужно без связи: смотреть баланс или отправлять перевод.'
    explanation: |
      Новое условие посреди интервью — нормальная часть разговора: интервьюер проверяет, как кандидат адаптирует
      решение. Отказ его обсуждать бьёт сразу по трём шкалам: исследованию задачи — кандидат не уточнил новое
      требование, — общению и продуктовому чутью. Как отвечать
      на такие повороты, разбирает урок «Защита решения».
    links:
      - https://www.greatfrontend.com/front-end-system-design-playbook/evaluation-axes

  - id: sdp-framing-001
    topic: Как вести интервью
    subtopic: План ответа и время
    level: junior
    question: |
      Интервьюер говорит: «Спроектируйте календарь для команды: встречи, приглашения, напоминания». Больше он
      ничего не добавляет и ждёт. С чего лучше начать ответ?
    options:
      - text: 'Нарисовать схему частей: сетка недели, карточка встречи, форма приглашения, напоминания'
        why: 'Схема без требований может решать другую задачу: неизвестно, нужны ли повторяющиеся встречи, часовые пояса или работа без сети.'
      - text: 'Спросить, кто пользуется календарём, что главное и какой масштаб, записать первую версию'
        correct: true
        why: 'Требования — первая часть плана. Условие нарочно неполное: интервьюер ждёт, что кандидат уточнит, что строить.'
      - text: 'Выбрать фреймворк и библиотеку состояния и объяснить, почему именно они подходят календарю'
        why: 'Выбор инструментов не показывает архитектурного мышления и ничего не говорит о том, что нужно продукту.'
      - text: 'Описать API сервера для встреч и приглашений со всеми полями запросов и ответов'
        why: 'API выводят из того, что показывает экран и что делает человек. Пока требований нет, поля API — догадка.'
    explanation: |
      Ответ начинают с требований: главные сценарии, важные качества (скорость, сеть, устройства, доступность,
      языки), масштаб и первая версия. Условие на интервью нарочно короткое — интервьюер играет заказчика
      и ждёт вопросов. На это уходит около 10 % времени, но без этой части остальное может решать не ту задачу.
    links:
      - https://www.greatfrontend.com/front-end-system-design-playbook/framework

  - id: sdp-framing-002
    topic: Как вести интервью
    subtopic: План ответа и время
    level: middle
    question: |
      Интервью на 45 минут, задача — приложение для заказа такси. Прошло 25 минут: кандидат уточнил требования
      и всё ещё дорисовывает схему — добавил уже двенадцать частей. До данных, API и трудных мест он не дошёл.
      Что лучше сделать прямо сейчас?
    options:
      - text: 'Сказать вслух, что время уходит, свернуть схему, назвать главные запросы и перейти к трудному'
        correct: true
        why: 'Почти половина времени по плану — на трудные места, по ним видно уровень. Проверка времени вслух показывает, что кандидат ведёт разговор.'
      - text: 'Дорисовать схему полностью: без законченной схемы данные и трудные места просто не обсудить'
        why: 'Двенадцать частей — уже больше, чем нужно для разговора. Ещё десять минут на схему оставят на трудные места минуты.'
      - text: 'Пропустить данные и API целиком и сразу перейти к компромиссам, чтобы успеть главное'
        why: 'Компромиссы без данных и трудных сценариев — разговор ни о чём. Лучше сократить каждую часть, а не выбросить нужную.'
      - text: 'Попросить у интервьюера ещё 15 минут, чтобы спокойно пройти все части плана'
        why: 'Время интервью обычно фиксировано. Управлять им внутри — часть того, что оценивают.'
    explanation: |
      Доли времени по руководству GreatFrontEnd: требования ~10 %, схема ~20 %, данные ~10 %, интерфейсы ~20 %,
      углубление ~40 %. Время проверяют по ходу и говорят о нём вслух: «Прошло 25 минут, сокращаю схему
      до главного, называю два главных запроса и перехожу к трудным местам». Пропорция важнее точных минут.
    links:
      - https://www.greatfrontend.com/front-end-system-design-playbook/framework

  - id: sdp-framing-003
    topic: Как вести интервью
    subtopic: План ответа и время
    level: middle
    question: |
      На интервью «Спроектируйте страницу исполнителя в музыкальном сервисе» интервьюер не называет, сколько
      у сервиса слушателей. От этого зависит, обновлять ли счётчик «сейчас слушают» опросом или потоком событий.
      Какое допущение прозвучит лучше всего?
    options:
      - text: '«У сервиса будет 3 482 000 слушателей в месяц и 1 270 запросов в секунду в пиковый вечерний час»'
        why: 'Точные числа из воздуха звучат как выдумка и ничего не объясняют: не сказано, что от них зависит.'
      - text: '«Не знаю, сколько слушателей, поэтому сразу сделаю поток событий для всех: он выдержит любую нагрузку, и считать не нужно»'
        why: 'Решение «на любую нагрузку» — преждевременное масштабирование. Без допущения не из чего выбирать.'
      - text: '«Допустим, сотни тысяч открытых страниц — опрос даст тысячи запросов в секунду, нужен поток; сотни — хватит опроса»'
        correct: true
        why: 'Порядок величины, что от него зависит в решении и что изменится, если допущение неверно, — все три части хорошего допущения.'
      - text: '«Число слушателей — вопрос бэкенда: фронтенду оно не важно, страницу всё равно отдаёт сервер»'
        why: 'От масштаба зависит, как часто и каким способом клиент узнаёт новое. Это решение фронтенда.'
    explanation: |
      Хорошее допущение состоит из трёх частей: порядок величины, что от него зависит в решении и что изменится,
      если оно неверно. Порядка величины — тысячи, миллионы — почти всегда достаточно. Точное число без основания
      хуже: оно звучит как выдумка и не помогает выбрать.
    links:
      - https://www.greatfrontend.com/front-end-system-design-playbook/framework

  - id: sdp-framing-004
    topic: Как вести интервью
    subtopic: План ответа и время
    level: senior
    question: |
      Задача — приложение для водителей такси. Требования уже уточнены: водители часто едут через места
      со слабой связью, предложение заказа надо принять за 15 секунд, иначе оно уходит другому, телефоны бывают
      старыми. Осталось 18 минут на трудные места. Какие темы стоит разобрать?
    multiple: true
    options:
      - text: 'Что увидит водитель, если ответ на «Принять заказ» не пришёл из-за слабой связи'
        correct: true
        why: 'Это трудное место именно этого продукта: неизвестный исход действия при 15 секундах на решение и слабой сети.'
      - text: 'Как отправлять координаты при слабой связи, не разряжая старый телефон'
        correct: true
        why: 'Связь и старые телефоны названы в требованиях, а координаты — сердце приложения водителя.'
      - text: 'Как выбрать способ рендеринга, чтобы поисковики хорошо индексировали экраны приложения водителя'
        why: 'Приложение водителя закрыто входом, поисковикам его экраны не нужны. Тема из курса верная, но не для этого продукта.'
      - text: 'Как синхронизировать черновик анкеты водителя между телефоном и ноутбуком'
        why: 'Ни анкеты, ни второго устройства в требованиях нет. Трудные места выбирают по требованиям этого продукта.'
      - text: 'Как показать карту с маршрутом на старом телефоне, не подвешивая интерфейс'
        correct: true
        why: 'Старые телефоны названы в требованиях, а карта с маршрутом — тяжёлая постоянная работа в приложении водителя.'
    explanation: |
      На трудные места уходит почти половина времени, и выбирают их по требованиям этого продукта, а не из общего
      списка оптимизаций. Слабая связь, 15 секунд на решение и старые телефоны прямо указывают, где система
      ломается: неизвестный исход действия, передача координат и тяжёлая карта на старом телефоне.
    links:
      - https://www.greatfrontend.com/front-end-system-design-playbook/framework

  - id: sdp-framing-005
    topic: Как вести интервью
    subtopic: План ответа и время
    level: senior
    question: |
      На интервью по порталу госуслуг вопрос узкий: «Как бы вы сделали бесконечную прокрутку в списке поданных
      заявлений?». Кандидат начинает полный план: семь минут спрашивает о пользователях продукта, потом рисует
      схему всего портала. Что было бы лучше?
    options:
      - text: 'Полный план правильный: без схемы всего портала прокрутку списка заявлений не обсудить'
        why: 'Узкий вопрос уже задаёт фокус. Схема всего портала съедает время, которого на сам механизм не останется.'
      - text: 'Коротко уточнить объём, изменчивость списка и нужна ли ссылка на место — и перейти к механизму'
        correct: true
        why: 'План гибкий: на узкий вопрос хватает нескольких уточнений по существу, а дальше — пагинация, виртуализация, сохранение места.'
      - text: 'Сразу назвать подходящую библиотеку бесконечной прокрутки и подробно объяснить, как её подключить'
        why: 'Без уточнений неизвестно главное: растёт ли список во время просмотра и сколько в нём записей. Название библиотеки решения не заменяет.'
      - text: 'Сразу описать курсорную пагинацию и виртуализацию, ничего не уточняя у интервьюера'
        why: 'Механизм может не понадобиться: если заявлений у человека десяток, хватит одной страницы. Несколько уточнений по существу нужны и на узкий вопрос.'
    explanation: |
      План ответа — подсказка, а не ритуал. Руководство GreatFrontEnd предостерегает от того, чтобы натягивать
      полный план на узкий вопрос. Для узкого вопроса хватает нескольких уточнений по существу — объём, изменчивость,
      нужна ли ссылка на место — и разговора о самом механизме: курсорная пагинация, виртуализация, восстановление
      прокрутки.
    links:
      - https://www.greatfrontend.com/front-end-system-design-playbook/framework

  - id: sdp-defense-001
    topic: Как вести интервью
    subtopic: Защита решения
    level: junior
    question: |
      Кандидат проектирует онлайн-кинотеатр. Интервьюер спрашивает: «Почему вы грузите каталог страницами
      по 20 фильмов, а не всё сразу?». Какой ответ — защита решения, а не упрямство?
    options:
      - text: '«Так всегда делают с каталогами: страницы по 20 — стандартный подход, его ждут на любом интервью»'
        why: 'Довод через привычку не объясняет, почему решение подходит этим требованиям.'
      - text: '«Фильмов десятки тысяч, на экране — два десятка; всё сразу — долгий первый показ. Будь их сотня — грузил бы сразу»'
        correct: true
        why: 'Довод через требования и цену, плюс условие, при котором выбор поменялся бы. Это и есть защита.'
      - text: '«Я так решил с самого начала, и в условии задачи не было требования грузить весь каталог разом, так что не меняю»'
        why: 'Ссылка на условие вместо довода — упрямство. Интервьюер проверяет, понимает ли кандидат своё решение.'
      - text: '«Хорошо, вы правы, тогда загружу весь каталог сразу одним запросом, так даже проще»'
        why: 'Это не защита, а отказ от решения без довода. Вопрос «почему?» — повод объяснить, а не сдаться.'
    explanation: |
      Решение защищают доводами: требованиями и ограничениями, инвариантами, сценариями отказа и отвергнутыми
      альтернативами с условием пересмотра. «Так принято» и «так было в условии» доводами не являются. На вопрос
      «почему не Y?» хороший ответ сравнивает X и Y по требованиям и называет, когда выбрал бы Y.
    links:
      - https://www.greatfrontend.com/front-end-system-design-playbook/evaluation-axes

  - id: sdp-defense-002
    topic: Как вести интервью
    subtopic: Защита решения
    level: middle
    question: |
      Кандидат спроектировал музыкальный сервис: плеер, библиотека, поиск, плейлисты. Интервьюер добавляет:
      «Теперь треки из плейлиста нужно слушать без сети». Что лучше сделать?
    options:
      - text: 'Начать схему заново: офлайн меняет устройство всего приложения, и старая схема для него уже не годится'
        why: 'Офлайн затрагивает хранение треков и плейлистов, но не поиск и не сам плеер. Перерисовка теряет время и показывает, что кандидат не видит границ своего решения.'
      - text: 'Найти затронутое — хранение треков и плейлистов, сказать, что поиск и вид плеера прежние, назвать цену'
        correct: true
        why: 'Точечный ответ: что затронуто, что остаётся, что меняем и чем платим — место на устройстве, обновление сохранённых плейлистов.'
      - text: 'Ответить, что работа без сети не входила в условие первой версии, и продолжить по плану'
        why: 'Новое условие — нормальная часть интервью. Отказ его обсуждать — минус по общению и продуктовому чутью.'
      - text: 'Сохранять треки из плейлистов в `localStorage`, а остальную схему приложения не трогать'
        why: 'В `localStorage` около 5 МБ и только строки (курс 2, «Работа без сети и очередь действий»), а трек весит мегабайты. Хранение придётся менять всерьёз.'
    explanation: |
      На новое условие отвечают точечно: уточняют, находят на схеме затронутые части, говорят, что остаётся,
      и предлагают изменение с ценой. Хорошие границы делают изменение локальным, и интервьюер видит, что кандидат
      понимает своё решение.
    links:
      - https://www.greatfrontend.com/front-end-system-design-playbook/framework

  - id: sdp-defense-003
    topic: Как вести интервью
    subtopic: Защита решения
    level: middle
    question: |
      Кандидат проектирует кнопку «Оплатить» в фитнес-приложении: при тайм-ауте клиент повторяет запрос.
      Интервьюер спрашивает: «А сервер защищает от повторного списания?». Кандидат этого не знает. Какой ответ
      лучше?
    options:
      - text: '«Наверняка защищает: это стандарт для любых платежей, поэтому повторяю запрос после тайм-аута как есть»'
        why: 'Молча предполагать удобную гарантию опасно: если её нет, повтор спишет деньги дважды.'
      - text: '«Тогда автоматически не повторяем, а при тайм-ауте показываем ошибку и предлагаем нажать „Оплатить“ ещё раз»'
        why: 'Ручной повтор без защиты так же опасен: второе нажатие тоже может списать дважды.'
      - text: '«Если сервер берёт ключ идемпотентности — повтор с тем же ключом, иначе выясняю исход; ключ прошу в контракт»'
        correct: true
        why: 'Развилка по гарантии и нужный контракт. Кандидат показывает, где кончается ответственность клиента и что ему нужно от сервера.'
      - text: '«Защита от повторов — вопрос бэкенда: фронтенд просто отправляет запрос оплаты и показывает ответ сервера»'
        why: 'Решение повторять или нет принимает клиент, и от гарантии сервера зависит, безопасно ли это.'
    explanation: |
      Когда решение зависит от неизвестной гарантии сервера, называют развилку и контракт, который нужен.
      Для повторов записи это ключ идемпотентности (курс 2, «Повторы без двойных списаний»): с ним повтор после
      тайм-аута безопасен, без него исход выясняют, а не повторяют вслепую.
    links:
      - https://www.greatfrontend.com/front-end-system-design-playbook/evaluation-axes

  - id: sdp-defense-004
    topic: Как вести интервью
    subtopic: Защита решения
    level: senior
    question: |
      Кандидат выбрал SSE для живых котировок в приложении онлайн-банка: данные идут только от сервера. Интервьюер
      дважды спрашивает: «Почему не WebSocket?». Во второй раз добавляет: «Клиенту ещё нужно 20 раз в секунду
      отправлять на сервер, какие инструменты он сейчас видит на экране». Как лучше ответить на второй вопрос?
    options:
      - text: 'Повторить прежние доводы за SSE: данные идут от сервера к клиенту, а SSE проще WebSocket'
        why: 'Во второй раз интервьюер принёс новый факт: поток пошёл в обе стороны и часто. Прежний довод больше не верен.'
      - text: 'Признать, что с частой отправкой от клиента лучше WebSocket, и сказать, что меняется в схеме'
        correct: true
        why: 'Новый факт меняет условия, и решение пересматривают. Смена решения по верному доводу — плюс по шкале общения.'
      - text: 'Оставить SSE для котировок и отправлять 20 запросов в секунду обычными POST-запросами'
        why: 'Двадцать отдельных запросов в секунду от каждого клиента — лишние накладные расходы, ради которых и существует двусторонний канал.'
      - text: 'Сказать, что выбор транспорта не влияет на архитектуру и его можно отложить до реализации'
        why: 'Транспорт определяет нагрузку, переподключение и работу через прокси — это архитектурное решение.'
    explanation: |
      Защиту отличают от упрямства по тому, что принёс интервьюер. Вопрос «почему не Y?» — повод сравнить
      по требованиям. Новый факт — повод пересмотреть решение. Здесь появилась частая отправка от клиента,
      и довод «данные идут только от сервера» перестал быть верным.
    links:
      - https://www.greatfrontend.com/front-end-system-design-playbook/evaluation-axes

  - id: sdp-defense-005
    topic: Как вести интервью
    subtopic: Защита решения
    level: senior
    question: |
      Кандидат проектирует экран заявок выездного мастера, где статус заявки приходит событиями от сервера, а выполненные заявки исчезают из списка. Интервьюер говорит:
      «Сервер не гарантирует порядок событий и иногда присылает одно и то же дважды». Что из этого стоит сказать?
    multiple: true
    options:
      - text: 'Клиент применяет событие, только если версия заявки в нём новее той, что уже показана'
        correct: true
        why: 'Версия сущности отсекает и старые события, и дубли: применяется только то, что новее.'
      - text: 'Если версии в событии нет, её нужно попросить добавить в контракт'
        correct: true
        why: 'Без версии клиент не отличит новое событие от старого. Назвать нужный контракт — сильный ход.'
      - text: 'Применять события в порядке прихода, а повторы отсеивать по номеру события'
        why: 'Дубли уйдут, но сервер не гарантирует порядок: опоздавшее «в работе» затрёт уже пришедшее «выполнено».'
      - text: 'Подтверждать серверу каждое полученное событие, чтобы он перестал присылать дубли'
        why: 'Подтверждения не лечат перестановку: старое событие всё равно может прийти позже нового.'
      - text: 'Помнить версию закрытой заявки, чтобы опоздавшее событие не вернуло её в список'
        correct: true
        why: 'Это надгробие из курса «Реальное время и большие списки», урок «События: дубли и порядок»: без запомненной версии старому событию не с чем сравниться.'
    explanation: |
      Если сервер не гарантирует порядок и может прислать дубль, клиент применяет события по версии сущности
      (курс «Реальное время и большие списки», урок «События: дубли и порядок»). Версию закрытой заявки помнят
      и после того, как она исчезла из списка, — это надгробие, иначе опоздавшее событие вернёт заявку. Если версии
      в контракте нет, кандидат называет развилку и просит её добавить. Изменение точечное: оно касается только того, как клиент
      применяет события.
    links:
      - https://www.greatfrontend.com/front-end-system-design-playbook/framework

  - id: sdp-datepicker-005
    topic: Разборы кейсов
    subtopic: Выбор даты
    level: junior
    question: |
      Кандидат проектирует компонент выбора даты для дизайн-системы и уточняет требования. Ответ на какой вопрос
      сильнее всего меняет API компонента?
    options:
      - text: 'Нужен ли выбор диапазона дат или только одной даты'
        correct: true
        why: 'Диапазон меняет тип значения — пара дат вместо одной — и способ выбора. Это самое дорогое в публичном API.'
      - text: 'Какая библиотека дат уже подключена в проекте'
        why: 'Библиотека влияет на реализацию внутри компонента, а не на то, что он принимает и отдаёт наружу.'
      - text: 'Сколько экранов уже готовы использовать компонент'
        why: 'Число экранов говорит, как дорого будет менять API потом, но не каким он должен быть.'
      - text: 'Должен ли календарь открываться вверх, если внизу мало места'
        why: 'Это поведение показа внутри компонента, снаружи его не видно.'
    explanation: |
      Уточняющие вопросы задают ради решений, которые от них зависят. Для компонента самое дорогое решение — тип
      значения и события: их видят все экраны-потребители. Выбор диапазона меняет тип значения, поэтому его
      выясняют первым, а цвет и положение календаря решаются внутри компонента.
    links:
      - https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/examples/datepicker-dialog/

  - id: sdp-datepicker-002
    topic: Разборы кейсов
    subtopic: Выбор даты
    level: middle
    question: |
      Компонент выбора даты в сервисе билетов используют двенадцать экранов. Кабинету организатора нужно отключать
      дни, когда площадка занята, а профилю — все будущие даты для даты рождения. Как лучше передать компоненту
      правило отключённых дней?
    options:
      - text: 'Добавить флаги `isOrganizer` и `isBirthday` и зашить оба правила внутрь компонента'
        why: 'Флаги под конкретные места — тревожный признак из курса 1: каждый новый экран добавит ещё один флаг.'
      - text: 'Передавать функцию `isDateDisabled(date)`, которую каждый экран пишет под своё правило'
        correct: true
        why: 'Компонент не знает правил продукта и не зависит от них: экран сам решает, что недоступно. Это тот же приём, что функция загрузки у поля адреса в курсе 1.'
      - text: 'Научить компонент самому запрашивать занятые дни у API площадок по номеру площадки'
        why: 'Тогда компонент зависит от одного API продукта, а дате рождения этот запрос не нужен вовсе.'
      - text: 'Передавать массив всех отключённых дат на десять лет вперёд при каждом показе экрана'
        why: 'Для даты рождения это все будущие дни на годы вперёд — огромный список ради простого правила.'
    explanation: |
      Источник данных и правила компонент получает снаружи, как порт: экран передаёт функцию, а компонент только
      спрашивает её про каждый день. Так один компонент обслуживает двенадцать экранов с разными правилами
      и не тянет за собой API продукта. Если данные приходят с сервера, экран передаёт функцию загрузки.
    links:
      - https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/examples/datepicker-dialog/

  - id: sdp-datepicker-003
    topic: Разборы кейсов
    subtopic: Выбор даты
    level: middle
    question: |
      Отдельное внутреннее приложение для сотрудников сервиса билетов — без дизайн-системы и её пакетов.
      Сотрудник вводит дату выпуска билетов, она должна попадать в сезон продаж. Приложение открывают
      с компьютеров и телефонов, вид поля неважен, сроки сжатые. Что предпочтительнее?
    options:
      - text: 'Встроенный `<input type="date">` с атрибутами `min` и `max`'
        correct: true
        why: 'Доступность, клавиатура и родной выбор даты на телефоне — от браузера, а ограничения задаются `min` и `max`. Слабости встроенного поля здесь не мешают.'
      - text: 'Своя реализация календаря с сеткой, клавиатурой и разбором ввода'
        why: 'Месяцы работы над доступностью и вводом ради поля, где вид не важен и хватает `min` и `max`.'
      - text: 'Подключить компонент выбора даты из большой библиотеки интерфейса'
        why: 'Вид неважен, а сезон задают `min` и `max` встроенного поля. Библиотека — лишний вес и зависимость в приложении, где её больше нет.'
      - text: 'Обычное текстовое поле с подсказкой формата и проверкой на сервере'
        why: 'Человек будет вводить дату вручную без календаря, а ошибки формата узнает только после отправки.'
    explanation: |
      Встроенный `<input type="date">` даёт доступность и родной выбор даты на телефоне даром. Его цена —
      вид почти не настраивается, формат показа задаёт браузер, а отключать можно только через `min` и `max`.
      Когда этих ограничений достаточно и вид не важен, встроенное поле — самое простое и правильное решение.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/input/date

  - id: sdp-datepicker-004
    topic: Разборы кейсов
    subtopic: Выбор даты
    level: senior
    question: |
      Компонент выбора одной даты уже стоит на двенадцати экранах сервиса билетов. Интервьюер добавляет:
      «Кабинету организатора нужен выбор диапазона дат гастролей». Что предложить?
    multiple: true
    options:
      - text: 'Сделать отдельный компонент выбора диапазона с общей сеткой дней внутри'
        correct: true
        why: 'Диапазон меняет тип значения и способ выбора. Отдельный компонент не задевает двенадцать экранов, а сетку и клавиатуру можно переиспользовать.'
      - text: 'Вынести сетку дней и клавиатуру во внутренний общий модуль обоих компонентов'
        correct: true
        why: 'Клавиатуру и роли пишут один раз, а публичные API двух компонентов остаются раздельными.'
      - text: 'Добавить в старый компонент флаг `range`, при котором `value` становится парой дат'
        why: 'Тип `value` начинает зависеть от флага — родственник тревожного признака курса 1: свойства, имеющие смысл только в паре.'
      - text: 'Перевести все экраны на значение `{ start, end }`, где у одной даты `start` равен `end`'
        why: 'Это ломающее изменение для двенадцати экранов ради одного нового случая.'
    explanation: |
      Новое требование решают рядом со старым: отдельный компонент диапазона с общей сеткой внутри. Существующий
      контракт не меняется, и двенадцать экранов его не замечают. Флаг, меняющий тип значения, удваивает число
      сочетаний и делает тип свойства зависимым от другого свойства.
    links:
      - https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/examples/datepicker-dialog/

  - id: sdp-autocomplete-001
    topic: Разборы кейсов
    subtopic: Строка поиска с подсказками
    level: junior
    question: |
      В строке поиска магазина товаров для дома человек быстро набрал «под», потом «подушка». На мобильной сети
      ответ на «под» пришёл последним и затёр подсказки для «подушка». Что защищает от этого надёжнее всего?
    options:
      - text: 'Сервер повторяет текст запроса в ответе, а клиент показывает ответ, только если текст совпадает'
        correct: true
        why: 'Сверка отбрасывает любой устаревший ответ, когда бы он ни пришёл. Это запасной пояс к отмене и игнору из курса 2, урок «Лишние и одинаковые запросы».'
      - text: 'Увеличить паузу в наборе до секунды, чтобы запросы уходили реже и не успевали обгонять друг друга'
        why: 'Запросов станет меньше, но два запроса всё равно могут разойтись по времени, а подсказки станут заметно медленнее.'
      - text: 'Показывать ответы строго в порядке прихода и всегда брать последний пришедший'
        why: 'Последний пришедший — как раз устаревший ответ на «под». Порядок прихода не совпадает с порядком отправки.'
      - text: 'Перед новым запросом показывать спиннер вместо старых подсказок, пока не придёт ответ'
        why: 'Спиннер не решает, чей ответ покажется. Опоздавший ответ на «под» всё равно займёт место.'
    explanation: |
      Ответы на мобильной сети приходят не в том порядке, в котором ушли запросы. Сервер повторяет текст запроса
      в ответе, и клиент показывает ответ, только если текст совпадает с тем, что сейчас в поле. Отмена прошлого
      запроса через `AbortController` тоже защищает экран и бережёт трафик; сверка надёжнее, потому что
      не зависит от того, отменили ли запрос в каждом месте кода.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/AbortController

  - id: sdp-autocomplete-005
    topic: Разборы кейсов
    subtopic: Строка поиска с подсказками
    level: middle
    question: |
      Кандидат проектирует строку поиска с подсказками для магазина и хочет кэшировать ответы `/suggest` на CDN,
      чтобы снять нагрузку с сервера. Ответ на какой вопрос интервьюеру решит, можно ли так делать?
    options:
      - text: 'Сколько товаров в каталоге магазина'
        why: 'Размер каталога решает, можно ли искать на клиенте, но не то, можно ли делить один ответ между людьми.'
      - text: 'Одинаковы ли подсказки для всех покупателей'
        correct: true
        why: 'Общий кэш отдаёт один ответ всем. Если подсказки персональные, чужой ответ достанется другому человеку.'
      - text: 'Какую паузу в наборе выбрать перед запросом'
        why: 'Пауза решает, сколько запросов уйдёт, а не можно ли делить их ответы между людьми.'
      - text: 'С каких устройств покупатели ищут чаще'
        why: 'Устройства влияют на вес ответа и паузу, а не на то, общий ли он для всех.'
    explanation: |
      Общий кэш CDN подходит только для ответов, одинаковых для всех. Поэтому, предлагая его, кандидат сначала
      выясняет, персональны ли подсказки. Если да, ответ делят: общая часть идёт с CDN, а персональная — отдельным
      запросом с `Cache-Control: private`.
    links:
      - https://developer.mozilla.org/ru/docs/Web/HTTP/Reference/Headers/Cache-Control

  - id: sdp-autocomplete-003
    topic: Разборы кейсов
    subtopic: Строка поиска с подсказками
    level: middle
    question: |
      Строку поиска с подсказками проверили с экранным чтецом. Когда человек нажимает стрелку вниз, скрипт
      переносит фокус на первую подсказку, и дальше нельзя продолжить печатать, не вернувшись в поле. Как должно
      быть по шаблону combobox из WAI-ARIA Authoring Practices?
    options:
      - text: 'Фокус остаётся в поле, а выбранную подсказку поле сообщает чтецу через `aria-activedescendant`'
        correct: true
        why: 'Так человек может и выбирать стрелками, и сразу продолжать печатать: фокус в поле не теряется.'
      - text: 'Фокус переходит в список, а любая напечатанная буква возвращает его в поле вместе с этой буквой'
        why: 'У всплывающего списка фокус по шаблону вообще не покидает поле: стрелки двигают только выделение через `aria-activedescendant`.'
      - text: 'Подсказки делают обычными ссылками, по которым человек ходит клавишей Tab'
        why: 'Десяток Tab по подсказкам в шапке каждой страницы мешает навигации, и чтец не понимает, что это список подсказок.'
      - text: 'Фокус уходит в список, а Escape закрывает список и очищает поле ввода'
        why: 'Фокус в поле по-прежнему теряется, а очистку поля шаблон считает необязательной и не решает ею проблему.'
    explanation: |
      В шаблоне combobox фокус всё время остаётся в поле с ролью `combobox`. Список подсказок — `listbox`,
      `aria-expanded` показывает, открыт ли он, а выбранную стрелками подсказку поле указывает через
      `aria-activedescendant`. Enter выбирает подсказку, Escape закрывает список.
    links:
      - https://www.w3.org/WAI/ARIA/apg/patterns/combobox/

  - id: sdp-autocomplete-004
    topic: Разборы кейсов
    subtopic: Строка поиска с подсказками
    level: senior
    question: |
      Интервьюер меняет условия: «Теперь у магазина персональные подсказки — у каждого покупателя свои, по его
      покупкам». Раньше ответы `/suggest` кэшировались на CDN на пять минут. Что из этого нужно поменять?
    multiple: true
    options:
      - text: 'Отдавать персональную часть с `Cache-Control: private`, чтобы её кэшировал только браузер покупателя'
        correct: true
        why: 'Общий кэш не получит чужой ответ, а повторный показ у того же человека будет быстрым.'
      - text: 'Разделить ответ: общие подсказки по тексту — с CDN, персональную часть — отдельным запросом без общего кэша'
        correct: true
        why: 'Так общая часть по-прежнему снимает нагрузку и приходит быстро, а персональная не попадает чужим людям.'
      - text: 'Оставить кэш на CDN, добавив в адрес запроса номер покупателя'
        why: 'Кэш с номером покупателя почти не попадает в цель, а номер в адресе оседает в логах CDN — это утечка персональных данных.'
      - text: 'Перестать сверять текст запроса в ответе, раз ответы теперь персональные'
        why: 'Гонка ответов от персональности не зависит: старый ответ по-прежнему может прийти позже нового.'
    explanation: |
      Персональный ответ нельзя положить в общий кэш CDN — это невозможная комбинация из курса «Большие приложения»,
      урок «Когда требования спорят».
      Обычный выход — разделить ответ: общая часть по тексту кэшируется, персональная приходит отдельным запросом.
      Механизмы на клиенте — пауза в наборе, сверка ответа с текущим текстом — остаются как были.
    links:
      - https://developer.mozilla.org/ru/docs/Web/HTTP/Reference/Headers/Cache-Control

  - id: sdp-feed-001
    topic: Разборы кейсов
    subtopic: Лента новостей
    level: junior
    question: |
      В ленте соседской соцсети следующая страница запрашивается так: «пропусти 20, дай 20». Пока человек читал
      первую страницу, в районе появилось три новых поста, а модератор удалил пять постов из первой двадцатки.
      Вторая страница пропустила два поста — человек их так и не увидел. Как это исправить?
    options:
      - text: 'Запрашивать «дай 20 после поста p-9011» курсором от сервера и сливать страницы по id'
        correct: true
        why: 'Курсор не зависит от вставок и удалений выше него, а слияние по id отбрасывает случайные повторы. Это решение из курса 2, «Пагинация живых списков».'
      - text: 'Запоминать, сколько новых постов появилось, и прибавлять это число к смещению'
        why: 'Клиент не знает точно, сколько постов вставили и удалили выше за это время, — смещение всё равно разъедется.'
      - text: 'Загружать сразу 200 постов, чтобы вторая страница почти никогда не понадобилась'
        why: 'Двести постов с фото — тяжёлая первая загрузка, а сдвиг смещения вернётся на следующей порции.'
      - text: 'Фильтровать на клиенте посты, которые уже есть на экране, и больше ничего не менять'
        why: 'Фильтр убирает только повторы, а здесь посты пропущены: смещение съехало из-за удалений выше.'
    explanation: |
      В живом списке смещение даёт дубли при вставках выше и пропуски при удалениях. Курсор просит «после вот
      этого» и от изменений выше не зависит. Порядок должен быть строгим (по времени, при равенстве — по id),
      а клиент сливает страницы по id. Курсор выдаёт сервер, и клиент не заглядывает внутрь.
    links:
      - https://slack.engineering/evolving-api-pagination-at-slack/

  - id: sdp-feed-002
    topic: Разборы кейсов
    subtopic: Лента новостей
    level: middle
    question: |
      Человек читает середину ленты соседей. Клиент узнаёт, что в районе появились три новых поста. Как лучше
      их показать?
    options:
      - text: 'Сразу вставить их в начало ленты, чтобы лента всегда была свежей'
        why: 'Вставка сверху сдвинет текст у человека из-под глаз — он потеряет место, где читал.'
      - text: 'Показать кнопку «Новые посты: 3», по нажатию прокрутить наверх и загрузить первую страницу'
        correct: true
        why: 'Читаемое не сдвигается, а человек сам решает, когда посмотреть новое. Если бы он был вверху ленты, посты можно было бы вставить сразу.'
      - text: 'Ничего не показывать до перезагрузки страницы, чтобы не отвлекать человека'
        why: 'Человек не узнает о новых постах, хотя клиент уже знает о них. Кнопка не отвлекает и не сдвигает текст.'
      - text: 'Автоматически перезагрузить ленту с первой страницы, чтобы новые посты сразу оказались сверху'
        why: 'Человек потеряет место, где читал, — ровно то, от чего защищает правило «не сдвигать читаемое».'
    explanation: |
      Новые посты не вставляют над тем, что человек читает. Кнопка «Новые посты» сообщает о новом и даёт
      человеку выбрать момент. Вставлять сразу можно, только если человек вверху ленты. Это правило сохраняется
      и тогда, когда новые посты приходят живыми событиями.
    links:
      - https://www.w3.org/WAI/ARIA/apg/patterns/feed/

  - id: sdp-feed-003
    topic: Разборы кейсов
    subtopic: Лента новостей
    level: middle
    question: |
      В ленте соседей лайк отправляется запросом `POST /posts/p-9031/toggle-like`, который переключает лайк.
      На медленной сети запрос не ответил вовремя, клиент повторил его, и лайк пропал — оба запроса дошли.
      Что изменить в контракте?
    options:
      - text: 'Не повторять запрос лайка после тайм-аута, а показать человеку ошибку'
        why: 'Ошибка будет ложной: первый запрос, возможно, прошёл. А сам переключатель останется опасным и при ручном повторе.'
      - text: 'Перед каждым лайком запрашивать текущее состояние поста и только потом отправлять переключение'
        why: 'Между чтением и переключением может пройти другой запрос, и переключатель по-прежнему не выдерживает повтора.'
      - text: 'Ставить лайк `PUT /posts/p-9031/like`, убирать — `DELETE`: запрос устанавливает состояние'
        correct: true
        why: 'Установка состояния идемпотентна: повторный `PUT` оставляет лайк поставленным. Повтор после тайм-аута безопасен.'
      - text: 'Добавить в запрос время нажатия, чтобы сервер отбрасывал повторы с тем же временем'
        why: 'Два разных нажатия в одну секунду сервер примет за повтор. Повтор безопаснее решать формой запроса или ключом идемпотентности.'
    explanation: |
      Переключатель — неидемпотентная запись: повтор меняет результат. Запрос, который устанавливает состояние,
      можно повторять сколько угодно (курс 2, «Повторы без двойных списаний»). На экране лайк — оптимистичное
      обновление: сердечко меняется сразу, а при отказе возвращается с коротким сообщением.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/Idempotent

  - id: sdp-feed-005
    topic: Разборы кейсов
    subtopic: Лента новостей
    level: senior
    question: |
      Интервьюер добавляет условие, которого не было: «Автор может отредактировать или удалить свой пост, и это
      должно быть видно в лентах у всех». Лента листается по курсору, страницы лежат в кэше, а о новых постах
      клиент узнаёт событиями. Что предложить?
    multiple: true
    options:
      - text: 'Правка приходит событием с версией поста, и клиент применяет её, только если версия новее'
        correct: true
        why: 'События могут прийти не по порядку и дважды. Версия сущности отсекает старое — урок «События: дубли и порядок» курса «Реальное время и большие списки».'
      - text: 'Удалённый пост остаётся в кэше отметкой «удалён», чтобы опоздавшая страница его не вернула'
        correct: true
        why: 'Это надгробие из курса «Реальное время и большие списки»: без него ответ страницы, пришедший после события удаления, вернёт пост на экран.'
      - text: 'При каждом событии правки перечитывать всю ленту с первой страницы'
        why: 'Человек потеряет место, где читал, а сервер получит волну перечитываний на каждую правку в районе.'
      - text: 'Удалять пост из кэша без следа, как только пришло событие'
        why: 'Страница, запрошенная до удаления и пришедшая после, вернёт пост: клиент не помнит, что его удалили.'
    explanation: |
      Правка и удаление — события о существующих сущностях. Их применяют по версии, чтобы старое событие не затёрло
      новое, а удаление помнят надгробием, чтобы опоздавший ответ страницы не воскресил пост. Курсор, карточки
      и правило «не сдвигать читаемое» при этом не меняются.
    links:
      - https://www.w3.org/WAI/ARIA/apg/patterns/feed/

  - id: sdp-chat-001
    topic: Разборы кейсов
    subtopic: Чат с переподключением
    level: junior
    question: |
      В рабочем мессенджере человек проехал туннель. Связь вернулась, но новые сообщения не приходят: браузер
      по-прежнему считает WebSocket открытым, событие `close` так и не пришло. Как клиенту замечать такие
      обрывы?
    options:
      - text: 'Сервер раз в 25 секунд шлёт свой пинг, и после двух интервалов тишины клиент переподключается'
        correct: true
        why: 'Соединение может умереть молча. Свой пинг на уровне приложения — единственное, что клиент видит: встроенные ping и pong WebSocket JavaScript недоступны.'
      - text: 'Считать соединение мёртвым по событию `offline` у `window`, а пока этого события нет — живым'
        why: '`offline` говорит, что пропала сеть устройства. В туннеле сеть формально есть, а пакеты не идут: соединение умирает молча, без этого события.'
      - text: 'Ждать события `close` подольше: браузер рано или поздно сам заметит обрыв'
        why: 'Иногда это занимает минуты, и всё это время человек смотрит на чат без новых сообщений.'
      - text: 'Переподключаться каждые 30 секунд на всякий случай, даже если всё работает'
        why: 'Десятки тысяч лишних переподключений нагружают сервер, а обрыв между ними всё равно незаметен до 30 секунд.'
    explanation: |
      Постоянное соединение может умереть без ошибки, например в туннеле или за прокси. Поэтому сервер шлёт пинг
      на уровне приложения, а клиент считает соединение мёртвым после нескольких интервалов тишины. Встроенные
      ping и pong протокола WebSocket JavaScript в браузере не видит (курс «Реальное время и большие списки»,
      «Соединение: обрывы и возвраты»).
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/WebSockets_API

  - id: sdp-chat-002
    topic: Разборы кейсов
    subtopic: Чат с переподключением
    level: middle
    question: |
      Человек в метро нажал «Отправить» в рабочем мессенджере. Связи нет, но сообщение не должно потеряться
      и не должно отправиться дважды, когда связь вернётся. Как лучше устроить отправку?
    options:
      - text: 'Заблокировать поле ввода, пока нет связи, и показать «Нет сети, отправка невозможна»'
        why: 'Человек не может написать сообщение, хотя его можно сохранить и отправить позже. Это хуже для того, кто едет в метро.'
      - text: 'Показать сообщение сразу с временным id и «отправляется», хранить в очереди и повторять с тем же id'
        correct: true
        why: 'Временный id служит ключом идемпотентности: если первая попытка дошла, сервер не создаст дубль. Очередь на устройстве переживает закрытие вкладки.'
      - text: 'Отправлять сообщение сразу, а при ошибке повторять каждый раз с новым временным id'
        why: 'Если первая попытка дошла, но ответ потерялся, новый id создаст на сервере второе сообщение.'
      - text: 'Хранить неотправленный текст в поле ввода, пока связь не вернётся, и отправить его по нажатию человека'
        why: 'Человек не видит сообщения в ленте и может закрыть вкладку, потеряв текст; повтор без id тоже может дать дубль.'
    explanation: |
      Своё сообщение показывают сразу с временным id и пометкой «отправляется» — локальное эхо из курса
      «Реальное время и большие списки», урок «Чат и статусы присутствия». Сообщение хранят в очереди на устройстве (курс 2, «Работа без сети
      и очередь действий») и повторяют с тем же id. Пришедшее в потоке сообщение с этим id заменяет временное.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/WebSockets_API

  - id: sdp-chat-003
    topic: Разборы кейсов
    subtopic: Чат с переподключением
    level: middle
    question: |
      В мессенджере каждое событие от сервера несёт номер `seq`. Человек минуту был без связи, за это время
      в каналах появились десятки сообщений. Соединение восстановлено. Как клиенту получить пропущенное?
    options:
      - text: 'Перезагрузить всю историю всех разговоров после каждого переподключения, чтобы ничего не упустить'
        why: 'Сработает, но обрывы здесь обычное дело, и каждый раз перечитывать всё — лишняя нагрузка на сервер и сеть.'
      - text: 'Попросить у сервера сообщения новее времени последнего сообщения по часам телефона'
        why: 'Часы телефона расходятся с серверными, и часть сообщений можно пропустить или получить дважды.'
      - text: 'Сообщить последний полученный `seq`: сервер досылает остальное или велит перечитать снимок'
        correct: true
        why: 'Догонять по номеру дешевле всего. Если история на сервере стёрта или пропущено слишком много, сервер сообщает об этом, и клиент перечитывает снимок.'
      - text: 'Ничего не делать: WebSocket сам сохранит и дошлёт сообщения, пришедшие, пока соединения не было'
        why: 'Новое соединение — новое соединение: пропущенное во время обрыва никто не сохранит, если клиент не попросит его сам.'
    explanation: |
      После переподключения пропущенное догоняют с номера последнего события — это дешевле всего. Если история
      стёрта или пропущено слишком много событий, перечитывают снимок по сигналу сервера и подписываются с новой
      позиции (курс «Реальное время и большие списки», «Снимок и догоняющие события»). Пока клиент догоняет,
      экран показывает «Подключаемся…».
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/WebSockets_API

  - id: sdp-chat-005
    topic: Разборы кейсов
    subtopic: Чат с переподключением
    level: senior
    question: |
      Интервьюер добавляет условие, которого не было: «В чате можно отправлять файлы до 100 МБ, часто с телефона
      на плохой связи». Сообщения уже уходят через очередь отправки с временным `clientId` по WebSocket. Что
      предложить?
    options:
      - text: 'Передавать файл кусками через тот же WebSocket, по которому идут сообщения чата'
        why: 'Мегабайты в одном канале с сообщениями задержат «печатает» и новые сообщения, а после обрыва придётся решать возобновление самим.'
      - text: 'Загрузить файл частями в хранилище с возобновлением, потом отправить ссылку через очередь'
        correct: true
        why: 'Загрузка с возобновлением из курса 2 переживает обрывы, а сообщение со ссылкой идёт прежним путём с тем же `clientId` и не дублируется.'
      - text: 'Держать файл в очереди отправки в памяти вкладки, пока не появится связь, и отправить целиком'
        why: 'Закрытая вкладка потеряет файл, а 100 МБ в памяти телефона — заметная нагрузка.'
      - text: 'Отправить файл одним запросом вместе с сообщением и повторять целиком при обрыве'
        why: 'На плохой связи 100 МБ одним запросом почти не дойдут: каждый обрыв начинает загрузку с нуля.'
    explanation: |
      Большие файлы загружают отдельно от сообщений: частями, прямо в хранилище и с возобновлением с места обрыва
      (курс 2, «Загрузка файлов»). Сообщение со ссылкой на загруженный файл идёт через ту же очередь с тем же
      временным id, поэтому повтор не создаст дубль. Соединение чата остаётся лёгким.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/WebSockets_API

  - id: sdp-booking-001
    topic: Разборы кейсов
    subtopic: Бронирование жилья
    level: junior
    question: |
      Карточку квартиры в сервисе посуточной аренды открывают сотни тысяч раз в день из поисковиков и по ссылкам
      из мессенджеров, где важно превью с фото. Описание и фото меняются редко, цена и свободные даты — постоянно.
      Сервер отрисовки дорог. Как собирать карточку?
    options:
      - text: 'Заранее, с пересборкой при изменении описания, а цену и даты догружать на клиенте'
        correct: true
        why: 'Поисковики и превью получают готовый HTML, одну собранную страницу видят тысячи людей, а изменчивое приходит отдельно.'
      - text: 'Целиком в браузере: пустая оболочка, а всё содержимое догружается скриптом после открытия'
        why: 'Пустую оболочку мессенджер и многие роботы видят пустой: превью без фото и названия, поисковики хуже видят страницу.'
      - text: 'На сервере при каждом открытии, чтобы цена и свободные даты сразу были свежими'
        why: 'Свежо, но дорогой сервер платит за каждое из сотен тысяч открытий одинаковой страницы, хотя описание почти не меняется.'
      - text: 'Заранее один раз при сборке сайта, вместе с ценой и датами на ближайший месяц'
        why: 'Цена и даты устареют через часы, а пересобирать страницу никто не будет — человек увидит неверную цену.'
    explanation: |
      Способ рендеринга выбирают по странице. Публичную страницу, одинаковую для всех, собирают заранее
      с пересборкой при изменении (SSG и ISR): поисковики и превью получают HTML, а сервер не платит за каждое
      открытие. Изменчивое — цену и свободные даты — догружают на клиенте, а окончательное решение принимает
      сервер при бронировании.
    links:
      - https://web.dev/articles/rendering-on-the-web

  - id: sdp-booking-002
    topic: Разборы кейсов
    subtopic: Бронирование жилья
    level: middle
    question: |
      Человек нашёл квартиры в Казани на выходные для двоих до 6 000 ₽ и отправил ссылку другу. Друг открыл её —
      и увидел пустую форму поиска: фильтры хранились только в состоянии страницы. Где их лучше хранить?
    options:
      - text: 'В `localStorage`, чтобы фильтры сохранялись между визитами на сайт и после перезагрузки'
        why: 'У друга свой браузер и свой `localStorage`: по ссылке он фильтров не получит.'
      - text: 'В профиле на сервере, чтобы фильтры были доступны с любого устройства этого человека'
        why: 'Нужен вход, и друг увидит свои фильтры, а не те, что в ссылке.'
      - text: 'В адресе страницы: город, даты, гости и цена — параметрами, которые уходят со ссылкой'
        correct: true
        why: 'Адрес переживает перезагрузку и «Назад» и передаётся ссылкой. Это решение из курса 1, «Что переживает перезагрузку».'
      - text: 'В `sessionStorage`, чтобы фильтры жили, пока открыта вкладка, и не мешали потом'
        why: 'Вкладка друга — другая вкладка в другом браузере, и `sessionStorage` в ней пустой.'
    explanation: |
      Фильтры, сортировку и открытую сущность кладут в адрес: он переживает перезагрузку и «Назад» и уходит
      вместе со ссылкой. Пока человек двигает ползунок цены, адрес обновляют через `replaceState`, а при применении
      фильтра — через `pushState`. Формат адреса после этого становится контрактом: старые ссылки должны работать.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/History/pushState

  - id: sdp-booking-003
    topic: Разборы кейсов
    subtopic: Бронирование жилья
    level: middle
    question: |
      На карточке квартиры человек увидел итог 12 600 ₽ за две ночи и пошёл вводить данные карты. За эти пять
      минут хозяин поднял цену. Сервис не должен списать больше, чем человек видел перед оплатой. Как устроить
      оплату?
    options:
      - text: 'Перед оплатой получить расчёт с номером и сроком действия и бронировать только по нему'
        correct: true
        why: 'Человек видит итог расчёта, а сервер списывает ровно его. Если цена изменилась, новый итог показывают до списания.'
      - text: 'Отправлять в запрос бронирования сумму с экрана, чтобы сервер списал именно её'
        why: 'Сумму с клиента можно подделать, а сервер не должен доверять клиенту в цене.'
      - text: 'Перечитывать цену на карточке каждые 10 секунд, пока человек вводит данные своей карты'
        why: 'Цена может измениться между последним перечитыванием и нажатием «Оплатить» — гарантии нет.'
      - text: 'Списать новую цену, а о разнице сообщить в письме сразу после бронирования'
        why: 'Это нарушает обещание: человек заплатил больше, чем видел, и узнал об этом после.'
    explanation: |
      Инвариант «не списать больше показанного» охраняет сервер. Перед оплатой клиент запрашивает расчёт цены
      с номером и сроком действия, показывает итог, и бронирование ссылается на этот расчёт. Если цена изменилась
      или даты заняли, сервер отвечает понятной ошибкой с новой суммой, и человек решает сам.
    links:
      - https://www.rfc-editor.org/rfc/rfc9457.html

  - id: sdp-booking-005
    topic: Разборы кейсов
    subtopic: Бронирование жилья
    level: senior
    question: |
      Интервьюер добавляет условие, которого не было: «Хозяин хочет видеть новые брони в своём кабинете сразу,
      со звуком, а кабинет у него часто открыт в нескольких вкладках». Брони только приходят от сервера, хозяин
      в ответ ничего не шлёт. Что предложить?
    options:
      - text: 'Открыть WebSocket в каждой вкладке, потому что живые данные всегда требуют двустороннего канала связи'
        why: 'Данные идут только от сервера, двусторонний канал не нужен. А соединение в каждой вкладке даст и несколько звуков на одну бронь.'
      - text: 'Опрашивать сервер раз в пять секунд из каждой открытой вкладки и играть звук при новой брони'
        why: 'Нагрузка растёт с числом вкладок, а звук на одну бронь прозвучит столько раз, сколько вкладок открыто.'
      - text: 'SSE; ведущая вкладка через Web Locks держит поток и играет звук, остальные — через `BroadcastChannel`'
        correct: true
        why: 'Поток только от сервера — SSE. Ведущая вкладка даёт одно соединение и один звук — урок «Несколько вкладок» курса «Синхронизация и офлайн».'
      - text: 'Открыть SSE в каждой вкладке, а звук играть только в той вкладке, что сейчас на экране'
        why: 'Все вкладки могут быть скрыты — тогда звука не будет вовсе, а лишние соединения останутся.'
    explanation: |
      Транспорт выбирают по направлению данных: события только от сервера — SSE (курс «Реальное время и большие
      списки», «Как доставлять живые данные»). Несколько вкладок координирует ведущая: она держит соединение
      и играет звук, остальные получают события через `BroadcastChannel`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Broadcast_Channel_API

  - id: sdp-collab-001
    topic: Разборы кейсов
    subtopic: Совместный документ без сети
    level: junior
    question: |
      В редакторе планов уроков документ сохраняется целиком, и побеждает тот, кто сохранил последним. Учитель неделю
      правил план без сети, а методист в это время правил тот же план в городе и сохранил раньше. Что случится,
      когда учитель выйдет в сеть и сохранит?
    options:
      - text: 'Правки методиста пропадут: его версию целиком заменит версия учителя'
        correct: true
        why: '«Последняя запись побеждает» на уровне документа выбрасывает всё, что сделал другой. Для текста это потеря чужой работы.'
      - text: 'Сервер сам сольёт обе версии по абзацам и сохранит правки обоих'
        why: 'Сохранение целиком ничего не сливает: побеждает последняя запись, а не сумма правок.'
      - text: 'Сохранение учителя будет отклонено, и он потеряет неделю своей работы'
        why: 'При «последней записи» сервер ничего не проверяет и не отклоняет — он просто заменяет документ.'
      - text: 'Ничего плохого: учитель увидит правки методиста и продолжит поверх них'
        why: 'Учитель не видел правок методиста неделю, и его сохранение их затрёт.'
    explanation: |
      «Последняя запись побеждает» теряет чужую работу, когда двое правят одно и то же. Для текста, который двое
      правят одновременно или порознь без сети, нужно посимвольное слияние — готовая библиотека CRDT (курс
      «Синхронизация и офлайн», урок «Совместный текст: OT и CRDT»).
    links:
      - https://www.inkandswitch.com/essay/local-first/

  - id: sdp-collab-002
    topic: Разборы кейсов
    subtopic: Совместный документ без сети
    level: middle
    question: |
      Учитель в сельской школе неделю правит план урока без сети, иногда закрывая ноутбук и браузер. Ни одна правка
      не должна потеряться до того, как появится связь. Где держать документ и неотправленные изменения?
    options:
      - text: 'В памяти вкладки, а при появлении сети сразу отправить все накопленные правки на сервер'
        why: 'Закрытый браузер — потерянные правки. Неделя без сети почти наверняка включает закрытие вкладки.'
      - text: 'В `sessionStorage`, чтобы правки пережили перезагрузку страницы'
        why: '`sessionStorage` живёт, пока открыта вкладка: закрытие браузера его стирает.'
      - text: 'Только на сервере: без сети редактор открывает последнюю версию документа для просмотра'
        why: 'Тогда неделю без сети учитель вообще не сможет править план — а это главное требование.'
      - text: 'В IndexedDB на устройстве, попросив у браузера постоянное хранение через `persist()`'
        correct: true
        why: 'Данные переживают закрытие браузера, а постоянное хранение защищает их от вытеснения, когда места мало.'
    explanation: |
      Если человек работает без сети днями, данные живут на устройстве: документ и неотправленные изменения пишут
      в IndexedDB сразу при правке. Приложение просит постоянное хранение через `navigator.storage.persist()`,
      чтобы браузер не удалил неделю работы (курс «Синхронизация и офлайн», урок «Данные живут на устройстве»).
    links:
      - https://www.inkandswitch.com/essay/local-first/

  - id: sdp-collab-003
    topic: Разборы кейсов
    subtopic: Совместный документ без сети
    level: middle
    question: |
      В редактор планов уроков на CRDT добавили комментарии. Комментарий хранит место в тексте как «символы
      120–140». После того как коллега вставил абзац в начало документа, комментарии стали указывать на чужие
      слова. Как хранить место комментария?
    options:
      - text: 'Пересчитывать номера символов у всех комментариев после каждой правки текста'
        why: 'Правки коллег приходят в разном порядке и без сети, и пересчёт на разных устройствах разойдётся.'
      - text: 'Относительной позицией — ссылкой на идентификаторы символов CRDT, а не номером'
        correct: true
        why: 'Идентификатор символа не меняется от чужих вставок, поэтому комментарий остаётся на своих словах у всех. В Yjs это relative position.'
      - text: 'Хранить в комментарии цитату текста и искать её в документе при каждом показе заново'
        why: 'Цитату могут исправить, а одинаковых фраз в плане урока бывает несколько — комментарий найдёт не то место.'
      - text: 'Запретить правки текста, к которому уже есть комментарии, пока их не решат'
        why: 'Это блокировка, которая мешает работать, особенно без сети, когда о комментарии могут и не знать.'
    explanation: |
      Позиция по номеру символа ломается от любой вставки выше. CRDT даёт каждому символу идентификатор, и якорь
      комментария ссылается на него — это относительная позиция (в Yjs — relative position). Все копии документа
      разрешают её в одно и то же место, какие бы правки ни пришли.
    links:
      - https://docs.yjs.dev/api/relative-positions

  - id: sdp-collab-004
    topic: Разборы кейсов
    subtopic: Совместный документ без сети
    level: senior
    question: |
      Интервьюер меняет условия: «Методист может дать учителю право только читать план». Документ хранится в CRDT
      на устройствах и сходится через сервер, а учитель бывает без сети по неделе. Что из этого действительно
      защищает документ от правок читателя?
    options:
      - text: 'Сервер проверяет право на каждом изменении и не принимает правки от читателя'
        correct: true
        why: 'Только сервер может защитить общий документ: клиент можно изменить, а правка читателя без проверки разойдётся всем.'
      - text: 'Редактор прячет у читателя кнопки и поле ввода, и этого достаточно'
        why: 'Это удобство, а не защита: изменённый клиент или старая версия приложения всё равно отправят правки.'
      - text: 'Права записывают в сам документ CRDT, и каждый клиент проверяет их перед применением'
        why: 'Права в общем документе может изменить любой его участник, а проверка на клиенте — не защита.'
      - text: 'Читатель правит без сети как обычно, а при синхронизации его правки тихо отбрасываются'
        why: 'Неделя работы пропадёт молча. Клиент читателя не должен копить правки, которые заведомо отклонят.'
    explanation: |
      Права проверяет сервер на каждой правке (курс «Синхронизация и офлайн», урок «Когда связь вернулась»).
      Клиент читателя открывает документ без ввода и не копит правки офлайн, но это удобство, а не защита.
      Если правку всё же отклонили, её не теряют молча: человек видит причину и может забрать текст.
    links:
      - https://www.inkandswitch.com/essay/local-first/

  - id: sdp-growth-005
    topic: Разборы кейсов
    subtopic: Растущий продукт
    level: junior
    question: |
      Интервьюер перечисляет боли сервиса записи к врачу. Какая из них показывает, что проблема организационная,
      а не техническая?
    options:
      - text: 'Сборка фронтенда вместе с тестами идёт 50 минут'
        why: 'Это техническая боль: её лечат проверками по затронутым модулям и кэшем сборки.'
      - text: 'Кабинет клиники медленно открывается на ноутбуках'
        why: 'Это вопрос скорости, его сначала измеряют и раскладывают по данным реальных пользователей.'
      - text: 'Сервис отзывов о врачах иногда отвечает по 10 секунд'
        why: 'Это вопрос отказов: тайм-аут по важности, перегородка, предохранитель.'
      - text: 'Выкатка ломается чужими изменениями, откатывают всех'
        correct: true
        why: 'Команды мешают друг другу через общую выкатку и общий код. Это лечат границами, владельцами и флагами.'
    explanation: |
      У разных болей разное лечение, поэтому на интервью их сначала разделяют. Организационная — команды мешают
      друг другу: общий откат, общие файлы, части без владельца. Технические — инструменты тормозят, сервис
      отказывает, страница медленная. Перестановка команд не ускорит сборку, а быстрая сборка не решит общий откат.
    links:
      - https://martinfowler.com/bliki/ConwaysLaw.html

  - id: sdp-growth-002
    topic: Разборы кейсов
    subtopic: Растущий продукт
    level: middle
    question: |
      В сервисе записи к врачу страница врача собирается на сервере и ждёт блок отзывов. Когда сервис отзывов
      начинает отвечать по 10 секунд, страница врача перестаёт открываться, и люди не могут записаться. Что
      изменить?
    options:
      - text: 'Поднять тайм-аут отзывов до 15 секунд, чтобы отзывы всегда успевали загрузиться'
        why: 'Страница будет открываться 15 секунд, а соединения сервера отрисовки займутся ещё быстрее.'
      - text: 'Короткий тайм-аут, свой предел соединений и предохранитель для отзывов; страница — без блока'
        correct: true
        why: 'Отзывы — второстепенное: страница врача и запись не должны от них зависеть. Это тайм-аут по важности, перегородка и предохранитель.'
      - text: 'Повторять запрос отзывов три раза подряд, если первый не ответил вовремя, чтобы блок появился'
        why: 'Повторы к медленному сервису добавляют ему нагрузки и задерживают страницу ещё сильнее.'
      - text: 'Переписать сервис отзывов на более быстрый язык, чтобы он больше не отвечал по 10 секунд'
        why: 'Сервис отзывов когда-нибудь снова откажет. Страница должна переживать его отказ, а не надеяться, что он не случится.'
    explanation: |
      Второстепенный сервис не должен ронять главный путь. Его зовут с коротким тайм-аутом по важности и через
      свой предел соединений, а после серии отказов предохранитель перестаёт его звать, и страница выходит без
      блока (курс «Большие приложения», «Отказы и деградация»). Запись к врачу от отзывов не зависит.
    links:
      - https://martinfowler.com/bliki/CircuitBreaker.html

  - id: sdp-growth-003
    topic: Разборы кейсов
    subtopic: Растущий продукт
    level: middle
    question: |
      Фронтенд сервиса записи к врачу — одно приложение для пациентов и клиник. Шесть команд, у пациентов и клиник
      почти нет общих экранов, разные требования к скорости. Общий откат уже решили флагами функций. Теперь мешают
      друг другу пациенты и клиники: правка расписания для клиник ждёт общей выкатки с сайтом для пациентов, а команды
      двух сторон спорят за общие файлы. Какую структуру предложить?
    options:
      - text: 'Микрофронтенды внутри каждой страницы — по одному на команду, собранные оболочкой в браузере'
        why: 'Разрез внутри страницы нужен, когда команды делят один экран. Здесь общих экранов почти нет, а развести пациентов и клиники дешевле разрезом по адресам.'
      - text: 'Одно приложение как сейчас, но с командами по слоям: интерфейс, данные, платформа'
        why: 'Деление по слоям режет задачи поперёк: каждая функция проходит через несколько команд.'
      - text: 'Два приложения по адресам — для пациентов и клиник, внутри каждого модульный монолит'
        correct: true
        why: 'Пациенты и клиники выкатываются отдельно и не ждут друг друга, а внутри каждого приложения модули с владельцами и проверяемыми границами снимают споры за общие файлы.'
      - text: 'По репозиторию на каждую команду, а модули собирать в одно приложение npm-пакетами'
        why: 'Сборка из пакетов не даёт независимой выкатки: чтобы выпустить один модуль, пересобирают всё приложение.'
    explanation: |
      Если части продукта почти не делят экран, разрез по адресам — самый простой вид микрофронтендов, а внутри
      каждого приложения хватает модульного монолита с проверяемыми границами (курс «Большие приложения»,
      «Модульный монолит или микрофронтенды»). Общий откат решают флагами функций, а не новой архитектурой.
    links:
      - https://martinfowler.com/articles/micro-frontends.html

  - id: sdp-growth-004
    topic: Разборы кейсов
    subtopic: Растущий продукт
    level: senior
    question: |
      Интервьюер меняет условия: «Через месяц запуск в новой стране, а команда „Отзывы и рейтинги“ уходит на другой
      проект». Переезд кабинета клиники на новый код ещё идёт. Что предложить?
    multiple: true
    options:
      - text: 'Передать модуль отзывов другой команде и поменять владельца в CODEOWNERS'
        correct: true
        why: 'У каждой части должен быть владелец. Без него модуль снова станет общим без хозяина.'
      - text: 'Первую версию для новой страны сделать только для пациентов и сказать об этом вслух как о компромиссе'
        correct: true
        why: 'Месяц — мало для двух приложений, одно из которых ещё переезжает. Честно названный компромисс лучше обещания всего.'
      - text: 'Вынести тексты в ключи переводов, а даты, деньги и время приёма показывать через `Intl` в поясе клиники'
        correct: true
        why: 'Это подготовка к новой стране из курса «Доставка и качество», урок «Языки, валюты и часовые пояса».'
      - text: 'Оставить модуль отзывов без владельца: он второстепенный и может пожить как есть'
        why: 'Второстепенный — не значит ничей. Модуль без хозяина правят все и не отвечает никто.'
      - text: 'Перевести за месяц оба приложения, приостановив переезд кабинета клиники'
        why: 'Остановленный посередине переезд — две системы надолго, а переводить придётся и старый, и новый кабинет.'
    explanation: |
      Новое условие разбирают точечно. Уход команды — вопрос владельца: модуль передают, а строку в CODEOWNERS
      меняют. Новая страна — вопрос интернационализации и объёма: первая версия поменьше, а компромисс называют
      вслух. Границы приложений, флаги и переезд кабинета остаются как были.
    links:
      - https://martinfowler.com/bliki/StranglerFigApplication.html
