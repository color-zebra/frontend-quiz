# Каталог готовых наборов: экран «Мои наборы» → «Готовые наборы». Это список ссылок, а не встроенные вопросы:
# набор скачивается, когда человек нажимает «Добавить», и дальше живёт как любой набор по ссылке.
# Порядок пунктов здесь — порядок в приложении. Наборы из custom-sets/, которых нет в этом списке, в приложении
# не видны.
#
# Пункт — ссылка на набор и одна-две фразы о том, что внутри:
#   - url: https://raw.githubusercontent.com/color-zebra/frontend-quiz/refs/heads/main/custom-sets/websockets.yaml
#     description: …
# Ссылка — такая же, как в поле «Добавить набор». Набор из этой папки должен быть запушен в main: приложение
# скачивает его с GitHub. Название, число вопросов и уровни сборка берёт из файла рядом — руками их не пиши.
# Не меняй ссылку у пункта, который уже могли добавить: к ней привязаны прогресс и заметки людей.
#
# Набор из другого места (gist, чужой репозиторий) сборка не скачивает, поэтому ему нужно название:
#   - url: https://gist.github.com/имя/abc123
#     title: Название в каталоге
#     description: …
# Вместо числа вопросов в карточке будет видно, откуда набор; после добавления — название и вопросы из файла.
#
# Опечатка в имени файла, неизвестное поле или пустое описание остановят сборку с понятной ошибкой.
# Правка этого файла пересобирает сайт (.github/workflows/deploy.yml), правка самих наборов — нет: число вопросов
# в карточке обновится со следующим деплоем.

- url: https://raw.githubusercontent.com/color-zebra/frontend-quiz/refs/heads/main/custom-sets/websockets.yaml
  description: С уроками. Рукопожатие и кадры, API браузера, переподключение и heartbeat, доставка, безопасность, серверы и прокси, Socket.IO и другие библиотеки.

- url: https://raw.githubusercontent.com/color-zebra/frontend-quiz/refs/heads/main/custom-sets/module-federation.yaml
  description: С уроками. Зачем нужны микрофронтенды, iframe, сборка на сервере, веб-компоненты, single-spa и import maps, Module Federation изнутри, адрес, общение, выкатка и тесты.

- url: https://raw.githubusercontent.com/color-zebra/frontend-quiz/refs/heads/main/custom-sets/browser-internals.yaml
  description: С уроками и демо-страницами для DevTools. Event loop и кадр, конвейер отрисовки, принудительная раскладка, вкладка Performance, медленные взаимодействия, загрузка, утечки памяти, движок V8, отладка, данные пользователей.

- url: https://raw.githubusercontent.com/color-zebra/frontend-quiz/refs/heads/main/custom-sets/ui-ux.yaml
  description: С уроками, макетами «как было / как стало» и картинками в вопросах. Как человек видит экран, иерархия, отступы, шрифт и цвет, палец и узкий экран, состояния, окна и шторки, формы, навигация, анимация, тексты, своя дизайн-система, проверка без дизайнера и разбор одного экрана.

- url: https://raw.githubusercontent.com/color-zebra/frontend-quiz/refs/heads/main/custom-sets/system-design-basics.yaml
  description: Курс 1 из 7, с уроками. Требования, деление на модули, состояние и владелец данных, контракт API, сравнение решений.

- url: https://raw.githubusercontent.com/color-zebra/frontend-quiz/refs/heads/main/custom-sets/system-design-data.yaml
  description: Курс 2 из 7, с уроками. Кэш и свежесть, гонки, оптимизм, повторы без дублей, конфликты, офлайн, файлы, сессия.

- url: https://raw.githubusercontent.com/color-zebra/frontend-quiz/refs/heads/main/custom-sets/system-design-delivery.yaml
  description: Курс 3 из 7, с уроками. Метрики скорости, SSR и SSG, загрузка кода и картинок, выкатка версий, Service Worker, безопасность, доступность, наблюдаемость, локализация.

- url: https://raw.githubusercontent.com/color-zebra/frontend-quiz/refs/heads/main/custom-sets/system-design-live.yaml
  description: Курс 4 из 7, с уроками. Большие списки и виртуализация, тяжёлая работа без зависаний, выбор по фильтру, SSE и WebSocket, обрывы, дубли событий, снимок и догоняющие события, чат, уведомления.

- url: https://raw.githubusercontent.com/color-zebra/frontend-quiz/refs/heads/main/custom-sets/system-design-sync.yaml
  description: Курс 5 из 7, с уроками. Несколько вкладок и устройств, связанные изменения, совместная работа, блокировки, OT и CRDT, офлайн, журнал операций, синхронизация.

- url: https://raw.githubusercontent.com/color-zebra/frontend-quiz/refs/heads/main/custom-sets/system-design-scale.yaml
  description: Курс 6 из 7, с уроками. Границы между командами, модульный монолит и микрофронтенды, контракты, постепенная миграция, эволюция API, технический долг, спорящие требования, отказы и деградация, поиск узкого места.

- url: https://raw.githubusercontent.com/color-zebra/frontend-quiz/refs/heads/main/custom-sets/system-design-practice.yaml
  description: Курс 7 из 7, с уроками. Как вести архитектурное интервью и защищать решение, семь разборов кейсов — от выбора даты до растущего продукта.

- url: https://raw.githubusercontent.com/color-zebra/frontend-quiz/refs/heads/main/custom-sets/system-design-practice-speech.yaml
  description: Устная тренировка к курсу 7. Задачи для самостоятельного решения с эталонным планом ответа и тезисами для самопроверки.
