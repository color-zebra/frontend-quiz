title: 'Системный дизайн: практика — устные кейсы'
kind: speech
questions:
  - id: sdp-oral-001
    topic: Компоненты и структура
    level: junior
    question: |
      Спроектируйте структуру фронтенда каталога интернет-магазина одежды: список товаров с фильтрами, карточка
      товара, корзина. Над проектом будут работать две команды. На что разделить приложение и кто чем владеет?
    answer: |
      **Требования.** Уточнить: сколько товаров (если десятки тысяч — фильтрует и отдаёт страницами сервер), нужны ли
      поисковики (тогда каталог и карточку отдают готовым HTML), какие фильтры, есть ли корзина гостя, что в первой
      версии.

      **Схема.** Модули по предметным областям, а не по слоям: «Каталог» (список, фильтры, поиск), «Карточка
      товара», «Корзина и оформление»; внутри каждого — отображение, сценарии, правила и доступ к данным (курс 1,
      «Как делить систему на части»). Общее — компоненты интерфейса и клиент API — с явным владельцем.

      **Данные и API.** Фильтры и сортировка — в адресе страницы. Список — курсорная или постраничная выдача
      с сервера; цену и наличие окончательно проверяет сервер при оформлении. Корзиной владеет один источник:
      у гостя — устройство, после входа — сервер.

      **Трудные места.** Связь модулей только через публичные интерфейсы — иначе граница зарастёт. Смена фильтра
      посреди загрузки страницы. Возврат из карточки в список на то же место.

      **Компромиссы.** Двум командам хватает модульного монолита: одна сборка, проверяемые линтером границы,
      владельцы в CODEOWNERS. Микрофронтенды здесь — плата за проблему, которой пока нет (курс 1, «Как сравнивать решения»). Пересмотреть, если команд станет больше
      и общая выкатка начнёт мешать.
    points:
      - Сначала уточнить объём каталога, нужны ли поисковики и что в первой версии
      - Модули по предметным областям — каталог, карточка, корзина, — а слои внутри модуля
      - У общих частей (компоненты, клиент API) есть владелец
      - Фильтры и сортировка — в адресе страницы
      - Цену и наличие окончательно проверяет сервер
      - Модули связаны только через публичные интерфейсы, границы проверяет линтер
      - Для двух команд — модульный монолит, а не микрофронтенды, с условием пересмотра

  - id: sdp-oral-002
    topic: Компоненты и структура
    level: junior
    question: |
      Спроектируйте компонент модального окна для дизайн-системы, которым будут пользоваться пять команд:
      подтверждения, формы, просмотр фото.
    answer: |
      **Требования.** Уточнить: какие сценарии (подтверждение, форма, галерея), нужен ли запрет закрытия, пока идёт
      сохранение, телефоны (шторка снизу?), доступность — обязательна.

      **API компонента.** Окно держит рамку — заголовок, кнопку закрытия, фокус и затемнение, — а содержимое
      потребитель передаёт через `children` и слоты для заголовка и кнопок. Это композиция вместо флагов: флаг под
      каждый сценарий удваивает число сочетаний (курс 1, «Компонент как контракт»). Открытие — управляемое: `open`
      и `onClose` от экрана, потому что открытием управляют снаружи.

      **Поведение на краях.** Escape и клик по затемнению закрывают, если экран не запретил (например, пока форма
      сохраняется). Несохранённую форму экран защищает сам, получив `onClose`.

      **Доступность.** Роль диалога с подписью; при открытии фокус внутрь, Tab не уходит наружу, при закрытии фокус
      возвращается на кнопку, которая открыла окно; страница под окном недоступна — `<dialog>` через `showModal()`
      или атрибут `inert` (курс «Доставка и качество», «Доступность в архитектуре»).

      **Компромиссы.** Встроенный `<dialog>` через `showModal()` даром делает фон недоступным и возвращает фокус при закрытии, но внешний вид
      и анимации настраивать сложнее; своя реализация — больше контроля и больше работы. Флаги уместны только
      для независимых визуальных вариантов вроде `size`.
    points:
      - Окно держит рамку, а содержимое передают через children и слоты
      - Флаг под конкретный сценарий — тревожный признак, лучше композиция
      - Открытие управляемое — open и onClose от экрана
      - Фокус внутрь при открытии, ловушка Tab, возврат на кнопку при закрытии
      - Фон недоступен — dialog через showModal() или inert
      - Экран может запретить закрытие, пока идёт сохранение
      - Встроенный dialog против своей реализации — с ценой каждого

  - id: sdp-oral-003
    topic: Компоненты и структура
    level: junior
    question: |
      Вы предложили хранить корзину интернет-магазина на сервере, а интервьюер возражает: «Почему не `localStorage`?
      Так быстрее и не нужен API». Оба варианта рабочие. Защитите своё решение.
    answer: |
      **Начать с требований, а не с мнений.** Выяснить, нужна ли одна корзина на телефоне и ноутбуке, нужно ли
      оформление без входа, важна ли скорость первой загрузки. Вывод верен только при этих требованиях (курс 1,
      «Как сравнивать решения»).

      **Сравнить по требованиям.** Если требование «одна корзина на всех устройствах» обязательное, вариант «только
      `localStorage`» выбывает. Если нет — он проще и быстрее, и это честно признать.

      **Назвать цену своего варианта.** Сервер — это API, запросы и задержка при каждом изменении. Цена смягчается:
      у гостя корзина на устройстве, после входа — однократный перенос на сервер, и владелец в каждый момент один.

      **Назвать условие пересмотра.** «Выбираю сервер, потому что нужна одна корзина на всех устройствах; плачу
      запросами и API; пересмотрю, если продукт откажется от входа на нескольких устройствах».

      **Как держаться в споре.** Не «так правильно», а сравнение. Если интервьюер приносит новый факт — например, вход
      не планируется вовсе, — признать, что `localStorage` лучше.
    points:
      - Решение выводят из требований, а не из мнений
      - Обязательное требование отсекает вариант, остальное сравнивают словами
      - Назвать цену своего решения, а не только выгоду
      - Смягчение цены — гость на устройстве, после входа однократный перенос
      - Решение формулируют так: выбираю это, потому что…; плачу тем-то; пересмотрю, если…
      - Новый факт от интервьюера — повод поменять решение

  - id: sdp-oral-004
    topic: Данные и формы
    level: middle
    question: |
      Спроектируйте форму заявки на ипотеку: двадцать полей на четырёх шагах и загрузка сканов документов
      до 30 МБ. Заполняют её за несколько дней, часто с телефона.
    answer: |
      **Требования.** Уточнить: можно ли продолжить на другом устройстве (тогда черновик на сервере), сколько
      документов и какого размера, как часто истекает сессия, что проверяет сервер.

      **Схема.** Форма по шагам, черновик, загрузчик файлов, слой сохранения, сервер заявок и хранилище файлов.

      **Данные и API.** Черновик — отдельно от отправленной заявки, с версией: автосохранение отправляет изменения
      после паузы в наборе с проверкой версии, чтобы старый ответ не затёр новый (курс 2, «Автосохранение»).
      Окончательные проверки — на сервере, клиентские — подсказки (курс 2, «Формы и валидация»).

      **Трудные места.** Большие файлы на мобильной сети — загрузка частями с возобновлением с места обрыва
      и прямо в хранилище по выданной ссылке (курс 2, «Загрузка файлов»). Сессия истекла посреди шага — ввод
      не теряется, после входа форма продолжается (курс 2, «Сессия и обновление токена»). Две вкладки с одной
      заявкой — конфликт версий черновика, человек выбирает, что оставить. Последний надёжный момент сохранить
      ввод на телефоне — переход страницы в «скрыта».

      **Компромиссы.** Черновик на сервере — продолжение с любого устройства, но запросы и конфликты; черновик
      только на устройстве — проще, но привязан к телефону. Отправка заявки — одна команда с идентификатором
      операции, чтобы повтор не создал вторую заявку.
    points:
      - Черновик отдельно от отправленной заявки, с версией
      - Автосохранение после паузы, с проверкой версии, без затирания старым ответом
      - Окончательные проверки — на сервере
      - Большие файлы — частями с возобновлением, прямо в хранилище
      - Истёкшая сессия не теряет ввод
      - Сохранять ввод, когда страница становится скрытой
      - Отправка — с идентификатором операции

  - id: sdp-oral-005
    topic: Данные и формы
    level: middle
    question: |
      Спроектируйте таблицу заказов в CRM: 200 тысяч записей, сортировка и фильтры, правка статуса прямо в строке,
      таблицей одновременно пользуются десятки менеджеров.
    answer: |
      **Требования.** Уточнить: какие фильтры и сортировки, нужна ли ссылка на конкретный набор фильтров, кто и что
      правит, как часто данные меняются у других.

      **Схема.** Таблица, панель фильтров, слой данных с кэшем страниц, сервер.

      **Данные и API.** 200 тысяч строк фильтрует, сортирует и отдаёт страницами сервер; сортировка загруженной
      страницы на клиенте даёт неверный результат (курс «Реальное время и большие списки», «Когда данных слишком
      много»). Фильтры — в адресе. Список отдаёт только поля строки, подробности — при открытии. Строгий порядок
      с уникальным полем для ничьих.

      **Трудные места.** Номера страниц нужны для поиска и ссылок, а список меняется — смещение может дать дубли,
      поэтому либо курсор, либо смещение по закреплённому снимку (курс 2, «Пагинация живых списков»). Правка статуса
      — оптимистично, но с версией строки: если коллега изменил строку раньше, сервер ответит конфликтом, и человек
      увидит новое значение (курс 2, «Версии и конфликты»). После правки строка может уйти из текущего фильтра —
      сверка кэша (курс 2, «Кэш после изменения»). С виртуализацией правку ячейки хранят вне строки, иначе она
      пропадёт при прокрутке (курс «Реальное время и большие списки», «Виртуализация»); при паре сотен строк
      на странице проще обойтись страницами.

      **Компромиссы.** Номера страниц против курсора; живое обновление таблицы против кнопки «Обновить» —
      для CRM обычно хватает перечитывания при возврате на вкладку.
    points:
      - Фильтрует, сортирует и пагинирует сервер, а не клиент
      - Фильтры и сортировка — в адресе
      - Строгий порядок с уникальным полем для ничьих
      - Правка — оптимистично, но с версией строки и обработкой конфликта
      - После правки строка может выпасть из фильтра — сверка кэша
      - Правку ячейки хранят вне строки или обходятся страницами

  - id: sdp-oral-006
    topic: Данные и формы
    level: middle
    question: |
      Спроектируйте корзину маркетплейса, которую покупатель держит открытой на телефоне и ноутбуке одновременно.
      Цены и наличие меняются в течение дня.
    answer: |
      **Требования.** Уточнить: корзина гостя или после входа, сколько позиций, как часто меняются цены, что
      должно случиться, если товар закончился.

      **Данные и API.** Владелец корзины после входа — сервер; у гостя — устройство, при входе однократный перенос
      со сложением позиций (курс 1, «Кто главный по данным»). Корзина хранит не цены, а позиции; цену и наличие
      считает сервер. У корзины версия.

      **Трудные места.** Изменение с другого устройства: перечитать корзину при возврате на вкладку и после
      сохранения; при конфликте версий — применить свои неподтверждённые действия поверх свежей корзины
      (курс «Синхронизация и офлайн», «Другие устройства и другие люди»). Оптимистичное добавление с откатом при
      отказе (курс 2, «Оптимистичные обновления»). Цена изменилась к оформлению — сервер сообщает новую сумму
      понятной ошибкой до оплаты. Повтор оформления — с идентификатором операции.

      **Компромиссы.** Живое обновление корзины на всех устройствах через поток событий — дорого и редко нужно;
      перечитывания при возврате на вкладку обычно хватает. Пересмотреть, если появятся общие корзины на несколько
      человек.
    points:
      - Один владелец корзины в каждый момент — у гостя устройство, после входа сервер
      - Корзина хранит позиции, а цену и наличие считает сервер
      - Перечитывание при возврате на вкладку и после сохранения
      - При конфликте — свои действия поверх свежей корзины
      - Цена изменилась — новая сумма до оплаты
      - Оформление — с идентификатором операции
      - Живое обновление — только если есть реальная потребность

  - id: sdp-oral-007
    topic: Живые данные и доставка
    level: middle
    question: |
      Спроектируйте встраиваемый виджет опроса, который владельцы сайтов ставят к себе одной строкой кода.
      Виджет стоит на тысячах чужих сайтов.
    answer: |
      **Требования.** Уточнить: что умеет виджет (вопрос, варианты, результаты), сколько сайтов и показов, должен
      ли виджет менять вид под сайт, есть ли вход для голосующих.

      **Схема.** Маленький загрузчик на чужой странице, сам опрос, сервер опросов и CDN.

      **Изоляция.** Чужой сайт не должен ломать виджет, а виджет — сайт. Самая сильная изоляция — `iframe` с нашего
      домена: свои стили, переменные и ошибки (курс «Большие приложения», «Модульный монолит или
      микрофронтенды»). Загрузчик только создаёт фрейм; общение с сайтом — через `postMessage` с проверкой
      источника: в обработчике сверяют `event.origin` с ожидаемым адресом, иначе сообщение может прислать любая
      страница. Shadow DOM изолирует стили, но код работает внутри чужой страницы.

      **Трудные места.** Размер: загрузчик — килобайты, сам опрос грузится после основной страницы, чтобы не портить
      сайту скорость. Версии: загрузчик по постоянному адресу с коротким кэшем, файлы опроса — с хэшем; ломающие
      изменения — новой версией рядом (курс «Большие приложения», «Контракты между командами»). Отказ нашего
      сервера: виджет тихо не появляется, а сайт работает. Повторные голоса проверяет сервер; запомнить голосовавшего во фрейме на чужом сайте трудно — браузеры разделяют хранилище встроенных фреймов, поэтому надёжно это работает только со входом.

      **Компромиссы.** Фрейм — сильная изоляция, но неудобный размер под содержимое и сложнее настроить вид;
      Shadow DOM — проще вид, слабее изоляция. Пересмотреть, если владельцы сайтов массово просят свои шрифты
      и цвета: тогда параметры темы через загрузчик.
    points:
      - Изоляция в обе стороны — фрейм с нашего домена сильнее всего
      - Общение с сайтом через postMessage с проверкой источника
      - Загрузчик крошечный, опрос — после основной страницы
      - Загрузчик — короткий кэш, файлы — с хэшем, ломающее — новой версией рядом
      - Наш сервер упал — сайт работает, виджет просто не появился
      - Повторные голоса проверяет сервер; без входа во фрейме на чужом сайте голосовавшего надёжно не узнать

  - id: sdp-oral-008
    topic: Живые данные и доставка
    level: middle
    question: |
      Спроектируйте дашборд аналитики для склада: таблица на 50 тысяч строк остатков, фильтры, итоги и график,
      данные обновляются каждые несколько минут.
    answer: |
      **Требования.** Уточнить: сколько строк реально смотрят, какие фильтры, нужны ли выгрузка и итоги по всему
      набору, насколько свежими должны быть данные, на каких компьютерах работают.

      **Данные и API.** Фильтры, сортировка и итоги по 50 тысячам строк — на сервере, отдельными числами; клиент
      получает страницы или окно строк (курс «Реальное время и большие списки», «Когда данных слишком много»).
      Список — только нужные поля.

      **Трудные места.** Длинная прокрутка — виртуализация с правильной полосой прокрутки; для доступности таблице
      сообщают настоящее число строк (там же, «Виртуализация»). Тяжёлые вычисления — пересчёт графика на клиенте —
      не должны блокировать нажатия: дробить работу или вынести в воркер (там же, «Тяжёлая работа без зависаний»).
      Обновление раз в несколько минут — опрос с пометкой «данные на 10:15», без прыжков таблицы под курсором.
      Память кабинета, открытого весь день, — выбрасывать дальние страницы и старые записи кэша.

      **Компромиссы.** Отфильтровать всё на клиенте проще, если строк сотни; при 50 тысячах это мегабайты лишних
      данных и медленные пересчёты. Живой поток данных вместо опроса — лишний при обновлении раз в несколько минут.
    points:
      - Фильтры, сортировка и итоги по большому набору — на сервере
      - Клиент держит окно строк и выбрасывает дальнее
      - Виртуализация длинной таблицы, настоящее число строк для доступности
      - Тяжёлые вычисления не блокируют основной поток
      - Опрос раз в несколько минут с пометкой времени данных
      - Обновление не двигает таблицу под курсором

  - id: sdp-oral-009
    topic: Живые данные и доставка
    level: middle
    question: |
      Онлайн-банк переписал форму перевода денег. Спроектируйте, как выкатить её так, чтобы ошибка задела
      как можно меньше людей и её быстро откатили.
    answer: |
      **Требования.** Уточнить: что изменилось (интерфейс, контракт API, расчёт комиссии), какие сторожевые метрики
      есть, какова цена ошибки — деньги клиентов.

      **Проверки до выкатки.** Тесты по риску: правила расчёта — модульными тестами, сценарий перевода — сквозным,
      контракт с сервером — контрактными тестами со стороны потребителя (курс «Доставка и качество», «Проверки
      и выкатка»). Расчёт, который раньше делал старый код, можно проверить параллельным запуском: оба считают,
      сравнивают, клиенту показывают старое (курс «Большие приложения», «Постепенная миграция»).

      **Выкатка.** Новая форма — за флагом функции, вычисленным на сервере и одинаковым для человека, не меняется
      посреди перевода. Шаги: сотрудники, 5 %, 25 %, все — со сторожевыми метриками (доля успешных переводов,
      ошибки, обращения) и заранее записанным условием остановки.

      **Откат.** Выключение флага — секунды, без новой выкатки; открытые вкладки получат его при следующем
      перечитывании флагов. Старая форма остаётся рабочей, пока новая не прошла все шаги.

      **Наблюдаемость.** Ошибки с версией приложения и флагами в контексте; сквозной номер связывает ошибку в браузере
      с записями сервера (курс «Доставка и качество», «Что происходит у пользователей»).
    points:
      - Тесты по риску, контракт — со стороны потребителя
      - Расчёт можно сверить параллельным запуском
      - Флаг на сервере, одинаковый для человека, не меняется посреди сценария
      - Шаги выкатки со сторожевыми метриками и условием остановки
      - Откат — выключением флага, старая форма жива
      - Ошибки с версией и флагами в контексте, сквозной номер

  - id: sdp-oral-010
    topic: Офлайн и масштаб
    level: senior
    question: |
      Спроектируйте веб-клиент почты, который работает без сети: читать письма, писать и отправлять, перемещать
      по папкам. Человек может быть без сети несколько дней.
    answer: |
      **Требования.** Уточнить: какие действия нужны без сети, сколько писем хранить на устройстве, вложения,
      несколько вкладок и устройств, что делать, если письмо удалили на другом устройстве.

      **Схема.** Интерфейс, локальная модель в IndexedDB, журнал операций, синхронизация с сервером, Service Worker
      для оболочки приложения.

      **Данные.** Чьё слово главное: сервер — для пришедших писем и папок; устройство — для написанного без сети,
      пока не отправлено (курс «Синхронизация и офлайн», «Данные живут на устройстве»). Хранить последние недели
      писем и черновики, уборка по правилам; просить постоянное хранение.

      **Трудные места.** Журнал операций: «переместить», «отправить», «прочитать» — с идентификаторами
      и зависимостями; отправка — один раз, с идентификатором операции (там же, «Журнал операций»). Синхронизация:
      отправить свои операции, получить чужие с курсора, свести; конфликты — по правилу, например перемещение
      удалённого письма отклоняется и показывается человеку (там же, «Синхронизация после долгого офлайна»).
      Смена формата операций за несколько дней офлайна — версия формата, сервер принимает старый дольше самого
      долгого офлайна. Несколько вкладок — одна ведущая синхронизирует.

      **Компромиссы.** Хранить всё — удобно, но квота и уборка; хранить мало — меньше работы без сети. Background
      Sync есть только в браузерах на Chromium, поэтому нужна отправка при открытии и возврате сети.
    points:
      - Для каждого вида данных решить, чьё слово главное
      - Локальная модель в IndexedDB, постоянное хранение, правила уборки
      - Журнал операций с идентификаторами и зависимостями
      - Синхронизация — свои операции, чужие с курсора, сведение
      - Неразрешимое не теряется молча, а показывается человеку
      - Версия формата операций при обновлении за время офлайна
      - Background Sync не везде — нужен запасной путь

  - id: sdp-oral-011
    topic: Офлайн и масштаб
    level: senior
    question: |
      Продакт хочет, чтобы дашборд продаж для сети магазинов показывал данные в реальном времени, открывался
      мгновенно у тысячи директоров и не стоил дороже, чем сейчас. Как вы ответите?
    answer: |
      **Назвать противоречие.** Точная свежесть, мгновенный ответ из кэша и малая стоимость вместе невозможны:
      кэш снимает нагрузку именно потому, что отдаёт копию (курс «Большие приложения», «Когда требования спорят»).

      **Уточнить, что на самом деле нужно.** Какие решения принимают по дашборду и с какой задержкой они ещё верны:
      директору магазина обычно хватает данных на пять минут назад, а «реальное время» нужно для одного-двух
      показателей, например выручки за день.

      **Найти точки компромисса.** Срок свежести кэша, что считается заранее, что идёт живым потоком. Предложение:
      основные графики — из заранее посчитанных итогов со сроком свежести пять минут и пометкой «данные на 14:05»;
      один показатель «выручка сегодня» — живым обновлением раз в минуту; тяжёлые отчёты — по запросу.

      **Назвать цену и инварианты.** Цена — задержка до пяти минут. Инвариантов денег здесь нет: дашборд только
      показывает, решения о списаниях не принимает.

      **Записать решение.** В ADR — выбранные сроки, что принесли в жертву и условие пересмотра: например, если
      директора начнут принимать решения, которым пять минут — много.
    points:
      - Честно назвать невозможную комбинацию — не «постараемся»
      - Выяснить, какая задержка на самом деле допустима для решений
      - Найти точки компромисса — срок свежести, предрасчёт, поток
      - Свежесть разная для разных показателей
      - Пометка времени данных на экране
      - Решение и его цена — в ADR с условием пересмотра

  - id: sdp-oral-012
    topic: Офлайн и масштаб
    level: senior
    question: |
      Вы спроектировали приложение записи на занятия в фитнес-клубе. Интервьюер трижды меняет условия: «клубов
      стало триста», «занятия должны работать в зале без связи», «появилась оплата абонемента внутри
      приложения». Как вы проведёте эти повороты?
    answer: |
      **Каждый раз — точечно.** Уточнить, найти затронутые части схемы, сказать, что остаётся, предложить изменение
      с ценой (урок «Защита решения»).

      **«Клубов стало триста».** Затронуты поиск клубов и расписания: фильтрует и отдаёт страницами сервер,
      расписание клуба — заранее собранная страница на CDN, если одинакова для всех. Запись на занятие не меняется:
      место по-прежнему проверяет сервер в самом действии.

      **«Работать в зале без связи».** Уточнить, что именно: показать купленные занятия и QR-код входа — можно
      с устройства; записаться на новое занятие без сети нельзя честно — место решает сервер (невозможная
      комбинация «без сети и строгая согласованность»). Предложение: расписание и мои записи — на устройстве
      с пометкой времени, запись — только при связи; отмена записи без сети — в очередь, с честным статусом
      «отправится, когда появится связь».

      **«Оплата абонемента».** Новый инвариант — деньги. Оплата — одна серверная операция с идентификатором
      операции, цена — из расчёта сервера, без оптимизма и без офлайна. Остальное не меняется.

      **Что показать интервьюеру.** Ни разу не начинать заново; называть, что меняется, а что нет; где условие
      несовместимо с прошлым — сказать прямо и предложить изменить обещание.
    points:
      - Каждый поворот — точечно, с тем, что остаётся неизменным
      - Масштаб — серверная выдача и кэш, запись не меняется
      - Офлайн — разделить, что можно с устройства, а что требует сервера
      - Записаться без сети нельзя честно — изменить обещание, а не притворяться
      - Деньги — серверная операция с идентификатором, без оптимизма
      - Несовместимость условий называют вслух
