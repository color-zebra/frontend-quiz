title: 'Системный дизайн: основы'
lessons:
  - id: sdb-intro
    topic: Введение
    subtopic: Что такое системный дизайн
    title: Что такое системный дизайн фронтенда
    body: |
      ## Какую задачу решает системный дизайн

      Представьте две ситуации. На работе руководитель говорит: «Нам нужен заказ с отслеживанием курьера — прикинь,
      как это сделать». На собеседовании просят: «Спроектируйте ленту новостей». В обоих случаях от вас ждут не код
      первого компонента, а ответы на вопросы покрупнее:

      - из каких частей будет состоять клиентское приложение и кто за что отвечает;
      - где будут жить данные: на сервере, в памяти вкладки, в адресной строке, в хранилище браузера;
      - как клиент будет обмениваться данными с сервером и какой для этого нужен API;
      - что увидит человек, если сеть медленная, пропала посреди действия или сервер ответил ошибкой;
      - что сломается первым, когда данных, пользователей или разработчиков станет в десять раз больше.

      Поиск ответов на эти вопросы и называется системным дизайном.

      **Системный дизайн фронтенда** (front end system design) — это проектирование клиентской части продукта
      целиком: из каких частей она состоит, где и как хранятся данные, как клиент общается с сервером и как система
      ведёт себя при сбоях, медленной сети и росте. Он отвечает на вопрос «как это устроено и почему именно так»,
      а не «как это написать».

      ## Чем он отличается от системного дизайна бэкенда

      Слова «системный дизайн» многие знают по бэкенд-собеседованиям: там проектируют базы данных, очереди сообщений
      и группы серверов, которые выдерживают миллионы запросов. Во фронтенде задачи другие, потому что код работает
      не на серверах компании, а на устройстве конкретного человека.

      - **Бэкенд**
        - Где работает код: на серверах компании.
        - Что ограничивает: нагрузка, объём данных, стоимость серверов.
        - Типичный вопрос: как хранить миллиард записей и выдержать пик нагрузки.
        - Из чего собирают систему: сервисы, базы данных, очереди.
      - **Фронтенд**
        - Где работает код: на телефоне или компьютере пользователя.
        - Что ограничивает: сеть, слабое устройство, возможности браузера.
        - Типичный вопрос: как быстро показать экран, где хранить состояние, что делать при обрыве связи.
        - Из чего собирают систему: экраны, модули, компоненты, хранилища браузера, API.

      Сервер во фронтенд-проектировании обычно остаётся «чёрным ящиком»: вы не решаете, как устроена его база данных,
      но решаете, какой API нужен клиенту и какие гарантии должен дать сервер. Например, что деньги за заказ не
      спишутся дважды, даже если человек дважды нажал «Оплатить».

      ## Архитектурное решение и его цена

      Не каждое решение в коде — архитектурное. Назвать функцию `saveCart` или `storeCart` — деталь: её можно поменять
      за минуту, и никто не заметит. А решить, где хранить корзину, — уже архитектура.

      Сравните два варианта для сервиса доставки еды:

      | | Корзина на устройстве | Корзина на сервере |
      |---|---|---|
      | Скорость | Мгновенно, без запросов | Каждое изменение — запрос к серверу |
      | Другое устройство | Там корзина пустая | Там та же самая корзина |
      | Работа на сервере | Не нужна | Нужны API и хранение |
      | Человек очистил данные браузера | Корзина пропала | Корзина осталась |

      Правильного ответа «вообще» здесь нет. Если люди часто выбирают еду на телефоне, а заказывают с компьютера,
      нужен второй вариант. Если заказ почти всегда собирают и оформляют за один раз на одном устройстве, первый
      дешевле и быстрее. Выбор зависит от требований, и у каждого варианта есть своя цена. К этому выбору мы вернёмся
      в уроке «Как сравнивать решения» — там появится и третий вариант, который сочетает оба.

      Мартин Фаулер, автор известных книг об архитектуре программ, приводит мнение Ральфа Джонсона: архитектура — это
      «решения, которые хочется принять правильно в самом начале проекта», и вообще «архитектура — это о важном, что
      бы это ни было». Отсюда рабочее определение. **Архитектурное решение** — такое, которое влияет на многие части
      системы и дорого обходится, если его потом менять. Место хранения корзины влияет на API, на работу без сети,
      на поведение при входе с другого устройства — поэтому это решение архитектурное.

      Главная мысль всего курса: в проектировании почти никогда нет «лучшего» решения. Есть решения, которые подходят
      под требования, и у каждого есть выигрыш и цена. Умение назвать и то и другое — именно то, чего ждут
      на собеседовании.

      ## Сквозной пример: сервис доставки еды

      Чтобы не прыгать между десятками разных примеров, уроки курса разбирают один продукт — сервис доставки еды.
      Им пользуются несколько человек, и у каждого свои задачи:

      - **покупатель** выбирает ресторан, собирает корзину, оплачивает заказ и следит, когда его привезут;
      - **ресторан** принимает заказы, отмечает, что начал готовить, и правит меню;
      - **курьер** забирает заказ и отмечает доставку — часто в подвале или лифте, где нет связи;
      - **поддержка** видит заказ и его историю, чтобы ответить на звонок «где моя еда?».

      Кроме людей, сервис общается с внешними системами: платёжным сервисом, который списывает деньги,
      и картографическим, который считает время в пути.

      ![Схема: в центре сервис доставки, вокруг покупатель, ресторан, курьер, поддержка, платёжный сервис и карты](images/sdb-context.png "Кто пользуется сервисом доставки и с какими системами он связан")

      В этом курсе мы в основном проектируем веб-приложение покупателя, которое чаще всего открывают с телефона:
      список ресторанов, меню, корзину, оформление заказа и экран отслеживания. Кабинет ресторана и приложение
      курьера появятся там, где на них лучше видна идея.

      Вопросы после уроков намеренно взяты из других областей — видеосервиса, онлайн-банка, чата, бронирования.
      Так вы проверите, что поняли принцип, а не запомнили сюжет про доставку.

      ## Как устроена программа

      Программа состоит из пяти курсов, и каждый следующий опирается на предыдущие:

      1. **Основы** — этот курс: как поставить задачу, разделить систему на части, устроить состояние, спроектировать
         поток данных и API и сравнивать решения.
      2. **Данные и надёжность** — загрузка и кэш, гонки запросов, оптимистичные изменения, конфликты, формы, сбои
         сети, повторы, загрузка файлов.
      3. **Реальное время, интерфейс и доставка** — живые обновления, большие списки, скорость загрузки, безопасность,
         доступность, локализация.
      4. **Сложные системы** — несколько вкладок и устройств, совместное редактирование, работа без сети, большие
         приложения и миграции.
      5. **Практика** — как вести архитектурное собеседование и разборы типовых задач.

      Если вы готовитесь к собеседованию, вам встретится план ответа RADIO: требования (Requirements), общая схема
      (Architecture), модель данных (Data model), интерфейсы и API (Interface definition), оптимизации
      (Optimizations). Этот курс закладывает основу для каждого шага, а сама техника собеседования — в пятом курсе.

      Курс заканчивается уроком о рисках и записи решений. К этому моменту у вас будет архитектура приложения
      покупателя целиком — от требований до контракта API — и умение объяснить, почему каждое решение именно такое.

      ## Типичные ошибки

      - **Сразу рисовать компоненты.** Пока не ясно, что нужно сделать, любая схема — догадка.
      - **Искать «лучшее» решение.** Его нет, есть подходящее под требования. Ответ «я бы взял X, потому что все так
        делают» на собеседовании звучит слабо.
      - **Переносить бэкенд-проектирование во фронтенд.** Как разделить базу данных на части — интересная тема,
        но не та, о которой спрашивают на фронтенд-собеседовании.
      - **Сводить проектирование к выбору библиотек.** «Redux или Zustand» — следствие решений о том, где живут
        данные и кто ими владеет, а не само решение.

      ## Как спрашивают на интервью

      - «Спроектируйте ленту новостей» (чат, автодополнение, фотохостинг) — задача намеренно расплывчатая, на 45–60
        минут.
      - «Как бы вы устроили клиентскую часть такого-то продукта?» — на работе этот вопрос звучит так же, только без
        таймера.

      ## Источники

      - [Front End System Design Playbook: фреймворк RADIO — GreatFrontEnd](https://www.greatfrontend.com/front-end-system-design-playbook/framework)
      - [Software Architecture Guide — Martin Fowler](https://martinfowler.com/architecture/)

  - id: sdb-requirements
    topic: Постановка задачи
    subtopic: Выяснение требований
    title: Как выяснять требования
    body: |
      ## Какую проблему решаем

      Почти любая задача приходит расплывчатой. «Сделайте отслеживание заказа» можно понять очень по-разному.
      Кто-то построит карту, на которой курьер движется в реальном времени, а заказчику хватило бы статуса «готовится —
      в пути — доставлен», который обновляется раз в минуту. Первое — недели работы и постоянное соединение с сервером,
      второе — пара дней.

      Ошибка в понимании задачи — самая дорогая: чем позже она находится, тем больше приходится переделывать. Поэтому
      проектирование начинается не со схем, а с вопросов. На собеседовании это проверяют специально: задачу дают
      нарочно размытой и смотрят, начнёте ли вы с уточнений или сразу броситесь рисовать компоненты.

      ## Сценарий, требование, реализация

      Одну и ту же потребность можно описать на трёх уровнях, и важно их не путать.

      - **Пользовательский сценарий** (user scenario) — что человек хочет сделать и в какой ситуации. «Покупатель
        оформил заказ и хочет понять, когда приедет еда».
      - **Функциональное требование** (functional requirement) — что система должна уметь, чтобы сценарий сработал.
        «Показывать текущий статус заказа и примерное время доставки; новый статус появляется на экране без
        перезагрузки страницы».
      - **Реализация** — как именно это сделать. «Открыть WebSocket», «опрашивать сервер раз в 30 секунд», «хранить
        статус в Redux».

      Есть ещё **нефункциональные требования** (non-functional requirements), их же называют атрибутами качества. Они
      описывают не что система делает, а насколько хорошо: как быстро, надёжно, безопасно. «Новый статус появляется
      не позже чем через минуту» — требование к качеству. Им посвящён следующий урок.

      | Формулировка | Уровень |
      |---|---|
      | Курьер в пути, покупатель хочет знать, через сколько минут открывать дверь | Сценарий |
      | Показывать примерное время доставки и обновлять его, пока курьер едет | Функциональное требование |
      | Время доставки на экране обновляется не реже раза в минуту | Нефункциональное требование |
      | Передавать координаты курьера через WebSocket | Реализация |

      Самая частая ловушка — **решение, замаскированное под требование**. Заказчик говорит «нам нужен WebSocket», хотя
      на самом деле ему нужно, чтобы статус обновлялся быстро. Если принять такую фразу за требование, вы лишите себя
      выбора: может оказаться, что опрос сервера раз в 30 секунд даёт тот же результат дешевле. Спасает простой вопрос
      «зачем?»: «Что должно происходить у пользователя, ради чего нужен WebSocket?» Ответ на него и есть настоящее
      требование.

      ## Вопросы, которые меняют архитектуру

      Вопросов можно задать сотню, а времени всегда мало. Поэтому сначала задают те, ответ на которые меняет устройство
      системы. Вот основные — и что от них зависит.

      | Вопрос | Что от ответа зависит |
      |---|---|
      | Должны ли страницы находить поисковики и красиво показываться в мессенджере, когда ссылкой делятся? | Способ рендеринга: нужен ли готовый HTML с сервера |
      | Должно ли приложение работать без сети или при очень плохой связи? | Хранение данных на устройстве, очередь действий |
      | Как быстро изменения должны появляться у других людей: сразу, через минуту, после перезагрузки? | Способ доставки обновлений: опрос сервера или постоянное соединение |
      | Сколько данных: десятки записей или десятки тысяч? | Пагинация, поиск на сервере, отрисовка только видимой части списка |
      | С каких устройств и браузеров открывают? Дешёвые телефоны, медленная мобильная сеть? | Сколько кода и картинок можно себе позволить |
      | Кто пользователи и какие у них права? | Разные интерфейсы, проверка доступа |
      | API уже есть или мы проектируем его вместе с бэкендом? | Что можно менять в контракте с сервером |

      Каждая из этих тем подробно разбирается в следующих курсах. Сейчас важно другое: ответ на любой из этих
      вопросов может заметно изменить архитектуру, поэтому их задают в первые минуты.

      Есть и вопросы, которые смело откладываются: цвет кнопок, точные тексты, анимации, выбор библиотеки. Они важны,
      но архитектуру не меняют, и время на них лучше потратить позже.

      Граница не всегда очевидна. «Какие бывают статусы заказа» звучит как мелочь про надписи, но от ответа зависят
      модель данных и правила переходов — значит, вопрос архитектурный. А «показывать ли рядом со статусом картинку
      с поваром» — нет. Проверка та же, что для архитектурного решения во вводном уроке: если ответ окажется другим,
      сколько частей системы придётся поменять?

      ## Основные и второстепенные пользователи

      **Основной пользователь** (primary user) — тот, ради кого делается функция. Для отслеживания заказа это
      покупатель. **Второстепенные пользователи** (secondary users) тоже взаимодействуют с функцией или зависят от неё,
      хотя сделана она не для них.

      У отслеживания заказа они есть. Ресторан принимает заказ и начинает готовить — от этого зависит статус. Курьер отмечает,
      что забрал заказ и доставил его. Поддержка должна видеть тот же статус, что и покупатель, иначе на звонок «где мой
      заказ?» ей нечего ответить.

      Если забыть о второстепенных пользователях, потеряются целые сценарии. Например, окажется, что статус «в пути»
      никто не выставляет: в приложении курьера просто нет кнопки «забрал заказ».

      ## Входы и выходы системы

      Полезно отдельно выписать, что приходит в систему и что из неё выходит.

      - **Входы** — действия пользователей и события из внешних систем: покупатель нажал «Оплатить», платёжный сервис
        подтвердил оплату, ресторан принял заказ, курьер отметил «доставлено».
      - **Выходы** — что система показывает или отправляет: статус на экране, уведомление на телефон, чек на почту.

      Такой список помогает найти сценарии, которые иначе всплывут уже в работе. Любой вход может не прийти, прийти
      с опозданием или прийти дважды. Что увидит покупатель, если подтверждение оплаты задержалось на десять минут?
      А если курьер отметил доставку, когда заказ ещё у ресторана?

      ### Как найти пропущенный сценарий

      Заказчик описывает обычно один, «счастливый» путь: человек заказал, оплатил, получил. Остальные сценарии
      приходится искать самим. Помогает пройти по трём спискам, которые у вас уже есть.

      1. **Каждый вход** — что будет, если он не пришёл, опоздал или пришёл дважды.
      2. **Каждый пользователь, включая второстепенных,** — что он делает с этой функцией и что ему нужно увидеть.
      3. **Каждое состояние экрана** — данных нет, данных много, произошла ошибка.

      Для отслеживания заказа такой проход за пару минут находит три сценария, о которых заказчик не говорил:

      - **оплата подтвердилась через десять минут** (вход опоздал) — что всё это время видит покупатель на экране
        статуса;
      - **у человека два активных заказа** (данных больше одного) — какой из них показывать и как переключаться;
      - **ресторан отклонил уже оплаченный заказ** (второстепенный пользователь) — как покупатель узнает об отмене
        и о возврате денег.

      Каждый найденный сценарий — вопрос заказчику или допущение, которое нужно записать. Ответ «это редкость, пока
      не делаем» тоже годится, если он сказан вслух и записан.

      ## Пример целиком: «сделайте отслеживание заказа»

      Пройдём весь путь — от расплывчатой просьбы до списка требований.

      **Исходная задача:** «Нужно отслеживание заказа».

      **Вопросы и ответы заказчика:**

      1. *Кто смотрит статус?* — Покупатель на сайте. Поддержка — в своей системе, это отдельная задача.
      2. *Какие бывают статусы?* — Создан, оплачен, готовится, в пути, доставлен, а ещё «отменён».
      3. *Как быстро новый статус должен появиться на экране?* — В пределах минуты достаточно.
      4. *Нужна ли карта с курьером?* — Не в первой версии.
      5. *Нужно ли уведомлять, если сайт закрыт?* — Да, но позже.
      6. *С каких устройств открывают?* — В основном с телефона, в мобильном браузере.
      7. *Можно ли открыть статус по ссылке без входа в аккаунт?* — Нет, только после входа.

      **Что получилось:**

      - *Функциональные требования:* показывать статус заказа и примерное время доставки; обновлять статус на открытой
        странице без перезагрузки; показывать отменённый заказ с причиной отмены; статус видит только владелец заказа.
      - *Требования к качеству:* новый статус появляется не позже чем через минуту; экран нормально работает
        в мобильном браузере на медленной сети.
      - *Отложено:* карта с курьером, уведомления при закрытом сайте.
      - *Вход, о котором легко забыть:* статус «в пути» выставляет курьер в своём приложении, когда забрал заказ, — нужно
        проверить, что там есть такое действие.

      Обратите внимание на ответ на третий вопрос. «В пределах минуты» означает, что постоянное соединение с сервером,
      скорее всего, не нужно: хватит периодического опроса. Одно уточнение сэкономило заметную часть работы — поэтому
      уточнения и стоят первыми.

      ## Как получить ответ: варианты и их цена

      На каждый открытый вопрос можно получить ответ по-разному, и у каждого способа своя цена.

      - **Спросить открыто:** «Что должно быть на экране отслеживания?»
        - Когда подходит: предметная область незнакома, и предложить своё пока нечего.
        - Цена: долго, а заказчик часто отвечает так же расплывчато, как поставил задачу.
      - **Предложить своё понимание и согласовать:** «Я понимаю так: покупатель видит статус и время доставки, карта
        пока не нужна — верно?»
        - Когда подходит: почти всегда, особенно на собеседовании. Этот же совет дают авторы плана ответа RADIO:
          предложить свой список требований и согласовать его.
        - Цена: легко навязать собственные догадки, если забыть спросить «верно?» и дождаться ответа.
      - **Сделать допущение вслух:** «Будем считать, что обновления раз в минуту достаточно».
        - Когда подходит: ответа нет ни у кого, а ошибка обойдётся недорого.
        - Цена: допущение нужно пометить и проверить позже — подробно об этом в уроке «Что войдёт в первую версию».
      - **Отложить вопрос:** «Цвет статусов обсудим, когда будет макет».
        - Когда подходит: ответ не меняет архитектуру — цвета, тексты, анимации.
        - Цена: почти никакой, если отложенное записано и к нему вернутся.

      ## Как вести разговор

      - **Записывайте согласованное.** В конце по этому списку удобно проверить, что ничего не забыто. Хорошо, если
        у каждого требования к качеству есть способ проверки — в шаблоне требований Volere его называют критерием
        соответствия (fit criterion); как его записать, разберём в следующем уроке.
      - **Следите за временем.** На собеседовании на требования уходит несколько минут — авторы RADIO советуют
        не больше 10 % времени.
      - **Начинайте с главного пользователя.** Сначала сценарий покупателя, потом — что нужно ресторану, курьеру
        и поддержке. Обратный порядок съедает время на второстепенное.

      ## Типичные ошибки

      - **Начать с компонентов** и через полчаса выяснить, что делали не то.
      - **Спрашивать о мелочах** — цвете кнопки, тексте подсказки — и не спросить о решающем: нужны ли поисковики,
        работа без сети, мгновенные обновления.
      - **Принять решение за требование:** услышать «нужен WebSocket» и не спросить зачем.
      - **Забыть второстепенных пользователей** и внешние системы — и потерять сценарии, в которых они участвуют.
      - **Выяснять бесконечно.** Требования нужны, чтобы начать проектировать, а не чтобы заменить проектирование.

      ## Как спрашивают на интервью

      - Задачу дают намеренно размытой: «Спроектируйте Instagram», «Спроектируйте автодополнение для поиска». Ждут, что
        вы начнёте с вопросов.
      - Иногда прямо: «Какие вопросы вы задали бы заказчику, прежде чем начать?»

      ## Источники

      - [Front End System Design Playbook: фреймворк RADIO, шаг Requirements exploration — GreatFrontEnd](https://www.greatfrontend.com/front-end-system-design-playbook/framework)
      - [Volere Requirements Specification Template: функциональные и нефункциональные требования, пользователи, критерии соответствия — Сюзанна и Джеймс Робертсон](https://www.volere.org/templates/volere-requirements-specification-template/)

  - id: sdb-quality
    topic: Постановка задачи
    subtopic: Атрибуты качества и ограничения
    title: Как превратить „быстро“ в цифры
    body: |
      ## Какую проблему решаем

      Заказчик сервиса доставки говорит: «Приложение должно быть быстрым, надёжным и работать у всех». С этим
      согласится любой, и именно поэтому фраза ничего не сообщает. Разработчик открывает меню ресторана на новом
      ноутбуке через офисный Wi-Fi: полсекунды — быстро. Покупатель открывает то же меню на недорогом телефоне
      в электричке: шесть секунд белого экрана — и он уходит к конкурентам. Оба по-своему правы, а проверить, сделана
      ли работа, нельзя: непонятно, с чем сравнивать.

      Хуже того, эти слова влияют на архитектуру. «Быстро на слабом телефоне при плохой связи» означает, что кода
      и картинок должно быть мало, а первый экран, возможно, придётся отдавать с сервера готовым. Такие решения
      принимают в самом начале. Если выяснится через три месяца, что «быстро» было про слабые телефоны, переделывать
      придётся половину приложения.

      В уроке «Как выяснять требования» мы получили для экрана отслеживания две строки о качестве: «новый статус
      появляется не позже чем через минуту» и «экран нормально работает в мобильном браузере на медленной сети».
      Первая уже проверяемая, вторая — нет: что такое «нормально» и что такое «медленная»? В этом уроке научимся
      превращать такие слова в критерии, которые можно измерить, собирать ограничения и замечать, когда два
      пожелания мешают друг другу.

      ## Атрибуты качества: какие бывают

      **Атрибут качества** (quality attribute) — свойство системы, которое говорит не о том, что она делает,
      а о том, насколько хорошо: как быстро, как надёжно, насколько защищённо. Требования к атрибутам качества — это
      те самые нефункциональные требования из прошлого урока.

      Чтобы ничего не забыть, удобно держать перед глазами готовый список. Самый известный — **модель качества
      ISO/IEC 25010**, международный стандарт. В его последней редакции у продукта девять характеристик: функциональная
      пригодность, производительность, совместимость, удобство взаимодействия, надёжность, защищённость,
      сопровождаемость, гибкость и безопасность для людей. У каждой есть подхарактеристики: например, надёжность
      делится на безотказность, доступность, устойчивость к сбоям и восстанавливаемость.

      Заучивать стандарт не нужно. Он полезен как чек-лист: пробежать глазами и спросить себя, не забыли ли мы о чём-то
      важном для этого продукта. А заказчик обычно говорит пятью-шестью словами, и каждое нужно расшифровать.

      | Слово заказчика | Что обычно стоит за ним (название в ISO/IEC 25010) |
      |---|---|
      | «Быстро» | Человек скоро видит содержимое, экран сразу отзывается на нажатие (производительность) |
      | «Надёжно» | Плохая сеть не ломает работу, ввод не теряется, после сбоя понятно, что произошло (надёжность) |
      | «Доступно» | «Работает, когда нужно» или «подходит людям с нарушениями зрения и моторики» — см. ниже |
      | «Безопасно» | Чужой заказ не увидеть, номер карты не утечёт (защищённость) |
      | «Масштабируемо» | Справляется, когда ресторанов, блюд или разработчиков стало в десять раз больше (гибкость, сопровождаемость) |

      Обратите внимание на строку «доступно». По-русски одно слово означает две совершенно разные вещи.
      **Доступность в смысле availability** — система работает, когда она нужна: например, 99,9 % времени в месяц.
      Это подхарактеристика надёжности. **Доступность в смысле accessibility** — продуктом могут пользоваться люди
      с ограничениями: незрячий человек с программой экранного чтения, человек, который управляет только
      с клавиатуры. В редакции ISO/IEC 25010 2023 года она разделена на две подхарактеристики удобства взаимодействия:
      инклюзивность (inclusivity) и помощь пользователю (user assistance). Если не уточнить, какую из двух
      «доступностей» имеет в виду заказчик, легко сделать не ту.

      Похожая ловушка со словом «безопасность»: в стандарте есть и защищённость от атак (security), и безопасность для
      жизни и здоровья людей (safety). Для сервиса доставки обычно важна первая.

      ## Как сделать слово проверяемым

      **Проверяемый критерий** — формулировка, по которой можно измерить систему и однозначно сказать: выполнено
      или нет. «Меню открывается быстро» — не критерий. «Меню открывается за 2,5 секунды» — уже лучше, но всё ещё
      неполный: на чём открывается, при какой сети и у скольких людей?

      Для таких формулировок есть известный приём — **сценарий атрибута качества** (quality attribute scenario). Его
      предложили Лен Басс и его коллеги из Института программной инженерии (SEI) в книге «Software Architecture
      in Practice». Полный шаблон состоит из шести частей, но для фронтенда хватает четырёх вопросов:

      1. **Что происходит** — событие: человек открыл экран, нажал кнопку, пропала сеть, сервер ответил ошибкой.
      2. **В каких условиях** — устройство, сеть, нагрузка: «телефон среднего уровня, мобильная сеть», «вечерний пик».
      3. **Как должна отреагировать система** — что человек увидит или сможет сделать.
      4. **Чем измеряем** — число и способ подсчёта: секунды, доля случаев, количество ошибок.

      Пример для сервиса доставки:

      > Покупатель открывает меню ресторана (что происходит) с телефона среднего уровня на медленной мобильной сети
      > (условия) и видит названия блюд и цены (реакция) не позже чем через 2,5 секунды в 75 % открытий (мера).

      ### Условия: без них число ничего не значит

      На оптоволокне и новом ноутбуке быстро открывается почти всё. Поэтому в критерии условия называют конкретно,
      а команда один раз договаривается, что они значат. «Телефон среднего уровня» — например, конкретная недорогая
      модель, которая есть у тестировщика на столе. «Медленная мобильная сеть» — например, скорость загрузки около
      1,6 Мбит/с и задержка 150 мс; такую сеть можно сымитировать в инструментах разработчика браузера. Цифры здесь
      выбирает команда, исходя из того, на чём и где сидят её пользователи. Главное — чтобы их можно было повторить.

      ### Мера: почему не среднее

      Допустим, вы десять раз замерили время открытия меню у разных людей, в секундах:
      1,2 · 1,3 · 1,4 · 1,5 · 1,6 · 1,8 · 2,0 · 2,2 · 6,0 · 9,0.

      Среднее — 2,8 секунды. Похоже, что медленно у всех, хотя восемь человек из десяти дождались не дольше
      2,2 секунды. При этом среднее ничего не говорит о тех двоих, кто ждал 6 и 9 секунд. Одно-два очень медленных
      открытия сильно сдвигают среднее, и по нему нельзя понять, сколько людей довольны.

      Поэтому время обычно меряют **процентилем** (percentile). 75-й процентиль — значение, в которое укладываются
      75 % замеров. В нашем примере это 2,2 секунды: три четверти людей увидели меню не дольше чем за это время.
      Формулировка «2,5 секунды на 75-м процентиле» читается просто: так быстро должно быть как минимум у трёх
      человек из четырёх. Если важны и те, кому хуже всех, добавляют второй порог — например, на 95-м процентиле.

      ### Готовые критерии: Web Vitals

      Для скорости веб-страниц не нужно придумывать свою шкалу: Google публикует набор метрик **Web Vitals** и пороги,
      при которых страница считается хорошей. Три главные метрики (Core Web Vitals):

      | Метрика | Что измеряет | «Хорошо» |
      |---|---|---|
      | LCP | Когда появился главный крупный элемент экрана | До 2,5 с |
      | INP | Как быстро видна реакция на нажатие | До 200 мс |
      | CLS | Насколько «прыгает» содержимое при загрузке | До 0,1 |

      Расшифровка названий: LCP — Largest Contentful Paint, «отрисовка самого крупного содержимого»; INP —
      Interaction to Next Paint, «от действия до следующей отрисовки»; CLS — Cumulative Layout Shift, «суммарный
      сдвиг вёрстки».

      Пороги проверяют по 75-му процентилю открытий страницы, отдельно для телефонов и компьютеров. Это пример
      хорошего критерия: есть событие, есть мера, есть процентиль, а условия задаются тем, что измерения собирают
      у настоящих пользователей. Подробно об этих метриках и о том, как их улучшать, — в курсе 3, в теме «Рендеринг
      и доставка». Сейчас важно другое: если для атрибута качества есть признанная мера, берите её, а не изобретайте
      свою.

      ### Не только скорость

      Тот же приём работает для любого атрибута качества:

      - **«Надёжно»** → если сеть пропала во время оплаты, после её возвращения покупатель видит, прошла ли оплата,
        и не может случайно оплатить второй раз.
      - **«Надёжно»** → корзина сохраняется после перезагрузки страницы и после закрытия вкладки.
      - **«Доступно» (для людей)** → заказ можно оформить только с клавиатуры и с программой экранного чтения.
      - **«Безопасно»** → статус заказа видит только его владелец; номер карты не проходит через наш код.
      - **«Масштабируемо»** → список из 3000 ресторанов города прокручивается без рывков на телефоне среднего уровня.

      Не каждый критерий — число. «Покупатель видит, прошла ли оплата» — тоже проверяемая формулировка: тестировщик
      выключит сеть посреди оплаты и посмотрит, что получилось.

      ## Ограничения

      **Ограничение** (constraint) — условие, которое команда не выбирает: оно задано извне, и решение обязано в него
      уложиться. В этом отличие от атрибута качества. Атрибут качества — цель, о которой можно договориться:
      «2,5 секунды или 3?». Ограничение — стена: «к началу летнего сезона», «платёжный сервис у нас уже выбран».

      Ограничения удобно собирать по трём группам.

      **Бизнес-ограничения** — срок, бюджет, размер и навыки команды, законы и договоры.
      - Запуск к лету, потому что летом заказов больше всего.
      - Во фронтенд-команде три человека, все пишут на React.
      - Данные банковских карт защищены строгими отраслевыми правилами — стандартом PCI DSS. Поэтому поле ввода
        карты обычно показывает сам платёжный сервис — на своей странице или во встроенном окне, — чтобы номер карты
        вообще не проходил через ваш код.

      **Ограничения устройства и сети** — на чём и где работает приложение.
      - Недорогие телефоны: слабый процессор и мало памяти, поэтому тяжёлый код выполняется долго.
      - Медленная и нестабильная мобильная сеть, дорогой трафик; курьер в подвале вообще без связи.
      - Батарея: каждый запрос будит радиомодуль телефона и расходует заряд.

      **Ограничения среды** — где и в каком окружении запускается код.
      - Какие браузеры и каких версий поддерживать.
      - **WebView** — браузерный компонент, встроенный в чужое мобильное приложение. Например, сервис доставки
        открывается внутри приложения банка-партнёра. Некоторые возможности браузера там урезаны или работают
        иначе, и поведение зависит от того, как партнёр настроил свой WebView.
      - **Встраивание в чужой сайт.** Например, кнопка «Заказать доставку» стоит на сайте самого ресторана. Тогда
        на ваш код действуют чужие стили, а сайт-хозяин может своей **политикой безопасности контента**
        ([Content Security Policy](https://developer.mozilla.org/ru/docs/Web/HTTP/Guides/CSP)) запретить загружать
        скрипты с вашего домена. Часто единственный путь в таком случае — показывать виджет во встроенном окне
        (iframe), со своей страницей внутри.
      - Существующие системы: API уже есть, и изменения в нём делает другая команда, раз в квартал.

      ### Какие ограничения архитектурно значимы

      Не каждое ограничение меняет устройство системы. «Логотип ресторана в шапке» — ограничение, но архитектуру
      оно не трогает. **Архитектурно значимое ограничение** — такое, которое убирает часть вариантов решения или,
      наоборот, заставляет выбрать определённый. Проверка простая: если это ограничение убрать, поменяется ли
      устройство системы?

      - «Открывается в WebView партнёра» — да: нельзя рассчитывать на возможности, которых там нет.
      - «Встраивается на сайты ресторанов с их правилами безопасности» — да: виджет придётся делать отдельной
        страницей во встроенном окне.
      - «API меняется раз в квартал» — да: недостающие данные придётся собирать на клиенте из того, что есть, или
        ждать.
      - «Тексты интерфейса только на русском» — для первой версии почти нет.

      Архитектурно значимые ограничения выписывают в самом начале и держат на виду: они отсекают варианты ещё до того,
      как вы начнёте их сравнивать.

      ## Когда качества спорят друг с другом

      **Конфликт атрибутов качества** — ситуация, когда улучшение одного свойства ухудшает другое. Это нормально:
      почти любое решение за что-то платит. Плохо, когда конфликт не заметили и решили его случайно.

      Возьмём экран отслеживания заказа. Чем чаще приложение спрашивает сервер о статусе, тем свежее статус на экране.
      Но каждый запрос стоит трафика, заряда батареи и нагрузки на сервер. Посчитаем: в вечерний пик экран
      отслеживания открыт у 20 000 человек одновременно.

      | Как часто спрашиваем | Запросов в секунду | Наибольшее опоздание |
      |---|---|---|
      | Раз в 5 секунд | 20 000 / 5 = 4000 | 5 с |
      | Раз в 30 секунд | 20 000 / 30 ≈ 670 | 30 с |
      | Раз в 60 секунд | 20 000 / 60 ≈ 330 | 60 с |

      Правило подсчёта простое: число открытых экранов, делённое на интервал опроса, — это запросов в секунду.
      А интервал опроса — это и наибольшее опоздание: если статус сменился сразу после очередного запроса, экран
      узнает об этом только при следующем. Разница между первой и последней строкой — в двенадцать раз по нагрузке
      на сервер и примерно во столько же по числу пробуждений телефона.

      Результат расчёта сравнивают с тем, сколько выдерживает сервер, и оставляют запас. Работать впритык к пределу
      нельзя: повторы после ошибок, одновременное открытие тысяч экранов и другие запросы к тому же серверу легко
      его превысят.

      Помогает одно наблюдение: **данные на экране не могут быть свежее, чем их источник**. Статус заказа меняется
      несколько раз за весь заказ: ресторан один раз отмечает, что начал готовить, курьер один раз отмечает, что
      забрал заказ. Спрашивать сервер каждые 5 секунд — значит в подавляющем большинстве запросов получать «ничего
      не изменилось». В уроке о требованиях заказчик сказал, что новый статус достаточно показать в пределах минуты.
      Значит, опрос раз в 30 секунд выполняет требование с запасом и стоит в шесть раз меньше, чем опрос каждые
      5 секунд: около 670 запросов в секунду вместо 4000. Это решение мы и примем для сервиса доставки.

      Правило про запас здесь применено лишь наполовину: сколько запросов выдержит сервер заказов, мы пока не знаем.
      Эту цифру нужно выяснить у команды бэкенда и сравнить с 670. Что бывает, если этого не сделать, разберём
      в уроке «Риски и развитие решения».

      Другие частые конфликты во фронтенде:

      - **Скорость против защищённости.** Личные данные, сохранённые на устройстве, открываются быстрее, но на общем
        компьютере их увидит следующий человек.
      - **Богатые возможности против скорости на слабых телефонах.** Карта с курьером требует тяжёлой библиотеки,
        и первый экран грузится дольше.
      - **Свежесть данных против нагрузки и батареи.** Частый опрос сервера, как в примере выше.
      - **Быстрый запуск против сопровождаемости.** Сделать «на скорую руку» к сроку и потом долго переделывать.

      Когда конфликт найден, его нельзя решить «технически правильно» — нужен **приоритет**: что важнее, если нельзя
      получить оба свойства в полной мере. Приоритет задаёт заказчик, а ваша задача — показать цену каждого варианта.
      И приоритет меняет архитектуру. Если на первом месте экономия батареи, статус опрашивают редко и обновляют
      сразу, когда человек возвращается на вкладку. Если на первом месте секундная свежесть, понадобится постоянное
      соединение, по которому сервер сам присылает изменения, — о нём подробно в курсе 3, в теме «Системы реального
      времени».

      ## Пример целиком: качество и ограничения сервиса доставки

      Соберём всё для веб-приложения покупателя. Сначала — что сказал заказчик, после стрелки — во что это
      превратилось.

      - **«Меню должно открываться быстро»** → LCP меню не больше 2,5 с на 75-м процентиле у телефонов; в тестах —
        на нашем «телефоне среднего уровня» и на сети 1,6 Мбит/с с задержкой 150 мс.
      - **«Кнопки не должны тормозить»** → INP не больше 200 мс: нажатие «Добавить в корзину» сразу видно на экране.
      - **«Статус должен быть свежим»** → новый статус появляется на открытом экране не позже чем через 60 с и сразу
        после возвращения на вкладку.
      - **«Оплата должна быть надёжной»** → если связь пропала во время оплаты, после её возвращения покупатель видит
        итог оплаты и не может случайно оплатить второй раз.
      - **«Чтобы никто не подсмотрел»** → статус заказа видит только владелец; номер карты вводится в форме
        платёжного сервиса.
      - **«Чтобы пользоваться могли все»** → уточнили: речь о людях с нарушениями зрения. Оформление заказа
        проходится с клавиатуры и с программой экранного чтения.
      - **«Чтобы выдержало рост»** → город с 3000 ресторанов и меню до 300 блюд работают без рывков на телефоне
        среднего уровня.

      Ограничения:
      - запуск через три месяца, три фронтендера (бизнес);
      - основная аудитория — недорогие телефоны и мобильная сеть (устройство и сеть);
      - приложение открывают и в WebView приложения банка-партнёра (среда, **архитектурно значимое**);
      - карту вводят только в форме платёжного сервиса (бизнес и закон, **архитектурно значимое**).

      Найденный конфликт: свежесть статуса против батареи и нагрузки. Приоритет — экономия, поэтому опрос раз
      в 30 секунд (около 670 запросов в секунду в пик) и обновление при возвращении на вкладку.

      Что это даёт проектированию. Строка про 2,5 секунды на медленной сети говорит, что первый экран должен быть
      лёгким: возможно, его придётся отдавать с сервера готовым HTML. Строка про WebView запрещает опираться на то,
      чего там может не быть. Строка про повторную оплату говорит, что защиту от двойного списания должен дать сервер,
      а клиент должен уметь спросить его об итоге. Каждая строка — либо проверка перед выпуском, либо подсказка
      архитектуре.

      ## Насколько подробно записывать: варианты

      - **Оставить слова без чисел.**
        - Что даёт: ничего не нужно согласовывать.
        - Цена: споры «быстро или нет» начнутся после запуска, когда переделывать дорого.
      - **Взять готовые меры:** Web Vitals для скорости, WCAG (международное руководство по доступности
        веб-содержимого) для доступности.
        - Что даёт: дёшево, понятно всем, есть инструменты измерения.
        - Цена: не покрывают сценарии вашего продукта — свежесть статуса или поведение при обрыве
          оплаты.
      - **Написать свои сценарии для ключевых мест.**
        - Что даёт: точно описывает то, что важно именно здесь.
        - Цена: нужно время, чтобы договориться о числах и научиться их измерять.

      Обычно работает сочетание: готовые меры там, где они есть, и три-пять собственных сценариев для самых важных
      мест продукта. Сорок критериев на всё подряд никто не прочитает и не проверит.

      ## Типичные ошибки

      - **Слова вместо критериев.** «Быстро» и «надёжно» остаются в задаче, и после запуска выясняется, что каждый
        понимал их по-своему.
      - **Число без условий.** «Две секунды» на ноутбуке разработчика и на дешёвом телефоне в метро — разные обещания.
      - **Среднее вместо процентиля.** Несколько очень медленных открытий портят среднее, а сколько людей недовольны,
        из него не видно.
      - **Не уточнить «доступность».** Команда обеспечивает работу 99,9 % времени, а заказчик имел в виду незрячих
        пользователей — или наоборот.
      - **Обещать невозможное.** «Статус обновляется мгновенно», когда источник меняется раз в несколько минут, или
        «работает 100 % времени».
      - **Не заметить конфликт.** Опрос каждые пять секунд «для свежести» — и счёт за серверы вместе с жалобами
        на батарею.
      - **Забыть о среде.** Приложение проектировали для браузера, а половина пользователей открывает его в WebView
        партнёра.

      ## Как спрашивают на интервью

      - «Какие нефункциональные требования вы бы здесь выделили?» Ждут не список слов, а несколько измеримых
        критериев и объяснение, как они влияют на решение.
      - «Что для вас значит „быстро“ в этой задаче?» Хороший ответ называет метрику, порог и условия.
      - «Пользователи сидят на слабых телефонах с плохой сетью — что изменится в вашем решении?» Проверяют, умеете ли
        вы вывести архитектуру из ограничения.

      ## Источники

      - [ISO/IEC 25010: модель качества продукта — iso25000.com](https://iso25000.com/index.php/en/iso-25000-standards/iso-25010)
      - [Specify Quality Requirements: сценарии атрибутов качества SEI — arc42 Quality Model](https://quality.arc42.org/articles/specify-quality-requirements#the-sei-approach-quality-attribute-scenarios)
      - [Web Vitals: основные метрики и пороги — web.dev](https://web.dev/articles/vitals?hl=ru#core-web-vitals)

  - id: sdb-scope
    topic: Постановка задачи
    subtopic: Границы, допущения, приоритеты
    title: Что войдёт в первую версию
    body: |
      ## Какую проблему решаем

      После двух предыдущих уроков у сервиса доставки длинный список желаний. Покупатель выбирает ресторан, собирает
      корзину, платит и следит за заказом. А ещё заказчик хочет карту с курьером, оплату наличными, промокоды, заказ
      из нескольких ресторанов сразу, доставку к определённому часу, отзывы и уведомления на телефон. Срок — три месяца,
      во фронтенд-команде три человека.

      Если взяться за всё сразу, через три месяца будет много начатого и ничего законченного: каждая функция сделана
      наполовину, а заказать еду всё ещё нельзя. Есть и вторая беда, менее заметная. Многое о продукте мы на самом деле
      не знаем, а придумали сами: «наверное, заказывают из одного ресторана», «наверное, отменять заказ можно только
      до оплаты». Если такая догадка неверна там, где от неё зависит устройство системы, переделывать придётся
      дорого — и узнаем мы об этом в самый неудобный момент.

      Этот урок о трёх решениях, которые принимают до проектирования:

      - что войдёт в первую версию, а что явно откладывается;
      - что мы знаем точно, что предполагаем и чего не знаем вовсе;
      - какие неизвестные выяснять первыми.

      ## Первая версия — сквозной путь

      **MVP** (minimum viable product, минимально жизнеспособный продукт) — самая маленькая версия продукта, которой
      настоящие люди уже могут пользоваться для главной задачи. Её выпускают, чтобы как можно раньше узнать, работает ли
      идея, и учиться на реальном использовании, а не на догадках.

      Ключевое слово — «пользоваться». Объём первой версии можно сократить двумя очень разными способами.

      - **По слоям, или «половина каждого экрана».** Сделать каталог ресторанов с фильтрами и красивое меню, а корзину
        и оплату — потом. Выглядит как прогресс, но заказать еду нельзя, и никто из настоящих покупателей ничего
        не проверит.
      - **Сквозной путь** (его ещё называют вертикальным срезом, vertical slice) — узкий, но полный путь пользователя
        от начала до конца. Один город, оплата только картой, статус без карты курьера — зато человек действительно
        может выбрать ресторан, заказать и получить еду.

      | | По слоям | Сквозной путь |
      |---|---|---|
      | Через месяц готово | Несколько красивых экранов | Узкий рабочий путь до доставки |
      | Показать людям | Нельзя: заказ не работает | Можно: первые заказы и отзывы |
      | Проблемы стыков | Найдутся в конце | Найдутся сразу |
      | Цена | Риск отложен на конец | Отказ от многих функций сейчас |

      Проблемы стыков — это то, что ломается на границах частей: оплата не меняет статус, ошибка сети посреди
      оформления, разные представления о заказе у клиента и сервера. При сквозном пути они видны с первых недель,
      потому что путь проходит через все части системы.

      ### Скейтборд вместо колеса

      Хенрик Книберг, известный тренер по гибкой разработке, объяснил эту разницу рисунком, который с тех пор часто
      цитируют. Заказчик хочет машину. В первом ряду рисунка команда сначала привозит колесо, потом два колеса на оси,
      потом кузов без крыши и только в конце — машину. Всё это время заказчик недоволен: на частях машины ездить
      нельзя. Во втором ряду команда сначала привозит скейтборд, потом самокат, велосипед, мотоцикл и в конце машину.
      Каждая версия уже везёт человека из точки А в точку Б, и по каждой можно получить отзыв. Книберг подчёркивает,
      что настоящая потребность заказчика — не «машина», а «добираться быстрее», и первая версия должна закрывать
      именно её.

      Где аналогия ломается: скейтборд и велосипед — разные вещи, и велосипед делают заново. Программу же обычно
      не выбрасывают, а постепенно переделывают — Книберг сам пишет, что его модель особенно подходит программам,
      потому что их можно менять по ходу, а железо приходится каждый раз строить заново. Код, данные и API первой
      версии продолжают жить и обрастать функциями. Поэтому решения, принятые в первой версии, — например, как
      устроен заказ в базе и в API, — переходят в следующие. Об этом разделы ниже.

      ## Что явно откладываем

      Отказаться от функции мало — отказ нужно записать. **Список отложенного** (по-английски out of scope, «за рамками»)
      — перечень того, что в первую версию не входит, с короткой пометкой к каждому пункту.

      Зачем записывать то, чего не будет:

      - **Никто не начнёт делать это тихо.** Без записи разработчик «по пути» добавит фильтры или промокоды и потратит
        неделю.
      - **Заказчик соглашается явно.** Через два месяца не будет сюрприза «а где карта с курьером?».
      - **Проектировщик знает, что придёт потом.** Строить отложенное заранее не нужно, но и запирать ему дверь
        не стоит. Если известно, что оплату наличными добавят во второй версии, не стоит устраивать оформление заказа
        так, будто способ оплаты бывает только один.

      Полезно различать «отложено» и «не будет никогда». Первое — обещание вернуться, и о нём думают при
      проектировании. Второе снимает вопрос совсем.

      ## Факты, допущения и открытые вопросы

      Всё, что мы «знаем» о продукте, на деле бывает трёх сортов.

      - **Факт** — то, что подтверждено: данными, документом, ответом заказчика. «Платёжный сервис даёт готовую форму
        оплаты картой — это написано в его документации». «80 % заходов на сайт — с телефонов — так показывает
        аналитика».
      - **Допущение** (assumption) — то, что мы принимаем за правду без подтверждения, чтобы двигаться дальше.
        «Заказы почти всегда собирают из одного ресторана». «Покупатели готовы ждать новый статус до минуты и не станут
        из-за этого звонить в поддержку».
      - **Открытый вопрос** — то, чего мы не знаем и не можем разумно предположить: нужен ответ того, кто решает.
        «Можно ли отменить заказ, когда ресторан уже начал готовить, и кто тогда вернёт деньги?»

      Допущения — нормальная часть работы: без них проектирование не начать, а на собеседовании их прямо просят
      делать вслух. Опасно другое. Записанное в общий список допущение через месяц выглядит как факт, и никто уже
      не помнит, что это была догадка. Поэтому допущения помечают как допущения и пишут рядом, кто и когда может
      их подтвердить.

      ### Чем опасно неверное допущение

      Опасность допущения зависит от двух вещей: насколько вероятно, что оно неверно, и сколько придётся переделать,
      если это выяснится поздно. Сравните два допущения.

      - **«Светлой темы хватит».** Если окажется, что нужна тёмная, — это работа со стилями, и почти ничего, кроме
        внешнего вида, не меняется.
      - **«В заказе всегда блюда одного ресторана».** Если продукт решит разрешить заказ из нескольких ресторанов,
        изменится почти всё: как устроен заказ в API, как делится оплата, как показывать статус, если один ресторан
        уже отдал свою часть, а другой ещё готовит, сколько курьеров едет к покупателю.

      Оба допущения могут оказаться неверными. Но ошибка во втором стоит недель, а в первом — дней.

      ## Какие неизвестные выяснять первыми

      Неизвестных всегда больше, чем времени на их выяснение. Поэтому для каждого задают два вопроса:

      1. **Насколько мы уверены?** Есть ли данные, документ, ответ заказчика — или только «наверное»?
      2. **Какова цена изменения?** **Цена изменения** — сколько частей системы придётся переделать, если ответ
         окажется другим.

      В таблице столбцы — цена переделки, если ответ окажется другим. Строки — есть ли у ответа основания:
      подтверждение (данные, документ, слово заказчика) или хотя бы веские доводы. «Догадка» — оснований нет,
      только «наверное».

      | | Дёшево | Дорого |
      |---|---|---|
      | **Основания есть** | Не тратить время | Факт или допущение |
      | **Догадка** | Решить по ходу | **Выяснять первым** |

      Клетка «основания есть, дорого» требует уточнения. Если ответ подтверждён — это факт: его записывают
      и больше на него время не тратят. Если есть только веские доводы — это допущение: его записывают
      и подтверждают при первой возможности (так в примере ниже с заказом из одного ресторана). Клетка «догадка,
      дёшево» значит: решаем как удобнее, а ошибёмся — быстро поправим.

      Похожий приём в продуктовой работе называют **картой допущений** (assumptions mapping). Его развивали Джефф
      Готелф и Джош Сейден (книга «Lean UX») и Дэвид Бланд (книга «Testing Business Ideas»). У Бланда допущения
      раскладывают по важности и по тому, сколько у них подтверждений. Для архитектуры вместо «важности» удобно брать
      цену изменения.

      ### Как узнать, что переделка будет дорогой

      Признаки дорогого изменения:

      - затрагивает **модель данных и API** — то, как устроены заказ, пользователь, меню;
      - затрагивает **много экранов** сразу;
      - касается **внешних систем и договоров**: платёжного сервиса, приложения партнёра;
      - касается **денег и гарантий сервера**: списания, возвраты, отмены;
      - касается **уже сохранённых данных**: их придётся переносить в новый формат.

      Дёшево обычно меняется то, что живёт в одном месте: тексты, цвета, расположение элементов на одном экране,
      поведение одной кнопки.

      ### Что делать с самыми важными неизвестными

      - **Спросить того, кто знает:** заказчика, команду бэкенда, партнёра. Часто ответ уже есть, его просто
        никто не спросил.
      - **Посмотреть данные:** аналитику, обращения в поддержку, документацию внешнего сервиса.
      - **Если ответа нет ни у кого** — проверить допущение маленьким опытом: прототипом, замером, опросом. Как это
        делают, разбирается в уроке «Риски и развитие решения».
      - **Если ответ придёт нескоро** — выбрать вариант, который дёшево изменить потом, но не строить заранее лишнего.
        Например, оставить в заказе поле «ресторан» у каждой позиции, даже если в первой версии ресторан один.
        Это почти ничего не стоит сейчас и заметно удешевляет переход к заказу из нескольких ресторанов. Про
        обратимые и дорогие решения подробнее — в уроке «Как рисовать архитектуру».

      ## Пример целиком: первая версия доставки

      **Сквозной путь первой версии:** покупатель в одном городе выбирает ресторан из списка, открывает меню, собирает
      корзину из блюд одного ресторана, при оформлении входит по номеру телефона, вводит адрес, платит картой в форме
      платёжного сервиса и следит за статусом. Статус обновляется раз в 30 секунд — это решили в уроке «Как
      превратить «быстро» в цифры» из подтверждённого требования «в пределах минуты».

      **Отложено:**

      - **Карта с курьером** — тяжёлая, а заказ работает и без неё. Учесть сейчас: ничего, статус от карты не зависит.
      - **Оплата наличными** — нужна не всем, сначала проверим спрос. Учесть сейчас: способ оплаты — значение
        из списка, а не единственный вариант.
      - **Заказ из нескольких ресторанов** — сложная логика оплаты и доставки. Учесть сейчас: ресторан указан
        у каждой позиции заказа.
      - **Промокоды, отзывы, доставка к часу** — главный путь работает без них. Учесть сейчас: ничего.
      - **Уведомления при закрытом сайте** — отложили ещё на этапе требований. Учесть сейчас: ничего.

      **Что мы знаем и чего не знаем:**

      - **«Платёжный сервис даёт готовую форму оплаты»**
        - Сорт: факт (документация).
        - Что делаем: используем.
      - **«Покупатели почти всегда заказывают из одного ресторана»**
        - Сорт: допущение с основаниями.
        - Цена ошибки: высокая — меняется модель заказа и оплаты.
        - Что делаем: просим у заказчика данные о заказах, которые рестораны сейчас принимают по телефону.
      - **«Покупатели готовы ждать новый статус до минуты и не станут звонить в поддержку»**
        - Сорт: допущение.
        - Цена ошибки: низкая — меняется интервал опроса.
        - Что делаем: решаем по ходу, после запуска смотрим на звонки в поддержку.
      - **«Можно ли отменить заказ, когда ресторан уже готовит, и кто вернёт деньги?»**
        - Сорт: открытый вопрос.
        - Цена ошибки: высокая — статусы, деньги, гарантии сервера.
        - Что делаем: **выясняем первым** у заказчика и бэкенда.
      - **«Светлой темы хватит»**
        - Сорт: допущение.
        - Цена ошибки: низкая — только стили.
        - Что делаем: решаем по ходу — понадобится тёмная, добавим.

      Порядок выяснения получается сам: сначала отмена и возврат денег — неизвестно и дорого. Затем допущение
      об одном ресторане — дорого, но есть основания в него верить. Остальное решается по ходу работы.

      Весь результат помещается на одну страницу, и его можно показать заказчику: «вот что будет через три месяца,
      вот чего не будет, вот что мы предположили — поправьте, если не так».

      ## Как ещё можно сузить первую версию

      Сквозной путь можно сделать уже разными способами. У каждого своя цена.

      - **Сузить аудиторию.** Пример: один город, только новые покупатели. Цена: остальные пока не могут
        пользоваться.
      - **Сузить варианты на шаге.** Пример: только оплата картой. Цена: часть людей уйдёт, если им нужен другой
        способ.
      - **Упростить шаг.** Пример: статус текстом вместо карты курьера. Цена: меньше «вау», зато быстрее и легче.
      - **Сделать шаг вручную.** Пример: отмену заказа обрабатывает оператор поддержки по звонку. Цена: нагрузка
        на людей; годится, пока заказов мало.
      - **Отложить сценарий целиком.** Пример: отзывы и промокоды. Цена: потеря возможностей, которые не нужны для
        главного пути.

      ## Типичные ошибки

      - **Резать по слоям.** Через месяц много экранов и ни одного заказа; проблемы стыков вылезают в конце.
      - **Не записать отложенное.** Отложенные функции тихо возвращаются в работу, а заказчик удивляется, что их нет.
      - **Выдавать допущение за факт.** «Заказывают из одного ресторана» превращается в закон, хотя никто это
        не проверял.
      - **Выяснять всё подряд.** Неделя на споры о цвете статусов, а вопрос об отмене заказа так и остаётся открытым.
      - **Строить отложенное «на всякий случай».** Готовить систему к пяти будущим функциям — значит не успеть
        главный путь. Достаточно не запирать дверь там, где это дёшево.
      - **Считать MVP плохо сделанным продуктом.** Первая версия узкая, но то, что в неё вошло, должно работать
        по-настоящему.

      ## Как спрашивают на интервью

      - «У вас 45 минут — на чём сосредоточитесь?» Ждут, что вы назовёте главный сценарий и скажете, что оставляете
        за рамками.
      - «Какие допущения вы делаете?» Хороший ответ называет допущения вслух и говорит, что изменится, если они
        неверны.
      - «Что бы вы уточнили у заказчика в первую очередь?» Проверяют, умеете ли вы отличить дорогое неизвестное
        от дешёвого.

      ## Источники

      - [Making sense of MVP (Minimum Viable Product) — Henrik Kniberg](https://blog.crisp.se/2016/01/25/henrikkniberg/making-sense-of-mvp)
      - [Front End System Design Playbook: какие функции главные, а какие можно отложить — GreatFrontEnd](https://www.greatfrontend.com/front-end-system-design-playbook/framework#what-are-the-core-features-to-focus-on-and-which-are-good-to-have)

  - id: sdb-responsibility
    topic: Декомпозиция системы
    subtopic: Ответственность и границы
    title: Как делить систему на части
    body: |
      ## Какую проблему решаем

      Представьте первую версию сервиса доставки, написанную «по экранам». Есть страница меню, страница корзины
      и страница оформления заказа. Каждая страница — большой компонент, который сам загружает данные, сам считает
      всё, что нужно, и сам рисует результат.

      Правило «минимальная сумма заказа — 500 ₽» в такой системе живёт в четырёх местах. Страница меню показывает
      плашку «добавьте ещё на 120 ₽». Счётчик в шапке подсвечивается, когда сумма набрана. Страница корзины включает
      кнопку «Оформить». Страница оформления ещё раз проверяет сумму перед оплатой. Каждое место считает по-своему:
      где-то со скидкой, где-то без, где-то с учётом стоимости доставки.

      Через месяц продукт решает, что минимальную сумму задаёт каждый ресторан сам: у одного 500 ₽, у другого 900 ₽.
      Разработчик правит три места из четырёх. Четвёртое он не находит, и покупатель ресторана с порогом 900 ₽ видит
      активную кнопку «Оформить», нажимает её — а сервер отклоняет заказ. Человек не понимает, что сделал не так.

      Код здесь написан неплохо, и каждый компонент по отдельности работает. Проблема в другом: никто не отвечает
      за правило «минимальная сумма». Знание о нём размазано по экранам. Этот урок о том, как делить систему
      на части так, чтобы у каждого знания было одно место.

      ## Ответственность, подсистема, граница

      **Ответственность** (responsibility) — это круг вопросов, на которые отвечает часть системы, и знания, которые
      она для этого хранит. «Знает, что лежит в корзине, и решает, можно ли добавить блюдо и хватает ли суммы для
      заказа» — это ответственность корзины.

      **Подсистема**, или **модуль**, — часть системы, у которой есть своя ответственность. В коде это обычно папка
      с файлами, но папка — только способ хранения. Модулем её делает то, что у неё есть понятная задача и что
      остальные части пользуются ею, не заглядывая внутрь.

      **Граница** (boundary) — линия между модулями. Всё, что внутри границы, — забота модуля: его можно переписать,
      и соседи этого не заметят. Всё, что пересекает границу, — договорённость с соседями: какие функции модуль
      предлагает и что они обещают. Об этих договорённостях подробно — в следующем уроке, «Зависимости и публичный
      интерфейс модуля».

      Главная мысль урока: **подсистема — это ответственность, а не папка с компонентами**. Папка `components/Cart`
      с десятком компонентов ещё не делает корзину модулем, если правила корзины лежат в трёх других местах.

      ## Четыре вида ответственности

      Внутри любой функции продукта можно различить четыре вида работы. Мартин Фаулер называет три из них слоями
      (layers): отображение, предметная логика и доступ к данным. Во фронтенде полезно выделить ещё один —
      сценарии. Получается так:

      - **Отображение**
        - Отвечает на вопрос: как показать и что человек нажал.
        - Пример в доставке: карточка блюда, кнопка «В корзину», плашка «добавьте ещё 120 ₽».
        - Не знает: откуда данные и почему кнопка неактивна.
      - **Сценарии**
        - Отвечают на вопрос: в каком порядке выполнить шаги одного действия.
        - Пример: «добавить в корзину» — проверить правило, спросить подтверждение, сохранить, обновить итог.
        - Не знают: как нарисована кнопка и какой запрос уходит на сервер.
      - **Бизнес-правила**
        - Отвечают на вопрос: что разрешено и как считается.
        - Пример: «в корзине блюда одного ресторана», «минимальная сумма — 500 ₽», расчёт итога.
        - Не знают: есть ли вообще экран и сервер.
      - **Доступ к данным**
        - Отвечает на вопрос: где взять и куда сохранить данные.
        - Пример: запрос меню к API, сохранение корзины — у гостя на устройстве, после входа на сервере.
        - Не знает: зачем эти данные нужны.

      Разберём каждый слой подробнее.

      **Отображение** (presentation) — компоненты, которые рисуют интерфейс и сообщают о действиях человека. Хорошее
      отображение получает готовые данные и вызывает готовые действия: «покажи итог 1 380 ₽», «человек нажал
      „В корзину“». Оно не решает, можно ли добавить блюдо.

      **Сценарий** — порядок шагов одного действия пользователя. Сценарий «добавить в корзину» сам ничего не считает
      и ничего не рисует, он дирижирует: спрашивает у правил, можно ли добавить, просит интерфейс показать вопрос,
      вызывает сохранение. В литературе этот слой называют по-разному: **прикладной слой** (application layer),
      **слой сервисов** (Service Layer — так его описывает каталог шаблонов Фаулера: набор доступных операций
      приложения, каждая из которых согласует работу остальных частей) или **слой вариантов использования**
      (use cases). По любому из этих названий вы найдёте ту же идею.

      **Бизнес-правила** (domain logic, предметная логика) — знания о предметной области: что разрешено, что запрещено,
      как считаются суммы. Фаулер отмечает, что такую логику проще всего проверять тестами, если она не связана
      с интерфейсом. Удобнее всего писать её обычными функциями без React и без сетевых запросов.

      **Доступ к данным** (data access) — всё, что знает, как разговаривать с сервером, хранилищем браузера
      и внешними сервисами, и превращает их ответы в данные, удобные для остальных слоёв.

      Слои — это деление по ответственности, а не обязательные папки. Фаулер подчёркивает, что это логические слои,
      а не отдельные программы на разных машинах. Маленький модуль может держать все четыре слоя в двух файлах — важно, чтобы
      каждый кусок кода занимался чем-то одним.

      Слои связаны в одном направлении: отображение пользуется сценариями, сценарии — правилами и доступом к данным.
      Правила ни от кого не зависят. Почему направление важно и как сделать, чтобы правила не зависели даже от
      доступа к данным, — тема следующего урока.

      ## Слои живут внутри модулей

      Есть соблазн сделать слои верхним уровнем проекта: папка `components` для всего отображения, папка `api` для всех
      запросов, папка `utils` для всех правил. Для маленького проекта это нормально. Но когда проект растёт, в каждой
      такой папке оказываются сотни файлов про всё подряд, и чтобы поменять одну функцию продукта, приходится ходить
      по всем папкам.

      Фаулер советует другое: когда любой слой становится слишком большим, делить верхний уровень на **модули
      по предметным областям** (корзина, меню, оплата), а слои держать внутри каждого модуля. Тогда изменение
      правил корзины затрагивает одну папку, а не пять.

      Эту же идею воплощает популярная во фронтенде методология **Feature-Sliced Design** (FSD, «дизайн, нарезанный
      по функциям»). В ней код делится на слои по уровню (страницы, крупные блоки интерфейса, функции продукта,
      бизнес-сущности, общий код), каждый слой — на **слайсы** (slices, «ломтики») по предметной области,
      а слайс — на сегменты по назначению: `ui` для отображения, `model` для данных и правил, `api` для запросов.
      Модуль может импортировать только из слоёв ниже себя. Корзина в такой структуре — это слайс `cart` со своими
      `ui`, `model` и `api`. Знать FSD для этого курса не обязательно: это один из способов записать в структуре
      папок то же самое разделение ответственности.

      ## Пример целиком: подсистемы сервиса доставки

      Вернёмся к веб-приложению покупателя. Разделим его на подсистемы по ответственности.

      ![Схема: пять подсистем приложения покупателя — каталог, меню, корзина, оформление и оплата, отслеживание; правила корзины выделены внутри корзины; меню и оформление обращаются к корзине; внизу общий слой доступа к API](images/sdb-subsystems.png "Подсистемы приложения покупателя и их границы")

      - **Каталог**
        - Отвечает за: рестораны, поиск, фильтры.
        - Не делает: ничего не знает о корзине.
      - **Меню**
        - Отвечает за: блюда, разделы, цены, наличие.
        - Не делает: не решает, можно ли добавить блюдо в корзину.
      - **Корзина**
        - Отвечает за: что выбрано, итог, правила добавления.
        - Не делает: не знает, как устроена оплата.
      - **Оформление и оплата**
        - Отвечает за: адрес, время, оплату, создание заказа.
        - Не делает: не считает итог по-своему.
      - **Отслеживание**
        - Отвечает за: статус заказа и время доставки.
        - Не делает: не знает, как заказ оформлялся.

      Теперь посмотрим, где живут правила корзины. Их два:

      - **«Один ресторан»:** в корзине могут быть блюда только одного ресторана. Если человек добавляет блюдо
        из другого, приложение спрашивает: «Очистить корзину и начать новую?»
      - **«Минимальная сумма»:** заказ можно оформить, только когда сумма блюд не меньше порога; порог задаёт
        ресторан.

      Оба правила, как и расчёт итога, — ответственность корзины, слой бизнес-правил. Они записаны один раз, обычными
      функциями. Корзина хранит только блюда и их количество, а цены берёт из меню:

      ```ts
      // Бизнес-правила корзины: без React, без запросов, без хранилища
      export function checkAddDish(cart: Cart, dish: Dish): 'ok' | 'other-restaurant' {
        if (cart.items.length > 0 && cart.restaurantId !== dish.restaurantId) {
          return 'other-restaurant';
        }
        return 'ok';
      }

      // prices — цены блюд из меню: { [dishId]: цена }
      export function cartTotal(cart: Cart, prices: Record<string, number>): number {
        return cart.items.reduce((sum, item) => sum + prices[item.dishId] * item.quantity, 0);
      }

      export function missingToMinimum(cart: Cart, prices: Record<string, number>, minOrder: number): number {
        return Math.max(0, minOrder - cartTotal(cart, prices));
      }
      ```

      Пройдём весь путь действия «добавить в корзину» по слоям:

      1. **Отображение.** Человек нажимает «В корзину» на карточке блюда. Карточка ничего не проверяет — она вызывает
         сценарий «добавить блюдо».
      2. **Сценарий.** Сценарий спрашивает правило `checkAddDish`. Если ответ `other-restaurant`, он просит интерфейс
         показать вопрос «Очистить корзину?» и ждёт ответа человека.
      3. **Бизнес-правила.** Правило отвечает, не зная ни про кнопки, ни про сервер, — его можно проверить тестом
         за миллисекунды.
      4. **Доступ к данным.** Сценарий сохраняет новую корзину: у гостя на устройстве, у вошедшего покупателя
         на сервере — сценарию это неважно.
      5. **Отображение.** Итог в шапке берёт сумму из `cartTotal`, а плашка «добавьте ещё 120 ₽» и кнопка «Оформить» —
         из `missingToMinimum`. Сами они ничего не считают.

      Что стало с проблемой из начала урока? Когда порог начинает задавать каждый ресторан, меняется одно место — то,
      откуда берётся `minOrder`. Плашка и кнопка исправляются сами, потому что ничего не считают.

      Что при этом всё равно проверяет сервер (сумму, цены, наличие), разберём в уроке «Контракт API глазами
      фронтенда».

      ## Как понять, что граница проведена неудачно

      Неудачную границу видно не по схеме, а по тому, как идут изменения. Вот признаки:

      - **Одно изменение требований — правки во многих модулях.** Как с минимальной суммой в начале урока: знание
        размазано, и при каждом изменении что-то забывают.
      - **Модуль лезет во внутренности соседа.** Например, оформление импортирует внутренний файл корзины, чтобы
        достать оттуда итог. Теперь корзину нельзя переписать, не сломав оформление.
      - **Компонент делает всё сразу:** загружает данные, считает правила и рисует. Такой компонент нельзя
        переиспользовать, а правило в нём нельзя проверить, не отрисовав экран.
      - **Модули импортируют друг друга по кругу:** корзина — оформление, оформление — корзину. Значит, между ними нет
        ясного разделения, кто кому служит.
      - **Растёт папка «общее».** Файлы `utils`, `helpers`, `common`, куда складывают всё, что непонятно куда положить.
        Часто там лежат бизнес-правила, у которых нет хозяина.

      ## Когда модулей слишком много

      Бывает и обратная ошибка — **избыточная раздробленность**. Команда так увлекается разделением, что заводит
      модуль на каждый компонент: `cart-item`, `cart-total`, `cart-badge`, `cart-empty-state`. У каждого свой публичный
      интерфейс, свои типы и свои тесты.

      Цена такая: правило «минимальная сумма» снова оказывается в нескольких местах — теперь уже в разных модулях.
      Простое изменение требует правок в пяти папках, новичок неделю разбирается, где что лежит, а половина кода
      модулей — это передача данных от одного к другому.

      Как выбрать размер модуля:

      - **Модуль — это то, что меняется вместе.** Если два куска кода всегда правятся одновременно, им место в одном
        модуле. Если они меняются по разным причинам и в разное время — их можно разделить.
      - **Начинать крупнее и делить, когда модуль вырос.** Объединить пять модулей обратно в один дороже, чем разделить
        один, когда это действительно понадобилось.
      - **Модуль понятен по названию.** «Корзина» — понятно. «Корзина-итог-без-скидки» — признак, что ответственность
        нарезали слишком мелко.

      ## Варианты организации и их цена

      - **По экранам**
        - Как выглядит: каждая страница — компонент, который делает всё.
        - Когда подходит: прототип на неделю.
        - Цена: правила дублируются, изменения расползаются.
      - **По техническим типам**
        - Как выглядит: папки `components`, `hooks`, `api`, `utils` на весь проект.
        - Когда подходит: маленький проект, один-два разработчика.
        - Цена: с ростом каждая папка превращается в свалку, одна функция продукта разбросана по всем.
      - **По ответственности, слои внутри**
        - Как выглядит: модули «Корзина», «Меню», «Оплата»; внутри каждого — отображение, правила, данные.
        - Когда подходит: проект, который будет расти, несколько разработчиков.
        - Цена: нужно договориться о границах и следить за ними.
      - **Слишком мелко**
        - Как выглядит: модуль на каждый компонент.
        - Когда подходит: почти никогда.
        - Цена: много передачи данных, одна ответственность размазана по модулям.

      ## Типичные ошибки

      - **Делить по названиям компонентов.** «У нас есть `Header`, `Sidebar` и `ProductCard` — вот и модули». Компоненты
        — это отображение; ответственность за правила и данные при таком делении остаётся ничьей.
      - **Класть бизнес-правила в компоненты.** Правило в обработчике кнопки придётся повторить в каждом месте, где оно
        нужно, — и однажды копии разойдутся.
      - **Считать слой обязательной папкой.** Модуль из двух файлов не обязан иметь четыре подпапки. Важно разделение
        обязанностей, а не число каталогов.
      - **Дробить без нужды.** Модуль на каждую мелочь замедляет работу сильнее, чем один большой модуль.
      - **Полагаться только на клиентскую проверку правил.** Почему окончательно решает сервер, разобрано в уроке
        «Контракт API глазами фронтенда».

      ## Как спрашивают на интервью

      - «Из каких частей вы бы собрали клиентское приложение такого-то продукта? Что за что отвечает?»
      - «Где в вашей схеме живёт правило X?» — например, «где проверяется, что в корзине блюда одного ресторана».
      - «Покажите, что изменится в коде, если поменяется правило Y», — проверка, что знание лежит в одном месте.

      ## Источники

      - [Presentation Domain Data Layering — Martin Fowler](https://martinfowler.com/bliki/PresentationDomainDataLayering.html)
      - [Feature-Sliced Design: обзор — слои, слайсы и сегменты](https://feature-sliced.design/ru/docs/get-started/overview)
      - [Service Layer — каталог шаблонов Martin Fowler](https://martinfowler.com/eaaCatalog/serviceLayer.html)

  - id: sdb-contracts
    topic: Декомпозиция системы
    subtopic: Зависимости и контракты
    title: Зависимости и публичный интерфейс модуля
    body: |
      ## Какую проблему решаем

      В уроке «Как делить систему на части» мы разделили приложение покупателя на подсистемы: каталог, меню, корзину,
      оформление и оплату, отслеживание. Теперь посмотрим, как эти части связаны между собой и с внешним миром.

      Оплату в сервисе доставки проводит внешний платёжный провайдер. Он даёт свой SDK (software development kit,
      набор готового кода для подключения сервиса) — библиотеку, которая показывает форму карты и проводит платёж.
      В первой версии вызовы SDK написали прямо там, где они понадобились: на странице оформления, в профиле, где
      человек сохраняет карту, и в окне чаевых курьеру. Коды ошибок SDK вроде `card_declined` разбирают прямо
      в компонентах, чтобы показать понятный текст.

      Через полгода происходят две вещи. Провайдер выпускает новую версию SDK: методы переименованы, коды ошибок
      другие. А бизнес договаривается с другим провайдером, у которого комиссия ниже. В обоих случаях правки нужны
      во всех местах, где упоминается SDK, — а их уже семь. Вдобавок сценарий оформления заказа невозможно проверить
      автотестом: он не работает без настоящего SDK и сети.

      Код страдает не от плохих компонентов, а от того, как направлены связи между частями. Об этом урок.

      ## Зависимость и связанность

      **Зависимость** (dependency) — модуль A зависит от модуля B, если A не может работать без B и ломается, когда
      B меняется. В коде зависимость обычно выглядит как импорт: `import { charge } from 'payment-sdk'`. На схемах её
      рисуют стрелкой от A к B: «A знает о B».

      **Связанность** (coupling) — насколько модули знают друг о друге. Чем больше один модуль знает о другом — имена
      функций, форматы данных, коды ошибок, порядок вызовов, — тем сильнее связанность и тем дальше расходятся
      изменения. Полностью убрать зависимости нельзя: модули для того и существуют, чтобы работать вместе. Задача —
      выбрать, кто от кого зависит и что именно ему нужно знать.

      ## Правило направления: детали зависят от правил

      Части системы меняются с разной частотой и по разным причинам.

      - **Правила и сценарии** — «в корзине блюда одного ресторана», «оформить заказ: проверить сумму, создать заказ,
        оплатить» — это суть продукта. Они меняются, когда меняется бизнес.
      - **Детали** — конкретный платёжный SDK, библиотека запросов, хранилище браузера, сервис аналитики — меняются
        по внешним причинам: вышла новая версия, сменился поставщик, браузер ограничил хранилище.

      Отсюда правило: **детали зависят от правил, а не наоборот**. Стрелки зависимостей должны указывать на то, что
      меняется реже и важнее для продукта. Тогда смена SDK затронет одну деталь, а сценарий оформления заказа
      останется прежним.

      Мартин Фаулер, описывая слои отображения, предметной логики и данных, приводит именно такой вариант: между
      предметной логикой и источниками данных ставят посредника, чтобы предметная логика не зависела от источников
      данных. Он отмечает, что такую схему часто называют гексагональной архитектурой — о ней дальше.

      ## Порты и адаптеры

      Как сценарий может вызвать оплату и при этом не зависеть от SDK? Ответ — **порты и адаптеры** (ports and
      adapters). Этот приём описал Алистер Кокберн в статье «Гексагональная архитектура» (Hexagonal Architecture);
      оба названия означают одно и то же. Шестиугольник на его схемах ничего не значит — Кокберн прямо пишет, что
      число шесть неважно.

      **Порт** (port) — интерфейс, который описывает разговор приложения с внешним миром, причём в словах самого
      приложения. Порт оплаты говорит: «оплати заказ на такую сумму и скажи, получилось ли». Он ничего не знает
      о методах и кодах ошибок конкретного SDK.

      **Адаптер** (adapter) — код, который подключает конкретную технологию к порту. Адаптер для провайдера A
      переводит вызов порта в вызовы его SDK, а ответы SDK — обратно в результаты, понятные приложению. Для другого
      провайдера пишут другой адаптер к тому же порту.

      Слово «порт» Кокберн выбрал, чтобы оно напоминало порты компьютера: к порту можно подключить любое устройство,
      которое соблюдает его протокол. Аналогия ломается в одном месте: стандарт порта компьютера задаёт внешний
      комитет, а программный порт описывает само приложение — под свои нужды и своими словами, а адаптеры
      подстраиваются под него.

      Кокберн различает две стороны. **Ведущие** (primary, driving) адаптеры запускают приложение: интерфейс
      пользователя, автотест. **Ведомые** (secondary, driven) — те, кого приложение вызывает само: платёжный
      провайдер, сервер, хранилище. Платёжный SDK — ведомая сторона.

      ## Пример целиком: адаптер платёжного SDK

      Сначала порт. Он лежит в модуле оформления заказа и описывает, что оформлению нужно от оплаты:

      ```ts
      // Модуль «Оформление»: порт оплаты — в словах приложения, без упоминания SDK
      export type PaymentResult =
        | { status: 'paid' }
        | { status: 'declined'; reason: 'no-money' | 'card-rejected' | 'other' }
        | { status: 'cancelled' }; // человек закрыл форму оплаты

      export interface PaymentGateway {
        pay(orderId: string, amount: number): Promise<PaymentResult>;
      }
      ```

      Сценарий оформления получает порт параметром и пользуется только им:

      ```ts
      // Модуль «Оформление»: сценарий
      const messages = {
        'no-money': 'На карте недостаточно денег',
        'card-rejected': 'Банк отклонил оплату',
        other: 'Оплата не прошла, попробуйте ещё раз',
      };

      export async function placeOrder(cart: Cart, orders: OrdersApi, payment: PaymentGateway) {
        // Упрощено: защита от повтора и исход «ответ не пришёл» — в уроке «Процесс как набор состояний»
        const order = await orders.create(cart.id); // заказ и сумму к оплате создаёт сервер
        const result = await payment.pay(order.id, order.amount);
        if (result.status === 'declined') return { ok: false, message: messages[result.reason] };
        if (result.status === 'cancelled') return { ok: false, message: null };
        return { ok: true, orderId: order.id };
      }
      ```

      Адаптер — единственное место, где упоминается SDK. Он импортирует тип порта из модуля оформления и переводит
      ответы SDK на язык приложения:

      ```ts
      // Модуль «Адаптеры оплаты»: провайдер A
      import { AcmePay } from 'acme-pay-sdk';
      import type { PaymentGateway } from '@/checkout';

      export function createAcmeGateway(sdk: AcmePay): PaymentGateway {
        return {
          async pay(orderId, amount) {
            const r = await sdk.charge({ reference: orderId, sum: amount });
            if (r.code === 'success') return { status: 'paid' };
            if (r.code === 'user_closed') return { status: 'cancelled' };
            if (r.code === 'insufficient_funds') return { status: 'declined', reason: 'no-money' };
            if (r.code === 'card_declined') return { status: 'declined', reason: 'card-rejected' };
            return { status: 'declined', reason: 'other' };
          },
        };
      }
      ```

      Наконец, в точке сборки приложения — там, где оно запускается, — выбирают конкретный адаптер и передают его
      сценарию. Так же, параметром, сценарий получает и доступ к API заказов.

      У этих двух шагов есть канонические имена. Передачу готовой зависимости снаружи, вместо того чтобы модуль сам
      её создавал или импортировал, называют **внедрением зависимостей** (dependency injection, DI). Место, где все
      адаптеры создают и связывают со сценариями, называют **корнем композиции** (composition root). Во фронтенде
      это обычно файл запуска приложения или провайдер контекста React на самом верху дерева.

      ```ts
      // Точка сборки: единственное место, где решают, какой провайдер работает
      const payment = createAcmeGateway(new AcmePay({ publicKey: PAYMENT_PUBLIC_KEY }));
      // … дальше payment передают туда, где вызывают placeOrder(cart, ordersApi, payment)
      ```

      ![Схема: сценарий оформления вызывает порт оплаты; адаптер провайдера A реализует порт и вызывает SDK; стрелка зависимости идёт от адаптера к порту, то есть против направления вызова; рядом тестовый адаптер реализует тот же порт](images/sdb-adapter.png "Вызов идёт от сценария к SDK, а зависимость — от адаптера к сценарию")

      Посмотрите на стрелки. **Вызов** идёт от сценария через порт к адаптеру и дальше к SDK. А **зависимость** —
      в обратную сторону: адаптер импортирует порт из модуля оформления, а модуль оформления не импортирует ничего
      платёжного. Этот поворот зависимости против направления вызова и есть суть приёма.

      Правило, которое здесь работает, известно как **принцип инверсии зависимостей** (Dependency Inversion Principle,
      буква D в наборе принципов SOLID): модули с правилами не зависят от модулей с деталями, и те и другие зависят
      от абстракции — в нашем случае от порта. «Инверсия» — именно этот разворот: без порта сценарий импортировал бы
      SDK, а с портом адаптер SDK подстраивается под сценарий.

      Что это даёт:

      - **Смена провайдера** — новый адаптер `createBetaGateway` и одна строка в точке сборки. Сценарий, страницы
        и тексты ошибок не меняются.
      - **Новая версия SDK** — правки в одном файле адаптера.
      - **Тесты без сети.** Кокберн называет это одной из целей приёма: приложение должно разрабатываться и проверяться
        отдельно от настоящих внешних устройств и баз данных. В тесте сценарию передают поддельный адаптер — несколько строк кода:

      ```ts
      const declined: PaymentGateway = {
        pay: async () => ({ status: 'declined', reason: 'no-money' }),
      };
      ```

      ## Публичный интерфейс модуля

      Порт — частный случай более общей идеи. У каждого модуля есть **публичный интерфейс** (public API) — то, что
      модуль открыто предлагает остальным: функции, компоненты, типы, события. Всё остальное — **внутреннее
      устройство** модуля, и снаружи к нему не обращаются.

      Документация Feature-Sliced Design называет публичный интерфейс контрактом между модулем и кодом, который им
      пользуется, и выделяет два свойства хорошего интерфейса:

      - **он защищает соседей от внутренних перестроек:** модуль можно переписать изнутри, и никто снаружи этого
        не заметит;
      - **он открывает только необходимое:** чем меньше модуль показывает, тем меньше у него обещаний, которые нельзя
        нарушить.

      На практике публичный интерфейс — это один входной файл модуля (обычно `index.ts`), который явно перечисляет,
      что экспортируется. Для корзины это может выглядеть так:

      ```ts
      // cart/index.ts — всё, что корзина обещает соседям
      export { CartSummary } from './ui/CartSummary';
      export { addDish, clearCart } from './model/actions';
      export { missingToMinimum } from './model/rules';
      export type { Cart, CartItem } from './model/types';
      ```

      Где и как корзина хранит данные — в браузере или на сервере, — как устроены её внутренние функции, не обещано никому.
      Импорт в обход входного файла (`import … from '@/cart/model/storage'`) — это и есть «залезть во внутренности
      соседа». Технически ему ничто не мешает, поэтому такие импорты обычно запрещают правилом линтера.

      **Точки интеграции** (integration points) — места, где модуль соприкасается с чем-то за своими пределами:
      сервер, платёжный SDK, хранилище браузера, аналитика, соседние модули. Их полезно выписать для каждого модуля:
      каждая точка интеграции — кандидат на порт или хотя бы на явный публичный интерфейс.

      ## Стабильный контракт и деталь реализации

      **Контракт** — обещание, на которое полагаются другие: сигнатуры функций, форматы данных, смысл полей и событий.
      **Деталь реализации** — всё, что можно поменять, не нарушив обещания. Цена изменения у них разная:

      - **Меняют внутренности модуля**
        - Кого затронет: никого.
        - Цена: низкая.
      - **Добавляют необязательный параметр или новое поле**
        - Кого затронет: никого, старый код продолжает работать.
        - Цена: низкая.
      - **Переименовывают или удаляют экспортируемую функцию**
        - Кого затронет: всех, кто её вызывает; компилятор покажет места.
        - Цена: средняя.
      - **Меняют смысл без изменения формы: сумма была в рублях, стала в копейках**
        - Кого затронет: всех, и компилятор промолчит.
        - Цена: высокая.

      Последний пункт самый опасный: код компилируется, тесты модуля зелёные, а на экране заказ на 50 000 ₽ вместо
      500 ₽. Поэтому смысл значения — такая же часть контракта, как его тип.

      Как менять контракт без поломок: добавить новое рядом со старым (новое поле, новую функцию), перевести
      потребителей и только потом удалить старое. Документация FSD добавляет: если поведение модуля меняется так,
      что ломает ожидания, это изменение должно быть видно в его публичном интерфейсе.

      ## Варианты и их цена

      - **Вызывать SDK прямо там, где нужно**
        - Когда подходит: одно место использования, прототип, стабильный стандартный API браузера.
        - Цена: смена SDK или его версии — правки везде; тесты требуют настоящего SDK.
      - **Обёртка, повторяющая методы SDK один в один**
        - Когда подходит: почти никогда.
        - Цена: иллюзия защиты — типы и коды ошибок SDK всё равно расходятся по приложению, а при смене провайдера
          меняются и обёртка, и её потребители.
      - **Порт в словах приложения и адаптер**
        - Когда подходит: деталь может смениться, её нужно подменять в тестах или её язык чужой для продукта.
        - Цена: дополнительный слой кода; порт нужно продумать.

      Порт с адаптером — не обязательный ритуал для каждой библиотеки. Прятать за адаптер стандартный `Intl.DateTimeFormat`
      или функцию сортировки бессмысленно: они не сменятся и не мешают тестам. Адаптер окупается там, где есть
      реальная причина: поставщик может смениться, деталь мешает тестам или её словарь чужой для продукта.

      ## Типичные ошибки

      - **Порт по образцу SDK.** Методы `chargeCardV3` и коды `card_declined` в порту — это та же зависимость
        от провайдера, только с лишним слоем. Порт описывают словами приложения.
      - **Сценарий импортирует адаптер.** Тогда стрелка зависимости снова смотрит на деталь. Сценарий знает только
        порт; конкретный адаптер ему передают снаружи.
      - **Экспорт всего подряд.** Строка `export * from './model'` во входном файле открывает соседям всё внутреннее
        устройство, и через полгода любое изменение кого-то ломает.
      - **Импорты в обход публичного интерфейса.** Удобно сегодня, дорого при первом рефакторинге.
      - **Тихая смена смысла.** Поле с тем же именем и типом, но с другим значением ломает потребителей незаметно.
      - **Адаптер для всего.** Слой ради слоя добавляет код, который надо поддерживать, и ничего не даёт взамен.

      ## Как спрашивают на интервью

      - «Как вы встроите сторонний платёжный (картографический, аналитический) SDK так, чтобы его можно было
        заменить?»
      - «Что входит в публичный интерфейс вашего модуля и что изменится, если поменять его внутреннее устройство?»
      - «Как вы будете тестировать сценарий, который зависит от внешнего сервиса?»
      - «Что такое инверсия зависимостей и чем она отличается от внедрения зависимостей?» Коротко: инверсия —
        правило о направлении стрелок (правила не зависят от деталей), внедрение — способ его выполнить (деталь
        передают снаружи).

      ## Источники

      - [Hexagonal Architecture — Alistair Cockburn](https://alistair.cockburn.us/hexagonal-architecture/)
      - [Feature-Sliced Design: публичный API](https://feature-sliced.design/ru/docs/reference/public-api)

  - id: sdb-component
    topic: Декомпозиция системы
    subtopic: Компонент как контракт
    title: Компонент как контракт
    body: |
      ## Какую проблему решаем

      В сервисе доставки есть поле выбора адреса: человек начинает вводить улицу, под полем появляются подсказки,
      он выбирает нужную. Поле нужно в трёх местах: на главной странице (чтобы показать рестораны, которые сюда
      доставляют), при оформлении заказа и в профиле, где хранятся адреса. Его сделали один раз и переиспользуют.

      Через полгода с этим полем случаются три истории.

      Первая. Разработчик главной страницы хочет, чтобы событие выбора отдавало не строку адреса, а объект с координатами.
      Он меняет тип аргумента в `onSelect` — и оформление заказа и профиль ломаются: они ждали строку.

      Вторая. Каждой странице нужно что-то своё, и в компонент добавляют пропсы-флаги: `showMap`, `compact`,
      `withHistory`, `hideLabel`, `isCheckout`, `showDistance`… Их уже пятнадцать, и никто не знает, какие сочетания
      работают.

      Третья. Подсказки выбираются только мышью. Человек, который пользуется клавиатурой или программой экранного
      доступа, не может выбрать адрес — значит, не может заказать еду. Чтобы это исправить, приходится менять разметку
      и добавлять обязательную подпись, а это снова затрагивает все три страницы.

      Все три истории — об одном: переиспользуемый компонент — это модуль с публичным интерфейсом, как модули
      из урока «Зависимости и публичный интерфейс модуля». У него есть контракт, у контракта есть цена изменения,
      и проектировать его стоит заранее.

      ## Пропсы и события — публичный интерфейс

      **Пропсы** (props) — входные данные компонента: что показать и как себя вести. **События** — то, что компонент
      сообщает наружу; в React это функции-пропсы с именами вроде `onChange` или `onClose`, которые компонент вызывает,
      когда что-то произошло.

      Вместе они образуют **контракт компонента** — обещание тем, кто его использует. Но в контракт входит больше,
      чем видно в типе пропсов:

      - **смысл значений:** в каких единицах число, что означает `null`;
      - **момент событий:** `onChange` вызывается на каждую букву или только при выборе подсказки;
      - **поведение:** что происходит при нажатии клавиш, куда уходит фокус, что слышит человек с экранным чтецом;
      - **значения по умолчанию:** что будет, если проп не передан.

      Изменить любую из этих вещей — значит изменить контракт. А всё, что в контракт не входит, — внутреннее
      состояние, библиотеки, которыми компонент пользуется внутри, разбиение на файлы — можно менять свободно:
      потребители этого не заметят. Вот что ломает потребителей, а что нет:

      - **Добавить необязательный проп с прежним поведением по умолчанию** — не сломает.
      - **Переименовать или удалить проп** — сломает; компилятор покажет места.
      - **Изменить тип аргумента события** — сломает; компилятор покажет места.
      - **Вызывать `onChange` на каждую букву, а не при выборе** — сломает, и компилятор промолчит.
      - **Поменять значение по умолчанию** — сломает у всех, кто этот проп не передавал.
      - **Сделать необязательный проп обязательным** — сломает у всех, кто его не передавал.

      В библиотеке компонентов, которой пользуются несколько команд, ломающие изменения выпускают отдельной
      мажорной версией и заранее описывают, как перейти. Внутри одного приложения действует то же правило, что и для
      любого модуля: новое добавляют рядом со старым, переводят потребителей и только потом удаляют старое.

      ## Кто владеет состоянием: управляемый и неуправляемый компонент

      У поля адреса есть состояние — выбранный адрес. Вопрос в том, кто им владеет.

      **Неуправляемый компонент** (uncontrolled) хранит состояние сам. Родитель может задать начальное значение
      и узнать о выборе из события, но изменить выбор снаружи не может. Так работает обычный `<input defaultValue="…">`:
      дальше поле живёт своей жизнью.

      **Управляемый компонент** (controlled) получает текущее значение пропсом и сообщает о желаемом изменении
      событием, а само значение хранит родитель. Так работает `<input value={address} onChange={…}>`: поле показывает
      ровно то, что передал родитель.

      Документация React так описывает выбор: неуправляемые компоненты проще использовать, потому что им нужно меньше
      настроек, но их труднее согласовывать с другими частями; управляемые максимально гибкие, но требуют, чтобы
      родитель полностью настроил их пропсами.

      - **Неуправляемый**
        - Кто хранит значение: сам компонент.
        - Что передаёт родитель: начальное значение `defaultValue`.
        - Изменить значение снаружи: нельзя.
        - Когда подходит: значение нужно только узнать — при выборе или при отправке формы.
        - Цена: родитель не может вмешаться.
      - **Управляемый**
        - Кто хранит значение: родитель.
        - Что передаёт родитель: текущее значение `value` и обработчик `onChange`.
        - Изменить значение снаружи: можно в любой момент.
        - Когда подходит: значение нужно сбросить, подставить после загрузки, проверить или связать с другими полями.
        - Цена: родитель обязан хранить состояние и передавать его.

      Для поля адреса при оформлении заказа нужен управляемый режим: адрес подставляется из профиля после загрузки,
      а при смене способа получения на «самовывоз» поле сбрасывается. В профиле достаточно неуправляемого: форма
      узнаёт адрес, когда человек нажал «Сохранить».

      Поэтому хорошие переиспользуемые компоненты часто поддерживают **оба режима**: передан `value` — компонент
      управляемый, не передан — хранит значение сам, начиная с `defaultValue`. Так устроены и стандартные поля ввода.

      Два правила, которые часто нарушают:

      - **Режим не меняют на ходу.** React прямо предупреждает: поле ввода не может переключаться между управляемым
        и неуправляемым режимом за время жизни. Если `value` то есть, то `undefined`, компонент ведёт себя
        непредсказуемо.
      - **Проп не копируют в собственное состояние.** Код `const [address, setAddress] = useState(props.value)`
        выглядит как управляемый режим, но им не является: состояние берёт значение только при первом рендере,
        и когда родитель потом передаст новый адрес, компонент его проигнорирует. Подробнее — в разделе
        [Don’t mirror props in state](https://ru.react.dev/learn/choosing-the-state-structure#don-t-mirror-props-in-state)
        («Не копируйте пропсы в состояние», страница пока на английском) документации React.

      Про то, как вообще выбирать владельца данных в приложении, — отдельный урок «Кто главный по данным».

      ## Композиция вместо пятнадцати флагов

      Вернёмся к пятнадцати флагам. Каждый логический флаг удваивает число возможных сочетаний: у шести флагов их 64,
      у десяти — больше тысячи. Проверить все никто не может, поэтому часть сочетаний просто не работает. А каждая новая
      страница приносит ещё один флаг и правку внутри общего компонента — то есть риск сломать остальные страницы.

      **Композиция** (composition) — приём, при котором компонент не перечисляет все варианты содержимого, а оставляет
      для него место, и потребитель сам вставляет туда свои элементы. В React для этого есть проп `children` —
      содержимое между открывающим и закрывающим тегом — и именованные места-**слоты** (slots): пропсы вроде `footer`
      или `renderSuggestion`, в которые передают элементы или функцию отрисовки.

      Посмотрим на модальное окно корзины. Вариант с флагами:

      ```tsx
      <CartDialog
        showPromo
        showTips={false}
        footerVariant="checkout"
        hideClose={false}
        isMobileFullscreen
      />
      ```

      Вариант с композицией: общий компонент окна отвечает за то, что одинаково везде — заголовок, затемнение фона,
      закрытие, фокус и клавиатуру, — а содержимое собирает страница:

      ```tsx
      <Dialog title="Корзина" open={isCartOpen} onClose={closeCart}
        footer={<Button onClick={goToCheckout}>Оформить за 1 380 ₽</Button>}>
        <CartItems />
        <PromoCodeField />
      </Dialog>
      ```

      Нужна страница без промокода — она просто его не вставляет. Нужно окно подтверждения удаления — это тот же
      `Dialog` с другим содержимым, без новых флагов и без правок общего кода.

      Флаги при этом не запрещены. Несколько независимых визуальных вариантов — размер `size="s" | "m" | "l"`,
      состояние `disabled` — удобнее пропсами. Тревожный признак другой: флаги, которые описывают не вариант
      компонента, а конкретное место использования (`isCheckout`, `forProfilePage`), и флаги, которые имеют смысл
      только в сочетании с другими (`checkboxText` без `withCheckbox`).

      - **Флаги**
        - Новый вариант содержимого: новый флаг и правка общего компонента.
        - Сочетания: удваиваются с каждым флагом, многие не проверены.
        - Единообразие: внешний вид держит сам компонент.
        - Когда подходит: несколько независимых визуальных вариантов.
      - **Композиция**
        - Новый вариант содержимого: потребитель вставляет своё, общий код не меняется.
        - Сочетания: не растут.
        - Единообразие: потребитель может собрать что-то непохожее.
        - Когда подходит: разное содержимое в одинаковой «рамке».

      ## Клавиатура, фокус и роли — тоже контракт

      Сначала три понятия.

      - **Фокус** (focus) — элемент, который сейчас получает ввод с клавиатуры. Клавиша Tab переводит фокус
        к следующему элементу.
      - **Экранный чтец** (screen reader) — программа, которая озвучивает интерфейс для людей с нарушениями зрения.
        Ей нужно знать, что за элемент перед ней: кнопка, список, диалог.
      - **Роль** (role) — то, чем элемент является для экранного чтеца. У стандартных элементов роль есть сразу
        (`<button>` — кнопка), а самодельным виджетам её задают атрибутами WAI-ARIA — стандарта W3C, который описывает
        роли и состояния для доступности.

      Для типовых виджетов W3C выпускает руководство **WAI-ARIA Authoring Practices** (APG) — оно описывает,
      как должен вести себя каждый виджет. Для модального окна, например:

      - при открытии фокус переходит внутрь окна, обычно на первый элемент, который может его получить;
      - Tab и Shift+Tab перемещают фокус по кругу внутри окна и не уходят на страницу под ним;
      - Escape закрывает окно;
      - при закрытии фокус возвращается на элемент, который открыл окно, — например, на кнопку «Корзина»;
      - у контейнера роль `dialog`, атрибут `aria-modal="true"` и ссылка `aria-labelledby` на видимый заголовок.

      Многое из этого браузер уже умеет сам. Встроенный элемент `<dialog>`, открытый методом `showModal()`, переносит
      фокус на первый доступный элемент внутри, закрывается по Escape, делает страницу под окном недоступной
      и сообщает экранному чтецу, что окно модальное. Поэтому общий компонент окна разумно строить на нём, а не
      писать всё вручную. Подпись окна и возврат фокуса на кнопку, которая его открыла, всё равно нужно проверить
      самим. Подробнее — в разделе [Accessibility](https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/dialog#accessibility)
      статьи MDN о `<dialog>` (на английском: русский перевод этой статьи устарел и о поведении окна не рассказывает).

      Для поля с подсказками — в APG оно называется **комбобокс** (combobox, поле ввода со всплывающим списком) —
      правила такие: стрелка вниз переводит выделение в список подсказок, Enter выбирает выделенную подсказку,
      Escape закрывает список. Фокус при этом остаётся в поле ввода, а экранному чтецу сообщают, какая подсказка
      выделена.

      Почему это часть контракта, а не доработка «потом»? Потому что добавить доступность позже — почти всегда значит
      изменить контракт. Окну нужна подпись — значит, проп `title` становится обязательным. Чтобы вернуть фокус, окно
      должно знать, кто его открыл. Полю адреса нужна видимая подпись `label`. Каждое такое изменение затрагивает всех
      потребителей, а до этого компонент месяцами не давал части людей сделать заказ. Если же поведение заложено
      в общий компонент с первой версии, каждая страница получает его бесплатно и не может случайно сломать.

      Подробно доступность разбирается в курсе 3, в теме «Сквозные требования». Здесь важно запомнить: поведение
      клавиатуры, фокуса и роли проектируют вместе с пропсами.

      ## Пример целиком: контракт поля адреса

      Соберём всё вместе. Вот контракт поля выбора адреса:

      ```ts
      type Address = { id: string; text: string; lat: number; lon: number };

      type AddressPickerProps = {
        label: string;                     // обязательный: видимая подпись и имя поля для экранного чтеца
        value?: Address | null;            // передан — управляемый режим
        defaultValue?: Address | null;     // не передан value — компонент хранит выбор сам
        onChange?: (address: Address | null) => void; // только при выборе подсказки или очистке, не на каждую букву
        loadSuggestions: (query: string) => Promise<Address[]>; // откуда брать подсказки, решает потребитель
        renderSuggestion?: (address: Address) => ReactNode;     // слот вместо флагов вроде showDistance
        disabled?: boolean;
      };
      ```

      И часть контракта, которую не видно в типе:

      - поле ведёт себя как комбобокс по APG: стрелки, Enter, Escape, фокус остаётся в поле;
      - пока человек печатает, `onChange` не вызывается; значение меняется только при выборе подсказки;
      - если подсказки не загрузились, поле остаётся доступным для ввода и показывает сообщение под собой.

      Обратите внимание на `loadSuggestions`. Компонент не знает, к какому сервису геокодирования (переводу адреса
      в координаты) обращаться, — эту функцию ему передают. Это та же идея, что порт из прошлого урока: компонент
      описывает, что ему нужно, а конкретный поставщик подключается снаружи.

      Как поле используют на трёх страницах:

      - **Оформление заказа:** управляемый режим. Страница передаёт `value` из профиля, когда он загрузился,
        и сбрасывает его в `null` при выборе самовывоза.
      - **Профиль:** неуправляемый режим с `defaultValue`; форма узнаёт адрес из `onChange`.
      - **Главная:** неуправляемый режим и свой `renderSuggestion`, который показывает рядом с адресом число ресторанов.

      Ни одной странице не понадобился флаг, и ни одна не может сломать клавиатуру.

      ## Типичные ошибки

      - **Менять контракт как внутренний код.** Переименовать событие или поменять момент его вызова «потому что
        так удобнее моей странице» — значит сломать остальных.
      - **Копировать проп в состояние** и считать компонент управляемым.
      - **Флаг под каждую страницу.** Через год компонент с двадцатью флагами боятся трогать.
      - **Отложить клавиатуру и роли.** Потом исправление потребует ломающих изменений, а до тех пор часть людей
        не может пользоваться продуктом.
      - **Встроить в переиспользуемый компонент конкретный API.** Поле адреса, которое само ходит к одному сервису
        геокодирования, нельзя использовать там, где нужен другой.

      ## Как спрашивают на интервью

      - «Спроектируйте API компонента автодополнения (выбора даты, модального окна): какие пропсы и события, что
        внутри, что снаружи?»
      - «Ваш компонент должен быть управляемым или неуправляемым? Почему?»
      - «Как этим компонентом будет пользоваться человек без мыши?»

      ## Источники

      - [Sharing State Between Components: управляемые и неуправляемые компоненты — документация React (страница пока на английском)](https://ru.react.dev/learn/sharing-state-between-components#controlled-and-uncontrolled-components)
      - [Dialog (Modal) Pattern — WAI-ARIA Authoring Practices Guide](https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/)
      - [Combobox Pattern — WAI-ARIA Authoring Practices Guide](https://www.w3.org/WAI/ARIA/apg/patterns/combobox/)

  - id: sdb-dataflow
    topic: Декомпозиция системы
    subtopic: Карта потоков данных
    title: Куда текут данные
    body: |
      ## Какую проблему решаем

      Покупатель открыл меню ресторана и нажал «+» у блюда «Том ям» за 450 ₽. Что должно произойти? На первый взгляд —
      одно: блюдо попало в корзину. На деле от этого нажатия зависят сразу несколько мест на экране и за его пределами:

      - счётчик на значке корзины в шапке сайта: был 2, стал 3;
      - итог корзины: был 900 ₽, стал 1350 ₽;
      - кнопка «Оформить заказ»: у ресторана минимальная сумма 1000 ₽, и кнопка из серой стала активной;
      - сервер: корзину вошедшего покупателя нужно сохранить, чтобы она была видна и на других его устройствах;
      - сервер может и возразить: блюдо только что закончилось.

      Если об этом не подумать заранее, каждый разработчик решит свою часть по-своему. Шапка заведёт собственный счётчик
      и будет прибавлять единицу по сигналу «блюдо добавлено». Итог посчитается в другом месте. Кнопку оформления
      включит отдельная проверка. Через месяц появятся жалобы: в шапке написано «3», а в корзине два блюда; кнопка
      активна, хотя сумма меньше минимальной; после обновления страницы одно блюдо исчезло.

      Ошибка здесь не в отдельной строчке кода. Никто не нарисовал, **куда текут данные**: откуда начинается изменение,
      через кого оно проходит и кто должен его увидеть. Этому и посвящён урок.

      ## Понятия

      **Поток данных** (data flow) — путь, который проходит одно изменение: от события, которое его запустило, через
      место, где хранятся данные, ко всем, кто эти данные показывает или от них зависит.

      **Инициатор** изменения — тот, кто его запускает. Это не всегда человек. Изменение может начать:

      - **пользователь** — нажал кнопку, ввёл текст, перешёл по ссылке;
      - **сервер** — прислал новый статус заказа или ответил «блюдо закончилось»;
      - **таймер** — например, опрос сервера раз в 30 секунд;
      - **внешняя система** — платёжный сервис подтвердил оплату;
      - **сам браузер** — пропала сеть, человек вернулся на вкладку.

      **Участники** потока — все, кому после изменения нужно обновиться: части экрана, сервер, хранилище в браузере,
      система аналитики.

      **Карта потоков данных** (data-flow map, или data-flow diagram) — схема, на которой для одного события нарисованы
      инициатор, место хранения данных, участники и стрелки между ними: что передаётся и в какую сторону. Как рисовать
      схемы разных видов, разбирается в следующем уроке «Как рисовать архитектуру». Здесь важна сама карта.

      **Побочный эффект** (side effect) — действие, которое выходит за пределы того, чтобы показать данные на экране:
      запрос к серверу, запись в хранилище браузера, отправка события в аналитику, изменение каких-то других данных.

      ## Однонаправленный поток данных

      Самое важное правило, которое делает поток понятным, называется **однонаправленный поток данных** (unidirectional
      data flow, или one-way data flow). Его удобно объяснять на React, хотя сама идея шире.

      В React данные идут сверху вниз: родительский компонент хранит состояние и передаёт его детям через пропсы.
      Документация React так и говорит в статье «Философия React»: «Поток данных в React однонаправленный».
      Пропсы ребёнок только читает: менять данные родителя сам он не должен. Если ему нужно что-то изменить, родитель
      передаёт ему функцию — обработчик, — и ребёнок вызывает её: «человек нажал "+" у блюда 17». Документация называет
      это **обратным потоком данных** (inverse data flow): вверх идёт не новое готовое состояние, а сообщение о том,
      что произошло. Решает, как поменять данные, тот, кто их хранит.

      Получается кольцо, по которому всё движется в одну сторону:

      1. событие поднимается вверх, к месту, где хранятся данные;
      2. данные меняются в одном этом месте;
      3. новые данные спускаются вниз ко всем, кто их показывает.

      То же правило работает и в масштабе всего приложения. Неважно, где живут данные корзины — в состоянии
      компонента, в общем хранилище или на сервере. Важно, что изменение идёт в одну сторону: событие → место хранения →
      все участники. Ни один участник не меняет другого напрямую.

      Почему это так помогает? Когда на экране неправильная цифра, у неё есть ровно одна дорога, по которой она могла
      прийти. Её можно пройти назад и найти ошибку. Если же участники меняют друг друга сами, дорог много, и узнать,
      кто испортил цифру, почти невозможно.

      ## Пример целиком: «добавить в корзину»

      Разберём нажатие «+» шаг за шагом. Пусть покупатель уже вошёл в аккаунт: тогда его корзина хранится на сервере
      и видна на всех его устройствах. У гостя корзина живёт на устройстве, и запроса к серверу на шаге 5 не будет;
      почему решено именно так, разбирается в уроке «Как сравнивать решения». Внутри приложения состав корзины
      хранится в одном месте — в модуле корзины из урока «Как делить систему на части».

      **Инициатор:** покупатель. **Событие:** «добавить блюдо 17 в количестве 1».

      1. Кнопка «+» в меню ничего не считает сама. Она сообщает модулю корзины: «добавить блюдо 17».
      2. Модуль корзины меняет состав: было две позиции, стало три.
      3. Из нового состава и цен меню вычисляются производные значения: число блюд для значка в шапке (3), итог (1350 ₽),
         доступность кнопки «Оформить» (1350 больше 1000 — кнопка активна). Их никто не хранит отдельно, поэтому они
         не могут разойтись с составом. Почему это важно, подробно — в уроке «Вычислять или хранить».
      4. Шапка, итог и кнопка получают новые значения и перерисовываются.
      5. Модуль корзины отправляет на сервер запрос «добавить блюдо 17». Это побочный эффект, и запускается он в ответ
         на действие человека, а не потому, что изменились данные.
      6. Сервер отвечает. Если всё в порядке, состав подтверждён. Если блюдо закончилось, сервер становится **вторым
         инициатором**: его ответ приходит в тот же модуль корзины, состав меняется, и шаги 3–4 повторяются сами
         собой — шапка, итог и кнопка снова пересчитаются.

      Что показывать человеку, пока ответ сервера ещё не пришёл, — отдельный вопрос. О нём урок «Чтение, запись
      и реакция интерфейса», а подробно — урок второго курса «Оптимистичные обновления».

      ![Схема потока «добавить в корзину»: кнопка «+» в меню отправляет событие в модуль корзины; корзина отправляет запрос на сервер и получает ответ; из корзины данные идут к счётчику в шапке, итогу и кнопке «Оформить»](images/sdb-dataflow.png "Поток данных при добавлении блюда в корзину")

      Ту же карту удобно записать списком участников. Он отвечает на вопрос «кому что нужно».

      - **Кнопка «+» в меню**
        - Что нужно: ничего, только сообщить о нажатии.
      - **Модуль корзины**
        - Что нужно: состав корзины.
        - Откуда: хранит сам и сверяет с сервером.
        - Когда обновляется: по событию «добавить» и по ответу сервера.
      - **Значок в шапке, итог, кнопка «Оформить»**
        - Что нужно: число блюд, сумма, хватает ли суммы до минимальной.
        - Откуда: вычисляют из состава, цен меню и минимальной суммы ресторана.
        - Когда обновляются: когда меняется состав.
      - **Сервер**
        - Что нужно: что добавили.
        - Откуда: запрос от модуля корзины.
        - Когда: по действию человека.

      Посмотрите, как изменилась картина из начала урока. У шапки больше нет своего счётчика, который может отстать.
      Ответ сервера не придумывает собственную дорогу к экрану, а идёт тем же путём, что и нажатие человека.

      ### Тот же поток с другим инициатором

      Полезно проверить карту на событии, которое начал не покупатель. Ресторан в своём кабинете отметил: «Том ям
      закончился». Покупатель в это время смотрит меню, и блюдо у него уже в корзине.

      Инициатор — ресторан, но до покупателя изменение дойдёт через сервер: при следующем опросе или по живому
      обновлению (о живых обновлениях — в курсе 3, в теме «Системы реального времени»). Кому нужно обновиться? Меню: блюдо стало недоступным. Корзине:
      в ней позиция, которую нельзя заказать. А из корзины, как и раньше, — итог, значок и кнопка «Оформить».

      Если бы карты не было, легко было бы обновить только меню и забыть про корзину. Покупатель нажал бы «Оформить»
      и получил отказ уже на оплате.

      ## Как составить карту потока

      Порядок действий для любого события:

      1. **Назовите инициатора и событие** одной фразой: «покупатель добавил блюдо», «сервер сообщил, что блюдо
         закончилось».
      2. **Найдите, где хранятся данные,** которые событие меняет. Место должно быть одно. Если их два, это повод
         насторожиться (подробно — в уроке «Кто главный по данным»).
      3. **Перечислите всех участников:** кто показывает эти данные или значения, вычисленные из них. Здесь помогает
         вопрос «что на экране станет неправдой, если это место не обновить?».
      4. **Нарисуйте стрелки** и подпишите, что по ним идёт: событие — к месту хранения, данные — к участникам,
         запрос — к серверу, ответ — обратно.
      5. **Отметьте побочные эффекты:** запросы, запись в хранилище браузера, аналитику. У каждого должна быть понятная
         причина запуска.
      6. **Проверьте карту на два дефекта:** стрелки «участник → участник» в обход места хранения и замкнутые
         круги. О них — дальше.

      ## Циклы

      **Цикл** в потоке данных (циклическая зависимость) — ситуация, когда изменение A вызывает изменение B, а изменение
      B снова меняет A. В лучшем случае экран мигает и уходят лишние запросы. В худшем приложение зависает
      в бесконечном круге обновлений.

      Пример из доставки. Ресторан даёт скидку 10% на заказ от 2000 ₽. Разработчик хранит итог корзины отдельно
      и написал два правила, каждое срабатывает при изменении данных:

      - «когда изменился состав — пересчитай итог»;
      - «когда изменился итог — если он от 2000 ₽, включи скидку, если меньше — выключи», а включённая скидка
        уменьшает итог.

      Покупатель собрал блюд на 2100 ₽. Правило включает скидку, итог становится 1890 ₽. Итог изменился и стал меньше
      2000 — правило выключает скидку, и итог снова 2100 ₽. Итог опять изменился и снова больше 2000 — скидка
      включается. И так по кругу: цифра на экране мигает, а приложение может зависнуть.

      Цикл появился потому, что правило смотрит на итог, который само же и меняет. Лечится это без хитрых проверок
      вроде «не меняй, если уже менял»:

      - скидка — **производное значение**: её не хранят, а вычисляют при показе из суммы блюд без скидки, и итог
        вычисляется из этих двух чисел;
      - всё, что должно измениться от действия человека, меняется **в обработчике этого действия** одной командой,
        а не цепочкой правил, которые будят друг друга.

      Документация React описывает ту же ловушку в разделе «Цепочки вычислений» статьи «Возможно, вам не нужен
      эффект»: эффекты, каждый из которых подправляет часть состояния по другой части, она советует заменить
      вычислением при отрисовке и изменением состояния в обработчике события.

      ## Скрытые побочные эффекты

      Побочный эффект становится **скрытым**, когда его запускает не действие, а изменение данных: «когда изменилась
      корзина — отправь её на сервер». Выглядит удобно: одно правило вместо вызова в каждом обработчике. Но корзина
      меняется не только когда человек нажимает «+». Она меняется, когда пришла с сервера при открытии страницы,
      когда сервер ответил «блюдо закончилось», когда корзину восстановили после перезагрузки.

      И вот что получается:

      - корзину, только что полученную с сервера, тут же отправляют на сервер обратно;
      - ответ сервера меняет корзину, это снова запускает отправку — и вот уже цикл между клиентом и сервером;
      - событие аналитики «блюдо добавлено» уходит каждый раз при открытии страницы, и отчёты врут.

      Правило из документации React звучит так: эффекты нужны «только для кода, который должен выполняться *потому
      что* компонент был показан пользователю». Запрос «добавить блюдо» нужен потому, что человек нажал кнопку, —
      значит, его место в обработчике нажатия. В разделе «Отправка POST-запроса» той же статьи разобран ровно такой
      случай.

      Есть и вторая разновидность скрытого эффекта: **участник меняет другого участника в обход места хранения**.
      Например, компонент выбора адреса из урока «Компонент как контракт» после изменения адреса сам вызывает
      пересчёт стоимости доставки у соседнего блока. Документация React предупреждает: когда дочерние компоненты
      обновляют состояние родителей из эффектов, поток данных становится очень сложно отследить. На карте такой
      эффект выглядит как стрелка «участник → участник» — именно её вы ищете на шестом шаге.

      ## Как доставить изменение до участников

      Однонаправленный поток можно устроить разными средствами. У каждого своя цена.

      - **Общий предок.** Данные хранит ближайший общий родитель участников и передаёт их пропсами.
        - Когда подходит: участники рядом в дереве компонентов.
        - Цена: если участники далеко, пропсы приходится протаскивать через много слоёв.
      - **Общее хранилище.** Данные лежат в одном хранилище (контекст, библиотека состояния), участники подписываются
        на нужную часть.
        - Когда подходит: участники в разных концах приложения — шапка, меню, страница корзины.
        - Цена: ещё один слой, от которого зависит всё приложение.
      - **Перезапросить у сервера.** После изменения участник заново загружает данные с сервера.
        - Когда подходит: данные меняются редко, и правильность важнее скорости.
        - Цена: задержка и лишние запросы при каждом изменении.
      - **Рассылка событий.** Инициатор объявляет «корзина изменилась», и каждый участник обновляет свою копию.
        - Когда подходит: независимые реакции — аналитика, всплывающее уведомление.
        - Цена: копии расходятся, путь изменения трудно проследить.

      Первые три способа сохраняют одно место хранения: участники только читают из него. Рассылка событий (её ещё
      называют шиной событий, event bus, или «издатель — подписчик», publish–subscribe) этого не гарантирует. Если
      каждый участник держит свою копию корзины и правит её по сигналу, вы снова получаете «3 в шапке и 2 в корзине».
      Поэтому рассылку оставляют для реакций, которым не нужно хранить общие данные: отправить событие в аналитику,
      показать всплывающее «Добавлено».

      ## Типичные ошибки

      - **Рисовать только «счастливый путь» от пользователя.** Сервер, таймер и другой пользователь — тоже инициаторы,
        и их изменения должны идти той же дорогой.
      - **Заводить каждому участнику свою копию данных** и синхронизировать копии сигналами. Рано или поздно сигнал
        потеряется или придёт дважды, и копии разойдутся.
      - **Запускать запросы и аналитику «при изменении данных»,** а не в ответ на действие. Запрос уйдёт и тогда, когда
        данные просто загрузились.
      - **Два правила, которые запускают друг друга.** Экран мигает, уходят лишние запросы, иногда приложение
        зависает.
      - **Забывать участников за пределами текущего экрана:** корзину, когда меняется меню; счётчик в шапке, когда
        меняется страница корзины.

      ## Как спрашивают на интервью

      - «Пользователь нажимает кнопку — расскажите, что происходит дальше, вплоть до ответа сервера».
      - «Какие части интерфейса должны обновиться, когда приходит новое сообщение (статус, уведомление)?»
      - «В приложении иногда показываются разные значения одной и той же цифры. Как будете искать причину?»

      ## Источники

      - [Философия React, шаг 5: обратный поток данных — React](https://ru.react.dev/learn/thinking-in-react#step-5-add-inverse-data-flow)
      - [Возможно, вам не нужен эффект — React](https://ru.react.dev/learn/you-might-not-need-an-effect)

  - id: sdb-diagrams
    topic: Декомпозиция системы
    subtopic: Архитектурные схемы и развитие
    title: Как рисовать архитектуру
    body: |
      ## Какую проблему решаем

      В команду сервиса доставки пришли три человека: менеджер продукта, бэкенд-разработчик и новый фронтендер. Каждый
      просит: «Покажите, как всё устроено». Опытный разработчик открывает схему, которую рисовал полгода: на ней сорок
      прямоугольников — React-компоненты, библиотеки, сервер, база данных, платёжный сервис, — и стрелки во все стороны
      без подписей.

      Менеджер видит слова «Redux» и «useEffect» и ничего не понимает. Бэкендер не находит, какие запросы клиент шлёт
      на сервер. Новичок не может понять, с чего начать чтение. Схема есть, а объяснить она ничего не может: на ней
      смешаны разные масштабы, и каждому зрителю мешает то, что нужно другому.

      Есть и вторая проблема, о которой схема молчит. Команда два часа спорит о структуре папок внутри модуля корзины,
      а формат ответа API, которым будет пользоваться приложение курьера, утверждают за пять минут. Первое можно
      переделать за вечер. Второе — почти нельзя: старые версии приложения курьера останутся на телефонах ещё
      на месяцы.

      Этот урок о двух умениях: рисовать схему нужного масштаба для нужного зрителя и отличать решения, которые легко
      поменять, от решений, ошибка в которых обойдётся дорого.

      ## Зачем вообще схема

      **Архитектурная схема** — картинка, которая показывает, из каких частей состоит система и как эти части связаны.
      Она нужна не для отчёта, а для разговора: чтобы обсудить решение, ввести в курс нового человека, найти слабое
      место до того, как написан код. На собеседовании по системному дизайну схема — центр ответа: по ней
      интервьюер понимает, что вы предлагаете.

      Хорошая схема отвечает на один вопрос для одного зрителя. Если вопросов несколько, нужно несколько схем
      разного масштаба.

      ## Модель C4: четыре уровня приближения

      Самый известный способ договориться о масштабах — **модель C4** (C4 model). Её придумал Саймон Браун (Simon
      Brown). Название — от четырёх английских слов на букву C: context, containers, components, code — контекст,
      контейнеры, компоненты, код. Это четыре уровня приближения к системе.

      Сам автор объясняет модель через сравнение с картами вроде Google Maps: схемы C4 — это «карты вашего кода»,
      которые можно приближать и отдалять, как карту местности, чтобы рассмотреть интересующий вас район. На мелком
      масштабе видна страна и соседние страны, на крупном — улицы одного города. Где сравнение ломается: карта
      на телефоне строится сама из одних и тех же данных, а каждую схему C4 рисует и поддерживает человек. Система
      меняется, а схема сама не обновится — и через полгода может показывать то, чего уже нет.

      ### Уровень 1. Контекст системы

      **Схема контекста** (system context diagram) показывает вашу систему одним прямоугольником в центре, а вокруг —
      людей, которые ей пользуются, и внешние системы, с которыми она обменивается данными. Внутрь системы эта схема
      не заглядывает: ни серверов, ни технологий, ни протоколов на ней нет.

      Зритель — кто угодно: менеджер, юрист, новый разработчик, заказчик. Автор модели советует рисовать такую схему
      любой команде.

      Для сервиса доставки это картинка из вводного урока: в центре сервис, вокруг покупатель, ресторан, курьер,
      поддержка, платёжный сервис и картографический сервис.

      ### Уровень 2. Контейнеры

      **Контейнер** (container) в модели C4 — отдельно работающая часть системы: приложение, которое запускается само
      по себе, или место, где хранятся данные. Автор определяет его как границу, внутри которой выполняется код или
      хранятся данные. Примеры: одностраничное приложение в браузере, мобильное приложение, серверное приложение,
      база данных. Это слово **не имеет отношения к Docker** — автор специально это оговаривает.

      **Схема контейнеров** (container diagram) приближается внутрь системы и показывает её контейнеры и связи между
      ними. На стрелках пишут, что и по какому протоколу передаётся. Для сервиса доставки:

      - веб-приложение покупателя (в браузере);
      - кабинет ресторана (в браузере);
      - приложение курьера (на телефоне);
      - сервер API, с которым говорят все три приложения;
      - база данных заказов и меню.

      Зритель — технические люди: разработчики, тестировщики, специалисты по эксплуатации. Эту схему автор тоже
      советует любой команде. А вот сколько серверов стоит за API, как распределяется нагрузка и что дублируется на
      случай сбоя, схема контейнеров почти не показывает — для этого в C4 есть отдельная схема развёртывания
      (deployment diagram).

      ### Уровень 3. Компоненты

      **Компонент** в модели C4 — группа связанных функций за понятным интерфейсом внутри одного контейнера. Важно:
      это **не React-компонент**. Компонент C4 ближе к модулю или подсистеме из урока «Как делить систему на части».
      Компоненты нельзя выложить отдельно: выкладывается весь контейнер.

      **Схема компонентов** (component diagram) приближается внутрь одного контейнера. Для веб-приложения покупателя
      это модули каталога, меню, корзины, оформления и оплаты, отслеживания заказа, а также клиент API и адаптер
      платёжного SDK из урока «Зависимости и публичный интерфейс модуля».

      Зритель — архитекторы и разработчики. Эту схему автор не советует рисовать всегда: только если она действительно
      помогает, а для долгоживущей документации лучше подумать о том, чтобы строить её автоматически.

      ### Уровень 4. Код

      **Схема кода** — классы, функции и их связи внутри одного компонента. Руками её почти не рисуют: она устаревает
      после каждого изменения, а среда разработки может показать то же самое по запросу.

      ### Уровни вместе

      - **Контекст**
        - Что видно: система одним блоком, люди и внешние системы.
        - Для кого: для всех.
        - В доставке: покупатель, ресторан, курьер, платёжный сервис.
      - **Контейнеры**
        - Что видно: приложения и хранилища внутри системы.
        - Для кого: технические люди.
        - В доставке: веб-приложение покупателя, приложение курьера, сервер API, база данных.
      - **Компоненты**
        - Что видно: модули внутри одного контейнера.
        - Для кого: разработчики.
        - В доставке: каталог, корзина, оплата, клиент API.
      - **Код**
        - Что видно: классы и функции.
        - Для кого: разработчики, по запросу.
        - В доставке: руками почти никогда не рисуют.

      ![Четыре уровня схем C4 на примере доставки: контекст — сервис среди пользователей и внешних систем; контейнеры — веб-приложение покупателя, приложение курьера, сервер API и база данных; компоненты — меню, корзина и оплата внутри веб-приложения покупателя](images/sdb-c4-levels.png "Уровни C4: каждый следующий приближает часть предыдущего")

      ## Схемы поведения: потоки и последовательность

      Уровни C4 показывают **строение** системы: что в ней есть и что с чем связано. Но часто вопрос другой: что
      происходит, когда человек что-то делает? Для этого нужны схемы поведения.

      **Диаграмма потоков данных** (data-flow diagram) — её вы рисовали в уроке «Куда текут данные»: инициатор,
      место хранения, участники и стрелки между ними для одного события. Отвечает на вопрос «кто узнает об изменении».

      **Диаграмма последовательности** (sequence diagram) показывает участников колонками, а время идёт сверху вниз.
      Стрелки — сообщения между участниками, в том порядке, в каком они происходят. Отвечает на вопрос «что за чем
      происходит и кто кого ждёт». В модели C4 похожую роль играет **динамическая схема** (dynamic diagram):
      пронумерованные взаимодействия элементов для одной функции. Автор советует рисовать такие схемы выборочно —
      для интересных или повторяющихся сценариев со сложным взаимодействием.

      Пример для оплаты заказа. Участники: покупатель, веб-приложение, сервер API, платёжный сервис.

      1. Покупатель нажимает кнопку оформления заказа.
      2. Веб-приложение просит сервер API создать заказ.
      3. Сервер отвечает: заказ № 512 создан и ждёт оплаты.
      4. Веб-приложение открывает форму платёжного сервиса, и покупатель вводит данные карты в ней. Номер карты
         не проходит через наш код: так записано в требованиях к безопасности в уроке «Как превратить „быстро“ в цифры».
      5. Платёжный сервис сообщает серверу API, что оплата прошла.
      6. Веб-приложение узнаёт у сервера, что заказ оплачен, и показывает экран отслеживания.

      Последовательность сразу показывает то, чего не видно на схеме контейнеров. Между шагами 4 и 6 веб-приложение
      ждёт, и это ожидание может затянуться. Что увидит покупатель, если подтверждение оплаты задержится, — вопрос,
      который команда должна решить заранее.

      ## Какую схему выбрать

      | Вопрос, на который нужно ответить | Схема |
      |---|---|
      | С кем и с чем взаимодействует система в целом? | Контекст |
      | Из каких приложений и хранилищ она состоит и как они связаны? | Контейнеры |
      | Из каких модулей состоит одно приложение? | Компоненты |
      | Кто должен узнать об изменении после одного действия? | Потоки данных |
      | В каком порядке идут шаги и кто кого ждёт? | Последовательность |

      ## Что на схему не попадает

      На схему попадает только **архитектурно значимое** — то, что влияет на другие части системы или дорого меняется.
      Это то же определение архитектурного решения, что во вводном уроке. Поэтому на схемах обычно нет:

      - отдельных React-компонентов вроде кнопок и карточек;
      - названий функций, файлов и папок;
      - стилей, текстов, анимаций;
      - элементов, которые не участвуют в обсуждаемом вопросе: на схеме оплаты не нужен модуль каталога.

      Библиотеки и технологии на схеме уместны, когда сами по себе значимы. «Веб-приложение, React, работает в браузере»
      на схеме контейнеров полезно. «Кнопка использует библиотеку иконок» — нет.

      Чтобы схему мог прочитать человек, которого не было на обсуждении, автор C4 советует несколько простых правил:

      - у каждой схемы есть **название**: какой это уровень и какая часть системы;
      - есть **легенда** — что означают формы, цвета и линии;
      - у каждого элемента указан **тип**: человек, приложение, хранилище;
      - каждая стрелка идёт **в одну сторону** и **подписана**: что передаётся и зачем.

      ## Пропущенное звено и точка роста

      Схемой проверяют проект. Пройдите по ней каждый сценарий из требований (урок «Как выяснять требования»)
      и спросите: по каким стрелкам он идёт?

      **Пропущенное звено** — шаг сценария, для которого на схеме нет стрелки или участника. Пример: требование
      «покупатель видит новый статус заказа в течение минуты». Ищем на схеме, как статус доходит до веб-приложения,
      и видим только стрелку «веб-приложение → API: создать заказ». Как веб-приложение узнает, что ресторан начал
      готовить? Ответа на схеме нет. Значит, нужно дорисовать стрелку опроса: веб-приложение раз в 30 секунд
      спрашивает у сервера API статус заказа (так решили в уроке «Как превратить „быстро“ в цифры»).
      Лучше найти это на схеме, чем в разгар работы.

      **Точка роста** — место, которое придётся менять, когда продукт будет развиваться. Пример: в первой версии нет
      карты с курьером, но она запланирована. Тогда на схеме контейнеров видно, что появится новый поток данных —
      координаты курьера каждые несколько секунд, — и, возможно, новый контейнер, который их рассылает. Полезно заранее
      понять, какие части это затронет, и провести границы так, чтобы изменение осталось внутри модуля отслеживания,
      а не расползлось по всему приложению.

      ## Обратимые и дорогие решения

      Теперь вторая проблема из начала урока: на какие решения стоит тратить время.

      Джефф Безос, основатель Amazon, в письме акционерам за 2015 год разделил решения на два типа и описал их через
      сравнение с дверьми. Некоторые решения — это **двери в одну сторону** (one-way doors): если прошли через неё
      и вам не понравилось то, что по ту сторону, вернуться туда, где были, уже нельзя. Такие решения он называет
      решениями первого типа и пишет, что их нужно принимать методично, осторожно, не торопясь, обдумав и посоветовавшись.
      Но большинство решений — **двери в обе стороны** (two-way doors): их можно поменять, и если решение оказалось
      неудачным, можно открыть дверь и вернуться. Решения второго типа, по его словам, можно и нужно принимать быстро.
      Он же предупреждает: с ростом организации появляется склонность принимать медленным способом большинство решений,
      в том числе многие решения второго типа. Итог — медлительность, необдуманная боязнь риска, слишком мало
      экспериментов и в результате меньше изобретений.

      Где сравнение ломается: в программах почти нет совсем необратимых решений — есть шкала, от «поменять за минуту»
      до «переделывать полгода». И дверь может захлопнуться со временем: решение, которое легко поменять сегодня,
      становится дорогим, как только от него начинают зависеть другие.

      **Обычно легко поменять:**

      - структуру папок внутри модуля;
      - библиотеку модальных окон, спрятанную за своей обёрткой;
      - как часто опрашивать сервер: раз в 30 или раз в 60 секунд;
      - где вычислять итог корзины.

      **Обычно дорого поменять:**

      - формат API, которым пользуются мобильные приложения: старые версии живут на телефонах месяцами;
      - формат данных, сохранённых на устройствах людей: старые записи придётся читать и после смены формата;
      - адреса страниц, которые проиндексированы поисковиками и разосланы в мессенджерах;
      - способ отрисовки — на сервере или в браузере: от него зависит устройство всего приложения.

      Как понять, к какому списку относится решение? Задайте четыре вопроса:

      1. **Сколько частей системы придётся поменять** вместе с ним?
      2. **Есть ли потребители, которых вы не контролируете:** старые версии приложений, партнёры, чужие сайты
         со встроенным виджетом, сохранённые ссылки?
      3. **Останутся ли данные в старом формате** — в базе, в хранилище браузера, в закладках?
      4. **Можно ли откатить** выпуском новой версии, или после выпуска пути назад нет?

      Что с этим делать:

      - **обратимые решения** принимайте быстро и не тратьте на них время на собеседовании: «возьму эту библиотеку,
        если не подойдёт — заменим»;
      - **дорогие решения** обдумывайте, называйте вслух, записывайте вместе с причинами (о записи решений —
        в уроке «Риски и развитие решения»);
      - **превращайте дорогие решения в обратимые,** где это возможно. Платёжный SDK за адаптером из урока
        «Зависимости и публичный интерфейс модуля» — именно такой приём: поменять платёжный сервис становится
        делом одного модуля. Номер версии в сохранённых данных позволяет потом прочитать старый формат. Как менять
        контракт, не ломая потребителей, — в уроке «Зависимости и публичный интерфейс модуля»; для API, которым
        пользуются старые мобильные версии, тот же приём просто тянется месяцами.

      На схеме полезно отметить места дорогих решений. Тогда при обсуждении видно, где нужно остановиться и подумать,
      а где можно двигаться быстро.

      ## Пример целиком: схема контейнеров доставки

      Соберём всё вместе и пройдём одну схему от первого наброска до проверенной.

      1. **Рисуем контейнеры.** Веб-приложение покупателя, кабинет ресторана, приложение курьера, сервер API, база
         данных заказов и меню. У каждого прямоугольника — тип и технология: «веб-приложение, React, в браузере».
      2. **Подписываем стрелки.** «Веб-приложение → сервер API: создать заказ, HTTPS», «Приложение курьера → сервер
         API: отметить доставку», «Сервер API → база данных: читает и пишет заказы». Каждая стрелка идёт в одну
         сторону и говорит, что по ней передаётся.
      3. **Проходим сценарий из требований:** «покупатель видит новый статус заказа в течение минуты». Ресторан
         отмечает в кабинете «принял заказ» — стрелка к серверу API есть. А как статус доходит до покупателя? Стрелки
         нет: это пропущенное звено. Дорисовываем «Веб-приложение → сервер API: статус заказа, раз в 30 секунд».
      4. **Отмечаем точку роста.** Карта с курьером запланирована на следующую версию. Ей понадобится поток координат
         от приложения курьера каждые несколько секунд и, возможно, отдельный контейнер, который рассылает их
         покупателям. Затронет это только модуль отслеживания в веб-приложении — значит, его граница должна прятать,
         откуда берётся статус.
      5. **Отмечаем дорогие решения.** Формат ответа API для приложения курьера: старые версии будут жить на телефонах
         месяцами. На схеме рядом с этой стрелкой — пометка «менять только добавлением полей».

      Получилась схема, которую поймёт и бэкендер, и новый фронтендер: видно, кто с кем говорит, как статус доходит
      до покупателя, что поменяется с картой курьера и где нельзя торопиться.

      ## Типичные ошибки

      - **Одна схема на всё.** Компоненты, серверы и библиотеки вперемешку — и никто не понимает картинку.
      - **Стрелки без подписей и направления.** Непонятно, кто кого вызывает и что передаёт.
      - **React-компоненты вместо архитектуры.** Дерево компонентов — это деталь реализации, а не устройство системы.
      - **Только строение без поведения.** По схеме контейнеров не видно, что веб-приложение ждёт подтверждения оплаты.
      - **Одинаково долго обсуждать все решения.** Время уходит на то, что легко поменять, а дорогое решается наспех.
      - **Схема, которая не обновляется.** Через полгода она показывает систему, которой уже нет.

      ## Как спрашивают на интервью

      - «Нарисуйте общую схему решения» — обычно ждут уровень контейнеров и компонентов: из каких частей состоит
        клиент и как он говорит с сервером.
      - «Покажите, что происходит, когда пользователь нажимает "Отправить"» — здесь нужна последовательность или поток
        данных.
      - «Какое из ваших решений сложнее всего будет поменять потом?» — проверяют, отличаете ли вы обратимые решения
        от дорогих.

      ## Источники

      - [The C4 model for visualising software architecture — Simon Brown](https://c4model.com/introduction)
      - [Письмо Джеффа Безоса акционерам Amazon за 2015 год, раздел о решениях первого и второго типа — SEC](https://www.sec.gov/Archives/edgar/data/1018724/000119312516530910/d168744dex991.htm)

  - id: sdb-state-kinds
    topic: Архитектура состояния
    subtopic: Виды состояния
    title: Какое бывает состояние
    body: |
      ## Какую проблему решаем

      Представьте первую версию веб-приложения доставки еды, где всё, что меняется, сложено в одно общее хранилище:
      меню ресторана, открыта ли шторка с описанием блюда, выбранный фильтр кухни, корзина, текст в поле адреса. Сначала
      это удобно: всё в одном месте, любой компонент может достать что угодно. Через пару месяцев начинаются жалобы.

      - Ресторан поднял цену на хачапури, а у покупателя, который давно не перезагружал вкладку, в меню старая цена.
        Меню загрузили один раз и больше не обновляли: никто не решил, когда эта копия устаревает.
      - Покупатель выбрал «грузинская кухня» и отправил ссылку другу. Друг открыл ссылку и увидел все рестораны
        подряд: фильтр жил в памяти вкладки, а в адресе его не было.
      - После перезагрузки страницы пропала корзина, которую человек собирал десять минут.
      - Человек печатает адрес, и на каждую букву перерисовывается половина экрана: поле ввода хранит текст в общем
        хранилище, на которое подписаны все компоненты.

      У всех четырёх бед одна причина. Данные разной природы положили в одно место и обращались с ними одинаково.
      А у них разные хозяева, разный срок жизни и разные требования: одно должно переживать перезагрузку, другое —
      передаваться по ссылке, третье — обновляться, потому что его меняют другие люди. Этот урок учит различать виды
      состояния и по ним выбирать, где что хранить.

      ## Что такое состояние

      **Состояние** (state) — любые данные, которые меняются, пока приложение работает, и влияют на то, что видит
      человек. Меню, корзина, открытая шторка, набранный в поле текст — всё это состояние. Код компонента и тексты
      кнопок — нет: они не меняются, пока человек пользуется приложением.

      Вопрос «где хранить состояние» звучит как вопрос о библиотеке: Redux, Zustand, контекст React. На самом деле
      библиотека — следствие. Сначала нужно понять, **что это за данные**: кто имеет право их менять, сколько они
      должны жить, кому ещё они нужны. Ответы на эти вопросы и делят состояние на виды.

      ## Пять видов состояния

      ### Состояние интерфейса

      **Состояние интерфейса** (UI state) — то, как сейчас выглядит экран: открыта ли шторка с блюдом, какая вкладка
      выбрана, развёрнут ли список отзывов, показано ли модальное окно. Эти данные создаёт и меняет только само
      приложение в ответ на действия человека. Сервер о них ничего не знает, и обычно они нужны, только пока открыт
      этот экран.

      ### Серверное состояние

      **Серверное состояние** (server state) — данные, оригинал которых живёт на сервере: меню, цены, список
      ресторанов, статус заказа. Авторы библиотеки TanStack Query, которая работает именно с такими данными, описывают
      их четырьмя свойствами:

      - они хранятся где-то далеко, в месте, которое вы не контролируете;
      - получить и изменить их можно только асинхронно, через запросы;
      - ими владеете не только вы: их могут изменить другие люди, и вы об этом не узнаете;
      - поэтому копия у вас в приложении может устареть.

      Главное следствие: у клиента никогда нет самих серверных данных, только **копия** — то, что сервер ответил
      в какой-то момент. Такую копию, которую держат ради скорости, называют **кэшем** (cache). Цена в меню на экране —
      это не цена, а воспоминание о цене. Когда и как такую копию обновлять, подробно разбирается в курсе 2,
      в уроках «Как устроен клиентский кэш» и «Когда данные устаревают».

      ### Состояние в адресе

      **Состояние в адресе** (URL state) — то, что записано в адресной строке: путь страницы и параметры после знака
      вопроса. Например, `/restaurants?cuisine=georgian&sort=rating` — открыт список ресторанов, выбрана грузинская
      кухня, сортировка по рейтингу.

      У адреса три свойства, которых нет у памяти вкладки. Он переживает перезагрузку страницы. Его можно скопировать
      и отправить другому человеку. И по нему ходят кнопки браузера «Назад» и «Вперёд». Поэтому в адрес кладут то,
      чем хочется поделиться или к чему хочется вернуться. Подробно об адресе как о договорённости с пользователем —
      в уроке «Что переживает перезагрузку».

      ### Сохранённое на устройстве

      **Сохранённое на устройстве** (persisted state) — данные, которые приложение записывает в хранилище браузера,
      например в `localStorage` или IndexedDB, чтобы они пережили закрытие вкладки. Тема оформления, последний
      введённый адрес, корзина гостя без аккаунта.

      Такие данные живут долго, но только в этом браузере на этом устройстве. На телефоне человека их нет, у друга
      по ссылке — тоже. Браузер может их стереть, если человек очистит данные сайта. Какое хранилище браузера для чего
      подходит, разбирается в курсе 2, в уроке «Работа без сети и очередь действий».

      ### Мимолётное состояние

      **Мимолётное состояние** (ephemeral state) — то, что нужно доли секунды или несколько минут и никому, кроме
      одного компонента: текст, который человек прямо сейчас печатает в поле, положение карточки, которую он тащит
      пальцем, подсвеченный при наведении пункт списка. Если такое состояние пропадёт, почти ничего не случится.

      Чем мимолётное отличается от состояния интерфейса? Состояние интерфейса может понадобиться нескольким частям
      экрана: открытая шторка затемняет фон и блокирует прокрутку страницы. Мимолётное касается одного компонента
      и умирает вместе с ним. Граница между ними нечёткая, и это нормально: важно не название, а вывод — мимолётное
      состояние не нужно никуда поднимать и сохранять.

      ## Две оси: кто владеет и сколько живёт

      Виды состояния удобно сравнивать по двум вопросам.

      **Кто владеет** — кто имеет право сказать, какое значение правильное. Цену блюда определяет ресторан, и если
      на экране написано одно, а на сервере другое, прав сервер. Открыта ли шторка, решает приложение в руках
      человека. Что лежит в адресе, решает тот, кто этот адрес открыл. Подробно о владельце — в следующем уроке, «Кто
      главный по данным».

      **Сколько живёт** — когда данные исчезают. Состояние компонента React живёт, пока компонент на экране:
      документация React прямо говорит, что когда React убирает компонент, его состояние уничтожается. Память вкладки
      живёт до перезагрузки. Адрес — пока на него можно вернуться через историю или ссылку. Хранилище браузера — пока
      его не очистят. Сервер — сколько решит сервер.

      Сведём оба вопроса вместе.

      - **Состояние интерфейса**
        - Кто владеет: приложение.
        - Сколько живёт: пока открыт экран.
        - Кто ещё видит: только этот человек в этой вкладке.
      - **Серверное**
        - Кто владеет: сервер и те, кто меняет данные на нём.
        - Сколько живёт: сколько решит сервер; у клиента — только копия.
        - Кто ещё видит: все, кому сервер покажет.
      - **В адресе**
        - Кто владеет: тот, кто открыл адрес.
        - Сколько живёт: переживает перезагрузку, остаётся в истории и в ссылке.
        - Кто ещё видит: любой, кому отправили ссылку.
      - **Сохранённое на устройстве**
        - Кто владеет: приложение на этом устройстве.
        - Сколько живёт: до очистки данных браузера.
        - Кто ещё видит: только этот браузер.
      - **Мимолётное**
        - Кто владеет: один компонент.
        - Сколько живёт: пока компонент на экране.
        - Кто ещё видит: никто.

      ## Как выбрать место: требования решают

      Место хранения выбирают не по вкусу, а по трём требованиям: кому ещё нужны данные, что они должны пережить
      и нужно ли ими делиться. Удобно пройти по вопросам сверху вниз и остановиться на первом «да».

      1. **Оригинал на сервере и его могут менять другие?** Это серверное состояние. Клиент держит только копию
         и должен решить, когда её обновлять.
      2. **Им нужно делиться ссылкой или к нему возвращаются кнопками «Назад» и «Вперёд»?** Место — адрес.
         Перезагрузку адрес тоже переживает, но одной перезагрузки мало, чтобы класть данные в адрес: для этого есть
         хранилище браузера (пункт 4).
      3. **Оно должно быть у человека на всех его устройствах?** Тогда, хотя данные и личные, их хранит сервер, например
         в настройках профиля. Хранилище браузера одно на устройство и между устройствами не переезжает.
      4. **Оно должно пережить перезагрузку и закрытие вкладки, но нужно только на этом устройстве?** Место —
         хранилище браузера.
      5. **Оно нужно нескольким компонентам на экране?** Это состояние интерфейса. Его держат в ближайшем общем
         родителе этих компонентов, а если он слишком далеко — в общем хранилище приложения.
      6. **Ничего из перечисленного?** Мимолётное: пусть живёт внутри одного компонента.

      Почему пункт 3 стоит раньше пункта 4? Настройка, которую человек ждёт на всех устройствах, тоже должна пережить
      закрытие вкладки. Если бы мы остановились на пункте 4, она попала бы в хранилище браузера и на втором устройстве
      пропала бы. «Личное» не значит «на устройстве». Если человек выбрал тёмную тему на
      телефоне и ждёт её на компьютере, тема должна жить на сервере. Если же разные устройства вполне могут выглядеть
      по-разному, хватит хранилища браузера.

      ## Цена копий

      Иногда одни и те же данные хочется держать в двух местах: фильтр — и в адресе, и в общем хранилище, «чтобы
      компонентам было удобно читать». Каждая такая копия стоит денег. Кто-то должен следить, чтобы две копии были
      равны, и у этой слежки всегда найдётся дыра.

      Вот как это выглядит. Фильтр кухни лежит в адресе и в хранилище, при каждом изменении код записывает новое значение
      в оба места. Человек выбрал «грузинская», потом «японская», потом нажал «Назад». Браузер вернул в адрес
      `cuisine=georgian`, но хранилище об этом не узнало: код синхронизации срабатывал только на нажатие чипа. Теперь
      список показывает грузинские рестораны (его строят по адресу), а подсвечен чип «японская» (его рисуют по
      хранилищу). Чинят — появляется следующая дыра: открытие ссылки, ручная правка адреса, перезагрузка.

      Цена копии складывается из трёх частей:

      - **код синхронизации**, который нужно написать и не забыть обновить при каждом новом пути изменения;
      - **моменты расхождения**, когда две части экрана показывают разное;
      - **трудные ошибки**: «почему значение откатилось?» — ответ спрятан в порядке срабатывания двух обработчиков.

      У каждого кусочка состояния должно быть одно место, остальные читают оттуда: фильтр живёт в адресе, и чип,
      и список берут его из адреса. Исключение — серверные данные: сервер далеко, и копия у клиента неизбежна. Даже
      сохранённая в хранилище браузера, такая копия остаётся кэшем: прав по-прежнему сервер, и при первой возможности
      копию сверяют с ним, а не наоборот. Кто решает, какое место главное, и какие копии допустимы, — в следующем
      уроке, «Кто главный по данным».

      ## Пример целиком: экран ресторана

      Покупатель открыл каталог, выбрал фильтр «грузинская кухня», зашёл в ресторан, открыл шторку с хачапури, добавил
      его в корзину и начал вводить адрес доставки. Разложим всё, что меняется на этом пути.

      - **Меню ресторана, цены, отметки «закончилось»**
        - Вид: серверное.
        - Где хранить: кэш — копия ответа сервера с правилом обновления.
        - Если не туда: в общем хранилище без обновления цены устаревают.
      - **Фильтр кухни в каталоге**
        - Вид: в адресе.
        - Где хранить: параметр `?cuisine=georgian`.
        - Если не туда: в памяти вкладки — ссылка другу без фильтра, «Назад» не возвращает прежний фильтр.
      - **Открыта ли шторка с блюдом**
        - Вид: интерфейса.
        - Где хранить: состояние страницы ресторана.
        - Если не туда: в общем хранилище шторка окажется открытой, когда человек зайдёт в другой ресторан.
          Если бы шторкой хотели делиться ссылкой, её место было бы в адресе.
      - **Корзина гостя**
        - Вид: сохранённое на устройстве.
        - Где хранить: хранилище браузера.
        - Если не туда: в памяти вкладки корзина пропадёт при перезагрузке.
      - **Текст, который печатают в поле адреса**
        - Вид: мимолётное.
        - Где хранить: внутри поля ввода.
        - Если не туда: в общем хранилище половина экрана перерисовывается на каждую букву.
      - **Сохранённые адреса доставки**
        - Вид: серверное (пояснение ниже).
        - Где хранить: профиль покупателя на сервере.
        - Если не туда: на устройстве — на втором устройстве адресов нет.

      Две строки заслуживают пояснения.

      **Корзина.** Где её хранить — решение с ценой, о котором говорилось во вводном уроке: на устройстве быстро и
      просто, на сервере корзина видна на всех устройствах. В нашем сервисе решение такое: собрать корзину можно без
      входа, и у гостя она хранится на устройстве — это сохранённое состояние. Войти по номеру телефона нужно при
      оформлении заказа. После входа корзина один раз переносится на сервер и дальше живёт там, на всех устройствах
      человека. С этого момента она серверная, и всё сказанное о копиях и устаревании относится и к ней. Почему
      выбрано именно так, разбирается в уроке «Как сравнивать решения». Вид состояния вытекает из требований,
      а не из названия данных.

      **Адрес.** Пока человек печатает, текст в поле — мимолётное состояние: никому, кроме поля, оно не нужно. Когда он
      нажал «Сохранить», адрес отправляется на сервер. Сохранённые адреса меняет только сам человек, но живут они
      на сервере, потому что нужны на всех его устройствах (пункт 3). С этого момента у клиента только их копия,
      и всё сказанное о серверном состоянии к ним относится. Одна и та же вещь в разные моменты бывает разного вида.
      Если форма длинная и терять ввод при перезагрузке обидно, появляется черновик — о нём в уроке «Что переживает
      перезагрузку».

      ## Варианты места и их цена

      - **Внутри компонента**
        - Что даёт: проще всего.
        - Цена: другим компонентам не достать.
      - **У общего родителя**
        - Что даёт: одно значение для нескольких компонентов.
        - Цена: значение передают вниз через пропсы.
      - **Общее хранилище**
        - Что даёт: доступно отовсюду.
        - Цена: менять может каждый, туда легко сложить лишнее.
      - **Библиотека серверных данных**
        - Что даёт: загрузка, кэш, обновление устаревших данных.
        - Цена: ещё одна зависимость и её правила.
      - **Адрес страницы**
        - Что даёт: ссылка, «Назад» и «Вперёд», перезагрузка.
        - Цена: только строки, длина ограничена, всё видно пользователю.
      - **Хранилище браузера**
        - Что даёт: переживает закрытие вкладки.
        - Цена: одно устройство, данные могут очистить.
      - **Сервер**
        - Что даёт: все устройства и все люди.
        - Цена: запросы, задержка, без сети сложнее.

      Общее хранилище — это Redux, Zustand или контекст React, библиотека серверных данных — например, TanStack Query.
      Документация TanStack Query делает наблюдение, которое полезно запомнить: когда серверные данные выносят
      из общего хранилища в библиотеку для серверных данных, в общем хранилище обычно остаётся совсем немного —
      тема оформления, открыта ли боковая панель. Большая часть «глобального состояния» в типичном приложении
      оказывается копией серверных данных.

      ## Типичные ошибки

      - **Всё в одно хранилище.** Серверные копии, адрес, мимолётный ввод живут вместе, и никто не знает, что
        из этого устарело, что нужно сохранять, а что можно выбросить.
      - **Серверные данные как свои.** Меню загрузили один раз и считают истиной до конца сессии. Покупатель видит
        цену, которой уже нет.
      - **Фильтры и вкладки только в памяти.** Ссылкой не поделиться, «Назад» не возвращает, перезагрузка сбрасывает
        выбор. Человек выбирал пять минут — и всё сначала.
      - **Личное — значит, в браузере.** Настройку, которую человек ждёт на всех устройствах, кладут в `localStorage`
        и получают жалобы «на телефоне всё сбросилось».
      - **Одно значение в двух местах.** Фильтр и в адресе, и в хранилище, синхронизация вручную — и вечная охота
        на расхождения.
      - **Поднимать мимолётное наверх.** Текст поля ввода в общем хранилище перерисовывает весь экран на каждую букву.

      ## Как спрашивают на интервью

      - «Какие данные будут в вашем приложении и где каждое из них хранится?» — ждут классификации: это серверное, это
        в адресе, это локальное, и почему.
      - «Пользователь отправил ссылку другу — что увидит друг?» и «Что будет после перезагрузки?» — проверяют, учли ли
        вы адрес и сохранение.
      - «Зачем вам Redux?» — хороший ответ начинается не с библиотеки, а с того, каких данных у вас много и какого
        они вида.

      ## Источники

      - [Overview: Motivation — TanStack Query (о свойствах серверного состояния)](https://tanstack.com/query/latest/docs/framework/react/overview)
      - [Does TanStack Query replace Redux, MobX or other global state managers? — TanStack Query](https://tanstack.com/query/latest/docs/framework/react/guides/does-this-replace-client-state)
      - [Preserving and Resetting State: State is tied to a position in the tree — React (страница пока на английском)](https://ru.react.dev/learn/preserving-and-resetting-state#state-is-tied-to-a-position-in-the-tree)

  - id: sdb-ownership
    topic: Архитектура состояния
    subtopic: Владелец и единый источник истины
    title: Кто главный по данным
    body: |
      ## Какую проблему решаем

      Покупатель в сервисе доставки добавил в корзину хачапури за 450 рублей. Приложение записало в корзину название,
      количество и цену — 450. Пока человек выбирал напиток, ресторан поднял цену до 490. Корзина по-прежнему показывает
      450 и итог 1 150. Человек нажимает «Оформить заказ». Сервер создаёт заказ по своим ценам, и на шаге оплаты
      с карты списывается 1 190, а не 1 150, которые человек видел в корзине.

      Человек видел одну сумму, а заплатил другую. Он не ошибся, и сервер не ошибся. Ошибка в устройстве данных: цена
      блюда жила в двух местах — в меню на сервере и в корзине на клиенте, — и каждое место считало себя правым.
      Когда они разошлись, никто не знал, какое значение верное, пока не стало поздно.

      Предыдущий урок, «Какое бывает состояние», разделил данные на виды. Этот отвечает на следующий вопрос: если
      одни и те же данные встречаются в нескольких местах, какое из них главное.

      ## Владелец и единый источник истины

      **Источник истины** (source of truth) — место, значение в котором считается правильным. Если на экране одно,
      а там другое, правы там. Говорят ещё **авторитетный источник** (authoritative source) или просто **владелец**
      данных. Владелец не только хранит значение: изменения проходят через него. Хотите поменять — попросите
      владельца, а не правьте свою копию.

      **Единый источник истины** (single source of truth) — принцип: у каждого кусочка данных ровно один владелец.
      Документация React формулирует его так: для каждого уникального кусочка состояния вы выбираете компонент,
      который им «владеет». И сразу уточняет, что это не значит «держать всё в одном месте». Наоборот, у разных
      данных разные владельцы: у цены — сервер, у открытой шторки — страница ресторана, у текста в поле — само поле.
      Важно только, чтобы у одних и тех же данных владелец не раздваивался.

      ## Оригинал, производное и кэш

      Данные, которые встречаются в приложении, бывают трёх сортов, и только один из них может быть владельцем.

      - **Основные данные** (canonical state, каноническое состояние) — оригинал: то, что нельзя ниоткуда получить
        заново. Цена в базе ресторана, состав корзины, текст, который человек ещё не сохранил.
      - **Производные данные** (derived state) — то, что вычисляется из основных: итог корзины, число блюд на значке,
        список ресторанов после фильтра. Если исходные данные известны, производные всегда можно посчитать снова.
        Что вычислять, а что хранить, — тема следующего урока, «Вычислять или хранить».
      - **Кэш** (cache) — копия чужих основных данных, которую держат ради скорости. Меню, загруженное с сервера, —
        кэш: оригинал в базе ресторана.

      Есть простая проверка: **можно ли это выбросить и получить заново без потерь?** Итог корзины — да, пересчитаем.
      Меню — да, загрузим снова. Состав корзины гостя — нет: человек выбирал, и восстановить его неоткуда. Значит,
      состав корзины — основные данные, и у него должен быть один понятный владелец. Всё, что можно выбросить, —
      копии и вычисления, они владельцами не бывают.

      ## Как найти владельца

      Для каждого вида данных задайте три вопроса.

      1. **Кто меняет эти данные?** Цену меняет ресторан в своём кабинете. Наличие — ресторан, когда блюдо
         закончилось. Состав корзины — покупатель. Статус заказа — ресторан и курьер.
      2. **Где должна стоять последняя проверка?** Деньги списывает сервер, и сумму он считает по своим ценам.
         Клиент может показать что угодно, но решает не он.
      3. **Кто ещё должен видеть эти данные?** Если другие люди или другие устройства — владелец почти наверняка
         сервер. Если только этот человек на этом экране — владелец на клиенте.

      Внутри клиента вопрос тот же, только масштаб меньше: какой компонент владеет значением. Если две части экрана
      должны показывать одно и то же, значение поднимают в их ближайшего общего родителя, а части получают его через
      пропсы. В React этот приём называется **подъём состояния** (lifting state up). Как это выглядит у отдельного
      компонента — управляемый он или неуправляемый, — разбиралось в уроке «Компонент как контракт».

      ## Пример целиком: кто главный в доставке

      - **Цена блюда**
        - Владелец: сервер, а цену задаёт ресторан.
        - Если перепутать: человек видит одну сумму, а платит другую.
      - **Наличие блюда**
        - Владелец: сервер, «закончилось» ставит ресторан.
        - Если перепутать: заказ с блюдом, которого нет.
      - **Состав корзины**
        - Владелец: у гостя — устройство, после входа — сервер.
        - Если перепутать: блюда «воскресают» или пропадают.
      - **Итог корзины**
        - Владелец: никто, это вычисление.
        - Если перепутать: итог не сходится со списком блюд.
      - **Статус заказа**
        - Владелец: сервер.
        - Если перепутать: на экране «готовится», а курьер уже у двери.
      - **Набираемый адрес**
        - Владелец: поле ввода.
        - Если перепутать: ввод теряется или экран тормозит на каждой букве.

      У клиента от серверных данных — цены, наличия, статуса — только кэш. Почему корзина гостя живёт на устройстве,
      а после входа — на сервере, разбирается в уроке «Как сравнивать решения».

      Теперь вернёмся к хачапури. Ошибка была в том, что корзина записала цену себе и стала её вторым владельцем.
      Правильное устройство такое:

      - корзина хранит только то, чем владеет покупатель: какое блюдо (его идентификатор) и сколько штук;
      - цену корзина берёт из кэша меню при каждой отрисовке, поэтому новая цена появляется в корзине вместе
        с обновлённым меню;
      - при оформлении сервер пересчитывает заказ по своим ценам и наличию. Если что-то изменилось, он отвечает
        об этом, а клиент показывает: «Цена хачапури изменилась: было 450, стало 490». Человек соглашается или
        убирает блюдо.

      Кэш меню всё равно может устареть, и избавиться от этого нельзя: сервер далеко. Но теперь у расхождения есть
      понятная развязка — владелец проверяет и сообщает, а не тихо списывает другую сумму.

      Обратите внимание: когда заказ оформлен, цена в нём уже не должна меняться вслед за меню. Это не копия цены,
      а новый факт — «купили по 490». Об этой разнице подробно в следующем уроке.

      ## Почему двусторонняя синхронизация почти всегда ломается

      **Двусторонняя синхронизация** — когда у данных две равноправные копии, менять можно обе, и каждая пересылает
      свои изменения другой. Звучит удобно: каждый работает со своей копией, а синхронизация «как-нибудь» сделает
      их одинаковыми. На деле это два владельца у одних данных.

      Пример из доставки. Гость собирает корзину, она хранится на устройстве. При оформлении он входит в аккаунт, где уже
      лежит корзина на сервере, собранная вчера с компьютера. Команда решает: пусть обе корзины живут и
      синхронизируются — изменения на телефоне уходят на сервер, изменения на сервере приходят на телефон. Что
      происходит дальше:

      - **Кто прав при одновременных изменениях?** Человек убрал суп на телефоне, а компьютер в то же время отправил
        старую корзину с супом. Какая версия победит, зависит от того, чей запрос пришёл позже. Суп «воскресает».
      - **Петли.** Телефон получил корзину с сервера и записал её у себя. Запись — это изменение, значит, его надо
        отправить на сервер. Сервер получил, разослал… Без особых предосторожностей копии гоняют одно и то же по кругу.
      - **Половина обновления.** Связь пропала посреди синхронизации: на телефоне уже новое, на сервере ещё старое.
        Через минуту старое приходит с сервера и затирает новое.
      - **Трудно объяснить.** Человек видит, как блюдо исчезло и появилось снова. Разработчик, чтобы понять почему,
        должен восстановить порядок десятка событий на двух устройствах.

      Внутри одного приложения то же самое случается в миниатюре — когда компонент копирует пропс в собственное
      состояние. Почему так делать не стоит, разбиралось в уроке «Компонент как контракт».

      **Как сделать правильно.** Выбрать одного владельца, а остальным оставить роль читателей:

      - значения текут **от владельца** — все читают текущее значение у него;
      - изменения текут **к владельцу** — кто хочет поменять, отправляет ему просьбу и ждёт его ответа.

      Для корзины это значит: пока человек гость, владелец — устройство. Войти по номеру телефона нужно при
      оформлении заказа, и в этот момент один раз выполняется явное слияние по понятному правилу: блюда из обеих
      корзин складываются, и итог показывают человеку. После этого владелец — сервер, а на телефоне остаётся только
      его копия. Это и есть однонаправленный поток данных из урока
      «Куда текут данные», только в масштабе всей системы.

      ## Варианты, когда без копии не обойтись

      Копии нужны: сервер далеко, а показывать данные хочется сразу. Вопрос не в том, есть ли копия, а в том, какие
      у неё права.

      - **Читать у владельца каждый раз, без копии**
        - Когда подходит: владелец рядом, внутри клиента — значение родителя, адрес страницы.
        - Цена: почти никакой. Для сервера это был бы запрос на каждый показ, поэтому с ним так не делают.
      - **Кэш только для чтения с правилом обновления**
        - Когда подходит: серверные данные, которые меняют другие, — меню, статус заказа, остаток лимита.
        - Цена: копия бывает устаревшей. Поэтому решение, от которого зависят деньги или ограничения, принимает
          владелец: клиент показывает копию, а «можно или нельзя» проверяет сервер.
      - **Оптимистичная копия: показать изменение до ответа сервера**
        - Когда подходит: действие почти всегда успешно и безобидно — «добавить в избранное», «нравится».
        - Цена: если владелец отказал, изменение нужно откатить и сказать об этом человеку.
      - **Две равноправные копии с синхронизацией**
        - Когда подходит: почти никогда; только со специальными алгоритмами слияния.
        - Цена: конфликты, петли, трудные ошибки.

      Во всех вариантах, кроме последнего, клиент просит владельца о действии («уменьши на один»), а не присылает
      готовое значение; почему, подробно — в уроке «Чтение, запись и реакция интерфейса».

      Как устроены кэш и оптимистичные изменения, подробно разбирается в курсе 2, в уроках «Как устроен клиентский
      кэш» и «Оптимистичные обновления». Способы, которые позволяют нескольким копиям меняться одновременно и всё же
      сходиться, — в курсе 4, в теме «Совместная работа».
      Для основ достаточно правила: копия может ошибаться, но должна знать, у кого спросить правильный ответ.

      ## Типичные ошибки

      - **Копия с устройства как истина.** Сохранённую в браузере копию серверных данных при запуске отправляют
        обратно на сервер — и воскрешают то, что человек удалил на другом устройстве.
      - **Записать чужие данные себе.** Корзина хранит цену, карточка заказа хранит имя ресторана, форма хранит копию
        профиля. Каждая такая запись — второй владелец, который не узнает об изменениях.
      - **Скопировать пропс в состояние** — второй владелец в миниатюре (урок «Компонент как контракт»).
      - **Синхронизировать в обе стороны** две копии через эффекты или подписки. Работает в демо и ломается при
        первом одновременном изменении или обрыве связи.
      - **Считать кэш владельцем.** Решать что-то важное по копии — «блюдо в наличии, значит, заказ пройдёт» —
        без проверки у сервера.
      - **Не назначить владельца вовсе.** Данные меняют три модуля, и на вопрос «где правильное значение?» в команде
        три разных ответа.

      ## Как спрашивают на интервью

      - «Кто в вашей системе источник истины для цены (статуса, корзины)?» — ждут конкретного ответа и объяснения,
        что делает клиент, если его копия разошлась с владельцем.
      - «Пользователь меняет данные на двух устройствах сразу — что произойдёт?» — проверяют, видите ли вы двух
        владельцев и как вы их избегаете.
      - «Что у вас хранится, а что вычисляется?» — мостик к теме следующего урока.

      ## Источники

      - [Sharing State Between Components: A single source of truth for each state — React (страница пока на английском)](https://ru.react.dev/learn/sharing-state-between-components#a-single-source-of-truth-for-each-state)
      - [Overview: Motivation — TanStack Query (серверными данными владеете не только вы)](https://tanstack.com/query/latest/docs/framework/react/overview)

  - id: sdb-derived
    topic: Архитектура состояния
    subtopic: Производное состояние и идентичность
    title: Вычислять или хранить
    body: |
      ## Какую проблему решаем

      В корзине сервиса доставки хранятся блюда, а рядом, «для удобства», ещё два поля: число блюд для значка в шапке
      и итоговая сумма. Каждый, кто меняет корзину, обязан обновить все три. Однажды разработчик добавляет кнопку
      «убрать всё сладкое» и забывает пересчитать сумму. В шапке два блюда, в корзине два блюда, а итог — как за три.

      А в истории заказов команда сделала наоборот: ничего не хранила, а сумму каждого старого заказа считала заново
      по текущему меню. Ресторан поднял цены, и у всех покупателей задним числом «подорожали» прошлые заказы. Суммы
      в истории перестали совпадать с чеками и со списанием по карте.

      Две ошибки противоположны. В первом случае сохранили то, что нужно было вычислять. Во втором вычисляли то, что
      нужно было сохранить. Этот урок о том, как отличать одно от другого, а заодно о двух близких вопросах: как
      узнавать «тот же самый» элемент списка и как хранить порядок, который задаёт человек.

      ## Производное, избыточное, снимок

      **Производное состояние** (derived state) — значение, которое можно в любой момент вычислить из другого
      состояния: итог корзины из блюд и цен, число непрочитанных писем из списка писем, отфильтрованный список
      ресторанов из полного списка и фильтра.

      **Избыточное состояние** (redundant state) — производное значение, которое зачем-то хранят отдельно. Документация
      React прямо советует его избегать: если значение можно посчитать из пропсов или состояния во время отрисовки,
      не храните его. Каждая такая переменная — копия, которую надо обновлять вместе с оригиналом, и рано или поздно
      кто-то забудет. Это частный случай второго владельца из урока «Кто главный по данным».

      **Снимок** (snapshot) — значение, которое намеренно зафиксировали в какой-то момент, чтобы оно больше не менялось
      вслед за источником. Цена в оформленном заказе — снимок: «купили по 490». Это не копия текущей цены, а новый
      факт о прошлом, и у него свой владелец — заказ.

      Отличить одно от другого помогает один вопрос: **если исходные данные изменятся, должно ли это значение
      измениться вместе с ними?**

      - Да — значение производное. Вычисляйте его. Итог корзины должен меняться, когда меняется корзина.
      - Нет — это отдельный факт. Сохраняйте его. Сумма прошлого заказа не должна меняться, когда меняется меню.

      Применим этот вопрос к значениям из сервиса доставки:

      - **Итог корзины**
        - Меняется вместе с источником: да.
        - Решение: вычислять из блюд и цен.
      - **Число блюд на значке в шапке**
        - Меняется вместе с источником: да.
        - Решение: вычислять из корзины.
      - **Список ресторанов с фильтром «грузинская»**
        - Меняется вместе с источником: да.
        - Решение: вычислять из полного списка и фильтра.
      - **Цена блюда в оформленном заказе**
        - Меняется вместе с источником: нет.
        - Решение: сохранить снимком в заказе.
      - **Адрес в оформленном заказе**
        - Меняется вместе с источником: нет, хотя адрес в профиле потом могут сменить.
        - Решение: сохранить снимком в заказе.

      ## А если вычислять дорого?

      Обычно вычисления дешёвые: сложить десяток цен — пустяк. Но бывает, что пересчёт заметен, например сортировка
      нескольких тысяч строк на каждое нажатие клавиши. Тогда результат **запоминают** (memoization, мемоизация):
      хранят его, пока не изменились исходные данные, и пересчитывают, только когда изменились. В React для этого
      есть `useMemo`. Документация React советует сначала измерить: если вычисление занимает около миллисекунды
      или больше, запоминать имеет смысл.

      Важно: запомненное значение остаётся производным. Оно привязано к исходным данным и пересчитывается вслед
      за ними, а не живёт своей жизнью, как избыточное поле в корзине.

      Бывает, что вычислить на клиенте просто нечем. Выручка ресторана за год считается из миллионов заказов, которых
      у клиента нет. Тогда считает сервер, а для клиента готовое число — обычные серверные данные из урока «Какое
      бывает состояние».

      ## Идентичность и позиция

      **Идентичность** (identity) — то, по чему элемент узнают как «тот же самый», где бы он ни оказался. Обычно это
      **идентификатор** (id): постоянный уникальный ключ, который выдаёт сервер или создаёт клиент при появлении
      элемента. **Позиция** — номер элемента в списке прямо сейчас. Она меняется, когда что-то вставили, удалили или
      отсортировали.

      Ошибки начинаются, когда позицию принимают за идентичность. Покупатель отметил в меню второе и пятое блюдо, чтобы
      сравнить их, и приложение запомнило «выбраны 2 и 5». Пока он смотрел, меню обновилось, наверху появилось новое
      блюдо. Теперь на местах 2 и 5 стоят другие блюда, и сравнение показывает не то. Если бы приложение запомнило
      идентификаторы блюд, перестановки ему бы не мешали.

      Похожую ошибку документация React разбирает на примере ключей списка (`key`). Она сравнивает ключи с именами
      файлов на рабочем столе: если бы файлы звали по порядку — первый, второй, третий, — то после удаления одного
      все остальные «переименовались» бы, а имя позволяет найти файл, как бы их ни переставляли. Поэтому индекс
      в массиве — плохой ключ, а идентификатор из базы данных — хороший. Где аналогия ломается: имя файла человек
      может поменять, а идентификатор элемента не меняется никогда. Подробнее — в разделе
      [«Почему React нужны ключи?»](https://ru.react.dev/learn/rendering-lists#why-does-react-need-keys).

      Из того же принципа следует ещё одно правило React: храните идентификатор выбранного элемента, а не копию
      самого элемента. Если в состоянии лежит объект «выбранное блюдо», а в меню у этого блюда поменялась цена,
      копия останется со старой. Если лежит `selectedDishId`, блюдо каждый раз находится в меню, и цена всегда
      свежая.

      ## Вложенные и нормализованные данные

      Сервер часто отдаёт данные **вложенными** (nested): внутри ресторана — разделы меню, внутри разделов — блюда.
      Так удобно показывать, но неудобно менять. Допустим, хачапури есть и в разделе «Популярное», и в разделе
      «Выпечка». Во вложенных данных это два одинаковых объекта. Ресторан ставит хачапури «закончилось», клиент
      обновляет один объект — и в другом разделе блюдо по-прежнему можно заказать.

      **Нормализованные данные** (normalized) устроены как таблицы в базе данных. Документация Redux описывает идею
      так:

      - у каждого типа данных своя «таблица»;
      - в таблице элементы лежат по идентификаторам;
      - другие элементы ссылаются на них только по идентификатору;
      - порядок задаётся массивом идентификаторов.

      ```js
      // Вложенные: одно блюдо в двух местах
      { sections: [
        { title: 'Популярное', dishes: [{ id: 'd7', name: 'Хачапури', soldOut: false }] },
        { title: 'Выпечка',    dishes: [{ id: 'd7', name: 'Хачапури', soldOut: false }] },
      ] }

      // Нормализованные: блюдо в одном месте, разделы ссылаются на него
      {
        dishes: { d7: { id: 'd7', name: 'Хачапури', soldOut: false } },
        sections: [
          { title: 'Популярное', dishIds: ['d7'] },
          { title: 'Выпечка',    dishIds: ['d7'] },
        ],
      }
      ```

      Теперь «закончилось» меняется в одном месте, и оба раздела видят это сразу. Документация Redux называет три
      беды вложенных данных: дубликаты трудно обновлять согласованно, код обновления глубоко вложенных объектов
      сложен, а изменение глубоко внутри может перерисовать компоненты, которые этих данных не показывают.

      Но нормализация не бесплатна: перед показом данные нужно собрать обратно, а код загрузки — разобрать ответ сервера
      по таблицам. Поэтому выбирают по тому, как данные **меняются**:

      - **Вложенные**
        - Подходят, когда: данные только показывают как пришли и целиком заменяют новым ответом; каждый элемент
          встречается один раз.
        - Пример: отзывы о ресторане — прочитали и показали.
        - Цена: если элемент всё же повторяется, дубликаты расходятся при обновлении.
      - **Нормализованные**
        - Подходят, когда: один элемент встречается в нескольких местах или элементы меняются по одному.
        - Пример: блюда меню, которые ресторан правит и которые стоят в нескольких разделах.
        - Цена: нужно разбирать ответ сервера по таблицам и собирать данные для показа.

      ## Порядок, который задаёт человек

      Отсортированный по цене список — производное: его вычисляют из блюд и выбранной сортировки. А вот порядок,
      в котором ресторан в своём кабинете расставил блюда, перетаскивая их мышкой, ниоткуда не вычислить. Это основные
      данные, и их надо хранить. Вопрос — как.

      **Наивный способ — номер по порядку.** У каждого блюда поле `position`: 1, 2, 3… Ресторан перетаскивает
      сороковое блюдо на первое место — и номера всех блюд с первого по тридцать девятое сдвигаются на единицу.
      Одна перестановка превращается в сорок изменений. Запрос большой, и если связь оборвётся посередине, на сервере
      останется наполовину перенумерованный список с двумя «третьими» блюдами.

      Есть три простых способа лучше.

      **Отправлять весь порядок целиком.** Клиент шлёт массив идентификаторов в новом порядке, сервер заменяет
      им старый одним действием. Половины обновления не бывает. Для раздела из десяти блюд это самый простой
      и вполне хороший вариант. Для тысячи элементов запрос становится тяжёлым.

      **Номера с промежутками.** Номера раздают через десять: 10, 20, 30. Чтобы поставить блюдо между 10 и 20, ему дают
      15 — меняется одно блюдо. Когда промежутки кончаются (между 15 и 16 места нет), список изредка перенумеровывают
      целиком.

      **Дробные позиции** (fractional indexing). Новая позиция — середина между соседями. Блюда А, Б, В и Г стоят
      на позициях 1, 2, 3 и 4. Блюдо Г перетаскивают между А и Б — оно получает позицию 1,5, середину между 1 и 2.
      Список сортируется по позиции, и порядок становится таким: А (1), Г (1,5), Б (2), В (3). На сервер уходит одно
      изменение: «у блюда Г позиция 1,5». Остальные блюда не трогают. Этот приём использует,
      например, Figma: там каждая позиция — дробь между 0 и 1, и перестановка меняет ровно одно значение.

      Цена в том, что у обычных чисел с плавающей точкой точность конечна. У числа double около 52 двоичных знаков
      после запятой, и каждая вставка между теми же соседями расходует примерно один. Посчитаем для нашего примера
      с позициями 1, 2, 3, 4: после полусотни вставок подряд в одно и то же место середину уже не получить — она
      совпадёт с одним из соседей. Это оценка для нашего примера, в статье Figma такого числа нет. Поэтому Figma хранит позиции строками
      произвольной длины, а другие системы время от времени перенумеровывают список.

      Сведём способы вместе.

      - **Номер по порядку**
        - Что меняется при перестановке: все элементы между старым и новым местом.
        - Цена: большие запросы, при обрыве — список, перенумерованный наполовину.
      - **Весь порядок целиком**
        - Что меняется при перестановке: весь список уходит одним запросом.
        - Цена: тяжело для длинных списков.
      - **Номера с промежутками**
        - Что меняется при перестановке: обычно один элемент.
        - Цена: иногда нужна перенумерация.
      - **Дробные позиции**
        - Что меняется при перестановке: один элемент.
        - Цена: кончается точность — позиции хранят строками или иногда перенумеровывают.

      Отдельная тема — что делать, если два человека переставляют один список одновременно: оба могут поставить
      блюдо в одну и ту же середину. Это задача совместного редактирования, она разбирается в курсе 4, в теме «Совместная работа».

      ## Типичные ошибки

      - **Хранить итог рядом с данными.** Сумма, счётчик, отфильтрованный список лежат отдельными полями и расходятся
        с исходными данными при первом забытом обновлении.
      - **Пересчитывать то, что должно быть снимком.** Старые заказы, счета, квитанции считаются по текущим ценам —
        и прошлое меняется задним числом.
      - **Запоминать позицию вместо идентификатора.** Выбранные, раскрытые, отмеченные элементы хранят номерами
        в списке, и после вставки или сортировки отмечены другие.
      - **Хранить копию выбранного объекта.** В состоянии лежит объект целиком, а не его id, и он не видит изменений.
      - **Нормализовать всё подряд.** Отзывы, которые только читают, разбирают по таблицам — сложность без выигрыша.
      - **Не нормализовать то, что повторяется и меняется.** Одно блюдо в трёх местах обновляется в одном.
      - **Хранить ручной порядок номерами подряд** — и переписывать весь список при каждом перетаскивании.

      ## Как спрашивают на интервью

      - «Какую модель данных вы бы выбрали для этого экрана?» — ждут, что вы назовёте сущности, их идентификаторы,
        что хранится, а что вычисляется, и почему данные нормализованы или нет.
      - «Как хранить порядок карточек на доске, которые пользователь перетаскивает?» — классический вопрос
        к задаче «спроектируйте Trello».
      - «Что будет с историей заказов, если цена изменится?» — проверяют, отличаете ли вы производное от снимка.

      ## Источники

      - [Choosing the State Structure: Avoid redundant state, Avoid duplication in state — React (страница пока на английском)](https://ru.react.dev/learn/choosing-the-state-structure#avoid-redundant-state)
      - [Normalizing State Shape — Redux](https://redux.js.org/usage/structuring-reducers/normalizing-state-shape)
      - [Realtime Editing of Ordered Sequences — Figma (дробные позиции)](https://www.figma.com/blog/realtime-editing-of-ordered-sequences/)

  - id: sdb-lifetime
    topic: Архитектура состояния
    subtopic: Время жизни состояния и навигация
    title: Что переживает перезагрузку
    body: |
      ## Какую проблему решаем

      Вечер, покупатель выбирает ужин с телефона. В списке ресторанов он отметил «пицца» и «привезут за 30 минут»,
      открыл понравившийся ресторан, передумал и нажал «Назад». Фильтры сбросились, список снова показывает все
      четыреста ресторанов. Он настраивает их заново и отправляет ссылку на подборку другу — у друга открывается
      список без фильтров.

      Наконец, заказ собран. На экране оформления покупатель пишет курьеру длинный комментарий: «Домофон не
      работает, позвоните, подъезд со двора, код от калитки…» Кода он не помнит и уходит в мессенджер, где ему
      присылали код. Через пять минут возвращается в браузер — страница загружается заново, комментарий пропал.

      Ни в одном из этих случаев в коде нет ошибки в обычном смысле: всё работает так, как написано. Просто никто
      не решил заранее, **что должно пережить** «Назад», ссылку другу и уход в другое приложение. Это решение
      и есть тема урока.

      ## Время жизни состояния

      В уроке «Какое бывает состояние» мы разложили состояние по двум осям: кто им владеет и сколько оно живёт.
      Здесь разберём вторую ось подробно.

      **Время жизни состояния** (state lifetime) — то, до какого события значение остаётся на месте: до закрытия
      шторки, до ухода с экрана, до перезагрузки, до закрытия вкладки или навсегда. Время жизни задаёт не тип данных,
      а **место хранения**. Одна и та же строка «пицца» в переменной компонента исчезнет при уходе с экрана, а в адресе
      страницы — переживёт и перезагрузку, и пересылку ссылки.

      Поэтому проектирование идёт в таком порядке: сначала для каждого кусочка состояния решают, какие события он
      должен пережить, и только потом выбирают, где его держать.

      ## Пять событий, которые случаются со страницей

      Вот события, о которых стоит подумать для каждого кусочка состояния.

      1. **Перезагрузка** (refresh). Человек нажал «Обновить», потянул страницу вниз на телефоне или браузер сам
         загрузил её заново. Вся память JavaScript стирается: состояние компонентов, общее хранилище вроде Redux,
         незавершённые запросы.
      2. **«Назад» и «Вперёд»** (back/forward). Внутри одностраничного приложения страница при этом не загружается
         заново: меняется только адрес, и роутер показывает экран, который этому адресу соответствует. Экран, с которого
         ушли, при этом убран со страницы, и состояние его компонентов пропало. Общее хранилище в памяти остаётся.
      3. **Открытие ссылки.** Человек открыл ссылку в новой вкладке, прислал её другу или открыл закладку через неделю.
         Новая страница получает только адрес — и то, что сервер отдаст по этому адресу.
      4. **Уход во вкладку или приложение и обратно.** Пока страница в фоне, браузер может её заморозить, а потом
         и выгрузить из памяти. Тогда при возвращении она загружается заново, как при перезагрузке. Подробно — ниже,
         это самое коварное событие.
      5. **Закрытие вкладки или браузера.** Пропадает всё, что жило во вкладке; остаётся только то, что записано
         в долговременное хранилище браузера или на сервер.

      ### Где что переживает какое событие

      Пройдём по местам хранения — от самого короткоживущего к самому долговечному.

      - **Состояние компонента** (`useState`)
        - Переживает: только уход во вкладку и обратно, если браузер не выгрузил вкладку. Даже «Назад» внутри
          приложения не переживает, если экран при уходе убран со страницы.
        - В ссылку: не попадает.
      - **Общее хранилище в памяти** (Redux, Zustand, контекст)
        - Переживает: «Назад» и «Вперёд» внутри приложения и уход во вкладку и обратно, если вкладку не выгрузили.
        - Не переживает: перезагрузку, выгрузку фоновой вкладки, закрытие; в ссылку не попадает.
      - **Адрес страницы**
        - Переживает: перезагрузку, «Назад» (у каждой записи истории свой адрес), выгрузку фоновой вкладки.
        - Переходит: вместе со ссылкой — в новую вкладку, к другу, в закладку.
        - При закрытии вкладки: из вкладки пропадает, но живёт в закладках и присланных ссылках.
      - **`sessionStorage`**
        - Переживает: перезагрузку, «Назад», выгрузку фоновой вкладки.
        - Не переходит: в новую вкладку и по ссылке — у новой вкладки своё хранилище.
        - При закрытии вкладки: очищается.
      - **`localStorage` и IndexedDB**
        - Переживают: всё, включая закрытие браузера.
        - Переходят: только во вкладки того же браузера на том же устройстве; друг по ссылке их не увидит.
      - **Сервер**
        - Переживает: всё — если данные успели туда отправить.
        - Переходит: на любое устройство и к любому, кому сервер их покажет.

      Пара пояснений к этому списку.

      **`sessionStorage`** — хранилище браузера, которое живёт, пока открыта вкладка. По документации MDN, оно
      переживает перезагрузку и восстановление страницы, а при закрытии вкладки очищается. Открытие той же страницы
      в новой вкладке начинает новую сессию — рассчитывать там на данные старой вкладки нельзя. Исключение — вкладка,
      которую открыла наша же страница (например, через `window.open`): она начинает с копии хранилища открывшей
      страницы, но дальше копии живут независимо, и изменения одной не видны в другой.

      **`localStorage` и IndexedDB** хранят данные и после закрытия браузера, но только на этом устройстве и в этом
      браузере. Друг по ссылке их не увидит, а сам человек не увидит их на компьютере. Как выбирать между хранилищами
      браузера по объёму и надёжности, разбирается во втором курсе, в уроке «Работа без сети и очередь действий».

      Отдельный случай — когда человек ушёл из приложения на другой сайт, а потом вернулся кнопкой «Назад». Браузер
      может достать нашу страницу из **кэша «назад-вперёд»** (back/forward cache) — целиком, вместе со всей памятью
      JavaScript, будто человек никуда не уходил. А может и загрузить её заново, как при перезагрузке. Рассчитывать
      на первое нельзя.

      ## Фоновая вкладка: заморозка и выгрузка

      Многие уверены: переключился на другую вкладку и вернулся — приложение продолжает работать с того же места.
      На компьютере так обычно и бывает. Но это неполная правда, и на телефоне она подводит постоянно.

      Браузер бережёт батарею, процессор и память. Документация Chrome о жизненном цикле страницы (Page Lifecycle
      API) описывает, через какие состояния проходит вкладка:

      | Состояние | Что происходит |
      |---|---|
      | Активна (active) | Страница видна, у неё фокус ввода |
      | Скрыта (hidden) | Человек ушёл в другую вкладку, свернул браузер или переключился в другое приложение. Код ещё работает |
      | Заморожена (frozen) | Браузер приостановил таймеры и обработку ответов на запросы. Код стоит |
      | Выгружена (discarded) | Браузер стёр страницу из памяти, чтобы освободить ресурсы. Вкладка с заголовком остаётся в списке, но страницы за ней нет |

      Из этого следуют три важные вещи.

      **Выгруженную страницу при возвращении загружают заново.** Для человека это выглядит как перезагрузка, которую
      он не просил: всё, что жило только в памяти, пропало. Адрес и `sessionStorage` при этом остаются — Chrome прямо
      советует сохранять в `sessionStorage` то, что нужно восстановить после такой загрузки, например позицию
      прокрутки.

      **В момент выгрузки ваш код не запускается.** Документация Chrome подчёркивает, что выгрузку нельзя заметить
      изнутри страницы: браузер не будит замороженную страницу ради прощального обработчика. События `beforeunload`
      и `unload` на телефоне тоже ненадёжны: например, они не срабатывают, когда человек смахивает браузер из списка
      открытых приложений.

      Зато после новой загрузки страница может узнать, что её выгружали: в Chrome для этого есть свойство
      `document.wasDiscarded`. По нему удобно решить, восстанавливать ли черновик из `sessionStorage`, и сказать
      человеку: «Мы восстановили ваш комментарий».

      **Последний надёжный момент — переход в «скрыта».** Chrome советует считать скрытое состояние вероятным концом
      сессии пользователя и в этот момент сохранять всё несохранённое. Узнать о нём можно по событию
      `visibilitychange`:

      ```js
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') {
          sessionStorage.setItem('checkout-draft', JSON.stringify(draft));
        }
      });
      ```

      Ещё надёжнее сохранять ввод сразу, по мере набора, — тогда не нужно ловить никакой момент. А событие скрытия
      остаётся страховкой.

      Отсюда правило: **всё, что человек ожидает увидеть, вернувшись к вкладке, нельзя держать только в памяти.**
      Комментарий курьеру из начала урока пропал именно поэтому: он жил в состоянии компонента, а браузер выгрузил
      вкладку, пока покупатель искал код в мессенджере.

      Заморозка влияет и на данные. Пока вкладка заморожена, таймеры стоят, поэтому периодический опрос сервера тоже
      останавливается. Вернувшись, человек может увидеть устаревший статус заказа, пока приложение не запросит свежий.

      ## Адрес страницы как контракт

      **Адрес страницы** (URL) — единственное состояние на клиенте, которое переживает все события из списка выше, кроме закрытия
      вкладки, и при этом переходит к другому человеку вместе со ссылкой. Поэтому в адрес кладут то, что человек
      захочет переслать, сохранить в закладки или вернуть кнопкой «Назад»:

      - поисковый запрос, фильтры, сортировку, номер страницы;
      - выбранную вкладку на экране;
      - открытую сущность: ресторан, блюдо в шторке, заказ.

      Список ресторанов с фильтрами из начала урока мог бы выглядеть так:

      ```text
      /restaurants?cuisine=pizza&maxTime=30&sort=rating
      ```

      Тогда «Назад» со страницы ресторана вернёт этот адрес, а экран списка прочитает из него фильтры и покажет то же,
      что было. Друг по ссылке тоже увидит пиццу за 30 минут.

      ### Что в адрес не кладут

      - **Личные и секретные данные:** адрес доставки, телефон, токены. Адрес попадает в историю браузера, в журналы
        серверов, в аналитику и может уйти на чужой сайт вместе со ссылкой.
      - **Мимолётное:** наведение мыши, раскрытую подсказку, текст, который человек ещё набирает в форме.
      - **Большие объекты.** В адресе — короткие значения и идентификаторы (`dish=42`), а не всё блюдо целиком.

      ### Почему «контракт»

      Как только ссылками начали делиться, формат адреса становится **контрактом** — обещанием, на которое опираются
      другие: друзья с присланными ссылками, закладки, письма с рассылкой, поисковики. Переименовали параметр
      `cuisine` в `kitchen` — и все старые ссылки молча показывают список без фильтров. Поэтому:

      - старые параметры продолжают понимать, даже когда появились новые;
      - незнакомое или неверное значение (`maxTime=abc`) не ломает экран, а заменяется значением по умолчанию;
      - значения по умолчанию в адрес не пишут: так ссылки короче и не меняются, если поменяется умолчание.

      Подробнее о маршрутах, глубоких ссылках и границах загрузки данных при навигации — в третьем курсе, в теме
      «Рендеринг и доставка».

      ### Добавить запись или заменить

      Роутер меняет адрес без перезагрузки страницы через History API браузера. Знать два его метода полезно, потому
      что от выбора между ними зависит, как будет работать «Назад»:

      - **`history.pushState`** добавляет новую запись в историю. «Назад» вернёт предыдущую.
      - **`history.replaceState`** заменяет текущую запись. «Назад» уйдёт туда, откуда пришли до неё.

      Когда человек нажимает «Назад» или «Вперёд», браузер сообщает об этом событием `popstate`, и роутер показывает
      экран для нового адреса. Сами `pushState` и `replaceState` страницу не загружают — они только меняют адрес.

      Правило выбора простое: новая запись — для того, что человек считает отдельным шагом (открыл ресторан, перешёл
      на вторую страницу результатов). Замена — для уточнений на том же шаге. Классический пример — поиск, который
      обновляет результаты по мере ввода. Если на каждую букву делать `pushState`, то после запроса «маргарита»
      человеку придётся нажать «Назад» около десятка раз — по одному на каждую букву, — чтобы уйти со страницы поиска. С `replaceState` адрес всё время
      совпадает с тем, что на экране, а история не засоряется.

      ## Черновик и серверная истина

      **Черновик** (draft) — то, что человек ввёл, но ещё не отправил или что сервер ещё не подтвердил: комментарий
      курьеру, правка в профиле, недописанный отзыв. **Серверная истина** — то, что сохранено на сервере и считается
      действительным для всех: адрес в профиле, опубликованный отзыв, оформленный заказ. В уроке «Кто главный по
      данным» мы говорили, что у каждого вида данных должен быть один владелец. Черновик — особый случай: пока он
      не отправлен, им владеет человек на этом устройстве, а не сервер.

      Путать их опасно в обе стороны:

      - **черновик записали поверх серверных данных** — и в профиле оказался недописанный адрес, который человек
        никогда не подтверждал;
      - **свежие серверные данные записали поверх черновика** — и пока человек печатал, пришёл ответ сервера, и его
        ввод исчез.

      Поэтому черновик держат **отдельно** от серверной копии данных и соблюдают несколько правил.

      - **Помнят, с какой версии начат черновик.** Если человек начал править профиль, а потом вернулся через день,
        сервер мог измениться — например, адрес поправили с другого устройства. Зная исходную версию, приложение
        заметит это и покажет: «Пока вас не было, адрес изменился. Оставить ваш вариант или новый?» Молча выбросить
        черновик или молча записать его поверх — одинаково плохо. Как устроены версии и разрешение конфликтов,
        подробно разбирается во втором курсе, в уроке «Версии и конфликты».
      - **Показывают, что это черновик.** Человек должен видеть разницу между «сохранено» и «набрано, но не
        отправлено».
      - **Удаляют черновик, когда сервер подтвердил сохранение.** Иначе при следующем открытии формы человек увидит
        старый текст, который уже давно отправлен.

      Где хранить черновик, зависит от того, сколько он должен прожить:

      | Черновик должен пережить | Где хранить |
      |---|---|
      | Перезагрузку и выгрузку фоновой вкладки | `sessionStorage` |
      | Закрытие браузера, возвращение завтра | `localStorage` или IndexedDB |
      | Переход на другое устройство | На сервере, как отдельную сущность «черновик» |

      Последний вариант самый дорогой: нужен API, хранение и правила, когда черновик удаляется. Его выбирают, только
      если требование действительно звучит как «начал на телефоне — закончил на компьютере».

      Есть и данные, которые не сохраняют нигде. Номер карты вводится в форме платёжного сервиса, и приложение
      доставки его не хранит — ни в памяти дольше нужного, ни тем более в хранилище браузера. Сохранить «на всякий
      случай» здесь значит создать утечку.

      ## Пример целиком: от списка ресторанов до оформления

      Разложим состояние двух экранов сервиса доставки — списка ресторанов и оформления заказа.

      - **Фильтры и сортировка**
        - Должно пережить: перезагрузку, «Назад», ссылку.
        - Где хранить: в адресе.
      - **Блюдо в шторке**
        - Должно пережить: «Назад», ссылку на блюдо.
        - Где хранить: в адресе, `?dish=42`.
      - **Прокрутка списка**
        - Должно пережить: «Назад» со страницы ресторана.
        - Где хранить: восстанавливает браузер или роутер.
      - **Подсказка «что значит рейтинг»**
        - Должно пережить: ничего.
        - Где хранить: в компоненте.
      - **Комментарий курьеру**
        - Должно пережить: перезагрузку, выгрузку вкладки.
        - Где хранить: в `sessionStorage`.
      - **Номер карты**
        - Должно пережить: ничего.
        - Где хранить: нигде.
      - **Статус заказа**
        - Должно пережить: всё, на любом устройстве.
        - Где хранить: на сервере.
      - **Признак «отправляем…»**
        - Должно пережить: ничего.
        - Где хранить: в памяти.

      Несколько строк требуют пояснения. Блюдо кладут в адрес по двум причинам: на телефоне люди ждут, что «Назад»
      закроет шторку, и ссылкой на блюдо делятся. Комментарий курьеру записывают в `sessionStorage` при каждом
      изменении и ещё раз при переходе страницы в «скрыта», а после отправки заказа удаляют. Номер карты вводится
      в форме платёжного сервиса, и приложение доставки его не хранит. Статус заказа после загрузки страницы
      запрашивается у сервера заново.

      Обратите внимание на две последние строки. Статус заказа и признак «отправляем» — не то, что нужно сохранять
      на устройстве: истина о заказе живёт на сервере. Если страница загрузилась заново посреди отправки, приложение
      не должно ни показывать вечный «отправляем…», ни молча забывать о заказе. Оно спрашивает сервер, что с заказом,
      и показывает ответ. О том, как описывать такие процессы по шагам, — следующий урок, «Процесс как набор
      состояний».

      Почему комментарий курьеру хранится в `sessionStorage`, а не в `localStorage`? Он нужен, пока человек оформляет
      этот заказ в этой вкладке. Если он закрыл вкладку и вернулся завтра, вчерашний комментарий, скорее всего,
      неактуален. Если бы требование было другим — «люди часто бросают оформление и возвращаются на следующий день» —
      выбор поменялся бы на `localStorage`.

      ## Варианты и их цена

      Что переживает каждое место, сказано в списке выше. Здесь — когда его выбирать и чем за него платят.

      - **Компонент**
        - Когда подходит: мимолётное — подсказки, наведение.
        - Цена: пропадает первым.
      - **Хранилище в памяти**
        - Когда подходит: общее для экранов одной вкладки.
        - Цена: тоже временное, и об этом легко забыть.
      - **Адрес**
        - Когда подходит: то, чем делятся и куда возвращаются.
        - Цена: формат становится контрактом; личное класть нельзя.
      - **`sessionStorage`**
        - Когда подходит: черновик одной вкладки.
        - Цена: сохранять вовремя, чистить после отправки.
      - **`localStorage`, IndexedDB**
        - Когда подходит: должно дожить до завтра.
        - Цена: старое копится, вкладки мешают друг другу.
      - **Сервер**
        - Когда подходит: нужно на других устройствах.
        - Цена: API, хранение, запросы.

      Данные в `localStorage` и IndexedDB тоже не вечны: человек может очистить данные сайта, а браузер — сам вытеснить
      их при нехватке места. И ещё одна ловушка: если человек открыл оформление в двух вкладках, обе пишут
      в одно хранилище и затирают черновики друг друга. Как вкладкам договариваться, разбирается в четвёртом курсе,
      в теме «Согласованность между клиентами».

      ## Типичные ошибки

      - **Фильтры и поиск только в памяти.** «Назад» сбрасывает их, ссылка другу открывает не то, закладка бесполезна.
      - **Вера в то, что фоновая вкладка живёт вечно.** Ввод держат только в памяти, а на телефоне браузер выгружает
        вкладку, и человек теряет написанное.
      - **Сохранение в `beforeunload` или `unload`.** На телефоне эти события часто не срабатывают; сохранять нужно
        по мере ввода и при переходе страницы в «скрыта».
      - **`pushState` на каждую букву поиска.** История засоряется, и «Назад» перестаёт уводить со страницы.
      - **Личные данные в адресе.** Телефон или адрес доставки оседает в истории, журналах и аналитике.
      - **Черновик поверх серверных данных или наоборот.** Человек видит неподтверждённые данные как сохранённые
        или теряет ввод при обновлении с сервера.
      - **Черновик не удаляют после отправки.** Через неделю форма встречает человека давно отправленным текстом.
      - **Всё подряд в `localStorage` «на всякий случай».** Данные живут дольше, чем нужно, путаются между вкладками,
        а секреты оседают на устройстве.

      ## Как спрашивают на интервью

      - «Пользователь настроил фильтры, открыл товар и вернулся назад. Что он должен увидеть и как вы это обеспечите?»
      - «Человек пишет длинное сообщение на телефоне и уходит в другое приложение. Как не потерять текст?» Здесь ждут
        упоминания, что фоновую вкладку браузер может выгрузить, и сохранения при переходе в скрытое состояние.
      - «Какое состояние этого экрана вы положите в адрес, а какое — нет? Почему?»

      ## Источники

      - [Page Lifecycle API: состояния страницы и рекомендации для каждого из них — Chrome for Developers](https://developer.chrome.com/docs/web-platform/page-lifecycle-api#developer_recommendations_for_each_state)
      - [Работа с History API: pushState, replaceState и событие popstate — MDN](https://developer.mozilla.org/ru/docs/Web/API/History_API/Working_with_the_History_API)
      - [Window.sessionStorage: сколько живут данные сессии страницы — MDN (на английском: русский перевод отстаёт)](https://developer.mozilla.org/en-US/docs/Web/API/Window/sessionStorage)

  - id: sdb-workflow
    topic: Архитектура состояния
    subtopic: Моделирование процессов
    title: Процесс как набор состояний
    body: |
      ## Какую проблему решаем

      Экран оформления заказа в сервисе доставки написан «как обычно». Пока заказ отправляется, `isSubmitting`
      равен `true`. Если сервер ответил успехом — `isSuccess`, если ошибкой — `isError`. Через месяц в поддержку
      приходят жалобы:

      - на экране одновременно висят зелёное «Заказ оформлен» и красное «Не удалось оформить заказ»;
      - кнопка «Оформить заказ» снова становится активной, пока заказ ещё отправляется, и люди нажимают её второй раз;
      - связь пропала посреди оформления, приложение показало «Ошибка, попробуйте ещё раз» — человек попробовал,
        и в системе появилось два одинаковых заказа; оба он потом оплатил.

      Каждый баг по отдельности чинится одной строкой: где-то забыли сбросить флаг, где-то не проверили его перед
      нажатием. Но новые появляются быстрее, чем чинятся старые. Причина не в невнимательности, а в том, как описан
      процесс: набор независимых флагов разрешает сочетания, которых в жизни не бывает. Урок о том, как описать процесс
      так, чтобы таких сочетаний просто не было.

      ## Состояние, событие, переход

      **Процесс** (workflow) — последовательность шагов, через которые проходит операция или сущность: оформление
      заказа, загрузка файла, жизнь заказа от создания до доставки. Чтобы описать процесс, нужны четыре понятия.

      - **Состояние** (state) — в каком положении процесс находится сейчас и чего он ждёт. «Заказ отправляется,
        ждём ответа сервера». В каждый момент процесс находится ровно в одном состоянии.
      - **Событие** (event) — то, что случилось и может сдвинуть процесс: человек нажал «Оформить заказ», сервер
        ответил, вышло время ожидания. Состояние — это «где мы», событие — «что произошло».
      - **Переход** (transition) — правило «в этом состоянии по этому событию переходим вот в то». Из «Отправки» по
        событию «сервер ответил успехом» — в «Оформлен». У перехода может быть **условие** (guard): «по нажатию
        «Оформить заказ» переходим в «Отправку», только если адрес заполнен».
      - **Инвариант** (invariant) — утверждение, которое верно в любой момент жизни процесса. «Отменённый заказ
        никогда не становится доставленным». «У заказа в пути всегда есть курьер».

      Важное следствие: если для события в текущем состоянии нет перехода, событие ничего не меняет. Второе нажатие
      «Оформить заказ» во время отправки не создаёт второго заказа не потому, что кто-то не забыл заблокировать
      кнопку, а потому, что в состоянии «Отправка» по этому нажатию никуда перейти нельзя.

      ## Конечный автомат

      **Конечный автомат** (finite state machine, сокращённо FSM, или просто state machine) — способ описать процесс
      как конечный список состояний, начальное состояние и переходы между ними. Сайт statecharts.dev определяет его
      как абстрактную машину, которая в любой момент находится ровно в одном из конечного числа состояний.

      У автомата есть:

      - **начальное состояние** — с него процесс начинается;
      - **конечные состояния** (final states) — из них переходов нет, процесс завершён: «Доставлен», «Отменён»;
      - **таблица переходов** — для каждого состояния список событий, на которые оно реагирует, и куда они ведут.

      Слово «автомат» пугает, но вы уже пишете автоматы, когда в React заводите поле `status` со значениями
      `'idle' | 'loading' | 'done'`. Разница в том, записаны ли переходы явно или разбросаны по обработчикам.

      ## Невозможные сочетания флагов

      Вернёмся к оформлению заказа. Флагов четыре: `isSubmitting`, `isSuccess`, `isError` и ещё `isUnknown` —
      о нём ниже. Каждый флаг может быть `true` или `false`, значит, сочетаний 2 × 2 × 2 × 2 = 16. Осмысленных из них
      пять: все флаги выключены (человек заполняет форму) и по одному включённому флагу на каждый исход. Остальные
      одиннадцать — **невозможные состояния** (impossible states): «отправляется и уже успешно», «успешно и ошибка».
      Код их не запрещает, значит, рано или поздно одно из них случится.

      Документация React в статье «Реагирование на ввод с помощью состояния» (Reacting to Input with State) разбирает
      тот же случай: два флага дают четыре сочетания, а допустимых три. Совет оттуда — заменить флаги одним полем
      статуса, которое может принимать только допустимые значения.

      ```ts
      // Было: 16 сочетаний, допустимы 5
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isSuccess, setIsSuccess] = useState(false);
      const [isError, setIsError] = useState(false);
      const [isUnknown, setIsUnknown] = useState(false);

      // Стало: ровно 5 вариантов
      type Checkout =
        | { status: 'editing' }
        | { status: 'submitting' }
        | { status: 'rejected'; reason: string }
        | { status: 'unknown' }
        | { status: 'placed'; orderId: string };
      ```

      Заметьте вторую выгоду. Данные привязаны к состоянию: причина отказа `reason` существует только в состоянии
      `rejected`, номер заказа `orderId` — только в `placed`. Нельзя случайно показать номер заказа, которого нет,
      и TypeScript не даст обратиться к `orderId`, пока не проверен статус. В примере ниже мы дополним этот тип ещё
      двумя полями.

      ## Пример: оформление заказа

      Опишем оформление заказа автоматом. Этим процессом владеет клиент: он живёт на одной странице и заканчивается,
      когда сервер создал заказ. Сначала сервер создаёт заказ, и только потом покупатель его оплачивает; почему
      именно в таком порядке, разобрано в следующем уроке, «Чтение, запись и реакция интерфейса».

      Для каждого состояния перечислим события, на которые оно реагирует, и куда они ведут:

      - **Заполнение**
        - «Оформить заказ», адрес заполнен → Отправка.
      - **Отправка**
        - Сервер: заказ создан, ждёт оплаты → Оформлен.
        - Сервер: отказ (блюдо закончилось) → Отказ.
        - Ответа нет 15 секунд или оборвалась связь → Результат неизвестен.
      - **Отказ**
        - «Изменить» → Заполнение.
      - **Результат неизвестен**
        - Сервер: заказ найден → Оформлен.
        - Сервер: такого заказа нет → Заполнение с сообщением.
      - **Оформлен**
        - Конечное состояние: дальше переход к оплате.

      Самая важная строка — «Ответа нет». Если запрос ушёл, а ответ не пришёл, клиент **не знает**, создан ли заказ:
      запрос мог потеряться по дороге к серверу, а мог дойти, и тогда потерялся ответ. Это не «Отказ». Показать
      «Ошибка, попробуйте ещё раз» значит пригласить человека сделать второй заказ — именно так в начале урока
      появились два одинаковых заказа. Честное состояние — **«Результат неизвестен»**: приложение говорит «Проверяем,
      оформлен ли заказ» и спрашивает сервер.

      Чтобы сервер мог ответить на такой вопрос, клиент заранее прикладывает к заказу свой **идентификатор операции**
      (`operationId`) — случайную строку, которую он придумал до отправки. По ней сервер и ищет заказ.

      В документации платёжных сервисов и на собеседованиях такой идентификатор называют **ключом идемпотентности**
      (idempotency key). **Идемпотентной** называют операцию, повтор которой не меняет результат: второй запрос с тем же
      ключом не создаёт второй заказ, а возвращает уже созданный.

      Ответ «такого заказа нет» тоже не окончательный: исходный запрос мог задержаться в сети и дойти до сервера
      позже проверки. Поэтому, когда человек снова нажимает «Оформить заказ», клиент отправляет заказ **с тем же
      идентификатором**. Если первый запрос всё-таки дойдёт, сервер увидит знакомый идентификатор и не создаст второй
      заказ. Как сервер это обеспечивает, подробно разбирается во втором курсе, в уроке «Повторы без двойных списаний».

      С отказом по-другому. Отказ — окончательный ответ: сервер точно ничего не создал. Человек меняет корзину, и это
      уже новая попытка с новым идентификатором.

      Теперь тип состояния целиком — с идентификатором операции и сообщением для человека:

      ```ts
      type Checkout =
        | { status: 'editing'; operationId?: string; notice?: string }
        | { status: 'submitting'; operationId: string }
        | { status: 'rejected'; reason: string }
        | { status: 'unknown'; operationId: string }
        | { status: 'placed'; orderId: string };

      type CheckoutEvent =
        | { type: 'SUBMIT'; formValid: boolean; newOperationId: string }
        | { type: 'CREATED'; orderId: string }
        | { type: 'REJECTED'; reason: string }
        | { type: 'NO_RESPONSE' }
        | { type: 'EDIT' }
        | { type: 'FOUND'; orderId: string }
        | { type: 'NOT_FOUND' };
      ```

      Переходы удобно собрать в одну функцию. В React это редьюсер для `useReducer`:

      ```ts
      function checkout(state: Checkout, event: CheckoutEvent): Checkout {
        switch (state.status) {
          case 'editing':
            if (event.type === 'SUBMIT' && event.formValid) {
              // после «заказа нет» повторяем с прежним идентификатором
              return { status: 'submitting', operationId: state.operationId ?? event.newOperationId };
            }
            return state;
          case 'submitting':
            if (event.type === 'CREATED') return { status: 'placed', orderId: event.orderId };
            if (event.type === 'REJECTED') return { status: 'rejected', reason: event.reason };
            if (event.type === 'NO_RESPONSE') return { status: 'unknown', operationId: state.operationId };
            return state; // повторное «Оформить заказ» здесь ничего не меняет
          case 'rejected':
            if (event.type === 'EDIT') return { status: 'editing' }; // следующая попытка — новая
            return state;
          case 'unknown':
            if (event.type === 'FOUND') return { status: 'placed', orderId: event.orderId };
            if (event.type === 'NOT_FOUND') {
              return { status: 'editing', operationId: state.operationId, notice: 'Заказ не оформлен' };
            }
            return state;
          case 'placed':
            return state; // конечное состояние
        }
      }
      ```

      Новый идентификатор придумывает обработчик нажатия (например, `crypto.randomUUID()`) и передаёт в событии:
      редьюсер должен только вычислять следующее состояние, без случайных чисел внутри. Ради краткости в коде опущен
      ещё один случай: если после «заказа нет» человек поменял корзину, это уже другой заказ, и идентификатор нужно
      сбросить.

      Теперь весь процесс читается в одном месте. Чтобы узнать, что случится при втором нажатии «Оформить заказ»,
      не нужно искать по проекту все места, где меняется `isSubmitting`, — достаточно посмотреть на ветку
      `submitting`.

      ## Пример: статусы заказа

      У заказа есть и второй процесс — его жизнь после оформления. Этот автомат устроен иначе: им **владеет сервер**.
      Статус меняют разные участники — платёжный сервис, ресторан, курьер, поддержка, — и правила переходов проверяет
      сервер. Клиент покупателя только показывает текущий статус.

      ![Схема: статусы заказа «Создан», «Оплачен», «Готовится», «В пути», «Доставлен» идут цепочкой слева направо, под каждой стрелкой подписано событие и кто его вызывает; из «Создан», «Оплачен» и «Готовится» стрелки ведут вниз в «Отменён»; «Доставлен» и «Отменён» выделены как конечные состояния](images/sdb-order-states.png "Конечный автомат статусов заказа")

      | Из состояния | Событие и кто его вызывает | В состояние |
      |---|---|---|
      | Создан | Платёжный сервис подтвердил оплату | Оплачен |
      | Создан | Оплата не прошла или покупатель передумал | Отменён |
      | Оплачен | Ресторан принял заказ | Готовится |
      | Оплачен | Ресторан отклонил заказ | Отменён |
      | Готовится | Курьер забрал заказ | В пути |
      | Готовится | Поддержка отменила заказ | Отменён |
      | В пути | Курьер отметил доставку | Доставлен |

      Если ресторан отклонил оплаченный заказ, деньги покупателю возвращаются — это тоже работа сервера.

      У автомата есть инварианты, которые сервер обязан соблюдать:

      - «Доставлен» и «Отменён» — конечные: из них переходов нет, отменённый заказ не воскреснет;
      - из «В пути» отменить заказ нельзя: еда уже едет;
      - курьер не может отметить доставку заказа, который ещё не забрал.

      Теперь важная тонкость для клиента. Экран отслеживания опрашивает сервер раз в 30 секунд — это решили в уроке
      «Как превратить „быстро“ в цифры». За 30 секунд заказ может пройти два шага: оплата подтвердилась, и ресторан
      тут же принял заказ. В прошлый раз клиент получил «Создан», а сейчас — уже «Готовится». Клиент **пропустил**
      «Оплачен». Если клиент проверяет переходы по своей копии таблицы, он сочтёт ответ недопустимым и покажет
      ошибку — хотя ошибки нет.

      Отсюда правило: **автоматом, которым владеет сервер, клиент не управляет, а отображает его.** Клиент принимает
      статус, который прислал сервер, даже если не видел промежуточных шагов. Свои переходы клиент проверяет только
      в автоматах, которыми владеет сам, — как оформление заказа. Это то же правило единого владельца, что в уроке
      «Кто главный по данным»: правила переходов живут у владельца, а не в каждой копии.

      ## Состояние операции и то, как его показывает интерфейс

      Состояние — это факт о процессе: «заказ готовится», «результат неизвестен». Отображение — решение о том, как этот
      факт показать человеку. Это разные вещи, и их полезно держать отдельно.

      **Одно состояние — несколько отображений.** Статус «Готовится» на экране отслеживания — большая картинка
      с поваром и примерным временем, в списке заказов — серая подпись, в уведомлении на телефоне — короткая фраза.
      Все три показывают один факт и не должны друг другу противоречить.

      **Два состояния — одно отображение.** Продукт может решить, что покупателю незачем видеть разницу между
      «Оплачен» и «Готовится», и показывать в обоих случаях «Ресторан готовит ваш заказ». Но в модели это всё равно два
      состояния: из «Оплачен» ресторан ещё может отклонить заказ, а из «Готовится» отменить его может только поддержка.
      Если слить их в модели ради одинаковой надписи, потеряется правило.

      **Отображение не придумывает новых состояний процесса.** «Курьер почти у вас» на экране можно вычислить
      из статуса «В пути» и оставшегося времени — это отображение, а не новый статус заказа. А «показано уведомление
      об успехе» — вообще состояние интерфейса, а не заказа.

      **Каждое состояние операции заслуживает честного показа.** В «Отправке» кнопка неактивна и видно, что идёт
      работа. В «Результат неизвестен» — не красная ошибка, а «Проверяем, оформлен ли заказ». В «Отказ» — причина
      и что можно сделать. Как показывать загрузку, пустые данные, частичный успех и ошибки, подробно разбирается
      в уроке «Загрузка, пустота, ошибка и всё между ними».

      ## Варианты и их цена

      - **Несколько флагов**
        - Когда подходит: независимые признаки — «панель раскрыта», «тёмная тема».
        - Цена: зависимые флаги дают невозможные сочетания.
      - **Одно поле статуса**
        - Когда подходит: несколько взаимоисключающих шагов.
        - Цена: переходы разбросаны по обработчикам.
      - **Статус и редьюсер**
        - Когда подходит: отказы, повторы, несколько исходов.
        - Цена: нужно заранее выписать события и переходы.
      - **Библиотека автоматов**
        - Когда подходит: вложенные шаги, таймеры, параллельные части.
        - Цена: новая зависимость и новый способ мышления.

      Библиотеки автоматов — это, например, XState. Они опираются на **диаграммы состояний** (statecharts) —
      расширение конечных автоматов, в котором состояние может содержать свой вложенный автомат. Например,
      «Отправка» внутри делится на «проверяем корзину» и «создаём заказ». Этому посвящён сайт statecharts.dev.

      Для большинства экранов хватает одного поля статуса или статуса с редьюсером. Библиотеку берут, когда автомат перестал помещаться
      в одну понятную функцию, а не «на вырост».

      ## Типичные ошибки

      - **Флаг на каждый шаг.** `isLoading`, `isError`, `isSuccess` по отдельности — и на экране одновременно спиннер
        и сообщение об ошибке.
      - **Нет состояния «результат неизвестен».** Обрыв связи показывают как ошибку с кнопкой «Повторить», и человек
        делает второй заказ.
      - **Повтор с новым идентификатором.** Состояние «результат неизвестен» есть, но после ответа «заказа нет»
        клиент отправляет заказ как новый — и задержавшийся первый запрос создаёт дубль.
      - **Переходы разбросаны по обработчикам.** Чтобы понять, что произойдёт при двойном нажатии, приходится читать
        весь компонент.
      - **Клиент проверяет чужой автомат.** Статус с сервера отбрасывается как «недопустимый», потому что клиент
        пропустил промежуточный шаг между опросами.
      - **Модель подстроили под надписи.** Два состояния слили, потому что выглядят одинаково, и потеряли правило,
        которое их различало.
      - **Забыли конечные состояния.** Из «Отменён» можно случайно попасть обратно в «Готовится», потому что никто
        не записал, что это конец.

      ## Как спрашивают на интервью

      - «Нарисуйте состояния загрузки файла: что происходит при обрыве связи, отмене, повторе?»
      - «У вас в компоненте `isLoading` и `isError`. Что с этим не так и как бы вы это переписали?»
      - «Пользователь нажал „Оплатить“, а ответ не пришёл. Что вы ему покажете?»

      ## Источники

      - [Reacting to Input with State: экраны как набор состояний и отказ от «невозможных» сочетаний — React (страница пока на английском)](https://ru.react.dev/learn/reacting-to-input-with-state)
      - [What is a state machine? Что такое конечный автомат — statecharts.dev](https://statecharts.dev/what-is-a-state-machine.html)

  - id: sdb-read-write
    topic: Потоки данных и проектирование API
    subtopic: Чтение и запись
    title: Чтение, запись и реакция интерфейса
    body: |
      ## Какую проблему решаем

      Покупатель в сервисе доставки собрал корзину и нажал «Оформить заказ». Разработчик написал один обработчик
      нажатия: он сразу показывает надпись «Заказ оформлен!», отправляет запрос на сервер, а заодно пересчитывает сумму
      корзины и записывает её в общее хранилище данных приложения. Чаще всего всё работает. Но потом начинаются
      странности:

      - сервер отказал, потому что одно блюдо закончилось, а человек уже видел «Заказ оформлен!» и ушёл ждать курьера;
      - сумма на экране расходится с суммой в чеке: клиент посчитал её по старым ценам, а сервер — по новым;
      - сервер думал восемь секунд, человек не понял, что происходит, и нажал кнопку ещё раз.

      Все три беды растут из одного корня: в одном месте смешали три разные вещи. **Чтение** данных с сервера,
      **команду**, которая просит сервер что-то изменить, и **реакцию интерфейса**, которая случается на экране сразу,
      без всякого сервера. У каждой из них свои правила, и этот урок о том, как их разделять и в каком порядке
      выполнять.

      ## Три разных действия

      **Чтение** (query — «запрос») получает данные и ничего не меняет на сервере: загрузить меню ресторана, список
      прошлых заказов, текущий статус заказа. Чтение можно повторить сколько угодно раз — от этого ничего не случится,
      кроме лишней нагрузки. Результат чтения — данные, которые экран показывает.

      **Команда** (command) просит сервер изменить состояние: добавить блюдо в корзину, оформить заказ, отменить его.
      Команда может быть принята или отклонена: блюдо закончилось, ресторан закрылся, денег на карте не хватило.
      Повторить команду не всегда безопасно: повторное «Оплатить» может списать деньги дважды. Результат команды —
      прежде всего **исход**: получилось, не получилось, или ответ так и не пришёл и исход неизвестен.

      **Локальная реакция интерфейса** — то, что меняется на экране мгновенно и не требует сервера: кнопка стала
      неактивной, появилась надпись «Оформляем…», раскрылась шторка с выбором адреса. Это состояние интерфейса — оно
      живёт только в этой вкладке и никому, кроме этого экрана, не нужно (виды состояния разобраны в уроке «Какое бывает
      состояние»).

      Разделение чтения и команд придумал не фронтенд. Бертран Мейер, автор языка Eiffel, сформулировал принцип
      **разделения команд и запросов** (Command Query Separation, CQS): у объекта есть методы двух сортов — запросы,
      которые возвращают результат и не меняют наблюдаемое состояние, и команды, которые меняют состояние. Мартин
      Фаулер в статье об этом принципе объясняет, зачем он нужен: запросы можно вызывать свободно, в любом порядке
      и сколько угодно раз, а с командами нужно обращаться осторожно. Он же честно показывает исключение: операция
      «снять верхний элемент со стопки» (pop) одновременно и меняет стопку, и возвращает элемент — и это удобно.

      Во фронтенде то же исключение встречается постоянно: команда «оформить заказ» обычно возвращает созданный заказ
      с его номером. Это нормально. Важно другое: команда остаётся командой, даже если что-то вернула, а чтение не
      должно ничего менять.

      Не путайте CQS с похожим по названию **CQRS** (Command Query Responsibility Segregation) — это когда для чтения
      и для записи на сервере заводят две разные модели данных. Фаулер предупреждает, что для большинства систем CQRS
      добавляет рискованную сложность. Фронтенду он не нужен, чтобы разделять чтение и команды.

      ## Как это выглядит в HTTP

      В протоколе HTTP разделение уже заложено. Спецификация HTTP (RFC 9110) называет методы GET, HEAD, OPTIONS
      и TRACE **безопасными** (safe): клиент, отправляя их, не просит и не ожидает никаких изменений на сервере. Из них
      для чтения данных во фронтенде используют GET. Поэтому браузер,
      поисковый робот или механизм предзагрузки могут отправить GET-запрос сами, без участия человека, — и ничего
      не должно сломаться. Изменения отправляют методами POST, PUT, PATCH и DELETE; что каждый из них означает, коротко
      описано в [справочнике методов HTTP на MDN](https://developer.mozilla.org/ru/docs/Web/HTTP/Reference/Methods).

      Отсюда первое практическое правило: **чтение — через GET, изменение — никогда через GET.** В RFC 9110 приведён
      пример того, что бывает иначе: адрес вида `page?do=delete` удаляет страницу, а робот, который обходит ссылки
      для поискового индекса, открывает его и удаляет всё подряд.

      ## Граница между клиентом, API и сервером

      Теперь разберёмся, кто за что отвечает, когда данные путешествуют между экраном и сервером. Здесь три участника.

      - **Клиентская модель** — то, как данные устроены внутри приложения на устройстве: копии серверных данных
        (меню, корзина), состояние интерфейса (открыта ли шторка), ввод человека (адрес, комментарий курьеру).
      - **API** (application programming interface, программный интерфейс) — договор между клиентом и сервером: какие
        чтения и команды существуют, что в них передаётся и что возвращается. Проектированию этого договора посвящён
        следующий урок.
      - **Бизнес-логика сервера** — правила, которые решают по существу: можно ли сделать заказ, сколько он стоит,
        есть ли блюдо в наличии, кому что разрешено.

      Главный принцип: **клиент предсказывает и подсказывает, сервер решает.** Клиент может посчитать итог корзины,
      чтобы показать его без запроса, или заранее предупредить, что до минимальной суммы не хватает 200 рублей. Но
      окончательная сумма к оплате, наличие блюд и право сделать заказ определяет сервер. Почему так, подробно —
      в уроке «Кто главный по данным»: у каждого вида данных один владелец, и для цен и наличия это сервер. Какие
      именно решения остаются за сервером — цена, наличие, однократность заказа, доступ, минимальная сумма — и как
      контракт API их называет, разберём в следующем уроке, «Контракт API глазами фронтенда».

      Чтобы подсказывать, клиенту не обязательно повторять серверное правило у себя. Часто удобнее, когда сервер
      присылает готовый признак вместе с данными: «заказ ещё можно отменить», «до минимальной суммы не хватает 200 ₽».
      Тогда правило живёт в одном месте, считается по серверным часам и серверным данным, а клиент только решает,
      показать ли кнопку. Если признак успел устареть, ничего страшного: сервер всё равно проверит команду и откажет,
      а экран объяснит почему.

      ### Команда несёт намерение, а не результат

      Из этой границы следует важное правило о том, что отправлять в команде. Команда описывает **намерение**
      человека — «добавь блюдо 42 в количестве двух штук», — а не результат, который клиент вычислил сам: «теперь
      в корзине три позиции на сумму 1 840 ₽».

      Почему результат отправлять нельзя? Представьте, что корзину открыли на двух устройствах: человек на телефоне,
      а кто-то из его семьи — на планшете в том же аккаунте. Оба видят в корзине одну позицию. Телефон добавляет пиццу и отправляет
      «в корзине теперь две позиции: суп и пицца». Планшет одновременно добавляет салат и отправляет «две позиции: суп
      и салат». Сервер сохраняет то, что пришло последним, — и пицца пропадает. Если бы каждый отправил намерение
      («добавь пиццу», «добавь салат»), сервер применил бы оба, и в корзине оказались бы все три блюда.

      Вторая причина — доверие. Код клиента работает на устройстве человека, и его можно изменить. Если сервер принимает
      от клиента готовую сумму, кто-нибудь однажды пришлёт сумму в один рубль.

      ## В каком порядке что происходит

      Действие пользователя, которое меняет данные, проходит одни и те же шаги. Путь самого действия по слоям
      приложения разобран в уроке «Куда текут данные»; здесь важен порядок во времени.

      1. **Человек нажал кнопку.**
      2. **Локальная реакция — сразу, за доли секунды.** Кнопка становится неактивной, на ней появляется «Оформляем…».
         Человек видит, что нажатие замечено, и не жмёт второй раз.
      3. **Команда уходит на сервер.**
      4. **Приходит ответ — один из трёх исходов:**
         - *успех* — экран показывает данные, которые вернул сервер, или перечитывает их;
         - *отказ* — экран объясняет причину и сохраняет всё, что человек ввёл;
         - *ответа нет* — исход неизвестен: возможно, сервер команду выполнил, а ответ потерялся по дороге.

      Третий исход коварнее всего. Пропавший ответ — не то же самое, что отказ: написать человеку «Заказ не оформлен»
      нельзя, ведь заказ мог оформиться. А повторить команду вслепую опасно: если она не идемпотентна, она может выполниться
      дважды. Как
      описать этот исход отдельным состоянием «результат неизвестен», показано в уроке «Процесс как набор состояний»,
      а как проектировать безопасные повторы — в курсе 2, в уроке «Повторы без двойных списаний».

      ### Три стратегии порядка

      Главный выбор — когда показать человеку результат: до ответа сервера или после.

      #### Дождаться сервера

      Это **пессимистичный интерфейс** (pessimistic UI).

      - Что видит человек: «Оформляем…», а потом результат.
      - Когда подходит: деньги, необратимые действия, действия, в которых сервер нередко отказывает.
      - Цена: человек ждёт, поэтому нужна понятная индикация ожидания.

      #### Показать сразу, подтвердить потом

      Это **оптимистичный интерфейс** (optimistic UI).

      - Что видит человек: результат мгновенно, а при отказе — откат с объяснением.
      - Когда подходит: частые, дешёвые, легко отменяемые действия, которые почти всегда удаются: «В избранное»,
        «Прочитано», «В архив».
      - Цена: нужно уметь откатить изменение и честно сообщить об отказе. Без отката экран будет показывать
        то, чего на сервере нет, а молчаливый откат озадачит человека: письмо, которое он только что убрал, снова
        во входящих — почему?

      #### Принять и обработать позже

      Это **асинхронная команда** (asynchronous command).

      - Что видит человек: «Принято, обрабатываем», а затем статус.
      - Когда подходит: долгие операции: подтверждение ресторана, формирование большого отчёта.
      - Цена: нужен способ узнать итог — статус, который клиент перечитывает, или уведомление.

      Оптимистичному интерфейсу посвящён отдельный урок курса 2 — «Оптимистичные обновления». Здесь достаточно правила:
      показывать результат до ответа сервера можно, только если отказ редок, а откат человек легко переживёт. Добавленное
      в избранное и вдруг пропавшее сердечко — мелочь. Надпись «Заказ оформлен!», которая через пять секунд сменилась
      на «Ошибка», — обман.

      Для третьей стратегии в HTTP есть специальный ответ — **202 Accepted** («принято»). RFC 9110 описывает его так:
      запрос принят к обработке, но обработка ещё не закончена, и неизвестно, будет ли он в итоге выполнен. Спецификация
      прямо называет этот ответ намеренно ни к чему не обязывающим: он не означает «готово». Поэтому в ответе 202 сервер
      обычно возвращает ссылку на статус операции, а клиент показывает «принято» и потом перечитывает статус
      ([описание 202 на MDN](https://developer.mozilla.org/ru/docs/Web/HTTP/Reference/Status/202)).

      ### Что ещё влияет на порядок

      - **Что блокировать.** Блокируют то, что зависит от команды: кнопку «Оформить» и состав корзины на время
        оформления. Остальной экран — прокрутку, просмотр меню — блокировать незачем.
      - **Что читать после команды.** После успешной команды экран показывает новые данные, а не старую копию.
        Если команда вернула обновлённый объект — берут его; если нет — перечитывают. Иначе человек добавит блюдо,
        а счётчик корзины останется прежним.
      - **Зависимые шаги.** Оплатить можно только созданный заказ: команда оплаты ждёт номер заказа из ответа на
        команду создания. Такие шаги идут строго друг за другом. Почему не наоборот — сначала списать деньги, потом
        создать заказ? Пока заказа нет, сервер не проверил наличие и не зафиксировал сумму. Если деньги уже списаны,
        а заказ не создался (блюдо закончилось, цена изменилась), их придётся возвращать. Создание первым закрепляет
        состав и сумму, и оплата идёт ровно за то, что сервер согласился выполнить.
      - **Быстрые повторные действия.** Если человек трижды подряд нажал «+» у блюда, три команды уйдут почти
        одновременно, а ответы могут прийти в другом порядке. Как не показать устаревший ответ поверх свежего —
        в курсе 2, в уроке «Гонки запросов».

      ## Пример целиком: оформление заказа

      Покупатель собрал корзину: суп за 450 ₽ и две пиццы по 695 ₽. Клиент сам посчитал итог из данных, которые раньше
      прислал сервер, и показывает его: 1 840 ₽. Вот что происходит после нажатия «Оформить заказ».

      **0 мс — локальная реакция.** Кнопка становится неактивной, на ней «Оформляем…». Изменить состав корзины нельзя,
      листать меню — можно.

      **10 мс — команда.** Клиент отправляет `POST /orders`. К этому моменту покупатель уже вошёл в аккаунт: войти
      нужно, чтобы оформить заказ, и после входа корзина хранится на сервере (почему так решили — в уроке «Как
      сравнивать решения»). Поэтому команда может просто сослаться на серверную корзину по её идентификатору. В теле —
      намерение и то, что видел человек:

      ```json
      {
        "operationId": "op-7c1d",
        "cartId": "c-81f2",
        "addressId": "a-17",
        "paymentMethod": "card",
        "shownTotal": 184000
      }
      ```

      Поле `shownTotal` — сумма, которую человек видел на экране, в копейках. Сервер не берёт её как цену, а сравнивает
      со своим расчётом: если цены успели поменяться, он не оформит заказ молча по новой цене, а откажет и сообщит
      новую сумму. Решает по-прежнему сервер, но человек не получит сюрприз в чеке.

      Поле `operationId` — **идентификатор операции**: случайная строка, которую клиент придумал до отправки, тот же
      идентификатор, что в уроке «Процесс как набор состояний». Если оформление придётся повторить, повтор пойдёт
      с тем же идентификатором операции, и сервер не создаст второй заказ. Как это устроено — в курсе 2, в уроке «Повторы без двойных списаний».

      **800 мс — ответ.** Сервер проверил наличие, сам посчитал сумму, создал заказ в статусе «создан» и вернул его:

      ```json
      {
        "orderId": "o-5521",
        "status": "created",
        "total": 184000
      }
      ```

      Клиент заменяет свою догадку данными сервера: итог теперь берётся из заказа, корзина очищается, экран переходит
      к оплате заказа `o-5521`. Оплата — следующая, зависимая команда: после неё заказ получает статус «оплачен».

      **Дальше — чтение.** Ресторан начинает готовить не сразу, а через минуту-другую. Это асинхронная часть: экран
      отслеживания раз в 30 секунд читает `GET /orders/o-5521` (так решили в уроке «Как превратить „быстро“
      в цифры») и показывает новый статус — «готовится», «в пути», «доставлен».

      **Что, если сервер отказал.** Ответ «пицца закончилась» — это отказ с понятной причиной. Экран возвращает
      человека в корзину, отмечает закончившееся блюдо и предлагает убрать его. Адрес и комментарий курьеру остаются
      на месте.

      **Что, если ответа нет 15 секунд.** Экран не пишет «Заказ не оформлен», а переходит в состояние «Проверяем,
      оформлен ли заказ» и спрашивает сервер, — подробно этот переход разобран в уроке «Процесс как набор состояний».

      ## Типичные ошибки

      - **Изменение через GET.** Предзагрузка, робот или повтор запроса браузером случайно меняют данные.
      - **Команда несёт результат, а не намерение.** Клиент присылает новую сумму или новый список целиком —
        и затирает одновременные изменения с другого устройства, а сервер вынужден верить чужим вычислениям.
      - **Успех до ответа сервера там, где отказ вероятен или дорог.** «Оплачено!» до подтверждения оплаты.
      - **Нет мгновенной реакции.** Кнопка выглядит так же, как до нажатия, и человек жмёт её снова.
      - **Блокировка всего экрана** на время одной небольшой команды.
      - **Старая копия после команды.** Команда прошла, а экран показывает то, что было до неё.
      - **Пропавший ответ считают отказом** и предлагают «попробовать ещё раз» — а заказ уже создан.

      ## Как спрашивают на интервью

      - «Пользователь нажимает "Отправить" — пройдите по шагам, что происходит в интерфейсе и в сети».
      - «Какие операции нужны этому экрану: что он читает, а что меняет?»
      - «Что вы покажете, пока сервер обрабатывает запрос, и что — если ответ не пришёл?»

      ## Источники

      - [Command Query Separation — Martin Fowler](https://martinfowler.com/bliki/CommandQuerySeparation.html)
      - [RFC 9110, HTTP Semantics: безопасные методы (раздел 9.2.1) и 202 Accepted (раздел 15.3.3)](https://www.rfc-editor.org/rfc/rfc9110.html#name-safe-methods)

  - id: sdb-api
    topic: Потоки данных и проектирование API
    subtopic: Проектирование контракта API
    title: Контракт API глазами фронтенда
    body: |
      ## Какую проблему решаем

      Команда сервиса доставки делает экран меню ресторана. Бэкенд уже готов, и вот что он отдаёт:

      - список блюд — отдельным запросом, без разделов: разделы «Пицца», «Супы», «Напитки» лежат в другом запросе,
        и клиент сам раскладывает блюда по ним;
      - цена — строкой `"695 руб."`, которую приходится разбирать, чтобы сложить итог корзины;
      - у добавок к блюду («двойной сыр», «без лука») нет идентификаторов — непонятно, как сообщить серверу, какую
        добавку выбрал человек;
      - отзывы приходят по 20 штук, но ответ не говорит, есть ли ещё, — и кнопка «Показать ещё» то появляется зря,
        то не появляется, когда нужна;
      - на любую ошибку сервер отвечает текстом `«Что-то пошло не так»`, и экран не может отличить «ресторан закрыт»
        от «сервер упал».

      Экран получается медленным (пять запросов вместо одного), хрупким (разбор строк) и непонятным для человека
      (одна и та же ошибка на всё). Ни одна из этих бед не лечится хорошим кодом на клиенте — их можно было не допустить,
      если бы фронтенд участвовал в проектировании API. В системном дизайне фронтенда это отдельный шаг: в плане ответа
      RADIO из вводного урока он называется «интерфейсы и API» (Interface definition).

      ## Что такое контракт API

      **Контракт API** — договорённость между клиентом и сервером: какие чтения и команды существуют, что передаётся
      в запросе, что приходит в ответе, какими бывают ошибки и что сервер гарантирует. Слово «контракт» подчёркивает,
      что это обещание: клиент строит на нём экраны, и если сервер молча поменяет имя поля, экраны сломаются.

      Отдельную операцию API называют **эндпоинтом** (endpoint, «конечная точка»): это адрес и метод одного запроса,
      например `GET /restaurants/r-7/menu` — «прочитать меню ресторана r-7».

      Фронтендер смотрит на контракт со стороны потребителя. Удобный приём — идти от экрана: выписать всё, что экран
      показывает, и всё, что человек на нём может сделать. Из первого списка получаются поля ответов, из второго —
      команды. Чем чтение отличается от команды, разобрано в прошлом уроке «Чтение, запись и реакция интерфейса».

      ## Что должно быть в ответе

      ### Поля, которые нужны экрану

      Ответ содержит то, что экран показывает, в виде, удобном для работы, а не для глаз.

      - **Деньги — целым числом в мелких единицах и с валютой:** `{ "amount": 69500, "currency": "RUB" }` означает
        695,00 ₽. Строка `"695 руб."` требует разбора, а дробное число вроде `695.5` в JavaScript складывается
        с ошибками округления: `0.1 + 0.2` даёт `0.30000000000000004`.
      - **Время — в формате ISO 8601 с часовым поясом:** `"2026-10-18T19:40:00+03:00"`. Без пояса непонятно, чьё
        это время — ресторана, сервера или покупателя.
      - **Готовые признаки, которые вычисляет сервер:** `available: false` у закончившегося блюда, `isOpen` у ресторана.
        Клиент не должен восстанавливать их по косвенным данным.
      - **Ничего лишнего.** Если экрану меню не нужны состав и калорийность каждого блюда, их можно не отдавать — или
        отдавать в отдельном запросе карточки блюда.

      ### Идентификаторы

      **Идентификатор** (id) — стабильная уникальная метка сущности: блюда, добавки, ресторана, заказа. Он нужен
      каждой сущности, на которую клиент потом сошлётся: в команде («добавь блюдо `d-42` с добавкой `opt-5`»),
      в ключе элемента списка, в кэше, в адресе страницы. Название и позиция в списке на эту роль не годятся: названия
      повторяются и меняются, а позиция сдвигается, когда в список что-то добавили. Почему идентичность сущности —
      не то же самое, что её место в списке, разобрано в уроке «Вычислять или хранить».

      Клиенту лучше считать идентификатор **непрозрачным** (opaque) — просто строкой, которую он хранит и отправляет
      обратно, ничего не вычисляя из неё.

      ### Ошибки

      Ошибка в ответе адресована двум читателям: программе, которая решает, что делать, и человеку, которому нужно
      объяснить, что случилось. Поэтому в ней нужны две части: **машиночитаемый тип** («ресторан закрыт», «цена
      изменилась», «блюдо закончилось») и **понятный текст**. Если клиент вынужден искать в тексте слово «закрыт»,
      контракт плохой: текст переведут или перефразируют, и проверка сломается.

      Для этого есть стандарт — **Problem Details** (подробности проблемы), RFC 9457. Ответ с ошибкой имеет тип
      содержимого `application/problem+json` и несколько стандартных полей:

      - **`type`** — адрес-идентификатор вида проблемы, например `https://api.example.com/problems/price-changed`.
        По нему клиент и выбирает поведение.
      - **`title`** — короткое человеческое название вида проблемы, одно и то же для всех случаев этого вида.
      - **`status`** — код ответа HTTP, продублированный в теле.
      - **`detail`** — объяснение именно этого случая. RFC прямо советует клиентам не разбирать этот текст.
      - **`instance`** — идентификатор конкретного случая; пригодится поддержке.

      Сверх этого вид проблемы может добавлять свои поля — **расширения** (extension members): новую сумму заказа,
      список закончившихся блюд. Клиент обязан игнорировать поля, которых не знает, — тогда сервер может добавлять
      новые, не ломая старые клиенты. В RFC есть и пример ошибки проверки формы: список нарушений, где у каждого
      указано, к какому полю оно относится. Так экран может показать ошибку рядом с нужным полем.

      Сам код ответа HTTP тоже несёт смысл: коды 4xx означают, что запрос не может быть выполнен в таком виде и клиент
      может что-то исправить, коды 5xx — что проблема на стороне сервера. Но кодов мало, а причин отказа много, поэтому
      для выбора поведения одного кода не хватает. Какие бывают сбои и как на каждый реагировать — в курсе 2, в уроке
      «Какие бывают сбои».

      ### Признак продолжения

      Списки — отзывы, история заказов, рестораны поблизости — сервер отдаёт порциями, **страницами**. Ответ должен
      явно сказать, есть ли следующая страница и как её запросить. Обычно для этого отдают **курсор** (cursor) —
      непрозрачную метку места, с которого продолжать: `"nextCursor": "eyJpZCI6..."`, а на последней странице —
      `null`. В GraphQL то же самое принято называть `pageInfo { hasNextPage endCursor }`.

      Без такого признака клиент гадает. Правило «пришло меньше 20 — значит, это конец» ломается, когда сервер
      отфильтровал часть записей уже после того, как отрезал страницу. Правило «запрашивать, пока не придёт пустой ответ»
      стоит лишнего запроса и показывает кнопку «Показать ещё», за которой ничего нет. Общее число записей тоже плохая
      замена: посчитать его бывает дорого, а пока человек листает, оно меняется. Чем отличаются способы пагинации
      и что делать с дублями при изменении списка — в курсе 2, в уроке «Пагинация живых списков».

      ## API под экран или общий контракт

      Есть два подхода к тому, как нарезать API.

      - **API под экран** отдаёт за один запрос ровно то, что нужно конкретному экрану, в нужной ему форме: ресторан,
        разделы меню и блюда в них.
      - **Переиспользуемый контракт** (general-purpose API) описывает сущности предметной области — `/restaurants`,
        `/dishes`, `/reviews` — и годится для любого клиента: сайта, мобильных приложений, партнёров.

      Сравним их по тому, что важно экрану и команде:

      - **API под экран**
        - Запросов у экрана: обычно один.
        - Лишние данные: почти нет.
        - Кто меняет при изменении экрана: тот, кто владеет этим API.
        - Другим клиентам: подходит плохо, форма заточена под один экран.
      - **Переиспользуемый контракт**
        - Запросов у экрана: несколько, иногда цепочкой.
        - Лишние данные: часто, ведь каждому клиенту нужны свои поля.
        - Кто меняет при изменении экрана: команда общего API, по очереди с другими клиентами.
        - Другим клиентам: подходит хорошо.

      Если сделать API под экраны всех клиентов в одном общем сервисе, он разрастается и становится узким местом:
      каждая команда клиента ждёт, пока команда сервиса доберётся до её задачи. Сэм Ньюмен описывает решение этой
      проблемы — паттерн **Backend for Frontend** (BFF, «бэкенд для фронтенда»). Это отдельный небольшой серверный слой
      для одного вида клиента: он вызывает общие сервисы, собирает и переупаковывает данные под свои экраны. Ключевые
      черты BFF по Ньюмену:

      - **один опыт — один BFF:** свой для мобильного приложения, свой для сайта, а не один на всех;
      - **им владеет команда интерфейса:** она меняет BFF вместе с экранами и выпускает их без согласования с другими
        командами;
      - **он остаётся маленьким:** BFF сосредоточен на одном клиенте. Общие правила при этом удобно держать
        в общих сервисах, чтобы не дублировать их в каждом BFF.

      Цена BFF — ещё один сервис, который нужно разрабатывать, выкатывать и поддерживать, и дублирование похожей логики
      между BFF разных клиентов. Ньюмен прямо пишет: если клиент один — сайт — и собирать на сервере почти нечего,
      BFF обычно не нужен. А вот при нескольких непохожих клиентах, особенно мобильных на медленной сети, он себя
      оправдывает.

      ## REST, GraphQL или RPC

      Помимо нарезки API, есть выбор стиля — того, как устроены запросы.

      - **REST** — API из **ресурсов**: у каждого ресурса свой адрес (`/restaurants/r-7`, `/orders/o-5521`), а действие
        задаёт метод HTTP: GET читает, POST создаёт и так далее. Большой плюс — кэширование: адрес ресурса однозначно
        его определяет, и ответы на GET можно кэшировать в браузере и на CDN (сети серверов, которые раздают копии
        ответов ближе к пользователю) стандартными средствами HTTP. Кэш в браузере экономит запросы одному
        человеку, а CDN — всем сразу: если ответ одинаков для всех, тысячи посетителей получают его копию, и до
        серверов доходит лишь малая часть запросов.
      - **GraphQL** — язык запросов: у сервера одна точка входа, обычно `/graphql`, и типизированная **схема** —
        описание всех типов данных и связей между ними. Клиент в запросе перечисляет ровно те поля, которые ему нужны,
        включая вложенные: ресторан, его разделы, блюда в разделах. Изменения выполняются **мутациями** (mutation).
        Запросы обычно идут методом POST на один адрес, поэтому стандартное HTTP-кэширование по адресу работать
        перестаёт; документация GraphQL советует давать каждому объекту глобально уникальный `id`, чтобы клиент сам
        строил кэш по нему.
      - **RPC** (remote procedure call, удалённый вызов процедуры) — API из **действий**: `createOrder`,
        `cancelOrder`, `getMenu`. Клиент вызывает функцию на сервере почти как обычную функцию. Примеры — JSON-RPC,
        gRPC, а в мире TypeScript — tRPC, где клиент и сервер разделяют типы. Во многих RPC-протоколах, например
        в JSON-RPC, все вызовы идут методом POST на один адрес, а имя процедуры и параметры лежат в теле запроса.
        У одинаковых вызовов тогда нет различимых адресов, и CDN их не кэширует. Бывает и иначе: tRPC отправляет
        чтения методом GET с параметрами в адресе, и их можно кэшировать, но адрес строится по имени процедуры
        (`/api/trpc/menu.get?input=…`), а не по ресурсу.

      Сравним три стиля по тому, что важно клиенту.

      - **REST**
        - Форма данных: отдельные ресурсы.
        - Число клиентов: любое; под каждого — свои эндпоинты или BFF.
        - Кэширование: просто — HTTP-кэш по адресу и CDN.
        - Цена: лишние запросы и лишние поля.
      - **GraphQL**
        - Форма данных: связанный граф, вложенные данные.
        - Число клиентов: много, и каждому нужны свои поля.
        - Кэширование: сложнее — кэш на клиенте по `id`.
        - Цена: сервер сложнее, нужна защита от слишком тяжёлых запросов.
      - **RPC**
        - Форма данных: действия и их параметры.
        - Число клиентов: обычно один-два; часто одна команда пишет и клиент, и сервер.
        - Кэширование: зависит от протокола, часто своё.
        - Цена: действия трудно переиспользовать как общий контракт.

      На практике стили смешивают: в REST-API почти всегда есть «действия» вроде `POST /orders/o-5521/cancel`.
      Выбирают по задаче. Публичный каталог, одинаковый для миллионов посетителей, выигрывает от REST и CDN. Пять
      клиентов, которым нужны разные срезы одного связанного графа данных, — довод за GraphQL. Внутренний инструмент,
      где одна команда пишет и клиент, и сервер на TypeScript, удобно сделать на RPC.

      ## Что обязан гарантировать сервер

      Код фронтенда работает на устройстве человека. Его можно изменить, у человека бывает открыто несколько вкладок,
      сеть теряет ответы, а браузер повторяет запросы. Поэтому есть гарантии, которые может дать только сервер, —
      и контракт должен их назвать.

      - **Цена заказа считается по серверному каталогу**
        - Почему не клиент: цену в запросе можно подделать, а цены меняются.
        - Что делает клиент: показывает цену и сообщает, какую сумму видел человек.
      - **Блюдо есть в наличии на момент заказа**
        - Почему не клиент: наличие меняется между показом меню и нажатием.
        - Что делает клиент: показывает, что знает, и готов к отказу «закончилось».
      - **Заказ создаётся и оплачивается один раз**
        - Почему не клиент: двойное нажатие, повтор после обрыва связи, две вкладки.
        - Что делает клиент: сразу блокирует кнопку и передаёт идентификатор операции (ключ идемпотентности),
          по которому сервер узнает повтор.
      - **Заказ видит только его владелец**
        - Почему не клиент: проверку на клиенте легко обойти.
        - Что делает клиент: не показывает чужого, но на это не полагается.
      - **Соблюдена минимальная сумма заказа**
        - Почему не клиент: те же причины, что у цены.
        - Что делает клиент: заранее подсказывает, сколько не хватает.

      Есть и обратное: обещания, которых сервер дать не может. Например, что ответ на команду обязательно дойдёт
      до клиента: сеть теряет ответы, и никакой сервер этого не исправит. Сервер гарантирует, что повтор не выполнит
      операцию дважды, а клиент при пропавшем ответе выясняет, чем всё закончилось. Точно так же сервер не обещает,
      что вторая открытая вкладка сразу увидит изменённую корзину или новый статус заказа: копия во второй вкладке — кэш, и её
      свежесть — забота клиента, а правильность операции сервер проверит при следующей команде.

      Клиентские меры полезны — они экономят человеку время и избавляют от бессмысленных запросов. Но это подсказки,
      а не защита. Как сервер защищается от двойного списания и при чём тут клиент — в курсе 2, в уроке «Повторы без
      двойных списаний».

      Вторая половина гарантии — как сервер сообщает о её нарушении. Если цена изменилась, контракт обещает не просто
      отказ, а ошибку вида «цена изменилась» с новой суммой — тогда экран может показать человеку новую цену и спросить,
      согласен ли он.

      ## Пример целиком: контракт меню и оформления

      Соберём контракт для экрана ресторана и оформления заказа. Клиент один — веб-приложение покупателя, данные меню
      одинаковы для всех и меняются редко, поэтому выберем REST: ответ меню можно кэшировать по адресу.

      **Меню — одним запросом** `GET /restaurants/r-7/menu`, в форме, нужной экрану:

      ```json
      {
        "restaurant": { "id": "r-7", "name": "Пицца у Лёши", "isOpen": true,
                        "minOrder": { "amount": 80000, "currency": "RUB" } },
        "categories": [
          {
            "id": "cat-2",
            "title": "Пицца",
            "dishes": [
              {
                "id": "d-42",
                "name": "Маргарита",
                "price": { "amount": 69500, "currency": "RUB" },
                "available": true,
                "options": [
                  { "id": "opt-5", "name": "Двойной сыр",
                    "price": { "amount": 9000, "currency": "RUB" } }
                ]
              }
            ]
          }
        ]
      }
      ```

      **Отзывы — порциями с курсором** `GET /restaurants/r-7/reviews?limit=20`:

      ```json
      { "items": [ { "id": "rv-901", "rating": 5, "text": "Быстро и горячо" } ],
        "nextCursor": "eyJpZCI6InJ2LTg4MiJ9" }
      ```

      На последней странице `nextCursor` равен `null`, и кнопка «Показать ещё» не появляется.

      **Оформление — команда** `POST /orders` с намерением, как в уроке «Чтение, запись и реакция интерфейса»:
      идентификатор операции, идентификатор корзины (при оформлении покупатель уже вошёл, и корзина лежит на сервере), адрес,
      способ оплаты и сумма, которую видел человек. Сервер сам проверяет наличие и сам считает цену. В ответ он создаёт
      заказ в статусе «создан»; оплата — следующая команда.

      **Отказ — по стандарту Problem Details**, с типом, по которому клиент решает, что делать:

      ```http
      HTTP/1.1 409 Conflict
      Content-Type: application/problem+json

      {
        "type": "https://api.example.com/problems/price-changed",
        "title": "Цена заказа изменилась",
        "status": 409,
        "detail": "Сумма заказа изменилась с 1 840 ₽ на 1 890 ₽.",
        "newTotal": { "amount": 189000, "currency": "RUB" }
      }
      ```

      Увидев тип `price-changed`, экран показывает новую сумму и кнопку «Оформить за 1 890 ₽». Увидев тип
      `dish-unavailable` со списком блюд, отмечает их в корзине. Текст `detail` можно показать человеку, но решения
      по нему не принимают.

      Если позже появятся мобильные приложения с другими экранами, этот контракт не придётся ломать: им можно сделать
      свои BFF поверх тех же сервисов.

      ## Типичные ошибки

      - **Деньги строкой или дробным числом.** Клиент разбирает строки и копит ошибки округления.
      - **Ошибка только текстом** или ответ 200 с полем `error` внутри — клиент не может выбрать поведение.
      - **Нет признака продолжения** — кнопка «Показать ещё» врёт.
      - **Нет идентификаторов** у того, что клиент потом отправит в команде.
      - **API — копия таблиц базы данных:** экрану нужно шесть запросов и склейка на клиенте.
      - **Эндпоинт под каждый экран каждого клиента в общем сервисе** — сервис разрастается и тормозит все команды.
      - **Сервер верит клиенту:** принимает от него цену, признак «оплата прошла» или право доступа.
      - **GraphQL «потому что модно»** — без нескольких клиентов и сложного графа данных он добавляет сложность
        без выигрыша.

      ## Как спрашивают на интервью

      - «Опишите API для ленты новостей: какие запросы, какие поля в ответе, как устроена пагинация?»
      - «REST или GraphQL для этого продукта — и почему?»
      - «Что здесь должен гарантировать сервер, а что может сделать клиент?»

      ## Источники

      - [Backends For Frontends — Sam Newman](https://samnewman.io/patterns/architectural/bff/)
      - [RFC 9457, Problem Details for HTTP APIs: поля описания ошибки](https://www.rfc-editor.org/rfc/rfc9457.html#name-members-of-a-problem-detail)
      - [Learn GraphQL: запросы, мутации, пагинация, кэширование — graphql.org](https://graphql.org/learn/)

  - id: sdb-outcomes
    topic: Потоки данных и проектирование API
    subtopic: Жизненный цикл данных и исходы в UI
    title: Загрузка, пустота, ошибка и всё между ними
    body: |
      ## Какую проблему решаем

      Экран меню ресторана написан просто: пока идёт запрос — спиннер, когда ответ пришёл — список блюд. Один флажок
      «загружается или нет». Посмотрим, что увидит покупатель в разных жизненных ситуациях.

      - **В ресторане нет вегетарианских блюд, а человек включил такой фильтр.** Экран пустой. Человек думает, что
        сайт сломался, и перезагружает страницу.
      - **Пропала сеть.** Запрос упал, данных нет — экран снова пустой. Теперь это выглядит так, будто ресторан ничего
        не продаёт.
      - **Сервис напитков не ответил, а основное меню пришло.** Экран целиком показывает ошибку, хотя пиццу заказать
        можно.
      - **Человек вернулся на вкладку через полчаса, и меню обновляется.** Знакомый список исчезает, на его месте
        крутится спиннер, и человек теряет место, где читал.
      - **Человек повторил прошлый заказ из трёх блюд, одно закончилось.** Экран пишет «Ошибка», хотя два блюда уже
        лежат в корзине. Человек жмёт ещё раз — и теперь в корзине по два экземпляра каждого.

      В каждом случае экран сообщает неправду. Причина одна: у данных на экране бывает гораздо больше исходов, чем
      «грузится» и «готово». Этот урок о том, какие они бывают, что показывать в каждом и как вести себя, когда API
      работает плохо.

      ## Пять исходов

      **Исход** (outcome) — чем закончилась или на чём сейчас находится попытка получить данные или выполнить действие.
      Различают пять основных.

      ### Загрузка

      **Загрузка** (loading) — ответа ещё нет. Важно различать два случая.

      - **Первая загрузка:** показать пока нечего. Здесь уместен **скелетон** (skeleton screen) — серые блоки
        на месте будущих заголовков, картинок и строк, повторяющие разметку страницы. Nielsen Norman Group,
        исследовательская компания по удобству интерфейсов, рекомендует его для загрузки целой страницы, если она
        длится меньше 10 секунд. Для отдельного блока — виджета, карточки — подходит обычный индикатор вращения.
        Если загрузка длится меньше секунды, индикатор не нужен вовсе: он только мелькнёт.
      - **Обновление:** данные уже на экране, а мы запрашиваем свежие. Старые данные стирать нельзя. Показывают их,
        а обновление отмечают незаметно — тонкой полоской или значком у заголовка.

      Если ожидание длится дольше 10 секунд, NN/g советует показывать прогресс и примерное время, а не бесконечную
      анимацию.

      ### Пусто

      **Пустое состояние** (empty state) — запрос прошёл успешно, но данных действительно нет. Это не ошибка, и выглядеть
      как ошибка оно не должно. Пустота бывает разной:

      - ещё ничего нет: «Вы пока ничего не заказывали»;
      - ничего не нашлось: «Нет вегетарианских блюд — сбросить фильтр?»;
      - всё разобрано: «Все заказы доставлены».

      NN/g советует в пустом состоянии сказать, почему здесь пусто, и дать прямой путь к действию: кнопку «Выбрать
      ресторан», «Сбросить фильтр». Совершенно пустой экран, по их наблюдениям, сбивает людей с толку: непонятно,
      работает ли система вообще. И главное правило — не показывать «Ничего не найдено», пока данные ещё грузятся:
      человек поверит, что их нет.

      ### Устарело

      **Устаревшие данные** (stale data) — на экране есть данные, но они могли измениться: загружены давно, связь
      пропала, обновление не удалось. Часто показать устаревшие данные лучше, чем ничего: меню получасовой давности
      почти наверняка верно. Но человек должен знать, на что смотрит: «Нет связи. Данные на 12:40».

      Насколько опасно устаревание, зависит от данных. Описание блюда может месяц не меняться, а наличие и цена — меняются
      в течение дня. Именно поэтому сервер всё равно проверяет цену и наличие при оформлении (урок «Контракт API глазами
      фронтенда»). Как решать, когда данные считать устаревшими и когда перезапрашивать, — в курсе 2, в уроке «Когда
      данные устаревают».

      ### Частичный успех

      **Частичный успех** (partial success) — получилось не всё. Он бывает и при показе, и при действии:

      - при показе: основное меню пришло, раздел «Напитки» — нет;
      - при действии: из трёх блюд в корзину добавились два, третье закончилось.

      Частичный успех нельзя сводить ни к успеху, ни к провалу. Если показать «Готово», человек не узнает о потерянном
      блюде. Если показать «Ошибка», он повторит всё и получит дубли. Правильно — показать, что получилось, и отдельно
      то, что нет, с причиной и способом исправить.

      Для этого контракт API должен сообщать результат по частям. Показательный пример — GraphQL: его ответ может
      содержать одновременно и данные (`data`), и список ошибок (`errors`), и при этом приходит с кодом 200. Документация
      GraphQL объясняет это тем, что в HTTP пока нет кода для «частичного успеха»
      ([GraphQL over HTTP](https://graphql.org/learn/serving-over-http/)).

      ### Ошибка

      **Ошибка** (error) — получить данные или выполнить действие не удалось. С точки зрения человека ошибки делятся на
      две группы: те, что можно исправить повтором или своими силами («нет сети — повторить», «проверьте адрес»), и те,
      что повтор не исправит («ресторан закрыт до 10:00»). От этого зависит, что предложить: кнопку «Повторить», другое
      действие или просто объяснение. Подробно виды сбоев — тайм-ауты, коды 4xx и 5xx, конфликты — разбираются в курсе 2,
      в уроке «Какие бывают сбои».

      Сведём исходы вместе:

      - **Первая загрузка**
        - Хорошо: скелетон страницы или индикатор в блоке.
        - Плохо: белый экран или «Ничего не найдено» до ответа.
      - **Обновление**
        - Хорошо: старые данные и тихая отметка обновления.
        - Плохо: данные исчезают, на их месте спиннер.
      - **Пусто**
        - Хорошо: почему пусто и что сделать.
        - Плохо: пустая область без слов.
      - **Устарело**
        - Хорошо: данные и время, на которое они верны.
        - Плохо: старые данные без пометки.
      - **Частичный успех**
        - Хорошо: что получилось и что нет, с причиной.
        - Плохо: «Готово» или «Ошибка» на всё.
      - **Ошибка**
        - Хорошо: что случилось и что можно сделать.
        - Плохо: «Что-то пошло не так» на весь экран.

      ### Данные и статус запроса — разные вещи

      Из этого списка видно, что исходы могут сочетаться: старые данные на экране + идёт обновление; старые данные + последнее
      обновление не удалось. Поэтому удобно думать о двух вещах отдельно: **есть ли данные** (и насколько они свежие)
      и **что сейчас с запросом** (идёт, удался, упал). Одного флажка `isLoading` для этого мало. Как описать такие
      состояния без невозможных сочетаний флажков, разобрано в уроке «Процесс как набор состояний».

      ## Ошибка показа и ошибка действия

      Две ошибки, которые часто показывают одинаково, на самом деле требуют разного поведения.

      **Ошибка показа** — не удалось загрузить то, что экран должен показать: меню, отзывы, историю заказов. Сообщение
      ставят **на место отсутствующих данных**: где должен быть раздел «Напитки», там и пишут «Напитки не загрузились»
      с кнопкой «Повторить». Остальной экран работает.

      **Ошибка действия** — не выполнилась команда человека: не добавилось блюдо, не оформился заказ, не сохранился
      адрес. Здесь контент на экране в порядке, сломалось действие. Поэтому:

      - сообщение ставят **рядом с местом действия** — у кнопки, у поля, в корзине, — а не вместо всего экрана;
      - **ввод человека сохраняют:** NN/g советует давать исправить исходное действие, а не начинать заново;
      - экран **не делает вид, что действие удалось:** если адрес не сохранился, в списке адресов его нет;
      - объясняют, что случилось с действием и что можно сделать: «Не удалось добавить "Маргариту": нет связи. Повторить».

      Сравним обе ошибки по пунктам:

      - **Ошибка показа**
        - Что сломалось: не пришли данные для экрана.
        - Где сообщение: на месте отсутствующих данных.
        - Что с экраном: остальные блоки работают.
        - Что сохранить: уже показанные данные.
        - Что предложить: «Повторить загрузку».
      - **Ошибка действия**
        - Что сломалось: не выполнилась команда человека.
        - Где сообщение: рядом с кнопкой или полем действия.
        - Что с экраном: весь экран остаётся как был.
        - Что сохранить: всё, что человек ввёл.
        - Что предложить: «Повторить действие» или исправить ввод.

      Есть и третий случай — когда у команды **нет ответа вовсе**. Как сказано в уроке «Чтение, запись и реакция
      интерфейса», это не ошибка, а неизвестный исход: действие могло выполниться. Его показывают отдельно и не
      предлагают повторить вслепую.

      ## Когда API работает плохо

      **Плавная деградация** (graceful degradation) — свойство системы продолжать работать в урезанном виде, когда
      часть её отказала. Для экрана это означает: сбой одного источника данных не должен ронять всё остальное.

      Чтобы так получилось, при проектировании экрана заранее решают три вещи.

      1. **Что на экране главное, а что второстепенное.** Для меню главное — сам ресторан и блюда: без них заказать
         нельзя. Отзывы, рекомендации и баннер с акцией — второстепенные.
      2. **Что делать при сбое каждого блока.** Сбой главного — сообщение на весь экран с понятным объяснением.
         Сбой второстепенного — блок прячут или сворачивают в короткую строку, остальное работает.
      3. **Как долго ждать.** Медленный ответ хуже быстрого отказа: человек смотрит на спиннер и не знает, ждать ли.
         Поэтому у ожидания есть предел, после которого экран сообщает о проблеме и предлагает выход. Как выбирать
         тайм-ауты и повторы — в курсе 2.

      Что можно сделать с блоком при сбое:

      - **Спрятать блок**
        - Когда подходит: блок второстепенный, задача решается и без него.
        - Цена: человек может не узнать, что чего-то не хватает.
      - **Сообщение на месте блока и «Повторить»**
        - Когда подходит: блок нужен, но остальной экран полезен и без него.
        - Цена: место на экране и ещё одна кнопка.
      - **Последние известные данные с пометкой**
        - Когда подходит: данные меняются медленно, и старые лучше, чем никаких.
        - Цена: нужна сохранённая копия и честная пометка времени.
      - **Ошибка на весь экран**
        - Когда подходит: отказал главный блок, без которого экран бесполезен.
        - Цена: человек не видит ничего, поэтому — только для главного блока.

      ## Пример целиком: меню с одним сломанным разделом

      Покупатель открывает ресторан «Пицца у Лёши». Экран собирается из четырёх частей: шапка ресторана и основное меню
      приходят одним запросом, раздел «Напитки» — от отдельного сервиса напитков, отзывы — отдельным запросом. Главное —
      шапка и основное меню, второстепенное — отзывы.

      **0 мс.** Ничего ещё нет — показываем скелетон: прямоугольник шапки, ряды карточек блюд.

      **600 мс.** Пришли шапка и основное меню — скелетон сменяется настоящими блюдами. Человек уже может листать
      и добавлять в корзину.

      **900 мс.** Сервис напитков ответил ошибкой 503. На месте раздела «Напитки» — строка «Напитки не загрузились»
      и кнопка «Повторить». Пиццы и супы работают как ни в чём не бывало.

      **8 с.** Отзывы так и не пришли — истёк срок ожидания. Блок отзывов сворачивается в строку «Отзывы сейчас
      недоступны». Ради отзывов человек меню не открывал, поэтому громкое сообщение здесь не нужно.

      **Фильтр.** Человек включает «Вегетарианское» — подходящих блюд нет. Экран пишет: «В этом ресторане нет
      вегетарианских блюд» и предлагает сбросить фильтр. Это пустота, а не ошибка.

      **Повтор прошлого заказа.** Человек нажимает «Повторить заказ» — три блюда. Сервер отвечает результатом
      по каждому:

      ```json
      {
        "added": [ { "dishId": "d-42", "quantity": 1 }, { "dishId": "d-17", "quantity": 1 } ],
        "failed": [ { "dishId": "d-90", "reason": "unavailable" } ]
      }
      ```

      В корзине две позиции, а рядом сообщение: «Добавлено 2 из 3. "Морс брусничный" закончился — посмотреть
      другие напитки?». Не «Готово» и не «Ошибка».

      **Через полчаса.** Человек возвращается на вкладку. Меню остаётся на экране, а свежее запрашивается в фоне.
      Обновление не удалось — связь пропала. Меню не исчезает, вверху появляется пометка «Нет связи. Меню на 12:40».
      Человек может спокойно выбирать блюда, а рядом с пометкой есть кнопка «Обновить» — на случай, когда связь
      вернётся.

      ## Типичные ошибки

      - **Один флажок на всё.** «Загружается или нет» не различает пустоту, ошибку, устаревание и частичный успех.
      - **Пустота вместо ошибки.** Запрос упал, а экран пишет «У вас нет заказов». В онлайн-банке такое «у вас нет
        счетов» пугает всерьёз.
      - **Спиннер стирает данные** при каждом обновлении.
      - **Ошибка одного блока роняет весь экран.**
      - **Ошибка действия уводит на страницу ошибки** и теряет то, что человек ввёл.
      - **Частичный успех как полный** — или как полный провал, после чего повтор создаёт дубли.
      - **Вечный спиннер** без предела ожидания и без выхода.
      - **Бесконечные тихие повторы** вместо честного сообщения и кнопки «Повторить».

      ## Как спрашивают на интервью

      - «Что увидит пользователь, если этот запрос упадёт? А если он будет идти 20 секунд?»
      - «Какие состояния есть у этого экрана кроме "загружается" и "готово"?»
      - «Три виджета из пяти загрузились, два — нет. Что вы покажете?»

      ## Источники

      - [Skeleton Screens 101 — Nielsen Norman Group](https://www.nngroup.com/articles/skeleton-screens/)
      - [Designing Empty States in Complex Applications — Nielsen Norman Group](https://www.nngroup.com/articles/empty-state-interface-design/)
      - [Error-Message Guidelines — Nielsen Norman Group](https://www.nngroup.com/articles/error-message-guidelines/)

  - id: sdb-tradeoffs
    topic: Архитектурные решения
    subtopic: Альтернативы и компромиссы
    title: Как сравнивать решения
    body: |
      ## Какую проблему решаем

      Команда сервиса доставки час спорит, где хранить корзину. Один разработчик говорит: «Конечно, на сервере, так
      делают все большие сервисы». Второй отвечает: «Положим в хранилище браузера, это проще и быстрее». Третий
      предлагает «универсальную корзину, которая потом выдержит заказ из нескольких ресторанов, аптеку и продукты».
      Каждый по-своему прав, и спор ходит по кругу.

      Спор не сходится, потому что все трое сравнивают варианты по разным меркам. Первый — по популярности, второй —
      по удобству для себя, третий — по воображаемому будущему. Ни один не спросил, какие требования у этой корзины
      и какой вариант выполняет их лучше.

      Если так принимать решения, получается одно из двух. Либо побеждает самый громкий, и через полгода никто
      не помнит, почему выбрали именно это. Либо команда строит сложную систему «на вырост», а вырост так и не
      наступает. В этом уроке разберём, как сравнивать варианты, чтобы спор заканчивался обоснованным выбором.

      ## Альтернатива и компромисс

      **Альтернатива** (alternative) — один из вариантов решения, который действительно может выполнить требования.
      «Корзина на устройстве» и «корзина на сервере» — альтернативы. «Корзина только в памяти вкладки» альтернативой
      не считается: она пропадает при перезагрузке страницы, а корзина обязана её переживать. Такой вариант отпадает
      сразу.

      **Компромисс** (trade-off, в русских текстах также «размен») — ситуация, когда выигрыш в одном оплачивается
      проигрышем в другом. Корзина на устройстве реагирует мгновенно и не требует работы на сервере, но не видна
      с другого устройства. Получить и то и другое бесплатно нельзя. Подробно о том, как качества спорят друг
      с другом, — в уроке «Как превратить „быстро“ в цифры».

      **Критерий сравнения** — свойство, по которому сравнивают варианты. Хорошие критерии берутся из требований
      и атрибутов качества: «корзина переживает перезагрузку», «добавление блюда отзывается на медленной сети меньше
      чем за 100 миллисекунд», «корзину можно собрать без входа в аккаунт». Плохие критерии — «современно», «так делает
      Google», «мне нравится».

      ## Что назвать у каждого варианта

      Чтобы сравнение было честным, у каждого варианта называют четыре вещи.

      - **Выигрыш** — какие требования вариант выполняет лучше других. Не «он удобный», а «добавление блюда работает
        без запроса к серверу, поэтому на медленной сети кнопка отзывается сразу».
      - **Цена** — чем за выигрыш платят: время разработки, новая работа на сервере, деньги, сложность кода, хуже
        выполненное другое требование. Цена есть у любого варианта, в том числе у самого простого.
      - **Риск** — что может пойти не так и насколько это плохо. Риск всегда связан с допущением, в котором вы
        не уверены: «мы считаем, что почти никто не переходит с телефона на компьютер посреди заказа». Если допущение
        окажется ложным, вариант станет плохим. О том, как такие допущения находить и проверять, — в следующем уроке.
      - **Условие пересмотра** — наблюдаемое событие, при котором вы вернётесь к решению. Например: «если доля
        заказов, начатых на одном устройстве и законченных на другом, превысит 10 %». Условие пересмотра превращает
        риск в план: команда заранее договорилась, что увидит и что тогда сделает.

      Условие пересмотра должно быть таким, чтобы его наступление можно было заметить. «Когда станет плохо» — плохое
      условие: никто не скажет, наступило ли «плохо». «Когда на странице меню станет больше 500 блюд» или «когда
      бизнес решит отправлять напоминания о брошенной корзине» — хорошие: их можно проверить по данным или по плану
      продукта.

      ## Порядок сравнения

      1. **Выпишите требования, которые различают варианты.** Требования, которые все варианты выполняют одинаково,
         в сравнении не помогают — их можно не писать.
      2. **Разделите обязательное и желательное.** Обязательное требование (например, «корзину можно собрать без входа»)
         работает как фильтр: вариант, который его нарушает, выбывает, какими бы ни были его остальные достоинства.
         Желательные требования уже сравнивают между собой.
      3. **Соберите две-три настоящие альтернативы.** Одной из них полезно сделать самый простой вариант, который
         выполняет обязательные требования. С ним сравнивают всё остальное: каждое усложнение должно окупаться.
      4. **Составьте таблицу:** строки — критерии, столбцы — варианты.
      5. **Назовите выигрыш, цену, риск и условие пересмотра** выбранного варианта и запишите вывод одной фразой.

      Иногда соблазнительно расставить баллы и сложить их: «скорость — 4 из 5, простота — 5 из 5». Сумма баллов
      прячет главное. Вариант, нарушивший обязательное требование, может набрать больше остальных, а спорные оценки
      превращаются в точные на вид числа. Поэтому сначала фильтр по обязательному, а уже потом сравнение словами.

      ## Пример целиком: где хранить корзину

      В вводном уроке «Что такое системный дизайн фронтенда» мы уже видели, что корзина на устройстве и корзина
      на сервере ведут себя по-разному. Теперь доведём сравнение до решения, опираясь на то, что выяснили в прошлых
      уроках.

      **Что известно о первой версии:**

      - заказ из одного ресторана, оплата картой (урок «Что войдёт в первую версию»);
      - выбирать еду и собирать корзину можно без входа в аккаунт — это обязательное требование бизнеса: просьба
        зарегистрироваться до выбора отпугивает новых покупателей;
      - войти по номеру телефона нужно при оформлении заказа. Поэтому заказ и его статус всегда принадлежат
        вошедшему покупателю, как и требовал урок «Как выяснять требования»: статус видит только владелец заказа;
      - вход сохраняется на устройстве, и постоянные покупатели обычно уже вошли, когда выбирают еду;
      - аналитика старой версии сайта: четверть вошедших покупателей выбирают еду на телефоне, а оплачивают
        с компьютера. Для них корзина должна быть одной и той же на всех устройствах — это тоже требование;
      - сервисом пользуются в основном с телефона, часто на медленной мобильной сети;
      - напоминаний о брошенной корзине в первой версии нет.

      Есть и правило, которое не зависит от места хранения. Корзина хранит только блюда и их количество, а цены
      берутся из меню, и окончательную сумму пересчитывает сервер при оформлении (уроки «Кто главный по данным»
      и «Контракт API глазами фронтенда»). Корзина на устройстве не означает, что сервер верит суммам с устройства.

      **Варианты:**

      - **А. На устройстве.** Корзина хранится в браузере, на сервер уходит только при оформлении заказа.
      - **Б. На сервере.** Каждое добавление и удаление блюда — запрос к серверу. Вошедшему корзину привязывают
        к аккаунту, а гостю сервер выдаёт временный идентификатор.
      - **В. У гостя — на устройстве, у вошедшего — на сервере.** Гость собирает корзину в браузере. Когда он входит
        в аккаунт (самое позднее — при оформлении), корзина один раз переносится на сервер, и дальше её владелец —
        сервер. Кто уже вошёл, сразу работает с корзиной на сервере.

      **Сначала фильтр.** Вариант А самый простой и самый быстрый: никакого API корзины, отклик мгновенный. Но он
      нарушает обязательное требование: покупатель собрал корзину на телефоне, открыл сайт на компьютере, а там
      корзина пустая. У четверти вошедших покупателей так будет каждый раз. Вариант А выбывает.

      **Потом сравнение.** Между Б и В разница только в гостях:

      - **Б. На сервере**
        - Гость собирает без входа: да, с временным идентификатором.
        - Отклик у гостя на медленной сети: мгновенный, только если показывать блюдо до ответа сервера и откатывать
          при отказе.
        - Сервер хранит: корзины всех гостей.
        - Код на клиенте: запросы к API и откат при отказе.
      - **В. У гостя — на устройстве, у вошедшего — на сервере**
        - Гость собирает без входа: да.
        - Отклик у гостя на медленной сети: мгновенно, запросов и откатов нет.
        - Сервер хранит: корзины только вошедших.
        - Код на клиенте: хранение корзины в браузере и перенос при входе.

      Мгновенный отклик в варианте Б тоже возможен: это оптимистичный интерфейс из урока «Чтение, запись и реакция
      интерфейса», и так же устроено добавление блюда у вошедшего покупателя в уроке «Куда текут данные». Но у гостя
      на медленной сети тогда будут запросы на каждое нажатие и откаты при отказах, которых в варианте В у гостя нет
      вовсе. А главная цена Б в другом: сервер хранит тысячи гостевых корзин, которые никто никогда не оформит.

      Одинаковые для обоих вариантов свойства в сравнение не попали: у вошедшего в обоих случаях одна корзина на всех
      устройствах. Одинаково и слияние при входе. В варианте Б гостевая корзина на сервере при входе соединяется
      с корзиной аккаунта, в варианте В — корзина с устройства с корзиной на сервере. Что делать, если на сервере уже
      лежит корзина, собранная вчера на компьютере? В обоих случаях нужно явное правило — например, сложить блюда
      из обеих корзин и показать результат, как в уроке «Кто главный по данным». Собственная цена варианта В — код
      хранения корзины в браузере и её перенос.

      И опасно сделать перенос не однократным, а постоянным: держать две копии, на устройстве и на сервере,
      и синхронизировать их в обе стороны. Тогда у корзины два владельца, и тот же урок объясняет, почему это почти
      всегда ломается. В варианте В владелец в каждый момент один: у гостя — устройство, после входа — сервер.

      **Решение для первой версии:** вариант В.

      > У гостя храним корзину на устройстве, после входа переносим её на сервер и дальше храним там. Так выполняются
      > оба требования: гость собирает корзину без входа, а у вошедшего она одна на всех устройствах. Корзина гостя
      > работает без запросов к серверу, а серверу не приходится хранить корзины гостей. Платим API корзины, хранением
      > и слиянием при входе: блюда из двух корзин складываются, и человек видит результат. Риски — покупатель
      > не заметит, что блюда сложились, и закажет лишнее; цены, которые человек видел, пока собирал корзину,
      > к оформлению могут измениться. Первый риск закрываем сообщением после входа, второй — пересчётом на сервере
      > и сообщением «цена изменилась». Вернёмся к решению, если доля покупателей, которые собирают корзину без
      > входа, упадёт ниже 5 % (тогда проще хранить корзину на сервере с первого блюда) или если больше 5 %
      > покупателей сразу после входа убирают блюда из сложенной корзины (тогда менять правило слияния).

      Чтобы решение было удобно и выполнять, и пересматривать, экраны не знают, где лежит корзина. Они работают
      с модулем корзины через его публичный интерфейс («добавить блюдо», «убрать блюдо», «текущая корзина»), как
      в уроке «Зависимости и публичный интерфейс модуля». Хранить корзину гостя в браузере, а корзину вошедшего
      на сервере и переносить её при входе — забота одного модуля, а не двадцати компонентов.

      ### Когда то же сравнение даёт другой ответ

      Решение верно только при этих требованиях. Поменяйте одно — и выбор меняется. Три примера:

      - **Войти нужно до выбора еды.** Гостей нет, поэтому у корзины с первого блюда один владелец — сервер,
        и слияние при входе не нужно. Выбор — Б.
      - **Между устройствами переходят лишь 3 % заказов, и бизнес готов их не поддерживать.** Требования «одна
        корзина на всех устройствах» больше нет, а API корзины и слияние стали бы ценой без выигрыша. Выбор — А.
      - **Сайт открывают с компьютера, сеть быстрая.** Довод про мгновенный отклик у гостя ослаб. Между В и Б
        решает, во что обойдётся хранить гостевые корзины на сервере.

      Это и есть смысл сравнения по требованиям: вывод можно пересчитать, когда требования меняются, а не начинать
      спор заново.

      ## Оправданная сложность и преждевременная универсальность

      Вернёмся к третьему участнику спора с его «универсальной корзиной». **Сложность** решения — это сколько частей,
      правил и связей нужно держать в голове, чтобы его понимать и менять. Сложность сама по себе не плоха.
      Она **оправдана**, если её требует конкретное требование из списка. Курьер работает в подвалах без связи, значит,
      приложению курьера нужна очередь действий, которая отправится позже. Это сложно, но без этого требование
      не выполнить.

      **Преждевременная универсальность** — сложность ради будущего, которого в требованиях нет: «а вдруг потом
      попросят». Против неё есть принцип **YAGNI** (You Aren't Gonna Need It — «вам это не понадобится»). Он пришёл
      из экстремального программирования (Extreme Programming): Кент Бек отвечал так на предложения коллеги заранее
      добавить возможности, которые «скоро понадобятся».

      Мартин Фаулер в статье о YAGNI называет такую возможность **предполагаемой функцией** (presumptive feature) — кодом
      для функции, которой пока никто не пользуется. Он показывает, что у неё четыре цены. Разберём их на корзине
      из нескольких ресторанов, которой нет в требованиях первой версии.

      - **Цена постройки** (cost of build) — время на продумывание, код и тесты.
        - На примере корзины: три недели на корзину, разбитую по ресторанам, с отдельной доставкой каждого.
      - **Цена задержки** (cost of delay) — польза, которую не получили, пока строили лишнее.
        - На примере: экран отслеживания заказа выходит на три недели позже.
      - **Цена содержания** (cost of carry) — лишняя сложность, которая замедляет всю остальную работу.
        - На примере: любая правка правил корзины учитывает несколько ресторанов, тестов вдвое больше.
      - **Цена исправления** (cost of repair) — переделка, если будущее оказалось не таким, как представляли.
        - На примере: через год бизнес делает заказы из нескольких ресторанов с одним курьером, и модель приходится
          переписывать.

      Самое неприятное — что предполагаемая функция часто вообще не нужна. Фаулер ссылается на исследования, по
      которым лишь около трети выпущенных функций улучшают те показатели, ради которых их делали. Значит, функция,
      построенная «на всякий случай», скорее всего, окажется лишней.

      ### Чего YAGNI не запрещает

      YAGNI — не разрешение писать как попало. Фаулер прямо оговаривает, что принцип не касается работы, которая
      делает код проще для изменения: переработки кода (рефакторинга), тестов, понятных границ модулей. Модуль корзины
      с публичным интерфейсом из примера выше — не предполагаемая функция. Он не добавляет возможностей «на вырост»,
      он делает будущую переделку дешёвой.

      Не запрещает YAGNI и дешёвую подготовку, которая не усложняет код. Совет Фаулера — представить, какую переделку
      придётся сделать, когда функция всё-таки понадобится. Часто оказывается, что потом это будет ненамного дороже,
      чем сейчас. Но бывают решения, которые потом поменять очень дорого (урок «Как рисовать архитектуру» называет их
      дорогими для изменения). Например, формат корзины, который уже лежит в браузерах тысяч покупателей. Добавить
      в сохранённые данные номер версии формата — минута работы (этот приём уже встречался в том уроке), и при
      следующем изменении формата вы сможете перевести старые корзины на новый формат, а не потерять их.

      Простая проверка любого усложнения — два вопроса:

      - Какое требование из списка оно закрывает? Если назвать нельзя, это предполагаемая функция.
      - Во сколько обойдётся добавить это потом, когда понадобится? Если ненамного дороже, чем сейчас, — откладывайте.

      ## Новое и модное

      Отдельный случай сравнения «не по требованиям» — выбор технологии потому, что о ней много пишут. Дэн Маккинли
      в эссе «Выбирайте скучные технологии» (Choose Boring Technology, 2015) объясняет, почему это опасно.

      У проверенной («скучной») технологии хорошо известны и её слабые места, и способы их обходить. Проблемы, о которых
      вы знаете заранее, называют **известными неизвестными** (known unknowns): «мы не знаем, как поведёт себя эта
      библиотека на списке из 10 000 строк, но знаем, что это нужно проверить». У новой технологии гораздо больше
      **неизвестных неизвестных** (unknown unknowns) — проблем, о которых вы даже не догадываетесь, пока не наткнётесь.
      К тому же каждая новая технология требует, чтобы её знали, поддерживали и обновляли.

      Маккинли предлагает считать, что у команды есть примерно три **жетона на новизну** (innovation tokens):
      каждая новая технология тратит один, и запас долго не пополняется. Это образ, а не точное правило, и ломается
      он на том, что жетоны в нём одинаковые. На деле новизна стоит по-разному: новая библиотека для одного экрана
      обходится дешевле, чем новый способ хранить все данные приложения. Но мысль понятна: новизну стоит тратить там,
      где без неё требование не выполнить.

      Перед тем как взять новую технологию, Маккинли советует ответить на два вопроса:

      - Как бы мы решили задачу тем, что у нас уже есть?
      - Что именно в имеющихся инструментах делает задачу слишком дорогой?

      Если честный ответ на второй вопрос — «ничего, просто хочется попробовать», технология не нужна.

      ## Как звучит обоснование

      | Довод | Чего в нём не хватает |
      |---|---|
      | «Так делают все крупные сервисы» | У крупных сервисов другие требования и другая цена ошибки |
      | «Это современный подход» | Не названо ни одно требование, которое он выполняет лучше |
      | «А вдруг потом понадобится» | Нет требования; это предполагаемая функция со всеми четырьмя ценами |
      | «Так быстрее разработать» | Это выигрыш, но не названы цена и риск |
      | «Выбираем А, потому что требования X и Y; платим Z; риск R; пересмотрим, если E» | Ничего — это полное обоснование |

      Последняя строка — шаблон, который полезно держать в голове и на работе, и на собеседовании. Как оформить такой
      вывод в виде короткого документа, чтобы через год его нашли, — в следующем уроке.

      ## Типичные ошибки

      - **Сравнивать по популярности.** Решение, взятое «как у всех», нельзя защитить: на вопрос «почему?» нет ответа.
      - **Не называть цену выбранного варианта.** Если кажется, что у решения нет недостатков, вы их просто ещё
        не нашли. На собеседовании это звучит как непонимание компромисса.
      - **Строить «на вырост».** Универсальный конструктор вместо пяти нужных отчётов, сайт, разрезанный на отдельно
        выпускаемые приложения (микрофронтенды), для команды из трёх человек — всё это предполагаемые функции.
      - **Путать YAGNI с небрежностью.** Отказ от тестов и границ модулей «потому что пока не нужно» делает будущую
        переделку дорогой — ровно то, от чего YAGNI должен защищать.
      - **Складывать баллы.** Вариант, нарушивший обязательное требование, не спасают высокие оценки по остальным.
      - **Не записать условие пересмотра.** Тогда решение либо не пересматривают никогда, либо пересматривают
        на каждом совещании.

      ## Как спрашивают на интервью

      - «Почему вы выбрали именно это? Какие альтернативы рассматривали?» — ждут два-три варианта и довод через
        требования, а не через популярность.
      - «Какие недостатки у вашего решения?» — ждут честно названную цену и риск.
      - «А если требование изменится — например, войти нужно ещё до выбора еды?» — проверяют, умеете ли вы
        пересчитать вывод, а не защищать прежний любой ценой.

      ## Источники

      - [Yagni — Martin Fowler](https://martinfowler.com/bliki/Yagni.html)
      - [Choose Boring Technology — Dan McKinley](https://mcfunley.com/choose-boring-technology)

  - id: sdb-risks
    topic: Архитектурные решения
    subtopic: Риски, итерации и обоснование
    title: Риски и развитие решения
    body: |
      ## Какую проблему решаем

      В прошлом уроке мы научились выбирать между вариантами и называть у выбранного выигрыш, цену, риск и условие
      пересмотра. Но решение принято — и что дальше? У него остаются две слабости.

      **Первая: решение стоит на допущениях.** Экран отслеживания заказа в сервисе доставки опрашивает сервер раз
      в 30 секунд. В уроке «Как превратить „быстро“ в цифры» мы выбрали этот интервал по требованию «в пределах
      минуты» и посчитали нагрузку: в пятничный пик открыто 20 000 экранов, это около 670 запросов в секунду. Но
      расчёт — только половина дела. Никто не сверил эту цифру с тем, сколько выдерживает сервер заказов, и никто
      не записал, при каком числе экранов решение надо пересматривать. Если сервер выдерживает меньше, отслеживание
      ляжет в самый горячий час, а вместе с ним, возможно, и оформление новых заказов.

      **Вторая: решение забывается.** Через год в команду приходит новый разработчик. Он видит опрос раз в 30 секунд
      и думает: «Какое старьё, переделаю на постоянное соединение». Или наоборот, боится трогать: «Наверное, была
      причина». Ни то ни другое не опирается на знание. Майкл Нигард, автор формата записи решений, о котором речь
      пойдёт ниже, описывает ровно эти два исхода: решение либо слепо принимают, либо слепо отменяют.

      Этот урок — о том, как найти самые опасные допущения и проверить их до того, как они обойдутся дорого, как
      усложнять решение постепенно и как записать его так, чтобы через год было понятно, почему оно такое.

      ## Понятия

      **Допущение** — утверждение, которое считают верным, хотя не проверили. Чем оно отличается от факта и открытого
      вопроса, разобрано в уроке «Что войдёт в первую версию».

      **Риск** (risk) — возможность, что допущение окажется ложным, вместе с ценой этой ошибки. У риска две стороны,
      те же, что у неизвестных в уроке «Что войдёт в первую версию»: насколько вы не уверены и насколько дорого
      обойдётся ошибка. Допущение «покупателям нравится зелёная кнопка»
      неуверенное, но дешёвое: кнопку перекрашивают за минуту. Допущение «сервер выдержит опрос от всех открытых
      экранов» тоже неуверенное, а ошибка в нём роняет сервис.

      **Прототип** (prototype) — маленькая, нарочно упрощённая программа, которая отвечает на один вопрос: сработает ли
      задуманное. В экстремальном программировании (Extreme Programming) такой опыт называют **spike** — исследовательское
      решение: очень простая программа, которая проверяет одно возможное решение и не занимается ничем другим. Её,
      как правило, выбрасывают: цель — снизить технический риск, а не написать код для продукта. В современных
      командах spike ещё и заранее ограничивают по времени.

      **Метрика** (metric) — число, которое измеряют на реальных пользователях или реальных данных: время открытия
      меню, доля покупателей, которые убирают блюда из корзины сразу после входа, число запросов
      в секунду.

      **Инвариант** (invariant) — правило, которое должно выполняться всегда, как бы ни развивалась система. В уроке
      «Процесс как набор состояний» инварианты охраняли переходы между статусами заказа. Здесь то же слово, но
      масштаб — вся система: «деньги за заказ списываются не больше одного раза».

      ## Какие допущения проверять первыми

      Выпишем допущения, на которых держится то, что мы спроектировали за курс, и для каждого ответим на три вопроса:
      что будет, если оно ложно, насколько дорого это исправить и как его проверить.

      **1. Статуса раз в 30 секунд покупателю достаточно.**
      - Если ложно: жалобы «курьер у двери, а статус „готовится“».
      - Цена исправления: низкая, поменять одно число.
      - Как проверить: метрика после запуска — жалобы и обращения в поддержку.

      **2. Сервер заказов выдержит 670 запросов в секунду от отслеживания.**
      - Если ложно: в пик падает отслеживание, а может быть, и оформление заказов.
      - Цена исправления: средняя, менять способ доставки статуса.
      - Как проверить: сверить расчёт с бэкендом и провести нагрузочный тест.

      **3. Меню из 300 блюд открывается за 2,5 секунды на средней мобильной сети.**
      - Если ложно: покупатели уходят, не дождавшись меню.
      - Цена исправления: высокая, может понадобиться другой способ отрисовки страниц.
      - Как проверить: прототип экрана меню на дешёвом телефоне и замедленной сети.

      **4. Платёжный виджет работает внутри приложения банка-партнёра.**
      - Если ложно: часть покупателей не может оплатить заказ.
      - Цена исправления: высокая, другой платёжный сервис или другой сценарий оплаты.
      - Как проверить: прототип — встроить виджет в тестовую страницу и открыть её в приложении банка.

      **5. Покупатель заметит, что при входе блюда из двух корзин сложились.**
      - Если ложно: лишние блюда в заказах и обращения в поддержку.
      - Цена исправления: низкая, если корзина спрятана за модулем (урок «Как сравнивать решения»): поменять правило
        слияния в одном месте.
      - Как проверить: метрика — доля покупателей, которые сразу после входа убирают блюда из корзины.

      Первыми проверяют допущения, в которых одновременно мало уверенности и высокая цена ошибки. В списке это меню
      и платёжный виджет: если они не сработают, переделывать придётся основу, а не одну настройку. Допущение про
      30 секунд можно не проверять заранее вовсе — дешевле запустить и поправить.

      В уроке «Что войдёт в первую версию» мы уже ранжировали неизвестные по цене ошибки, чтобы решить, о чём
      спрашивать заказчика первым. Здесь та же логика, но вопрос другой: что делать, когда спросить некого. Заказчик
      не знает, откроется ли меню за 2,5 секунды на дешёвом телефоне. Это можно только проверить.

      ## Чем проверять: прототип, расчёт или метрика

      Способ проверки зависит от того, на какой вопрос нужен ответ.

      - **Расчёт** — занимает минуты.
        - Отвечает на вопрос: хватит ли запросов, памяти, трафика.
        - Когда подходит: известно, сколько людей, как часто они обращаются и какой ответ получают.
      - **Прототип** — занимает дни.
        - Отвечает на вопрос: сработает ли это технически.
        - Когда подходит: до основной работы, если ошибка ударит по основе.
      - **Метрика** — занимает недели.
        - Отвечает на вопрос: как поведут себя люди и данные.
        - Когда подходит: ответ заранее не узнать, а ошибка не ударит по основе.

      **Расчёт** полезен чаще, чем кажется. Как считать нагрузку от опроса, разобрано в уроке «Как превратить
      «быстро» в цифры»: число открытых экранов, делённое на интервал опроса в секундах, — это запросов в секунду.
      Такую арифметику делают за минуту. Но смысл у неё появляется, только когда результат сравнили с пределом:
      сколько запросов выдерживает сервер. Сверить эти два числа с бэкендом — и есть проверка допущения номер 2.

      **Прототип** пишут, чтобы получить ответ, а не чтобы сохранить код. Хороший прототип начинается с вопроса
      и критерия успеха, записанных заранее: «Откроется ли меню из 300 блюд с фотографиями за 2,5 секунды на телефоне
      за 10 тысяч рублей при замедленной сети? Успех — 2,5 секунды или меньше в пяти замерах из пяти». И у него есть
      срок: «два дня». Без срока прототип незаметно превращается в продукт, а без критерия любой результат кажется
      «в целом нормальным».

      **Метрика** нужна там, где ответ знают только реальные люди. Поймут ли покупатели, что при входе блюда из двух
      корзин сложились, заранее не выяснить — можно только выпустить первую версию и посчитать. Здесь тоже важно
      заранее записать порог: «если больше 5 % покупателей сразу после входа убирают блюда из сложенной корзины,
      меняем правило слияния». Это и есть условие пересмотра из прошлого урока, только теперь к нему добавлено, чем
      именно его измерять.

      Если ошибка в допущении заставит переделывать основу, ждать метрики после запуска поздно: к тому времени поверх
      ошибки уже построено много кода. Такие допущения проверяют прототипом до начала основной работы.

      ## Развитие решения: усложнять по сигналу

      **Эволюционное проектирование** (evolutionary design) — подход, при котором систему начинают с простого решения,
      выполняющего сегодняшние требования, и усложняют, когда появляется конкретный сигнал: метрика перешла порог,
      в план попало новое требование. Проследим, как может развиваться отслеживание заказа.

      1. **Первая версия:** опрос сервера раз в 30 секунд. Требование — «статус в пределах минуты», и опрос его
         выполняет.
      2. **Сигнал:** бэкенд сообщил, что сервер заказов выдерживает 1 000 запросов в секунду на всё сразу, включая
         оформление новых заказов. Отдать 670 из них одному отслеживанию — слишком мало запаса. **Шаг:** экран
         опрашивает сервер, только пока вкладка видна, а после статуса «доставлен» прекращает. Запросов становится
         заметно меньше, а требование выполняется по-прежнему.
      3. **Сигнал:** в план попала карта, на которой курьер движется. Координаты нужны каждые несколько секунд, и
         опрос с такой частотой стоит слишком дорого. **Шаг:** постоянное соединение, по которому сервер сам
         присылает обновления.

      На каждом шаге сложность появляется ровно тогда, когда её требует сигнал. Постоянное соединение с первого дня
      стоило бы недель работы ради карты, которой в первой версии нет (урок «Как сравнивать решения» называл это
      предполагаемой функцией).

      Дёшево такое развитие обходится только при одном условии: экран не знает, как к нему приходит статус. Он
      подписывается на «статус заказа номер 42» через публичный интерфейс модуля отслеживания (урок «Зависимости
      и публичный интерфейс модуля»). Опрос внутри модуля можно заменить постоянным соединением, не трогая экран.

      ### Преждевременное масштабирование

      **Преждевременное масштабирование** — когда систему строят под нагрузку, объём данных или размер команды,
      которых нет и в обозримом будущем не будет. Сайт, разрезанный на отдельно выпускаемые приложения
      (микрофронтенды), для команды из четырёх человек, отрисовка только видимой части списка для 30 ресторанов, кластер серверов постоянных соединений в день запуска — всё это примеры.

      Сколько закладывать на рост? Мартин Фаулер в статье «Жертвенная архитектура» (Sacrificial Architecture) приводит
      правило, которое приписывает Джеффу Дину из Google: проектировать с запасом примерно в 10 раз от текущей
      нагрузки, но планировать переписывание раньше, чем нагрузка вырастет в 100 раз. Там же Фаулер разбирает eBay:
      в 1995 году сайт был набором скриптов на Perl, написанных за выходные, в 1997 году его переписали на C++,
      а в 2002-м — на Java. Первые версии не были ошибкой: на них eBay и вырос.

      Отсюда практический вывод: первую версию доставки разумно проектировать с запасом примерно в 10 раз сверх
      числа заказов, ожидаемого на старте, а не под миллионы. Но Фаулер предупреждает и о другом: чтобы систему можно
      было менять частями, нужны хорошие границы модулей. Экономят на масштабе, а не на качестве границ.

      Исключение — дорогие для изменения решения из урока «Как рисовать архитектуру»: формат сохранённых
      на устройствах данных, контракт API для выпущенных мобильных приложений, адреса страниц в закладках. О них
      думают заранее даже в первой версии. Но подумать — не значит построить функцию заранее: обычно хватает номера
      версии в данных или запаса в контракте.

      ## Обоснование через инварианты и ожидаемые изменения

      Сильное обоснование архитектуры отвечает на два вопроса: что должно оставаться верным при любом развитии
      и что, скорее всего, изменится. Для сервиса доставки это выглядит так.

      **Инварианты:**

      - деньги за заказ списываются не больше одного раза, даже при двойном нажатии «Оплатить» и обрыве связи;
      - окончательную цену и наличие блюд определяет сервер, а не клиент;
      - покупатель видит только свои заказы;
      - статус заказа меняется только по разрешённым переходам: доставленный заказ не может снова «готовиться».

      **Ожидаемые изменения:**

      - заказ из нескольких ресторанов;
      - карта с движущимся курьером;
      - новые способы оплаты;
      - нативное мобильное приложение рядом с сайтом.

      Теперь обоснование можно связать с устройством системы. Новые способы оплаты затронут только адаптер платёжного
      сервиса. Карта затронет только модуль отслеживания. Заказ из нескольких ресторанов изменит правила корзины,
      а они живут в одном модуле бизнес-правил (урок «Как делить систему на части»). Инварианты при этом держит сервер,
      и ни одно из ожидаемых изменений их не нарушит.

      Важно не путать инвариант с **текущим ограничением**. «Заказ — только из одного ресторана» выглядит как правило,
      но это решение о границах первой версии, и оно стоит в списке ожидаемых изменений. Если записать его в инварианты,
      его зашьют во многие места кода, и снять ограничение станет дорого. Поэтому в уроке «Что войдёт в первую версию»
      у каждой позиции заказа оставили поле «ресторан», хотя ресторан пока один. Проверка простая: если продукт может
      когда-нибудь захотеть это изменить, это не инвариант.

      На собеседовании такое обоснование звучит убедительно: «Я сделал так, потому что однократное списание
      гарантирует сервер, а карта курьера, которая наверняка появится, затронет только модуль отслеживания».

      ## Запись решения: ADR

      Чтобы решение не забывалось, его записывают. Самый известный формат предложил Майкл Нигард в 2011 году:
      **запись архитектурного решения** (Architecture Decision Record, ADR). Это короткий текстовый документ об одном
      решении, который лежит в репозитории рядом с кодом. Сайт сообщества adr.github.io определяет архитектурное
      решение как обоснованный выбор, отвечающий на функциональное или нефункциональное требование, а набор всех
      записей проекта называет **журналом решений** (decision log).

      У записи по Нигарду пять частей:

      - **Название** с номером — короткая фраза: «ADR 7: Статус заказа опросом сервера».
      - **Контекст** — какие силы действуют: требования, ограничения, допущения. Описываются как факты, без оценок.
      - **Решение** — что команда будет делать, полными предложениями: «Мы будем…».
      - **Статус** — «предложено», «принято», позже — «устарело» или «заменено» со ссылкой на новую запись.
      - **Последствия** — что изменится после решения, и хорошее, и плохое.

      Нигард советует укладываться в одну-две страницы и писать так, будто разговариваете с разработчиком, который
      придёт через год. Записи нумеруют по порядку, номера не переиспользуют. Отменённое решение не удаляют: его
      помечают «заменено» и пишут новую запись. Важно, что когда-то решение было таким, даже если сейчас оно другое.

      Вот как выглядит запись для отслеживания заказа:

      ```
      # ADR 7: Статус заказа опросом сервера

      Статус: принято

      ## Контекст
      Покупатель должен видеть новый статус заказа не позже чем через минуту.
      Карты с курьером в первой версии нет. В пятничный пик ожидается
      до 20 000 открытых экранов отслеживания: опрос раз в 30 секунд даст
      около 670 запросов в секунду. Сервер заказов выдерживает 1 000
      запросов в секунду на всё, включая оформление новых заказов.

      ## Решение
      Мы будем опрашивать сервер раз в 30 секунд, пока вкладка видна,
      и прекращать опрос после статуса «доставлен». Способ получения
      статуса скрыт внутри модуля отслеживания.

      ## Последствия
      Скрытые вкладки и доставленные заказы не нагружают сервер, поэтому
      в пик запросов меньше 670 в секунду. Статус может отставать
      от реального до 30 секунд. Пересмотреть, если в план попадёт карта
      с курьером или нагрузка от отслеживания в пик превысит 400 запросов
      в секунду.
      ```

      Новый разработчик из начала урока прочитает эту запись и поймёт: опрос выбран не по незнанию, а ради нагрузки
      и простоты, и известно, когда его менять. Если он всё-таки предложит постоянное соединение, он напишет ADR 15
      с новым контекстом, а ADR 7 получит статус «заменено записью 15».

      Подробно о записях решений — как вести журнал, когда запись нужна, а когда нет, как связать её с техническим
      долгом — в курсе 4, в теме «Технический долг как решение».

      ## Типичные ошибки

      - **Проверять удобное, а не опасное.** Неделя на выбор цвета кнопок и ни одного замера меню на дешёвом телефоне.
      - **Откладывать проверку основы до запуска.** Если допущение ложно, а поверх него уже построено полгода работы,
        метрика после запуска только сообщит, что переделывать придётся много.
      - **Прототип без вопроса, срока и критерия.** Он растёт, превращается в продукт и ничего не доказывает.
      - **Строить на миллион пользователей в первый день.** Кластер постоянных соединений для сервиса, который ещё
        не запущен, — преждевременное масштабирование.
      - **Экономить на границах модулей.** Без них постепенное развитие невозможно: любая замена расползается
        по всему коду.
      - **Записать текущее ограничение как инвариант.** «Один ресторан в заказе» окажется зашитым в десятке мест.
      - **Переписывать старую запись решения.** История теряется: никто не узнает, что решение было другим и почему
        его сменили. Правильно — новая запись и статус «заменено» у старой.

      ## Как спрашивают на интервью

      - «Какие у вашего решения риски и как бы вы их проверили до начала разработки?» — ждут одно-два опасных
        допущения и конкретный способ проверки: расчёт, прототип с критерием, метрику с порогом.
      - «Что изменится, если пользователей станет в 10 раз больше? А в 100?» — ждут, что вы назовёте, какая часть
        сломается первой и какой сигнал скажет, что пора её менять, а не перестроите всё заранее.
      - «Что в вашей архитектуре нельзя нарушать, а что, скорее всего, поменяется?» — проверяют, умеете ли вы отделять
        инварианты от текущих ограничений.

      ## Что вы теперь умеете

      Это последний урок курса «Системный дизайн: основы». Оглянемся на путь, который прошли вместе с сервисом
      доставки.

      - **Ставить задачу.** Отличать сценарий, требование и реализацию; задавать вопросы, которые меняют архитектуру;
        переводить «быстро» и «надёжно» в проверяемые цифры; ограничивать первую версию и отделять факты
        от допущений.
      - **Делить систему на части.** Проводить границы по ответственности; направлять зависимости от деталей к
        правилам и прятать внешние сервисы за адаптерами; проектировать компонент как контракт; рисовать путь данных
        и схемы нужного уровня.
      - **Устраивать состояние.** Различать виды состояния по владельцу и сроку жизни; назначать каждому виду данных
        одного владельца; решать, что вычислять, а что хранить; выбирать, что переживёт перезагрузку и попадёт
        в адрес страницы; описывать процесс как набор состояний и переходов.
      - **Проектировать обмен с сервером.** Отделять чтение от команд; формулировать, что нужно экрану от API и что
        обязан гарантировать сервер; продумывать загрузку, пустоту, частичный успех и ошибку как отдельные сценарии.
      - **Принимать и защищать решения.** Сравнивать варианты по требованиям, называть выигрыш, цену, риск и условие
        пересмотра; отличать оправданную сложность от предполагаемой функции; находить опасные допущения и проверять
        их; обосновывать решение инвариантами и ожидаемыми изменениями и записывать его.

      На собеседовании эти умения ложатся на шаги плана ответа RADIO из вводного урока:

      - требования (Requirements) — уроки 2–4;
      - общая схема (Architecture) — уроки 5–9;
      - модель данных (Data model) — уроки 10–14;
      - интерфейсы и API (Interface definition) — уроки 7 и 15–17;
      - обоснование выбора на любом шаге — уроки 18–19;
      - оптимизации (Optimizations) — тема второго и третьего курсов.

      Если собрать всё вместе, у вас есть архитектура приложения покупателя: от требований к отслеживанию заказа
      до контракта API корзины и записи о том, почему статус приходит опросом.

      ## Что дальше: курс «Данные и надёжность»

      В этом курсе мы назвали неизвестный исход запроса, устаревшие данные и обрыв связи, но почти не разбирали, как
      с ними работать: как безопасно повторить оплату, что делать с ответами, пришедшими не по порядку, как работать
      без сети. Второй курс посвящён именно этому — тому, что происходит между клиентом и сервером, когда всё идёт
      не по плану. Сквозной пример тот же — сервис доставки.

      - **Почему сеть всё усложняет.** Восемь известных заблуждений о распределённых вычислениях вроде
        «сеть надёжна» и «задержка равна нулю» и что они значат для фронтенда.
      - **Загрузка и кэш.** Когда и что загружать для экрана ресторана; как устроен кэш в браузере и когда данные
        в нём устаревают (стоп-лист блюд); как избежать лишних и одинаковых запросов; пагинация списка ресторанов,
        который меняется, пока его листают.
      - **Изменения и согласованность.** Гонки запросов в корзине; оптимистичные обновления и их откат; как не списать
        деньги дважды при повторе оплаты; что делать, когда два менеджера ресторана правят одно блюдо; формы
        и проверка ввода.
      - **Надёжность и восстановление.** Какие бывают сбои и когда повторять запрос; автосохранение в кабинете
        ресторана; приложение курьера, которое работает в подвале без связи; как не потерять работу пользователя;
        загрузка фотографий блюд; истёкшая сессия посреди оформления заказа.

      Допущения вроде «ответы приходят в том же порядке, в каком ушли запросы» или «повторное нажатие „Оплатить“
      безопасно» второй курс разберёт по одному и покажет, чем их заменить.

      ## Источники

      - [Documenting Architecture Decisions — Michael Nygard](https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions)
      - [Architectural Decision Records — adr.github.io](https://adr.github.io/)
      - [Sacrificial Architecture — Martin Fowler](https://martinfowler.com/bliki/SacrificialArchitecture.html)

questions:
  - id: sdb-intro-001
    topic: Введение
    subtopic: Что такое системный дизайн
    level: junior
    question: Команда проектирует видеосервис. Какой вопрос относится к системному дизайну фронтенда?
    options:
      - text: 'Что увидит человек, если сеть просела посреди просмотра'
        correct: true
        why: 'Поведение клиента при медленной или пропавшей сети — одна из главных тем фронтенд-проектирования: код работает на устройстве человека, а связь у него может быть плохой.'
      - text: 'Как разложить видеофайлы по серверам хранения в разных странах'
        why: 'Это вопрос бэкенда: как устроено хранение на стороне компании. Клиент увидит только результат — адрес, откуда грузить видео.'
      - text: 'Сколько серверов нужно, чтобы выдержать вечерний пик просмотров'
        why: 'Нагрузка на серверы и их количество — задача системного дизайна бэкенда. Во фронтенде сервер обычно остаётся «чёрным ящиком» с API.'
      - text: 'Как сжимать видео на серверах после загрузки автором'
        why: 'Обработка файлов на серверах компании — это бэкенд. Фронтенд решает, как файл загрузить и что показать, пока он обрабатывается.'
    explanation: |
      Системный дизайн фронтенда проектирует клиентскую часть: из каких частей она состоит, где живут данные, как клиент
      говорит с сервером и что происходит при сбоях и медленной сети. Хранение файлов, нагрузка на серверы и обработка
      видео — задачи бэкенда; для фронтенда сервер обычно «чёрный ящик» с API.
    links:
      - https://www.greatfrontend.com/front-end-system-design-playbook/framework

  - id: sdb-intro-002
    topic: Введение
    subtopic: Что такое системный дизайн
    level: middle
    question: Команда делает трекер задач. Какое из обсуждаемых решений архитектурное?
    options:
      - text: 'Хранить черновик задачи только на устройстве или сразу же на сервере'
        correct: true
        why: 'От этого зависят API, работа без сети и то, увидит ли человек задачу на другом устройстве. Такое решение затрагивает много частей системы и дорого меняется потом.'
      - text: 'Вынести форму задачи в отдельный компонент или оставить в странице'
        why: 'Это локальная перестановка кода: её можно сделать за час, и остальная система этого не заметит.'
      - text: 'Подсвечивать просроченные задачи красным цветом или значком с часами'
        why: 'Это решение об интерфейсе, а не об устройстве системы: его легко поменять, и оно ничего не затрагивает, кроме одного места.'
      - text: 'Сортировать задачи встроенным методом sort или функцией из lodash'
        why: 'Это деталь реализации внутри одной функции. Её замена не влияет ни на API, ни на хранение данных.'
    explanation: |
      Архитектурное решение влияет на многие части системы и дорого обходится, если его менять потом. Где хранить
      незаконченную задачу — такое решение: от него зависят API, синхронизация между устройствами и поведение без сети.
      Компонент формы, цвет подсветки и способ сортировки меняются локально и быстро.
    links:
      - https://martinfowler.com/architecture/

  - id: sdb-intro-004
    topic: Введение
    subtopic: Что такое системный дизайн
    level: senior
    multiple: true
    question: |
      Команда проектирует онлайн-банк и делит вопросы между фронтенд- и бэкенд-разработчиками. Какие из них относятся
      к системному дизайну фронтенда?
    options:
      - text: 'Что увидит клиент, если ответ на перевод денег так и не пришёл'
        correct: true
        why: 'Поведение клиента, когда связь подвела посреди действия, — прямая задача фронтенд-проектирования.'
      - text: 'Какую гарантию должен дать сервер, чтобы повтор не списал деньги дважды'
        correct: true
        why: 'Звучит как бэкенд, но решать, какой API и какие гарантии нужны клиенту, — задача фронтенд-проектирования. Как сервер эту гарантию выполнит внутри, — уже вопрос бэкенда.'
      - text: 'Что показать клиенту, пока перевод дольше минуты «в обработке»'
        correct: true
        why: 'Какие состояния видит человек при медленной операции и что ему можно делать в это время, — задача фронтенд-проектирования.'
      - text: 'Как разделить базу данных со счетами клиентов между двумя дата-центрами'
        why: 'Устройство базы данных — задача бэкенда. Для фронтенда сервер остаётся «чёрным ящиком» с API.'
      - text: 'Как часто делать резервную копию базы со счетами клиентов'
        why: 'Устройство и сохранность хранилища на стороне компании — задача бэкенда.'
    explanation: |
      Граница проходит не по слову «сервер», а по тому, где работает код и что решает клиент. Фронтенд-проектирование
      отвечает за то, что человек видит при сбоях и медленных операциях, и за контракт с сервером — какой API нужен
      и какие гарантии сервер обязан дать. Как сервер устроен внутри — базы, дата-центры, резервные копии, — решает
      бэкенд.
    links:
      - https://www.greatfrontend.com/front-end-system-design-playbook/framework

  - id: sdb-requirements-001
    topic: Постановка задачи
    subtopic: Выяснение требований
    level: junior
    question: Команда видеосервиса обсуждает функцию «продолжить просмотр». Какая формулировка — функциональное требование?
    options:
      - text: 'Запоминать место остановки и предлагать продолжить с него на любом устройстве'
        correct: true
        why: 'Здесь сказано, что система должна уметь, и не сказано, как это сделать. Такое требование можно выполнить разными способами.'
      - text: 'Человек начал серию в метро на телефоне и досматривает её дома на телевизоре'
        why: 'Это пользовательский сценарий: ситуация и желание человека. Требование описывает, что для этого должна уметь система.'
      - text: 'Каждые 10 секунд отправлять на сервер позицию просмотра запросом PUT'
        why: 'Это реализация — конкретный способ выполнить требование. Его можно заменить другим, а требование останется прежним.'
      - text: 'Место остановки восстанавливается не дольше чем за одну секунду'
        why: 'Это нефункциональное требование: оно говорит, насколько быстро, а не что система делает.'
    explanation: |
      Сценарий описывает человека и его ситуацию, функциональное требование — что умеет система, нефункциональное —
      насколько хорошо она это делает, реализация — как это сделано. Уровни разделяют, чтобы не выбрать способ решения
      раньше времени: требование «запоминать место остановки» можно выполнить по-разному, а формулировка «отправлять PUT
      каждые 10 секунд» уже сделала выбор за вас.
    links:
      - https://www.greatfrontend.com/front-end-system-design-playbook/framework

  - id: sdb-requirements-002
    topic: Постановка задачи
    subtopic: Выяснение требований
    level: middle
    question: |
      Руководитель продукта в трекере задач говорит: «Нам нужен WebSocket для списка задач». Что разумно сделать
      первым?
    options:
      - text: 'Спросить, как быстро людям нужно видеть изменения, сделанные коллегами'
        correct: true
        why: 'WebSocket — способ, а не цель. Ответ на вопрос «зачем» даст настоящее требование, а вместе с ним — выбор между разными способами.'
      - text: 'Начать с сервера WebSocket: руководитель продукта лучше знает, что нужно'
        why: 'Так решение принимается за требование. Если на деле хватит обновления раз в минуту, постоянное соединение окажется лишней работой.'
      - text: 'Предложить вместо WebSocket опрос сервера раз в минуту как более простой'
        why: 'Это снова решение без требования, только другое. Пока неизвестно, как быстро должны появляться изменения, нельзя сказать, хватит ли опроса.'
      - text: 'Отказаться: в трекере задач обновления в реальном времени не нужны'
        why: 'Это допущение без проверки. Если команда двигает карточки одновременно, быстрые обновления как раз могут быть важны.'
    explanation: |
      «Нужен WebSocket» — решение, замаскированное под требование. Вопрос «что должно происходить у пользователя?»
      возвращает разговор к сути: например, «изменения коллег появляются у меня в течение пары секунд». Только после
      этого можно сравнивать WebSocket, опрос сервера и другие способы.
    links:
      - https://www.greatfrontend.com/front-end-system-design-playbook/framework

  - id: sdb-requirements-003
    topic: Постановка задачи
    subtopic: Выяснение требований
    level: middle
    question: |
      Школа онлайн-обучения просит сделать каталог курсов. Известно: курсов около 40, каталог обновляется раз в неделю,
      его открывают и с телефона, и с компьютера. Какой вопрос сейчас важнее всего задать?
    options:
      - text: 'Нужно ли, чтобы курсы находили поисковики и мессенджеры показывали превью'
        correct: true
        why: 'Ответ меняет способ рендеринга: для поисковиков и превью нужен готовый HTML с сервера. В условии об этом ничего нет, значит, это главный открытый вопрос.'
      - text: 'Нужна ли бесконечная прокрутка каталога или постраничная навигация'
        why: 'При 40 курсах это почти ничего не меняет: весь каталог помещается в один ответ сервера и на одну страницу.'
      - text: 'Должен ли каталог обновляться у людей в реальном времени, без перезагрузки'
        why: 'Каталог меняется раз в неделю — это уже известно из условия. Постоянные обновления здесь не нужны.'
      - text: 'Какую библиотеку управления состоянием взять для фильтров каталога'
        why: 'Это вопрос реализации, а не требований. Библиотеку выбирают, когда понятно, что именно нужно сделать.'
    explanation: |
      Сначала задают вопросы, ответ на которые меняет архитектуру, и не тратят время на те, ответ на которые уже
      известен. Объём (40 курсов) и частота обновлений (раз в неделю) даны в условии, а нужны ли поисковики и превью
      ссылок — нет. От этого зависит, придётся ли отдавать страницы с сервера.
    links:
      - https://www.greatfrontend.com/front-end-system-design-playbook/framework

  - id: sdb-requirements-004
    topic: Постановка задачи
    subtopic: Выяснение требований
    level: middle
    question: |
      Команда онлайн-школы выписала входы функции «покупка курса»: ученик выбрал курс, нажал «Оплатить» и ввёл данные
      карты. Какого входа в этом списке не хватает?
    options:
      - text: 'Подтверждения оплаты от платёжного сервиса'
        correct: true
        why: 'Это событие из внешней системы, и оно тоже вход. Оно может задержаться, прийти дважды или не прийти совсем — и для каждого случая нужен сценарий.'
      - text: 'Письма с чеком, которое уходит на почту ученика'
        why: 'Письмо система отправляет сама — это выход, а не вход.'
      - text: 'Показа первого урока сразу после успешной оплаты'
        why: 'Это то, что система показывает в ответ, — выход.'
      - text: 'Нажатия ученика на кнопку «Оплатить»'
        why: 'Это вход, но он уже есть в списке команды. Не хватает события, которое приходит не от ученика.'
    explanation: |
      Входы — то, что приходит в систему: действия людей и события внешних систем. Выходы — то, что система показывает
      и отправляет. В списке только действия ученика, а подтверждение оплаты приходит от платёжного сервиса. Если его
      не выписать, потеряются сценарии «оплата подтвердилась через десять минут» и «подтверждение не пришло».
    links:
      - https://www.greatfrontend.com/front-end-system-design-playbook/framework

  - id: sdb-requirements-005
    topic: Постановка задачи
    subtopic: Выяснение требований
    level: senior
    multiple: true
    question: |
      Фотохостинг для фотографов-любителей. Уже известно, что сайтом пользуются только в браузере на компьютере.
      Какие вопросы стоит задать в первые минуты, потому что ответ на них меняет архитектуру?
    options:
      - text: 'Должны ли альбомы открываться по ссылке у людей без аккаунта'
        correct: true
        why: 'От ответа зависят проверка доступа, отдача страниц людям без входа и, возможно, превью ссылок в мессенджерах.'
      - text: 'Нужно ли загружать фото без сети и отправлять их позже'
        correct: true
        why: 'Работа без сети требует хранить фото на устройстве и вести очередь отправки — это заметно меняет устройство клиента.'
      - text: 'Сколько фото бывает в альбоме: десятки или тысячи'
        correct: true
        why: 'От объёма зависят пагинация, отрисовка только видимой части и размер ответов сервера.'
      - text: 'С каких устройств и в каких браузерах открывают сайт'
        why: 'Это уже известно из условия: только браузер на компьютере. Повторять вопрос — терять время.'
      - text: 'Какую готовую библиотеку галереи взять для просмотра фото'
        why: 'Это вопрос реализации. Его решают после того, как понятны требования.'
    explanation: |
      В первые минуты задают вопросы, ответ на которые меняет устройство системы: кто и как получает доступ, нужна ли
      работа без сети, сколько данных. Вопрос, ответ на который уже дан, и выбор библиотеки к ним не относятся.
    links:
      - https://www.greatfrontend.com/front-end-system-design-playbook/framework

  - id: sdb-quality-001
    topic: Постановка задачи
    subtopic: Атрибуты качества и ограничения
    level: junior
    multiple: true
    question: |
      Заказчик дашборда аналитики продаж пишет в задаче: «Дашборд должен быть быстрым». Какие формулировки
      превращают это пожелание в проверяемый критерий?
    options:
      - text: 'Главный график появляется за 2 с в 75 % открытий на офисном ноутбуке через рабочую сеть'
        correct: true
        why: 'Здесь есть всё, что нужно для замера: событие (открытие), реакция (виден главный график), условия (офисный ноутбук и рабочая сеть) и мера (2 секунды на 75-м процентиле).'
      - text: 'Дашборд открывается мгновенно, и людям не приходится ждать, пока появятся данные'
        why: 'Слово «мгновенно» нельзя измерить: непонятно, какое время считать выполнением. Это то же «быстро», только другими словами.'
      - text: 'Графики рисуются на Canvas, а ответы сервера хранятся в кэше браузера сутки'
        why: 'Это реализация — способ сделать дашборд быстрым. Она не говорит, какой результат считать достаточным, и его по-прежнему нечем измерить.'
      - text: 'Дашборд работает быстро даже на слабых ноутбуках в региональных филиалах'
        why: 'Условия названы, но меры нет: сколько секунд и у какой доли открытий — неизвестно. Выполнено ли это, каждый решит по-своему.'
    explanation: |
      Проверяемый критерий отвечает на четыре вопроса: что происходит, в каких условиях, как должна отреагировать
      система и чем это измеряем. Этот приём называют сценарием атрибута качества (quality attribute scenario).
      Время обычно меряют процентилем: «2 секунды в 75 % открытий» означает, что так быстро должно быть как минимум
      у трёх человек из четырёх. Без условий число теряет смысл, без меры — условия ничего не обещают. Здесь
      проверяемая формулировка только одна: остальные называют либо ощущение, либо способ, либо условия без числа.
    links:
      - https://quality.arc42.org/articles/specify-quality-requirements#the-sei-approach-quality-attribute-scenarios
      - https://web.dev/articles/vitals?hl=ru#core-web-vitals

  - id: sdb-quality-002
    topic: Постановка задачи
    subtopic: Атрибуты качества и ограничения
    level: middle
    question: |
      Сервис записи к врачу делает виджет, который клиники ставят на свои сайты. Команда собрала ограничения:

      - на сайтах многих клиник политика безопасности контента не даёт выполнить скрипт, загруженный с чужого домена;
      - каждая клиника хочет выбрать цвет кнопок под свой фирменный стиль;
      - запуск — к началу сентября, до него четыре месяца;
      - все тексты виджета на русском, других языков не планируют.

      Какое ограничение сильнее всего определит устройство виджета и к чему оно приведёт?
    options:
      - text: 'Запрет чужих скриптов: виджет придётся показывать своей страницей во встроенном окне'
        correct: true
        why: 'Если скрипт с вашего домена на сайте клиники выполнить нельзя, остаётся показывать виджет своей страницей во встроенном окне (iframe). От этого зависят размеры, обмен данными с сайтом и стили.'
      - text: 'Выбор цвета клиникой: виджету понадобится отдельная система тем под каждый сайт'
        why: 'Цвет кнопок — настройка, которую можно передать виджету параметром. Устройство виджета она почти не меняет.'
      - text: 'Срок к сентябрю: виджет придётся писать без фреймворка, чтобы успеть быстрее'
        why: 'Срок ограничивает объём первой версии, но из него не следует отказ от фреймворка. Ни один способ встраивания он не исключает.'
      - text: 'Тексты на русском: нужна система переводов, чтобы позже легко добавить языки'
        why: 'Других языков не планируют, поэтому для первой версии это ограничение архитектуру не трогает, а система переводов — лишняя работа.'
    explanation: |
      Архитектурно значимое ограничение убирает часть вариантов решения или заставляет выбрать определённый.
      Проверка: если его убрать, поменяется ли устройство системы? Политика безопасности контента (Content Security
      Policy) — правило сайта-хозяина, откуда можно загружать скрипты. Если она не пускает ваш скрипт, обычный способ
      встраивания закрыт, и виджет показывают своей страницей во встроенном окне. Цвет кнопок, срок и язык текстов
      влияют на объём работы, но не на то, как виджет устроен.
    links:
      - https://developer.mozilla.org/ru/docs/Web/HTTP/Guides/CSP

  - id: sdb-quality-003
    topic: Постановка задачи
    subtopic: Атрибуты качества и ограничения
    level: middle
    multiple: true
    question: |
      В задаче на веб-версию онлайн-банка записано: «Переводы должны работать надёжно». Какие формулировки
      превращают это пожелание в проверяемые критерии?
    options:
      - text: 'Если связь пропала после «Перевести», клиент потом видит, ушёл ли перевод'
        correct: true
        why: 'Описаны событие, условия и ожидаемая реакция. Тестировщик может выключить сеть посреди перевода и посмотреть, что увидит клиент.'
      - text: 'Если страница перезагрузилась до отправки, введённые сумма и реквизиты остаются в форме'
        correct: true
        why: 'Это наблюдаемое поведение при конкретном событии: перезагрузить страницу и посмотреть, сохранился ли ввод. Число здесь не нужно, результат и так однозначен.'
      - text: 'Переводы работают стабильно при любом качестве связи и на любом устройстве'
        why: 'Ни реакции, ни меры: что значит «стабильно», непонятно. К тому же «при любом качестве связи» невыполнимо — без сети перевод не уйдёт.'
      - text: 'Каждый запрос на перевод повторяется до трёх раз с растущей паузой между попытками'
        why: 'Это реализация, а не критерий. Она не говорит, что должен увидеть клиент, а повтор перевода без защиты от двойного списания может даже навредить.'
    explanation: |
      Проверяемый критерий не обязан быть числом. Для надёжности часто достаточно описать событие (пропала сеть,
      перезагрузилась страница) и то, что человек должен увидеть после него. Такую формулировку проверяют прямо:
      воспроизводят событие и смотрят на результат. Слова «стабильно» и «при любых условиях» проверить
      нельзя, а способ реализации — например, повтор запросов — ещё не говорит, чего мы хотим добиться.
    links:
      - https://quality.arc42.org/articles/specify-quality-requirements#the-sei-approach-quality-attribute-scenarios

  - id: sdb-quality-004
    topic: Постановка задачи
    subtopic: Атрибуты качества и ограничения
    level: senior
    question: |
      Дашборд продаж для директоров магазинов открывают на телефоне много раз за день, часто через мобильный
      интернет, и экран может долго оставаться открытым. Цифры на сервере пересчитываются раз в 15 минут,
      в непредсказуемый момент: когда будет следующий пересчёт, клиент не знает. Заказчик
      уточнил приоритеты: цифры на экране могут отставать от расчёта сервера не больше чем на 5 минут, а важнее
      всего, чтобы телефон доживал до вечера. Как часто дашборду запрашивать цифры?
    options:
      - text: 'Раз в 5 минут, пока экран открыт, и сразу при возврате на вкладку'
        correct: true
        why: 'Пока момент пересчёта неизвестен, наибольшее отставание равно интервалу опроса. Раз в 5 минут — самый редкий опрос, который ещё укладывается в допустимое отставание. Запрос при возврате на вкладку сразу показывает свежие цифры тому, кто отходил.'
      - text: 'Раз в 15 минут: чаще цифры на сервере всё равно не меняются'
        why: 'Если запрос пришёлся прямо перед пересчётом, новые цифры появятся на экране почти через 15 минут. Это нарушает согласованный предел в 5 минут.'
      - text: 'Раз в 10 секунд, чтобы новые цифры появлялись на экране почти сразу'
        why: 'Отставание станет меньше, чем нужно заказчику, зато запросов в 30 раз больше. Почти все они вернут то же самое, а батарея — главный приоритет — пострадает.'
      - text: 'Только при открытии экрана и по кнопке «Обновить», без опроса в фоне'
        why: 'Батарея сэкономлена, но директор, который держит экран открытым час, будет смотреть на цифры часовой давности.'
    explanation: |
      Свежесть и экономия батареи конфликтуют: каждый запрос будит радиомодуль телефона. Решить такой конфликт
      помогают два шага. Первый — превратить «всегда свежие» в число: отставание не больше 5 минут. Второй — выбрать
      по приоритету: раз важнее батарея, берём самый редкий опрос, который ещё укладывается в критерий.
      Пока момент пересчёта неизвестен, наибольшее отставание равно интервалу опроса: пересчёт может случиться сразу
      после запроса. Поэтому интервал выбирают по допустимому отставанию (5 минут), а не по частоте пересчёта. Если бы
      сервер сообщал время следующего пересчёта, хватило бы одного запроса сразу после него.
    links:
      - https://quality.arc42.org/articles/specify-quality-requirements#the-sei-approach-quality-attribute-scenarios

  - id: sdb-quality-005
    topic: Постановка задачи
    subtopic: Атрибуты качества и ограничения
    level: senior
    question: |
      Банк предлагает партнёрам встраиваемый виджет с курсом валют. Виджет узнаёт курс, опрашивая сервер. В вечерний
      пик виджет открыт и виден на экране на 30 000 страниц одновременно. Сервер курсов выдерживает не больше 1000
      запросов в секунду, а увеличить его мощность в этом году нельзя. Отдел продаж уже обещает партнёрам:
      «Курс обновляется каждые 10 секунд». Что разумно сделать?
    options:
      - text: 'Предложить раз в 60 секунд: это 500 запросов в секунду, вдвое ниже предела'
        correct: true
        why: '30 000 страниц / 10 с = 3000 запросов в секунду, а сервер выдерживает 1000. Раз в 60 секунд — 500 запросов: остаётся запас на повторы и всплески. Обещание придётся изменить, и сказать об этом нужно до запуска.'
      - text: 'Предложить раз в 30 секунд: это ровно 1000 запросов в секунду, сервер справится'
        why: '30 000 / 30 = 1000 — ровно на пределе. Любые повторы после ошибок и всплески при одновременном открытии его превысят, а запаса нет.'
      - text: 'Оставить 10 секунд, но опрашивать сервер только с тех страниц, где виджет виден'
        why: 'В условии все 30 000 виджетов как раз видны на экране, так что нагрузка не уменьшится. Приём полезный, но здесь он ничего не даёт.'
      - text: 'Оставить 10 секунд: ответы маленькие, и короткий вечерний пик сервер переживёт'
        why: 'Предел сервера — ограничение, а не пожелание. Втрое больше запросов, чем он выдерживает, — это отказ в самый нагруженный час.'
    explanation: |
      Нагрузку от опроса легко посчитать: число открытых клиентов, делённое на интервал опроса, — запросов в секунду.
      Здесь свежесть курса конфликтует с ограничением сервера, и ограничение выиграть нельзя. Честный ход — изменить
      обещание продукта: показать отделу продаж расчёт и предложить интервал, который сервер выдержит с запасом.
      Впритык к пределу работать нельзя: повторы и всплески его превысят. Обещание,
      которое система не может выполнить, лучше исправить до запуска, чем объяснять отказ партнёрам после.
    links:
      - https://quality.arc42.org/articles/specify-quality-requirements

  - id: sdb-scope-001
    topic: Постановка задачи
    subtopic: Границы, допущения, приоритеты
    level: junior
    question: |
      Сервис бронирования столиков в ресторанах готовит первую версию. На неё шесть недель и два разработчика.
      Какой объём лучше подходит для первой версии?
    options:
      - text: 'Поиск по одному городу, выбор времени, бронь и подтверждение на почту'
        correct: true
        why: 'Это узкий, но сквозной путь: человек может найти ресторан и действительно забронировать столик. С первой недели после запуска появятся настоящие брони и отзывы.'
      - text: 'Поиск по всем городам с фильтрами и картой, бронь — во второй версии'
        why: 'Это нарезка по слоям: поиск сделан богато, а главное действие не работает. Показать такую версию людям нельзя — забронировать ничего не получится.'
      - text: 'Все экраны будущего продукта, но в каждом только основные поля и кнопки'
        why: 'Это «половина каждого экрана»: работы много, а законченного пути может не оказаться ни одного. Проблемы стыков найдутся только в конце.'
      - text: 'Бронь с оплатой депозита, отзывы и бонусная программа — к одному запуску'
        why: 'Это попытка уместить всё сразу. За шесть недель вдвоём такой объём не сделать, и к сроку будет много начатого и ничего законченного.'
    explanation: |
      MVP (минимально жизнеспособный продукт) — самая маленькая версия, которой люди уже могут пользоваться для
      главной задачи. Резать объём выгодно вдоль пути пользователя, а не по слоям: один город и одно подтверждение
      на почту, но бронь работает от поиска до подтверждения. Такой вертикальный срез сразу проходит через все части
      системы и даёт отзывы настоящих людей.
    links:
      - https://blog.crisp.se/2016/01/25/henrikkniberg/making-sense-of-mvp

  - id: sdb-scope-002
    topic: Постановка задачи
    subtopic: Границы, допущения, приоритеты
    level: junior
    question: |
      Команда фотохостинга записывает, что известно о продукте перед проектированием. Какое утверждение из этого
      списка — допущение?
    options:
      - text: 'Альбомов больше 500 фото почти не бывает — так кажется команде'
        correct: true
        why: 'Команда принимает это за правду, чтобы двигаться дальше, но ни данных, ни документа, ни ответа заказчика за этим нет. Такое утверждение помечают как допущение и пишут, кто и когда может его подтвердить.'
      - text: 'По данным аналитики, 80 % фото загружают с телефонов, а не с компьютеров'
        why: 'Это факт: он подтверждён данными аналитики.'
      - text: 'Хранилище файлов по договору принимает файлы размером до 50 МБ каждый'
        why: 'Это факт: он записан в договоре с внешним сервисом.'
      - text: 'Показывать ли альбомы людям без аккаунта, заказчик ещё не решил'
        why: 'Это открытый вопрос: ответ должен дать заказчик, и угадывать его команда не может.'
    explanation: |
      Всё, что команда «знает», бывает трёх сортов. Факт подтверждён данными, документом или ответом заказчика.
      Допущение принимают за правду без подтверждения, чтобы не стоять на месте. Открытый вопрос — то, чего не знают
      и не могут разумно предположить. Допущения опасны тем, что через месяц их принимают за факты, поэтому их
      помечают отдельно.
    links:
      - https://www.greatfrontend.com/front-end-system-design-playbook/framework#what-are-the-core-features-to-focus-on-and-which-are-good-to-have

  - id: sdb-scope-003
    topic: Постановка задачи
    subtopic: Границы, допущения, приоритеты
    level: middle
    question: |
      Команда корпоративного чата готовит первую версию и записала допущения. Ни одно пока не подтверждено, и каждое
      может оказаться неверным примерно с одинаковой вероятностью. Ошибка в каком допущении обойдётся дороже всего?
    options:
      - text: 'Отправленное сообщение никогда не меняют и не удаляют'
        correct: true
        why: 'Если правка и удаление понадобятся, изменятся модель сообщения и API, придётся доставлять изменения всем участникам и обновлять уже загруженную историю на каждом устройстве. Это затрагивает почти всю систему.'
      - text: 'Ссылки в сообщениях можно показывать без превью страницы'
        why: 'Превью потом добавляется к сообщению как новое поле и новый блок в интерфейсе. Остальная система этого почти не заметит.'
      - text: 'Для начала хватит поиска только по названиям чатов'
        why: 'Поиск по тексту сообщений — новая функция рядом с уже сделанными. Работы немало, но переделывать готовое почти не придётся.'
      - text: 'Звук уведомления можно сделать одним и тем же для всех чатов'
        why: 'Это одна настройка в одном месте. Если окажется неверным, поправят за день.'
    explanation: |
      Опасность допущения зависит от вероятности, что оно неверно, и от цены изменения — сколько частей системы
      придётся переделать. Когда вероятности равны, решает цена. Дорого меняется то, что затрагивает модель данных
      и API, много экранов, уже сохранённые данные. Неизменяемость сообщений — как раз такое допущение. Превью ссылок,
      поиск и звук — добавки или локальные настройки.
    links:
      - https://blog.crisp.se/2016/01/25/henrikkniberg/making-sense-of-mvp

  - id: sdb-scope-004
    topic: Постановка задачи
    subtopic: Границы, допущения, приоритеты
    level: senior
    question: |
      Офисный сервис бронирования переговорных. Команда выписала, что известно о четырёх неясных местах:

      - повторяющиеся брони вроде «каждый вторник в 10:00» — заказчик не уверен, понадобятся ли;
      - фото переговорных в карточке брони — заказчик не уверен, нужны ли;
      - часовые пояса — все офисы в одном городе, других не планируется, заказчик это подтвердил;
      - число пользователей — заказчик называет от 200 до 400.

      До начала проектирования есть время выяснить у заказчика только один вопрос. Какой выбрать?
    options:
      - text: 'Нужны ли повторяющиеся брони'
        correct: true
        why: 'Ответ неизвестен, а ошибка дорогая: повторяющиеся брони меняют модель данных, API и поиск пересечений занятости. Только догадка и дорогая переделка — это и выясняют первым.'
      - text: 'Нужны ли фото переговорных'
        why: 'Ответ неизвестен, но ошибка дешёвая: фото добавляются к карточке как новое поле и картинка, остальная система этого не заметит. Такое решают по ходу.'
      - text: 'Как учитывать часовые пояса'
        why: 'Ошибка здесь была бы дорогой, но ответ уже подтверждён — это факт. Его записывают и не тратят на него единственный вопрос.'
      - text: 'Сколько будет пользователей'
        why: 'Точное число неизвестно, но разница между 200 и 400 пользователями не меняет устройство сервиса. Неопределённость есть, а цены у неё почти нет.'
    explanation: |
      Каждое неизвестное оценивают по двум осям: насколько мы уверены и сколько стоит переделка, если ответ окажется
      другим. Выяснять первым нужно то, что одновременно держится только на догадке и дорого в переделке. Догадку
      с дешёвой переделкой решают по ходу, подтверждённое записывают как факт и не тратят на него вопрос. Признаки
      дорогой переделки — модель данных и API, много экранов, сохранённые данные. Похожий приём
      в продуктовой работе называют картой допущений (assumptions mapping).
    links:
      - https://www.greatfrontend.com/front-end-system-design-playbook/framework#what-are-the-core-features-to-focus-on-and-which-are-good-to-have

  - id: sdb-scope-005
    topic: Постановка задачи
    subtopic: Границы, допущения, приоритеты
    level: middle
    multiple: true
    question: |
      Фотохостинг для семейных альбомов. Главный сценарий: после поездки человек загружает с телефона 100–300 фото
      и отправляет родственникам ссылку на альбом; у большинства родственников аккаунта нет. На первую версию —
      два месяца. Что разумно отложить на следующие версии?
    options:
      - text: 'Редактор фото с фильтрами и обрезкой'
        correct: true
        why: 'Главный сценарий работает и без редактора: фото загрузили, ссылку отправили, родственники посмотрели.'
      - text: 'Комментарии и «нравится» под каждым фото'
        correct: true
        why: 'Это приятное дополнение, но путь «загрузить — поделиться — посмотреть» без него не ломается.'
      - text: 'Заказ печатной фотокниги из альбома'
        correct: true
        why: 'Это отдельный сценарий с оплатой и доставкой. Главный путь от него не зависит, а работы в нём много.'
      - text: 'Просмотр альбома по ссылке без аккаунта'
        why: 'Это часть главного пути: у большинства родственников аккаунта нет, и без этого они ничего не увидят.'
      - text: 'Загрузку многих фото за один раз'
        why: 'При 100–300 фото загрузка по одному превращает главный сценарий в час нажатий. Без этого путь формально есть, но им никто не пройдёт.'
    explanation: |
      Первая версия — сквозной путь главного сценария, и всё, что лежит на этом пути, в неё входит, даже если выглядит
      мелочью. Откладывают то, без чего путь всё равно проходится: дополнения вроде комментариев, отдельные сценарии
      вроде печати, инструменты вроде редактора. Отложенное записывают в список «за рамками первой версии», чтобы
      его не начали делать тихо и чтобы заказчик согласился с этим заранее.
    links:
      - https://blog.crisp.se/2016/01/25/henrikkniberg/making-sense-of-mvp
      - https://www.greatfrontend.com/front-end-system-design-playbook/framework#what-are-the-core-features-to-focus-on-and-which-are-good-to-have

  - id: sdb-responsibility-001
    topic: Декомпозиция системы
    subtopic: Ответственность и границы
    level: junior
    question: |
      Почтовый клиент. Правило: письмо нельзя отправить, если в нём нет ни одного получателя или вложения весят
      больше 25 МБ. К какому виду ответственности относится это правило?
    options:
      - text: 'К бизнес-правилам: это знание о том, что разрешено делать с письмом'
        correct: true
        why: 'Правило говорит, что разрешено в предметной области, и не зависит ни от кнопок, ни от сервера. Его удобно записать одной функцией и вызывать отовсюду, где оно нужно.'
      - text: 'К отображению: от правила зависит, будет ли кнопка «Отправить» активной'
        why: 'Кнопка только показывает результат проверки. Если правило живёт в кнопке, его придётся повторить, например, в обработчике сочетания клавиш для отправки.'
      - text: 'К сценарию отправки: правило проверяется как один из шагов отправки'
        why: 'Сценарий вызывает проверку как шаг, но само знание о лимитах ему не принадлежит. То же правило нужно и без отправки — например, чтобы заранее предупредить о слишком тяжёлом вложении.'
      - text: 'К доступу к данным: размер вложений известен после загрузки на сервер'
        why: 'Доступ к данным знает, как загрузить файл и получить ответ, но не решает, что разрешено. Лимит в 25 МБ — правило предметной области, а не способ разговаривать с сервером.'
    explanation: |
      Внутри функции продукта различают четыре вида ответственности: отображение (как показать), сценарий (в каком
      порядке выполнить шаги), бизнес-правила (что разрешено и как считается) и доступ к данным (где взять и куда
      сохранить). «Без получателя и с вложениями больше 25 МБ отправлять нельзя» — знание о предметной области,
      то есть бизнес-правило. Кнопка показывает его результат, сценарий отправки его вызывает, но записано оно
      в одном месте.
    links:
      - https://martinfowler.com/bliki/PresentationDomainDataLayering.html

  - id: sdb-responsibility-002
    topic: Декомпозиция системы
    subtopic: Ответственность и границы
    level: middle
    question: |
      Редактор документов. Компонент панели инструментов сам загружает документ, по роли пользователя и статусу
      «на согласовании» решает, какие кнопки активны, и рисует их. Ту же проверку скопировали в боковую панель
      комментариев и в обработчик горячих клавиш. На телефоне панель инструментов не показывается вовсе. Продукт
      добавляет роль «только комментарии», а при прошлом похожем изменении одну из копий забыли поправить.
      Как изменить структуру?
    options:
      - text: 'Вынести правило «что можно делать с документом» в модуль документа и вызывать его из трёх мест'
        correct: true
        why: 'Правило станет бизнес-правилом модуля документа: оно окажется в одном месте и не будет зависеть от того, какие компоненты сейчас на экране. Новую роль добавят один раз, а правило можно проверить тестом без отрисовки.'
      - text: 'Оставить правило в панели инструментов и передавать готовые флаги в боковую панель и горячие клавиши'
        why: 'Правило по-прежнему живёт в компоненте отображения. На телефоне панель не отрисовывается, и боковая панель с горячими клавишами останутся без флагов.'
      - text: 'Оставить три копии проверки, но добавить тест, который сверяет их результаты между собой'
        why: 'Тест поймает расхождение только после того, как его допустят. Каждое изменение по-прежнему требует правок в трёх местах.'
      - text: 'Перенести проверку прав на сервер, а на клиенте её больше не делать'
        why: 'Сервер действительно обязан проверять права, но интерфейсу тоже нужно знать, какие кнопки показать активными. Без правила на клиенте человек будет нажимать кнопки и получать отказы.'
    explanation: |
      Признак неудачной границы — одно изменение требований приводит к правкам в нескольких местах, и при каждом
      изменении что-то забывают. Здесь бизнес-правило «что можно делать с документом» живёт в компонентах отображения
      и скопировано трижды. Решение — дать правилу хозяина: функцию в бизнес-правилах модуля документа, которую
      вызывают панель инструментов, боковая панель и горячие клавиши. Тогда правило не зависит от того, что
      нарисовано на экране, и проверяется тестом за миллисекунды.
    links:
      - https://martinfowler.com/bliki/PresentationDomainDataLayering.html

  - id: sdb-responsibility-003
    topic: Декомпозиция системы
    subtopic: Ответственность и границы
    level: middle
    multiple: true
    question: |
      В почтовом клиенте есть модули «Письма» и «Контакты». Какие наблюдения говорят о том, что граница между ними
      проведена неудачно?
    options:
      - text: '«Письма» импортируют внутренний файл «Контактов», чтобы подсказать адрес в поле «Кому»'
        correct: true
        why: 'Модуль лезет во внутренности соседа. Теперь «Контакты» нельзя переписать изнутри, не сломав «Письма».'
      - text: 'Смена формата имени контакта потребовала правок в шести файлах «Писем»'
        correct: true
        why: 'Знание о формате имени должно принадлежать «Контактам». Раз изменение расползлось по чужому модулю, это знание размазано.'
      - text: '«Письма» вызывают функцию поиска контактов, которую «Контакты» открыто предлагают соседям'
        why: 'Так и должно быть: модуль пользуется тем, что сосед открыто предлагает, и не заглядывает внутрь.'
      - text: 'В модуле «Письма» втрое больше кода, чем в модуле «Контакты», и он растёт быстрее'
        why: 'Объём кода не говорит о качестве границы. Разные ответственности бывают разного размера, и это нормально.'
    explanation: |
      Неудачную границу видно по тому, как идут изменения. Главные признаки: одно изменение требований вызывает
      правки во многих местах; модуль импортирует внутренние файлы соседа; модули импортируют друг друга по кругу;
      компонент одновременно загружает данные, считает правила и рисует. Обращение к тому, что сосед открыто
      предлагает, — нормальная работа через границу. Размер модуля о границе не говорит.
    links:
      - https://feature-sliced.design/ru/docs/get-started/overview

  - id: sdb-responsibility-004
    topic: Декомпозиция системы
    subtopic: Ответственность и границы
    level: senior
    question: |
      Онлайн-школа, команда из трёх разработчиков. Раздел «Домашние задания» — около 1500 строк — разбит на 14 модулей:
      заголовок задания, дедлайн, значок статуса, список файлов и так далее. У каждого модуля свой публичный интерфейс
      и свои типы. Правило «дедлайн сдвигается, если преподаватель дал продление» повторяется в пяти модулях, а новички
      неделю разбираются, где что лежит. Раздел расти не будет, отдельной команды под него не планируют. Какое
      изменение структуры предпочтительнее?
    options:
      - text: 'Объединить всё в модуль «Домашние задания», где продление дедлайна считается в одном месте'
        correct: true
        why: 'Части раздела меняются вместе, значит, им место в одном модуле. Правило дедлайна получает одно место, а новичку нужно разобраться в одной папке вместо четырнадцати.'
      - text: 'Добавить пятнадцатый модуль с правилом дедлайна и импортировать его из пяти других модулей'
        why: 'Правило окажется в одном месте, но раздробленность только вырастет: новичкам станет искать ещё труднее. Причин держать столько модулей в условии нет — раздел не растёт, отдельной команды нет.'
      - text: 'Разложить код всех 14 модулей по общим папкам components, hooks, api и utils'
        why: 'Это деление по техническим типам: раздел расползётся по четырём папкам, а правило дедлайна так и останется в пяти копиях.'
      - text: 'Сохранить модули как есть и описать в документации, какой модуль за что отвечает'
        why: 'Документация облегчит поиск, но правило по-прежнему придётся менять в пяти местах. Описание к тому же быстро устареет.'
    explanation: |
      Избыточная раздробленность — такая же ошибка, как смешение ответственностей. Модуль — это то, что меняется
      вместе. Если заголовок, дедлайн и статус задания всегда правятся одновременно, четырнадцать модулей добавляют
      только передачу данных между ними и размазывают одно правило по нескольким местам. Практичное правило — начинать
      с модулей покрупнее и делить их, когда модуль действительно вырос или его разные части начали меняться
      по разным причинам.
    links:
      - https://martinfowler.com/bliki/PresentationDomainDataLayering.html

  - id: sdb-responsibility-005
    topic: Декомпозиция системы
    subtopic: Ответственность и границы
    level: senior
    question: |
      Редактор документов добавляет экспорт в PDF. На бесплатном тарифе он доступен только для документов до 200 страниц.
      Экспорт запускают из меню и горячей клавишей. Пункт меню заранее показывает замок, если документ больше лимита,
      а при попытке экспорта человек видит объяснение и предложение сменить тариф. Как разложить функцию по видам
      ответственности?
    options:
      - text: 'Лимит — в бизнес-правилах; шаги «проверить, запросить файл, скачать» — в сценарии; запрос — в доступе к данным'
        correct: true
        why: 'Правило лимита можно спросить без экспорта — для замка в меню, — и оно одно для меню и горячей клавиши. Сценарий управляет шагами, а запрос к сервису экспорта не знает, зачем он нужен.'
      - text: 'Лимит — в компоненте пункта меню; шаги «проверить, запросить файл, скачать» — в сценарии; запрос — в доступе к данным'
        why: 'Горячая клавиша обходит пункт меню, и правило придётся повторить в её обработчике. Правило в отображении — та самая размазанность.'
      - text: 'Лимит — в доступе к данным рядом с запросом; шаги «проверить, запросить файл, скачать» — в сценарии; меню вызывает сценарий'
        why: 'Замку в меню нужно знать о лимите до всякого запроса, а доступ к данным отвечает за разговор с сервером, а не за то, что разрешено.'
      - text: 'Лимит, шаги и запрос — в одной функции модуля бизнес-правил, которую вызывают меню и горячая клавиша'
        why: 'Дублирования нет, но правило нельзя спросить, не запустив экспорт, — а замку в меню нужен ответ заранее. К тому же запрос к серверу оказался среди бизнес-правил, и проверить правило тестом без сети не получится.'
    explanation: |
      Одна функция продукта обычно состоит из четырёх видов работы. Отображение — пункт меню, замок и сообщение.
      Сценарий — порядок шагов: проверить лимит, запросить файл, скачать или показать объяснение. Бизнес-правило —
      «на бесплатном тарифе до 200 страниц»; оно нужно в нескольких местах, в том числе без запуска экспорта.
      Доступ к данным — запрос к сервису экспорта. Когда правило живёт отдельно от кнопок и запросов, его вызывают
      откуда угодно и проверяют тестом без сети. Сервер при этом проверяет тариф сам: клиентская проверка — для
      удобства человека, а не для защиты.
    links:
      - https://martinfowler.com/bliki/PresentationDomainDataLayering.html

  - id: sdb-contracts-001
    topic: Декомпозиция системы
    subtopic: Зависимости и контракты
    level: junior
    question: |
      Видеосервис встраивает плеер стороннего поставщика и прячет его SDK за адаптером, чтобы поставщика можно было
      сменить. Где описать интерфейс (порт), который реализует адаптер?
    options:
      - text: 'В модуле сценариев просмотра — словами самого видеосервиса'
        correct: true
        why: 'Порт описывает, что приложению нужно от плеера, поэтому его пишет и хранит приложение. Адаптер импортирует порт и подстраивается под него, а сценарии не знают о SDK.'
      - text: 'В адаптере — повторяя названия методов и событий SDK плеера'
        why: 'Такой порт говорит на языке поставщика. При смене поставщика поменяются и порт, и все, кто им пользуется, — защиты не получится.'
      - text: 'В самом SDK — поставщик лучше знает, что умеет его плеер'
        why: 'SDK ничего не знает о видеосервисе. Если взять его интерфейс за порт, сценарии будут зависеть от детали, которую хотят заменять.'
      - text: 'В общем модуле утилит — чтобы его видели все модули проекта'
        why: 'Порт принадлежит тому, кому нужен разговор с внешним миром, — сценариям просмотра. В «общем» модуле у него нет хозяина, и он легко обрастает чужими нуждами.'
    explanation: |
      В приёме «порты и адаптеры» (гексагональная архитектура Алистера Кокберна) порт — интерфейс разговора
      приложения с внешним миром, записанный словами приложения: «начать воспроизведение», «сообщить, что серия
      закончилась». Адаптер переводит этот разговор в вызовы конкретного SDK. Зависимость идёт от адаптера к порту:
      сценарии просмотра не импортируют ничего от поставщика, и для нового плеера пишут новый адаптер к тому же порту.
    links:
      - https://alistair.cockburn.us/hexagonal-architecture/

  - id: sdb-contracts-002
    topic: Декомпозиция системы
    subtopic: Зависимости и контракты
    level: middle
    question: |
      Приложение для заметок отправляет события в систему аналитики: 40 компонентов напрямую вызывают SDK
      поставщика, например tracker.track('btn_click', { … }). Через два месяца компания переходит к другому
      поставщику, у которого другие методы и формат событий. Кроме того, события нельзя отправлять, пока человек
      не согласился на сбор данных. Как подготовить код?
    options:
      - text: 'Модуль аналитики с событиями продукта: он проверяет согласие, а поставщика подключает адаптер'
        correct: true
        why: 'Компоненты знают только события продукта, проверка согласия живёт в одном месте, а переезд сводится к новому адаптеру. Сорок вызовов менять не придётся ни сейчас, ни при следующем переезде.'
      - text: 'Обёртка над SDK, которая проверяет согласие и повторяет методы и типы событий SDK один в один'
        why: 'Согласие проверяется в одном месте, но интерфейс обёртки — это интерфейс старого поставщика. При переезде он поменяется, а вместе с ним все 40 вызовов.'
      - text: 'При переезде заменить вызовы SDK во всех 40 компонентах поиском и заменой по проекту'
        why: 'Переезд так сделать можно, но проверку согласия придётся вписать в 40 мест, а следующий переезд снова затронет весь проект.'
      - text: 'Перед каждым вызовом SDK во всех 40 компонентах добавить проверку согласия на сбор данных'
        why: 'Проверка размножится на 40 копий, и в новом компоненте её легко забыть. Переезд к другому поставщику это не упрощает.'
    explanation: |
      Аналитика — типичная точка интеграции с внешней деталью, которая меняется по внешним причинам. Решение —
      порт в словах приложения («заказ оформлен», «заметка создана») и адаптер под конкретного поставщика. Общие
      правила вроде согласия на сбор данных живут в модуле аналитики, а не в каждом компоненте. Обёртка, которая
      копирует интерфейс SDK, только создаёт видимость защиты: язык поставщика всё равно расходится по приложению.
    links:
      - https://alistair.cockburn.us/hexagonal-architecture/

  - id: sdb-contracts-003
    topic: Декомпозиция системы
    subtopic: Зависимости и контракты
    level: senior
    question: |
      Сервис аренды самокатов показывает на карте свободные самокаты. Правило: показывать только самокаты с зарядом
      выше 20 % в радиусе 500 м от человека. Через полгода картографическую библиотеку заменят на другую, и правило
      должно пережить замену без правок. Как направить зависимости?
    options:
      - text: 'Правило — функция над координатами и зарядом без импортов библиотеки; карта вызывает её'
        correct: true
        why: 'Правило ни от чего не зависит: расстояние между двумя координатами оно считает само. Компонент карты зависит от правила, а не наоборот, и замена библиотеки правило не затронет.'
      - text: 'Правило берёт функцию расстояния из картографической библиотеки; компонент карты вызывает его'
        why: 'Одна маленькая зависимость направлена от правила к детали. При замене библиотеки правило придётся переписывать.'
      - text: 'Правило — внутри адаптера картографической библиотеки, который ставит метки на карту'
        why: 'Адаптер заменят вместе с библиотекой, и правило придётся переносить в новый адаптер. Бизнес-правило не должно жить в детали.'
      - text: 'Правило — в обработчике события «карта сдвинулась», которое даёт картографическая библиотека'
        why: 'Правило оказывается внутри кода, привязанного к событиям библиотеки, и уйдёт вместе с ней. К тому же его нельзя проверить без карты.'
    explanation: |
      Детали зависят от правил, а не наоборот. Бизнес-правило «заряд выше 20 % и не дальше 500 м» — суть продукта,
      а картографическая библиотека — деталь, которая меняется по внешним причинам. Даже одна удобная функция,
      взятая из библиотеки, разворачивает стрелку зависимости к детали. Если правило считает расстояние само
      и работает с простыми данными, его можно проверить тестом без карты и сети, а замена библиотеки затронет
      только компонент карты.
    links:
      - https://martinfowler.com/bliki/PresentationDomainDataLayering.html

  - id: sdb-contracts-004
    topic: Декомпозиция системы
    subtopic: Зависимости и контракты
    level: senior
    question: |
      Модуль рекомендаций видеосервиса отдаёт соседям список видео; у каждого есть поле duration — длительность
      в секундах. Им пользуются главная страница, экран после окончания серии и виджет «Смотреть дальше», и делают их
      три команды со своими сроками релизов. Все модули лежат в одном репозитории и собираются вместе; править код
      других команд команда рекомендаций не может. Модулю нужно перейти на миллисекунды. Как изменить контракт без
      поломок у потребителей и без лишних затрат?
    options:
      - text: 'Добавить durationMs рядом с duration в секундах и удалить старое поле, когда все перейдут'
        correct: true
        why: 'Новое поле рядом со старым ничего не ломает. Каждая команда переходит в свой срок, а старое поле удаляют, когда им никто не пользуется.'
      - text: 'Изменить единицы в поле duration и заранее предупредить все три команды в общем чате'
        why: 'Смысл поменялся, а имя и тип — нет: компилятор промолчит. Пропустил сообщение кто-то один — и на экране длительность в тысячу раз больше.'
      - text: 'Переименовать duration в durationMs, чтобы компилятор показал каждой команде все места'
        why: 'Ошибок смысла не будет, но код всех трёх команд перестанет собираться в день выхода модуля. Командам со своими сроками придётся бросить дела и чинить сборку одновременно.'
      - text: 'Скопировать модуль в recommendations-v2 с миллисекундами и постепенно перевести потребителей'
        why: 'Поломок не будет, но появятся две копии логики рекомендаций: каждое исправление придётся делать дважды, пока старую не удалят.'
    explanation: |
      Смысл значения — такая же часть контракта, как его тип. Самое опасное изменение — новый смысл в старой форме:
      код компилируется, а результат неверный. Безопасный путь — добавить новое рядом со старым, перевести
      потребителей в их собственном темпе и только потом удалить старое. Переименование честнее тихой смены единиц,
      но в общей сборке заставляет всех чинить код одновременно; копия модуля тоже безопасна, но удваивает поддержку.
      Если бы модуль выходил отдельным пакетом с версиями, переименование в новой мажорной версии тоже не ломало бы
      потребителей: каждая команда обновилась бы в свой срок.
    links:
      - https://feature-sliced.design/ru/docs/reference/public-api

  - id: sdb-contracts-005
    topic: Декомпозиция системы
    subtopic: Зависимости и контракты
    level: middle
    multiple: true
    question: |
      Команда онлайн-кинотеатра решает, какие внешние зависимости спрятать за порт с адаптером. В каких случаях это
      оправдано?
    options:
      - text: 'SDK видеоплеера: без него не запускаются автотесты сценария досмотра серии'
        correct: true
        why: 'Подменить SDK поддельным адаптером — и сценарий проверяется без браузерного плеера и сети. Это одна из главных причин, ради которых Кокберн предложил приём.'
      - text: 'Картографический сервис на одном экране: поставщик надёжный, автотесты карту не трогают'
        why: 'Причин для адаптера нет: менять поставщика не собираются, тестам он не мешает, используется в одном месте. Прямой вызов дешевле; адаптер можно добавить, когда причина появится.'
      - text: 'Форматирование дат премьер стандартным Intl.DateTimeFormat, встроенным в браузер'
        why: 'Стандартный API браузера не сменится и не мешает тестам. Адаптер здесь — слой ради слоя.'
      - text: 'Библиотека графиков во внутреннем прототипе, который команда выбросит через месяц'
        why: 'Прототип проживёт меньше, чем окупится адаптер. Прямой вызов здесь дешевле.'
      - text: 'Встроенный метод массивов sort для сортировки списка фильмов по рейтингу'
        why: 'Это часть языка: он не сменится и тестам не мешает. Обёртка над ним только добавит код.'
    explanation: |
      Порт с адаптером стоит своих затрат, когда есть реальная причина: деталь может смениться (новый поставщик,
      новая версия), мешает тестам (нужны сеть, браузер, настоящий сервис) или говорит на чужом для продукта языке.
      Здесь такая причина есть только у SDK видеоплеера. Стандартные возможности языка и браузера, код, который скоро
      выбросят, и стабильный сервис в одном месте за адаптер прятать незачем: слой добавит поддержку и ничего не даст
      взамен.
    links:
      - https://alistair.cockburn.us/hexagonal-architecture/

  - id: sdb-component-001
    topic: Декомпозиция системы
    subtopic: Компонент как контракт
    level: middle
    question: |
      Компонент выбора даты в сервисе бронирования стоит на 12 экранах. Сейчас его событие onChange срабатывает,
      когда человек кликает по дню, и экраны в этот момент пересчитывают цену и проверяют свободные номера. Какое
      изменение компонента сломает эти экраны?
    options:
      - text: 'onChange срабатывает уже при наведении на день, чтобы подсвечивать диапазон'
        correct: true
        why: 'Тип события прежний, но смысл изменился: экраны начнут пересчитывать цену и слать запросы на каждое движение мыши. Компилятор этого не заметит.'
      - text: 'Добавлен необязательный проп locale, по умолчанию — русский язык, как и раньше'
        why: 'Необязательный проп со значением по умолчанию, которое сохраняет прежнее поведение, ничего не ломает: старый код продолжает работать.'
      - text: 'Внутри компонента библиотеку работы с датами заменили на другую'
        why: 'Это внутреннее устройство. Если пропсы, события и поведение остались прежними, экраны замены не заметят.'
      - text: 'Состояние открытого месяца внутри компонента перенесли из useState в useReducer'
        why: 'Это внутренняя перестройка, которая не видна снаружи. Контракт компонента от неё не меняется.'
    explanation: |
      Контракт компонента — не только типы пропсов. В него входят смысл значений, момент событий, поведение
      и значения по умолчанию. Самое коварное изменение — новый смысл в старой форме: «onChange на каждое наведение»
      вместо «onChange при выборе» компилируется без ошибок, но ломает всех, кто на событие реагирует. Если
      компоненту нужна подсветка при наведении, для неё добавляют новое событие, например onHoverDay, а старое
      оставляют как было.
    links:
      - https://ru.react.dev/learn/sharing-state-between-components#controlled-and-uncontrolled-components

  - id: sdb-component-002
    topic: Декомпозиция системы
    subtopic: Компонент как контракт
    level: middle
    question: |
      Форма бронирования отеля, выпадающий список «Город». Город подставляется из профиля, когда профиль
      загрузится, — примерно через полсекунды после открытия формы. При смене страны выбранный город должен
      сбрасываться. Как использовать список?
    options:
      - text: 'Управляемым: город хранит форма, передаёт его в value и меняет в onChange'
        correct: true
        why: 'Значение хранит форма, поэтому может подставить город после загрузки профиля и сбросить его при смене страны. Список показывает ровно то, что ему передали.'
      - text: 'Неуправляемым: передать город из загруженного профиля в defaultValue'
        why: 'Начальное значение берётся только при первом рендере. Профиль загрузится позже, и город не подставится; сбросить выбор снаружи тоже нельзя.'
      - text: 'Неуправляемым: при отправке форма прочитает выбранный город через ref'
        why: 'Так форма узнает значение, но не сможет его изменить: ни подставить город из профиля, ни сбросить его при смене страны.'
      - text: 'Управляемым, но список копирует value в своё состояние при первом рендере'
        why: 'Это только выглядит управляемым режимом. Состояние возьмёт значение один раз, и город из профиля, пришедший позже, список проигнорирует.'
    explanation: |
      Неуправляемый компонент хранит состояние сам: родитель задаёт начальное значение и узнаёт о выборе из события.
      Управляемый показывает значение, которое передал родитель, и сообщает о желаемом изменении. Если значение
      нужно подставлять после загрузки, сбрасывать или связывать с другими полями — нужен управляемый режим. Копия
      пропа в состоянии — частая ловушка: она запоминает только первое значение.
    links:
      - https://ru.react.dev/learn/sharing-state-between-components#controlled-and-uncontrolled-components
      - https://ru.react.dev/learn/choosing-the-state-structure#don-t-mirror-props-in-state

  - id: sdb-component-003
    topic: Декомпозиция системы
    subtopic: Компонент как контракт
    level: junior
    question: |
      Маркетплейс, компонент «Характеристики товара» — раскрывающийся список, который открывается по кнопке
      «Показать все». Он стоит на 15 видах страниц, и страницы только вставляют компонент и передают ему список
      характеристик. Разработчик предлагает сделать компонент только управляемым: пропсы expanded и onToggle станут
      обязательными. Чем это обернётся?
    options:
      - text: 'Каждой из 15 страниц придётся хранить состояние раскрытия и передавать его'
        correct: true
        why: 'Это и есть цена управляемого режима: родитель обязан хранить значение и передавать его. Здесь она не окупается — страницы ничего с этим состоянием не делают, только вставляют компонент.'
      - text: 'Компонентом станет проще пользоваться, потому что страница сама всё контролирует'
        why: 'Управляемый режим гибче, но не проще: странице нужно больше настроек. Проще в использовании как раз неуправляемый компонент.'
      - text: 'Страницы потеряют возможность узнать, раскрыт список или нет'
        why: 'Наоборот: в управляемом режиме страница всегда знает состояние, потому что сама его хранит.'
      - text: 'Список станет раскрываться быстрее, потому что состояние окажется выше в дереве'
        why: 'Скорости это не прибавит: при каждом раскрытии будет перерисовываться ещё и страница, где хранится состояние.'
    explanation: |
      Документация React описывает выбор так: неуправляемые компоненты проще использовать, но их труднее
      согласовывать с другими частями; управляемые максимально гибкие, но требуют, чтобы родитель полностью
      настроил их пропсами. Если ни одному потребителю не нужно вмешиваться в состояние, неуправляемый режим
      дешевле. Компонент может поддержать и оба режима: передан expanded — управляемый, не передан — хранит
      состояние сам.
    links:
      - https://ru.react.dev/learn/sharing-state-between-components#controlled-and-uncontrolled-components

  - id: sdb-component-004
    topic: Декомпозиция системы
    subtopic: Компонент как контракт
    level: senior
    question: |
      В почтовом клиенте общий компонент ConfirmDialog (окна «Удалить письма?», «Очистить корзину?» и подобные)
      оброс пропсами: showCancel, danger, withCheckbox, checkboxText, showCount, countLabel, footerAlign, hideTitle
      и другими — всего их 14. Каждый месяц приходит
      два-три запроса на новый вид окна, и после каждой правки тестировщики заново проверяют девять экранов, где
      окно уже используется. Как изменить API компонента?
    options:
      - text: 'Окно держит фокус, клавиатуру и заголовок; содержимое и кнопки — через children и footer'
        correct: true
        why: 'Новый вид окна собирается на своём экране без правок общего кода, и девять экранов перепроверять не нужно. Одинаковое поведение — фокус, клавиатура, роли — остаётся в одном месте.'
      - text: 'Собрать все 14 флагов в один проп config, чтобы список пропсов стал короче и понятнее'
        why: 'Сочетаний столько же, а каждый новый вид окна по-прежнему требует правки общего компонента и проверки всех экранов.'
      - text: 'Заменить флаги одним пропом variant с отдельным значением для каждого нового вида окна'
        why: 'Для нескольких постоянных видов это удобно, но при двух-трёх новых видах в месяц каждый из них — снова правка общего компонента и перепроверка экранов.'
      - text: 'Сделать для каждого экрана свою копию окна и развивать эти копии независимо друг от друга'
        why: 'Общий код больше не трогают, но фокус, клавиатура и роли теперь в девяти копиях. Ошибку в них придётся исправлять девять раз, и копии быстро разойдутся.'
    explanation: |
      Каждый логический флаг удваивает число сочетаний, и проверить их все невозможно. Композиция решает это иначе:
      общий компонент отвечает за то, что одинаково везде (рамка, заголовок, закрытие, фокус, клавиатура, роли),
      а для содержимого оставляет места — children и именованные слоты вроде footer. Новый вид окна — это новое
      содержимое, а не новый флаг. Флаги уместны для нескольких независимых визуальных вариантов вроде размера;
      тревожный признак — флаги под конкретное место использования и флаги, которые работают только в паре.
    links:
      - https://ru.react.dev/learn/passing-props-to-a-component#passing-jsx-as-children

  - id: sdb-component-005
    topic: Декомпозиция системы
    subtopic: Компонент как контракт
    level: middle
    multiple: true
    question: |
      Команда дизайн-системы фиксирует поведение модального окна до выпуска первой версии и сверяется
      с WAI-ARIA Authoring Practices. Что должно входить в это поведение?
    options:
      - text: 'При открытии фокус переходит внутрь окна, обычно на первый доступный элемент'
        correct: true
        why: 'Так человек с клавиатурой или экранным чтецом сразу оказывается там, где теперь происходит действие.'
      - text: 'Клавиша Escape закрывает окно — так же, как видимая кнопка закрытия'
        correct: true
        why: 'Это стандартное ожидание пользователей клавиатуры, и APG описывает его для модального окна.'
      - text: 'При закрытии фокус возвращается на элемент, который открыл окно'
        correct: true
        why: 'Человек продолжает с того места, где был. Иначе фокус окажется в начале страницы, и придётся заново искать, где остановился.'
      - text: 'При открытии фокус остаётся на кнопке, которая открыла окно, чтобы не сбить человека'
        why: 'Тогда человек с клавиатурой остаётся «за» окном: Tab поведёт его по странице, которую окно закрывает.'
      - text: 'Tab с последней кнопки окна переводит фокус на ссылки страницы под окном'
        why: 'В модальном окне фокус ходит по кругу внутри окна: после последнего элемента Tab возвращает к первому.'
    explanation: |
      Поведение клавиатуры и фокуса — часть контракта компонента. По APG модальное окно при открытии забирает фокус
      внутрь, Tab и Shift+Tab ходят по кругу внутри окна, Escape закрывает его, а при закрытии фокус возвращается
      к элементу, который окно открыл. У контейнера роль dialog, aria-modal="true" и подпись через aria-labelledby.
      Если всё это заложено в общий компонент с первой версии, каждая страница получает доступное окно бесплатно;
      если добавлять потом, придётся менять контракт — например, делать заголовок обязательным.
    links:
      - https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/

  - id: sdb-dataflow-001
    topic: Декомпозиция системы
    subtopic: Карта потоков данных
    level: junior
    question: |
      В трекере задач список задач хранит их в своём состоянии и рисует для каждой карточку. В карточке есть
      флажок «Выполнено», и его нажатие должно поменять статус задачи в списке. Как это устроить по правилу
      однонаправленного потока данных?
    options:
      - text: 'Список передаёт карточке обработчик, карточка вызывает его, а список меняет задачу'
        correct: true
        why: 'Событие поднимается вверх через обработчик, данные меняются в одном месте — в списке — и спускаются обратно в карточку пропсом. Это и есть обратный поток данных из документации React.'
      - text: 'Карточка хранит свою копию статуса и эффектом сообщает о её изменении списку'
        why: 'Появляются две копии статуса, и изменение идёт через эффект. Документация React предупреждает: когда дети обновляют родителей из эффектов, поток данных очень трудно отследить.'
      - text: 'Карточка меняет поле статуса прямо в объекте задачи, который пришёл ей в пропсах от списка'
        why: 'Пропсы ребёнок только читает. Если поменять объект в обход владельца, список не узнает об изменении и может не перерисоваться, а источник изменения на карте потока потеряется.'
      - text: 'Список при каждой отрисовке читает состояние флажков из карточек через ссылки на них'
        why: 'Данные здесь идут снизу вверх, а хранятся фактически в карточках. Список зависит от внутреннего устройства детей, и поток перестаёт быть однонаправленным.'
    explanation: |
      Однонаправленный поток данных: данные хранятся в одном месте и идут сверху вниз через пропсы, а вверх идут только
      события через переданные обработчики. Флажок не меняет данные сам — он сообщает «задачу 42 отметили выполненной»,
      а список, который хранит задачи, меняет статус, и новая карточка приходит вниз. Если на экране неверный статус,
      у него одна дорога, и её легко пройти назад. В документации React этот приём называется обратным потоком данных
      (inverse data flow).
    links:
      - https://ru.react.dev/learn/thinking-in-react#step-5-add-inverse-data-flow

  - id: sdb-dataflow-002
    topic: Декомпозиция системы
    subtopic: Карта потоков данных
    level: middle
    multiple: true
    question: |
      Групповой чат. Слева список диалогов: у каждого превью последнего сообщения и счётчик непрочитанных — сколько
      сообщений других участников вы ещё не прочитали; диалоги отсортированы по времени последнего сообщения. Справа
      открыта переписка с полем ввода. Вы отправили сообщение в эту группу, и сервер его принял. Какие утверждения
      о том, что произойдёт в вашем клиенте после этой отправки, верны?
    options:
      - text: 'Лента открытой переписки: в ней появляется новое сообщение'
        correct: true
        why: 'Это прямой участник потока: показывает сообщения группы, а их стало больше.'
      - text: 'Строка группы в списке диалогов: меняются её превью и место в списке'
        correct: true
        why: 'Превью и сортировка вычисляются из последнего сообщения. Если их не обновить, диалог останется внизу со старым текстом — это участник, о котором легко забыть.'
      - text: 'Поле ввода: в нём остаётся отправленный текст, чтобы его можно было поправить'
        why: 'Поле — тоже участник потока, но обновиться оно должно наоборот: очиститься. Текст уже отправлен, и если оставить его в поле, человек легко отправит то же сообщение второй раз.'
      - text: 'Счётчик непрочитанных у этой группы: он вырастает на единицу'
        why: 'По условию счётчик считает только сообщения других участников. Ваше сообщение увеличит счётчик у них, а у вас он не меняется.'
      - text: 'Список участников группы в шапке: он обновляется вместе с лентой'
        why: 'Отправка сообщения не меняет состав группы, поэтому эти данные не участвуют в потоке, и обновлять список незачем: лишний участник на карте даёт лишние запросы и перерисовки.'
    explanation: |
      Чтобы восстановить поток, назовите инициатора и событие («я отправил сообщение»), найдите, какие данные оно меняет
      (сообщения группы и черновик), и спросите про каждое место на экране: станет ли оно неправдой, если его не
      обновить? Лента и строка в списке диалогов зависят от сообщений. Поле ввода зависит от черновика и должно
      очиститься, а не хранить отправленный текст. Счётчик непрочитанных по условию считает только чужие сообщения,
      а состав группы событие не трогает. Лишний участник на карте даёт лишние обновления, пропущенный — устаревший
      экран.
    links:
      - https://ru.react.dev/learn/thinking-in-react

  - id: sdb-dataflow-003
    topic: Декомпозиция системы
    subtopic: Карта потоков данных
    level: senior
    question: |
      Дашборд аналитики. Выбранный период («7 дней», «30 дней») хранит страница и передаёт его пропсом виджету
      графика. Виджет держит свою копию периода; когда человек меняет её, эффект вызывает обработчик страницы,
      а когда меняется пропс, другой эффект переписывает копию. При быстром переключении период иногда
      «отскакивает» на прежний, а запрос за данными графика уходит по два раза. Какое изменение устраняет причину?
    options:
      - text: 'Убрать копию из виджета: он берёт период из пропса и вызывает обработчик при выборе'
        correct: true
        why: 'Причина — две копии периода, которые правят друг друга через эффекты. Без копии остаётся одно место хранения и одна дорога: выбор → страница → пропс, и круговорот исчезает.'
      - text: 'Добавить в оба эффекта проверку: не передавать значение, если оно совпадает с текущим'
        why: 'Проверка обрывает часть лишних кругов, но две копии остаются. При быстрых переключениях они по-прежнему могут разойтись, и копия перезапишет свежий выбор старым.'
      - text: 'Перенести период в общее хранилище, а эффекты оставить синхронизировать его с копией виджета'
        why: 'Место хранения поменялось, а цикл остался: у виджета всё ещё своя копия, которую эффекты гоняют туда и обратно.'
      - text: 'Вызывать обработчик страницы с задержкой 300 мс после последнего переключения'
        why: 'Задержка уменьшит число запросов, но не уберёт две копии и цикл между ними. Ошибка просто станет реже и труднее для поиска.'
    explanation: |
      Перед нами цикл: изменение копии в виджете меняет период страницы, тот возвращается пропсом и снова переписывает
      копию. Пока данные бегают по кругу, свежий выбор может быть перезаписан устаревшим, а каждая смена вызывает
      лишнюю отрисовку и запрос. Лечится не проверками и задержками, а устройством потока: одно место хранения,
      событие вверх через обработчик в момент выбора, данные вниз пропсом. Документация React описывает этот случай
      в разделах «Уведомление родительских компонентов» и «Передача данных родителю» статьи «Возможно, вам не нужен
      эффект».
    links:
      - https://ru.react.dev/learn/you-might-not-need-an-effect#notifying-parent-components-about-state-changes

  - id: sdb-dataflow-004
    topic: Декомпозиция системы
    subtopic: Карта потоков данных
    level: middle
    question: |
      В трекере задач, когда задача становится выполненной, нужно отправить на сервер запрос и событие в аналитику.
      Сейчас это делает эффект, который срабатывает при изменении статуса на «Выполнено». Аналитики заметили, что
      событий «задача выполнена» втрое больше, чем самих выполненных задач: они уходят и когда человек просто
      открывает уже закрытую задачу. Как исправить поток?
    options:
      - text: 'Перенести запрос и аналитику в обработчик кнопки «Отметить выполненной»'
        correct: true
        why: 'Запрос нужен потому, что человек нажал кнопку, а не потому, что задача оказалась выполненной на экране. В обработчике он запустится ровно один раз на действие.'
      - text: 'Оставить эффект и хранить в состоянии флажок «событие уже отправлено»'
        why: 'Флажок живёт, пока открыта страница. После перезагрузки или на другом устройстве эффект снова увидит статус «Выполнено» и отправит событие повторно.'
      - text: 'Перенести эффект из карточки задачи в родительский список задач'
        why: 'Причина не в том, где лежит эффект, а в том, что он реагирует на данные. Список тоже получает уже закрытые задачи с сервера и так же отправит событие.'
      - text: 'Отправлять событие при каждой отрисовке, а повторы отсеять на стороне аналитики'
        why: 'Это переносит ошибку в другую систему и делает её больше: событий станет ещё больше, а отличить настоящее выполнение от показа аналитика не сможет.'
    explanation: |
      Это скрытый побочный эффект: его запускает изменение данных, а данные меняются не только от действия человека.
      Выполненная задача приходит с сервера при открытии, после обновления, при повторной загрузке списка — и каждый
      раз эффект думает, что задачу только что закрыли. Правило из документации React: эффект нужен только для кода,
      который должен выполняться потому, что компонент показан пользователю. Запрос и аналитика «задача выполнена»
      связаны с нажатием, поэтому их место — в обработчике этого нажатия.
    links:
      - https://ru.react.dev/learn/you-might-not-need-an-effect#sending-a-post-request

  - id: sdb-dataflow-005
    topic: Декомпозиция системы
    subtopic: Карта потоков данных
    level: senior
    question: |
      Дашборд показывает число активных пользователей в заголовке и график под ним. Число меняется тремя путями:
      таймер раз в минуту загружает его с сервера и записывает в заголовок; кнопка «Обновить» загружает график, а график
      затем сообщает новое число заголовку; фильтр по стране пересчитывает число прямо в заголовке из данных, которые
      у него уже есть. Иногда заголовок и график показывают разные числа, и никто не может сказать, какое из них
      последнее. Какое устройство потока решает проблему?
    options:
      - text: 'Данные в одном месте: таймер и кнопка просят их обновить, а число для страны из них вычисляется'
        correct: true
        why: 'У таймера и кнопки становится одна дорога: запрос → одно место хранения → заголовок и график. Фильтр — не третий источник, а параметр вычисления: число для страны считается из тех же данных. Оба участника читают одно и не могут разойтись.'
      - text: 'Заголовок и график сообщают друг другу о каждом новом числе, и каждый сохраняет последнее пришедшее'
        why: 'Две копии остаются, а сигналы между ними добавляют стрелки «участник → участник». Опоздавший ответ легко перезапишет свежий, и проблема станет только запутаннее.'
      - text: 'Заголовок и график по каждому событию сами запрашивают число у сервера одним и тем же запросом'
        why: 'Запрос одинаковый, но ответы приходят в разное время и могут отличаться: данные на сервере меняются. Копий по-прежнему две, и разницу между ними никто не гарантирует.'
      - text: 'Убрать таймер, чтобы число в заголовке менялось только по кнопке «Обновить» и по фильтру'
        why: 'Это меняет обещание продукта — данные перестают обновляться сами, — а дорог всё равно остаётся две: через график и через пересчёт в заголовке.'
    explanation: |
      Неоднозначный источник изменений появляется, когда у разных инициаторов разные дороги к экрану и каждая пишет
      в свою копию. Чтобы его найти, выпишите всех инициаторов (таймер, кнопка, фильтр) и проследите, куда ведёт каждый.
      Лечение — свести все дороги в одну: таймер и кнопка только запускают загрузку, данные хранятся в одном месте,
      участники читают оттуда. Фильтр при этом ничего не записывает: он лишь выбирает, какое число вычислить из тех же
      данных. Тогда неважно, кто начал изменение: оно пройдёт одним путём, и цифры на экране совпадут. Кто именно должен быть этим местом, подробно разбирается в уроке «Кто главный по данным».
    links:
      - https://ru.react.dev/learn/thinking-in-react#step-4-identify-where-your-state-should-live

  - id: sdb-diagrams-001
    topic: Декомпозиция системы
    subtopic: Архитектурные схемы и развитие
    level: junior
    question: |
      Фотохостинг готовится к встрече с руководством и юристами. Нужно показать, кто пользуется сервисом (фотографы,
      зрители, модераторы) и с какими внешними системами он обменивается данными: платёжным сервисом и сервисом
      печати фотографий. Какую схему нарисовать?
    options:
      - text: 'Схему контекста: сервис одним блоком, вокруг люди и внешние системы'
        correct: true
        why: 'Вопрос как раз о том, с кем и с чем взаимодействует система в целом. Схема контекста не заглядывает внутрь и понятна людям без технической подготовки.'
      - text: 'Схему контейнеров: приложения и хранилища сервиса и связи между ними'
        why: 'Она заглядывает внутрь системы и рассчитана на технических людей. Юристам и руководству приложения и хранилища внутри сервиса только помешают.'
      - text: 'Схему компонентов: модули веб-приложения и их связи между собой'
        why: 'Это уровень одного приложения для разработчиков. Пользователей и внешние системы она не показывает вовсе.'
      - text: 'Диаграмму последовательности: шаги от загрузки фото до заказа печати'
        why: 'Она показывает порядок шагов одного сценария, а здесь нужен общий вид: кто вообще участвует, без подробностей и времени.'
    explanation: |
      Модель C4 предлагает четыре уровня приближения: контекст, контейнеры, компоненты, код. Схема контекста — самый
      отдалённый: система одним прямоугольником, вокруг люди и внешние системы, без технологий и протоколов. Она
      рассчитана на любого зрителя, поэтому подходит для встречи с руководством и юристами. Внутренние приложения
      показывают на следующем уровне — в схеме контейнеров.
    links:
      - https://c4model.com/diagrams/system-context

  - id: sdb-diagrams-002
    topic: Декомпозиция системы
    subtopic: Архитектурные схемы и развитие
    level: middle
    multiple: true
    question: |
      Команда почтового сервиса рисует схему контейнеров по модели C4. Какие элементы на ней уместны?
    options:
      - text: 'Веб-клиент почты, который работает в браузере'
        correct: true
        why: 'Это отдельно работающее приложение — контейнер в смысле C4. На схеме у него стоит подпись с технологией.'
      - text: 'Хранилище вложений, где лежат файлы из писем'
        correct: true
        why: 'Хранилище данных — тоже контейнер: внутри этой границы хранятся данные, и с ним связаны другие части системы.'
      - text: 'Мобильное приложение почты для телефонов'
        correct: true
        why: 'Мобильное приложение запускается само по себе на телефоне — это отдельный контейнер, со своей стрелкой к серверу.'
      - text: 'Модуль поиска по письмам внутри веб-клиента'
        why: 'Это компонент одного контейнера, а не отдельно работающая часть. Он появится на следующем уровне — в схеме компонентов веб-клиента.'
      - text: 'Три копии сервера API за балансировщиком нагрузки'
        why: 'Число серверов и распределение нагрузки — детали развёртывания. Схема контейнеров их почти не показывает, для этого есть схема развёртывания.'
      - text: 'Docker-образ, в котором собирается веб-клиент'
        why: 'Контейнер в C4 не имеет отношения к Docker, автор модели специально это оговаривает. Способ сборки и упаковки — не уровень контейнеров.'
    explanation: |
      Контейнер в модели C4 — отдельно работающая часть системы: приложение в браузере, мобильное приложение, сервер,
      база данных или файловое хранилище. Схема контейнеров показывает их и связи между ними. Модули внутри одного
      приложения — уровнем ниже, на схеме компонентов. Число копий серверов и балансировщики — на схеме развёртывания.
      А слово «контейнер» здесь не про Docker.
    links:
      - https://c4model.com/abstractions/container

  - id: sdb-diagrams-003
    topic: Декомпозиция системы
    subtopic: Архитектурные схемы и развитие
    level: middle
    multiple: true
    question: |
      Команда веб-клиента почты обсуждает четыре решения и хочет потратить больше времени на те, которые дорого
      поменять потом. Какие это решения?
    options:
      - text: 'Как устроены адреса писем, которые сохраняют в закладках и пересылают коллегам'
        correct: true
        why: 'У этого решения есть потребители, которых команда не контролирует: закладки и пересланные ссылки. После смены формата старые адреса придётся поддерживать.'
      - text: 'Какую библиотеку взять для редактора письма, если её подключают через свою обёртку'
        why: 'Обёртка превращает выбор в обратимый: при замене библиотеки меняется один модуль, а остальное приложение этого не заметит.'
      - text: 'Как часто проверять новые письма: раз в 30 секунд или раз в минуту'
        why: 'Это число меняется следующим выпуском и ничего не ломает. Такое решение принимают быстро и поправляют по метрикам.'
      - text: 'Как разложить файлы модуля «Входящие» по папкам внутри проекта'
        why: 'Это видно только разработчикам и переделывается за вечер. Для архитектуры это дверь в обе стороны.'
    explanation: |
      Джефф Безос делил решения на двери в одну сторону, через которые не вернуться, и двери в обе стороны, которые
      можно открыть снова. В программах это шкала цены отката. Чтобы понять, где решение на этой шкале, спросите:
      сколько частей его затронет, есть ли потребители вне вашего контроля, останутся ли данные в старом формате,
      можно ли откатить выпуском. Адреса, разошедшиеся по закладкам и письмам, — классический случай дорогого
      решения: их нельзя «выпустить заново».
    links:
      - https://www.sec.gov/Archives/edgar/data/1018724/000119312516530910/d168744dex991.htm

  - id: sdb-diagrams-004
    topic: Декомпозиция системы
    subtopic: Архитектурные схемы и развитие
    level: senior
    question: |
      Онлайн-банк. Веб-приложение и сервер API выкладываются вместе, одним выпуском. Мобильное приложение ставят
      из магазина, и треть клиентов обновляет его не раньше чем через два месяца. Команда хочет переименовать поля
      в ответе API выписки. Как правильно оценить это решение?
    options:
      - text: 'Для веба оно обратимо всегда, для мобильного дорого: старые поля нужны, пока живут старые версии'
        correct: true
        why: 'Цена зависит от потребителя. Веб выходит вместе с API и обновляется сразу, а старые мобильные версии будут ждать старых полей ещё месяцы, и убрать их раньше нельзя.'
      - text: 'Оно обратимо для всех клиентов: если что-то сломается, сервер API можно откатить к прошлой версии'
        why: 'Откат вернёт старые поля, то есть отменит само переименование. А пока новая версия работает, у трети мобильных клиентов выписка сломана.'
      - text: 'Оно дорого для всех клиентов, поэтому переименование нужно отложить до следующей большой версии API'
        why: 'Для веба это дешёвое решение: веб выходит вместе с API и обновляется сразу. Дорого оно только из-за старых мобильных версий, и для них есть способ без новой версии API: добавить новые поля рядом со старыми и убрать старые, когда старые версии уйдут.'
      - text: 'Оно станет обратимым, если выпустить мобильное приложение в один день с API'
        why: 'Выпуск в магазине не обновляет телефоны: по условию треть клиентов ещё два месяца будет пользоваться старой версией.'
    explanation: |
      Одно и то же решение бывает дверью в обе стороны для одного потребителя и дверью в одну сторону для другого.
      Решение дорогое, когда от него зависят те, кого вы не можете обновить сами: старые версии мобильных приложений,
      партнёры, сохранённые ссылки. Обычный способ сделать такое изменение обратимым — не заменять, а добавлять:
      новые поля появляются рядом со старыми, а старые убирают, когда их больше никто не читает.
    links:
      - https://www.sec.gov/Archives/edgar/data/1018724/000119312516530910/d168744dex991.htm

  - id: sdb-diagrams-005
    topic: Декомпозиция системы
    subtopic: Архитектурные схемы и развитие
    level: middle
    question: |
      Фотохостинг. Требование: после загрузки фото в альбоме сразу видна заглушка, а через 5–30 секунд, когда сервер
      сделает уменьшенную копию, её сменяет миниатюра. Диаграмма последовательности такая: 1) человек выбирает фото;
      2) веб-приложение отправляет файл на сервер API; 3) сервер отвечает «принято» и номер фото; 4) веб-приложение
      показывает заглушку в альбоме. Чего на схеме не хватает, чтобы она выполняла требование?
    options:
      - text: 'Шага, на котором сообщение о готовой миниатюре доходит до веб-приложения'
        correct: true
        why: 'Требование включает смену заглушки на миниатюру, но ни одна стрелка не приносит в веб-приложение сообщение о том, что уменьшенная копия готова. Нужен опрос сервера или сообщение от него.'
      - text: 'Шага, на котором сервер API сохраняет файл в базу данных и записывает его номер'
        why: 'Это внутреннее устройство сервера. Клиенту оно не видно и на то, что увидит человек, не влияет, поэтому на клиентскую последовательность не попадает.'
      - text: 'Шага, где веб-приложение проверяет формат файла, чтобы заглушка не появлялась для неподходящего'
        why: 'Такая проверка полезна, но требование не о ней: даже с проверкой заглушка для подходящего файла так и не сменится миниатюрой.'
      - text: 'Отдельного участника для компонента заглушки, который рисует серый квадрат в альбоме'
        why: 'Это деталь реализации внутри веб-приложения. На архитектурной схеме отдельные элементы интерфейса не рисуют.'
    explanation: |
      Схему проверяют сценариями из требований: проходят каждый шаг и ищут стрелку, по которой он идёт. Шаг сценария
      без стрелки — пропущенное звено. Здесь последовательность обрывается на заглушке, а как веб-приложение узнает
      о готовности миниатюры, не видно. Дорисовать нужно опрос сервера или сообщение от него — и решить это сейчас,
      а не в разгар работы.
    links:
      - https://c4model.com/diagrams/dynamic

  - id: sdb-diagrams-006
    topic: Декомпозиция системы
    subtopic: Архитектурные схемы и развитие
    level: middle
    question: |
      Онлайн-школа. На схеме контейнеров — веб-приложение ученика, сервер API, база курсов и внешний видеохостинг,
      откуда приходят записи уроков. Все сценарии первой версии по схеме проходят. В плане на следующий квартал —
      живые вебинары с чатом: видео в реальном времени и сообщения, которые нужно мгновенно рассылать всем зрителям.
      Что разумно сделать со схемой сейчас?
    options:
      - text: 'Отметить точку роста: новый поток в реальном времени и, возможно, новый контейнер'
        correct: true
        why: 'Функция запланирована, и схема заранее показывает, какие части она затронет. Тогда границы проводят так, чтобы вебинары легли в отдельный модуль, а не расползлись по приложению. Строить сейчас ничего не нужно.'
      - text: 'Отметить пропущенное звено: без стрелки к вебинарам схема не выполняет требований'
        why: 'Пропущенное звено — шаг сценария из текущих требований, для которого нет стрелки. Вебинаров в требованиях первой версии нет, и все её сценарии по схеме проходят.'
      - text: 'Ничего не отмечать: схема показывает только то, что входит в первую версию'
        why: 'Тогда о вебинарах вспомнят, когда границы уже проведены без них, и изменение затронет больше частей, чем могло бы. Отметить точку роста почти ничего не стоит.'
      - text: 'Добавить контейнер рассылки и построить его вместе с первой версией'
        why: 'Это строительство функции заранее: работа и поддержка начнутся за квартал до того, как вебинары понадобятся, а требования к ним ещё могут измениться. Точку роста отмечают, но не строят.'
    explanation: |
      Схемой проверяют проект с двух сторон. Пропущенное звено — шаг сценария из текущих требований, для которого
      на схеме нет стрелки или участника. Точка роста — место, которое придётся менять, когда продукт будет
      развиваться: новый поток данных, новый контейнер. Её отмечают заранее, чтобы провести границы так, чтобы
      изменение осталось внутри одного модуля. Но отметить — не значит построить: сама функция появится, когда она
      войдёт в требования.
    links:
      - https://c4model.com/diagrams/container

  - id: sdb-state-kinds-001
    topic: Архитектура состояния
    subtopic: Виды состояния
    level: junior
    multiple: true
    question: |
      Видеосервис показывает на странице сериала список серий сезона. Список приходит с сервера, а редакция может
      в любой момент добавить серию или поменять её описание. К какому виду состояния относится этот список?
    options:
      - text: 'Серверное: оригинал на сервере, у клиента только копия'
        correct: true
        why: 'Список меняют другие люди — редакция, и меняют его на сервере. Клиент получает копию, которая может устареть, пока страница открыта.'
      - text: 'Состояние интерфейса: список нужен только этой странице'
        why: 'Состояние интерфейса создаёт и меняет само приложение: открыта ли вкладка, развёрнут ли блок. Список серий меняет редакция, а не приложение.'
      - text: 'Сохранённое на устройстве: его кладут в хранилище браузера'
        why: 'Копию можно положить и в хранилище браузера, но вид от этого не меняется: прав по-прежнему сервер, а сохранённая копия устаревает ещё сильнее.'
      - text: 'Мимолётное: список нужен, только пока открыта страница'
        why: 'Мимолётное состояние нужно одному компоненту и пропадает без потерь, как текст при наведении. Список серий важен и меняется не на клиенте.'
    explanation: |
      Вид состояния определяют не по тому, где оно лежит у клиента и сколько нужно экрану, а по тому, кто им владеет
      и сколько оно живёт. У серверного состояния оригинал на сервере, менять его могут другие, а у клиента только
      копия — кэш. Отсюда главный вопрос для таких данных: когда копия устаревает и как её обновлять. Если считать
      список серий «своим», человек будет видеть описание, которого на сервере уже нет.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/overview

  - id: sdb-state-kinds-002
    topic: Архитектура состояния
    subtopic: Виды состояния
    level: middle
    question: |
      Картографический сервис. Человек ищет «кофейни», двигает карту и приближает нужный район. Потом копирует адрес
      страницы и отправляет другу: друг должен увидеть тот же участок карты и тот же поиск. А у самого человека кнопка
      «Назад» должна возвращать к прежнему поиску. Где хранить поисковый запрос, центр карты и масштаб?
    options:
      - text: 'В адресе страницы: ?q=кофейни&lat=55.75&lng=37.62&z=15'
        correct: true
        why: 'Адрес переживает перезагрузку, уходит вместе со ссылкой, и по нему работают «Назад» и «Вперёд». Все три требования выполняются сами собой.'
      - text: 'В общем хранилище приложения, доступном всем компонентам'
        why: 'Хранилище живёт в памяти этой вкладки. Друг откроет ссылку и увидит карту по умолчанию, а «Назад» ничего не вернёт: история браузера о хранилище не знает.'
      - text: 'В localStorage, чтобы вид пережил перезагрузку страницы'
        why: 'Перезагрузку это переживёт, но хранилище браузера есть только на этом устройстве. У друга его нет, а «Назад» по нему не ходит.'
      - text: 'В профиле человека на сервере, рядом с его настройками'
        why: 'Друг не может открыть чужой профиль, а «Назад» не знает о запросах к серверу. Это место для настроек, которые человек ждёт на всех своих устройствах.'
    explanation: |
      Если состоянием нужно делиться ссылкой и к нему нужно возвращаться кнопками браузера, его место — адрес страницы.
      Только адрес обладает всеми тремя свойствами сразу: переживает перезагрузку, передаётся другому человеку
      и попадает в историю. Цена — значения становятся строками, видны пользователю и ограничены длиной адреса.
      Для карты и поиска это приемлемо: несколько коротких параметров.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/History_API/Working_with_the_History_API

  - id: sdb-state-kinds-003
    topic: Архитектура состояния
    subtopic: Виды состояния
    level: middle
    multiple: true
    question: |
      Трекер задач, экран проекта. На нём список задач со статусами и исполнителями, боковая панель фильтров, которую
      можно свернуть, поле поиска, в котором человек прямо сейчас печатает, и плотность списка, которую он выбрал
      только для этого компьютера. Что из этого — серверное состояние?
    options:
      - text: 'Список задач проекта со статусами'
        correct: true
        why: 'Задачи создают, двигают и закрывают коллеги. Оригинал на сервере, и копия на экране устаревает, когда кто-то другой меняет задачу.'
      - text: 'Имена и аватары исполнителей задач'
        correct: true
        why: 'Люди меняют их в своих профилях, то есть на сервере. Клиент получает их копию вместе со списком задач.'
      - text: 'Свёрнута ли боковая панель фильтров'
        why: 'Это состояние интерфейса: его меняет только приложение по действию человека, сервер о нём не знает.'
      - text: 'Текст, набираемый в поле поиска'
        why: 'Это мимолётное состояние: пока человек печатает, текст нужен только полю. Сервер увидит запрос, когда поиск запустят.'
      - text: 'Плотность списка на этом компьютере'
        why: 'Это сохранённое на устройстве: настройка нужна только в этом браузере, по условию на другие устройства она не переезжает.'
    explanation: |
      Серверное состояние узнают по владельцу: оригинал живёт на сервере, и менять его могут другие люди. Задачи
      и профили исполнителей подходят под это описание. Свёрнутая панель — состояние интерфейса, набираемый текст —
      мимолётное, настройка «только для этого компьютера» — сохранённое на устройстве. Классификация нужна не ради
      названий: для серверных данных придётся решать, когда обновлять копию, а для остальных — нет.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/overview

  - id: sdb-state-kinds-005
    topic: Архитектура состояния
    subtopic: Виды состояния
    level: senior
    question: |
      Трекер задач. Человек настраивает в списке фильтр «только мои задачи» и сортировку по сроку. Он работает
      с ноутбука и с рабочего компьютера и хочет видеть привычный вид на обоих, даже если открыл трекер с главной
      страницы, а не по ссылке. Коллегам, которым он присылает ссылку на проект, его настройки передаваться не должны.
      Где хранить эти настройки?
    options:
      - text: 'В профиле человека на сервере, откуда их читают при входе'
        correct: true
        why: 'Сервер — единственное место, общее для двух устройств. Настройки привязаны к человеку, а не к ссылке, поэтому коллеги их не получат.'
      - text: 'В параметрах адреса, чтобы вид сохранялся при перезагрузке'
        why: 'С главной страницы человек придёт без параметров и привычного вида не увидит. А ссылка коллеге унесёт его фильтр — это прямо запрещено условием.'
      - text: 'В localStorage, чтобы вид пережил закрытие вкладки'
        why: 'Хранилище браузера одно на устройство. На втором компьютере настроек не будет.'
      - text: 'В общем хранилище приложения в памяти вкладки'
        why: 'Память вкладки пропадает при перезагрузке и закрытии, и на второе устройство она тоже не попадает.'
    explanation: |
      «Личное» не значит «в браузере». Если человек ждёт настройку на всех своих устройствах, её хранит сервер:
      только он общий для них. Адрес здесь не подходит по обратной причине: он принадлежит ссылке, а не человеку,
      и уходит вместе с ней к другим. Если бы фильтр, наоборот, должен был передаваться по ссылке, как поиск на карте,
      его место было бы в адресе. Место выбирают по требованиям, а не по тому, «фильтр» это или «настройка».
    links:
      - https://tanstack.com/query/latest/docs/framework/react/overview

  - id: sdb-ownership-001
    topic: Архитектура состояния
    subtopic: Владелец и единый источник истины
    level: junior
    question: |
      Сервис бронирования отелей показывает, сколько номеров свободно на выбранные даты. Номера одновременно бронируют
      через сайт, мобильное приложение и стойку администратора в самом отеле. Кто владелец числа свободных номеров?
    options:
      - text: 'Система бронирования на сервере, через которую проходят все брони'
        correct: true
        why: 'Число меняют все каналы продаж сразу, и только сервер видит их все. Поэтому его значение считается правильным, а изменения проходят через него.'
      - text: 'Страница поиска, получившая это число в последнем ответе сервера'
        why: 'У страницы только копия — кэш. Пока человек смотрит на экран, стойка отеля могла продать последний номер.'
      - text: 'Форма бронирования, в которой человек выбрал даты и число гостей'
        why: 'Форма владеет тем, что вводит человек: датами и гостями. Число свободных номеров она не меняет и не может проверить.'
      - text: 'Хранилище браузера, куда страница сохранила результаты поиска'
        why: 'Это ещё одна копия, причём ещё более старая. Её можно выбросить и загрузить заново, значит, владельцем она не бывает.'
    explanation: |
      Владелец данных — место, значение в котором считается правильным и через которое проходят изменения. Если данные
      меняют разные люди через разные каналы, владелец почти наверняка сервер: только он видит все изменения. У клиента
      остаётся кэш, и в важный момент — при оплате брони — сервер всё равно проверяет наличие сам.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/overview

  - id: sdb-ownership-003
    topic: Архитектура состояния
    subtopic: Владелец и единый источник истины
    level: middle
    multiple: true
    question: |
      Редактор документов в браузере. Документ хранится на сервере и сохраняется по кнопке «Сохранить». В памяти
      вкладки сейчас лежат данные, перечисленные ниже. Что из этого можно выбросить и получить заново без потерь
      для человека?
    options:
      - text: 'Число слов и символов в документе'
        correct: true
        why: 'Это производные данные: их можно пересчитать из текста в любой момент.'
      - text: 'Оглавление, собранное из заголовков'
        correct: true
        why: 'Тоже вычисление: оглавление строится из заголовков текста и строится снова, если его выбросить.'
      - text: 'Список последних документов с сервера'
        correct: true
        why: 'Это кэш: оригинал на сервере, список можно загрузить ещё раз.'
      - text: 'Абзац, набранный после сохранения'
        why: 'Это основные данные, и других копий у них нет: на сервере лежит версия до этого абзаца. Выбросить — значит потерять работу человека.'
      - text: 'Комментарий, который ещё не отправлен'
        why: 'Он существует только в этой вкладке и ещё не дошёл до сервера. Восстановить его неоткуда.'
    explanation: |
      Проверка «можно ли выбросить и получить заново» отделяет основные данные от производных и от кэша. Производное
      пересчитывается из основных, кэш загружается от владельца, а основные данные взять неоткуда. Отсюда и следствие
      для проектирования: несохранённый текст и неотправленный комментарий — единственный оригинал, и именно им нужен
      понятный владелец и защита от потери.
    links:
      - https://ru.react.dev/learn/sharing-state-between-components#a-single-source-of-truth-for-each-state

  - id: sdb-ownership-004
    topic: Архитектура состояния
    subtopic: Владелец и единый источник истины
    level: senior
    question: |
      Сервис продажи билетов в кино. Выбранные места держатся за человеком 10 минут, чтобы их не купили другие. Сейчас
      выбор хранится и на клиенте, и на сервере, и синхронизируется в обе стороны: клиент отправляет свой список мест,
      сервер присылает свой (бронь истекла, место занял другой). Жалобы: снятое место через секунду снова отмечено,
      а иногда человек видит своим место, которое уже купили. Как устроить данные?
    options:
      - text: 'Бронью владеет сервер: клиент шлёт «занять» или «освободить» и показывает его ответ'
        correct: true
        why: 'Изменения идут к владельцу, значения — от него. Сервер видит всех покупателей и сроки брони, поэтому только он может решить, чьё место.'
      - text: 'Выбором владеет клиент: держать его на устройстве и отправлять только при оплате'
        why: 'Один владелец появился, но пропало требование: пока человек выбирает, места ни за кем не держатся и их могут купить другие.'
      - text: 'Оставить обе копии, а при расхождении брать ту, что изменена позже по часам устройства'
        why: 'Два владельца остаются. Часы на устройствах расходятся, а покупку другого человека клиентские часы вообще не видят.'
      - text: 'Раз в секунду отправлять на сервер весь список мест клиента, заменяя серверный'
        why: 'Клиент становится владельцем данных, которых он не знает: истёкшей брони и чужих покупок. Его старый список будет затирать правду сервера.'
    explanation: |
      Двусторонняя синхронизация — это два владельца одних данных. При одновременных изменениях побеждает тот, чей
      запрос пришёл позже, копии гоняют изменения по кругу, а обрыв связи оставляет половину обновления. Решение —
      один владелец и однонаправленный поток: клиент просит владельца изменить данные и показывает то, что владелец
      ответил. Чтобы человек не ждал, клиент может сразу отметить место как «занимается» и откатить отметку, если
      сервер откажет.
    links:
      - https://ru.react.dev/learn/sharing-state-between-components#a-single-source-of-truth-for-each-state

  - id: sdb-ownership-007
    topic: Архитектура состояния
    subtopic: Владелец и единый источник истины
    level: middle
    question: |
      Фотохостинг. В шапке — счётчик оставшихся бесплатных загрузок. Его уменьшают и загрузки с других устройств
      человека, а при нуле загружать нельзя. Человек выбрал фото и нажал «Загрузить»; счётчик на экране показывает 1.
      Как клиенту поступить?
    options:
      - text: 'Отправить загрузку: разрешит её сервер, а счётчик обновится из его ответа'
        correct: true
        why: 'Счётчик на экране — кэш только для чтения: его меняют и другие устройства. Решение, от которого зависит ограничение, принимает владелец — сервер, а клиент показывает его ответ, в том числе отказ «лимит исчерпан».'
      - text: 'Разрешить загрузку по счётчику на экране: там 1, значит, лимит не исчерпан'
        why: 'Копия могла устареть: пока человек выбирал фото, с телефона уже загрузили последнее. Клиент решает по кэшу, будто он владелец.'
      - text: 'Уменьшить счётчик на клиенте до 0 и отправить это число серверу вместе с фото'
        why: 'Готовое число от клиента делает его вторым владельцем: оно затрёт уменьшения, которые сервер получил от других устройств.'
      - text: 'Дождаться следующего обновления счётчика с сервера и решить по свежему числу'
        why: 'Человек ждёт без причины, а решение всё равно принимается по копии: между обновлением и загрузкой лимит может исчерпаться с другого устройства.'
    explanation: |
      Копия на клиенте неизбежна, вопрос в её правах. Кэш только для чтения годится для данных, которые меняют другие:
      его показывают человеку, но решение, от которого зависят деньги или ограничения, принимает владелец. Клиент
      отправляет действие и показывает ответ владельца, а не решает сам по копии, которая могла устареть, и не
      присылает владельцу готовое значение.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/overview

  - id: sdb-ownership-006
    topic: Архитектура состояния
    subtopic: Владелец и единый источник истины
    level: middle
    question: |
      Видеосервис. Список «Смотреть позже» хранится на сервере. Чтобы при запуске список появлялся сразу, ещё
      до ответа сервера, клиент держит его копию в localStorage. При каждом запуске приложение берёт эту копию
      и отправляет на сервер «для синхронизации». Человек удалил фильм из списка на телевизоре, через день открыл
      сайт на ноутбуке — и фильм вернулся в список на всех устройствах. Что изменить?
    options:
      - text: 'Показывать копию сразу, затем заменять ответом сервера, обратно не слать'
        correct: true
        why: 'Копия остаётся кэшем: она нужна только для быстрого показа. Правда приходит от сервера, и старая копия с ноутбука больше не затирает изменения с телевизора.'
      - text: 'Не сохранять копию вовсе и показывать список, когда ответит сервер'
        why: 'Воскрешений не будет, но пропадёт требование из условия: список должен появляться сразу, до ответа сервера.'
      - text: 'Хранить список в localStorage без сервера: раз копия есть, он не нужен'
        why: 'Хранилище браузера одно на устройство. Удалённое на телевизоре ноутбук не увидит никогда, а списки на устройствах разойдутся.'
      - text: 'Отправлять копию на сервер, только если её сохранили менее суток тому назад'
        why: 'Копия по-прежнему ведёт себя как оригинал. Удалите фильм на телевизоре через час после запуска на ноутбуке — и он снова вернётся.'
    explanation: |
      Копия серверных данных остаётся кэшем, даже если её сохранили на устройстве: оригинал на сервере, и менять его
      могут с других устройств. Поэтому значения текут от сервера к копии, а не обратно. Копию можно показать сразу
      как предварительную, но как только пришёл ответ сервера, её заменяют. Отправляя старую копию на сервер,
      приложение делает её вторым владельцем, и она затирает изменения, сделанные в другом месте.
    links:
      - https://tanstack.com/query/latest/docs/framework/react/overview

  - id: sdb-derived-001
    topic: Архитектура состояния
    subtopic: Производное состояние и идентичность
    level: junior
    question: |
      Почтовый клиент. Все 300 писем папки «Входящие» уже загружены, у каждого есть признак «прочитано». Рядом
      с названием папки нужно показывать число непрочитанных. Как его получать?
    options:
      - text: 'Вычислять из загруженного списка писем при каждой отрисовке'
        correct: true
        why: 'Число непрочитанных полностью определяется списком, который уже есть. Вычисленное значение не может разойтись с письмами: прочитали письмо — число изменилось само.'
      - text: 'Хранить отдельный счётчик и менять его при каждом действии с письмом'
        why: 'Это избыточное состояние. Каждое новое действие — «прочитать всё», «переместить», «удалить» — обязано не забыть про счётчик, и однажды кто-то забудет.'
      - text: 'Запрашивать число у сервера после каждого изменения в списке'
        why: 'Данные для подсчёта уже на клиенте, запрос только добавит задержку. Пока ответ идёт, число на экране расходится со списком.'
      - text: 'Сохранять счётчик в localStorage, чтобы он пережил перезагрузку'
        why: 'Это ещё одна копия, которая может устареть. После перезагрузки письма загрузятся заново, и число всё равно надёжнее посчитать по ним.'
    explanation: |
      Производное состояние — значение, которое можно вычислить из другого состояния. Его не хранят, а считают:
      так оно не расходится с исходными данными. Проверка простая: если письма изменятся, должно ли число измениться
      вместе с ними? Да — значит, это вычисление. Если бы на клиенте были загружены не все письма, вычислить было бы
      не из чего, и число пришлось бы получать с сервера как серверные данные.
    links:
      - https://ru.react.dev/learn/choosing-the-state-structure#avoid-redundant-state

  - id: sdb-derived-002
    topic: Архитектура состояния
    subtopic: Производное состояние и идентичность
    level: middle
    question: |
      Сервис веб-аналитики в конце каждого месяца выставляет клиенту счёт: число событий за месяц, умноженное на цену
      тарифа. В разделе «История счетов» сумму каждого счёта считают заново по текущей цене тарифа. В октябре тариф
      подорожал, и суммы всех прошлых счетов в истории выросли, хотя оплачены были меньшие. Как исправить?
    options:
      - text: 'Сохранять в каждом счёте цену и сумму на момент выставления'
        correct: true
        why: 'Сумма выставленного счёта — новый факт о прошлом, а не производное от текущей цены. Её фиксируют снимком, и она больше не меняется вслед за тарифом.'
      - text: 'Запоминать результат пересчёта, чтобы не считать сумму при каждом показе'
        why: 'Запомненное значение остаётся производным: оно пересчитается, как только изменится цена, и прошлые счета снова «подорожают».'
      - text: 'Считать сумму не на клиенте, а на сервере по той же формуле'
        why: 'Место вычисления не важно: по текущей цене сервер получит те же неверные суммы.'
      - text: 'Запретить менять цену тарифа для клиентов, у которых уже есть счета'
        why: 'Ошибка исчезнет вместе с возможностью бизнеса менять цены. Это меняет продукт, а не исправляет модель данных.'
    explanation: |
      Чтобы решить, вычислять или хранить, спросите: если исходные данные изменятся, должно ли значение измениться
      вместе с ними? Итог текущей корзины — да. Сумма выставленного счёта — нет: это **снимок**, зафиксированный
      в момент выставления. Снимок хранят в самом документе вместе с ценой, по которой считали. Пересчитывать прошлое
      по текущим данным — классический способ получить историю, которая не совпадает с платежами.
    links:
      - https://ru.react.dev/learn/choosing-the-state-structure#avoid-redundant-state

  - id: sdb-derived-003
    topic: Архитектура состояния
    subtopic: Производное состояние и идентичность
    level: middle
    question: |
      Почтовый клиент. Человек отмечает письма галочками, чтобы удалить их разом. Приложение хранит отметки как номера
      строк в списке. Пока человек отмечал, он отсортировал список по отправителю, и удалились не те письма. Сортировать
      список и получать новые письма во время отметки должно быть можно. Как хранить отметки?
    options:
      - text: 'Хранить идентификаторы самих отмеченных писем'
        correct: true
        why: 'Идентификатор принадлежит письму и не зависит от того, где оно стоит. Новые письма, удаление и сортировка отметок не сдвинут.'
      - text: 'Пересчитывать номера после каждой сортировки'
        why: 'Это чинит один случай. Новое письмо сверху или удаление из середины тоже сдвигают строки, а чтобы пересчитать номер, всё равно нужно знать, какое письмо где было, — то есть его идентичность.'
      - text: 'Запрещать сортировку, пока есть отметки'
        why: 'Это нарушает требование из условия, и новые письма всё равно будут сдвигать строки.'
      - text: 'Хранить тему и отправителя каждого отмеченного письма'
        why: 'Это не уникальный признак: у рассылок и уведомлений темы и отправители повторяются, и удалятся лишние письма.'
    explanation: |
      Позиция — номер элемента в списке сейчас, она меняется при вставке, удалении и сортировке. Идентичность — то,
      по чему элемент узнают как «тот же самый»; её задаёт постоянный уникальный идентификатор. Всё, что относится
      к конкретному элементу — отметка, раскрытие, выбор, — хранят по идентификатору. По той же причине React просит
      использовать в списках ключом id, а не индекс в массиве.
    links:
      - https://ru.react.dev/learn/rendering-lists#why-does-react-need-keys

  - id: sdb-derived-004
    topic: Архитектура состояния
    subtopic: Производное состояние и идентичность
    level: senior
    question: |
      Трекер задач, доска с колонками. В колонке бывает до 2 000 карточек, люди часто перетаскивают их мышкой, порядок
      хранится на сервере и одинаков у всех. Сейчас у карточек поле position с номерами 1, 2, 3… Перенос карточки
      наверх отправляет новые номера всех карточек выше её старого места: запросы большие, а при обрыве связи
      в колонке появляются две карточки с одинаковым номером. Как хранить порядок?
    options:
      - text: 'Давать перенесённой карточке позицию посередине между новыми соседями'
        correct: true
        why: 'Меняется одно значение у одной карточки, и запрос маленький. Обрыв связи не оставит список перенумерованным наполовину: либо карточка переехала, либо нет.'
      - text: 'Отправлять после переноса весь список id колонки в новом порядке'
        why: 'Половины обновления не будет, но при двух тысячах карточек каждый перенос — снова большой запрос, а именно на это жалуются.'
      - text: 'Хранить порядок только в localStorage и на сервер его не отправлять'
        why: 'Запросы исчезнут, но порядок перестанет быть общим: по условию он хранится на сервере и одинаков у всех.'
      - text: 'Сортировать карточки по дате последнего изменения вместо position'
        why: 'Ручной порядок — основные данные, его нельзя вычислить. При такой сортировке карточка прыгнет наверх после любой правки текста.'
    explanation: |
      Порядок, который задаёт человек перетаскиванием, нельзя вычислить — его хранят. Номера подряд заставляют менять
      много элементов при одной перестановке. Дробные позиции (fractional indexing) решают это: новая позиция —
      середина между соседями, например 1,5 между 1 и 2, и меняется одна карточка. Цена — конечная точность обычных
      чисел, поэтому позиции хранят строками или иногда перенумеровывают колонку. Что делать, если двое переносят
      карточки в одно место одновременно, — отдельная задача совместного редактирования.
    links:
      - https://www.figma.com/blog/realtime-editing-of-ordered-sequences/

  - id: sdb-derived-005
    topic: Архитектура состояния
    subtopic: Производное состояние и идентичность
    level: middle
    multiple: true
    question: |
      Дашборд аналитики. Команда решает, какие данные хранить нормализованными — в таблице по идентификаторам,
      со ссылками по id, — а какие оставить вложенными, как их присылает сервер. Для каких данных нормализация
      окупится?
    options:
      - text: 'Метрики, которые стоят в нескольких виджетах и которые можно переименовать'
        correct: true
        why: 'Одна метрика встречается в нескольких местах и меняется сама по себе. Во вложенных данных переименование обновит одну копию из нескольких.'
      - text: 'Точки графика за месяц, которые рисуют как есть и целиком заменяют при смене периода'
        why: 'Данные только показывают и заменяют новым ответом целиком. По отдельности их не обновляют, и разбор по таблицам ничего не даст.'
      - text: 'Имя автора отчёта, которое показывается только в шапке этого отчёта'
        why: 'Значение встречается в одном месте, дубликатов нет. Нормализация добавит сборку данных без выигрыша.'
      - text: 'Текст справки к виджету, который приходит один раз и больше не меняется'
        why: 'Неизменяемые данные нечему рассогласовывать: обновлений нет, и вложенный вид здесь проще всего.'
    explanation: |
      Нормализация — хранение данных «таблицами»: каждый тип по идентификаторам, ссылки только по id, порядок —
      массивом id. Она окупается, когда один элемент встречается в нескольких местах и меняется по отдельности:
      тогда изменение делается в одном месте. Цена — нужно разбирать ответ сервера и собирать данные для показа.
      Если данные только читают и целиком заменяют или каждый элемент встречается один раз, вложенный вид проще.
    links:
      - https://redux.js.org/usage/structuring-reducers/normalizing-state-shape

  - id: sdb-lifetime-002
    topic: Архитектура состояния
    subtopic: Время жизни состояния и навигация
    level: junior
    multiple: true
    question: |
      Онлайн-школа. На странице курса у ученика открыт урок 5 — его номер есть в адресе страницы. В уроке выбрана
      вкладка «Конспект», это состояние компонента. Отметка «урок пройден» сохранена на сервере, а заметка к уроку
      записана в sessionStorage. Ученик закрыл вкладку, а на следующий день открыл курс по закладке на этот же адрес.
      Что он увидит восстановленным?
    options:
      - text: 'Открытый урок 5'
        correct: true
        why: 'Номер урока записан в адресе, а закладка хранит адрес. Страница загрузится сразу на уроке 5.'
      - text: 'Отметку «урок пройден»'
        correct: true
        why: 'Отметка лежит на сервере и не зависит от вкладки: приложение получит её при загрузке страницы.'
      - text: 'Заметку к уроку'
        why: 'sessionStorage живёт, пока открыта вкладка. Ученик закрыл её — заметка пропала.'
      - text: 'Выбранную вкладку «Конспект»'
        why: 'Состояние компонента живёт в памяти страницы и не переживает даже перезагрузки, не то что закрытия вкладки.'
    explanation: |
      Каждое место хранения живёт до своего события. Память страницы пропадает при перезагрузке, sessionStorage —
      при закрытии вкладки, адрес остаётся в закладке, сервер хранит данные независимо от браузера. Если заметка
      должна дожить до завтра, её место — localStorage или сервер; если её нужно видеть и на телефоне — только
      сервер. Выбор начинают с вопроса «какие события это должно пережить», а не с названия хранилища.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Window/sessionStorage

  - id: sdb-lifetime-007
    topic: Архитектура состояния
    subtopic: Время жизни состояния и навигация
    level: middle
    question: |
      Онлайн-школа, мобильная версия. Ученик смотрит часовую видеолекцию со скоростью 1,5×, уходит в мессенджер
      ответить на сообщение и через несколько минут возвращается в браузер. Иногда страница загружается заново,
      и лекция начинается с нуля на обычной скорости. Команда уже записывает позицию и скорость в sessionStorage
      в обработчике beforeunload, но жалобы не прекратились. Что исправит проблему?
    options:
      - text: 'Записывать позицию и скорость по ходу просмотра и при скрытии страницы'
        correct: true
        why: 'Браузер выгружает фоновую вкладку без предупреждения, а прощальные обработчики на телефоне ненадёжны. Запись по ходу просмотра и при переходе страницы в скрытое состояние успевает до заморозки.'
      - text: 'Перенести запись позиции из обработчика beforeunload в обработчик unload'
        why: 'unload на телефоне так же ненадёжен, как beforeunload: в момент выгрузки фоновой вкладки код страницы вообще не запускается.'
      - text: 'Записывать позицию в beforeunload, но в localStorage вместо sessionStorage'
        why: 'Хранилище тут ни при чём: sessionStorage переживает выгрузку вкладки. Проблема в том, что запись вовсе не происходит, потому что beforeunload не срабатывает.'
      - text: 'Держать позицию и скорость в общем хранилище в памяти страницы'
        why: 'Общее хранилище живёт в памяти страницы. Когда браузер выгружает вкладку, оно пропадает вместе со всем остальным.'
    explanation: |
      Пока страница в фоне, браузер может её заморозить, а потом выгрузить из памяти; при возвращении она
      загружается заново. В момент выгрузки код страницы не запускается, а beforeunload и unload на телефоне часто
      не срабатывают. Документация Chrome о жизненном цикле страницы советует считать переход в скрытое состояние
      вероятным концом сессии и сохранять несохранённое в этот момент. Ещё надёжнее — сохранять по ходу работы,
      например раз в несколько секунд просмотра, а событие скрытия оставить страховкой.
    links:
      - https://developer.chrome.com/docs/web-platform/page-lifecycle-api#developer_recommendations_for_each_state

  - id: sdb-lifetime-006
    topic: Архитектура состояния
    subtopic: Время жизни состояния и навигация
    level: junior
    question: |
      Маркетплейс объявлений хранит фильтры в адресе страницы, и подборки вида /ads?city=kazan&maxPrice=20000 люди
      годами пересылают в чатах и хранят в закладках. При переделке поиска параметр city переименовали в location:
      теперь новые ссылки выглядят как /ads?location=kazan. Что делать со ссылками, где ещё стоит city?
    options:
      - text: 'Продолжать понимать city и показывать по нему ту же подборку, что и по location'
        correct: true
        why: 'Формат адреса стал контрактом, как только ссылками начали делиться. Старый параметр — часть этого контракта, и ссылки в чатах и закладках продолжат работать.'
      - text: 'Показывать по ссылке с city страницу «Ссылка устарела, настройте фильтры заново»'
        why: 'Экран не сломается, но все пересланные подборки перестанут работать. Человек, открывший ссылку друга, не узнает, что ему хотели показать.'
      - text: 'Пропускать незнакомый теперь параметр city и показывать объявления по всем городам'
        why: 'Значение по умолчанию спасает от действительно неверных значений вроде maxPrice=abc. А city — не ошибка, а старая часть контракта: молча её выбросить значит показать по ссылке не то.'
      - text: 'Хранить последнюю подборку в localStorage и подставлять её город в новые ссылки'
        why: 'localStorage есть только в браузере отправителя. У получателя ссылки его нет, и старая ссылка всё равно откроется без города.'
    explanation: |
      Как только ссылками делятся, формат адреса становится контрактом: на него опираются закладки, чаты, письма
      и поисковики. Поэтому при изменении формата старые параметры продолжают понимать — например, читают city как
      location. Незнакомые или неверные значения не ломают экран, а заменяются значениями по умолчанию, но
      устаревший параметр к ним не относится: его смысл известен, и выбрасывать его нельзя.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/History_API/Working_with_the_History_API

  - id: sdb-lifetime-004
    topic: Архитектура состояния
    subtopic: Время жизни состояния и навигация
    level: middle
    question: |
      Редактор документов: в списке документов есть поиск, результаты обновляются по мере ввода. Коллеги
      пересылают друг другу ссылки на результаты поиска, поэтому адрес страницы должен всё время совпадать с тем,
      что на экране. Сейчас каждая набранная буква добавляет запись в историю через pushState, и чтобы уйти со
      страницы поиска, приходится много раз нажимать «Назад». Как это исправить?
    options:
      - text: 'Обновлять адрес при вводе через replaceState, заменяя текущую запись истории'
        correct: true
        why: 'Адрес всё время совпадает с экраном, и ссылка работает. Набор запроса — одно действие, поэтому в истории остаётся одна запись, и «Назад» сразу уводит со страницы.'
      - text: 'Добавлять запись через pushState, но не раньше чем через полсекунды после последней буквы'
        why: 'Записей станет меньше, но каждая пауза при наборе всё равно добавит свою. А адрес будет отставать от экрана — это нарушает условие.'
      - text: 'Убрать запрос из адреса и держать его в состоянии компонента списка'
        why: 'История очистится, но ссылки на результаты поиска перестанут работать: получатель увидит список без запроса.'
      - text: 'Хранить запрос в sessionStorage и восстанавливать его после возвращения «Назад»'
        why: 'Запрос переживёт возвращение, но в пересылаемой ссылке его не будет: у получателя своя вкладка и своё хранилище.'
    explanation: |
      History API даёт два способа поменять адрес без перезагрузки. pushState добавляет новую запись, и «Назад»
      вернёт предыдущую; replaceState заменяет текущую. Новая запись нужна для того, что человек считает отдельным
      шагом: открыл документ, перешёл на следующую страницу. Уточнения внутри одного шага — набор запроса,
      перетаскивание ползунка цены — заменяют запись. Так адрес остаётся контрактом для ссылок, а история не
      засоряется.
    links:
      - https://developer.mozilla.org/ru/docs/Web/API/History_API/Working_with_the_History_API

  - id: sdb-lifetime-005
    topic: Архитектура состояния
    subtopic: Время жизни состояния и навигация
    level: senior
    multiple: true
    question: |
      Маркетплейс объявлений. Продавец правит своё объявление — цену и описание — и может бросить правку
      на середине. Несохранённые правки лежат черновиком в localStorage. Пока продавца не было, объявление могло
      измениться на сервере: модератор скрыл телефон из описания или сам продавец поменял цену с другого устройства.
      Какие решения правильные для такого черновика?
    options:
      - text: 'Хранить черновик не в серверной копии, а рядом, и помнить, с какой версии объявления он начат'
        correct: true
        why: 'Без исходной версии нельзя понять, менялось ли объявление, пока продавца не было. Отдельное хранение не даёт черновику и серверным данным затирать друг друга.'
      - text: 'Если серверная версия новее исходной, показать продавцу, что объявление изменилось, и дать выбрать'
        correct: true
        why: 'Решение остаётся за человеком: он видит и свои правки, и чужие изменения. Ничего не теряется молча.'
      - text: 'Удалять черновик после того, как сервер подтвердил сохранение объявления'
        correct: true
        why: 'Отправленный черновик больше не нужен. Если его оставить, при следующей правке продавец увидит давно сохранённый текст.'
      - text: 'При открытии записывать черновик поверх серверной версии: это последние правки продавца'
        why: 'Так молча пропадёт правка модератора или цена, выставленная с другого устройства. Черновик начат с более старой версии.'
      - text: 'При открытии молча удалять черновик, если серверная версия оказалась новее'
        why: 'Продавец потеряет свой ввод, даже не узнав, что он был. Это та же потеря данных, только в другую сторону.'
    explanation: |
      Черновик — то, что человек ввёл, но сервер ещё не подтвердил; серверная истина — то, что действительно
      для всех. Их держат отдельно. Черновик помнит, с какой версии начат: если версия на сервере новее, приложение
      показывает расхождение и даёт выбрать, а не решает молча за человека. После подтверждения сохранения черновик
      удаляют. Как устроены версии и разрешение конфликтов, подробно разбирается во втором курсе, в уроке «Версии
      и конфликты».
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Window/localStorage

  - id: sdb-workflow-001
    topic: Архитектура состояния
    subtopic: Моделирование процессов
    level: junior
    question: |
      Онлайн-банк описывает перевод денег конечным автоматом. Команда выписала четыре строки для схемы. Какая из них
      — событие, а не состояние?
    options:
      - text: 'Клиент ввёл код из СМС и нажал «Подтвердить»'
        correct: true
        why: 'Это то, что произошло в конкретный момент и может сдвинуть перевод из ожидания кода дальше. Событие отвечает на вопрос «что случилось».'
      - text: 'Перевод ждёт кода из СМС'
        why: 'Это положение процесса, в котором он находится какое-то время и чего-то ждёт, — состояние.'
      - text: 'Перевод отклонён: процесс завершён, деньги не списаны'
        why: 'Это конечное состояние: процесс в нём остановился, и дальше переходов нет. Событием был ответ банка, который сюда привёл.'
      - text: 'Перевод на проверке у службы безопасности'
        why: 'Процесс стоит и ждёт решения проверки — это состояние. Событием будет само решение: «проверка пройдена» или «перевод заблокирован».'
    explanation: |
      Состояние — где процесс находится сейчас и чего ждёт: «ждём код», «на проверке», «отклонён». Событие — что
      произошло и может вызвать переход: «ввёл код», «банк ответил отказом», «вышло время». Переход связывает их:
      в состоянии «ждём код» по событию «ввёл верный код» перевод уходит на отправку. Если путать события
      и состояния, таблица переходов не складывается: непонятно, из чего и во что переходить.
    links:
      - https://statecharts.dev/what-is-a-state-machine.html

  - id: sdb-workflow-002
    topic: Архитектура состояния
    subtopic: Моделирование процессов
    level: junior
    question: |
      В видеосервисе экран загрузки ролика хранит четыре флага: isUploading, isProcessing, isDone и isError.
      Иногда на экране одновременно видны полоса загрузки и сообщение об ошибке. Какое изменение делает такое
      сочетание невозможным?
    options:
      - text: 'Заменить флаги одним полем статуса: uploading, processing, done или error'
        correct: true
        why: 'Поле принимает ровно одно значение из четырёх, поэтому «загружается и ошибка» записать просто нечем. Невозможное сочетание исчезает из модели.'
      - text: 'Показывать полосу загрузки, только когда isUploading включён, а isError выключен'
        why: 'Это прячет симптом в разметке, но сочетание флагов по-прежнему возможно. Следующий экран, читающий эти флаги, снова покажет противоречие.'
      - text: 'Сбрасывать все четыре флага в начале каждого обработчика, а потом ставить нужный'
        why: 'Это помогает, пока никто не забыл сброс в новом обработчике. Модель всё ещё допускает 16 сочетаний, а соблюдать порядок приходится вручную.'
      - text: 'Перенести все четыре флага из компонента в общее хранилище состояния'
        why: 'Место хранения не меняет числа сочетаний: в хранилище те же четыре независимых флага и те же 16 вариантов.'
    explanation: |
      Четыре логических флага дают 2 × 2 × 2 × 2 = 16 сочетаний, а осмысленных среди них — единицы. Остальные —
      невозможные состояния: код их не запрещает, значит, рано или поздно одно случится. Документация React
      советует заменять зависимые флаги одним полем статуса. Вторая выгода: данные можно привязать к статусу — текст
      ошибки есть только в error, процент загрузки — только в uploading.
    links:
      - https://ru.react.dev/learn/reacting-to-input-with-state

  - id: sdb-workflow-003
    topic: Архитектура состояния
    subtopic: Моделирование процессов
    level: senior
    question: |
      Онлайн-банк. Клиент подтвердил перевод 15 000 рублей, приложение отправило запрос, и через 30 секунд вышло
      время ожидания — ответа нет. Сервер банка повторную отправку того же перевода не распознаёт: она создаст
      второй перевод. Зато в приложении есть история операций, которую сервер отдаёт по запросу. В какое состояние
      должен перейти экран перевода?
    options:
      - text: 'В «результат неизвестен»: написать «Узнаём исход» и искать перевод в истории'
        correct: true
        why: 'Запрос мог не дойти, а мог дойти и выполниться — клиент этого не знает. Честное состояние — неизвестность, а выход из неё — узнать у сервера через историю операций, а не отправлять снова.'
      - text: 'В «ошибку»: показать «Не удалось перевести» и предложить кнопку «Повторить»'
        why: 'Если перевод на самом деле прошёл, повтор создаст второй — по условию сервер его не распознает. Клиент выдаёт неизвестность за отказ.'
      - text: 'В «заполнение» с сохранёнными данными, чтобы клиент сам отправил ещё раз'
        why: 'По сути это тот же повтор, только руками клиента. Он решит, что перевода не было, и отправит деньги второй раз.'
      - text: 'В «успех»: показать «Перевод выполнен», ведь сервер обычно успевает'
        why: 'Обещание без основания. Если запрос потерялся, клиент уйдёт уверенным, что деньги отправлены, а получатель их не дождётся.'
    explanation: |
      Отсутствие ответа — не отказ и не успех, а отдельный исход: запрос мог потеряться по дороге к серверу, а мог
      дойти, и тогда потерялся ответ. В автомате операции для этого нужно своё состояние «результат неизвестен»
      с переходами «операция нашлась» и «операции нет». Здесь узнать исход помогает история операций. Надёжнее,
      когда клиент заранее прикладывает к запросу свой идентификатор и повторяет запрос с ним же, — как это
      устроено, разбирается в курсе 2, в уроке «Повторы без двойных списаний».
    links:
      - https://statecharts.dev/what-is-a-state-machine.html

  - id: sdb-workflow-004
    topic: Архитектура состояния
    subtopic: Моделирование процессов
    level: middle
    multiple: true
    question: |
      Сервис бронирования столиков описал форму автоматом: «выбор» → «отправка» → «подтверждено», «мест нет» или
      «нет ответа». Пока идёт отправка, поля формы заблокированы. Какие события в состоянии «отправка» должны вести
      к переходу?
    options:
      - text: 'Ответ ресторана «столик забронирован»'
        correct: true
        why: 'Это успешный исход отправки: переход в «подтверждено».'
      - text: 'Ответ ресторана «на это время мест нет»'
        correct: true
        why: 'Отказ — тоже исход отправки, он ведёт в «мест нет», где человек может выбрать другое время.'
      - text: 'Истечение времени ожидания ответа'
        correct: true
        why: 'Ответа нет — отдельный исход: переход в «нет ответа», а не в отказ. Бронь могла и создаться.'
      - text: 'Повторное нажатие кнопки «Забронировать»'
        why: 'Отправка уже идёт. Переход по этому событию сделал бы вторую бронь, поэтому в «отправке» его нет, и нажатие ничего не меняет.'
      - text: 'Изменение времени брони в форме'
        why: 'Поля заблокированы, пока идёт отправка, и смена времени здесь не предусмотрена. Иначе ответ пришёл бы на одно время, а на экране было бы другое.'
    explanation: |
      Таблица переходов перечисляет для каждого состояния события, на которые оно реагирует. Событие без перехода
      в текущем состоянии ничего не меняет — это и защищает от двойного нажатия, причём не дисциплиной «не забыть
      заблокировать кнопку», а самой моделью. Из «отправки» выходят только ответы сервера и истечение времени:
      успех, отказ и неизвестный результат — три разных исхода с разным продолжением.
    links:
      - https://statecharts.dev/what-is-a-state-machine.html

  - id: sdb-workflow-005
    topic: Архитектура состояния
    subtopic: Моделирование процессов
    level: middle
    question: |
      В видеосервисе загруженный ролик проходит на сервере статусы «загружен» → «обрабатывается» → «на модерации» →
      «опубликован» или «отклонён». Статусы меняют сервер обработки и модераторы, правила переходов проверяет сервер.
      Страница автора опрашивает сервер раз в 30 секунд. В прошлый раз она получила «обрабатывается», а сейчас —
      сразу «опубликован». Как должна поступить страница?
    options:
      - text: 'Принять «опубликован» и показать его: промежуточный шаг прошёл между опросами'
        correct: true
        why: 'Статусом владеет сервер, и он уже проверил переходы. Клиент видит процесс с шагом в 30 секунд, поэтому пропуск промежуточных статусов — нормальная ситуация, а не ошибка.'
      - text: 'Отбросить ответ как недопустимый переход и оставить на экране «обрабатывается»'
        why: 'Клиент спорит с владельцем статуса по своей копии правил. Ролик уже опубликован, а автор видит устаревший статус и не понимает, что происходит.'
      - text: 'Повторять запрос, пока сервер не вернёт статус, допустимый из «обрабатывается»'
        why: 'Сервер так и будет отвечать «опубликован»: модерация уже прошла. Страница зациклится и будет нагружать сервер впустую.'
      - text: 'Показать «на модерации», а через несколько секунд переключить на «опубликован»'
        why: 'Клиент выдумывает шаг, которого не видел, и показывает автору неправду о том, где сейчас ролик. Отображение не должно сочинять состояния.'
    explanation: |
      Есть автоматы, которыми владеет клиент, — например, отправка формы, — и их переходы клиент проверяет сам.
      А есть автоматы, которыми владеет сервер: статусы заказа, документа, ролика. Их клиент не ведёт, а отображает.
      Опрос показывает процесс отдельными кадрами, и между кадрами процесс может пройти несколько шагов. Поэтому
      клиент принимает статус, который прислал владелец, даже если не видел промежуточных.
    links:
      - https://statecharts.dev/what-is-a-state-machine.html

  - id: sdb-read-write-001
    topic: Потоки данных и проектирование API
    subtopic: Чтение и запись
    level: junior
    question: |
      В почтовом клиенте человек делает за минуту несколько вещей. Какое из этих действий — команда, которая меняет
      данные на сервере?
    options:
      - text: 'Переместить письмо из «Входящих» в папку «Важное»'
        correct: true
        why: 'После этого письмо будет лежать в другой папке на всех устройствах человека — меняется состояние на сервере. Это команда, и сервер может её выполнить или отклонить.'
      - text: 'Загрузить следующую страницу писем во «Входящих»'
        why: 'Это чтение: клиент получает данные и ничего не меняет на сервере. Такой запрос можно безопасно повторить.'
      - text: 'Развернуть уже загруженную цепочку ответов в письме'
        why: 'Это локальная реакция интерфейса: данные уже на устройстве, меняется только то, как они показаны. Сервер об этом не узнаёт.'
      - text: 'Показать из загруженных писем только те, что с вложениями'
        why: 'Фильтр по уже загруженным письмам — тоже локальная реакция: на сервере ничего не меняется, это лишь другой вид тех же данных.'
    explanation: |
      Действия на экране бывают трёх видов. Чтение получает данные и ничего не меняет — его можно повторять. Команда
      просит сервер изменить состояние, и у неё есть исход: принята, отклонена или неизвестно. Локальная реакция
      интерфейса происходит на устройстве мгновенно и серверу не нужна. Различать их нужно, потому что у каждого вида
      свои правила: чтение можно повторить и запустить заранее, команду — нет; локальную реакцию показывают сразу,
      а результат команды — когда известен исход. Этот принцип восходит к разделению команд и запросов (CQS) Бертрана
      Мейера.
    links:
      - https://martinfowler.com/bliki/CommandQuerySeparation.html

  - id: sdb-read-write-002
    topic: Потоки данных и проектирование API
    subtopic: Чтение и запись
    level: middle
    question: |
      В групповом чате на 30 участников под сообщением 812 стоят четыре реакции «👍». Участники ставят реакции
      одновременно, каждый со своего устройства. Человек нажимает «👍». Что клиент должен отправить на сервер?
    options:
      - text: 'Команду «поставить 👍 сообщению 812 от меня», а итог посчитает сервер'
        correct: true
        why: 'Команда несёт намерение. Если двое нажмут одновременно, сервер применит обе команды и получит шесть, а не пять реакций.'
      - text: 'Новое число «👍» у сообщения 812, посчитанное на клиенте: было 4, стало 5'
        why: 'Это результат вместо намерения. Двое нажмут одновременно, оба пришлют «5», и одна реакция потеряется; к тому же серверу придётся верить чужим вычислениям.'
      - text: 'Весь список реакций сообщения 812 с добавленной в него новой'
        why: 'Список целиком затрёт реакции, которые другие участники поставили, пока этот клиент держал у себя старую копию.'
      - text: 'Запрос текущего числа «👍», а затем это число, увеличенное на единицу'
        why: 'Свежее чтение не спасает: между чтением и записью кто-то ещё успеет поставить реакцию, и она пропадёт. Результат всё равно вычисляет клиент.'
    explanation: |
      Команда описывает, что человек хочет сделать («поставить реакцию»), а не каким должно стать состояние («реакций
      теперь пять»). Сервер применяет намерения по очереди к своим, самым свежим данным, и одновременные действия
      не затирают друг друга. Отправка готового результата ломается, как только данные меняют двое сразу.
      Клиент при этом может сразу показать пятую реакцию — это локальная реакция интерфейса, а настоящее число придёт
      от сервера.
    links:
      - https://martinfowler.com/bliki/CommandQuerySeparation.html

  - id: sdb-read-write-003
    topic: Потоки данных и проектирование API
    subtopic: Чтение и запись
    level: middle
    question: |
      В сервисе аналитики есть кнопка «Выгрузить отчёт за год». Данных за год — несколько гигабайт, сервер собирает
      файл от трёх до пяти минут. Пока файл готовится, аналитик хочет продолжать работать с дашбордом. Как устроить
      выгрузку?
    options:
      - text: 'Отправить команду, сразу показать «Готовим файл» и дать ссылку, когда он соберётся'
        correct: true
        why: 'Это асинхронная команда: сервер принимает её (например, ответом 202 Accepted), а клиент узнаёт итог позже по статусу. Работа с дашбордом не прерывается.'
      - text: 'Держать запрос открытым, пока файл не готов, и показывать индикатор поверх дашборда'
        why: 'Пять минут ожидания одного ответа — это и заблокированная работа, и риск, что соединение оборвётся по дороге, а человек так и не узнает исход.'
      - text: 'Отправить команду и опрашивать статус каждую секунду, заблокировав дашборд до готовности'
        why: 'Асинхронная команда здесь есть, но дашборд заблокирован на пять минут — а условие требует, чтобы аналитик продолжал работать.'
      - text: 'Загрузить в браузер все данные за год и собрать файл прямо на устройстве'
        why: 'Несколько гигабайт через сеть в браузер — долго и тяжело для устройства. Собирать файл из таких данных — работа сервера.'
    explanation: |
      Для долгих операций подходит третья стратегия порядка — «принять и обработать позже». Сервер отвечает сразу,
      что команда принята; в HTTP для этого есть статус 202 Accepted, и RFC 9110 подчёркивает, что он ни к чему
      не обязывает: обработка ещё не закончена. Поэтому вместе с ответом сервер даёт способ узнать итог — адрес статуса,
      который клиент перечитывает, или уведомление. Интерфейс честно пишет «Готовим файл», не блокирует остальную работу
      и показывает ссылку, когда статус сменился на «готово».
    links:
      - https://www.rfc-editor.org/rfc/rfc9110.html#name-202-accepted

  - id: sdb-read-write-004
    topic: Потоки данных и проектирование API
    subtopic: Чтение и запись
    level: middle
    question: |
      В мессенджере сообщение можно удалить «у всех» в течение 48 часов после отправки. Кнопку «Удалить у всех»
      не нужно показывать у сообщений, которые удалить уже нельзя. Часы на телефонах у людей бывают сбиты на часы
      и даже на дни. Как распределить ответственность между клиентом и сервером?
    options:
      - text: 'Сервер проверяет срок при удалении и в данных сообщения сообщает, можно ли его удалить'
        correct: true
        why: 'Решает сервер — по своим часам и при каждой команде. Клиент лишь показывает или прячет кнопку по признаку, который прислал сервер, и не зависит от часов телефона.'
      - text: 'Клиент сравнивает время отправки с часами телефона и не шлёт команду позже 48 часов'
        why: 'Правило живёт только в клиенте. Сбитые часы покажут неверный срок, а изменённый клиент обойдёт проверку, и сервер удалит что угодно.'
      - text: 'Сервер проверяет срок при удалении, а кнопку клиент показывает у всех сообщений подряд'
        why: 'Правило соблюдено, но условие задачи нарушено: человек нажмёт кнопку, которая заведомо не сработает, и узнает об этом только из отказа.'
      - text: 'Клиент проверяет срок и передаёт серверу признак «срок не истёк», которому сервер верит'
        why: 'Сервер доверяет вычислению на чужом устройстве. Признак легко подделать, а часы телефона могут ошибаться.'
    explanation: |
      Правило «удалять можно 48 часов» — бизнес-логика, и проверяет его сервер: по своим часам и при каждой команде
      удаления. Чтобы интерфейс не показывал бесполезную
      кнопку, сервер передаёт клиенту готовый признак «можно удалить» вместе с данными сообщения. Клиент использует
      его для подсказки, но и при устаревшем признаке ничего не сломается: сервер откажет, а экран объяснит почему.
    links:
      - https://martinfowler.com/bliki/CommandQuerySeparation.html

  - id: sdb-read-write-005
    topic: Потоки данных и проектирование API
    subtopic: Чтение и запись
    level: senior
    multiple: true
    question: |
      Почтовый клиент. Люди разбирают входящие быстро: архивируют по 20–30 писем подряд. Архивирование почти никогда
      не отказывает, а письмо из архива легко вернуть. Отправку письма отменить нельзя, и сервер иногда в ней
      отказывает — например, когда вложение слишком большое или превышен дневной лимит. Какие решения подходят?
    options:
      - text: 'Архивирование: письмо сразу исчезает из списка, а при отказе возвращается с сообщением'
        correct: true
        why: 'Действие частое, дешёвое, почти всегда удаётся и легко откатывается — для него подходит оптимистичный интерфейс. Человек не ждёт сервер на каждом из 30 писем.'
      - text: 'Отправка: «Отправляется…», а «Отправлено» — только после ответа сервера'
        correct: true
        why: 'Действие необратимо, и отказы бывают. Значит, результат показывают после ответа сервера, а на время ожидания — понятную локальную реакцию.'
      - text: 'Архивирование: блокировать список до ответа сервера на каждое письмо'
        why: 'Ожидание сервера на каждом письме превращает разбор 30 писем в 30 пауз — а отказы так редки, что ждать их незачем.'
      - text: 'Отправка: сразу показать «Отправлено», а при отказе вернуть письмо в черновики'
        why: 'Действие необратимо, и отказы бывают. Человек уйдёт уверенным, что письмо ушло, а об отказе узнает, только если сам заглянет в черновики.'
      - text: 'Архивирование: письмо сразу исчезает и не возвращается, даже если сервер отказал'
        why: 'Половина оптимистичного интерфейса без отката. Экран расходится с сервером: человек думает, что письмо в архиве, а оно по-прежнему во входящих.'
    explanation: |
      Стратегию порядка выбирают для каждого действия отдельно — по цене отказа и по тому, как часто он случается.
      Частые, дешёвые и обратимые действия (архивировать, отметить прочитанным) показывают сразу и откатывают при
      редком отказе — это оптимистичный интерфейс. Необратимые действия с заметной вероятностью отказа (отправить
      письмо, оплатить) показывают как «в процессе» и подтверждают только ответом сервера — это пессимистичный
      интерфейс. Цена оптимизма — откат: если сервер всё-таки отказал, изменение возвращают и честно говорят об этом,
      иначе экран будет показывать то, чего на сервере нет.
    links:
      - https://martinfowler.com/bliki/CommandQuerySeparation.html

  - id: sdb-api-001
    topic: Потоки данных и проектирование API
    subtopic: Проектирование контракта API
    level: junior
    question: |
      Видеосервис. Экран сезона показывает список серий; по нажатию он открывает плеер нужной серии и сохраняет,
      на какой минуте человек остановился. В ответе сервера у каждой серии есть название, длительность и адрес обложки.
      Чего в ответе не хватает этому экрану?
    options:
      - text: 'Стабильного уникального идентификатора у каждой серии'
        correct: true
        why: 'Чтобы открыть плеер и сохранить место остановки, клиенту нужно сослаться на конкретную серию. Для этого нужна стабильная уникальная метка — идентификатор.'
      - text: 'Порядкового номера серии, чтобы ссылаться на неё по позиции'
        why: 'Позиция сдвигается, когда в сезон добавляют или переставляют серии, и прогресс окажется привязан к чужой серии. Позиция — не идентичность.'
      - text: 'Общего числа серий во всех сезонах сериала'
        why: 'Это число может пригодиться для подписи, но ни открыть плеер, ни сохранить прогресс без ссылки на конкретную серию оно не поможет.'
      - text: 'Обложки каждой серии сразу в нескольких размерах'
        why: 'Это улучшит картинку на разных экранах, но не решает главного: экран не может сослаться на серию в командах.'
    explanation: |
      Каждой сущности, на которую клиент потом сошлётся — в команде, в ключе списка, в кэше, в адресе страницы, —
      нужен идентификатор: стабильная уникальная метка. Название и позиция для этого не годятся: названия повторяются
      и меняются, а позиция сдвигается при изменении списка. Хороший приём при проектировании контракта — выписать
      всё, что человек может сделать на экране: каждое действие подскажет, на что клиенту нужно будет сослаться.
    links:
      - https://graphql.org/learn/caching/

  - id: sdb-api-002
    topic: Потоки данных и проектирование API
    subtopic: Проектирование контракта API
    level: middle
    question: |
      Сервис бронирования жилья. На любой отказ в бронировании сервер отвечает кодом 400 и телом
      `{ "message": "Не удалось забронировать" }`. Экрану нужно по-разному реагировать на причины отказа: если даты
      заняты — предложить ближайшие свободные даты, если гостей больше, чем мест, — подсветить поле «Гости». Что
      изменить в контракте?
    options:
      - text: 'Отдавать ошибку по Problem Details: тип причины и свободные даты в расширении'
        correct: true
        why: 'Клиент выбирает поведение по машиночитаемому типу, а нужные данные — свободные даты — получает в поле-расширении. Текст при этом остаётся для человека.'
      - text: 'Писать в message подробный текст, в котором клиент найдёт слова «даты» и «гости»'
        why: 'Поиск по тексту ломается, как только текст переведут или перефразируют. RFC 9457 прямо советует не разбирать поле с описанием.'
      - text: 'Возвращать для каждой причины свой код HTTP: 409 для дат и 422 для гостей'
        why: 'Для двух причин коды ещё найдутся, но их мало, а причин станет больше. И главное — код не передаст свободные даты, которые нужны экрану.'
      - text: 'Проверять занятость дат и число мест на клиенте и не слать заведомо неудачные запросы'
        why: 'Занятость знает только сервер, и она меняется каждую минуту. Отказы всё равно будут приходить, и экрану по-прежнему нечем их различить.'
    explanation: |
      Ошибка в ответе адресована двум читателям: программе и человеку. Программе нужен машиночитаемый тип, человеку —
      понятный текст. Стандарт Problem Details (RFC 9457) даёт для этого поля `type`, `title`, `status`, `detail`
      и `instance`, а также расширения — дополнительные поля конкретного вида проблемы, например список свободных дат.
      Код HTTP остаётся полезным для грубого деления на «исправимо клиентом» (4xx) и «проблема сервера» (5xx), но для
      выбора поведения его не хватает.
    links:
      - https://www.rfc-editor.org/rfc/rfc9457.html#name-members-of-a-problem-detail

  - id: sdb-api-003
    topic: Потоки данных и проектирование API
    subtopic: Проектирование контракта API
    level: middle
    question: |
      Сайт бронирования отелей. Страницы отелей каждый день открывают миллионы анонимных посетителей; содержимое
      страницы одинаково для всех и обновляется раз в сутки. Клиент один — сайт, мобильных приложений нет. Серверы
      не справляются с вечерним пиком, хотя всем отвечают одно и то же. Какой стиль API для данных страницы отеля
      предпочтительнее?
    options:
      - text: 'REST: у каждого отеля свой адрес, и одинаковые ответы на GET раздаёт CDN'
        correct: true
        why: 'Одинаковые для всех ответы на GET по уникальному адресу CDN раздаёт сама, и до серверов доходит малая часть запросов. Это стандартное HTTP-кэширование.'
      - text: 'GraphQL: один адрес и POST-запросы, а клиент сам выбирает нужные поля'
        why: 'Гибкость полей здесь не нужна — клиент один. А POST-запросы на один адрес стандартный HTTP-кэш не кэширует, и нагрузка на серверы останется.'
      - text: 'RPC: вызов getHotelPage, где номер отеля передаётся в теле POST-запроса'
        why: 'Номер отеля спрятан в теле POST-запроса, у запросов нет различимых адресов, и CDN не может раздавать готовые ответы.'
      - text: 'GraphQL с кэшем на клиенте по id, чтобы повторные визиты не шли на сервер'
        why: 'Кэш на клиенте помогает только тому же посетителю при повторном визите. Миллионы первых посещений всё равно дойдут до серверов.'
    explanation: |
      Стиль API выбирают по форме данных, числу клиентов и цене кэширования. У REST адрес однозначно определяет ресурс,
      поэтому ответы на GET кэшируются в браузере и в CDN стандартными средствами HTTP. Для публичных данных, одинаковых
      для всех, это решающий плюс. GraphQL выигрывает, когда разным клиентам нужны разные срезы связанного графа данных,
      но запросы обычно идут POST на один адрес, и кэш приходится строить на клиенте по идентификаторам объектов.
    links:
      - https://graphql.org/learn/caching/

  - id: sdb-api-004
    topic: Потоки данных и проектирование API
    subtopic: Проектирование контракта API
    level: senior
    multiple: true
    question: |
      Онлайн-банк: переводы между своими счетами и на чужую карту. Комиссия зависит от тарифа клиента. Человек может
      держать банк открытым в двух вкладках, а связь в метро рвётся посреди запроса. Что обязан гарантировать сервер?
    options:
      - text: 'Повторная отправка той же команды перевода не выполняет его второй раз'
        correct: true
        why: 'Повтор после обрыва связи и отправка из двух вкладок — ровно то, что клиент предотвратить не может. Однократность перевода обеспечивает только сервер.'
      - text: 'Сумма списания не превышает доступный остаток на счёте'
        correct: true
        why: 'Остаток знает и меняет сервер; клиентская копия может устареть, а изменённый клиент — пропустить проверку.'
      - text: 'Комиссия считается по тарифу на сервере, а не берётся из запроса клиента'
        correct: true
        why: 'Сумму в запросе можно подделать, а тариф мог измениться. Деньги считает тот, кто ими владеет, — сервер.'
      - text: 'Ответ на команду перевода всегда доходит до клиента, даже если связь оборвалась'
        why: 'Этого не может обещать никто: сеть теряет ответы. Сервер гарантирует однократность, а клиент при пропавшем ответе выясняет, чем закончился перевод.'
      - text: 'Вторая открытая вкладка сразу показывает новый остаток после перевода в первой'
        why: 'Это удобство интерфейса, а не гарантия денег. Остаток во второй вкладке — копия, кэш клиента, а правильность следующего перевода сервер проверит сам.'
    explanation: |
      Код клиента работает на устройстве человека: его можно изменить, вкладок бывает несколько, сеть теряет ответы
      и повторяет запросы. Поэтому однократность операции, проверка остатка и расчёт денег — гарантии сервера, и контракт
      должен их назвать. Но гарантировать можно только то, что сервер контролирует. Доставку ответа через оборванную
      сеть не обеспечит никто, а свежесть копии во второй вкладке — забота клиента, а не правило о деньгах. Как именно
      сервер распознаёт повтор той же команды, разбирается в курсе 2, в уроке «Повторы без двойных списаний».
    links:
      - https://docs.stripe.com/api/idempotent_requests

  - id: sdb-api-005
    topic: Потоки данных и проектирование API
    subtopic: Проектирование контракта API
    level: senior
    question: |
      Видеосервис работает на сайте, в приложениях для iOS и Android и на телевизорах. Главный экран на каждой
      платформе свой: у телевизора — крупные ряды обложек, у телефона — лента коротких превью. Данные лежат
      в двенадцати общих сервисах. Телевизор собирает главный экран из девяти запросов, часть которых ждёт ответов
      предыдущих, и тратит на это почти пять секунд. У каждой платформы своя команда, и задачи этих команд неделями
      ждут очереди у команды общих сервисов. Что предпочтительнее?
    options:
      - text: 'Свой BFF для каждого вида клиента, который собирает главный экран одним ответом'
        correct: true
        why: 'Телевизор получает главный экран одним запросом, а сборку цепочки берёт на себя сервер рядом с общими сервисами. BFF принадлежит команде платформы, и очередь к общей команде исчезает.'
      - text: 'Один эндпоинт главного экрана в общем API для всех платформ, с полями для каждой'
        why: 'Запросов станет меньше, но эндпоинт разрастётся под четыре разных экрана, а каждое изменение снова будет ждать очереди у команды общих сервисов.'
      - text: 'Оставить общий API, а на телевизоре отправлять все девять запросов параллельно'
        why: 'Часть запросов ждёт ответов предыдущих, поэтому параллельно отправить все не выйдет. Цепочка на слабом устройстве останется медленной.'
      - text: 'Кэшировать на телевизоре ответы всех девяти запросов на сутки вперёд'
        why: 'Первое открытие останется пятисекундным, а главный экран сутки не будет показывать новые серии и фильмы.'
    explanation: |
      Backend for Frontend (BFF) по Сэму Ньюмену — небольшой серверный слой для одного вида клиента. Он вызывает общие
      сервисы, собирает и переупаковывает данные под экраны своего клиента. Им владеет команда интерфейса, поэтому
      она меняет его вместе с экранами без очереди к другим командам: «один опыт — один BFF». Цена — ещё один сервис
      и похожая логика в нескольких BFF. Ньюмен советует не заводить BFF, если клиент один и собирать на сервере почти
      нечего; при нескольких непохожих клиентах и слабых устройствах он себя оправдывает.
    links:
      - https://samnewman.io/patterns/architectural/bff/

  - id: sdb-outcomes-001
    topic: Потоки данных и проектирование API
    subtopic: Жизненный цикл данных и исходы в UI
    level: junior
    question: |
      Фотохостинг. Человек открывает только что созданный альбом. Сервер ответил успешно: в альбоме ноль фото. Что
      показать на месте сетки снимков?
    options:
      - text: 'Объяснение, что фото в альбоме пока нет, и кнопку «Загрузить»'
        correct: true
        why: 'Это пустое состояние: запрос удался, данных действительно нет. Экран объясняет, почему пусто, и даёт прямой путь к действию.'
      - text: 'Сообщение «Не удалось загрузить альбом» и кнопку «Повторить»'
        why: 'Ошибки не было — сервер ответил успешно. Повтор вернёт тот же пустой альбом, а человек решит, что сайт сломан.'
      - text: 'Скелетон сетки фото, пока в альбоме не появятся первые снимки'
        why: 'Скелетон означает «данные в пути». Здесь они уже пришли, и бесконечная загрузка обманет человека.'
      - text: 'Пустую область под заголовком альбома, без лишних надписей'
        why: 'Совершенно пустой экран сбивает с толку: непонятно, работает ли сайт и что делать дальше.'
    explanation: |
      Пустое состояние — успешный ответ без данных. Это не ошибка и не загрузка, и выглядеть оно должно по-своему:
      сказать, почему здесь пусто, и предложить следующий шаг — загрузить фото, сбросить фильтр, выбрать ресторан.
      Nielsen Norman Group отмечает, что совершенно пустые экраны путают людей, а сообщение «ничего нет», показанное
      во время загрузки, заставляет поверить, что данных нет.
    links:
      - https://www.nngroup.com/articles/empty-state-interface-design/

  - id: sdb-outcomes-002
    topic: Потоки данных и проектирование API
    subtopic: Жизненный цикл данных и исходы в UI
    level: middle
    question: |
      Дашборд аналитика собран из шести виджетов, каждый получает данные своим запросом. Аналитик открывает дашборд,
      чтобы сравнить все показатели, и виджет «Конверсия» добавил сам. Пять запросов прошли, а сервис конверсии ответил
      ошибкой 500. Что показать?
    options:
      - text: 'Пять виджетов с данными, а на месте шестого — ошибку и «Повторить»'
        correct: true
        why: 'Ошибка показа ставится на место отсутствующих данных, а остальной экран работает. Аналитик видит, что конверсии нет, и может запросить её снова.'
      - text: 'Ошибку на весь дашборд, пока все шесть запросов не пройдут успешно'
        why: 'Сбой одного блока роняет весь экран: аналитик теряет пять рабочих виджетов из-за одного сломанного.'
      - text: 'Пять виджетов с данными, а шестой убрать с экрана до следующего открытия'
        why: 'Прятать можно второстепенный блок. Этот виджет аналитик добавил сам ради сравнения — он решит, что виджет пропал, и не узнает о сбое.'
      - text: 'Пять виджетов с данными, а в шестом — ноль, пока сервис не ответит'
        why: 'Ноль — это значение, а не его отсутствие. Аналитик примет его за настоящую конверсию и сделает неверный вывод.'
    explanation: |
      Плавная деградация: сбой одного источника данных не должен ронять весь экран. Для каждого блока заранее решают,
      главный он или второстепенный и что с ним делать при сбое: спрятать, показать сообщение на его месте, показать
      последние известные данные с пометкой или — только для главного блока — показать ошибку на весь экран. Нужный
      человеку блок не прячут и не заполняют выдуманным значением: на его месте честно пишут, что данные
      не загрузились.
    links:
      - https://www.nngroup.com/articles/error-message-guidelines/

  - id: sdb-outcomes-003
    topic: Потоки данных и проектирование API
    subtopic: Жизненный цикл данных и исходы в UI
    level: middle
    question: |
      Почтовый клиент. Человек двадцать минут писал длинный ответ и нажал «Отправить». Сервер ответил 503 — сервис
      временно недоступен, письмо не принято. Черновик на сервере ни разу не сохранялся. Как должен повести себя
      интерфейс?
    options:
      - text: 'Не закрывать редактор, сказать, что письмо не ушло, и дать отправить снова'
        correct: true
        why: 'Это ошибка действия: сообщение стоит у места действия, ввод человека сохранён, а исправить можно исходное действие, не начиная заново.'
      - text: 'Перейти на страницу «Сервис недоступен» с кнопкой «Вернуться во входящие»'
        why: 'Ошибка действия превращена в ошибку всего экрана, а двадцать минут работы пропадают вместе с редактором.'
      - text: 'Закрыть редактор и показать в углу уведомление «Письмо не отправлено»'
        why: 'Человек узнал правду, но черновик нигде не сохранён — текст потерян, и написать его придётся заново.'
      - text: 'Тихо повторять отправку в фоне каждые две секунды, пока она не получится'
        why: 'Человек не знает, что письмо не ушло, а бесконечные повторы нагружают и без того перегруженный сервис. Нужны честное сообщение и понятный выход.'
    explanation: |
      Ошибка действия отличается от ошибки показа: контент на экране в порядке, не выполнилась команда. Поэтому
      сообщение ставят рядом с действием, ввод сохраняют и дают повторить исходное действие — так советует и Nielsen
      Norman Group в рекомендациях по сообщениям об ошибках. Экран не уводят на страницу ошибки и не делают вид,
      что действие удалось. Ответ 503 здесь — известный отказ: сервер сообщил, что письмо не принято. Если бы ответа
      не было вовсе, исход был бы неизвестен, и предлагать повтор вслепую было бы нельзя.
    links:
      - https://www.nngroup.com/articles/error-message-guidelines/

  - id: sdb-outcomes-004
    topic: Потоки данных и проектирование API
    subtopic: Жизненный цикл данных и исходы в UI
    level: middle
    question: |
      Дашборд продаж обновляет цифры раз в минуту. Последние три обновления не удались — сервер отвечает 503, и на
      экране цифры семиминутной давности. Руководитель смотрит дашборд на планёрке и по нему решает, запускать ли
      акцию сегодня. Что показать?
    options:
      - text: 'Оставить цифры с временем их получения и пометкой, что обновление не идёт'
        correct: true
        why: 'Семиминутные цифры полезны, а пометка говорит, на что именно смотрит руководитель. Решение он примет, зная цену устаревания.'
      - text: 'Заменить цифры прочерками, пока сервер снова не начнёт отвечать на запросы'
        why: 'Почти верные данные выброшены, хотя они ещё полезны. Руководитель остаётся вообще без цифр.'
      - text: 'Оставить цифры без пометок и продолжать попытки обновить их в фоне'
        why: 'Человек уверен, что видит свежие данные, хотя им семь минут и обновление не работает. Устаревшие данные без пометки обманывают.'
      - text: 'Показать поверх дашборда экран «Сервис недоступен» с кнопкой «Повторить»'
        why: 'Ошибка обновления превращена в ошибку всего экрана, хотя данные для решения на нём есть.'
    explanation: |
      Устаревшие данные часто лучше, чем никакие, — если человек знает, что они устарели. Поэтому их показывают
      с пометкой времени и честным сообщением о проблеме с обновлением. Удобно думать о двух вещах отдельно: есть ли
      данные и насколько они свежие, и что сейчас с запросом. «Старые данные + последнее обновление не удалось» —
      нормальное сочетание, которое интерфейс должен уметь показать. Насколько опасно устаревание, зависит от данных:
      для решения на планёрке семь минут не страшны, а для оплаты цена проверяется на сервере.
    links:
      - https://www.nngroup.com/articles/visibility-system-status/

  - id: sdb-outcomes-005
    topic: Потоки данных и проектирование API
    subtopic: Жизненный цикл данных и исходы в UI
    level: senior
    multiple: true
    question: |
      Фотохостинг. Человек выделил 50 фото и нажал «Удалить». Сервер ответил результатом по каждому фото: 47 удалены,
      а три не удалены, потому что они входят в общий альбом, где у человека нет прав на удаление. Права за время
      работы человека не изменятся. Что должен сделать интерфейс?
    options:
      - text: 'Убрать из сетки 47 фото, которые сервер действительно удалил'
        correct: true
        why: 'Эти фото действительно удалены. Экран показывает то, что получилось, а не делает вид, что не получилось ничего.'
      - text: 'Оставить три фото выделенными и объяснить рядом, почему они не удалены'
        correct: true
        why: 'Человек видит, что именно не удалилось и почему, — это частичный успех, показанный по частям.'
      - text: 'Вернуть в сетку все 50 фото и показать «Удаление не удалось»'
        why: 'Это неправда: 47 фото уже удалены. Человек повторит удаление и снова наткнётся на те же три.'
      - text: 'Повторять удаление трёх фото в фоне, пока сервер не согласится'
        why: 'Причина отказа — права, а они не изменятся. Повтор будет крутиться вечно, нагружать сервер и так и не даст результата.'
    explanation: |
      Частичный успех нельзя сводить ни к успеху, ни к провалу. Выдать его за успех — человек не узнает о том, что
      не получилось. Выдать за провал — он повторит всё целиком и получит дубли или те же отказы. Правильно — показать,
      что получилось, и отдельно то, что нет, с причиной. Для этого контракт API должен отдавать результат по каждой
      части операции. А по причине отказа решают, что предложить: повтор уместен при временном сбое, а при отказе
      из-за прав нужно объяснение.
    links:
      - https://graphql.org/learn/serving-over-http/

  - id: sdb-tradeoffs-001
    topic: Архитектурные решения
    subtopic: Альтернативы и компромиссы
    level: junior
    question: |
      Онлайн-школа записала решение: «Видео уроков храним на стороннем видеохостинге. Так мы запустимся через неделю,
      а не через два месяца. Платим за каждую минуту просмотра и не можем менять плеер. Если хостинг поднимет тарифы,
      расходы на видео вырастут». Чего не хватает в этой записи?
    options:
      - text: 'Условия, при котором команда вернётся к решению'
        correct: true
        why: 'Выигрыш, цена и риск в записи есть. Не сказано, какое наблюдаемое событие заставит пересмотреть выбор, — например, «счёт за видео превысил 100 тысяч рублей в месяц».'
      - text: 'Выигрыша, ради которого выбран видеохостинг'
        why: 'Выигрыш назван: запуск через неделю вместо двух месяцев. Именно это требование вариант выполняет лучше собственного хранения видео.'
      - text: 'Цены, которую школа платит за такой выбор'
        why: 'Цена названа даже дважды: оплата каждой минуты просмотра и невозможность менять плеер.'
      - text: 'Риска, который может сделать такой выбор неудачным'
        why: 'Риск назван: хостинг может поднять тарифы, и расходы на видео вырастут.'
    explanation: |
      У каждого варианта называют четыре вещи: выигрыш (какие требования он выполняет лучше), цену (чем за это платят),
      риск (что может пойти не так) и условие пересмотра. Последнее превращает риск в план: команда заранее
      договаривается, какое событие она заметит и что тогда сделает. Хорошее условие наблюдаемо — «счёт за видео
      превысил заданную сумму», «учеников стало больше 50 тысяч», — а не «когда станет дорого».

  - id: sdb-tradeoffs-002
    topic: Архитектурные решения
    subtopic: Альтернативы и компромиссы
    level: middle
    question: |
      Команда делает дашборд аналитики для сети кофеен. В требованиях первой версии — пять фиксированных отчётов,
      срок — месяц. Разработчик предлагает: «Давайте сразу сделаем конструктор, где пользователь сам выбирает метрики
      и группировки, — потом всё равно попросят». О конструкторе заказчик не говорил. Что предпочтительнее?
    options:
      - text: 'Сделать пять отчётов, а к конструктору вернуться, когда пользователи о нём попросят'
        correct: true
        why: 'Конструктор не закрывает ни одного требования первой версии. Это предполагаемая функция: её постройка, задержка остальной работы и содержание стоят точно, а польза под вопросом.'
      - text: 'Сделать конструктор сразу: переделывать пять отчётов потом дороже, чем сделать один раз'
        why: 'Довод про цену исправления, но он верен, только если конструктор понадобится и именно в таком виде. Цены постройки, задержки и содержания команда платит точно, а нужда в конструкторе — догадка.'
      - text: 'Сделать конструктор, но показывать в нём пользователям только пять готовых отчётов'
        why: 'Это та же предполагаемая функция, просто спрятанная. Команда платит за постройку и содержание конструктора, а пользователи получают те же пять отчётов позже.'
      - text: 'Сделать пять отчётов, но сразу заложить в API произвольные метрики и группировки'
        why: 'Универсальность просто переехала из интерфейса в API. Серверу всё равно придётся строить и поддерживать произвольные выборки, а контракт API потом менять дороже, чем экран.'
    explanation: |
      Принцип YAGNI (You Aren't Gonna Need It — «вам это не понадобится») против кода для функций, которых нет
      в требованиях. Мартин Фаулер называет такой код предполагаемой функцией и перечисляет четыре её цены: постройку,
      задержку полезной работы, содержание лишней сложности и исправление, если будущее окажется другим. По
      исследованиям, на которые он ссылается, лишь около трети выпущенных функций улучшают нужные показатели. YAGNI
      не запрещает делать код удобным для изменения: пять отчётов с понятными границами модулей легко дополнить
      конструктором, когда о нём действительно попросят.
    links:
      - https://martinfowler.com/bliki/Yagni.html

  - id: sdb-tradeoffs-003
    topic: Архитектурные решения
    subtopic: Альтернативы и компромиссы
    level: middle
    question: |
      Два разработчика делают чат врача с пациентом для небольшой клиники, срок — два месяца. Остальной проект написан
      на React с обычным REST API, и команда хорошо его знает. Работы без сети и совместного редактирования в
      требованиях нет. Один из разработчиков предлагает новую библиотеку синхронизации данных, о которой сейчас много
      пишут: она умеет и то и другое «из коробки». Что предпочтительнее?
    options:
      - text: 'Делать чат на привычном REST: новая библиотека закрывает требования, которых нет'
        correct: true
        why: 'Задачу можно решить тем, что у команды уже есть, а ничего в текущих инструментах не делает её слишком дорогой. Новая технология принесёт неизвестные проблемы и не выполнит ни одного дополнительного требования.'
      - text: 'Взять новую библиотеку: она покрывает больше сценариев, а значит, решение надёжнее'
        why: 'Больше возможностей — не то же, что надёжность. У новой технологии больше неизвестных неизвестных, а сценарии, которые она покрывает, в требованиях отсутствуют.'
      - text: 'Взять новую библиотеку только для истории сообщений, а остальное оставить на REST'
        why: 'Жетон на новизну всё равно потрачен, а в проекте появляются два разных способа работать с данными. Ни одного требования такое разделение не закрывает.'
      - text: 'Сначала за неделю сделать прототип на новой библиотеке и выбрать по его итогам'
        why: 'Неделя из восьми уйдёт на проверку варианта, который не нужен ни одному требованию. Второй вопрос Маккинли — что в имеющихся инструментах делает задачу слишком дорогой — уже дал ответ «ничего», и прототип его не изменит.'
    explanation: |
      Дэн Маккинли в эссе «Выбирайте скучные технологии» советует перед новой технологией ответить на два вопроса:
      как решить задачу тем, что уже есть, и что именно делает это слишком дорогим. У проверенной технологии слабые
      места известны заранее, у новой гораздо больше проблем, о которых вы не догадываетесь. Образ «жетонов на
      новизну» напоминает, что новизну стоит тратить там, где без неё требование не выполнить. Если бы клиника
      потребовала работу без связи, сравнение пришлось бы пересчитать.
    links:
      - https://mcfunley.com/choose-boring-technology

  - id: sdb-tradeoffs-004
    topic: Архитектурные решения
    subtopic: Альтернативы и компромиссы
    level: senior
    multiple: true
    question: |
      В сервисе аналитики для интернет-магазинов каждый магазин смотрит свои отчёты, и они строятся прямо в браузере
      из выгрузки его заказов за месяц. Сейчас в выгрузке до 20 000 строк, отчёт строится за полсекунды. Решение
      приняли при двух допущениях: магазины небольшие, и отчёты смотрят только за месяц. Какие условия пересмотра
      стоит записать рядом с решением?
    options:
      - text: 'Выгрузка одного магазина за месяц превысила 100 000 строк или отчёт строится дольше 2 секунд'
        correct: true
        why: 'Условие наблюдаемо и привязано к допущению «магазины небольшие»: если оно перестанет выполняться, это будет видно по цифрам.'
      - text: 'В план продукта попали отчёты за год и сравнение с тем же месяцем прошлого года'
        correct: true
        why: 'Это событие ломает второе допущение — «только за месяц»: выгрузка за год в 12 раз больше. Его видно по плану продукта ещё до того, как отчёты станут медленными.'
      - text: 'Число магазинов в сервисе выросло вдвое по сравнению с моментом принятия решения'
        why: 'Каждый отчёт строится из выгрузки одного магазина в его же браузере. Больше магазинов — не значит тяжелее отчёт, поэтому такое условие сработает впустую.'
      - text: 'Вышла новая популярная библиотека для построения отчётов в браузере'
        why: 'Это повод из моды, а не из требований: появление библиотеки никак не говорит о том, что допущения перестали выполняться.'
      - text: 'Команда почувствует, что решение устарело и стало работать хуже'
        why: 'Наступление такого условия нельзя проверить: никто не скажет, когда именно стало «хуже». Решение будут пересматривать либо никогда, либо на каждом совещании.'
    explanation: |
      Условие пересмотра — наблюдаемое событие, при котором команда возвращается к решению. Хорошее условие привязано
      к допущениям, на которых решение держится: здесь это объём данных одного магазина и период отчёта. Его можно
      проверить по метрике (число строк, время построения) или по плану продукта. Условия, не связанные с допущениями
      (рост числа магазинов, новая библиотека), срабатывают впустую, а расплывчатые («стало хуже») не срабатывают
      вовсе.

  - id: sdb-tradeoffs-006
    topic: Архитектурные решения
    subtopic: Альтернативы и компромиссы
    level: senior
    question: |
      Платформа онлайн-обучения добавляет заметки к урокам. Все уроки открываются только после входа в аккаунт,
      и вход сохраняется на устройстве. 40 % учеников занимаются то с телефона, то с ноутбука, и заметки должны быть
      видны на обоих устройствах. Сеть у учеников обычно быстрая: они занимаются дома или в офисе. Где хранить
      заметки?
    options:
      - text: 'Только на сервере, с первой же заметки, — так у заметок один владелец'
        correct: true
        why: 'Гостей нет: без входа уроки не открываются, поэтому у заметок с самого начала может быть один владелец — сервер. Требование про два устройства выполнено, а слияние не нужно вовсе.'
      - text: 'Сначала на устройстве, потом один раз перенести на сервер — так быстрее отклик'
        why: 'Хранение на устройстве окупалось гостями и медленной сетью. Здесь каждый ученик уже вошёл, а сеть быстрая: этап на устройстве добавляет слияние при переносе, ничего не давая взамен.'
      - text: 'На устройстве и на сервере, с синхронизацией в обе стороны — так надёжнее'
        why: 'У заметок появляются два владельца. Правка на ноутбуке и правка на телефоне столкнутся, и придётся разбирать, какая копия верна.'
      - text: 'Только на устройстве, с выгрузкой в файл — так не нужен API для заметок'
        why: 'Требование «заметки видны на обоих устройствах» превращается в ручной перенос файла, а свежая правка на одном устройстве не появится на другом.'
    explanation: |
      Это контрастная пара к примеру с корзиной из урока. Там хранение на устройстве было оправдано гостями, которые
      собирают корзину без входа, и быстрым откликом на медленной сети. Здесь обоих доводов нет: без входа уроки
      не открываются, а сеть быстрая. Остаётся цена — слияние при переносе — без выигрыша. Поэтому решение проще:
      один владелец, сервер, с первой заметки. Тот же разбор показывает, что вывод нельзя переносить из задачи
      в задачу по памяти: его пересчитывают от требований.

  - id: sdb-risks-006
    topic: Архитектурные решения
    subtopic: Риски, итерации и обоснование
    level: junior
    question: |
      Видеосервис добавляет в плеер кнопку «Пропустить титры». Команда допускает, что зрители её заметят и будут
      нажимать. Если окажется, что нет, кнопку просто перенесут в другое место плеера — это работа на пару часов.
      Чем проверить это допущение?
    options:
      - text: 'Метрикой после запуска: в какой доле просмотров кнопку нажали'
        correct: true
        why: 'Заметят ли кнопку, знают только реальные зрители, а ошибка дешёвая и по основе не бьёт. Значит, достаточно выпустить кнопку и посмотреть на цифру, заранее записав порог.'
      - text: 'Расчётом: сколько запросов в секунду дадут нажатия на кнопку'
        why: 'Расчёт отвечает на вопрос «хватит ли ресурсов». Здесь неизвестно другое — как поведут себя люди, и никакая арифметика этого не покажет.'
      - text: 'Прототипом плеера с кнопкой до начала основной разработки'
        why: 'Прототип отвечает на вопрос «сработает ли технически» и нужен, когда ошибка ударит по основе. Здесь ошибка стоит пары часов, а поведение зрителей прототип на столе разработчика не покажет.'
      - text: 'Нагрузочным тестом сервера, который принимает нажатия'
        why: 'Нагрузочный тест проверяет, выдержит ли сервер. Вопрос же о том, заметят ли кнопку люди, а на это тест не ответит.'
    explanation: |
      Способ проверки выбирают по вопросу и по цене ошибки. Расчёт отвечает, хватит ли запросов, памяти или трафика.
      Прототип — сработает ли решение технически, и его делают до основной работы, когда ошибка ударит по основе.
      Метрика после запуска — как поведут себя люди, и она годится, когда ошибку дёшево исправить потом. Здесь
      вопрос о поведении зрителей, а переделка стоит пары часов, поэтому хватает метрики с заранее записанным порогом.

  - id: sdb-risks-002
    topic: Архитектурные решения
    subtopic: Риски, итерации и обоснование
    level: middle
    question: |
      Команда делает онлайн-редактор документов. Требование: ввод текста отзывается не дольше чем за 100 миллисекунд
      даже в документе на 300 страниц с таблицами. Никто не знает, справится ли с таким документом выбранный способ
      отрисовки, а от него зависит устройство всего редактора. До начала основной разработки две недели. Как поступить?
    options:
      - text: 'За два-три дня собрать прототип с документом на 300 страниц и замерить отклик на слабом ноутбуке'
        correct: true
        why: 'Вопрос технический — «сработает ли», — и ошибка в нём заставит переделывать основу. Прототип с заранее известным критерием (100 мс) отвечает на него за дни, до основной работы.'
      - text: 'Выпустить редактор и по метрикам смотреть, как часто пользователи жалуются на большие документы'
        why: 'Метрика после запуска придёт, когда поверх способа отрисовки уже построен весь редактор. Если он не справляется, переделывать придётся почти всё.'
      - text: 'Сразу строить редактор с отрисовкой только видимых страниц, чтобы большие документы точно работали'
        why: 'Это сложность до того, как известно, нужна ли она. Неизвестно и то, решит ли она проблему: замедлять ввод может не число страниц, а что-то другое.'
      - text: 'Посчитать на бумаге, сколько памяти займёт документ на 300 страниц, и решить по расчёту'
        why: 'Расчёт отвечает на вопрос «хватит ли ресурсов», а здесь нужно знать, как быстро отзывается ввод при выбранной отрисовке. Это можно только замерить.'
    explanation: |
      Способ проверки выбирают по вопросу. Расчёт на бумаге отвечает, хватит ли запросов, памяти или трафика.
      Прототип — сработает ли решение технически. Метрика после запуска — как поведут себя люди и реальные данные.
      Здесь вопрос технический, и ошибка затронет основу, поэтому нужен прототип до основной разработки: с одним
      вопросом, критерием успеха (100 мс на слабом ноутбуке) и сроком в несколько дней. В экстремальном
      программировании такой опыт называют spike: простую программу, которая проверяет одно решение, обычно выбрасывают.
    links:
      - https://en.wikipedia.org/wiki/Spike_(software_development)

  - id: sdb-risks-003
    topic: Архитектурные решения
    subtopic: Риски, итерации и обоснование
    level: senior
    question: |
      Сервис карт добавляет слой «пробки», который обновляется раз в минуту опросом сервера. Продукт хочет со временем
      обновлять его каждые 5 секунд через постоянное соединение — это месяц работы бэкенда и фронтенда. Окупится ли
      этот месяц, зависит от того, будут ли люди держать слой включённым во время поездки, а таких данных пока нет.
      Как поступить?
    options:
      - text: 'Выпустить слой с опросом, заранее записав порог: от 30 % поездок со слоем — делать соединение'
        correct: true
        why: 'Ответ знают только реальные люди, поэтому нужна метрика после запуска. Порог записан до сбора данных, и решение о соединении примут по сигналу, а не по настроению.'
      - text: 'Выпустить слой с опросом, а порог перехода к соединению выбрать позже, когда данные соберутся'
        why: 'Метрика выбрана верно, но без заранее записанного порога любой результат можно истолковать как угодно. Решение будет зависеть от того, кто громче спорит.'
      - text: 'Сначала за неделю сделать прототип постоянного соединения и проверить, выдержит ли его сервер'
        why: 'Прототип отвечает на технический вопрос, а неизвестно другое — как поведут себя люди. Даже удачный прототип не скажет, окупится ли месяц работы.'
      - text: 'Сразу делать постоянное соединение: карта — продукт реального времени, опрос всё равно выбросят'
        why: 'Это месяц работы ради сценария, востребованность которого неизвестна. Опрос раз в минуту уже выполняет требование, а усложнять стоит по сигналу.'
    explanation: |
      Эволюционное проектирование начинается с простого решения, которое выполняет сегодняшние требования, и усложняет его
      по сигналу — когда метрика перешла порог или в план попало новое требование. Если ответ зависит от поведения
      людей, его даёт метрика после запуска. Порог записывают заранее, иначе любой результат кажется «в целом
      нормальным». Переход дешёв, если слой получает данные через модуль, который скрывает, как именно они приходят:
      опросом или по соединению.
    links:
      - https://martinfowler.com/bliki/SacrificialArchitecture.html

  - id: sdb-risks-004
    topic: Архитектурные решения
    subtopic: Риски, итерации и обоснование
    level: middle
    multiple: true
    question: |
      В плане развития онлайн-редактора документов — совместное редактирование, мобильная версия и документы больше
      100 страниц. Команда пишет обоснование архитектуры. Какие правила стоит записать в нём как инварианты?
    options:
      - text: 'Текст, который сервер подтвердил как сохранённый, не теряется при сбое сети'
        correct: true
        why: 'Это правило должно выполняться при любом развитии: и при совместном редактировании, и в мобильной версии.'
      - text: 'Человек с правом только на чтение не может изменить документ'
        correct: true
        why: 'Права доступа не зависят ни от числа редакторов, ни от устройства. Ни одно ожидаемое изменение не должно их нарушить.'
      - text: 'Документ одновременно редактирует только один человек, остальные читают'
        why: 'Это текущее ограничение, и совместное редактирование уже стоит в плане. Записанное как инвариант, оно расползётся по коду, и снять его станет дорого.'
      - text: 'Документ не может быть длиннее 100 страниц'
        why: 'Большие документы есть в плане развития, значит, это граница первой версии, а не правило, которое нельзя нарушать.'
      - text: 'Редактор открывается только в браузере на компьютере, а не на телефоне'
        why: 'Мобильная версия запланирована. Это ограничение текущей версии, а не инвариант.'
    explanation: |
      Инвариант — правило, которое должно выполняться всегда, как бы ни развивалась система: сохранённое не теряется,
      права доступа соблюдаются. Текущее ограничение — решение о границах версии, которое продукт может захотеть
      изменить. Проверка простая: если изменение уже в плане или продукт может его захотеть, это не инвариант. Путать их
      опасно: ограничение, записанное как инвариант, зашивают во многие места кода.
    links:
      - https://adr.github.io/

  - id: sdb-risks-005
    topic: Архитектурные решения
    subtopic: Риски, итерации и обоснование
    level: senior
    question: |
      В видеосервисе прогресс просмотра отправляется на сервер раз в 30 секунд и при паузе. В репозитории есть запись
      решения ADR 4 со статусом «принято»: при отправке каждые 5 секунд сервер не выдерживал вечерний пик, а при сбое
      приложения теряется до 30 секунд прогресса. Теперь продукт запускает платные курсы: сертификат выдают только
      за полностью просмотренные лекции, и потеря 30 секунд стала проблемой. Как поступить?
    options:
      - text: 'Записать ADR 12: для платных лекций слать прогресс ещё и при завершении; ADR 4 пометить «заменено»'
        correct: true
        why: 'Отправка при завершении лекции закрывает новое требование и почти не добавляет нагрузки — причина прежнего выбора учтена. Новая запись объясняет, что изменилось, а старая остаётся в истории.'
      - text: 'Вернуть отправку каждые 5 секунд для всех роликов, а ADR 4 удалить, раз решение больше не действует'
        why: 'Это слепая отмена: в записи сказано, что при 5 секундах сервер не выдерживал пик. Удаление записи к тому же стирает историю — никто не узнает, почему частоту однажды уменьшили.'
      - text: 'Оставить отправку раз в 30 секунд: решение принято и записано в ADR 4, поэтому менять его нельзя'
        why: 'Это слепое принятие. Запись объясняет, почему решение было верным в прежнем контексте, а не запрещает его менять, когда контекст изменился.'
      - text: 'Для платных лекций слать прогресс ещё и при завершении и дописать это в текст ADR 4'
        why: 'Техническое решение разумное, но запись испорчена: будет непонятно, что решение было другим и почему его сменили. Отменённое решение не правят, а пишут новую запись и помечают старую «заменено».'
    explanation: |
      Запись архитектурного решения (ADR) по Майклу Нигарду хранит контекст, решение, статус и последствия. Она нужна,
      чтобы решение не принимали слепо и не отменяли слепо. Когда контекст меняется, пишут новую запись с новым
      контекстом, а старую помечают «заменено» со ссылкой на новую: важно, что когда-то решение было таким. Записи
      нумеруют по порядку и номера не переиспользуют.
    links:
      - https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions
