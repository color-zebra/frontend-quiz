questions:
  - id: network-performance-001
    level: junior
    tags: [core-web-vitals, lcp, inp, cls, theory]
    question: |
      Какие из утверждений о составе Core Web Vitals верны?
    options:
      - text: 'LCP входит в Core Web Vitals и отвечает за скорость загрузки'
        correct: true
        why: 'Largest Contentful Paint — время до отрисовки самого крупного видимого элемента: картинки, видео-постера или блока текста.'
      - text: 'INP входит в Core Web Vitals и отвечает за отзывчивость'
        correct: true
        why: 'Interaction to Next Paint — время от клика, касания или нажатия клавиши до кадра, в котором видна реакция. Браузер замеряет все такие действия за визит и берёт одно из самых медленных.'
      - text: 'CLS входит в Core Web Vitals и отвечает за стабильность вёрстки'
        correct: true
        why: 'Cumulative Layout Shift оценивает самую большую серию неожиданных сдвигов за визит: например, текст уехал вниз, потому что сверху догрузилась картинка или реклама.'
      - text: 'TTFB входит в Core Web Vitals и отвечает за скорость ответа сервера'
        why: 'TTFB (время до первого байта ответа) — вспомогательная, диагностическая метрика. Она влияет на LCP, но в тройку Core Web Vitals не входит.'
      - text: 'FID входит в Core Web Vitals и отвечает за отклик на первый клик'
        why: 'FID в марте 2024 года заменили на INP. FID учитывал только задержку перед обработкой первого взаимодействия.'
    explanation: |
      Core Web Vitals — три метрики, которыми Google оценивает пользовательский опыт:
      - LCP — загрузка: когда показалось основное содержимое;
      - INP — отзывчивость: как быстро страница реагирует на действия;
      - CLS — визуальная стабильность: не прыгает ли вёрстка.

      Они учитываются в поиске и показываются в Search Console и PageSpeed Insights. Рядом есть вспомогательные
      метрики — TTFB, FCP, TBT, Speed Index. В тройку они не входят, но помогают понять, почему основная метрика
      плохая: например, высокий TTFB почти всегда тянет за собой плохой LCP.
    links:
      - https://web.dev/articles/vitals
    source: own

  - id: network-performance-002
    level: junior
    tags: [core-web-vitals, thresholds, theory]
    question: |
      Какие значения Core Web Vitals считаются «хорошими»?
    options:
      - text: 'LCP до 2,5 с, INP до 200 мс, CLS до 0,1'
        correct: true
        why: 'Это официальные пороги «хорошо». Оценка идёт по 75-му перцентилю реальных визитов, отдельно для мобильных и десктопов.'
      - text: 'LCP до 1 с, INP до 100 мс, CLS до 0,25'
        why: 'Пороги для LCP и INP здесь строже официальных, а 0,25 для CLS — это уже граница «плохо».'
      - text: 'LCP до 4 с, INP до 500 мс, CLS до 0,25'
        why: 'Это границы «плохо». Значения между ними и «хорошо» считаются «требующими улучшения».'
      - text: 'LCP до 2,5 с, INP до 50 мс, CLS до 1'
        why: '50 мс — это порог «долгой задачи» в основном потоке, а не INP. И CLS до 1 — очень сильные сдвиги, «хорошо» — до 0,1.'
    explanation: |
      У каждой метрики три зоны: «хорошо», «нужно улучшить» и «плохо».
      - LCP: до 2,5 с хорошо, больше 4 с плохо.
      - INP: до 200 мс хорошо, больше 500 мс плохо.
      - CLS: до 0,1 хорошо, больше 0,25 плохо.

      Страница проходит оценку, если все три метрики «хорошие» на 75-м перцентиле визитов: у трёх из четырёх
      пользователей опыт не хуже порога. Перцентиль выбран вместо среднего, чтобы цель выполнялась для большинства
      визитов, а единичные выбросы не искажали оценку.
    links:
      - https://web.dev/articles/vitals#core-web-vitals
      - https://web.dev/articles/defining-core-web-vitals-thresholds
    source: own

  - id: network-performance-003
    level: middle
    tags: [inp, fid, theory]
    question: |
      Почему в марте 2024 года INP заменил FID в Core Web Vitals?
    options:
      - text: 'FID видел только задержку первого клика, а INP видит отклик на все действия'
        correct: true
        why: 'FID мерил лишь ожидание перед запуском обработчика первого клика. INP смотрит на все взаимодействия за визит и включает и работу обработчиков, и время до следующей отрисовки.'
      - text: 'FID учитывал прокрутку и наведение мыши, из-за чего давал шумные данные'
        why: 'Ни FID, ни INP не учитывают прокрутку и наведение: только клики, касания и нажатия клавиш.'
      - text: 'INP измеряет время до первой отрисовки после загрузки, а FID этого не умел'
        why: 'Время до первой отрисовки — это FCP. INP измеряет отклик на действия пользователя, а не загрузку.'
      - text: 'FID требовал отдельной библиотеки, а INP умеет измерять Lighthouse'
        why: 'Lighthouse в обычном режиме вообще не измеряет INP: реальных взаимодействий в лабораторном замере нет, вместо этого он показывает TBT.'
    explanation: |
      FID отвечал на узкий вопрос: сколько ждал браузер, прежде чем начать обрабатывать первое действие
      пользователя. Медленный обработчик, долгая перерисовка и все последующие клики в него не попадали, поэтому
      почти все сайты получали хороший FID при реально тормозящем интерфейсе. INP складывается из трёх частей —
      задержки до обработчика, времени работы обработчиков и времени до отрисовки следующего кадра — и берёт одно из
      худших взаимодействий за визит. Поэтому он гораздо честнее отражает, как страница ощущается.
    links:
      - https://web.dev/articles/inp
      - https://web.dev/blog/inp-cwv-march-12
    source: own

  - id: network-performance-004
    level: middle
    tags: [lcp, inp, cls, optimization, theory]
    question: |
      Все приёмы ниже полезны для производительности. В каких парах метрика, которую приём улучшает, указана
      верно?
    options:
      - text: 'Задать `aspect-ratio` блоку под встраиваемое видео — CLS'
        correct: true
        why: 'Место под видео резервируется сразу, и когда плеер загрузится, текст ниже не сдвинется.'
      - text: 'Отложить тяжёлую часть обработчика через `scheduler.yield()` — INP'
        correct: true
        why: 'Обработчик быстро делает видимую реакцию и отдаёт поток браузеру, поэтому следующий кадр рисуется раньше.'
      - text: 'Отдавать HTML из кэша CDN, ближе к пользователю — LCP'
        correct: true
        why: 'Быстрый ответ сервера сокращает TTFB, а TTFB — первая часть LCP: пока не пришёл HTML, браузер ничего не может отрисовать.'
      - text: 'Вынести тяжёлые вычисления из обработчиков в Web Worker — CLS'
        why: 'Worker разгружает основной поток и улучшает INP и TBT, а на сдвиги вёрстки не влияет.'
      - text: 'Задать веб-шрифту `font-display: swap` в правиле `@font-face` — INP'
        why: 'Это ускоряет первое появление текста (FCP, LCP) и может даже давать сдвиги при подмене шрифта, но к отклику на клики отношения не имеет.'
    explanation: |
      Полезных приёмов много, и важно понимать, какую метрику каждый двигает:
      - LCP — всё, что быстрее доставляет и рисует главное содержимое: сервер, CDN, приоритет главной картинки,
        меньше блокирующих ресурсов;
      - INP — всё, что разгружает основной поток во время взаимодействий: короткие обработчики, отложенная работа,
        Web Worker, меньше JavaScript;
      - CLS — всё, что заранее резервирует место и не двигает показанное: размеры картинок и видео,
        `aspect-ratio`, место под рекламу, аккуратная подмена шрифтов.
    links:
      - https://web.dev/articles/optimize-lcp
      - https://web.dev/articles/optimize-inp
      - https://web.dev/articles/optimize-cls
    source: own

  - id: network-performance-005
    level: senior
    tags: [field-data, lab-data, lighthouse, crux, theory]
    question: |
      Lighthouse показывает отличные цифры, а Search Console помечает страницу как медленную по INP. Почему так
      бывает?
    options:
      - text: 'Lighthouse не видит реальных кликов, а Search Console берёт данные людей'
        correct: true
        why: 'Lighthouse загружает страницу в контролируемых условиях и никуда не кликает, поэтому INP не измеряет. Search Console берёт полевые данные CrUX: реальные устройства, сети и взаимодействия за последние 28 дней, 75-й перцентиль.'
      - text: 'Search Console учитывает только десктопы, а Lighthouse — мобильные устройства'
        why: 'Search Console показывает мобильные и десктопы отдельными отчётами. Расхождение не в типе устройств, а в источнике данных.'
      - text: 'Lighthouse по умолчанию тестирует на быстром десктопе без замедления'
        why: 'Наоборот: по умолчанию Lighthouse эмулирует средний телефон с медленной сетью и замедленным процессором. Но INP он всё равно не измеряет — кликов нет.'
      - text: 'Полевые данные учитывают только первый визит каждого пользователя'
        why: 'Учитываются все визиты пользователей, которые разрешили отправку статистики в Chrome, без ограничения первым посещением.'
    explanation: |
      Лабораторные данные (Lighthouse, вкладка Performance) — один замер в заданных условиях. Они удобны для
      отладки и сравнения до и после правки, но не знают, на каких устройствах и сетях сидят ваши пользователи и
      что они делают на странице. Полевые данные (CrUX, Search Console, PageSpeed Insights, собственный сбор через
      библиотеку `web-vitals`) собираются с реальных визитов. Оценку Core Web Vitals ставят именно по полю. Для INP
      разница особенно велика: в лаборатории его заменяет TBT, а настоящие проблемы видны только по реальным кликам.
    links:
      - https://web.dev/articles/lab-and-field-data-differences
      - https://developer.chrome.com/docs/crux
    source: own

  - id: network-performance-006
    level: junior
    tags: [lcp, theory]
    question: |
      Что измеряет LCP (Largest Contentful Paint)?
    options:
      - text: 'Время до отрисовки самого крупного видимого элемента первого экрана'
        correct: true
        why: 'Отсчёт идёт от начала перехода на страницу до момента, когда нарисован самый большой элемент в видимой области: обычно главная картинка, баннер или крупный блок текста.'
      - text: 'Время до отрисовки самого первого элемента на странице, любого'
        why: 'Это FCP — первая отрисовка любого контента. Она может случиться рано, когда главного содержимого ещё нет.'
      - text: 'Время до полной загрузки всех картинок, стилей и скриптов страницы'
        why: 'Это ближе к событию `load`. LCP не ждёт загрузки всего: ему важен момент, когда показано главное.'
      - text: 'Время, за которое по сети скачивается самый большой файл страницы'
        why: 'LCP измеряет отрисовку на экране, а не загрузку файлов. Самый тяжёлый файл может вообще не быть видимым элементом.'
    explanation: |
      **Что это.** LCP — время от начала перехода на страницу до момента, когда отрисован самый крупный видимый
      элемент первого экрана: главная картинка, баннер, видео-постер или крупный блок текста. Пока страница
      грузится, «самый крупный» может меняться, итогом считается последний кандидат до первого действия
      пользователя. Хорошо — до 2,5 секунды, плохо — больше 4 секунд.

      **Зачем.** LCP отвечает на вопрос пользователя «страница уже загрузилась?» — основное содержимое на экране.
      Первая отрисовка (FCP) может быть быстрой, а смотреть всё ещё не на что.

      **На что влияет.** Это одна из трёх метрик Core Web Vitals: её учитывает Google в поиске, по ней сайт
      оценивают в Search Console. От неё напрямую зависит, сколько людей уйдёт, не дождавшись страницы.

      **Как улучшить.** LCP складывается из ответа сервера (TTFB), задержки до начала загрузки главного ресурса,
      самой загрузки и задержки отрисовки. Поэтому:
      - ускорить ответ сервера и раздавать страницу через CDN;
      - указать главную картинку прямо в HTML, а не подгружать её скриптом или поздно найденным CSS-фоном;
      - не ставить ей `loading="lazy"`, а поднять приоритет через `fetchpriority="high"` или `<link rel="preload">`;
      - сжимать картинки и отдавать нужный размер через `srcset`;
      - убрать блокирующие CSS и скрипты;
      - рендерить страницу на сервере, а не только в браузере.
    links:
      - https://web.dev/articles/lcp
      - https://web.dev/articles/optimize-lcp
    source: own

  - id: network-performance-007
    level: middle
    tags: [lcp, lcp-element, theory]
    question: |
      Какие элементы браузер может выбрать LCP-элементом?
    options:
      - text: '`<img>` с главной фотографией страницы'
        correct: true
        why: 'Картинки (`<img>` и `<image>` внутри SVG) — самые частые LCP-элементы.'
      - text: 'Блок с фоном через `background-image: url(...)`'
        correct: true
        why: 'Фоновая картинка, подключённая через `url()`, учитывается. Но браузер находит её поздно, только после загрузки CSS, и это часто ухудшает LCP.'
      - text: 'Крупный заголовок или абзац с текстом'
        correct: true
        why: 'Блочные элементы с текстом участвуют наравне с картинками. На страницах без большой картинки LCP-элементом часто становится заголовок.'
      - text: '`<video>` по постеру или первому кадру'
        correct: true
        why: 'Для видео учитывается постер или первый кадр — что появится раньше.'
      - text: 'Элемент с `opacity: 0`, который так и не становится видимым'
        why: 'Невидимые элементы не учитываются. Если такой элемент позже проявится, он станет кандидатом в момент появления, а не загрузки.'
      - text: 'Блок с фоном через `linear-gradient(...)`'
        why: 'CSS-градиенты не считаются содержимым, учитываются только фоновые картинки через `url()`.'
    explanation: |
      LCP-элементом может стать:
      - картинка — `<img>` или `<image>` внутри SVG;
      - видео — по постеру или первому кадру;
      - блок с фоновой картинкой через `url()`;
      - блочный элемент с текстом.

      Chrome отбрасывает то, что явно не контент: невидимые элементы, растянутые на весь экран как фон, размытые
      заглушки с малым количеством деталей. Кандидатом считается только то, что уже отрисовано и видно. После
      первого действия пользователя (клик, прокрутка, нажатие клавиши) новые кандидаты не учитываются. Узнать, какой
      элемент стал LCP, можно во вкладке Performance в DevTools или через библиотеку `web-vitals`.
    links:
      - https://web.dev/articles/lcp#what-elements-are-considered
    source: own

  - id: network-performance-008
    level: middle
    tags: [inp, theory]
    question: |
      Что измеряет INP (Interaction to Next Paint)?
    options:
      - text: 'Сколько проходит от действия пользователя до кадра с видимой реакцией'
        correct: true
        why: 'Пользователь кликнул, коснулся экрана или нажал клавишу — INP мерит время до того, как браузер нарисует следующий кадр, то есть до видимого ответа на это действие.'
      - text: 'Сколько проходит от клика до ответа сервера на запрос из обработчика'
        why: 'INP не ждёт сети: он заканчивается на первом кадре после действия, даже если в этом кадре только спиннер, а данные придут позже.'
      - text: 'Сколько суммарно основной поток был заблокирован, пока страница загружалась'
        why: 'Это TBT — лабораторная метрика загрузки. Она связана с INP, но не измеряет реакцию на реальные действия.'
      - text: 'Как быстро страница становится полностью интерактивной после загрузки'
        why: 'Это TTI, устаревшая метрика: как отдельный показатель её убрали из Lighthouse 10. INP же следит за всеми взаимодействиями на протяжении визита.'
    explanation: |
      **Что это.** Сначала два понятия. Браузер обновляет картинку на экране кадрами — обычно 60 раз в секунду. И
      ваш JavaScript, и расчёт стилей, и рисование кадра выполняются в одном основном потоке по очереди: пока
      работает скрипт, новый кадр нарисовать нельзя.

      INP показывает, насколько быстро страница реагирует на действия. Пользователь кликнул по кнопке, коснулся
      экрана или нажал клавишу — INP мерит время от этого момента до следующего кадра, в котором видна реакция:
      открылось меню, поставилась галочка, появилась напечатанная буква. Отсчёт заканчивается на первом кадре с
      реакцией, а не когда завершится вся работа: если клик отправляет запрос, достаточно сразу показать спиннер.
      Браузер замеряет все взаимодействия за визит и берёт одно из самых медленных — на каждые 50 взаимодействий
      одно худшее отбрасывается как случайность. Прокрутка, наведение и масштабирование не считаются. Хорошо — до
      200 мс, плохо — больше 500 мс.

      **Зачем.** Если после клика 300–500 мс ничего не меняется, интерфейс кажется зависшим: человек кликает снова,
      буквы при вводе появляются с запозданием. Метрики загрузки этого не видят, а INP ловит такие проблемы на
      реальных устройствах.

      **На что влияет.** С марта 2024 года INP — одна из трёх метрик Core Web Vitals вместо FID, его учитывает
      Google в поиске.

      **Как улучшить.** Почти всегда причина в занятом основном потоке. Поэтому:
      - в обработчике сначала показать реакцию, а тяжёлую работу отложить (`setTimeout`, `scheduler.yield()`);
      - дробить долгие задачи на части короче 50 мс;
      - выносить тяжёлые вычисления в Web Worker — отдельный поток;
      - уменьшать объём JavaScript и сторонних скриптов;
      - не перерисовывать огромные деревья компонентов: в React помогают `memo`, `startTransition` или
        `useTransition` (пометить тяжёлый рендер как несрочный) и виртуализация длинных списков;
      - держать DOM небольшим, чтобы отрисовка кадра была быстрой.
    links:
      - https://web.dev/articles/inp
      - https://web.dev/articles/optimize-inp
    source: own

  - id: network-performance-009
    level: senior
    tags: [inp, input-delay, processing, presentation-delay, theory]
    question: |
      Задержка одного взаимодействия, из которой считается INP, складывается из трёх частей. Из каких?
    options:
      - text: 'Ожидание до обработчиков, их работа и время до отрисовки кадра'
        correct: true
        why: 'Это задержка ввода (input delay), время обработки (processing duration) и задержка отображения (presentation delay). По тому, какая часть больше, понятно, что именно чинить.'
      - text: 'DNS-запрос, загрузка скрипта обработчика и его выполнение'
        why: 'Сетевые этапы к INP не относятся: обработчики уже загружены, а задержка возникает в основном потоке браузера.'
      - text: 'Задержка первого клика, время до интерактивности и время отрисовки'
        why: 'Это смесь устаревших метрик FID и TTI. INP разбивается на ожидание, обработку и отрисовку одного конкретного взаимодействия.'
      - text: 'Время рендера React, время коммита и время работы `useEffect`'
        why: 'Это этапы одной библиотеки, а не то, как браузер делит взаимодействие. Всё, что React делает синхронно в ответ на клик (рендер, коммит, а после дискретных событий даже `useEffect`), попадает во время обработки. Разбиение INP одинаково для любого кода.'
    explanation: |
      Каждое взаимодействие проходит три этапа:
      - **задержка ввода** — событие ждёт, потому что основной поток занят чем-то другим, например долгим скриптом
        загрузки или чужим таймером;
      - **время обработки** — работа всех обработчиков события, включая синхронный рендер фреймворка и
        принудительные пересчёты раскладки, когда код чередует чтение и запись размеров;
      - **задержка отображения** — пересчёт стилей, раскладка и отрисовка после обработчиков; она растёт при
        огромном DOM.

      Первую часть лечат разгрузкой потока в целом, вторую — облегчением обработчиков и отложенной работой, третью —
      уменьшением DOM и объёма перерисовки.
    links:
      - https://web.dev/articles/inp#whats_in_an_interaction
      - https://web.dev/articles/optimize-inp
    source: own

  - id: network-performance-010
    level: junior
    tags: [cls, theory]
    question: |
      Что измеряет CLS (Cumulative Layout Shift)?
    options:
      - text: 'Насколько сильно видимые элементы неожиданно сдвигаются на странице'
        correct: true
        why: 'Текст уехал вниз, потому что сверху догрузилась картинка, или кнопка сместилась прямо под пальцем — именно такие сдвиги и оценивает CLS.'
      - text: 'Сколько раз браузер пересчитывал раскладку страницы при загрузке'
        why: 'Число перерасчётов раскладки (reflow) на CLS не влияет: важны только видимые сдвиги уже показанных элементов.'
      - text: 'Насколько далеко смещается содержимое при прокрутке пользователем'
        why: 'Прокрутка — ожидаемое движение, сдвигом она не считается.'
      - text: 'Сколько элементов меняют размер, когда пользователь меняет ширину окна'
        why: 'Изменение размеров при ресайзе — реакция на действие пользователя. CLS оценивает неожиданные сдвиги.'
    explanation: |
      **Что это.** CLS оценивает визуальную стабильность — насколько неожиданно двигаются уже показанные элементы.
      Каждый сдвиг получает оценку: какая доля экрана задета, умноженная на то, как далеко элемент уехал. Сдвиги,
      идущие друг за другом с паузами меньше секунды, объединяются в серию длиной до пяти секунд, и CLS — оценка
      самой большой такой серии за визит. Хорошо — до 0,1, плохо — больше 0,25.

      **Зачем.** Сдвиги раздражают и приводят к ошибкам: человек начал читать — текст уехал; хотел нажать «Отмена»
      — под палец сдвинулась кнопка «Купить».

      **На что влияет.** Это одна из трёх метрик Core Web Vitals, её учитывает Google в поиске.

      **Как улучшить.**
      - Задавать размеры картинкам и видео: `width` и `height` или `aspect-ratio`.
      - Заранее резервировать место под рекламу, встраиваемые виджеты и баннеры.
      - Не вставлять содержимое над уже показанным, кроме как в ответ на действие пользователя.
      - Подбирать запасной шрифт с такими же размерами букв или подгонять его через `size-adjust` и
        `ascent-override` в `@font-face`, чтобы при подмене веб-шрифта не менялась высота строк.
      - Анимировать через `transform`, а не через `top`, `left`, `width`.
    links:
      - https://web.dev/articles/cls
      - https://web.dev/articles/optimize-cls
    source: own

  - id: network-performance-011
    level: senior
    tags: [cls, layout-shift, theory]
    question: |
      Какие из этих сдвигов НЕ попадут в CLS?
    options:
      - text: 'Сдвиг в течение 500 мс после клика пользователя'
        correct: true
        why: 'Сдвиг сразу после действия считается ожидаемым: пользователь раскрыл блок и ждёт, что контент подвинется.'
      - text: 'Движение элемента через анимацию `transform`'
        correct: true
        why: '`transform` смещает элемент без перерасчёта раскладки, и сдвигом вёрстки это не считается.'
      - text: 'Появление нового элемента в конце страницы, не сдвигающее соседей'
        correct: true
        why: 'Сдвиг — это изменение позиции уже показанного элемента. Новый элемент, никого не подвинувший, сдвига не создаёт.'
      - text: 'Сдвиг из-за картинки без размеров, догрузившейся над текстом'
        why: 'Это классический источник CLS: картинка заняла место, и весь текст ниже уехал вниз.'
      - text: 'Сдвиг из-за смены веб-шрифта, изменившего высоту строк'
        why: 'Если новый шрифт выше или шире запасного, строки перестраиваются, и элементы ниже сдвигаются — это засчитывается.'
    explanation: |
      В CLS идут только неожиданные изменения позиции уже видимых элементов. Не считаются:
      - сдвиги в пределах 500 мс после клика, касания или нажатия клавиши;
      - анимации через `transform`;
      - новые элементы, если они никого не сдвинули;
      - изменения за пределами видимой области.

      Прокрутка и жесты масштабирования не дают права на сдвиги — сдвиг во время прокрутки засчитывается. При
      возврате на страницу из кэша навигации (bfcache) CLS начинается с нуля.
    links:
      - https://web.dev/articles/cls#expected-unexpected-layout-shifts
    source: own

  - id: network-performance-012
    level: junior
    tags: [ttfb, theory]
    question: |
      Что измеряет TTFB (Time to First Byte)?
    options:
      - text: 'Время от начала перехода до прихода первого байта ответа сервера'
        correct: true
        why: 'В TTFB входят редиректы, запуск Service Worker, DNS, установка соединения и TLS, отправка запроса и ожидание, пока сервер начнёт отвечать.'
      - text: 'Только время, за которое сервер выполняет код обработчика запроса'
        why: 'Работа сервера — лишь часть TTFB. В него входят и сетевые этапы: DNS, соединение, TLS, редиректы.'
      - text: 'Время от первого байта ответа до полной загрузки HTML-документа'
        why: 'Отсчёт TTFB заканчивается как раз на первом байте. Скачивание остального документа в него не входит.'
      - text: 'Время до появления на экране первого текста или картинки'
        why: 'Это FCP. Он идёт после TTFB: сначала должен прийти ответ, потом браузер что-то нарисует.'
    explanation: |
      **Что это.** TTFB — время от начала перехода на страницу до прихода первого байта ответа на запрос HTML. В него
      входят:
      - редиректы;
      - запуск Service Worker, если он есть;
      - DNS-запрос, установка соединения и TLS;
      - отправка запроса и ожидание, пока сервер начнёт отвечать.

      Хорошо — до 0,8 секунды, плохо — больше 1,8 секунды.

      **Зачем.** Пока не пришёл первый байт, браузер не может ничего: ни разобрать HTML, ни найти стили и картинки.
      TTFB показывает, сколько времени уходит на сеть и сервер до начала всего остального.

      **На что влияет.** TTFB не входит в Core Web Vitals, но лежит в основе FCP и LCP: каждая лишняя миллисекунда
      ответа сервера прибавляется к ним напрямую.

      **Как улучшить.**
      - Раздавать страницы через CDN и кэшировать HTML там, где это возможно.
      - Убирать лишние редиректы.
      - Ускорять сервер: кэш данных, быстрые запросы к базе, меньше работы до начала ответа.
      - Отдавать HTML потоком (streaming), чтобы начало страницы ушло сразу.
      - Использовать HTTP/2 и HTTP/3.
      - Пока сервер готовит страницу, отправить `103 Early Hints`, чтобы браузер начал грузить стили и шрифты. TTFB
        тогда считается по этому промежуточному ответу.
    links:
      - https://web.dev/articles/ttfb
      - https://web.dev/articles/optimize-ttfb
    source: own

  - id: network-performance-013
    level: junior
    tags: [fcp, lcp, theory]
    question: |
      Что измеряет FCP (First Contentful Paint) и чем он отличается от LCP?
    options:
      - text: 'Время до отрисовки первого контента, а LCP — до самого крупного элемента'
        correct: true
        why: 'FCP фиксирует момент, когда на экране появилось хоть что-то: текст, картинка, SVG. LCP ждёт главное содержимое, поэтому обычно наступает позже.'
      - text: 'Время до первой отрисовки фона, а LCP — до появления самого первого текста'
        why: 'Белый фон контентом не считается, а текст может оказаться и первым, и самым крупным элементом.'
      - text: 'Время до первой отрисовки после `DOMContentLoaded`, а LCP — после `load`'
        why: 'Обе метрики не привязаны к событиям документа: FCP может наступить раньше `DOMContentLoaded`, а LCP — раньше `load`.'
      - text: 'То же самое, что LCP, только измеренное в лабораторных условиях'
        why: 'Обе метрики измеряются и в поле, и в лаборатории. Разница в том, какой момент они фиксируют.'
    explanation: |
      **Что это.** FCP — время от начала перехода до момента, когда на экране отрисован первый контент: текст,
      картинка (в том числе фоновая), SVG или `<canvas>`, на котором нарисовано что-то кроме белого. Хорошо — до
      1,8 секунды, плохо — больше 3 секунд.

      **Зачем.** Это первый сигнал пользователю, что страница грузится, а не зависла: белый экран сменился хоть
      каким-то содержимым. При долгом FCP люди уходят ещё до того, как увидят что-то полезное.

      **На что влияет.** FCP не входит в Core Web Vitals, но учитывается в оценке Lighthouse и подсказывает, где
      искать причину плохого LCP: если медленный уже FCP, проблема в сервере или блокирующих ресурсах.

      **Как улучшить.**
      - Ускорить ответ сервера (TTFB).
      - Убрать ресурсы, блокирующие отрисовку: встроить критический CSS прямо в HTML, загружать скрипты с `defer`
        или `async`.
      - Задать шрифтам `font-display: swap`, чтобы текст сразу показывался запасным шрифтом.
      - Рендерить HTML на сервере.
    links:
      - https://web.dev/articles/fcp
    source: own

  - id: network-performance-014
    level: middle
    tags: [tbt, long-tasks, theory]
    question: |
      Что измеряет TBT (Total Blocking Time)?
    options:
      - text: 'Сумму частей долгих задач сверх 50 мс после первой отрисовки'
        correct: true
        why: 'Долгая задача — работа основного потока дольше 50 мс. Блокирующей считается её часть сверх 50 мс: задача в 250 мс добавляет к TBT 200 мс.'
      - text: 'Общее время работы всех скриптов дольше 50 мс во время загрузки'
        why: 'От долгой задачи берётся только часть сверх 50 мс, а не вся её длительность: задача в 250 мс добавит 200 мс, а не 250.'
      - text: 'Время, которое пользователь ждал ответа на самый медленный клик'
        why: 'Это ближе к INP. TBT считается без участия пользователя, по задачам во время загрузки.'
      - text: 'Время, на которое браузер откладывал загрузку CSS и шрифтов'
        why: 'TBT смотрит на занятость основного потока JavaScript-кодом, а не на очередь загрузки ресурсов.'
    explanation: |
      **Что это.** TBT — сумма «блокирующих» частей долгих задач основного потока после первой отрисовки (FCP).
      Долгая задача — непрерывная работа дольше 50 мс, а блокирующая часть — всё, что сверх 50 мс. В Lighthouse окно
      измерения заканчивается на TTI — моменте, когда основной поток надолго освободился. Как отдельная метрика TTI
      из отчёта убран, но для подсчёта TBT используется. Ориентир — меньше 200 мс на среднем мобильном устройстве.

      **Зачем.** Пока основной поток занят, страница не может отреагировать на клик. TBT показывает, сколько
      времени во время загрузки интерфейс был бы глух к действиям пользователя.

      **На что влияет.** Это лабораторная метрика: у неё большой вес в оценке Lighthouse, и она хорошо коррелирует
      с INP. Поэтому в лаборатории TBT служит заменой INP, но не подменяет его: решения принимают по полевому INP.

      **Как улучшить.**
      - Дробить долгие задачи и уступать поток браузеру.
      - Уменьшать и откладывать JavaScript: разделение кода, удаление неиспользуемого, отложенная загрузка
        сторонних скриптов.
      - Переносить тяжёлые вычисления в Web Worker.
      - Не оживлять сразу компоненты, которых не видно на первом экране: подключать их обработчики при гидратации
        (hydration) позже.
    links:
      - https://web.dev/articles/tbt
    source: own

  - id: network-performance-015
    level: middle
    tags: [speed-index, lighthouse, theory]
    question: |
      Что показывает метрика Speed Index в Lighthouse?
    options:
      - text: 'Насколько быстро страница визуально заполняется содержимым при загрузке'
        correct: true
        why: 'Lighthouse снимает видео загрузки, измеряет, насколько каждый кадр уже похож на итоговый, и считает, как быстро страница «проявляется».'
      - text: 'Скорость сетевого соединения, на которой Lighthouse проводил свой замер страницы'
        why: 'Параметры сети Lighthouse задаёт сам (эмуляция медленного мобильного соединения), к Speed Index они не относятся.'
      - text: 'Сколько миллисекунд в среднем уходит на отрисовку одного кадра'
        why: 'Speed Index — про то, как быстро появляется содержимое, а не про длительность кадров.'
      - text: 'Скорость сервера по сравнению с другими сайтами из отчёта CrUX'
        why: 'Speed Index — время для одной страницы в лаборатории. С другими сайтами его сопоставляют только при выставлении балла Lighthouse, по данным HTTP Archive, а не CrUX.'
    explanation: |
      **Что это.** Speed Index показывает, как быстро содержимое визуально появляется на экране во время загрузки.
      Lighthouse записывает видео, сравнивает каждый кадр с итоговым и превращает «скорость проявления» в одно
      число: чем меньше, тем лучше. Для мобильных хорошо — до 3,4 секунды, плохо — больше 5,8 секунды.

      **Зачем.** У двух страниц может быть одинаковый LCP, но одна показывает содержимое постепенно, а другая держит
      пустой экран и показывает всё в конце. Пользователю первая кажется быстрее, и Speed Index это различает.

      **На что влияет.** Это лабораторная метрика Lighthouse, в Core Web Vitals она не входит, но учитывается в
      итоговой оценке производительности.

      **Как улучшить.** То же, что ускоряет FCP и LCP:
      - быстрый ответ сервера;
      - критический CSS и меньше блокирующих скриптов;
      - меньше работы в основном потоке;
      - `font-display: swap` для шрифтов;
      - первым — содержимое первого экрана.
    links:
      - https://developer.chrome.com/docs/lighthouse/performance/speed-index
    source: own
