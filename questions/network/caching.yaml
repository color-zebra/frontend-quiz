# yaml-language-server: $schema=../../schema.json
topic: network
subtopic: caching
questions:
  - id: network-caching-001
    level: junior
    tags: [Cache-Control, no-store]
    question: |
      Что означает заголовок ответа `Cache-Control: no-store`?
    options:
      - text: 'Ответ нельзя сохранять ни в каком кэше'
        correct: true
        why: '`no-store` запрещает и браузеру, и промежуточным кэшам (прокси, CDN) хранить ответ. Каждый раз он запрашивается заново.'
      - text: 'Ответ можно хранить, но перед использованием нужно проверить'
        why: 'Это смысл `no-cache`. Названия похожи, а поведение разное.'
      - text: 'Ответ можно хранить только в браузере, но не на CDN'
        why: 'Ограничение «только кэш браузера» задаётся другой директивой. `no-store` запрещает хранение где-либо.'
      - text: 'Ответ хранится до закрытия вкладки'
        why: 'HTTP-кэш не привязан к вкладкам. `no-store` запрещает хранение совсем.'
    explanation: |
      Директивы `Cache-Control` управляют тем, кто и как долго может хранить ответ. `no-store` — самая
      строгая: для данных, которые нельзя оставлять на диске, например банковских выписок. Директиву путают с
      `no-cache`, хотя смысл у них разный. Для большинства динамических страниц запрет хранения не нужен,
      хватает менее строгих директив.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Cache-Control#no-store
    source: own

  - id: network-caching-002
    level: middle
    tags: [Cache-Control, no-cache, revalidation]
    question: |
      Сервер отдаёт `index.html` с `Cache-Control: no-cache` и `ETag`. Что делает браузер при повторном заходе
      на страницу?
    options:
      - text: 'Сначала спрашивает сервер, актуальна ли сохранённая копия'
        correct: true
        why: '`no-cache` разрешает хранить ответ, но требует проверки перед каждым использованием. Если файл не изменился, сервер подтвердит это коротким ответом без тела, и браузер возьмёт копию из кэша.'
      - text: 'Скачивает страницу заново целиком, не сохраняя её в кэше'
        why: 'Так работает `no-store`. При `no-cache` ответ хранится, и полную загрузку заменяет условный запрос.'
      - text: 'Берёт страницу из кэша, не обращаясь к серверу'
        why: 'Без обращения к серверу браузер использует копию, только пока она свежая по `max-age`. `no-cache` требует проверку каждый раз.'
      - text: 'Показывает кэш и обновляет его в фоне для следующего захода'
        why: '`no-cache` не разрешает показывать непроверенную копию даже на время фонового обновления.'
    explanation: |
      Переиспользование кэша проходит две проверки. Свежесть: пока не истёк `max-age`, копия используется без
      запроса. Валидация: если копия устарела или требуется `no-cache`, браузер отправляет условный запрос, и
      сервер либо подтверждает актуальность коротким пустым ответом, либо присылает новую версию. Для HTML это
      хороший режим: пользователь всегда получает актуальную страницу, а передаётся лишь несколько сотен байт
      заголовков.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching#validation
    source: own

  - id: network-caching-003
    level: middle
    tags: [ETag, 304, conditional-requests]
    question: |
      Браузер повторно запрашивает `/api/profile` с заголовком `If-None-Match: "v42"`. Профиль не менялся. Что
      должен ответить сервер?
    options:
      - text: '`304 Not Modified` без тела'
        correct: true
        why: 'Совпадение `ETag` означает, что у клиента актуальная версия. Сервер подтверждает это кодом 304, и тело не передаётся.'
      - text: '`200 OK` с тем же телом и `ETag: "v42"`'
        why: 'По спецификации HTTP (RFC 9110) сервер, проверивший `If-None-Match` при `GET`, при совпадении обязан ответить 304. Полный ответ лишил бы условный запрос смысла.'
      - text: '`204 No Content`'
        why: '204 означает «успех без тела» для действий, а не подтверждение актуальности кэша. Браузер не возьмёт копию из кэша по 204.'
      - text: '`412 Precondition Failed`'
        why: '412 возвращают, когда не выполнено условие вроде `If-Match` при изменении ресурса. Для `If-None-Match` при `GET` совпадение означает 304.'
    explanation: |
      `ETag` — идентификатор версии ресурса: хэш содержимого или номер версии. Сервер отдаёт его вместе с
      ответом, браузер сохраняет и при проверке присылает в `If-None-Match`. Совпадение даёт `304`, отличие —
      полный ответ с новым `ETag`. Этот же механизм используется для оптимистичной блокировки при изменении
      данных: `PUT` с `If-Match: "v42"` выполнится, только если ресурс никто не изменил, иначе вернётся `412`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/ETag
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/304
    source: own

  - id: network-caching-004
    level: middle
    tags: [cache-busting, immutable, hashed-assets]
    question: |
      После сборки получаются `index.html` и `assets/app.3f9a1c.js` (хэш в имени зависит от содержимого).
      Какая стратегия кэширования правильная?
    options:
      - text: '`index.html` — `no-cache`, `app.3f9a1c.js` — `max-age=31536000, immutable`'
        correct: true
        why: 'Файл с хэшем никогда не меняется: новая версия получит новое имя. Его можно кэшировать навсегда. А HTML нужно проверять каждый раз, потому что именно он ссылается на актуальные имена файлов.'
      - text: '`index.html` — `max-age=31536000`, `app.3f9a1c.js` — `no-cache`'
        why: 'Наоборот: закэшированный надолго HTML продолжит ссылаться на старые скрипты, и пользователи не увидят обновлений.'
      - text: 'Оба файла — `max-age=3600`'
        why: 'В течение часа после деплоя пользователи будут получать старый HTML, а хэшированный файл без нужды перепроверяется каждый час.'
      - text: 'Оба файла — `no-store`'
        why: 'Скрипты будут скачиваться при каждом заходе, хотя у неизменного файла с хэшем это бессмысленно.'
    explanation: |
      Стандартная схема для SPA и сборщиков: неизменяемые файлы с хэшем содержимого в имени (cache busting)
      кэшируются на год с `immutable` (Firefox и Safari не перепроверяют их даже при обновлении страницы,
      Chrome и без этого не перепроверяет свежие подресурсы), а точка входа (`index.html`) отдаётся с
      `no-cache`. Деплой меняет HTML, тот ссылается на новые имена, и браузер скачивает только изменившиеся
      чанки. Ошибка в этой схеме, например долгий кэш HTML на CDN, приводит к тому, что после деплоя
      пользователи сидят на старой версии.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching#cache_busting
    source: own

  - id: network-caching-005
    level: senior
    tags: [Vary, cdn, cors]
    question: |
      API отдаёт ответ с `Cache-Control: public, max-age=600` и `Access-Control-Allow-Origin`, равным `Origin`
      запроса. Перед API стоит CDN. Пользователи сайта `b.com` иногда получают ошибку CORS, хотя `b.com`
      разрешён. Чего не хватает в ответе?
    options:
      - text: '`Vary: Origin`'
        correct: true
        why: 'CDN закэшировал ответ, выданный для `a.com`, с `Access-Control-Allow-Origin: a.com` и отдаёт его всем. `Vary: Origin` велит хранить отдельные копии для разных значений заголовка `Origin`.'
      - text: '`Vary: Accept-Encoding`'
        why: 'Этот `Vary` разделяет копии по поддерживаемому сжатию, а заголовок `Origin` по-прежнему не учитывается: ответ для `a.com` достанется и `b.com`.'
      - text: '`Access-Control-Max-Age`'
        why: 'Этот заголовок относится к preflight-запросам браузера и не влияет на то, какой закэшированный ответ отдаёт CDN.'
      - text: '`ETag`'
        why: '`ETag` помогает перепроверять копию, но не разделяет копии для разных источников.'
    explanation: |
      Кэш сопоставляет запросы по методу и URL. Если ответ зависит ещё от заголовков запроса, их перечисляют в
      `Vary`, и кэш хранит отдельный вариант для каждого значения. Типичные случаи: `Vary: Accept-Encoding`
      (сжатая и несжатая версии), `Vary: Origin` (разные заголовки CORS), `Vary: Accept-Language`. Забытый
      `Vary` даёт плавающие ошибки, которые зависят от того, кто первым заполнил кэш. Слишком широкий (`Vary:
      User-Agent`, `Vary: Cookie`) почти отключает кэширование.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Vary
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS#access-control-allow-origin
    source: own

  - id: network-caching-006
    level: senior
    tags: [heuristic-caching, Last-Modified]
    question: |
      Сервер отдаёт файл без `Cache-Control` и `Expires`, но с заголовком `Last-Modified`, который на 10 дней
      раньше текущей даты. Через час пользователь переходит на другую страницу сайта, где подключён тот же
      файл. Что сделает браузер?
    options:
      - text: 'Возьмёт файл из кэша без запроса к серверу'
        correct: true
        why: 'Без явного срока кэш может вычислить его эвристически. Обычно это 10% от времени с последнего изменения, то есть около суток. Через час копия ещё считается свежей.'
      - text: 'Обязательно отправит запрос, потому что срок не указан'
        why: 'Отсутствие `Cache-Control` не означает «не кэшировать». Спецификация разрешает эвристическую свежесть, и браузеры ею пользуются.'
      - text: 'Не сохранит файл в кэше вообще'
        why: 'Кэшировать запрещает `no-store`. Без заголовков ответ на `GET` с кодом 200 кэшируется по умолчанию.'
      - text: 'Будет использовать кэш ровно 10 дней'
        why: 'Эвристика берёт лишь часть возраста ресурса, а не весь возраст.'
    explanation: |
      Если сервер не сказал, сколько хранить ответ, кэш может решить сам (heuristic freshness). Рекомендация
      спецификации и практика браузеров — 10% от времени между `Last-Modified` и моментом ответа. Это источник
      загадочных багов: «выложили новую версию, а у пользователей старая». Вывод: явно задавайте
      `Cache-Control` для всех ответов, особенно для HTML и API. Для данных, которые нельзя показывать
      устаревшими, указывайте `no-cache` или `no-store`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching#heuristic_caching
    source: own

  - id: network-caching-007
    level: middle
    tags: [stale-while-revalidate]
    question: |
      Что даёт `Cache-Control: max-age=60, stale-while-revalidate=600`?
    options:
      - text: 'Минуту ответ свежий, потом ещё 10 минут отдаётся старым с обновлением в фоне'
        correct: true
        why: 'После истечения `max-age` кэш может сразу отдать устаревшую копию и параллельно запросить новую. Пользователь не ждёт сети, а следующий запрос получит обновлённые данные.'
      - text: 'Ответ хранится 10 минут, а потом минуту проверяется'
        why: 'Порядок обратный: сначала 60 секунд свежести, затем окно, в котором можно отдавать устаревшую копию.'
      - text: 'Ответ обновляется в фоне каждые 60 секунд, даже если его не запрашивают'
        why: 'Фоновое обновление запускается только при обращении к устаревшей копии, а не по таймеру.'
      - text: 'Ответ можно отдавать устаревшим только при ошибке сервера'
        why: 'Это поведение директивы `stale-if-error`. `stale-while-revalidate` работает и при исправном сервере.'
    explanation: |
      `stale-while-revalidate` меняет задержку на свежесть: пользователь мгновенно получает чуть устаревшие
      данные, а кэш обновляется в фоне. Это хорошо подходит для данных, которые меняются, но не критичны:
      ленты, каталоги, аватары. Та же идея лежит в основе библиотеки SWR (её название оттуда) и стратегий
      TanStack Query, а в Next.js — в инкрементальной регенерации страниц. Для данных, где важна точность
      (баланс, остатки товара), так делать нельзя.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Cache-Control#stale-while-revalidate
    source: own

  - id: network-caching-008
    level: middle
    tags: [Cache-Control, private, public, cdn]
    question: |
      Эндпоинт `/api/me` возвращает данные текущего пользователя. Какую директиву обязательно указать, если
      ответ можно кэшировать?
    options:
      - text: '`private`'
        correct: true
        why: '`private` разрешает хранить ответ только в кэше браузера пользователя. Общие кэши (CDN, корпоративные прокси) его сохранять не должны, иначе один пользователь получит данные другого.'
      - text: '`public`'
        why: '`public` явно разрешает общим кэшам хранить ответ. Для персональных данных это опасно.'
      - text: '`immutable`'
        why: '`immutable` говорит, что ответ не изменится, пока свежий. Данные пользователя меняются, и кто может их хранить, директива не определяет.'
      - text: '`s-maxage=600`'
        why: '`s-maxage` задаёт срок именно для общих кэшей, то есть поощряет хранить ответ на CDN.'
    explanation: |
      Кэши бывают частными (браузер одного пользователя) и общими (CDN, прокси, кэш перед приложением). Ответ
      с персональными данными в общем кэше — утечка: следующий пользователь получит чужой профиль. Поэтому для
      таких ответов указывают `private` или `no-store`. CDN обычно не кэшируют ответы на запросы с
      `Authorization` без явного разрешения, но полагаться на это не стоит. `s-maxage` и `public` используют
      для общих данных: публичных страниц, каталогов, статики.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Cache-Control#private
    source: own

  - id: network-caching-009
    level: middle
    tags: [deploy, chunk-load-error, code-splitting]
    question: |
      Пользователь держал вкладку SPA открытой весь день. После деплоя он переходит на раздел, код которого
      грузится лениво, и получает ошибку загрузки чанка. Почему?
    options:
      - text: 'Старая версия запрашивает чанк, удалённый при деплое'
        correct: true
        why: 'В открытой вкладке работает старый код, и он ссылается на старые имена чанков с хэшем. Если при деплое старые файлы удалили, запрос вернёт 404, и `import()` упадёт.'
      - text: 'Браузер закэшировал чанк с ошибкой и не перезапрашивает его'
        why: 'Даже если ошибка где-то закэширована, первопричина другая: первый же запрос упал, потому что файла на сервере больше нет.'
      - text: 'Новый `index.html` не подключает ленивые чанки'
        why: 'Вкладка не перезагружалась, и новый HTML она не получала. Ссылки на чанки берутся из старого кода в памяти.'
      - text: 'Чанки с хэшем нельзя кэшировать дольше суток'
        why: 'Срок кэширования здесь ни при чём: ошибка возникает из-за удаления файла на сервере.'
    explanation: |
      Разделение кода и деплой со сменой хэшей создают «окно версий»: пользователь работает со старым кодом, а
      сервер уже раздаёт новый. Решения такие: хранить старые чанки на CDN несколько дней или версий, ловить
      ошибку загрузки чанка и предлагать перезагрузку, сообщать клиенту о новой версии (через опрос
      `version.json` или заголовок) и обновлять страницу при следующей навигации. Похожую проблему создаёт
      Service Worker, который отдаёт закэшированный старый HTML.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/import
      - https://vite.dev/guide/build#load-error-handling
    source: own

  - id: network-caching-010
    level: middle
    tags: [service-worker, cache-strategies]
    question: |
      Какую стратегию Service Worker выбрать для API ленты новостей, которая должна работать офлайн, но по
      возможности показывать свежие данные?
    options:
      - text: 'Network first: сеть, а при ошибке — кэш'
        correct: true
        why: 'Сначала идём в сеть за свежими данными и обновляем кэш. Если сети нет или она не отвечает, отдаём последнюю сохранённую версию.'
      - text: 'Cache first: кэш, а при промахе — сеть'
        why: 'Такая стратегия подходит для неизменяемой статики. Для ленты она будет показывать старые данные, пока кэш не очистят.'
      - text: 'Cache only: только кэш'
        why: 'Без сети данные никогда не обновятся: подходит только для заранее сохранённой оболочки приложения.'
      - text: 'Network only: только сеть'
        why: 'Офлайн такая стратегия ничего не покажет, а требование было работать без сети.'
    explanation: |
      Service Worker перехватывает запросы страницы и решает, откуда брать ответ. Основные стратегии: cache
      first (статика с хэшем, шрифты), network first (данные, где важна свежесть, но нужен офлайн),
      stale-while-revalidate (аватары, справочники), cache only и network only. Подводный камень — сам Service
      Worker и закэшированный им HTML: без продуманного обновления пользователи надолго застревают на старой
      версии. Готовые стратегии даёт библиотека Workbox.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Progressive_web_apps/Guides/Caching
      - https://developer.chrome.com/docs/workbox/caching-strategies-overview
    source: own
