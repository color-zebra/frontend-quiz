topic: network
subtopic: security
questions:
  - id: network-security-001
    level: junior
    tags: [xss]
    question: |
      Что такое XSS (cross-site scripting)?
    options:
      - text: 'Выполнение чужого скрипта на вашей странице'
        correct: true
        why: 'Злоумышленник добивается, чтобы его код выполнился в контексте вашего сайта, например через комментарий с `<script>` или обработчик `onerror`. Такой код получает доступ ко всему, что доступно странице.'
      - text: 'Отправка запроса от имени пользователя с чужого сайта'
        why: 'Это CSRF: чужой сайт заставляет браузер отправить запрос с cookie пользователя, но скрипт на вашей странице не выполняется.'
      - text: 'Перехват трафика между браузером и сервером'
        why: 'Это атака «человек посередине» (MITM), от неё защищает HTTPS.'
      - text: 'Подбор пароля перебором вариантов'
        why: 'Это brute force, атака на аутентификацию. XSS касается выполнения кода в браузере.'
    explanation: |
      XSS — внедрение исполняемого кода в страницу через данные, которые сайт выводит без экранирования.
      Бывает хранимая (stored: вредоносный комментарий в базе показывается всем), отражённая (reflected: код в
      параметре URL попадает в ответ) и DOM-based (клиентский код сам вставляет данные из URL в DOM).
      Внедрённый скрипт действует от имени пользователя: читает данные страницы, отправляет запросы, подменяет
      интерфейс. Основная защита — экранирование при выводе. Дополнительные слои — CSP и `HttpOnly`-cookie.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Security/Attacks/XSS
    source: own

  - id: network-security-002
    level: middle
    tags: [xss, react, dangerouslySetInnerHTML, sanitization]
    question: |
      Описание товара приходит из CMS в виде HTML и должно отображаться с форматированием. Как безопасно
      вывести его в React?
    options:
      - text: 'Через `dangerouslySetInnerHTML`, предварительно очистив DOMPurify'
        correct: true
        why: 'Очистка удаляет скрипты, обработчики вроде `onerror` и опасные адреса, оставляя разметку форматирования. Только после этого HTML можно вставлять как HTML.'
      - text: 'Через `<div>{html}</div>`, React сам оставит безопасные теги'
        why: 'React выводит строку как текст: пользователь увидит теги буквально, форматирования не будет. React HTML не разбирает и не фильтрует.'
      - text: 'Через `dangerouslySetInnerHTML` без очистки, ведь CMS своя'
        why: 'Учётку редактора могут взломать, а в CMS бывают свои уязвимости. Данные извне страницы всегда считают недоверенными.'
      - text: 'Через `ref.current.innerHTML` в эффекте, в обход React'
        why: 'Это тот же `innerHTML` без защиты, только React о нём не знает. Риск XSS прежний.'
    explanation: |
      JSX защищает от XSS по умолчанию: всё, что вставляется через `{}`, React передаёт в DOM как текст. Когда
      нужен именно HTML (статьи, описания из CMS, письма), защиту обходят явно, и отвечать за безопасность
      приходится самим: очищать разметку библиотекой (DOMPurify) по белому списку тегов и атрибутов. Название
      `dangerouslySetInnerHTML` выбрано специально, чтобы такое место было заметно на ревью. Ещё надёжнее
      хранить контент в структурированном виде (Markdown, JSON-блоки) и рендерить компонентами.
    links:
      - https://react.dev/reference/react-dom/components/common#dangerously-setting-the-inner-html
      - https://github.com/cure53/DOMPurify
    source: own

  - id: network-security-003
    level: middle
    tags: [csrf, SameSite, same-site]
    question: |
      Банк работает на `bank.com`, а страницы пользователей размещает на `pages.bank.com`. Cookie сессии
      выставлена с `SameSite=Lax`. Злоумышленник создал страницу на `pages.bank.com` с формой, которая
      отправляет `POST` на `bank.com/transfer`. Защитит ли `SameSite`?
    options:
      - text: 'Нет: для `SameSite` это запрос с того же сайта'
        correct: true
        why: '`SameSite` сравнивает сайты (регистрируемый домен), а `pages.bank.com` и `bank.com` — один сайт. Cookie уйдёт, и защищаться нужно на сервере: токеном в форме или проверкой `Origin`/`Sec-Fetch-Site`.'
      - text: 'Да: `Lax` блокирует запросы с других источников'
        why: '`SameSite` работает с сайтами, а не источниками: поддомены одного домена для него «свои».'
      - text: 'Да, если cookie ещё и `HttpOnly`'
        why: '`HttpOnly` только скрывает cookie от скриптов. К запросу браузер её всё равно приложит.'
      - text: 'Нет, но спасут строгие заголовки CORS на `bank.com`'
        why: 'Отправка формы — простой запрос, браузер шлёт его без проверки CORS. CORS ограничивает только чтение ответов скриптами.'
    explanation: |
      CSRF (cross-site request forgery) использует то, что браузер сам прикладывает cookie к запросам.
      `SameSite` закрывает атаки с чужих сайтов, но не с поддоменов того же сайта: их часто отдают под
      пользовательский контент, маркетинговые лендинги или сторонние сервисы. Поэтому надёжная защита
      многослойная. Сервер проверяет `Origin` или `Sec-Fetch-Site`. Формы содержат CSRF-токен, который чужая
      страница не может узнать. Изменяющие действия никогда не делают через `GET`. Пользовательский контент
      выносят на отдельный домен, как `githubusercontent.com` у GitHub.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Security/Attacks/CSRF
      - https://developer.mozilla.org/en-US/docs/Glossary/Site
    source: own

  - id: network-security-004
    level: middle
    tags: [csp, inline-scripts]
    question: |
      Сайт отдаёт заголовок `Content-Security-Policy: script-src 'self'`. Что перестанет работать?
    options:
      - text: 'Обработчик в разметке `<button onclick="save()">`'
        correct: true
        why: 'Без `unsafe-inline` политика запрещает любой встроенный код: теги `<script>` с телом и атрибуты-обработчики вроде `onclick`. Разрешены только скрипты из файлов того же источника.'
      - text: 'Подключение `<script src="/app.js">`'
        why: 'Файл с того же источника подходит под `self` и загрузится.'
      - text: 'Вызов `addEventListener` внутри `/app.js`'
        why: 'Код в разрешённом файле выполняется полностью, включая подписку на события.'
      - text: 'Картинка `<img src="https://cdn.example.com/logo.png">`'
        why: '`script-src` управляет только скриптами. Для картинок есть `img-src`, а здесь он не задан.'
    explanation: |
      Content Security Policy — заголовок со списком разрешённых источников по типам ресурсов: `script-src`,
      `style-src`, `img-src`, `connect-src`, `frame-ancestors`. Если политика запрещает встроенные скрипты,
      XSS теряет главный путь: даже внедрив разметку, злоумышленник не сможет выполнить свой код. Поэтому
      строгие CSP требуют писать без инлайновых обработчиков и `eval`. Внедрять политику удобно через
      `Content-Security-Policy-Report-Only`: браузер сообщает о нарушениях, ничего не блокируя.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP
    source: own

  - id: network-security-005
    level: senior
    tags: [csp, nonce]
    question: |
      Политика запрещает встроенные скрипты, но на странице нужен один inline-скрипт с начальными данными. Как
      разрешить его, не ослабляя защиту от XSS?
    options:
      - text: 'Добавить скрипту `nonce` со случайным значением из CSP'
        correct: true
        why: 'Сервер генерирует новое случайное значение на каждый ответ, указывает его в `script-src ''nonce-...''` и в атрибуте нужного скрипта. Внедрённый злоумышленником скрипт этого значения не знает.'
      - text: 'Добавить в политику `''unsafe-inline''`'
        why: 'Это разрешит любые встроенные скрипты, включая внедрённые. Защита от XSS фактически пропадёт.'
      - text: 'Перенести код скрипта в адрес `data:` в атрибуте `src`'
        why: '`data:` не входит в `self`, а разрешать его в `script-src` так же опасно, как `unsafe-inline`.'
      - text: 'Использовать постоянный `nonce`, прописанный в коде сайта'
        why: 'Постоянное значение легко узнать из исходников страницы, и злоумышленник подставит его в свой скрипт.'
    explanation: |
      Строгая CSP строится на nonce или хэшах, а не на списках доменов: списки обходятся через JSONP и
      устаревшие библиотеки на разрешённых CDN. Nonce — одноразовое случайное значение для каждого ответа, хэш
      — `sha256` от содержимого конкретного скрипта. Дополнение `'strict-dynamic'` позволяет доверенному
      скрипту подгружать другие скрипты, что нужно для бандлеров и загрузчиков. Фреймворки вроде Next.js умеют
      проставлять nonce через middleware (в Next.js 16 — `proxy`).
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Content-Security-Policy/script-src
      - https://web.dev/articles/strict-csp
    source: own

  - id: network-security-006
    level: middle
    tags: [clickjacking, frame-ancestors, X-Frame-Options]
    question: |
      Как запретить встраивать ваш сайт в `iframe` на чужих сайтах, чтобы защититься от clickjacking?
    options:
      - text: 'Отдавать заголовок с CSP `frame-ancestors`'
        correct: true
        why: 'Директива `frame-ancestors ''self''` (или старый заголовок `X-Frame-Options`) говорит браузеру, каким сайтам можно встраивать страницу. Браузер откажется показывать её во фрейме на чужом сайте.'
      - text: 'Добавить на свои страницы `<iframe sandbox>`'
        why: '`sandbox` ограничивает содержимое фрейма, который встраиваете вы. Чужой сайт, встраивающий вас, этот атрибут не задаёт.'
      - text: 'Включить на сервере проверку CORS'
        why: 'CORS управляет чтением ответов скриптами и не мешает показывать страницу во фрейме.'
      - text: 'Поставить cookie сессии флаг `HttpOnly`'
        why: '`HttpOnly` защищает cookie от чтения скриптом, но не мешает встраиванию страницы.'
    explanation: |
      Clickjacking: чужой сайт показывает вашу страницу в прозрачном `iframe` поверх своей кнопки, и
      пользователь, думая, что жмёт «Получить приз», на деле нажимает «Удалить аккаунт» на вашем сайте. Защита
      — запрет встраивания. Современный способ — директива CSP `frame-ancestors` со списком разрешённых
      сайтов, старый — `X-Frame-Options: DENY` или `SAMEORIGIN`. Проверки в JavaScript вида `if (top !==
      self)` ненадёжны: их можно обойти через `sandbox` у фрейма.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Content-Security-Policy/frame-ancestors
      - https://developer.mozilla.org/en-US/docs/Web/Security/Attacks/Clickjacking
    source: own

  - id: network-security-007
    level: middle
    tags: [hsts, https]
    question: |
      Что даёт заголовок `Strict-Transport-Security: max-age=31536000; includeSubDomains`?
    options:
      - text: 'Браузер год будет открывать домен только по HTTPS'
        correct: true
        why: 'Получив заголовок, браузер запоминает, что сайт работает только по HTTPS, и сам заменяет `http://` на `https://`, даже если пользователь ввёл адрес без схемы.'
      - text: 'Сервер год будет перенаправлять HTTP-запросы на HTTPS'
        why: 'Перенаправление настраивают на сервере отдельно. HSTS действует в браузере и позволяет не делать первый незащищённый запрос вовсе.'
      - text: 'Браузер год будет кэшировать страницы сайта'
        why: 'Кэшированием управляет `Cache-Control`. `max-age` в HSTS — срок действия правила «только HTTPS».'
      - text: 'Cookie сайта получат флаг `Secure` автоматически'
        why: 'HSTS не меняет атрибуты cookie, хотя на практике и не даёт отправить их по незащищённому соединению.'
    explanation: |
      Без HSTS первый запрос `http://bank.com` уходит открытым, и злоумышленник в той же сети может подменить
      ответ, оставив пользователя на HTTP (атака SSL stripping). HSTS закрывает эту дыру для повторных
      визитов: браузер сразу идёт по HTTPS. Для самого первого визита есть HSTS preload list — список доменов,
      встроенный в браузеры. Включать `includeSubDomains` и preload стоит осторожно: все поддомены должны
      работать по HTTPS, а выйти из списка долго.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Strict-Transport-Security
    source: own

  - id: network-security-008
    level: senior
    tags: [xss, javascript-url, react-19]
    question: |
      Ссылка на сайт пользователя берётся из профиля, и злоумышленник указал
      `javascript:alert(document.cookie)`. Что произойдёт в React 19 при клике?
    code: |
      function UserLink({ url }) {
        return <a href={url}>Сайт пользователя</a>;
      }
    codeLang: jsx
    options:
      - text: 'Код не выполнится, React подменит адрес'
        correct: true
        why: 'React 19 блокирует `javascript:` в URL-атрибутах. Вместо исходного значения в `href` попадает код, который бросает ошибку «React has blocked a javascript: URL as a security precaution».'
      - text: 'Выполнится `alert` с доступными скрипту cookie'
        why: 'Так было до React 19 (React 16.9–18 лишь предупреждал в консоли). Теперь такой адрес блокируется.'
      - text: 'React бросит ошибку ещё при рендере ссылки'
        why: 'Ссылка рендерится, меняется только значение `href`. Ошибка возникнет при клике.'
      - text: 'Браузер сам заблокирует ссылку `javascript:`'
        why: 'Браузеры выполняют `javascript:`-ссылки, если CSP этого не запрещает. Защиту здесь даёт React.'
    explanation: |
      URL-атрибуты — частая лазейка для XSS даже в фреймворках с экранированием: строка `javascript:...` —
      допустимый адрес, и экранирование текста её не обезвреживает. React 19 подменяет такие значения в
      `href`, `action`, `formAction`, `src` у `iframe`. Но надёжнее проверять адреса самим: разрешать только
      `https:` и `http:` через `new URL(url).protocol`. Тот же риск есть у редиректов вида `location.href =
      params.get('next')`, и они тоже требуют проверки.
    links:
      - https://legacy.reactjs.org/blog/2019/08/08/react-v16.9.0.html#deprecating-javascript-urls
      - https://developer.mozilla.org/en-US/docs/Web/URI/Reference/Schemes/javascript
    source: own

  - id: network-security-009
    level: middle
    tags: [sri, cdn, integrity]
    question: |
      Зачем атрибут `integrity` у скрипта, подключённого с публичного CDN?
    code: |
      <script
        src="https://cdn.example.com/lib@4.2.0/lib.min.js"
        integrity="sha384-..."
        crossorigin="anonymous"
      ></script>
    codeLang: html
    options:
      - text: 'Браузер не выполнит файл, если его содержимое изменилось'
        correct: true
        why: 'В `integrity` указан хэш ожидаемого файла. Если CDN взломали или файл подменили, хэш не совпадёт, и браузер откажется выполнять скрипт.'
      - text: 'Браузер скачает файл с резервного CDN, если основной недоступен'
        why: 'Резервных источников атрибут не задаёт. Если файл не загрузился или хэш не совпал, скрипт просто не выполнится.'
      - text: 'Браузер возьмёт файл из кэша вместо CDN'
        why: '`integrity` не управляет кэшированием: файл кэшируется как обычно, а хэш проверяется при каждом использовании.'
      - text: 'Скрипт будет выполняться в изолированной песочнице'
        why: 'Скрипт выполняется в контексте страницы, как обычно. `integrity` проверяет только целостность файла.'
    explanation: |
      Subresource Integrity (SRI) защищает от компрометации сторонних серверов: даже если файл на CDN
      подменят, ваша страница его не выполнит. Хэш генерируют при сборке или берут со страницы библиотеки. Для
      файлов с другого источника нужен `crossorigin`, иначе браузер не сможет проверить содержимое. SRI
      подходит только для неизменяемых версий: ссылка на «последнюю версию» (`lib@latest`) сломается при
      обновлении. Это ещё одна причина подключать конкретные версии.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Subresource_Integrity
    source: own

  - id: network-security-010
    level: junior
    tags: [jwt, tokens]
    question: |
      Можно ли хранить в payload JWT-токена секретные данные пользователя, например номер паспорта?
    options:
      - text: 'Нет: payload лишь закодирован base64url, его прочитает любой'
        correct: true
        why: 'Обычный JWT подписан, а не зашифрован. Подпись защищает от подделки, но содержимое декодируется без ключа, например в браузере или на jwt.io.'
      - text: 'Да: payload зашифрован секретным ключом сервера'
        why: 'Секретным ключом создаётся подпись, а не шифр. Зашифрованные токены (JWE) существуют, но обычные JWT это не они.'
      - text: 'Да, если токен хранится в `HttpOnly`-cookie'
        why: '`HttpOnly` скрывает токен от скриптов, но токен декодирует любой, кто его получит: сам пользователь в DevTools, логи, утёкшая копия.'
      - text: 'Да: подпись шифрует все части токена'
        why: 'Подпись не шифрует, а лишь подтверждает целостность. Заголовок и payload остаются читаемым base64url.'
    explanation: |
      JWT состоит из трёх частей через точку: заголовок, полезная нагрузка (payload) и подпись. Первые две —
      просто JSON в кодировке base64url. Подпись позволяет серверу убедиться, что токен выдал он и что его не
      меняли. Поэтому в payload кладут идентификаторы и роли, но не секреты. Сервер обязан проверять подпись и
      срок `exp`. Клиент может прочитать payload, например чтобы показать имя, но доверять ему для проверки
      прав нельзя: решения о доступе принимает сервер.
    links:
      - https://datatracker.ietf.org/doc/html/rfc7519
      - https://jwt.io/introduction
    source: own

  - id: network-security-011
    level: middle
    tags: [postMessage, origin]
    question: |
      Страница слушает сообщения от OAuth-попапа. Что не так с этим обработчиком?
    code: |
      window.addEventListener('message', (event) => {
        localStorage.setItem('token', event.data.token);
      });
    codeLang: js
    options:
      - text: 'Не проверяется `event.origin`, сообщение пришлёт любое окно'
        correct: true
        why: '`postMessage` может отправить любой сайт, у которого есть ссылка на ваше окно: открывший вас или открытый вами. Без проверки `event.origin` злоумышленник подсунет свой токен или данные.'
      - text: 'Он зациклится на собственных сообщениях страницы'
        why: 'Обработчик ничего не отправляет в ответ, поэтому цикла нет. Проблема в том, что принимаются сообщения от кого угодно.'
      - text: 'В `event.data` можно передать только строки'
        why: '`postMessage` передаёт объекты через структурное клонирование, так что `event.data.token` корректен.'
      - text: 'Обработчик `message` нужно вешать на `document`, а не на `window`'
        why: 'Событие приходит на `window`, подписка корректна. Проблема в том, что отправитель не проверяется.'
    explanation: |
      `window.postMessage` — способ обмена данными между окнами и фреймами разных источников: OAuth-попапы,
      платёжные виджеты, встроенные редакторы. Получатель обязан проверять `event.origin` по белому списку и
      форму данных, а отправитель — указывать точный `targetOrigin` вместо `'*'`, чтобы данные не попали в
      чужое окно. Отсутствие проверок — частая уязвимость: от подмены данных до XSS, если содержимое потом
      вставляется в страницу.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Window/postMessage#security_concerns
    source: own

  - id: network-security-012
    level: junior
    tags: [mixed-content, https]
    question: |
      Страница открыта по `https://`, а скрипт подключён как `<script src="http://cdn.example.com/lib.js">`.
      Что сделает браузер?
    options:
      - text: 'Заблокирует загрузку скрипта как смешанный контент'
        correct: true
        why: 'Скрипт по `http` на защищённой странице — активный смешанный контент: его могут подменить по пути и получить контроль над страницей. Браузеры такие загрузки блокируют.'
      - text: 'Загрузит скрипт, но покажет предупреждение в адресной строке'
        why: 'Так когда-то поступали с картинками. Активный контент вроде скриптов, стилей и `fetch` блокируется полностью.'
      - text: 'Автоматически загрузит скрипт по `https` тем же адресом'
        why: 'Автоматическое повышение до `https` Chrome и Firefox делают только для пассивного контента (картинки, аудио, видео), но не для скриптов.'
      - text: 'Перезагрузит всю страницу по `http`'
        why: 'Браузер не понижает защищённую страницу. Он лишь не загружает небезопасный ресурс.'
    explanation: |
      Смешанный контент (mixed content) — ресурсы по `http` на странице, открытой по `https`. Активный
      (скрипты, стили, `iframe`, `fetch`) блокируется: он может изменить всю страницу. Пассивный (картинки,
      видео, аудио) Chrome и Firefox пытаются загрузить по `https`, а если не выходит, блокируют. Решение —
      использовать только `https`-адреса. Директива CSP `upgrade-insecure-requests` помогает при миграции
      старого контента.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Security/Mixed_content
    source: own
