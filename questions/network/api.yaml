# yaml-language-server: $schema=../../schema.json
topic: network
subtopic: api
questions:
  - id: network-api-001
    level: junior
    tags: [rest, endpoints]
    question: |
      Какой запрос соответствует REST-стилю для удаления пользователя с id 5?
    options:
      - text: '`DELETE /users/5`'
        correct: true
        why: 'В REST адрес обозначает ресурс (пользователь 5), а действие задаёт HTTP-метод. Удаление — метод `DELETE`.'
      - text: '`POST /deleteUser?id=5`'
        why: 'Глагол в адресе — признак RPC-стиля. В REST действие выражают методом, а не именем эндпоинта.'
      - text: '`GET /users/5/delete`'
        why: '`GET` должен быть безопасным. Удаление через `GET` может вызвать предзагрузка ссылок или поисковый робот.'
      - text: '`PUT /users/delete/5`'
        why: '`PUT` заменяет ресурс по адресу, а `/users/delete/5` выглядит как отдельный ресурс «delete». Смысл запроса искажён.'
    explanation: |
      REST строит API вокруг ресурсов и стандартных методов: `GET /users` — список, `GET /users/5` — один
      пользователь, `POST /users` — создать, `PATCH /users/5` — изменить часть, `PUT /users/5` — заменить,
      `DELETE /users/5` — удалить. Вложенные ресурсы выражают путём: `GET /users/5/orders`. Единые правила
      делают API предсказуемым и позволяют инфраструктуре работать с ним: кэшировать `GET`, повторять
      идемпотентные методы, писать понятные логи.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/REST
    source: own

  - id: network-api-002
    level: middle
    tags: [sse, websocket, polling, realtime]
    question: |
      Сервер должен отправлять пользователю уведомления, а клиенту не нужно ничего слать в ответ. Нужно
      автоматическое переподключение при обрыве. Что подходит лучше всего?
    options:
      - text: 'Server-Sent Events через `EventSource`'
        correct: true
        why: 'SSE — однонаправленный поток от сервера по обычному HTTP. `EventSource` сам переподключается после обрыва и передаёт `Last-Event-ID`, чтобы сервер дослал пропущенное.'
      - text: 'WebSocket с собственным протоколом сообщений'
        why: 'WebSocket двунаправленный и подойдёт, но переподключение, повторную подписку и пропущенные события придётся писать самим. Для одностороннего потока это лишняя сложность.'
      - text: 'Опрос сервера `fetch` каждую секунду'
        why: 'Частый опрос создаёт много пустых запросов и всё равно даёт задержку до секунды.'
      - text: 'Ответ `103 Early Hints` с данными уведомлений'
        why: '103 не несёт тела с данными и не держит канал открытым: это короткий предварительный ответ перед основным.'
    explanation: |
      Для данных в реальном времени есть несколько вариантов. Опрос (polling) прост, но расточителен. Долгий
      опрос (long polling): сервер держит запрос, пока не появятся данные. SSE: один долгий HTTP-ответ, в
      который сервер пишет события. Работает через прокси и с HTTP/2, умеет переподключаться, но передаёт
      только текст и только от сервера. WebSocket: полноценный двунаправленный канал для чатов, игр,
      совместного редактирования. Выбор зависит от направления данных: уведомления и стриминг ответов
      ИИ-моделей часто делают на SSE.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events
      - https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API
    source: own

  - id: network-api-003
    level: middle
    tags: [graphql, overfetching]
    question: |
      Экрану профиля нужны имя пользователя и заголовки его трёх последних постов. В REST это два запроса, и
      каждый возвращает много лишних полей. Что меняет GraphQL?
    options:
      - text: 'Клиент одним запросом получает ровно нужные поля'
        correct: true
        why: 'В GraphQL клиент описывает форму ответа: какие поля и какие связанные данные нужны. Сервер возвращает именно это, без лишних полей и дополнительных запросов.'
      - text: 'Ответы автоматически кэшируются браузером по URL'
        why: 'Наоборот: запросы GraphQL обычно идут одним `POST` на один адрес, и HTTP-кэш по URL не работает. Кэшируют на клиенте, например в Apollo или urql.'
      - text: 'Сервер больше не нужен: данные запрашиваются прямо из базы'
        why: 'GraphQL — слой API на сервере. Резолверы на сервере обращаются к базе и другим сервисам.'
      - text: 'Запросы выполняются по WebSocket вместо HTTP'
        why: 'Основные запросы GraphQL идут по HTTP. WebSocket используют только для подписок.'
    explanation: |
      GraphQL решает две проблемы REST: over-fetching (сервер присылает лишние поля) и under-fetching (для
      экрана нужно несколько запросов). Цена — сложность на сервере: проблема N+1 запросов к базе (решается
      DataLoader), ограничение глубины и стоимости запросов, кэширование на клиенте вместо HTTP. Для
      приложений с разнообразными клиентами и сложными связями данных это часто окупается. Для простых
      CRUD-сервисов REST проще.
    links:
      - https://graphql.org/learn/
    source: own

  - id: network-api-004
    level: senior
    tags: [idempotency-key, retries, payments]
    question: |
      Клиент отправил `POST /payments`, но получил таймаут: неизвестно, прошла ли оплата. Как сделать повтор
      безопасным?
    options:
      - text: 'Отправить повтор с тем же заголовком `Idempotency-Key`'
        correct: true
        why: 'Клиент генерирует уникальный ключ операции один раз и отправляет его при каждой попытке. Сервер запоминает результат по ключу и на повтор возвращает его, не проводя оплату второй раз.'
      - text: 'Повторить запрос методом `PUT` вместо `POST`'
        why: 'Смена метода не делает операцию идемпотентной: сервер всё равно проведёт оплату, если не знает, что это повтор.'
      - text: 'Не повторять, а сразу показать ошибку оплаты'
        why: 'Оплата могла пройти: пользователь увидит ошибку при списанных деньгах и, скорее всего, заплатит снова.'
      - text: 'Повторить запрос с увеличенным таймаутом'
        why: 'Длинный таймаут не решает проблему: если первый запрос прошёл, повтор создаст второй платёж.'
    explanation: |
      Таймаут не означает, что запрос не выполнен: он мог дойти и обработаться, а потерялся только ответ.
      Поэтому неидемпотентные операции (оплата, создание заказа) защищают ключом идемпотентности. Клиент
      создаёт UUID при начале операции и повторяет запрос с ним. Сервер атомарно сохраняет ключ с результатом
      и при повторе возвращает сохранённый ответ. Так устроены API Stripe и многих платёжных систем. Для
      пользователя это значит: кнопку «Оплатить» можно нажать дважды, а списание будет одно.
    links:
      - https://docs.stripe.com/api/idempotent_requests
      - https://developer.mozilla.org/en-US/docs/Glossary/Idempotent
    source: own

  - id: network-api-005
    level: middle
    tags: [retries, exponential-backoff, jitter]
    question: |
      Почему повторные запросы после сбоя делают с растущей и слегка случайной задержкой?
    options:
      - text: 'Чтобы клиенты не повторяли запросы одновременно и не добивали сервер'
        correct: true
        why: 'После сбоя тысячи клиентов начинают повторять запросы. Растущая задержка снижает нагрузку, а случайный разброс (jitter) не даёт им приходить синхронными волнами.'
      - text: 'Чтобы истёк таймаут TCP-соединения перед повтором'
        why: 'Повтор открывает новый запрос и не ждёт таймаутов старого соединения. Задержка нужна для снижения нагрузки на сервер.'
      - text: 'Потому что браузер запрещает повторять запрос чаще раза в секунду'
        why: 'Такого ограничения в браузерах нет. Частоту повторов задаёт ваш код.'
      - text: 'Чтобы сервер успел выдать новый токен авторизации'
        why: 'Токены обновляют отдельной логикой при ответе 401. Задержка повторов решает проблему нагрузки.'
    explanation: |
      Экспоненциальная задержка: 1 с, 2 с, 4 с, 8 с… с верхним пределом и ограничением числа попыток. Без неё
      повторы превращают временный сбой в постоянный: сервер, едва поднявшись, получает лавину запросов
      (thundering herd). Случайный разброс размазывает повторы во времени. Повторять стоит только то, что
      безопасно: идемпотентные запросы, сетевые ошибки, `429`, `502`–`504`. Ошибки вроде `400` и `401` повтор
      не исправит. Готовые библиотеки (axios-retry, ретраи в TanStack Query) стоит настраивать: например,
      TanStack Query по умолчанию повторяет любые ошибки, включая `4xx`.
    links:
      - https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/
    source: own

  - id: network-api-006
    level: middle
    tags: [pagination, offset, cursor]
    question: |
      Лента новостей подгружается страницами через `?offset=20&limit=20`. Пока пользователь листает,
      появляются новые посты, и в ленте возникают дубли. Какой подход это решает?
    options:
      - text: 'Курсорная пагинация от последней полученной записи'
        correct: true
        why: 'Курсор привязан к конкретной записи, а не к позиции. Новые посты в начале ленты не сдвигают следующую страницу, и дублей не будет.'
      - text: 'Увеличить `limit`, чтобы страниц стало меньше'
        why: 'Дубли станут реже, но не исчезнут: смещение всё равно поедет при вставке новых записей.'
      - text: 'Кэшировать ответы на клиенте по `offset`'
        why: 'Кэш не исправит то, что та же позиция на сервере теперь указывает на другие записи.'
      - text: 'Передавать `offset` в заголовке, а не в строке запроса'
        why: 'Место, где передан параметр, не меняет того, как сервер вычисляет страницу: смещение всё равно поедет при вставке записей.'
    explanation: |
      Пагинация по смещению (`offset/limit`) проста и позволяет перейти на любую страницу, но ломается на
      часто меняющихся данных. Вставка в начало сдвигает позиции, отсюда дубли, а удаление приводит к
      пропускам. К тому же большой `OFFSET` медленный: базе нужно пропустить все предыдущие строки. Курсорная
      пагинация (`?after=<id или метка времени>`) стабильна и быстра на индексе. Цена — нельзя прыгнуть на
      страницу 50. Для бесконечных лент и API с большими объёмами выбирают курсоры.
    links:
      - https://graphql.org/learn/pagination/
    source: own

  - id: network-api-007
    level: junior
    tags: [fetch, json, Content-Type, no-run]
    question: |
      Сервер ждёт JSON. Что нужно, чтобы этот запрос его отправил?
    code: |
      fetch('/api/users', {
        method: 'POST',
        body: { name: 'Ann' },
      });
    codeLang: js
    options:
      - text: '`JSON.stringify` и заголовок `Content-Type`'
        correct: true
        why: '`fetch` не сериализует объекты сам: объект превратится в строку `[object Object]`. А без заголовка сервер не узнает, что тело — JSON, и может не разобрать его.'
      - text: 'Ничего: `fetch` сам превращает объект в JSON'
        why: 'Это поведение axios, а не `fetch`. `fetch` приводит обычный объект к строке `[object Object]`.'
      - text: 'Только заголовок `Accept: application/json`'
        why: '`Accept` сообщает, в каком формате клиент хочет ответ, и не меняет отправляемое тело.'
      - text: 'Заменить метод на `PUT`'
        why: 'Метод не влияет на сериализацию тела: проблема останется.'
    explanation: |
      `fetch` принимает в `body` строку, `FormData`, `URLSearchParams`, `Blob`, `ArrayBuffer` или поток.
      Обычный объект приводится к строке, и на сервер уйдёт `[object Object]`. Поэтому JSON отправляют так:
      `body: JSON.stringify(data)` и `headers: { 'Content-Type': 'application/json' }`. Для `FormData` и
      `URLSearchParams` заголовок ставить не нужно: браузер выставит его сам, для `FormData` — вместе с
      границей частей (boundary). Поэтому вручную указанный `multipart/form-data` ломает запрос.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API/Using_Fetch#setting_a_body
    source: own

  - id: network-api-008
    level: senior
    tags: [sendBeacon, keepalive, page-lifecycle]
    question: |
      Как надёжно отправить аналитику, когда пользователь закрывает вкладку или уходит со страницы?
    options:
      - text: '`sendBeacon` или `fetch` с `keepalive`'
        correct: true
        why: 'Оба способа ставят запрос в очередь браузера, и он отправляется даже после выгрузки страницы. Событие `visibilitychange` (переход в `hidden`) надёжно срабатывает и на мобильных, в отличие от `unload`.'
      - text: 'Обычный `fetch` в обработчике `unload` с `await`'
        why: 'Обычный запрос прерывается вместе со страницей, а `await` в обработчике выгрузки браузер не ждёт. К тому же `unload` часто не срабатывает на мобильных.'
      - text: 'Синхронный `XMLHttpRequest` в `beforeunload`'
        why: 'Chrome запрещает синхронные запросы при выгрузке страницы, другие браузеры их ограничивают, и они задерживают закрытие страницы.'
      - text: '`setTimeout` с отправкой через секунду после закрытия'
        why: 'После выгрузки страницы её таймеры не выполняются.'
    explanation: |
      Когда страница выгружается, обычные запросы отменяются. Для таких случаев есть
      `navigator.sendBeacon(url, data)` (только `POST`, небольшой объём, ответ недоступен) и `fetch(url, {
      keepalive: true })` (любые методы и заголовки, лимит около 64 КБ на все такие запросы). Момент отправки
      тоже важен: на мобильных пользователь часто сворачивает браузер, и `unload` не наступает. Рекомендуется
      отправлять данные при `visibilitychange` в состояние `hidden` или при `pagehide`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Navigator/sendBeacon
      - https://developer.mozilla.org/en-US/docs/Web/API/Document/visibilitychange_event
    source: own

  - id: network-api-009
    level: middle
    tags: [websocket, upgrade, handshake]
    question: |
      Как устанавливается соединение WebSocket?
    options:
      - text: 'HTTP-запросом с заголовком `Upgrade`'
        correct: true
        why: 'Клиент отправляет `GET` с заголовками `Upgrade: websocket` и `Sec-WebSocket-Key`. Сервер отвечает `101 Switching Protocols`, и то же TCP-соединение дальше работает по протоколу WebSocket.'
      - text: 'Отдельным UDP-соединением в обход HTTP и TCP'
        why: 'WebSocket работает поверх TCP и начинается с обычного HTTP-запроса, поэтому проходит через стандартные порты 80 и 443.'
      - text: 'Через preflight-запрос `OPTIONS`, как в CORS'
        why: 'Preflight не используется. Вместо него сервер сам проверяет заголовок `Origin` при рукопожатии.'
      - text: 'Через Service Worker, который проксирует сообщения'
        why: 'Service Worker не участвует в установке WebSocket и не может перехватывать его сообщения.'
    explanation: |
      Рукопожатие через HTTP позволяет WebSocket работать через те же порты, балансировщики и прокси, что и
      сайт. После ответа `101` соединение становится двунаправленным каналом сообщений (фреймов) с
      минимальными накладными расходами. Важная деталь безопасности: CORS на WebSocket не распространяется, а
      браузер прикладывает cookie, если это позволяют правила `SameSite`. Поэтому сервер обязан проверять
      `Origin`, иначе чужой сайт откроет соединение от имени пользователя (cross-site WebSocket hijacking).
      При обрыве WebSocket сам не переподключается, это делает код приложения.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API/Writing_WebSocket_servers#the_websocket_handshake
    source: own

  - id: network-api-010
    level: senior
    tags: [auth, token-refresh, concurrency]
    question: |
      Access-токен истёк, и пять параллельных запросов одновременно получили `401`. Как правильно обновить
      токен?
    options:
      - text: 'Один запрос на обновление, остальные ждут его промис и повторяются'
        correct: true
        why: 'Обновление выполняется один раз: первый запрос запускает его и сохраняет промис, остальные ждут этот же промис и повторяются с новым токеном. Иначе пять обновлений будут конкурировать, а при ротации refresh-токена часть из них провалится.'
      - text: 'Каждый запрос сам обновляет токен и повторяется'
        why: 'Пять параллельных обновлений нагружают сервер, а при одноразовых refresh-токенах все, кроме первого, получат отказ и разлогинят пользователя.'
      - text: 'Обновлять токен по таймеру раз в минуту, независимо от ответов'
        why: 'Таймер не спасает от истечения в неудачный момент и делает лишние запросы. Обработка `401` всё равно нужна.'
      - text: 'Сразу перенаправить пользователя на страницу входа'
        why: 'Refresh-токен для того и нужен, чтобы продлевать сессию без повторного входа. Перенаправление уместно, только если и обновление не удалось.'
    explanation: |
      Типичная схема: короткий access-токен и долгий refresh-токен. Когда приходит `401`, перехватчик (в
      обёртке над `fetch` или в axios interceptors) проверяет, идёт ли уже обновление. Если нет, запускает его
      и сохраняет промис в общей переменной, если да — ждёт этот промис. После успеха исходные запросы
      повторяются, после неудачи пользователя выводят из системы. Важно не зациклиться: `401` на сам запрос
      обновления не должен запускать новое обновление.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/401
    source: own
