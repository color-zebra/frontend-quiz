questions:
  - id: network-http-001
    level: junior
    tags: [methods, safe-methods]
    question: |
      Какой HTTP-метод считается безопасным, то есть не должен менять состояние на сервере?
    options:
      - text: '`GET`'
        correct: true
        why: '`GET` предназначен только для получения данных. Поэтому браузеры, кэши и поисковые роботы могут свободно повторять и предзагружать такие запросы.'
      - text: '`POST`'
        why: '`POST` создаёт ресурсы или запускает обработку на сервере, то есть меняет состояние.'
      - text: '`DELETE`'
        why: '`DELETE` удаляет ресурс, а это изменение состояния, хотя повторный вызов и даёт тот же итог.'
      - text: '`PATCH`'
        why: '`PATCH` частично изменяет ресурс, поэтому безопасным не считается.'
    explanation: |
      Безопасные методы (safe) по спецификации только читают данные: `GET`, `HEAD`, `OPTIONS`. На это
      полагается вся инфраструктура: браузер повторяет `GET` при обновлении страницы без вопросов, прокси и
      CDN кэшируют ответы, браузеры предзагружают ссылки. Поэтому действие вроде «удалить по ссылке `GET
      /delete?id=5`» опасно: его может вызвать предзагрузка или краулер. Изменения делают методами `POST`,
      `PUT`, `PATCH`, `DELETE`.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/Safe/HTTP
    source: own

  - id: network-http-002
    level: middle
    tags: [methods, idempotency]
    question: |
      Какой метод НЕ является идемпотентным?
    options:
      - text: '`POST`'
        correct: true
        why: 'Каждый `POST /orders` создаёт новый заказ: два одинаковых запроса дают два заказа. Поэтому браузер переспрашивает, прежде чем повторить отправку формы.'
      - text: '`PUT`'
        why: '`PUT` заменяет ресурс целиком данными из запроса. Повторив его, вы получите то же состояние, что после первого раза.'
      - text: '`DELETE`'
        why: 'После первого `DELETE` ресурса нет, и повтор состояние сервера не меняет, даже если вернёт другой статус, например 404.'
      - text: '`GET`'
        why: '`GET` вообще не меняет состояние, поэтому он идемпотентен.'
    explanation: |
      Идемпотентный метод: несколько одинаковых запросов оставляют сервер в том же состоянии, что и один. Это
      `GET`, `HEAD`, `OPTIONS`, `PUT`, `DELETE`. `POST` и, в общем случае, `PATCH` идемпотентными не
      считаются. Свойство важно для повторов: при обрыве соединения идемпотентный запрос можно безопасно
      отправить ещё раз, а `POST` — нет, иначе получится двойная оплата. Для безопасных повторов `POST` нужны
      отдельные приёмы на стороне API.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/Idempotent
    source: own

  - id: network-http-003
    level: junior
    tags: [status-codes, 401, 403]
    question: |
      Пользователь вошёл в систему, но пытается открыть админку без прав администратора. Какой статус
      правильнее вернуть?
    options:
      - text: '`403 Forbidden`'
        correct: true
        why: 'Сервер знает, кто пользователь, но запрещает ему доступ. Повторная аутентификация ничего не изменит.'
      - text: '`401 Unauthorized`'
        why: 'Несмотря на название, 401 означает «не аутентифицирован»: сервер не знает, кто это, и просит войти.'
      - text: '`404 Not Found`'
        why: '404 говорит, что ресурса нет. Его иногда возвращают вместо 403, чтобы скрыть сам факт существования ресурса, но прямой смысл ситуации — запрет.'
      - text: '`400 Bad Request`'
        why: '400 — ошибка в самом запросе: неверный формат, неразборчивое тело. Здесь запрос корректный.'
    explanation: |
      Коды `4xx` означают ошибку на стороне клиента. Самые частые: `400` — запрос некорректен, `401` — нужна
      аутентификация (нет токена или он недействителен), `403` — аутентификация есть, но прав нет, `404` —
      ресурс не найден. Клиенту различие важно: на `401` обычно перенаправляют на вход или обновляют токен, на
      `403` показывают сообщение «нет доступа».
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/403
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/401
    source: own

  - id: network-http-004
    level: junior
    tags: [status-codes, redirects]
    question: |
      Страница навсегда переехала на новый адрес. Какой код ответа вернуть со старого адреса?
    options:
      - text: '`301 Moved Permanently`'
        correct: true
        why: '301 сообщает, что ресурс переехал навсегда. Браузеры и поисковики запоминают новый адрес и переносят на него ссылки.'
      - text: '`302 Found`'
        why: '302 — временное перенаправление: поисковики продолжат индексировать старый адрес.'
      - text: '`304 Not Modified`'
        why: '304 — не перенаправление, а ответ на условный запрос: «твоя копия в кэше актуальна».'
      - text: '`307 Temporary Redirect`'
        why: '307 — тоже временное перенаправление, просто с сохранением метода.'
    explanation: |
      Коды `3xx` перенаправляют клиента по адресу из заголовка `Location`. Они различаются по двум признакам:
      постоянное или временное перенаправление, сохраняется ли метод запроса. 301 и 302 исторически позволяют
      браузеру сменить `POST` на `GET`. 307 (временное) и 308 (постоянное) метод сохраняют. Постоянные
      перенаправления браузер кэширует, поэтому ошибочный 301 потом трудно отменить у пользователей.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Redirections
    source: own

  - id: network-http-005
    level: junior
    tags: [status-codes, 204]
    question: |
      Сервер успешно удалил ресурс и не возвращает тела ответа. Какой статус подходит лучше всего?
    options:
      - text: '`204 No Content`'
        correct: true
        why: '204 означает «запрос выполнен, тела ответа нет». Клиенту не нужно ничего разбирать.'
      - text: '`201 Created`'
        why: '201 отвечают на создание нового ресурса, обычно с заголовком `Location`.'
      - text: '`202 Accepted`'
        why: '202 означает, что запрос принят, но ещё не выполнен, например поставлен в очередь.'
      - text: '`205 Reset Content`'
        why: '205 просит клиента сбросить представление, например очистить форму. Для удаления ресурса он не используется.'
    explanation: |
      Успешные коды `2xx` различают результат: `200` — данные в теле, `201` — создан новый ресурс, `202` —
      принято к асинхронной обработке, `204` — успех без тела. Клиентский код должен это учитывать: вызов
      `response.json()` на ответе `204` бросит ошибку разбора, потому что тело пустое. Поэтому обёртки над
      `fetch` проверяют статус или заголовок `Content-Length`, прежде чем разбирать JSON.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/204
    source: own

  - id: network-http-006
    level: junior
    tags: [status-codes, 409, 422]
    question: |
      Пользователь регистрируется с email, который уже занят другим аккаунтом. Какой статус точнее всего
      описывает ситуацию?
    options:
      - text: '`409 Conflict`'
        correct: true
        why: 'Запрос корректен, но противоречит текущему состоянию сервера: такой email уже есть. Именно для этого предназначен 409.'
      - text: '`404 Not Found`'
        why: 'Ресурс регистрации существует. Проблема не в отсутствии ресурса, а в конфликте данных.'
      - text: '`500 Internal Server Error`'
        why: '500 — ошибка самого сервера. Здесь сервер работает правильно, а проблема в данных клиента.'
      - text: '`401 Unauthorized`'
        why: 'Регистрация не требует входа, и проблема не в аутентификации.'
    explanation: |
      Выбор между `400`, `409` и `422` — частый вопрос при проектировании API. `400` — запрос нельзя разобрать
      или он нарушает формат. `422` — формат правильный, но данные не проходят валидацию: пароль слишком
      короткий, дата в прошлом. `409` — данные корректны сами по себе, но конфликтуют с состоянием сервера:
      занятый email, устаревшая версия документа при одновременном редактировании. Точные коды помогают
      клиенту: на 409 показать «email уже зарегистрирован», на 422 подсветить поля.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/409
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/422
    source: own

  - id: network-http-007
    level: middle
    tags: [status-codes, 429, rate-limiting]
    question: |
      Клиент слишком часто отправляет запросы, и сервер начал их ограничивать. Какой ответ правильный?
    options:
      - text: '`429 Too Many Requests` с заголовком `Retry-After`'
        correct: true
        why: '429 сообщает о превышении лимита, а `Retry-After` говорит, через сколько секунд или после какой даты можно повторить запрос.'
      - text: '`503 Service Unavailable` с заголовком `Location`'
        why: '503 означает, что сервер временно недоступен целиком, например из-за обслуживания. `Location` относится к перенаправлениям.'
      - text: '`403 Forbidden` с заголовком `WWW-Authenticate`'
        why: '403 — запрет доступа по правам, а `WWW-Authenticate` используется с 401 для запроса аутентификации.'
      - text: '`400 Bad Request` с заголовком `Cache-Control`'
        why: 'Сам запрос корректен, проблема в частоте запросов. `Cache-Control` управляет кэшированием, а не повторами.'
    explanation: |
      Ограничение частоты (rate limiting) защищает API от перегрузки и злоупотреблений. Сервер отвечает `429`,
      а клиент должен подождать: не меньше `Retry-After`, если он есть. Многие API также отдают заголовки с
      остатком лимита: исторически `X-RateLimit-Remaining` (как у GitHub), а черновик IETF вводит `RateLimit`,
      чтобы клиент мог притормозить заранее.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/429
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Retry-After
    source: own

  - id: network-http-008
    level: junior
    tags: [headers, content-negotiation]
    question: |
      Каким заголовком клиент сообщает серверу, в каком формате хочет получить ответ?
    options:
      - text: '`Accept`'
        correct: true
        why: '`Accept: application/json` говорит серверу, какие типы содержимого клиент готов принять. Сервер выбирает подходящий и указывает его в `Content-Type` ответа.'
      - text: '`Content-Type`'
        why: '`Content-Type` описывает формат тела того сообщения, в котором он стоит. В запросе — формат отправляемых данных.'
      - text: '`Content-Encoding`'
        why: '`Content-Encoding` указывает сжатие тела ответа, например `gzip` или `br`, а не формат данных.'
      - text: '`Authorization`'
        why: '`Authorization` передаёт учётные данные, например токен, и не связан с форматом ответа.'
    explanation: |
      Согласование содержимого (content negotiation) работает через пары заголовков. Клиент говорит, что он
      умеет: `Accept` (форматы), `Accept-Language` (языки), `Accept-Encoding` (сжатие). Сервер выбирает
      вариант и сообщает его в ответе: `Content-Type`, `Content-Language`, `Content-Encoding`. Путаница
      `Accept` и `Content-Type` — частая ошибка.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Content_negotiation
    source: own

  - id: network-http-009
    level: middle
    tags: [fetch, get-body, output, no-run]
    question: |
      Что выведется в консоль в браузере?
    code: |
      fetch('/api/search', {
        method: 'GET',
        body: JSON.stringify({ query: 'react' }),
      })
        .then(() => console.log('ok'))
        .catch((error) => console.log(error.name));
    codeLang: js
    options:
      - text: '`TypeError`'
        correct: true
        why: 'Спецификация Fetch запрещает тело у `GET` и `HEAD`: создание запроса бросает `TypeError`, промис отклоняется, и запрос не отправляется.'
      - text: '`ok`'
        why: 'До отправки дело не доходит: браузер не исправляет такой запрос и не отбрасывает тело молча, а сразу сообщает об ошибке.'
      - text: '`SyntaxError`'
        why: 'Тело — корректная JSON-строка, разбор здесь не выполняется. Проверка касается самого факта наличия тела у `GET`.'
      - text: '`AbortError`'
        why: '`AbortError` бывает при отмене запроса через `AbortController`. Здесь запрос никто не отменял, он просто некорректен.'
    explanation: |
      У `GET` в HTTP нет определённой семантики тела: серверы, прокси и кэши могут его игнорировать или
      отбрасывать, поэтому `fetch` запрещает тело у `GET` и `HEAD`. Параметры поиска передают в строке
      запроса: `/api/search?query=react`, удобно через `URLSearchParams`. Если параметры сложные и не
      помещаются в URL, используют `POST` для поиска. Строку запроса легко кэшировать и сохранить в закладку,
      и это плюс `GET`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/RequestInit#body
      - https://developer.mozilla.org/en-US/docs/Web/API/URLSearchParams
    source: own

  - id: network-http-010
    level: senior
    tags: [redirects, 303, post-redirect-get]
    question: |
      Сервер обработал отправку формы методом `POST` и хочет перенаправить пользователя на страницу
      результата, чтобы обновление страницы не отправляло форму повторно. Какой код ответа для этого
      предназначен?
    options:
      - text: '`303 See Other`'
        correct: true
        why: '303 явно предписывает перейти по `Location` методом `GET`. После этого в истории браузера остаётся страница результата, и обновление не повторит `POST`.'
      - text: '`307 Temporary Redirect`'
        why: '307 требует сохранить метод и тело запроса. Браузер повторит `POST` на новый адрес, а нужно обратное.'
      - text: '`308 Permanent Redirect`'
        why: '308 тоже сохраняет метод и к тому же постоянный: браузер запомнит перенаправление.'
      - text: '`304 Not Modified`'
        why: '304 не перенаправляет. Это ответ на условный запрос о свежести кэша.'
    explanation: |
      Паттерн Post/Redirect/Get решает проблему повторной отправки формы. Сервер обрабатывает `POST`, отвечает
      `303` с адресом результата, и браузер делает `GET`. Если пользователь обновит страницу, повторится
      только безопасный `GET`. На практике браузеры и после `302` меняют `POST` на `GET`, но это историческое
      поведение, а `303` выражает намерение однозначно. Клиентские приложения с `fetch` получают то же самое:
      `fetch` следует перенаправлению `303` уже методом `GET`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/303
      - https://en.wikipedia.org/wiki/Post/Redirect/Get
    source: own
