# yaml-language-server: $schema=../../schema.json
topic: network
subtopic: transport
questions:
  - id: network-transport-001
    level: junior
    tags: [dns, tcp, tls, navigation]
    question: |
      Пользователь впервые открывает `https://shop.example.com`. В каком порядке происходят шаги до получения
      HTML?
    options:
      - text: 'DNS-запрос → TCP-соединение → TLS-рукопожатие → HTTP-запрос'
        correct: true
        why: 'Сначала нужно узнать IP-адрес по имени, затем установить соединение с этим адресом, договориться о шифровании и только потом отправить сам запрос.'
      - text: 'TCP-соединение → DNS-запрос → TLS-рукопожатие → HTTP-запрос'
        why: 'Соединиться можно только с IP-адресом, а его даёт DNS. Поэтому DNS идёт первым.'
      - text: 'DNS-запрос → TLS-рукопожатие → TCP-соединение → HTTP-запрос'
        why: 'TLS работает поверх уже установленного TCP-соединения, поэтому рукопожатие идёт после него.'
      - text: 'DNS-запрос → HTTP-запрос → TLS-рукопожатие → TCP-соединение'
        why: 'В HTTPS запрос отправляется уже по зашифрованному каналу, то есть после TCP и TLS.'
    explanation: |
      Путь от адреса до страницы: браузер ищет IP по имени (кэш браузера, ОС, затем DNS-резолвер), открывает
      TCP-соединение (тройное рукопожатие), согласует шифрование и проверяет сертификат (TLS), отправляет
      HTTP-запрос, получает HTML и начинает его разбирать. Каждый шаг до запроса стоит как минимум одного
      сетевого прохода туда и обратно (RTT). Поэтому сторонние домены замедляют загрузку, а подсказки
      `dns-prefetch` и `preconnect` позволяют начать эти шаги заранее.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Performance/Guides/How_browsers_work
    source: own

  - id: network-transport-002
    level: middle
    tags: [http1.1, connections, head-of-line-blocking]
    question: |
      Страница со 100 картинками с одного домена отдаётся по HTTP/1.1. Почему картинки грузятся «волнами»?
    options:
      - text: 'Браузер держит около 6 соединений на хост, ответы в них идут по очереди'
        correct: true
        why: 'В HTTP/1.1 одно соединение передаёт один ответ за раз. Браузеры ограничивают число соединений к одному хосту (обычно 6), и остальные запросы ждут освобождения соединения.'
      - text: 'HTTP/1.1 запрещает загружать больше 6 картинок на одной странице'
        why: 'Ограничения на число ресурсов на странице нет: ограничено число одновременных соединений к хосту.'
      - text: 'Сервер отдаёт картинки строго в порядке их появления в HTML'
        why: 'Порядок запросов задаёт браузер, а ожидание возникает из-за занятых соединений, а не из-за порядка в HTML.'
      - text: 'Браузер ждёт загрузки всего CSS, прежде чем запросить следующую картинку'
        why: 'CSS блокирует отрисовку, но не загрузку картинок. Волны возникают из-за ограничения соединений.'
    explanation: |
      В HTTP/1.1 соединение может нести несколько запросов подряд (keep-alive), но ответы идут строго по
      очереди: медленный ответ задерживает все следующие (head-of-line blocking). Чтобы ускориться, браузеры
      открывают несколько соединений к хосту, но не больше примерно шести. Отсюда старые оптимизации вроде
      склейки файлов и спрайтов. HTTP/2 решил проблему мультиплексированием: множество параллельных потоков в
      одном соединении.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Connection_management_in_HTTP_1.x
    source: own

  - id: network-transport-003
    level: senior
    tags: [http2, http3, quic, head-of-line-blocking]
    question: |
      Почему на мобильной сети с потерями пакетов HTTP/2 может работать не лучше HTTP/1.1, и что исправляет
      HTTP/3?
    options:
      - text: 'Потеря пакета в TCP тормозит все потоки; QUIC изолирует их'
        correct: true
        why: 'HTTP/2 мультиплексирует потоки поверх одного TCP, а TCP доставляет байты строго по порядку: потерянный пакет задерживает данные всех потоков. QUIC работает поверх UDP и восстанавливает потерю только в том потоке, которого она касается.'
      - text: 'HTTP/2 не сжимает заголовки; HTTP/3 добавил их сжатие'
        why: 'HTTP/2 сжимает заголовки алгоритмом HPACK, в HTTP/3 используется похожий QPACK. Дело не в сжатии.'
      - text: 'HTTP/2 не поддерживает шифрование; HTTP/3 всегда работает по TLS'
        why: 'Браузеры поддерживают HTTP/2 только поверх TLS. Шифрование не отличает версии в этом сценарии.'
      - text: 'HTTP/2 открывает много соединений; HTTP/3 обходится одним'
        why: 'Наоборот, HTTP/2 использует одно соединение на источник. Проблема как раз в том, что все потоки зависят от него.'
    explanation: |
      HTTP/2 убрал блокировку очереди на уровне HTTP: ответы идут параллельными потоками, нарезанными на
      кадры. Но блокировка осталась уровнем ниже: TCP — упорядоченный поток байтов, и при потере пакета всё,
      что пришло после, ждёт повторной передачи. HTTP/3 работает поверх QUIC — транспорта на UDP со своими
      потоками, встроенным TLS 1.3 и переносом соединения при смене сети (Wi-Fi → мобильная). Кроме того, QUIC
      устанавливает соединение быстрее: рукопожатие транспорта и шифрования совмещено.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/HTTP_3
      - https://developer.mozilla.org/en-US/docs/Glossary/Head_of_line_blocking
    source: own

  - id: network-transport-004
    level: middle
    tags: [http2, domain-sharding, optimization]
    question: |
      Какая оптимизация времён HTTP/1.1 при HTTP/2 обычно вредит?
    options:
      - text: 'Раздача ресурсов с нескольких поддоменов (domain sharding)'
        correct: true
        why: 'Шардинг обходил ограничения HTTP/1.1. В HTTP/2 все запросы и так идут параллельно в одном соединении, а лишние домены добавляют DNS-запросы и рукопожатия и разбивают приоритизацию.'
      - text: 'Сжатие ответов алгоритмами gzip или Brotli'
        why: 'Сжатие полезно при любой версии протокола: оно уменьшает объём передаваемых данных.'
      - text: 'Долгое кэширование статики с хэшем в имени файла'
        why: 'Кэширование не зависит от версии протокола и остаётся главным способом не скачивать ресурсы повторно.'
      - text: 'Раздача статики через CDN ближе к пользователю'
        why: 'CDN сокращает задержку за счёт расстояния, и это помогает при любой версии HTTP.'
    explanation: |
      Многие приёмы HTTP/1.1 были обходом ограничений протокола: шардинг доменов, склейка всех скриптов в один
      огромный файл, спрайты. С HTTP/2 мелкие файлы грузятся параллельно без штрафа, и разбиение на чанки по
      маршрутам даёт лучшее кэширование: изменение одного модуля не сбрасывает весь бандл. При этом совсем
      отказываться от сборки не стоит: тысячи мелких модулей всё равно медленнее из-за накладных расходов.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/Domain_sharding
    source: own

  - id: network-transport-005
    level: junior
    tags: [https, security]
    question: |
      От чего HTTPS НЕ защищает?
    options:
      - text: 'От XSS-уязвимости в коде самого сайта'
        correct: true
        why: 'HTTPS защищает канал между браузером и сервером. Если сайт сам вставляет вредоносный скрипт в страницу, шифрование доставит его так же надёжно, как и полезный код.'
      - text: 'От чтения трафика в публичной сети Wi-Fi'
        why: 'Шифрование как раз не даёт посторонним прочитать данные по пути.'
      - text: 'От подмены содержимого ответа по пути'
        why: 'TLS проверяет целостность: изменённые данные не пройдут проверку.'
      - text: 'От подключения к поддельному серверу'
        why: 'Сертификат подтверждает, что сервер владеет доменом. Поддельный сервер не предъявит действительный сертификат.'
    explanation: |
      TLS даёт три гарантии: конфиденциальность (никто не прочитает данные по пути), целостность (никто не
      изменит их незаметно) и аутентификацию сервера (вы говорите с владельцем домена). Уязвимости приложения
      он не закрывает: XSS, CSRF, утечки через логи, слабые пароли. HTTPS сейчас обязателен: без него
      недоступны многие API браузера (Service Worker, геолокация, буфер обмена), а браузеры помечают такие
      сайты как небезопасные.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/HTTPS
      - https://developer.mozilla.org/en-US/docs/Web/Security/Secure_Contexts
    source: own

  - id: network-transport-006
    level: senior
    tags: [rtt, tls1.3, latency]
    question: |
      Сколько сетевых проходов туда и обратно (RTT) нужно, чтобы отправить первый HTTP-запрос по новому
      соединению TCP с TLS 1.3? IP-адрес уже известен.
    options:
      - text: '2 RTT'
        correct: true
        why: 'Один RTT уходит на тройное рукопожатие TCP, ещё один — на полное рукопожатие TLS 1.3. Запрос отправляется сразу после этого, а ответ придёт ещё через RTT.'
      - text: '1 RTT'
        why: 'Так устанавливается соединение QUIC, где транспорт и шифрование совмещены. Для TCP рукопожатия идут последовательно.'
      - text: '3 RTT'
        why: 'Столько было при TLS 1.2, где полное рукопожатие занимало два прохода. TLS 1.3 сократил его до одного.'
      - text: '0 RTT'
        why: 'Отправка данных без ожидания (0-RTT) возможна только при возобновлении сессии, и то лишь для части данных. Новое TCP-соединение всегда требует рукопожатия.'
    explanation: |
      Задержка (latency) часто важнее пропускной способности: при RTT 100 мс на мобильной сети установка
      соединения отнимает 200 мс ещё до запроса, а с TLS 1.2 — 300 мс. Отсюда ценность повторного
      использования соединений (keep-alive, одно соединение HTTP/2), `preconnect` к нужным доменам, CDN ближе
      к пользователю и HTTP/3, где новое соединение занимает 1 RTT. При возобновлении сессии TLS 1.3 и QUIC
      позволяют отправить первые данные сразу (0-RTT), но злоумышленник может переотправить такие данные
      (replay), поэтому годятся только идемпотентные запросы.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/Round_Trip_Time
      - https://developer.mozilla.org/en-US/docs/Glossary/TLS
    source: own

  - id: network-transport-007
    level: junior
    tags: [http, stateless]
    question: |
      Что значит, что HTTP — протокол без состояния (stateless)?
    options:
      - text: 'Каждый запрос обрабатывается независимо от предыдущих'
        correct: true
        why: 'Сам протокол не связывает запросы между собой. Чтобы сервер узнал пользователя, состояние передают в каждом запросе: cookie, токеном в заголовке, параметрами.'
      - text: 'Сервер не может хранить никаких данных о пользователях'
        why: 'Сервер может хранить что угодно в базе или сессиях. Stateless говорит о протоколе, а не о приложении.'
      - text: 'Соединение закрывается после каждого запроса'
        why: 'Соединения переиспользуются (keep-alive, HTTP/2). Отсутствие состояния касается смысла запросов, а не жизни соединения.'
      - text: 'Ответы нельзя кэшировать'
        why: 'Независимость запросов как раз упрощает кэширование: одинаковый запрос можно обслужить сохранённым ответом.'
    explanation: |
      Отсутствие состояния делает HTTP простым и масштабируемым: любой сервер за балансировщиком может
      обработать любой запрос, если всё нужное есть в нём самом. Сессии надстраивают поверх: сервер выдаёт
      идентификатор в cookie, браузер присылает его с каждым запросом, и сервер находит данные сессии. Или
      токен (например JWT) содержит данные о пользователе и подпись и проверяется без обращения к хранилищу.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview#http_is_stateless_but_not_sessionless
    source: own

  - id: network-transport-008
    level: middle
    tags: [http2, server-push, early-hints]
    question: |
      Какой механизм сейчас используют вместо HTTP/2 Server Push, чтобы браузер начал грузить важные ресурсы
      пораньше?
    options:
      - text: 'Предварительный ответ `103 Early Hints`'
        correct: true
        why: 'Сервер сразу отправляет предварительный ответ с заголовками `Link` (`preload` или `preconnect`), пока готовит основной. Браузер начинает загрузку, но сам решает, нужна ли она: например, ресурс уже может лежать в кэше.'
      - text: 'Расширенный Server Push из HTTP/3'
        why: 'Push формально есть и в спецификации HTTP/3, но браузеры его не реализовали: сервер не знает, что уже лежит в кэше, и тратит канал зря.'
      - text: 'Подсказка `<link rel="prefetch">` в HTML'
        why: '`prefetch` — низкоприоритетная загрузка для следующих переходов. Для ресурсов текущей страницы нужен `preload`, а раньше всего его можно передать через `103 Early Hints`.'
      - text: 'Отдельный WebSocket для передачи статики'
        why: 'WebSocket не участвует в загрузке ресурсов страницы и не кэшируется браузером как статика.'
    explanation: |
      Server Push позволял серверу отправить ресурсы, о которых браузер ещё не просил. На практике он часто
      вредил: сервер не знал, что уже лежит в кэше, и тратил канал на лишнее. Chrome отключил его в 2022 году,
      Firefox — в 2024-м, и практической поддержки не осталось. Его заменили подсказки, оставляющие решение
      браузеру: `<link rel="preload">` в HTML и `103 Early Hints`, когда сервер ещё формирует страницу,
      например ходит в базу.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/103
      - https://developer.chrome.com/blog/removing-push
    source: own

  - id: network-transport-009
    level: junior
    tags: [dns, ttl, caching]
    question: |
      Сайт переехал на сервер с новым IP-адресом. Почему часть пользователей ещё некоторое время попадает на
      старый сервер?
    options:
      - text: 'DNS-записи закэшированы на время их TTL'
        correct: true
        why: 'Резолверы провайдеров, операционная система и браузер хранят ответ DNS столько, сколько указано в TTL записи. Пока он не истёк, новые запросы к DNS-серверу не отправляются.'
      - text: 'У старого сервера остались открытые keep-alive соединения'
        why: 'Открытые соединения действительно какое-то время ведут на старый сервер, но закрываются через секунды или минуты простоя. Массово и надолго удерживает именно кэш DNS.'
      - text: 'CDN продолжает отдавать закэшированные страницы'
        why: 'CDN может отдавать старый контент, но в этом сценарии пользователи попадают именно на старый сервер, а это вопрос разрешения имени.'
      - text: 'Новый IP начинает работать только после перезагрузки компьютера'
        why: 'Перезагрузка лишь очищает часть кэшей. Достаточно дождаться истечения TTL.'
    explanation: |
      DNS — распределённая система с кэшированием на каждом уровне: браузер, операционная система, резолвер
      провайдера или публичный резолвер. Каждая запись имеет TTL — сколько секунд её можно хранить. Перед
      переездом TTL заранее уменьшают, например до 60 секунд, чтобы смена адреса разошлась быстро. Долгий TTL,
      наоборот, ускоряет загрузку: меньше запросов к DNS. Если сайт открывается у одних и не открывается у
      других, первым делом проверяют DNS.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/DNS
      - https://developer.mozilla.org/en-US/docs/Glossary/TTL
    source: own
