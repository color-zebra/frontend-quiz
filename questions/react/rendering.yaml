# yaml-language-server: $schema=../../schema.json
topic: react
subtopic: rendering
questions:
  - id: react-rendering-001
    level: junior
    tags: [re-render]
    question: |
      Что заставляет функциональный компонент отрендериться повторно?
    options:
      - text: 'Изменение его состояния, контекста или рендер родителя'
        correct: true
        why: 'Обновление состояния или прочитанного контекста ставит компонент в очередь на рендер. Когда рендерится родитель, React по умолчанию заново вызывает и всех его детей, даже если их пропсы не изменились.'
      - text: 'Только изменение пропсов, которые он получает от родителя'
        why: 'Без `memo` ребёнок рендерится при каждом рендере родителя, независимо от пропсов. Пропсы сравниваются только у компонентов в `memo`.'
      - text: 'Любое изменение локальной переменной внутри компонента'
        why: 'Обычные переменные пересоздаются при каждом вызове компонента, React не следит за ними. Рендер запускают только обновления состояния (`setState`, `dispatch`, внешнее хранилище) и контекста.'
      - text: 'Изменение значения, записанного в `useRef`'
        why: 'Запись в `ref.current` не вызывает рендера: реф специально сделан для данных, которые не влияют на отображение.'
    explanation: |
      Компонент рендерится в трёх случаях: изменилось его состояние, изменился контекст, который он читает,
      или отрендерился родитель. Последний пункт часто удивляет: React не сравнивает пропсы по умолчанию, а
      просто вызывает детей заново. Рендер — это вызов функции компонента и сравнение результата с прошлым. В
      DOM попадают только реальные отличия. Поэтому лишний рендер обычно дёшев, а оптимизировать его через
      `memo` имеет смысл, когда компонент тяжёлый.
    links:
      - https://react.dev/learn/render-and-commit
    source: own

  - id: react-rendering-002
    level: junior
    tags: [re-render, output]
    question: |
      Что выведется в консоль после одного клика по кнопке?
    code: |
      function Child() {
        console.log('Child');
        return <p>static text</p>;
      }

      function App() {
        const [count, setCount] = useState(0);
        console.log('App', count);
        return (
          <>
            <button onClick={() => setCount(count + 1)}>+</button>
            <Child />
          </>
        );
      }
    codeLang: jsx
    options:
      - text: '`App 1`, `Child`'
        correct: true
        why: 'Клик обновляет состояние `App`, и React вызывает его заново. Вместе с ним рендерится вложенный `Child`: React не проверяет, изменились ли его пропсы.'
      - text: '`App 1`'
        why: 'Ребёнок без `memo` рендерится вместе с родителем. Пропустить его рендер может `memo`.'
      - text: '`Child`, `App 1`'
        why: 'Рендер идёт сверху вниз: сначала вызывается родитель, и только из его результата React узнаёт, что нужно отрендерить `Child`.'
      - text: '`App 0`, `App 1`, `Child`'
        why: '`App 0` выводится при первом монтировании, до клика. После клика компонент вызывается один раз, с новым состоянием.'
    explanation: |
      Рендер распространяется вниз по дереву. React вызывает компонент, чьё состояние изменилось, получает новые
      элементы и рекурсивно рендерит всех потомков. Ребёнок рендерится, даже если у него нет пропсов: React не
      знает, что результат не изменится, пока не вызовет функцию. В DOM текст `static text` при этом не
      меняется, потому что после сравнения отличий нет.
    links:
      - https://react.dev/learn/render-and-commit#step-2-react-renders-your-components
    source: own

  - id: react-rendering-003
    level: middle
    tags: [render-phase, commit-phase]
    question: |
      Что React делает в фазе рендера, в отличие от фазы коммита?
    options:
      - text: 'Вызывает компоненты и вычисляет, что изменилось'
        correct: true
        why: 'Фаза рендера — чистое вычисление: React вызывает функции компонентов и сравнивает новое дерево с прошлым. В DOM в этот момент ничего не меняется.'
      - text: 'Применяет изменения к DOM и вызывает layout-эффекты'
        why: 'Это фаза коммита: React вносит вычисленные изменения в DOM, обновляет рефы и синхронно запускает `useLayoutEffect`.'
      - text: 'Пересчитывает стили и отрисовывает пиксели на экране'
        why: 'Это работа браузера после коммита (layout и paint). React сам пиксели не рисует.'
      - text: 'Запускает эффекты `useEffect` и их функции очистки'
        why: '`useEffect` выполняется после коммита, обычно уже после отрисовки браузером. В фазе рендера эффекты не запускаются.'
    explanation: |
      Обновление в React проходит этапы. Триггер: начальный рендер или изменение состояния. Рендер: React вызывает
      компоненты и строит новое дерево, сравнивая его со старым (reconciliation). Коммит: React применяет
      найденные отличия к DOM, обновляет рефы, вызывает `useLayoutEffect`. Затем браузер отрисовывает экран,
      и React запускает `useEffect`. Фаза рендера может быть прервана и повторена, особенно в concurrent-режиме,
      поэтому она должна быть чистой: без запросов, подписок и изменения внешних переменных.
    links:
      - https://react.dev/learn/render-and-commit
      - https://react.dev/learn/keeping-components-pure
    source: own

  - id: react-rendering-004
    level: middle
    tags: [reconciliation, element-type, output]
    question: |
      Что выведется в консоль после клика по кнопке?
    code: |
      function Input() {
        useEffect(() => {
          console.log('mount Input');
          return () => console.log('unmount Input');
        }, []);
        return <input />;
      }

      function App() {
        const [wide, setWide] = useState(false);
        return (
          <>
            <button onClick={() => setWide(!wide)}>toggle</button>
            {wide ? <section><Input /></section> : <div><Input /></div>}
          </>
        );
      }
    codeLang: jsx
    options:
      - text: '`unmount Input`, `mount Input`'
        correct: true
        why: 'На этой позиции сменился тип элемента: был `div`, стал `section`. React не сравнивает разные типы по содержимому, а удаляет старое поддерево целиком и создаёт новое, вместе со всеми вложенными компонентами.'
      - text: 'Ничего: `Input` остался на том же месте'
        why: 'Совпадение должно быть на каждом уровне дерева. Обёртка сменила тип, поэтому всё её содержимое пересоздаётся.'
      - text: '`mount Input`'
        why: 'Прежде чем смонтировать новый `Input`, React размонтирует старый вместе с его `div`, и функция очистки эффекта выполнится.'
      - text: '`mount Input`, `unmount Input`'
        why: 'Очистка старого компонента выполняется раньше эффектов нового: сначала `unmount`, потом `mount`.'
    explanation: |
      Reconciliation сравнивает деревья по позициям и типам. Тот же тип элемента на той же позиции — React
      обновляет существующий узел и сохраняет состояние компонента. Другой тип (`div` → `section`, `Input` →
      `TextArea`) — React уничтожает старое поддерево, теряя состояние всех вложенных компонентов и DOM-узлов,
      включая фокус и введённый текст, и строит новое. Это эвристика, которая делает сравнение линейным по
      времени. Поэтому условную обёртку лучше делать стилем или атрибутом, а не сменой тега.
    links:
      - https://react.dev/learn/preserving-and-resetting-state#different-components-at-the-same-position-reset-state
    source: own

  - id: react-rendering-005
    level: middle
    tags: [nested-components, remount, output]
    question: |
      Что выведется в консоль после клика по кнопке?
    code: |
      function App() {
        const [count, setCount] = useState(0);

        function Field() {
          useEffect(() => {
            console.log('mount');
            return () => console.log('unmount');
          }, []);
          return <input />;
        }

        return (
          <>
            <button onClick={() => setCount(count + 1)}>+</button>
            <Field />
          </>
        );
      }
    codeLang: jsx
    options:
      - text: '`unmount`, `mount`'
        correct: true
        why: 'При каждом рендере `App` создаётся новая функция `Field`, то есть новый тип компонента. Для React это другой тип на той же позиции, и старый `Field` размонтируется вместе с введённым текстом.'
      - text: 'Ничего: эффект с `[]` выполняется один раз'
        why: 'Пустой массив зависимостей означает «один раз за жизнь экземпляра». Здесь экземпляр каждый раз новый, потому что новый тип компонента.'
      - text: '`mount`'
        why: 'Новый `Field` монтируется только после того, как старый размонтирован, и его очистка выводит `unmount`.'
      - text: '`mount`, `unmount`'
        why: 'React сначала выполняет очистку старого экземпляра, затем эффекты нового.'
    explanation: |
      Тип компонента — это ссылка на функцию. Если объявить компонент внутри другого компонента, при каждом
      рендере родителя создаётся новая функция, и React видит новый тип элемента. Он размонтирует старый
      экземпляр и монтирует новый: теряется состояние, фокус, введённый текст, эффекты перезапускаются.
      Компоненты нужно объявлять на верхнем уровне модуля, а данные родителя передавать через пропсы. Линтер
      `react/no-unstable-nested-components` ловит эту ошибку.
    links:
      - https://react.dev/learn/preserving-and-resetting-state#different-components-at-the-same-position-reset-state
    source: own

  - id: react-rendering-006
    level: senior
    tags: [strict-mode, effects, output]
    question: |
      Что выведется в консоль при монтировании в режиме разработки?
    code: |
      function App() {
        console.log('render');
        useEffect(() => {
          console.log('effect');
          return () => console.log('cleanup');
        }, []);
        return null;
      }

      createRoot(document.getElementById('root')).render(
        <StrictMode>
          <App />
        </StrictMode>,
      );
    codeLang: jsx
    options:
      - text: '`render`, `render`, `effect`, `cleanup`, `effect`'
        correct: true
        why: 'В разработке StrictMode вызывает компонент дважды, чтобы выявить нечистый рендер. Затем эффекты проходят цикл «смонтировать — размонтировать — смонтировать», чтобы проверить, что очистка корректно отменяет эффект.'
      - text: '`render`, `effect`'
        why: 'Так будет в production-сборке. В разработке StrictMode специально повторяет и рендер, и монтирование эффектов.'
      - text: '`render`, `render`, `effect`, `effect`'
        why: 'Перед повторным запуском эффекта StrictMode вызывает его очистку, как при настоящем размонтировании.'
      - text: '`render`, `effect`, `cleanup`, `effect`'
        why: 'Компонент тоже вызывается дважды: двойной рендер проверяет, что функция компонента чистая.'
    explanation: |
      StrictMode в режиме разработки ищет ошибки, которые проявятся позже. Двойной вызов компонентов, инициализаторов
      и функций-обновлений выявляет побочные эффекты в рендере: если результат зависит от числа вызовов, рендер
      нечистый. Цикл «эффект — очистка — эффект» выявляет эффекты без очистки: забытые подписки, таймеры,
      незакрытые соединения. Это моделирует ситуацию, когда React размонтирует и восстанавливает компонент,
      например при возврате на вкладку. В production ничего не повторяется. Правильная реакция на двойной
      эффект — написать очистку, а не отключать StrictMode. В браузере React DevTools может приглушать или
      скрывать логи второго рендера.
    links:
      - https://react.dev/reference/react/StrictMode
    source: own

  - id: react-rendering-007
    level: middle
    tags: [react-element, jsx, output]
    question: |
      Что выведется в консоль?
    code: |
      function Hello() {
        console.log('Hello called');
        return <p>hi</p>;
      }

      const element = <Hello />;
      console.log(typeof element, element.type === Hello);
    codeLang: jsx
    options:
      - text: '`object true`'
        correct: true
        why: 'JSX превращается в вызов `jsx(Hello, {})`, который создаёт объект-описание с полями `type` и `props`. Функцию `Hello` вызовет React, когда будет рендерить этот элемент, а здесь рендера нет.'
      - text: '`Hello called`, затем `object true`'
        why: 'Создание элемента не вызывает компонент. `Hello` выполнится, только если элемент передать в `render` или вернуть из другого компонента.'
      - text: '`function true`'
        why: 'Элемент — не функция, а обычный объект, описывающий, что отрендерить.'
      - text: '`object false`'
        why: 'В поле `type` элемента хранится ссылка на сам компонент, поэтому сравнение с `Hello` даёт `true`.'
    explanation: |
      JSX — синтаксический сахар: `<Hello name="Ann" />` компилируется в `jsx(Hello, { name: 'Ann' })`. Результат —
      React-элемент, лёгкий неизменяемый объект `{ type, props, key, ... }`. Это описание того, что нужно
      показать, а не экземпляр компонента. Вызывать компонент решает React во время рендера. Поэтому
      элементы можно создавать заранее, хранить в переменных и передавать через пропсы, а компоненты нельзя
      вызывать как обычные функции (`Hello()`): тогда их хуки окажутся хуками родителя.
    links:
      - https://react.dev/learn/writing-markup-with-jsx
      - https://react.dev/reference/react/createElement
    source: own

  - id: react-rendering-008
    level: junior
    tags: [jsx, children]
    question: |
      Что из этого компонент НЕ может вернуть из рендера?
    options:
      - text: 'Обычный объект `{ text: "hi" }`'
        correct: true
        why: 'Обычный объект не является ни элементом, ни примитивом, и React не знает, как его показать. Будет ошибка «Objects are not valid as a React child».'
      - text: '`null`'
        why: '`null` — допустимый результат: компонент ничего не отрисует. Так делают условное скрытие.'
      - text: 'Строку `"hello"`'
        why: 'Строки и числа React выводит как текстовые узлы.'
      - text: 'Массив элементов с ключами'
        why: 'Массив допустим: React отрендерит элементы по порядку. Ключи нужны для правильного сопоставления при обновлении.'
    explanation: |
      Компонент может вернуть React-элемент, строку, число, `null`, `undefined`, `boolean`, массив
      или фрагмент. Обычный объект — нет: React не может решить, как его показать.
      Частая причина ошибки — попытка вывести в JSX дату (`{new Date()}`) или ответ API целиком. Нужно выбрать
      поле или преобразовать значение в строку.
    links:
      - https://react.dev/learn/conditional-rendering
    source: own

  - id: react-rendering-009
    level: senior
    tags: [concurrent, render-phase, purity]
    question: |
      Почему результат вызова компонента может так и не попасть на экран?
    options:
      - text: 'Рендер в переходе прервало более срочное обновление'
        correct: true
        why: 'В concurrent-режиме рендер низкоприоритетного обновления можно прервать и выбросить, например если пользователь продолжил печатать. Потом React начнёт его заново с новыми данными.'
      - text: 'React отменяет рендер, если результат совпал с DOM'
        why: 'Если отличий нет, коммит ничего не меняет в DOM, но результат рендера всё равно учтён. Это не прерывание.'
      - text: 'React вызывает компоненты на каждом кадре анимации'
        why: 'Компоненты вызываются в ответ на обновления состояния, пропсов или контекста, а не по кадрам экрана.'
      - text: 'Браузер отбрасывает кадры, если рендер шёл дольше 16 мс'
        why: 'Браузер не знает о рендере React и не отбрасывает его результат. Долгий рендер просто задерживает кадр.'
    explanation: |
      В React 18 и новее рендер может быть прерываемым. Обновления внутри `startTransition` и от
      `useDeferredValue` рендерятся с низким приоритетом, частями, и React проверяет между ними, нет ли более
      срочной работы. Если пришёл ввод, незавершённый рендер выбрасывается и позже начинается заново. Поэтому
      функция компонента может быть вызвана несколько раз, а коммит произойдёт один раз или ни разу. Отсюда
      требование чистоты: побочные эффекты в рендере (запросы, логирование в аналитику, изменение внешних
      переменных) выполнятся лишний раз и в непредсказуемый момент.
    links:
      - https://react.dev/reference/react/useTransition
      - https://react.dev/learn/keeping-components-pure
    source: own

  - id: react-rendering-010
    level: senior
    tags: [render-phase, set-state-in-render]
    question: |
      Что произойдёт, когда родитель передаст новый массив `items`?
    code: |
      function List({ items }) {
        const [prevItems, setPrevItems] = useState(items);
        const [selection, setSelection] = useState(null);

        if (items !== prevItems) {
          setPrevItems(items);
          setSelection(null);
        }

        return <ul>{/* ... */}</ul>;
      }
    codeLang: jsx
    options:
      - text: 'React сразу вызовет `List` заново, до рендера детей'
        correct: true
        why: '`setState` текущего компонента во время его рендера — особый случай. React отбрасывает результат этого вызова и сразу вызывает компонент ещё раз с новым состоянием, не рендеря детей и не трогая DOM.'
      - text: 'Бесконечный цикл: `setState` в рендере вызывает рендер'
        why: 'Цикла нет: после повторного вызова `items === prevItems`, условие ложно, и новых обновлений нет. Цикл был бы при безусловном `setState`.'
      - text: 'Ошибка: `setState` нельзя вызывать во время рендера'
        why: 'Ошибки нет: React допускает такое обновление своего состояния под условием. Для состояния другого компонента он выдал бы предупреждение.'
      - text: 'Обновление выполнится после коммита, как в `useEffect`'
        why: 'Обновление не откладывается: React повторит рендер этого компонента сразу. С `useEffect` экран сначала показал бы устаревший `selection`, а потом перерисовался.'
    explanation: |
      Документация описывает этот приём для случая, когда состояние нужно скорректировать при смене пропса.
      Вызов `setState` своего компонента прямо в рендере, под условием, заставляет React сразу перевызвать
      компонент, ещё до детей и до коммита. Это эффективнее, чем `useEffect`, который сначала покажет
      устаревшие данные, а затем вызовет второй рендер. Но чаще лучше обойтись без этого. Можно вычислять
      значение в рендере, без состояния, или сбрасывать состояние ключом: `<List key={listId} />`.
    links:
      - https://react.dev/learn/you-might-not-need-an-effect#adjusting-some-state-when-a-prop-changes
      - https://react.dev/reference/react/useState#storing-information-from-previous-renders
    source: own

  - id: react-rendering-011
    level: junior
    tags: [conditional-rendering, falsy, output]
    question: |
      Что будет на экране, если список пуст?
    code: |
      function App() {
        const items = [];
        return <div>{items.length && <ul>Список</ul>}</div>;
      }
    codeLang: jsx
    options:
      - text: '`0`'
        correct: true
        why: '`items.length && ...` при длине 0 возвращает сам `0`. Числа React выводит как текст, поэтому на экране появится ноль.'
      - text: 'Пустой `div`'
        why: 'Ничего не рисуют только `null`, `undefined` и `boolean`. Число `0` выводится.'
      - text: 'Пустой список `<ul>`'
        why: 'Оператор `&&` не дошёл до правой части: левая часть ложная, и результатом стала она сама.'
      - text: '`false`'
        why: 'Выражение возвращает не `false`, а исходное значение `0`. Да и `false` React не выводит.'
    explanation: |
      Оператор `&&` возвращает первое ложное значение или последнее, если все истинные. С числом в условии
      это `0`, и React его выводит. Типичный баг: «0» под заголовком пустого списка. Исправления: привести к
      булеву (`items.length > 0 && ...`, `!!items.length && ...`) или использовать тернарный оператор с
      `null`. В React Native такое выражение и вовсе приводит к ошибке: текст вне компонента `<Text>`.
    links:
      - https://react.dev/learn/conditional-rendering#logical-and-operator-
    source: own

  - id: react-rendering-012
    level: middle
    tags: [react-19, metadata, title]
    question: |
      Где окажутся `<title>` и `<meta>` после рендера в React 19?
    code: |
      function BlogPost({ post }) {
        return (
          <article>
            <title>{post.title}</title>
            <meta name="description" content={post.summary} />
            <h1>{post.title}</h1>
          </article>
        );
      }
    codeLang: jsx
    options:
      - text: 'В `<head>` документа'
        correct: true
        why: 'React 19 поднимает теги `<title>`, `<meta>` и `<link>` из любого места дерева в `<head>`. Компонент может объявлять свои метаданные там, где они нужны.'
      - text: 'Внутри `<article>`, как написано в JSX'
        why: 'Так было до React 19: теги оставались в `body` и не всегда влияли на документ, например если в `head` уже был свой `<title>`. Теперь React переносит их в `<head>`.'
      - text: 'Нигде: React выбросит их с предупреждением'
        why: 'React 19 поддерживает эти теги: рендерит их и сам переносит в `head`, без предупреждений.'
      - text: 'В `<head>`, но только при серверном рендеринге'
        why: 'Поднятие работает и при клиентском рендере, и при серверном, и при стриминге.'
    explanation: |
      Раньше метаданные страницы меняли через сторонние библиотеки вроде `react-helmet` или эффектом с
      `document.title`. React 19 делает это сам: `<title>`, `<meta>` и `<link>` рендерятся там, где их объявили, а
      React переносит их в `<head>`. Для таблиц стилей с `precedence` React ещё и управляет порядком и
      ожиданием загрузки. Во фреймворках вроде Next.js по-прежнему удобнее их собственный API метаданных: он
      учитывает вложенные макеты и серверную генерацию.
    links:
      - https://react.dev/blog/2024/12/05/react-19#support-for-metadata-tags
      - https://react.dev/reference/react-dom/components/title
    source: own

  - id: react-rendering-013
    level: junior
    tags: [render, commit, dom, theory]
    question: |
      Компонент отрендерился заново, но вернул ту же разметку, что и в прошлый раз. Что React сделает с DOM?
    options:
      - text: 'Ничего не изменит в DOM'
        correct: true
        why: 'Рендер — это вызов компонента и вычисление нового описания интерфейса. Сравнение не нашло различий, а в DOM попадают только различия, поэтому страница не трогается.'
      - text: 'Пересоздаст DOM-узлы компонента с теми же значениями'
        why: 'Пересоздание узлов было бы дорогим и сбрасывало бы фокус и прокрутку. React меняет только то, что различается.'
      - text: 'Заново запишет все атрибуты и текст, даже совпадающие'
        why: 'Совпадающие атрибуты и текст React не трогает: в коммите применяются только изменения.'
      - text: 'Перерисует всю страницу целиком, начиная с корня'
        why: 'Изменения ограничены поддеревом, которое рендерилось, и внутри него — местами, где нашлись различия.'
    explanation: |
      Ре-рендер компонента и обновление DOM — разные вещи. Рендер дешёвый: React вызывает функцию компонента и
      получает дерево элементов. Затем сравнивает его с прошлым (reconciliation) и в фазе коммита применяет к DOM
      только различия. Поэтому лишний рендер обычно не виден пользователю и стоит лишь времени на вызов
      компонентов. Оптимизировать рендеры через `memo` имеет смысл, когда сам вызов компонента дорогой или
      компонентов очень много.
    links:
      - https://react.dev/learn/render-and-commit
    source: own

  - id: react-rendering-014
    level: middle
    tags: [re-render, ref, setState, theory]
    question: |
      Почему запись нового значения в `ref.current` не обновляет экран, а вызов сеттера состояния обновляет?
    options:
      - text: 'Сеттер планирует рендер, а о записи в реф React не узнаёт'
        correct: true
        why: 'Реф — изменяемый контейнер, о записи в который React не узнаёт. Поэтому в рефы кладут то, что не должно перерисовывать интерфейс: id таймера, DOM-узел, предыдущее значение.'
      - text: 'Запись в `ref.current` применяется асинхронно, и экран обновится позже'
        why: 'Запись в реф происходит сразу и синхронно, но экран не обновится вовсе: рендер никто не запланировал.'
      - text: 'Реф хранит значение только до следующего рендера компонента'
        why: 'Наоборот, реф сохраняет значение между рендерами весь срок жизни компонента. Просто его изменение не вызывает рендер.'
      - text: 'React перерисовывает компонент, но значения рефов в разметку не попадают'
        why: 'Рендера после записи в реф нет вовсе. Если бы он случился по другой причине, свежее значение рефа попало бы в разметку.'
    explanation: |
      Повторный рендер запускают три вещи: обновление собственного состояния через сеттер, рендер родителя и
      изменение прочитанного контекста. Всё остальное React не отслеживает: ни мутации объектов, ни записи в рефы,
      ни локальные переменные. Отсюда два правила: данные, от которых зависит интерфейс, хранятся в состоянии и
      меняются только через сеттер с новым объектом. А значения, которые не должны вызывать рендер, хранятся в
      рефах.
    links:
      - https://react.dev/learn/render-and-commit#step-1-trigger-a-render
      - https://react.dev/learn/referencing-values-with-refs
    source: own
