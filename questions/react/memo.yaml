questions:
  - id: react-memo-001
    level: junior
    tags: [memo]
    question: |
      Что делает обёртка `memo(Component)`?
    options:
      - text: 'Пропускает рендер, если пропсы не изменились'
        correct: true
        why: 'Когда родитель рендерится, React сравнивает каждый проп с прошлым через `Object.is`. Если все равны, компонент не вызывается, и используется прошлый результат.'
      - text: 'Пропускает рендер, если не изменилось состояние'
        why: 'Изменение собственного состояния всегда вызывает рендер, `memo` на это не влияет. Он сравнивает пропсы при рендере родителя.'
      - text: 'Сравнивает пропсы глубоко, по содержимому'
        why: 'Сравнение поверхностное: каждый проп через `Object.is`. Объект с тем же содержимым, но новой ссылкой считается изменённым.'
      - text: 'Запоминает результат вычисления внутри компонента'
        why: 'Это делает хук `useMemo`. `memo` запоминает результат рендера всего компонента для одинаковых пропсов.'
    explanation: |
      По умолчанию ребёнок рендерится вместе с родителем. `memo` добавляет проверку: если пропсы
      поверхностно равны прошлым, рендер пропускается вместе со всем поддеревом. Это оптимизация, а не
      гарантия: React может отрендерить компонент и при равных пропсах. Мемоизация полезна для тяжёлых
      компонентов, которые часто получают одни и те же пропсы. Но сравнение пропсов тоже стоит времени, а
      новые объекты и функции в пропсах делают его бесполезным.
    links:
      - https://react.dev/reference/react/memo
    source: own

  - id: react-memo-002
    level: middle
    tags: [memo, useCallback, output]
    question: |
      Что выведется в консоль после клика по кнопке `inc`?
    code: |
      const Button = memo(function Button({ onClick, label }) {
        console.log('Button', label);
        return <button onClick={onClick}>{label}</button>;
      });

      function App() {
        const [n, setN] = useState(0);
        const increment = useCallback(() => setN((v) => v + 1), []);
        const reset = () => setN(0);
        console.log('App', n);

        return (
          <>
            <Button label="inc" onClick={increment} />
            <Button label="reset" onClick={reset} />
          </>
        );
      }
    codeLang: jsx
    options:
      - text: '`App 1`, `Button reset`'
        correct: true
        why: '`increment` из `useCallback` — та же функция, что и в прошлом рендере, и первая кнопка пропускает рендер. `reset` создаётся заново при каждом рендере, проп меняется, и вторая кнопка рендерится.'
      - text: '`App 1`'
        why: 'Функция `reset` объявлена в теле компонента без `useCallback`, поэтому при каждом рендере это новая ссылка, и `memo` её не пропустит.'
      - text: '`App 1`, `Button inc`, `Button reset`'
        why: 'Кнопка `inc` получает ту же ссылку `increment` и тот же `label`, поэтому `memo` пропускает её рендер.'
      - text: '`App 1`, `Button inc`'
        why: 'Перепутано: стабильная функция у кнопки `inc`, а у кнопки `reset` функция новая при каждом рендере.'
    explanation: |
      `memo` сравнивает пропсы по ссылке. Функции, объекты и массивы, созданные в теле компонента, при каждом
      рендере новые, и одного такого пропа достаточно, чтобы `memo` перестал работать. `useCallback` возвращает
      ту же функцию, пока не изменились зависимости. Здесь зависимостей нет: функция-обновление
      `setN(v => v + 1)` не читает `n`, и это позволяет держать массив пустым. Сеттеры из `useState` и так
      стабильны, их можно не указывать в зависимостях.
    links:
      - https://react.dev/reference/react/useCallback#skipping-re-rendering-of-components
    source: own

  - id: react-memo-003
    level: senior
    tags: [memo, children, output]
    question: |
      Что выведется в консоль после клика?
    code: |
      const Card = memo(function Card({ children }) {
        console.log('Card');
        return <div>{children}</div>;
      });

      function App() {
        const [n, setN] = useState(0);
        console.log('App', n);

        return (
          <>
            <button onClick={() => setN(n + 1)}>+</button>
            <Card>
              <p>static</p>
            </Card>
          </>
        );
      }
    codeLang: jsx
    options:
      - text: '`App 1`, `Card`'
        correct: true
        why: '`children` — тоже проп. JSX `<p>static</p>` создаёт новый объект-элемент при каждом рендере `App`, поэтому сравнение пропсов в `memo` даёт «изменилось».'
      - text: '`App 1`'
        why: 'Содержимое не меняется, но React сравнивает пропсы по ссылке. Элемент `<p>` создаётся заново, и `children` получается новым.'
      - text: '`Card`, `App 1`'
        why: 'Ребёнок не может отрендериться раньше родителя: `Card` вызывается из результата рендера `App`.'
      - text: '`App 1`, `Card`, `Card`'
        why: 'После одного обновления родителя ребёнок рендерится один раз.'
    explanation: |
      Вложенный JSX — это проп `children`, а каждый вызов JSX создаёт новый объект. Поэтому `memo` у компонента,
      который принимает разметку через `children`, почти всегда бесполезен, если родитель рендерится. То же с
      пропсами-элементами (`icon={<Icon />}`) и рендер-функциями. Помогает мемоизация самого элемента
      (`useMemo(() => <p>static</p>, [])`) или перестройка дерева, чтобы часто меняющееся состояние не было
      выше `Card`. React Compiler решает эту проблему автоматически: мемоизирует и элементы JSX.
    links:
      - https://react.dev/reference/react/memo#minimizing-props-changes
    source: own

  - id: react-memo-004
    level: middle
    tags: [useMemo, output]
    question: |
      Что выведется в консоль после клика?
    code: |
      function App() {
        const [n, setN] = useState(0);
        const [query] = useState('a');

        const filtered = useMemo(() => {
          console.log('filter', query);
          return items.filter((item) => item.includes(query));
        }, [query]);

        console.log('App', n);
        return <button onClick={() => setN(n + 1)}>{filtered.length}</button>;
      }

      const items = ['apple', 'banana', 'cherry'];
    codeLang: jsx
    options:
      - text: '`App 1`'
        correct: true
        why: 'Компонент рендерится заново, но зависимость `query` не изменилась, и `useMemo` возвращает сохранённый результат без вызова функции.'
      - text: '`filter a`, `App 1`'
        why: 'Функция в `useMemo` вызывается только при изменении зависимостей. `n` в них не входит.'
      - text: '`App 1`, `filter a`'
        why: '`useMemo` вычисляет значение во время рендера, а не после. Но здесь пересчёта нет вовсе.'
      - text: '`filter a`'
        why: 'Клик меняет состояние, и компонент рендерится заново: `App 1` выведется в любом случае.'
    explanation: |
      `useMemo(fn, deps)` вызывает `fn` при первом рендере и при изменении зависимостей, а в остальных рендерах
      возвращает сохранённое значение. Это помогает в двух случаях. Первый — дорогое вычисление: фильтрация
      большого списка, построение структуры. Второй — стабильная ссылка на объект или массив для `memo`-ребёнка
      или зависимостей эффекта. Для дешёвых вычислений `useMemo` не нужен: проверка зависимостей и хранение
      значения стоят сопоставимо. Документация советует измерять, прежде чем мемоизировать.
    links:
      - https://react.dev/reference/react/useMemo
    source: own

  - id: react-memo-005
    level: junior
    tags: [memo, state, output]
    question: |
      Компонент `Counter` обёрнут в `memo`. Что выведется в консоль после клика по его кнопке?
    code: |
      const Counter = memo(function Counter() {
        const [count, setCount] = useState(0);
        console.log('Counter', count);
        return <button onClick={() => setCount(count + 1)}>{count}</button>;
      });

      function App() {
        console.log('App');
        return <Counter />;
      }
    codeLang: jsx
    options:
      - text: '`Counter 1`'
        correct: true
        why: '`memo` пропускает рендер только тогда, когда его запускает родитель. Изменение собственного состояния рендерит компонент как обычно, а родитель не затрагивается.'
      - text: 'Ничего: `memo` блокирует рендер без новых пропсов'
        why: '`memo` сравнивает пропсы, только когда рендерится родитель. На обновления собственного состояния и контекста он не влияет.'
      - text: '`App`, `Counter 1`'
        why: 'Обновление состояния рендерит только тот компонент, где оно хранится, и его потомков. Родитель не вызывается.'
      - text: '`Counter 0`'
        why: 'После `setCount(count + 1)` новый рендер видит обновлённое значение 1.'
    explanation: |
      Рендер распространяется вниз по дереву от компонента, чьё состояние изменилось. Родители не
      рендерятся. `memo` влияет только на один путь: «родитель отрендерился — нужно ли рендерить меня?».
      Собственное состояние, контекст, который компонент читает, и внешние хранилища через
      `useSyncExternalStore` по-прежнему вызывают рендер. Поэтому `memo` не делает компонент «замороженным»,
      он лишь отсекает лишние рендеры сверху.
    links:
      - https://react.dev/reference/react/memo#updating-a-memoized-component-using-state
    source: own

  - id: react-memo-006
    level: senior
    tags: [memo, arePropsEqual, stale-ui]
    question: |
      Что выведется в консоль после клика и что будет на экране?
    code: |
      const Row = memo(
        function Row({ user }) {
          console.log('Row', user.name);
          return <p>{user.name}</p>;
        },
        (prev, next) => prev.user.id === next.user.id,
      );

      function App() {
        const [n, setN] = useState(0);
        return (
          <>
            <button onClick={() => setN(n + 1)}>+</button>
            <Row user={{ id: 1, name: 'Ann' + n }} />
          </>
        );
      }
    codeLang: jsx
    options:
      - text: 'Ничего, на экране останется устаревшее `Ann0`'
        correct: true
        why: 'Функция сравнения возвращает `true` («пропсы равны»), потому что `id` не изменился. React пропускает рендер `Row`, хотя имя уже другое, и интерфейс показывает старые данные.'
      - text: '`Row Ann1`, на экране `Ann1`'
        why: 'Рендер пропущен: вторая функция `memo` решила, что пропсы равны. Сравнение только по `id` не видит смену имени.'
      - text: '`Row Ann0`, на экране `Ann0`'
        why: 'Компонент не вызывается вовсе, поэтому строка в консоль не выводится.'
      - text: 'Ошибка: функция сравнения должна сравнивать все пропсы'
        why: 'React не проверяет, какие пропсы сравнивает функция. Ответственность за корректность лежит на ней, и неполное сравнение молча даёт устаревший интерфейс.'
    explanation: |
      Второй аргумент `memo` — функция `arePropsEqual(prev, next)`, которая возвращает `true`, если рендер можно
      пропустить. Это мощный, но опасный инструмент. Если сравнить не все пропсы, которые влияют на результат,
      компонент перестанет обновляться. Особенно коварно с функциями: колбэк из старого рендера замкнёт
      устаревшие значения. Документация советует обходиться без собственной функции сравнения: сделать пропсы
      стабильными или передавать примитивы (`name`, `id`) вместо объектов.
    links:
      - https://react.dev/reference/react/memo#specifying-a-custom-comparison-function
    source: own

  - id: react-memo-007
    level: middle
    tags: [children, composition, output]
    question: |
      Что выведется в консоль после клика по кнопке внутри `Wrapper`?
    code: |
      function Child() {
        console.log('Child');
        return null;
      }

      function Wrapper({ children }) {
        const [n, setN] = useState(0);
        console.log('Wrapper', n);
        return (
          <div>
            <button onClick={() => setN(n + 1)}>+</button>
            {children}
          </div>
        );
      }

      function App() {
        return (
          <Wrapper>
            <Child />
          </Wrapper>
        );
      }
    codeLang: jsx
    options:
      - text: '`Wrapper 1`'
        correct: true
        why: 'Элемент `<Child />` создал `App`, а `App` не рендерился. `Wrapper` получил тот же объект в `children`, и React видит, что этот элемент не изменился, поэтому пропускает его рендер.'
      - text: '`Wrapper 1`, `Child`'
        why: 'Child не создаётся заново: его элемент пришёл извне через `children` и остался той же ссылкой, что и в прошлом рендере.'
      - text: '`Child`, `Wrapper 1`'
        why: 'Ребёнок не может рендериться раньше компонента, внутри которого он выводится. И здесь он не рендерится вовсе.'
      - text: 'Ничего: обработчик не вызывает рендер'
        why: '`setN` меняет состояние `Wrapper`, и он рендерится заново.'
    explanation: |
      Рендер компонента вызывает рендер элементов, которые он создаёт сам. Элементы, полученные через пропсы,
      созданы родителем. Если родитель не рендерился, это те же объекты, и React пропускает их без `memo`.
      Приём «поднять содержимое вверх» (lift content up) использует это: компонент с часто меняющимся
      состоянием принимает тяжёлое поддерево через `children` и не тянет его за собой. Похожий приём —
      «опустить состояние вниз», в маленький компонент. Оба часто заменяют `memo`.
    links:
      - https://react.dev/reference/react/memo#minimizing-props-changes
      - https://overreacted.io/before-you-memo/
    source: own

  - id: react-memo-008
    level: middle
    tags: [useCallback]
    question: |
      В каком случае `useCallback` действительно уменьшает число рендеров?
    options:
      - text: 'Функция передаётся в дочерний компонент с `memo`'
        correct: true
        why: '`useCallback` сохраняет ссылку на функцию между рендерами. Это помогает, только если кто-то сравнивает ссылки: `memo`-ребёнок или зависимости эффекта.'
      - text: 'Всегда, потому что функция перестаёт создаваться заново'
        why: 'Функция-аргумент создаётся при каждом рендере в любом случае. `useCallback` лишь возвращает старую, если зависимости не изменились.'
      - text: 'Функция назначена обработчиком DOM-события'
        why: 'DOM-элементы не мемоизируются: React просто обновит обработчик. Стабильная ссылка тут ничего не даёт.'
      - text: 'Функция вызывается только внутри этого же компонента'
        why: 'Если ссылку никто не сравнивает, её стабильность ни на что не влияет, а `useCallback` только добавляет работы.'
    explanation: |
      `useCallback(fn, deps)` — это `useMemo(() => fn, deps)`: он хранит функцию и возвращает её, пока
      зависимости те же. Сама функция при этом всё равно создаётся на каждом рендере и выбрасывается.
      Выигрыш появляется, когда ссылка важна для сравнения: проп `memo`-компонента, зависимость `useEffect` или
      `useMemo`, значение контекста. Без этого `useCallback` не ускоряет код, а только усложняет. С React
      Compiler ручные `useCallback` в большинстве случаев не нужны.
    links:
      - https://react.dev/reference/react/useCallback#should-you-add-usecallback-everywhere
    source: own

  - id: react-memo-009
    level: middle
    tags: [react-compiler]
    question: |
      Что делает React Compiler?
    options:
      - text: 'Автоматически мемоизирует компоненты и значения при сборке'
        correct: true
        why: 'Компилятор анализирует код компонентов и хуков и сам вставляет мемоизацию значений, функций и JSX, как если бы вы расставили `useMemo`, `useCallback` и `memo` вручную.'
      - text: 'Оборачивает каждый компонент в `memo` во время выполнения'
        why: 'Компилятор работает при сборке, а не в рантайме, и мемоизирует не только компоненты целиком, но и отдельные значения, функции и JSX внутри них.'
      - text: 'Удаляет из кода лишние `useEffect`'
        why: 'Компилятор не меняет логику эффектов и не решает, какие из них лишние. Он только добавляет мемоизацию.'
      - text: 'Переводит компоненты на точечные обновления DOM, как сигналы'
        why: 'Модель React не меняется: компоненты по-прежнему рендерятся и сравниваются, компилятор лишь пропускает лишнюю работу.'
    explanation: |
      React Compiler (стабильная версия 1.0 вышла в октябре 2025) — плагин сборки, который мемоизирует
      компоненты и хуки автоматически, причём точнее, чем вручную: даже после условных возвратов и внутри JSX.
      Он рассчитывает, что код соблюдает правила React. Если правило нарушено, например компонент мутирует
      пропсы, компилятор пропускает такой компонент. Ручные `memo`, `useMemo` и `useCallback` с ним нужны
      реже, в основном как явный контроль, например для зависимостей эффектов.
    links:
      - https://react.dev/learn/react-compiler
      - https://react.dev/blog/2025/10/07/react-compiler-1
    source: own

  - id: react-memo-010
    level: middle
    tags: [memo, useMemo, useCallback, theory]
    question: |
      Какие из утверждений о `memo`, `useMemo` и `useCallback` верны?
    options:
      - text: 'По умолчанию `memo` сравнивает каждый проп со старым через `Object.is`'
        correct: true
        why: 'Без второго аргумента сравнение поверхностное: новый объект или функция в пропе, даже с тем же содержимым, считается изменением. Свою функцию сравнения можно передать вторым аргументом.'
      - text: '`useCallback(fn, deps)` — то же самое, что `useMemo(() => fn, deps)`'
        correct: true
        why: '`useCallback` мемоизирует саму функцию, `useMemo` — результат вызова. Для функции это одно и то же.'
      - text: '`useMemo` нужен, чтобы не повторять дорогое вычисление при тех же зависимостях'
        correct: true
        why: 'Ещё его используют для стабильной ссылки на объект, который уходит в `memo`-компонент или в зависимости эффекта.'
      - text: '`useCallback` сам по себе уменьшает число рендеров компонента'
        why: 'Стабильная ссылка на функцию полезна, только если её получатель это проверяет: `memo`-компонент или зависимости эффекта. Иначе это лишняя работа.'
      - text: '`useMemo` можно вызывать внутри условия, если зависимости не меняются'
        why: '`useMemo` — хук и подчиняется общим правилам: вызывается на верхнем уровне компонента в одном и том же порядке, без условий.'
      - text: '`useMemo` гарантирует, что значение никогда не вычислится повторно'
        why: 'Это оптимизация, а не гарантия: React может выбросить кэш, например если компонент приостановился при первом монтировании или в разработке после правки файла. Код должен работать и без `useMemo`.'
    explanation: |
      Три инструмента решают одну задачу — не повторять работу. `memo` пропускает рендер компонента при тех же
      пропсах, `useMemo` — повторное вычисление значения, `useCallback` — создание новой функции. Работают они в
      связке: `memo`-ребёнок бесполезен, если родитель каждый раз передаёт новый объект или функцию. Мемоизация
      не бесплатна (сравнения, память, сложность кода), поэтому её добавляют по замерам. React Compiler делает это
      автоматически при сборке.
