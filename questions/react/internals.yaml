questions:
  - id: react-internals-001
    level: junior
    tags: [virtual-dom, theory]
    question: |
      Что на самом деле представляет собой «виртуальный DOM» в React?
    options:
      - text: 'Дерево обычных JS-объектов, которые описывают, что должно быть на экране'
        correct: true
        why: 'Компонент возвращает элементы — лёгкие объекты вида `{ type, props }`. React сравнивает новое дерево с прошлым и затем точечно меняет настоящий DOM.'
      - text: 'Скрытая копия настоящего DOM, которую браузер сам держит в памяти для React'
        why: 'Браузер ничего такого не хранит: дерево описаний создаёт и держит сам React, это обычные объекты JavaScript.'
      - text: 'Отдельный быстрый движок отрисовки, заменяющий DOM браузера'
        why: 'Рисует по-прежнему браузер. React лишь решает, какие операции с DOM выполнить.'
      - text: 'Теневой DOM (Shadow DOM), в который React рендерит компоненты'
        why: 'Shadow DOM — стандарт веб-компонентов для изоляции разметки и стилей, React его не использует.'
    explanation: |
      Термин «виртуальный DOM» описывает идею: интерфейс описывают данными, а не командами. Компонент при каждом
      рендере возвращает дерево элементов — неизменяемых объектов с типом и пропсами. React сравнивает его с
      прошлым деревом (reconciliation) и выполняет только нужные операции над реальным DOM. Сегодня сами
      разработчики React редко говорят «виртуальный DOM»: важнее не дерево объектов, а модель «описываю, как
      должно быть, а React приводит экран к этому описанию».
    links:
      - https://react.dev/learn/understanding-your-ui-as-a-tree#the-render-tree
      - https://react.dev/learn/render-and-commit
    source: own

  - id: react-internals-002
    level: middle
    tags: [virtual-dom, myths, theory]
    question: |
      Какие из утверждений о виртуальном DOM верны?
    options:
      - text: 'Он позволяет описывать интерфейс декларативно, а не командами'
        correct: true
        why: 'Главная ценность — модель: компонент описывает, каким должен быть экран при этих данных, а как туда прийти, решает React.'
      - text: 'React сравнивает новое описание с тем, что отрисовал в прошлый раз'
        correct: true
        why: 'Новые элементы сравниваются с текущим деревом, которое React хранит у себя, поэтому в DOM уходят только найденные различия.'
      - text: 'Он всегда быстрее, чем точечные изменения DOM, написанные вручную'
        why: 'Ручное точечное изменение не может быть медленнее: React делает те же операции, плюс тратит время на рендер и сравнение. Выигрыш — в удобстве при приемлемой скорости.'
      - text: 'React сравнивает новое дерево с настоящим DOM на странице'
        why: 'Читать DOM дорого, поэтому сравнение идёт с прошлым деревом, которое React хранит у себя.'
      - text: 'Благодаря ему React вообще не обращается к реальному DOM'
        why: 'Обращается: в фазе коммита React создаёт, меняет и удаляет настоящие DOM-узлы. Виртуальное дерево только подсказывает, что именно менять.'
    explanation: |
      Популярный миф «виртуальный DOM быстрее настоящего» неточен. Быстрее всего — сразу точечно изменить нужный
      узел, и никакая прослойка этого не обгонит. Виртуальное дерево даёт другое: можно писать интерфейс как
      функцию от данных, не думая о последовательности операций, и при этом получать разумную скорость — React
      сравнивает описания и применяет к DOM только различия. Поэтому существуют и подходы без виртуального DOM
      (Svelte, Solid), которые вычисляют изменения на этапе компиляции или через сигналы.
    links:
      - https://react.dev/learn/render-and-commit#step-3-react-commits-changes-to-the-dom
    source: own

  - id: react-internals-003
    level: middle
    tags: [reconciliation, heuristics, theory]
    question: |
      Найти минимальное различие между двумя произвольными деревьями — очень дорогая задача. Как React её
      обходит?
    options:
      - text: 'Сравнивает деревья по уровням и опирается на тип элемента и `key`'
        correct: true
        why: 'Две эвристики: элементы разных типов дают разные поддеревья, и их не сравнивают глубже; а `key` подсказывает, какой ребёнок списка каким был раньше. Это сводит работу к одному проходу по дереву.'
      - text: 'Честно ищет минимальную разницу между деревьями, но делает это в отдельном потоке'
        why: 'Честный поиск слишком дорог даже в отдельном потоке, и потоков React не использует. Вместо этого он упрощает задачу эвристиками.'
      - text: 'Сравнивает итоговый HTML двух деревьев как строки'
        why: 'Никакого HTML React при обновлении не строит: сравниваются элементы — объекты с типом, ключом и пропсами.'
      - text: 'Каждый раз пересоздаёт DOM и сравнивает его с прежним'
        why: 'Пересоздавать DOM дорого, и это сбросило бы фокус и состояние элементов. Сравниваются описания, а не DOM.'
    explanation: |
      Общий алгоритм сравнения деревьев требует порядка n³ операций — для тысячи элементов это миллиард.
      Reconciliation в React линейный за счёт двух допущений. Первое: если на месте элемента теперь другой тип,
      React не пытается найти сходство, а заменяет поддерево целиком. Второе: дети списка сопоставляются по `key`,
      а без ключей — по порядку. Допущения иногда «ошибаются» (например, при перестановке без ключей), но на
      практике работают хорошо, а ошибки исправляются правильными ключами.
    links:
      - https://legacy.reactjs.org/docs/reconciliation.html
      - https://react.dev/learn/preserving-and-resetting-state
    source: own

  - id: react-internals-004
    level: middle
    tags: [reconciliation, element-type, position, theory]
    question: |
      Почему при переключении `{isAdmin ? <Panel role="admin" /> : <Panel role="user" />}` состояние `Panel`
      НЕ сбрасывается, хотя в коде это два разных JSX-элемента?
    options:
      - text: 'На этом месте дерева тот же тип `Panel`, и React только обновит пропсы'
        correct: true
        why: 'React сравнивает не текст JSX, а тип и позицию. В обеих ветках на одном месте стоит `Panel`, поэтому это для него один и тот же компонент с новым `role`. Чтобы сбросить состояние, нужен разный `key`.'
      - text: 'React запоминает оба экземпляра тернарника и переключается между ними'
        why: 'Второго экземпляра нет: на позиции всегда ровно один компонент. Отдельные экземпляры получились бы только с разными ключами или позициями.'
      - text: 'Состояние хранится в пропе `role` и поэтому переживает переключение'
        why: 'Пропсы и состояние — разные вещи. `role` приходит снаружи, а состояние живёт в узле дерева и сохраняется, потому что узел тот же.'
      - text: 'React сравнивает итоговую HTML-разметку, а она у веток одинаковая'
        why: 'HTML React не сравнивает, да и разметка может отличаться. Решают тип элемента, позиция и ключ.'
    explanation: |
      Для reconciliation важно, что окажется на конкретном месте дерева: тип и ключ. Две ветки тернарника с одним
      компонентом — это одна позиция с одним типом, и React просто обновит пропсы, сохранив состояние. Иногда это
      ловушка: форма редактирования разных пользователей сохраняет ввод при переключении. Тогда добавляют
      `key`, например `<Panel key={role} role={role} />`, и React создаст компонент заново.
    links:
      - https://react.dev/learn/preserving-and-resetting-state#same-component-at-the-same-position-preserves-state
    source: own

  - id: react-internals-005
    level: senior
    tags: [reconciliation, position, conditional-rendering, theory]
    question: |
      Подсказку и форму собрали массивом и отфильтровали пустые значения. Что станет с введёнными в `Form`
      данными, когда `showHint` сменится на `true`?
    code: |
      <div>
        {[showHint && <Hint />, <Form />].filter(Boolean)}
      </div>
    codeLang: jsx
    options:
      - text: 'Пропадут, потому что `Form` сместится на вторую позицию и создастся заново'
        correct: true
        why: 'Без ключей дети массива сопоставляются по индексу. Раньше `Form` был первым, теперь первым стал `Hint` другого типа: React размонтирует старый `Form` и смонтирует новый на второй позиции. Заодно React предупредит об отсутствии ключей.'
      - text: 'Сохранятся, потому что React найдёт `Form` среди детей по типу'
        why: 'Поиска по типу среди соседей нет: без ключей React сравнивает элементы на одинаковых позициях.'
      - text: 'Сохранятся, потому что состояние полей живёт в DOM-узлах и переживает перестановку'
        why: 'Состояние React хранится в его дереве, а при пересоздании компонента React создаёт и новые DOM-узлы, так что пропадёт и введённый текст.'
      - text: 'Сохранятся, потому что React откладывает вставку подсказки до конца рендера'
        why: 'Ничего не откладывается: в новом рендере у массива другой состав, и позиции сдвигаются.'
    explanation: |
      Условный рендер через `&&` прямо в JSX оставляет на месте элемента `false`, и соседи не сдвигаются. Но если
      собрать детей массивом и выкинуть пустые значения через `filter`, позиции начинают зависеть от данных:
      появилась подсказка — форма уехала на вторую позицию. Без ключей React сопоставляет детей массива по индексу,
      поэтому компонент на новой позиции для него новый. Лечится ключами (`<Form key="form" />`) или стабильной
      структурой без фильтрации.
    links:
      - https://react.dev/learn/preserving-and-resetting-state#same-component-at-the-same-position-preserves-state
      - https://react.dev/learn/rendering-lists#keeping-list-items-in-order-with-key
    source: own

  - id: react-internals-006
    level: middle
    tags: [state-preservation, key, position, theory]
    question: |
      Какие изменения сбросят состояние компонента?
    options:
      - text: 'Изменение его `key`'
        correct: true
        why: 'Новый ключ для React — новый компонент: старый размонтируется, новый смонтируется с нуля.'
      - text: 'Рендер на этом месте компонента другого типа'
        correct: true
        why: 'Другой тип на той же позиции — старое поддерево уничтожается вместе с состоянием.'
      - text: 'Перенос компонента внутрь другой обёртки, например из `<div>` в `<section>`'
        correct: true
        why: 'Смена типа родителя пересоздаёт всё его поддерево, поэтому и компонент внутри создастся заново, со сброшенным состоянием.'
      - text: 'Повторный рендер родителя'
        why: 'Рендер родителя рендерит ребёнка заново, но не создаёт его заново: состояние остаётся.'
      - text: 'Изменение значения контекста, который читает компонент'
        why: 'Изменение контекста вызывает рендер потребителя, но не пересоздаёт его: состояние сохраняется.'
    explanation: |
      React хранит состояние не «в компоненте», а в узле дерева, который определяется позицией, типом и ключом.
      Пока все три совпадают между рендерами, состояние сохраняется, какие бы пропсы ни пришли. Меняется что-то
      из этого — узел создаётся заново. Отсюда частая ловушка: `useState(props.initial)` не реагирует на новые
      пропсы, потому что начальное значение читается только при создании. А когда сброс нужен, его делают
      ключом.
    links:
      - https://react.dev/learn/preserving-and-resetting-state
    source: own

  - id: react-internals-007
    level: junior
    tags: [state, hooks-order, tree, theory]
    question: |
      Где React хранит значение, которое возвращает `useState`?
    options:
      - text: 'Во внутреннем узле дерева для этого экземпляра, по порядку хуков'
        correct: true
        why: 'Функция компонента после рендера завершается, и её переменные исчезают. Состояние живёт в структуре, которую React держит для этого экземпляра компонента, и выдаётся хукам по очереди.'
      - text: 'В локальной переменной функции компонента, которая сохраняется между вызовами'
        why: 'Локальные переменные исчезают после каждого вызова функции. Поэтому и нужен `useState`.'
      - text: 'В глобальном объекте `window` под именем компонента'
        why: 'Никаких глобальных записей нет: у каждого экземпляра компонента своё состояние.'
      - text: 'В `localStorage`, чтобы оно пережило перезагрузку'
        why: 'Состояние живёт только в памяти и пропадает при перезагрузке страницы.'
    explanation: |
      Для каждого экземпляра компонента на экране React держит внутренний узел, и в нём — список ячеек хуков.
      При рендере первый вызов `useState` получает первую ячейку, второй — вторую и так далее. Именно поэтому
      хуки нельзя вызывать в условиях и циклах: порядок сломается, и хук получит чужую ячейку. И поэтому два
      одинаковых компонента в разных местах дерева имеют независимое состояние: ячейки у них разные.
    links:
      - https://react.dev/learn/state-a-components-memory#how-does-react-know-which-state-to-return
    source: own

  - id: react-internals-008
    level: junior
    tags: [fiber, theory]
    question: |
      Какую проблему решала архитектура Fiber, появившаяся в React 16?
    options:
      - text: 'Рендер шёл одним непрерываемым проходом, и большое обновление подвешивало интерфейс'
        correct: true
        why: 'Пока шло обновление, браузер не обрабатывал ввод и не рисовал кадры. Fiber переписал ядро так, чтобы работу можно было делить на части и прерывать.'
      - text: 'React не умел обновлять DOM точечно и при каждом обновлении перерисовывал страницу целиком'
        why: 'Точечное обновление DOM было и до Fiber. Проблема была в том, что вычисление изменений нельзя было прервать.'
      - text: 'Компоненты не могли хранить состояние без классов'
        why: 'Это решили хуки в React 16.8. Fiber — про устройство самого рендера, а не про API компонентов.'
      - text: 'JSX приходилось компилировать прямо в браузере'
        why: 'JSX компилируют при сборке и до, и после Fiber. Это не связано с устройством рендера.'
    explanation: |
      До React 16 рендер был рекурсивным: React вызывал компоненты сверху вниз и не мог остановиться, пока не
      обойдёт всё поддерево. На больших обновлениях это занимало десятки миллисекунд, и ввод «залипал». Fiber
      переписал ядро так, что работа над деревом делится на единицы — по одной на компонент, — и между ними React
      может проверить, не пора ли уступить браузеру. В React 16 эту возможность заложили, но не включили: рендер
      по-прежнему шёл целиком. Уступать браузеру React начал с конкурентных возможностей React 18. На этой основе
      построены приоритеты, переходы, Suspense, конкурентный рендер.
    links:
      - https://github.com/acdlite/react-fiber-architecture
      - https://legacy.reactjs.org/blog/2017/09/26/react-v16.0.html
    source: own

  - id: react-internals-009
    level: middle
    tags: [fiber, element, theory]
    question: |
      Чем элемент React (то, что возвращает JSX) отличается от Fiber-узла?
    options:
      - text: 'Элемент — одноразовое описание, а Fiber-узел живёт между рендерами'
        correct: true
        why: 'Каждый рендер создаёт новые элементы и тут же их выбрасывает. Fiber-узел создаётся при монтировании компонента и обновляется, пока компонент на экране: в нём состояние, эффекты, ссылка на DOM.'
      - text: 'Это одно и то же, «Fiber» — просто новое название элемента'
        why: 'Это разные сущности: элемент описывает «что хочу видеть», Fiber-узел — внутренняя запись React о том, что уже есть.'
      - text: 'Элемент живёт дольше, а Fiber создаётся заново на каждый рендер'
        why: 'Наоборот: элементы одноразовые, а Fiber-узлы переиспользуются между рендерами.'
      - text: 'Элемент хранит состояние хуков, а Fiber — только пропсы'
        why: 'Наоборот: элемент — неизменяемый объект с типом, пропсами и ключом, а состояние хуков хранит Fiber-узел.'
    explanation: |
      Удобная аналогия — чертёж и здание. Элемент `<Button color="red" />` — чертёж: лёгкий неизменяемый объект,
      который компонент возвращает при каждом рендере. Fiber-узел — здание: долгоживущий объект для конкретного
      экземпляра на экране. При рендере React сравнивает новый чертёж с текущим зданием и решает, что
      перестроить. Поэтому создавать элементы дёшево, а «где живёт состояние» — вопрос про Fiber-узлы.
    links:
      - https://github.com/acdlite/react-fiber-architecture
      - https://react.dev/learn/understanding-your-ui-as-a-tree#the-render-tree
    source: own

  - id: react-internals-011
    level: middle
    tags: [fiber, linked-list, interruptible, theory]
    question: |
      Почему дерево Fiber связано ссылками «ребёнок → сосед → родитель», а не обходится рекурсивными вызовами?
    options:
      - text: 'По ссылкам можно остановиться на любом узле и потом продолжить с него'
        correct: true
        why: 'При рекурсии путь хранится в стеке вызовов JavaScript, и его не сохранить на потом. При обходе по ссылкам достаточно запомнить текущий узел, чтобы уступить браузеру и вернуться позже.'
      - text: 'Так дерево занимает меньше памяти, чем объекты, где дети лежат в массиве'
        why: 'Экономия памяти не была целью. Главное — возможность прервать обход и продолжить его.'
      - text: 'Рекурсия в JavaScript медленнее цикла, и Fiber нужен ради скорости'
        why: 'Скорость не была целью: обход по ссылкам не быстрее рекурсии. Главное — возможность прервать обход и продолжить его.'
      - text: 'Иначе React не смог бы рендерить списки с ключами'
        why: 'Ключи работали и в старом рекурсивном механизме. Ссылочная структура нужна для прерываемости.'
    explanation: |
      Это главная техническая идея Fiber. Рекурсивный обход хранит «где я сейчас» в стеке вызовов, а стек
      принадлежит движку JavaScript: из него нельзя выйти на середине и потом вернуться. Fiber заменил стек
      вызовов собственной структурой: у каждого узла есть ссылки на первого ребёнка, следующего соседа и
      родителя. Обход — простой цикл, и состояние обхода — один указатель на текущий узел. Его можно сохранить,
      отдать управление браузеру и продолжить, либо выбросить и начать заново.
    links:
      - https://github.com/acdlite/react-fiber-architecture#what-is-a-fiber
    source: own

  - id: react-internals-012
    level: middle
    tags: [fiber, double-buffering, theory]
    question: |
      Зачем React держит две версии дерева: ту, что сейчас на экране, и черновую, над которой идёт работа?
    options:
      - text: 'Чтобы готовить обновление за кадром и при необходимости его выбросить'
        correct: true
        why: 'Пока черновик не готов, на экране целая прежняя версия. Работу можно отложить или бросить, если пришло более срочное обновление, и пользователь не увидит полусобранный интерфейс. После коммита черновик становится текущим деревом.'
      - text: 'Чтобы сравнивать черновик с реальным DOM и находить различия'
        why: 'Реальный DOM React для сравнения не читает: различия ищутся между черновиком и текущим деревом.'
      - text: 'Чтобы один экземпляр компонента отображался в двух местах страницы'
        why: 'Каждое место в дереве — отдельный экземпляр со своим узлом. Вторая версия нужна для подготовки обновлений.'
      - text: 'Чтобы хранить историю состояний и отменять обновления по Ctrl+Z'
        why: 'Историю React не хранит. Вторая версия дерева нужна, чтобы готовить следующее обновление, не трогая показанное.'
    explanation: |
      Приём похож на двойную буферизацию в графике: пока один кадр показан, следующий рисуется за кадром. Текущее
      дерево отражает то, что на экране. Черновое собирается при рендере, и его можно сколько угодно менять —
      пользователь его не видит. Когда работа закончена, коммит применяет изменения к DOM, и черновое дерево
      становится текущим. Без этого прерываемый рендер был бы
      невозможен: изменения в живом дереве на середине показали бы рассогласованный интерфейс.
    links:
      - https://github.com/acdlite/react-fiber-architecture
    source: own

  - id: react-internals-013
    level: middle
    tags: [render-phase, commit-phase, interruptible, theory]
    question: |
      Какие из утверждений о том, что React может прервать, верны?
    options:
      - text: 'Рендер несрочного обновления можно приостановить или выбросить'
        correct: true
        why: 'Рендер в переходе или с отложенным значением идёт кусками, и между ними React может переключиться на срочную работу.'
      - text: 'Коммит выполняется синхронно и целиком, без пауз'
        correct: true
        why: 'Коммит меняет настоящий DOM. Прервать его посередине — значит показать пользователю частично обновлённую страницу.'
      - text: 'Срочное обновление (например, ввод в поле) рендерится без уступок браузеру'
        correct: true
        why: 'Срочные обновления React делает сразу и до конца: пользователь должен увидеть результат ввода немедленно.'
      - text: 'Рендер, прерванный срочным обновлением, всегда продолжается с того же места'
        why: 'После срочного обновления данные другие, поэтому React начинает несрочный рендер заново с актуальным состоянием.'
      - text: 'Эффекты `useLayoutEffect` могут выполниться для рендера, который потом выбросили'
        why: 'Эффекты запускаются только в коммите, а выброшенный рендер до коммита не доходит. Поэтому побочные эффекты держат в эффектах, а не в теле компонента.'
    explanation: |
      У обновления две фазы. Рендер — вызов компонентов и вычисление изменений, без побочных эффектов: его можно
      делать кусками, откладывать и выбрасывать, поэтому компоненты обязаны быть чистыми. Коммит — применение
      изменений к DOM и запуск эффектов: он должен пройти целиком, иначе интерфейс окажется рассогласованным.
      Прерываемость включается в первую очередь для несрочных обновлений — переходов и отложенных значений.
    links:
      - https://react.dev/learn/render-and-commit
      - https://react.dev/reference/react/useTransition
    source: own

  - id: react-internals-014
    level: middle
    tags: [render-phase, commit-phase, refs, theory]
    question: |
      Почему нельзя во время рендера читать `ref.current`, например чтобы узнать ширину DOM-элемента?
    options:
      - text: 'В рендере DOM ещё не обновлён, а рефы заполняются только в коммите'
        correct: true
        why: 'Рендер лишь вычисляет, каким должен быть интерфейс. DOM меняется и рефы получают узлы в коммите, поэтому при первом рендере там `null`, а при следующих — прошлое состояние DOM. Размеры читают в `useLayoutEffect` или обработчиках.'
      - text: 'React запрещает рефы на DOM-элементы в функциональных компонентах'
        why: 'Рефы на DOM работают в функциональных компонентах через `useRef`. Ограничение только в том, когда их читать.'
      - text: 'Чтение `ref.current` в рендере вызывает бесконечный цикл рендеров'
        why: 'Само чтение рендер не вызывает. Проблема в том, что значение ещё не то: DOM не обновлён.'
      - text: '`ref.current` в рендере всегда равен `null`, даже после монтирования'
        why: 'Не всегда: в повторных рендерах там узел из прошлого коммита. Просто он отражает прошлое состояние DOM, а не то, что React сейчас вычисляет.'
    explanation: |
      Разделение на фазы определяет, что где доступно. Рендер должен быть чистым вычислением: React может вызвать
      его несколько раз или выбросить результат, и настоящего DOM для нового состояния ещё нет. Коммит применяет
      изменения к DOM, расставляет рефы и запускает `useLayoutEffect` до отрисовки, а `useEffect` — обычно после.
      Поэтому чтение DOM и рефов — в эффектах и обработчиках событий, а не в теле компонента.
    links:
      - https://react.dev/learn/referencing-values-with-refs#best-practices-for-refs
      - https://react.dev/learn/manipulating-the-dom-with-refs#when-react-attaches-the-refs
    source: own

  - id: react-internals-015
    level: senior
    tags: [time-slicing, heavy-component, theory]
    question: |
      Тяжёлый компонент рендерится 200 мс. Почему интерфейс подвисает, даже если обновление обёрнуто в
      `startTransition`?
    options:
      - text: 'React уступает браузеру только между компонентами, а не посреди вызова одного'
        correct: true
        why: 'Прерываемость работает на уровне узлов дерева. Вызов функции компонента — обычный синхронный JavaScript, и пока он идёт, React не может отдать управление. Такой компонент делят на части или ускоряют.'
      - text: '`startTransition` работает только для запросов к серверу'
        why: 'Переход — механизм приоритетов рендера, сервер для него не нужен.'
      - text: 'Переходы прерываемы только в продакшен-сборке'
        why: 'Прерываемость одинаково работает в разработке и продакшене. Дело в устройстве самого компонента.'
      - text: 'Переход всегда выполняется синхронно и без пауз, если внутри нет ни одного `await`'
        why: 'Рендер в переходе прерываем и без `await`, но только между компонентами.'
    explanation: |
      Конкурентный рендер делит работу на единицы по одному компоненту. Между ними React проверяет, не пора ли
      уступить браузеру — обычно каждые несколько миллисекунд. Но внутрь функции компонента он заглянуть не может:
      если она сама считает 200 мс, это 200 мс без уступок. Поэтому переходы хорошо помогают, когда тяжесть в
      количестве компонентов (длинный список), и плохо — когда тяжёл один компонент. Тогда помогает мемоизация,
      виртуализация списка или вынос вычислений в Web Worker.
    links:
      - https://react.dev/reference/react/useTransition
    source: own

  - id: react-internals-016
    level: senior
    tags: [bailout, children, memo, theory]
    question: |
      Почему приём «передать дочерние элементы через `children`» спасает их от лишних рендеров при обновлении
      состояния обёртки?
    options:
      - text: 'Элемент из `children` создан выше и не меняется, поддерево пропускается'
        correct: true
        why: 'Когда обёртка рендерится, `children` — тот же объект элемента, что и раньше: его создал родитель, который не рендерился. Видя тот же элемент на том же месте, React не вызывает компонент заново.'
      - text: 'Компоненты, переданные в `children`, автоматически оборачиваются React в `memo`'
        why: 'Никакой автоматической обёртки нет. Работает то, что элемент в `children` не пересоздаётся.'
      - text: 'Проп `children` React не передаёт при повторных рендерах'
        why: '`children` передаётся при каждом рендере, просто это тот же самый объект, что и раньше.'
      - text: 'Дети рендерятся только при монтировании обёртки'
        why: 'Дети рендерятся каждый раз, когда меняется их элемент или их собственное состояние. Здесь элемент не меняется.'
    explanation: |
      Обычно рендер родителя рендерит и всех детей: при каждом вызове он создаёт новые элементы. Но если элемент
      пришёл через `children` или другой проп, его создал компонент выше, и при рендере обёртки он остаётся тем
      же объектом. React видит на месте ребёнка тот же элемент с тем же состоянием и контекстом и пропускает всё
      поддерево (bailout), даже без `memo`. Поэтому состояние стараются держать как можно ниже, а тяжёлые части
      передают «сверху» через `children`.
    links:
      - https://react.dev/reference/react/memo#should-you-add-memo-everywhere
    source: own

  - id: react-internals-017
    level: senior
    tags: [starvation, priorities, theory]
    question: |
      Пользователь печатает без остановки, и каждое нажатие — срочное обновление. Что не даст несрочному рендеру
      из перехода откладываться бесконечно?
    options:
      - text: 'Отложенная работа со временем становится срочной, и React её доделает'
        correct: true
        why: 'React помнит, как долго ждёт каждое обновление. Если несрочное ждёт слишком долго, его приоритет поднимается, и оно выполняется без прерываний. Это защита от «голодания».'
      - text: 'Браузер сам принудительно запускает отложенные рендеры раз в секунду'
        why: 'Браузер ничего не знает о рендерах React: приоритеты целиком на стороне React.'
      - text: 'Ничего, переход дождётся паузы в наборе текста'
        why: 'Без защиты так и было бы, но React поднимает приоритет давно ждущей работы.'
      - text: 'После десяти прерываний переход отменяется и больше не повторяется'
        why: 'Переходы не отменяются по счётчику: последнее состояние обязательно будет отрендерено.'
    explanation: |
      Система приоритетов опасна известной проблемой — голоданием (starvation): если срочная работа идёт
      непрерывно, несрочная может не выполниться никогда. Планировщик React учитывает время ожидания: у каждого
      обновления есть срок, и просроченная работа становится срочной. Поэтому даже при непрерывном вводе
      результаты фильтра рано или поздно появятся. Точные сроки — деталь реализации, важен сам принцип.
    links:
      - https://react.dev/blog/2022/03/29/react-v18#what-is-concurrent-react
    source: own

  - id: react-internals-018
    level: middle
    tags: [fiber, capabilities, theory]
    question: |
      Какие возможности React стали возможны или появились благодаря переходу на Fiber?
    options:
      - text: 'Прерываемый рендер и приоритеты обновлений'
        correct: true
        why: 'Это прямое следствие Fiber: работа разбита на единицы, между ними можно переключаться.'
      - text: 'Suspense с показом заглушки до готовности данных или кода'
        correct: true
        why: 'Чтобы «отложить» часть дерева и показать заглушку, нужна возможность бросить начатую работу и вернуться к ней позже.'
      - text: 'Выборочная гидратация, при которой страница оживает по частям'
        correct: true
        why: 'Гидрировать границы Suspense по отдельности и менять их порядок по действиям пользователя можно только с прерываемой работой над деревом.'
      - text: 'Синтаксис JSX для описания разметки прямо в JavaScript'
        why: 'JSX существовал с первой версии React и не зависит от устройства рендера.'
      - text: 'Однонаправленный поток данных от родителей к детям через пропсы'
        why: 'Передача данных сверху вниз была принципом React с самого начала.'
    explanation: |
      Fiber вышел в React 16 почти незаметно для пользователей API, но открыл дорогу многим возможностям. Сразу
      появились границы ошибок, порталы и возврат массивов из рендера. Позже на той же основе построили
      Suspense, переходы, `useDeferredValue`, выборочную гидратацию, `<Activity>`. Хуки тоже опираются на
      Fiber-узлы как место хранения состояния, но сами по себе — это API, а не следствие прерываемости.
    links:
      - https://legacy.reactjs.org/blog/2017/09/26/react-v16.0.html
    source: own

  - id: react-internals-019
    level: middle
    tags: [concurrent, theory]
    question: |
      Что означает «конкурентный рендер» (concurrent rendering) в React?
    options:
      - text: 'React может начать рендер, приостановить его и переключиться на более важную работу'
        correct: true
        why: 'Несколько обновлений могут быть «в работе» одновременно, но выполняются по очереди в одном потоке. Главное — рендер больше не обязан идти от начала до конца без остановки.'
      - text: 'Компоненты рендерятся параллельно в нескольких потоках процессора'
        why: 'JavaScript страницы по-прежнему однопоточный, и React не использует отдельные потоки для рендера.'
      - text: 'Несколько копий приложения рендерятся и соревнуются, какая быстрее'
        why: 'Копий приложения нет. Конкурентность — про очерёдность и прерываемость работы над одним деревом.'
      - text: 'Рендер переносится на сервер, а браузер только показывает готовый результат с задержкой'
        why: 'Это серверный рендеринг, отдельная тема. Конкурентный рендер работает и полностью на клиенте.'
    explanation: |
      «Конкурентный» здесь значит «несколько задач в процессе одновременно», а не «параллельно». Одно ядро и один
      поток, но React умеет отложить начатую работу, выполнить срочную и вернуться. Включается это не флагом для
      всего приложения, а конкретными возможностями: `startTransition`, `useDeferredValue`, Suspense.
      Обязательное условие — `createRoot` из React 18 и выше. Компоненты для этого должны быть чистыми: их рендер
      могут повторить или выбросить.
    links:
      - https://react.dev/blog/2022/03/29/react-v18#what-is-concurrent-react
    source: own

  - id: react-internals-020
    level: middle
    tags: [priorities, transitions, theory]
    question: |
      Какие из утверждений о срочных и несрочных обновлениях верны?
    options:
      - text: 'Обновления от ввода в поле и кликов React считает срочными'
        correct: true
        why: 'Пользователь ждёт мгновенной реакции на свои действия, поэтому такие обновления идут с высшим приоритетом и без прерываний.'
      - text: 'Обновление, обёрнутое в `startTransition`, считается несрочным'
        correct: true
        why: 'Так разработчик говорит: «результат может подождать, главное — не мешать вводу».'
      - text: 'Обновление из `setTimeout` без перехода рендерится целиком, без уступок браузеру'
        correct: true
        why: 'Обычный приоритет — не переход: React отрендерит такое обновление до конца, не прерываясь. Прерываемыми становятся только переходы и отложенные значения.'
      - text: 'Обновление внутри `startTransition` нельзя прервать, если оно уже началось'
        why: 'Именно переходы и прерываются: начатый рендер перехода React бросит, если пришло срочное обновление, и начнёт заново.'
      - text: 'Любое обновление внутри `setTimeout` автоматически считается несрочным'
        why: 'Приоритет переходов получают только обновления, явно обёрнутые в `startTransition` (или отложенные через `useDeferredValue`). Обычное обновление из таймера рендерится без прерываний.'
    explanation: |
      Каждое обновление React получает приоритет. Дискретные события пользователя (клик, ввод, нажатие клавиши) —
      самые срочные. Обычные обновления из таймеров и ответов сети — обычного приоритета. Переходы и отложенные
      значения — несрочные и прерываемые. Срочная работа всегда идёт первой, а несрочная начинается заново с
      последними данными, поэтому промежуточные результаты, которые пользователь уже «перепечатал», не
      рендерятся до конца.
    links:
      - https://react.dev/reference/react/useTransition#marking-a-state-update-as-a-non-blocking-transition
    source: own

  - id: react-internals-021
    level: middle
    tags: [transitions, controlled-input, theory]
    question: |
      Почему обновление значения управляемого поля ввода нельзя оборачивать в `startTransition`?
    code: |
      <input value={text} onChange={(e) => startTransition(() => setText(e.target.value))} />
    codeLang: jsx
    options:
      - text: 'Поле должно сразу показать символ, а переход может это отложить'
        correct: true
        why: 'Если отрисовка `value` отложена, браузер успевает показать старое значение, и ввод «прыгает» или теряет символы. Правильно: держать `text` срочным, а в переход оборачивать тяжёлое следствие — например обновление результатов поиска.'
      - text: '`startTransition` нельзя вызывать внутри обработчиков событий'
        why: 'Можно и нужно: переходы обычно запускают как раз из обработчиков.'
      - text: 'Переход сбрасывает фокус с поля ввода и выделение текста в нём'
        why: 'Фокус и выделение переход не трогает. Проблема в задержке значения, которое должен показать `<input>`.'
      - text: 'В колбэке перехода событие уже очищено, и `e.target.value` пуст'
        why: 'Пула событий нет с React 17, и значение читается нормально. Плох сам отложенный рендер для поля ввода.'
    explanation: |
      Управляемое поле показывает то, что лежит в состоянии. Если обновление состояния несрочное, React может
      отрендерить его позже, и между нажатием клавиши и появлением символа будет задержка. В худшем случае
      браузер «откатит» поле к старому `value`. Поэтому состояние поля обновляют срочно, а для тяжёлой части
      используют второе состояние в переходе или `useDeferredValue(text)` — тогда поле отзывчиво, а список
      догоняет.
    links:
      - https://react.dev/reference/react/useTransition#updating-an-input-in-a-transition-doesnt-work
    source: own

  - id: react-internals-022
    level: senior
    tags: [scheduler, event-loop, macrotask, theory]
    question: |
      Прерываемый рендер React делает работу порциями по несколько миллисекунд. Почему продолжение он планирует
      новой задачей (macrotask), а не микрозадачей?
    options:
      - text: 'Очередь микрозадач не даёт браузеру отрисовать кадр и обработать ввод'
        correct: true
        why: 'Очередь микрозадач опустошается целиком, прежде чем браузер обработает клик или нарисует кадр. Продолжение в микрозадаче было бы тем же непрерывным рендером. Задача же отдаёт управление: между задачами браузер успевает обработать события.'
      - text: 'Микрозадачи в браузере выполняются с задержкой минимум 4 мс'
        why: 'Микрозадачи выполняются сразу после текущего кода, без задержек. Минимальные 4 мс бывают у вложенных таймеров.'
      - text: 'Микрозадачи нельзя создать из кода библиотеки'
        why: 'Любой код может поставить микрозадачу через `queueMicrotask` или промис. Дело не в доступности, а в том, что она не отдаёт управление браузеру.'
      - text: 'Микрозадачи из библиотек браузер выполняет только после отрисовки кадра'
        why: 'Микрозадачи выполняются сразу после текущего кода, до отрисовки, откуда бы их ни поставили. Именно поэтому они не годятся, чтобы уступить браузеру.'
    explanation: |
      Цель прерываемого рендера — уступать браузеру. По правилам event loop браузер может обработать ввод и
      нарисовать кадр только между задачами, после того как опустела очередь микрозадач. Поэтому планировщик
      React ставит продолжение работы обычной задачей, причём без минимальной задержки в 4 мс, которая
      бывает у вложенного `setTimeout`. Это прямое применение event loop: «отдать управление» — значит
      закончить задачу.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/HTML_DOM_API/Microtask_guide/In_depth
      - https://github.com/facebook/react/tree/main/packages/scheduler
    source: own

  - id: react-internals-023
    level: senior
    tags: [tearing, useSyncExternalStore, concurrent, theory]
    question: |
      Что такое tearing («разрыв») интерфейса и почему внешний стор в React 18+ читают через
      `useSyncExternalStore`?
    options:
      - text: 'Части дерева могут прочитать разные версии стора, а хук это предотвращает'
        correct: true
        why: 'Если стор изменился между порциями рендера, первые компоненты увидят старое значение, остальные — новое, и экран покажет несовместимые данные. `useSyncExternalStore` замечает изменение и перерисовывает дерево согласованно.'
      - text: 'Это мерцание при загрузке стилей, и хук откладывает рендер до их загрузки'
        why: 'Это вспышка нестилизованного контента (FOUC), к сторам она отношения не имеет.'
      - text: 'Это утечка подписок, и хук чистит их по таймеру'
        why: 'Подписки хук снимает при размонтировании, никаких таймеров. А tearing — про рассогласованные данные в одном кадре.'
      - text: 'Это гонка запросов к серверу, и хук отменяет устаревшие'
        why: 'Хук ничего не знает о сети, он синхронизирует чтение из любого внешнего источника данных.'
    explanation: |
      Внутреннее состояние React (`useState`) защищено: все компоненты в одном рендере видят одну версию. Внешний
      стор (Redux, Zustand, глобальная переменная, `navigator.onLine`) может измениться прямо посреди прерываемого
      рендера, и тогда часть интерфейса покажет старые данные, а часть — новые. `useSyncExternalStore` проверяет,
      не изменился ли снимок стора, и при необходимости делает рендер заново синхронно. Поэтому библиотеки
      состояния перешли на этот хук.
    links:
      - https://react.dev/reference/react/useSyncExternalStore
      - https://github.com/reactwg/react-18/discussions/69
    source: own

  - id: react-internals-024
    level: junior
    tags: [batching, theory]
    question: |
      Что такое батчинг (batching) обновлений состояния в React?
    options:
      - text: 'Несколько обновлений состояния подряд React объединяет в один рендер'
        correct: true
        why: 'Три вызова сеттеров в одном обработчике дают один рендер с итоговым состоянием, а не три промежуточных.'
      - text: 'React отправляет изменения состояния на сервер пачками'
        why: 'Батчинг — про рендеры в браузере, сервер тут ни при чём.'
      - text: 'React объединяет одинаковые компоненты на странице и рендерит их одним вызовом'
        why: 'Каждый экземпляр компонента вызывается отдельно. Батчинг объединяет обновления состояния, а не компоненты.'
      - text: 'Каждый вызов сеттера сразу запускает свой отдельный рендер компонента целиком'
        why: 'Так было бы без батчинга. React откладывает рендер до конца обработчика и объединяет обновления.'
    explanation: |
      Если бы каждый `setState` вызывал рендер сразу, обработчик с тремя обновлениями отрисовал бы два ненужных
      промежуточных состояния, иногда несогласованных. Поэтому React собирает обновления в очередь и рендерит один
      раз, когда код обработчика закончился. Батчинг не связан с тем, что `count` в обработчике
      остаётся старым: это снимок рендера, и он не изменится даже после `flushSync`. Сам `flushSync` нужен, чтобы
      сразу применить обновление к DOM, например перед измерением.
    links:
      - https://react.dev/learn/queueing-a-series-of-state-updates#react-batches-state-updates
    source: own

  - id: react-internals-025
    level: middle
    tags: [batching, react-18, theory]
    question: |
      Чем отличается батчинг в React 18 и новее от батчинга в React 17?
    options:
      - text: 'В 17 объединялись только обновления в обработчиках React, а в 18 везде'
        correct: true
        why: 'В React 17 обновления внутри `setTimeout`, промисов и нативных обработчиков (`addEventListener`) рендерились по одному. С `createRoot` в React 18 батчинг автоматический в любом месте.'
      - text: 'В 17 батчинга не было вовсе, его добавили в 18'
        why: 'Батчинг был и раньше, но только внутри обработчиков событий React.'
      - text: 'В 18 батчинг можно включить только специальным флагом в конфиге сборщика'
        why: 'Флага нет: автоматический батчинг включается вместе с `createRoot`.'
      - text: 'В 18 батчинг отключили ради конкурентного рендера'
        why: 'Наоборот, его расширили: конкурентному рендеру выгодно меньше рендеров.'
    explanation: |
      До React 18 React узнавал о «пачке» обновлений только тогда, когда сам вызывал обработчик события. После
      `await` или в колбэке таймера код выполнялся уже вне его контроля, и каждый `setState` сразу рендерил. В
      React 18 обновления объединяются независимо от источника: всё, что вызвано подряд в одном синхронном куске
      кода, даёт один рендер. Код после `await` — уже следующий кусок, и его обновления объединяются отдельно.
      Старое поведение сохраняется только у приложений на устаревшем `ReactDOM.render`, а при необходимости
      отрендерить сразу используют `flushSync`.
    links:
      - https://react.dev/blog/2022/03/29/react-v18#new-feature-automatic-batching
    source: own

  - id: react-internals-026
    level: middle
    tags: [Suspense, state, theory]
    question: |
      Компонент приостановился через `use(promise)` при самом первом монтировании и ещё не появлялся на экране.
      Что будет с его состоянием и эффектами, когда данные придут?
    options:
      - text: 'React отрендерит его с нуля, и эффекты запустятся впервые'
        correct: true
        why: 'Приостановленный рендер не был закоммичен, поэтому сохранять нечего: `useState` инициализируется заново, а эффекты ещё ни разу не запускались и выполнятся после первого коммита. Рендер начнётся с начала функции, а не со строки с `use`.'
      - text: 'Рендер продолжится со строки `use`, а состояние останется прежним'
        why: 'React не умеет продолжать функцию с середины: он вызывает компонент заново, с первой строки.'
      - text: 'Эффекты уже выполнились до приостановки и повторно не запустятся'
        why: 'Эффекты запускаются только после коммита, а приостановленный рендер до коммита не дошёл.'
      - text: 'Компонент получит `undefined` вместо данных и затем обновится ими'
        why: 'Приостановленный компонент ничего не возвращает. Когда данные готовы, `use` сразу вернёт значение.'
    explanation: |
      Приостановка — это отказ от текущего рендера. Если компонент ещё не был показан, React выбрасывает
      начатую работу целиком, а когда ресурс готов, вызывает компонент заново. Поэтому в теле компонента не должно
      быть побочных эффектов, а тяжёлые вычисления до `use` выполнятся повторно. Уже показанные компоненты при
      этом свой стейт не теряют: они живут на экране, пока граница показывает fallback или, в переходе, старый
      интерфейс.
    links:
      - https://react.dev/reference/react/Suspense#caveats
      - https://react.dev/reference/react/use
    source: own

  - id: react-internals-027
    level: middle
    tags: [hydration, ssr, useEffect, theory]
    question: |
      Страница рендерится на сервере. Как правильно показать на ней значение, известное только в браузере, —
      например локальное время пользователя?
    options:
      - text: 'Отрендерить серверный вариант, а клиентское значение выставить в `useEffect`'
        correct: true
        why: 'Первый клиентский рендер совпадёт с серверным HTML, гидратация пройдёт без расхождений, а эффект после неё обновит значение. Так же поступают с `localStorage` и размерами окна.'
      - text: 'Прямо в рендере проверить `typeof window` и показать браузерное значение'
        why: 'На сервере выполнится одна ветка, в браузере другая, и первый клиентский рендер разойдётся с серверным HTML — это ошибка гидратации.'
      - text: 'Добавить `suppressHydrationWarning` на `<html>`, и расхождения исправятся'
        why: 'Атрибут действует только на один уровень и ничего не исправляет: он лишь прячет предупреждение о расхождении, а само расхождение остаётся.'
      - text: 'Вычислить значение в `useLayoutEffect`, ведь он выполнится и на сервере'
        why: 'Эффекты, включая `useLayoutEffect`, на сервере не выполняются. Разница лишь в том, что на клиенте он сработает до отрисовки.'
    explanation: |
      Гидратация ждёт, что первый рендер в браузере даст ровно тот HTML, который пришёл с сервера. Если текст или
      структура разошлись, React перерисует часть страницы на клиенте до ближайшей границы Suspense, а отличия
      атрибутов может и не исправить — на экране останется серверное значение. Поэтому всё, что зависит от
      браузера (время, `localStorage`, `window`, случайные числа), вычисляют после гидратации: в `useEffect` или
      через `useSyncExternalStore` с отдельным серверным снимком. Для идентификаторов есть `useId`.
    links:
      - https://react.dev/reference/react-dom/client/hydrateRoot#handling-different-client-and-server-content
    source: own

  - id: react-internals-028
    level: senior
    tags: [selective-hydration, Suspense, react-18, theory]
    question: |
      Что такое выборочная гидратация (selective hydration), появившаяся в React 18?
    options:
      - text: 'Границы Suspense гидратируются по отдельности, и первой та, где кликнули'
        correct: true
        why: 'Страница оживает по частям: готовая часть не ждёт медленную. Если пользователь кликнул в ещё не гидрированном блоке, React поднимет приоритет этой границы и гидрирует её первой.'
      - text: 'Гидратируются только компоненты, помеченные специальным атрибутом'
        why: 'Помечать ничего не нужно: независимость частям дают обычные границы `<Suspense>`.'
      - text: 'Сервер сам решает, какие компоненты отправить в браузер гидратированными'
        why: 'Гидратация всегда происходит в браузере. Сервер лишь присылает HTML и, при стриминге, части по готовности.'
      - text: 'Клики до гидратации теряются, поэтому React блокирует их'
        why: 'В React 18 клик по ещё не гидрированной части не теряется: React запоминает событие, гидрирует эту часть в первую очередь и затем обработает клик.'
    explanation: |
      До React 18 гидратация была «всё или ничего»: пока не загрузился код всей страницы и не гидрировалось всё
      дерево, ничего не было интерактивным. В React 18 потоковый SSR и Suspense разбили этот процесс: сервер
      отправляет HTML по мере готовности, а клиент гидрирует каждую границу Suspense отдельно, как только готов её
      код. Приоритет зависит от действий пользователя. Это та же конкурентная модель, применённая к гидратации.
    links:
      - https://github.com/reactwg/react-18/discussions/37
      - https://react.dev/blog/2022/03/29/react-v18#suspense-in-data-frameworks
    source: own
