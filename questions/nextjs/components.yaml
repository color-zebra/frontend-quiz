topic: nextjs
subtopic: components
questions:
  - id: nextjs-components-001
    level: junior
    tags: [server-components, defaults]
    question: |
      Каким компонентом по умолчанию является `app/page.tsx` без директив?
    options:
      - text: 'Серверным (Server Component)'
        correct: true
        why: 'В App Router страницы, layout и все компоненты без `"use client"` по умолчанию серверные: они рендерятся на сервере, и их код не попадает в браузер.'
      - text: 'Клиентским, как в Pages Router'
        why: 'В Pages Router все компоненты гидрируются на клиенте, а в App Router по умолчанию работают серверные компоненты.'
      - text: 'Статическим HTML без React'
        why: 'Серверный компонент — полноценный React-компонент. На клиент приходит его результат, и React встраивает его в дерево вместе с клиентскими компонентами.'
      - text: 'Зависит от того, есть ли в нём `useEffect`'
        why: 'Тип компонента задаёт директива `"use client"` в файле или его импорт из клиентского модуля, а не используемые хуки. `useEffect` в серверном компоненте — ошибка сборки.'
    explanation: |
      Серверные компоненты (React Server Components) выполняются на сервере: могут быть асинхронными, читать
      базу и секреты, их код не входит в клиентский бандл. Клиентские компоненты помечаются `"use client"`:
      они рендерятся на сервере для первого HTML, а затем гидрируются в браузере и получают состояние, эффекты
      и обработчики событий. Подход App Router: всё серверное по умолчанию, а клиентскими делать только
      интерактивные «островки».
    links:
      - https://nextjs.org/docs/app/getting-started/server-and-client-components
    source: own

  - id: nextjs-components-002
    level: junior
    tags: [use-client, useState, no-run]
    question: |
      Что произойдёт при сборке страницы без директивы `"use client"`?
    code: |
      // app/counter/page.tsx
      import { useState } from 'react';

      export default function Page() {
        const [count, setCount] = useState(0);
        return <button onClick={() => setCount(count + 1)}>{count}</button>;
      }
    codeLang: tsx
    options:
      - text: 'Сборка упадёт, ведь `useState` есть только у клиентских компонентов'
        correct: true
        why: 'Файл без директивы — серверный компонент, а у него нет состояния и обработчиков. Next.js сообщает об этом ещё при сборке и предлагает добавить `"use client"`.'
      - text: 'Страница соберётся, но кнопка не будет реагировать на клики'
        why: 'До рантайма дело не дойдёт: импорт `useState` в серверный модуль ловится при компиляции.'
      - text: 'Next.js сам пометит файл как клиентский'
        why: 'Автоматического переключения нет. Граница между сервером и клиентом задаётся только явно.'
      - text: 'Страница соберётся, а счётчик будет храниться на сервере'
        why: 'Серверные компоненты не хранят состояние между запросами и не обрабатывают клики.'
    explanation: |
      Хуки состояния и эффектов (`useState`, `useEffect`, `useReducer`), обработчики событий и браузерные API
      доступны только в клиентских компонентах. Поэтому интерактивную часть выносят в отдельный файл с `"use
      client"` и импортируют её из серверной страницы. Так страница может загрузить данные на сервере, а
      кнопка лайка или форма будут работать в браузере. Чем ниже по дереву стоит граница, тем меньше
      JavaScript уходит пользователю.
    links:
      - https://nextjs.org/docs/app/api-reference/directives/use-client
    source: own

  - id: nextjs-components-003
    level: middle
    tags: [use-client, module-graph]
    question: |
      Файл `Button.tsx` начинается с `"use client"` и импортирует компонент `Icon` из `Icon.tsx`, где
      директивы нет. Где окажется код `Icon`?
    options:
      - text: 'В клиентском бандле, как и `Button`'
        correct: true
        why: '`"use client"` задаёт границу для всего графа модулей: всё, что импортирует клиентский файл, тоже становится клиентским кодом. Ставить директиву в каждом файле не нужно.'
      - text: 'Только на сервере, потому что в `Icon.tsx` нет директивы'
        why: 'Отсутствие директивы не делает модуль серверным, если его импортирует клиентский файл. Тип определяет граф импортов.'
      - text: 'Next.js выдаст ошибку и потребует добавить директиву в `Icon.tsx`'
        why: 'Ошибки нет: директива нужна только на входе в клиентскую часть.'
      - text: 'В клиентском бандле, только если `Icon` использует хуки'
        why: 'Хуки здесь не важны: в клиентский граф попадает любой модуль, импортированный клиентским файлом.'
    explanation: |
      Директива `"use client"` отмечает не отдельный компонент, а точку входа: модуль и всё, что он
      импортирует, попадают в клиентский граф. Поэтому директиву ставят на самых верхних интерактивных
      компонентах, а их дочерние модули становятся клиентскими автоматически. Обратное неверно: импорт не
      превращает клиентский модуль в серверный.
    links:
      - https://nextjs.org/docs/app/getting-started/server-and-client-components#using-client-components
    source: own

  - id: nextjs-components-004
    level: middle
    tags: [serialization, props, event-handlers, no-run]
    question: |
      Что произойдёт при пререндере этой страницы?
    code: |
      // components/Button.tsx
      'use client';
      export default function Button({ label, onClick }) {
        return <button onClick={onClick}>{label}</button>;
      }

      // app/page.tsx (Server Component)
      import Button from '../components/Button';
      export default function Page() {
        return <Button label="Сохранить" onClick={() => console.log('click')} />;
      }
    codeLang: tsx
    options:
      - text: 'Ошибка: функцию нельзя передать в клиентский компонент'
        correct: true
        why: 'Пропсы из серверного компонента в клиентский сериализуются и передаются по сети. Обычную функцию сериализовать нельзя, и Next.js сообщает «Event handlers cannot be passed to Client Component props».'
      - text: 'Всё сработает: функция выполнится на сервере при клике'
        why: 'Так работают только серверные функции с `"use server"`: они превращаются в ссылку на эндпоинт. Обычная стрелка такой не является.'
      - text: 'Кнопка отрендерится, но клик ничего не сделает'
        why: 'До рендера кнопки дело не дойдёт: сериализация пропсов падает при пререндере.'
      - text: 'Функция выполнится в браузере, `console.log` выведет в консоль'
        why: 'Код серверного компонента в браузер не попадает, поэтому его функции не могут оказаться на клиенте.'
    explanation: |
      Между сервером и клиентом пропсы передаются в RSC Payload, а он поддерживает только сериализуемые
      значения. Исключение — серверные функции (`"use server"`): вместо кода передаётся ссылка, и вызов
      превращается в запрос к серверу. Для интерактивности обработчик пишут внутри клиентского компонента, а с
      сервера передают только данные.
    links:
      - https://nextjs.org/docs/app/getting-started/server-and-client-components#passing-data-from-server-to-client-components
      - https://react.dev/reference/rsc/use-client#serializable-types
    source: own

  - id: nextjs-components-005
    level: senior
    tags: [interleaving, children, server-components]
    question: |
      `Modal` — клиентский компонент с состоянием «открыт/закрыт». `Cart` — асинхронный серверный компонент,
      который читает корзину из базы. Какая композиция сохранит `Cart` серверным?
    options:
      - text: 'Серверная страница рендерит `<Modal><Cart /></Modal>`'
        correct: true
        why: 'Элемент `<Cart />` создаётся в серверном компоненте и передаётся в `Modal` как `children`. Он рендерится на сервере заранее, а клиентский `Modal` получает уже готовый результат.'
      - text: '`Modal.tsx` импортирует `Cart` и рендерит его внутри'
        why: 'Всё, что импортирует клиентский файл, становится клиентским кодом. Асинхронный компонент с доступом к базе так работать не сможет.'
      - text: '`Cart.tsx` добавляет директиву `"use server"`'
        why: '`"use server"` помечает серверные функции, а не компоненты. Серверными компоненты делает отсутствие клиентской границы над ними.'
      - text: 'Передать `Cart` через контекст из серверного layout'
        why: 'Серверные компоненты не поддерживают контекст, а клиентские не могут рендерить серверный компонент, полученный таким путём.'
    explanation: |
      Серверные и клиентские компоненты можно чередовать (interleaving), но в одну сторону: клиентский
      компонент не может импортировать серверный, а серверный может передать серверное содержимое внутрь
      клиентского через `children` или другие пропсы. Так устроены модалки, вкладки, аккордеоны и провайдеры
      контекста: обёртка интерактивная, а содержимое серверное, с данными и без лишнего JavaScript. В RSC
      Payload вместо `Cart` окажется отрендеренный результат, а на месте `Modal` — ссылка на его клиентский
      код.
    links:
      - https://nextjs.org/docs/app/getting-started/server-and-client-components#interleaving-server-and-client-components
    source: own

  - id: nextjs-components-006
    level: middle
    tags: [context, providers]
    question: |
      Как документация рекомендует подключать провайдер темы на React Context для всего приложения в App
      Router?
    options:
      - text: 'Клиентский провайдер вокруг `children` layout'
        correct: true
        why: 'Контекст работает только в клиентских компонентах. Провайдер-обёртка с `"use client"` принимает `children`, и серверный layout может его рендерить, оставляя страницы серверными.'
      - text: 'Вызвать `createContext` прямо в серверном `layout.tsx`'
        why: 'Серверные компоненты не поддерживают контекст: ни создание провайдера, ни чтение через `useContext`.'
      - text: 'Добавить `"use client"` в корневой layout'
        why: 'Страницы останутся серверными (они приходят через `children`), но сам layout потеряет `metadata`, не сможет быть асинхронным и загружать данные, а все его импорты уйдут в клиентский бандл.'
      - text: 'Передать тему в каждую страницу через `params`'
        why: '`params` содержит параметры маршрута из URL, а не произвольные данные приложения.'
    explanation: |
      Провайдеры (тема, состояние, React Query, i18n) выносят в отдельный клиентский компонент, который
      принимает `children`. Серверный layout рендерит `<Providers>{children}</Providers>`, и страницы внутри
      остаются серверными: они передаются как `children`. Документация советует ставить провайдеры как можно
      глубже: не оборачивать весь `<html>`, а только ту часть, которой контекст нужен. Серверные компоненты
      читать контекст не могут, им данные передают пропсами или читают на сервере напрямую.
    links:
      - https://nextjs.org/docs/app/getting-started/server-and-client-components#context-providers
    source: own

  - id: nextjs-components-007
    level: senior
    tags: [environment-variables, hydration, security, no-run]
    question: |
      Клиентский компонент выводит `process.env.SECRET_KEY` (переменная без префикса `NEXT_PUBLIC_`). Страница
      пререндерится на сервере. Что произойдёт?
    code: |
      'use client';
      export default function Debug() {
        return <p>{String(process.env.SECRET_KEY)}</p>;
      }
    codeLang: tsx
    options:
      - text: 'Секрет попадёт в HTML, а в браузере значения не будет'
        correct: true
        why: 'При пререндере клиентский компонент выполняется на сервере, где переменная доступна, и её значение вписывается в HTML. В клиентский бандл подставляются только `NEXT_PUBLIC_`-переменные, поэтому в браузере получится `undefined` и расхождение при гидратации.'
      - text: 'Секрет будет и в HTML, и в браузере'
        why: 'Переменные без `NEXT_PUBLIC_` в клиентский бандл не встраиваются, в браузере значения нет.'
      - text: 'Значения не будет ни в HTML, ни в браузере'
        why: 'Ограничение касается сборки клиентского бандла. Серверный пререндер клиентского компонента выполняется в Node.js с полным окружением.'
      - text: 'Ошибка сборки: клиентский код не может читать `process.env`'
        why: 'Читать `process.env` можно. Next.js не проверяет, какие именно переменные читает клиентский код.'
    explanation: |
      Переменные без префикса `NEXT_PUBLIC_` в браузере недоступны. Но клиентский компонент — не «только
      браузерный»: для первого HTML он рендерится на сервере, и там видит всё окружение. Поэтому секреты в
      клиентском коде опасны дважды: утечка в HTML и ошибка гидратации. Секреты читают только в серверном
      коде, а модули с ними помечают `import 'server-only'`, чтобы случайный импорт в клиент ломал сборку.
    links:
      - https://nextjs.org/docs/app/guides/environment-variables#bundling-environment-variables-for-the-browser
    source: own

  - id: nextjs-components-008
    level: middle
    tags: [server-only, environment-poisoning]
    question: |
      Зачем писать `import 'server-only'` в модуле, который обращается к базе данных?
    options:
      - text: 'Чтобы импорт этого модуля из клиентского кода ломал сборку'
        correct: true
        why: 'Модули общие для обеих сред, и серверный код легко случайно импортировать в клиентский компонент. Маркер `server-only` превращает такую ошибку в ошибку сборки.'
      - text: 'Чтобы модуль выполнялся в отдельном процессе Node.js'
        why: 'Маркер не меняет, где и как выполняется код. Он лишь запрещает попадание модуля в клиентский граф.'
      - text: 'Чтобы шифровать данные, которые модуль передаёт клиенту'
        why: 'Никакого шифрования маркер не добавляет. Он защищает от случайного импорта, а не от утечки данных через пропсы.'
      - text: 'Чтобы модуль кэшировался между запросами'
        why: 'Кэширование настраивается отдельно (`"use cache"`, опции `fetch`). `server-only` с ним не связан.'
    explanation: |
      Один и тот же модуль может оказаться и в серверном, и в клиентском графе: достаточно импорта из файла с
      `"use client"`. Для кода с секретами, доступом к базе или файловой системе это опасно. `server-only` (и
      обратный `client-only` для кода, работающего с `window`) делает намерение явным, и Next.js сообщает об
      ошибке ещё на сборке. Для данных, которые не должны уйти в клиент даже через пропсы, есть
      экспериментальный taint API.
    links:
      - https://nextjs.org/docs/app/getting-started/server-and-client-components#preventing-environment-poisoning
    source: own

  - id: nextjs-components-009
    level: junior
    tags: [server-components, bundle-size]
    question: |
      Почему перенос разметки статьи с подсветкой кода в серверный компонент уменьшает JavaScript в браузере?
    options:
      - text: 'Его код и библиотеки не попадают в бандл'
        correct: true
        why: 'Серверный компонент выполняется на сервере, а в браузер приходит только результат рендера. Тяжёлая библиотека подсветки остаётся на сервере.'
      - text: 'Серверные компоненты сжимаются сильнее клиентских'
        why: 'Дело не в сжатии: код серверного компонента вообще не отправляется в браузер.'
      - text: 'Браузер кэширует серверные компоненты после первой загрузки'
        why: 'Кэширование не уменьшает объём при первой загрузке. Экономия в том, что код не скачивается вовсе.'
      - text: 'Next.js удаляет из серверных компонентов неиспользуемый код'
        why: 'Удаление неиспользуемого кода (tree shaking) работает для всех модулей. Серверные компоненты выигрывают тем, что их код вообще не отправляется.'
    explanation: |
      Главный выигрыш серверных компонентов — то, чего нет в браузере: библиотеки разбора Markdown, подсветки
      синтаксиса, форматирования дат, клиенты баз данных. Пользователь получает HTML и компактное описание
      дерева (RSC Payload), а JavaScript только для интерактивных частей. Это ускоряет загрузку и особенно
      помогает на слабых устройствах. Обратная сторона: всё, что должно реагировать на действия пользователя,
      по-прежнему требует клиентских компонентов.
    links:
      - https://nextjs.org/docs/app/getting-started/server-and-client-components#reducing-js-bundle-size
    source: own

  - id: nextjs-components-010
    level: middle
    tags: [serialization, props]
    question: |
      Что из этого НЕЛЬЗЯ передать пропом из серверного компонента в клиентский?
    options:
      - text: 'Экземпляр класса `User` с методами'
        correct: true
        why: 'Сериализация RSC поддерживает простые объекты, но не экземпляры пользовательских классов: прототип и методы через сеть не передаются. Передают простой объект с данными.'
      - text: 'Объект `Date`'
        why: '`Date` входит в список поддерживаемых типов и восстанавливается на клиенте как дата.'
      - text: 'Промис с данными, который клиент развернёт через `use`'
        why: 'Промисы поддерживаются: данные начинают грузиться на сервере, а клиентский компонент получает их через `use`, когда они придут.'
      - text: 'Массив простых объектов'
        why: 'Массивы и простые объекты — базовый случай сериализации.'
    explanation: |
      Пропсы на границе сервер → клиент передаются в формате, который поддерживает больше JSON: `Date`, `Map`,
      `Set`, `BigInt`, типизированные массивы, промисы, JSX и серверные функции. Не поддерживаются экземпляры
      классов и символы, созданные не через `Symbol.for`. Практичное правило: на клиент передают данные, а
      поведение описывают в клиентском коде. Чем меньше данных уходит пропсами, тем меньше RSC Payload,
      поэтому из больших объектов выбирают только нужные поля.
    links:
      - https://react.dev/reference/rsc/use-client#serializable-types
    source: own

  - id: nextjs-components-011
    level: middle
    tags: [next-dynamic, ssr-false]
    question: |
      Компонент карты использует `window` при импорте и падает при серверном рендере. Как загрузить его только
      в браузере?
    options:
      - text: '`next/dynamic` с `ssr: false` в клиентском компоненте'
        correct: true
        why: 'С `ssr: false` компонент не рендерится на сервере, и его модуль загружается только в браузере. Next.js разрешает эту опцию только в клиентских компонентах.'
      - text: 'Вызов `next/dynamic` с `ssr: false` в серверной странице'
        why: 'В серверных компонентах `ssr: false` запрещён, Next.js выдаст ошибку. Вызов переносят в клиентский компонент-обёртку.'
      - text: 'Пометить файл карты директивой `"use client"`'
        why: 'Клиентские компоненты тоже рендерятся на сервере для первого HTML, поэтому обращение к `window` при импорте по-прежнему упадёт.'
      - text: 'Обернуть карту в границу `<Suspense>`'
        why: '`Suspense` показывает заглушку при ожидании, но не отключает серверный рендер компонента.'
    explanation: |
      «Клиентский компонент» не значит «только браузерный»: для первого HTML он выполняется на сервере. Если
      библиотека обращается к `window` или `document` при загрузке модуля (карты, редакторы, графики), её
      загружают лениво без SSR: `next/dynamic` с `ssr: false` внутри клиентского компонента. Если обращение
      происходит только внутри эффектов или обработчиков, ничего специального не нужно: эти места на сервере
      не выполняются.
    links:
      - https://nextjs.org/docs/app/guides/lazy-loading#skipping-ssr
    source: own
