topic: nextjs
subtopic: optimization
questions:
  - id: nextjs-optimization-001
    level: junior
    tags: [next-image, remotePatterns]
    question: |
      `<Image src="https://cdn.example.com/photo.jpg" width={400} height={300} alt="" />` выдаёт ошибку. Что
      нужно сделать?
    options:
      - text: 'Разрешить этот хост в `images.remotePatterns` в `next.config`'
        correct: true
        why: 'Next.js оптимизирует картинки на своём сервере и не станет скачивать изображения с произвольных адресов: внешние источники нужно явно перечислить.'
      - text: 'Задать свой `loader` в `next.config`'
        why: 'Загрузчик определяет, как строятся адреса картинок. Штатный оптимизатор при этом по-прежнему не скачивает изображения с неразрешённых хостов.'
      - text: 'Убрать `width` и `height`, чтобы картинка загрузилась'
        why: 'Для внешних картинок размеры или `fill` как раз обязательны: Next.js не знает их заранее.'
      - text: 'Перенести компонент в клиентский файл с `"use client"`'
        why: '`next/image` работает в обоих типах компонентов. Ошибка связана с конфигурацией хостов.'
    explanation: |
      Компонент `next/image` отдаёт картинки через встроенный оптимизатор: меняет размер под экран, переводит
      в WebP или AVIF, кэширует результат. Чтобы сервер нельзя было использовать как прокси для любых адресов,
      внешние источники разрешают явно через `remotePatterns` (протокол, хост, путь). Старая опция `domains`
      устарела. В Next.js 16 у оптимизатора стали строже умолчания: ограничено число перенаправлений и
      качество по умолчанию, а оптимизация локальных IP-адресов запрещена.
    links:
      - https://nextjs.org/docs/app/api-reference/components/image#remotepatterns
    source: own

  - id: nextjs-optimization-002
    level: middle
    tags: [next-image, fill, layout-shift]
    question: |
      Обложки в карточках приходят с разными, заранее неизвестными размерами и должны заполнять блок 16:9. Как
      правильно использовать `next/image`?
    options:
      - text: 'Указать `fill`, а родителю задать `position: relative` и размеры'
        correct: true
        why: 'С `fill` картинка растягивается на родителя (абсолютным позиционированием), поэтому места под неё резервирует контейнер. Обрезку настраивают через `object-fit: cover`.'
      - text: 'Задать `width={0}` и `height={0}`, чтобы браузер сам вычислил размер'
        why: 'Нулевые размеры не резервируют место, и при загрузке вёрстка сдвинется. Это обходной приём, а не решение.'
      - text: 'Использовать обычный `<img>` без атрибутов размеров'
        why: 'Без размеров браузер не знает, сколько места оставить, и вёрстка прыгает. Заодно теряется оптимизация изображений.'
      - text: 'Указать `sizes="100vw"` без `width`, `height` и `fill`'
        why: '`sizes` помогает выбрать вариант из `srcset`, но не задаёт размер элемента. Без `width`/`height` или `fill` компонент выдаст ошибку.'
    explanation: |
      `next/image` требует, чтобы место под картинку было известно до её загрузки: либо `width` и `height`
      (они задают пропорции, а реальный размер можно менять CSS), либо `fill`, когда размер задаёт родитель.
      Для `fill` важно указать `sizes`, например `sizes="(max-width: 768px) 100vw, 33vw"`. Иначе браузер
      выберет вариант под ширину экрана и скачает лишнее. Резерв места предотвращает сдвиги вёрстки (CLS), а
      `srcset` с подходящими размерами экономит трафик.
    links:
      - https://nextjs.org/docs/app/api-reference/components/image#fill
      - https://nextjs.org/docs/app/api-reference/components/image#sizes
    source: own

  - id: nextjs-optimization-003
    level: middle
    tags: [next-font, self-hosting, privacy]
    question: |
      Шрифт подключён через `next/font/google`. Что происходит с запросами к Google Fonts?
    code: |
      import { Inter } from 'next/font/google';
      const inter = Inter({ subsets: ['latin', 'cyrillic'] });
    codeLang: ts
    options:
      - text: 'Шрифт скачивается при сборке и раздаётся с вашего домена'
        correct: true
        why: '`next/font` загружает файлы шрифта на этапе сборки и отдаёт их как статику приложения. Браузер пользователя к Google не обращается.'
      - text: 'Браузер загружает шрифт с Google при каждом визите'
        why: 'Так работает обычный `<link>` на Google Fonts. `next/font` переносит шрифт к себе, убирая сторонний запрос.'
      - text: 'Сервер Next.js проксирует каждый запрос шрифта к Google'
        why: 'Проксирования во время работы нет: файлы получены заранее, при сборке.'
      - text: 'Шрифт встраивается в каждый HTML-ответ как base64'
        why: 'Шрифт подключается отдельным файлом с долгим кэшированием, а не встраивается в HTML.'
    explanation: |
      `next/font` решает три проблемы сразу. Нет запросов к сторонним серверам: быстрее (не нужно новое
      соединение) и лучше для приватности, что важно в регионах с требованиями к обработке данных. Нет сдвигов
      вёрстки: Next.js генерирует запасной шрифт с подобранными метриками (`size-adjust`), и подмена шрифта
      почти незаметна. Шрифт подключается через CSS-переменную или класс, и в сборку попадают только нужные
      начертания и наборы символов.
    links:
      - https://nextjs.org/docs/app/getting-started/fonts
    source: own

  - id: nextjs-optimization-004
    level: junior
    tags: [metadata, seo]
    question: |
      Как в App Router задать статический заголовок вкладки и описание для страницы?
    options:
      - text: 'Экспортировать `metadata` из `page.tsx`'
        correct: true
        why: 'Объект `export const metadata = { title, description }` Next.js превращает в теги `<head>`. Значения из вложенных сегментов дополняют и переопределяют родительские.'
      - text: 'Использовать компонент `Head` из `next/head`'
        why: '`next/head` — API Pages Router. В App Router метаданные задают через `metadata` и `generateMetadata`.'
      - text: 'Установить `document.title` в `useEffect` страницы'
        why: 'Серверные компоненты не выполняют эффекты, а заголовок, выставленный в браузере, не увидят поисковики и превью ссылок.'
      - text: 'Указать `title` в `next.config.ts`'
        why: 'В конфигурации нет настроек метаданных страниц: они задаются в коде маршрутов.'
    explanation: |
      Metadata API позволяет описывать `<head>` декларативно: заголовок с шаблоном (`title: { template: '%s |
      Магазин' }`), описание, Open Graph, иконки, канонический адрес, `robots`. Метаданные вычисляются на
      сервере до рендера и сразу попадают в HTML, что важно для SEO и превью в мессенджерах. Есть и файловые
      соглашения: `opengraph-image.tsx`, `icon.png`, `sitemap.ts`, `robots.ts`.
    links:
      - https://nextjs.org/docs/app/getting-started/metadata-and-og-images
    source: own

  - id: nextjs-optimization-005
    level: middle
    tags: [metadata, use-client]
    question: |
      Что произойдёт при сборке этой страницы?
    code: |
      'use client';

      export const metadata = { title: 'Корзина' };

      export default function CartPage() {
        return <Cart />;
      }
    codeLang: tsx
    options:
      - text: 'Сборка упадёт, `metadata` из клиентского файла запрещён'
        correct: true
        why: 'Метаданные нужно вычислить на сервере до рендера страницы, а файл с `"use client"` — клиентский. Next.js сообщает об этом при сборке и предлагает оставить страницу серверной, а клиентскую логику вынести в отдельный файл.'
      - text: 'Сборка пройдёт, а заголовок установится после гидратации'
        why: 'Next.js не откладывает метаданные на клиент: экспорт из клиентского модуля запрещён.'
      - text: 'Сборка пройдёт, а `metadata` будет молча проигнорирован'
        why: 'Next.js не игнорирует такой экспорт молча, а останавливает сборку с объяснением.'
      - text: 'Next.js автоматически сделает страницу серверной'
        why: 'Директива `"use client"` всегда соблюдается. Переместить логику придётся вручную.'
    explanation: |
      Частая ситуация: страницу целиком пометили `"use client"`, потому что внутри нужен один интерактивный
      компонент, и метаданные перестали работать. Правильная структура — серверная `page.tsx` с `metadata` или
      `generateMetadata`, которая рендерит клиентский компонент из отдельного файла. Это заодно уменьшает
      клиентский бандл: страница и её данные остаются на сервере.
    links:
      - https://nextjs.org/docs/app/api-reference/functions/generate-metadata#why-generatemetadata-is-server-component-only
    source: own

  - id: nextjs-optimization-006
    level: middle
    tags: [environment-variables, build-time]
    question: |
      Приложение собрано с `NEXT_PUBLIC_API_URL=https://api-staging.example.com`. Перед запуском в продакшене
      переменную окружения на сервере поменяли на боевой адрес, но проект не пересобирали. Какой адрес увидит
      клиентский код?
    options:
      - text: 'Старый, staging: значение встроено в бандл при сборке'
        correct: true
        why: 'Переменные с префиксом `NEXT_PUBLIC_` подставляются в клиентский JavaScript строкой на этапе `next build`. Изменение окружения после сборки на уже собранный бандл не влияет.'
      - text: 'Новый, боевой: браузер читает окружение сервера при загрузке'
        why: 'У браузера нет доступа к окружению сервера. Значение попало в бандл в момент сборки.'
      - text: 'Новый, но только после перезапуска сервера'
        why: 'Перезапуск не пересобирает клиентский бандл, поэтому строка в нём не меняется.'
      - text: '`undefined`, потому что значение не совпадает со сборкой'
        why: 'Никакой сверки нет: в бандле просто записано старое значение.'
    explanation: |
      Это классическая проблема «собрать один раз, развернуть везде». Публичные переменные фиксируются при
      сборке, поэтому один образ нельзя запустить в разных окружениях с разными `NEXT_PUBLIC_`-значениями.
      Варианты: собирать отдельно под каждое окружение; читать конфигурацию на сервере и передавать её клиенту
      пропсами или через эндпоинт. Серверные переменные (без префикса) читаются во время работы, если код
      выполняется при запросе: например после `await connection()`.
    links:
      - https://nextjs.org/docs/app/guides/environment-variables#runtime-environment-variables
    source: own

  - id: nextjs-optimization-007
    level: middle
    tags: [generateMetadata, dynamic-metadata]
    question: |
      Заголовок страницы `/blog/[slug]` должен совпадать с заголовком поста из базы. Как это сделать?
    options:
      - text: 'Экспортировать `async function generateMetadata({ params })`'
        correct: true
        why: '`generateMetadata` получает те же `params`, что и страница, может загрузить данные и вернуть объект метаданных. Одинаковые `fetch` в ней и в странице мемоизируются и выполняются один раз.'
      - text: 'Экспортировать `metadata`, вычисленный в теле компонента страницы'
        why: '`metadata` — статический объект модуля. Данные конкретного поста в нём недоступны.'
      - text: 'Отрисовать `<title>` в клиентском эффекте после загрузки поста'
        why: 'Поисковики и превью ссылок получат страницу без правильного заголовка. Метаданные нужны в серверном HTML.'
      - text: 'Добавить заголовок в `generateStaticParams`'
        why: '`generateStaticParams` перечисляет значения параметров для пререндера и метаданные не задаёт.'
    explanation: |
      Для метаданных, зависящих от данных, есть асинхронная функция `generateMetadata`. Она вызывается на
      сервере, получает `params` и `searchParams` (в Next.js 16 это промисы) и может использовать метаданные
      родителя. Чтобы пост не загружался дважды, запрос либо делают через `fetch` (мемоизируется
      автоматически), либо используют общий механизм дедупликации для других источников данных. Если пост не
      найден, в `generateMetadata` тоже можно вызвать `notFound()`.
    links:
      - https://nextjs.org/docs/app/api-reference/functions/generate-metadata
    source: own

  - id: nextjs-optimization-008
    level: senior
    tags: [next-image, lcp, preload, next-16]
    question: |
      Чем в Next.js 16 заменили проп `priority` у `next/image`, и когда документация НЕ советует пользоваться
      заменой?
    options:
      - text: '`preload`; не для LCP-картинки, зависящей от размера экрана'
        correct: true
        why: '`preload` вставляет `<link rel="preload">` в `<head>`. Если LCP-элемент разный на разных экранах, предзагрузка скачает лишнее, и документация советует обойтись `loading="eager"` или `fetchPriority="high"`.'
      - text: '`fetchPriority`; не для картинок над сгибом'
        why: '`fetchPriority` — стандартный атрибут, а не замена `priority`. И для картинок над сгибом он как раз полезен.'
      - text: '`eager`; не для статически пререндеренных страниц'
        why: 'Отдельного пропа `eager` нет: есть атрибут `loading="eager"`. Связи со статическим рендерингом нет.'
      - text: 'Ничем: `priority` по-прежнему рекомендуется'
        why: 'В Next.js 16 `priority` объявлен устаревшим в пользу `preload`.'
    explanation: |
      Проп `priority` смешивал несколько вещей: отключал ленивую загрузку, повышал приоритет и вставлял
      preload. В Next.js 16 его заменили явным `preload`. Документация оговаривает, что в большинстве случаев
      достаточно `loading="eager"` или `fetchPriority="high"`, а `preload` нужен, когда LCP-картинку надо
      начать грузить из `<head>` ещё до разбора разметки. Его не используют, если LCP-элемент меняется от
      размера экрана, и не сочетают с `loading` или `fetchPriority`.
    links:
      - https://nextjs.org/docs/app/api-reference/components/image#preload
      - https://nextjs.org/docs/app/api-reference/components/image#priority
    source: own
  - id: nextjs-optimization-009
    level: middle
    tags: [static-export, output-export]
    question: |
      Проект переводят на `output: 'export'`, чтобы раздавать его как статику с CDN. Что из этого перестанет
      работать?
    options:
      - text: 'Server Actions'
        correct: true
        why: 'Статический экспорт создаёт только файлы HTML, CSS и JS, сервера Next.js нет. Server Actions требуют сервера для выполнения.'
      - text: 'Клиентские компоненты с `useState`'
        why: 'Клиентские компоненты работают в браузере и не требуют сервера: после экспорта они гидрируются как обычно.'
      - text: 'Страницы, пререндеренные при сборке'
        why: 'Это и есть результат статического экспорта: такие страницы превращаются в HTML-файлы.'
      - text: 'Навигация через `next/link`'
        why: 'Клиентские переходы работают и в статическом экспорте: браузер загружает заранее созданные данные маршрутов.'
    explanation: |
      `output: 'export'` превращает приложение в набор статических файлов. Всё, что требует сервера во время
      запроса, становится недоступным: Server Actions, `cookies()`, ISR, `proxy`, `rewrites` и `redirects` из
      конфигурации, оптимизация изображений штатным загрузчиком, динамические маршруты без
      `generateStaticParams`, Route Handlers, читающие запрос. Это подходит для документации и лендингов. Для
      приложений с серверной логикой нужен Node.js-сервер или платформа с поддержкой Next.js.
    links:
      - https://nextjs.org/docs/app/guides/static-exports#unsupported-features
    source: own

  - id: nextjs-optimization-010
    level: junior
    tags: [global-css, app-router]
    question: |
      Где в App Router обычно подключают глобальные стили, например `globals.css`?
    options:
      - text: 'Импортом в корневом `app/layout.tsx`'
        correct: true
        why: 'Корневой layout оборачивает все страницы, поэтому импорт стилей в нём подключает их ко всему приложению.'
      - text: 'Импортом в `app/page.tsx` главной страницы'
        why: 'Стили из страницы подключатся при её загрузке, а при прямом заходе на другие страницы их не будет.'
      - text: 'Тегом `<link>` в `next.config.ts`'
        why: 'Конфигурация не управляет содержимым страниц, а стили подключаются импортом CSS-файла.'
      - text: 'Копией импорта в каждой странице'
        why: 'Это лишнее: стили из корневого layout и так действуют на все страницы.'
    explanation: |
      В App Router CSS импортируют прямо в компонентах: глобальный — обычно в корневом layout, компонентный —
      через CSS Modules (`styles.module.css`) или Tailwind. Технически глобальные стили можно импортировать в
      любом layout или странице, но при навигации они не удаляются, что может вызвать конфликты. Поэтому
      документация советует держать в глобальном CSS только по-настоящему общие правила.
    links:
      - https://nextjs.org/docs/app/getting-started/css
    source: own
