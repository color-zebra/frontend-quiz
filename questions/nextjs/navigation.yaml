topic: nextjs
subtopic: navigation
questions:
  - id: nextjs-navigation-001
    level: junior
    tags: [link, client-navigation]
    question: |
      Чем `<Link href="/about">` из `next/link` отличается от обычной ссылки `<a href="/about">`?
    options:
      - text: 'Переход без перезагрузки страницы и с предзагрузкой'
        correct: true
        why: '`Link` перехватывает клик и выполняет клиентский переход: общие layout остаются на месте, состояние сохраняется, а данные маршрута могут быть загружены заранее, когда ссылка появилась в зоне видимости.'
      - text: 'Ничем: `Link` лишь добавляет стили активной ссылки'
        why: 'Подсветки активной ссылки `Link` не делает. Его смысл в клиентских переходах и предзагрузке.'
      - text: '`Link` открывает страницу в новой вкладке'
        why: 'Поведение по умолчанию — переход в той же вкладке, просто без полной перезагрузки.'
      - text: '`Link` всегда грузит маршрут заново с сервера'
        why: 'Если данные маршрута уже предзагружены, переход выполняется без запроса. Даже без предзагрузки страница не перезагружается целиком.'
    explanation: |
      Обычная ссылка вызывает полную загрузку документа: заново скачиваются и выполняются скрипты, теряется
      состояние, сбрасывается прокрутка. `Link` делает клиентский переход: запрашивает RSC Payload нового
      маршрута, обновляет только изменившиеся сегменты и сохраняет общие layout. В продакшене ссылки
      предзагружаются, когда попадают в зону видимости. При этом `Link` рендерит обычный `<a>`, поэтому ссылка
      работает и без JavaScript, а открытие в новой вкладке остаётся доступным.
    links:
      - https://nextjs.org/docs/app/api-reference/components/link
      - https://nextjs.org/docs/app/getting-started/linking-and-navigating
    source: own

  - id: nextjs-navigation-002
    level: junior
    tags: [useRouter, app-router]
    question: |
      Откуда импортировать `useRouter` в клиентском компоненте App Router?
    options:
      - text: '`next/navigation`'
        correct: true
        why: 'В App Router хуки навигации (`useRouter`, `usePathname`, `useSearchParams`, `useParams`) лежат в `next/navigation`.'
      - text: '`next/router`'
        why: 'Это роутер Pages Router. В App Router он не работает и выдаст ошибку.'
      - text: '`next/link`'
        why: '`next/link` экспортирует компонент `Link`, а не хуки.'
      - text: '`react-router-dom`'
        why: 'Это сторонняя библиотека маршрутизации. Next.js использует собственный роутер.'
    explanation: |
      У App Router и Pages Router разные модули навигации. В App Router `useRouter` из `next/navigation` даёт
      `push`, `replace`, `back`, `forward`, `refresh` и `prefetch`, но не содержит `pathname` и `query`. Для
      них есть отдельные хуки `usePathname` и `useSearchParams`, а параметры динамических сегментов — в
      `useParams`. Все эти хуки работают только в клиентских компонентах. Серверные компоненты получают
      `params` и `searchParams` пропсами.
    links:
      - https://nextjs.org/docs/app/api-reference/functions/use-router
    source: own

  - id: nextjs-navigation-003
    level: middle
    tags: [prefetching, link, dynamic-routes]
    question: |
      В продакшене (без `cacheComponents`) в зону видимости попала ссылка на динамический маршрут, у которого
      нет `loading.tsx`. Что предзагрузит Next.js?
    options:
      - text: 'Ничего, предзагрузка такого маршрута пропускается'
        correct: true
        why: 'Статические маршруты предзагружаются целиком. Динамические — частично, если есть `loading.tsx`: заранее грузятся layout и скелетон. Без `loading.tsx` предзагрузка пропускается, чтобы не нагружать сервер страницами, на которые могут не перейти.'
      - text: 'Полностью отрендеренную страницу с данными'
        why: 'Для динамических маршрутов это значило бы рендерить страницу на сервере для каждой ссылки в зоне видимости. Next.js так не делает.'
      - text: 'Только JavaScript клиентских компонентов этой страницы'
        why: 'Предзагрузка касается RSC Payload маршрута, а не отдельных бандлов. Без `loading.tsx` загрузки нет вовсе.'
      - text: 'HTML страницы целиком, как для обычной ссылки'
        why: 'HTML предзагрузкой не запрашивается: для клиентских переходов нужен RSC Payload.'
    explanation: |
      Next.js предзагружает маршруты по ссылкам из зоны видимости, но объём зависит от типа маршрута.
      Статический маршрут предзагружается полностью, и переход по нему мгновенный. Динамический без
      `loading.tsx` не предзагружается, и после клика пользователь ждёт ответа сервера. Поэтому `loading.tsx`
      для динамических маршрутов полезен вдвойне: он даёт мгновенную обратную связь, и именно его скелетон
      можно загрузить заранее. В разработке предзагрузки нет, так что ощущение скорости проверяют на
      продакшен-сборке.
    links:
      - https://nextjs.org/docs/app/getting-started/linking-and-navigating#prefetching
    source: own

  - id: nextjs-navigation-004
    level: middle
    tags: [redirect, useRouter, client-components]
    question: |
      Как в клиентском компоненте перенаправить пользователя на `/dashboard` после клика по кнопке?
    options:
      - text: 'Вызвать `router.push(''/dashboard'')` из `useRouter`'
        correct: true
        why: '`useRouter` даёт императивную навигацию для обработчиков событий: `push` добавляет запись в историю, `replace` заменяет текущую.'
      - text: 'Вызвать `redirect(''/dashboard'')` прямо в обработчике `onClick`'
        why: '`redirect` предназначен для рендера и серверного кода. В обработчиках событий документация предлагает `useRouter`.'
      - text: 'Присвоить `window.location.href` внутри `useEffect`'
        why: 'Так сработает, но с полной перезагрузкой страницы, потерей состояния и без клиентского перехода.'
      - text: 'Вернуть из обработчика `<Link href="/dashboard" />`'
        why: 'Возвращаемое значение обработчика React игнорирует, и JSX из него ничего не отрисует.'
    explanation: |
      Перенаправления в Next.js делаются в разных местах по-разному. В серверных компонентах, серверных
      функциях и Route Handlers — `redirect` и `permanentRedirect`. В обработчиках событий клиентских
      компонентов — `router.push` или `router.replace`. До рендера, по условиям запроса (например, нет
      сессии), — в `proxy.ts`. Статические правила вроде старых адресов после переезда — в `redirects` в
      `next.config`.
    links:
      - https://nextjs.org/docs/app/api-reference/functions/redirect
      - https://nextjs.org/docs/app/api-reference/functions/use-router
    source: own

  - id: nextjs-navigation-005
    level: middle
    tags: [proxy, middleware, next-16]
    question: |
      Где в Next.js 16 размещают код, который до рендера маршрута проверяет cookie и перенаправляет
      неавторизованных пользователей на `/login`?
    options:
      - text: 'В файле `proxy.ts` в корне проекта'
        correct: true
        why: 'В Next.js 16 соглашение `middleware` переименовано в `proxy`. Этот код выполняется перед маршрутизацией каждого подходящего запроса и может перенаправить, переписать адрес или изменить заголовки.'
      - text: 'В файле `instrumentation.ts` в корне'
        why: 'Этот файл выполняется один раз при старте сервера, для инициализации мониторинга, а не на каждый запрос.'
      - text: 'В обработчике `app/api/auth/route.ts`'
        why: 'Route Handler отвечает на запросы к своему адресу и не перехватывает переходы на другие страницы.'
      - text: 'В `next.config.ts` через опцию `rewrites`'
        why: '`rewrites` подменяет адреса по статическим правилам и не выполняет произвольную проверку сессии.'
    explanation: |
      `proxy.ts` (до Next.js 16 — `middleware.ts`) выполняется перед маршрутизацией. В 16-й версии он работает
      в среде Node.js, а функция экспортируется под именем `proxy`. Какие запросы он обрабатывает, задаёт
      `matcher` в его конфигурации. Типичные задачи: оптимистичная проверка сессии с перенаправлением,
      локализация, A/B-тесты, заголовки. Тяжёлую логику и запросы к базе туда не кладут: код выполняется на
      каждый запрос.
    links:
      - https://nextjs.org/docs/app/getting-started/proxy
      - https://nextjs.org/docs/app/guides/upgrading/version-16#middleware-to-proxy
    source: own

  - id: nextjs-navigation-006
    level: senior
    tags: [authorization, layout, partial-rendering]
    question: |
      Почему проверку сессии пользователя не стоит делать только в `app/dashboard/layout.tsx`?
    options:
      - text: 'Layout не перерисовывается при переходах'
        correct: true
        why: 'При клиентских переходах Next.js рендерит только изменившиеся сегменты, а общий layout остаётся. Проверка в нём выполнится при входе в раздел, но не при каждом переходе.'
      - text: 'Layout рендерится на клиенте и не видит cookie'
        why: 'Layout по умолчанию — серверный компонент и может прочитать cookie. Проблема в том, когда он рендерится.'
      - text: 'В layout нельзя вызывать функцию `redirect`'
        why: '`redirect` можно вызывать в серверных компонентах, включая layout.'
      - text: 'Layout кэшируется в браузере навсегда'
        why: 'Вечного кэша нет. Дело в частичном рендеринге: при навигации layout просто не участвует.'
    explanation: |
      Частичный рендеринг (partial rendering) ускоряет навигацию: общие layout не перерисовываются. Поэтому
      layout — плохое место для единственной проверки доступа. Документация советует проверять ближе к данным:
      в слое доступа к данным (DAL), в каждой серверной функции, в Route Handler, а в `proxy.ts` делать только
      быструю оптимистичную проверку для перенаправления. Если сессия истечёт во время работы в разделе,
      проверка в layout этого не заметит, а проверка в загрузке данных заметит.
    links:
      - https://nextjs.org/docs/app/guides/authentication
      - https://nextjs.org/docs/app/guides/data-security
    source: own

  - id: nextjs-navigation-007
    level: middle
    tags: [notFound, not-found]
    question: |
      Что делает вызов `notFound()` в странице товара, если товара нет в базе? В сегменте нет `loading.tsx`,
      `cacheComponents` выключен.
    code: |
      export default async function Page({ params }) {
        const { id } = await params;
        const product = await db.products.find(id);
        if (!product) notFound();
        return <h1>{product.title}</h1>;
      }
    codeLang: tsx
    options:
      - text: 'Показывает ближайший `not-found.tsx` со статусом 404'
        correct: true
        why: '`notFound` бросает особое исключение. Next.js рендерит ближайший `not-found.tsx` (или встроенную страницу) и отдаёт статус 404, чтобы поисковики не индексировали пустую страницу.'
      - text: 'Возвращает `null`, и страница рендерится пустой со статусом 200'
        why: 'Функция не возвращает управление: код после неё не выполняется, а ответ получает статус 404.'
      - text: 'Перенаправляет пользователя на главную страницу'
        why: 'Перенаправлением занимается `redirect`. `notFound` показывает страницу «не найдено» по тому же адресу.'
      - text: 'Бросает ошибку, которую поймает ближайший `error.tsx`'
        why: 'Исключение `notFound` особое: его обрабатывает `not-found.tsx`, а не граница ошибок.'
    explanation: |
      Для «ресурса нет» в App Router есть отдельный механизм: `notFound()` и файл `not-found.tsx`, отдельный
      от `error.tsx`. Это важно и для пользователя (понятная страница), и для SEO: статус 404 не даёт
      поисковикам индексировать несуществующие страницы. Важная оговорка: при стриминге (с `loading.tsx` или
      Cache Components) статус уже отправлен, и ответ будет 200 с `<meta name="robots" content="noindex">`.
      Для прав доступа есть экспериментальные `forbidden()` и `unauthorized()` (флаг `authInterrupts`).
    links:
      - https://nextjs.org/docs/app/api-reference/functions/not-found
      - https://nextjs.org/docs/app/api-reference/file-conventions/not-found
    source: own

  - id: nextjs-navigation-008
    level: senior
    tags: [useSearchParams, suspense, static-rendering]
    question: |
      Статическая страница рендерит клиентский компонент, который читает `useSearchParams()`. Обёртки
      `Suspense` нет. Что сообщит `next build`?
    options:
      - text: 'Ошибку: `useSearchParams()` нужно обернуть в `Suspense`'
        correct: true
        why: 'При сборке параметры запроса неизвестны. Компонент с `useSearchParams` должен рендериться на клиенте, и Next.js требует границу `Suspense`, чтобы остальная страница пререндерилась статически, а этот кусок — в браузере.'
      - text: 'Ничего: на сборке `useSearchParams()` вернёт пустые параметры'
        why: 'Next.js не подставляет пустые параметры молча: это привело бы к неверному HTML. Нужна явная граница.'
      - text: 'Маршрут молча станет динамическим'
        why: 'Хук в клиентском компоненте не делает маршрут динамическим. Без `Suspense` Next.js сообщает ошибку пререндера.'
      - text: 'Ошибку: читать параметры можно только в серверной странице'
        why: '`useSearchParams` как раз предназначен для клиентских компонентов. Нужна лишь граница `Suspense`.'
    explanation: |
      Статическая страница строится при сборке, когда строки запроса ещё нет. Компоненту, который от неё
      зависит, приходится рендериться в браузере (CSR bailout). Чтобы это затронуло только его, а не всю
      страницу до ближайшей границы, Next.js требует обернуть его в `<Suspense>` с заглушкой. Альтернатива —
      читать `searchParams` в серверной странице (маршрут станет динамическим) и передавать значения пропсами.
      Выбор зависит от того, нужна ли статика и важно ли содержимое для поисковиков.
    links:
      - https://nextjs.org/docs/messages/missing-suspense-with-csr-bailout
      - https://nextjs.org/docs/app/api-reference/functions/use-search-params
    source: own

  - id: nextjs-navigation-009
    level: middle
    tags: [error.tsx, retry, reset, error-recovery]
    question: |
      Компонент `error.tsx` в Next.js 16.3 получает функции `retry` и `reset`. Чем они отличаются?
    options:
      - text: '`retry` заново загружает данные и рендерит, `reset` только рендерит'
        correct: true
        why: '`retry` повторно запрашивает содержимое сегмента и перерисовывает его: если ошибка была временной, например сбой сети, всё восстановится. `reset` лишь сбрасывает состояние границы ошибок и рендерит те же данные заново.'
      - text: 'Ничем: `retry` — просто новое имя для `reset`'
        why: 'Это разные функции: документация советует в большинстве случаев `retry`, а `reset` оставлен для повтора без новой загрузки.'
      - text: '`reset` перезагружает страницу целиком, `retry` — только сегмент'
        why: 'Ни одна из функций не перезагружает страницу: обе работают внутри границы ошибок.'
      - text: '`retry` сначала отправляет ошибку в мониторинг, затем повторяет'
        why: 'Отправку в мониторинг делают сами. Разница между функциями — в том, загружаются ли данные заново.'
    explanation: |
      `error.tsx` — клиентский компонент-граница ошибок. Кнопка «Попробовать снова» должна не просто
      перерисовать сегмент, а получить свежие данные: ошибка часто возникла на сервере при загрузке. До
      Next.js 16.2 для этого к `reset` добавляли `router.refresh()` внутри `startTransition`. Функция `retry`
      (экспериментально с 16.2, стабильно с 16.3) делает это сама. Layout вокруг границы при этом остаётся
      интерактивным.
    links:
      - https://nextjs.org/docs/app/api-reference/file-conventions/error
    source: own

  - id: nextjs-navigation-010
    level: middle
    tags: [router-refresh, server-components]
    question: |
      Что делает `router.refresh()` в клиентском компоненте App Router?
    options:
      - text: 'Перерисовывает серверную часть, сохраняя состояние'
        correct: true
        why: 'Next.js заново запрашивает RSC Payload текущего маршрута и аккуратно встраивает его: состояние `useState` и прокрутка не сбрасываются.'
      - text: 'Перезагружает страницу целиком, как `location.reload()`'
        why: 'Полной перезагрузки нет: обновляется только результат серверных компонентов, а клиентское состояние живёт.'
      - text: 'Сбрасывает серверный кэш данных для текущего маршрута'
        why: 'Серверный кэш `refresh` не трогает. Для этого есть `revalidatePath` и `revalidateTag`.'
      - text: 'Повторяет последнюю отправку формы на странице'
        why: '`refresh` ничего не отправляет повторно: он только перезапрашивает отображение текущего маршрута.'
    explanation: |
      `router.refresh()` полезен, когда данные на сервере изменились вне привычного потока, например после
      мутации через сторонний API: страница перерисовывается со свежими серверными данными без потери
      состояния формы или открытой модалки. Он очищает клиентский кэш роутера для текущего маршрута, но не
      серверный кэш. Если данные закэшированы на сервере, сначала нужна их инвалидация.
    links:
      - https://nextjs.org/docs/app/api-reference/functions/use-router
    source: own

  - id: nextjs-navigation-011
    level: senior
    tags: [proxy, middleware, security, cve]
    question: |
      Почему после уязвимости CVE-2025-29927 советуют не полагаться на `middleware` (в Next.js 16 — `proxy`)
      как на единственную проверку авторизации?
    options:
      - text: 'Его можно было обойти специальным заголовком запроса'
        correct: true
        why: 'В уязвимых версиях внутренний заголовок `x-middleware-subrequest` позволял запросу пропустить выполнение middleware целиком. Если авторизация была только там, защищённые страницы открывались без входа.'
      - text: 'Он не видел cookie, и сессию нельзя было проверить'
        why: 'Middleware всегда имел доступ к cookie запроса. Проблема была в том, что его можно было пропустить.'
      - text: 'Он выполнялся после рендера страницы'
        why: 'Middleware выполняется до маршрутизации, в этом и его смысл. Уязвимость позволяла не выполнять его вовсе.'
      - text: 'Он выполнялся только при клиентских переходах'
        why: 'Middleware выполнялся и при прямых заходах. Уязвимость была в том, что специальный заголовок позволял пропустить его вовсе.'
    explanation: |
      Уязвимость весны 2025 года затронула self-hosted приложения: запрос с поддельным внутренним заголовком
      пропускал middleware. Её закрыли в обновлениях, но урок общий: одного слоя защиты недостаточно, даже
      если он выполняется на каждый запрос. Плюс своевременно обновлять `next` и `react`: в 2025 году было
      несколько серьёзных уязвимостей в серверных возможностях React и Next.js.
