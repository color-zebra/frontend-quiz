# yaml-language-server: $schema=../../schema.json
topic: nextjs
subtopic: rendering
questions:
  - id: nextjs-rendering-001
    level: junior
    tags: [static-rendering, prerendering]
    question: |
      Страница не читает cookies, заголовки и параметры запроса и не использует runtime API. Как Next.js
      отдаст её пользователям?
    options:
      - text: 'Как готовый HTML, сгенерированный при `next build`'
        correct: true
        why: 'Next.js пререндерит такие маршруты на этапе сборки (в выводе `next build` они помечены `○`) и отдаёт готовый результат каждому пользователю, без рендера на запрос.'
      - text: 'Рендерит заново на сервере при каждом запросе'
        why: 'Рендер на каждый запрос нужен, только если страница зависит от данных запроса. Здесь их нет, и Next.js делает её статической.'
      - text: 'Отдаёт пустой HTML и рендерит всё в браузере'
        why: 'App Router рендерит страницы на сервере. Клиентский рендер касается только интерактивных частей.'
      - text: 'Пререндерит при первом запросе после деплоя'
        why: 'Пререндер выполняется раньше, на этапе `next build`, поэтому первый посетитель тоже получает готовый HTML.'
    explanation: |
      В App Router статический рендеринг — поведение по умолчанию: всё, что можно вычислить заранее,
      вычисляется при сборке, а результат (HTML и RSC Payload) раздаётся с сервера или CDN. Маршрут становится
      динамическим, когда использует данные конкретного запроса или явно помечен как динамический. Вывод `next
      build` показывает тип каждого маршрута: `○` — статический, `●` — пререндеренный через
      `generateStaticParams`, `ƒ` — динамический.
    links:
      - https://nextjs.org/docs/app/getting-started/caching
      - https://nextjs.org/docs/app/guides/caching-without-cache-components
    source: own

  - id: nextjs-rendering-002
    level: middle
    tags: [static-rendering, build-time, no-run]
    question: |
      Что покажет эта страница в продакшене через неделю после деплоя (без `cacheComponents`)?
    code: |
      // app/time/page.tsx
      export default function Page() {
        return <p>{new Date().toISOString()}</p>;
      }
    codeLang: tsx
    options:
      - text: 'Время сборки, одинаковое для всех запросов'
        correct: true
        why: 'Страница не обращается к данным запроса, поэтому Next.js пререндерит её при `next build`. `new Date()` выполнился один раз, и результат вписан в статический HTML.'
      - text: 'Текущее время на момент каждого запроса'
        why: 'Для этого маршрут должен быть динамическим: например, вызвать `await connection()` перед получением даты или включить `dynamic = "force-dynamic"`.'
      - text: 'Время первого запроса после деплоя'
        why: 'Рендер выполнился ещё при сборке, до первого запроса.'
      - text: 'Ошибку: даты нельзя использовать в серверных компонентах'
        why: 'В прежней модели ошибки нет. С `cacheComponents` Next.js действительно потребует явно решить, где вычислять время, и сборка упадёт.'
    explanation: |
      Это частый сюрприз: «текущее время», случайное число или курс валют, вычисленные в серверном компоненте
      статической страницы, застывают на момент сборки. В прежней модели нужно явно сделать маршрут
      динамическим (`await connection()`, `dynamic = 'force-dynamic'`) или задать `revalidate`. С Cache
      Components Next.js сам требует решения: `Date.now()` и `Math.random()` без `connection()` или `"use
      cache"` дают ошибку пререндера. Это и есть одна из причин, по которым новая модель делает поведение
      явным.
    links:
      - https://nextjs.org/docs/app/api-reference/functions/connection
      - https://nextjs.org/docs/app/getting-started/caching#random-values-and-timestamps
    source: own

  - id: nextjs-rendering-003
    level: middle
    tags: [dynamic-rendering, request-apis]
    question: |
      Что из этого сделает маршрут динамическим (`ƒ` в выводе `next build`) в модели без `cacheComponents`?
    options:
      - text: 'Вызов `await cookies()` в странице'
        correct: true
        why: 'Cookie известны только в момент запроса, поэтому страницу, которая их читает, нельзя пререндерить заранее.'
      - text: 'Вызов `fetch` без опций кэширования'
        why: 'Без runtime API такой `fetch` выполнится при сборке, и маршрут останется статическим. Сам по себе он маршрут динамическим не делает.'
      - text: 'Клиентский компонент с `useState` на странице'
        why: 'Клиентские компоненты пререндерятся в HTML как обычно, а состояние появляется уже в браузере. Тип маршрута это не меняет.'
      - text: 'Экспорт `generateStaticParams` из страницы'
        why: '`generateStaticParams`, наоборот, позволяет пререндерить динамический сегмент для перечисленных значений при сборке.'
    explanation: |
      В прежней модели Next.js пытается пререндерить всё и переключает маршрут на рендер по запросу, когда
      встречает runtime API: `cookies()`, `headers()`, `searchParams`, `connection()`, `draftMode()`. Отдельно
      можно задать поведение конфигурацией сегмента: `dynamic = 'force-dynamic'` или `revalidate = 0`. Важное
      следствие: одно чтение cookie в общем layout делает динамическими все страницы под ним. Поэтому такие
      обращения опускают как можно ниже по дереву.
    links:
      - https://nextjs.org/docs/app/guides/caching-without-cache-components#route-segment-config
    source: own

  - id: nextjs-rendering-004
    level: middle
    tags: [generateStaticParams, dynamicParams]
    question: |
      `app/blog/[slug]/page.tsx` экспортирует `generateStaticParams`, который вернул `a` и `b`. Что произойдёт
      при запросе `/blog/c` с настройками по умолчанию?
    options:
      - text: 'Страница отрендерится по запросу'
        correct: true
        why: 'По умолчанию `dynamicParams = true`: значения, которых не было при сборке, рендерятся на сервере во время запроса.'
      - text: 'Вернётся 404, потому что `c` не было при сборке'
        why: '404 будет только с `export const dynamicParams = false`.'
      - text: 'Вернётся страница `/blog/a` как ближайшая'
        why: 'Next.js не подменяет параметры: для `c` рендерится своя страница.'
      - text: 'Ошибка сборки: значение `c` не объявлено'
        why: 'Сборка не знает о будущих запросах. Список из `generateStaticParams` определяет только, что пререндерить заранее.'
    explanation: |
      `generateStaticParams` перечисляет значения динамического сегмента, которые нужно пререндерить при
      сборке (`●` в выводе `next build`). Для остальных решает `dynamicParams`: `true` — рендерить по запросу,
      `false` — отдавать 404. Отрендеренная по запросу страница затем кэшируется и раздаётся как статическая.
      Это замена `fallback` из `getStaticPaths` в Pages Router. Типичный приём: пререндерить самые популярные
      страницы, а редкие генерировать по запросу. С Cache Components опция `dynamicParams` недоступна, там
      используют другую модель.
    links:
      - https://nextjs.org/docs/app/api-reference/functions/generate-static-params
      - https://nextjs.org/docs/app/api-reference/file-conventions/route-segment-config/dynamicParams
    source: own

  - id: nextjs-rendering-005
    level: middle
    tags: [streaming, suspense, no-run]
    question: |
      На динамической странице быстрый заголовок и медленный блок рекомендаций, обёрнутый в `<Suspense
      fallback={<Skeleton />}>`. Как придёт ответ?
    code: |
      export default async function Page() {
        return (
          <>
            <h1>Товар</h1>
            <Suspense fallback={<Skeleton />}>
              <Recommendations />
            </Suspense>
          </>
        );
      }
    codeLang: tsx
    options:
      - text: 'Сначала заголовок со скелетоном, потом рекомендации тем же ответом'
        correct: true
        why: 'Next.js стримит HTML: отправляет готовую часть с fallback сразу, а когда `Recommendations` догрузится, дописывает её в тот же ответ и подменяет скелетон.'
      - text: 'Только после загрузки рекомендаций, одним куском'
        why: 'Так было бы без `Suspense`: медленный компонент задержал бы весь ответ.'
      - text: 'Заголовок с сервера, а рекомендации браузер загрузит отдельным запросом'
        why: 'Дополнительного запроса нет. Недостающая часть приходит в том же HTTP-ответе.'
      - text: 'Скелетон навсегда, если пользователь не перезагрузит страницу'
        why: 'Fallback временный: когда данные готовы, React подменяет его содержимым.'
    explanation: |
      Стриминг разбивает ответ на части по границам `Suspense`. Сервер сразу отправляет оболочку с заглушками,
      пользователь видит страницу быстрее, а медленные части дописываются по мере готовности в тот же ответ.
      Каждая граница — независимая единица, поэтому медленный блок не держит остальные. Важно: стриминг
      улучшает TTFB и FCP, но для SEO-критичного контента стоит проверять, что он не прячется за долгой
      заглушкой.
    links:
      - https://nextjs.org/docs/app/guides/streaming
    source: own

  - id: nextjs-rendering-006
    level: senior
    tags: [cache-components, suspense, ppr]
    question: |
      В проекте включён `cacheComponents: true`. Страница читает `cookies()` прямо в своём теле, без
      `Suspense`. Что сообщит `next build` и как это исправить, не делая всю страницу динамической?
    options:
      - text: 'Ошибку пререндера; обернуть часть с `cookies()` в `<Suspense>`'
        correct: true
        why: 'С Cache Components страница собирается из статической оболочки и динамических «дыр». Чтение данных запроса вне `Suspense` блокирует оболочку, и сборка падает. С `Suspense` оболочка с fallback пререндерится, а часть с cookie стримится при запросе.'
      - text: 'Ничего: маршрут просто станет динамическим, как раньше'
        why: 'Так работала прежняя модель. С Cache Components неявного переключения нет: нужно явно указать, где ждать данные запроса.'
      - text: 'Ошибку; добавить `export const dynamic = "force-dynamic"`'
        why: 'Конфигурация `dynamic` недоступна при включённых Cache Components, и вся страница стала бы динамической, а нужно обратное.'
      - text: 'Ошибку; вызвать `await connection()` перед `cookies()`'
        why: '`connection()` тоже обращение к данным запроса. Без `Suspense` оболочка страницы по-прежнему блокируется.'
    explanation: |
      Cache Components (Next.js 16) меняют модель рендеринга. Каждая страница — это статическая оболочка
      (shell), которая пререндерится при сборке, плюс динамические части. Всё, что зависит от запроса или не
      закэшировано, должно находиться внутри `<Suspense>`: его fallback попадает в оболочку, а содержимое
      стримится при запросе. Закэшированное через `"use cache"` встраивается в оболочку. Так одна страница
      сочетает мгновенную статику и персональные данные. Этот режим раньше назывался Partial Prerendering
      (PPR). Если блокирующий маршрут нужен осознанно, Next.js 16.3 предлагает `export const instant = false`.
    links:
      - https://nextjs.org/docs/app/getting-started/caching#working-with-runtime-apis
      - https://nextjs.org/docs/app/api-reference/config/next-config-js/cacheComponents
    source: own

  - id: nextjs-rendering-007
    level: middle
    tags: [hydration, mismatch, no-run]
    question: |
      Клиентский компонент выводит `Math.random()`. В консоли браузера появляется ошибка гидратации. Почему?
    code: |
      'use client';
      export default function Lucky() {
        return <p>Ваше число: {Math.random()}</p>;
      }
    codeLang: tsx
    options:
      - text: 'На сервере и в браузере рендер дал разные числа'
        correct: true
        why: 'Клиентский компонент сначала рендерится на сервере в HTML, а в браузере React рендерит его снова и сверяет результат с DOM. Случайное число получается разным, и React сообщает о расхождении.'
      - text: '`Math.random()` недоступен в клиентских компонентах'
        why: '`Math.random()` работает везде. Проблема в том, что результат разный при двух рендерах.'
      - text: 'Клиентские компоненты нельзя пререндерить на сервере'
        why: 'Наоборот, клиентские компоненты пререндерятся на сервере по умолчанию, отсюда и сверка при гидратации.'
      - text: 'Гидратация запускается раньше, чем загрузится шрифт'
        why: 'Загрузка шрифтов не влияет на содержимое DOM. Ошибка гидратации — это несовпадение разметки сервера и клиента.'
    explanation: |
      React ожидает, что первый клиентский рендер даст ту же разметку. Нарушают это значения, разные на
      сервере и в браузере: случайные числа, текущее время, `window` и `localStorage`, локаль форматирования
      дат, расширения браузера, правящие DOM. Решения: вычислить значение на сервере и передать пропсом;
      показать его после монтирования через `useEffect`; отключить серверный рендер для такого компонента.
      `suppressHydrationWarning` подходит только для точечных неизбежных расхождений, например времени.
    links:
      - https://nextjs.org/docs/messages/react-hydration-error
    source: own

  - id: nextjs-rendering-008
    level: junior
    tags: [ssr, ssg]
    question: |
      Чем статическая генерация (SSG) отличается от серверного рендеринга по запросу (SSR)?
    options:
      - text: 'SSG строит HTML заранее, SSR — при каждом запросе'
        correct: true
        why: 'При SSG страница генерируется при сборке (или фоновой регенерации) и раздаётся всем одинаковой. При SSR сервер рендерит её заново для каждого запроса, поэтому может учесть cookie и параметры.'
      - text: 'SSG работает только без JavaScript в браузере'
        why: 'Статически сгенерированные страницы точно так же гидрируются и становятся интерактивными.'
      - text: 'SSR рендерит страницу в браузере, SSG — на сервере'
        why: 'Оба подхода рендерят на сервере. Рендер в браузере называется CSR.'
      - text: 'SSG нельзя обновить без пересборки проекта'
        why: 'Статические страницы обновляются фоновой регенерацией (ISR) или по требованию через `revalidatePath`.'
    explanation: |
      Стратегии отличаются тем, когда создаётся HTML. SSG: при сборке, самый быстрый отклик, раздаётся с CDN,
      но данные могут устаревать. ISR: статика с периодической или ручной регенерацией. SSR: на каждый запрос,
      всегда свежие и персональные данные, но нагрузка на сервер и задержка выше. CSR: браузер рендерит сам
      после загрузки JavaScript. В App Router выбор делается не флагом страницы, а тем, какие данные и API она
      использует.
    links:
      - https://nextjs.org/docs/app/glossary#prerendering
    source: own

  - id: nextjs-rendering-009
    level: middle
    tags: [isr, revalidate, stale-while-revalidate]
    question: |
      Страница с `export const revalidate = 60` (без `cacheComponents`) сгенерирована в 12:00:00. Первый
      посетитель после этого заходит в 12:05:00. Что он получит?
    options:
      - text: 'Версию от 12:00, а новая сгенерируется в фоне'
        correct: true
        why: 'По истечении срока первый запрос всё ещё получает закэшированную, уже устаревшую страницу. Одновременно запускается регенерация, и следующий посетитель увидит обновлённую версию.'
      - text: 'Свежую версию, сгенерированную специально для него'
        why: 'ISR не заставляет пользователя ждать рендера: он получает устаревшую копию сразу, а обновление идёт в фоне.'
      - text: 'Ошибку, пока страница перегенерируется'
        why: 'Во время регенерации продолжает отдаваться предыдущая версия. При ошибке генерации она тоже остаётся.'
      - text: 'Версию от 12:01, обновлённую по таймеру'
        why: 'Регенерация не идёт по таймеру сама: её запускает первый запрос после истечения срока.'
    explanation: |
      Incremental Static Regeneration — это stale-while-revalidate для страниц. Пока срок не истёк, все
      получают кэш. После истечения первый запрос получает устаревшую версию и запускает фоновую генерацию, а
      следующие получают свежую. Поэтому `revalidate = 60` значит «не чаще раза в минуту и только при наличии
      трафика», а не «каждую минуту». Для немедленного обновления после изменения данных используют
      `revalidatePath` или `revalidateTag` в серверной функции или обработчике вебхука.
    links:
      - https://nextjs.org/docs/app/guides/incremental-static-regeneration
    source: own

  - id: nextjs-rendering-010
    level: junior
    tags: [hydration]
    question: |
      Что такое гидратация в Next.js?
    options:
      - text: 'Подключение React к серверному HTML'
        correct: true
        why: 'Браузер сначала показывает серверный HTML, а затем React загружает код клиентских компонентов, сверяет дерево и навешивает обработчики, делая страницу интерактивной.'
      - text: 'Загрузка данных с сервера после отрисовки страницы'
        why: 'Это обычная клиентская загрузка данных. Гидратация связана с оживлением уже готового HTML.'
      - text: 'Сжатие HTML перед отправкой в браузер'
        why: 'Сжатие выполняет сервер на уровне HTTP (gzip, Brotli), к гидратации оно не относится.'
      - text: 'Повторный рендер серверных компонентов в браузере'
        why: 'Серверные компоненты в браузере не рендерятся: их результат приходит готовым. Гидрируются только клиентские.'
    explanation: |
      Первая загрузка в Next.js идёт в три шага: HTML даёт быстрый неинтерактивный предпросмотр, RSC Payload
      сопоставляет деревья серверных и клиентских компонентов, JavaScript гидрирует клиентские компоненты.
      Пока гидратация не закончилась, кнопки видны, но не реагируют. Поэтому большой клиентский бандл ухудшает
      отзывчивость (INP), а серверные компоненты её улучшают: им гидратация не нужна. React 18+ гидрирует
      выборочно: в первую очередь те части, с которыми пользователь начал взаимодействовать.
    links:
      - https://nextjs.org/docs/app/getting-started/server-and-client-components#on-the-client-first-load
    source: own

  - id: nextjs-rendering-011
    level: middle
    tags: [waterfall, parallel-fetching, server-components]
    question: |
      Страница профиля последовательно загружает пользователя и его заказы. Каждый запрос идёт около 300 мс, и
      заказы не зависят от данных пользователя. Как ускорить страницу?
    code: |
      export default async function Page({ params }) {
        const { id } = await params;
        const user = await getUser(id);
        const orders = await getOrders(id);
        return <Profile user={user} orders={orders} />;
      }
    codeLang: tsx
    options:
      - text: 'Запустить оба запроса сразу и ждать их через `Promise.all`'
        correct: true
        why: 'Последовательные `await` образуют каскад (waterfall): второй запрос стартует только после первого, и время складывается. Параллельный запуск сокращает ожидание примерно до времени самого долгого запроса.'
      - text: 'Перенести загрузку в `useEffect` клиентского компонента'
        why: 'Запросы начнутся только после загрузки и гидратации JavaScript, и пользователь сначала увидит пустую страницу.'
      - text: 'Добавить `loading.tsx`, и запросы станут параллельными'
        why: '`loading.tsx` показывает заглушку, пока страница грузится, но порядок запросов внутри страницы не меняет.'
      - text: 'Обернуть `getOrders` в `cache` из React'
        why: 'Это инструмент против повторных вызовов одной функции, а не против последовательного ожидания разных запросов.'
    explanation: |
      В асинхронных серверных компонентах легко получить каскад: каждый `await` ждёт предыдущий. Если данные
      независимы, запросы запускают одновременно (`Promise.all`, `Promise.allSettled`) или разносят по разным
      компонентам внутри `Suspense`, чтобы каждая часть стримилась по готовности. Каскад оправдан, только
      когда второй запрос зависит от результата первого. Между layout и page каскада нет: Next.js рендерит их
      параллельно.
    links:
      - https://nextjs.org/docs/app/getting-started/fetching-data#parallel-data-fetching
    source: own

  - id: nextjs-rendering-012
    level: junior
    tags: [turbopack, next-16]
    question: |
      Какой сборщик используют `next dev` и `next build` по умолчанию в Next.js 16?
    options:
      - text: 'Turbopack'
        correct: true
        why: 'С Next.js 16 Turbopack стабилен и используется по умолчанию в разработке и при сборке. Вернуться к webpack можно флагом `--webpack`.'
      - text: 'webpack'
        why: 'webpack был сборщиком по умолчанию до Next.js 16. Теперь он доступен через флаг `--webpack`.'
      - text: 'Vite'
        why: 'Next.js не использует Vite: у него собственный сборщик Turbopack.'
      - text: 'esbuild'
        why: 'esbuild — отдельный сборщик, Next.js не использует его для сборки приложения.'
    explanation: |
      Turbopack — сборщик на Rust от команды Next.js. В версии 16 он стал умолчанием и для `next dev`, и для
      `next build`, а настройки вынесены из `experimental` на верхний уровень `turbopack`. Проекты с
      собственной конфигурацией `webpack` при сборке по умолчанию падают, чтобы не было незаметных
      расхождений: их либо переносят на Turbopack, либо собирают с флагом `--webpack`. Поведение сборщиков
      иногда различается в деталях, и это стоит помнить при обновлении.
    links:
      - https://nextjs.org/docs/app/guides/upgrading/version-16#turbopack-by-default
    source: own
