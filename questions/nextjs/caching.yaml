# yaml-language-server: $schema=../../schema.json
topic: nextjs
subtopic: caching
questions:
  - id: nextjs-caching-001
    level: middle
    tags: [fetch, data-cache, dynamic-rendering]
    question: |
      Страница читает `cookies()`, то есть рендерится на каждый запрос. Она вызывает
      `fetch('https://api.example.com/products')` без опций. Сколько раз выполнится этот запрос за три визита
      пользователей (без `cacheComponents`)?
    options:
      - text: 'Три раза: по разу на каждый рендер'
        correct: true
        why: 'С Next.js 15 `fetch` по умолчанию не кэшируется между запросами, а динамическая страница рендерится заново при каждом визите.'
      - text: 'Один раз: результат `fetch` всегда кэшируется Next.js'
        why: 'В Next.js 13–14 `fetch` кэшировался по умолчанию, но не после обращения к `cookies()`. С 15 кэш включают явно: `cache: "force-cache"` или `next: { revalidate }`.'
      - text: 'Ни разу: запрос выполнился при сборке, и его результат переиспользуется'
        why: 'Маршрут динамический: страница рендерится на каждый запрос, а `fetch` без опций между запросами не кэшируется.'
      - text: 'Шесть раз: на сервере и затем в браузере при гидратации'
        why: 'Серверные компоненты в браузере не выполняются, и их `fetch` при гидратации не повторяется.'
    explanation: |
      В прежней модели у `fetch` в серверных компонентах есть несколько режимов. Без опций (по умолчанию с
      Next.js 15) данные не кэшируются между запросами. `cache: 'force-cache'` сохраняет результат в серверном
      кэше данных между запросами. `next: { revalidate: N }` хранит не дольше N секунд. `next: { tags: [...]
      }` позволяет сбросить по тегу. Изменение умолчаний в 15-й версии — частый источник путаницы при чтении
      старых статей.
    links:
      - https://nextjs.org/docs/app/guides/caching-without-cache-components#caching-fetch-requests
      - https://nextjs.org/docs/app/api-reference/functions/fetch
    source: own

  - id: nextjs-caching-002
    level: middle
    tags: [react-cache, deduplication, memoization]
    question: |
      `layout.tsx` и `page.tsx` в одном рендере вызывают `getUser(id)`, а она ходит в базу через ORM. Как
      сделать так, чтобы запрос к базе выполнился один раз за рендер?
    options:
      - text: 'Обернуть `getUser` в `cache` из `react`'
        correct: true
        why: '`cache` мемоизирует результат функции на время одного серверного рендера: повторные вызовы с теми же аргументами получат тот же промис.'
      - text: 'Ничего не делать: Next.js дедуплицирует любые асинхронные функции'
        why: 'Автоматически дедуплицируются только `fetch`-запросы `GET` с одинаковыми URL и опциями. Вызовы ORM нужно оборачивать самим.'
      - text: 'Перенести вызов в `useEffect` в layout'
        why: 'В серверных компонентах нет эффектов, а загрузка на клиенте только добавит запрос из браузера.'
      - text: 'Сохранить результат в глобальной переменной модуля'
        why: 'Модуль живёт между запросами разных пользователей: данные одного пользователя попадут к другому.'
    explanation: |
      Мемоизация в рамках рендера позволяет вызывать загрузку данных там, где они нужны, а не тащить их
      пропсами через всё дерево. Для `fetch` с методом `GET` Next.js делает это автоматически, кроме Route
      Handlers, где нет дерева компонентов. Для остальных источников — функция `cache` из React. Важно
      отличать мемоизацию от кэширования: мемоизация живёт один рендер и привязана к запросу, кэш данных
      переживает запросы и общий для всех пользователей.
    links:
      - https://nextjs.org/docs/app/api-reference/functions/fetch#memoization
      - https://react.dev/reference/react/cache
    source: own

  - id: nextjs-caching-003
    level: middle
    tags: [revalidatePath, server-actions]
    question: |
      Server Action добавляет пост в базу, но статическая страница `/blog` продолжает показывать старый
      список. Что нужно вызвать в action после записи?
    options:
      - text: '`revalidatePath(''/blog'')`'
        correct: true
        why: 'Функция помечает закэшированные данные и результат рендера маршрута как устаревшие, и следующий запрос к `/blog` получит свежий список.'
      - text: '`router.refresh()` на сервере'
        why: '`router.refresh()` — метод клиентского роутера в браузере. В серверной функции его вызвать нельзя.'
      - text: '`redirect(''/blog'')` без дополнительных вызовов'
        why: 'Перенаправление покажет ту же закэшированную страницу. Сначала кэш нужно сбросить.'
      - text: 'Ничего: Server Actions сами сбрасывают весь кэш'
        why: 'Next.js не знает, какие данные изменило действие. Что обновить, указывают явно.'
    explanation: |
      Статические и закэшированные страницы обновляются двумя способами: по времени (`revalidate`) и по
      требованию. По требованию — `revalidatePath(path)` для маршрута или `revalidateTag(tag, profile)` для
      данных с тегом, которые могут использоваться на многих страницах. Их вызывают в серверных функциях или в
      Route Handler, например из вебхука CMS. Вызов внутри Server Action ещё и обновляет текущий экран:
      Next.js возвращает новый RSC Payload вместе с ответом действия.
    links:
      - https://nextjs.org/docs/app/api-reference/functions/revalidatePath
    source: own

  - id: nextjs-caching-004
    level: senior
    tags: [updateTag, revalidateTag, next-16]
    question: |
      Пользователь сохраняет свой профиль через Server Action и должен сразу увидеть изменения, а не
      устаревшую версию. Данные профиля закэшированы с тегом `user-42`. Что вызвать в Next.js 16?
    options:
      - text: '`updateTag(''user-42'')`'
        correct: true
        why: '`updateTag` сразу инвалидирует данные с тегом и перезагружает их в том же запросе: пользователь видит свои изменения (read-your-writes). Вызывать её можно только в Server Actions.'
      - text: '`revalidateTag(''user-42'', ''max'')`'
        why: 'Это stale-while-revalidate: данные помечаются устаревшими, но пользователь может ещё увидеть старую версию, пока новая готовится. Подходит для контента, где небольшая задержка допустима.'
      - text: '`cacheLife(''seconds'')` внутри action'
        why: '`cacheLife` задаёт время жизни внутри функции с `"use cache"` и ничего не инвалидирует. Данные профиля в кэше останутся прежними.'
      - text: '`refresh()` из `next/cache`'
        why: '`refresh` обновляет клиентский роутер, но не сбрасывает данные с тегами. Без инвалидации тега он перерисует ту же закэшированную версию.'
    explanation: |
      В Next.js 16 инвалидация разделена по семантике. `revalidateTag(tag, profile)` — для контента вроде
      статей и каталогов: читатели могут недолго видеть старое, зато ответ всегда быстрый. `updateTag(tag)` —
      для действий пользователя над своими данными: истечение и обновление происходят сразу, в том же запросе,
      поэтому работает только в Server Actions. `refresh()` перерисовывает текущий экран, не трогая теги.
      Выбор зависит от того, чьи это данные и насколько важна мгновенная видимость.
    links:
      - https://nextjs.org/docs/app/api-reference/functions/updateTag
      - https://nextjs.org/docs/app/guides/upgrading/version-16#caching-apis
    source: own

  - id: nextjs-caching-005
    level: middle
    tags: [use-cache, cache-keys]
    question: |
      В проекте включён `cacheComponents`. Как Next.js различает записи кэша для `getProducts('shoes')` и
      `getProducts('hats')`?
    code: |
      async function getProducts(category: string) {
        'use cache';
        return db.products.findMany({ where: { category } });
      }
    codeLang: ts
    options:
      - text: 'Аргументы функции автоматически входят в ключ кэша'
        correct: true
        why: 'Для `"use cache"` ключ строится из функции, её аргументов и захваченных значений. Разные категории дают разные записи.'
      - text: 'Никак: второй вызов вернёт закэшированные туфли'
        why: 'Это было бы ошибкой кэширования. Аргументы являются частью ключа, поэтому записи разные.'
      - text: 'Нужно вручную задать ключ через `cacheTag(category)`'
        why: '`cacheTag` нужен для инвалидации по тегу, а не для формирования ключа: ключ строится автоматически.'
      - text: 'Ключом служит URL страницы, на которой вызвана функция'
        why: 'Кэш на уровне функции не зависит от страницы: одна запись переиспользуется на всех маршрутах с теми же аргументами.'
    explanation: |
      `"use cache"` (Cache Components) кэширует результат асинхронной функции или компонента. Ключ включает
      идентификатор функции, сериализованные аргументы и значения из замыкания. Поэтому аргументы должны быть
      сериализуемыми, и передавать в функцию лишнее, например весь объект запроса, не стоит: ключ станет
      уникальным для каждого вызова. Время жизни задаёт `cacheLife`, а теги для точечной инвалидации —
      `cacheTag`. Документация советует указывать `cacheLife` явно у каждой такой функции.
    links:
      - https://nextjs.org/docs/app/api-reference/directives/use-cache
    source: own

  - id: nextjs-caching-006
    level: senior
    tags: [use-cache, cookies, runtime-apis]
    question: |
      В проекте включён `cacheComponents`. Что не так с этой функцией?
    code: |
      import { cookies } from 'next/headers';

      async function getRecommendations() {
        'use cache';
        const userId = (await cookies()).get('uid')?.value;
        return db.recommendations.forUser(userId);
      }
    codeLang: ts
    options:
      - text: 'В кэшируемой функции нельзя читать `cookies()`'
        correct: true
        why: 'Кэш с `"use cache"` общий, а cookie относятся к конкретному запросу. Next.js запрещает runtime API в кэшируемых функциях (ошибка `next-request-in-use-cache`). Значение читают снаружи и передают аргументом, тогда оно войдёт в ключ.'
      - text: 'Ничего: Next.js сам добавит cookie в ключ кэша'
        why: 'Next.js не подмешивает данные запроса в ключ. Обращение к `cookies()` в такой функции — ошибка.'
      - text: 'Функция закэширует рекомендации первого пользователя для всех'
        why: 'Именно такой утечки и не допускает запрет: до кэширования дело не дойдёт, будет ошибка.'
      - text: '`"use cache"` можно ставить только на компоненты, не на функции'
        why: 'Директива работает и для функций данных, и для компонентов, и для целых файлов.'
    explanation: |
      Данные, зависящие от запроса (`cookies()`, `headers()`, `searchParams`), нельзя читать внутри общего
      кэша: запись получилась бы персональной, а раздавалась бы всем. Next.js запрещает это даже через
      вложенные вызовы. Правильный приём — прочитать значение снаружи и передать аргументом:
      `getRecommendations(userId)`, тогда у каждого пользователя своя запись. Для персональных данных, которые
      всё же нужно кэшировать рядом с запросом, есть вариант `"use cache: private"`. Важно, что на
      динамическом маршруте ошибка может проявиться не при сборке, а при запросе.
    links:
      - https://nextjs.org/docs/app/api-reference/directives/use-cache
      - https://nextjs.org/docs/messages/next-request-in-use-cache
    source: own

  - id: nextjs-caching-007
    level: middle
    tags: [fetch, revalidate, route]
    question: |
      На странице (без `cacheComponents`) два запроса: `fetch(a, { next: { revalidate: 3600 } })` и `fetch(b,
      { next: { revalidate: 60 } })`. Как часто будет обновляться страница?
    options:
      - text: 'Не чаще раза в 60 секунд'
        correct: true
        why: 'Частоту обновления всей страницы задаёт самый короткий `revalidate` среди её запросов и сегментов: так дочерние данные никогда не устаревают дольше заявленного.'
      - text: 'Раз в час, по самому долгому сроку'
        why: 'Если бы выбирался самый долгий срок, данные `b` устаревали бы на час вместо минуты. Next.js берёт минимальный.'
      - text: 'Раз в 3660 секунд, сумма сроков'
        why: 'Сроки не складываются: страница обновляется по самому короткому из них.'
      - text: 'Никогда: у страницы своего `revalidate` нет'
        why: 'Сроки `fetch` влияют на страницу целиком: без собственного `revalidate` она наследует самый короткий срок запросов.'
    explanation: |
      В прежней модели кэширования у каждого `fetch` может быть свой `revalidate`, и у сегмента страницы тоже.
      Для пререндеренной страницы итоговая частота регенерации — минимальная из всех: самый «нетерпеливый»
      источник данных определяет, как часто перестраивается HTML. Поэтому один запрос с маленьким сроком в
      общем layout заставляет часто перестраивать все страницы под ним. Если данным с разной свежестью тесно
      на одной странице, их разделяют по сегментам или переходят на `"use cache"` с `cacheLife` на уровне
      компонентов.
    links:
      - https://nextjs.org/docs/app/guides/caching-without-cache-components#revalidation-frequency
    source: own
  - id: nextjs-caching-008
    level: junior
    tags: [data-cache, server]
    question: |
      Где хранится результат `fetch(url, { cache: 'force-cache' })` в серверном компоненте (без
      `cacheComponents`)?
    options:
      - text: 'В серверном кэше данных, общем для всех'
        correct: true
        why: 'Запрос выполняет сервер, и результат сохраняется в серверном кэше. Поэтому через него можно раздавать общие данные, но нельзя персональные.'
      - text: 'В HTTP-кэше браузера текущего пользователя'
        why: 'Браузер этот запрос не делает: его выполняет сервер при рендере серверного компонента.'
      - text: 'В памяти конкретного рендера, до конца запроса'
        why: 'Так живёт мемоизация `fetch`. `force-cache` сохраняет результат между запросами.'
      - text: 'В cookie текущего пользователя сайта'
        why: 'Cookie слишком малы для данных и относятся к одному пользователю. Кэш данных Next.js находится на сервере.'
    explanation: |
      Кэш данных Next.js находится на сервере (в памяти, на диске или у провайдера хостинга) и разделяется
      между всеми запросами и пользователями. Ключ записи учитывает URL, метод, заголовки и тело запроса,
      поэтому запросы с разными токенами кэшируются раздельно. Опасность в другом: если ответ персональный, а
      в самом запросе это никак не отражено (сервер узнаёт пользователя иначе), общий кэш раздаст его всем.
      Поэтому персональные данные обычно запрашивают без кэша.
    links:
      - https://nextjs.org/docs/app/guides/caching-without-cache-components
    source: own
