topic: html
subtopic: accessibility
questions:
  - id: html-accessibility-001
    level: junior
    tags: [alt, images]
    question: |
      Как правильно разметить чисто декоративную картинку (узор-разделитель между блоками)?
    options:
      - text: '`<img src="divider.png">` — без `alt` скринридер её пропустит'
        why: 'Без `alt` скринридер может зачитать имя файла, например «divider точка png». Это шум.'
      - text: '`<img src="divider.png" alt="">`'
        correct: true
        why: 'Пустой `alt` явно говорит: картинка декоративная. Скринридер её пропустит.'
      - text: '`<img src="divider.png" alt="Декоративный разделитель">`'
        why: 'Описание декоративной картинки только отвлекает: пользователь слушает лишнюю фразу без пользы.'
      - text: '`<img src="divider.png" title="разделитель">` — подсказка заменит alt'
        why: '`title` станет доступным именем: скринридер прочитает «разделитель», хотя картинку нужно было скрыть. Для декоративной картинки нужен `alt=""`.'
    explanation: |
      Атрибут `alt` — текстовая замена картинки. Если изображение несёт смысл (график, фото товара, иконка
      без подписи), `alt` описывает его назначение. Если картинка декоративная или её смысл уже есть в тексте
      рядом, ставят `alt=""`: элемент выпадает из дерева доступности. Отсутствие `alt` — худший вариант: и
      для скринридеров, и для случаев, когда картинка не загрузилась. Ещё лучше декоративные элементы
      рисовать через CSS, а не разметку.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/img#alt
      - https://www.w3.org/WAI/tutorials/images/decorative/
    source: own

  - id: html-accessibility-002
    level: junior
    tags: [button, keyboard, div]
    question: |
      Чем плоха такая «кнопка»?
    code: |
      <div class="btn" onclick="save()">Сохранить</div>
    codeLang: html
    options:
      - text: 'Ничем, если она выглядит как кнопка и реагирует на клик'
        why: 'Внешний вид не даёт поведения: такой элемент недоступен с клавиатуры и непонятен скринридеру.'
      - text: 'Она недоступна с клавиатуры и не объявляется как кнопка'
        correct: true
        why: 'На неё нельзя перейти Tab-ом, она не нажимается Enter и Space, а скринридер не знает её роли. Нативная `<button>` даёт всё это бесплатно.'
      - text: 'Обработчик `onclick` на `div` не срабатывает в мобильных браузерах'
        why: 'Клик мышью и тап по `div` работают. Проблема — в клавиатуре и вспомогательных технологиях.'
      - text: 'Ничем, если добавить `role="button"` — роль даст всё нужное'
        why: 'Роль сообщит скринридеру, что это кнопка, но не добавит ни фокуса, ни реакции на Enter и Space. Их придётся писать руками.'
    explanation: |
      Нативные элементы несут три вещи: роль (что это), поведение (как с этим взаимодействовать) и
      состояние. `<button>` фокусируется Tab-ом, срабатывает по Enter и по Space, поддерживает `disabled`,
      участвует в формах. Чтобы повторить это на `div`, нужны `role="button"`, `tabindex="0"`, обработчики
      клавиш Enter и Space, обработка disabled-состояния. Проще и надёжнее взять `<button type="button">`
      и сбросить стили.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/button_role
    source: own

  - id: html-accessibility-003
    level: middle
    tags: [aria, first-rule]
    question: |
      Что на самом деле добавляет элементу атрибут `role="checkbox"`?
    code: |
      <span role="checkbox" aria-checked="false">Согласен</span>
    codeLang: html
    options:
      - text: 'Превращает span в настоящий чекбокс: клик и Space переключают состояние'
        why: 'ARIA не добавляет поведения. Переключение по клику и по Space, обновление `aria-checked` — всё это пишется вручную.'
      - text: 'Только семантику для вспомогательных технологий'
        correct: true
        why: 'Скринридер объявит чекбокс, но фокус, клавиатуру и смену `aria-checked` нужно реализовать самому. ARIA меняет лишь представление в дереве доступности.'
      - text: 'Добавляет значение в данные формы при её отправке'
        why: 'ARIA никак не связан с формами: span с ролью checkbox в FormData не попадёт.'
      - text: 'Делает элемент фокусируемым клавишей Tab, как нативный чекбокс'
        why: 'Фокусируемым элемент станет только с `tabindex="0"`.'
    explanation: |
      Первое правило ARIA: если есть нативный HTML-элемент с нужной семантикой и поведением — используйте
      его. ARIA — это обещание скринридеру: «элемент ведёт себя как чекбокс». Выполнять обещание должен
      разработчик: сделать элемент фокусируемым, обрабатывать клавиатуру, синхронизировать `aria-checked`.
      Нарушенное обещание хуже, чем никакого: пользователь слышит «чекбокс», нажимает Space — и ничего не
      происходит. Отсюда известная фраза: no ARIA is better than bad ARIA.
    links:
      - https://www.w3.org/TR/using-aria/#rule1
      - https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/checkbox_role
    source: own

  - id: html-accessibility-004
    level: middle
    tags: [aria-label, accessible-name, icon-button]
    question: |
      Кнопка закрытия содержит только SVG-крестик. Как правильно дать ей имя для скринридера?
    code: |
      <button type="button" class="close">
        <svg aria-hidden="true">...</svg>
      </button>
    codeLang: html
    options:
      - text: 'Добавить кнопке `title="Закрыть"` — его зачитают все скринридеры'
        why: '`title` — последний запасной источник имени, его поддержка непоследовательна, а на тач-устройствах подсказки не видно.'
      - text: 'Добавить кнопке `aria-label="Закрыть"`'
        correct: true
        why: '`aria-label` задаёт доступное имя элемента, когда видимого текста нет. Именно этот случай.'
      - text: 'Добавить `alt="Закрыть"` на элемент `<svg>`'
        why: 'У `<svg>` нет атрибута `alt`. Для инлайн-SVG используют `<title>` внутри или `aria-label`, но здесь SVG скрыт, и имя нужно кнопке.'
      - text: 'Ничего: пользователь поймёт назначение кнопки по контексту'
        why: 'Кнопка без имени — одна из самых частых ошибок доступности. Пользователь услышит просто «кнопка», без намёка, что она делает.'
    explanation: |
      У каждого интерактивного элемента должно быть доступное имя (accessible name) — то, что скринридер
      произносит при фокусе. Обычно им становится видимый текст, у полей — связанный label. Если текста нет,
      как у кнопки-иконки, имя задают через `aria-label` или `aria-labelledby`. Альтернатива —
      визуально скрытый текст внутри кнопки (класс `visually-hidden`): его переводят автоматические переводчики,
      а `aria-label` некоторые из них пропускают. Иконку же скрывают через `aria-hidden="true"`, чтобы
      скринридер не пытался её описать.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-label
    source: own

  - id: html-accessibility-005
    level: senior
    tags: [aria-hidden, focus]
    question: |
      Что не так в этой разметке?
    code: |
      <div aria-hidden="true">
        <a href="/promo">Подробнее об акции</a>
      </div>
    codeLang: html
    options:
      - text: 'Ничего: ссылка скрыта от скринридера, как и задумано'
        why: 'Скрыта только семантика. Фокус на ссылку попадает по-прежнему, и пользователь окажется на элементе, о котором скринридер ничего не скажет.'
      - text: 'Ссылка остаётся в обходе Tab, но не озвучивается'
        correct: true
        why: '`aria-hidden` убирает элемент из дерева доступности, но не влияет на фокус. Внутри aria-hidden не должно быть фокусируемых элементов.'
      - text: '`aria-hidden` скрывает элемент визуально, и ссылку никто не увидит'
        why: 'Визуально `aria-hidden` ничего не меняет, контент остаётся на экране.'
      - text: '`aria-hidden` недопустим на `div` и будет проигнорирован браузером'
        why: 'Атрибут глобальный и допустим на любом элементе. Проблема в содержимом.'
    explanation: |
      `aria-hidden="true"` удаляет поддерево из дерева доступности, а интерактивность не трогает. Фокус по
      Tab всё равно попадёт на ссылку, и пользователь скринридера окажется в «невидимом» месте: что-то в
      фокусе, но оно не озвучивается. Если блок должен быть недоступен целиком — для фоновой части страницы
      под модалкой, для скрытого слайда в карусели — используют атрибут `inert` или убирают фокусируемые
      элементы. Если блок скрыт от всех, подходит `hidden` или `display: none`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-hidden
    source: own

  - id: html-accessibility-006
    level: senior
    tags: [aria-live, live-regions]
    question: |
      После отправки формы скрипт добавляет на страницу новый элемент с сообщением. Скринридер его
      не зачитывает. Почему?
    code: |
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const message = document.createElement('div');
        message.setAttribute('aria-live', 'polite');
        message.textContent = 'Заявка отправлена';
        document.body.append(message);
      });
    codeLang: js
    options:
      - text: '`polite` откладывает объявление до перезагрузки страницы'
        why: '`polite` откладывает объявление только до паузы в речи скринридера, а не до перезагрузки.'
      - text: 'Live region должен существовать в DOM заранее'
        correct: true
        why: 'Скринридер начинает следить за регионом, когда тот появляется в дереве доступности. Объявляются изменения его содержимого, а текст, вставленный вместе с регионом, часто теряется.'
      - text: 'Нужен `aria-live="assertive"`: значение `polite` скринридеры игнорируют'
        why: '`polite` поддерживается всеми скринридерами. `assertive` перебивает текущую речь, и его оставляют для срочных ошибок.'
      - text: '`aria-live` работает только вместе с `role="alert"`'
        why: 'Всё наоборот: `role="alert"` сам подразумевает `aria-live="assertive"`. `aria-live` работает на любом элементе.'
    explanation: |
      Live region — область, изменения которой скринридер объявляет без перевода фокуса. Надёжная схема:
      пустой контейнер с `aria-live="polite"` (или `role="status"`) есть в разметке с самого начала, а
      скрипт меняет его текст. Если регион создаётся одновременно с текстом, многие скринридеры не успевают
      начать за ним следить, и сообщение теряется. Исключение — элемент с `role="alert"`: вставленный
      динамически, он обычно объявляется. `polite` ждёт паузы в речи, `assertive` перебивает.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Guides/Live_regions
    source: own

  - id: html-accessibility-007
    level: middle
    tags: [visually-hidden, display-none]
    question: |
      Как скрыть текст визуально, но оставить его доступным для скринридера?
    options:
      - text: '`display: none` — текст исчезнет только с экрана'
        why: '`display: none` скрывает элемент от всех, включая скринридеры.'
      - text: '`visibility: hidden` — место останется, а текст прочитается'
        why: '`visibility: hidden` тоже убирает элемент из дерева доступности, хотя место под него остаётся.'
      - text: 'Класс visually-hidden: 1×1 px, `clip-path`, `overflow: hidden`'
        correct: true
        why: 'Элемент остаётся в дереве доступности, но занимает исчезающе малую область и визуально не виден.'
      - text: '`opacity: 0` и `font-size: 0` — текст станет невидимым'
        why: '`font-size: 0` может заставить скринридер пропустить текст. `opacity: 0` скрывает, но элемент продолжает занимать место и ловить клики.'
    explanation: |
      Способы скрытия различаются тем, кого они касаются. `display: none`, `visibility: hidden` и атрибут
      `hidden` скрывают от всех. `aria-hidden="true"` скрывает только от вспомогательных технологий.
      Обратная задача — показать только скринридеру — решается классом visually-hidden (sr-only): абсолютное
      позиционирование, размер 1×1 px, `overflow: hidden`, `clip-path: inset(50%)`, `white-space: nowrap`.
      Так подписывают иконочные кнопки, добавляют пояснения вроде «откроется в новой вкладке», делают
      скрытые заголовки секций. Если такой элемент получает фокус (ссылка «Перейти к контенту»), его
      показывают по `:focus`.
    links:
      - https://www.a11yproject.com/posts/how-to-hide-content/
    source: own

  - id: html-accessibility-008
    level: senior
    tags: [accessible-name, aria-labelledby]
    question: |
      Что скринридер назовёт именем этой кнопки?
    code: |
      <h2 id="dlg-title">Удаление проекта</h2>
      <button aria-labelledby="dlg-title" aria-label="Закрыть" title="Закрыть окно">
        ×
      </button>
    codeLang: html
    options:
      - text: '«×»'
        why: 'Видимое содержимое используется, только если нет `aria-labelledby` и `aria-label`.'
      - text: '«Закрыть»'
        why: '`aria-label` уступает `aria-labelledby`.'
      - text: '«Удаление проекта»'
        correct: true
        why: 'В алгоритме вычисления имени `aria-labelledby` стоит первым. Здесь это ещё и ошибка: кнопка закрытия получила имя заголовка.'
      - text: '«Закрыть окно»'
        why: '`title` — последний источник имени, он используется, только если других нет.'
    explanation: |
      Доступное имя вычисляется по алгоритму accname с порядком приоритета: `aria-labelledby` →
      `aria-label` → нативная подпись (label у полей, alt у картинок, содержимое у кнопок и ссылок) →
      `title`. Побеждает первый непустой источник. Отсюда частый баг: `aria-labelledby`, скопированный
      с соседнего элемента, тихо перебивает правильный `aria-label`. Проверить итоговое имя можно в DevTools,
      на вкладке Accessibility у элемента.
    links:
      - https://www.w3.org/TR/accname-1.2/
      - https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-labelledby
    source: own

  - id: html-accessibility-009
    level: junior
    tags: [headings, structure]
    question: |
      Разработчик выбирает уровень заголовка по размеру шрифта в макете: мелкий подзаголовок карточки —
      `<h5>`, хотя выше на странице только `<h1>`. Что в этом плохого?
    options:
      - text: 'Ничего: уровень заголовка — вопрос дизайна'
        why: 'Уровень — смысловая иерархия документа. Размер шрифта регулируется CSS независимо от тега.'
      - text: 'Нарушается иерархия заголовков'
        correct: true
        why: 'Скринридеры показывают список заголовков как оглавление. Скачок с h1 на h5 выглядит как пропущенные разделы.'
      - text: 'Браузер автоматически исправит `<h5>` на `<h2>`'
        why: 'Браузер ничего не исправляет: какой тег написан, такой и будет.'
      - text: 'Поисковики игнорируют заголовки ниже `<h3>`'
        why: 'Такого правила нет. Проблема — в структуре и доступности.'
    explanation: |
      Заголовки — оглавление страницы. Многие пользователи скринридеров сначала просматривают список
      заголовков и прыгают сразу к нужному разделу. Уровни должны отражать вложенность: h1 — тема страницы,
      h2 — разделы, h3 — подразделы, без пропусков вниз. Нужен крупный текст, который не является
      заголовком, — это абзац со стилем. Нужен маленький заголовок — это h3 с уменьшенным шрифтом.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/Heading_Elements#navigation
    source: own

  - id: html-accessibility-010
    level: middle
    tags: [tables, th, scope, caption]
    question: |
      Как разметить таблицу с ценами, чтобы скринридер при переходе по ячейкам называл строку и колонку?
    options:
      - text: 'Заголовки колонок — в `<th>`, а названия строк — в `<td>` с жирным шрифтом'
        why: 'Колонки будут названы, а строки — нет: для скринридера название товара в `<td>` — обычная ячейка. Заголовок строки — тоже `<th>`, со `scope="row"`.'
      - text: 'Заголовки — в `<th>` с `scope="col"` и `scope="row"`, подпись — в `<caption>`'
        correct: true
        why: '`th` связывается с ячейками своей колонки или строки, и скринридер называет их при переходе. `caption` даёт таблице имя.'
      - text: 'Добавить таблице `role="grid"`, чтобы по ячейкам ходили стрелками'
        why: '`grid` — интерактивный виджет: управление стрелками и фокус придётся писать самому, а заголовков роль сама не создаёт.'
      - text: 'Добавить каждой ячейке `aria-label` с названием строки и колонки'
        why: 'Это огромный объём ручной работы, который `<th>` даёт автоматически. К тому же `aria-label` заменяет содержимое ячейки, и вместо цены скринридер может прочитать подпись.'
    explanation: |
      Таблица для данных — правильный инструмент: скринридер позволяет перемещаться по ячейкам и при
      переходе называет заголовки строки и колонки. Для этого заголовочные ячейки размечают `<th>`, а
      направление уточняют атрибутом `scope` (`col` или `row`). `<caption>` — видимая подпись, которая
      становится именем таблицы. Группы `<thead>`, `<tbody>`, `<tfoot>` помогают структуре и печати.
      Обратная крайность — таблица для вёрстки колонок страницы: тогда скринридер объявит «таблицу» там,
      где её нет, и это вводит в заблуждение.
    links:
      - https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Table_accessibility
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/th#scope
    source: own
