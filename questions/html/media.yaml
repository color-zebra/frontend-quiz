topic: html
subtopic: media
questions:
  - id: html-media-001
    level: junior
    tags: [img, cls, layout-shift]
    question: |
      Зачем указывать `width` и `height` у `<img>`, если реальный размер картинки всё равно задаётся в CSS?
    code: |
      <img src="photo.jpg" width="800" height="600" alt="...">
      <style>img { width: 100%; height: auto; }</style>
    codeLang: html
    options:
      - text: 'Незачем: если размер задан в CSS, атрибуты полностью игнорируются'
        why: 'Атрибуты используются, даже когда размер задан в CSS: браузер берёт из них соотношение сторон.'
      - text: 'Чтобы зарезервировать место до загрузки картинки'
        correct: true
        why: 'Из `width` и `height` браузер выводит `aspect-ratio: 800 / 600`. При `width: 100%; height: auto` высота известна заранее, и контент не прыгает.'
      - text: 'Сервер по ним отдаёт картинку нужного размера, и она грузится быстрее'
        why: 'Сервер атрибутов не видит. Отдачу картинок разного размера решают через `srcset`.'
      - text: 'Без них картинка не отобразится в Safari на iOS'
        why: 'Картинки без атрибутов размера отображаются во всех браузерах, просто вызывают сдвиг вёрстки.'
    explanation: |
      Пока картинка не загружена, браузер не знает её размеров и отводит под неё ноль пикселей. Когда
      картинка приходит, текст под ней резко сдвигается вниз — это layout shift, который портит метрику
      CLS и раздражает пользователя. Современные браузеры превращают атрибуты `width` и `height` в
      `aspect-ratio` по умолчанию, поэтому даже при адаптивной ширине из CSS место под картинку
      резервируется правильной высоты. Так же работает `<video>`. Для `<iframe>`, например встроенного видео,
      пропорции задают через CSS-свойство `aspect-ratio`.
    links:
      - https://web.dev/articles/optimize-cls#images-without-dimensions
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/img#width
    source: own

  - id: html-media-002
    level: middle
    tags: [srcset, sizes, responsive-images]
    question: |
      Экран телефона шириной 400 CSS-пикселей, плотность пикселей (DPR) — 2. Какой файл скорее всего
      загрузит браузер?
    code: |
      <img
        srcset="photo-480.jpg 480w, photo-960.jpg 960w, photo-1920.jpg 1920w"
        sizes="(max-width: 600px) 100vw, 50vw"
        src="photo-960.jpg"
        alt="...">
    codeLang: html
    options:
      - text: '`photo-480.jpg`'
        why: 'Забыт DPR: при плотности 2 на каждый CSS-пиксель приходится два физических, и для чёткой картинки нужно 800 пикселей.'
      - text: '`photo-960.jpg`'
        correct: true
        why: 'Слот по `sizes` — 100vw = 400px, при DPR 2 нужно 800 физических пикселей. Ближайший подходящий кандидат — 960w.'
      - text: '`photo-1920.jpg`'
        why: 'Смысл `srcset` как раз в том, чтобы не грузить лишнее. Самый большой файл не нужен для слота шириной 400px.'
      - text: 'Сначала `photo-480.jpg`, затем `photo-960.jpg`'
        why: 'Браузер загружает один кандидат из `srcset`, а не несколько по очереди. Подходящий выбирается сразу.'
    explanation: |
      С дескрипторами `w` браузер не знает, какого размера будет картинка на странице: вёрстка ещё не
      посчитана. Поэтому ему подсказывают `sizes` — ширину слота при разных условиях. Алгоритм такой: взять
      первое подходящее условие из `sizes` (здесь `100vw` = 400px), умножить на DPR (800px) и выбрать файл
      из `srcset`. Окончательный выбор остаётся за браузером: он может взять файл побольше, если тот уже
      в кэше, или поменьше на медленной сети. Поэтому в вопросе сказано «скорее всего».
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Guides/Responsive_images
    source: own

  - id: html-media-003
    level: junior
    tags: [picture, formats]
    question: |
      Какой элемент на самом деле отображает картинку в этой конструкции, и к какому из них применять
      CSS-стили?
    code: |
      <picture>
        <source srcset="photo.avif" type="image/avif">
        <source srcset="photo.webp" type="image/webp">
        <img src="photo.jpg" alt="Фото" class="photo">
      </picture>
    codeLang: html
    options:
      - text: 'Выбранный `<source>`, стили нужно вешать на него'
        why: '`<source>` ничего не рисует, он лишь предлагает адрес. Стили на `<source>` не действуют.'
      - text: 'Всегда `<img>`, стили вешают на него'
        correct: true
        why: 'Браузер выбирает подходящий источник и загружает его в `<img>`. `alt`, `loading` и стили берутся у img.'
      - text: '`<picture>` как контейнер, стили вешают на него'
        why: '`<picture>` — обёртка без своей отрисовки, по умолчанию строчная. Стилизовать картинку надо через img.'
      - text: '`<img>`, но только в старых браузерах без поддержки `<picture>`'
        why: '`<img>` обязателен и используется всегда, а не только как запасной вариант.'
    explanation: |
      `<picture>` даёт браузеру выбор источника: по формату (`type`) или по медиазапросу (`media`), когда для
      мобильных нужна другая обрезка картинки — это называется art direction. Браузер идёт по `<source>`
      сверху вниз, берёт первый подходящий и подставляет его в `<img>`. Если ни один не подошёл, остаётся
      `src` самого img. Поэтому `<img>` внутри обязателен: он и отображает картинку, и несёт `alt`, `loading`
      и CSS-класс. Размеры по умолчанию тоже берутся у img, но с 2022 года `<source>` может нести свои
      `width` и `height` — для art direction с другими пропорциями.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/picture
    source: own

  - id: html-media-004
    level: middle
    tags: [lazy-loading, lcp]
    question: |
      Разработчик добавил `loading="lazy"` всем картинкам на сайте, включая большой баннер на первом
      экране. Метрика LCP ухудшилась. Почему?
    options:
      - text: 'Ленивые картинки загружаются только после события `load`'
        why: 'Они загружаются, когда приближаются к видимой области, а не после `load`. Но и это для баннера поздно.'
      - text: 'Загрузка ленивой картинки ждёт расчёта вёрстки'
        correct: true
        why: 'Обычную картинку браузер начинает грузить, как только найдёт её в разметке. Ленивой нужно дождаться layout, и время до отрисовки главного элемента растёт.'
      - text: '`loading="lazy"` уменьшает качество картинки ради экономии'
        why: 'Атрибут влияет только на момент загрузки, файл остаётся тем же.'
      - text: 'LCP не учитывает картинки с атрибутом `loading` и берёт текст'
        why: 'LCP учитывает крупнейшую картинку или текстовый блок в видимой области, атрибуты тут не важны.'
    explanation: |
      `loading="lazy"` откладывает загрузку до момента, когда браузер посчитает вёрстку и поймёт, что
      картинка близко к видимой области. Для картинок ниже первого экрана это экономия трафика. Но картинка
      первого экрана нужна сразу, и ленивость только задерживает её. А баннер часто и есть элемент LCP
      (Largest Contentful Paint). Правило: картинкам первого экрана — обычная загрузка и, для главной из них,
      `fetchpriority="high"`; всем остальным — `loading="lazy"`.
    links:
      - https://web.dev/articles/lcp-lazy-loading
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/img#loading
    source: own

  - id: html-media-005
    level: senior
    tags: [iframe, sandbox, security]
    question: |
      Сторонний HTML с вашего же домена встраивается в `iframe` с такими настройками. Чем это опасно?
    code: |
      <iframe src="/user-content/page.html" sandbox="allow-scripts allow-same-origin"></iframe>
    codeLang: html
    options:
      - text: 'Ничем: атрибут `sandbox` изолирует содержимое при любых флагах'
        why: 'Изоляция зависит от набора разрешений. Именно эта пара флагов её фактически отменяет.'
      - text: 'Скрипт внутри работает с правами вашего сайта'
        correct: true
        why: 'С `allow-same-origin` у iframe тот же origin, что у родителя, а `allow-scripts` разрешает код. Скрипт сразу читает DOM родителя, cookie и `localStorage` и даже может снять с себя `sandbox`.'
      - text: 'Скрипты не выполнятся: `allow-same-origin` их блокирует'
        why: 'Флаги складываются: `allow-scripts` разрешает скрипты, `allow-same-origin` оставляет настоящий origin.'
      - text: 'Браузер откажется загружать такой iframe целиком'
        why: 'Браузер загрузит iframe, только выведет в консоль предупреждение, что такая комбинация может снять песочницу.'
    explanation: |
      Пустой `sandbox` запрещает почти всё: скрипты, формы, всплывающие окна, навигацию родителя, а
      содержимое получает уникальный «непрозрачный» origin без доступа к cookie и хранилищам сайта. Флаги
      точечно возвращают возможности. Опасность в паре `allow-scripts` + `allow-same-origin` для контента с
      того же домена: скрипт внутри — полноправный скрипт вашего сайта. Он сразу видит DOM родителя и
      хранилища, а может и убрать атрибут `sandbox` у своего iframe — после перезагрузки ограничений не
      останется вовсе. Недоверенный контент нужно отдавать с отдельного домена.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/iframe#sandbox
    source: own

  - id: html-media-006
    level: junior
    tags: [video, autoplay]
    question: |
      Почему видео не запускается автоматически в большинстве браузеров?
    code: |
      <video src="intro.mp4" autoplay></video>
    codeLang: html
    options:
      - text: 'Атрибут `autoplay` устарел и больше не поддерживается'
        why: '`autoplay` поддерживается, но браузеры ограничивают автозапуск видео со звуком.'
      - text: 'Не хватает атрибута `muted`'
        correct: true
        why: 'Политики автозапуска, как правило, разрешают беззвучное видео. Для iOS добавляют ещё `playsinline`, иначе видео развернётся на весь экран.'
      - text: 'Не хватает атрибута `controls` с панелью управления'
        why: '`controls` показывает панель управления, на автозапуск он не влияет.'
      - text: 'Видео запускается только после события `DOMContentLoaded`'
        why: 'Автозапуск не привязан к этому событию. Видео начнёт играть, как только наберётся достаточно данных, если политика разрешает.'
    explanation: |
      Видео, которое внезапно заговорило, раздражает и тратит трафик, поэтому браузеры ввели политику
      автозапуска (autoplay policy). Без звука запуск, как правило, разрешён. Исключения — режим
      энергосбережения на iOS и настройки пользователя в Safari и Firefox. Со звуком запуск разрешён только
      после клика или нажатия клавиши на странице, либо на сайтах, где пользователь регулярно смотрит видео
      со звуком. Вызов `video.play()` возвращает промис, который отклоняется, если автозапуск запрещён, — эту
      ошибку стоит обработать.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Media/Guides/Autoplay
    source: own

  - id: html-media-007
    level: middle
    tags: [svg, img, inline-svg]
    question: |
      Иконка подключена так. Почему CSS-правило `.icon path { fill: red; }` на неё не действует?
    code: |
      <img class="icon" src="/icons/cart.svg" alt="Корзина">
    codeLang: html
    options:
      - text: 'Атрибут `fill` внутри файла перебивает CSS — нужно добавить `!important`'
        why: 'Даже `!important` не поможет: стили страницы вообще не проникают в SVG-документ, загруженный через `<img>`.'
      - text: 'SVG через `<img>` — отдельный документ, стили страницы туда не проникают'
        correct: true
        why: 'Для страницы это просто изображение без доступного внутреннего DOM, поэтому селектор `.icon path` ничего не находит.'
      - text: 'Нужно красить через `color`, а не через `fill`'
        why: '`color` тоже не проникнет внутрь SVG из `<img>`. Приём с `currentColor` работает для инлайн-SVG и для `<use>` из спрайта.'
      - text: 'Браузер кэширует SVG вместе со стилями, и нужно сбросить кэш'
        why: 'Кэш ни при чём: правило не сработает и с пустым кэшем.'
    explanation: |
      SVG можно подключить по-разному, и от способа зависит, что с ним можно делать. Через `<img>` или
      `background-image` это изолированная картинка: кэшируется, грузится отдельно, но красить её из CSS
      страницы нельзя, а скрипты внутри не выполняются. Инлайн-`<svg>` в разметке — часть DOM: его элементы
      стилизуются и анимируются, удобно задать `fill="currentColor"` и красить иконку через `color`.
      Компромисс — SVG-спрайт с `<use href="sprite.svg#cart">`. Для одноцветных иконок бывает и
      `mask-image` с фоном нужного цвета.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/SVG/Guides/SVG_as_an_image
    source: own

  - id: html-media-008
    level: middle
    tags: [fetchpriority, lcp, performance]
    question: |
      Что делает атрибут `fetchpriority="high"` на картинке?
    code: |
      <img src="hero.jpg" fetchpriority="high" alt="...">
    codeLang: html
    options:
      - text: 'Загружает картинку раньше всех ресурсов страницы, включая CSS'
        why: 'Атрибут повышает приоритет относительно других картинок и похожих ресурсов, но не ставит её впереди критичных стилей.'
      - text: 'Подсказывает браузеру поднять приоритет загрузки'
        correct: true
        why: 'Картинки стартуют с низким приоритетом, пока браузер не посчитает вёрстку. Атрибут сразу даёт главной картинке первого экрана высокий.'
      - text: 'Отключает ленивую загрузку у всех картинок на странице'
        why: 'Атрибут действует только на свой элемент и не меняет `loading` у других.'
      - text: 'Заставляет загрузить картинку повторно, даже если она в кэше'
        why: 'Кэш работает как обычно, атрибут влияет только на очередь сетевых запросов.'
    explanation: |
      Браузер раздаёт ресурсам приоритеты: CSS и синхронные скрипты в head — высокий, картинки — сначала
      низкий. Картинкам в видимой области приоритет повышают, но только после расчёта вёрстки. Атрибут
      `fetchpriority` (Priority Hints) позволяет сказать об этом сразу: `high` для LCP-картинки, `low` для
      второстепенных — например, невидимых слайдов карусели. Это подсказка, а не приказ, и злоупотреблять
      ей бессмысленно: если высокий приоритет у всего, его нет ни у чего.
    links:
      - https://web.dev/articles/fetch-priority
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/img#fetchpriority
    source: own

  - id: html-media-009
    level: senior
    tags: [srcset, sizes, performance]
    question: |
      В карточке товара картинка показывается шириной 300px. Разработчик указал `srcset` с дескрипторами `w`,
      но забыл `sizes`. Что будет на ноутбуке с экраном 1440px и DPR 1?
    code: |
      <img class="card-photo"
        srcset="p-300.jpg 300w, p-600.jpg 600w, p-1500.jpg 1500w"
        src="p-600.jpg" alt="...">
    codeLang: html
    options:
      - text: 'Браузер возьмёт `p-300.jpg`, потому что знает ширину картинки из CSS'
        why: 'Выбор файла происходит до расчёта вёрстки, когда ширина из CSS ещё неизвестна. Поэтому и нужен `sizes`.'
      - text: 'Загрузится `p-1500.jpg`'
        correct: true
        why: 'Без `sizes` браузер считает, что слот равен `100vw`, то есть 1440px, и выбирает подходящий большой файл. Пользователь получает в 25 раз больше пикселей, чем нужно.'
      - text: 'Браузер проигнорирует `srcset` и загрузит `src`'
        why: '`srcset` с `w` без `sizes` не игнорируется: `sizes` получает значение по умолчанию.'
      - text: 'Загрузятся все три файла, а покажется наиболее подходящий'
        why: 'Браузер загружает только один кандидат из `srcset`.'
    explanation: |
      Выбор кандидата из `srcset` делается рано, пока preload-сканер ещё не знает вёрстки. Поэтому ширину
      слота сообщают через `sizes`. Если `sizes` нет, по спецификации он равен `100vw`, и на широком экране
      браузер скачивает файл под всю ширину окна, даже если картинка — миниатюра. Ошибка незаметна
      визуально, но съедает трафик и замедляет загрузку. Для ленивых картинок есть новое значение
      `sizes="auto"`, при котором браузер берёт реальную ширину из вёрстки, но поддерживается оно пока не везде.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/img#sizes
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Guides/Responsive_images
    source: own

  - id: html-media-010
    level: junior
    tags: [alt, accessibility, theory]
    question: |
      Какие из правил для атрибута `alt` у `<img>` верны?
    options:
      - text: '`alt` у картинки-ссылки описывает, куда ведёт ссылка'
        correct: true
        why: 'Для логотипа-ссылки на главную это «На главную» или название сайта, а не «логотип». Картинка тут — единственный текст ссылки.'
      - text: '`alt` описывает, что картинка значит в этом месте страницы'
        correct: true
        why: 'Для кнопки-лупы это «Поиск», а не «Иконка увеличительного стекла». Текст заменяет картинку, когда её не видно.'
      - text: '`alt` можно не писать, если у картинки есть `title`'
        why: '`title` — запасной механизм: спецификация не рекомендует на него полагаться, многие браузеры не передают его вспомогательным технологиям, а подсказку не видно с клавиатуры и на сенсорных экранах.'
      - text: 'Текст `alt` стоит начинать со слов «Изображение» или «Картинка»'
        why: 'Скринридер и так объявляет, что это изображение. Лишние слова только удлиняют озвучивание.'
      - text: '`alt` должен дословно повторять подпись `<figcaption>` рядом'
        why: 'Повтор заставит скринридер прочитать одно и то же дважды. Если подпись уже описывает картинку, `alt` может быть короче или пустым.'
    explanation: |
      `alt` — текстовая замена изображения. Её озвучивают скринридеры, показывает браузер при ошибке загрузки,
      используют поисковики. Хороший `alt` описывает смысл, а не внешний вид, и зависит от контекста: одна и та же
      фотография может быть «Директор компании Анна Иванова» в статье и пустой в галерее, где рядом есть подпись.
      Декоративным картинкам — пустой `alt`, а ещё лучше выносить декор в CSS. Отсутствие `alt` — ошибка
      доступности, которую ловят линтеры и аудиты вроде Lighthouse.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/HTMLImageElement/alt
      - https://www.w3.org/WAI/tutorials/images/decision-tree/
