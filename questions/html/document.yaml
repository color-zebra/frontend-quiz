questions:
  - id: html-document-001
    level: junior
    tags: [doctype, quirks-mode]
    question: |
      Зачем в начале страницы пишут `<!DOCTYPE html>`?
    options:
      - text: 'Без него браузер не распознает теги HTML5 вроде `<section>` и `<nav>`'
        why: 'Теги HTML5 распознаются независимо от doctype: режим меняет отрисовку и пару мелочей разбора, но не набор известных тегов.'
      - text: 'Он включает режим стандартов вместо quirks mode'
        correct: true
        why: 'Ровно для этого doctype и нужен сегодня: его наличие переключает документ в no-quirks mode, где CSS работает по спецификации.'
      - text: 'Он подключает DTD-схему, по которой браузер проверяет разметку'
        why: 'Так задумывалось в HTML 4 и XHTML, но браузеры DTD не загружали и разметку по ней не проверяли. В HTML5 doctype вообще не ссылается на DTD.'
      - text: 'Он нужен только поисковикам и валидаторам'
        why: 'Влияет и на отображение: без doctype иначе считаются процентные высоты, высота строк, размеры в таблицах и другие мелочи.'
    explanation: |
      Исторически браузеры подстраивались под кривую вёрстку 90-х. Когда появились стандарты CSS,
      нужно было не сломать старые сайты, поэтому ввели переключатель: есть правильный doctype — режим
      стандартов (no-quirks), нет его — quirks mode с эмуляцией старых особенностей. Например, в quirks mode
      `body` растягивается на всё окно, проценты высоты считаются иначе, а высота строк в ячейках таблиц с
      картинками другая. Короткая форма `<!DOCTYPE html>` — минимальная строка, которая надёжно включает
      режим стандартов во всех браузерах.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Guides/Quirks_mode_and_standards_mode
      - https://quirks.spec.whatwg.org/
    source: own

  - id: html-document-002
    level: junior
    tags: [meta, viewport, mobile]
    question: |
      Что произойдёт на мобильном телефоне, если убрать из `<head>` эту строку?
    code: |
      <meta name="viewport" content="width=device-width, initial-scale=1">
    codeLang: html
    options:
      - text: 'Ничего: мобильные браузеры сами подстраивают страницу под ширину экрана'
        why: 'Наоборот: без этой строки мобильный браузер считает, что сайт рассчитан на десктоп, и не подстраивается.'
      - text: 'Страница отрисуется шириной около 980px и уменьшится целиком'
        correct: true
        why: 'Без meta viewport браузер берёт виртуальную ширину layout viewport (обычно 980px), рисует страницу под неё и масштабирует до экрана. Медиазапросы для узких экранов при этом не срабатывают.'
      - text: 'Страница перестанет масштабироваться жестами двумя пальцами'
        why: 'Масштабирование жестами отключают параметрами `user-scalable=no` или `maximum-scale`, а не отсутствием тега. Без тега масштабировать как раз можно.'
      - text: 'Браузер покажет пользователю предупреждение о неадаптивном сайте'
        why: 'Никаких предупреждений браузеры не показывают, страница просто будет мелкой.'
    explanation: |
      Когда появились смартфоны, почти все сайты были свёрстаны под десктоп. Чтобы они не разваливались,
      мобильные браузеры рисуют страницу в виртуальном окне шириной около 980px, а потом уменьшают её
      под экран. Строка `width=device-width` говорит: «я адаптивный, делай ширину layout viewport равной
      ширине устройства в CSS-пикселях», а `initial-scale=1` задаёт масштаб 1:1. Без этого медиазапрос
      `(max-width: 600px)` не сработает на телефоне, ведь браузер считает ширину равной 980px.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Guides/Viewport_meta_element
    source: own

  - id: html-document-003
    level: middle
    tags: [meta, charset, encoding]
    question: |
      Почему `<meta charset="utf-8">` рекомендуют ставить самым первым элементом в `<head>`?
    options:
      - text: 'Иначе браузер проигнорирует все meta-теги, стоящие перед ним'
        why: 'Остальные meta-теги работают независимо от того, где стоит charset.'
      - text: 'Объявление кодировки должно попасть в первые 1024 байта документа'
        correct: true
        why: 'Браузер ищет кодировку пред-сканированием начала файла, ещё до разбора. Объявление дальше 1024 байт может привести к повторному разбору или неверно прочитанному тексту.'
      - text: 'Так требует только валидатор, на работу браузера порядок не влияет'
        why: 'Влияет: если кодировка определена поздно, браузеру приходится переразбирать документ, а текст до этого места может быть прочитан неверно.'
      - text: 'Иначе `<title>` с кириллицей не сохранится в истории браузера'
        why: 'Дело не в истории браузера: при неверно определённой кодировке ломается любой текст до места объявления, title — лишь частный случай.'
    explanation: |
      Байты превращаются в буквы только после того, как известна кодировка. Если сервер не прислал её
      в заголовке `Content-Type: text/html; charset=utf-8`, браузер сканирует первые 1024 байта в поисках
      `<meta charset>`. Если объявление стоит дальше, браузер успевает начать разбор с догадкой о кодировке
      и, найдя meta, может перезапустить разбор. Надёжнее всего — отдавать кодировку в HTTP-заголовке и
      ставить meta первым элементом в head.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/meta#charset
      - https://html.spec.whatwg.org/multipage/semantics.html#charset
    source: own

  - id: html-document-004
    level: junior
    tags: [lang, a11y, i18n]
    question: |
      Что из перечисленного **не** зависит от атрибута `lang` у `<html>`?
    options:
      - text: 'Произношение текста скринридером'
        why: 'Зависит: скринридер выбирает голос и правила чтения по языку. Без `lang` русский текст английским голосом звучит неразборчиво.'
      - text: 'Автоматические переносы слов через CSS `hyphens: auto`'
        why: 'Зависит: словари переносов выбираются по языку элемента. Без `lang` переносы не расставятся.'
      - text: 'Язык стандартных сообщений валидации форм'
        correct: true
        why: 'Сообщения вроде «Заполните это поле» выводятся на языке интерфейса браузера, а не на языке страницы.'
      - text: 'Решение браузера, предлагать ли перевод страницы'
        why: 'Зависит: браузер учитывает `lang` вместе со своим определением языка по тексту, когда решает, предлагать ли перевод.'
    explanation: |
      `lang` сообщает, на каком языке написан контент. Его читают скринридеры (выбор голоса), CSS
      (`hyphens`, селектор `:lang()`, выбор кавычек для `q`), переводчики, проверка орфографии. Язык можно
      переопределять на любом элементе, например `<span lang="en">` внутри русского текста. А интерфейс
      самого браузера, включая тексты стандартной валидации форм, следует настройкам браузера.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes/lang
    source: own

  - id: html-document-005
    level: middle
    tags: [quirks-mode, dom]
    question: |
      Как из JavaScript узнать, в каком режиме браузер отрисовывает страницу — стандартов или quirks?
    options:
      - text: '`document.doctype !== null`'
        why: 'Наличие doctype не гарантирует режим стандартов: устаревшие doctype включают quirks или limited-quirks mode.'
      - text: '`document.compatMode`'
        correct: true
        why: 'Свойство возвращает `"CSS1Compat"` для режима стандартов и `"BackCompat"` для quirks.'
      - text: '`document.documentMode`'
        why: 'Это свойство было только в Internet Explorer. В современных браузерах его нет.'
      - text: '`navigator.standardsMode`'
        why: 'Такого свойства не существует.'
    explanation: |
      Режим выбирается один раз, когда парсер читает doctype. Есть три режима: no-quirks (стандарты),
      limited-quirks (почти стандарты, отличается в основном высотой строк в ячейках таблиц с картинками)
      и quirks. `document.compatMode` возвращает `"BackCompat"` для quirks и `"CSS1Compat"` для двух
      остальных. Пригодится, когда странная вёрстка в легаси-проекте объясняется пропавшим doctype.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Document/compatMode
    source: own

  - id: html-document-006
    level: senior
    tags: [base, url]
    question: |
      Страница открыта по адресу `https://site.ru/blog/post-1`. Куда приведёт клик по ссылке?
    code: |
      <head>
        <base href="https://site.ru/">
      </head>
      <body>
        <a href="#comments">К комментариям</a>
      </body>
    codeLang: html
    options:
      - text: 'Прокрутит текущую страницу к элементу `id="comments"`'
        why: 'Так было бы без `<base>`. С ним даже якорная ссылка разрешается относительно базового URL.'
      - text: 'Откроет `https://site.ru/#comments`'
        correct: true
        why: 'Относительный URL `#comments` разрешается от базового `https://site.ru/`. Получается адрес другой страницы, и браузер уходит на главную.'
      - text: 'Откроет `https://site.ru/blog/#comments`'
        why: 'Путь `/blog/` из адреса страницы не берётся: голый фрагмент разрешается от базового URL целиком.'
      - text: 'Прокрутит страницу: `<base>` влияет только на картинки и скрипты'
        why: '`<base>` влияет на все относительные URL документа: ссылки, формы, картинки, скрипты.'
    explanation: |
      `<base href>` меняет точку отсчёта для всех относительных URL документа. Фрагмент `#comments` —
      тоже относительный URL: браузер склеивает его с базовым адресом, а не с адресом страницы. Если
      получившийся адрес отличается от текущего документа, происходит переход. Это частая ловушка в
      SPA, где `<base href="/">` ставят ради роутера, а потом ломаются якорные ссылки и ссылки на
      SVG-спрайты вида `<use href="#icon">`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/base
    source: own

  - id: html-document-007
    level: senior
    tags: [parsing, dom]
    question: |
      Какой DOM построит браузер из этой разметки?
    code: |
      <p><div>текст</div></p>
    codeLang: html
    options:
      - text: '`<p><div>текст</div></p>`'
        why: 'Внутри `<p>` разрешён только phrasing content, а `<div>` к нему не относится. Парсер не может оставить такую вложенность.'
      - text: '`<p></p><div>текст</div><p></p>`'
        correct: true
        why: 'Открывающий `<div>` закрывает открытый `<p>`. Закрывающий `</p>` без пары по спецификации создаёт пустой элемент `<p></p>`.'
      - text: '`<p></p><div>текст</div>`'
        why: 'Большинство лишних закрывающих тегов парсер действительно игнорирует, но для `</p>` и `</br>` прописано особое поведение: они создают элемент.'
      - text: '`<div>текст</div>`'
        why: 'Открытый `<p>` уже попал в DOM к моменту, когда встретился div. Парсер не удаляет вставленные элементы, он закрывает их.'
    explanation: |
      HTML-парсер никогда не падает с ошибкой: на любой вход он строит DOM по алгоритму из спецификации.
      Для `<p>` действуют правила автоматического закрытия: блочные элементы (`div`, `ul`, `h1` и другие)
      закрывают открытый абзац; `table` делает это только в режиме стандартов. Отсюда ловушка: разметка в
      исходнике и реальный DOM расходятся, и стили или скрипты, рассчитанные на вложенность, ломаются.
      React поэтому предупреждает «validateDOMNesting: div cannot appear as a descendant of p», а при
      серверном рендеринге такое расхождение даёт ошибку гидратации.
    links:
      - https://html.spec.whatwg.org/multipage/parsing.html#parsing-main-inbody
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/p
    source: own

  - id: html-document-008
    level: senior
    tags: [parsing, dom, table]
    question: |
      Где окажется `<div>` в DOM после разбора этой разметки?
    code: |
      <table>
        <div>Подпись</div>
        <tr><td>Ячейка</td></tr>
      </table>
    codeLang: html
    options:
      - text: 'Внутри `<table>` перед строкой'
        why: 'Прямо внутри таблицы `<div>` находиться не может, и парсер не оставляет его на месте.'
      - text: 'Внутри автоматически созданного `<tbody>`'
        why: '`<tbody>` действительно создаётся автоматически, но только для строк `<tr>`. `<div>` туда не попадёт.'
      - text: 'Перед `<table>`'
        correct: true
        why: 'Это foster parenting: контент, которому не место внутри таблицы, парсер переносит прямо перед ней.'
      - text: 'Нигде: парсер его удалит'
        why: 'Парсер HTML не теряет контент, он перемещает его по правилам восстановления после ошибок.'
    explanation: |
      Внутри `<table>` разрешены только табличные элементы. Если парсер встречает там что-то другое,
      включается механизм foster parenting: узел вставляется в DOM перед таблицей. Поэтому текст или блок,
      случайно оставленный между `<tr>`, визуально «выпрыгивает» над таблицей. Строки без явного `<tbody>`
      парсер заворачивает в автоматически созданный `<tbody>`. Это важно и для селекторов: `table > tr`
      в CSS ничего не найдёт.
    links:
      - https://html.spec.whatwg.org/multipage/parsing.html#foster-parent
    source: own

  - id: html-document-009
    level: middle
    tags: [parsing, void-elements, self-closing]
    question: |
      Какой DOM получится из этой разметки в обычном HTML-документе?
    code: |
      <div class="spacer" />
      <p>Текст</p>
    codeLang: html
    options:
      - text: 'Пустой `div`, а за ним `p`'
        why: 'В JSX и XML `/>` закрывает элемент. HTML-парсер для обычных элементов этот слеш игнорирует.'
      - text: '`p` внутри `div`'
        correct: true
        why: 'Слеш в `<div />` ничего не значит, тег считается открывающим. Абзац становится потомком div до ближайшего `</div>` или конца родителя.'
      - text: 'Только `p`, без `div`'
        why: 'Парсер не отбрасывает элементы из-за лишнего слеша. Он просто его игнорирует.'
      - text: '`div` внутри `p`'
        why: 'Абзац никуда не «оборачивает» div: разметка идёт сверху вниз, и открытый div становится родителем следующего за ним абзаца.'
    explanation: |
      В HTML есть void-элементы, у которых не бывает содержимого и закрывающего тега: `br`, `img`, `input`,
      `meta`, `link`, `hr` и ещё несколько. Для них `<br>` и `<br />` равнозначны: слеш допускается, но
      ничего не делает. У обычных элементов слеш тоже игнорируется, поэтому `<div />` — просто открытый
      div, и всё следующее попадает внутрь. Привычка из JSX, где `<div />` — пустой элемент, в чистом HTML
      даёт неожиданную вложенность. Исключение — инлайн-SVG и MathML: там HTML-парсер учитывает самозакрытие, и
      `<path />` закрывается.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/Void_element
      - https://html.spec.whatwg.org/multipage/syntax.html#start-tags
    source: own
