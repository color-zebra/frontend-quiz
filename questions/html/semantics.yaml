topic: html
subtopic: semantics
questions:
  - id: html-semantics-001
    level: junior
    tags: [section, article, div]
    question: |
      Карточка товара в каталоге: фото, название, цена, кнопка «В корзину». Карточку можно показать
      отдельно, например в рассылке, и она останется понятной. Какой элемент лучше подходит для обёртки?
    options:
      - text: '`<section>` — карточка является тематическим разделом каталога'
        why: '`<section>` — раздел более крупного целого, обычно с заголовком. Самостоятельная единица контента лучше описывается `<article>`.'
      - text: '`<article>` — самостоятельный блок, понятный вне страницы'
        correct: true
        why: '`<article>` предназначен для самодостаточного контента, который имеет смысл вне страницы: пост, комментарий, карточка товара, виджет.'
      - text: '`<div>` — семантические теги нужны только для крупных областей страницы'
        why: '`<div>` подходит, когда смысла нет и нужна только обёртка для стилей. У карточки есть ясный смысл.'
      - text: '`<aside>` — карточки в каталоге второстепенны по отношению к фильтрам'
        why: '`<aside>` — контент, косвенно связанный с основным: сайдбар, врезка. Карточки каталога и есть основной контент.'
    explanation: |
      Проверка на `<article>` простая: если блок можно вынести на другую страницу или в RSS и он останется
      осмысленным — это article. `<section>` группирует часть документа по теме и почти всегда
      начинается с заголовка, иначе это скорее div. Семантика нужна не ради красоты: скринридеры дают
      прыгать по таким областям, поисковики лучше понимают структуру, а коду проще читаться.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/article
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/section
    source: own

  - id: html-semantics-002
    level: junior
    tags: [header, footer, landmarks]
    question: |
      Сколько элементов `<header>` и `<footer>` может быть на странице?
    options:
      - text: 'Ровно по одному на документ, иначе скринридеры запутаются'
        why: 'Это частое заблуждение. Ограничение «один видимый» есть у `<main>`, а не у header и footer.'
      - text: 'Сколько угодно — у каждого раздела может быть свой'
        correct: true
        why: 'Свой header и footer может быть у документа, у каждой `<article>` и `<section>`. Они относятся к ближайшему разделу.'
      - text: 'По одному внутри каждого `<main>`, а вне `<main>` — запрещены'
        why: '`<main>` на странице один, и header с footer к нему не привязаны. Шапка сайта обычно как раз вне main.'
      - text: 'Не больше двух каждого: для страницы и для основного контента'
        why: 'Такого числового ограничения в спецификации нет.'
    explanation: |
      `<header>` и `<footer>` описывают вводную и заключительную часть ближайшего раздела: документа,
      статьи, секции. Роли landmark `banner` и `contentinfo`, по которым скринридер прыгает к шапке и подвалу
      сайта, получают только те header и footer, у которых нет предка `main`, `article`, `aside`, `nav` или
      `section`. Обёртка из обычного `div` этому не мешает. Ещё одно правило: внутри header нельзя вкладывать
      header или footer.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/header
      - https://www.w3.org/TR/html-aam-1.0/#el-header
    source: own

  - id: html-semantics-003
    level: middle
    tags: [main, landmarks]
    question: |
      Что верно про элемент `<main>`?
    options:
      - text: 'Он может быть только один на документ, без исключений'
        why: 'Исключение есть: дополнительные `<main>` допустимы, если все, кроме одного, скрыты атрибутом `hidden`. Так делают в SPA с несколькими экранами.'
      - text: 'Видимым может быть только один `<main>`'
        correct: true
        why: 'Можно держать несколько, но все, кроме одного, должны быть скрыты атрибутом `hidden`: в каждый момент на странице один основной контент.'
      - text: 'Его можно вкладывать в `<article>`, если статья и есть основной контент'
        why: '`<main>` не может быть потомком `<article>`, `<aside>`, `<header>`, `<footer>` или `<nav>`.'
      - text: 'Это стилистический элемент, скринридеры его не замечают'
        why: '`<main>` получает роль landmark `main`, и скринридеры позволяют сразу перейти к основному контенту, минуя меню.'
    explanation: |
      `<main>` отмечает уникальное содержимое страницы — без шапки, меню и подвала, которые повторяются
      на всех страницах. Ему соответствует landmark `main`: пользователь скринридера одной командой
      прыгает к контенту, не слушая навигацию. Отсюда и ограничение: основная область в каждый момент одна.
      В одностраничных приложениях несколько `<main>` разрешены, если показан только один.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/main
      - https://html.spec.whatwg.org/multipage/grouping-content.html#the-main-element
    source: own

  - id: html-semantics-004
    level: middle
    tags: [strong, em, b, i]
    question: |
      Чем `<strong>` отличается от `<b>`?
    options:
      - text: 'Ничем: оба выделяют текст жирным, `<b>` просто устарел в HTML5'
        why: '`<b>` не устарел. В HTML5 у него своя роль — стилистическое выделение без дополнительной важности.'
      - text: '`<strong>` — важность, `<b>` — выделение без дополнительного смысла'
        correct: true
        why: 'Разница смысловая, а не визуальная. По умолчанию оба жирные, но описывают разные намерения автора.'
      - text: '`<strong>` скринридеры всегда произносят громче или с ударением'
        why: 'Большинство скринридеров по умолчанию никак не озвучивают `strong` и `em`. Смысл сохраняется в документе, но рассчитывать на интонацию нельзя.'
      - text: '`<b>` запрещено использовать внутри ссылок и кнопок'
        why: 'Такого ограничения нет: `<b>` — обычный phrasing content.'
    explanation: |
      В HTML5 пары тегов разделили по смыслу. `<strong>` — важно («Внимание: необратимое действие»), `<em>` —
      смысловое ударение, меняющее смысл фразы. `<b>` — выделить без добавления важности (ключевые слова,
      названия товаров в обзоре), `<i>` — текст другого «голоса» (термин, иностранное слово, мысль героя).
      Если нужен просто жирный шрифт для дизайна, честнее сделать это CSS. Важная оговорка: скринридеры
      обычно не меняют интонацию, так что критичную информацию нельзя передавать только тегом.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/strong
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/b
    source: own

  - id: html-semantics-005
    level: middle
    tags: [headings, outline]
    question: |
      Разработчик ставит `<h1>` в начале каждой `<section>`, рассчитывая, что браузер и скринридеры
      сами поймут уровни вложенности. Что произойдёт на самом деле?
    options:
      - text: 'Браузер построит структуру по вложенности: `<h1>` во вложенной секции станет заголовком второго уровня'
        why: 'Это outline algorithm. Он был в черновиках HTML5, но ни один браузер и скринридер его не реализовал, а в 2022 году его убрали из спецификации.'
      - text: 'Все заголовки останутся первого уровня'
        correct: true
        why: 'Уровень определяется только цифрой в теге (или `aria-level`). Структуру заголовков нужно задавать явно: h1, h2, h3.'
      - text: 'Валидатор выдаст ошибку, а браузер покажет только первый `<h1>`'
        why: 'Несколько `<h1>` — не ошибка, все они будут показаны. Проблема в структуре для доступности, а не в валидности.'
      - text: 'Скринридер будет пропускать все `<h1>`, кроме самого первого'
        why: 'Скринридер ничего не пропускает, он просто покажет плоский список заголовков одного уровня.'
    explanation: |
      Пользователи скринридеров часто изучают страницу по заголовкам: открывают их список и прыгают по
      уровням, как по оглавлению. Если все заголовки первого уровня, оглавление превращается в плоский
      список. Алгоритм, вычисляющий уровни по вложенности `section`, так и не появился в браузерах и удалён
      из стандарта. Сбивает с толку то, что браузеры долго уменьшали шрифт `h1` внутри `section` и `article`
      стилями по умолчанию — визуально казалось, что алгоритм работает. Сейчас эти стили убирают. Правило:
      уровень заголовка выбирать по иерархии смысла, не пропускать уровни, а размер задавать в CSS.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/Heading_Elements
      - https://adrianroselli.com/2016/08/there-is-no-document-outline-algorithm.html
    source: own

  - id: html-semantics-006
    level: junior
    tags: [nav, landmarks]
    question: |
      Когда стоит использовать `<nav>`?
    options:
      - text: 'Для любой группы ссылок, включая ссылки внутри текста статьи'
        why: 'Если оборачивать в `<nav>` каждую группу ссылок, областей станет так много, что навигация по ним потеряет смысл.'
      - text: 'Для основных блоков навигации'
        correct: true
        why: 'Главное меню, хлебные крошки, оглавление, пагинация. Скринридер показывает их как отдельные области, к которым можно быстро перейти.'
      - text: 'Только для главного меню в шапке: на странице `<nav>` должен быть один'
        why: 'Навигаций может быть несколько. Если их больше одной, им дают разные подписи через `aria-label`, например «Основное меню» и «Хлебные крошки».'
      - text: 'Для кнопок, которые переключают вкладки и состояние интерфейса'
        why: 'Кнопки управления интерфейсом — не навигация. `<nav>` содержит ссылки на другие страницы или части страницы.'
    explanation: |
      `<nav>` создаёт landmark `navigation` — точку, к которой пользователь скринридера может сразу перейти.
      Ценность landmark-ов в том, что их мало и они значимые: шапка, меню, основной контент, подвал. Ссылки в
      подвале на политику конфиденциальности или ссылки внутри текста статьи обычно не заворачивают в
      `<nav>`. Несколько навигаций на странице различают через `aria-label`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/nav
    source: own

  - id: html-semantics-007
    level: middle
    tags: [address]
    question: |
      Для чего предназначен элемент `<address>`?
    options:
      - text: 'Для любого почтового адреса на странице, например адреса пункта выдачи'
        why: 'Это самое распространённое неверное использование. Произвольные почтовые адреса размечают обычными элементами.'
      - text: 'Для контактов автора или владельца ближайшей статьи или документа'
        correct: true
        why: '`<address>` описывает, как связаться с автором: email, телефон, ссылка на профиль. Почтовый адрес — только в роли контакта автора.'
      - text: 'Для адреса страницы (URL), чтобы поисковик правильно её проиндексировал'
        why: 'Канонический адрес страницы задают через `<link rel="canonical">`, а не через `<address>`.'
      - text: 'Для реквизитов компании, и только внутри `<footer>`'
        why: 'Расположение в footer типично, но не обязательно. И главное — смысл: это контакты автора или владельца, а не любые реквизиты.'
    explanation: |
      Название сбивает с толку. По спецификации `<address>` — контактная информация для ближайшего предка
      `<article>` или `<body>`. В статье это контакты автора, на уровне страницы — контакты владельца сайта.
      Адреса магазинов в списке, адрес доставки в заказе и прочие адреса, которые не являются контактами
      автора, размечаются обычными `<p>` или `<div>`. Для машиночитаемых адресов есть микроразметка Schema.org.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/address
    source: own

  - id: html-semantics-008
    level: middle
    tags: [dialog, modal, top-layer]
    question: |
      Чем `dialog.showModal()` отличается от `dialog.show()`?
    options:
      - text: '`showModal()` делает фон инертным, выводит диалог в top layer и закрывает его по Esc'
        correct: true
        why: 'Всё это есть только в модальном режиме, плюс подложка `::backdrop`. `show()` показывает диалог без top layer, и страница под ним остаётся интерактивной.'
      - text: 'Разница только во внешнем виде: `showModal()` добавляет затемнённую подложку'
        why: 'Подложка `::backdrop` — самое заметное отличие, но главное — поведение: инертный фон, фокус внутри, закрытие по Esc, top layer.'
      - text: '`show()` открывает диалог в отдельном окне браузера, а `showModal()` — внутри страницы'
        why: 'Оба метода показывают диалог внутри страницы. Новые окна открывает `window.open()`.'
      - text: '`showModal()` останавливает выполнение JavaScript, пока диалог не закроют'
        why: '`showModal()` возвращается сразу, код продолжает выполняться. Блокируют поток только старые `alert`, `confirm`, `prompt`.'
    explanation: |
      Нативный `<dialog>` решает задачи, которые раньше требовали много кода. В модальном режиме он
      попадает в top layer — слой поверх всего, где не мешают `z-index` и `overflow: hidden` родителей.
      Остальной документ становится inert: по нему нельзя кликнуть, сфокусироваться, и скринридер его не
      видит. Фокус переходит в диалог, Esc закрывает его с событием `cancel`, а фон стилизуется через
      `::backdrop`. Немодальный `show()` нужен для неблокирующих панелей: окна чата, инспектора свойств.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/dialog
      - https://developer.mozilla.org/en-US/docs/Web/API/HTMLDialogElement/showModal
    source: own

  - id: html-semantics-009
    level: middle
    tags: [dialog, forms]
    question: |
      Что произойдёт при клике на кнопку «Удалить»?
    code: |
      <dialog id="confirm-dialog">
        <form method="dialog">
          <p>Удалить файл?</p>
          <button value="cancel">Отмена</button>
          <button value="delete">Удалить</button>
        </form>
      </dialog>
      <script>
        const dialog = document.getElementById('confirm-dialog');
        dialog.addEventListener('close', () => console.log(dialog.returnValue));
        dialog.showModal();
      </script>
    codeLang: html
    options:
      - text: 'Форма отправится на текущий URL, и страница перезагрузится'
        why: '`method="dialog"` — особый метод: форма никуда не отправляется по сети.'
      - text: 'Диалог закроется, в консоли появится `delete`'
        correct: true
        why: 'Отправка формы с `method="dialog"` закрывает родительский диалог и записывает `value` нажатой кнопки в `dialog.returnValue`.'
      - text: 'Ничего: кнопки без `type="submit"` форму не отправляют'
        why: 'Кнопка внутри формы по умолчанию имеет `type="submit"`, поэтому отправка произойдёт.'
      - text: 'Диалог закроется, в консоли появится пустая строка'
        why: 'Пустая строка была бы, если бы диалог закрыли по Esc или через `close()` без аргумента. Здесь значение берётся из нажатой кнопки.'
    explanation: |
      `method="dialog"` превращает отправку формы в закрытие ближайшего `<dialog>`. Значение нажатой
      submit-кнопки попадает в `dialog.returnValue`, после чего срабатывает событие `close`. Так собирается
      окно подтверждения без единой строчки обработчиков на кнопках: нужно лишь прочитать `returnValue`
      в `close`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/dialog#usage_notes
      - https://developer.mozilla.org/en-US/docs/Web/API/HTMLDialogElement/returnValue
    source: own

  - id: html-semantics-010
    level: junior
    tags: [button, link]
    question: |
      Элемент открывает модальное окно с формой обратной связи и никуда не ведёт. Какой тег выбрать?
    options:
      - text: '`<a href="#" onclick="openModal()">` — ссылки удобнее стилизовать'
        why: 'Ссылка обещает навигацию: скринридер скажет «ссылка», её можно открыть в новой вкладке, а `href="#"` ещё и прокрутит страницу наверх.'
      - text: '`<button type="button">` — это действие, а не переход'
        correct: true
        why: 'Действие на странице — это кнопка. Она фокусируется, срабатывает по Enter и Space и правильно объявляется скринридером.'
      - text: '`<div role="link" onclick="openModal()">` — роль подскажет скринридеру'
        why: 'Роль ссылки здесь неверна по смыслу, а `div` не получит ни фокуса, ни клавиатурного управления.'
      - text: '`<span tabindex="0" onclick="openModal()">` — фокус есть, значит доступно'
        why: 'Фокус есть, но нет роли и активации с клавиатуры: по Enter и Space ничего не произойдёт.'
    explanation: |
      Простое правило: ссылка ведёт куда-то (меняет URL или прокручивает к якорю), кнопка что-то делает
      на странице (открывает окно, отправляет форму, переключает состояние). От этого зависит поведение:
      ссылку открывают в новой вкладке колесом мыши и копируют адрес, ссылка активируется только Enter,
      а кнопка — Enter и Space. Скринридер объявляет роль, и пользователь ожидает соответствующего
      поведения. `<a href="#">` для действий — частая ошибка, которая ломает и семантику, и прокрутку.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/button
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/a#onclick_events
    source: own

  - id: html-semantics-011
    level: middle
    tags: [link, target-blank, security, noopener]
    question: |
      Ссылка на чужой сайт открывается в новой вкладке. Какую угрозу закрывал `rel="noopener"` и нужен ли он
      сейчас?
    code: |
      <a href="https://other.site" target="_blank">Партнёр</a>
    codeLang: html
    options:
      - text: 'Он защищал от загрузки вирусов, сейчас браузеры проверяют сайты сами'
        why: '`noopener` не связан с проверкой загрузок. Он управляет связью между вкладками через `window.opener`.'
      - text: 'Защищал исходную вкладку от подмены через `window.opener`; сейчас включён по умолчанию'
        correct: true
        why: 'Это атака reverse tabnabbing: чужая страница меняла `window.opener.location` на фишинговую копию. Современные браузеры ставят `noopener` для `_blank` сами.'
      - text: 'Он скрывал от чужого сайта адрес страницы, откуда пришёл пользователь'
        why: 'Это делает `rel="noreferrer"`: он убирает заголовок `Referer` и заодно подразумевает `noopener`.'
      - text: 'Он запрещал чужому сайту ставить cookie, и это до сих пор обязательно'
        why: 'Cookie чужого сайта регулируются политиками cookie и атрибутом `SameSite`, а не атрибутами ссылки.'
    explanation: |
      Страница, открытая через `target="_blank"`, раньше получала ссылку на вкладку-источник в
      `window.opener`. Злонамеренный сайт мог тихо выполнить `window.opener.location = 'https://phishing...'`,
      и пользователь, вернувшись на старую вкладку, видел поддельную страницу входа. `rel="noopener"`
      обнуляет `opener`. К 2021 году все браузеры стали применять это поведение для `target="_blank"` по умолчанию,
      но атрибут всё ещё пишут явно — ради старых браузеров и ясности кода. Неявный `noopener` касается
      ссылок и форм: `window.open(url)` по-прежнему даёт `opener`, если не передать `'noopener'`. `noreferrer` дополнительно
      скрывает адрес исходной страницы.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Attributes/rel/noopener
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/a#security_and_privacy
    source: own

  - id: html-semantics-012
    level: junior
    tags: [details, summary, disclosure]
    question: |
      Как сделать раскрывающийся блок «Подробнее» без JavaScript?
    options:
      - text: '`<details><summary>Подробнее</summary>Текст</details>`'
        correct: true
        why: 'Это нативный disclosure-виджет: клик по `summary` переключает атрибут `open`, всё доступно с клавиатуры и для скринридеров.'
      - text: '`<dialog>` с атрибутом `open` и кнопкой внутри для переключения'
        why: '`<dialog>` — окно поверх страницы, а не блок, раскрывающийся в потоке текста. Открыть его без JS сейчас можно (`<button commandfor="…" command="show-modal">`), но это другой виджет с другой семантикой.'
      - text: '`<section hidden>`, которая сама раскрывается при клике по заголовку'
        why: '`hidden` просто скрывает элемент. Раскрыть его по клику без скрипта не получится.'
      - text: 'Без JavaScript такое невозможно, нужен обработчик `click`'
        why: 'Возможно: для этого и существует пара `<details>` и `<summary>`.'
    explanation: |
      `<details>` и `<summary>` — встроенный раскрывающийся блок. `summary` — всегда видимый заголовок, по
      клику на него браузер переключает атрибут `open` у `details` и генерирует событие `toggle`. Всё работает
      с клавиатуры и правильно объявляется скринридерами. Несколько `<details>` с одинаковым атрибутом `name`
      превращаются в аккордеон: открытие одного закрывает остальные. Поиск по странице (Ctrl+F) умеет
      находить текст внутри закрытого `details` и раскрывать его.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/details
    source: own

  - id: html-semantics-013
    level: middle
    tags: [popover, top-layer, light-dismiss]
    question: |
      Открыт popover «Меню». Пользователь нажимает кнопку, открывающую popover «Профиль». Что произойдёт с «Меню»?
    code: |
      <button popovertarget="menu">Меню</button>
      <button popovertarget="profile">Профиль</button>
      <div id="menu" popover>...</div>
      <div id="profile" popover>...</div>
    codeLang: html
    options:
      - text: 'Останется открытым: оба окна будут видны в top layer одновременно'
        why: 'Так ведут себя `popover="manual"`. Значение по умолчанию `auto` допускает только одну открытую цепочку.'
      - text: 'Закроется: новый auto-popover вытесняет предыдущий'
        correct: true
        why: 'Атрибут `popover` без значения равен `auto`. Открытие auto-popover закрывает другие, кроме его предков в цепочке вложенных popover.'
      - text: 'Закроется, только если на нём есть обработчик `toggle`'
        why: 'Закрытие делает сам браузер, без обработчиков. Событие `toggle` лишь сообщает о смене состояния.'
      - text: 'Второй popover не откроется, пока первый не закроют вручную'
        why: 'Блокировки нет: новый auto-popover открывается и вытесняет предыдущий.'
    explanation: |
      Popover API даёт всплывающие элементы без JavaScript: `popover` на элементе и `popovertarget` на
      кнопке. Такие элементы отображаются в top layer поверх всего, но в отличие от `showModal()` не модальны:
      страница под ними остаётся интерактивной. У значения `auto` есть light dismiss — закрытие по клику
      вне popover и по Esc. Кроме того, открытие другого auto-popover закрывает текущий, если он не предок
      нового.
      `popover="manual"` закрывается только явно и не вытесняет другие — подходит для тостов.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Popover_API
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes/popover
    source: own

  - id: html-semantics-014
    level: middle
    tags: [template, dom]
    question: |
      Что происходит с содержимым `<template>` при загрузке страницы?
    code: |
      <template id="row">
        <tr><td><img src="avatar.png"></td><td class="name"></td></tr>
        <script>console.log('из шаблона');</script>
      </template>
    codeLang: html
    options:
      - text: 'Отрисовывается, но скрывается стилем браузера `display: none`'
        why: 'Содержимое шаблона вообще не попадает в документ и не отрисовывается — дело не в стилях.'
      - text: 'Разбирается в отдельный фрагмент и остаётся инертным'
        correct: true
        why: 'Содержимое лежит в DocumentFragment `template.content`: не отображается, картинки не грузятся, скрипты не выполняются. Оно оживает, когда клон вставят в документ.'
      - text: 'Игнорируется парсером как комментарий, достать его из JS невозможно'
        why: 'Парсер разбирает содержимое в DOM-фрагмент, и он доступен через `template.content`.'
      - text: 'Скрипт выполнится, а картинка загрузится, но сама разметка не покажется'
        why: 'Содержимое шаблона инертно целиком: ни скрипты, ни загрузки ресурсов там не запускаются.'
    explanation: |
      `<template>` хранит разметку «про запас». Парсер разбирает её в отдельный документ-фрагмент
      `template.content`, который не связан с отрисовкой: элементы там не видны, ресурсы не загружаются,
      скрипты не выполняются. Используют так: `document.importNode(template.content, true)` или
      `template.content.cloneNode(true)`, заполнить и вставить. Шаблон может лежать даже там, где его
      содержимое иначе было бы невалидно, например строки `<tr>` вне таблицы. На `<template>` построены
      веб-компоненты и декларативный Shadow DOM.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/template
    source: own

  - id: html-semantics-015
    level: senior
    tags: [parsing, links, interactive-content]
    question: |
      Карточка целиком сделана ссылкой на статью, а внутри неё — ссылка на автора. Какой DOM построит браузер?
    code: |
      <a href="/article/1" class="card">
        <h3>Заголовок статьи</h3>
        <a href="/author/7">Автор</a>
      </a>
    codeLang: html
    options:
      - text: 'Вложенную ссылку внутри карточки-ссылки'
        why: 'Ссылки не могут быть вложены друг в друга. Встретив новый `<a>` при открытом, парсер сначала закрывает открытый.'
      - text: 'Две соседние ссылки: карточка с заголовком, затем ссылка на автора'
        correct: true
        why: 'Открывающий `<a>` закрывает уже открытую ссылку. Ссылка на автора выходит из карточки, а финальный `</a>` оказывается лишним и игнорируется.'
      - text: 'Только внешнюю ссылку — внутренний `<a>` парсер отбросит'
        why: 'Парсер не отбрасывает элементы с содержимым: внутренняя ссылка останется, просто станет соседом карточки.'
      - text: 'Только внутреннюю ссылку — она заменит внешнюю'
        why: 'Внешняя ссылка к этому моменту уже в DOM вместе с заголовком. Парсер её закрывает, а не удаляет.'
    explanation: |
      В HTML интерактивный контент нельзя вкладывать друг в друга: ссылку в ссылку, кнопку в ссылку,
      ссылку в кнопку. Для `<a>` у парсера есть явное правило: новый открывающий `<a>` при уже открытом
      запускает закрытие предыдущего (adoption agency algorithm). Карточка «рассыпается»: ссылка на автора
      вылезает из неё и ломает вёрстку. Через `innerHTML` или JSX вложенные ссылки можно создать в DOM, но
      это невалидно и плохо для доступности. Правильный паттерн — карточка с обычной ссылкой в заголовке,
      растянутой на всю карточку псевдоэлементом `::after { position: absolute; inset: 0 }`, и ссылка на
      автора с `position: relative` поверх него.
    links:
      - https://html.spec.whatwg.org/multipage/parsing.html#parsing-main-inbody
      - https://inclusive-components.design/cards/
    source: own
