questions:
  - id: css-cascade-001
    level: junior
    tags: [specificity]
    question: |
      Какого цвета будет ссылка?
    code: |
      <nav id="nav">
        <ul class="menu">
          <li class="item"><a class="active" href="#">Главная</a></li>
        </ul>
      </nav>

      <style>
        .menu .item a.active { color: green; }
        #nav a { color: red; }
      </style>
    codeLang: html
    options:
      - text: 'Зелёного: у первого селектора больше частей'
        why: 'Количество частей не важно. Специфичность сравнивается по разрядам, начиная со старшего — id.'
      - text: 'Красного: селектор с id специфичнее любого числа классов'
        correct: true
        why: '`#nav a` = (1, 0, 1), а `.menu .item a.active` = (0, 3, 1). Один id перевешивает любое количество классов.'
      - text: 'Зелёного: браузер читает селекторы справа налево, а `a.active` справа специфичнее, чем просто `a`'
        why: 'Справа налево браузер сопоставляет селектор с элементами, но специфичность считается по всему селектору целиком.'
      - text: 'Зелёного: класс `.active` прямо на ссылке важнее селектора через предка'
        why: 'Близость к элементу на специфичность не влияет. Считается только состав селектора.'
    explanation: |
      Специфичность — тройка чисел (A, B, C): A — число id, B — классы, атрибуты и псевдоклассы,
      C — теги и псевдоэлементы. Сравниваются слева направо, как разряды: побеждает тот, у кого больше A,
      при равенстве — больше B и так далее. Переноса между разрядами нет: даже 11 классов не перебьют один id.
      Поэтому в стилях компонентов стараются обходиться без id: их потом трудно переопределить.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_cascade/Specificity
    source: own

  - id: css-cascade-002
    level: junior
    tags: [specificity, order]
    question: |
      Какого цвета будет текст?
    code: |
      <p class="red blue">Текст</p>

      <style>
        .blue { color: blue; }
        .red { color: red; }
      </style>
    codeLang: html
    options:
      - text: 'Синего: класс `blue` стоит в атрибуте последним'
        why: 'Порядок классов в атрибуте `class` не имеет значения для каскада.'
      - text: 'Красного: при равной специфичности побеждает правило, объявленное в CSS позже'
        correct: true
        why: 'Оба селектора — один класс, специфичность (0, 1, 0). Тогда решает порядок в таблице стилей, а `.red` объявлен ниже.'
      - text: 'Синего: класс `red` стоит в атрибуте первым и применяется первым, а `blue` его перезаписывает'
        why: 'Браузер не применяет классы по очереди. Он собирает все подходящие правила и выбирает победителя по каскаду.'
      - text: 'Фиолетового: цвета смешаются'
        why: 'Каскад всегда выбирает одно значение свойства, значения не смешиваются.'
    explanation: |
      Если у правил одинаковые происхождение, слой и специфичность, побеждает объявленное последним
      в порядке подключения стилей. Атрибут `class` — неупорядоченный набор, и `class="red blue"` для CSS
      ничем не отличается от `class="blue red"`. Это частый источник путаницы в утилитарных классах: когда
      на элементе конфликтуют `p-2` и `p-4`, побеждает тот, что ниже в собранном CSS, а не тот, что правее
      в разметке. Отсюда, например, утилита `tailwind-merge`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_cascade/Cascade#cascading_order
    source: own

  - id: css-cascade-003
    level: junior
    tags: [inheritance]
    question: |
      Какое из этих свойств наследуется по умолчанию?
    options:
      - text: '`border`'
        why: 'Рамка не наследуется: иначе у всех потомков элемента появилась бы своя рамка.'
      - text: '`padding`'
        why: 'Отступы задаются каждому элементу отдельно и не наследуются.'
      - text: '`color`'
        correct: true
        why: 'Цвет текста — типичное наследуемое свойство. Его задают на контейнере, и весь текст внутри получает его.'
      - text: '`background-color`'
        why: 'Фон не наследуется, у потомков по умолчанию `transparent`. Фон «виден» сквозь них, и кажется, что он унаследован.'
    explanation: |
      Наследуются в основном свойства текста: `color`, `font-*`, `line-height`, `letter-spacing`,
      `text-align`, `visibility`, `cursor`, `list-style`. Не наследуются свойства блока: размеры, отступы,
      рамки, фон, позиционирование, `display`. Любое свойство можно заставить наследоваться значением
      `inherit`. Ловушка с фоном: у потомка он прозрачный, поэтому сквозь него виден фон родителя, хотя
      значение не унаследовано.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_cascade/Inheritance
    source: own

  - id: css-cascade-004
    level: middle
    tags: [initial, inherit, unset, revert]
    question: |
      Какой будет `display` у этого `div`?
    code: |
      div.panel { display: initial; }
    codeLang: css
    options:
      - text: '`block`'
        why: 'Это самая частая ошибка. `block` для div задаёт стиль браузера, а `initial` берёт начальное значение свойства из спецификации.'
      - text: '`inline`'
        correct: true
        why: '`initial` не знает о типе элемента: он ставит начальное значение свойства, а у `display` это `inline`.'
      - text: '`none`'
        why: 'Так браузер скрывает лишь служебные элементы вроде `head` и `script`. `initial` берёт не стиль браузера, а начальное значение из спецификации — `inline`.'
      - text: '`inline-block`'
        why: 'Такой `display` браузер даёт некоторым элементам форм, например `button`. Но `initial` смотрит не на стили браузера, а на начальное значение свойства из спецификации.'
    explanation: |
      Четыре ключевых слова для сброса. `initial` — начальное значение из спецификации свойства (для
      `display` — `inline`, для `color` — `CanvasText`, обычно чёрный). `inherit` — значение родителя. `unset` —
      `inherit` для наследуемых свойств и `initial` для остальных. `revert` — откатывает к значению,
      которое было бы без авторских стилей, то есть к стилям пользователя и браузера. Чтобы вернуть div его `block`, нужен
      именно `revert`. Об этом стоит помнить при `all: initial`: он ломает элементам привычный `display`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/initial
      - https://developer.mozilla.org/en-US/docs/Web/CSS/revert
    source: own

  - id: css-cascade-005
    level: middle
    tags: [important, inline-style]
    question: |
      Какого цвета будет текст?
    code: |
      <p id="intro" style="color: green">Текст</p>

      <style>
        #intro { color: red; }
        p { color: blue !important; }
      </style>
    codeLang: html
    options:
      - text: 'Зелёного: инлайн-стиль сильнее любого селектора'
        why: 'Инлайн-стиль сильнее обычных правил, но не `!important`-объявлений из таблицы стилей.'
      - text: 'Красного: у селектора с id самая высокая специфичность'
        why: 'Специфичность сравнивается только среди объявлений одной важности. `!important` проверяется раньше.'
      - text: 'Синего: `!important` побеждает и инлайн-стиль, и любую специфичность'
        correct: true
        why: 'Важные объявления в каскаде стоят выше обычных, включая инлайновые. Специфичность `p` уже не важна.'
      - text: 'Чёрного: правила конфликтуют, и браузер сбрасывает цвет'
        why: 'Каскад всегда выбирает одного победителя, «сброса» из-за конфликта не бывает.'
    explanation: |
      Каскад сравнивает объявления по критериям в строгом порядке: происхождение и важность, затем слои,
      затем специфичность, затем порядок. Инлайн-стиль можно представить как самую специфичную ступеньку,
      но только среди обычных объявлений. `!important` переводит объявление на уровень выше, и там
      `p { color: blue !important }` бьёт и id, и `style`. Перебить его можно другим `!important` с большей
      специфичностью, `!important` с равной специфичностью ниже по коду, инлайновым `!important` или
      `!important` из каскадного слоя — важные объявления из слоёв сильнее важных вне слоёв.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_cascade/Cascade#cascading_order
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_cascade/Specificity#the_!important_exception
    source: own

  - id: css-cascade-006
    level: senior
    tags: [important, inheritance]
    question: |
      Какого цвета будет текст внутри `<span>`?
    code: |
      <div class="card">
        <span class="note">Примечание</span>
      </div>

      <style>
        .card { color: red !important; }
        .note { color: blue; }
      </style>
    codeLang: html
    options:
      - text: 'Красного: `!important` у родителя сильнее обычного правила у потомка'
        why: '`!important` действует в каскаде одного элемента. Наследование передаёт потомку значение, но не «важность».'
      - text: 'Синего: собственное значение элемента важнее унаследованного'
        correct: true
        why: 'Наследование срабатывает, только если у элемента нет своего значения. `.note` задаёт цвет напрямую, и `!important` родителя тут не участвует.'
      - text: 'Красного: `.card` объявлен раньше и поэтому имеет приоритет'
        why: 'Порядок здесь не играет роли: правила относятся к разным элементам и не конкурируют.'
      - text: 'Синего, но только если у `.note` специфичность выше, чем у `.card`'
        why: 'Специфичность правил родителя вообще не сравнивается с правилами потомка. У них разные элементы.'
    explanation: |
      Каскад решает, какое значение получит свойство конкретного элемента, из правил, которые подходят
      этому элементу. Наследование включается позже и только для свойств, у которых после каскада значения
      нет. Поэтому любое прямое объявление на потомке, даже с самым слабым селектором вроде `*`, побеждает
      унаследованное значение, каким бы `!important` оно ни было у родителя. Отсюда известный эффект:
      правило `* { color: black }` ломает наследование цвета на всей странице.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_cascade/Inheritance
    source: own

  - id: css-cascade-007
    level: senior
    tags: [cascade-layers, layer]
    question: |
      Какого цвета будет заголовок `<h1 class="title">` внутри `<div id="app">`?
    code: |
      @layer base {
        #app .title { color: red; }
      }

      .title { color: blue; }
    codeLang: css
    options:
      - text: 'Красного: у селектора с id выше специфичность'
        why: 'Специфичность сравнивается только внутри одного слоя. Слои проверяются раньше.'
      - text: 'Синего: стили вне слоёв сильнее стилей в слоях'
        correct: true
        why: 'Нормальные объявления без слоя идут в каскаде после всех слоёв и поэтому их перебивают.'
      - text: 'Красного: правило в `@layer` объявлено раньше'
        why: 'Порядок появления в коде проверяется последним и здесь не нужен: всё решили слои.'
      - text: 'Красного: правила внутри слоёв всегда сильнее правил вне слоёв'
        why: 'Ровно наоборот: обычные стили вне слоёв считаются самым последним слоем и перебивают все слои.'
    explanation: |
      Каскадные слои (`@layer`) вставлены в каскад перед специфичностью. Слой, объявленный позже, побеждает
      более ранние, а стили вне слоёв считаются самым последним слоем. В результате низкоспецифичный
      `.title` бьёт `#app .title` из слоя. Этим и ценны слои: сторонние библиотеки и reset можно положить в
      слой и переопределять своими простыми селекторами, без гонки специфичности.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/@layer
      - https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics/Cascade_layers
    source: own

  - id: css-cascade-008
    level: senior
    tags: [cascade-layers, important]
    question: |
      Какого цвета будет ссылка?
    code: |
      @layer reset, theme;

      @layer reset {
        a { color: gray !important; }
      }

      @layer theme {
        a { color: blue !important; }
      }
    codeLang: css
    options:
      - text: 'Синего: слой `theme` объявлен позже и побеждает'
        why: 'Для обычных объявлений так и есть. Но для `!important` порядок слоёв переворачивается.'
      - text: 'Серого: для `!important` побеждает более ранний слой'
        correct: true
        why: 'Важные объявления из ранних слоёв сильнее важных из поздних. Так базовый слой может защитить критичные правила.'
      - text: 'Серого: `!important` внутри слоёв игнорируется, и побеждает первое правило'
        why: '`!important` внутри слоёв работает, просто с обратным порядком.'
      - text: 'Цвет по умолчанию: два `!important` взаимно отменяются'
        why: 'Взаимоотмены в CSS нет: каскад всегда находит победителя.'
    explanation: |
      У важных объявлений весь порядок каскада перевёрнут: важные стили браузера сильнее важных авторских,
      а среди слоёв важные из раннего слоя сильнее, чем из позднего. Важные стили вне слоёв при этом
      слабее важных стилей из любого слоя. Логика такая: `!important` — способ сказать «это нельзя
      переопределить», и такая гарантия от фундаментального слоя (reset, доступность) должна быть сильнее
      поздних тем. Первая строка `@layer reset, theme;` фиксирует порядок слоёв заранее, независимо от
      того, где потом встретится их содержимое.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/@layer
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_cascade/Cascade#cascading_order
    source: own

  - id: css-cascade-009
    level: middle
    tags: [specificity, is, where]
    question: |
      Какова специфичность селектора `:is(#header, .footer) a` для ссылки внутри `.footer`?
    options:
      - text: '(0, 1, 1) — сработала ветка `.footer`'
        why: 'Специфичность `:is()` не зависит от того, какая ветка совпала. Берётся самый специфичный аргумент.'
      - text: '(1, 0, 1) — по самому специфичному аргументу'
        correct: true
        why: 'Аргумент `#header` даёт (1, 0, 0), плюс тег `a`. Это легко упустить и получить неожиданно «тяжёлый» селектор.'
      - text: '(0, 0, 1) — `:is()` не добавляет специфичности'
        why: 'Нулевая специфичность у `:where()`. `:is()` её добавляет.'
      - text: '(1, 1, 1) — специфичности аргументов складываются'
        why: 'Аргументы — это альтернативы, а не части одного селектора. Они не складываются.'
    explanation: |
      `:is()` и `:where()` работают одинаково: элемент подходит, если подходит под любой аргумент. Разница
      в специфичности. `:is()` получает специфичность самого специфичного аргумента — так же считаются
      `:not()` и `:has()`. `:where()` всегда даёт ноль. Поэтому `:where()` используют в библиотеках и reset-стилях:
      их правила легко переопределить. А `:is()` с id в списке незаметно делает правило тяжёлым.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/:is
      - https://developer.mozilla.org/en-US/docs/Web/CSS/:where
    source: own

  - id: css-cascade-010
    level: middle
    tags: [specificity, attribute-selector]
    question: |
      Какой селектор специфичнее?
    code: |
      input[type="text"] { border-color: red; }
      .field { border-color: blue; }
    codeLang: css
    options:
      - text: 'Они равны: атрибут и класс весят одинаково'
        why: 'Атрибут и класс действительно весят одинаково, но в первом селекторе есть ещё тег `input`.'
      - text: '`input[type="text"]` — (0, 1, 1) против (0, 1, 0) у `.field`'
        correct: true
        why: 'Атрибутный селектор считается в разряде классов, а тег `input` добавляет единицу в младший разряд.'
      - text: '`.field` — классы всегда специфичнее атрибутов'
        why: 'Классы, атрибуты и псевдоклассы — один и тот же разряд специфичности.'
      - text: '`input[type="text"]`, потому что атрибутные селекторы считаются как id'
        why: 'Атрибут не считается как id даже в случае `[id="x"]`: это всё равно атрибутный селектор с весом класса.'
    explanation: |
      Во второй разряд специфичности попадают классы (`.x`), атрибуты (`[type]`, `[id="x"]`) и
      псевдоклассы (`:hover`, `:nth-child()`). В третий — теги и псевдоэлементы (`::before`). Универсальный
      селектор `*` и комбинаторы (`>`, `+`, пробел) специфичности не добавляют. Отсюда частая ситуация:
      стиль формы из библиотеки на `input[type="text"]` не перебивается вашим `.field`, и приходится писать
      `input.field`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_cascade/Specificity
    source: own

  - id: css-cascade-011
    level: senior
    tags: [pseudo-elements, first-line, inheritance]
    question: |
      Какого цвета будет первая строка абзаца?
    code: |
      <p id="lead" class="text">Длинный текст в несколько строк...</p>

      <style>
        #lead.text { color: blue; }
        p::first-line { color: red; }
      </style>
    codeLang: html
    options:
      - text: 'Синей: `#lead.text` гораздо специфичнее, чем `p::first-line`'
        why: 'Эти правила не конкурируют: они задают цвет разным объектам — абзацу и его псевдоэлементу.'
      - text: 'Красной: у псевдоэлемента своё объявление цвета'
        correct: true
        why: '`::first-line` получает собственное значение `color: red`, а цвет абзаца мог бы достаться ему только наследованием.'
      - text: 'Синей: свойства абзаца всегда применяются поверх псевдоэлементов'
        why: 'Наоборот: псевдоэлемент «вложен» в элемент, и его собственные стили видны поверх унаследованных.'
      - text: 'Синей: `::first-line` не поддерживает свойство `color`'
        why: '`::first-line` поддерживает ограниченный набор свойств, но `color` и шрифтовые свойства в него входят.'
    explanation: |
      Специфичность сравнивают только для правил, которые задают свойство одному и тому же объекту.
      `::first-line`, `::before`, `::marker` — отдельные псевдоэлементы, вложенные в элемент. У них свой
      каскад, а от «хозяина» они наследуют. Правило для псевдоэлемента — прямое объявление, а цвет абзаца
      дошёл бы только наследованием, поэтому любой селектор псевдоэлемента побеждает. Тот же механизм
      объясняет, почему `#app li { color: blue }` не перекрасит маркеры списка, если для `::marker` задан
      свой цвет.
