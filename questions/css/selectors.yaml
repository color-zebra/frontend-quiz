topic: css
subtopic: selectors
questions:
  - id: css-selectors-001
    level: junior
    tags: [pseudo-class, pseudo-element]
    question: |
      Чем псевдокласс (`:hover`) отличается от псевдоэлемента (`::before`)?
    options:
      - text: 'Псевдокласс выбирает элемент в состоянии, псевдоэлемент — часть элемента или сгенерированный блок'
        correct: true
        why: '`:hover`, `:focus`, `:first-child` описывают состояние или положение настоящего элемента. `::before`, `::first-line`, `::placeholder` создают или выделяют то, чего нет в DOM как отдельного узла.'
      - text: 'Ничем: одно двоеточие или два — просто старая и новая запись одного и того же'
        why: 'Это разные вещи. Старые псевдоэлементы допускают запись с одним двоеточием ради совместимости, а псевдоклассов с двумя двоеточиями не бывает вовсе.'
      - text: 'Псевдоклассы работают только для ссылок, псевдоэлементы — для любых элементов'
        why: 'Псевдоклассы есть для любых элементов: `:first-child`, `:empty`, `:focus-within`, `:has()` и многие другие.'
      - text: 'Псевдоэлементы можно выбрать через `querySelector`, а псевдоклассы — нет'
        why: 'Наоборот: псевдоклассы работают в `querySelector`, а псевдоэлементы не являются узлами DOM и через него не находятся.'
    explanation: |
      Псевдокласс уточняет, какой элемент выбрать: по состоянию (`:hover`, `:checked`, `:invalid`), по
      положению (`:nth-child`), по содержимому (`:has()`, `:empty`). Специфичность у него как у класса, кроме
      `:is()`, `:not()`, `:has()` (по самому специфичному аргументу) и `:where()` (ноль).
      Псевдоэлемент — отдельная «виртуальная» часть: сгенерированный контент `::before` и `::after`, первая
      строка, маркер списка, плейсхолдер, выделенный текст. В DOM таких узлов нет, поэтому из JS до них не
      добраться, а у `::before` без свойства `content` блок не появится вовсе.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/Pseudo-classes
      - https://developer.mozilla.org/en-US/docs/Web/CSS/Pseudo-elements
    source: own

  - id: css-selectors-002
    level: middle
    tags: [nth-child, nth-of-type]
    question: |
      Какой абзац станет красным?
    code: |
      <article>
        <h2>Заголовок</h2>
        <p>Первый абзац</p>
        <p>Второй абзац</p>
      </article>

      <style>
        article p:nth-child(2) { color: red; }
      </style>
    codeLang: html
    options:
      - text: '«Второй абзац»'
        why: '`:nth-child` считает всех детей подряд, не только абзацы. Второй `p` — третий ребёнок.'
      - text: '«Первый абзац»'
        correct: true
        why: 'Второй ребёнок `article` — первый `p` (первый ребёнок — `h2`). Селектор проверяет: элемент — `p` и он второй среди всех детей.'
      - text: 'Ни один'
        why: 'Второй ребёнок как раз первый абзац. Первым ребёнком идёт `h2`.'
      - text: 'Оба абзаца'
        why: 'Индекс у каждого ребёнка свой, условию «второй» отвечает только один элемент.'
    explanation: |
      `:nth-child(n)` выбирает элемент, который стоит n-м среди всех детей родителя, а тип элемента
      проверяется отдельно. `:nth-of-type(n)` считает только элементы того же тега: `p:nth-of-type(2)` дал бы
      «Второй абзац». Есть и современный вариант со списком селекторов: `:nth-child(2 of p)` — второй среди
      детей, подходящих под `p`. Тот же подвох у `:first-child`: `p:first-child` не найдёт абзац, если перед
      ним стоит заголовок.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/:nth-child
      - https://developer.mozilla.org/en-US/docs/Web/CSS/:nth-of-type
    source: own

  - id: css-selectors-003
    level: middle
    tags: [has, parent-selector]
    question: |
      Что выберет селектор `.card:has(img)`?
    options:
      - text: 'Картинки внутри карточек'
        why: 'Так работал бы `.card img`. `:has()` выбирает элемент слева от себя, а аргумент — лишь условие.'
      - text: 'Карточки, внутри которых есть картинка'
        correct: true
        why: '`:has()` — относительный селектор: элемент подходит, если внутри него находится что-то, соответствующее аргументу.'
      - text: 'Карточки, у которых есть атрибут `img`'
        why: 'Атрибуты проверяют через `[attr]`. `:has(img)` ищет потомков-элементов `img`.'
      - text: 'Картинки, у которых родитель — карточка'
        why: 'Это `.card > img`. С `:has()` выбирается сама карточка.'
    explanation: |
      `:has()` впервые позволил выбирать элемент по его содержимому — «селектор родителя», о котором
      мечтали годами. Внутри можно писать относительные селекторы: `.card:has(> img)` — прямой ребёнок,
      `h2:has(+ p)` — заголовок, за которым идёт абзац, `form:has(:invalid)` — форма с невалидным полем.
      `:has()` поддерживается всеми современными браузерами. Специфичность у него как у самого специфичного
      аргумента, а глубокие условия на больших DOM могут быть дорогими при пересчёте стилей.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/:has
    source: own

  - id: css-selectors-004
    level: junior
    tags: [combinators]
    question: |
      Что выберет селектор `h2 + p`?
    options:
      - text: 'Все абзацы, которые стоят после `h2` на том же уровне'
        why: 'Это `h2 ~ p` — общий комбинатор соседей. `+` берёт только непосредственно следующий элемент.'
      - text: 'Абзац, который идёт сразу после `h2`'
        correct: true
        why: '`+` — комбинатор смежного соседа: элемент должен стоять сразу за `h2` у того же родителя.'
      - text: 'Абзацы внутри `h2`'
        why: 'Вложенность выражают пробелом (`h2 p`) или `>` (`h2 > p`). Плюс описывает соседство.'
      - text: 'И заголовки `h2`, и все абзацы на странице'
        why: 'Перечисление пишут через запятую: `h2, p`. `+` связывает два селектора в один.'
    explanation: |
      Комбинаторы описывают связь между элементами: пробел — любой потомок, `>` — прямой ребёнок, `+` —
      следующий соседний элемент, `~` — любой следующий сосед у того же родителя. Комбинаторы смотрят
      только вперёд и вниз по дереву. До появления `:has()` нельзя было выбрать предыдущего соседа или
      родителя, теперь это делается так: `h2:has(+ p)`.
    links:
      - https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics/Combinators
    source: own

  - id: css-selectors-005
    level: middle
    tags: [focus-visible, a11y]
    question: |
      Дизайнеры просят убрать обводку у кнопок после клика мышью, но не сломать доступность. Какой
      вариант правильный?
    options:
      - text: '`button:focus { outline: none; }`'
        why: 'Обводка пропадёт и при навигации с клавиатуры, и пользователь не увидит, где находится фокус.'
      - text: '`button:focus:not(:focus-visible) { outline: none; }`'
        correct: true
        why: 'Браузер ставит `:focus-visible`, когда фокус стоит показывать (с клавиатуры). При клике мышью обводка уйдёт, при Tab — останется.'
      - text: '`button:active { outline: none; }`'
        why: '`:active` действует только пока кнопка зажата. После отпускания фокус и обводка останутся.'
      - text: '`button { outline: none; }` и обработчик `blur()` после клика'
        why: 'Снятие фокуса после клика ломает сценарии с клавиатурой и скринридером, а обводки не будет никогда.'
    explanation: |
      `:focus` срабатывает при любом фокусе, `:focus-visible` — только когда браузер решил, что индикатор
      фокуса нужен: при навигации с клавиатуры, при фокусе на текстовом поле. Для кнопок, получивших фокус
      кликом мышью, `:focus-visible` обычно не ставится. Поэтому современные браузеры по умолчанию рисуют
      обводку именно по `:focus-visible`, и чаще всего достаточно не трогать её или стилизовать
      `:focus-visible` в фирменном цвете.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/:focus-visible
    source: own

  - id: css-selectors-006
    level: senior
    tags: [pseudo-elements, replaced-elements]
    question: |
      Разработчик хочет добавить иконку через `::before` к полю ввода и картинке. Почему стиль не работает?
    code: |
      input::before { content: "🔍"; }
      img::after { content: "© автор"; }
    codeLang: css
    options:
      - text: 'Нужно писать с одним двоеточием: `input:before`'
        why: 'Одно двоеточие допускается для старых псевдоэлементов, но ничего не меняет. Проблема в самих элементах.'
      - text: 'У `input` и `img` нет содержимого для `::before`'
        correct: true
        why: '`::before` и `::after` вставляются внутрь элемента, перед и после его содержимого. У `img` и `input` содержимого в этом смысле нет.'
      - text: 'В свойстве `content` нельзя использовать эмодзи и кириллицу'
        why: 'В `content` можно писать любой текст в кавычках, включая эмодзи и кириллицу.'
      - text: 'Псевдоэлементам нужен `display: block`, иначе они не рисуются'
        why: 'По умолчанию они строчные и отлично рисуются. `display` здесь не поможет.'
    explanation: |
      `::before` и `::after` — первый и последний ребёнок элемента, сгенерированные стилями. Им нужно
      место внутри элемента. Замещаемые элементы (`img`, `video`, `iframe`, обычно и `input`) рисуют своё
      содержимое сами, вне CSS-раскладки, а void-элементы вроде `br` и `input` вообще не имеют детей.
      Поэтому декорации для них вешают на обёртку: `.search::before` у `<label class="search">`. Кстати, у
      `img` с битой картинкой `::after` в некоторых браузерах всё-таки появляется — так стилизуют
      заглушку ошибки загрузки.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/::before
      - https://developer.mozilla.org/en-US/docs/Glossary/Replaced_elements
    source: own

  - id: css-selectors-007
    level: middle
    tags: [user-invalid, invalid, forms]
    question: |
      Пустое обязательное поле подсвечивается красным сразу при загрузке страницы, ещё до ввода. Как
      показывать ошибку только после взаимодействия?
    code: |
      input:invalid { border-color: red; }
    codeLang: css
    options:
      - text: 'Заменить `:invalid` на `:user-invalid`'
        correct: true
        why: '`:user-invalid` срабатывает, только когда пользователь взаимодействовал с полем (изменил его и ушёл или попытался отправить форму).'
      - text: 'Заменить `:invalid` на `:required`'
        why: '`:required` подсветит все обязательные поля всегда, независимо от того, заполнены ли они.'
      - text: 'Добавить `:not(:focus)` — поле без фокуса всегда тронуто'
        why: 'При загрузке поле тоже не в фокусе, поэтому подсветка останется.'
      - text: 'Заменить на `:placeholder-shown` — он отражает ошибку ввода'
        why: '`:placeholder-shown` означает «виден плейсхолдер», то есть поле пустое. К валидности и взаимодействию отношения не имеет.'
    explanation: |
      `:invalid` отражает текущее состояние ограничений поля: пустое поле с `required` невалидно с первой
      миллисекунды. Пугать пользователя ошибками до того, как он начал вводить, — плохой UX, поэтому раньше
      добавляли JS-класс «touched». Псевдоклассы `:user-invalid` и `:user-valid` делают это нативно:
      включаются после того, как пользователь изменил поле и ушёл из него, или после попытки отправки.
      Поддерживаются всеми современными браузерами с 2023 года.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/:user-invalid
    source: own

  - id: css-selectors-008
    level: senior
    tags: [is, where, specificity]
    question: |
      Какая специфичность у селектора `:is(:where(#main) .card, .list) a`?
    options:
      - text: '(1, 1, 1)'
        why: 'id стоит внутри `:where()`, а `:where()` обнуляет специфичность всего, что в нём находится. До `:is()` он не доходит.'
      - text: '(0, 1, 1)'
        correct: true
        why: 'Первый аргумент `:is()` весит (0, 1, 0): `:where(#main)` даёт ноль, `.card` — один класс. Второй аргумент `.list` — тоже (0, 1, 0). `:is()` берёт максимум, плюс тег `a`.'
      - text: '(1, 0, 1)'
        why: 'Так было бы, если бы `:is()` взял специфичность id. Но id обнулён внутри `:where()`.'
      - text: '(0, 2, 1)'
        why: 'Аргументы `:is()` — альтернативы, их специфичности не складываются. Берётся наибольшая из них.'
    explanation: |
      `:is()`, `:not()` и `:has()` получают специфичность самого специфичного аргумента, а `:where()` всегда
      даёт ноль — и всему, что внутри него, тоже. Эти правила комбинируются: специфичность аргумента `:is()`
      считается как у обычного селектора, где `:where(...)` вносит ноль. Так библиотеки делают «мягкие»
      стили: заворачивают в `:where()` части селектора, которые нужны для точности выбора, но не должны
      мешать переопределению.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/:where#examples
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_cascade/Specificity
    source: own

  - id: css-selectors-009
    level: middle
    tags: [selector-matching, performance]
    question: |
      Как браузер проверяет, подходит ли элемент под селектор `.sidebar .menu a`?
    options:
      - text: 'Слева направо: находит `.sidebar`, ищет внутри `.menu`, затем ссылки'
        why: 'Так селектор читает человек. Браузеру выгоднее идти от конца: каждый элемент проверяется по самой правой части.'
      - text: 'Справа налево: берёт ссылку и поднимается по предкам'
        correct: true
        why: 'Для каждого элемента браузер сначала проверяет правую часть (ключевой селектор `a`), а затем ищет подходящих предков. Большинство элементов отсеивается сразу.'
      - text: 'Справа налево только для селекторов с id, иначе слева направо'
        why: 'Направление сопоставления не зависит от состава селектора: ключевой селектор всегда правый.'
      - text: 'Слева направо, кэшируя найденные `.sidebar` между элементами'
        why: 'Кэширование действительно есть, но обход всё равно идёт от ключевого селектора к предкам.'
    explanation: |
      Браузер решает задачу «какие правила подходят этому элементу». Поэтому он берёт ключевой селектор
      (самую правую часть) и проверяет её на элементе, а только при совпадении поднимается по предкам.
      Так `div .x` для элемента без класса `x` отбрасывается за одну проверку. Практический вывод для
      производительности: широкий ключевой селектор вроде `.list *` или `div` заставляет проверять предков
      для огромного числа элементов. В обычных проектах это редко узкое место, но объясняет, почему
      методологии вроде BEM советуют плоские классы.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/Performance/Guides/How_browsers_work
    source: own

  - id: css-selectors-010
    level: junior
    tags: [attribute-selectors]
    question: |
      Как выбрать все ссылки, ведущие на PDF-файлы?
    options:
      - text: '`a[href$=".pdf"]`'
        correct: true
        why: '`$=` проверяет, что значение атрибута заканчивается на указанную строку.'
      - text: '`a[href^=".pdf"]`'
        why: '`^=` проверяет начало строки. Такой селектор найдёт ссылки, чей адрес начинается с `.pdf`.'
      - text: '`a[href=".pdf"]`'
        why: '`=` требует точного совпадения всего значения, а у ссылки адрес вида `/files/report.pdf`.'
      - text: '`a.pdf`'
        why: 'Это класс `pdf` у ссылки, а не адрес. Сработает, только если вручную ставить класс.'
    explanation: |
      Атрибутные селекторы: `[attr]` — атрибут есть; `[attr="v"]` — точное значение; `^=` — начинается с;
      `$=` — заканчивается на; `*=` — содержит подстроку; `~=` — содержит слово в списке через пробел;
      `|=` — равно `v` или начинается с `v-` (для языков вроде `lang|="en"`). Флаг `i` перед `]` делает
      сравнение нечувствительным к регистру: `a[href$=".pdf" i]` найдёт и `.PDF`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/Attribute_selectors
    source: own
