topic: css
subtopic: grid
questions:
  - id: css-grid-001
    level: junior
    tags: [fr, gap]
    question: |
      Какой ширины будут колонки?
    code: |
      .grid {
        display: grid;
        width: 620px;
        grid-template-columns: 1fr 2fr;
        column-gap: 20px;
      }
    codeLang: css
    options:
      - text: '200px и 400px'
        correct: true
        why: 'Сначала из ширины вычитается промежуток: 620 − 20 = 600px. Их делят в пропорции 1 : 2.'
      - text: '206,67px и 413,33px'
        why: 'Здесь пропорция применена к 620px целиком. Но `fr` делит только место, оставшееся после промежутков и фиксированных колонок.'
      - text: '310px и 310px'
        why: 'Колонки были бы равными при `1fr 1fr`.'
      - text: '200px и 420px'
        why: 'Первая колонка получила треть от 600px, а вторая — всё остальное, включая место под промежуток: 200 + 420 = 620, на gap ничего не осталось.'
    explanation: |
      Единица `fr` — доля свободного пространства grid-контейнера. Браузер вычитает из ширины контейнера
      промежутки (`gap`) и колонки с фиксированными или контентными размерами, а остаток делит
      пропорционально числам `fr`. Поэтому `gap` не ломает пропорции, в отличие от процентных колонок:
      две колонки по 50% с промежутком 20px переполнят контейнер.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/flex_value
      - https://developer.mozilla.org/en-US/docs/Web/CSS/grid-template-columns
    source: own

  - id: css-grid-002
    level: middle
    tags: [auto-fill, auto-fit, minmax]
    question: |
      В контейнере шириной 1000px всего два элемента. Чем будет отличаться раскладка с `auto-fill` и
      `auto-fit`?
    code: |
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        /* или repeat(auto-fit, minmax(200px, 1fr)) */
      }
    codeLang: css
    options:
      - text: 'Ничем: оба ключевых слова дают одинаковую раскладку'
        why: 'Разница проявляется, когда элементов меньше, чем помещается колонок, — как в этом примере.'
      - text: '`auto-fit` растянет два элемента на всю ширину, `auto-fill` — нет'
        correct: true
        why: 'Оба создают столько колонок, сколько поместится (здесь пять). `auto-fit` после размещения схлопывает пустые колонки в ноль, и `1fr` отдаёт их место занятым.'
      - text: '`auto-fit` не будет переносить элементы на новую строку'
        why: 'Перенос работает одинаково в обоих вариантах: колонок столько, сколько влезает по минимуму 200px.'
      - text: '`auto-fill` растянет элементы, а `auto-fit` оставит их по 200px'
        why: 'Наоборот: `auto-fill` оставляет пустые колонки, и элементы остаются по 200px, а `auto-fit` их схлопывает и растягивает элементы.'
    explanation: |
      `repeat(auto-fill | auto-fit, minmax(200px, 1fr))` — основа адаптивной сетки без медиазапросов:
      колонок столько, сколько помещается по 200px, а остаток делится поровну. Различие видно, только
      когда элементов мало. `auto-fill` сохраняет пустые колонки, поэтому сетка всегда одной «ширины шага»,
      удобно для каталога, где карточки не должны раздуваться. `auto-fit` схлопывает пустые колонки, и
      существующие элементы растягиваются на всю ширину.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/repeat#auto-fill
      - https://css-tricks.com/auto-sizing-columns-css-grid-auto-fill-vs-auto-fit/
    source: own

  - id: css-grid-003
    level: senior
    tags: [fr, minmax, overflow]
    question: |
      В сетке `grid-template-columns: 1fr 1fr; gap: 24px` одна колонка содержит длинную строку кода в `<pre>`. Колонки
      стали неравными, сетка вылезла за контейнер. Какое исправление правильное?
    options:
      - text: '`grid-template-columns: 50% 50%`'
        why: 'Колонки станут равными: процентная дорожка фиксирована и под содержимое не растёт. Но проценты не учитывают `gap`: 50% + 50% + 24px больше контейнера, и сетка всё равно вылезет.'
      - text: '`grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)`'
        correct: true
        why: '`1fr` означает `minmax(auto, 1fr)`: колонка не может быть уже минимального размера содержимого. Явный минимум 0 снимает это ограничение.'
      - text: '`grid-template-columns: 1fr 1fr; overflow: hidden` у контейнера'
        why: 'Контейнер обрежет вылезающее, но колонки так и останутся неравными: проблема в размере дорожки, а не в контейнере.'
      - text: '`grid-auto-columns: 1fr`'
        why: 'Это свойство задаёт размер неявных колонок. Явные колонки из `grid-template-columns` от него не меняются.'
    explanation: |
      `1fr` — сокращение для `minmax(auto, 1fr)`. Нижняя граница `auto` — минимальный размер содержимого,
      поэтому неразрывная строка, широкая картинка или таблица растягивают свою колонку, а соседние
      уменьшаются. Это тот же эффект, что `min-width: auto` у flex-элементов. Запись `minmax(0, 1fr)`
      разрешает колонке сжиматься до нуля, и тогда переполнение обрабатывает само содержимое: у `pre`
      появляется горизонтальный скролл через `overflow-x: auto`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/minmax
      - https://css-tricks.com/preventing-a-grid-blowout/
    source: own

  - id: css-grid-004
    level: junior
    tags: [grid-column, line-numbers]
    question: |
      Как растянуть элемент на всю ширину явно заданной сетки, не зная количества колонок?
    options:
      - text: '`grid-column: 1 / -1`'
        correct: true
        why: 'Отрицательные номера линий считаются с конца: `-1` — последняя линия явной сетки. Элемент займёт всё от первой до последней.'
      - text: '`grid-column: span all`'
        why: 'Ключевого слова `all` в grid нет. Есть `span N` с конкретным числом.'
      - text: '`width: 100%`'
        why: 'Ширина элемента ограничена его ячейкой, `100%` — это 100% ширины одной колонки.'
      - text: '`grid-column: 1 / 0`'
        why: 'Линии с номером 0 не существует, такое значение недопустимо.'
    explanation: |
      Колонки в grid разделены линиями. У сетки из трёх колонок — четыре линии: 1, 2, 3, 4, или с конца:
      −4, −3, −2, −1. Запись `grid-column: начало / конец` указывает линии. Значение `1 / -1` — «от первой
      до последней линии», и работает при любом числе колонок. Оговорка: отрицательные номера относятся к
      явной сетке (из `grid-template-columns`). Неявно созданные колонки в отсчёт не попадают.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_grid_layout/Grid_layout_using_line-based_placement
    source: own

  - id: css-grid-005
    level: middle
    tags: [implicit-grid, grid-auto-rows]
    question: |
      В сетке задана только одна строка, а элементов девять. Что будет с элементами 4–9?
    code: |
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: 200px;
      }
    codeLang: css
    options:
      - text: 'Они не отобразятся: для них нет строк'
        why: 'Grid не скрывает лишние элементы. Он создаёт для них дополнительные строки.'
      - text: 'Попадут в неявные строки высотой по содержимому'
        correct: true
        why: 'Это неявная сетка: строки, которых нет в шаблоне, создаются автоматически, а их размер задаёт `grid-auto-rows`, по умолчанию `auto`.'
      - text: 'Все строки станут высотой 200px, как первая'
        why: 'Шаблон описывает только первую строку. Чтобы новые строки тоже были по 200px, нужно `grid-auto-rows: 200px`.'
      - text: 'Элементы наложатся друг на друга в первой строке'
        why: 'Наложение возможно только при явном размещении в одни и те же ячейки. Автоматическое размещение ищет свободные ячейки.'
    explanation: |
      У grid есть явная сетка — то, что описано в `grid-template-*`, — и неявная, которую браузер достраивает,
      когда элементам не хватает места. Неявные дорожки управляются свойствами `grid-auto-rows` и
      `grid-auto-columns`, а направление их создания — `grid-auto-flow`. Типичный приём: не описывать строки
      вовсе, а задать `grid-auto-rows: minmax(150px, auto)`, чтобы любая строка была не ниже 150px и росла
      по содержимому.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/grid-auto-rows
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_grid_layout/Basic_concepts_of_grid_layout#implicit_and_explicit_grids
    source: own

  - id: css-grid-006
    level: middle
    tags: [grid-template-areas]
    question: |
      Что не так с этим шаблоном областей?
    code: |
      .layout {
        display: grid;
        grid-template-columns: 200px 1fr;
        grid-template-areas:
          "header header"
          "sidebar main"
          "footer main";
      }
      .main { grid-area: main; }
    codeLang: css
    options:
      - text: 'Всё в порядке: `main` занимает две строки справа'
        correct: true
        why: 'Область `main` образует прямоугольник из двух ячеек по вертикали. Это допустимо.'
      - text: 'Имя области нельзя повторять в разных строках'
        why: 'Можно, если ячейки с одним именем образуют прямоугольник. Так области растягиваются на несколько строк и колонок.'
      - text: 'Нужно три колонки, раз в шаблоне три строки'
        why: 'Количество строк и колонок не связано. В каждой строке шаблона столько ячеек, сколько колонок, — здесь по две.'
      - text: 'Ошибка: `footer` должен занимать всю ширину'
        why: 'Это решение дизайна, а не правило grid. Footer может занимать одну ячейку.'
    explanation: |
      `grid-template-areas` рисует сетку «картинкой» из имён: каждая строка в кавычках — строка сетки,
      каждое слово — ячейка. Одинаковые имена объединяются в одну область, но только если вместе они
      образуют прямоугольник, иначе всё объявление недействительно. Точка (`.`) обозначает пустую ячейку.
      Элементы ставят в области через `grid-area: имя`. Для адаптивности достаточно переопределить шаблон
      в медиазапросе, не трогая разметку.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/grid-template-areas
    source: own

  - id: css-grid-007
    level: senior
    tags: [subgrid]
    question: |
      В ряду карточек у каждой заголовок, текст и кнопка. Заголовки разной длины, поэтому в соседних карточках
      на разной высоте оказываются и начало текста, и кнопки. Какой инструмент выровняет все три части по
      общим линиям без JavaScript и фиксированных высот?
    options:
      - text: 'Flex-колонка в карточке и `margin-top: auto` у кнопки'
        why: 'Кнопки выровняются по низу, но начало текста в соседних карточках всё равно будет на разной высоте из-за разных заголовков.'
      - text: 'Строки карточки через `grid-template-rows: subgrid`'
        correct: true
        why: 'С `subgrid` строки общие для всех карточек ряда, поэтому заголовки, тексты и кнопки выравниваются по одним линиям.'
      - text: 'Свойство `align-items: stretch` у внешней сетки'
        why: 'Это растянет карточки по высоте, но внутренние части останутся невыровненными.'
      - text: 'Плотная упаковка через `grid-auto-flow: dense`'
        why: '`dense` меняет порядок автоматического размещения, к выравниванию внутренностей отношения не имеет.'
    explanation: |
      Обычно вложенная сетка независима от внешней, и выровнять части соседних карточек нельзя: каждая
      считает свои строки сама. `subgrid` позволяет вложенной сетке использовать дорожки родителя.
      Карточка растягивается на несколько строк родительской сетки (`grid-row: span 3`) и объявляет
      `grid-template-rows: subgrid`. Теперь высота строки «заголовок» общая для всего ряда и равна самому
      длинному заголовку. `subgrid` поддерживается всеми современными браузерами с 2023 года.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_grid_layout/Subgrid
    source: own

  - id: css-grid-008
    level: junior
    tags: [grid-vs-flex]
    question: |
      Когда разумнее выбрать grid, а не flexbox?
    options:
      - text: 'Когда нужна раскладка сразу по строкам и колонкам'
        correct: true
        why: 'Grid двумерный: размеры колонок и строк задаются контейнером, и элементы выравниваются в обоих направлениях.'
      - text: 'Всегда: flexbox устарел и оставлен для совместимости'
        why: 'Flexbox не устарел. Для одномерных задач вроде ряда кнопок или меню он проще и естественнее.'
      - text: 'Когда элементы должны сжиматься и растягиваться'
        why: 'Это умеют обе технологии. Растяжение и сжатие — основа flexbox.'
      - text: 'Когда элементов в строке ровно два'
        why: 'Количество элементов не критерий. Важно, нужна ли двумерная сетка.'
    explanation: |
      Flexbox одномерный: раскладывает элементы вдоль одной оси, а размеры во многом идут от содержимого
      (content-out). Если строки переносятся, каждая строка живёт своей жизнью и колонки между строками не
      выравниваются. Grid двумерный: контейнер задаёт сетку (layout-in), и элементы встают по колонкам и
      строкам одновременно. На практике они дополняют друг друга: grid для каркаса страницы и сеток
      карточек, flex для содержимого внутри — ряда кнопок, шапки, иконки с текстом.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_grid_layout/Relationship_of_grid_layout_with_other_layout_methods
    source: own

  - id: css-grid-009
    level: senior
    tags: [grid-auto-flow, dense, accessibility]
    question: |
      В галерее с картинками разного размера включили `grid-auto-flow: dense`, и «дырки» исчезли. Какой у этого
      побочный эффект?
    options:
      - text: 'Картинки начнут загружаться в другом порядке'
        why: 'Порядок загрузки определяется разметкой и приоритетами браузера, а не раскладкой grid.'
      - text: 'Визуальный порядок расходится с порядком фокуса'
        correct: true
        why: '`dense` заполняет пропуски более поздними элементами, переставляя их визуально. Порядок фокуса при этом остаётся порядком DOM.'
      - text: 'Сетка перестаёт быть адаптивной'
        why: 'Адаптивность зависит от определения колонок. `dense` влияет только на алгоритм размещения.'
      - text: 'Элементы начинают накладываться друг на друга'
        why: 'Автоматическое размещение никогда не кладёт элементы в занятые ячейки, в том числе с `dense`.'
    explanation: |
      Алгоритм автоматического размещения по умолчанию идёт строго вперёд: если большой элемент не влез,
      остаётся дырка. С `dense` браузер возвращается назад и заполняет пропуски подходящими элементами из
      конца списка. Красиво, но порядок на экране расходится с порядком в документе. То же делают
      `order` во flex и явное размещение в grid. Пользователь с клавиатуры видит, как фокус хаотично
      скачет по странице. Поэтому такие приёмы допустимы, когда порядок не несёт смысла, как в галерее
      картинок, и нежелательны для текстового контента.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/grid-auto-flow
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_grid_layout/Grid_layout_and_accessibility
    source: own
