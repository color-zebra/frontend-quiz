questions:
  - id: css-scss-001
    level: junior
    tags: [variables, compile-time]
    question: |
      Чем переменная SCSS `$primary` отличается от CSS-переменной `--primary`?
    options:
      - text: '`$primary` подставляется при сборке, `--primary` существует в браузере'
        correct: true
        why: 'В готовом CSS от `$primary` остаются только значения. `--primary` живёт в каскаде: наследуется, переопределяется в селекторах и меняется из JS.'
      - text: '`$primary` наследуется по DOM, `--primary` — нет'
        why: 'Наоборот: наследуются custom properties. SCSS-переменные к DOM отношения не имеют, у них лексическая область видимости в исходнике.'
      - text: 'Это синтаксис двух версий одного механизма, разницы в работе нет'
        why: 'Механизмы принципиально разные: один работает при компиляции, другой — в браузере во время работы страницы.'
      - text: '`--primary` работает только внутри `:root`, `$primary` — везде'
        why: 'Custom property можно объявить на любом элементе. `:root` лишь удобное место для глобальных значений.'
    explanation: |
      SCSS — препроцессор: он компилирует исходники в обычный CSS ещё до того, как файл попадёт в браузер.
      Переменные `$...`, миксины и функции полностью исчезают, оставляя готовые значения. Поэтому `$primary`
      нельзя поменять из JS или переопределить для тёмной темы через класс на `body`. Custom properties
      работают в рантайме: их можно менять, они наследуются, и браузер пересчитывает зависимые стили. На
      практике их сочетают: SCSS-переменные для точек перелома и вычислений при сборке, custom properties
      для тем и всего, что меняется на лету.
    links:
      - https://sass-lang.com/documentation/variables/
    source: own

  - id: css-scss-002
    level: junior
    tags: [parent-selector, bem]
    question: |
      Какие селекторы получатся после компиляции?
    code: |
      .btn {
        &--primary { color: white; }
        &:hover { opacity: .8; }
        .icon { width: 16px; }
      }
    codeLang: scss
    options:
      - text: '`.btn--primary`, `.btn:hover`, `.btn .icon`'
        correct: true
        why: '`&` подставляет родительский селектор как текст: можно приклеить суффикс или псевдокласс. Вложенный селектор без `&` становится потомком через пробел.'
      - text: '`.btn .--primary`, `.btn :hover`, `.btn .icon`'
        why: 'С `&` пробел не вставляется — подстановка идёт вплотную. Пробел появляется только у вложенных правил без `&`.'
      - text: '`.btn--primary`, `.btn:hover`, `.btn.icon`'
        why: 'Вложенный селектор без `&` склеивается с родителем через пробел, то есть превращается в потомка, а не в тот же элемент.'
      - text: '`&--primary`, `&:hover`, `.icon`'
        why: 'Компилятор Sass всегда раскрывает `&`, в готовом CSS его нет.'
    explanation: |
      Вложенность в SCSS — сокращение записи. Правило внутри правила по умолчанию превращается в селектор
      потомка (`.btn .icon`). Символ `&` — ссылка на родительский селектор, которая подставляется как текст.
      Отсюда удобные БЭМ-модификаторы (`&--primary`, `&__title`) и состояния (`&:hover`, `&.is-active`). `&` можно
      ставить и в конце: `.dark & { ... }` даст `.dark .btn`. Нативная вложенность CSS похожа, но склеивать `&`
      с суффиксом не умеет.
    links:
      - https://sass-lang.com/documentation/style-rules/parent-selector/
    source: own

  - id: css-scss-003
    level: middle
    tags: [mixin, extend]
    question: |
      Чем `@extend` отличается от `@include` миксина по результату в CSS?
    options:
      - text: '`@extend` дописывает селектор в чужое правило, `@include` копирует объявления'
        correct: true
        why: 'С `@extend .btn` селектор элемента добавляется в список селекторов правила `.btn`. Миксин же вставляет свои объявления внутрь каждого правила, где его подключили.'
      - text: '`@extend` копирует объявления, `@include` дописывает селекторы в чужое правило'
        why: 'Ровно наоборот: копированием объявлений занимается миксин.'
      - text: 'Результат одинаковый, `@extend` — просто устаревший синтаксис'
        why: 'Результаты разные, и `@extend` не устарел, хотя многие команды избегают его из-за побочных эффектов.'
      - text: '`@extend` работает только с миксинами, а `@include` — только с классами'
        why: '`@extend` расширяет селекторы (классы, плейсхолдеры), а `@include` подключает миксины, объявленные через `@mixin`.'
    explanation: |
      `@include mixin` вставляет копию объявлений: CSS растёт, но результат предсказуем, а миксин принимает
      аргументы. `@extend .x` ничего не копирует: селектор текущего правила добавляется везде, где в
      таблице встречается `.x`, в том числе в составных селекторах вроде `.sidebar .x`. CSS получается
      короче, но селекторы могут неожиданно «размножиться», а порядок правил — поменяться. Поэтому `@extend`
      чаще используют с плейсхолдерами (`%name`) и в пределах одного файла, а для общих наборов стилей
      берут миксины.
    links:
      - https://sass-lang.com/documentation/at-rules/extend/
      - https://sass-lang.com/documentation/at-rules/mixin/
    source: own

  - id: css-scss-004
    level: middle
    tags: [use, import, modules]
    question: |
      Почему в новых проектах вместо `@import 'variables'` пишут `@use 'variables'`?
    options:
      - text: '`@use` даёт пространство имён и подключает файл один раз'
        correct: true
        why: '`@import` в Dart Sass устарел. С `@use` переменные доступны как `variables.$primary`, не засоряют глобальную область, а модуль выполняется один раз, даже если подключён из многих мест.'
      - text: '`@use` подключает файл в браузере, а `@import` — при сборке'
        why: 'Оба работают на этапе компиляции. В браузер попадает только готовый CSS.'
      - text: '`@use` быстрее грузится в браузере, потому что не делает HTTP-запрос'
        why: 'Ни `@use`, ни Sass-`@import` не создают HTTP-запросов: файлы склеиваются при компиляции.'
      - text: 'Разницы нет, это синонимы, `@use` короче'
        why: 'Разница в области видимости и количестве подключений, и `@import` объявлен устаревшим в Dart Sass.'
    explanation: |
      Старый `@import` в Sass склеивал файлы в общую глобальную область: все переменные и миксины доступны
      везде, имена конфликтуют, а файл, подключённый пять раз, пять раз попадает в CSS. Модульная система
      `@use` и `@forward` решает это: у каждого подключения своё пространство имён (`colors.$primary`,
      меняется через `as`), модуль выполняется один раз, а настроить его можно через
      `@use 'lib' with ($primary: blue)`. В Dart Sass `@import` объявлен устаревшим и будет удалён в версии 3.
    links:
      - https://sass-lang.com/documentation/at-rules/use/
      - https://sass-lang.com/blog/import-is-deprecated/
    source: own

  - id: css-scss-005
    level: senior
    tags: [extend, media-queries]
    question: |
      Что произойдёт при компиляции этого кода?
    code: |
      .error { color: red; }

      @media (max-width: 600px) {
        .alert { @extend .error; font-size: 14px; }
      }
    codeLang: scss
    options:
      - text: 'Компиляция упадёт с ошибкой'
        correct: true
        why: '`@extend` внутри `@media` может расширять только селекторы из того же медиазапроса. `.error` объявлен снаружи, и Sass выдаёт ошибку.'
      - text: '`.alert` добавится к правилу `.error` вне медиазапроса'
        why: 'Так `.alert` стал бы красным на всех экранах, а не только на узких. Sass это запрещает, чтобы не нарушать смысл кода.'
      - text: 'Правило `.error` скопируется внутрь медиазапроса'
        why: 'Копированием объявлений занимаются миксины. `@extend` не копирует, а дописывает селекторы.'
      - text: '`@extend` будет молча проигнорирован'
        why: 'Sass не игнорирует такую ситуацию молча, а сообщает об ошибке.'
    explanation: |
      `@extend` работает дописыванием селектора в существующее правило. Если правило `.error` вне медиазапроса,
      а расширение объявлено внутри, дописать `.alert` к `.error` значило бы применить стили на всех экранах —
      это не то, что написано. Поэтому Sass запрещает расширять селекторы через границу медиазапроса.
      Решение — миксин: `@include error-styles` внутри `@media` просто вставит объявления куда нужно. Это одна
      из причин, по которым миксины считаются более предсказуемыми.
    links:
      - https://sass-lang.com/documentation/at-rules/extend/#extend-in-media
    source: own

  - id: css-scss-006
    level: middle
    tags: [placeholder, extend]
    question: |
      Что окажется в итоговом CSS?
    code: |
      %visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }

      .sr-label { @extend %visually-hidden; }
    codeLang: scss
    options:
      - text: 'Только правило `.sr-label` с этими объявлениями'
        correct: true
        why: 'Плейсхолдер `%name` сам в CSS не выводится. Он появляется только как набор объявлений для селекторов, которые его расширили.'
      - text: 'Правило `.visually-hidden` и правило `.sr-label`'
        why: 'Префикс `%` и нужен для того, чтобы селектор не попадал в CSS. Класса `.visually-hidden` не будет.'
      - text: 'Правило `%visually-hidden` в том виде, как написано'
        why: 'Браузер не понял бы `%` в селекторе, поэтому Sass его никогда не выводит.'
      - text: 'Ничего: плейсхолдер нужно подключать через `@include`'
        why: '`@include` — для миксинов. Плейсхолдеры подключаются через `@extend`.'
    explanation: |
      Плейсхолдер-селектор (`%name`) похож на класс, который существует только для `@extend`. Если его никто не
      расширяет, он исчезает бесследно, и в отличие от обычного класса не «засоряет» CSS неиспользуемыми
      правилами. Все расширяющие селекторы собираются в одно правило через запятую: `.sr-label, .skip-link
      { ... }`. Это экономнее миксина, который скопировал бы объявления для каждого селектора, но со всеми
      оговорками `@extend` про порядок правил и медиазапросы.
    links:
      - https://sass-lang.com/documentation/style-rules/placeholder-selectors/
    source: own

  - id: css-scss-007
    level: middle
    tags: [nesting, specificity]
    question: |
      Чем плоха глубокая вложенность в SCSS?
    code: |
      .page {
        .content {
          .list {
            .item {
              a { color: blue; }
            }
          }
        }
      }
    codeLang: scss
    options:
      - text: 'Она порождает длинные специфичные селекторы, которые трудно переопределить'
        correct: true
        why: 'Получится `.page .content .list .item a` со специфичностью (0, 4, 1). Перебить его можно только ещё более длинным селектором, и стили жёстко привязаны к структуре разметки.'
      - text: 'Sass ограничивает вложенность тремя уровнями и выдаст ошибку'
        why: 'Ограничения глубины в Sass нет. Его часто вводят линтеры как правило команды.'
      - text: 'Sass дублирует объявления на каждом уровне вложенности'
        why: 'Объявления выводятся один раз, в правиле с полным селектором. Растут не объявления, а длина и вес селектора.'
      - text: 'Вложенные правила нельзя переопределить снаружи вложенности'
        why: 'Переопределить можно, но только селектором не слабее, то есть таким же длинным. В этом и проблема.'
    explanation: |
      Вложенность в SCSS делает код похожим на структуру HTML, и это соблазняет вкладывать глубоко. В итоге
      каждый уровень добавляет часть к селектору: растёт специфичность, стили зависят от точной вложенности
      разметки, а переиспользовать компонент в другом месте не получается. Популярное правило — не больше
      двух-трёх уровней и вложенность в основном для `&` (модификаторы, псевдоклассы). Методологии вроде БЭМ
      и CSS Modules как раз дают плоские селекторы одного класса.
    links:
      - https://sass-lang.com/documentation/style-rules/#nesting
    source: own

  - id: css-scss-008
    level: middle
    tags: [math, division]
    question: |
      Почему в новых версиях Dart Sass запись `$half: $width / 2;` вызывает предупреждение?
    options:
      - text: 'Слеш в Sass неоднозначен с разделителем CSS, деление переведено на `math.div()`'
        correct: true
        why: 'В CSS `/` — разделитель (`grid-area: 1 / 3`, `font: 16px/1.5`). Чтобы не гадать, где деление, Sass объявил `/` для деления устаревшим.'
      - text: 'Sass вообще не поддерживает математику, вычисления делают через `calc()`'
        why: 'Sass поддерживает математику: сложение, умножение, а деление теперь через `math.div($width, 2)`.'
      - text: 'Делить можно только числа без единиц измерения'
        why: 'Делить значения с единицами можно, и `math.div(100px, 2)` вернёт `50px`.'
      - text: 'Переменные нельзя использовать в арифметике, только литералы'
        why: 'Переменные в выражениях — основа Sass-математики.'
    explanation: |
      В обычном CSS слеш встречается как разделитель значений, и Sass долго угадывал по контексту, делить
      или оставить как есть. Это давало сюрпризы. Теперь деление через `/` объявлено устаревшим: нужно
      `@use 'sass:math';` и `math.div($width, 2)`, либо браузерный `calc()`, если значение должно считаться
      при отрисовке, например со смешанными единицами (`calc(100% - #{$gap})`). Для автоматической миграции есть
      утилита `sass-migrator division`.
    links:
      - https://sass-lang.com/documentation/breaking-changes/slash-div/
    source: own

  - id: css-scss-009
    level: senior
    tags: [interpolation, custom-properties]
    question: |
      Что окажется в итоговом CSS?
    code: |
      $brand: #3b82f6;

      :root {
        --brand: $brand;
      }
    codeLang: scss
    options:
      - text: '`--brand: #3b82f6;`'
        why: 'Ловушка: в значениях обычных свойств Sass подставляет переменные, но значения custom properties он не разбирает.'
      - text: '`--brand: $brand;`'
        correct: true
        why: 'Sass выводит значения custom properties как есть, без вычисления выражений. Нужна интерполяция: `--brand: #{$brand};`.'
      - text: 'Ошибка компиляции из-за неизвестного свойства'
        why: 'Custom properties — валидный CSS, Sass их знает и не ругается.'
      - text: 'Строка `--brand` будет удалена, раз значение не вычислилось'
        why: 'Sass ничего не удаляет. Он выведет значение буквально, и в браузере переменная станет строкой `$brand`.'
    explanation: |
      Значения custom properties могут содержать почти любой текст, включая то, что выглядит как синтаксис
      Sass, поэтому Sass не вычисляет в них выражения и выводит их как есть. Единственное, что обрабатывается, —
      интерполяция `#{...}`. Правильная запись: `--brand: #{$brand};`. Ошибка коварна: компиляция проходит
      без предупреждений, а в браузере `var(--brand)` подставляет бессмысленный `$brand`, и свойство становится
      недействительным.
    links:
      - https://sass-lang.com/documentation/style-rules/declarations/#custom-properties
    source: own

  - id: css-scss-010
    level: junior
    tags: [each, interpolation, loops]
    question: |
      Какие классы создаст этот цикл?
    code: |
      $spacings: (sm: 4px, md: 8px, lg: 16px);

      @each $name, $value in $spacings {
        .mt-#{$name} { margin-top: $value; }
      }
    codeLang: scss
    options:
      - text: '`.mt-sm`, `.mt-md`, `.mt-lg` с отступами 4, 8 и 16px'
        correct: true
        why: '`@each` обходит пары ключ–значение map, а `#{$name}` подставляет ключ в имя класса.'
      - text: 'Один класс `.mt-#{$name}` с последним значением 16px'
        why: 'Интерполяция `#{}` работает и в селекторах, поэтому для каждого ключа будет свой класс.'
      - text: '`.mt-4px`, `.mt-8px`, `.mt-16px`'
        why: 'В имя класса подставляется ключ `$name`, а не значение `$value`.'
      - text: 'Ошибку: в имени селектора нельзя использовать переменные'
        why: 'Нельзя без интерполяции. С `#{...}` переменные в селекторах работают.'
    explanation: |
      Циклы `@each`, `@for` и `@while` генерируют повторяющиеся правила: утилиты отступов, цветовые
      модификаторы, сетки. `@each` умеет обходить списки и map; для map он даёт сразу ключ и значение.
      Интерполяция `#{...}` вставляет значение в места, где обычная переменная недопустима: в селекторы,
      имена свойств, медиазапросы и строки. Злоупотреблять генерацией не стоит: несколько вложенных циклов
      легко превращают CSS в сотни килобайт.
    links:
      - https://sass-lang.com/documentation/at-rules/control/each/
      - https://sass-lang.com/documentation/interpolation/
    source: own

  - id: css-scss-011
    level: middle
    tags: [default, configuration]
    question: |
      Зачем в библиотеке переменную объявляют с флагом `!default`?
    code: |
      // _theme.scss
      $primary: blue !default;
    codeLang: scss
    options:
      - text: 'Чтобы значение можно было переопределить при подключении библиотеки'
        correct: true
        why: '`!default` присваивает значение, только если переменная ещё не задана. Так пользователь задаёт свои значения через `@use "theme" with ($primary: red)`.'
      - text: 'Чтобы сделать переменную неизменяемой константой'
        why: 'Наоборот: `!default` делает значение запасным, его легко заменить.'
      - text: 'Чтобы переменная попала в CSS как custom property'
        why: '`!default` не создаёт custom properties. Переменная по-прежнему существует только при компиляции.'
      - text: 'Чтобы переменная стала глобальной во всех файлах проекта'
        why: 'Глобальность регулируется флагом `!global` и модульной системой, а не `!default`.'
    explanation: |
      Флаг `!default` значит «присвоить, если переменная ещё не определена или равна `null`». Это механизм
      настройки библиотек: Bootstrap и другие объявляют все параметры с `!default`, а пользователь до
      подключения задаёт свои. В модульной системе это выглядит так: `@use 'bootstrap' with ($primary: red)`.
      Конфигурировать через `with` можно только переменные с `!default` — так библиотека явно описывает, какие
      параметры публичные.
    links:
      - https://sass-lang.com/documentation/variables/#default-values
    source: own
