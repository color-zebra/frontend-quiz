questions:
  - id: css-units-001
    level: junior
    tags: [rem, em]
    question: |
      Чем `rem` отличается от `em`?
    options:
      - text: '`rem` — от шрифта `<html>`, `em` — от шрифта элемента'
        correct: true
        why: 'Для `font-size` значение `em` берётся от шрифта родителя, для остальных свойств — от шрифта самого элемента. `rem` всегда от корня.'
      - text: '`rem` — от ширины экрана, `em` — от ширины родителя'
        why: 'От ширины экрана считаются `vw`, от ширины родителя — проценты у ширины. `rem` и `em` связаны с размером шрифта.'
      - text: '`em` — устаревшая единица, `rem` — её новое название'
        why: 'Обе единицы актуальны и ведут себя по-разному. `em` полезна для отступов, которые растут вместе с шрифтом компонента.'
      - text: '`rem` всегда равен 16px, `em` зависит от шрифта браузера'
        why: '16px — лишь значение по умолчанию в браузерах. Если пользователь увеличит шрифт или сайт поменяет `font-size` у `html`, `rem` изменится.'
    explanation: |
      `rem` (root em) — размер шрифта корневого элемента `<html>`, по умолчанию обычно 16px. Он одинаков
      по всей странице и удобен для типографики и отступов: если пользователь увеличил шрифт в настройках
      браузера, вся вёрстка в `rem` масштабируется. `em` — размер шрифта текущего элемента, а в свойстве
      `font-size` — родителя. Он полезен для отступов внутри компонента: кнопка с `padding: 0.5em 1em`
      сохраняет пропорции при любом размере шрифта.
    links:
      - https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics/Values_and_units
    source: own

  - id: css-units-002
    level: middle
    tags: [em, compounding, font-size]
    question: |
      Корневой размер шрифта — 16px. Какой размер шрифта будет у текста во вложенном списке второго уровня?
    code: |
      <style>
        li { font-size: 1.2em; }
      </style>
      <ul>
        <li>Первый уровень
          <ul>
            <li>Второй уровень</li>
          </ul>
        </li>
      </ul>
    codeLang: html
    options:
      - text: '19,2px'
        why: 'Правило одно, но `em` в `font-size` считается от шрифта родителя, а родитель второго `li` уже увеличен.'
      - text: '23,04px'
        correct: true
        why: 'Первый `li`: 16 × 1,2 = 19,2px. Второй берёт `em` от него: 19,2 × 1,2 = 23,04px. Размеры накапливаются.'
      - text: '16px'
        why: 'Сброса нет: `em` всегда относителен шрифту родителя, и каждый уровень множит предыдущий.'
      - text: '24px'
        why: 'Браузер не округляет промежуточные значения так грубо. Здесь получается 23,04px, а не 24.'
    explanation: |
      В свойстве `font-size` единица `em` относительна размеру шрифта родителя. Если одно и то же правило
      срабатывает на вложенных элементах, множители накапливаются: 1,2, затем 1,44, затем 1,728 и так
      далее. Это эффект compounding: вложенные списки, комментарии, меню «растут» на каждом уровне. Решение —
      `rem` для `font-size` (он не зависит от вложенности) или правило вроде `li li { font-size: 1em; }`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/font-size#ems
    source: own

  - id: css-units-003
    level: middle
    tags: [vh, dvh, mobile]
    question: |
      Экран с `height: 100vh` на мобильном браузере оказывается выше видимой области, и кнопка внизу
      прячется под адресной строкой. Что поможет?
    options:
      - text: '`height: 100lvh`'
        why: '`lvh` — высота при спрятанных панелях, то есть самая большая. Это то же, что `vh` на мобильных, и кнопка так и останется под адресной строкой.'
      - text: '`height: 100dvh`'
        correct: true
        why: '`dvh` (dynamic viewport height) — высота с учётом текущего состояния панелей браузера. Она меняется, когда адресная строка прячется или появляется.'
      - text: '`height: 100vw`'
        why: '`vw` — ширина экрана, к высоте отношения не имеет. На телефоне в портретной ориентации это будет меньше высоты экрана.'
      - text: '`min-height: 100vh` вместо `height`'
        why: 'Это меняет только то, может ли блок расти. Сами 100vh всё так же больше видимой области при показанной адресной строке.'
    explanation: |
      На мобильных браузерах высота окна меняется: адресная строка и панели прячутся при прокрутке.
      Исторически `vh` равен высоте при спрятанных панелях — самой большой, поэтому блок `100vh` выше
      видимой области при показанной адресной строке. Новые единицы: `svh` — самая маленькая высота (панели
      показаны), `lvh` — самая большая, `dvh` — текущая, меняется вместе с панелями. Для полноэкранных
      экранов с кнопкой внизу обычно берут `dvh` или `svh`. Изменение `dvh` при прокрутке вызывает пересчёт
      раскладки, поэтому для тяжёлых страниц иногда предпочитают `svh`. Старый обход — `height: 100%` по цепочке
      от `html`: на мобильных он даёт высоту small viewport и ведёт себя как `svh`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/length#viewport-percentage_lengths
      - https://web.dev/blog/viewport-units
    source: own

  - id: css-units-004
    level: senior
    tags: [media-queries, em]
    question: |
      На сайте `html { font-size: 10px; }`. При какой ширине окна сработает этот медиазапрос, если
      пользователь не менял шрифт в настройках браузера?
    code: |
      @media (min-width: 48em) { /* ... */ }
    codeLang: css
    options:
      - text: '480px'
        why: 'Это частая ошибка. Медиазапросы не видят стилей страницы: `em` в них не зависит от `font-size` у html.'
      - text: '768px'
        correct: true
        why: '`em` и `rem` в медиазапросах считаются от начального размера шрифта браузера, по умолчанию 16px: 48 × 16 = 768.'
      - text: '960px'
        why: '960 = 48 × 20: так было бы при шрифте браузера 20px. По умолчанию он 16px, а 10px из `html` медиазапрос не учитывает.'
      - text: '624px'
        why: 'Никакого усреднения базового размера страницы и браузера нет. Берётся начальный размер шрифта из настроек браузера.'
    explanation: |
      Медиазапросы вычисляются до применения стилей страницы, поэтому относительные единицы в них не знают
      о ваших правилах. `em` и `rem` в медиазапросе равны начальному значению `font-size` — шрифту из
      настроек браузера (обычно 16px). Плюс такого подхода: если пользователь увеличил шрифт по умолчанию
      до 20px, точки перелома сдвинутся вместе с ним, и вёрстка не развалится. Трюк `html { font-size: 62.5% }`
      ради «удобных» rem на медиазапросы не влияет.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_media_queries/Using_media_queries
    source: own

  - id: css-units-005
    level: middle
    tags: [container-queries]
    question: |
      Почему этот контейнерный запрос не срабатывает?
    code: |
      .card { display: flex; flex-direction: column; }

      @container (min-width: 400px) {
        .card { flex-direction: row; }
      }
    codeLang: css
    options:
      - text: 'Ни у одного предка нет `container-type`, и запросу не к кому обращаться'
        correct: true
        why: 'Контейнерные запросы ищут ближайшего предка, объявленного контейнером через `container-type: inline-size` (или `size`).'
      - text: 'Контейнерные запросы работают только с grid-раскладкой'
        why: 'Они работают с любыми свойствами и раскладками. Важно лишь, чтобы был объявлен контейнер.'
      - text: 'Внутри `@container` можно менять только размеры, но не `flex-direction`'
        why: 'Ограничений на свойства нет. Правило для самого контейнера внутри `@container` писать можно, просто запрос для него обратится к контейнеру-предку.'
      - text: '`@container` поддерживается только с префиксом `-webkit-`'
        why: 'Контейнерные запросы поддерживаются без префиксов всеми современными браузерами с 2023 года.'
    explanation: |
      Медиазапрос спрашивает о размере окна, а контейнерный — о размере предка. Чтобы предок стал
      контейнером, ему задают `container-type: inline-size` (запросы по ширине) или `size` (по обеим осям,
      но тогда его размер не должен зависеть от содержимого). Элемент не может опрашивать сам себя:
      `.card` с `container-type` будет контейнером для своих потомков. Поэтому обычно оборачивают
      компонент в контейнер-обёртку. Так компонент адаптируется к месту, где стоит: в сайдбаре — колонкой,
      в основной области — строкой.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_containment/Container_queries
    source: own

  - id: css-units-006
    level: junior
    tags: [clamp, responsive-typography]
    question: |
      Что означает такая запись?
    code: |
      h1 { font-size: clamp(1.5rem, 4vw, 3rem); }
    codeLang: css
    options:
      - text: 'Размер `4vw`, но не меньше `1.5rem` и не больше `3rem`'
        correct: true
        why: '`clamp(MIN, VAL, MAX)` берёт предпочтительное значение и ограничивает его снизу и сверху.'
      - text: 'Три размера для мобильных, планшетов и десктопов соответственно'
        why: '`clamp` не связан с типами устройств. Средний аргумент тянется плавно вместе с шириной окна.'
      - text: 'Браузер выберет наибольшее из трёх значений'
        why: 'Наибольшее выбирает функция `max()`. `clamp` держит значение в коридоре между минимумом и максимумом.'
      - text: 'Среднее арифметическое трёх значений'
        why: 'Ни одна функция CSS не усредняет аргументы. `clamp` ограничивает среднее значение рамками.'
    explanation: |
      `clamp(min, preferred, max)` — сокращение для `max(min, min(preferred, max))`. Это основа «резиновой»
      типографики без медиазапросов: заголовок растёт вместе с окном, но не становится мелким на телефоне и
      огромным на широком мониторе. Чтобы шрифт ещё и масштабировался при увеличении в браузере, в средний
      аргумент добавляют `rem`: `clamp(1.5rem, 1rem + 2vw, 3rem)`. Чисто `vw` пользователь не сможет
      увеличить.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/clamp
    source: own

  - id: css-units-007
    level: junior
    tags: [px, dpr]
    question: |
      Сколько физических пикселей экрана займёт линия `width: 100px` на телефоне с DPR = 3?
    options:
      - text: '100'
        why: 'CSS-пиксель — абстрактная единица. На экранах высокой плотности в одном CSS-пикселе несколько физических.'
      - text: '300'
        correct: true
        why: 'Device pixel ratio показывает, сколько физических пикселей приходится на один CSS-пиксель по каждой оси. 100 × 3 = 300.'
      - text: '33'
        why: 'Наоборот: плотный экран использует больше физических пикселей, чтобы элемент сохранил видимый размер.'
      - text: '900'
        why: 'DPR действует на каждую ось отдельно. Ширина — одна ось, поэтому множитель применяется один раз: 100 × 3 = 300.'
    explanation: |
      `px` в CSS — CSS-пиксель, единица, привязанная к восприятию, а не к матрице экрана. `window.devicePixelRatio`
      показывает, сколько физических пикселей приходится на один CSS-пиксель по каждой оси. Поэтому элемент
      шириной 100px выглядит одинаково на обычном мониторе и на ретине, но на ретине рисуется втрое большим
      числом точек. Отсюда необходимость картинок большего разрешения (`srcset`, `image-set()`), иначе на
      плотных экранах они будут размытыми.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/Window/devicePixelRatio
    source: own

  - id: css-units-008
    level: middle
    tags: [vw, scrollbar]
    question: |
      На десктопе у страницы появилась горизонтальная прокрутка из-за блока `width: 100vw`. Почему?
    options:
      - text: '`100vw` включает ширину вертикальной полосы прокрутки'
        correct: true
        why: 'Если у страницы есть вертикальный скроллбар, `100vw` шире доступной области на его ширину (обычно 15–17px), и появляется горизонтальный скролл.'
      - text: '`vw` считается от ширины монитора, а не окна браузера'
        why: '`vw` — процент ширины viewport, то есть окна, а не всего монитора.'
      - text: '`100vw` добавляет к ширине padding и border родителя'
        why: '`vw` не зависит от родителя вообще, только от viewport.'
      - text: 'Браузер округляет `vw` в большую сторону'
        why: 'Округление не может дать заметную прокрутку. Причина — полоса прокрутки, которая входит в `100vw`.'
    explanation: |
      Единица `vw` — процент ширины viewport, и в неё входит вертикальная полоса прокрутки (в браузерах,
      где она занимает место, как на Windows). Доступная для контента ширина меньше, поэтому блок
      `width: 100vw` вылезает на ширину скроллбара. Для «полноширинного» блока внутри обычного потока
      обычно хватает `width: 100%`. Свойство `scrollbar-gutter: stable` резервирует место под скроллбар и
      убирает прыжки вёрстки, когда он появляется.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/length#vw
      - https://developer.mozilla.org/en-US/docs/Web/CSS/scrollbar-gutter
    source: own

  - id: css-units-009
    level: middle
    tags: [min, max, percentages]
    question: |
      Что делает `width: min(100% - 2rem, 960px)` у обёртки контента?
    options:
      - text: 'Синтаксическая ошибка: внутри `min()` нельзя вычитать без `calc()`'
        why: 'Внутри `min()`, `max()` и `clamp()` математика разрешена напрямую, `calc()` не нужен.'
      - text: 'Ширина 960px, но не больше ширины родителя за вычетом 2rem'
        correct: true
        why: '`min()` выбирает меньшее: на широком экране — 960px, на узком — ширину родителя с отступом по 1rem с каждой стороны (при `margin-inline: auto`).'
      - text: 'Ширина не меньше 960px, даже на телефоне'
        why: 'Это поведение `max()`. `min()` задаёт верхнюю границу, а не нижнюю.'
      - text: 'Ширина всегда равна `100% - 2rem`'
        why: 'Так было бы, если бы второй аргумент всегда был больше. На широком экране 960px окажется меньше и победит.'
    explanation: |
      `min()` и `max()` — математические функции, которые выбирают наименьшее или наибольшее из выражений
      и пересчитываются вместе с вёрсткой. Запись `width: min(100% - 2rem, 960px); margin-inline: auto` —
      современная обёртка контента в одну строку вместо пары `max-width` и `padding`. Мнемоника: `min()`
      задаёт максимум (значение не будет больше любого аргумента), а `max()` задаёт минимум.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/CSS/min
    source: own
