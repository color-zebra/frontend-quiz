topic: javascript
subtopic: prototypes
questions:
  - id: javascript-prototypes-001
    level: junior
    tags: [prototype-chain, hasOwnProperty, output]
    question: |
      Что выведется в консоль?
    code: |
      const animal = { eats: true };
      const rabbit = Object.create(animal);
      rabbit.jumps = true;

      console.log(rabbit.eats, Object.hasOwn(rabbit, 'eats'), Object.keys(rabbit));
    codeLang: js
    options:
      - text: '`true true [ "jumps", "eats" ]`'
        why: '`eats` не копируется в `rabbit`: оно остаётся в прототипе и находится через цепочку при чтении.'
      - text: '`true false [ "jumps" ]`'
        correct: true
        why: 'Свойство `eats` находится в прототипе `animal`, поэтому читается, но собственным не является. `Object.keys` возвращает только собственные перечисляемые свойства.'
      - text: '`undefined false [ "jumps" ]`'
        why: 'Чтение свойства идёт вверх по цепочке прототипов, и `eats` найдётся у `animal`.'
      - text: '`true false [ "jumps", "eats" ]`'
        why: '`Object.keys` не заходит в прототипы. Унаследованные свойства перебирает `for...in`.'
    explanation: |
      У каждого объекта есть скрытая ссылка `[[Prototype]]` на другой объект или `null`. При чтении свойства
      движок ищет его в самом объекте, потом в прототипе, потом в прототипе прототипа и так до `null`. Это
      цепочка прототипов. `Object.create(proto)` создаёт объект с указанным прототипом. Проверки различаются:
      `in` и чтение видят всю цепочку, а `Object.hasOwn`, `Object.keys` и `JSON.stringify` — только собственные
      свойства.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Inheritance_and_the_prototype_chain
    source: own

  - id: javascript-prototypes-002
    level: middle
    tags: [shadowing, assignment, output]
    question: |
      Что выведется в консоль?
    code: |
      const defaults = { theme: 'light' };
      const settings = Object.create(defaults);

      settings.theme = 'dark';
      console.log(settings.theme, defaults.theme);
    codeLang: js
    options:
      - text: '`dark dark`'
        why: 'Запись не идёт в прототип: она создаёт собственное свойство у объекта, которому присваивают.'
      - text: '`dark light`'
        correct: true
        why: 'Присваивание создало у `settings` собственное свойство `theme`, которое затеняет унаследованное. Прототип не изменился.'
      - text: '`light light`'
        why: 'Запись в объект разрешена и создаёт своё свойство. Ничто не мешает присваиванию.'
      - text: '`TypeError`: нельзя менять унаследованное свойство'
        why: 'Ошибка возможна только в строгом режиме, например если в прототипе свойство с `writable: false` или геттер без сеттера. В нестрогом режиме такая запись молча игнорируется, а если в прототипе есть сеттер, вызывается он. Обычное свойство можно затенить.'
    explanation: |
      Чтение свойств идёт по цепочке прототипов, а запись — нет: обычное присваивание создаёт или меняет
      собственное свойство объекта. Унаследованное значение после этого затеняется (shadowing). Исключения:
      если в цепочке есть сеттер с этим именем, вызывается он; если унаследованное свойство помечено как
      `writable: false`, присваивание не сработает. Благодаря этому прототипы безопасно хранят значения по
      умолчанию для множества объектов.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Inheritance_and_the_prototype_chain#inheritance_with_the_prototype_chain
    source: own

  - id: javascript-prototypes-003
    level: middle
    tags: [shared-state, prototype, output]
    question: |
      Что выведется в консоль?
    code: |
      function Team() {}
      Team.prototype.members = [];

      const a = new Team();
      const b = new Team();
      a.members.push('Аня');

      console.log(b.members.length);
    codeLang: js
    options:
      - text: '`0`'
        why: 'У экземпляров нет собственного массива. `push` изменил общий массив, который лежит в прототипе.'
      - text: '`1`'
        correct: true
        why: '`a.members` читает массив из прототипа и мутирует его. `b.members` — тот же самый массив, поэтому в нём один элемент.'
      - text: '`undefined`'
        why: 'Свойство `members` найдётся в прототипе для любого экземпляра.'
      - text: '`TypeError`: у `b` нет `members`'
        why: 'У `b` нет собственного `members`, но чтение найдёт его в прототипе `Team.prototype`.'
    explanation: |
      Прототип общий для всех экземпляров. Методы туда класть правильно, а изменяемые данные — опасно: мутация
      через один экземпляр видна во всех. Присваивание `a.members = [...]` создало бы собственное свойство и
      проблемы бы не было, но `push` ничего не присваивает, а меняет общий массив. Поэтому состояние
      инициализируют в конструкторе (`this.members = []`) или полями класса, а в прототипе держат только
      функции.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/prototype
    source: own

  - id: javascript-prototypes-004
    level: senior
    tags: [prototype-reassign, instanceof, output]
    question: |
      Что выведется в консоль?
    code: |
      function Box() {}
      const box = new Box();

      Box.prototype = { size: 10 };

      console.log(box.size, box instanceof Box);
    codeLang: js
    options:
      - text: '`10 true`'
        why: 'Объект `box` получил ссылку на прототип в момент создания. Замена `Box.prototype` на новый объект эту ссылку не меняет.'
      - text: '`undefined false`'
        correct: true
        why: '`box` по-прежнему ссылается на старый прототип, где нет `size`. А `instanceof` проверяет, есть ли в цепочке `box` текущий `Box.prototype`, — нового объекта там нет.'
      - text: '`undefined true`'
        why: '`instanceof` не помнит, каким конструктором создан объект. Он сравнивает цепочку прототипов с текущим значением `Box.prototype`.'
      - text: '`10 false`'
        why: 'Свойства нового прототипа видны только объектам, созданным после замены.'
    explanation: |
      `new Box()` записывает в `[[Prototype]]` нового объекта то, что лежит в `Box.prototype` в этот момент.
      Связь — между объектами, а не с функцией. Замена `Box.prototype` целиком влияет только на будущие
      экземпляры; изменение старого объекта (`Box.prototype.size = 10`) увидели бы все. Оператор `instanceof`
      работает через цепочку: `x instanceof F` проверяет, встречается ли `F.prototype` в цепочке `x`. Поэтому
      после замены старые объекты перестают быть «экземплярами».
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/instanceof
    source: own

  - id: javascript-prototypes-005
    level: middle
    tags: [prototype-vs-proto, output]
    question: |
      Что выведется в консоль?
    code: |
      function User() {}
      const user = new User();

      console.log(
        Object.getPrototypeOf(user) === User.prototype,
        Object.getPrototypeOf(User) === User.prototype,
        Object.getPrototypeOf(User) === Function.prototype,
      );
    codeLang: js
    options:
      - text: '`true true false`'
        why: '`User.prototype` — прототип для экземпляров, а не прототип самой функции `User`.'
      - text: '`true false true`'
        correct: true
        why: '`User.prototype` — объект, который станет прототипом экземпляров. Сама функция `User` — объект, и её прототип — `Function.prototype`.'
      - text: '`false false true`'
        why: '`new User()` ставит прототипом экземпляра именно `User.prototype`.'
      - text: '`true false false`'
        why: 'Любая функция наследует от `Function.prototype` — оттуда у неё методы `call`, `apply`, `bind`.'
    explanation: |
      Два похожих понятия, которые часто путают. `F.prototype` — обычное свойство функции: объект, который
      `new F()` сделает прототипом создаваемых экземпляров. `[[Prototype]]` (доступ через
      `Object.getPrototypeOf` или устаревший `__proto__`) — настоящий прототип конкретного объекта. У функции
      `User` её собственный прототип — `Function.prototype`, а `User.prototype` нужен только для экземпляров.
      Цепочка экземпляра: `user` → `User.prototype` → `Object.prototype` → `null`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/getPrototypeOf
    source: own

  - id: javascript-prototypes-006
    level: junior
    tags: [new, constructor]
    question: |
      Что делает оператор `new` при вызове `new User('Аня')`?
    options:
      - text: 'Создаёт объект с прототипом `User.prototype` и вызывает `User` с ним в `this`'
        correct: true
        why: 'Это основные шаги. Есть оговорка: если функция сама вернёт объект, `new` вернёт его вместо созданного.'
      - text: 'Копирует все свойства `User.prototype` в новый объект и возвращает копию'
        why: 'Свойства прототипа не копируются: новый объект ссылается на прототип и находит их по цепочке.'
      - text: 'Вызывает `User` как обычную функцию и возвращает её результат'
        why: 'Обычный вызов не создаёт объект и не задаёт `this`. Без `return` он вернул бы `undefined`.'
      - text: 'Создаёт копию функции `User` с привязанным `this`'
        why: 'Копию функции с привязанным `this` создаёт `bind`. `new` создаёт объект-экземпляр.'
    explanation: |
      `new F(args)` выполняет примерно такой алгоритм: создать объект `obj` с `[[Prototype]] = F.prototype`;
      вызвать `F` с `this = obj` и переданными аргументами; если `F` вернула объект, вернуть его, иначе вернуть
      `obj`. Так устроены функции-конструкторы и классы — синтаксис `class` работает поверх этого механизма.
      Вызов конструктора без `new` раньше был частой ошибкой: `this` указывал на глобальный объект. Классы
      защищены — без `new` они бросают `TypeError`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/new#description
    source: own

  - id: javascript-prototypes-007
    level: middle
    tags: [object-create-null, dictionary, output]
    question: |
      Что выведется в консоль?
    code: |
      const dict = Object.create(null);
      dict.word = 'слово';

      console.log('toString' in dict, typeof dict.hasOwnProperty, Object.keys(dict));
    codeLang: js
    options:
      - text: '`true function [ "word" ]`'
        why: 'У объекта, созданного через `Object.create(null)`, нет прототипа, а значит, нет и методов `Object.prototype`.'
      - text: '`false undefined [ "word" ]`'
        correct: true
        why: 'Цепочка прототипов пуста, поэтому `toString` и `hasOwnProperty` не находятся. `Object.keys` — статическая функция и работает с любым объектом.'
      - text: '`false undefined []`'
        why: '`word` — обычное собственное перечисляемое свойство, `Object.keys` его вернёт.'
      - text: '`TypeError`: у объекта без прототипа нельзя создавать свойства'
        why: 'Свойства создаются как обычно. Нет только унаследованных методов.'
    explanation: |
      `Object.create(null)` даёт «голый» объект без прототипа. Его используют как словарь: ключи вроде
      `toString`, `constructor` или `__proto__` не конфликтуют с унаследованными свойствами и не дают
      ложных срабатываний `key in dict`. Цена — методы `Object.prototype` недоступны: проверять ключи нужно
      через `Object.hasOwn(dict, key)`, а `String(dict)` или шаблонная строка бросят `TypeError`. Для настоящих
      словарей с произвольными ключами чаще берут `Map`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object#null-prototype_objects
    source: own

  - id: javascript-prototypes-008
    level: senior
    tags: [setter, prototype, output]
    question: |
      Что выведется в консоль?
    code: |
      const proto = {
        set value(v) {
          this._value = v * 2;
        },
      };

      const obj = Object.create(proto);
      obj.value = 5;

      console.log(Object.keys(obj), obj._value);
    codeLang: js
    options:
      - text: '`[ "value" ] undefined`'
        why: 'Собственное свойство `value` не создаётся: в цепочке найден сеттер, и присваивание уходит в него.'
      - text: '`[ "_value" ] 10`'
        correct: true
        why: 'Присваивание нашло сеттер в прототипе и вызвало его с `this === obj`. Сеттер записал собственное свойство `_value` в сам `obj`.'
      - text: '`[ "value", "_value" ] 10`'
        why: 'Сеттер перехватывает присваивание целиком, свойство `value` в объекте не появится.'
      - text: '`[] 10`'
        why: '`_value` записан через `this`, а `this` в сеттере — это `obj`, поэтому свойство собственное.'
    explanation: |
      Присваивание `obj.key = v` сначала ищет `key` по цепочке. Если найден сеттер, он вызывается с `this`,
      равным исходному объекту, и собственное свойство `key` не создаётся. Если найдено обычное свойство с
      `writable: false`, присваивание игнорируется (в строгом режиме — `TypeError`). И только в остальных случаях
      создаётся собственное свойство. Так работают геттеры и сеттеры в классах: они живут в прототипе, а данные —
      в экземплярах.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/set
    source: own

  - id: javascript-prototypes-009
    level: middle
    tags: [for-in, inheritance, output]
    question: |
      Что выведется в консоль?
    code: |
      const base = { inherited: 1 };
      const obj = Object.create(base);
      obj.own = 2;

      const keys = [];
      for (const key in obj) keys.push(key);
      console.log(keys, Object.keys(obj));
    codeLang: js
    options:
      - text: '`[ "own" ] [ "own" ]`'
        why: '`for...in` перебирает перечисляемые свойства по всей цепочке прототипов, а не только собственные.'
      - text: '`[ "own", "inherited" ] [ "own" ]`'
        correct: true
        why: '`for...in` видит и унаследованное перечисляемое свойство, а `Object.keys` — только собственные.'
      - text: '`[ "own", "inherited" ] [ "own", "inherited" ]`'
        why: '`Object.keys` не заходит в прототипы.'
      - text: '`[ "inherited", "own" ] [ "own" ]`'
        why: '`for...in` сначала перебирает собственные свойства, а затем идёт вверх по цепочке.'
    explanation: |
      `for...in` обходит все перечисляемые строковые ключи объекта и его прототипов. Встроенные методы вроде
      `toString` в обход не попадают, потому что они неперечисляемые. Но любые свойства, добавленные в
      прототипы руками или библиотеками, появятся. Отсюда старая привычка писать внутри `for...in` проверку
      `Object.hasOwn(obj, key)`. Сегодня обычно используют `Object.keys`, `Object.entries` или `for...of` по
      ним — они работают только с собственными свойствами.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/for...in
    source: own

  - id: javascript-prototypes-010
    level: senior
    tags: [new, return, constructor, output]
    question: |
      Что выведется в консоль?
    code: |
      function WithObject() {
        this.a = 1;
        return { b: 2 };
      }
      function WithPrimitive() {
        this.a = 1;
        return 42;
      }

      console.log(JSON.stringify(new WithObject()), JSON.stringify(new WithPrimitive()));
    codeLang: js
    options:
      - text: '`{"a":1} {"a":1}`'
        why: 'Если конструктор возвращает объект, `new` отдаёт его вместо созданного `this`.'
      - text: '`{"b":2} 42`'
        why: 'Примитив, возвращённый из конструктора, `new` игнорирует и отдаёт созданный объект.'
      - text: '`{"b":2} {"a":1}`'
        correct: true
        why: 'Возвращённый объект подменяет результат `new`. Возвращённый примитив игнорируется, и `new` отдаёт созданный объект с `a: 1`.'
      - text: '`{"a":1,"b":2} {"a":1}`'
        why: 'Объекты не сливаются: возвращённый объект полностью заменяет созданный.'
    explanation: |
      Последний шаг алгоритма `new`: если конструктор вернул объект (включая массив или функцию), результатом
      будет он, иначе — созданный `this`. Примитивы (`42`, `'str'`, `null`) игнорируются. Этим пользуются редко,
      например чтобы вернуть закэшированный экземпляр (синглтон) или Proxy вокруг `this`. В классах правило
      то же самое. Но в производном классе вернуть примитив нельзя: это `TypeError`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/new#description
    source: own

  - id: javascript-prototypes-011
    level: junior
    tags: [prototype, definition, theory]
    question: |
      Что такое прототип объекта в JavaScript?
    options:
      - text: 'Другой объект, где ищутся свойства, которых нет у самого объекта'
        correct: true
        why: 'Каждый объект хранит скрытую ссылку `[[Prototype]]` на другой объект или `null`. Если свойства нет у объекта, движок ищет его в прототипе, потом в прототипе прототипа.'
      - text: 'Копия всех свойств родителя, которую движок делает при создании объекта'
        why: 'Свойства не копируются: прототип — живой объект, общий для многих наследников, и его изменения они видят сразу.'
      - text: 'Класс, по которому движок создал этот объект'
        why: 'Прототип — обычный объект, а не класс. Класс в JS — функция, и экземпляры наследуют не от неё, а от её свойства `prototype`.'
      - text: 'Список свойств, которые объект обязан содержать'
        why: 'Это похоже на интерфейс в TypeScript. Прототип ничего не требует от объекта, он только даёт ему унаследованные свойства.'
    explanation: |
      Наследование в JavaScript построено на объектах, а не на классах. У каждого объекта есть внутренний слот
      `[[Prototype]]` со ссылкой на другой объект. Свойства прототипа не копируются, а находятся при чтении,
      поэтому изменение прототипа сразу видно всем наследникам. Получить прототип можно через
      `Object.getPrototypeOf(obj)`, задать при создании — через `Object.create(proto)` или `new`. Классы
      ES2015 — синтаксис поверх этого же механизма.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Inheritance_and_the_prototype_chain
    source: own

  - id: javascript-prototypes-012
    level: middle
    tags: [prototype-vs-proto, __proto__, theory]
    question: |
      Какие из утверждений о `prototype`, `[[Prototype]]` и `__proto__` верны?
    options:
      - text: '`F.prototype` — объект, который станет прототипом экземпляров `new F()`'
        correct: true
        why: 'Это обычное свойство функции-конструктора. `new F()` записывает его в `[[Prototype]]` создаваемого объекта.'
      - text: '`Object.getPrototypeOf(obj)` возвращает внутренний `[[Prototype]]` объекта'
        correct: true
        why: 'Это стандартный способ прочитать прототип. Для записи есть `Object.setPrototypeOf`, но менять прототип готового объекта медленно.'
      - text: '`__proto__` — устаревший аксессор из `Object.prototype`, а не своё свойство'
        correct: true
        why: 'Геттер и сеттер `__proto__` лежат в `Object.prototype` и читают тот же `[[Prototype]]`. Поэтому `Object.hasOwn({}, "__proto__")` — `false`.'
      - text: 'У любого объекта есть свойство `prototype`, где хранится его прототип'
        why: 'Свойство `prototype` есть у обычных функций, классов и генераторов, но не у обычных объектов. У обычного объекта `obj.prototype` — `undefined`, а его прототип читают через `Object.getPrototypeOf`.'
      - text: '`__proto__` работает и у объекта, созданного через `Object.create(null)`'
        why: 'У такого объекта нет `Object.prototype` в цепочке, а значит, нет и аксессора `__proto__`. Чтение даст `undefined`, а запись создаст обычное свойство с именем `__proto__`.'
    explanation: |
      Три похожих имени означают разное. `[[Prototype]]` — внутренний слот каждого объекта, настоящая ссылка
      на прототип. `__proto__` — старый аксессор к этому слоту, оставленный ради совместимости; в новом коде
      используют `Object.getPrototypeOf` и `Object.setPrototypeOf`. `prototype` — свойство
      функции-конструктора: заготовка прототипа для будущих экземпляров. Цепочка экземпляра `user` выглядит
      так: `user` → `User.prototype` → `Object.prototype` → `null`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/proto
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/getPrototypeOf
    source: own

  - id: javascript-prototypes-013
    level: junior
    tags: [prototype-chain, lookup, theory]
    question: |
      Где заканчивается цепочка прототипов обычного объекта и что даст чтение свойства, которого нет нигде в
      цепочке?
    options:
      - text: 'На `null` после `Object.prototype`, чтение даст `undefined`'
        correct: true
        why: 'Прототип `Object.prototype` — `null`. Дойдя до него, поиск останавливается, и отсутствующее свойство читается как `undefined` без ошибки.'
      - text: 'На `Object.prototype`, чтение бросит `ReferenceError`'
        why: '`ReferenceError` бывает для необъявленных переменных, а не для свойств. Отсутствующее свойство — просто `undefined`.'
      - text: 'На самом объекте, цепочка замкнута в кольцо, чтение даст `undefined`'
        why: 'Цепочка не может быть кольцом: попытка создать цикл через `Object.setPrototypeOf` бросает `TypeError`.'
      - text: 'На глобальном объекте `window`, чтение даст `null`'
        why: '`window` не входит в цепочку обычных объектов. И отсутствующее свойство даёт `undefined`, а не `null`.'
    explanation: |
      При чтении `obj.key` движок проверяет собственные свойства объекта, затем его прототипа, затем прототипа
      прототипа — пока не найдёт свойство или не дойдёт до `null`. У обычных объектов последнее звено —
      `Object.prototype`, отсюда у всех объектов методы `toString` и `hasOwnProperty`. Если свойство не
      нашлось, результат — `undefined`. Ошибка возникает позже, если обратиться к свойству этого `undefined`:
      `obj.missing.name`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Inheritance_and_the_prototype_chain#inheritance_with_the_prototype_chain
    source: own

  - id: javascript-prototypes-014
    level: middle
    tags: [prototype-chain, array, theory]
    question: |
      Как выглядит цепочка прототипов у массива `[1, 2]`?
    options:
      - text: '`[1, 2]` → `Array.prototype` → `Object.prototype` → `null`'
        correct: true
        why: 'Методы массивов (`map`, `filter`, `push`) лежат в `Array.prototype`, а он, как любой обычный объект, наследует от `Object.prototype` — отсюда у массива `hasOwnProperty`.'
      - text: '`[1, 2]` → `Array` → `Function.prototype` → `null`'
        why: '`Array` — функция-конструктор, а не прототип экземпляров. Массив наследует от `Array.prototype`, а `Function.prototype` — прототип самой функции `Array`.'
      - text: '`[1, 2]` → `Object.prototype` → `Array.prototype` → `null`'
        why: 'Порядок обратный: `Array.prototype` наследует от `Object.prototype`, иначе методы массивов были бы у всех объектов.'
      - text: '`[1, 2]` → `Array.prototype` → `null`'
        why: 'Цепочка не обрывается на `Array.prototype`: это тоже объект, и его прототип — `Object.prototype`.'
    explanation: |
      Цепочки встроенных типов однотипны: `{}` → `Object.prototype` → `null`; `[]` → `Array.prototype` →
      `Object.prototype` → `null`; функция → `Function.prototype` → `Object.prototype` → `null`. Отсюда у
      массивов методы `map` и `filter`, у функций — `call` и `bind`, а у всех вместе — `toString` и
      `hasOwnProperty`. Причём `Array.prototype.toString` затеняет `Object.prototype.toString`, поэтому
      `String([1, 2])` даёт `"1,2"`, а не `"[object Array]"`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Inheritance_and_the_prototype_chain#different_ways_of_creating_and_mutating_prototype_chains
    source: own

  - id: javascript-prototypes-015
    level: middle
    tags: [instanceof, prototype-chain, theory]
    question: |
      Как на самом деле работает проверка `obj instanceof F`?
    options:
      - text: 'Ищет объект `F.prototype` в цепочке прототипов `obj`'
        correct: true
        why: 'Оператор идёт по цепочке `obj` и сравнивает каждое звено с текущим `F.prototype`. Нашёлся — `true`, дошёл до `null` — `false`.'
      - text: 'Проверяет, что `obj` был создан вызовом `new F()`'
        why: 'Как создан объект, `instanceof` не знает. Объект из `Object.create(F.prototype)` тоже пройдёт проверку, а после замены `F.prototype` старые экземпляры — нет.'
      - text: 'Сравнивает свойство `obj.constructor` с функцией `F`'
        why: '`constructor` — обычное свойство, его можно перезаписать, и `instanceof` на него не смотрит.'
      - text: 'Проверяет, что у `obj` есть все методы из `F.prototype`'
        why: 'Наличие методов не проверяется: это была бы утиная типизация. Объект со всеми нужными методами, но другим прототипом, не пройдёт проверку.'
    explanation: |
      `instanceof` — проверка цепочки прототипов, а не «происхождения» объекта. Поэтому результат меняется,
      если заменить `F.prototype` или прототип объекта, и поэтому массив из iframe не `instanceof Array`: у
      него другой `Array.prototype`. Класс может переопределить проверку статическим методом
      `Symbol.hasInstance`. Для проверки без конструктора есть `Object.prototype.isPrototypeOf`:
      `F.prototype.isPrototypeOf(obj)`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/instanceof
    source: own

  - id: javascript-prototypes-016
    level: senior
    tags: [assignment, setter, writable, theory]
    question: |
      В каких случаях присваивание `obj.x = 1` НЕ создаст у `obj` собственное свойство `x`? Режим строгий,
      своего `x` у `obj` нет.
    options:
      - text: 'В цепочке прототипов есть сеттер `x`'
        correct: true
        why: 'Присваивание уходит в сеттер, вызванный с `this === obj`. Создаст ли он что-то, решает код сеттера, но свойство `x` автоматически не появится.'
      - text: 'В прототипе `x` помечено как `writable: false`'
        correct: true
        why: 'Унаследованное свойство только для чтения запрещает и затенение: в строгом режиме будет `TypeError`. Это иногда называют override mistake.'
      - text: 'Объект `obj` сделан нерасширяемым через `Object.preventExtensions`'
        correct: true
        why: 'В нерасширяемый объект нельзя добавить новое свойство, в строгом режиме присваивание бросит `TypeError`.'
      - text: 'В прототипе уже есть обычное записываемое свойство `x`'
        why: 'Это обычный случай затенения: у `obj` появится своё `x`, а прототип не изменится.'
      - text: 'Свойство `x` в прототипе записываемое, но неперечисляемое'
        why: '`enumerable` влияет только на перебор. Если свойство записываемое, присваивание создаст собственное `x`.'
      - text: 'Объект создан через `Object.create(null)`'
        why: 'Отсутствие прототипа присваиванию не мешает: свойство просто создаётся у самого объекта.'
    explanation: |
      Чтение идёт по цепочке прототипов, а присваивание сначала тоже ищет свойство по цепочке, но только чтобы
      решить, что делать. Нашёлся сеттер — вызывается он. Нашлось свойство только для чтения — запись
      запрещена. Иначе, если объект расширяемый, создаётся собственное свойство, затеняющее унаследованное.
      Так прототип защищён от случайной мутации через экземпляр, а аксессоры классов, которые живут в
      прототипе, работают для всех экземпляров. `Object.defineProperty` обходит сеттеры и read-only свойства
      прототипа и пишет в сам объект, но в нерасширяемый объект новое свойство не добавит и он.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Inheritance_and_the_prototype_chain#inheritance_with_the_prototype_chain
      - https://tc39.es/ecma262/#sec-ordinarysetwithowndescriptor
    source: own

  - id: javascript-prototypes-017
    level: middle
    tags: [methods, prototype, memory, theory]
    question: |
      Почему методы обычно кладут в `prototype` конструктора, а данные — в сам экземпляр?
    options:
      - text: 'Методы одинаковы для всех экземпляров, а данные у каждого свои'
        correct: true
        why: 'Одна функция в прототипе обслуживает тысячи объектов и не дублируется в памяти. А изменяемые данные в прототипе были бы общими: мутация через один экземпляр видна во всех.'
      - text: 'Свойства прототипа нельзя изменить после создания экземпляров'
        why: 'Прототип можно менять в любой момент, и изменения сразу видят все наследники.'
      - text: 'Метод, записанный в экземпляр, не получает правильный `this`'
        why: 'Получает: `this` зависит от вызова `obj.method()`, а не от того, где лежит функция. Метод в экземпляре работает, просто тратит память на каждую копию.'
      - text: 'Данные, записанные в прототип, не видны через экземпляр'
        why: 'Видны: чтение идёт по цепочке. Проблема данных в прототипе в том, что они общие для всех экземпляров.'
    explanation: |
      Прототип — общая часть всех экземпляров. Поэтому туда идёт то, что не меняется и одинаково у всех, —
      методы. Состояние создают в конструкторе (`this.items = []`) или полями класса, чтобы у каждого
      экземпляра были свои значения. Именно так раскладывает члены синтаксис `class`: методы — в `prototype`,
      поля — в экземпляр. Исключение — поля-стрелки: они создаются на каждый экземпляр ради привязанного
      `this`, и это сознательная плата памятью.
    links:
      - https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Advanced_JavaScript_objects/Object_prototypes#setting_a_prototype
    source: own

  - id: javascript-prototypes-018
    level: middle
    tags: [object-create-null, dictionary, theory]
    question: |
      Зачем словарь с произвольными ключами иногда создают через `Object.create(null)`, а не через `{}`?
    options:
      - text: 'Чтобы ключи `toString` или `__proto__` не путались с унаследованными'
        correct: true
        why: 'У `{}` есть прототип, и проверка `"toString" in dict` истинна ещё до записи. А запись ключа `__proto__` в `{}` не создаёт свойство: объект в значении становится прототипом, а строка молча игнорируется.'
      - text: 'Чтобы после создания объект нельзя было изменить'
        why: 'Объект без прототипа остаётся изменяемым. Запретить изменения может `Object.freeze`.'
      - text: 'Чтобы свойства объекта не попадали в `JSON.stringify`'
        why: '`JSON.stringify` сериализует собственные перечисляемые свойства и прототип не учитывает. Ключи такого словаря попадут в JSON.'
      - text: 'Чтобы `for...in` перебирал ключи строго в порядке добавления'
        why: 'Порядок ключей одинаков для любых объектов: сначала ключи-индексы (неотрицательные целые) по возрастанию, затем остальные строки по порядку добавления.'
    explanation: |
      Объект без прототипа — «чистый» словарь: в нём нет ни одного унаследованного ключа, и пользовательские
      строки вроде `constructor`, `toString` или `__proto__` ведут себя как обычные ключи. Это защищает от
      ошибок и от атак prototype pollution. Неудобство — нет методов `Object.prototype`: `dict.hasOwnProperty`
      не существует, а `String(dict)` бросает `TypeError`. Поэтому ключи проверяют через `Object.hasOwn`. Для
      словарей с произвольными ключами современная альтернатива — `Map`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object#null-prototype_objects
    source: own
