topic: javascript
subtopic: memory
questions:
  - id: javascript-memory-001
    level: junior
    tags: [garbage-collection, reachability]
    question: |
      Когда сборщик мусора в JavaScript может освободить память объекта?
    options:
      - text: 'Когда до объекта нельзя добраться ни от одного корня'
        correct: true
        why: 'Современные движки используют алгоритм mark-and-sweep: помечают всё достижимое от корней, остальное освобождают. Количество ссылок само по себе не важно.'
      - text: 'Сразу после выхода из функции, где объект был создан'
        why: 'Объект переживает функцию, если на него осталась ссылка: из замыкания, возвращаемого значения, глобальной переменной.'
      - text: 'Когда разработчик вызовет `delete` для переменной'
        why: '`delete` удаляет свойство объекта и не работает для переменных. Освобождением памяти управляет сборщик.'
      - text: 'Когда количество ссылок на объект станет равно нулю, и ни секундой позже'
        why: 'Подсчёт ссылок использовался в старых движках и не справлялся с циклами. Сейчас сборка идёт по достижимости и в удобный движку момент.'
    explanation: |
      Сборщик мусора начинает с корней — глобального объекта, текущего стека вызовов, активных замыканий — и
      помечает всё, до чего можно дотянуться по ссылкам. Непомеченное освобождается (mark-and-sweep). Поэтому
      взаимные ссылки двух объектов не мешают сборке, если до них нельзя добраться извне. Утечка памяти в JS —
      это не «забыли освободить», а «случайно оставили достижимым»: объект висит в глобальном массиве, в
      подписке, таймере или кэше. Момент сборки определяет движок, и управлять им из кода нельзя.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Memory_management
    source: own

  - id: javascript-memory-002
    level: middle
    tags: [timers, leaks, no-run]
    question: |
      Компонент виджета удалили со страницы, но память не освобождается. В чём причина?
    code: |
      function createWidget(root) {
        const data = loadHugeData();
        setInterval(() => {
          root.textContent = format(data);
        }, 1000);
      }
    codeLang: js
    options:
      - text: 'Интервал продолжает работать и через замыкание держит `data` и `root` достижимыми'
        correct: true
        why: 'Активный таймер — корень для сборщика. Его колбэк замыкает `data` и `root`, поэтому они не освобождаются, даже если элемент убран из DOM. Нужно сохранить id и вызвать `clearInterval`.'
      - text: 'Сборщик мусора не освобождает данные, загруженные по сети'
        why: 'Происхождение данных не важно: освобождается всё, что стало недостижимым.'
      - text: 'Элемент, удалённый из DOM, освобождается только после перезагрузки страницы'
        why: 'Удалённый элемент освобождается, как только на него не останется ссылок из JS.'
      - text: '`setInterval` не держит ссылок, утечка где-то в другом месте'
        why: 'Таймер держит свой колбэк, а колбэк держит всё своё замыкание.'
    explanation: |
      Таймеры, обработчики событий, подписки (WebSocket, observable, store) — частые источники утечек: они
      хранят ссылку на колбэк, а колбэк через замыкание — на данные и DOM-элементы. Пока подписка активна,
      ничто из этого не освободится, а интервал ещё и тратит процессор. У каждой подписки должна быть
      отписка: `clearInterval`, `removeEventListener`, `unsubscribe`, `abort`. В React для этого служит функция
      очистки, возвращаемая из `useEffect`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Memory_management#release_when_the_memory_is_not_needed_anymore
    source: own

  - id: javascript-memory-003
    level: middle
    tags: [weakmap, metadata]
    question: |
      Нужно хранить метаданные для DOM-элементов (например, время последнего клика), не мешая освобождению
      удалённых элементов. Какую структуру выбрать?
    options:
      - text: '`Map`, где ключ — элемент'
        why: '`Map` держит ключи сильными ссылками: удалённый из DOM элемент останется в памяти, пока запись не удалят вручную.'
      - text: '`WeakMap`, где ключ — элемент'
        correct: true
        why: '`WeakMap` держит ключи слабо: когда на элемент не останется других ссылок, запись исчезнет вместе с ним автоматически.'
      - text: 'Обычный объект, где ключ — `element.id`'
        why: 'Строковые ключи не связаны с жизнью элемента: записи останутся навсегда, а у элементов без id вообще нет ключа.'
      - text: 'Массив пар `[element, data]`'
        why: 'Массив держит элементы сильными ссылками и требует ручной очистки, а поиск в нём медленный.'
    explanation: |
      `WeakMap` и `WeakSet` держат ключи слабыми ссылками: запись не мешает сборщику освободить объект-ключ, и
      тогда она исчезает сама. Поэтому ключами могут быть только объекты (и незарегистрированные символы), а
      сама структура не перебирается и не знает свой размер — иначе результат зависел бы от момента сборки
      мусора. Типичные применения: метаданные для объектов, которыми вы не управляете (DOM-узлы, объекты
      библиотек), кэши вычислений по объекту, приватные данные экземпляров до появления `#`-полей.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/WeakMap
    source: own

  - id: javascript-memory-004
    level: senior
    tags: [weakref, finalization-registry]
    question: |
      Клиент держит сетевое соединение. Его регистрируют в `FinalizationRegistry` с колбэком, который вызывает
      `close()`. Когда закроется соединение?
    options:
      - text: 'Сразу, как только клиент станет недостижим'
        why: 'Момент сборки определяет движок. Колбэк может прийти намного позже или не прийти вовсе.'
      - text: 'Когда-нибудь позже, а возможно, никогда'
        correct: true
        why: 'Спецификация разрешает движку не вызывать колбэк, например при закрытии страницы. Для ресурсов нужен явный `close()` или `using` с `Symbol.dispose`.'
      - text: 'Не раньше, чем исчезнут все `WeakRef` на клиента'
        why: '`WeakRef` не удерживает объект и не управляет моментом сборки. Даже когда слабых ссылок не останется, колбэк не обязан прийти.'
      - text: 'При ближайшей сборке мусора, но точно до закрытия вкладки'
        why: 'Ни ближайшая сборка, ни закрытие вкладки ничего не гарантируют: при выходе со страницы движок вправе вообще не вызывать колбэки.'
    explanation: |
      `WeakRef` и `FinalizationRegistry` (ES2021) дают доступ к деталям сборки мусора: слабую ссылку, которая
      может «опустеть», и уведомление после сборки объекта. Но сборка недетерминирована: движок решает сам, когда
      и что собирать, может отложить колбэк надолго или пропустить его при выходе. Поэтому эти инструменты
      годятся для оптимизаций (кэш, который можно потерять) и диагностики, но не для обязательной логики. Для
      управления ресурсами в язык добавляют явное освобождение: `using` и `Symbol.dispose` (пока
      поддерживается не во всех браузерах). А надёжный способ сегодня — явный вызов `close()`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/FinalizationRegistry#notes_on_cleanup_callbacks
    source: own

  - id: javascript-memory-005
    level: middle
    tags: [detached-dom, leaks, no-run]
    question: |
      Элементы удаляют из списка, но в снимке памяти DevTools копятся `Detached HTMLLIElement`. Почему?
    code: |
      const rendered = [];

      function renderItem(text) {
        const li = document.createElement('li');
        li.textContent = text;
        list.append(li);
        rendered.push(li);
      }

      function clear() {
        list.innerHTML = '';
      }
    codeLang: js
    options:
      - text: 'Элементы убраны из DOM, но массив `rendered` продолжает на них ссылаться'
        correct: true
        why: 'Удаление из документа не освобождает элемент, если на него есть ссылка из JS. Такие узлы называются detached: в документе их нет, а в памяти есть.'
      - text: '`innerHTML = ""` удаляет элементы не сразу, а при следующем кадре'
        why: 'Элементы убираются из DOM сразу. В памяти их держат ссылки из кода.'
      - text: 'Элементы списка освобождаются, только когда удалят родительский `<ul>`'
        why: 'Отдельные элементы освобождаются, как только становятся недостижимыми. Родитель для этого не нужен.'
      - text: 'DevTools показывают удалённые элементы до перезагрузки страницы, это не утечка'
        why: 'Снимок кучи показывает реальные живые объекты. Detached-узлы в нём — признак того, что их что-то удерживает.'
    explanation: |
      Detached DOM-узел — элемент, удалённый из документа, но всё ещё достижимый из JavaScript: через массив,
      кэш, замыкание обработчика, переменную модуля. Он держит в памяти и всё своё поддерево. Поиск в DevTools:
      вкладка Memory, снимок кучи, фильтр `Detached`, а в панели Retainers видна цепочка ссылок, которая
      удерживает узел. Исправление — убирать ссылки при удалении элементов или хранить связь через `WeakMap`
      и `WeakRef`.
    links:
      - https://developer.chrome.com/docs/devtools/memory-problems/heap-snapshots
    source: own

  - id: javascript-memory-006
    level: junior
    tags: [circular-references, gc]
    question: |
      Два объекта ссылаются друг на друга, а снаружи ссылок на них больше нет. Что будет с памятью?
    code: |
      function link() {
        const a = {};
        const b = {};
        a.partner = b;
        b.partner = a;
      }
      link();
    codeLang: js
    options:
      - text: 'Утечка: у каждого объекта осталось по ссылке, и они никогда не освободятся'
        why: 'Так было бы при сборке подсчётом ссылок. Современные движки ищут достижимость от корней, а до этой пары не добраться.'
      - text: 'Оба объекта будут освобождены, ведь они недостижимы от корней'
        correct: true
        why: 'Алгоритм mark-and-sweep не видит пару от глобальных переменных и стека, поэтому собирает её целиком, несмотря на взаимные ссылки.'
      - text: 'Освободится только `a`, потому что он создан первым'
        why: 'Порядок создания не влияет на сборку: оба объекта одинаково недостижимы.'
      - text: 'Объекты освободятся, только если вручную обнулить `partner`'
        why: 'Ручное обнуление не нужно: циклические ссылки сами по себе не удерживают объекты.'
    explanation: |
      Циклические ссылки — классическая проблема сборщиков на подсчёте ссылок: у каждого объекта в цикле счётчик
      никогда не станет нулём. Такими были старые версии Internet Explorer для DOM-объектов, отсюда старые
      советы «обнулять ссылки». Сборщики mark-and-sweep, которые используются во всех современных движках,
      циклов не боятся: важно только, достижим ли цикл от корней. Поэтому бороться стоит со случайной
      достижимостью — глобальными коллекциями, подписками, кэшами, — а не с циклами.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Memory_management#mark-and-sweep_algorithm
    source: own

  - id: javascript-memory-007
    level: middle
    tags: [cache, leaks, lru]
    question: |
      Кэш результатов запросов — обычный объект `const cache = {}`, ключ — URL. Приложение работает
      неделями, и память растёт. Как исправить?
    options:
      - text: 'Ограничить размер кэша или время жизни записей'
        correct: true
        why: 'Кэш без ограничений растёт с каждым новым URL и никогда не очищается. Ограничение размера или TTL держат память под контролем.'
      - text: 'Заменить объект на `WeakMap` с ключами-строками'
        why: 'Ключами `WeakMap` не могут быть строки. И даже со слабыми ключами строковый URL не «умирает», привязать к нему жизнь записи нельзя.'
      - text: 'Перейти на `Map`, он не растёт бесконечно'
        why: '`Map` удобнее объекта, но точно так же хранит записи, пока их не удалят.'
      - text: 'Вызывать сборщик мусора вручную раз в час'
        why: 'Сборщик освобождает только недостижимое, а кэш достижим и нужен. К тому же вызвать его из обычного кода нельзя.'
    explanation: |
      Неограниченные кэши, логи и очереди — тихий источник утечек: каждая запись нужна, но их становится
      бесконечно много. Решения: ограничить число записей и вытеснять давно не использованные (LRU), задавать
      время жизни (TTL), очищать при смене пользователя или страницы. `WeakMap` подходит, только если ключ — объект,
      и запись должна жить, пока жив этот объект. Библиотеки запросов (TanStack Query, RTK Query) именно так
      удаляют неиспользуемые данные из кэша через заданное время.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Memory_management
    source: own

  - id: javascript-memory-008
    level: senior
    tags: [listeners, closures, spa, no-run]
    question: |
      В SPA каждый переход на страницу вызывает `mountChart()`, а уход — `unmountChart()`. После десятка
      переходов график тормозит, а память растёт. В чём ошибка?
    code: |
      function mountChart(container) {
        const chart = new HeavyChart(container);
        window.addEventListener('resize', () => chart.resize());
        return chart;
      }

      function unmountChart(chart) {
        chart.destroy();
      }
    codeLang: js
    options:
      - text: 'Обработчик `resize` на `window` удерживает каждый график'
        correct: true
        why: '`window` живёт всё время работы страницы. Каждый обработчик держит через замыкание свой `chart`, поэтому старые графики не освобождаются и продолжают пересчитываться при каждом `resize`.'
      - text: 'Сборщик просто не успевает: память освободится при следующей сборке'
        why: 'Сборка не поможет: старые графики достижимы через обработчики на `window`, и никакая сборка их не освободит.'
      - text: 'Обработчики на `window` удаляются автоматически при смене маршрута'
        why: 'При навигации в SPA документ не перезагружается, и `window` со всеми обработчиками остаётся тем же.'
      - text: 'Замыкания в V8 удерживают весь стек вызовов `mountChart`'
        why: 'Замыкание удерживает переменные окружения, а не стек вызовов. Здесь проблема конкретно в обработчике, который держит `chart`.'
    explanation: |
      В SPA страница не перезагружается, поэтому глобальные объекты (`window`, `document`, сторы, шины событий)
      живут долго, а подписанные на них обработчики удерживают всё, что замкнули. Каждый «монтаж» без
      симметричного «размонтажа» добавляет утечку и лишнюю работу. Правило: всё, что подписано при монтировании,
      снимается при размонтировании. Удобный способ — `AbortController`: передать `signal` во все
      `addEventListener` и `fetch`, а при уходе вызвать `abort()`. В React это функция очистки `useEffect`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/API/EventTarget/addEventListener#signal
    source: own

  - id: javascript-memory-009
    level: middle
    tags: [devtools, heap-snapshot]
    question: |
      Как в Chrome DevTools найти, какие объекты утекают при повторении действия (например, открытия и закрытия
      модалки)?
    options:
      - text: 'Сравнить два снимка кучи до и после повторов действия'
        correct: true
        why: 'Сравнение показывает, каких объектов стало больше после действия. Если число растёт с каждым повтором, а в панели Retainers видна удерживающая цепочка — это и есть утечка.'
      - text: 'Открыть вкладку Network и посмотреть размер ответов'
        why: 'Network показывает трафик, а не то, что удерживается в памяти JS.'
      - text: 'Посмотреть `performance.memory` один раз после загрузки страницы'
        why: 'Одно значение не показывает рост и не говорит, какие объекты его вызывают.'
      - text: 'Включить Lighthouse и запустить аудит производительности'
        why: 'Lighthouse оценивает загрузку страницы и не ищет утечки памяти при повторяющихся действиях.'
    explanation: |
      Классический приём поиска утечек — сравнение снимков кучи. Снимок 1 → выполнить действие несколько раз
      (открыть и закрыть модалку) → принудительный сбор мусора кнопкой в DevTools → снимок 2. Режим Comparison
      покажет, какие конструкторы прибавили экземпляров. Затем в панели Retainers видно, кто удерживает объект:
      глобальная переменная, обработчик, замыкание. Для динамики полезен ещё Allocation timeline, а вкладка
      Performance monitor показывает рост памяти и числа DOM-узлов в реальном времени.
    links:
      - https://developer.chrome.com/docs/devtools/memory-problems/heap-snapshots
    source: own
