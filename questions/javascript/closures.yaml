questions:
  - id: javascript-closures-001
    level: junior
    tags: [counter, output]
    question: |
      Что выведется в консоль?
    code: |
      function makeCounter() {
        let count = 0;
        return () => ++count;
      }

      const a = makeCounter();
      const b = makeCounter();
      a();
      a();
      console.log(a(), b());
    codeLang: js
    options:
      - text: '`3 4`'
        why: 'Каждый вызов `makeCounter` создаёт новую переменную `count`. Счётчики `a` и `b` не делят состояние.'
      - text: '`3 1`'
        correct: true
        why: '`a` трижды увеличила свою `count`, а `b` замкнула отдельную `count` и вызвана впервые.'
      - text: '`1 1`'
        why: 'Переменная `count` не создаётся заново при каждом вызове `a()`: она живёт в окружении, созданном одним вызовом `makeCounter`.'
      - text: '`2 1`'
        why: 'Префиксный `++count` сначала увеличивает, потом возвращает. Третий вызов `a()` вернёт 3.'
    explanation: |
      Замыкание — функция вместе с лексическим окружением, в котором она создана. Каждый вызов `makeCounter`
      создаёт новое окружение со своей `count`, и возвращённая стрелка держит ссылку именно на него. Поэтому
      счётчики независимы, а состояние сохраняется между вызовами без глобальных переменных. На этом построены
      фабрики функций, приватное состояние в модулях, мемоизация, а в React — хуки, которые замыкают значения
      конкретного рендера.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures
    source: own

  - id: javascript-closures-002
    level: middle
    tags: [loop, var, let, setTimeout, output]
    question: |
      Что выведут два цикла?
    code: |
      for (var i = 0; i < 3; i++) {
        setTimeout(() => console.log('var', i));
      }
      for (let j = 0; j < 3; j++) {
        setTimeout(() => console.log('let', j));
      }
    codeLang: js
    options:
      - text: '`var 0 1 2` и `let 0 1 2`'
        why: 'С `var` переменная одна на весь цикл. К моменту срабатывания таймеров цикл уже закончился, и она равна 3.'
      - text: '`var 3 3 3` и `let 0 1 2`'
        correct: true
        why: 'Все колбэки первого цикла замыкают одну и ту же `i`, которая к их выполнению стала 3. `let` в заголовке цикла создаёт новую переменную на каждую итерацию.'
      - text: '`var 3 3 3` и `let 3 3 3`'
        why: '`let` в цикле `for` даёт каждой итерации свою копию переменной, поэтому колбэки видят разные значения.'
      - text: '`var 2 2 2` и `let 0 1 2`'
        why: 'Цикл завершается, когда условие `i < 3` ложно, то есть при `i === 3`. Последнее значение — 3, а не 2.'
    explanation: |
      Колбэк таймера выполняется после того, как весь синхронный цикл закончился. С `var` переменная одна на
      всю функцию, и все три замыкания смотрят на неё — в момент вызова она равна 3. Для `let` спецификация
      делает особый трюк: на каждой итерации создаётся новая привязка, в которую копируется текущее значение,
      поэтому каждое замыкание видит своё. До ES6 это решали через IIFE: `(function (i) { setTimeout(...) })(i)`
      или третьим аргументом `setTimeout(fn, 0, i)`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures#creating_closures_in_loops_a_common_mistake
    source: own

  - id: javascript-closures-003
    level: senior
    tags: [loop, let, per-iteration-binding, output]
    question: |
      Что выведется в консоль?
    code: |
      const getters = [];
      for (let i = 0; i < 4; i++) {
        getters.push(() => i);
        i++;
      }
      console.log(getters.map((get) => get()));
    codeLang: js
    options:
      - text: '`[ 0, 2 ]`'
        why: 'Замыкание видит переменную, а не её значение в момент `push`. Внутри итерации её успели увеличить.'
      - text: '`[ 1, 3 ]`'
        correct: true
        why: 'Каждая итерация получает свою привязку `i`. Первая начинает с 0, `i++` в теле делает её 1 — это и видит первое замыкание. Следующая итерация копирует 1, шаг цикла делает 2, тело — 3.'
      - text: '`[ 4, 4 ]`'
        why: 'Так было бы с `var`: одна общая переменная. С `let` у каждой итерации своя привязка.'
      - text: '`[ 0, 1, 2, 3 ]`'
        why: '`i++` в теле пропускает каждую вторую итерацию, поэтому функций всего две.'
    explanation: |
      Для `for (let ...)` спецификация создаёт новую привязку на каждую итерацию: в начале итерации значение
      копируется из предыдущей, затем выполняется шаг (`i++` в заголовке) — уже над новой привязкой. Замыкание
      захватывает привязку своей итерации, но не «замораживает» значение: изменения внутри той же итерации
      видны. Поэтому первое замыкание видит 1, а не 0. Задача проверяет, понимаете ли вы, что замыкание держит
      переменную, а не её снимок.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/for#lexical_declarations_in_the_initialization_block
    source: own

  - id: javascript-closures-004
    level: middle
    tags: [live-binding, output]
    question: |
      Что выведется в консоль?
    code: |
      let status = 'loading';
      const getStatus = () => status;
      status = 'ready';

      console.log(getStatus());
    codeLang: js
    options:
      - text: '`loading`'
        why: 'Замыкание не копирует значение в момент создания функции. Оно читает переменную в момент вызова.'
      - text: '`ready`'
        correct: true
        why: 'Функция держит ссылку на саму переменную `status`. К моменту вызова в ней уже `ready`.'
      - text: '`undefined`'
        why: 'Переменная объявлена и инициализирована, функция её видит.'
      - text: '`ReferenceError`'
        why: 'Переменная объявлена выше функции и доступна в её лексическом окружении.'
    explanation: |
      Распространённое заблуждение — что замыкание «запоминает значение». На самом деле оно запоминает
      окружение, то есть сами переменные, и читает их актуальное значение при каждом вызове. Отсюда и польза
      (функция всегда видит свежее состояние), и вред: в React «устаревшее замыкание» (stale closure) возникает,
      когда колбэк держит переменную из старого рендера, а новые значения лежат уже в другой переменной
      нового вызова компонента.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures#lexical_scoping
    source: own

  - id: javascript-closures-005
    level: junior
    tags: [definition]
    question: |
      Что такое замыкание в JavaScript?
    options:
      - text: 'Функция вместе с окружением, в котором она создана'
        correct: true
        why: 'Функция сохраняет ссылку на внешние переменные и может обращаться к ним, даже когда внешняя функция уже завершилась.'
      - text: 'Функция, которая закрывает доступ к глобальным переменным'
        why: 'Замыкание ничего не закрывает: функция по-прежнему видит глобальные переменные и все внешние области.'
      - text: 'Функция, вызванная сразу после объявления'
        why: 'Это IIFE — immediately invoked function expression. Она часто использует замыкания, но это разные понятия.'
      - text: 'Функция, которая не принимает аргументов'
        why: 'Количество аргументов не связано с замыканием. Любая функция в JS — замыкание над своим окружением.'
    explanation: |
      Каждая функция при создании запоминает ссылку на лексическое окружение — переменные областей, внутри
      которых она объявлена. Когда функцию вызывают, поиск переменных идёт по этой цепочке. Поэтому функция,
      возвращённая из другой функции, продолжает видеть её локальные переменные: окружение живёт, пока на него
      есть ссылка. Технически замыканиями являются все функции в JS, но обычно так называют случаи, когда
      функция использует переменные внешней функции, уже завершившей работу.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures
    source: own

  - id: javascript-closures-006
    level: middle
    tags: [private-state, module-pattern]
    question: |
      Как сделать, чтобы баланс нельзя было изменить снаружи иначе, чем через `deposit`?
    code: |
      function createWallet() {
        let balance = 0;
        return {
          deposit(amount) { balance += amount; },
          getBalance() { return balance; },
        };
      }
    codeLang: js
    options:
      - text: 'Ничего не нужно, `balance` и так виден только замыканиям'
        correct: true
        why: 'Снаружи нет способа добраться до `balance`: она не свойство объекта, а переменная окружения. Изменить её могут только функции, которые её замыкают.'
      - text: 'Нужно объявить `balance` через `const`, иначе его можно поменять снаружи'
        why: 'С `const` баланс вообще нельзя будет изменить, даже из `deposit`. Защита от внешнего доступа даёт не `const`, а область видимости.'
      - text: 'Нужно вызвать `Object.freeze` для возвращаемого объекта'
        why: '`freeze` запретит подменять методы объекта, но к приватности `balance` он отношения не имеет — она уже обеспечена замыканием.'
      - text: 'Нужно добавить `balance` в объект как свойство с `_`, например `_balance`'
        why: 'Подчёркивание — только соглашение. Свойство `_balance` любой может прочитать и изменить снаружи.'
    explanation: |
      До появления приватных полей класса (`#balance`) замыкания были основным способом прятать данные.
      Переменная внутри фабрики видна только функциям, созданным в ней же, и сохраняется, пока жив
      возвращённый объект. Так устроен паттерн «модуль» на IIFE и многие библиотеки. Замыкание даёт
      настоящую приватность: в отличие от соглашений вроде `_balance`, добраться до переменной извне
      средствами языка невозможно (DevTools показывают её в `[[Scopes]]`, но код — нет).
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures#emulating_private_methods_with_closures
    source: own

  - id: javascript-closures-007
    level: senior
    tags: [memory, shared-context, v8]
    question: |
      В V8 (Chrome, Node) удержит ли возвращённая функция большой массив `big` в памяти?
    code: |
      function setup() {
        const big = new Array(1_000_000).fill('x');
        const unused = () => big.length;
        const small = 'ok';
        return () => small;
      }

      const keep = setup();
    codeLang: js
    options:
      - text: 'Нет: возвращённая функция использует только `small`, а движок хранит лишь нужные переменные'
        why: 'Оптимизация действительно есть, но V8 создаёт один общий объект окружения на все замыкания функции. `unused` ссылается на `big`, поэтому `big` попадает в общий контекст.'
      - text: 'Да: все замыкания `setup` делят один объект контекста, а в нём лежит `big`, нужная функции `unused`'
        correct: true
        why: 'Хоть `unused` и не возвращается, она заставила положить `big` в общий контекст. Возвращённая функция держит этот контекст целиком, и массив не освобождается.'
      - text: 'Нет: `big` объявлен через `const`, а константы сборщик мусора удаляет сразу после выхода из функции'
        why: '`const` никак не влияет на сборку мусора. Значение живёт, пока до него можно дотянуться по ссылкам.'
      - text: 'Да, но только пока функция `unused` где-то вызывается'
        why: '`unused` вообще не вызывается и не возвращается. Дело в общем контексте, на который ссылается `keep`.'
    explanation: |
      Формально замыкание держит всё лексическое окружение, но движки оптимизируют это: в объект контекста
      попадают только переменные, которые используют вложенные функции. В V8 такой объект один на вызов
      внешней функции и общий для всех её замыканий. Если хоть одно из них использует большую переменную, её
      удержит любое другое замыкание из того же вызова. Так возникла знаменитая утечка в Meteor. Защита —
      не держать долгоживущие замыкания рядом с тяжёлыми данными или объявить переменную через `let` и обнулить
      ссылку (`big = null`) после использования.
    links:
      - https://blog.meteor.com/an-interesting-kind-of-javascript-memory-leak-8b47d2e7f156
    source: own

  - id: javascript-closures-008
    level: middle
    tags: [debounce]
    question: |
      Почему этот debounce не работает — функция всё равно вызывается на каждое событие?
    code: |
      function debounce(fn, ms) {
        return (...args) => {
          let timer;
          clearTimeout(timer);
          timer = setTimeout(() => fn(...args), ms);
        };
      }
    codeLang: js
    options:
      - text: 'Переменная `timer` создаётся заново при каждом вызове'
        correct: true
        why: '`timer` должен жить в окружении `debounce`, общем для всех вызовов возвращённой функции. Тогда каждый вызов отменяет предыдущий таймер.'
      - text: 'Нужно использовать `setInterval` вместо `setTimeout`'
        why: '`setInterval` вызывал бы функцию повторно. Debounce строится как раз на отменяемом одноразовом таймере.'
      - text: 'Стрелочная функция теряет `args`, нужен `arguments`'
        why: 'Rest-параметр `...args` работает в стрелках и корректно передаёт аргументы. Проблема в месте объявления `timer`.'
      - text: '`clearTimeout` нужно вызывать после `setTimeout`, а не до'
        why: 'Тогда новый таймер отменялся бы сразу после создания, и функция не вызывалась бы вовсе.'
    explanation: |
      Debounce откладывает вызов, пока события продолжают поступать: каждый новый вызов отменяет запланированный
      и ставит новый таймер. Для этого идентификатор таймера должен переживать отдельные вызовы, то есть лежать
      в замыкании внешней функции `debounce`. Объявленный внутри возвращаемой функции, он каждый раз новый и
      пустой. Правильная версия: `let timer;` перед `return`. Тот же принцип — состояние живёт во внешней
      области — лежит в основе throttle, memoize и `once`.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/Debounce
    source: own

  - id: javascript-closures-009
    level: middle
    tags: [currying, output]
    question: |
      Что выведется в консоль?
    code: |
      const add = (a) => (b) => (c) => a + b + c;

      const addFive = add(2)(3);
      console.log(addFive(10), add(1)(1)(1));
    codeLang: js
    options:
      - text: '`15 3`'
        correct: true
        why: '`add(2)(3)` возвращает функцию, которая замыкает `a = 2` и `b = 3`. Вызов с 10 даёт 15. Второе выражение — 1 + 1 + 1.'
      - text: '`10 3`'
        why: 'Функция `addFive` помнит переданные раньше 2 и 3 и прибавляет их к 10.'
      - text: '`NaN 3`'
        why: 'Все три аргумента определены к моменту сложения, поэтому `NaN` не получится.'
      - text: '`TypeError`: `add(2)(3)` — не функция'
        why: '`add(2)(3)` возвращает третью стрелку `(c) => ...`, то есть функцию.'
    explanation: |
      Каррирование превращает функцию от нескольких аргументов в цепочку функций от одного. Каждая
      промежуточная функция замыкает уже переданные значения. Это удобно для частичного применения:
      `const addFive = add(2)(3)` — специализированная функция, готовая к переиспользованию. Тот же эффект без
      каррирования даёт `fn.bind(null, 2, 3)`. Каррирование активно используется в функциональных
      библиотеках (Ramda, lodash/fp) и в селекторах и middleware Redux.
    links:
      - https://javascript.info/currying-partials
    source: own

  - id: javascript-closures-010
    level: middle
    tags: [throttle, debounce]
    question: |
      Пользователь непрерывно прокручивает страницу 3 секунды. Чем будет отличаться поведение обработчика,
      обёрнутого в `throttle(fn, 1000)`, от обёрнутого в `debounce(fn, 1000)`?
    options:
      - text: 'Throttle — раз в секунду во время прокрутки, debounce — раз после неё'
        correct: true
        why: 'Throttle ограничивает частоту: не чаще раза за интервал. Debounce ждёт паузы: каждое событие откладывает вызов, пока поток событий не затихнет.'
      - text: 'Оба вызовут обработчик ровно три раза — по одному на каждую секунду'
        why: 'Примерно так ведёт себя throttle, точное число вызовов зависит от реализации (leading/trailing). Debounce во время непрерывных событий не вызывает обработчик вовсе.'
      - text: 'Throttle вызовет один раз после окончания прокрутки, debounce — раз в секунду'
        why: 'Ровно наоборот: ожидание паузы — это debounce, ограничение частоты — throttle.'
      - text: 'Оба ни разу не вызовут обработчик, пока прокрутка идёт дольше интервала'
        why: 'Throttle вызывает обработчик и во время непрерывных событий — не чаще интервала.'
    explanation: |
      Оба приёма ограничивают частые события, но по-разному. Throttle пропускает вызовы, если с прошлого прошло
      меньше интервала, — подходит для прокрутки, изменения размера окна, отслеживания мыши, где нужна
      регулярная реакция во время действия. Debounce откладывает вызов, пока события продолжаются, — подходит
      для поиска при вводе и автосохранения, где важен итоговый результат. Обе функции держат состояние в
      замыкании: debounce — id таймера, throttle — время последнего вызова или флаг ожидания. Для анимаций
      вместо throttle часто берут `requestAnimationFrame`.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/Throttle
      - https://developer.mozilla.org/en-US/docs/Glossary/Debounce
    source: own
