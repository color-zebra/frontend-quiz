questions:
  - id: javascript-scope-001
    level: junior
    tags: [var, hoisting, output]
    question: |
      Что выведется в консоль?
    code: |
      console.log(total);
      var total = 5;
    codeLang: js
    options:
      - text: '`5`'
        why: 'Поднимается только объявление переменной, но не присваивание. Значение 5 появится, когда выполнится вторая строка.'
      - text: '`undefined`'
        correct: true
        why: 'Объявление `var total` поднимается в начало области видимости и инициализируется значением `undefined`. Присваивание остаётся на своём месте.'
      - text: '`ReferenceError`'
        why: 'Ошибка была бы для `let` и `const` или для необъявленной переменной. `var` к моменту чтения уже существует.'
      - text: '`null`'
        why: 'Неинициализированные переменные в JavaScript равны `undefined`, а не `null`.'
    explanation: |
      Перед выполнением кода движок проходит по области видимости и регистрирует все объявления. Это называют
      hoisting (поднятием). Переменные `var` сразу получают значение `undefined`, поэтому их можно читать
      до строки объявления. Код ведёт себя так, будто написано `var total; console.log(total); total = 5;`.
      Это источник тихих багов, поэтому в современном коде используют `let` и `const`: их тоже регистрируют
      заранее, но читать до объявления нельзя.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/Hoisting
    source: own

  - id: javascript-scope-002
    level: middle
    tags: [let, tdz, output]
    question: |
      Что выведется в консоль?
    code: |
      console.log(limit);
      let limit = 10;
    codeLang: js
    options:
      - text: '`10`'
        why: 'Строка с присваиванием ещё не выполнилась, значение 10 взяться неоткуда.'
      - text: '`undefined`'
        why: 'Так ведёт себя `var`. У `let` до объявления нет даже значения `undefined`.'
      - text: '`ReferenceError`'
        correct: true
        why: 'Переменная `let` уже существует, но находится во временной мёртвой зоне до строки объявления. Обращение к ней бросает `ReferenceError: Cannot access before initialization`.'
      - text: '`null`'
        why: 'Ни `let`, ни `var` не получают `null` автоматически.'
    explanation: |
      `let`, `const` и `class` тоже регистрируются при входе в область видимости (поэтому формально они
      «поднимаются»), но не инициализируются. Промежуток от начала блока до строки объявления называется
      временной мёртвой зоной (temporal dead zone, TDZ): любое обращение к переменной в нём — ошибка. Это
      специально сделанное поведение, чтобы раннее чтение переменной было явной ошибкой, а не тихим
      `undefined`, как у `var`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let#temporal_dead_zone_tdz
    source: own

  - id: javascript-scope-003
    level: senior
    tags: [tdz, shadowing, block-scope, output]
    question: |
      Что выведется в консоль?
    code: |
      let level = 'outer';
      {
        console.log(level);
        let level = 'inner';
      }
    codeLang: js
    options:
      - text: '`outer`'
        why: 'Внутренняя переменная уже существует с начала блока и затеняет внешнюю. До объявления к ней обращаться нельзя.'
      - text: '`inner`'
        why: 'Присваивание `inner` ещё не выполнилось, и значения у внутренней переменной пока нет.'
      - text: '`undefined`'
        why: '`undefined` до объявления даёт только `var`. Переменная `let` в TDZ не имеет никакого значения.'
      - text: '`ReferenceError`'
        correct: true
        why: '`let level` во внутреннем блоке регистрируется при входе в блок и затеняет внешнюю. На первой строке блока она ещё в TDZ, и чтение бросает ошибку.'
    explanation: |
      Затенение (shadowing) действует на весь блок, а не с места объявления. Как только в блоке есть `let level`,
      имя `level` внутри блока относится к внутренней переменной от первой до последней строки. Внешняя
      недоступна даже до строки объявления, а внутренняя ещё не инициализирована — получается TDZ. Если бы
      внутри был `var`, это вызвало бы синтаксическую ошибку повторного объявления на уровне функции, а без
      внутреннего объявления вывелось бы `outer`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let#temporal_dead_zone_tdz
    source: own

  - id: javascript-scope-004
    level: middle
    tags: [function-declaration, function-expression, hoisting, output]
    question: |
      Что выведется в консоль?
    code: |
      console.log(typeof declared, typeof expressed);

      function declared() {}
      var expressed = function () {};
    codeLang: js
    options:
      - text: '`function function`'
        why: 'Function expression присваивается переменной во время выполнения. До этой строки `expressed` — просто `var` со значением `undefined`.'
      - text: '`function undefined`'
        correct: true
        why: 'Function declaration поднимается целиком, вместе с телом. У `var expressed` поднимается только объявление, а функция будет присвоена позже.'
      - text: '`undefined undefined`'
        why: 'Объявление функции `function declared() {}` доступно во всей области видимости, даже до своей строки.'
      - text: '`ReferenceError`'
        why: '`typeof` не бросает ошибок для переменных `var` и необъявленных имён. Обе переменные к тому же объявлены.'
    explanation: |
      Function declaration (`function name() {}` как отдельная инструкция) поднимается полностью: её можно
      вызывать выше по коду. Function expression (`const f = function () {}` или стрелка) — это значение,
      которое присваивается при выполнении строки. С `var` до этого переменная равна `undefined`, с
      `let`/`const` — находится в TDZ. Поэтому вызов `expressed()` до присваивания даст `TypeError: expressed is
      not a function`, а для `const` — `ReferenceError`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/function#function_declaration_hoisting
    source: own

  - id: javascript-scope-005
    level: senior
    tags: [typeof, tdz, output]
    question: |
      Что выведется в консоль?
    code: |
      console.log(typeof notDeclaredAnywhere);
      console.log(typeof declaredLater);
      let declaredLater = 1;
    codeLang: js
    options:
      - text: '`undefined`, `undefined`'
        why: 'Для необъявленного имени `typeof` действительно безопасен, но переменная в TDZ — особый случай.'
      - text: '`undefined`, затем `ReferenceError`'
        correct: true
        why: '`typeof` у несуществующего имени возвращает `"undefined"`. Но `declaredLater` существует и находится в TDZ, и даже `typeof` к ней обращаться нельзя.'
      - text: '`ReferenceError` на первой строке'
        why: '`typeof` не бросает ошибку для необъявленных идентификаторов — на этом основаны проверки вроде `typeof window === "undefined"`.'
      - text: '`undefined`, `number`'
        why: 'Присваивание ещё не произошло, а обращение к переменной в TDZ — ошибка, а не `"number"`.'
    explanation: |
      `typeof` исторически безопасен для любых имён: `typeof window === 'undefined'` — классическая проверка
      окружения. Но с появлением `let` и `const` у этого правила есть исключение: если переменная объявлена
      в текущей области, но строка объявления ещё не выполнена, `typeof` бросает `ReferenceError`, как и любое
      другое обращение. Так TDZ защищает от использования переменной раньше времени.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/typeof#interaction_with_undeclared_and_uninitialized_variables
    source: own

  - id: javascript-scope-006
    level: junior
    tags: [block-scope, var, let, output]
    question: |
      Что выведется в консоль?
    code: |
      if (true) {
        var a = 1;
        let b = 2;
      }
      console.log(a, typeof b);
    codeLang: js
    options:
      - text: '`1 number`'
        why: '`let` ограничен блоком `if`: снаружи переменной `b` нет.'
      - text: '`1 undefined`'
        correct: true
        why: '`var` не знает о блоках и видна во всей функции или скрипте. `let` видна только внутри фигурных скобок, снаружи `typeof b` даёт `"undefined"`.'
      - text: '`undefined undefined`'
        why: '`var a` объявлена в блоке, но блок для неё не граница: после выполнения `if` она равна 1.'
      - text: '`ReferenceError`'
        why: 'К `a` обращаться можно, а снаружи блока `b` просто не существует — `typeof` для такого имени ошибку не бросает.'
    explanation: |
      У `var` функциональная область видимости: границей служит только функция (или весь скрипт). Блоки `if`,
      `for`, `{}` для неё прозрачны. `let` и `const` ограничены ближайшим блоком в фигурных скобках. Поэтому
      `let` в цикле не «утекает» наружу, а переменная `var` внутри `if` видна во всей функции. Это одна из
      главных причин, почему `var` в современном коде не используют.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/var#description
    source: own

  - id: javascript-scope-007
    level: junior
    tags: [const, immutability]
    question: |
      Какая из строк вызовет ошибку?
    code: |
      const settings = { theme: 'dark' };
      settings.theme = 'light';   // 1
      settings.lang = 'ru';       // 2
      delete settings.lang;       // 3
      settings = {};              // 4
    codeLang: js
    options:
      - text: 'Строка 1 — нельзя менять свойства константы'
        why: '`const` запрещает переприсвоить переменную, но объект, на который она указывает, остаётся изменяемым.'
      - text: 'Строка 2 — нельзя добавлять новые свойства'
        why: 'Добавлять свойства можно. Запретить это может `Object.freeze` или `Object.preventExtensions`, но не `const`.'
      - text: 'Строка 3 — нельзя удалять свойства'
        why: 'Удалять свойства тоже можно, если объект не заморожен и не запечатан.'
      - text: 'Строка 4 — нельзя переприсвоить константу'
        correct: true
        why: '`const` фиксирует связь имени со значением. Новый объект присвоить нельзя: `TypeError: Assignment to constant variable`.'
    explanation: |
      `const` защищает переменную, а не значение. Переменная навсегда указывает на один и тот же объект, но
      сам объект можно менять: свойства, элементы массива. Для неизменяемости значения нужен `Object.freeze`
      (поверхностно, вложенные объекты остаются изменяемыми) или неизменяемые структуры данных. В
      TypeScript для этого есть `readonly` и `as const`, но это проверка компилятора, а не рантайма.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/const
    source: own

  - id: javascript-scope-008
    level: senior
    tags: [global-object, var, let, output]
    question: |
      Что выведется в консоль, если код выполняется как обычный скрипт на верхнем уровне?
    code: |
      var fromVar = 1;
      let fromLet = 2;

      console.log(globalThis.fromVar, globalThis.fromLet);
    codeLang: js
    options:
      - text: '`1 2`'
        why: 'Глобальные `let` и `const` не становятся свойствами глобального объекта.'
      - text: '`1 undefined`'
        correct: true
        why: 'Глобальный `var` создаёт свойство глобального объекта (`window` в браузере). Глобальные `let` и `const` живут в отдельной декларативной области и в `window` не попадают.'
      - text: '`undefined undefined`'
        why: 'Это было бы верно в ES-модуле, где у каждого модуля своя область видимости. В обычном скрипте `var` попадает в глобальный объект.'
      - text: '`undefined 2`'
        why: 'Ровно наоборот: свойством глобального объекта становится именно `var`.'
    explanation: |
      В глобальной области обычного скрипта `var` и function declaration становятся свойствами глобального
      объекта. Отсюда коллизии: `var name = 1` в браузере перезапишет `window.name`, а скрипты на одной
      странице мешают друг другу. `let`, `const` и `class` на верхнем уровне тоже глобальные — видны во
      всех скриптах страницы, — но хранятся отдельно и в `window` не попадают. В модулях (`type="module"`) у
      каждого файла своя область, и ни одно объявление не становится глобальным свойством.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let#description
    source: own

  - id: javascript-scope-009
    level: senior
    tags: [hoisting, function-declaration, var, output]
    question: |
      Что выведется в консоль?
    code: |
      var item = 1;
      function item() {}

      console.log(typeof item);
    codeLang: js
    options:
      - text: '`function`'
        why: 'Function declaration действительно инициализируется раньше, но строка `var item = 1` выполняется после и перезаписывает значение.'
      - text: '`number`'
        correct: true
        why: 'При поднятии имя `item` получает функцию. Затем при выполнении кода срабатывает присваивание `item = 1`, и переменная становится числом.'
      - text: '`undefined`'
        why: 'Ни одно из двух объявлений не оставляет переменную в значении `undefined` к моменту `console.log`.'
      - text: '`SyntaxError` из-за повторного объявления'
        why: 'Для `var` и функций повторное объявление разрешено. Ошибка была бы, если бы одно из объявлений было через `let` или `const`.'
    explanation: |
      При поднятии function declaration сразу получает значение-функцию, а `var` с тем же именем не мешает:
      повторное объявление `var` ничего не сбрасывает. Но присваивание `= 1` остаётся на своём месте и
      выполняется в обычном порядке, перезаписывая функцию. Без присваивания (`var item;`) переменная
      осталась бы функцией. С `let item = 1` код вообще не запустился бы: повторное объявление имени,
      уже занятого функцией, — синтаксическая ошибка.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/function#hoisting
    source: own

  - id: javascript-scope-010
    level: middle
    tags: [hoisting, shadowing, output]
    question: |
      Что выведется в консоль?
    code: |
      var label = 'global';

      function show() {
        console.log(label);
        var label = 'local';
      }

      show();
    codeLang: js
    options:
      - text: '`global`'
        why: 'Внутри функции есть своё объявление `var label`. Оно поднимается в начало функции и затеняет глобальное.'
      - text: '`local`'
        why: 'Присваивание `local` выполняется после `console.log`, к этому моменту значение ещё не записано.'
      - text: '`undefined`'
        correct: true
        why: 'Локальная `var label` поднимается в начало функции со значением `undefined` и затеняет глобальную. На момент `console.log` присваивание ещё не выполнено.'
      - text: '`ReferenceError`'
        why: 'Для `var` обращения до объявления допустимы и дают `undefined`. Ошибка была бы для `let`.'
    explanation: |
      Поднятие работает в каждой функции отдельно: все `var`, объявленные где угодно в теле, существуют с
      первой строки функции и равны `undefined`. Поэтому локальная переменная затеняет глобальную с тем же
      именем по всей функции, даже выше своей строки. Классический вопрос с собеседований и реальный
      источник ошибок в старом коде. С `let label` вместо `var` вывод сменился бы на `ReferenceError` — ошибка
      стала бы явной.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/Hoisting
    source: own

  - id: javascript-scope-011
    level: middle
    tags: [implicit-global, strict-mode, output]
    question: |
      Что выведется в консоль?
    code: |
      function sloppy() {
        counter = 5;
      }
      function strict() {
        'use strict';
        total = 5;
      }

      sloppy();
      console.log(counter);
      try {
        strict();
      } catch (error) {
        console.log(error.constructor.name);
      }
    codeLang: js
    options:
      - text: '`ReferenceError`, `ReferenceError`'
        why: 'В нестрогом режиме присваивание необъявленной переменной не бросает ошибку, а молча создаёт глобальную.'
      - text: '`5`, `ReferenceError`'
        correct: true
        why: 'Нестрогая функция создала глобальную переменную `counter`. В строгом режиме присваивание необъявленному имени запрещено и бросает `ReferenceError`.'
      - text: '`5`, затем ничего'
        why: 'Строгий режим не пропускает присваивание необъявленной переменной молча, он бросает исключение.'
      - text: '`undefined`, `ReferenceError`'
        why: 'Присваивание в нестрогом режиме создаёт переменную со значением 5, а не `undefined`.'
    explanation: |
      Присваивание необъявленному имени в нестрогом режиме создаёт свойство глобального объекта. Достаточно
      опечатки (`totla = 5`) или забытого `let`, и функция тихо засоряет глобальную область, а ошибка
      проявится где-то далеко. Строгий режим превращает это в `ReferenceError`. Модули, классы и код,
      собранный современными сборщиками, работают в строгом режиме, поэтому сегодня ловушка встречается в
      основном в старых скриптах.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Strict_mode#assigning_to_undeclared_variables
    source: own

  - id: javascript-scope-012
    level: junior
    tags: [scope, block-scope, module-scope, theory]
    question: |
      Какие из утверждений об областях видимости в JavaScript верны?
    options:
      - text: 'Блок в фигурных скобках создаёт область видимости для `let` и `const`'
        correct: true
        why: 'Переменная `let` или `const`, объявленная внутри `if`, `for` или просто `{ }`, снаружи блока не существует.'
      - text: 'У каждого ES-модуля своя область, его переменные не становятся глобальными'
        correct: true
        why: 'Верхний уровень модуля — отдельная область видимости. Наружу попадает только то, что модуль экспортирует.'
      - text: 'Вложенная функция видит переменные внешней, а внешняя её переменные не видит'
        correct: true
        why: 'Поиск имени идёт изнутри наружу: от текущей области к внешним и до глобальной. В обратную сторону поиска нет.'
      - text: 'Блок `if` создаёт отдельную область видимости и для переменных `var`'
        why: 'Для `var` границей служит только функция или весь скрипт. Переменная `var` из блока видна во всей функции.'
      - text: 'Фигурные скобки объектного литерала создают свою область видимости'
        why: 'Литерал объекта — выражение, а не блок кода. Поэтому стрелка, объявленная в литерале, берёт `this` и переменные из окружающего кода.'
      - text: 'Глобальные переменные обычного скрипта видны только в своём файле'
        why: 'Все обычные скрипты страницы делят одну глобальную область: `let` из первого `<script>` видна во втором. Изоляцию по файлам дают модули.'
    explanation: |
      Область видимости (scope) — часть программы, где доступно объявленное имя. В JavaScript их четыре вида:
      глобальная (общая для всех обычных скриптов страницы), модульная (своя у каждого ES-модуля), область
      функции и область блока. `var` подчиняется только функциям, а `let`, `const` и `class` — ещё и блокам.
      Области вложены друг в друга, и имя ищется от текущей наружу — до глобальной. Если не нашлось нигде,
      получается `ReferenceError`.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/Scope
    source: own

  - id: javascript-scope-013
    level: middle
    tags: [hoisting, function-declaration, let, theory]
    question: |
      Какие из утверждений о поднятии (hoisting) верны?
    options:
      - text: 'Function declaration можно вызвать до её строки, тело уже доступно'
        correct: true
        why: 'При входе в область function declaration сразу получает значение-функцию. Поэтому вспомогательные функции можно объявлять ниже места вызова.'
      - text: '`let` и `const` регистрируются заранее, но до объявления недоступны'
        correct: true
        why: 'Имя занято с начала блока, поэтому затеняет внешнюю переменную. Но до строки объявления переменная в TDZ, и обращение даёт `ReferenceError`.'
      - text: 'Переменная `var` до своей строки уже существует и равна `undefined`'
        correct: true
        why: 'Объявление `var` инициализируется значением `undefined` при входе в функцию. Присваивание выполнится на своей строке.'
      - text: 'Вместе с `var` поднимается и присваивание, `var x = 5` даёт 5 заранее'
        why: 'Поднимается только объявление. До строки `var x = 5` значение `x` — `undefined`.'
      - text: 'Function expression, присвоенная `var`, до своей строки равна `undefined`'
        correct: true
        why: 'Поднимается только переменная, а функция присваивается на своей строке. Поэтому вызов выше по коду даёт `TypeError: ... is not a function`.'
      - text: 'Объявления классов поднимаются так же, как function declaration'
        why: 'Классы ведут себя как `let`: имя зарегистрировано, но до строки объявления класс в TDZ.'
    explanation: |
      Перед выполнением функции или скрипта движок проходит по всем объявлениям и создаёт для них привязки. Это
      и называют поднятием: код при этом никуда не переносится. Различается только то, что лежит в привязке до
      строки объявления. Function declaration — уже готовая функция. `var` — `undefined`. `let`, `const` и `class`
      — ничего: привязка не инициализирована, и это временная мёртвая зона. Function expression подчиняется
      правилам той переменной, которой её присвоили.
    links:
      - https://developer.mozilla.org/en-US/docs/Glossary/Hoisting
    source: own

  - id: javascript-scope-014
    level: middle
    tags: [tdz, let, theory]
    question: |
      Где начинается и где заканчивается временная мёртвая зона (TDZ) переменной `let`?
    options:
      - text: 'С входа в блок и до момента, когда выполнится строка объявления'
        correct: true
        why: 'TDZ временная, а не пространственная: важно, выполнилось ли объявление, а не где стоит код. Функция, написанная выше `let`, читает переменную без ошибки, если её вызвали после строки объявления.'
      - text: 'Со строки объявления и до конца блока, где объявлена переменная'
        why: 'Наоборот, после строки объявления переменная доступна. Мёртвая зона — участок до объявления.'
      - text: 'С начала файла и до первого присваивания переменной значения'
        why: 'TDZ закрывает само объявление, даже без значения: после `let x;` переменная уже доступна и равна `undefined`.'
      - text: 'Только внутри циклов и условий, где переменная объявлена'
        why: 'TDZ есть у любого `let`, `const` и `class` в любом блоке, включая тело функции и верхний уровень скрипта.'
    explanation: |
      При входе в блок привязка `let` создаётся, но остаётся неинициализированной. Любое чтение, запись или
      даже `typeof` в этот период бросает `ReferenceError`. Инициализация происходит, когда выполнение доходит
      до строки объявления. Поэтому TDZ — про время: вызов функции, которая читает переменную, упадёт до строки
      `let` и сработает после неё, хотя текст функции не меняется. Смысл TDZ — превратить раннее обращение к
      переменной в явную ошибку вместо тихого `undefined`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let#temporal_dead_zone_tdz
    source: own

  - id: javascript-scope-015
    level: junior
    tags: [var, let, const, theory]
    question: |
      Какие из утверждений о различиях `var`, `let` и `const` верны?
    options:
      - text: 'Объявить `const` без значения нельзя, а `let` и `var` можно'
        correct: true
        why: '`const x;` — `SyntaxError`: значение константы задаётся сразу и навсегда. `let x;` и `var x;` создают переменную со значением `undefined`.'
      - text: 'Повторное объявление `var` в той же области допустимо, а `let` нет'
        correct: true
        why: '`var x; var x;` работает молча, а повторный `let` в той же области — `SyntaxError` ещё до запуска кода.'
      - text: 'Глобальная `var` в обычном скрипте становится свойством `window`'
        correct: true
        why: 'Глобальные `let` и `const` тоже видны всем скриптам страницы, но хранятся отдельно и в `window` не попадают.'
      - text: 'Свойства объекта, объявленного через `const`, менять нельзя'
        why: '`const` запрещает только переприсвоить переменную. Объект под ней изменяемый: `settings.theme = "dark"` работает.'
      - text: '`const` нельзя использовать в заголовке цикла `for...of`'
        why: 'Можно и даже принято: `for (const item of items)` создаёт новую константу на каждую итерацию. Нельзя только `const` в классическом `for (const i = 0; ...; i++)`, где счётчик меняется.'
      - text: 'Переменную `let` можно объявить только внутри функции или блока'
        why: '`let` работает на любом уровне, включая верхний уровень скрипта и модуля.'
    explanation: |
      `var` — старый способ: область функции, поднятие со значением `undefined`, допустимое повторное
      объявление, свойство глобального объекта. `let` и `const` появились в ES2015 и исправляют эти проблемы:
      блочная область, TDZ, запрет повторного объявления. Разница между ними в том, что `const` нельзя
      переприсвоить, поэтому значение обязательно при объявлении. Но `const` фиксирует переменную, а не значение —
      объект под `const` можно менять. Современный стиль: `const` по умолчанию, `let`, если переменную
      переприсваивают, `var` — никогда.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let#description
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/const
    source: own

  - id: javascript-scope-016
    level: middle
    tags: [lexical-scope, theory]
    question: |
      Функция объявлена в одном месте программы, а вызывается в другом. Где она ищет внешние переменные?
    options:
      - text: 'В областях, окружающих место, где функция объявлена'
        correct: true
        why: 'Это лексическая (статическая) область видимости: набор доступных переменных определяется текстом программы. Если в месте вызова есть переменная с тем же именем, функция её не увидит.'
      - text: 'В областях, окружающих место, где функция вызвана'
        why: 'Так работает динамическая область видимости, как в Bash. В JavaScript её нет, по месту вызова определяется только `this`.'
      - text: 'Сначала в месте вызова, а если не нашлось, в месте объявления'
        why: 'Место вызова для поиска переменных не используется вообще, смешанной схемы нет.'
      - text: 'Только в глобальной области и в своих параметрах'
        why: 'Функция видит все области, внутри которых объявлена, — именно на этом построены замыкания.'
    explanation: |
      JavaScript использует лексическую область видимости: при создании функция запоминает окружение, в котором
      написана, и при любом вызове ищет переменные по этой цепочке. Поэтому функция `show`, объявленная на
      верхнем уровне, при вызове изнутри другой функции не видит её локальных переменных. Это делает код
      предсказуемым: чтобы понять, откуда берётся переменная, достаточно посмотреть на текст. Путаница
      обычно возникает из-за `this`: он, в отличие от переменных, у обычных функций определяется вызовом.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures#lexical_scoping
    source: own

  - id: javascript-scope-017
    level: senior
    tags: [default-parameters, tdz, theory]
    question: |
      Почему вызов `f()` бросает `ReferenceError`?
    code: |
      function f(a = b, b = 1) {
        return a;
      }
    codeLang: js
    options:
      - text: 'Параметры инициализируются слева направо, и `b` ещё в TDZ'
        correct: true
        why: 'У параметров со значениями по умолчанию своя область, и каждый ведёт себя как `let`. Когда вычисляется значение `a`, параметр `b` уже существует, но ещё не инициализирован.'
      - text: 'Значение по умолчанию не может ссылаться на другие параметры'
        why: 'Может, если параметр стоит левее: `function g(a = 1, b = a)` работает и даёт `b === 1`.'
      - text: 'Значения по умолчанию вычисляются в глобальной области, где `b` нет'
        why: 'Они вычисляются при каждом вызове в области параметров функции и видят параметры левее и внешние переменные.'
      - text: 'Значения по умолчанию вычисляются один раз при объявлении функции'
        why: 'Они вычисляются при каждом вызове, когда аргумент не передан или равен `undefined`. Поэтому `list = []` даёт новый массив на каждый вызов.'
    explanation: |
      Если у функции есть значения по умолчанию, параметры получают отдельную область видимости и
      инициализируются по порядку, слева направо. Пока очередь не дошла до параметра, он в TDZ, как переменная
      `let`. Поэтому ссылаться можно только на параметры левее. Значения по умолчанию вычисляются при каждом
      вызове заново — в отличие от Python, где изменяемое значение по умолчанию одно на все вызовы.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/Default_parameters#earlier_parameters_are_available_to_later_default_parameters
    source: own
