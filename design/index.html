<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frontend Quiz — варианты дизайна</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap"
    />
    <link rel="stylesheet" href="base.css" />
    <link id="theme" rel="stylesheet" href="theme-aurora.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-head">
        <h1>Frontend Quiz — варианты дизайна</h1>
        <p>Разметка одна и та же, меняется только стиль. Экраны внутри телефонов прокручиваются.</p>
      </header>

      <nav class="switcher" aria-label="Варианты">
        <button type="button" data-theme="aurora" class="is-on">A. Аврора</button>
        <button type="button" data-theme="graphite">B. Графит</button>
        <button type="button" data-theme="terminal">C. Терминал</button>
        <button type="button" data-theme="sunset">D. Закат</button>
      </nav>
      <p class="variant-desc" id="desc"></p>

      <div class="phones">
        <!-- ================= Главная ================= -->
        <figure class="phone-wrap">
          <figcaption>Главная: что тренируем</figcaption>
          <div class="phone">
            <div class="bg"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
            <div class="screen">
              <header class="topbar">
                <div class="brand"><span class="logo">{ }</span>Frontend Quiz</div>
                <button type="button" class="icon-btn glass" title="Обновить базу">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" /></svg>
                </button>
              </header>

              <h2 class="title">Что тренируем?</h2>
              <p class="subtitle">740 вопросов · база от 12 октября</p>

              <section class="card glass">
                <div class="card-label">Темы</div>
                <div class="chips">
                  <button type="button" class="chip">HTML <span class="count">72</span></button>
                  <button type="button" class="chip">CSS <span class="count">101</span></button>
                  <button type="button" class="chip is-on">JavaScript <span class="count">183</span></button>
                  <button type="button" class="chip is-on">TypeScript <span class="count">124</span></button>
                  <button type="button" class="chip is-on">React <span class="count">111</span></button>
                  <button type="button" class="chip">Сети <span class="count">69</span></button>
                  <button type="button" class="chip">Next.js <span class="count">80</span></button>
                </div>
                <div class="subtopics"><span>Подтемы</span><span><b>все 41</b> ›</span></div>
              </section>

              <section class="card glass">
                <div class="card-label">Уровень</div>
                <div class="segmented" style="--n: 3">
                  <button type="button" class="seg">Junior</button>
                  <button type="button" class="seg is-on">Middle</button>
                  <button type="button" class="seg is-on">Senior</button>
                </div>
              </section>

              <section class="card glass">
                <div class="card-label">Сколько вопросов</div>
                <div class="segmented" style="--n: 4">
                  <button type="button" class="seg">10</button>
                  <button type="button" class="seg is-on">20</button>
                  <button type="button" class="seg">30</button>
                  <button type="button" class="seg">∞</button>
                </div>
              </section>

              <button type="button" class="btn btn-primary">
                Начать · 20 вопросов
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /><path d="m13 6 6 6-6 6" /></svg>
              </button>
              <p class="hint">Под фильтр подходит 214 вопросов</p>

              <div class="tiles">
                <button type="button" class="tile glass">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" /></svg>
                  <span><span class="tile-title">Мои заметки</span><br /><span class="tile-sub">12 заметок</span></span>
                </button>
                <button type="button" class="tile glass">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" /></svg>
                  <span><span class="tile-title">Мои наборы</span><br /><span class="tile-sub">2 набора</span></span>
                </button>
              </div>
            </div>
          </div>
        </figure>

        <!-- ================= Вопрос ================= -->
        <figure class="phone-wrap">
          <figcaption>Вопрос после ответа</figcaption>
          <div class="phone">
            <div class="bg"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
            <div class="screen">
              <div class="qbar">
                <button type="button" class="icon-btn glass" title="Выйти">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18" /></svg>
                </button>
                <div class="qbar-mid">
                  <span class="qcount">7 / 20</span>
                  <div class="progress"><span></span></div>
                </div>
                <button type="button" class="icon-btn glass" title="Заметка">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" /></svg>
                </button>
              </div>

              <div class="meta">
                <span class="pill glass">JavaScript · Event loop</span>
                <span class="level middle">middle</span>
              </div>

              <p class="qtext">Что выведется в консоль?</p>

<pre class="code glass"><code>console<span class="punc">.</span><span class="fn">log</span><span class="punc">(</span><span class="num">1</span><span class="punc">);</span>
<span class="fn">setTimeout</span><span class="punc">(()</span> <span class="kw">=&gt;</span> console<span class="punc">.</span><span class="fn">log</span><span class="punc">(</span><span class="num">2</span><span class="punc">));</span>
<span class="cls">Promise</span><span class="punc">.</span><span class="fn">resolve</span><span class="punc">().</span><span class="fn">then</span><span class="punc">(()</span> <span class="kw">=&gt;</span> console<span class="punc">.</span><span class="fn">log</span><span class="punc">(</span><span class="num">3</span><span class="punc">));</span>
console<span class="punc">.</span><span class="fn">log</span><span class="punc">(</span><span class="num">4</span><span class="punc">);</span></code></pre>

              <div class="options">
                <div class="option glass is-wrong">
                  <div class="option-head"><span class="key">1</span><span class="opt-text">1 4 2 3</span><span class="status">Ваш ответ</span></div>
                  <p class="why">Таймер был запланирован раньше, но очередь микрозадач опустошается до следующей задачи, поэтому промис идёт первым.</p>
                </div>
                <div class="option glass is-dim">
                  <div class="option-head"><span class="key">2</span><span class="opt-text">1 2 3 4</span></div>
                  <p class="why">Это порядок строк в коде, но колбэки таймера и промиса асинхронны и выполняются после синхронного кода.</p>
                </div>
                <div class="option glass is-correct">
                  <div class="option-head"><span class="key">3</span><span class="opt-text">1 4 3 2</span><span class="status">Верно</span></div>
                  <p class="why">Сначала синхронный код (<code>1</code>, <code>4</code>), затем все микрозадачи (<code>3</code>), и только потом следующая задача — колбэк таймера (<code>2</code>).</p>
                </div>
                <div class="option glass is-dim">
                  <div class="option-head"><span class="key">4</span><span class="opt-text">1 3 4 2</span></div>
                  <p class="why">Колбэк <code>then</code> асинхронный, даже если промис уже выполнен: он не запустится посреди синхронного кода.</p>
                </div>
              </div>

              <section class="explain glass">
                <h3>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6" /><path d="M10 22h4" /><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2Z" /></svg>
                  Как это устроено
                </h3>
                <p>
                  Кроме очереди задач есть очередь микрозадач: туда попадают колбэки <code>then</code>/<code>catch</code>/<code>finally</code>,
                  продолжения после <code>await</code> и <code>queueMicrotask</code>. Правило: после каждой задачи (в том числе после основного
                  скрипта) event loop выполняет все микрозадачи, пока очередь не опустеет, и только потом берёт следующую задачу или
                  рисует кадр. Таймеры, события ввода, сообщения <code>postMessage</code> — это задачи. Поэтому любой уже выполненный промис
                  «обгоняет» <code>setTimeout(fn, 0)</code>.
                </p>
                <div class="links">
                  <a href="#">MDN · Microtask guide ↗</a>
                  <a href="#">jakearchibald.com · Tasks, microtasks, queues and schedules ↗</a>
                </div>
              </section>

              <div class="actionbar">
                <button type="button" class="btn btn-secondary glass">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" /></svg>
                  Заметка
                </button>
                <button type="button" class="btn btn-primary">
                  Дальше
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /><path d="m13 6 6 6-6 6" /></svg>
                </button>
              </div>
            </div>
          </div>
        </figure>

        <!-- ================= Итог ================= -->
        <figure class="phone-wrap">
          <figcaption>Итог сессии</figcaption>
          <div class="phone">
            <div class="bg"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
            <div class="screen">
              <header class="topbar">
                <div class="brand"><span class="logo">{ }</span>Frontend Quiz</div>
              </header>

              <h2 class="title">Сессия завершена</h2>

              <section class="score glass">
                <div class="ring-wrap">
                  <div class="ring"></div>
                  <div class="ring-text"><b>14 / 20</b><span>70% верно</span></div>
                </div>
                <div class="score-sub">JavaScript, TypeScript, React · middle и senior</div>
              </section>

              <section class="card glass">
                <div class="card-label">По темам</div>
                <div class="stat"><span>JavaScript</span><div class="bar"><span style="width: 75%"></span></div><span class="val">6/8</span></div>
                <div class="stat"><span>TypeScript</span><div class="bar"><span style="width: 83%"></span></div><span class="val">5/6</span></div>
                <div class="stat"><span>React</span><div class="bar"><span style="width: 50%"></span></div><span class="val">3/6</span></div>
              </section>

              <section class="stack">
                <div class="card-label" style="margin: 4px 0 0">Ошибки · 6</div>
                <div class="mistakes">
                  <div class="mistake glass">
                    <span class="m-meta">JavaScript · Event loop · middle</span>
                    <span class="m-text">Что выведется в консоль?</span>
                    <span class="chev">›</span>
                  </div>
                  <div class="mistake glass">
                    <span class="m-meta">TypeScript · Narrowing · senior</span>
                    <span class="m-text">Какой тип будет у <code>x</code> после проверки <code>in</code>?</span>
                    <span class="chev">›</span>
                  </div>
                  <div class="mistake glass">
                    <span class="m-meta">React · Effects · senior</span>
                    <span class="m-text">В каком порядке выполнятся эффекты и их очистки?</span>
                    <span class="chev">›</span>
                  </div>
                </div>
                <div class="more">и ещё 3</div>
              </section>

              <button type="button" class="btn btn-primary">Прорешать ошибки · 6</button>
              <button type="button" class="btn btn-secondary glass">На главную</button>
            </div>
          </div>
        </figure>
      </div>
    </main>

    <script>
      const DESCRIPTIONS = {
        aurora:
          "Аврора. Глубокий тёмно-синий фон с фиолетовым, бирюзовым и малиновым сиянием, сильно размытое стекло, кнопка с градиентом. Самый «классический» glassmorphism, яркий и праздничный.",
        graphite:
          "Графит. Почти бесцветный: тёплые и холодные серые пятна, плотное матовое стекло, белая кнопка-пилюля. Спокойный, в духе Apple visionOS — ничего не отвлекает от текста и кода.",
        terminal:
          "Терминал. Почти чёрный фон, слабое изумрудное свечение, мелкие скругления, моноширинные заголовки с «> » и «// ». Самый строгий и «программистский», стекла меньше всего.",
        sunset:
          "Закат. Тёплое сияние от оранжевого к розовому, крупные скругления, широкий шрифт заголовков Unbounded. Самый мягкий и «дружелюбный».",
      };

      const link = document.getElementById("theme");
      const desc = document.getElementById("desc");
      const buttons = document.querySelectorAll(".switcher button");

      function apply(theme) {
        if (!DESCRIPTIONS[theme]) theme = "aurora";
        link.href = `theme-${theme}.css`;
        desc.textContent = DESCRIPTIONS[theme];
        buttons.forEach((b) => b.classList.toggle("is-on", b.dataset.theme === theme));
        history.replaceState(null, "", `#${theme}`);
      }

      buttons.forEach((b) => b.addEventListener("click", () => apply(b.dataset.theme)));
      apply(location.hash.slice(1));
    </script>
  </body>
</html>
