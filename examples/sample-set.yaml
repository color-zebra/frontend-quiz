# Пример своего набора для Frontend Quiz. Формат описан в examples/README.md.
title: Пример набора — сложность и Git
questions:
  - id: complexity-001
    topic: Сложность алгоритмов
    level: junior
    question: |
      Какая сложность у поиска по ключу в `Map` в среднем?
    options:
      - text: '`O(1)`'
        correct: true
        why: '`Map` устроен как хэш-таблица: по ключу сразу вычисляется место значения.'
      - text: '`O(log n)`'
        why: 'Такую сложность даёт поиск в сбалансированном дереве или бинарный поиск по отсортированному массиву.'
      - text: '`O(n)`'
        why: 'Так работает перебор массива, а `Map` не перебирает записи, чтобы найти ключ.'
      - text: '`O(n log n)`'
        why: 'Это сложность хорошей сортировки, к поиску одного ключа она отношения не имеет.'
    explanation: |
      `Map` и `Set` хранят данные в хэш-таблице. По ключу вычисляется хэш, и значение находится за константное
      время. Поэтому `map.get(key)` и `set.has(value)` в среднем `O(1)`, а поиск по массиву — `O(n)`.
    links:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Map

  - id: complexity-002
    topic: Сложность алгоритмов
    level: middle
    question: |
      Какие операции над обычным массивом из `n` элементов выполняются за `O(n)`?
    options:
      - text: '`arr.includes(x)`'
        correct: true
        why: 'Ищет значение перебором с начала массива и в худшем случае просматривает все элементы.'
      - text: '`arr.indexOf(x)`'
        correct: true
        why: 'Тот же перебор, только возвращает индекс найденного элемента.'
      - text: '`arr.at(i)`'
        why: 'Доступ по индексу — `O(1)`: элемент не ищется, а берётся по номеру.'
      - text: '`arr.length`'
        why: 'Длина хранится в свойстве и не пересчитывается при чтении.'
      - text: '`new Set(arr).has(x)` для уже созданного `Set`'
        why: 'Проверка в готовом `Set` — `O(1)` в среднем. Дорого только создание `Set` из массива.'
    explanation: |
      Массив хорош для доступа по индексу, но поиск значения в нём — перебор. Если нужно часто проверять
      «есть ли элемент», выгоднее один раз построить `Set` за `O(n)` и дальше проверять за `O(1)`.

  - id: git-001
    topic: Git
    level: junior
    question: |
      Какая команда покажет построчные изменения, которые ещё не добавлены в индекс?
    options:
      - text: '`git diff`'
        correct: true
        why: 'Без аргументов сравнивает рабочие файлы с индексом — это и есть изменения, ещё не добавленные через `git add`.'
      - text: '`git diff --staged`'
        why: 'Показывает обратное: то, что уже добавлено в индекс и попадёт в следующий коммит.'
      - text: '`git status`'
        why: 'Показывает список изменённых файлов, но не сами строки.'
      - text: '`git log -p`'
        why: 'Показывает изменения уже сделанных коммитов, а не текущую работу.'
    explanation: |
      У Git три места: рабочие файлы, индекс (что войдёт в коммит) и история. `git diff` сравнивает рабочие
      файлы с индексом, `git diff --staged` — индекс с последним коммитом.
    links:
      - https://git-scm.com/docs/git-diff

  - id: git-002
    topic: Git
    level: middle
    multiple: true
    question: |
      Какие команды отменяют изменения коммита новым коммитом, не переписывая существующую историю?
    options:
      - text: '`git revert <коммит>`'
        correct: true
        why: 'Создаёт новый коммит с обратными изменениями. Старые коммиты остаются как были, поэтому так безопасно отменять уже отправленное.'
      - text: '`git commit --amend`'
        why: 'Заменяет последний коммит новым — это переписывание истории.'
      - text: '`git rebase -i`'
        why: 'Пересоздаёт коммиты заново, у них меняются хэши.'
      - text: '`git reset --soft HEAD~1`'
        why: 'Нового коммита не создаёт: только переносит ветку на коммит назад.'
    explanation: |
      Отправленную историю переписывать опасно: у коллег останутся старые коммиты. `git revert` решает задачу
      без переписывания — добавляет коммит, который отменяет изменения выбранного. В этом вопросе правильный
      ответ один, а галочки включены полем `multiple: true`, чтобы вид вопроса не подсказывал число ответов.

  - id: git-003
    topic: Git
    level: senior
    question: |
      Что произойдёт после `git reset --soft HEAD~1`?
    options:
      - text: 'Ветка будет указывать на предыдущий коммит'
        correct: true
        why: 'Любой `reset` переносит текущую ветку; `HEAD~1` — родитель последнего коммита.'
      - text: 'Изменения отменённого коммита окажутся в индексе'
        correct: true
        why: 'С `--soft` индекс и рабочие файлы не трогаются, поэтому изменения готовы к новому коммиту.'
      - text: 'Рабочие файлы откатятся к предыдущему коммиту'
        why: 'Так работает `--hard`. С `--soft` файлы остаются как были.'
      - text: 'Отменённый коммит сразу удалится из репозитория'
        why: 'Коммит остаётся в базе и доступен через `git reflog`, пока его не уберёт сборка мусора.'
    explanation: |
      `reset` двигает ветку, а флаг решает, что ещё откатить: `--soft` — ничего, `--mixed` (по умолчанию) —
      индекс, `--hard` — индекс и рабочие файлы. `--soft HEAD~1` — способ «разобрать» последний коммит и собрать
      его заново.
    links:
      - https://git-scm.com/docs/git-reset

  - id: complexity-003
    topic: Сложность алгоритмов
    level: senior
    question: |
      Какая сложность у `arr.sort()` в V8?
    options:
      - text: '`O(n log n)`'
        correct: true
        why: 'V8 сортирует алгоритмом TimSort: в худшем случае `O(n log n)`, на почти отсортированных данных быстрее.'
      - text: '`O(n²)`'
        why: 'Так работает сортировка вставками или пузырьком на больших массивах, V8 их для этого не использует.'
      - text: '`O(n)`'
        why: 'Столько TimSort тратит только на уже отсортированный массив, но в общем случае — больше.'
      - text: '`O(log n)`'
        why: 'Даже прочитать каждый элемент один раз — уже `O(n)`, так что сортировка быстрее быть не может.'
    explanation: |
      С 2018 года (V8 7.0) `Array.prototype.sort` использует TimSort — гибрид сортировки слиянием и вставками.
      Он стабилен (равные элементы сохраняют порядок) и быстро обрабатывает уже частично упорядоченные данные.
    links:
      - https://v8.dev/blog/array-sort
