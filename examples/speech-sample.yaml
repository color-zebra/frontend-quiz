# Пример устного набора для Zubrilka: kind: speech делает весь файл устным. Формат — в examples/README.md.
title: Пример устного набора — JavaScript и React
kind: speech
questions:
  - id: speech-js-001
    topic: JavaScript
    level: junior
    question: |
      Чем `let` и `const` отличаются от `var`?
    answer: |
      `var` виден во всей функции, а `let` и `const` — только внутри блока `{}`, где объявлены. Объявление `var`
      поднимается вместе со значением `undefined`, поэтому к переменной можно обратиться до строки объявления.
      `let` и `const` тоже поднимаются, но до объявления находятся во «временной мёртвой зоне» — обращение к ним
      бросает `ReferenceError`. `const` нельзя переприсвоить, но объект в ней менять можно. Ещё `var` на верхнем
      уровне скрипта создаёт свойство глобального объекта, а `let` и `const` — нет.
    points:
      - Область видимости — функция у `var`, блок у `let`/`const`
      - Временная мёртвая зона у `let`/`const`
      - '`const` запрещает переприсваивание, а не изменение объекта'
      - '`var` на верхнем уровне становится свойством `window`'

  - id: speech-js-002
    topic: JavaScript
    level: middle
    question: |
      Расскажи, как работает event loop в браузере.
    answer: |
      JavaScript выполняет код в одном потоке, через стек вызовов. Асинхронные операции (таймеры, сеть, события)
      выполняет окружение, а готовые колбэки ставит в очередь задач. Когда стек пуст, event loop берёт одну задачу
      и выполняет её. После каждой задачи выполняются все микрозадачи — колбэки промисов, продолжения после
      `await`, `queueMicrotask` — пока их очередь не опустеет. Затем браузер может отрисовать кадр, и цикл
      повторяется. Поэтому выполненный промис «обгоняет» `setTimeout(fn, 0)`, а долгая синхронная работа
      замораживает страницу.
    points:
      - Один поток и стек вызовов
      - Очередь задач (macrotask) и очередь микрозадач
      - Микрозадачи выполняются все разом после каждой задачи
      - Отрисовка между задачами — долгая задача блокирует интерфейс

  - id: speech-js-003
    topic: JavaScript
    level: middle
    question: |
      Что такое замыкание и где оно встречается на практике?
    answer: |
      Замыкание — это функция вместе с лексическим окружением, в котором она была создана: функция помнит
      переменные внешней области видимости и после того, как внешняя функция завершилась. На практике это
      колбэки и обработчики событий, которые используют переменные компонента, фабрики функций, приватные данные
      модуля, `debounce` и `throttle`, мемоизация. Типичная ловушка — замыкание на устаревшее значение, например
      «старое» состояние в колбэке React.
    points:
      - Функция + её лексическое окружение
      - Переменные живут, пока на них ссылается функция
      - Примеры — обработчики, фабрики, приватные данные, debounce
      - Ловушка — устаревшее значение в замыкании

  - id: speech-react-001
    topic: React
    level: middle
    question: |
      Зачем элементам списка нужен `key` и почему плохо использовать индекс?
    answer: |
      По `key` React сопоставляет элементы между рендерами: понимает, какой элемент новый, какой удалён, а какой
      переехал, и сохраняет у переехавшего его состояние и DOM-узел. Индекс как ключ ломается, когда порядок
      меняется — при вставке в начало, удалении или сортировке: ключи «переезжают» к другим данным, и состояние
      (например, введённый текст в поле) остаётся не у того элемента. Индекс допустим только для статичного
      списка, который не меняет порядок. Лучший ключ — стабильный id из данных.
    points:
      - Ключ сопоставляет элементы между рендерами
      - Состояние и DOM привязаны к ключу
      - Индекс ломается при вставке, удалении, сортировке
      - Ключ — стабильный id из данных

  - id: speech-react-002
    topic: React
    level: senior
    question: |
      Когда в React нужен `useEffect`, а когда без него можно и нужно обойтись?
    answer: |
      Эффект нужен для синхронизации с внешней системой: подписки, таймеры, сетевые запросы, работа с DOM-API или
      сторонней библиотекой, — то есть с тем, что живёт вне React. Без эффекта нужно обходиться, когда значение
      можно вычислить из пропсов и состояния прямо при рендере, и когда реакция относится к действию
      пользователя — её место в обработчике события. Типичные ошибки — «синхронизировать» одно состояние с другим
      через эффект и сбрасывать состояние в эффекте вместо `key`. Каждый эффект с подпиской должен возвращать
      очистку.
    points:
      - Эффект — для синхронизации с внешними системами
      - Производные данные считаются при рендере
      - Реакция на действие пользователя — в обработчике
      - Очистка у эффектов с подписками

  - id: speech-net-001
    topic: Сети
    level: middle
    question: |
      Что такое CORS и почему запрос с фронтенда «падает с CORS», хотя в Postman работает?
    answer: |
      CORS — механизм, которым сервер разрешает страницам с других источников (схема, домен, порт) читать свои
      ответы. Ограничение накладывает браузер, а не сервер: запрос часто доходит до сервера, но браузер не отдаёт
      ответ скрипту, если в нём нет подходящего `Access-Control-Allow-Origin`. Для «непростых» запросов (свои
      заголовки, метод `PUT`, JSON) браузер сначала отправляет preflight `OPTIONS`. Postman — не браузер и
      политику одного источника не соблюдает, поэтому там всё работает. Лечится настройкой заголовков на сервере
      или прокси на своём домене.
    points:
      - Ограничение браузера, а не сервера
      - Сервер разрешает чтение заголовком Access-Control-Allow-Origin
      - Preflight OPTIONS для непростых запросов
      - Postman не соблюдает политику одного источника
