# Пример набора с уроками для режима обучения Zubrilka. Формат — в README.md рядом, раздел «Уроки».
# Это образец формата, а не учебный курс: два коротких урока и по два вопроса к каждому.
title: HTTP-кэш — пример с уроками
lessons:
  - id: cache-max-age
    topic: HTTP-кэш
    subtopic: Срок свежести # вопросы урока — тестовые вопросы этой темы и подтемы, в порядке файла
    title: Как включить кэш
    body: |
      ## Какую проблему решаем

      Каждый раз, когда человек открывает сайт, браузер скачивает стили, скрипты и картинки. На мобильной сети
      это секунды ожидания и чужие мегабайты. Почти все эти файлы между визитами не меняются — скачивать их
      заново незачем.

      ## Что такое HTTP-кэш

      **HTTP-кэш** (HTTP cache) — это копии ответов сервера, которые браузер хранит у себя и показывает вместо
      нового запроса. Какие ответы можно хранить и сколько, решает сервер: он пишет это в заголовке ответа
      `Cache-Control`.

      Директива `max-age=N` говорит: ответ **свежий** (fresh) N секунд. Пока копия свежая, браузер берёт её из
      кэша и к серверу вообще не обращается. Когда срок вышел, копия становится **устаревшей** (stale): браузер
      её не выбрасывает, а спрашивает сервер, годится ли она, — об этом следующий урок.

      ![Схема: свежая копия из кэша, запроса к серверу нет](images/lessons-sample-cache.png "Пока копия свежая, сервер не нужен")

      ## Пример целиком

      Сборка кладёт стили в файл `app.3f9a1c.css`: в имени — хэш содержимого. Сервер отдаёт его так:

      ```http
      HTTP/1.1 200 OK
      Content-Type: text/css
      Cache-Control: max-age=31536000
      ```

      31 536 000 секунд — это год. Поправили стили — у файла новое содержимое, значит, новый хэш и новое имя
      `app.8b20e4.css`. Страница ссылается уже на новое имя, а для браузера это новый адрес: старая копия ему
      просто не нужна. Так файл кэшируется надолго, а исправление доходит до людей сразу.

      ## Какой срок выбрать

      | Что за файл | Срок | Почему |
      |---|---|---|
      | Стили и скрипты с хэшем в имени | `max-age=31536000` | Новая версия — новое имя, старую копию никто не попросит |
      | Картинка без хэша в имени | `max-age=86400` | День: замену увидят не сразу, но назавтра |
      | HTML-страница | короткий срок или `no-cache` | В ней ссылки на новые файлы — она должна обновляться первой |

      > Отозвать уже выданную свежую копию нельзя: пока срок не вышел, браузер к серверу не обращается и не узнает
      > об исправлении. Поэтому длинный срок — только для файлов, имя которых меняется вместе с содержимым.

      ## Типичная ошибка

      Поставить год на файл без хэша в имени, например `styles.css`. Исправление выложено, а люди, которые уже
      были на сайте, видят старые стили, пока у них не истечёт год или они сами не очистят кэш.

      ## Как спрашивают на интервью

      - Как сделать, чтобы стили кэшировались надолго, но исправления доходили сразу?

      ## Источники

      - [Кэширование HTTP — MDN](https://developer.mozilla.org/ru/docs/Web/HTTP/Caching)
      - [Cache-Control — MDN](https://developer.mozilla.org/ru/docs/Web/HTTP/Headers/Cache-Control)

  - id: cache-no-cache
    topic: HTTP-кэш
    title: no-cache и no-store
    questions: [cache-004, cache-005, cache-006] # явный список: именно эти вопросы и в этом порядке
    body: |
      ## Какую проблему решаем

      HTML-страницу хочется показывать всегда свежей: в ней ссылки на новые файлы. Но скачивать её целиком при
      каждом открытии жалко, если она не менялась. А выписку из интернет-банка вообще нельзя оставлять на
      устройстве: телефоном может воспользоваться кто-то другой.

      ## no-cache: хранить, но каждый раз спрашивать

      Вопреки названию, `no-cache` **разрешает** хранить копию. Запрещает он другое: показывать её без проверки.
      Перед каждым использованием браузер отправляет серверу **условный запрос** (conditional request) — «вот
      метка моей копии, она ещё годится?». Метку сервер выдал вместе с ответом в заголовке `ETag`.

      ```http
      GET /index.html HTTP/1.1
      If-None-Match: "v42"

      HTTP/1.1 304 Not Modified
      ETag: "v42"
      ```

      Ответ `304 Not Modified` приходит без тела: страница не изменилась, браузер показывает свою копию. Запрос
      всё равно есть, но вместо всей страницы по сети идут несколько сотен байт заголовков. Если страница
      изменилась, сервер отвечает обычным `200` с новой версией.

      То же самое происходит с устаревшей копией после `max-age` из прошлого урока. Близкий случай — `max-age=0`:
      копия сохраняется, но сразу считается устаревшей.

      ## no-store: не хранить вовсе

      `no-store` запрещает сохранять ответ: ни в кэше браузера, ни в промежуточных кэшах по дороге. Каждый раз —
      полная загрузка, зато после ухода с сайта копии на устройстве не остаётся.

      | Директива | Копия хранится | Сервер спрашивают | Подходит для |
      |---|---|---|---|
      | `max-age=N` | да | только после срока | файлов с хэшем в имени |
      | `no-cache` | да | каждый раз | HTML-страниц |
      | `no-store` | нет | каждый раз, целиком | личных данных |

      ## Типичная ошибка

      Поставить `no-cache` на личные данные, думая, что он запрещает кэш. Копия при этом остаётся на устройстве.
      Для «не оставлять следов» нужен `no-store`.

      ## Источники

      - [Cache-Control — MDN](https://developer.mozilla.org/ru/docs/Web/HTTP/Headers/Cache-Control)
      - [RFC 9111, директива no-cache](https://www.rfc-editor.org/rfc/rfc9111#section-5.2.2.4)

questions:
  - id: cache-001
    topic: HTTP-кэш
    subtopic: Срок свежести
    level: junior
    question: |
      Файл пришёл с заголовком `Cache-Control: max-age=600`. Через 5 минут страница снова просит этот файл.
      Что сделает браузер?
    options:
      - text: 'Возьмёт копию из кэша и к серверу не обратится'
        correct: true
        why: '600 секунд — это 10 минут. Через 5 минут копия ещё свежая, а свежую копию браузер показывает без запроса.'
      - text: 'Спросит сервер, годится ли копия, и покажет её после ответа'
        why: 'Так браузер поступает с устаревшей копией или с ответом no-cache. Здесь срок свежести не вышел.'
      - text: 'Скачает файл с сервера заново целиком'
        why: 'Так было бы без кэша или с no-store. max-age разрешает хранить копию и пользоваться ею.'
      - text: 'Удалит копию и скачает файл, потому что срок истёк'
        why: 'Срок не истёк: прошло 5 минут из 10. А устаревшую копию браузер не удаляет, а проверяет у сервера.'
    explanation: |
      `max-age=N` задаёт срок свежести ответа в секундах. Пока он не вышел, браузер берёт копию из кэша и запрос
      не отправляет — отсюда и экономия. Когда срок выйдет, копия станет устаревшей и браузер спросит сервер.
    links:
      - https://developer.mozilla.org/ru/docs/Web/HTTP/Headers/Cache-Control

  - id: cache-002
    topic: HTTP-кэш
    subtopic: Срок свежести
    level: middle
    question: |
      Стили лежат в файле `styles.css`, сервер отдаёт его с `Cache-Control: max-age=31536000`. Вы выложили
      исправление стилей под тем же именем. Что увидит человек, который открывал сайт вчера?
    options:
      - text: 'Старые стили — пока не выйдет год или он не очистит кэш'
        correct: true
        why: 'Копия свежая ещё почти год, и до конца срока браузер к серверу за этим файлом не пойдёт.'
      - text: 'Новые стили: сервер сам сообщит браузеру об исправлении'
        why: 'Сервер не может разослать браузерам «копия устарела». Пока копия свежая, запроса нет — и узнать не от кого.'
      - text: 'Новые стили через 10 минут, когда браузер проверит файл'
        why: 'Срок свежести здесь — год, а не 10 минут. Проверки до его конца не будет.'
      - text: 'Страницу без стилей: старая копия станет недействительной'
        why: 'Копия цела и считается свежей — браузер просто покажет старую версию стилей.'
    explanation: |
      Длинный `max-age` безопасен, только если имя файла меняется вместе с содержимым — например, хэш в имени
      `app.3f9a1c.css`. Тогда исправленный файл получает новый адрес, и старая копия никому не нужна. У файла
      с постоянным именем исправление застревает в кэше до конца срока.
    links:
      - https://developer.mozilla.org/ru/docs/Web/HTTP/Caching

  - id: cache-003
    topic: HTTP-кэш
    subtopic: Срок свежести
    level: senior
    question: |
      `index.html` отдаётся с `max-age=86400`, стили — с хэшем в имени и `max-age=31536000`. Вышла новая версия
      сайта: стили теперь в `app.8b20e4.css`, и новый HTML ссылается на них. Человек открывал сайт час назад и
      сейчас снова открывает его по закладке, без перезагрузки. Что он увидит?
    options:
      - text: 'Старую страницу со старыми стилями'
        correct: true
        why: 'Копия HTML свежая ещё 23 часа и берётся из кэша, а она ссылается на старый файл стилей — он тоже в кэше.'
      - text: 'Новую страницу со старыми стилями'
        why: 'Новый HTML ссылался бы на app.8b20e4.css, которого в кэше нет, — стили были бы новые. Но и HTML здесь старый.'
      - text: 'Новую страницу с новыми стилями'
        why: 'Хэш в имени помогает, только когда браузер получил новый HTML. Здесь HTML кэширован на сутки.'
      - text: 'Старую страницу с новыми стилями'
        why: 'Старый HTML ссылается на старое имя файла стилей, а его свежая копия лежит в кэше.'
    explanation: |
      Хэш в имени файла работает в паре с HTML, который обновляется первым. Если сам HTML кэширован надолго,
      человек получает старую страницу, а с ней и старые ссылки на стили и скрипты. Поэтому HTML отдают с коротким
      сроком или с `no-cache`.
    links:
      - https://developer.mozilla.org/ru/docs/Web/HTTP/Caching

  - id: cache-004
    topic: HTTP-кэш
    subtopic: Проверка у сервера
    level: junior
    question: Какая директива разрешает хранить копию, но требует спрашивать сервер перед каждым её использованием?
    options:
      - text: '`no-cache`'
        correct: true
        why: 'Копию хранить можно, но показывать — только после проверки: условный запрос и ответ 304 или новая версия.'
      - text: '`no-store`'
        why: 'no-store запрещает хранить копию вообще — проверять нечего.'
      - text: '`max-age=3600`'
        why: 'Час копия свежая, и всё это время браузер берёт её без запроса к серверу.'
      - text: '`max-age=31536000`'
        why: 'Год копия свежая и берётся без запроса — проверки перед каждым использованием нет.'
    explanation: |
      Название `no-cache` обманчиво: кэшировать можно, нельзя использовать копию без проверки. Проверка дешёвая —
      если ничего не изменилось, сервер отвечает `304 Not Modified` без тела.
    links:
      - https://www.rfc-editor.org/rfc/rfc9111#section-5.2.2.4

  - id: cache-005
    topic: HTTP-кэш
    subtopic: Проверка у сервера
    level: middle
    question: |
      Интернет-банк показывает выписку по счёту. Требование безопасности: после выхода из аккаунта копии
      выписки на устройстве оставаться не должно. Какой заголовок нужен ответу с выпиской?
    options:
      - text: '`Cache-Control: no-store`'
        correct: true
        why: 'no-store запрещает сохранять ответ, поэтому после ухода с сайта копии на устройстве не будет.'
      - text: '`Cache-Control: no-cache`'
        why: 'no-cache сохраняет копию на устройстве и лишь проверяет её перед показом — требование нарушено.'
      - text: '`Cache-Control: max-age=60`'
        why: 'Копия хранится и даже минуту показывается без запроса — она останется на устройстве.'
      - text: '`Cache-Control: max-age=0`'
        why: 'Копия сохраняется, просто сразу считается устаревшей. Хранить её требование как раз запрещает.'
    explanation: |
      Для данных, которые не должны оставаться на устройстве, нужен `no-store`. `no-cache` и `max-age=0` про
      свежесть, а не про хранение: копия у них остаётся.
    links:
      - https://developer.mozilla.org/ru/docs/Web/HTTP/Headers/Cache-Control

  - id: cache-006
    topic: HTTP-кэш
    subtopic: Проверка у сервера
    level: senior
    question: |
      `index.html` весит 120 КБ и отдаётся с `Cache-Control: no-cache` и заголовком `ETag`. Утром страница уже
      попала в кэш, за день она не менялась, а человек открыл её ещё 10 раз. Сколько данных ушло на эти 10 открытий?
    options:
      - text: 'Десять ответов 304 — всего несколько КБ'
        correct: true
        why: 'no-cache проверяет копию каждый раз, но страница не менялась: сервер отвечает 304 без тела.'
      - text: 'Десять полных загрузок — около 1,2 МБ'
        why: 'Так было бы с no-store: копии нет, и страница каждый раз скачивается целиком.'
      - text: 'Ни одного запроса — копия бралась из кэша'
        why: 'Так работает свежая копия с max-age. no-cache без проверки у сервера копию не показывает.'
      - text: 'Одна загрузка 120 КБ, дальше без запросов'
        why: 'Утренняя загрузка уже была до этих 10 открытий, а без запросов no-cache не обходится.'
    explanation: |
      `no-cache` не экономит запросы, но экономит трафик: на каждый показ уходит условный запрос, а тело страницы
      приходит, только когда она изменилась. Для HTML это обычно лучший выбор: свежесть гарантирована, а лишних
      мегабайт нет.
    links:
      - https://www.rfc-editor.org/rfc/rfc9111#section-5.2.2.4
